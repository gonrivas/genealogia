%20pie%20y%20celebracion%20canonica.png", "t": "Pie y celebracion canonica"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20testigos.png", "t": "Testigos"}]}], "nActas": 2, "nImgs": 4, "titulo": "El niño del torno", "parrafos": ["El 3 de mayo de 1825, a las trece horas, apareció en el torno del hospicio de Cosenza un niño envuelto en un paño blanco y «senza alcun segno al di lui corpo» — sin ninguna señal en su cuerpo. Dos horas después, a las tres de la tarde, Emiddio Carli, sirviente del hospicio, de cuarenta y un años, domiciliado en la contrada del Ospedale, lo llevó ante el alcalde Francesco Barone Ferreri y se lo presentó. El capellán don Gaetano Barra ya lo había bautizado esa misma mañana.", "Lo de la señal no es una fórmula de trámite. Lo corriente era dejar al expósito con una prenda partida en dos, media moneda o una cinta, y guardarse la otra mitad para poder reclamarlo algún día. Que no llevara nada encima significa que nadie pensaba volver a por él. En el acta, el apartado de los testigos quedó en blanco, y la columna reservada a que la parroquia notificara el bautismo, también.", "El nombre se lo puso el sirviente, no el cura ni el alcalde: el formulario dice «lo stesso ha inoltre dichiarato di dare al bambino il nome di Michele Salerno di Rende», y «el mismo» es Emiddio Carli. A los expósitos se les inventaba un apellido y a menudo se echaba mano de un topónimo. Aquel «di Rende» pegado al nombre acabó leyéndose como lugar de nacimiento: en 1858, para casarse, el alcalde de Castelfranco lo certificó como «esposito nativo di Rende». Michele no podía saber dónde había nacido.", "Tuvo tres identidades documentales y ningún apellido propio: Salerno, el que le impusieron aquel día; Esposito, que era su condición y le acompañó siempre; y De Rango en Castrolibero, seguramente por la casa que lo crió — sus tres hijos se inscriben allí como De Rango. Era jornalero y analfabeto, y nunca supo su edad: declaró cuarenta y dos años en 1868, cuarenta y ocho en 1870 y cuarenta en 1873. Se casó a los treinta y tres con Maria Antonia Palermo, y seguía vivo el 5 de noviembre de 1910, con ochenta y cinco años: el acta de la segunda boda de su hijo Domenico lo nombra sin el «fu» con que ese mismo escribano marca, en la misma página, a los padres muertos de la novia. Su defunción no se ha localizado, y como los fondos de Rende digitalizados acaban justo en 1910, probablemente haya que ir al ayuntamiento a buscarla."], "claves": [["Cómo entra en los papeles", "hallado en el torno del hospicio de Cosenza, 3 de mayo de 1825, 13 h"], ["Señales encima", "ninguna"], ["Apellidos que usó", "Salerno, Esposito y De Rango"], ["Oficio", "bracciale, jornalero sin tierra"], ["Vivo aún en", "noviembre de 1910, con 85 años"]]}, "maria_antonia": {"id": "maria_antonia", "nombre": "Maria Antonia Palermo", "legal": "", "rol": "directa", "rolNombre": "Línea directa", "gen": 6, "ramas": ["salerno"], "resumen": "Nacida en Marano Marchesato en marzo de 1839. Se casó a los 19 años con un hombre catorce años mayor. Campesina, y en 1873 hilandera.", "datos": [["Nacimiento", "marzo de 1839, Marano Marchesato — acta 18"], ["Padres", "Francesco Giacomo Palermo y Carmina Volpintesta"], ["Hermanos", "Antonio (1841), Annunciata (1845) y Teresa (1852), los tres de Marano Marchesato"], ["Matrimonio", "22 de agosto de 1858, Rende — acta 19, con 19 años"], ["Cónyuge", "Michele Salerno"], ["Oficio", "contadina; filatrice (hilandera) en 1873"], ["Viva aún en", "5 de noviembre de 1910 — figura sin «fu» y residente en Rende en la boda de su hijo Domenico, con 71 años"], ["Defunción", "sin localizar — posterior a noviembre de 1910"]], "vida": "1839–1910", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": "michele", "hijos": ["domenico", "arcangela", "francesco", "giovanni"], "hermanos": ["antonio_palermo", "annunciata_palermo", "teresa_palermo"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "marzo de 1839, 16 h", "lugar": "Marano Marchesato", "ref": "acta 18", "fuente": [["Hallada en", "Rende, Reg. 50 «Matrimoni, processetti» 1858, pág. 210 de 569"], ["Registro", "an_ua35977232 · hash LyxMQVl"], ["Oficial", "Giuseppe Filippelli, sindaco"]], "literal": "…il nome di Maria Antonia.", "traduccion": "Ante Giuseppe Filippelli, alcalde y Oficial del Estado Civil, comparece Giacomo Palermo, de veintisiete años, quien declara que de Carmina Volpentesta, su legítima esposa, ha nacido una niña, a la que impone el nombre de MARIA ANTONIA.", "notas": ["El índice del blog transcribe esta misma acta 18 de 1839 como «Maria Francesca Palermo». El acta original dice Maria Antonia. Por ese error su nacimiento pareció no existir durante años.", "Como efecto secundario desaparece una hermana que nunca existió: la «Maria Francesca de 1839» y Maria Antonia son la misma persona."], "imgs": [{"u": "actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20Maria%20Antonia%20Palermo%20-%20acta%2018.jpg", "t": "Maria Antonia Palermo - acta 18"}], "zooms": [{"u": "actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20zoom%20-%20cabecera%20del%20acta.jpg", "t": "Cabecera del acta"}, {"u": "actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20zoom%20-%20nombre%20impuesto.jpg", "t": "Nombre impuesto"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "22 de agosto de 1858, 14 h", "lugar": "Rende", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Rende > Registro 50"], ["Registro", "an_ua35977235"], ["Página", "20 de 51"]], "literal": "acta 19 | Michele Esposito Salerno | N/A\nacta 19 | Maria Antonia Palermo    | Palermo, Francesco Giacomo  Volpintesta, Carmina", "traduccion": "Matrimonio celebrado ante Luigi Perugini, alcalde de Rende. El novio figura como «Michele Esposito Salerno», de 33 años, con la casilla de padres en blanco por su condición de expósito. La novia, Maria Antonia Palermo, de 19 años, hija de Francesco Giacomo Palermo y de Carmina Volpintesta. En el expediente se conservan las partidas de nacimiento de ambos y el certificado del alcalde de Castelfranco.", "notas": ["Ese mismo año se casaron en Rende DOS hombres llamados Michele Salerno. El otro es el acta 3: Michele Salerno, hijo de Gaetano Salerno e Isabella Iorio, con Rosa Cundari. Cualquier buscador que cruce «Michele Salerno + Rende + 1858» devuelve al que no es.", "Aceptar al homónimo le pondría padres a un hombre que documentalmente no los tiene, y desviaría la rama entera."], "imgs": [{"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20Michele%20y%20Maria%20Antonia%20-%20Rende%20acta%2019%20-%20doble%20pagina.png", "t": "Michele y Maria Antonia - Rende acta 19 - doble pagina"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20processetti%20-%20transcripcion%20del%20acta%2019.jpg", "t": "Processetti - transcripcion del acta 19"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20registro%20de%20matrimonios%20-%20pagina.jpg", "t": "Registro de matrimonios - pagina"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20visor%20completo.png", "t": "Visor completo"}], "zooms": [{"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20datos%20de%20los%20novios.png", "t": "Datos de los novios"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20b.png", "t": "Documentos presentados b"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20c.png", "t": "Documentos presentados c"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados.png", "t": "Documentos presentados"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20pie%20y%20celebracion%20canonica.png", "t": "Pie y celebracion canonica"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20testigos.png", "t": "Testigos"}]}], "nActas": 1, "nImgs": 3, "titulo": "El índice le cambió el nombre", "parrafos": ["Nació en Marano Marchesato en marzo de 1839. Su acta la levantó el sindaco Giuseppe Filippelli a las cuatro de la tarde, con la comparecencia de su padre, Giacomo Palermo, que declaró veintisiete años, y el nombre impuesto quedó escrito como «Maria Antonia».", "El índice del que partió esta investigación transcribe esa misma acta 18 de 1839 como «Maria Francesca Palermo». Es un error del índice, y de los caros: buscando a una Maria Francesca no se encuentra a nadie. La regla que salió de aquí vale para todo lo demás: si el número de acta, el año y los padres cuadran y sólo falla el nombre, manda el acta original.", "Se casó el 22 de agosto de 1858, a las dos de la tarde, en la casa comunal de Rende, con diecinueve años; él tenía treinta y tres, catorce más que ella. Los publicaron en Castrolibero, donde vivía él, y los casó el alcalde de Rende, Luigi Perugini — el mismo funcionario que nueve años después firmaría el acta de defunción de su padre.", "En las actas de sus hijos consta como contadina, campesina, y en 1873 como filatrice, hilandera. La llaman casi siempre «Palermo Maria», sin el Antonia: el nombre completo sólo aparece en su propio nacimiento. Seguía viva en noviembre de 1910, con setenta y un años, cuando se casó su hijo mayor."], "claves": [["Nacimiento", "marzo de 1839, Marano Marchesato, acta 18"], ["El índice la llama", "Maria Francesca — el acta dice Maria Antonia"], ["Casada a los", "19 años, con un hombre catorce años mayor"], ["Oficio", "contadina; filatrice, hilandera, en 1873"], ["Viva aún en", "noviembre de 1910, con 71 años"]]}, "antonio_palermo": {"id": "antonio_palermo", "nombre": "Antonio Palermo", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 6, "ramas": ["salerno"], "resumen": "Hermano de Maria Antonia. Nacido en Marano Marchesato el 10 de octubre de 1841, en la contrada Palazzo, cuando su padre era pastor.", "datos": [["Nacimiento", "10 de octubre de 1841, 10 h, Marano Marchesato — acta 67"], ["Lugar", "contrada Palazzo"], ["Padres", "Giacomo Palermo, pastore, 36 años, y Carmina Volpentesta, 30 años"], ["Bautismo", "el mismo día 10 de octubre, parroquia de Marano"], ["Después de 1841", "no se sabe nada de él"]], "vida": "n.1841", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "annunciata_palermo", "teresa_palermo"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "10 de octubre de 1841, 16 h (el acta); nacido a las 10 h", "lugar": "Marano Marchesato", "ref": "acta 67", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 33 «Nati» 1841"], ["Registro", "an_ua35968838 · hash wQ99VDb"], ["Página", "35 de 50"], ["Oficial", "Francesco Spizzirri, sindaco"], ["Año manuscrito", "«mille ottocento quarantuno» — coincide con el catálogo"]], "literal": "…è comparso il Signor Giacomo Palermo di anni trentasei di professione pastore domiciliato in Marano contrada Palazzo… da Carmina Volpentesta di anni trenta domiciliata con esso… il nome di Antonio.", "traduccion": "El año mil ochocientos cuarenta y uno, el día diez del mes de octubre, a las dieciséis horas, ante Nos, FRANCESCO SPIZZIRRI, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, ha comparecido el señor GIACOMO PALERMO, DE TREINTA Y SEIS AÑOS, de profesión PASTORE, domiciliado en Marano, CONTRADA PALAZZO.\n\nY nos ha presentado un niño, según hemos reconocido con nuestros propios ojos, y nos ha declarado que el mismo ha nacido de CARMINA VOLPENTESTA, de treinta años, domiciliada con él, el día diez del mes arriba dicho del año corriente, a las diez de la mañana, en la casa de su habitación.\n\nEl mismo ha declarado además dar al niño el nombre de ANTONIO.\n\nLa presentación y declaración se ha hecho en presencia de BRUNO PARRO, de treinta años, jornalero, domiciliado en Marano, contrada Palazzo, y de DOMENICO BELMONTE, de cuarenta años, jornalero, domiciliado en Marano, contrada Palazzo, testigos.\n\n[En la columna de la derecha] El párroco de la iglesia de Marano nos ha devuelto la notificación indicando que el Sacramento del bautismo ha sido administrado a dicho niño, llamado ANTONIO PALERMO, el día diez del mes indicado.", "notas": ["Es la única de las cinco actas de este hombre en la que declara ser PASTORE. En 1845 y 1852 dirá «bracciale», y al morir en 1867 el acta lo llama «pecoraio». Empieza y termina de pastor.", "Treinta y seis años en octubre de 1841 lo sitúan hacia 1805. Es la cifra más antigua de las cinco que se le conocen.", "Nació y se inscribió el mismo día, y lo bautizaron también el mismo día. Era lo normal: la mortalidad infantil no dejaba esperar.", "El apellido del primer testigo es de lectura dudosa: «Bruno Parro» o «Bruno Perri»."], "imgs": [{"u": "actas/1841%20-%20Antonio%20Palermo/1841-10-10%20N%20Antonio%20Palermo%20-%20Marano%20Marchesato%20acta%2067.jpg", "t": "Antonio Palermo - Marano Marchesato acta 67"}], "zooms": [{"u": "actas/1841%20-%20Antonio%20Palermo/1841-10-10%20N%20zoom%20-%20acta%2067%2C%20padre%20Giacomo%20Palermo%20pastore%20y%20madre%20Carmina%20Volpentesta.jpg", "t": "Acta 67, padre Giacomo Palermo pastore y madre Carmina Volpentesta"}]}], "nActas": 1, "nImgs": 2, "titulo": "Bautizado el mismo día", "parrafos": ["Nació el 10 de octubre de 1841 a las diez de la mañana, en la casa de sus padres, en la contrada Palazzo de Marano Marchesato. Esa misma tarde, a las cuatro, su padre lo llevó ante Francesco Spizzirri, sindaco y oficial del estado civil. Giacomo Palermo declaró treinta y seis años y oficio de pastor.", "La columna derecha del acta certifica que el párroco de Marano lo bautizó ese mismo día 10. Los testigos fueron dos jornaleros de su misma contrada, Bruno Parro —de lectura dudosa— de treinta años y Domenico Belmonte de cuarenta. Ninguno de los tres sabía escribir: firma sólo el alcalde.", "Es el segundo de los cuatro hijos documentados de Giacomo y Carmina, y hermano de Maria Antonia. Después de ese día no vuelve a aparecer en ningún papel: ni boda, ni defunción, ni mención en actas de otros."], "claves": [["Nacimiento", "10 de octubre de 1841, 10 h, contrada Palazzo, Marano Marchesato"], ["Bautismo", "el mismo día"], ["Oficio del padre entonces", "pastore"], ["Después de 1841", "nada"]]}, "annunciata_palermo": {"id": "annunciata_palermo", "nombre": "Annunziata Palermo", "legal": "Annunciata Palermo", "rol": "hermano", "rolNombre": "Hermano", "gen": 6, "ramas": ["salerno"], "resumen": "Hermana de Maria Antonia. Nacida en Marano Marchesato el 3 de febrero de 1845, en la contrada Langhi.", "datos": [["Nacimiento", "3 de febrero de 1845, 9 h, Marano Marchesato — acta 7"], ["Lugar", "contrada Langhi"], ["Padres", "Giacomo Palermo, bracciale, 38 años, y Carmina Volpentesta, 30 años"], ["Bautismo", "el mismo día 3 de febrero"], ["Después de 1845", "no se sabe nada de ella"]], "vida": "n.1845", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "antonio_palermo", "teresa_palermo"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "3 de febrero de 1845, 14 h (el acta); nacida a las 9 h", "lugar": "Marano Marchesato", "ref": "acta 7", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 37 «Nati» 1845"], ["Registro", "an_ua35968858 · hash 5Y44zaB"], ["Página", "5 de 51"], ["Oficial", "Francesco Spizzirri, sindaco"], ["Año manuscrito", "«mille ottocento quarantacinque» — coincide con el catálogo"]], "literal": "…è comparso il Signor Giacomo Palermo di anni trentotto di professione bracciale domiciliato in Marano contrada Langhi… da Carmina Volpentesta sua moglie legittima di anni trenta… il nome di Annunciata.", "traduccion": "El año mil ochocientos cuarenta y cinco, el día tres del mes de febrero, a las catorce horas, ante Nos, FRANCESCO SPIZZIRRI, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, ha comparecido el señor GIACOMO PALERMO, DE TREINTA Y OCHO AÑOS, de profesión BRACCIALE (jornalero), domiciliado en Marano, CONTRADA LANGHI.\n\nY nos ha presentado una niña, según hemos reconocido con nuestros propios ojos, y nos ha declarado que la misma ha nacido de CARMINA VOLPENTESTA, su legítima esposa, DE TREINTA AÑOS, domiciliada con él, el día tres del mes arriba dicho del año corriente, a las nueve de la mañana, en la casa de su habitación.\n\nEl mismo ha declarado además dar a la niña el nombre de ANNUNCIATA.\n\nLa presentación y declaración se ha hecho en presencia de FRANCESCO CONFORTI, de treinta años, jornalero, domiciliado en Marano, contrada Conchiali, y de GAETANO DE LUCA, de cuarenta y dos años, jornalero, domiciliado en Marano, contrada Conchiali, testigos.\n\n[En la columna de la derecha] El párroco de Marano certifica que el bautismo se administró a la niña, llamada ANNUNCIATA PALERMO, el día tres del mes indicado.", "notas": ["El índice del que se partió la llama «Annunziata»; el acta original y la partida de bautismo escriben ANNUNCIATA, con c. La carpeta se dejó con el nombre acordado y el fichero lleva la grafía del acta.", "La familia se ha mudado: en 1841 vivían en contrada Palazzo y aquí están en contrada Langhi. En 1852 estarán en Cerzi.", "El padre declara treinta y ocho años, que lo sitúan hacia 1807 — la misma cuenta que saldrá de su acta de defunción de 1867.", "La madre declara treinta años, los mismos que declaró en 1841. Las edades de las mujeres en estos registros se repiten y se redondean con toda naturalidad.", "Gaetano De Luca vuelve a ser testigo siete años después, en el nacimiento de Teresa."], "imgs": [{"u": "actas/1845%20-%20Annunziata%20Palermo/1845-02-03%20N%20Annunciata%20Palermo%20-%20Marano%20Marchesato%20acta%207.jpg", "t": "Annunciata Palermo - Marano Marchesato acta 7"}], "zooms": [{"u": "actas/1845%20-%20Annunziata%20Palermo/1845-02-03%20N%20zoom%20-%20acta%207%20completa%2C%20padres%20y%20testigos.jpg", "t": "Acta 7 completa, padres y testigos"}]}], "nActas": 1, "nImgs": 2, "titulo": "Annunciata, con c", "parrafos": ["Nació el 3 de febrero de 1845 a las nueve de la mañana, en la contrada Langhi de Marano Marchesato, y su padre la inscribió a las dos de la tarde de ese mismo día. Giacomo Palermo declaró entonces treinta y ocho años y oficio de jornalero; cuatro años antes había declarado pastor.", "El índice moderno la llama Annunziata, con zeta. El acta original y la partida de bautismo escriben ANNUNCIATA, con c. La grafía del documento es la que manda.", "Uno de sus dos testigos, Gaetano De Luca, jornalero de cuarenta y dos años de la contrada Conchiali, volverá a firmar siete años después en el nacimiento de su hermana Teresa. Después de 1845 no se sabe nada más de ella."], "claves": [["Nacimiento", "3 de febrero de 1845, 9 h, contrada Langhi, Marano Marchesato"], ["Grafía", "Annunciata en el acta y en el bautismo; Annunziata sólo en el índice"], ["Bautismo", "el mismo día"], ["Después de 1845", "nada"]]}, "teresa_palermo": {"id": "teresa_palermo", "nombre": "Teresa Palermo", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 6, "ramas": ["salerno"], "resumen": "La menor de los hermanos documentados. Nacida en Marano Marchesato el 16 de enero de 1852, en la contrada Cerzi.", "datos": [["Nacimiento", "16 de enero de 1852, 10 h, Marano Marchesato — acta 5"], ["Lugar", "contrada Cerzi (lectura dudosa)"], ["Padres", "Giacomo Palermo, bracciale, 40 años, y Carmina Volpentesta, 35 años"], ["Bautismo", "el mismo día 16 de enero, parroquia de S. Maria del Carmine"], ["Después de 1852", "no se sabe nada de ella"]], "vida": "n.1852", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "antonio_palermo", "annunciata_palermo"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "16 de enero de 1852, 17 h (el acta); nacida a las 10 h", "lugar": "Marano Marchesato", "ref": "acta 5", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 44 «Nati» 1852"], ["Registro", "an_ua35969306 · hash 0nk2Gxl"], ["Página", "4 de 58"], ["Oficial", "Ferdinando Conforti, sindaco"], ["Año manuscrito", "«mille ottocento cinquantadue» — coincide con el catálogo"]], "literal": "…è comparso il signor Giacomo Palermo di anni quaranta di professione bracciale domiciliato in Marano contrada Cerzi… da Carmina Volpentesta sua moglie legittima di anni trentacinque… il nome di Teresa.", "traduccion": "El año mil ochocientos cincuenta y dos, el día dieciséis del mes de enero, a las diecisiete horas, ante Nos, FERDINANDO CONFORTI, alcalde y oficial del estado civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, ha comparecido el señor GIACOMO PALERMO, DE CUARENTA AÑOS, de profesión BRACCIALE, domiciliado en Marano, CONTRADA CERZI.\n\nY nos ha presentado una niña, según hemos reconocido con nuestros propios ojos, y nos ha declarado que la misma ha nacido de CARMINA VOLPENTESTA, su legítima esposa, DE TREINTA Y CINCO AÑOS, domiciliada con él, el día dieciséis del mes arriba dicho del año corriente, a las diez de la mañana, en la casa de su habitación.\n\nEl mismo ha declarado además dar a la niña el nombre de TERESA.\n\nLa presentación y declaración se ha hecho en presencia de LUIGI SICILIA, de cincuenta años, jornalero, domiciliado en Marano, contrada Langhi, y de GAETANO DE LUCA, de cuarenta y ocho años, jornalero, domiciliado en Marano, contrada Langhi, testigos.\n\n[En la columna de la derecha] El párroco de S. Maria del Carmine certifica que el bautismo se administró a la niña, llamada TERESA PALERMO, el día dieciséis del mes indicado.", "notas": ["Ha cambiado el alcalde: hasta 1845 firmaba Francesco Spizzirri y ahora firma Ferdinando Conforti.", "Es la única de las tres actas en que aparece el nombre de la parroquia: SANTA MARIA DEL CARMINE de Marano.", "El padre declara cuarenta años, que darían un nacimiento hacia 1812. Es la cifra que peor encaja con las demás (36 en 1841, 38 en 1845, 60 al morir en 1867); las edades declaradas en estos registros son aproximadas.", "El nombre de la contrada es de lectura dudosa: «Cerzi» es lo más probable. Los volúmenes de la Restauración están escaneados a menos resolución que los posteriores y algunas palabras no se dejan leer por mucho que se amplíe.", "Trece años separan a Teresa de su hermana mayor Maria Antonia. Entre 1839 y 1852 casi seguro hay más hermanos sin buscar."], "imgs": [{"u": "actas/1852%20-%20Teresa%20Palermo/1852-01-16%20N%20Teresa%20Palermo%20-%20Marano%20Marchesato%20acta%205.jpg", "t": "Teresa Palermo - Marano Marchesato acta 5"}], "zooms": [{"u": "actas/1852%20-%20Teresa%20Palermo/1852-01-16%20N%20zoom%20-%20acta%205%2C%20padre%20Giacomo%20Palermo%20y%20madre%20Carmina%20Volpentesta.jpg", "t": "Acta 5, padre Giacomo Palermo y madre Carmina Volpentesta"}]}], "nActas": 1, "nImgs": 2, "titulo": "La última de Marano", "parrafos": ["Nació el 16 de enero de 1852 a las diez de la mañana, en la contrada Cerzi —lectura dudosa— y fue inscrita a las cinco de la tarde del mismo día. La bautizaron esa jornada en la parroquia de S. Maria del Carmine de Marano.", "Su padre declaró cuarenta años. El alcalde ya no era Francesco Spizzirri, que firmaba en 1841 y en 1845, sino Ferdinando Conforti. Y entre los testigos vuelve a estar Gaetano De Luca, ahora con cuarenta y ocho años.", "Es la menor de los cuatro hijos documentados, y entre ella y el mayor hay once años. Entre 1839 y 1852 nadie ha barrido todavía los nacimientos de Marano: es muy probable que haya más hermanos por encontrar. De la vida de Teresa después de ese 16 de enero no se sabe nada."], "claves": [["Nacimiento", "16 de enero de 1852, 10 h, contrada Cerzi, Marano Marchesato"], ["Bautismo", "el mismo día, S. Maria del Carmine"], ["Lugar entre los hermanos", "la menor de los cuatro documentados"], ["Después de 1852", "nada"]]}, "domenico": {"id": "domenico", "nombre": "Domenico Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["salerno"], "resumen": "El mayor de los cuatro hermanos. Publicó amonestaciones en Rende en 1888 y se casó en 1910 con Giuseppina Cairo. Enviudó al menos una vez.", "datos": [["Nacimiento", "hacia 1859, CASTROLIBERO — según declara él mismo en 1910"], ["Padres", "Michele Salerno y Maria Antonia Palermo"], ["Publicación", "1888, Rende"], ["Primer matrimonio", "sin localizar — en 1910 consta VIUDO"], ["Matrimonio", "5 de noviembre de 1910, Rende — acta 44, con Giuseppina Cairo"], ["Oficio", "contadino"], ["Hijos documentados", "Salvatore (1906) y Michele (1909), con Maria Russo"]], "vida": "n.c.1859", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "Su acta de nacimiento sigue sin aparecer, pero desde 2026 se sabe dónde buscarla. En su boda de 1910 (acta 44, ya descargada y transcrita en la ficha del matrimonio) declara CINCUENTA Y UN AÑOS y haber NACIDO EN CASTROLIBERO; y diez semanas antes, al declarar la muerte de su sobrina Angelina, había dicho cincuenta. Las dos cifras apuntan a un nacimiento hacia 1859, unos diez meses después de la boda de sus padres: sería el primogénito. El barrido anterior de Castrolibero, que arrancaba en 1859 y buscaba «Salerno», no lo encontró; hay que repetirlo sobre 1858 y 1859 buscando DE RANGO, que es el apellido con el que Michele inscribía allí a sus hijos.", "padre": "michele", "madre": "maria_antonia", "conyuge": null, "hijos": [], "hermanos": ["arcangela", "francesco", "giovanni"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Viudo a los cincuenta y uno", "parrafos": ["Es el mayor de los cuatro hermanos y el único cuya acta de nacimiento no aparece. Lo que hay son dos declaraciones suyas, con diez semanas de diferencia y las dos de 1910: el 30 de agosto, al declarar la muerte de su sobrina Angelina, dijo tener cincuenta años; el 5 de noviembre, al casarse, dijo cincuenta y uno. Las dos cifras se cruzan en un nacimiento de hacia 1859, unos diez meses después de la boda de sus padres. Sería, por tanto, el primogénito.", "El acta de su boda dice sin ambigüedad que nació en Castrolibero. Eso choca con una comprobación anterior que daba Castrolibero por descartado tras barrer catorce años de registros. La explicación más probable es que se buscara el apellido equivocado: allí Michele inscribía a sus hijos como DE RANGO. Hay que volver a mirar 1858 y 1859 buscando «De Rango Domenico», hijo de Michele y Maria Palermo.", "Se casó el 5 de noviembre de 1910, a las nueve y media de la mañana, con Giuseppina Cairo, soltera de treinta y dos años, huérfana de padre y de madre. El acta lo llama «vedovo»: no era su primera boda, y de la primera mujer no se sabe ni el nombre ni cuándo murió. No comparece nadie a dar consentimiento —él tenía cincuenta y uno, ella treinta y dos— y ninguno de los dos firma; lo hacen los testigos, un sastre de cuarenta y ocho años y un «civile» de veintisiete. Se le atribuyen dos hijos con una Maria Russo, Salvatore en 1906 y Michele en 1909, pero ninguna acta lo confirma.", "Su boda es, de paso, el documento que más ha rendido de toda la investigación. Al nombrar a sus padres sin el «fu» —cuando en la misma página el mismo escribano escribe «figlia di fu Giovanni» de la novia— prueba que Michele y Maria Antonia seguían vivos en noviembre de 1910."], "claves": [["Nacido", "hacia 1859 en Castrolibero, según declara él mismo"], ["Oficio", "contadino, campesino"], ["Estado al casarse en 1910", "viudo, con 51 años"], ["Sabía firmar", "no"], ["Acta de nacimiento", "sin localizar; buscarla como De Rango"]]}, "arcangela": {"id": "arcangela", "nombre": "Arcangela Salerno", "legal": "Arcangela De Rango", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["salerno"], "resumen": "La única hija. Nació en Castrolibero en 1868 e inscrita con el apellido De Rango.", "datos": [["Nacimiento", "23 de junio de 1868, 2 de la madrugada, Castrolibero — acta 18"], ["Lugar", "strada Feudo"], ["Padres", "Michele De Rango («figlio di Esposito») y Maria Palermo"], ["Inscrita como", "De Rango Arcangela"]], "vida": "n.1868", "lug": "Castrolibero", "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": null, "hijos": [], "hermanos": ["domenico", "francesco", "giovanni"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "24 de junio de 1868, 8 h", "lugar": "Castrolibero", "ref": "acta 18", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 60 «Nati» 1868"], ["Registro", "an_ua35982616 · hash 5d6rYkz"], ["Página", "9 de 18"], ["Oficial", "Giovanni Morelli, asesor decano en funciones de alcalde"]], "literal": "Michele De Rango, figlio di Esposito, di anni quarantadue, di professione bracciale…", "traduccion": "El año mil ochocientos sesenta y ocho, el día veinticuatro de junio, a las ocho de la mañana, en la casa comunal, ante Giovanni Morelli, asesor decano en funciones de alcalde por ausencia del titular, ha comparecido MICHELE DE RANGO, hijo de Expósito, de cuarenta y dos años, de profesión jornalero, domiciliado en este municipio.\n\nDeclara que de MARIA PALERMO, campesina, domiciliada en este municipio, ha nacido el día veintitrés del corriente, a las dos de la madrugada, en la casa de su habitación sita en este municipio, strada Feudo, una niña, a la que impone el nombre de ARCANGELA.\n\nTestigos: Pasquale Sarentino, hijo del difunto Michele, de treinta y ocho años, jornalero; e Ippolito Stellato, hijo del difunto Domenico, de treinta y seis años, jornalero. Ni el declarante ni los testigos firman por ser analfabetos.", "notas": ["Primera aparición del apellido DE RANGO. En Castrolibero la familia entera se inscribe así; en Rende, la misma gente es Salerno.", "La edad del padre (42 en 1868) es la que mejor cuadra con el expósito de 1825, que tendría 43."], "imgs": [{"u": "actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20Arcangela%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%2018.jpg", "t": "Arcangela Salerno (De Rango) - Castrolibero acta 18"}], "zooms": [{"u": "actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20cabecera%2C%20padre%20y%20testigos.jpg", "t": "Cabecera, padre y testigos"}, {"u": "actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20madre%20Maria%20Palermo%20y%20nombre%20impuesto.jpg", "t": "Madre Maria Palermo y nombre impuesto"}, {"u": "actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 4, "titulo": "La única niña de la casa", "parrafos": ["Nació el 23 de junio de 1868 a las dos de la madrugada, en la casa de sus padres, en la strada Feudo de Castrolibero. Su padre fue a inscribirla a las ocho de la mañana del día siguiente, ante Giovanni Morelli, asesor decano en funciones de alcalde por ausencia del titular.", "El acta lo llama «MICHELE DE RANGO, figlio di Esposito», de cuarenta y dos años, de profesión bracciale; y a su madre, «MARIA PALERMO, contadina». Es la primera de las tres actas de Castrolibero que escriben De Rango donde en Rende pondrán Salerno. Los dos testigos eran jornaleros como él, Pasquale Sarentino de treinta y ocho años e Ippolito Stellato de treinta y seis, y ninguno firmó: el acta anota que padre, declarante y testigos son analfabetos.", "Es la única hija de Michele y Maria Antonia de la que hay constancia documental. Después de ese acta no vuelve a aparecer: ni matrimonio, ni defunción, ni una mención en las actas de sus hermanos."], "claves": [["Nacimiento", "23 de junio de 1868, 2 de la madrugada, strada Feudo, Castrolibero"], ["Inscrita como", "De Rango Arcangela"], ["Edad declarada del padre", "42 años — la que mejor cuadra con el expósito de 1825"], ["Después de 1868", "nada"]]}, "francesco": {"id": "francesco", "nombre": "Francesco Salerno", "legal": "Francesco De Rango", "rol": "directa", "rolNombre": "Línea directa", "gen": 7, "ramas": ["salerno"], "resumen": "Nacido en Castrolibero en 1870 e inscrito De Rango. Se casó en Rende en 1894 ya como Salerno. Jornalero y campesino; la familia se mudaba de contrada casi cada año.", "datos": [["Nacimiento", "7 de diciembre de 1870, 6 de la mañana, Castrolibero — acta 39"], ["Lugar", "contrada Sciolle / Feudo"], ["Padres", "Michele De Rango Esposito y Maria Palermo"], ["Matrimonio", "1 de abril de 1894, Rende — acta 16, con 23 años"], ["Cónyuge", "Filomena Chiappetta"], ["Oficio", "agricoltore / contadino"], ["Hijos documentados", "nueve, entre 1895 y 1909"]], "vida": "n.1870", "lug": "Castrolibero", "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": "filomena", "hijos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "hermanos": ["domenico", "arcangela", "giovanni"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "8 de diciembre de 1870, 14 h", "lugar": "Castrolibero", "ref": "acta 39", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 62 «Nati» 1870"], ["Registro", "an_ua35982618 · hash w6nGQyQ"], ["Página", "19 de 24"], ["Oficial", "Giovanni Morelli, Sindaco"]], "literal": "…è comparso Michele De Rango Esposito, di anni quarantotto, di professione bracciale, domiciliato in questo comune, contrada Feudo…\n\n…è nato dalla sua legittima moglie Maria Palermo, contadina, domiciliata con suo marito, che il giorno sette del corrente mese ed anno ad ore sei antimeridiane…\n\nLo stesso dichiarante ha imposto al bambino il nome di Francesco.", "traduccion": "El año mil ochocientos setenta, el día ocho del mes de diciembre, en la casa comunal de Castrolibero, distrito de Cosenza, provincia de Calabria Citerior, a las dos de la tarde. Ante mí, Giovanni Morelli, alcalde y Oficial del Estado Civil de dicho municipio, ha comparecido MICHELE DE RANGO EXPÓSITO, de cuarenta y ocho años, de profesión jornalero, domiciliado en este municipio, contrada Feudo.\n\nEl cual, en presencia de los testigos por él elegidos —Alessandro Calabrese, hijo del difunto Vincenzo, de veintiocho años, y Michele Cosentino, hijo del difunto Antonio, de treinta y siete años, ambos jornaleros domiciliados en este municipio— me ha presentado un niño de sexo masculino que he reconocido con mis propios ojos, y ha declarado que el mismo ha nacido de su legítima esposa MARIA PALERMO, campesina, domiciliada con su marido, el día siete del corriente mes y año, a las seis de la mañana, en la casa de su habitación sita en este municipio, contrada como arriba.\n\nEl mismo declarante ha impuesto al niño el nombre de FRANCESCO.", "notas": ["Concuerda con el matrimonio de 1894, donde Francesco declara 23 años y haber nacido en Castrolibero, hijo de Michele y de Palermo Maria. Y con el acta 117 de 1896, donde consta con 25 años.", "La edad del padre baila entre actas: 42 en 1868, 48 en 1870, 40 en 1873. Michele era expósito y analfabeto: nunca supo su día de nacimiento y calculaba a ojo."], "imgs": [{"u": "actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20Francesco%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%2039.jpg", "t": "Francesco Salerno (De Rango) - Castrolibero acta 39"}], "zooms": [{"u": "actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20madre%20Maria%20Palermo%20y%20nombre%20impuesto.jpg", "t": "Madre Maria Palermo y nombre impuesto"}, {"u": "actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20padre%20Michele%20De%20Rango%20esposito%20y%20testigos.jpg", "t": "Padre Michele De Rango esposito y testigos"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "1 de abril de 1894, 10:30 h", "lugar": "Rende", "ref": "acta 16", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Matrimoni» 1894"], ["Registro", "an_ua35985531 · hash 5BPDpKk"], ["Página", "9 de 36"]], "literal": "1° Salerno Francesco, di anni ventitré, celibe, nato in Castrolibero, residente in Rende, figlio di Michele, residente in Rende, e di Palermo Maria, residente in detto luogo;\n\n2° Chiappetta Filomena, di anni sedici, nubile, nata in Rende, residente in Rende, figlia di Giovanni, residente in Rende, e di Massei Angela, residente in Rende.\n\nAl presente matrimonio hanno dato il loro consenso Salerno Michele e Palermo Maria, genitori dello sposo, e Chiappetta Giovanni e Massei Angela, genitori della sposa.", "traduccion": "El año mil ochocientos noventa y cuatro, el día primero de abril, a las diez y treinta de la mañana, en la casa comunal de Rende, abierta al público. Ante mí, Lo Celso Giuseppe, asesor decano en sustitución del alcalde impedido, Oficial del Estado Civil, vestido de forma oficial, han comparecido personalmente:\n\n1.º SALERNO FRANCESCO, de veintitrés años, soltero, nacido en Castrolibero, residente en Rende, hijo de Michele, residente en Rende, y de Palermo Maria, residente en dicho lugar.\n\n2.º CHIAPPETTA FILOMENA, de dieciséis años, soltera, nacida en Rende, residente en Rende, hija de Giovanni, residente en Rende, y de Massei Angela, residente en Rende.\n\nLos cuales me han pedido unirlos en matrimonio. A tal efecto me han presentado un solo documento, el certificado de las amonestaciones celebradas en este municipio los domingos cuatro y once de marzo del año corriente.\n\nLeídos a los esposos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y habiendo respondido cada uno afirmativamente, he pronunciado en nombre de la ley que quedan unidos en matrimonio.\n\nTestigos: Rendano Alfonso, de treinta y cinco años, hacendado; y Vercillo Salvatore, de cuarenta y cinco años, agricultor.\n\nAl presente matrimonio han dado su consentimiento SALERNO MICHELE y PALERMO MARIA, padres del esposo, y CHIAPPETTA GIOVANNI y MASSEI ANGELA, padres de la esposa.", "notas": ["El consentimiento de los padres no es una fórmula: el Código Civil lo exigía para los varones menores de veinticinco años, y Francesco tenía veintitrés. Michele y Maria Antonia tuvieron que comparecer en persona.", "Es el rastro más tardío que tenemos de Michele: el expósito del torno estaba vivo el 1 de abril de 1894, con unos 69 años, viendo casarse a su hijo. Su defunción es posterior a esa fecha.", "Los novios no firman «per essere analfabeti come hanno dichiarato». Firman los dos testigos y el oficial.", "Los processetti de 1894 NO existen: esa serie en Rende acaba en 1865, con el fondo de la Restauración. Y el propio acta dice que se presentó un solo documento."], "imgs": [{"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20Francesco%20Salerno%20y%20Filomena%20Chiappetta%20-%20Rende%20acta%2016.jpg", "t": "Francesco Salerno y Filomena Chiappetta - Rende acta 16"}], "zooms": [{"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20firmas.jpg", "t": "Firmas"}, {"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 4, "titulo": "Nunca supo su edad", "parrafos": ["Nació el 7 de diciembre de 1870 a las seis de la mañana en Castrolibero, y su padre lo inscribió al día siguiente a las dos de la tarde presentándose como «Michele De Rango Esposito, de cuarenta y ocho años, jornalero». La contrada se lee Feudo en unas transcripciones y Sciolle en otras; es el mismo campo donde dos años antes había nacido Arcangela y donde en 1873 nacería Giovanni.", "Las edades que fue declarando a lo largo de su vida casi nunca cuadran. En febrero de 1895, al inscribir a su primer hijo, dijo treinta años: tenía veinticuatro. Al casarse en abril de 1894 había dicho veinticuatro, cuando tenía veintitrés. En noviembre de 1897 volvió a decir veinticuatro y tenía veintiséis. En mayo de 1902 dijo treinta y tenía treinta y uno; en diciembre de 1907 dijo treinta y ocho el día en que cumplía treinta y siete. Acertó dos veces: veinticinco en junio de 1896 y veintiocho en octubre de 1899. Era analfabeto y no firmó ninguna de esas actas.", "Se casó el 1 de abril de 1894, a las diez y media de la mañana, con Filomena Chiappetta, de dieciséis años. Los dos declararon no saber escribir. Tuvieron nueve hijos documentados entre 1895 y 1909, y la casa se mudó casi con cada uno: contrada Saporito en 1895, S. Agostino en 1896, Saporito otra vez en 1897, Campagnano en 1899 y 1902, S. Agostino desde 1904. El oficio también baila en el papel —agricoltore, contadino, bracciante—, aunque el trabajo fuera siempre el mismo.", "El 24 de septiembre de 1909 fue a inscribir a su hija Maria y se quedó de testigo en el acta siguiente, la del vecino Benincasa: allí figura un «Salerno Francesco, di anni trentotto, contadino», misma edad y mismo oficio. Aquella acta la declaraba una comadrona porque el marido «è in America». Diez años más tarde emigrarían sus hijos mayores; él y Filomena se quedaron en Rende."], "claves": [["Oficio", "agricoltore, contadino, bracciante — según el año"], ["Sabía firmar", "no"], ["Casado a los", "23 años, aunque el acta le pone 24"], ["Hijos documentados", "nueve, entre 1895 y 1909"], ["Contradas", "Saporito, S. Agostino, Campagnano — se mudaban mucho"]]}, "giovanni": {"id": "giovanni", "nombre": "Giovanni Salerno", "legal": "Giovanni De Rango", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["salerno"], "resumen": "El menor. Nacido en Castrolibero en 1873, casado en Rende en 1897 y muerto a los 26 años, dejando un hijo de trece meses.", "datos": [["Nacimiento", "24 de enero de 1873, 14 h, Castrolibero — acta 8"], ["Lugar", "strada Sciolle"], ["Padres", "De Rango Michele Esposito y Palermo Maria"], ["Matrimonio", "17 de octubre de 1897, Rende — acta 36, con 24 años"], ["Cónyuge", "Vincenzina Morelli"], ["Hijo", "Salvatore, enero de 1899"], ["Defunción", "23 de febrero de 1900, Rende — acta 31, con 26 años"]], "vida": "1873–1900", "lug": "Castrolibero", "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": "vincenzina", "hijos": ["salvatore"], "hermanos": ["domenico", "arcangela", "francesco"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "25 de enero de 1873, 11 h", "lugar": "Castrolibero", "ref": "acta 8", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 65 «Nati» 1873"], ["Registro", "an_ua35982620 · hash 5gZOXp1"], ["Página", "5 de 23"], ["Oficial", "Vina Silvestro (lectura dudosa), Sindaco"]], "literal": "De Rango Michele Esposito, di anni quaranta, di professione bracciale…\n…Palermo Maria, di professione filatrice…", "traduccion": "El año mil ochocientos setenta y tres, el día veinticinco de enero, a las once de la mañana, en la casa comunal, ante el alcalde y Oficial del Estado Civil, ha comparecido DE RANGO MICHELE EXPÓSITO, de cuarenta años, de profesión jornalero, domiciliado en Castrolibero.\n\nDeclara que de PALERMO MARIA, de profesión hilandera, domiciliada en dicho municipio, ha nacido el día veinticuatro de enero del año corriente, a las dos de la tarde, en la propia habitación de él, strada Sciolle, una criatura a la que impone el nombre de GIOVANNI.\n\nTestigos: Calabria Alessandro, hijo del difunto Vincenzo, de treinta y nueve años; y Sollato Spoglia, hijo del difunto Domenico, de cuarenta y seis años, ambos jornaleros de Castrolibero.", "notas": ["El escribano escribió «un bambino di sesso femminile» pero impuso el nombre GIOVANNI, y el índice del margen dice «De Rango Giovanni di Michele». Es un lapsus de pluma: copió la fórmula del acta vecina, que sí era de niña. Es varón — se casa en 1897 y muere en 1900 como varón.", "La madre figura aquí como hilandera; en 1868 y 1870 era campesina."], "imgs": [{"u": "actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20Giovanni%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%208.jpg", "t": "Giovanni Salerno (De Rango) - Castrolibero acta 8"}], "zooms": [{"u": "actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20cabecera%2C%20padre%20y%20testigos.jpg", "t": "Cabecera, padre y testigos"}, {"u": "actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20madre%20Palermo%20Maria%20y%20nombre%20impuesto.jpg", "t": "Madre Palermo Maria y nombre impuesto"}, {"u": "actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}, {"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "24 de febrero de 1900, 10:20 h", "lugar": "Rende", "ref": "acta 31", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 92 «Morti» 1900"], ["Registro", "an_ua35985579 · hash LNynZKy"], ["Página", "9 de 36"], ["Oficial", "Cifani Domenico, asesor decano"]], "literal": "Salerno Giovanni, di anni ventisei, contadino… figlio di Michele… e di Palermo Maria… marito di Morelli Vincenzina.", "traduccion": "El año mil novecientos, el día veinticuatro de febrero, a las diez y veinte de la mañana, en la casa comunal. Ante el Oficial del Estado Civil han comparecido Cacciaro Raffaele, de veintinueve años, campesino, y Stellato Andrea, de cuarenta y un años, campesino, ambos de Rende, quienes han declarado que ayer, a las diez y diez de la mañana, en la casa sita en contrada S. Agostino, ha fallecido SALERNO GIOVANNI, de veintiséis años, campesino, residente en Rende, nacido en Rende, hijo de Michele, campesino domiciliado en Rende, y de PALERMO MARIA, campesina domiciliada en Rende, marido de MORELLI VINCENZINA.\n\nTestigos: De Rango Salvatore, de treinta años, campesino; y Spizzirri Giovanni, de cuarenta y siete años, campesino.", "notas": ["El acta dice que nació en Rende, pero su partida es de Castrolibero y así lo declaró él mismo al casarse en 1897. El error es de los dos vecinos que fueron a declarar la muerte.", "Uno de los testigos es DE RANGO SALVATORE: el apellido de expósito de la familia seguía vivo en Rende en 1900.", "Murió a los dos años y cuatro meses de casarse, dejando un hijo de trece meses."], "imgs": [{"u": "actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20Giovanni%20Salerno%20-%20Rende%20acta%2031.jpg", "t": "Giovanni Salerno - Rende acta 31"}], "zooms": [{"u": "actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20zoom%20-%20cabecera%20y%20declarantes.jpg", "t": "Cabecera y declarantes"}, {"u": "actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20zoom%20-%20padres%2C%20esposa%20y%20testigos.jpg", "t": "Padres, esposa y testigos"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "17 de octubre de 1897, 16 h", "lugar": "Rende", "ref": "acta 36", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Matrimoni» 1897"], ["Registro", "an_ua35985535 · hash wEVmEnd"], ["Página", "19 de 28"]], "literal": "Salerno Giovanni, di anni ventiquattro, celibe, nato in Castrolibero… figlio di Michele… e di Palermo Maria…", "traduccion": "El año mil ochocientos noventa y siete, el día diecisiete de octubre, a las cuatro de la tarde, en la casa comunal de Rende. Han comparecido:\n\n1.º SALERNO GIOVANNI, de veinticuatro años, soltero, nacido en Castrolibero, residente en Rende, hijo de Michele, residente en Rende, y de Palermo Maria, residente en Rende.\n\n2.º MORELLI VINCENZINA, de veintitrés años, soltera, nacida en Castrolibero, hija de Antonio, residente en Rende, y de Vina Maria, residente en Rende.\n\nDocumento presentado: el certificado de las amonestaciones celebradas los domingos tres y diez de octubre.\n\nTestigos: Pellicori Antonio, de treinta y dos años, cafetero; y Cianci Costantino, comerciante.\n\nHan dado su consentimiento Salerno Michele y Palermo Maria, padres del esposo; y Morelli Antonio y Vina Maria, padres de la esposa.", "notas": ["La edad (24) cuadra con su nacimiento el 24 de enero de 1873 en Castrolibero.", "Es la prueba del cambio de apellido: el mismo hombre inscrito como DE RANGO al nacer se casa como SALERNO.", "Sus padres seguían vivos en octubre de 1897 — tres años después de la boda de Francesco."], "imgs": [{"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20Giovanni%20Salerno%20y%20Vincenza%20Morelli%20-%20Rende%20acta%2036.jpg", "t": "Giovanni Salerno y Vincenza Morelli - Rende acta 36"}], "zooms": [{"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 2, "nImgs": 7, "titulo": "El escribano escribió niña", "parrafos": ["Nació el 24 de enero de 1873 a las dos de la tarde, en la strada Sciolle de Castrolibero, y fue inscrito al día siguiente a las once de la mañana. En el acta, el escribano escribió «un bambino di sesso femminile» —una niña— y acto seguido le impuso el nombre de GIOVANNI; el epígrafe del margen dice «De Rango Giovanni di Michele». Es un lapsus de pluma: copió la fórmula del acta vecina, que sí era de niña. Era varón, y lo confirma todo lo que vino después.", "Se casó el 17 de octubre de 1897, a las cuatro de la tarde, con Vincenzina Morelli, de veintitrés años. Ninguno firmó. Esa acta es la bisagra de todo el árbol: el mismo hombre inscrito como DE RANGO al nacer se casa como SALERNO, con los mismos padres, Michele y Palermo Maria. Sin ella no habría manera de coser las actas de Castrolibero con las de Rende.", "Su hijo Salvatore nació el 12 de enero de 1899. Giovanni murió el 23 de febrero de 1900, a las diez y diez de la mañana, en la contrada S. Agostino, con veintiséis años: dos años y cuatro meses después de casarse, dejando un niño de trece meses. Fueron a declararlo dos campesinos del pueblo, Cacciaro Raffaele de veintinueve años y Stellato Andrea de cuarenta y uno.", "El acta dice que había nacido en Rende. Es un error de los declarantes, que eran vecinos y no familia: su partida es de Castrolibero, y así lo había declarado él mismo al casarse tres años antes. Un detalle más de esa acta: uno de los testigos se llamaba De Rango Salvatore. El apellido de expósito de la familia seguía vivo en Rende en 1900."], "claves": [["Nacimiento", "24 de enero de 1873, 14 h, strada Sciolle, Castrolibero"], ["El acta dice", "«di sesso femminile», y le pone nombre de varón"], ["Inscrito como", "De Rango Giovanni; se casa como Salerno"], ["Sabía firmar", "no"], ["Muerte", "23 de febrero de 1900, a los 26 años, dejando un hijo de trece meses"]]}, "filomena": {"id": "filomena", "nombre": "Filomena Chiappetta", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 7, "ramas": ["salerno"], "resumen": "Nacida en Rende en 1877. Se casó a los dieciséis años. Madre de los nueve hijos documentados.", "datos": [["Nacimiento", "11 de mayo de 1877, 9 h, Rende — acta 64"], ["Lugar", "contrada Soprano (lectura dudosa)"], ["Padres", "Chiappetta Giovanni, jornalero, y Massei Angela, campesina"], ["Matrimonio", "1 de abril de 1894, Rende — acta 16, con 16 años"], ["Cónyuge", "Francesco Salerno"], ["Oficio", "«donna di casa» en 1895-1897; contadina desde 1899"]], "vida": "n.1877", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "giovanni_chiappetta", "madre": "angela_massei", "conyuge": "francesco", "hijos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "12 de mayo de 1877, 9 h", "lugar": "Rende", "ref": "acta 64", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 69 «Nati» 1877"], ["Registro", "an_ua35983847 · hash LmAmd1R"], ["Página", "31 de 94"], ["Oficial", "Martino Vincenzo, asesor decano"]], "literal": "Chiappetta Giovanni, di anni ventinove, di professione bracciale…\n…Massei Angela, contadina, sua moglie, seco lui convivente…", "traduccion": "El año mil ochocientos setenta y siete, el día doce de mayo, a las nueve de la mañana, en la casa comunal, ante Martino Vincenzo, asesor decano por el alcalde, ha comparecido CHIAPPETTA GIOVANNI, de veintinueve años, de profesión jornalero, domiciliado en Rende.\n\nDeclara que de MASSEI ANGELA, campesina, su esposa conviviente con él, ha nacido el día once del corriente mes, a las nueve de la mañana, en la casa sita en contrada Soprano, una niña, a la que impone el nombre de FILOMENA.\n\nTestigos: Raffaele Antonio, jornalero, de treinta y cuatro años; y Molinaro Gaspare, jornalero, de cuarenta y dos años.", "notas": ["Su edad de 16 años en la boda de abril de 1894 confirma que este registro contiene efectivamente actas de 1877 y no de 1878 — comprobación necesaria, porque la datación del catálogo de Antenati no siempre coincide con el contenido."], "imgs": [{"u": "actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20Filomena%20Chiappetta%20-%20Rende%20acta%2064.jpg", "t": "Filomena Chiappetta - Rende acta 64"}], "zooms": [{"u": "actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20zoom%20-%20padres%20Giovanni%20Chiappetta%20y%20Angela%20Massei.jpg", "t": "Padres Giovanni Chiappetta y Angela Massei"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "1 de abril de 1894, 10:30 h", "lugar": "Rende", "ref": "acta 16", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Matrimoni» 1894"], ["Registro", "an_ua35985531 · hash 5BPDpKk"], ["Página", "9 de 36"]], "literal": "1° Salerno Francesco, di anni ventitré, celibe, nato in Castrolibero, residente in Rende, figlio di Michele, residente in Rende, e di Palermo Maria, residente in detto luogo;\n\n2° Chiappetta Filomena, di anni sedici, nubile, nata in Rende, residente in Rende, figlia di Giovanni, residente in Rende, e di Massei Angela, residente in Rende.\n\nAl presente matrimonio hanno dato il loro consenso Salerno Michele e Palermo Maria, genitori dello sposo, e Chiappetta Giovanni e Massei Angela, genitori della sposa.", "traduccion": "El año mil ochocientos noventa y cuatro, el día primero de abril, a las diez y treinta de la mañana, en la casa comunal de Rende, abierta al público. Ante mí, Lo Celso Giuseppe, asesor decano en sustitución del alcalde impedido, Oficial del Estado Civil, vestido de forma oficial, han comparecido personalmente:\n\n1.º SALERNO FRANCESCO, de veintitrés años, soltero, nacido en Castrolibero, residente en Rende, hijo de Michele, residente en Rende, y de Palermo Maria, residente en dicho lugar.\n\n2.º CHIAPPETTA FILOMENA, de dieciséis años, soltera, nacida en Rende, residente en Rende, hija de Giovanni, residente en Rende, y de Massei Angela, residente en Rende.\n\nLos cuales me han pedido unirlos en matrimonio. A tal efecto me han presentado un solo documento, el certificado de las amonestaciones celebradas en este municipio los domingos cuatro y once de marzo del año corriente.\n\nLeídos a los esposos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y habiendo respondido cada uno afirmativamente, he pronunciado en nombre de la ley que quedan unidos en matrimonio.\n\nTestigos: Rendano Alfonso, de treinta y cinco años, hacendado; y Vercillo Salvatore, de cuarenta y cinco años, agricultor.\n\nAl presente matrimonio han dado su consentimiento SALERNO MICHELE y PALERMO MARIA, padres del esposo, y CHIAPPETTA GIOVANNI y MASSEI ANGELA, padres de la esposa.", "notas": ["El consentimiento de los padres no es una fórmula: el Código Civil lo exigía para los varones menores de veinticinco años, y Francesco tenía veintitrés. Michele y Maria Antonia tuvieron que comparecer en persona.", "Es el rastro más tardío que tenemos de Michele: el expósito del torno estaba vivo el 1 de abril de 1894, con unos 69 años, viendo casarse a su hijo. Su defunción es posterior a esa fecha.", "Los novios no firman «per essere analfabeti come hanno dichiarato». Firman los dos testigos y el oficial.", "Los processetti de 1894 NO existen: esa serie en Rende acaba en 1865, con el fondo de la Restauración. Y el propio acta dice que se presentó un solo documento."], "imgs": [{"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20Francesco%20Salerno%20y%20Filomena%20Chiappetta%20-%20Rende%20acta%2016.jpg", "t": "Francesco Salerno y Filomena Chiappetta - Rende acta 16"}], "zooms": [{"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20firmas.jpg", "t": "Firmas"}, {"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 3, "titulo": "Casada con dieciséis", "parrafos": ["Nació el 11 de mayo de 1877 a las nueve de la mañana, en la contrada Soprano —lectura dudosa— de Rende. Su padre, Giovanni Chiappetta, jornalero de veintinueve años, la inscribió a la misma hora del día siguiente, ante el asesor decano Vincenzo Martino.", "Se casó el 1 de abril de 1894 con dieciséis años. Su madre, Angela Massei, se había casado con quince. En el acta comparecen los cuatro padres a dar el consentimiento, y ni los novios ni ellos firman: «per essere analfabeti come hanno dichiarato». Firmaron los dos testigos —Rendano Alfonso, hacendado de treinta y cinco años, y Vercillo Salvatore, agricultor de cuarenta y cinco— y el oficial.", "Entre 1895 y 1909 tuvo nueve hijos documentados: Giuseppe, Antonio, Umberto, los gemelos Settimo y Saverio, Angelina, Giovanni, Arturo y Maria. En las actas figura como «donna di casa» hasta 1897 y como contadina desde 1899. En agosto de 1910 perdió a Angelina, de ocho años; a declarar la muerte no fue ella ni su marido, sino su padre y su cuñado.", "La memoria familiar habla de catorce hijos. El barrido de los nacimientos de Rende de 1893 a 1910, completos año por año y sin huecos, da nueve de Filomena; los demás Salerno de padre Francesco que salen en esos años son de otras tres mujeres del pueblo. Puede que hubiera más hijos entre 1911 y 1918, que es lo que no está digitalizado — pero eso, hoy por hoy, es hipótesis."], "claves": [["Nacimiento", "11 de mayo de 1877, 9 h, Rende, acta 64"], ["Casada a los", "16 años; su madre se casó con 15"], ["Sabía firmar", "no"], ["Oficio", "«donna di casa» hasta 1897; contadina desde 1899"], ["Hijos documentados", "nueve"]]}, "vincenzina": {"id": "vincenzina", "nombre": "Vincenzina Morelli", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 7, "ramas": ["salerno"], "resumen": "Nacida en Castrolibero el 4 de abril de 1874, en la Strada Marchesato, hija de un jornalero y de una hilandera. Se casó con Giovanni en 1897 y enviudó dos años y medio después, con un hijo de trece meses.", "datos": [["Nacimiento", "4 de abril de 1874, 17 h, CASTROLIBERO, Strada Marchesato — acta 17"], ["Padres", "ANTONIO MORELLI, jornalero, 32 años, hijo de Paolo; y MARIA VINA, hilandera"], ["Matrimonio", "17 de octubre de 1897, Rende — acta 36, con 23 años"], ["Cónyuge", "Giovanni Salerno († 1900)"], ["Hijo", "Salvatore, enero de 1899"], ["Grafía", "«Vicenzina» en el cuerpo del acta; «Vincenzina» en el margen y en el índice anual"]], "vida": "n.1874", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "giovanni", "hijos": ["salvatore"], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "5 de abril de 1874, 9 h (el acta); nacida el 4 de abril a las 17 h", "lugar": "Castrolibero", "ref": "acta 17", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 66 «Nati» 1874"], ["Registro", "hash del contenedor dam- : w6nGQNK (20 páginas)"], ["Página", "9 de 20 — folio 8 del libro"], ["Oficial", "Silvestro Vina, sindaco"], ["Año manuscrito", "«mille ottocento settantaquattro» — coincide con el catálogo"], ["Cómo se localizó", "«Indice annuale» del final del registro, página 20 de 20: fila «Morelli Vincenzina — 17»"]], "literal": "…è comparso MORELLI ANTONIO FIGLIO DI PAOLO di anni trentadue di professione bracciale domiciliato in questo comune… mi ha presentato una bambina di sesso femminile… e ha dichiarato che la stessa è nata dalla sua legittima moglie VINA MARIA di professione FILATRICE domiciliata in questo comune, nel giorno quattro del mese di aprile dell'anno corrente alle ore cinque pomeridiane nella casa di sua abitazione, sita in questo comune, STRADA MARCHESATO… il nome di VICENZINA.", "traduccion": "El año mil ochocientos setenta y cuatro, el día cinco del mes de abril, a las nueve de la mañana, en la casa comunal de CASTROLIBERO, distrito de Cosenza, provincia de Calabria Citra.\n\nAnte mí, SILVESTRO VINA, alcalde y oficial del Estado Civil del municipio susodicho, ha comparecido ANTONIO MORELLI, HIJO DE PAOLO, DE TREINTA Y DOS AÑOS, de profesión BRACCIALE (jornalero), domiciliado en este municipio.\n\nEl cual, en presencia de dos testigos elegidos por él —RAFFAELE PINCENTE, hijo del difunto Gaetano, de cuarenta y nueve años, y RAFFAELE COSTABILE, hijo de Pasquale, de treinta y dos años, ambos jornaleros domiciliados en este municipio—, me ha presentado UNA NIÑA de sexo femenino, según he reconocido con mis propios ojos.\n\nY ha declarado que la misma ha nacido de su legítima mujer MARIA VINA, de profesión FILATRICE (hilandera), domiciliada en este municipio, EL DÍA CUATRO DEL MES DE ABRIL del año corriente, A LAS CINCO DE LA TARDE, en la casa de su habitación, sita en este municipio, STRADA MARCHESATO.\n\nEl mismo declarante ha impuesto a la niña el nombre de VICENZINA.\n\nDe lo cual se ha formado la presente acta, inscrita en los dos registros; leída al declarante y a los testigos, ha sido firmada sólo por mí, ya que el declarante y los testigos han manifestado NO SABER ESCRIBIR.", "notas": ["Coincide con todo lo que se buscaba: los padres son exactamente los dos nombres que ella declaró en su boda de Rende de 1897 —Antonio Morelli y Maria Vina—, nació en Castrolibero, y el 17 de octubre de 1897 tenía veintitrés años cumplidos, que es la edad que declaró aquel día. Encaje perfecto, sin forzar nada.", "El acta añade un ascendiente nuevo de regalo: PAOLO MORELLI, padre de Antonio. El acta dice «figlio di Paolo», sin «fu», así que en abril de 1874 probablemente seguía vivo.", "El padre, Antonio Morelli, tenía treinta y dos años en abril de 1874: nació hacia 1842, y su acta habría que buscarla en los Nati de Castrolibero de esos años.", "OJO CON LA HOMONIMIA: el mismo índice de 1874 trae una MARCHESE VINCENZINA, acta 9, que no es ésta. Dos Vincenzinas del mismo año y del mismo pueblo, distinguibles sólo por el apellido.", "El apellido VINA es abundante en Castrolibero en 1874 —el índice trae cuatro Vina más— y el propio oficial del Estado Civil que firma el acta se llamaba Silvestro Vina.", "Nota de resolución: el escaneo original de esta página mide 5082 × 3984 píxeles, pero el servidor no entrega más de diez millones de píxeles por petición, de modo que la imagen de la página completa viene a 3570 × 2799. Los recortes de zoom SÍ están pedidos en coordenadas del original y a tamaño nativo: no están reescalados ni interpolados."], "imgs": [{"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20Vincenzina%20Morelli%20-%20Castrolibero%20acta%2017.jpg", "t": "Vincenzina Morelli - Castrolibero acta 17"}, {"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20indice%20anual%201874%20-%20Morelli%20Vincenzina%20acta%2017.jpg", "t": "Indice anual 1874 - Morelli Vincenzina acta 17"}], "zooms": [{"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20acta%2017%20completa.jpg", "t": "Acta 17 completa"}, {"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20linea%20del%20indice%20anual.jpg", "t": "Linea del indice anual"}, {"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20nombre%20impuesto%20Vincenzina.jpg", "t": "Nombre impuesto Vincenzina"}, {"u": "actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20padres%20Antonio%20Morelli%20y%20Maria%20Vina.jpg", "t": "Padres Antonio Morelli y Maria Vina"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "17 de octubre de 1897, 16 h", "lugar": "Rende", "ref": "acta 36", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Matrimoni» 1897"], ["Registro", "an_ua35985535 · hash wEVmEnd"], ["Página", "19 de 28"]], "literal": "Salerno Giovanni, di anni ventiquattro, celibe, nato in Castrolibero… figlio di Michele… e di Palermo Maria…", "traduccion": "El año mil ochocientos noventa y siete, el día diecisiete de octubre, a las cuatro de la tarde, en la casa comunal de Rende. Han comparecido:\n\n1.º SALERNO GIOVANNI, de veinticuatro años, soltero, nacido en Castrolibero, residente en Rende, hijo de Michele, residente en Rende, y de Palermo Maria, residente en Rende.\n\n2.º MORELLI VINCENZINA, de veintitrés años, soltera, nacida en Castrolibero, hija de Antonio, residente en Rende, y de Vina Maria, residente en Rende.\n\nDocumento presentado: el certificado de las amonestaciones celebradas los domingos tres y diez de octubre.\n\nTestigos: Pellicori Antonio, de treinta y dos años, cafetero; y Cianci Costantino, comerciante.\n\nHan dado su consentimiento Salerno Michele y Palermo Maria, padres del esposo; y Morelli Antonio y Vina Maria, padres de la esposa.", "notas": ["La edad (24) cuadra con su nacimiento el 24 de enero de 1873 en Castrolibero.", "Es la prueba del cambio de apellido: el mismo hombre inscrito como DE RANGO al nacer se casa como SALERNO.", "Sus padres seguían vivos en octubre de 1897 — tres años después de la boda de Francesco."], "imgs": [{"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20Giovanni%20Salerno%20y%20Vincenza%20Morelli%20-%20Rende%20acta%2036.jpg", "t": "Giovanni Salerno y Vincenza Morelli - Rende acta 36"}], "zooms": [{"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 6, "titulo": "Dos años y medio de matrimonio", "parrafos": ["Nació en Castrolibero hacia 1874, hija de Morelli Antonio y de Vina Maria. Su acta de nacimiento no se ha localizado: todo lo que se sabe de ella sale de dos actas de otros.", "Se casó el 17 de octubre de 1897, a las cuatro de la tarde, en la casa comunal de Rende, con Giovanni Salerno. Ella declaró veintitrés años; él, veinticuatro. Los testigos no fueron jornaleros, como en casi todas las bodas de esta familia, sino Pellicori Antonio, cafetero de treinta y dos años, y Cianci Costantino, comerciante. Los novios no firmaron.", "Su hijo Salvatore nació el 12 de enero de 1899 a las tres de la madrugada. Trece meses después, el 23 de febrero de 1900, murió su marido con veintiséis años. Se quedó viuda hacia los veintiséis, con un niño de trece meses. De su vida a partir de ahí no consta nada — salvo que el niño creció: en octubre de 1921 se casaba en Rende."], "claves": [["Nacida", "hacia 1874 en Castrolibero"], ["Casada a los", "23 años"], ["Viuda en", "febrero de 1900, con un hijo de trece meses"], ["Actas propias", "ninguna; consta en el matrimonio de 1897 y en la defunción de 1900"]]}, "angela_pizzi": {"id": "angela_pizzi", "nombre": "Angela Pizzi", "legal": "ANGIOLINA Pizzi — el nombre que le impone el acta", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["faienza"], "resumen": "Nacida en Atessa el 12 de febrero de 1869, hija del albañil Domenico Pizzi y de la hilandera Teresa Flocco. En 1892 casó con NICOLA FAIENZA, y la nota al margen de su propia partida de nacimiento es lo que ata esta rama al apellido Faienza.", "datos": [["Nacimiento", "12 de febrero de 1869, a las «ocho horas italianas», ATESSA — acta 65"], ["Nombre en el acta", "ANGIOLINA. En la familia se la llama Angela"], ["Padres", "Domenico Pizzi fu Giuseppe, 39 años, muratore, del rione del Castello; y Teresa Flocco fu Pasquale, 35 años, filatrice"], ["Residencia al nacer", "Atessa, rione del CASTELLO"], ["Matrimonio", "con NICOLA FAIENZA — anotado al margen del acta: «nel 1892 al N. 101 sposò Nicola Faienza», anotación fechada el 26 de agosto de 1893"], ["Hijo", "Domenico Faienza (hacia 1899-1900), sin acta localizada todavía"], ["Defunción", "sin localizar"]], "vida": "n.1869", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "domenico_pizzi", "madre": "teresa_flocco", "conyuge": "nicola_faienza", "hijos": ["domenico_faienza"], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "12 de febrero de 1869, 8 h «italianas»", "lugar": "Atessa (Chieti)", "ref": "acta 65", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1869, atti di nascita"], ["Registro", "hash del contenedor: LegbzDy"], ["Página", "31 de 228"], ["Colocación", "mitad de la plana izquierda; la nota marginal, en la columna de la izquierda"], ["Año manuscrito", "«mille ottocento sessantanove» — coincide con el catálogo"], ["Oficial", "Giuseppe Falcucci, sindaco y oficial del estado civil"], ["Cómo se localizó", "por el índice alfabético del final del registro (página 225 de 228), que da siete Pizzi: Nicola 17, ANGIOLINA 65, Amalia 81, Bambina 90, Filomena Giuditta 266, Filomena 280 y Rocco 312. Ninguna «Angela»"]], "literal": "Numero 65 — Angiolina Pizzi\nL'anno mille ottocento sessantanove, il giorno dodici del mese di Febbrajo, nella\nCasa Comunale di Atessa, alle ore sedici. Avanti di me Giuseppe Falcucci Sindaco,\ned uffiziale dello Stato civile del Comune di Atessa, Circondario di Vasto,\nProvincia di Chieti, è comparso DOMENICO PIZZI fu Giuseppe, d'anni trentanove,\nmuratore, domiciliato in Atessa nel rione del Castello, il quale mi ha presentato\nuna bambina di sesso femminile, che dichiara essergli nata il dì sopradetto, alle\nore otto italiane, da sua moglie TERESA FLOCCO fu Pasquale, d'anni trentacinque,\nfilatrice, seco lui domiciliata, alla quale figlia dichiara di dare il nome di\nANGIOLINA.\n[al margen] nel 1892 al N. 101 sposò Nicola Faienza — 26 agosto 93", "traduccion": "El año mil ochocientos sesenta y nueve, el día DOCE del mes de FEBRERO, en la Casa Comunal de Atessa, a las DIECISÉIS HORAS.\n\nAnte mí, GIUSEPPE FALCUCCI, Alcalde y oficial del Estado Civil del municipio de ATESSA, Distrito de VASTO, Provincia de CHIETI, ha comparecido DOMENICO PIZZI, HIJO DEL DIFUNTO GIUSEPPE, de TREINTA Y NUEVE años, ALBAÑIL, domiciliado en Atessa en el BARRIO DEL CASTELLO.\n\nEl cual me ha presentado UNA NIÑA de sexo femenino, que declara haberle nacido EL DÍA ARRIBA DICHO, a las OCHO HORAS ITALIANAS, DE SU MUJER TERESA FLOCCO, HIJA DEL DIFUNTO PASQUALE, de TREINTA Y CINCO años, HILANDERA, domiciliada con él; a la cual hija declara dar el nombre de ANGIOLINA.\n\nDicha declaración se ha hecho en presencia de FRANCESCO MARCUCCI (lectura dudosa), hijo del difunto Giuseppantonio, de cincuenta años, y de ALBERTO FARINA (lectura dudosa), hijo del difunto Domenico, de treinta y seis años, campesinos domiciliados en Atessa, testigos escogidos por el declarante; a los cuales he dado lectura de la presente acta, extendida a la vez en los dos registros originales, y no firmada más que por mí Y POR EL DECLARANTE, habiendo asegurado los testigos no saber escribir. — Domenico Pizzi. — El Oficial del Estado Civil, Giuseppe Falcucci.\n\nAL MARGEN, de otra mano: «En 1892, con el número 101, casó con NICOLA FAIENZA» — anotación fechada el 26 de agosto de 1893.", "notas": ["SE LLAMA ANGIOLINA, NO ANGELA. El acta le impone «Angiolina» y el índice del registro la recoge así. «Angela» es como la nombra la memoria familiar. Es la misma persona: lo prueban los padres.", "NACIÓ EL 12 DE FEBRERO, NO EL 17. El bloque familiar sin fuentes daba el 17 de febrero de 1869. El acta dice «il giorno DODICI del mese di Febbrajo» y que la niña nació «il dì sopradetto», ese mismo día. Cinco días de error, y son cinco días que confirman lo que ya se sabía de ese bloque: los datos están, pero no son fiables al detalle.", "LOS PADRES CUADRAN EXACTAMENTE. «Domenico Pizzi FU GIUSEPPE, muratore» y «Teresa Flocco FU PASQUALE, filatrice». Es la prueba que se buscaba, y de propina rescata dos abuelos: Giuseppe Pizzi y Pasquale Flocco, los dos ya muertos en febrero de 1869.", "LA NOTA AL MARGEN ES EL HALLAZGO GRANDE: «nel 1892 al N. 101 SPOSÒ NICOLA FAIENZA». La boda con el apellido Faienza deja de ser un dato de un árbol ajeno y pasa a estar escrita al margen de una partida original. Y dice dónde: la anotación está en el registro de ATESSA, con número de acta del propio municipio, así que el matrimonio se celebró EN ATESSA en 1892 (acta 101) y no en Paglieta.", "CONSECUENCIA INMEDIATA PARA BUSCAR A DOMENICO FAIENZA: si sus padres se casaron en Atessa en 1892 y la familia de ella es de Atessa de varias generaciones, el nacimiento del hijo hay que buscarlo en ATESSA, no en Paglieta. El índice de Paglieta 1899, que se ha leído entero, no tiene ni un Faienza.", "EL PADRE FIRMÓ. El formulario acaba «e non firmato che da me, E DAL DICHIARANTE, avendo asserito i testimoni di non saper scrivere», y debajo está la firma «Domenico Pizzi». Un albañil que sabe escribir en 1869, con dos testigos analfabetos al lado. En toda la rama calabresa de este árbol no hay una sola firma de un antepasado.", "«ORE OTTO ITALIANE»: el acta usa todavía la hora italiana, contada desde el atardecer. En Atessa, a mediados de febrero, ocho horas después de la puesta de sol son aproximadamente las dos de la madrugada."], "imgs": [{"u": "actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20Angela%20Pizzi%20%28Angiolina%29%20-%20Atessa%20acta%2065.jpg", "t": "Angela Pizzi (Angiolina) - Atessa acta 65"}], "zooms": [{"u": "actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20acta%2065%20completa.jpg", "t": "Acta 65 completa"}, {"u": "actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20nota%20al%20margen%2C%20en%201892%20caso%20con%20Nicola%20Faienza.jpg", "t": "Nota al margen, en 1892 caso con Nicola Faienza"}, {"u": "actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20padre%20Domenico%20Pizzi%20fu%20Giuseppe%20muratore%20y%20madre%20Teresa%20Flocco%20fu%20Pasquale.jpg", "t": "Padre Domenico Pizzi fu Giuseppe muratore y madre Teresa Flocco fu Pasquale"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "29 de diciembre de 1892, 11:15", "lugar": "Atessa (Chieti)", "ref": "acta 101", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1892, atti di matrimonio"], ["Registro", "hash del contenedor: wWpoWmX — 138 páginas"], ["Página", "103 de 138"], ["Año manuscrito", "«mille ottocento novantadue» — coincide con el catálogo"], ["Oficial", "Francesco Falcucci, assessore municipale delegado por el sindaco «con atto del venticinque novembre milleottocentottantanove, debitamente approvato»"], ["Cómo se localizó", "el número de acta ya se sabía por la nota al margen del acta 65 de 1869. El índice alfabético va en las páginas 135 a 138 y el matrimonio más alto que indexa es el 104. La página 110 es la portada de la PARTE II, así que la parte I ocupa las páginas 1 a 109 a razón de una acta por imagen; un sondeo en la página 60 dio el acta 58, o sea acta = página − 2, y la 103 dio la 101 a la primera. Cuatro imágenes en total"]], "literal": "Numero 101 — Faienza Nicola / Angiolina Pizzi\n\nL'anno mille ottocento novantadue, addì ventinove di Dicembre, a ore\nantimeridiane undici e minuti quindici, nella Casa Comunale di Atessa, aperto al\npubblico. Avanti di me Francesco Falcucci Assessore Municipale delegato dal\nSindaco con atto del venticinque novembre milleottocentottantanove, debitamente\napprovato, Ufficiale dello Stato Civile, vestito in forma ufficiale, sono\npersonalmente comparsi:\n\n1. NICOLA FAIENZA, di anni ventitré, contadino, nato in Atessa, residente in\nAtessa, figlio di GIUSEPPE, contadino, residente in Atessa, e della fu MARIA\nSTANISCIA, residente in vita in Atessa;\n\n2. ANGIOLINA PIZZI, di anni ventitré, donna di casa, nata in Atessa, residente in\nAtessa, figlia del fu DOMENICO, residente in vita in Atessa, e di TERESA FLOCCO,\nresidente in Atessa…\n\n…A questo atto sono stati presenti: Luzio Iannone, di anni ventidue, scrivano, e\nEmidio Flocco, di anni cinquantasei, caffettiere, entrambi residenti in questo\nComune. Il documento presentato è il certificato delle pubblicazioni eseguite da\nme Uffiziale dello Stato Civile di Atessa, cioè la prima nel dì diciotto e la\nseconda nel dì venticinque volgente Dicembre. Al suddetto matrimonio ha prestato\nil consenso IL PADRE DELLO SPOSO, come risulta ed è spiegato dall'atto di\nrichiesta delle pubblicazioni. — (a) le parole interlineate «vita in» valgano per\nnon scritte. Letto il presente atto a tutti gl'intervenuti, gli sposi ed i\ntestimoni si sono meco sottoscritti.\n\nFaienza Nicola · Angiolina Pizzi · Luzio Iannone testimone · Emidio Flocco\ntestimone · L'Ufficiale dello Stato Civile, Francesco Falcucci", "traduccion": "El año mil ochocientos noventa y dos, el día VEINTINUEVE DE DICIEMBRE, a las ONCE Y QUINCE de la mañana, en la casa comunal de ATESSA, abierta al público.\n\nAnte mí, FRANCESCO FALCUCCI, asesor municipal delegado por el alcalde mediante acta del veinticinco de noviembre de mil ochocientos ochenta y nueve, debidamente aprobada, Oficial del Estado Civil, vestido de forma oficial, han comparecido personalmente:\n\n1.º NICOLA FAIENZA, de VEINTITRÉS AÑOS, CAMPESINO, NACIDO EN ATESSA, residente en Atessa, HIJO DE GIUSEPPE, campesino, residente en Atessa, Y DE LA DIFUNTA MARIA STANISCIA, que en vida residió en Atessa.\n\n2.º ANGIOLINA PIZZI, de VEINTITRÉS AÑOS, ama de casa, nacida en Atessa, residente en Atessa, HIJA DEL DIFUNTO DOMENICO, que en vida residió en Atessa, Y DE TERESA FLOCCO, residente en Atessa.\n\nLos cuales me han pedido unirlos en matrimonio. A tal efecto me han presentado un solo documento; leídos a los esposos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y habiendo preguntado al esposo si quiere tomar por mujer a la aquí presente ANGIOLINA PIZZI, y a ésta si quiere tomar por marido al aquí presente NICOLA FAIENZA, y habiendo respondido cada uno afirmativamente, he pronunciado en nombre de la ley que quedan unidos en matrimonio.\n\nTesti
