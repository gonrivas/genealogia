 mes de MAYO del año mil novecientos TRECE, HIJO NATURAL de Don ———— (el nombre del padre queda EN BLANCO) y de Doña ROSA BUDIÑO, natural de ARGENTINA, DE VEINTICINCO AÑOS de edad, domiciliada en esta Parroquia.\n\nSiendo sus padrinos Don FRANCISCO MARTÍNEZ ZUVIRÍA, natural de Argentina, de VEINTIDÓS años de edad, domiciliado en Santa Fe; y Doña MERCEDES C. MONTIER, natural de Argentina, de CUARENTA Y CUATRO años de edad, domiciliada en Santa Fe. — Al margen: «Gratis».", "notas": ["*** ESTE ACTA SE LEYÓ MAL LA PRIMERA VEZ Y AL CORREGIRLA CAMBIA DE SIGNO. *** Se transcribió «mil novecientos DIEZ». Ampliada la palabra manuscrita —es la misma en las tres líneas del acta— no lleva el rabo de la «z» de «diez»: dice *** TRECE ***. Francisco nació el 10 DE MAYO DE 1913. Lo advirtió Gonzalo al ver la ficha.", "*** Y ASÍ SÍ PUEDE SER EL HERMANO QUE FALTA. *** Ramón Marcos nació en noviembre de 1909 y Francisco en mayo de 1913: TRES AÑOS Y MEDIO entre uno y otro. Con la lectura errónea salían cinco meses y medio, biológicamente imposibles, y por eso el acta se había descartado. La objeción desaparece. Y encaja con lo que Gonzalo recordaba: un hermano que iba a visitarlo de viejo, menor pero no mucho más chico.", "*** LA EDAD DE ROSA TAMBIÉN MEJORA. *** Declara VEINTICINCO AÑOS en agosto de 1913, o sea nacida hacia 1888: tendría VEINTIUNO al nacer Ramón Marcos. Con el año mal leído salían veinticuatro — el error movía la cuenta sin romperla, y por eso no saltaba a la vista.", "«HIJO NATURAL» y la casilla del padre EN BLANCO: Francisco fue inscrito sin padre reconocido y con el apellido de la madre. Es exactamente el patrón que la memoria familiar atribuye a Ramón Rivas —hijos con varias mujeres, sin casarse—, y es la razón de que esta pista mereciera comprobarse.", "*** SIGUE SIN ESTAR PROBADO QUE SEA NUESTRA ROSA. *** Que las fechas ya no se contradigan no convierte la coincidencia en prueba: sólo devuelve la pista a la mesa. QUÉ LO RESOLVERÍA: la partida de nacimiento de Ramón Marcos, en Cayastacito o el departamento de San Justo, noviembre de 1909. Daría la edad exacta de SU Rosa Budiño, y con ella cuál de las dos es."], "imgs": [{"u": "actas/1913%20-%20Rosa%20Budino/1913-08-20%20N%20Bautismo%20de%20Francisco%20hijo%20natural%20de%20Rosa%20Budino%20-%20Catedral%20de%20Santa%20Fe.png", "t": "Bautismo de Francisco hijo natural de Rosa Budino - Catedral de Santa Fe"}], "zooms": []}, {"titulo": "El hogar Budiño en el censo nacional de 1895", "tipo": "C", "tipoNombre": "Certificado", "fecha": "mayo de 1895", "lugar": "La Capital, Santa Fe, Argentina", "ref": "cédula censal, líneas 7 a 15", "fuente": [["Archivo", "Archivo General de la Nación (Argentina)"], ["Colección", "Segundo Censo Nacional de la República Argentina, 1895"], ["Cómo se encontró", "FamilySearch, grupo de imágenes 004159962, imagen 236 de 512 — hallado por Gonzalo el 31 de agosto de 2026"], ["Estado de la prueba", "*** NO ESTÁ PROBADO que sea la familia de nuestra Rosa ***"]], "literal": "", "traduccion": "Un hogar Budiño en el departamento La Capital, líneas 7 a 15 de la cédula. Las columnas son apellido y nombre, sexo, años cumplidos, estado civil, nación, provincia si es argentino, profesión y si sabe leer y escribir.\n\n· BUDIÑO ANASTASIO, varón, 35 años, casado, argentino, nacido en SANTA FE, de profesión ESTANCIERO.\n· BUDIÑO LUISA, mujer, argentina, nacida en CÓRDOBA.\n· ÁLVAREZ TERESA, mujer, 24 años, argentina, Santa Fe.\n· BUDIÑO JUANA, 17 años, soltera, argentina.\n· BUDIÑO ROSARIO, 20 años, soltero, argentino, JORNALERO.\n· BUDIÑO IRINEO, 7 años · BUDIÑO ISLANIO, 5 años · BUDIÑO FERNANDO, 2 años · BUDIÑO ROSA, 1 año.\n\n(Varias edades y algún nombre son de lectura dudosa: la letra es fina y el escaneo pálido.)", "notas": ["*** ESTA ROSA BUDIÑO ES LA CANDIDATA DÉBIL, Y LA RAZÓN ES LA EDAD. *** Aquí tiene UN AÑO en mayo de 1895, o sea nacida hacia 1894. Tendría QUINCE al nacer Ramón Marcos en noviembre de 1909. No es imposible, pero la del bautismo de 1913 —nacida hacia 1888, veintiuno entonces— encaja mucho mejor. Lo más probable es que en Santa Fe hubiera al menos DOS Rosa Budiño.", "LO QUE SÍ APORTA, Y NO ES POCO: que los BUDIÑO de La Capital eran ESTANCIEROS. Anastasio Budiño, de treinta y cinco años, figura con esa profesión. *** Y Ramón Rivas era HACENDADO. *** Dos familias de propietarios de campo en la misma provincia y en los mismos años. No prueba nada por sí solo, pero encaja socialmente y da una dirección de búsqueda.", "AVISO DE LECTURA: la edad de Rosa está escrita con letra muy fina y podría ser otra cifra. Si en vez de «1» pusiera «10», habría nacido en 1885 y andaría cerca de la bautismo. NO SE PUEDE AFIRMAR NI DESCARTAR con este escaneo.", "BUDIÑO ES APELLIDO GALLEGO, de Pontevedra y Ourense. Que el hogar sea de gente nacida en Santa Fe y Córdoba dice que llevaban ya al menos una generación en el país."], "imgs": [{"u": "actas/1913%20-%20Rosa%20Budino/1895%20C%20Censo%20Nacional%20-%20hogar%20Budino%2C%20La%20Capital%2C%20Santa%20Fe.png", "t": "Censo Nacional - hogar Budino, La Capital, Santa Fe"}], "zooms": []}], "nActas": 2, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "ramon_rivas": {"id": "ramon_rivas", "nombre": "Ramón Rivas", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 8, "ramas": ["rivas"], "resumen": "Bisabuelo paterno de Gonzalo, y durante toda esta investigación «el hombre que se borró»: tuvo hijos con varias mujeres y desapareció de la vida de la familia. El 31 de agosto de 2026 dejó de ser una suposición. Dos actas del Registro Civil lo nombran, y no como se esperaba: ARGENTINO, DOMICILIADO EN SAN JUSTO y de profesión HACENDADO.", "datos": [["Confirmado por acta", "*** SÍ, y por dos ***: el matrimonio de su hijo (Jobson, 1948, acta 15) y la partida de defunción de su hijo (Santa Fe, 2002, tomo 5°B acta 1237). Hasta ese día su nombre venía sólo de la memoria familiar"], ["Nacionalidad", "ARGENTINO — no inmigrante, contra lo que podía suponerse"], ["Domicilio", "SAN JUSTO, provincia de Santa Fe, en abril de 1948 — y estaba VIVO entonces, porque el acta no lo marca como fallecido, cosa que sí hace con la madre"], ["Oficio", "*** HACENDADO. *** En la Argentina de entonces, propietario de campo. No era un jornalero, y eso cambia por dónde hay que buscarlo: los hacendados dejan rastro en escrituras, padrones y prensa local"], ["Mujer conocida", "ROSA BUDIÑO, madre de Ramón Marcos y ya difunta en 1948. No consta que estuvieran casados"], ["Hijos", "RAMÓN MARCOS (Cayastacito, noviembre de 1909) y al menos un hermano suyo, sin nombre. Con varias mujeres, así que el número real se desconoce"], ["El hermano sin nombre, ¿es Francisco?", "*** HAY UN CANDIDATO Y AHORA CUADRA. *** Un FRANCISCO, hijo natural de una Rosa Budiño, fue bautizado en la catedral de Santa Fe el 20 de agosto de 1913: tres años y medio menor que Ramón Marcos, y sin padre en el acta. Encaja con el hermano que Gonzalo recuerda. NO ESTÁ PROBADO"], ["Nacimiento", "sin fecha. Con un hijo nacido en 1909, estaría entre 1875 y 1890"], ["Vivo aún en", "abril de 1948 — el acta de matrimonio de su hijo no lo marca como fallecido, cosa que sí hace con la madre. Su muerte es POSTERIOR a esa fecha"], ["Cuántos Rivas había", "*** MEDIDO, NO SUPUESTO. *** En el censo provincial de Santa Fe de 1887 hay SESENTA Y CINCO Rivas en toda la provincia, y UN SOLO VARÓN llamado Ramón Rivas. *** No es un apellido común aquí ***: lo es en España, pero en esta provincia estaba concentrado en SAN JAVIER — uno de cada 550 habitantes, cuarenta y seis veces más denso que en Rosario"], ["En San Justo no había ninguno", "*** CERO Rivas en el departamento de San Justo en 1887 ***, sobre 1.655 personas indexadas. Y él vivía allí en 1948. Luego la familia llegó después: no es de San Justo de toda la vida"], ["La memoria familiar, comprobada", "Gonzalo recuerda a su familia siempre en VERA, SAN JUSTO, CAYASTÁ y CAYASTACITO, y nunca en San Javier. Se comprobó en el censo de 1887: *** CERO Rivas en los cuatro sitios ***, sobre cuatro mil personas indexadas. No es que la memoria falle: es que en 1887 no había Rivas en ese corredor, y por tanto la familia llegó después"], ["Los núcleos Rivas más cercanos", "HELVECIA, 8 personas, en el Paraná justo al sur de Cayastá — ninguna llamada Ramón. Y SAN JAVIER, 24, al norte de Cayastá y al sur de Vera, en el mismo río. Así que San Javier no es un sitio lejano: está dentro del corredor. El que sí queda lejos es ROSARIO, a más de trescientos kilómetros"], ["El de San Javier es de CORRIENTES", "*** Y esto abre una provincia entera. *** Se reconstruyó su hogar en el censo de 1887: la madre, VARVARITA RIVAS, de 34 años, y sus siete hermanos —Rosa, Gregoria, Aparicio, Vicente, otra Varvarita y Nicacio— *** NACIERON TODOS EN CORRIENTES ***, incluido el de dos años. La familia llegó a San Javier entre 1885 y 1887. El jefe del hogar no aparece: ella consta como «esposa», así que había marido, ausente ese día o en otra parte del padrón"], ["Los dos candidatos", "*** EL DE ROSARIO ***, cuatro años en 1895, nacido hacia 1890-91, tendría DIECIOCHO en 1909. *** EL DE SAN JAVIER ***, doce años en 1887, nacido hacia 1875, tendría TREINTA Y CUATRO en 1909 y setenta y tres en 1948. El segundo encaja mejor con «hacendado» y está en el departamento donde el apellido se concentra. NINGUNO ESTÁ PROBADO"], ["Reconoció a su hijo", "*** SÍ, y se sabe por el apellido. *** Ramón Marcos lleva RIVAS. La prueba de que la regla funciona está en este mismo archivo: Francisco, bautizado en 1913, es «hijo natural», la casilla del padre queda en blanco y el niño lleva BUDIÑO, el apellido de la madre. Falta saber CUÁNDO lo reconoció: al nacer, o después por nota al margen"], ["Fuente", "las dos actas de su hijo, archivadas en la ficha de él"]], "vida": "†>1948", "lug": "", "mapa": null, "sinacta": "*** CONFIRMADO POR ACTA EL 31 DE AGOSTO DE 2026, y con un perfil que nadie esperaba. *** Durante toda esta investigación su ficha decía «en teoría Ramón — el nombre viene de la tradición familiar, no de un papel». Ahora hay dos papeles, con cincuenta y cuatro años y dos declarantes distintos entre ellos, y los dos dicen lo mismo: RAMÓN RIVAS.\n\n*** Y ERA HACENDADO. *** El acta de matrimonio de su hijo lo describe como ARGENTINO, DOMICILIADO EN SAN JUSTO y de profesión HACENDADO. Eso da la vuelta a la imagen que se tenía de él: un propietario de campo, no un jornalero. Y cambia dónde buscarlo, porque los hacendados dejan rastro donde los jornaleros no: escrituras, padrones de contribuyentes, avisos y esquelas en la prensa local, sociedades rurales.\n\n*** ESTABA VIVO EN ABRIL DE 1948. *** El impreso marca «fallecida» a la madre del novio y no marca nada en él: es la forma que tienen estos formularios de distinguir a los padres muertos. Su hijo se casaba con treinta y ocho años y él seguía en San Justo.\n\n*** LO QUE HAY QUE PEDIR AHORA, POR ORDEN. *** Primero la PARTIDA DE NACIMIENTO DE SU HIJO —Cayastacito, San Justo, noviembre de 1909—, que diría su edad y su domicilio de entonces y si reconoció al niño o no. Después su propia DEFUNCIÓN en el departamento de San Justo, posterior a abril de 1948. Y su MATRIMONIO, si es que lo hubo: nada dice que estuviera casado con Rosa Budiño.\n\n*** Y AHORA HAY DOS CANDIDATOS, MEDIDOS SOBRE EL CENSO DE 1887. *** Gonzalo temía que buscar a un «Ramón Rivas» fuera imposible por lo común del nombre. Se midió en vez de suponerlo: en toda la provincia de Santa Fe hay SESENTA Y CINCO Rivas y UN SOLO VARÓN llamado Ramón. No es un apellido común aquí.\n\n   · EL DE ROSARIO — cuatro años en el censo de 1895, nacido hacia 1890-91. Tendría DIECIOCHO al nacer Ramón Marcos.\n   · EL DE SAN JAVIER — doce años en el censo de 1887, nacido hacia 1875. Tendría TREINTA Y CUATRO en 1909 y setenta y tres en 1948, y está en el departamento donde el apellido se concentra: uno de cada quinientos cincuenta habitantes.\n\nEl de San Javier encaja mejor con «hacendado» — a los treinta y cuatro un hombre puede tener campo propio; a los dieciocho es mucho más raro. *** Pero ninguno de los dos está probado, y una sola cifra los separa ***: la edad del padre en la partida de nacimiento de 1909, ya pedida. Dieciocho, gana Rosario; treinta y cuatro, gana San Javier; otra cosa, caen los dos.\n\nSIGUE FALTANDO EL HERMANO. El hermano sin nombre que fue a visitar a Marcos Ramón de viejo es todavía el dato de mayor rendimiento de esta rama: con su partida, otro documento nombraría a Ramón y quizá diría de qué madre. Marcos César y sus hermanos vivieron esa visita y pueden saber el nombre.", "padre": null, "madre": null, "conyuge": "rosa_budino", "hijos": ["marcos_ramon_rivas", "hermano_marcos_ramon"], "hermanos": [], "actas": [{"titulo": "Un candidato: el Ramón Rivas de cuatro años de Rosario", "tipo": "C", "tipoNombre": "Certificado", "fecha": "mayo de 1895", "lugar": "Rosario, departamento Rosario, Santa Fe, Argentina", "ref": "cédula censal, líneas 2 a 8", "fuente": [["Archivo", "Archivo General de la Nación (Argentina)"], ["Colección", "Segundo Censo Nacional de la República Argentina, 1895 — Rosario"], ["Cómo se encontró", "FamilySearch, grupo de imágenes 004160727, imagen 69 de 400 — hallado por Gonzalo el 31 de agosto de 2026"], ["Estado de la prueba", "*** CANDIDATO SIN PROBAR. *** Nada lo ata a nuestro Ramón más que el nombre y la edad"]], "literal": "", "traduccion": "Un hogar del censo de Rosario, líneas 2 a 8 de la cédula:\n\n· *** RIVAS RAMONA R. DE ***, mujer, CUARENTA años, VIUDA, de ESPAÑA, de profesión AGRICULTORA. Declara *** ONCE HIJOS TENIDOS *** y VEINTIÚN años de matrimonio.\n· RIVAS ERBARIA, 17 años, soltera, argentina, sabe leer.\n· RIVAS IDA, 15 años, soltera, argentina, sabe leer.\n· RIVAS MIGUEL, 8 años, argentino, sabe leer y escribir.\n· *** RIVAS RAMÓN, CUATRO AÑOS ***, argentino.\n· RIVAS ISABEL, 3 años, argentina.\n\nEn la misma casa: Yamondi Joaquina R. de, 19, casada; Yamondi Antonio, 26, de España, jornalero; tres criaturas Yamondi; y tres hombres solos —Fabo Francisco, 34, de Francia, criado; un José de Italia, 34, peón; y otro José de Italia, 30, agricultor—. Es una casa de chacra con peones alojados.", "notas": ["*** ES UN CANDIDATO, Y HAY QUE DECIR DE ENTRADA POR QUÉ NO ES UNA PRUEBA. *** RIVAS es de los apellidos más comunes de España y de Argentina, y RAMÓN de los nombres más comunes. La combinación no distingue a nadie. Este archivo ya ha tropezado con esto cuatro veces —cuatro Vincenzo Salerno distintos en Chicago, dos Rosa Budiño en Santa Fe—, así que la coincidencia de nombre no basta.", "*** LO QUE SÍ ENCAJA. *** Con cuatro años en mayo de 1895 habría nacido hacia 1890 o 1891, y tendría DIECIOCHO cuando nació Ramón Marcos en noviembre de 1909. Es una edad perfectamente normal para ser padre, y encaja con un hombre que —según la memoria familiar— tuvo hijos con varias mujeres desde joven. Y es ARGENTINO, que es lo que dice de él el acta de 1948.", "*** LO QUE NO ENCAJA, O NO SE SABE. *** Nuestro Ramón vivía en SAN JUSTO en 1948 y era HACENDADO; éste es hijo de una viuda AGRICULTORA en ROSARIO, a ciento setenta kilómetros. No es incompatible —un hijo de chacareros puede acabar con campo propio— pero no hay nada que una las dos puntas.", "SI FUERA ÉL, SE GANARÍA MUCHO DE GOLPE: una madre, RAMONA, viuda y española, con ONCE HIJOS declarados; un padre Rivas ya muerto en 1895; y cinco hermanos con nombre. Pero eso es lo que se ganaría, no lo que se sabe.", "*** CÓMO SE COMPRUEBA, Y ES BARATO. *** La partida de nacimiento de Ramón Marcos —Cayastacito, San Justo, noviembre de 1909— tiene que dar la EDAD y el DOMICILIO de su padre. Si dice dieciocho años y Rosario o Santa Fe, este candidato se vuelve serio. Si dice treinta y cinco, queda descartado de un plumazo."], "imgs": [{"u": "actas/1895%20-%20Ramon%20Rivas%2C%20el%20candidato%20de%20Rosario/1895%20C%20Censo%20Nacional%20-%20hogar%20de%20la%20viuda%20Ramona%20Rivas%2C%20Rosario.png", "t": "Censo Nacional - hogar de la viuda Ramona Rivas, Rosario"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "hermano_marcos_ramon": {"id": "hermano_marcos_ramon", "nombre": "Hermano de Marcos Ramón", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 9, "ramas": ["rivas"], "resumen": "Fue a visitar a Marcos Ramón cuando los dos ya eran viejos. Era igual a él. No sabemos su nombre.", "datos": [["Padre", "Ramón Rivas"], ["Lo que se recuerda", "que apareció de visita ya de mayores y que el parecido entre los dos era total"], ["Fuente", "memoria familiar"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Sin nombre, y es justo el dato que más rendiría: con su nombre y su partida se fija de golpe el nombre completo del padre. Se lo puede preguntar a Marcos César y a sus hermanos, que vivieron esa visita.", "padre": "ramon_rivas", "madre": null, "conyuge": null, "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "tebaldo_celeri": {"id": "tebaldo_celeri", "nombre": "Tebaldo Celeri", "legal": "TEBALDO JACOPO ARCHIMEDE CELERI en su partida de nacimiento", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 8, "ramas": ["celeri"], "resumen": "Bisabuelo paterno de Gonzalo. Emigró de Italia y acabó en el norte de Santa Fe, en Jobson, junto a la estación de Vera. Enviudó de su primera mujer y volvió a casarse en 1900, con treinta y ocho años, con una chica de diecinueve. Durante meses fue en este árbol un hueco sin nombre: «el inmigrante Celeri». El 27 de agosto de 2026 dejó de serlo.", "datos": [["Nacimiento", "*** 25 DE JULIO DE 1862, a las ocho de la mañana, en TRASSILICO (Garfagnana, provincia de Massa, hoy de Lucca) — acta 52 ***"], ["Nombre completo", "TEBALDO JACOPO ARCHIMEDE. Tres nombres, y dos de ellos cultos: Jacopo y ARCHIMEDE, por Arquímedes. No es un nombre de campesino"], ["Dónde nació", "en casa de la señora LUISA VANNI, en el paraje de Trassilico llamado ALLA MAESTÀ. Casa de la familia de su madre, no del padre"], ["Bautizado", "el mismo día de nacer, por don DOMENICO GRANDI, párroco de Trassilico"], ["Padres", "CALLISTO CELERI, de 31 años, SECRETARIO DEL AYUNTAMIENTO de Trassilico, hijo del difunto DESIDERIO; y ENRICHETTA VANNI, de 27, hija del difunto DOCTOR PIETRO VANNI"], ["Primera mujer", "ENCARNACIÓN FERNÁNDEZ. En octubre de 1900 él ya era VIUDO de ella"], ["Segunda mujer", "MARGARITA ALASIA, de diecinueve años, natural de Colonia Emilia — casados en VERA (Santa Fe) el 25 de octubre de 1900"], ["Domicilio", "JOBSON, estación de Vera, departamento Vera, norte de la provincia de Santa Fe. Zona de colonias agrícolas fundadas por inmigrantes"], ["Hijos conocidos", "del primer matrimonio, ENRIQUETA (hacia 1894). Del segundo, ELBA y sus hermanas Olga, Ercilia, Rosa y Nerina"], ["Origen", "*** TRASSILICO, provincia de LUCCA, en la Garfagnana toscana — CONFIRMADO el 27 de agosto de 2026. *** Los dos actos argentinos decían sólo «natural de Italia»; lo que lo fija es el acta de defunción de su MADRE, que murió en Trassilico en 1923. La memoria familiar acertó el pueblo exacto"], ["Casa de la familia", "TRASSILICO, VIA DEL CENTRO, NÚMERO 17 — la dirección donde murió su madre, y el sitio del que salió hacia Argentina. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["La calle, hoy", "VIA DEL CENTRO YA NO EXISTE. Se le pidieron a OpenStreetMap todas las calles con nombre de Trassilico y son once, ninguna con ese nombre: Via Antonio Vallisneri, Via San Ansano, Via Leonardo Nobli, Via della Quercia, Via di Mezzo, Via Borghetto, Via Caraglia delle Gioie, Via della Fontana, y las plazas Umberto I, Giovanni Pierelli y Guglielmo Marconi. Los nombres cambiaron."], ["Calle probable", "VIA ANTONIO VALLISNERI. Medidas las once calles una por una: Via della Fontana tiene 2.085 m pero es la carretera de acceso desde el valle, fuera del casco. Dentro del pueblo las mayores son San Ansano (362 m) y VIA ANTONIO VALLISNERI (335 m) — y el centro de Vallisneri cae en 44.04151, 10.40348, que es exactamente el centroide del pueblo. ES LA CALLE CENTRAL. Y ANTONIO VALLISNERI (1661-1730), naturalista famoso, NACIÓ EN TRASSILICO: es el hijo ilustre del pueblo. https://www.google.com/maps/search/?api=1&query=Via+Antonio+Vallisneri%2C+Trassilico%2C+Gallicano%2C+Lucca"], ["Por qué cambió", "TRASSILICO FUE MUNICIPIO PROPIO hasta que Gallicano lo absorbió, hacia 1928. Cuando dos municipios se fusionan hay que renombrar las calles con nombre repetido, y «Via del Centro» es justo el tipo de nombre genérico que colisiona — Gallicano tendría la suya. Lo lógico es que la de Trassilico pasara a llamarse por el hijo ilustre. Y encaja con las fechas: Enrichetta murió en Via del Centro 17 en 1923, CINCO AÑOS ANTES de la fusión. Ese nombre era el vivo entonces. TODO ESTO ES INFERENCIA, no documento."], ["Alternativa", "Hay un número 17 realmente cartografiado, en VIA LEONARDO NOBLI (44.04216, 10.40396), junto a la Rocca Estense. Pero ésa es la calle del extremo norte, no el centro. En cambio Vallisneri tiene mapeados sólo los portales PARES, del 16 al 32: los impares no los ha cartografiado nadie, así que un 17 ahí es perfectamente posible y sencillamente no figura."], ["Cómo probarlo", "El STRADARIO del Comune di Gallicano, que suele conservar la concordancia entre nombres viejos y nuevos. Es una pregunta de dos líneas por correo: comunegallicano@postacert.toscana.it"], ["La iglesia", "SS. PIETRO E PAOLO de Trassilico — donde lo bautizaron el mismo día de nacer y donde se habían casado sus padres tres años antes. Es el edificio que sí está localizado. https://www.google.com/maps/search/?api=1&query=Chiesa+dei+Santi+Pietro+e+Paolo%2C+Trassilico%2C+Gallicano%2C+Lucca"]], "vida": "n.1862", "lug": "TRASSILICO", "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico, Garfagnana — provincia de Lucca", "pie": "El pueblo donde nació el 25 de julio de 1862, a las ocho de la mañana. Cabe entero en doscientos cincuenta metros de norte a sur: lo que se ve aquí es todo Trassilico. La casa de VIA DEL CENTRO, 17 está en una de estas calles — esa calle ya no se llama así, y la candidata más probable es la VIA ANTONIO VALLISNERI, que atraviesa el centro justo por debajo del marcador. Al norte, a ochenta metros, la ROCCA ESTENSE. Al este, la iglesia de SAN PIETRO (44.04207, 10.40551), donde lo bautizaron el mismo día de nacer y donde sus padres se habían casado tres años antes."}, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": "margarita_alasia", "hijos": ["elba_celeri", "enriqueta_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["ciro_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "25 de julio de 1862, 8 de la mañana; inscrito el 30", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 52", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240 en Antenati)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 51.5 «Nati» 1862"], ["Registro", "ark an_ua35853262 · hash del contenedor: 5xxX6OE (30 imágenes)"], ["Página", "18 de 30 — folio 15 del libro; tres actas por página"], ["Oficial", "RANIERI BERTOLI BARSOTTI, sindaco y oficial del estado civil"], ["Cómo se localizó", "por el índice alfabético del final del registro, páginas 28 y 29: «Celeri Tebaldo Jacopo Archimede — paternità Callisto — 1862, Luglio 30, atto 52»"]], "literal": "52. L'anno 1862 milleottocento sessantadue, il giorno 30 trenta del mese di Luglio. Davanti me sottoscritto BERTOLI BARSOTTI RANIERI, Sindaco ufficiale dello Stato Civile del Comune di TRASSILICO, Circondario di GARFAGNANA, Provincia di MASSA, è comparso CELERI CALLISTO FU DESIDERIO, di anni 31 trentuno, SEGRETARIO COMUNALE, il quale, presenti Andreini Michele fu Matteo di anni 60 sessanta e Andreini Pietro fu Carlo di anni 30, ambidue DOTTORI FISICI e domiciliati tutti in Trassilico, ha dichiarato che nel giorno 25 venticinque del mese ed anno suddetti, alle ore 8 otto antemeridiane, gli è nato in casa della Signora VANNI LUISA posta in Trassilico luogo detto ALLA MAESTÀ, da CELERI ENRICHETTA DEL FU VANNI DOTTOR PIETRO di anni 27 ventisette sua consorte, un figlio di sesso mascolino, cui furono imposti i nomi di TEBALDO JACOPO ARCHIMEDE, e come dalla fede del Battesimo conferitogli dal Signor Don DOMENICO GRANDI Parroco locale il giorno stesso della sua nascita, che si unisce.", "traduccion": "Acta 52. El año 1862, el día TREINTA DE JULIO. Ante mí, RANIERI BERTOLI BARSOTTI, alcalde y oficial del Estado Civil del MUNICIPIO DE TRASSILICO, distrito de la GARFAGNANA, provincia de MASSA, ha comparecido:\n\nCALLISTO CELERI, HIJO DEL DIFUNTO DESIDERIO, de TREINTA Y UN AÑOS, SECRETARIO DEL AYUNTAMIENTO.\n\nEl cual, en presencia de MICHELE ANDREINI, hijo del difunto Matteo, de sesenta años, y PIETRO ANDREINI, hijo del difunto Carlo, de treinta, AMBOS MÉDICOS y domiciliados los tres en Trassilico, ha declarado que el día VEINTICINCO del mismo mes y año, A LAS OCHO DE LA MAÑANA, le ha nacido —en la casa de la señora LUISA VANNI, sita en Trassilico, en el paraje llamado ALLA MAESTÀ— de ENRICHETTA CELERI, HIJA DEL DIFUNTO DOCTOR PIETRO VANNI, de VEINTISIETE AÑOS, su esposa, un hijo de sexo masculino, al que se le han impuesto los nombres de TEBALDO JACOPO ARCHIMEDE.\n\nY así consta en la fe de bautismo que le confirió don DOMENICO GRANDI, párroco local, EL MISMO DÍA DE SU NACIMIENTO, y que se adjunta.", "notas": ["*** ES LA PARTIDA QUE CIERRA LA RAMA CELERI, Y APARECIÓ EL 27 DE AGOSTO DE 2026, EL MISMO DÍA QUE EL PUEBLO. *** Cuarenta y ocho horas antes, el padre de Elba era «un inmigrante italiano, creo que del norte», sin nombre.", "*** LA FAMILIA NO ERA CAMPESINA, Y ESTO CAMBIA EL RETRATO ENTERO. *** El padre era SEGRETARIO COMUNALE —el secretario del ayuntamiento de Trassilico, el hombre que escribía las actas del pueblo—. El abuelo materno era DOCTOR EN MEDICINA. Los dos testigos eran MÉDICOS. Y al niño le pusieron ARCHIMEDE, por Arquímedes. Compárese con la rama calabresa, donde todos, sin excepción, son braccianti, pecorai y contadini.", "*** GENERACIÓN NUEVA: DESIDERIO CELERI. *** «Celeri Callisto FU DESIDERIO» — el padre de Callisto, ya muerto en 1862. Con Callisto de 31 años en 1862, Desiderio sería de la generación de 1800 o antes.", "LA EDAD DE LA MADRE ENCAJA AL DEDILLO. Aquí tiene 27 años en julio de 1862 → nacida hacia 1835. Su acta de defunción de 1923 le da 88 años → nacida hacia 1835. Dos documentos separados por sesenta y un años y por mil kilómetros de archivo, con la misma cifra.", "PIETRO VANNI NO ERA MÉDICO SINO ABOGADO, y esto hay que rectificarlo: de este acta se dedujo que «dottor Pietro» significaba médico, y no. El acta de matrimonio de su otra hija, Luisa, en abril de 1863, lo dice sin ambigüedad: «di professione LEGALE, nato in LUCCA». Era hombre de leyes y venía de la ciudad. Ya había muerto en 1862.", "NACIÓ EN CASA DE LA SEÑORA LUISA VANNI, en el paraje de ALLA MAESTÀ — y el 27 de agosto de 2026 se supo quién era: *** LA HERMANA MAYOR DE SU MADRE. *** El acta de matrimonio de Luisa, de abril de 1863, la declara hija de los mismos padres. Tebaldo nació en casa de su tía carnal: Enrichetta fue a parir a casa de su hermana. Sesenta y un años después su madre moriría en la VIA DEL CENTRO, número 17. Son dos direcciones distintas del mismo pueblo.", "«TRASSILICO, CIRCONDARIO DI GARFAGNANA, PROVINCIA DI MASSA». En 1862 la Garfagnana pertenecía a la provincia de MASSA, no a la de Lucca. Por eso sus registros están en el Archivio di Stato di Massa y no en el de Lucca — dato que costó encontrar y que conviene no olvidar."], "imgs": [{"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Fe%20de%20bautismo%20de%20Tebaldo%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Tebaldo - parroquia de Trassilico"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Nacimiento%20de%20Tebaldo%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2052.jpg", "t": "Nacimiento de Tebaldo Celeri - Trassilico, Lucca acta 52"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Portada%20del%20fasciculo%20de%20anexos%20-%20Atti%20di%20Nascita%20n%2052.jpg", "t": "Portada del fasciculo de anexos - Atti di Nascita n 52"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20Celeri%20Tebaldo%20fila%2014.jpg", "t": "Indice alfabetico de nacidos 1862 - Celeri Tebaldo fila 14"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20segunda%20mitad.jpg", "t": "Indice alfabetico de nacidos 1862 - segunda mitad"}], "zooms": [{"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20Callisto%20del%20fu%20Desiderio%20del%20fu%20DOMENICO%20CELERI.jpg", "t": "Callisto del fu Desiderio del fu DOMENICO CELERI"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20comparece%20Celeri%20Callisto%20fu%20Desiderio.jpg", "t": "Acta 52, comparece Celeri Callisto fu Desiderio"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20la%20madre%20Enrichetta%20Vanni%20y%20los%20tres%20nombres.jpg", "t": "Acta 52, la madre Enrichetta Vanni y los tres nombres"}, {"u": "actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20la%20madre%2C%20hija%20del%20fu%20Vanni%20DOTTOR%20Pietro.jpg", "t": "La madre, hija del fu Vanni DOTTOR Pietro"}]}, {"titulo": "Censo Nacional de 1895", "tipo": "C", "tipoNombre": "Certificado", "fecha": "mayo de 1895", "lugar": "Vera, departamento Vera, Santa Fe, Argentina", "ref": "cédula censal, filas 8 a 10", "fuente": [["Archivo", "Archivo General de la Nación (Argentina)"], ["Fondo", "Segundo Censo Nacional de la República Argentina, 1895 — Vera, Vera, Santa Fe; imagen 520 de 626, grupo de imágenes 004163156"], ["Vía", "FamilySearch"]], "literal": "8 · Celeri · Tebaldo · V · 33 · C · Italia · — · Peluquero · sí\n9 · Fernandez · Concepción · M · 25 · C · Argentina · Córdoba · — · sí\n10 · Celeri · Enriqueta · M · 3 · — · Argentina · Santa Fe · — · —", "traduccion": "Las columnas de la cédula son: apellido, nombre, si es varón o mujer, cuántos años ha cumplido, si es soltero / casado / viudo, a qué nación pertenece, si es argentino en qué provincia nació, qué profesión u oficio tiene, y si sabe leer y escribir.\n\n· **TEBALDO CELERI**, varón, TREINTA Y TRES años, CASADO, de nación ITALIANA, de profesión **PELUQUERO**, sabe leer y escribir.\n· **CONCEPCIÓN FERNÁNDEZ**, mujer, VEINTICINCO años, CASADA, ARGENTINA, nacida en la provincia de **CÓRDOBA**, sabe leer y escribir.\n· **ENRIQUETA CELERI**, mujer, TRES años, ARGENTINA, nacida en **SANTA FE**.\n\nEn la misma página viven una familia Campana de nacionalidad francesa, unos Arzonga comerciantes y dependientes, un Peralta y un Moirad: el retrato de un pueblo de frontera agrícola recién fundado, con franceses, italianos y argentinos mezclados.", "notas": ["*** ES LA FOTOGRAFÍA DE LA PRIMERA FAMILIA DE TEBALDO, CINCO AÑOS ANTES DE ENVIUDAR. *** Los tres seguidos en la cédula: el matrimonio y la niña. Es el único documento en que aparecen juntos.", "LA EDAD CUADRA AL DÍA. Treinta y tres años en 1895 → nacido en 1862, que es exactamente lo que dice su partida de Trassilico: 25 de julio de 1862. Dos archivos separados por el Atlántico y por treinta y tres años, con la misma cifra.", "*** ERA PELUQUERO. *** No agricultor ni jornalero, como casi todos sus vecinos. Y sabe leer y escribir. Encaja con la familia que dejó en Trassilico: un padre secretario del ayuntamiento y un abuelo médico.", "*** Y AQUÍ LA PRIMERA MUJER DEJA DE SER UN NOMBRE SUELTO. *** El acta de defunción de su hija, en 1946, la llamaba ENCARNACIÓN FERNÁNDEZ. El censo, cincuenta y un años antes y en vida de ella, la llama **CONCEPCIÓN FERNÁNDEZ**. Son dos advocaciones marianas y se confunden con facilidad medio siglo después; lo más probable es que el nombre bueno sea el del censo, escrito cuando ella estaba delante.", "Y da lo que faltaba de ella: **ARGENTINA, NACIDA EN LA PROVINCIA DE CÓRDOBA, de veinticinco años en 1895 → nacida hacia 1870**. No era italiana. Su acta de nacimiento estaría en Córdoba, y su matrimonio con Tebaldo —anterior a 1892— en Santa Fe.", "ENRIQUETA TENÍA TRES AÑOS EN 1895 → nacida hacia 1892. Su acta de defunción de 1946 le da cincuenta y dos años, que darían 1894. Dos años de diferencia; se prefiere el censo, tomado cuando la niña estaba viva y delante.", "VERA ERA UN PUEBLO NUEVO. El departamento Vera se colonizó en los años ochenta del siglo XIX; en 1895 Tebaldo llevaba ya unos quince años en Argentina y era el peluquero del sitio."], "imgs": [{"u": "actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20Censo%20de%20Vera%2C%20Santa%20Fe%20-%20pagina%20del%20padron.jpg", "t": "Censo de Vera, Santa Fe - pagina del padron"}], "zooms": [{"u": "actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20zoom%20-%20censo%2C%20filas%208%20a%2010%3A%20Tebaldo%2C%20Concepcion%20Fernandez%20y%20Enriqueta.jpg", "t": "Censo, filas 8 a 10: Tebaldo, Concepcion Fernandez y Enriqueta"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "25 de octubre de 1900", "lugar": "Vera, Santa Fe, Argentina", "ref": "libro parroquial, folio 101", "fuente": [["Archivo", "Archivo de la Notaría Mayor Eclesiástica de la Arquidiócesis de Santa Fe"], ["Fondo", "Colonia Dolores, San Justo, Santa Fe — imagen 57 de 164, grupo de imágenes 004518108"], ["Vía", "FamilySearch"], ["Oficiante", "el párroco de Vera"]], "literal": "En Vera, el día veinticinco del mes de Octubre del año de mil novecientos, autorizó el Matrimonio de Don TEBALDO CELERI de treinta y ocho años, natural de Italia, de estado VIUDO, hijo legítimo de Don CALISTO CELERI y de Doña ENRIQUETA VANNI, domiciliado en Jobson (Est. Vera), con Doña MARGARITA ALASIA de diecinueve años, natural de Col. Emilia, de estado soltera, hija legítima de Don BENITO ALASIA y de Doña MAGDALENA BERTINI, domiciliada en Vera, siendo testigos del acto Don DOMINGO ALASIA y Doña MARÍA DE ALASIA.", "traduccion": "El acta está en español y se transcribe tal cual. Lo que dice, dato a dato:\n\n· ÉL: Tebaldo Celeri, TREINTA Y OCHO AÑOS (nacido hacia 1862), natural de ITALIA —sin especificar pueblo—, de estado VIUDO, hijo legítimo de CALISTO CELERI y ENRIQUETA VANNI, domiciliado en JOBSON, junto a la estación de Vera.\n· ELLA: Margarita Alasia, DIECINUEVE AÑOS, natural de COLONIA EMILIA (Santa Fe), soltera, hija legítima de BENITO ALASIA y MAGDALENA BERTINI, domiciliada en Vera.\n· TESTIGOS: Domingo Alasia y María de Alasia — parientes de ella.", "notas": ["*** ESTA ACTA CONVIERTE UN HUECO EN UNA PERSONA. *** Hasta ayer, el padre de Elba era «un inmigrante italiano, creo que del norte», sin nombre. Ahora tiene nombre, año de nacimiento, pueblo argentino, dos matrimonios y dos padres.", "«DE ESTADO VIUDO» — y ahí estaba escondida una familia entera. El acta de defunción de su hija Enriqueta, en Chaco en 1946, nombra como madre a ENCARNACIÓN FERNÁNDEZ. Es la primera mujer, la que murió antes de 1900. Hay por tanto una rama Celeri-Fernández anterior, sin explorar.", "DIECINUEVE AÑOS ELLA, TREINTA Y OCHO ÉL. Justo el doble. Un viudo de mediana edad casándose con la hija de otra familia de colonos: el patrón más corriente del norte santafesino de entonces.", "ESTA ACTA NO DICE DE QUÉ PUEBLO ERA — pone sólo «natural de Italia». Lo resolvió, el mismo día, un documento que nadie fue a buscar para eso: el acta de defunción de su MADRE, muerta en TRASSILICO (Lucca) en 1923. Los papeles de un emigrante rara vez dicen de dónde vino; los de quien se quedó, siempre.", "JOBSON existe todavía: es una localidad del departamento Vera, en el norte de Santa Fe, nacida alrededor de la estación del ferrocarril."], "imgs": [{"u": "actas/1862%20-%20Tebaldo%20Celeri/1900-10-25%20M%20Matrimonio%20de%20Tebaldo%20Celeri%20y%20Margarita%20Alasia%20-%20Vera%2C%20Santa%20Fe.jpg", "t": "Matrimonio de Tebaldo Celeri y Margarita Alasia - Vera, Santa Fe"}], "zooms": []}], "nActas": 3, "nImgs": 12, "titulo": "", "parrafos": [], "claves": []}, "margarita_alasia": {"id": "margarita_alasia", "nombre": "Margarita Alasia", "legal": "hija de «Benito Alasia y Magdalena Bertini» en el acta", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["celeri"], "resumen": "Bisabuela paterna de Gonzalo. Nacida en Colonia Emilia, en el corazón de las colonias agrícolas piamontesas de Santa Fe, y casada a los diecinueve años con un viudo italiano que le doblaba la edad.", "datos": [["Nacimiento", "hacia 1882, COLONIA EMILIA, provincia de Santa Fe — los diecinueve años que declara al casarse. Argentina de nacimiento, italiana de sangre"], ["Padres", "BENEDETTO (Benito) ALASIA y MARIA MADDALENA BERTINO — por su acta de matrimonio de 1900"], ["Matrimonio", "25 de octubre de 1900, Vera, Santa Fe, con Tebaldo Celeri"], ["Hijas", "Elba, Olga, Ercilia, Rosa y Nerina Celeri. Puede haber más"], ["Origen de su familia", "SAVIGLIANO, provincia de CUNEO, PIAMONTE — sus padres se casaron allí, en la iglesia de San Giovanni Battista, el 13 de abril de 1857"]], "vida": "n.c.1882", "lug": "COLONIA EMILIA", "mapa": null, "sinacta": "Su acta de matrimonio está archivada en la ficha de Tebaldo. Falta su partida de nacimiento —Colonia Emilia, hacia 1881— y su defunción.\n\nUNA DEDUCCIÓN QUE SÍ ES FIRME, Y QUE CAMBIA DÓNDE HAY QUE BUSCAR. El acta de 1900 dice que era «natural de COL. EMILIA» y que tenía DIECINUEVE AÑOS. Nació, por tanto, EN ARGENTINA, hacia 1881. Y si ella nació aquí, SUS PADRES YA HABÍAN DESEMBARCADO ANTES DE 1881 — es decir, ANTES DE QUE EMPEZARA EL REGISTRO DEL CEMLA, que arranca en 1882. Por eso no hay que perder tiempo buscándolos en las listas de desembarco: llegaron antes de que existieran.\n\nY POR LO MISMO SE CAE UNA PISTA QUE PARECÍA BUENA. En CISEI figura un grupo familiar ALASIA completo desembarcado el 25 de febrero de 1882 —Bartolomeo de 17, Battista de 14, Clemente de 8 y un Bartolomeo de seis meses—. Se anotó como «verificar». NO PUEDE SER ESTA FAMILIA: llegan después de que Margarita naciera en Colonia Emilia, y una madre con un bebé de seis meses en febrero de 1882 no puede haber tenido otra hija en 1881. Queda descartado.\n\n*** APARECIÓ EN EL CENSO DE 1887, CON CINCO AÑOS. *** Colonia Emilia, tomo 12, libreto 12: «ALAZIO MARGARITA, 5, Argentina, Santa Fe», hija de OLAZIO BENEDETTO de 65 y de BERTINA MADALENA de 47. Con ella, sus hermanos DOMINGO (24, ya casado con MARÍA MOLINA), NICOLÁS (15), JUAN (11), FRANCISCO (9), MARÍA (7) y MADALENIA (1). Su madre declara CATORCE HIJOS.\n\nSUS DOS HERMANOS MAYORES FIRMARON SU BODA. Los testigos del acta de 1900, «Don DOMINGO ALASIA y Doña MARÍA DE ALASIA», son ese Domingo y su mujer.\n\nY EL CENSO FECHA LA EMIGRACIÓN sin necesidad de listas de barco: Domingo (n. 1863) y Nicolás (n. 1872) nacieron en Italia; Juan (n. 1876) ya nació en Santa Fe. LA FAMILIA DESEMBARCÓ ENTRE 1872 Y 1876 — diez años antes de que existiera el registro del CEMLA, que es exactamente por lo que nunca aparecían en él.\n\nLOS TESTIGOS DE SU BODA SON FAMILIA SUYA, casi con seguridad: Don DOMINGO ALASIA y Doña MARÍA DE ALASIA — «de Alasia» es la fórmula argentina de la mujer casada. Un hermano y una cuñada. Buscarlos es otra manera de llegar a los padres.\n\nSU APELLIDO ABRE UNA SEGUNDA ITALIA, Y NO ES LA MISMA. Los Alasia vienen de SAVIGLIANO, en la provincia de CUNEO, Piamonte; los Celeri, según la familia, de la Toscana. La abuela Elba tenía por tanto un padre italiano y una madre hija de italianos, de dos regiones distintas del norte. La memoria familiar decía «del norte» y acertaba dos veces.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "tebaldo_celeri", "hijos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["domingo_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "encarnacion_fernandez": {"id": "encarnacion_fernandez", "nombre": "Concepción Fernández", "legal": "«Encarnación Fernández» en el acta de defunción de su hija, de 1946", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["celeri"], "resumen": "La primera mujer de Tebaldo Celeri, y no era italiana: argentina de CÓRDOBA. Durante un día fue en este árbol sólo un nombre sacado del acta de defunción de una hija; el censo de 1895 la puso viva, con edad, provincia y a su lado el marido y la niña.", "datos": [["Nombre", "CONCEPCIÓN en el censo de 1895, tomado en vida suya. ENCARNACIÓN en el acta de defunción de su hija, cincuenta y un años después. Se prefiere el censo"], ["Nacimiento", "hacia 1870, provincia de CÓRDOBA, Argentina — los veinticinco años que declara en el censo de 1895"], ["Nacionalidad", "ARGENTINA. Sabe leer y escribir"], ["Cónyuge", "TEBALDO CELERI, peluquero. Casados antes de 1892"], ["Hija conocida", "ENRIQUETA CELERI, de tres años en 1895 → nacida hacia 1892"], ["En 1895", "vive en VERA, Santa Fe, con su marido y su hija"], ["Muerta entre", "mayo de 1895 y el 25 de octubre de 1900, cuando Tebaldo se casa VIUDO"], ["De dónde sale", "el censo nacional de 1895 (filas 8 a 10) y el acta de defunción de su hija — Villa Ángela, Chaco, 1946, acta 88"]], "vida": "n.c.1870", "lug": "Argentina", "mapa": null, "sinacta": "Faltan sus padres, su partida y su defunción — pero ya se sabe dónde buscarlas.\n\nSU NACIMIENTO, hacia 1870, estaría en la provincia de CÓRDOBA: registro civil o parroquia. SU MATRIMONIO con Tebaldo es anterior a 1892 y sería de Santa Fe o de Córdoba; nombraría a sus padres y —lo que durante días fue la pregunta abierta de esta rama— el pueblo italiano de él. SU DEFUNCIÓN cae entre mayo de 1895 y octubre de 1900, en Vera o alrededores: una ventana de cinco años y medio, estrecha y rastreable.\n\nY SI TUVO MÁS HIJOS, hay medios hermanos de Elba sin descubrir. En 1895 sólo consta Enriqueta, de tres años, pero entre esa fecha y su muerte pudo tener más.", "padre": null, "madre": null, "conyuge": "tebaldo_celeri", "hijos": ["enriqueta_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "enriqueta_celeri": {"id": "enriqueta_celeri", "nombre": "Enriqueta Celeri", "legal": "Enriqueta C. de González", "rol": "hermano", "rolNombre": "Hermano", "gen": 9, "ramas": ["celeri"], "resumen": "Hija del primer matrimonio de Tebaldo, y media hermana de Elba. Lleva el nombre de su abuela italiana. Murió en el Chaco en 1946.", "datos": [["Nacimiento", "hacia 1892, en la provincia de SANTA FE — los tres años que le da el censo de 1895, tomado en vida. Su acta de defunción de 1946 le da cincuenta y dos años, que darían 1894: se prefiere el censo"], ["En 1895", "vive en VERA con sus padres, Tebaldo y Concepción"], ["Nombre", "ENRIQUETA, por su abuela paterna Enrichetta Vanni"], ["Padres", "TEBALDO CELERI y ENCARNACIÓN FERNÁNDEZ"], ["Cónyuge", "CASIMIRO GONZÁLEZ, que en 1946 tenía cincuenta y ocho años"], ["Oficio", "«Domésticos» según el acta"], ["Defunción", "15 de agosto de 1946, a las 21 h, en VILLA ÁNGELA, departamento Río Zapallar, Territorio Nacional del Chaco — acta 88"], ["Causa", "hemorragia meníngea, certificada por el doctor José V. Fender"]], "vida": "c.1892–1946", "lug": "", "mapa": null, "sinacta": "", "padre": "tebaldo_celeri", "madre": "encarnacion_fernandez", "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "15 de agosto de 1946, 21 h; inscrita el 16", "lugar": "Villa Ángela, Chaco", "ref": "acta 88", "fuente": [["Archivo", "Registro Civil de los Territorios Nacionales — Chaco"], ["Fondo", "Villa Ángela, Mayor Luis J. Fontana, Chaco — imagen 94 de 225, grupo de imágenes 107171596"], ["Vía", "FamilySearch"]], "literal": "NÚMERO ochenta y ocho. En Villa Ángela, Departamento Río Zapallar, Territorio Nacional del Chaco, República Argentina, a diez y seis de Agosto de mil novecientos cuarenta y seis, Yo, Encargado del Registro del Estado Civil, procedo a inscribir la DEFUNCIÓN de: ENRIQUETA C. DE GONZÁLEZ, de nacionalidad Argentina, de sexo femenino, edad cincuenta y dos años, de profesión Domésticos, de estado casada, domiciliada en Villa Ángela. Ocurrida en Villa Ángela a las veintiuna horas del día quince del mes de Agosto de mil novecientos cuarenta y seis, diagnóstico Hemorragia meníngea. La persona fallecida es hija de: TEBALDO CELERI […] y de ENCARNACIÓN FERNÁNDEZ. Esta inscripción se efectúa según declaración prestada por CASIMIRO GONZÁLEZ, estado casado, edad cincuenta y ocho años, domiciliado en Villa Ángela, quien ha visto el cadáver. Ante el testigo HÉCTOR J. CARRARA, estado soltero, edad veintinueve años.", "traduccion": "El acta está en español y se transcribe literalmente.", "notas": ["*** ES LA QUE DESTAPA EL PRIMER MATRIMONIO DE TEBALDO. *** El acta de 1900 lo daba «viudo» y no decía de quién. Ésta, cuarenta y seis años más tarde y en otra provincia, nombra a la madre: ENCARNACIÓN FERNÁNDEZ. Dos documentos que no se conocen entre sí encajando por una esquina.", "SE LLAMABA ENRIQUETA COMO SU ABUELA ITALIANA, Enrichetta Vanni, que en 1894 seguía viva en Italia y murió en 1923. Tebaldo le puso a su hija el nombre de su madre, a diez mil kilómetros.", "MURIÓ EN EL CHACO, no en Santa Fe. La familia se movió hacia el norte, a la frontera agrícola: Villa Ángela era entonces territorio nacional, no provincia.", "Quedan por buscar sus hermanos: si Tebaldo y Encarnación tuvieron más hijos, son medios hermanos de Elba y hay descendencia argentina sin localizar."], "imgs": [{"u": "actas/1946%20-%20Enriqueta%20Celeri/1946-08-15%20D%20Muerte%20de%20Enriqueta%20Celeri%20de%20Gonzalez%20-%20Villa%20Angela%2C%20Chaco%20acta%2088.jpg", "t": "Muerte de Enriqueta Celeri de Gonzalez - Villa Angela, Chaco acta 88"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "calisto_celeri": {"id": "calisto_celeri", "nombre": "Callisto Celeri", "legal": "«Calisto» en el acta argentina de 1900", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["celeri"], "resumen": "SECRETARIO DEL AYUNTAMIENTO DE TRASSILICO — el hombre que escribía las actas del pueblo. Nacido hacia 1831, hijo de un Desiderio Celeri ya difunto. Padre de Tebaldo, y la prueba de que esta familia no era campesina.", "datos": [["Nombre", "CALLISTO en el acta italiana de 1923; «Calisto» en la argentina de 1900. Del latín Callistus. Es raro, y por eso el más fácil de rastrear de toda la rama"], ["Nacimiento", "entre noviembre de 1830 y julio de 1831 — declara TREINTA Y UN AÑOS en noviembre de 1861 y otra vez en julio de 1862, lo que encierra la fecha"], ["Padre", "DESIDERIO CELERI, ya difunto en 1862 — «Celeri Callisto FU Desiderio»"], ["Oficio", "*** POSSIDENTE E SEGRETARIO COMUNALE *** del Comune di Trassilico. Las dos cosas: tenía propiedades y llevaba el registro civil y la correspondencia del municipio. Ocho actas de 1861 y 1862 lo describen exactamente así"], ["Cómo lo trataban", "las actas lo llaman SIGNORE: «alla presenza delli SIGNORI Andreini Dottor Pietro… e Celeri Callisto». Él y el médico eran los dos testigos de oficio del pueblo — los dos únicos hombres con letras de un municipio donde casi todos los declarantes firman «per essere illetterato»"], ["Pueblo", "TRASSILICO, entonces circondario de Garfagnana, provincia de MASSA"], ["Cónyuge", "ENRICHETTA VANNI, de Trassilico (hacia 1835 – 9 de septiembre de 1923). Casados el 30 de enero de 1859 en la iglesia de Trassilico"], ["Hijo conocido", "TEBALDO CELERI, nacido hacia 1862, emigrado a Argentina"], ["Muerto antes de", "septiembre de 1923 — su mujer figura VIUDA en el acta de ese mes"], ["De dónde sale", "el acta de matrimonio de su hijo (Vera, Santa Fe, 1900) y el acta de defunción de su mujer (Trassilico, Lucca, 1923), que la llama «moglie di CELERI CALLISTO» y lo corrige a «vedova»"]], "vida": "1830–<1923", "lug": "", "mapa": null, "sinacta": "Tres actas lo nombran y ninguna es suya. La de su hijo, en Argentina, y la de su mujer, en Trassilico — que lo da ya muerto en septiembre de 1923, al corregir «esposa» por «viuda» en el margen.\n\nFaltan su nacimiento, su matrimonio y su defunción, y los tres estarían en TRASSILICO (Lucca): los registros civiles italianos empiezan en 1866, y antes hay libros parroquiales. Si su mujer nació hacia 1835 y su hijo en 1862, la boda sería de los años cincuenta o comienzos de los sesenta.\n\nCALLISTO es el nombre que más rinde de toda esta rama. En un pueblo de montaña de trescientos vecinos, un Callisto Celeri no se confunde con nadie.", "padre": "desiderio_celeri", "madre": "angela_menghi", "conyuge": "enrichetta_vanni", "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": [], "actas": [{"titulo": "Su letra", "tipo": "F", "tipoNombre": "Acta", "fecha": "1858 a 1866", "lugar": "Trassilico, Garfagnana", "ref": "ocho actas de siete registros distintos del Comune di Trassilico", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico — registros 54.7 (Morti 1858), 53.1 (Matrimoni 1859), 53.3 (Matrimoni 1861), 51.5 (Nati 1862), 51.7 (Nati 1864) y 51.8 (Nati 1865)"]], "literal": "Compilato dal sottoscritto SEGRETARIO COMUNALE il presente Indice questo giorno 30 Gennajo 1859. — CELERI", "traduccion": "Cuatro muestras de la misma mano, sacadas de cuatro registros distintos:\n\n· **1858** — al pie del índice alfabético de difuntos: «Compilado por el infrascrito SECRETARIO MUNICIPAL el presente índice, hoy 30 de enero de 1859. — Celeri». **Ese índice lo escribió él entero**, y lo firmó SEIS DÍAS ANTES DE CASARSE.\n· **1859** — «Celeri Callisto, dichiarante», al pie de su propia acta de matrimonio.\n· **1861** — «Celeri Callisto, testimone», en la boda de Maria Celeri, la hija de Nicolao.\n· **1862** — «Celeri Callisto, dichiarante», el día que fue a inscribir a Tebaldo.\n· **1863, enero** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», cerrando el índice de matrimonios de 1862.\n· **1863, abril** — «Celeri Callisto, testimone», en la boda de su cuñada LUISA VANNI con el doctor Matteo Vincenti.\n· **1864** — «Celeri Callisto, testimone», el 3 de julio, haciendo de testigo en el bautizo civil del hijo de un vecino.\n· **1866** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», cerrando el índice de nacidos de 1865. **Es la última firma suya que se conoce.**", "notas": ["*** HASTA DÓNDE LLEGA LA CERTEZA, Y CONVIENE DECIRLO. *** Lo que está probado es que estas firmas dicen «CELERI» y el cargo «SEGRETARIO COMUNALE», y que Callisto era el secretario del ayuntamiento de Trassilico — eso consta en ocho actas entre 1859 y 1862. De ahí a afirmar que escribió de su puño el cuerpo entero de cada índice hay un paso que NO está demostrado: un secretario podía firmar el trabajo de un amanuense. Lo que sí es suyo con seguridad son las FIRMAS: «Celeri Callisto, dichiarante» al pie de su acta de boda y de la de Tebaldo, y «Celeri» cerrando los índices.\n\n*** Y ESTAS FIRMAS FECHAN SU CARRERA, QUE ERA LO QUE SE BUSCABA. *** Se venía intentando averiguar cuándo dejó Callisto la secretaría, porque de eso dependía estrechar la fecha de su muerte. Ahora hay suelo firme: en 1864 firma como testigo en las actas 24, 25, 47, 48, 49, 52 y 53 del registro de nacidos, siempre como «Celeri Callisto fu Desiderio, SEGRETARIO COMUNALE»; y a principios de 1866 todavía es él quien compila y firma el índice de nacidos de 1865. **SEGUÍA EN EL CARGO EN 1866, con treinta y seis años.** Lo que venga después ya es registro civil italiano y no está en Antenati.\n\n*** AUN ASÍ, ES LO ÚNICO FÍSICO QUE QUEDA DE ÉL. *** De ninguna otra persona de este árbol —ciento cuarenta y una, doscientos años— se conserva un rasgo del cuerpo salvo la descripción de Antonio Salerno en su ficha de reclutamiento de 1942. De Callisto queda su letra.", "Firma como secretario los índices anuales de defunciones de 1856, 1857, 1858, 1860 y 1861 — cada año, a finales de enero, cerraba el del año anterior. Los índices que hemos barrido buscando a su padre llevan su firma al pie.", "*** Y ESO ABRE UNA VÍA PARA FECHAR SU MUERTE. *** Si firmaba cada año, el año en que su firma desaparece acota cuándo dejó el cargo. En el índice de 1865 —el último del fondo— YA NO ESTÁ: lo autentica «D.r PIETRO ANDREINI, ufficiale dello stato civile», el mismo médico que fue testigo del nacimiento de Tebaldo. PERO CUIDADO: el formato del registro cambió entre medias, con la unificación de Italia, y la línea del secretario sencillamente ya no aparece. La ausencia NO prueba que hubiera muerto. Lo que lo acotaría de verdad son los índices de 1862, 1863 y 1864.", "LA COINCIDENCIA DEL 30 DE ENERO DE 1859. Ese día firmó el índice de difuntos del año anterior… y ese mismo día se casó con Enrichetta en la iglesia de Trassilico. La boda por la mañana o por la tarde, y el trabajo terminado igual.", "Su firma es corta y decidida —«Celeri», con una rúbrica larga por debajo— frente a la letra escolar y trabajosa de los declarantes que sí sabían escribir, y frente a las decenas de actas del mismo registro que terminan «omessa la firma per essere illetterato»."], "imgs": [{"u": "actas/1830%20-%20Callisto%20Celeri/1858%20F%20caligrafia%20-%20firma%20Celeri%20al%20pie%20del%20indice%20de%20difuntos%20de%201858.jpg", "t": "1858 F caligrafia - firma Celeri al pie del indice de difuntos de 1858"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1859%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20en%20su%20propia%20acta%20de%20boda.jpg", "t": "1859 F caligrafia - Celeri Callisto Dichiarante en su propia acta de boda"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1861%20F%20caligrafia%20-%20Celeri%20Callisto%20testimone%20en%20la%20boda%20de%20Maria%20Celeri.jpg", "t": "1861 F caligrafia - Celeri Callisto testimone en la boda de Maria Celeri"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1862%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20al%20inscribir%20a%20Tebaldo.jpg", "t": "1862 F caligrafia - Celeri Callisto Dichiarante al inscribir a Tebaldo"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20matrimonios%20de%201862%20-%20Trassilico.jpg", "t": "1863-01 F Firma de Callisto cerrando el indice de matrimonios de 1862 - Trassilico"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1864-07-03%20F%20Firma%20de%20Callisto%20Celeri%20como%20testigo%20-%20Trassilico%20acta%2048.jpg", "t": "1864-07-03 F Firma de Callisto Celeri como testigo - Trassilico acta 48"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20nacidos%20de%201865%20-%20Trassilico.jpg", "t": "1866-01 F Firma de Callisto cerrando el indice de nacidos de 1865 - Trassilico"}, {"u": "actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Indice%20de%20nacidos%20de%201865%2C%20pagina%20de%20cierre%20-%20Trassilico.jpg", "t": "1866-01 F Indice de nacidos de 1865, pagina de cierre - Trassilico"}], "zooms": [{"u": "actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20zoom%20-%20Celeri%20Segretario%20Comunale%20al%20pie%20del%20indice%20de%20matrimonios%20de%201862.jpg", "t": "1863-01 F Firma Celeri Segretario Comunale al pie del indice de matrimonios de 1862"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "30 de enero de 1859 la boda; 4 de febrero el acta civil", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 3", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Registro", "ark an_ua35853344 · hash del contenedor: 03QyK9Z (18 imágenes)"], ["Página", "5 de 18 — el acta 3 ocupa el centro de la hoja"], ["Cómo se localizó", "por el índice alfabético del final (página 18), fila «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». Antes se habían descartado 1861 y 1860 leyendo sus índices completos"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Acta 3. El año 1859, el día CUATRO DE FEBRERO. Ante mí, oficial del Estado Civil del MUNICIPIO DE TRASSILICO, provincia de Garfagnana, ha comparecido CALLISTO CELERI, de VEINTIOCHO AÑOS, PROPIETARIO Y SECRETARIO DEL MUNICIPIO, nacido y domiciliado en Trassilico, HIJO DEL DIFUNTO DESIDERIO.\n\nEn presencia de ERMENEGILDO GALANTI, hijo del vivo Felice, y de GIOVANNI REBECHI, hijo del difunto Paolino, ambos mayores de edad, propietarios y domiciliados en Trassilico, ha expuesto: QUE EL DÍA TREINTA DE ENERO del corriente año se celebró su matrimonio con la SEÑORA ENRICHETTA VANNI, HIJA DEL DIFUNTO DOCTOR PIETRO, de VEINTICUATRO AÑOS, sin profesión, nacida y domiciliada en Trassilico, ante el señor don Grandi, párroco.\n\nFE DEL PÁRROCO: «El infrascrito párroco da fe de que el señor CALLISTO, hijo del difunto DESIDERIO CELERI, de veintiocho años, nacido y domiciliado en Trassilico, PROPIETARIO y SECRETARIO MUNICIPAL, y la señora ENRICHETTA VANNI, de veinticuatro años, nacida también y domiciliada en Trassilico, PROPIETARIA, celebraron el treinta de enero de 1859 su matrimonio según los ritos de la Iglesia católica ante mí, en presencia de PIETRO BONETTI, hijo del difunto Antonio, y PIETRO MENGHI, hijo del difunto Luigi, testigos ambos de Trassilico. Y en fe de ello, desde la casa parroquial de Trassilico, hoy 4 de febrero de 1859. DOMENICO GRANDI, rector.»", "notas": ["*** ES LA BODA QUE SE BUSCABA, Y COSTÓ TRES AÑOS DE ÍNDICES. *** Se descartaron primero 1861 (cuarenta bodas) y 1860, leyendo sus índices alfabéticos completos, antes de dar con ella en 1859. Ese método —una imagen de índice por año en vez de un registro entero— es lo que hizo viable la búsqueda.", "LAS EDADES CUADRAN CON TODO LO DEMÁS. Él, veintiocho en febrero de 1859 → nacido hacia 1830-31, igual que los treinta y uno que declara en 1861 y 1862. Ella, veinticuatro → nacida hacia 1834-35, igual que los veintisiete de 1862 y los ochenta y ocho de su defunción de 1923. Cuatro documentos, sesenta y cuatro años y dos archivos distintos, todos apuntando al mismo par de fechas.", "*** LOS DOS ERAN «POSSIDENTI» — PROPIETARIOS. *** Y ella por derecho propio: la fe del párroco la llama possidente, no «hija de». En un pueblo de montaña donde el acta vecina describe a los novios como «agricoltore» y «agricoltrice», y donde la mayoría firma «per essere illetterato», este matrimonio es el de dos propietarios que saben escribir. Sus dos testigos civiles también son possidenti.", "LO QUE EL ACTA NO DA, Y HAY QUE DECIRLO: NO NOMBRA A LAS MADRES. De él sólo «figlio del fu Desiderio»; de ella sólo «figlia del fu Dr. Pietro». La madre de Callisto sigue sin conocerse. La de Enrichetta —LIVIA RIGHINI— la sabemos por otra vía: su acta de defunción de 1923.", "SE CASARON EN ENERO Y TEBALDO NACIÓ EN JULIO DE 1862 — tres años y medio después. Si no hubo hijos entre medias, y los índices de nacidos de 1861 y 1862 no traen ninguno, quedan por barrer 1859 y 1860.", "DON DOMENICO GRANDI los casó en 1859 y bautizó a Tebaldo en 1862. El mismo cura, en el mismo pueblo, en las dos actas más importantes de esta rama."], "imgs": [{"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "enrichetta_vanni": {"id": "enrichetta_vanni", "nombre": "Enrichetta Vanni", "legal": "«Doña Enriqueta Vanni» en el acta argentina de 1900", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["celeri"], "resumen": "Tatarabuela paterna de Gonzalo. Nació y murió en TRASSILICO, un pueblo de montaña de la Garfagnana, en la provincia de Lucca, y vivió ochenta y ocho años sin salir de él. Su acta de defunción es la que le puso pueblo a toda esta rama: hasta que apareció, de Tebaldo sólo se sabía que era «natural de Italia».", "datos": [["Nacimiento", "hacia 1835, TRASSILICO, provincia de Lucca, Toscana — los ochenta y ocho años que le da su acta de defunción"], ["Padres", "PIETRO VANNI y LIVIA RIGHINI, los dos de Trassilico y los dos ya muertos en 1923"], ["Cónyuge", "CALLISTO CELERI — el acta la llama «moglie di Celeri Callisto», corregido al margen a «anzi VEDOVA»"], ["Hijo conocido", "TEBALDO CELERI, nacido hacia 1862, que emigró a Argentina"], ["Domicilio", "TRASSILICO, VIA DEL CENTRO, número 17 — la casa donde nació y donde murió ochenta y ocho años después. El enlace lleva al pueblo: no hay numeración cartografiada allí. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["Oficio", "«atta a casa» — dedicada a su casa"], ["Matrimonio", "30 de enero de 1859, iglesia de Trassilico, con CALLISTO CELERI — acta civil 3, del 4 de febrero. Ella tenía veinticuatro años"], ["Condición", "POSSIDENTE — propietaria por derecho propio, así la llama la fe del párroco en 1859"], ["Defunción", "9 de septiembre de 1923, a las 3:30 de la madrugada, en su casa de Trassilico — acta 10, inscrita el día 10 a las 14:25"]], "vida": "c.1835–1923", "lug": "TRASSILICO", "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico — Via del Centro, 17", "pie": "Nació aquí hacia 1835 y murió aquí el 9 de septiembre de 1923, a las tres y media de la madrugada, con ochenta y ocho años. En la misma casa, en el mismo pueblo, del que probablemente no salió nunca. Su hijo Tebaldo llevaba entonces más de cuarenta años en Argentina."}, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": "calisto_celeri", "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": ["luisa_vanni"], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "9 de septiembre de 1923, 3:30 h; inscrita el 10 a las 14:25", "lugar": "Trassilico, Lucca", "ref": "acta 10", "fuente": [["Archivo", "Tribunale di Lucca"], ["Fondo", "Vagli Sopra / Vagli di Sotto, Lucca, Toscana — imagen 887 de 2093, grupo de imágenes 007977983"], ["Vía", "FamilySearch"], ["Oficial", "Pasquale Biglini, comisario prefecticio y oficial del estado civil del Comune di Trassilico"]], "literal": "Numero 10 — VANNI ENRICHETTA fu PIETRO, VEDOVA CELERI.\nL'anno millenovecento ventitre, addì dieci di Settembre, a ore pomeridiane due e minuti venticinque, nella Casa Comunale. Avanti di me Biglini Pasquale Commissario Prefettizio ed Ufficiale dello stato civile del Comune di TRASSILICO, sono comparsi Bonetti Angelo di Jacopo, di anni quaranta, agricoltore, domiciliato in Trassilico, e Simoni Cirio fu Egisto, di anni trentadue, bracciante, domiciliato in Trassilico, i quali mi hanno dichiarato che a ore antimeridiane tre e minuti trenta di ieri, nella casa posta in Trassilico in VIA DEL CENTRO al numero diciassette, è morta VANNI ENRICHETTA di anni ottantotto, atta a casa, residente in Trassilico, nata in Trassilico, da fu PIETRO, domiciliato in vita a Trassilico, e da fu RIGHINI LIVIA, domiciliata in vita in detto luogo, MOGLIE DI CELERI CALLISTO. [al margen: anzi VEDOVA]\nA quest'atto sono stati presenti quali testimoni Bonetti Jacopo fu Angelo, di anni settantaquattro, agricoltore, e Paoli Amilcare fu Giacomo, di anni trentadue, falegname, ambi residenti in questo Comune.", "traduccion": "Número 10 — VANNI ENRICHETTA, hija del difunto Pietro, VIUDA CELERI.\n\nEl año mil novecientos veintitrés, el día DIEZ DE SEPTIEMBRE, a las dos y veinticinco de la tarde, en la Casa Comunal. Ante mí, PASQUALE BIGLINI, comisario prefecticio y oficial del estado civil del MUNICIPIO DE TRASSILICO, han comparecido ANGELO BONETTI, hijo de Jacopo, de cuarenta años, agricultor, domiciliado en Trassilico, y CIRIO SIMONI, hijo del difunto Egisto, de treinta y dos, jornalero, domiciliado en Trassilico.\n\nLos cuales me han declarado que A LAS TRES Y MEDIA DE LA MADRUGADA DE AYER, en la casa sita en TRASSILICO, EN LA VÍA DEL CENTRO, NÚMERO DIECISIETE, ha muerto ENRICHETTA VANNI, DE OCHENTA Y OCHO AÑOS, dedicada a su casa, residente en Trassilico, NACIDA EN TRASSILICO, hija del difunto PIETRO, domiciliado en vida en Trassilico, y de la difunta LIVIA RIGHINI, domiciliada en vida en el mismo lugar, ESPOSA DE CALLISTO CELERI. — Al margen, corrigiendo: «más bien VIUDA».\n\nEstuvieron presentes como testigos JACOPO BONETTI, hijo del difunto Angelo, de setenta y cuatro años, agricultor, y AMILCARE PAOLI, hijo del difunto Giacomo, de treinta y dos, carpintero, ambos residentes en este municipio.", "notas": ["*** ESTA ES EL ACTA QUE LE PONE PUEBLO A LA RAMA ENTERA. *** Los dos documentos argentinos de su hijo Tebaldo —el matrimonio de 1900 y la defunción de su nieta de 1946— dicen sólo «natural de Italia». Ninguno da el pueblo. Éste sí, y por el camino más indirecto: no es el papel de quien se fue, es el de quien se quedó.", "*** Y CONFIRMA LA MEMORIA FAMILIAR AL PIE DE LA LETRA. *** Gonzalo la recordaba como «Trasilico de Galicanto, Lucca». El acta dice COMUNE DI TRASSILICO, provincia de Lucca. En 1923 Trassilico era municipio propio; se fusionó con GALLICANO poco después. La familia conservó los dos nombres, el del pueblo y el del municipio que se lo tragó, durante cien años y a diez mil kilómetros.", "*** LA CASA: TRASSILICO, VÍA DEL CENTRO, NÚMERO 17. *** Es la única dirección concreta que se conoce de esta rama, y el sitio del que salió Tebaldo hacia Argentina. Trassilico es un pueblo de montaña de la Garfagnana, en el valle del Serchio, bajo los Alpes Apuanos, y cabe entero en doscientos cincuenta metros.\n\nOJO: VIA DEL CENTRO YA NO EXISTE. Trassilico tiene hoy once calles con nombre y ninguna se llama así — los nombres cambiaron, con toda probabilidad al fusionarse el municipio con Gallicano hacia 1928, cinco años después de esta acta. La candidata más firme es la VIA ANTONIO VALLISNERI, que es la calle central del pueblo y lleva el nombre de su hijo ilustre. Todo eso está explicado en la ficha de Tebaldo, con las medidas. En el mapa: https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia", "«MOGLIE DI CELERI CALLISTO», CORREGIDO AL MARGEN A «ANZI VEDOVA». El escribano escribió primero «esposa» y luego alguien lo enmendó a «viuda». Es la prueba de que Callisto ya había muerto en septiembre de 1923, aunque nadie sepa cuándo.", "SUS PADRES, CONFIRMADOS Y LOS DOS MUERTOS: PIETRO VANNI y LIVIA RIGHINI, ambos de Trassilico. El árbol de FamilySearch la daba hija de Pietro Vanni y «Lucia» Righini; el acta dice LIVIA. Se prefiere el acta.", "SIGUE SIN CONOCÉRSELE UN SOLO HERMANO. Se probó con un «Vanni Maria Francesca di Pietro» del índice de 1863, por si aquel Pietro fuera un hijo del doctor; leída el acta, resultó ser un clavetero de Le Fabbriche hijo de un Francesco. Descartado.", "MURIÓ A LOS OCHENTA Y OCHO AÑOS EN LA CASA EN QUE NACIÓ, en un pueblo del que probablemente no salió nunca. Su hijo llevaba entonces más de cuarenta años en Argentina, y su nieta argentina —a la que no conoció— se llamaba Enriqueta por ella."], "imgs": [{"u": "actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20Muerte%20de%20Enrichetta%20Vanni%20viuda%20de%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2010.jpg", "t": "Muerte de Enrichetta Vanni viuda de Celeri - Trassilico, Lucca acta 10"}], "zooms": [{"u": "actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20zoom%20-%20acta%2010%20completa%2C%20Trassilico.jpg", "t": "Acta 10 completa, Trassilico"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "30 de enero de 1859 la boda; 4 de febrero el acta civil", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 3", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Registro", "ark an_ua35853344 · hash del contenedor: 03QyK9Z (18 imágenes)"], ["Página", "5 de 18 — el acta 3 ocupa el centro de la hoja"], ["Cómo se localizó", "por el índice alfabético del final (página 18), fila «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». Antes se habían descartado 1861 y 1860 leyendo sus índices completos"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Acta 3. El año 1859, el día CUATRO DE FEBRERO. Ante mí, oficial del Estado Civil del MUNICIPIO DE TRASSILICO, provincia de Garfagnana, ha comparecido CALLISTO CELERI, de VEINTIOCHO AÑOS, PROPIETARIO Y SECRETARIO DEL MUNICIPIO, nacido y domiciliado en Trassilico, HIJO DEL DIFUNTO DESIDERIO.\n\nEn presencia de ERMENEGILDO GALANTI, hijo del vivo Felice, y de GIOVANNI REBECHI, hijo del difunto Paolino, ambos mayores de edad, propietarios y domiciliados en Trassilico, ha expuesto: QUE EL DÍA TREINTA DE ENERO del corriente año se celebró su matrimonio con la SEÑORA ENRICHETTA VANNI, HIJA DEL DIFUNTO DOCTOR PIETRO, de VEINTICUATRO AÑOS, sin profesión, nacida y domiciliada en Trassilico, ante el señor don Grandi, párroco.\n\nFE DEL PÁRROCO: «El infrascrito párroco da fe de que el señor CALLISTO, hijo del difunto DESIDERIO CELERI, de veintiocho años, nacido y domiciliado en Trassilico, PROPIETARIO y SECRETARIO MUNICIPAL, y la señora ENRICHETTA VANNI, de veinticuatro años, nacida también y domiciliada en Trassilico, PROPIETARIA, celebraron el treinta de enero de 1859 su matrimonio según los ritos de la Iglesia católica ante mí, en presencia de PIETRO BONETTI, hijo del difunto Antonio, y PIETRO MENGHI, hijo del difunto Luigi, testigos ambos de Trassilico. Y en fe de ello, desde la casa parroquial de Trassilico, hoy 4 de febrero de 1859. DOMENICO GRANDI, rector.»", "notas": ["*** ES LA BODA QUE SE BUSCABA, Y COSTÓ TRES AÑOS DE ÍNDICES. *** Se descartaron primero 1861 (cuarenta bodas) y 1860, leyendo sus índices alfabéticos completos, antes de dar con ella en 1859. Ese método —una imagen de índice por año en vez de un registro entero— es lo que hizo viable la búsqueda.", "LAS EDADES CUADRAN CON TODO LO DEMÁS. Él, veintiocho en febrero de 1859 → nacido hacia 1830-31, igual que los treinta y uno que declara en 1861 y 1862. Ella, veinticuatro → nacida hacia 1834-35, igual que los veintisiete de 1862 y los ochenta y ocho de su defunción de 1923. Cuatro documentos, sesenta y cuatro años y dos archivos distintos, todos apuntando al mismo par de fechas.", "*** LOS DOS ERAN «POSSIDENTI» — PROPIETARIOS. *** Y ella por derecho propio: la fe del párroco la llama possidente, no «hija de». En un pueblo de montaña donde el acta vecina describe a los novios como «agricoltore» y «agricoltrice», y donde la mayoría firma «per essere illetterato», este matrimonio es el de dos propietarios que saben escribir. Sus dos testigos civiles también son possidenti.", "LO QUE EL ACTA NO DA, Y HAY QUE DECIRLO: NO NOMBRA A LAS MADRES. De él sólo «figlio del fu Desiderio»; de ella sólo «figlia del fu Dr. Pietro». La madre de Callisto sigue sin conocerse. La de Enrichetta —LIVIA RIGHINI— la sabemos por otra vía: su acta de defunción de 1923.", "SE CASARON EN ENERO Y TEBALDO NACIÓ EN JULIO DE 1862 — tres años y medio después. Si no hubo hijos entre medias, y los índices de nacidos de 1861 y 1862 no traen ninguno, quedan por barrer 1859 y 1860.", "DON DOMENICO GRANDI los casó en 1859 y bautizó a Tebaldo en 1862. El mismo cura, en el mismo pueblo, en las dos actas más importantes de esta rama."], "imgs": [{"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "luisa_vanni": {"id": "luisa_vanni", "nombre": "Luisa Vanni", "legal": "«ALOISA» en el cuerpo del acta; ella firma LUISA", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["celeri"], "resumen": "La hermana mayor de Enrichetta, y la mujer en cuya casa nació Tebaldo. Durante días fue sólo un nombre suelto en el acta de 1862; el 27 de agosto de 2026 resultó ser su tía.", "datos": [["Nacimiento", "hacia 1832, TRASSILICO — los treinta y un años que declara al casarse en abril de 1863"], ["Padres", "el difunto DOTTOR PIETRO VANNI, abogado nacido en Lucca, y LIVIA RIGHINI, nacida en Castelnuovo — LOS MISMOS PADRES QUE ENRICHETTA"], ["Condición", "POSSIDENTE — propietaria, igual que su hermana"], ["Matrimonio", "26 de abril de 1863 la promesa, 29 la efectuación — Trassilico, actas 3 y 6"], ["Marido", "el DOCTOR MATTEO VINCENTI, de treinta y cuatro años, MÉDICO, nacido y domiciliado en COREGLIA ANTELMINELLI, hijo del difunto Antonio Vincenti y de Elisabetta Serafini, los dos «possidenti»"], ["Su huella en el árbol", "el 25 de julio de 1862, TEBALDO NACIÓ EN SU CASA, en el paraje «Alla Maestà». Diez meses antes de casarse ella"], ["Firma", "firmó el acta de su boda de su puño: «LUISA VANNI»"]], "vida": "n.c.1832", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": null, "hijos": [], "hermanos": ["enrichetta_vanni"], "actas": [{"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "26 de abril de 1863 la promesa; 29 la efectuación", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "actas 3 y 6", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.5 «Matrimoni» 1863"], ["Signatura", "ark:/12657/an_ua35853348 — hash 03QyKYJ, 20 imágenes; el acta en la página 5, el índice en la 20"]], "literal": "", "traduccion": "El año 1863, el día 26 de abril. Ante mí, el infrascrito BERTOLI BARSOTTI RANIERI, Alcalde Oficial del Estado Civil del Ayuntamiento de Trassilico, Provincia de Massa, Circondario de la Garfagnana, comparecieron:\n\nVINCENTI DOCTOR MATTEO, de treinta y cuatro años, nacido y domiciliado en COREGLIA ANTELMINELLI, de profesión MÉDICO, hijo del difunto VINCENTI ANTONIO, de ochenta y tres años, propietario, y de SERAFINI ELISABETTA, de sesenta años, propietaria también, nacidos ambos y domiciliados en la dicha Coreglia;\n\ny VANNI ALOISA, de treinta y un año
