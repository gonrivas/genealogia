s, nacida y domiciliada en Trassilico, PROPIETARIA, HIJA DEL DIFUNTO DOCTOR PIETRO VANNI —de profesión LEGAL, NACIDO EN LUCCA y domiciliado en Trassilico— Y DE RIGHINI LIVIA, de cincuenta años, sin profesión, NACIDA EN CASTELNUOVO y domiciliada en Trassilico;\n\nlos cuales, en presencia de CELERI CALLISTO, hijo del difunto Desiderio, de treinta y dos años, SECRETARIO DEL AYUNTAMIENTO, y de BONETTI PIETRO, hijo del difunto Antonio, de treinta y tres años, agricultor, ambos nacidos y domiciliados en Trassilico, testigos, me han declarado ser su intención unirse en matrimonio.", "notas": ["*** LUISA VANNI ERA LA HERMANA MAYOR DE ENRICHETTA. *** El acta la llama «Aloisa» en el cuerpo, pero ella firma «LUISA VANNI» de su puño, y la declara hija del difunto doctor Pietro Vanni y de Livia Righini: exactamente los mismos padres.", "*** Y ESO EXPLICA EL DATO MÁS RARO DEL ÁRBOL. *** Tebaldo nació el 25 de julio de 1862 «en casa de Luisa Vanni, Alla Maestà». No era la casa de una vecina: era la casa de su TÍA. Enrichetta fue a parir a casa de su hermana. Diez meses después, Luisa se casaba.", "*** EL PADRE NO ERA MÉDICO, ERA ABOGADO, Y NO ERA DE TRASSILICO. *** «Di professione LEGALE, nato in LUCCA». Se le había tenido por el médico del pueblo porque el acta de Tebaldo lo llama «dottor Pietro» — pero en Italia «dottore» es cualquier titulado. Era hombre de leyes, y venía de la ciudad.", "*** LIVIA RIGHINI ESTABA VIVA, TENÍA CINCUENTA AÑOS Y FIRMÓ. *** Y el acta confirma negro sobre blanco que NACIÓ EN CASTELNUOVO, que era la lectura dudosa del acta de 1860. Su firma y la de su hija son las dos primeras firmas de mujer de esta rama.", "UNA DIFICULTAD QUE NO SE TAPA: del difunto Pietro Vanni el acta dice «de edad de treinta y dos años». Este registro sí da la edad de los padres muertos —al del novio le da ochenta y tres—, pero treinta y dos es incompatible con tener una hija en 1832 y otra en 1835, salvo que muriera hacia 1835 con Luisa de tres años y Enrichetta recién nacida, dejando a Livia viuda a los veintidós. Es posible, pero extraordinario. Puede ser también un desliz del escribano. No se resuelve con este documento.", "CALLISTO CELERI, de treinta y dos años y secretario del ayuntamiento, fue testigo de la boda de su cuñada. Es la séptima muestra conocida de su firma."], "imgs": [{"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20Partida%20de%20bautismo%20de%20Luisa%20Vanni%20-%20Trassilico%2C%20libro%20F%20pag%2026%20n%2068.jpg", "t": "Partida de bautismo de Luisa Vanni - Trassilico, libro F pag 26 n 68"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863%20I%20Indice%20de%20matrimonios%20de%20Trassilico%201863.jpg", "t": "1863 I Indice de matrimonios de Trassilico 1863"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Acta%20notarial%20de%20asenso%20de%20Elisabetta%20Serafini%20-%20Borgo%20a%20Mozzano.jpg", "t": "Acta notarial de asenso de Elisabetta Serafini - Borgo a Mozzano"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Certificado%20del%20prior%20de%20Coreglia%20sobre%20los%20Vincenti%20-%20tres%20generaciones.jpg", "t": "Certificado del prior de Coreglia sobre los Vincenti - tres generaciones"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20F%20Firmas%20de%20Luisa%20Vanni%20y%20de%20Livia%20Righini%20-%20Trassilico%20acta%203.jpg", "t": "1863-04-26 F Firmas de Luisa Vanni y de Livia Righini - Trassilico acta 3"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20Acta%20de%20matrimonio%20-%20Trassilico%20acta%203.jpg", "t": "Acta de matrimonio - Trassilico acta 3"}], "zooms": [{"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20zoom%20-%20del%20fu%20avvocato%20Giuseppe%20del%20caporal%20Pietro%20Vanni.jpg", "t": "Del fu avvocato Giuseppe del caporal Pietro Vanni"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20el%20padre%2C%20dottor%20Pietro%20Vanni%2C%20nacido%20en%20LUCCA%20y%20de%20profesion%20legal.jpg", "t": "El padre, dottor Pietro Vanni, nacido en LUCCA y de profesion legal"}, {"u": "actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20la%20madre%2C%20Livia%20Righini%20de%2050%20anios%2C%20nacida%20en%20Castelnuovo.jpg", "t": "La madre, Livia Righini de 50 anios, nacida en Castelnuovo"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "caporal_pietro_vanni": {"id": "caporal_pietro_vanni", "nombre": "Pietro Vanni, el cabo", "legal": "«del caporal Pietro» en la partida de 1832", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["celeri"], "resumen": "El antepasado más antiguo de toda la rama materna, y el único militar del árbol. Apareció el 27 de agosto de 2026, en cuatro palabras de una partida de bautismo de 1832.", "datos": [["Quién era", "padre del ABOGADO GIUSEPPE VANNI y bisabuelo de Enrichetta"], ["Oficio", "*** CAPORALE — cabo. *** Es el único militar documentado en todo el árbol"], ["Nacimiento", "sin fecha. Si su bisnieta nació en 1832 y su hijo ya había muerto para entonces, él nacería hacia 1740-1760"], ["Su nombre viajó", "su nieto se llamó PIETRO por él — la costumbre italiana de poner al primer varón el nombre del abuelo paterno"], ["De dónde sale", "partida de bautismo de su bisnieta LUISA VANNI — Trassilico, libro de bautizados «Lettera F», página 26, asiento 68, copiada en 1863"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Existe por cuatro palabras: «del caporal Pietro». Pero con él la rama materna llega al siglo XVIII.\n\nUN CABO, UN ABOGADO, UN ABOGADO Y UNA MAESTRA DE CASA. La secuencia de tres generaciones que sale de esta partida dice mucho de una familia que sube: el padre es militar de tropa, el hijo se hace abogado, el nieto también, y el nieto se casa con la hija de otro propietario y sube a un pueblo de montaña a ejercer.\n\nDÓNDE BUSCARLO. Su nieto Pietro NACIÓ EN LUCCA, así que lo más probable es que esta familia fuera de la ciudad. Todo lo suyo estaría en el Archivio di Stato di Lucca o en el Archivio Storico Diocesano de Lucca — no en Massa.", "padre": null, "madre": null, "conyuge": null, "hijos": ["giuseppe_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_vanni": {"id": "teresa_vanni", "nombre": "Teresa", "legal": "«comare Teresa madre di detto Dottor Vanni»", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["celeri"], "resumen": "La mujer del abogado Giuseppe Vanni y madre del doctor Pietro. En agosto de 1832 sostuvo en la pila a su nieta Luisa.", "datos": [["Quién era", "mujer del ABOGADO GIUSEPPE VANNI, madre del DOCTOR PIETRO VANNI"], ["Viva en", "9 de agosto de 1832, cuando fue MADRINA de su nieta Luisa — y ya viuda, porque a su marido la partida lo llama «il fu»"], ["Apellido", "SE DESCONOCE. La partida sólo la llama «Teresa, madre del dicho doctor Vanni»"], ["Su nombre viajó", "su nieta se llamó ALOISA **TERESA** por ella"], ["De dónde sale", "partida de bautismo de Luisa Vanni, Trassilico, 9 de agosto de 1832"]], "vida": "†>1832", "lug": "", "mapa": null, "sinacta": "De ella se sabe el nombre de pila, que estaba viva y viuda en 1832, y que fue madrina de su nieta. Nada más — ni apellido, ni pueblo, ni fechas.\n\nSU APELLIDO ESTARÍA en el acta de matrimonio de su hijo Pietro con Livia Righini, hacia 1830, o en la partida de bautismo del propio Pietro, hacia 1808 y probablemente en LUCCA. Ninguna de las dos está localizada.", "padre": null, "madre": null, "conyuge": "giuseppe_vanni", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "bernardo_righini": {"id": "bernardo_righini", "nombre": "Bernardo Righini", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["celeri"], "resumen": "El padre de Livia Righini, de Castelnuovo. Apareció el 27 de agosto de 2026, en la partida de bautismo de su nieta Luisa.", "datos": [["Quién era", "padre de LIVIA RIGHINI y abuelo materno de Enrichetta Vanni"], ["Pueblo", "CASTELNUOVO — la partida dice «Livia del fu Bernardo Righini di Castelnuovo». Es la tercera vez que un documento sitúa a esta familia allí"], ["Muerto antes de", "agosto de 1832 — la partida ya lo llama «il fu»"], ["Nacimiento", "hacia 1780 o antes, si su hija nació hacia 1813"], ["De dónde sale", "partida de bautismo de su nieta LUISA VANNI, Trassilico, 9 de agosto de 1832"]], "vida": "c.1780–<1832", "lug": "", "mapa": null, "sinacta": "Existe por cinco palabras: «del fu Bernardo Righini di Castelnuovo».\n\nY CON ÉL LA BÚSQUEDA SE MUDA DE PUEBLO. Livia era de CASTELNUOVO DI GARFAGNANA, la capital del valle, no de Trassilico. Su nacimiento hacia 1813, su boda con el doctor Pietro Vanni hacia 1830 y todo lo de Bernardo estarían en los registros de Castelnuovo — otro comune, otro fondo.\n\nHAY ADEMÁS OTRO RIGHINI SUELTO: el padrino de Luisa fue GIOVANNI DI CARLO RIGHINI. Hijo de un Carlo, y casi seguro pariente de Livia — un hermano suyo o un primo.", "padre": null, "madre": null, "conyuge": null, "hijos": ["lucia_righini"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_vanni": {"id": "giuseppe_vanni", "nombre": "Giuseppe Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["celeri"], "resumen": "El padre del doctor Pietro Vanni, y el antepasado más antiguo documentado de toda la rama materna. Apareció el 27 de agosto de 2026, en tres palabras de una partida parroquial de 1841.", "datos": [["Oficio", "*** ABOGADO — «AVVOCATO GIUSEPPE». *** Lo dice la partida de bautismo de su nieta Luisa, de 1832. Dos generaciones seguidas de hombres de leyes: él y su hijo Pietro"], ["Padre", "*** EL CABO PIETRO VANNI *** — «del caporal Pietro». El único militar del árbol, y el antepasado más antiguo de toda la rama materna"], ["Cónyuge", "TERESA, viva en 1832, cuando fue madrina de su nieta Luisa. Se le conoce el nombre de pila pero no el apellido"], ["Quién era", "padre del DOCTOR PIETRO VANNI, abogado, nacido en LUCCA hacia 1808-1809"], ["Muerto antes de", "AGOSTO DE 1832 — la partida de su nieta lo llama ya «il fu avvocato Giuseppe»"], ["Nacimiento", "hacia 1780 o antes, si su hijo nació hacia 1808"], ["Dónde vivía", "sin determinar. Su hijo NACIÓ EN LUCCA, la ciudad, así que la familia podría ser de allí y no de la montaña"], ["De dónde sale", "partida de defunción de su hijo — parroquia de los SS. Pietro e Paolo de Trassilico, libro de difuntos «Lettera D», página 32, asiento 182, copiada en 1863 dentro del expediente de boda de su nieta Luisa"]], "vida": "c.1780–<1832", "lug": "", "mapa": null, "sinacta": "Existe por cuatro palabras: «figlio del fu Giuseppe Vanni». Pero esas cuatro palabras suben una generación entera y llevan la rama materna hasta el siglo XVIII.\n\nDÓNDE BUSCARLO. Su hijo Pietro NACIÓ EN LUCCA —lo dice el acta de matrimonio de Luisa, de 1863—, así que lo más probable es que esta familia no fuera de Trassilico sino de la ciudad, y que Pietro subiera a la montaña ya hecho abogado. Si es así, el bautismo de Pietro, hacia 1808, y todo lo de Giuseppe estarían en LUCCA: en el Archivio di Stato di Lucca o en el Archivio Storico Diocesano de la ciudad, no en Massa.\n\nESO ABRE UN FRENTE NUEVO Y ENTERO. Hasta ahora esta rama estaba encerrada en un pueblo de cien vecinos; con Giuseppe Vanni se muda a una ciudad con archivos que empiezan en la Edad Media.", "padre": "caporal_pietro_vanni", "madre": null, "conyuge": null, "hijos": ["pietro_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "pietro_vanni": {"id": "pietro_vanni", "nombre": "Pietro Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 6, "ramas": ["celeri"], "resumen": "De Trassilico, en la Garfagnana. Padre de Enrichetta Vanni y tatarabuelo del abuelo paterno de Gonzalo.", "datos": [["Oficio", "*** ABOGADO, NO MÉDICO. *** «Di professione LEGALE», dice el acta de matrimonio de su hija Luisa, de abril de 1863. Durante días se le tuvo por el médico del pueblo porque el acta de su nieto Tebaldo lo llama «dottor Pietro» — pero en Italia «dottore» es cualquier titulado. Era hombre de leyes"], ["Pueblo", "*** NACIÓ EN LUCCA ***, la ciudad, y se domicilió en TRASSILICO. Era el forastero con carrera que sube a un pueblo de montaña"], ["Nacimiento", "hacia 1805, si su hija nació en 1835 — pero ver la nota sobre su edad"], ["*** MUERTE ***", "*** 22 DE MARZO DE 1841, y sepultado el 23 ***. Lo dice su partida parroquial, copiada en 1863: «morì ieri, e oggi previe solenni esequie, è stato sepolto»"], ["Padre", "*** GIUSEPPE VANNI ***, ya difunto en 1841 — el ascendiente más antiguo documentado de esta rama"], ["Edad al morir", "TREINTA Y DOS años, según el acta de matrimonio de su hija Luisa → nacido hacia 1808-1809"], ["Cónyuge", "LIVIA RIGHINI, nacida en CASTELNUOVO hacia 1813"], ["Hijas", "LUISA (hacia 1832) y ENRICHETTA (hacia 1835) — las dos «possidenti»"], ["Muerto antes de", "septiembre de 1923 — el acta de su hija lo llama «fu Pietro»"], ["De dónde sale", "acta de defunción de su hija: Trassilico, 9 de septiembre de 1923, acta 10"], ["*** Y CUIDADO CON EL OTRO GIUSEPPE VANNI, QUE NO ES SU PADRE ***", "su padre se llamaba GIUSEPPE VANNI, y en LE FABBRICHE hay OTRO GIUSEPPE VANNI, clavetero, con hijos documentados en 1858 y 1859. No son el mismo hombre: el nuestro es el padre de un licenciado nacido en Lucca; el otro, un artesano de una aldea de forja"], ["*** UN PIETRO VANNI QUE SE CASA EN 1864 NO ES ÉL ***", "el índice de matrimonios de 1864 trae un VANNI PIETRO casándose con Barsotti Giovanna (acta 10). Durante un día quedó como pregunta abierta, y no lo era: *** él murió el 22 de marzo de 1841 ***, así que ese novio es forzosamente otro — con toda probabilidad el «Pietro Vanni fu Francesco, chiodajuolo di Le Fabbriche» ya descartado en 1863"], ["*** NO CONFUNDIR CON LOS OTROS VANNI ***", "en el mismo municipio hay una familia VANNI entera, numerosa y sin parentesco: los CLAVETEROS DE LE FABBRICHE"]], "vida": "c.1805–1841", "lug": "", "mapa": null, "sinacta": "*** EN TRASSILICO HAY DOS FAMILIAS VANNI QUE NO TIENEN NADA QUE VER, Y CONFUNDIRLAS CUESTA DÍAS. *** **LOS NUESTROS** son los VANNI DEL PUEBLO: él, ABOGADO —«di professione LEGALE»— y **NACIDO EN LUCCA**, un forastero con carrera; su mujer LIVIA RIGHINI, de Castelnuovo; y sus hijas ENRICHETTA y LUISA, las dos «POSSIDENTI».\n\n**LOS OTROS** son los VANNI DE LE FABBRICHE: **CHIODAJUOLI, claveteros**, que hacían clavos a mano. Le Fabbriche —«las herrerías»— era un pueblo de forja y allí el oficio pasaba de padre a hijo. Han salido ya cuatro: Pietro fu Francesco (1863), y ANGELO con sus hijos ROSA y PIETRO, casados con cuatro días de diferencia en mayo de 1864. *** UN VANNI DE LE FABBRICHE NO ES DE ESTA FAMILIA. ***\n\nCONFIRMADO POR ACTA, aunque no por la suya: el acta de defunción de su hija, en 1923, lo da por padre, lo sitúa en Trassilico y lo declara muerto («fu Pietro», «domiciliato IN VITA a Trassilico»).\n\nEs, con su mujer, la generación más antigua documentada de la rama Celeri: nacido hacia 1805, en un pueblo de los Alpes Apuanos. Todo lo suyo estaría en los libros parroquiales de Trassilico.\n\n*** LA BÚSQUEDA CIVIL ESTÁ CERRADA, Y CON RESULTADO. *** El acta de matrimonio de su hija, del 4 de febrero de 1859, ya lo llama «fu dottor Pietro». Y a 27 de agosto de 2026 están leídos enteros los índices de difuntos de LOS ONCE AÑOS QUE EXISTEN —1852, 1853, 1854, 1855, 1856, 1857, 1858, 1859, 1860, 1861 y 1865—: en ninguno aparece. Como el registro civil de Trassilico empieza en 1852, MURIÓ ANTES DE 1852 y su acta es PARROQUIAL, no civil — SS. Pietro e Paolo de Trassilico, que desde 1853 depende de la Diócesis de MASSA y no de la de Lucca.\n\nSE EXAMINÓ Y SE DESCARTÓ UN CANDIDATO QUE PARECÍA BUENO: «VANNETTI PIETRO fu Giovanni», muerto el 21 de febrero de 1852 (acta 4). No es él, por dos razones. VANNETTI y VANNI son apellidos distintos en estos mismos índices —en 1859 conviven un Vanni y tres Vannetti—; y sobre todo, estos índices SÍ escriben el título de doctor cuando lo hay: en el de 1855 constan «Barsotti DOTT. Roberto» y «Barsotti DOTT. Michele». El médico del pueblo habría llevado su «Dott.» igual que los Barsotti.\n\n*** Y EL 27 DE AGOSTO POR LA NOCHE SE ABRIÓ UNA PUERTA QUE PARECÍA CERRADA. *** Se había concluido —y sigue siendo cierto— que murió antes de 1852 y que su acta es parroquial, no civil. Pero eso ya no significa que sea inalcanzable. Los ALLEGATI de los matrimonios de Trassilico TRANSCRIBEN LITERALMENTE las partidas de los libros parroquiales, con el número y la página del libro original, y alcanzan años en que no había registro civil. Está comprobado: en el legajo de 1863 hay un extracto del «registro dei Morti della Chiesa di S. Michele Arcangelo di Vallico Sopra, partita n. 358, pagina 88», copiado por el párroco y visado por el alcalde.\n\n*** Y CONSTA QUE LA SUYA SE ADJUNTÓ. *** El acta de matrimonio de su hija LUISA, de abril de 1863, dice que se entregaron «le fedi pure autentiche della morte del Vincenti Antonio, DEL VANNI DOTTOR PIETRO». Su partida de defunción está, por tanto, dentro de ese expediente. Y por el mismo razonamiento debería estar también en los ALLEGATI DEL MATRIMONIO DE CALLISTO Y ENRICHETTA, del 4 de febrero de 1859 — junto con las de DESIDERIO CELERI y ANGELA MENGHI.\n\nESO CONVIERTE LOS ALLEGATI DE MATRIMONI DE 1859 EN EL OBJETIVO PRINCIPAL DE TODO EL PROYECTO.\n\nSu acta de defunción es de las más valiosas que quedan en todo el árbol: nombraría a SUS padres, y siendo médico rural podría además revelar que vino de otro pueblo. Un médico en un sitio de cien vecinos rara vez había nacido allí.\n\nSE PROBÓ UNA PISTA Y SALIÓ MAL, Y CONVIENE DEJARLO ESCRITO. El índice de nacidos de Trassilico de 1863 registra en el acta 2 a una VANNI MARIA FRANCESCA «di PIETRO», y como el doctor ya estaba muerto desde antes de 1859, pareció que podía tratarse de un hijo suyo del mismo nombre, es decir un hermano de Enrichetta. Se leyó el acta entera: NO ES ÉL NI ES PARIENTE. Aquel hombre es «VANNI PIETRO FU FRANCESCO», de cuarenta y un años, CHIODAJUOLO —clavetero—, domiciliado en LE FABBRICHE y casado con una Rosa Vanni hija de Cristoforo Rigali. Padre distinto, oficio distinto, aldea distinta.\n\nLA LECCIÓN VALE PARA TODO EL ÁRBOL: el índice sólo escribe «di Pietro». En un pueblo donde Vanni es apellido corriente, la coincidencia de un nombre de pila no prueba absolutamente nada hasta que se lee el acta.", "padre": "giuseppe_vanni", "madre": null, "conyuge": "lucia_righini", "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [{"titulo": "Partida de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "22 de marzo de 1841; sepultado el 23", "lugar": "Trassilico — parroquia de los SS. Apóstoles Pedro y Pablo", "ref": "libro de difuntos «Lettera D», página 32, asiento 182", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Dónde apareció", "no en un registro de defunciones, sino DENTRO DEL EXPEDIENTE DE LA BODA DE SU HIJA LUISA: Trassilico, Matrimoni allegati 1863, Registro 64.11, página 103 de 119"], ["Signatura", "ark:/12657/an_ua35853779 — hash Lok9x2p"]], "literal": "", "traduccion": "Certifico yo, el infrascrito Párroco, que del LIBRO DE DIFUNTOS de esta mi Iglesia erigida bajo el título de los SANTOS APÓSTOLES PEDRO Y PABLO, marcado con la LETRA D, a la página 32, número 182, resulta lo siguiente:\n\nA 23 DE MARZO DE 1841. EL DOCTOR PIETRO, HIJO DEL DIFUNTO GIUSEPPE VANNI, provisto de los sacramentos de la confesión, la comunión y la recomendación del alma, MURIÓ AYER, y hoy, previas solemnes exequias, ha sido sepultado. Doy fe, DOMENICO GRANDI, Rector.\n\nY en testimonio de que lo he extraído de libro auténtico. Trassilico, 25 de abril de 1863.\n\nA 26 de abril de 1863. Visto, se certifica verdadera la firma y calidad del señor Dom. Grandi. El Alcalde, R. Bertoli Barsotti.", "notas": ["*** MURIÓ EL 22 DE MARZO DE 1841. *** Hasta hoy sólo se sabía que estaba muerto «antes de 1859». Ahora hay día.", "*** Y APARECE SU PADRE: GIUSEPPE VANNI ***, ya difunto en 1841. Es el ascendiente más antiguo documentado de toda la rama materna.", "*** SE RESUELVE UNA DIFICULTAD QUE SE HABÍA DEJADO ABIERTA. *** El acta de matrimonio de su hija Luisa, de 1863, le daba «edad de treinta y dos años», cifra que parecía imposible con hijas nacidas en 1832 y 1835. No lo es: si murió en marzo de 1841 con treinta y dos, nació hacia 1808-1809, tuvo a Luisa a los veintitrés y a Enrichetta a los veintiséis. El escribano no se equivocaba; faltaba el dato.", "*** Y ENTONCES LIVIA RIGHINI ENVIUDÓ A LOS VEINTIOCHO AÑOS ***, con Luisa de nueve y Enrichetta de seis. No volvió a casarse: en 1863, con cincuenta, sigue firmando «Righini Livia». Veintidós años de viudedad, y le quedaban muchos más.", "*** DÓNDE APARECIÓ, QUE ES LA LECCIÓN. *** No en un registro de defunciones —murió once años antes de que existiera el registro civil de Trassilico— sino DENTRO DEL EXPEDIENTE DE LA BODA DE SU HIJA, en 1863. Los allegati transcriben literalmente las partidas parroquiales, con libro, página y número. Por esa misma vía hay que buscar a DESIDERIO CELERI y a ANGELA MENGHI.", "LA REFERENCIA EXACTA DEL LIBRO ORIGINAL: parroquia de los SS. Pietro e Paolo de Trassilico, libro de difuntos «Lettera D», página 32, asiento 182. Con eso se puede pedir el libro entero al Archivio Diocesano di Massa.", "LO FIRMA DON DOMENICO GRANDI, el mismo cura que casó a Callisto y Enrichetta en 1859, bautizó a Tebaldo en 1862 y casó a Desiderio Celeri en 1863. En 1841 ya era rector: veintidós años después copió de su propio libro una partida que él mismo había escrito de joven."], "imgs": [{"u": "actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20Partida%20de%20defuncion%20parroquial%20-%20Trassilico%2C%20libro%20D%20pag%2032%20n%20182.jpg", "t": "Partida de defuncion parroquial - Trassilico, libro D pag 32 n 182"}, {"u": "actas/1841%20-%20Pietro%20Vanni/1863-04%20D%20Consentimiento%20notarial%20de%20Elisabetta%20viuda%20Vincenti%20-%20mismo%20expediente.jpg", "t": "Consentimiento notarial de Elisabetta viuda Vincenti - mismo expediente"}], "zooms": [{"u": "actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20zoom%20-%20hijo%20del%20difunto%20GIUSEPPE%20VANNI.jpg", "t": "Hijo del difunto GIUSEPPE VANNI"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "lucia_righini": {"id": "lucia_righini", "nombre": "Livia Righini", "legal": "«Lucia Righini» en el árbol de FamilySearch; el acta dice LIVIA", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 6, "ramas": ["celeri"], "resumen": "De Trassilico. Madre de Enrichetta Vanni. Su nombre estuvo mal escrito hasta que apareció el acta.", "datos": [["Nombre", "LIVIA, según el acta de defunción de su hija. El árbol de FamilySearch la llama «Lucia»: se prefiere el acta"], ["Pueblo", "*** NACIÓ EN CASTELNUOVO ***, no en Trassilico. Lo dice el acta de nacimiento de su nieto Giuseppe, de 1860: de sus consuegros, «il primo nato e domiciliato in Trassilico, e LA SECONDA NATA IN CASTELNUOVO e domiciliata in Trassilico». Vivió y murió en Trassilico"], ["Nacimiento", "hacia 1813 — los CINCUENTA años que declara en la boda de su hija Luisa, en abril de 1863"], ["Viva en", "abril de 1863, cuando FIRMÓ DE SU PUÑO el acta de matrimonio de Luisa; y en 18 de noviembre de 1860 — el acta de su nieto la nombra «la Sig.ra Livia Righini», SIN el «fu» que sí lleva su marido"], ["Padre", "*** BERNARDO RIGHINI, de CASTELNUOVO ***, ya difunto en agosto de 1832"], ["Cónyuge", "PIETRO VANNI"], ["Hija", "ENRICHETTA VANNI (hacia 1835 – 1923)"], ["Muerta antes de", "septiembre de 1923 — el acta de su hija dice «da FU Righini Livia»"]], "vida": "c.1813–<1923", "lug": "", "mapa": null, "sinacta": "CONFIRMADA POR ACTA: la de defunción de su hija, Trassilico 1923, que la da por madre, muerta y vecina del mismo pueblo.\n\nRIGHINI es apellido toscano y emiliano, y encaja con la Garfagnana. Junto con VANNI, son los dos apellidos que ya antes de aparecer este documento apuntaban a la Toscana cuando todavía no había nada que lo probara.\n\n*** Y EL 27 DE AGOSTO DE 2026 SALIÓ DEL PUEBLO. *** El acta de nacimiento de su nieto Giuseppe —Trassilico, 18 de noviembre de 1860, acta 76— dice que de los padres de Enrichetta «el primero nació y está domiciliado en Trassilico, y LA SEGUNDA NACIÓ EN CASTELNUOVO y está domiciliada en Trassilico». Es la primera vez que esta rama pisa otro pueblo. Castelnuovo di Garfagnana es la capital del valle, a unos diez kilómetros: la mujer del médico venía del pueblo grande.\n\nLA LECTURA ES MUY PROBABLE, NO SEGURA. La palabra lleva una ligadura «st» que a primera vista parece una doble ese. Se comparó el trazo con el «Trassilico» de la misma línea, donde la doble ese es corta y apretada, mientras que aquí hay dos astas altas — lo que apunta a CA-ST-E-L-NUOVO. Convendría reconfirmarlo en otro acta.\n\nSI SE CONFIRMA, LA BÚSQUEDA SE MUDA: su nacimiento, hacia 1810, y su boda con el doctor Pietro Vanni, hacia 1830, habría que buscarlos en CASTELNUOVO DI GARFAGNANA y no en Trassilico. Y estaba VIVA en noviembre de 1860, así que su defunción cae entre esa fecha y 1923.", "padre": "bernardo_righini", "madre": null, "conyuge": "pietro_vanni", "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "domingo_alasia": {"id": "domingo_alasia", "nombre": "Domingo Alasia", "legal": "«Don Domingo Alasia» en el acta de 1900; ALAZIO DOMINGO en el censo", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["celeri"], "resumen": "El hermano mayor de Margarita. Nacido en el Piamonte, emigrado de niño, y el hombre que trece años después firmó como testigo la boda de su hermana pequeña.", "datos": [["Nacimiento", "hacia 1863, en ITALIA — los veinticuatro años que declara en el censo de 1887. Es el mayor de los hijos documentados"], ["Emigración", "de niño, con sus padres, entre 1872 y 1876"], ["En 1887", "vive en COLONIA EMILIA con sus padres, ya casado, con su mujer MARÍA MOLINA y dos hijos"], ["Cónyuge", "MARÍA MOLINA, italiana, de veintitrés años en 1887"], ["Padres", "BENEDETTO ALASIA y MADALENA BERTINA"], ["Su huella en el árbol", "el 25 de octubre de 1900 fue TESTIGO de la boda de Margarita con Tebaldo Celeri, en Vera. Su mujer firmó con él"]], "vida": "n.c.1863", "lug": "ITALIA", "mapa": null, "sinacta": "No tiene acta propia todavía, pero está probado por dos documentos que se cruzan: el censo de 1887 lo pone como hijo de Benedetto y Madalena, y el acta de matrimonio de 1900 lo pone como testigo de su hermana.\n\nFUE ÉL QUIEN CERRÓ LA IDENTIFICACIÓN DE TODA ESTA RAMA. Durante días hubo dudas sobre si los Alasia del árbol eran de verdad los padres de Margarita. Lo que lo zanjó no fue una fecha: fue ver que los dos testigos que firman la boda de 1900 —«Don Domingo Alasia y Doña María de Alasia»— estaban trece años antes sentados a la mesa de la misma casa, en el censo, como hijo y nuera.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "maria_molina", "hijos": [], "hermanos": ["margarita_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_molina": {"id": "maria_molina", "nombre": "María Molina", "legal": "«Doña María de Alasia» en el acta de 1900", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["celeri"], "resumen": "Mujer de Domingo Alasia y cuñada de Margarita. Firmó como testigo la boda de 1900.", "datos": [["Nacimiento", "hacia 1864, en ITALIA — los veintitrés años del censo de 1887"], ["Cónyuge", "DOMINGO ALASIA"], ["Hijos", "dos ya en 1887"], ["En el acta de 1900", "«Doña MARÍA DE ALASIA» — la fórmula argentina de la mujer casada"]], "vida": "n.c.1864", "lug": "ITALIA", "mapa": null, "sinacta": "Aparece en el censo de 1887 como NUERA en casa de Benedetto Alasia, y en el acta de matrimonio de 1900 como testigo. Nada más se sabe de ella todavía: faltan sus padres, su pueblo y la fecha de su boda con Domingo, que sería anterior a 1885.", "padre": null, "madre": null, "conyuge": "domingo_alasia", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "benedetto_alasia": {"id": "benedetto_alasia", "nombre": "Benedetto Alasia", "legal": "«Don Benito Alasia» en el acta de 1900", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["celeri"], "resumen": "Piamontés de Savigliano, colono en Santa Fe. Padre de Margarita y bisabuelo de Marcos César Rivas.", "datos": [["Nacimiento", "1822, según el árbol de FamilySearch"], ["Defunción", "1892, misma fuente"], ["Matrimonio", "13 de abril de 1857, iglesia de SAN GIOVANNI BATTISTA, SAVIGLIANO, provincia de CUNEO, PIAMONTE"], ["Cónyuge", "MARIA MADDALENA BERTINO (1839-1899)"], ["Padres", "BARTOLOMEO ALLASIA y LUCIA GAIDO, por el árbol de FamilySearch"], ["Hija", "MARGARITA ALASIA, nacida hacia 1882 en Colonia Emilia, Santa Fe"], ["Apellido", "ALLASIA en Piamonte, ALASIA en Argentina — se perdió una ele por el camino"]], "vida": "1822–1892", "lug": "", "mapa": null, "sinacta": "*** CONFIRMADO EL 27 DE AGOSTO DE 2026, Y POR UN DOCUMENTO, NO POR UN PARECIDO. *** El censo provincial de Santa Fe de junio de 1887 tiene, en COLONIA EMILIA, tomo 12, libreto 12, esta casa entera: OLAZIO BENEDETTO, de SESENTA Y CINCO años, italiano, cabeza de familia; BERTINA MADALENA, de CUARENTA Y SIETE, su mujer, QUE DECLARA CATORCE HIJOS; y de ellos ALAZIO DOMINGO, de veinticuatro y casado, con su mujer MOLINA MARÍA al lado, más Nicolás, Juan, Francisco, María, MARGARITA DE CINCO AÑOS NACIDA EN SANTA FE, y Madalenia de uno.\n\n*** Y EL 29 DE AGOSTO, AL RELEER ESA FICHA CON LOS CAMPOS QUE EL CENSO SÍ PUBLICA Y QUE SE ESTABAN PERDIENDO, SALIÓ MÁS. *** Él consta *** PATRÓN *** —colono con tierra, no jornalero— y *** ni él ni su mujer sabían leer ni escribir ***; ella declara los catorce hijos y *** treinta y un años de casada ***, que sitúan la boda en 1856, a un año del 13 de abril de 1857 que dice el acta. Y su hijo Domingo declara *** dos años de casado ***: se casó con María Molina en 1885, no «hacia 1885-86».\n\n*** Y HAY OTRAS DOS CASAS ALASIA EN LA MISMA COLONIA, Y AHORA SE PUEDE DECIR ALGO DE ELLAS. *** Una es la de ALACIO DOMINGO, de sesenta y cuatro años —uno menos que él—, también patrón, casado con una Luigia que declara ocho hijos y *** treinta y dos años de casada, o sea boda en 1855, un año antes que la suya ***. Dos hombres de la misma edad, casados en años consecutivos, patrones los dos, en un pueblo de cien casas: parece de manual que fueran hermanos. La otra es la de ALAZIO JUAN, de cuarenta y cinco, patrón y analfabeto como él, casado en 1872 con Lucia Silvestre, con siete hijos todos nacidos ya en Santa Fe — un hogar que hasta hoy no estaba anotado en ninguna parte.\n\n*** PERO EL TEST DE LOS NOMBRES DICE QUE NO SON HERMANOS SUYOS. *** La costumbre manda que el primer hijo varón lleve el nombre del abuelo paterno, y él la cumple al pie de la letra: su padre se llamaba BARTOLOMEO y su hijo mayor se llama BARTOLOMEO. Si Domingo y Juan fueran hermanos suyos, sus primeros varones deberían llamarse igual — y *** el mayor de Alacio Domingo es TOMASO y el de Alazio Juan es ANGELO. *** Lo más probable es que fueran primos: tres familias Alasia del mismo valle piamontés llegadas a la misma colonia, que es como funcionaban esas cadenas. No es prueba —la costumbre sólo obliga con el primer varón, y un niño muerto pequeño rompe la serie— pero por primera vez la pregunta deja de estar en «no se puede decidir».\n\n\n\nLAS HIJAS QUE FALTAN: UNA VÍA MÁS QUE SE CIERRA (29 de agosto de 2026). Magdalena declaró CATORCE hijos y sólo ocho aparecen vivos en el censo. Las hijas casadas se pierden porque el padrón las apunta con el apellido del marido y no da el de soltera. El blog de Hugo Alloa, hecho sobre las actas de la parroquia de Emilia, nombra nueve apellidos que emparentaron con los Allasia — BARONI, BUSATTO, CHARTIER, DACARRO, GIUPPONI, PALMIER, RONZONI, ROSSINI y ZANUTICH — y se buscó en sus casas a una mujer italiana de la edad justa. Hay 92 personas de esos apellidos en la colonia, 17 mujeres casadas, y NINGUNA pasa: dos son francesas, seis nacieron antes de 1856 (o sea antes de la boda de Benedetto, y no pueden ser hijas suyas), y ocho incumplen la costumbre italiana de los nombres, porque su segundo varón debería llamarse Benito y ninguno se llama así. De hecho NO HAY UN SOLO NIETO LLAMADO BENITO en las 1.385 fichas de la colonia: los cinco Benito o Benedetto que salen son el propio Benedetto (indexado OLAZIO), un hombre de 32 años, un niño francés, un recién nacido y una niña de ocho a la que el padrón apuntó como varón. Queda UNA sin poder juzgar: BARONI TERESA, 25 años, casada en 1884, la única de las diecisiete que declara «Italia, TORINO», que es de donde son los Alasia — pero tiene un solo hijo, y sin segundo varón la costumbre no dice nada. Ni descartada ni confirmada. Y tres de los nueve apellidos —DACARRO, GIUPPONI y ZANUTICH— NO EXISTEN en la colonia en 1887, luego esas bodas son posteriores al censo. ESTO NO PRUEBA que ninguna hija se casara con un Baroni o un Rossini: prueba que el censo no puede identificarla. Lo deciden las actas de la parroquia de Emilia, ya pedidas por carta.*** Y MÁS TARDE EL MISMO DÍA SE BAJÓ EL PADRÓN ENTERO DE LA COLONIA —1.368 personas, con los doce campos— y el test de los nombres dejó de ser un sondeo. *** Filtrando por quién podía ser hija suya —italiana, nacida después de 1858, casada después de 1873— salen *** CINCUENTA Y NUEVE mujeres ***, no las ocho de los nueve apellidos que se venían mirando. Y buscando en las 1.368 fichas todos los Benito, Benedetto, Magdalena y Bartolomeo aparecen diez personas, de las que *** ninguna es nieta suya ***: él y su mujer, su hija menor Madalenia, la niña de la casa Bertino, dos criaturas de casas criolla y suiza, un hombre adulto y dos Maddalena nacidas ya en Italia.\n\n*** No hay un solo nieto llamado Benito en toda Colonia Emilia. *** El negativo es exhaustivo, no una muestra — aunque sólo es concluyente para las catorce mujeres casadas antes de 1880 y con tres hijos o más; en las casadas después el segundo varón aún no había nacido en 1887, y para ésas queda la prueba del censo de 1895.\n\n*** Y eso dice algo sobre los cuatro hijos que le faltan: no son hijas casadas viviendo en la colonia. *** Sumado a que los tres mayores no aparecen en toda la provincia, la explicación más económica —y es deducción, no hecho— es que buena parte de los catorce murió de niño. Que una mujer casada en 1857 declarase catorce partos y sólo diez hijos identificables era lo normal, no la excepción.\n\n*** Y HAY UNA SEGUNDA PUERTA, QUE SE ABRIÓ AL LISTAR LOS TRECE «SOBRINOS» DE LA COLONIA. *** En casa de los Chartier vive una niña de tres años registrada como *** «ALASIA LUISA, sobrina» ***, nacida en Santa Fe. Que el empadronador le pusiera un apellido DISTINTO del cabeza de casa es un acto deliberado: Luisa no es Chartier, es Alasia. Y si es sobrina de esa casa y se apellida así, lo es por parte de INÉS, no del francés Eduardo — o sea que *** Inés era Allasia de soltera ***, tal como decían los índices parroquiales.\n\n*** Y con el padrón entero delante se ve algo que antes no se podía ver: el padre de Luisa no está en la colonia. *** Repasados los tres hogares Alasia y todos sus hijos, no hay ninguna Luisa. Su padre —un varón Alasia con una hija nacida hacia 1884— no vivía allí en junio de 1887; y que la niña se críe con su tía apunta a que había muerto.\n\n*** Eso abre otra explicación para sus hijos mayores, y hay que decirla como hipótesis: *** si Inés es hija suya, el padre de Luisa sería otro hijo suyo — y los candidatos son Bartolomeo, Salvatore Fortunato Antonio y Domenico Carlo, que en 1884 tendrían entre veintiuno y veinticuatro años. En vez de haber muerto de niños en Italia, al menos uno habría llegado a Argentina, se habría casado, habría tenido una hija hacia 1884 y habría muerto joven. Las dos explicaciones siguen en pie; ésta sólo se sostiene si Inés resulta hija suya, y eso lo dice el acta de matrimonio Chartier × Allasia que ya está pedida.\n\n*** Y HAY UN CUARTO ALASIA EN LA COLONIA QUE NADIE HABÍA CONTADO, Y DICE DE DÓNDE ERA. *** Listando los veintiocho Alasia del padrón bajo las siete grafías aparece, solo y en su propia línea, *** «ALASIO ANTONIO, 22 años, soltero, PATRÓN, nacido en ITALIA, CÚNEO» ***. No pertenece a ninguno de los tres hogares conocidos y no consta parentesco con nadie.\n\n*** Es el único Alasia de toda la colonia que declara la provincia italiana. *** Hasta hoy el origen piamontés de esta familia descansaba en el árbol de FamilySearch y en el acta de 1857 de Savigliano; ahora hay un documento argentino, independiente, que ata a un Alasia de esa misma colonia con la provincia de Cuneo — donde está Savigliano desde 1859. Y encaja con el otro dato de provincia que teníamos, el «Italia, Torino» de Teresa Baroni: Savigliano fue de Turín hasta 1859 y de Cuneo después, así que los dos no se contradicen sino que se refuerzan.\n\nY es candidato a uno de sus cuatro hijos sin localizar: nacido hacia 1865 en Italia, habría cruzado de niño, y entre Domenico Carlo (1863) y Nicolás (1872) hay un hueco de nueve años donde caben. Además es *** patrón, como él ***: tiene tierra propia a los veintidós, que es lo que hace un colono cuando establece a un hijo. No está probado — no vive en su casa ni consta parentesco, y podría ser sobrino o primo.\n\n*** Y EL CENSO NACIONAL DE 1895 LO CONFIRMA OTRA VEZ, POR SEPARADO. *** En la misma Colonia Emilia, ocho años después: «BERTINO MAGDALENA, 56 años, VIUDA, italiana, labradora, sabe leer y escribir, POSEE PROPIEDAD RAÍZ, CATORCE HIJOS», y con ella Domingo Juan de 19, Francisco de 17, María de 15 y MARGARITA DE 13. Los cuatro hermanos han envejecido EXACTAMENTE OCHO AÑOS respecto al censo de 1887 —11→19, 9→17, 7→15, 5→13—, que es justo lo que median entre los dos padrones. No es un parecido de nombres: es la misma familia documentada dos veces.\n\nY ese segundo censo añade tres cosas. BENEDETTO HABÍA MUERTO: ella consta VIUDA en 1895 y él estaba vivo y era cabeza de familia en 1887, así que murió entre esas dos fechas — el árbol decía 1892 y cae dentro. Ella tiene 56, o sea NACIDA HACIA 1839, la fecha exacta del árbol. Y no era una jornalera: TENÍA TIERRA PROPIA Y SABÍA LEER, siendo mujer, viuda e inmigrante, en 1895.\n\nSEIS COSAS ENCAJAN A LA VEZ. El padre se llama BENEDETTO, no «Benito» castellanizado. Tiene sesenta y cinco años, o sea que nació hacia 1822 — la fecha exacta del árbol. La madre nació hacia 1840; el árbol decía 1839. Hay una Margarita de cinco años nacida en Santa Fe, y el acta de Vera de 1900 le da diecinueve y la hace «natural de Col. Emilia». Y ahí están, en la misma casa, *** LOS DOS TESTIGOS DE SU BODA ***: «Don DOMINGO ALASIA y Doña MARÍA DE ALASIA» del acta son DOMINGO, su hermano mayor, y MARÍA MOLINA, la mujer de Domingo. Trece años después firmaron la boda de la hermana pequeña.\n\nY CAE LA ÚNICA OBJECIÓN SERIA QUE QUEDABA. Se decía que la cronología era justa: una madre de cuarenta y dos años al nacer Margarita, veinticuatro después de casarse. No era justa: *** TUVO CATORCE HIJOS ***, y Margarita fue la duodécima.\n\nNO ESTABAN SOLOS EN LA COLONIA. El mismo padrón de 1887 tiene OTRAS DOS CASAS del apellido en Colonia Emilia: la de ALACIO DOMINGO, de SESENTA Y CUATRO años, con su mujer Luigia y dos hijos ya casados viviendo bajo su techo —Tomaso y Bernardo, con sus mujeres y sus niños—, y la de ALAZIO JUAN, de cuarenta y cinco, con siete hijos. Domingo tiene sesenta y cuatro años y Benedetto sesenta y cinco: dos hombres del mismo apellido y la misma edad en una colonia de mil trescientas almas. Lo más probable es que fueran HERMANOS, y que la emigración fuera en cadena. NO ESTÁ PROBADO —el censo no da filiaciones— y se comprobaría con las defunciones argentinas de los dos o con los libros de la parroquia Natividad de la Virgen Niña de Emilia.\n\nSE ENCONTRÓ PORQUE SE DEJÓ DE BUSCAR POR APELLIDO. La búsqueda de «Alasia» en Emilia daba una sola persona y llevaba dos días bloqueando esto. Hubo que bajar el PADRÓN ENTERO del distrito —1.383 personas, 348 apellidos— y comparar por semejanza: en la misma colonia convivían CUATRO GRAFÍAS del apellido, ALASIA, ALASIO, ALACIO y ALAZIO, y la familia estaba escrita OLAZIO y ALAZIO. Ningún buscador por nombre lo habría dado.\n\n*** Y EL 27 DE AGOSTO POR LA TARDE SE ATÓ EL ÚLTIMO CABO. *** Quedaba una pega: la casilla «cuántos años de matrimonio» del censo de 1895 se leía VEINTICINCO, lo que daría una boda hacia 1870 y no en 1857. La lista completa de hijos lo resuelve. La primera, LUCIA, nace en 1859 —dos años después de la boda— y detrás vienen BARTOLOMEO en 1860, SALVATORE en 1861, DOMENICO CARLO en 1863, DOMINGO en 1864 y otra LUCIA en 1866. Con seis hijos anteriores a 1870, una boda en 1870 es imposible. La cifra del censo es un TREINTA Y CINCO mal escrito o mal leído: 1857 más 35 son 1892, el año en que ella enviudó. Contó lo que DURÓ el matrimonio, no lo transcurrido hasta 1895.\n\nY HAY UN DETALLE ONOMÁSTICO QUE APOYA A LOS ABUELOS: el primer hijo varón se llamó BARTOLOMEO, y el padre de Benedetto sería BARTOLOMEO ALLASIA. La costumbre piamontesa ponía al primer varón el nombre del abuelo paterno. No es prueba, pero es exactamente lo que cabría esperar. Lo mismo con las dos LUCIA, de 1859 y 1866, y la abuela materna LUCIA GAIDO.\n\nLOS DIEZ HIJOS QUE SE LE CONOCEN, sumando el árbol y los dos censos: Lucia (1859-1859), Bartolomeo (1860), Salvatore Fortunato (1861), Domenico Carlo (1863), Domingo (1864), Lucia Margarita (1866-1866), Nicolás (~1872), Juan (1875), Francisco (1878), María Magdalena (1879), MARGARITA (1882) y Madalenia (~1886). Doce de los catorce que ella declaró.\n\nLO QUE SIGUE ES EL RAZONAMIENTO DE ANTES, QUE SE DEJA COMO ESTABA PORQUE ES LA HISTORIA DE CÓMO SE LLEGÓ:\n\nLO ÚNICO QUE DICE UN ACTA es que Margarita Alasia era «hija legítima de Don BENITO ALASIA y de Doña MAGDALENA BERTINI» (Vera, 25-10-1900). Nada más. Ni fechas, ni pueblo de ellos, ni si vivían.\n\nTODO LO DEMÁS —que naciera en 1822, que muriera en 1892, que se casara en Savigliano el 13 de abril de 1857, y con ello los cuatro abuelos— sale de un árbol de FamilySearch, no de un documento. Identificar al «Benito Alasia» del acta argentina con el «Benedetto Alasia» de Savigliano es una INFERENCIA, y estas son sus dos caras:\n\nA FAVOR. Coinciden los DOS apellidos y los DOS nombres de pila a la vez (Benito = Benedetto, Magdalena = Maddalena): eso es mucho más fuerte que un apellido suelto. ALASIA/ALLASIA es piamontés casi en exclusiva —de 101 apariciones en Italia, 89 en Piamonte— y Colonia Emilia, en el departamento San Justo, era zona de colonos piamonteses. Y el árbol ya ha demostrado que trabaja sobre documentos: dijo que Enrichetta Vanni murió en 1923 y el acta de Trassilico lo confirmó.\n\nEN CONTRA. Si la mujer nació en 1839, al nacer Margarita hacia 1881 tendría CUARENTA Y DOS AÑOS y habrían pasado veinticuatro desde la boda: posible, pero justo en el límite. Y BERTINO no es sólo piamontés: de 240 apariciones, 98 son sicilianas y 92 piamontesas. Además, los colonos piamonteses de Santa Fe llegaban en bloque desde los mismos pueblos, así que un mismo par de apellidos puede repetirse en la misma colonia.\n\nVEREDICTO: probable, no probado. Se sostiene mientras no aparezca otro Benito Alasia casado con una Magdalena Bertini en la misma zona.\n\n*** UN PRIMER BARRIDO DEL CENSO DE 1887 PARECIÓ DEBILITARLO, Y ERA UNA FALSA ALARMA MÍA. *** Busqué a la familia con las grafías ALASIA, ALLASIA, ALACIA, BERTINO y BERTINI y no encontré a nadie: ni un Benito de sesenta y cinco años, ni una Magdalena, ni ninguna Margarita. Llegué a anotarlo como tres ausencias preocupantes.\n\n*** ESTABAN TODOS. EL FALLO ERA MÍO: FALTABAN GRAFÍAS. *** En los padrones argentinos el apellido se escribe de oído, y éste tiene SIETE formas distintas en el mismo censo — Alasia, Alazio, Alassia, Alacio, Alasio, Allasia y Olazio. **Benedetto está indexado OLAZIO y sus hijos ALAZIO**, que eran justamente las dos que no había probado. Con ellas apareció la casa entera en Colonia Emilia, con Margarita de cinco años. LA LECCIÓN, y vale para toda búsqueda en padrones: NUNCA DAR UN NEGATIVO SIN HABER PROBADO TODAS LAS VARIANTES FONÉTICAS.\n\nSI SE CASÓ EN SAVIGLIANO EN 1857 Y SU HIJA NACIÓ EN SANTA FE HACIA 1882, LA FAMILIA EMIGRÓ ENTRE ESAS DOS FECHAS. Colonia Emilia y las colonias del departamento San Justo se poblaron sobre todo de piamonteses en los años setenta del siglo XIX: encaja.\n\nDÓNDE ESTÁ CADA COSA, comprobado el 27-8-2026:\n\n1802-1813 · *** AQUÍ ME EQUIVOQUÉ, Y LA CORRECCIÓN IMPORTA. *** Escribí que Savigliano estaba digitalizado en Antenati con Nati, Matrimoni y Morti napoleónicos, y que la misma serie estaba indizada en FamilySearch. **Las dos cosas son falsas.** Venían de un resumen de buscador, no del catálogo. Al leer el catálogo de verdad: el Archivio di Stato di CUNEO tiene 191 municipios y 50.891 registros, y **de Savigliano hay UNO SOLO**. Y la colección 1392991 de FamilySearch cubre los tribunales de Saluzzo y Mondovì, no Savigliano.\n\n*** Y EL 28 DE AGOSTO SE LEYÓ ESE ÚNICO REGISTRO, ENTERO. *** Son los ANEXOS DE MATRIMONIO DE 1808 del distrito de Savigliano: dieciséis páginas, cuatro expedientes de boda, papeles de Lagnasco, Cherasco, Cavallermaggiore, Saluzzo y Casale. **Ni un Alasia ni un Bertino en ninguna.** Negativo firme: Antenati queda cerrado para esta rama.\n\nPERO SACÓ ALGO QUE SÍ SIRVE. Los extractos de 1808 citan libro y página de las parroquias de Savigliano, y nombran dos que no conocíamos: **SAN SALVATORE y SAN PIETRO**, además de la San Giovanni Battista que daba el árbol. Savigliano tenía al menos TRES parroquias, así que las cartas piden ahora que miren las tres.\n\n1814-1865 · EL AGUJERO. En el Reino de Cerdeña no hubo registro civil: entre la caída de Napoleón y la unificación, TODO es parroquial. Y ahí caen justo las tres fechas que importan: el nacimiento de Benedetto (1822), el de su mujer (1839) y la boda de los dos (1857). Hay que pedirlo a la parroquia o al Archivio Diocesano di Torino.\n\n1866 EN ADELANTE · el registro civil del Comune di Savigliano. Pero para entonces la familia ya estaba en Santa Fe.\n\nY HAY UNA CUARTA VÍA, ARGENTINA Y MÁS BARATA: el CENSO NACIONAL DE 1895. Benedetto había muerto (1892), pero su viuda vivía todavía —murió en 1899— y Margarita tenía trece años. El censo de 1895 pregunta AÑO DE LLEGADA al país: una sola hoja de Colonia Emilia daría la fecha de la emigración, la lista entera de los hijos y de qué provincia italiana se declaraban.", "padre": "bartolomeo_allasia", "madre": "lucia_gaido", "conyuge": "maria_maddalena_bertino", "hijos": ["margarita_alasia", "domingo_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_maddalena_bertino": {"id": "maria_maddalena_bertino", "nombre": "Maria Maddalena Bertino", "legal": "«Doña Magdalena Bertini» en el acta de 1900", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["celeri"], "resumen": "Piamontesa de Savigliano, madre de Margarita Alasia.", "datos": [["Nacimiento", "1839, según el árbol de FamilySearch"], ["Defunción", "1899, misma fuente — un año antes de la boda de su hija"], ["Matrimonio", "13 de abril de 1857, San Giovanni Battista, Savigliano, Cuneo"], ["Cónyuge", "BENEDETTO ALASIA"], ["Padres", "GIOVANNI DOMENICO BERTINO y CATTERINA BONAVIA, por FamilySearch"], ["*** CATORCE HIJOS ***", "es lo que declara ella misma en el censo nacional de 1895, siendo ya viuda. Del árbol se conocen diez, y sólo ocho aparecen vivos en el censo de 1887: faltan seis"], ["Los tres mayores no llegaron a Argentina", "BARTOLOMEO (1860), SALVATORE FORTUNATO ANTONIO (1861) y DOMENICO CARLO (1863) NO aparecen en el censo de 1887 en ninguna parte de la provincia, bajo ninguna de las siete grafías del apellido. Lo más probable es que murieran de niños en Savigliano, antes de la emigración — pero es una deducción, no un hecho probado"], ["Apellido", "BERTINO en Piamonte, «Bertini» en el acta argentina"]], "vida": "1839–1899", "lug": "", "mapa": null, "sinacta": "Probada como madre de Margarita por el acta de matrimonio de 1900. Si murió en 1899, su hija se casó de luto reciente, con diecinueve años y sin madre.\n\nSe casó con dieciocho años. Falta comprobarlo todo con actas.\n\n*** 29 DE AGOSTO DE 2026 — SE ESTRECHA EL CERCO SOBRE LAS HIJAS QUE FALTAN. *** De los catorce hijos que ella misma declaró, seis siguen sin nombre, y las hijas casadas son las más difíciles de encontrar porque desaparecen bajo el apellido del marido: el censo no da apellido de soltera. La única pista son los índices de la parroquia de Emilia publicados por Hugo Alloa, que listan nueve apellidos casados con ALLASIA — Baroni, Busatto, Chartier, Dacarro, Giupponi, Palmier, Ronzoni, Rossini y Zanutich.\n\nSe buscaron los nueve en el censo de 1887. Cuatro daban cero, pero ese cero estaba mal hecho: se habían buscado con una sola grafía, cuando el propio apellido de su marido aparece de siete maneras en ese mismo padrón. Repetido con treinta y dos variantes fonéticas, *** dos de los cuatro ceros eran falsos. ***\n\nEl que vale es ZANUTICH, indexado sin la ce hache final: en toda la provincia había *** tres, y los tres solteros *** — ALBERTO de veinte años, JUAN de dieciocho y LUDOVICO de dieciséis, italianos, en San Justo, Colonia Angeloni, entre vecinos friulanos, que es justo de donde es ese apellido. *** Luego la boda Zanutich × Allasia de la parroquia de Emilia es posterior a junio de 1887 y el novio es casi seguro uno de esos tres. *** Eso convierte una pregunta vaga en una petición concreta al Archivo Arquidiocesano, ya añadida a la carta. Si esa Allasia resulta hija suya, es una de las seis que faltan. No está probado: lo probado es que no había ningún otro Zanutich en la provincia y que estos tres estaban solteros.\n\nLos otros tres se cierran: BUSATTO y GIUPPONI no existen en la provincia ni con ocho variantes cada uno, así que esas bodas también son posteriores a 1887 o se celebraron fuera; y la única DACARO es una mujer de treinta años sola en una pensión del casco urbano de Santa Fe, no en la colonia, y se descarta.\n\n*** EL MISMO DÍA, MÁS TARDE — SE PROBÓ UN MÉTODO NUEVO: LOS NOMBRES DE LOS NIETOS. *** En estas familias el orden de los nombres no era libre: el primer hijo varón llevaba el nombre del abuelo paterno y el segundo el del abuelo materno; la primera hija el de la abuela paterna y la segunda el de la abuela materna. Eso significa que una hija suya casada con cualquiera debería tener entre sus hijos un BENITO —por su padre— y una MAGDALENA —por ella—. *** Y esos nombres el censo sí los da, aunque no dé el apellido de soltera. Es la única forma de mirar dentro de una familia sin saber de qué apellido era la madre. ***\n\nSe leyeron los treinta y un niños de los ocho hogares de esos apellidos en Colonia Emilia. *** Ni un solo Benito, Benedetto ni Magdalena. *** El negativo debilita la hipótesis, pero no la mata: la costumbre es fuerte y no es una ley, en el Piamonte se cumple menos que en el sur, y sólo cinco de los ocho hogares tienen dos hijos o más, que es el mínimo para que la prueba signifique algo.\n\n*** LO QUE SÍ ES FIRME ES LA ARITMÉTICA, Y ELIMINA A TRES. *** Ella se casó el 13 de abril de 1857 y su hijo mayor conocido es de 1860, así que ninguna hija suya pudo nacer antes de 1858. Quedan fuera RONZONI PAULA (35 años, o sea nacida hacia 1852, cinco años antes de la boda), BARONI JUANA la de Enrique (32, hacia 1855) y BARONI ANTONIA (30, hacia 1857 — y además sus cuatro hijos nacieron en Italia, o sea que se casó allí hacia 1877, cuando esta familia llevaba años en Argentina). Sobreviven cinco: Inés Chartier, Teresa, Juana, María y Clementina Baroni.\n\n*** Y DE AHÍ SALE UNA PRUEBA QUE SE PUEDE HACER Y QUE PUEDE FALLAR, que es justo lo que faltaba. *** Se reconstruyó el hogar entero de la mejor candidata y son tres personas: Juan Baroni de treinta y dos, Teresa de veinticinco y un solo hijo, JOSÉ, de un año. Por la regla de los nombres ese José lleva el nombre del padre de Juan — y *** el segundo hijo varón debería llevar el del padre de Teresa. *** Si en el censo de 1895 esa pareja tiene un segundo varón llamado BENITO, Teresa Baroni es hija suya y se recupera una de las catorce; si se llama de otra cosa, queda descartada. Es una petición concreta para la sesión de FamilySearch, y hasta ahora esta línea sólo producía candidatas que no se podían ni confirmar ni descartar.\n\n*** Y AL RECUPERAR LOS CAMPOS QUE EL CENSO SÍ PUBLICA, LA LISTA SE ORDENA DE VERDAD. *** Los AÑOS CASADOS dan el año de la boda directamente, que es mucho más decisivo que la edad. Con eso, de las ocho candidatas quedan tres eliminadas sin discusión: RONZONI PAULA se casó en 1872, cuando la hija mayor de Benedetto tenía doce años; BARONI JUANA la de Enrique nació hacia 1855, dos años antes de la boda de Benedetto; y BARONI ANTONIA se casó en 1877 y *** tuvo sus cuatro hijos en Italia ***, cuando esta familia llevaba cinco años en Argentina.\n\nY aparece un patrón que no se veía: *** tres Baroni —Juan, Jesús y Antonio, que por edades y por vivir en libretos seguidos parecen hermanos— se casaron los tres en 1884 ***, y los tres tienen un solo hijo en 1887. Tres hermanos casándose la misma temporada es corriente; con tres hermanas, más todavía. Y a ella le faltan por localizar cuatro de los catorce: cuatro hijas nacidas entre 1864 y 1872 tendrían entre quince y veintitrés años en 1887 y estarían ya casadas y fuera de casa — que es exactamente la franja donde caen Teresa, Juana, María y Clementina. *** Es una coincidencia llamativa y nada más: el censo no da apellidos de soltera y Baroni es apellido corriente. ***\n\n*** Y APLICANDO EL MISMO TEST A TODA LA COLONIA, EN VEZ DE A NUEVE APELLIDOS, SALIÓ ALGO QUE NADIE BUSCABA: SU PROPIA FAMILIA. *** El buscador del censo también encuentra nombres de pila, no sólo apellidos, así que se buscaron BENITO y MAGDALENA en toda la provincia y se filtró Colonia Emilia. El método se validó solo: entre los resultados aparecen «Olazio Benedetto, 65» y «Bertina Madalena, 47», uno al lado del otro — ella y su marido en persona.\n\nY una de las coincidencias era una niña de un año llamada MAGDALENA BERTHA. Al reconstruir su entorno apareció, todo seguido y en el mismo tomo, *** una casa entera de nueve personas con su apellido: *** Juan Bertha de 45 años, Dominga Bertina de 28, CATARINA BERTINA de 57, Gabriel Bertina de 26, Valentín Bertha de 55, y cuatro niños — María de 5, Domingo de 4, Caterina de 3 y Magdalena de 1. El indexador escribe la misma familia «Bertina» y «Bertha» en líneas consecutivas, que es justo por lo que nadie los había visto: nunca se había barrido su apellido con variantes. Hechas las diez, en Colonia Emilia hay exactamente DIEZ: esos nueve y ella.\n\n*** (Corrijo aquí una cifra que di mal el mismo día: escribí que en toda la provincia había 216 Bertino. Son 105. *** El buscador del censo busca en el nombre completo, y BERTA y BERTHA son nombres de pila corrientísimos entre los suizos y alemanes que poblaron Las Colonias: de los 216, ciento once son niñas llamadas Berta, no personas apellidadas así. Los apellidos reales se reparten en Las Colonias 44, Iriondo 23 y La Capital 22.)\n\n*** Hasta hoy su rama era un hueco total en Argentina *** — de ella sólo teníamos el nombre, la boda de 1857 y unos padres sin acta. Y hay tres cosas que encajan: la madre de Magdalena se llamaba CATTERINA y en esa casa hay una Catarina de 57 años; Juan de 45 es de su misma quinta y candidato a hermano; y la niña de un año se llama MAGDALENA, que por la costumbre de los nombres viene de una abuela o de una tía — y ella vivía a unas manzanas.\n\n*** No está probado: el censo no dice en ninguna parte que esa gente sea familia suya, y las colonias se poblaban por cadenas de paisanos del mismo valle, así que dos familias Bertino sin parentesco en el mismo pueblo es perfectamente posible. *** Lo cerraría el matrimonio de Juan Bertino con Dominga, hacia 1880 en la parroquia de Emilia, que nombraría a los padres de él; o el bautismo de la niña Magdalena, hacia 1886, donde es muy probable que los padrinos fueran ella misma o Benedetto. Las dos cosas se han añadido a la carta del Archivo Arquidiocesano.\n\n*** Y EL MISMO DÍA, MÁS TARDE, APARECIÓ LA COINCIDENCIA MÁS CONCRETA DE TODAS. *** Las fichas del censo publican siete campos que hasta hoy se estaban perdiendo por un fallo de mi propio script — parentesco, estado civil, HIJOS TENIDOS, AÑOS CASADOS, dependencia, y si sabían leer y escribir. Recuperados, dicen esto:\n\n      MAGDALENA BERTINO ... 47 años, *** 31 años casada ***, 14 hijos\n      CATARINA BERTINO .... 57 años, *** 31 años casada ***,  3 hijos\n\n*** Dos mujeres del mismo apellido, en el mismo pueblo de cien casas, que declaran exactamente el mismo año de boda: 1856. *** Casar a dos hermanas en la misma temporada era lo más corriente del mundo. Y los cuatro niños de esa casa se llaman María, Domingo, *** CATERINA *** y *** MAGDALENA *** — que son justamente el nombre de ella y el de su madre, Catterina Bonavia. Va la cuarta coincidencia, y sigue sin probarse nada: el censo no dice que las dos casas sean parientes ni da apellidos de soltera.\n\n*** Y buscarla fuera de Emilia no ha dado nada. *** En LAS COLONIAS, el departamento vecino, hay cuarenta y cuatro personas con su apellido, y ninguna se puede proponer como hermana o hermano suyo. El único de su misma quinta es BERTINI DOMINGO, de cuarenta y seis años, patrón, con una hija Caterina y otra Magdalena — pero llegó a Argentina hacia 1880-1884, ocho o diez años después que esta familia, y sabe leer y escribir, cosa que ella no. Candidato flojo. *** La casa de Colonia Emilia sigue siendo, con diferencia, la mejor pista: es la única de toda la provincia donde una mujer Bertino declara exactamente los mismos treinta y un años de casada. ***\n\n*** Y EN IRIONDO, EL ÚLTIMO DEPARTAMENTO QUE QUEDABA, HAY UNA SEGUNDA CASA. *** COSTANZO BERTINO, de sesenta años, patrón, casado desde 1847 con una Margarita de cincuenta y cinco que declara seis hijos; cuatro hijos varones y otro, Marco, con casa propia al lado. Nació hacia 1827, trece años antes que ella, y emigró en la misma oleada. *** Por edad y por condición es el candidato más verosímil a hermano mayor que ha aparecido en toda la provincia ***, y su apellido está escrito exactamente BERTINO, que es la grafía piamontesa correcta.\n\n*** Pero hay un criterio que no se me había ocurrido usar y que inclina la balanza: la alfabetización. *** Ella era analfabeta, su marido también, y de sus diez hijos conocidos sólo dos sabían leer. En la casa de Colonia Emilia *** no sabe leer ni uno de los nueve ***; en la de Iriondo leen y escriben el padre y los cuatro hijos varones. El nivel de escuela se hereda dentro de una familia y dentro de un pueblo. Sumado a lo demás —la misma colonia, los mismos treinta y un años de casada, y unos niños llamados Caterina y Magdalena—, la casa de Colonia Emilia sigue siendo claramente la mejor candidata; Iriondo no se descarta.\n\n(Y un afinamiento de la cifra: de los 105 apellidos reales de la provincia, cuarenta y seis son BERTON — que no es una grafía de Bertino sino un apellido véneto y piamontés por sí mismo. Quitándolo, el conjunto que de verdad interesa son unas treinta y ocho personas en toda la provincia, y los tres departamentos donde están ya se han mirado todos.)\n\nUn detalle que ordena la petición: si Catarina se casó en 1856 no pudo ser en Emilia —la colonia no existía todavía—, sino *** en el Piamonte ***. Su acta de matrimonio nombraría a sus padres, y si son Giovanni Domenico Bertino y Catterina Bonavia, es hermana suya.\n\nY de paso el censo confirma lo suyo por segunda vía: *** declara los CATORCE HIJOS ya en junio de 1887 ***, ocho años antes que en el censo nacional de 1895 y siendo todavía casada, no viuda. Y sus 31 años de casada apuntan a 1856, a un año del 13 de abril de 1857 que dice el acta — lo normal en una cifra dicha de memoria.", "padre": "giovanni_domenico_bertino", "madre": "catterina_bonavia", "conyuge": "benedetto_alasia", "hijos": ["margarita_alasia", "domingo_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "bartolomeo_allasia": {"id": "bartolomeo_allasia", "nombre": "Bartolomeo Allasia", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 6, "ramas": ["celeri"], "resumen": "Piamontés, nacido hacia 1797. El antepasado más antiguo de la rama Rivas.", "datos": [["Nacimiento", "1797, según el árbol de FamilySearch"], ["Cónyuge", "LUCIA GAIDO (1800)"], ["Hijo", "BENEDETTO ALASIA (1822-1892)"], ["Zona", "SAVIGLIANO, provincia de Cuneo, Piamonte"], ["Fuente", "árbol de FamilySearch, identificador GZTS-5MB — sin acta"]], "vida": "n.1797", "lug": "", "mapa": null, "sinacta": "Sin acta. Si la fecha de 1797 es buena, es el antepasado más antiguo de todo el lado Rivas del árbol — casi un siglo más atrás de lo que había hace dos días, cuando esta rama entera era un hueco.\n\nSavigliano conserva registros parroquiales desde el siglo XVI. Aquí hay mucho por subir.\n\n*** RECTIFICACIÓN, DEL MISMO 27-8-2026. *** Escribí por la mañana que Savigliano estaba digitalizado en Antenati con Nati, Matrimoni y Morti del período napoleónico. ERA FALSO: lo había tomado del resumen de un buscador, no del catálogo. Leído el catálogo real del Archiv  "", "mapa": null, "sinacta": "Sin datos de archivo.", "padre": "tebaldo_celeri", "madre": "margarita_alasia", "conyuge": null, "hijos": [], "hermanos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "nerina_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "nerina_celeri": {"id": "nerina_celeri", "nombre": "Nerina Celeri", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 9, "ramas": ["celeri"], "resumen": "Hermana de Elba. Su nombre es el más italiano de las cinco y el más fácil de encontrar en un registro.", "datos": [["Padre", "el inmigrante Celeri"], ["Nombre", "NERINA es italiano y poco frecuente; en un padrón argentino identifica a la familia casi por sí solo"], ["Fuente", "memoria familiar"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Sin datos de archivo.", "padre": "tebaldo_celeri", "madre": "margarita_alasia", "conyuge": null, "hijos": [], "hermanos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_tenuta": {"id": "teresa_tenuta", "nombre": "Teresa Tenuta", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Mujer de Michele Volpentesta. Estuvo dos años en este árbol como un nombre de índice sin respaldo, y el 26 de agosto de 2026 un extracto parroquial de 1793 la nombró por fin.", "datos": [["Cónyuge", "MICHELE VOLPENTESTA († Rende, 20 de agosto de 1793, con setenta años)"], ["Hijos", "VINCENZO VOLPENTESTA (hacia 1776 – 19 de marzo de 1823), y PIETRO VOLPINTESTA, casado con Anna Belmonte († 1827) — este último sólo por índice"], ["De dónde sale", "el extracto de defunción de su marido, que lo llama «MICHAEL VOLPENTESTA VIR THERESIAE TENUTA» — marido de Teresa Tenuta"], ["Viuda desde", "agosto de 1793"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Su caso es el mejor ejemplo de por qué en este árbol el índice no cuenta como prueba. Los índices escaneados del blog la daban como madre de Vincenzo desde el principio, en dos filas distintas (Vincenzo 1823/8 y su hijo Pietro 1827/34). Pero el acta de 1823 se leyó dos veces —el original y la copia certificada de 1837— y las dos dejan la casilla de la madre EN BLANCO, con la raya impresa sin rellenar. Así que se decidió no abrirle ficha: un nombre sin documento no entra.\n\nLo que la rescató fue el extracto parroquial de la muerte de su marido, escondido dentro del expediente matrimonial de su nieta. Un documento en latín, de 1793, que la nombra en tres palabras: VIR THERESIAE TENUTA.\n\nDe ella misma no se sabe nada más: ni año, ni pueblo, ni padres, ni cuándo murió. En 1793 enviudó. Todo lo suyo sería parroquial, porque el registro civil no empieza hasta 1809. Dato al margen que conviene no olvidar: en el mismo Marano hay otro Vincenzo Volpintesta, hijo de un Ferdinando y de una ANNA MARIA TENUTA, muerto en 1855. Apellido de madre idéntico y familia distinta.\n\n*** 29 DE AGOSTO DE 2026 — AHORA TIENE HIJOS CON NOMBRE Y AÑO. *** Los libros de bautizos de la parroquia de Rende empiezan en 1731 y están transcritos en el blog calabrés. Barridos año por año, salen TRES hijos suyos, los tres con la misma fórmula «Volpintesta, Michele — Tenuta, Teresa»: PIETRO GAETANO en 1767 (acta 13), VINCENZO MERCURIO en 1770 (acta 48) y GREGORIO GIOACCHINO en 1773 (acta 41). Es decir: estuvo viviendo en RENDE por lo menos de 1767 a 1773, y allí enviudó en 1793.\n\n*** Y EL DE 1770 SE LLAMA VINCENZO. *** Si ese niño es nuestro Vincenzo, entonces la casilla que el acta de 1823 dejó en blanco queda por fin rellenada por una vía independiente, y ella deja de depender de las tres palabras latinas de 1793. Pero hay un choque —el acta de defunción dice que Vincenzo nació en Marano, y las edades dan 1773 o 1776, no 1770— que está explicado entero en la ficha de él. Sigue sin darse por bueno hasta ver el libro original, que está en FamilySearch y no en Antenati.\n\nDE SUS PROPIOS PADRES SIGUE SIN SABERSE NADA, y no será fácil: el matrimonio con Michele no está en los treinta y nueve años de índices de matrimonios de Rende que se han leído (1733-1750 y 1752-1772). O está en el único año que falta, 1751, o se casaron en la parroquia de ella. Familias TENUTA de Rende de aquellos años, por si alguna es la suya: Gaetano Tenuta con Isabella Chiappetta, Tommaso Tenuta con Chiara Russo, Biaggio Tenuta con Teresa Rocchetto, Vincenzo Tenuta con Rosa Rizzo y Antonio Tenuta con Carmina Di Simone.\n\n*** SE LA BUSCÓ EN DIECISÉIS AÑOS DE BAUTIZOS Y NO ESTÁ — Y SE SABE POR QUÉ. *** El 29 de agosto de 2026 se barrieron los bautizos de Rende de 1735 y de 1741 a 1755, año por año, en la franja alfabética donde cae TENUTA. Ninguna Teresa. Pero el fallo no es de ella: *** las transcripciones saltan de 1735 a 1741 — faltan 1736, 1737, 1738, 1739 y 1740 ***, y esos cinco años caen justo en el centro de la horquilla en que tuvo que nacer. Sus hijos se bautizan en 1767, 1770 y 1773; naciendo antes de 1735 habría tenido más de treinta y dos años al primero, y naciendo después de 1755, doce. O está en esos cinco años que faltan, o no era de Rende.\n\nEl barrido no fue en balde: dejó CINCO familias Tenuta de Rende documentadas con hijos en esos años, y una de ellas será la suya. *** La primera que hay que mirar es NICOLA TENUTA con TERESA CHIAPPETTA ***, con hijos en 1745, 1748, 1751 y 1753 — porque la madre se llama Teresa, y ponerle a una hija el nombre de la madre era lo más corriente del mundo. Las otras cuatro: Giuseppe Tenuta con Innocenza Turano, Tommaso Tenuta con Chiara, Biaggio Tenuta con Teresa Rocchetto y Michele Tenuta con Innocenza Mirabelli.\n\nTAMPOCO ESTÁ ENTERRADA EN RENDE ENTRE 1802 Y 1809, barridos los ocho años. Enviudó en agosto de 1793, así que o murió entre 1793 y 1801 —años que las transcripciones no tienen— o murió de 1809 en adelante, y entonces su acta ya es CIVIL y está en Antenati.\n\nY una advertencia que sale del mismo barrido y que hay que tener presente al leer todo lo que venga de esas tablas: la mujer de Tommaso Tenuta se llama Chiara en cinco filas, y su apellido está transcrito de TRES maneras distintas —Ruffolo, Russo y Di Bartolo—. *** La columna del apellido de la madre no siempre es de fiar. *** A ella eso no la toca, porque su nombre no viene de una transcripción sino de un documento: las tres palabras latinas de 1793.\n\nDONDE NO ESTÁ, Y ESO YA ES UN DATO (29 de agosto de 2026). Se han leído cuatro tablas parroquiales de Rende —los matrimonios de 1796 y 1798 y los entierros de 1804 y 1807, varios centenares de personas— y NO APARECE UN SOLO TENUTA: ni de novia, ni de madre, ni de difunta, ni de mujer de difunto. Se suma a la búsqueda anterior de su bautismo en Rende (1735 y 1741-1755), que también dio cero. Aquello se achacó a que al blog le faltan los años 1736-1740; ya no se puede achacar a eso. La explicación sencilla es que TENUTA NO ES UN APELLIDO DE RENDE, y encaja con el conflicto ya anotado en la ficha de su hijo Vincenzo, cuya acta de defunción dice que nació en MARANO. Así que deja de buscarse aquí: hay que buscarla en MARANO MARCHESATO, que es donde vive esta rama. Esto no prueba que no exista ningún Tenuta en Rende en otros años — es un indicio fuerte, no una demostración.", "padre": null, "madre": null, "conyuge": "michele_volpintesta", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "rosina_salerno": {"id": "rosina_salerno", "nombre": "Rosina Salerno", "legal": "ROSE SALERNO en Estados Unidos", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["salerno"], "resumen": "Mujer de Antonio. Salerno de apellido de soltera, como él, y también de la provincia de Cosenza. Llegó a Nueva York en el vapor Giuseppe Verdi y sobrevivió a su marido.", "datos": [["Nacimiento", "hacia 1901-1907, provincia de COSENZA, Italia — el censo de 1950 le da 43 años, su petición de naturalización una fecha algo anterior"], ["Apellido", "SALERNO de soltera. Se casó con un Salerno sin ser pariente conocida: en estos pueblos el apellido no identifica a una familia"], ["Emigración", "llegó a NUEVA YORK en el vapor GIUSEPPE VERDI, en febrero de los años veinte — la cifra exacta del año no se lee con seguridad"], ["Matrimonio", "19 de mayo de 1920, con Antonio Salerno"], ["Hijos", "Domenico (1922) y Filomena (1925), los dos en Riverdale, Illinois"], ["Nacionalización", "petición propia n.º 60555; su marido se nacionalizó el 25 de enero de 1929"], ["Padres", "por el árbol de FamilySearch, RAFFAELE SALERNO y CHERUBINA CUNDARI — sin acta"], ["Viva en", "mayo de 1981, cuando enviudó"]], "vida": "c.1901–>1981", "lug": "Italia", "mapa": null, "sinacta": "Su petición de naturalización está archivada en la ficha de Antonio, pero la imagen es de baja resolución y varias cifras —su año de nacimiento y el del viaje— no se leen con seguridad. Convendría volver a pedirla a FamilySearch en tamaño completo.\n\nLo que sí queda claro: se casó el 19 de mayo de 1920, llegó en el GIUSEPPE VERDI, y su marido se nacionalizó el 25 de enero de 1929. El árbol de FamilySearch la hace hija de Raffaele Salerno y Cherubina Cundari, y nieta de Vincenzo Salerno y Angela Rosa Cardamone por un lado y de Giuseppe Cundari y Anna Motta por otro. Nada de eso tiene acta todavía.", "padre": null, "madre": null, "conyuge": "antonio", "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dominick_salerno": {"id": "dominick_salerno", "nombre": "Domenico Salerno", "legal": "DOMINICK D. SALERNO", "rol": "sobrino", "rolNombre": "Sobrino", "gen": 9, "ramas": ["salerno"], "resumen": "Hijo mayor de Antonio y Rosina, el primero de la familia nacido en Estados Unidos. Guardagujas de ferrocarril.", "datos": [["Nacimiento", "11 de febrero de 1922, RIVERDALE, Illinois"], ["Nombre", "DOMENICO, por su tío Domenico Salerno, el hermano mayor de su padre que se quedó en Rende"], ["Padres", "Antonio Salerno y Rosina Salerno"], ["Oficio", "SWITCHMAN (guardagujas) de la compañía de ferrocarril, 36 horas en 1950"], ["Familia", "en 1950 vivía en casa de sus padres con su mujer MARY L. y una hija de dos años, BEVERLEE"], ["Vivo en", "mayo de 1981, en Riverdale, cuando murió su padre"]], "vida": "1922–>1981", "lug": "RIVERDALE", "mapa": null, "sinacta": "Sale de tres documentos de su padre: la petición de naturalización de 1925 le da la fecha exacta de nacimiento, el censo de 1950 lo pone en casa con mujer e hija, y la esquela de 1981 lo nombra como el hijo que sobrevive. Su propia partida estaría en el condado de Cook, Illinois.\n\nLos «dos nietos y cinco bisnietos» de la esquela de 1981 salen casi seguro de él: en 1950 ya tenía una hija de dos años. Por esta rama hay descendencia americana viva.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "hijos": [], "hermanos": ["filomena_salerno_usa"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_salerno_usa": {"id": "filomena_salerno_usa", "nombre": "Filomena Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Sobrino", "gen": 9, "ramas": ["salerno"], "resumen": "Hija de Antonio y Rosina, nacida en Illinois y bautizada con el nombre de su abuela calabresa.", "datos": [["Nacimiento", "8 de febrero de 1925, RIVERDALE, Illinois"], ["Nombre", "FILOMENA, por su abuela Filomena Chiappetta, que seguía viva en Rende. Su padre le puso el nombre de una mujer a la que la niña no llegaría a conocer"], ["Padres", "Antonio Salerno y Rosina Salerno"], ["En 1950", "ya no vive en casa de sus padres, con veinticinco años — probablemente casada"]], "vida": "n.1925", "lug": "RIVERDALE", "mapa": null, "sinacta": "Sólo la conocemos por la petición de naturalización de su padre, de 1925, que da su fecha exacta. No aparece en el censo de 1950 ni en la esquela de 1981, así que o se casó y cambió de apellido, o murió antes que su padre. Su partida de nacimiento estaría en el condado de Cook, Illinois, y sería el documento que dijera con quién se casó.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "hijos": [], "hermanos": ["dominick_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "ciro_celeri": {"id": "ciro_celeri", "nombre": "Ciro Celeri", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["celeri"], "resumen": "El cuarto hijo de Callisto y Enrichetta, y el único que nació después de que se acabaran los registros digitalizados. Murió a los veintitrés años.", "datos": [["Nacimiento", "1867, Trassilico — según el árbol de FamilySearch (GVC6-C8J)"], ["Muerte", "1890, a los veintitrés años — misma fuente"], ["Padres", "CALLISTO CELERI y ENRICHETTA VANNI"], ["Hermanos", "Giuseppe Tullio Polinice (1860), Tebaldo (1862) y Dante Giuseppe (1864)"], ["Fuente", "árbol de FamilySearch. SIN ACTA"]], "vida": "1867–1890", "lug": "Trassilico", "mapa": null, "sinacta": "No tiene acta, y hay una razón limpia para ello: *** EL FONDO DIGITALIZADO DE TRASSILICO TERMINA EN 1865, Y CIRO NACIÓ EN 1867. *** Cae justo en el hueco. No es que no se haya buscado: es que no se puede ver.\n\nESO MISMO LO VUELVE INTERESANTE. Antes de conocerlo se había concluido, barriendo los índices de nacidos de 1861, 1863 y 1865, que con Antenati no iban a salir más hermanos y que los posteriores a 1866 ya eran registro civil italiano no digitalizado. Ciro aparece exactamente donde esa conclusión decía que tendría que estar lo que faltaba.\n\nSU ACTA DE NACIMIENTO Y LA DE DEFUNCIÓN EXISTEN, pero en el Comune di Trassilico o en el Tribunale di Lucca, no en Antenati. Y su muerte en 1890, con veintitrés años, cae en los años en que su hermano Tebaldo ya llevaba tiempo en Argentina.", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "hijos": [], "hermanos": ["tebaldo_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dante_celeri": {"id": "dante_celeri", "nombre": "Dante Giuseppe Celeri", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 7, "ramas": ["celeri"], "resumen": "El hermano menor de Tebaldo, nacido veinte meses después que él. Apareció el 27 de agosto de 2026, en el índice de nacidos de 1864.", "datos": [["Nacimiento", "5 de abril de 1864, a las OCHO DE LA MAÑANA, en TRASSILICO"], ["Dónde", "en la casa propia de sus padres, en el paraje llamado «NELLA PIAZZA DELLA MAESTÀ» — la misma plaza donde había nacido Tebaldo dos años antes"], ["Inscripción", "10 de abril de 1864, Comune di Trassilico, acta 25. Lo declaró su padre"], ["Padres", "CALLISTO CELERI, de 34 años, SEGRETARIO COMUNALE, y ENRICHETTA VANNI, de 30"], ["Testigos", "DARIO PIEROTTI, hijo de Angelo, y LEOPOLDO GAMBI, hijo de Jacopo, agricultor"], ["Quién firmó el acta", "el DOCTOR PIETRO ANDREINI, hijo del difunto Carlo, «Delegato Ufficiale dello Stato Civile» por acto del 30 de diciembre de 1863"], ["El nombre", "DANTE. Después de Polinice y de Archimede, el tercer hijo del secretario se llama como el poeta"]], "vida": "n.1864", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "hijos": [], "hermanos": ["tebaldo_celeri", "ciro_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "5 de abril de 1864 el parto; 10 el acta", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 25", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 51.7 «Nati» 1864"], ["Signatura", "ark:/12657/an_ua35853264 — hash 5vX82KK, 44 imágenes; el acta en la página 14, el índice alfabético en las 42 y 43"]], "literal": "", "traduccion": "El año 1864, el día 10 de abril. Ante mí, el infrascrito ANDREINI DOCTOR PIETRO, hijo del difunto Carlo, Delegado Oficial del Estado Civil del Ayuntamiento de Trassilico, Circondario de la Garfagnana, compareció CELERI CALLISTO, HIJO DEL DIFUNTO DESIDERIO, de TREINTA Y CUATRO años, SECRETARIO DEL AYUNTAMIENTO, nacido y domiciliado en Trassilico,\n\nel cual, en presencia de DARIO PIEROTTI hijo de Angelo, sin profesión, y de LEOPOLDO GAMBI hijo de Jacopo, agricultor, testigos mayores de edad, ambos nacidos y domiciliados en Trassilico, ha declarado que el día CINCO del corriente mes y año, a las OCHO DE LA MAÑANA, le nació en la casa de su habitación, sita en Trassilico, EN EL PARAJE LLAMADO EN LA PLAZA DE LA MAESTÀ,\n\nde VANNI ENRICHETTA, hija del difunto Pietro, de TREINTA años, sin profesión, nacida y domiciliada en Trassilico, su legítima consorte, un hijo al que se impusieron los nombres de DANTE GIUSEPPE.", "notas": ["*** EL TERCER HIJO DOCUMENTADO DE CALLISTO Y ENRICHETTA. *** Van Giuseppe Tullio Polinice (noviembre de 1860), Tebaldo Jacopo Archimede (julio de 1862) y Dante Giuseppe (abril de 1864): uno cada veinte meses.", "Y SIGUE LA MISMA MANÍA CULTA. Polinice, Archimede y ahora DANTE. En un pueblo de cien vecinos, el secretario del ayuntamiento bautizaba a sus hijos con la biblioteca delante.", "LA CASA YA ES SUYA Y ESTÁ EN LA PLAZA. En 1860 vivían «dai Bottegai»; en 1862 Tebaldo nació en casa de LUISA VANNI, «Alla Maestà»; en 1864 la casa propia de Callisto está «NELLA PIAZZA DELLA MAESTÀ». Es la misma plaza: lo de 1862 no fue un traslado a otro barrio, fue la casa de al lado.", "*** Y PRUEBA QUE CALLISTO SEGUÍA DE SECRETARIO EN 1864. *** No sólo aquí: en ese mismo registro firma como testigo de vecinos en las actas 24, 47, 48, 49, 52 y 53, siempre como «Celeri Callisto fu Desiderio, Segretario Comunale». La pregunta de cuándo dejó el cargo queda acotada: en julio de 1864 seguía en él.", "*** Y APARECIÓ SU FE DE BAUTISMO, CON UN DETALLE QUE VALE. *** Está en los anexos de nacimientos de 1864 (Registro 63.5, página 124), y dice que
