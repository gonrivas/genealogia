dos oficios de pueblo y dos hombres mayores. Francesco declaró treinta y ocho años el día en que cumplía treinta y siete.", "Su acta está en un volumen tramposo: el registro 99 de Rende «normal» tiene sólo dos páginas, y el bueno es el «suplemento 2», de noventa y cuatro. Lo cierra Domenico Pisani en Rende el 1 de enero de 1908.", "Tenía doce años en 1919. Se quedó en Italia con sus padres."], "claves": [["Nacimiento", "21 de diciembre de 1907, 4:30 de la madrugada, contrada S. Agostino"], ["Registrado", "el mismo día, siete horas después"], ["Testigos", "un carpintero de 61 años y un zapatero de 77"], ["En 1919", "12 años; se quedó"]]}, "maria": {"id": "maria", "nombre": "Maria Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "La menor de los nueve documentados. Nacida en contrada S. Agostino la noche del 23 de septiembre de 1909; tenía 10 años en 1919.", "datos": [["Nacimiento", "23 de septiembre de 1909, 23:35, Rende — acta 206"], ["Lugar", "contrada S. Agostino"], ["Padres", "Salerno Francesco y Chiappetta Filomena"]], "vida": "n.1909", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "24 de septiembre de 1909, 10:40 h", "lugar": "Rende", "ref": "acta 206", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 101 «Nati» 1909"], ["Registro", "an_ua35988732 · hash 5G6v3x6"], ["Página", "77 de 109"], ["Año manuscrito", "«millenovecento nove» — coincide con el catálogo"], ["Oficial", "Costabile Federico (firma al pie; la línea «Avanti di me» quedó en blanco)"]], "literal": "è comparso Salerno Francesco, di anni trentotto, contadino, domiciliato in Rende…\n…alle ore ventitre e minuti trentacinque, del dì ventitre del corrente mese, nella\ncasa posta in Contrada S. Agostino, da Chiappetta Filomena, contadina, sua legittima\nmoglie seco lui convivente… il nome di Maria", "traduccion": "El año mil novecientos nueve, el día veinticuatro de septiembre, a las diez y cuarenta de la mañana, en la casa comunal. Ante [la línea del nombre del oficial quedó EN BLANCO], Oficial del Estado Civil del municipio de Rende, ha comparecido SALERNO FRANCESCO, de treinta y ocho años, campesino, domiciliado en Rende.\n\nDeclara que a las veintitrés y treinta y cinco del día veintitrés del corriente mes, en la casa sita en CONTRADA S. AGOSTINO, de CHIAPPETTA FILOMENA, campesina, su LEGÍTIMA esposa, conviviente con él, ha nacido una niña de sexo femenino que me presenta, y a la que da el nombre de MARIA.\n\nTestigos: Ruffolo Serafino, de cincuenta y tres años, campesino; y Rende Tommaso, de treinta y cinco años, campesino, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, no la han firmado conmigo por ser analfabetos. Firma FEDERICO COSTABILE.", "notas": ["El escribano se dejó SIN RELLENAR la línea «Avanti di me»: el acta no dice quién la autorizó. Lo resuelve la firma del pie, Federico Costabile, que en las actas vecinas de la misma apertura consta como «assessore delegato per gli atti di Stato Civile».", "Aquí la edad declarada del padre es EXACTA por una vez: treinta y ocho años, y había nacido en diciembre de 1870. En 1902 y 1904 se había quedado corto o largo por un año.", "En la MISMA apertura, el acta 207 lleva como testigo a un «Salerno Francesco, di anni trentotto, contadino»: misma edad y mismo oficio. Es él, que se quedó de testigo del vecino después de inscribir a su hija. Y ese acta 207 lo declara una comadrona porque el marido «è in America»: el pueblo ya estaba emigrando."], "imgs": [{"u": "actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20Maria%20Salerno%20-%20Rende%20acta%20206.jpg", "t": "Maria Salerno - Rende acta 206"}], "zooms": [{"u": "actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20acta%20206%20completa.jpg", "t": "Acta 206 completa"}, {"u": "actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20testigos%20y%20firma%20de%20Federico%20Costabile.jpg", "t": "Testigos y firma de Federico Costabile"}]}], "nActas": 1, "nImgs": 4, "titulo": "El escribano olvidó su nombre", "parrafos": ["Nació la noche del 23 de septiembre de 1909, a las once y treinta y cinco, en la contrada S. Agostino. Es la menor de los nueve hijos documentados. Su padre la inscribió a la mañana siguiente y esta vez declaró bien su edad: treinta y ocho años.", "El acta tiene un hueco raro. La línea «Avanti di me» —ante mí— quedó en blanco: el escribano no llegó a escribir su propio nombre. Quien firma al pie es Federico Costabile, que en las actas vecinas consta como asesor delegado para los actos del estado civil. Los testigos fueron dos campesinos, Ruffolo Serafino de cincuenta y tres años y Rende Tommaso de treinta y cinco.", "En la misma apertura del registro, el acta siguiente lleva como testigo a un «Salerno Francesco, di anni trentotto, contadino»: misma edad, mismo oficio. Es él, que se quedó de testigo del vecino después de inscribir a su hija. Aquella acta la declaraba una comadrona porque el marido «è in America». El pueblo ya emigraba.", "Tenía diez años en 1919 y se quedó con sus padres. La familia recuerda a una «Marietta» que acabó en Canadá; Marietta es el diminutivo corriente de Maria, así que podría ser ella o su tía Maria Chiappetta, nacida en 1901. No hay ningún documento que lo decida."], "claves": [["Nacimiento", "23 de septiembre de 1909, 23:35, contrada S. Agostino"], ["Rareza del acta", "la línea del oficial quedó en blanco"], ["Edad declarada del padre", "38 años — exacta, por una vez"], ["En 1919", "10 años; se quedó"]]}, "salvatore": {"id": "salvatore", "nombre": "Salvatore Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Sobrino", "gen": 8, "ramas": ["salerno"], "resumen": "Primo hermano, no hermano. Hijo de Giovanni y Vincenzina. Tenía trece meses cuando murió su padre.", "datos": [["Nacimiento", "12 de enero de 1899, 3 de la madrugada, Rende — acta 13"], ["Lugar", "contrada Mari (lectura dudosa)"], ["Padres", "Salerno Giovanni y Morelli Vincenzina"], ["Matrimonio", "octubre de 1921, Rende, nº 67, con Misuraca Caterina Santa"], ["Huérfano", "de padre, a los trece meses"]], "vida": "n.1899", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "giovanni", "madre": "vincenzina", "conyuge": "caterina_misurelli", "hijos": [], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "13 de enero de 1899, 9:20 h", "lugar": "Rende", "ref": "acta 13", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "9 de 115"], ["Oficial", "Pisani Domenico, asesor decano"]], "literal": "è comparso Salerno Giovanni, di anni ventiquattro, contadino, domiciliato in Rende…\n…da Morelli Vincenzina sua moglie contadina seco lui convivente…", "traduccion": "El año mil ochocientos noventa y nueve, el día trece de enero, a las nueve y veinte de la mañana, en la casa comunal, ante Pisani Domenico, asesor decano por el alcalde impedido, ha comparecido SALERNO GIOVANNI, de veinticuatro años, campesino, domiciliado en Rende.\n\nDeclara que de MORELLI VINCENZINA, campesina, su esposa conviviente con él, ha nacido el día doce del corriente mes, a las tres de la madrugada, en la casa sita en contrada Mari, un niño de sexo masculino, al que impone el nombre de SALVATORE.\n\nTestigos: Cannata Giovanni, de cincuenta y un años, agricultor; y Cannataro Giuseppe, de treinta años, campesino.", "notas": ["ESTE SALVATORE ES SOBRINO, NO HERMANO. Se pidió el acta creyendo que era hijo de Francesco y Filomena, y el original es tajante: el declarante es Salerno GIOVANNI y la madre MORELLI VINCENZINA.", "Encaja perfectamente: boda de sus padres en octubre de 1897, primer hijo en enero de 1899. Y da un dato duro: cuando Giovanni murió el 23 de febrero de 1900, dejaba un hijo de trece meses.", "Anotación marginal de mano del siglo XX: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa».", "Si la familia esperaba un hermano llamado Salvatore, hay que buscarlo en otro año."], "imgs": [{"u": "actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20Salvatore%20Salerno%20-%20Rende%20acta%2013.jpg", "t": "Salvatore Salerno - Rende acta 13"}], "zooms": [{"u": "actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20acta%2013%20completa.jpg", "t": "Acta 13 completa"}, {"u": "actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201921.jpg", "t": "Anotacion marginal matrimonio 1921"}, {"u": "actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20contrada%20y%20nombre%20de%20la%20madre.jpg", "t": "Contrada y nombre de la madre"}, {"u": "actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20padre%20Giovanni%20Salerno%20y%20madre%20Morelli%20Vincenzina.jpg", "t": "Padre Giovanni Salerno y madre Morelli Vincenzina"}]}], "nActas": 1, "nImgs": 5, "titulo": "Se le tuvo por hermano", "parrafos": ["Nació el 12 de enero de 1899 a las tres de la madrugada, en una contrada escrita con letra tan fina que se lee «Mari», «Nari» o «Maio» y que no es ninguna de las conocidas de la familia. Su padre lo inscribió al día siguiente a las nueve y veinte, ante Pisani Domenico. Los testigos, un agricultor de cincuenta y un años y un campesino de treinta.", "Se pidió su acta dando por hecho que era otro hijo de Francesco y Filomena. No lo es, y el original es tajante: el declarante es SALERNO GIOVANNI y la madre, MORELLI VINCENZINA. Salvatore es hijo del hermano menor de Francesco, es decir primo hermano de Settimo y no hermano suyo. Encaja sin forzar nada: sus padres se casaron en octubre de 1897 y él nació en enero de 1899.", "El hallazgo dio de paso el dato más duro sobre su padre. Cuando Giovanni murió, el 23 de febrero de 1900, Salvatore tenía trece meses. Su madre se quedó viuda con él. Y una edad más que no cuadra: Giovanni declaró veinticuatro años al inscribirlo, cuando había cumplido veintiséis.", "Al margen del acta, una mano del siglo XX anotó: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa». Se casó en Rende en octubre de 1921, con veintidós años."], "claves": [["Nacimiento", "12 de enero de 1899, 3 de la madrugada, Rende, acta 13"], ["Parentesco", "primo hermano de los nueve, no hermano"], ["Huérfano de padre", "a los trece meses"], ["Nota al margen", "casado en Rende en octubre de 1921 con Misuraca Caterina Santa"]]}, "domenico_faienza": {"id": "domenico_faienza", "nombre": "Domenico Faienza", "legal": "Domingo Faienza en Argentina", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 8, "ramas": ["faienza"], "resumen": "Hijo de Nicola Faienza y Angiolina Pizzi. Emigró a Argentina, donde murió en Santa Fe el 13 de diciembre de 1985 con ochenta y cinco años. *** SU PARTIDA DE DEFUNCIÓN ARGENTINA APARECIÓ EN AGOSTO DE 2026 Y LO CAMBIÓ TODO: *** dice que NACIÓ EN PAGLIETA (Italia) el 1 de marzo de 1900, y confirma a sus padres. La partida italiana sigue sin aparecer, pero ahora se sabe exactamente dónde y cuándo buscarla — y por qué no salía: se había buscado en 1899, y nació en 1900.", "datos": [["Nacimiento", "1 de marzo de 1900 en PAGLIETA (Chieti), según su partida de defunción argentina de 1985. La misma fecha que ya daba el registro del cementerio: dos fuentes argentinas independientes coinciden"], ["Padres", "NICOLA FAIENZA, contadino de Atessa, hijo de Giuseppe Faienza y Maria Staniscia; y ANGIOLINA (Angela) PIZZI. Casados en Atessa el 29 de diciembre de 1892, acta 101"], ["Defunción", "13 de diciembre de 1985, con 85 años, enterrado en Santa Fe (La Capital), Argentina"], ["Dónde NO nació (1)", "PAGLIETA en 1899. Índice anual completo leído: 161 nacimientos, ningún Faienza en ninguna letra"], ["Dónde NO nació (2)", "ATESSA en 1899. Índice anual completo leído: 396 nacimientos y cuatro Faienza — Antonio, Carmine, Luzio y Rosina—, ningún Domenico. Y los cuatro se han abierto: son de otras tres familias Faienza del pueblo, no de la nuestra"], ["De qué pueblo son los FAIENZA", "ATESSA: el acta de matrimonio de 1892 declara al padre nacido y residente allí, y al abuelo paterno también"], ["Dónde nació ÉL", "PAGLIETA — y no es lo mismo. Los padres se casaron en Atessa en diciembre de 1892 y se mudaron a Paglieta, a trece kilómetros, donde nació el hijo ocho años después"], ["Dónde hay que buscarlo", "*** PAGLIETA, NACIMIENTOS DE 1900, un varón nacido el 1 de marzo. *** Pero NO por internet: Antenati sólo tiene Paglieta hasta 1899. Hay que pedírsela al AYUNTAMIENTO DE PAGLIETA, que es quien guarda los libros que el Archivio di Stato todavía no ha recibido. Carta escrita y lista, con los contactos comprobados en la web oficial del comune"], ["Muerte", "13 de diciembre de 1985 a las 19:30, en Santa Fe. Jubilado, y todavía de nacionalidad italiana tras toda una vida en Argentina. Vivía en la calle JUAN PABLO LÓPEZ 2643"], ["Documento argentino", "Cédula de Identidad 177.029"]], "vida": "1900–1985", "lug": "PAGLIETA", "mapa": null, "sinacta": "", "padre": "nicola_faienza", "madre": "angela_pizzi", "conyuge": "brigida_nelli", "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Partida de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "13 de diciembre de 1985", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "tomo 4-C, acta 1155", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verificación", "trámite 26-00-278-953 · hash EABE-3072-19D1-FC11-B4CB-603E-7871-EC78-4C2D-5E8C, comprobable en santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "En SANTA FE, departamento La Capital, provincia de Santa Fe, República Argentina, a 19 de diciembre de 1985. Yo, Oficial Público de este Registro, inscribo la DEFUNCIÓN de DOMINGO FAIENZA. Sexo masculino, nacionalidad ITALIANA. Estado: casado. Profesión: JUBILADO. Documento de identidad: Cédula 177.029. Domicilio: J. P. López 2643.\n\nHIJO DE NICOLÁS FAIENZA Y DE ÁNGELA PIZZI.\n\nNACIDO EN PAGLIETA (ITALIA) EL 1º DE MARZO DE 1900.\n\nOcurrida en Santa Fe el 13 de diciembre de 1985 a las 19:30 horas. Causa de la defunción: enfermedad. Certificado médico del doctor César Carli, 19 de diciembre de 1985. Declarante: SIXTO GÓMEZ, L.E. 5.261.009, domicilio Berutti 5663, obra en virtud de su persona autorizada para tal fin. — Arsenia del R. Ibáñez de Quintana, 2ª Jefe de la Subsección Defunciones.", "notas": ["*** DEVUELVE PAGLIETA AL MAPA, Y CORRIGE ALGO QUE YO HABÍA DADO POR CERRADO. *** Tras leer el acta de matrimonio de Atessa de 1892 escribí que la pista de Paglieta quedaba tumbada «definitivamente». Estaba mal. Aquel acta probaba que NICOLA, el padre, había nacido y vivía en Atessa en 1892 — no decía nada de dónde nacería su hijo ocho años después. Esta partida lo dice en letra clara: PAGLIETA. Las dos cosas son compatibles.", "*** Y EXPLICA POR QUÉ NO LO ENCONTRABA: BUSQUÉ EN EL AÑO EQUIVOCADO. *** Se barrieron enteros los índices de nacimientos de Paglieta 1899 y de Atessa 1899 sin hallar ningún Domenico Faienza. Normal: nació el 1 de marzo de **1900**, un año que no se ha mirado nunca. Aquellos negativos siguen valiendo, pero eran del año que no tocaba.", "CONFIRMA A SUS PADRES POR VÍA ARGENTINA. «Hijo de NICOLÁS FAIENZA y de ÁNGELA PIZZI» es exactamente la pareja del acta de matrimonio de Atessa de 1892. Dos archivos de dos países distintos, sin relación entre sí, dan los mismos dos nombres.", "MURIÓ SIENDO ITALIANO. Después de más de sesenta años en Argentina el acta lo sigue registrando de nacionalidad italiana: nunca se nacionalizó.", "EL DECLARANTE NO ERA DE LA FAMILIA. Sixto Gómez «obra en virtud de su persona autorizada para tal fin»: es un gestor, casi con seguridad de la funeraria. Berutti 5663 es SU domicilio, no el de los Faienza."], "imgs": [{"u": "actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20Partida%20de%20defuncion%20de%20Domingo%20Faienza%20-%20Santa%20Fe%20acta%201155.jpg", "t": "Partida de defuncion de Domingo Faienza - Santa Fe acta 1155"}], "zooms": [{"u": "actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20zoom%20-%20nacido%20en%20PAGLIETA%2C%20hijo%20de%20Nicolas%20Faienza%20y%20Angela%20Pizzi.jpg", "t": "Nacido en PAGLIETA, hijo de Nicolas Faienza y Angela Pizzi"}]}, {"titulo": "Búsqueda negativa en el índice anual de nacimientos", "tipo": "I", "tipoNombre": "Acta", "fecha": "año 1899 completo", "lugar": "Paglieta (Chieti)", "ref": "índice del registro entero", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Paglieta > 1899, atti di nascita"], ["Registro", "hash del contenedor: 5xOMBDz — 120 páginas"], ["Índice", "portada en la página 116; entradas en las páginas 117, 118 y 119; la 120 está en blanco"], ["Portada", "«ANNO 1899 · Comune di PAGLIETA · Provincia di CHIETI · INDICE ANNUALE del REGISTRO degli Atti di NASCITA»"], ["Alcance", "el índice cubre el año entero, incluidas las actas de la parte II, que van marcadas «2ª P.». El número de acta más alto que aparece es el 161"]], "literal": "LA LETRA F ENTERA, tal como está en la página 117:\n  Florio (di) Antonio ............ 1\n  Fazia (fu) Domenico ............ 8\n  Florio (di) Sebastiano ......... 15\n  Falcis (di) Carmela ............ 42\n  Florio (di) Antonio ............ 65\n  Formica Pietro Nicola .......... 68\n  Florio (di) Antonia ............ 109\n  Felice (di) Etterina Maria Nicola  124\n  Fabrizio Verina ................ 160\nY después, directamente, la G. Nueve apellidos con F y ninguno es FAIENZA.", "traduccion": "NO HAY ACTA QUE TRANSCRIBIR: éste es un resultado negativo, y se archiva como tal.\n\nSe bajó el índice alfabético completo del registro de nacimientos de Paglieta de 1899 —portada y las tres planas de entradas— y se leyó letra por letra. La F ocupa nueve renglones, todos legibles, y ninguno dice Faienza. Tampoco aparece el apellido en ninguna otra letra del índice, ni escrito de otra manera (Faenza, Fajenza).\n\nEl índice no deja hueco: es el índice anual oficial del registro, cubre las actas numeradas de la 1 a la 161 y recoge además las de la parte II, señaladas «2ª P.». De modo que en Paglieta, en 1899, no nació ningún Faienza.", "notas": ["NEGATIVO FIRME, Y ES LA MITAD DEL ENCARGO. En el índice de nacimientos de Paglieta de 1899 NO HAY NINGÚN FAIENZA. Ni con los padres correctos ni con otros: no hay ninguno.", "EL PUEBLO NUNCA ESTUVO PROBADO. «Paglieta» venía del mismo bloque familiar sin una sola cita que ya había errado dos veces comprobadas. Lo que convierte un hallazgo en prueba no es el pueblo: son los padres. Y los padres han aparecido, pero en otro sitio.", "DÓNDE HAY QUE BUSCARLO AHORA: EN ATESSA. La nota al margen de la partida de nacimiento de su madre dice que Angiolina Pizzi casó con Nicola Faienza en 1892, acta 101, EN EL REGISTRO DE ATESSA. La familia materna es de Atessa desde 1730. El nacimiento del hijo hay que pedirlo a los Nati de Atessa de 1899 y de 1900.", "Y HAY UNA RAZÓN PARA MIRAR 1900 ANTES QUE 1899. El registro de cementerio argentino da a Domingo Faienza nacido el 1 de MARZO DE 1900 y muerto el 13 de diciembre de 1985 con 85 años, y las dos cifras cuadran entre sí. Si esa fecha es buena, su acta no está en 1899 en ningún pueblo. Paglieta 1900 no existe en Antenati —cero registros, comprobado—, pero ATESSA 1900 sí debería existir: la serie de Atessa es de las largas.", "UN DETALLE CURIOSO DEL ÍNDICE DE PAGLIETA: sí hay un «PIZZI Bambino», acta 142. Un recién nacido apellidado Pizzi, sin nombre de pila en el índice. No es nuestro Domenico —el apellido es el de la madre, no el del padre—, pero deja constancia de que el apellido Pizzi también circula por Paglieta.", "COSTE DE ESTE NEGATIVO: cinco imágenes. Es lo que vale leer un año entero de golpe cuando el registro trae índice al final."], "imgs": [{"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20A-G%20-%20Paglieta.jpg", "t": "Indice alfabetico letras A-G - Paglieta"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20G-P%20-%20Paglieta.jpg", "t": "Indice alfabetico letras G-P - Paglieta"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20P-V%20-%20Paglieta.jpg", "t": "Indice alfabetico letras P-V - Paglieta"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Portada%20del%20indice%20anual%20de%20nacimientos%20-%20Paglieta.jpg", "t": "Portada del indice anual de nacimientos - Paglieta"}], "zooms": [{"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20completa%2C%20sin%20ningun%20Faienza.jpg", "t": "La letra F del indice completa, sin ningun Faienza"}]}, {"titulo": "Búsqueda negativa en el índice anual de nacimientos", "tipo": "I", "tipoNombre": "Acta", "fecha": "año 1899 completo", "lugar": "Atessa (Chieti)", "ref": "índice del registro entero", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1899, atti di nascita"], ["Registro", "hash del contenedor: LyOB1Ve — 302 páginas"], ["Índice", "alfabético al final del volumen. La letra F entera está en la página 297 de 302; se miraron además la 296 (C y D), la 299 (M a P) y la 302, que es la última y sólo lleva la columna de números"], ["Alcance", "el año completo, incluidas las actas de la PARTE II, que van marcadas «p. II» dentro de la misma lista. Número de acta más alto indexado: 396"], ["Actas abiertas", "las cuatro de apellido Faienza: la 382 y la 383 (página 259), la 215 (página 145) y la 139 (página 95)"], ["Cómo se recorrió", "la parte I llega hasta la página ~270 a razón de 1,42 actas por imagen; sondeos en las páginas 200 (acta 297), 240 (acta 354) y 279 (ya parte II) fijaron la recta. Doce imágenes para cerrar un año de 396 nacimientos"]], "literal": "LA LETRA F ENTERA DEL ÍNDICE DE ATESSA 1899, tal como está en la página 297:\n  FAIENZA Antonio .............. 382\n  FAIENZA Carmine .............. 383\n  FAIENZA Luzio ................ 215\n  FAIENZA Rosina ............... 139\n  Falcone · Falcucci · Fanelli · Fantauzzi · Fantini · Fania · Favorito ·\n  Fiori · Fidelibus · Filamarino · Fiorito · Flocco · De Francesco · Fritti\ny a continuación, directamente, la G.\n\nY LO QUE DICEN LAS CUATRO ACTAS:\n  Actas 382 y 383 — gemelos, Antonio y Carmine, nacidos el 18 de diciembre de\n  1899 a las 22:15 y 22:30 en la contrada Piazzano. «È comparso MICHELE FAIENZA\n  FU CARMINE, di anni quarantatré, contadino, domiciliato in Atessa… da CELESTE\n  SERAFINI sua moglie, contadina, seco lui convivente».\n  Acta 215 — Luzio, varón, nacido el 4 de junio de 1899 a la 1:15 en la contrada\n  Carafella. «È comparso ANTONIO FAIENZA DI PASQUALE, di anni quarantaquattro,\n  contadino… da ANTONIA GIAGNORIO sua moglie». Al margen, «morto nel 1899».\n  Acta 139 — Rosina, niña, nacida el 4 de abril de 1899 a las 20:15 en la misma\n  contrada Carafella. «È comparso VINCENZO FAIENZA DI PASQUALE, di anni\n  trentasette, contadino… da BAMBINA ROSSI sua moglie».", "traduccion": "NO HAY ACTA QUE TRANSCRIBIR: éste es otro resultado negativo, y se archiva como tal. Pero es un negativo de otra clase que el de Paglieta, y bastante más fuerte.\n\nEn Paglieta el apellido Faienza no aparecía en ninguna letra del índice y con eso bastaba. En Atessa aparece cuatro veces, así que no bastaba: hubo que abrir las cuatro actas y mirar quiénes eran los padres. Ninguno de los cuatro niños es hijo de Nicola Faienza y Angiolina Pizzi. Son de otras tres familias Faienza del mismo pueblo: la de MICHELE FAIENZA FU CARMINE y Celeste Serafini, en la contrada Piazzano, que en diciembre tuvo gemelos; y las de ANTONIO y VINCENZO FAIENZA DI PASQUALE —hermanos, casi con seguridad, los dos de la contrada Carafella—, cada uno con un hijo ese año.\n\nNuestro Nicola es «figlio di GIUSEPPE». Ni Michele fu Carmine, ni Antonio di Pasquale, ni Vincenzo di Pasquale.\n\nDe modo que en Atessa, en 1899, no nació ningún hijo de Nicola Faienza y Angiolina Pizzi, y desde luego ningún Domenico Faienza de nadie.", "notas": ["SEGUNDO NEGATIVO FIRME, Y MÁS SÓLIDO QUE EL PRIMERO. En Atessa 1899 no hay ningún Domenico Faienza —entre «Carmine» y «Luzio» es donde iría, y no está— y, además, ninguno de los cuatro Faienza del año pertenece a nuestra pareja. No es que no aparezca el apellido: es que aparece y se descarta uno por uno.", "LO QUE ESTA TANDA SÍ HA RESUELTO ES EL PUEBLO. El acta de matrimonio de 1892 declara a Nicola Faienza «nato in Atessa, residente in Atessa», y a su padre Giuseppe residente en Atessa. La familia es de Atessa y no de Paglieta. Lo que queda por acertar no es el sitio, es el año.", "Y EL AÑO QUE QUEDA ES 1900. Cerrado 1899 en los dos pueblos, la fecha del registro de cementerio argentino —1 de marzo de 1900, coherente con los 85 años que declara al morir en diciembre de 1985— vuelve a ser la hipótesis buena. La búsqueda de «Atessa 1900» en Antenati dio cero registros en su día; conviene repetirla, porque el fondo de Atessa es de los largos y las altas de catálogo son frecuentes, y si sigue sin estar, pedir la partida al Comune di Atessa.", "UNA MEDIDA ÚTIL QUE DEJA ESTE BARRIDO: el apellido FAIENZA es corriente en Atessa. Tres familias distintas con hijos en un solo año. Eso quiere decir que coincidir en el apellido no prueba nada, y que en la próxima tanda habrá que mirar siempre el nombre del padre: «di Giuseppe». Es exactamente el mismo error que se cometió con Paglieta, sólo que al revés.", "UN DETALLE QUE VIENE DEL MISMO REGISTRO: el acta 214, justo encima del Faienza Luzio, es de un Iacobitti Antonio con una anotación marginal del consulado que lo da fallecido en Carapachay (Buenos Aires) el 6 de junio de 1957. La emigración de Atessa al Río de la Plata está escrita en los márgenes de estos mismos libros.", "COSTE DE ESTE NEGATIVO: doce imágenes para un año de 396 nacimientos. Cuatro del índice y del final del volumen, tres de sondeo y cinco de actas."], "imgs": [{"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Antonio%20y%20Carmine%20gemelos%20-%20Atessa%20actas%20382%20y%20383.jpg", "t": "Faienza Antonio y Carmine gemelos - Atessa actas 382 y 383"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Luzio%20-%20Atessa%20acta%20215.jpg", "t": "Faienza Luzio - Atessa acta 215"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Rosina%20-%20Atessa%20acta%20139.jpg", "t": "Faienza Rosina - Atessa acta 139"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letra%20F%20-%20Atessa.jpg", "t": "Indice alfabetico letra F - Atessa"}], "zooms": [{"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20139%2C%20Rosina%20es%20hija%20de%20Vincenzo%20Faienza%20di%20Pasquale%20y%20Bambina%20Rossi.jpg", "t": "Acta 139, Rosina es hija de Vincenzo Faienza di Pasquale y Bambina Rossi"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20215%2C%20Luzio%20es%20hijo%20de%20Antonio%20Faienza%20di%20Pasquale%20y%20Antonia%20Giagnorio.jpg", "t": "Acta 215, Luzio es hijo de Antonio Faienza di Pasquale y Antonia Giagnorio"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20382%2C%20gemelos%20hijos%20de%20Michele%20Faienza%20fu%20Carmine%20y%20Celeste%20Serafini.jpg", "t": "Acta 382, gemelos hijos de Michele Faienza fu Carmine y Celeste Serafini"}, {"u": "actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20de%20Atessa%2C%20cuatro%20Faienza%20y%20ningun%20Domenico.jpg", "t": "La letra F del indice de Atessa, cuatro Faienza y ningun Domenico"}]}], "nActas": 3, "nImgs": 15, "titulo": "", "parrafos": [], "claves": []}, "cristina_rizzo": {"id": "cristina_rizzo", "nombre": "Cristina Rizzo", "legal": "«Cristina Rizzo de Salerno» en su partida", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["salerno"], "resumen": "Argentina, nacida en la ciudad de Santa Fe. Hasta el 29 de agosto de 2026 era una persona suelta en todo el árbol: no se le conocían padres. Dos actas del Registro Civil los dieron a la vez.", "datos": [["Nacimiento", "en la CIUDAD DE SANTA FE. El año no se puede fijar: su acta de matrimonio de 1923 le da 23 años (n. ~1900) y su partida de defunción le da 74 (n. ~1893). Siete años de diferencia"], ["Padres", "*** SALVADOR RIZZO y ÁNGELA COSTABILE ***, los dos nombrados igual en el acta de matrimonio de 1923 y en la de defunción de 1967"], ["Matrimonio", "26 de marzo de 1923, Santa Fe, acta 140, con SETTIMO SALERNO, panadero de veintitrés años recién llegado de Rende"], ["Oficio", "«sus labores»"], ["Documento", "Libreta Cívica 1.529.760"], ["Muerte", "24 de noviembre de 1967, a las TRES Y MEDIA DE LA MADRUGADA, en Santa Fe. Inscrita el 27"], ["Inhumación", "27 de noviembre de 1967, Cementerio Municipal de Santa Fe"]], "vida": "†1967", "lug": "", "mapa": null, "sinacta": "", "padre": "salvador_rizzo", "madre": "angela_costabile", "conyuge": "settimo", "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": [], "actas": [{"titulo": "Partida de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "24 de noviembre de 1967, a las 3:30 de la madrugada", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "acta 854", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verificación", "trámite 26-00-284-315 · hash F90C-1521-80AD-0D07-1EEA-7DA4-799E-1CA6-5475-2025"]], "literal": "", "traduccion": "Acta número ochocientos cincuenta y cuatro. En SANTA FE, departamento La Capital, el día veintisiete de noviembre de mil novecientos sesenta y siete, a las ocho y quince horas. Ante mí, SANTIAGO SATALÉ, jefe encargado del Registro del Estado Civil, compareció don ALEJO RIESTRA, comerciante, domiciliado en Las Heras 3299,\n\ndeclarando que a las TRES Y TREINTA HORAS DEL DÍA VEINTICUATRO del mes de la fecha, en esta Capital, ha fallecido doña CRISTINA RIZZO DE SALERNO, de nacionalidad argentina, NACIDA EN ESTA CIUDAD, de setenta y cuatro años de edad, de estado casada y de profesión sus labores, Libreta Cívica número 1.529.760, a consecuencia de enfermedad, según consta en el certificado médico del doctor OSCAR BENAZZOLA.\n\nQUE ERA CASADA CON SETTINO SALERNO.\n\nQUE LA FINADA ERA HIJA DE DON SALVADOR RIZZO Y DE DOÑA ÁNGELA COSTABILE.\n\nLeída esta acta, la firmaron conmigo el declarante y don AURENCIO VILLAFAÑE, domiciliado en Villa Yapeyú, vecinos hábiles.", "notas": ["*** DA SUS PADRES, Y HASTA HOY LOS RIZZO ERAN UNA SOLA PERSONA SUELTA EN TODO EL ÁRBOL. *** SALVADOR RIZZO y ÁNGELA COSTABILE. Y no es un dato aislado: el acta de matrimonio de 1923, cuarenta y cuatro años antes y con otro declarante, da exactamente los mismos dos nombres.", "COSTABILE ES APELLIDO DEL SUR DE ITALIA, y encaja con que los Salerno vinieran de RENDE, en Cosenza: la colonia calabresa de Santa Fe se casaba entre sí.", "MURIÓ A LAS TRES Y MEDIA DE LA MADRUGADA. La inscripción se hizo tres días después, y coincide con la fecha de la ficha del cementerio municipal.", "*** SU AÑO DE NACIMIENTO NO SE PUEDE FIJAR CON LO QUE HAY. *** Aquí declara 74 años (nacida hacia 1893); en su acta de matrimonio de 1923 declaró 23 (nacida hacia 1900). Siete años de diferencia. Haría falta su partida de nacimiento, que según esta acta es de Santa Fe capital.", "NI EL DECLARANTE NI EL TESTIGO ERAN DE LA FAMILIA — un comerciante de Las Heras y un vecino de Villa Yapeyú. Mismo patrón que en las partidas de los Faienza: gestores, probablemente de la funeraria. Sus domicilios NO son de la familia."], "imgs": [{"u": "actas/1967%20-%20Cristina%20Rizzo/1967-11-24%20D%20Partida%20de%20defuncion%20de%20Cristina%20Rizzo%20-%20Santa%20Fe%20acta%20854.jpg", "t": "Partida de defuncion de Cristina Rizzo - Santa Fe acta 854"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "salvador_rizzo": {"id": "salvador_rizzo", "nombre": "Salvador Rizzo", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["salerno"], "resumen": "Padre de Cristina Rizzo. Entra en el árbol el 29 de agosto de 2026, por dos actas argentinas separadas por cuarenta y cuatro años que lo nombran igual.", "datos": [["Quién era", "padre de CRISTINA RIZZO, nacida en la ciudad de Santa Fe entre 1893 y 1900"], ["Mujer", "ÁNGELA COSTABILE, italiana"], ["Dónde estaba", "en Santa Fe: allí nació y se casó su hija"], ["Fuentes", "acta de matrimonio de su hija (1923) y partida de defunción de su hija (1967)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "NO SE SABE SI ERA ITALIANO O YA ARGENTINO — el acta de matrimonio de su hija deja el hueco de la nacionalidad casi ilegible, y la de defunción no lo dice.\n\n*** ¿SE PUEDE TIRAR PARA ATRÁS DE ÉL EN LOS ARCHIVOS ITALIANOS? SÍ, PERO FALTA UNA COSA. *** El 29 de agosto de 2026 se comprobó que RENDE está en el Portal Antenati **de 1809 a 1910, ciento un años seguidos**, con nacimientos, matrimonios y defunciones. O sea que si él y Ángela se casaron en Rende hacia 1870-1890, el acta está en línea y es gratis de leer, y nombraría a los cuatro abuelos de Cristina.\n\n*** EL PROBLEMA ES QUE NO SABEMOS DE QUÉ PUEBLO ERAN. *** Antenati se organiza por municipio: sin pueblo no hay búsqueda posible, porque no existe un índice de nombres global. Hay indicios a favor de Rende —el apellido RIZZO aparece allí en 1858, y su hija se casó con un Salerno de Rende— pero son indicios, no pruebas.\n\nLO QUE LO RESOLVERÍA DE UN GOLPE: la partida de nacimiento de su hija CRISTINA, nacida en Santa Fe capital entre 1893 y 1900. Un acta argentina de esa época nombra a los padres con edad, nacionalidad y muchas veces el pueblo. Está en la lista de pedidos al Registro Civil.\n\n*** 29 DE AGOSTO DE 2026 — SE HAN LEÍDO DIECISÉIS AÑOS DE MATRIMONIOS DE RENDE Y EL RESULTADO VA EN SU CONTRA. *** Se barrieron las transcripciones de los matrimonios de Rende de 1850 a 1865, año por año, buscando novios RIZZO — porque si él nació hacia 1859, sus padres se casaron justo en ese tramo. En dieciséis años aparecen *** sólo TRES novios Rizzo ***: Michele Maria y Pietro, hermanos, los dos casados en 1850 e hijos de GABRIELE RIZZO y MARIA ESPOSITO FAVA; y Vincenzo, casado en 1862, hijo de Michele Rizzo y Carmina Spina.\n\n*** Y sin embargo el apellido está por todas partes como nombre de MADRE o de NOVIA: *** Angela Maria Rizzo aparece de madre en cuatro bodas distintas, y hay además Francesca, Eleonora, Arcangela y Beatrice Rizzo. Es exactamente el mismo patrón que salió al barrer 1880-1885, donde hubo cinco novias Rizzo y ni un solo novio. O sea que *** en Rende hay mujeres Rizzo por todas partes y muy pocos varones Rizzo que se casen. *** Para un hombre llamado Salvador Rizzo nacido allí hacia 1859 eso deja muy pocos padres posibles. No lo descarta, pero lo hace bastante menos probable de lo que se suponía.\n\nSi aun así Rende fuera el pueblo, los únicos candidatos a padre suyo son los dos hermanos de 1850, y la comprobación sería barata: buscar en los nacimientos de Rende de 1856-1866 un SALVATORE RIZZO hijo de Michele Maria o de Pietro. Nada de esto entra en el árbol: son transcripciones de otra persona, y no hay ni un dato que una a esos Rizzo con él.\n\n*** Y EL MISMO DÍA SE VIO QUE LA BÚSQUEDA NO TENÍA POR QUÉ LIMITARSE A RENDE. *** Las transcripciones calabresas que teníamos en disco se creían cortadas en 1865, pero eso sólo vale para Rende: *** ocho pueblos del anillo de Cosenza llegan hasta 1910 *** — Carolei, Cerisano, Falconara, Guardia Piemontese, los dos Marano, Mendicino y San Vincenzo la Costa. Es decir que los años 1870-1893, que son los que importan para su boda, se pueden barrer enteros y gratis en ocho pueblos vecinos, y no sólo en el que se suponía.\n\nEl primero, SAN VINCENZO LA COSTA, ya está barrido en seis años —1880, 1881, 1882, 1885, 1886 y 1887—: *** ni un solo Rizzo ni un solo Costabile ***, en un pueblo cuyo repertorio de apellidos es bastante distinto del de Rende.\n\nY el segundo, *** MARANO MARCHESATO, está barrido entero: diecinueve años seguidos, de 1875 a 1893, y tampoco hay ni un novio Rizzo ni un solo Costabile. *** Se eligió ese pueblo porque es el que ya ha dado familia nuestra —los Volpintesta, los Palermo, los Luchetta—, así que era el entorno con más sentido.\n\n*** Y de los dos barridos empieza a salir algo que vale más que el resultado. *** Cada uno de esos pueblos tiene un repertorio de apellidos muy suyo que se repite año tras año, y ni Rizzo ni Costabile figuran en ninguno de los dos. En cambio en Rende los dos están bien documentados: seis casas Costabile en una sola generación y varias familias Rizzo. *** Parecen apellidos de Rende y de Cosenza ciudad, no del anillo de pueblos. *** Si eso se confirma en los seis que faltan, el anillo no va a producir la boda, y sólo quedan dos salidas: que esté en Rende entre 1870 y 1893, o que la boda fuera argentina.\n\n*** Y MUESTREANDO TRES AÑOS DE CADA UNO DE LOS SEIS PUEBLOS QUE FALTABAN, HA SALIDO UNO. *** En MENDICINO, en 1885, se casa *** SALVATORE RIZZO, hijo de GIUSEPPE RIZZO y de ANTONIA FORTUNATA DODARO ***. Es el primer novio Rizzo que aparece fuera de Rende en todo el anillo, y encima se llama Salvatore.\n\n*** No es el nuestro: se casa con una MARIA ROSARIA FILIPPELLI, no con Ángela Costabile. Pero no se puede descartar del todo *** — si esa mujer murió joven, cosa corrientísima, él pudo enviudar, casarse en segundas nupcias hacia 1888-1892, emigrar y tener a Cristina en Santa Fe. Las fechas encajan sin forzar nada. Se comprueba gratis y en el mismo sitio: buscando a Maria Rosaria Filippelli en los difuntos de Mendicino de 1885-1893, y un segundo casamiento suyo en los matrimonios de esos años. Si apareciera una boda Rizzo × Costabile en Mendicino, se acabó la búsqueda.\n\n*** SE COMPROBÓ EL MISMO DÍA, Y NO SALE. *** Mendicino está ahora barrido entero: diecinueve años de matrimonios (1875-1893) y nueve de difuntos (1885-1893). En los matrimonios hay exactamente DOS novios Rizzo, y son hermanos —Antonio en 1883 y Salvatore en 1885, los dos hijos de Giuseppe Rizzo y Antonia Fortunata Dodaro— y *** ni un solo Costabile en los diecinueve años. *** Y en los difuntos, que traen columna de cónyuge, *** no muere ninguna Maria Rosaria Filippelli casada con un Salvatore Rizzo ***: las dos que aparecen con ese nombre son otras, casadas con un Piscitelli y con un Barone. O sea que él no enviudó allí, y la hipótesis de las segundas nupcias se queda sin apoyo.\n\n*** Y CON ESO EL ANILLO DE COSENZA QUEDA CERRADO Y ES NEGATIVO. *** Diez tramos barridos —Rende 1850-1865 y 1880-1885, Marano Marchesato y Mendicino enteros, San Vincenzo la Costa, y muestreos de Cerisano, Carolei, Falconara, Guardia Piemontese y Marano Principato— y *** en ninguno hay una boda Rizzo × Costabile. *** Juntando eso con que Ángela Costabile no estaba en la provincia de Santa Fe en junio de 1887 y con que Cristina nace allí entre 1893 y 1900, la conclusión más probable, y ahora con peso, es que *** se casaron en Argentina entre 1888 y 1900 y su acta está en el Registro Civil de Santa Fe ***, no en Italia. Falta sólo leer los años de Rende que siguen sin abrir —1866-1879 y 1886-1893—, bloqueados desde hace dieciséis ventanas.\n\nY un aviso que salió de paso, en Cerisano: allí hay una *** ANGELA COSTABILE casada con un SALVATORE *** — pero un Salvatore MUTO, y de una generación anterior. Los dos nombres de pila juntos con ese apellido no son una combinación única en la comarca: antes de cantar victoria hay que mirar siempre el apellido del marido.\n\nSi en los ocho no apareciera ninguna boda Rizzo × Costabile entre 1875 y 1893, eso sería un negativo muy grande: querría decir que no se casaron en el entorno de Cosenza, y reforzaría casi hasta la certeza que *** se casaron en Argentina entre 1888 y 1900 ***, que es hacia donde apuntan ya el censo de 1887 y la escasez de varones Rizzo. Relacionado: [[angela_costabile]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "angela_costabile", "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "angela_costabile": {"id": "angela_costabile", "nombre": "Ángela Costabile", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["salerno"], "resumen": "Madre de Cristina Rizzo, italiana, domiciliada en Santa Fe en 1923.", "datos": [["Quién era", "madre de CRISTINA RIZZO"], ["Marido", "SALVADOR RIZZO"], ["Nacionalidad", "ITALIANA — así lo dice el acta de matrimonio de su hija"], ["Dónde vivía en 1923", "«en esta ciudad», Santa Fe"], ["El apellido", "COSTABILE es del sur de Italia, y sobre todo de Calabria. Encaja con que su hija se casara con un Salerno de RENDE, en la provincia de Cosenza: la colonia calabresa de Santa Fe se casaba entre sí"]], "vida": "", "lug": "", "mapa": null, "sinacta": "ES ITALIANA Y NO SABEMOS DE DÓNDE, y ésa es la única puerta que falta para subir por esta rama.\n\n*** LO QUE SÍ SE HA PODIDO COMPROBAR: COSTABILE ES APELLIDO DE RENDE, Y CON NOMBRES PROPIOS. *** FEDERICO COSTABILE era el *assessore delegato* del estado civil de Rende en 1909 y firma el acta de nacimiento de una de las hermanas de Settimo. SALVATORE COSTABILE, sastre de veintitrés años, fue testigo de una boda de la familia en 1897. Y en el índice de matrimonios de Rende de 1858 están los hermanos SALVATORE y LUIGI GAETANO COSTABILE, hijos de Francesco Saverio Costabile y Arcangela Maria Giraldi.\n\nQue ella fuera de Rende deja de ser una corazonada por la terminación del apellido y pasa a ser razonable. *** PERO SIGUE SIN PROBARSE: *** Costabile es apellido extendido por toda la provincia de Cosenza, y ella pudo venir de cualquiera de sus pueblos.\n\nLO RESOLVERÍA la partida de nacimiento de su hija Cristina, en Santa Fe.\n\n*** 29 DE AGOSTO DE 2026 — Y AQUÍ LA COSA MEJORA PARA ELLA. *** Se leyeron los matrimonios de Rende de 1850 a 1865 enteros, dieciséis años seguidos. *** COSTABILE resulta ser allí un linaje masculino grande y antiguo: ocho novios Costabile en ese tramo, de SEIS casas distintas ***, todas con padre y madre documentados — Diego Costabile con Carmela Infusino, Pasquale con Maria Rosaria Scaglione, Francesco Saverio con Arcangela Maria Giraldi, Giovanni con Rosaria Bartucci, Saverio Lorenzo con Elena Rosaria Porro, Domenico con Anna Maria Stillo y Natale con Costantina Leone. En 1857 hasta se casa un Costabile con una Costabile.\n\nEs decir: *** que una mujer llamada Ángela Costabile saliera de Rende encaja bien con lo que el pueblo tenía. *** Y el contraste con su marido es notable: en esos mismos dieciséis años hay ocho novios Costabile y sólo tres novios Rizzo. Sigue sin probarse nada —Costabile es apellido de toda la provincia de Cosenza— pero de los dos, la que mejor encaja con Rende es ella.\n\nUn detalle que conviene no olvidar: en el barrido no aparece NINGUNA boda Rizzo × Costabile entre 1850 y 1865. Si esa pareja se casó en Rende, fue después. Y si ella llegó a Santa Fe después de 1887 —que es lo que dice el censo— la boda pudo ser perfectamente argentina. Relacionado: [[salvador_rizzo]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "salvador_rizzo", "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "carlos_salerno": {"id": "carlos_salerno", "nombre": "Carlos Francisco Salerno", "legal": "", "rol": "directa", "rolNombre": "Línea directa", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Hijo de Settimo y Cristina, nacido ya en Argentina. Contador público y hombre público de Santa Fe: presidente del Club Atlético Colón entre 1970 y 1974 y funcionario de la administración provincial. Murió el 13 de agosto de 2002. Es la única persona del árbol con biografía publicada en prensa.", "datos": [["Padres", "Settimo Salerno y Cristina Rizzo"], ["Defunción", "13 de agosto de 2002, Santa Fe — «esta madrugada», dice El Litoral de ese mismo día. CORRIGE el «2003» que este árbol daba antes de memoria"], ["Cónyuge", "Adelina Faienza"], ["Profesión", "CONTADOR PÚBLICO — el diario lo llama «el contador Salerno» de principio a fin"], ["Cargo", "PRESIDENTE DEL CLUB ATLÉTICO COLÓN de Santa Fe, de finales de 1970 a 1974"], ["Administración pública", "hizo carrera en la provincia y «alcanzó notoriedad durante la segunda gobernación de Sylvestre Begnis»"], ["Según la familia", "fue además presidente de la CÁMARA DE COMERCIO de Santa Fe y de EMAÚS. El obituario no lo dice: consta como testimonio familiar, no como hecho probado"], ["Fuente", "El Litoral (Santa Fe), edición impresa del 13 de agosto de 2002, sección Deportes, página DEPO-06: «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html"]], "vida": "†2002", "lug": "", "mapa": null, "sinacta": "Sin acta todavía, pero SÍ con fuente publicada, y es el único del árbol que la tiene. El 13 de agosto de 2002 EL LITORAL de Santa Fe le dedicó un obituario entero.\n\nLO QUE EL DIARIO PRUEBA. Que era CONTADOR. Que murió «esta madrugada», o sea la del 13 de agosto de 2002 — el árbol decía 2003 de memoria y queda corregido. Que en 1970 fue elegido vicepresidente de Colón en la lista «Nuevo Colón» que encabezaba José Relañez Passini; que a finales de ese mismo año Relañez fue desvinculado y ASUMIÓ ÉL LA PRESIDENCIA, hasta 1974. Que bajo su gestión el club salió de una situación económica difícil y se levantaron la PILETA DE NATACIÓN, la SEDE SOCIAL y el foso del sector oeste, y se remodeló el estadio. Que consiguió del municipio el dinero de la pileta y él mismo ideó la forma legal de recibirlo PARA QUE NO PUDIERA DESVIARSE AL FÚTBOL; el diario subraya «la seriedad y claridad con la que manejó las finanzas». Que por sus manos pasaron Enzo Trossero, «Cococho» Álvarez, Trullet, Zuccarelli, Di Meola, Aráoz y Costantino, y el técnico Urriolabeitia. Y que hizo carrera en la ADMINISTRACIÓN PÚBLICA provincial, con notoriedad durante la segunda gobernación de Sylvestre Begnis.\n\nLA ANÉCDOTA QUE MEJOR LO RETRATA. El 25 de enero de 1981 volvió a presentarse y la elección se decidió por CUATRO VOTOS. Se había proclamado ganadora a su lista; fue ÉL MISMO quien detectó el error que daba vuelta el resultado, lo señaló y reconoció la derrota. El diario usa la palabra «hidalgamente». Años después José Néstor Vignatti lo llamaba «padre espiritual» de su grupo y lo consultaba de continuo.\n\nLO QUE APORTA LA FAMILIA Y EL DIARIO NO DICE. Que fue también presidente de la CÁMARA DE COMERCIO de Santa Fe y de EMAÚS. Encaja con ese perfil, pero el obituario es de la sección de deportes y sólo mira a Colón, así que aquí quedan como TESTIMONIO FAMILIAR y no como hecho probado. Se confirmarían en la prensa local o en los archivos de esas dos instituciones.\n\nLO QUE SIGUE FALTANDO. Su PARTIDA DE NACIMIENTO en el Registro Civil de Santa Fe, que nombraría a Settimo con el nombre que usaba en Argentina y daría su edad declarada: sería el primer documento argentino que ate esta rama con las 48 actas italianas. Y ahora también su ACTA DE DEFUNCIÓN que, con la fecha exacta ya en la mano, es una petición fácil.\n\nFUENTE: El Litoral (Santa Fe), 13 de agosto de 2002, Deportes, DEPO-06, «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html", "padre": "settimo", "madre": "cristina_rizzo", "conyuge": "adelina_faienza", "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": ["nilda_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "adelina_faienza": {"id": "adelina_faienza", "nombre": "Adelina Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Hija de Domenico Faienza y Brigida Nelli. Es donde se juntan las dos ramas: los Salerno de Calabria y los Faienza y Pizzi de los Abruzos.", "datos": [["Padres", "Domenico Faienza y Brigida Nelli"], ["Cónyuge", "Carlos Francisco Salerno"], ["Hijas", "Stella Maris, Norma, Beatriz, Susana y Maria Cristina"], ["Fuente", "árbol familiar — sin acta"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Sin acta. Su nacimiento estaría en el Registro Civil de Santa Fe.", "padre": "domenico_faienza", "madre": "brigida_nelli", "conyuge": "carlos_salerno", "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "brigida_nelli": {"id": "brigida_nelli", "nombre": "Brigida Maria Ana Nelli", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 8, "ramas": ["faienza"], "resumen": "Nacida en Santa Fe en enero de 1901 y bautizada en la Catedral. Es la primera argentina de esa rama: sus padres ya estaban aquí. Su partida de defunción, conseguida en agosto de 2026, dio por fin el nombre completo de sus padres.", "datos": [["Nacimiento", "enero de 1901, provincia de SANTA FE. La fe de bautismo dice el día 13; la partida de defunción dice el 12. Vale más la fe, escrita a los pocos días"], ["Bautismo", "1901, Catedral de Todos los Santos, Santa Fe"], ["Padres", "ÁNGEL ALBERTO NELLI y FILOMENA PAGLIARONE"], ["Cónyuge", "DOMINGO FAIENZA, el italiano de Paglieta. Vivían juntos en la calle JUAN PABLO LÓPEZ 2643, de Santa Fe capital"], ["Oficio", "ama de casa"], ["Documento argentino", "Libreta Cívica 6.119.349"], ["Muerte", "19 de agosto de 1984 a las 20 horas, en su casa de Santa Fe, a los 83 años"]], "vida": "1901–1984", "lug": "", "mapa": null, "sinacta": "Su fe de bautismo está localizada y leída en imagen, pero no descargada a este archivo. Dice: «bautizó solemnemente a Brígida M. Ana, que nació el día trece de enero del corriente año, hija legítima de D. Ángel A. Nelli y de Doña Filomena Pallarone». Corrigió dos errores del árbol familiar: el apellido es NELLI con dos eles, y su madre NO era Catterina Volpi.", "padre": "angel_nelli", "madre": "filomena_pagliarone", "conyuge": "domenico_faienza", "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Partida de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "19 de agosto de 1984", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "tomo 5-A, acta 1257", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verificación", "trámite 26-00-278-984 · hash D9CC-7428-D598-5FBA-6A3E-0BA2-B8F6-3037-ED61-C905, comprobable en santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "En SANTA FE, departamento La Capital, provincia de Santa Fe, a 21 de agosto de 1984. Yo, Oficial Público de este Registro, inscribo la DEFUNCIÓN de BRÍGIDA MARÍA ANA NELLI. Sexo femenino, nacionalidad ARGENTINA. Estado: casada. Profesión: ama de casa. Documento de identidad: Libreta Cívica 6.119.349. Domicilio: J. P. López 2643.\n\nHIJA DE ÁNGEL ALBERTO NELLI Y DE FILOMENA PAGLIARONE.\n\nNACIDA EN LA PROVINCIA DE SANTA FE EL 12 DE ENERO DE 1901.\n\nOcurrida en Santa Fe el 19 de agosto de 1984 a las 20 horas. Causa de la defunción: enfermedad. Certificado médico Miguel Hominal. Declarante: VÍCTOR BORREI, L.E. 8.501.792, domicilio Belgrano 6578, obra en virtud de su persona autorizada para tal fin. — María M. Pierozzi, Jefe de la Subsección Defunciones de Santa Fe.", "notas": ["*** LO QUE PRUEBA QUE ES ELLA, Y NO OTRA NELLI: EL DOMICILIO. *** Esta acta y la de DOMINGO FAIENZA dan la misma casa — J. P. López 2643. Ella muere allí en agosto de 1984; él, en la misma casa, dieciséis meses después. Eran marido y mujer y vivían juntos hasta el final.", "OJO CON LAS OTRAS DOS DIRECCIONES QUE APARECEN. Belgrano 6578 y Berutti 5663 son los domicilios de los DECLARANTES, no de la familia. Las dos actas dicen que el declarante «obra en virtud de su persona autorizada para tal fin»: son gestores, casi seguro de la funeraria, y en cada acta es un hombre distinto. Esas direcciones no significan que hubiera otra casa ni otra familia.", "*** DA EL NOMBRE COMPLETO DEL PADRE. *** La fe de bautismo decía sólo «D. Ángel A. Nelli». Ahora se sabe que la A. es de ALBERTO. Y con esta acta entran en el árbol dos personas que hasta hoy no existían: sus padres.", "CASA CON LA FE DE BAUTISMO EN CUATRO COSAS: el nombre completo en el mismo orden (Brígida M. Ana), el mes y el año, el padre y el nombre de la madre.", "DOS FRICCIONES, que se anotan sin taparlas. (1) EL DÍA: la fe dice 13 de enero, esta acta dice 12. Un día de diferencia entre un papel escrito a los pocos días del parto y otro dictado 83 años después por alguien que no era de la familia. (2) EL APELLIDO DE LA MADRE: en la fe leí PALLARONE; aquí la letra da algo como PAGLIQEOME. Ninguna lectura es segura por separado, pero juntas apuntan a PAGLIARONE.", "Y CONFIRMA QUE ERA ARGENTINA DE NACIMIENTO: «nacida en la provincia de Santa Fe». La fe de bautismo dejaba esa casilla en blanco."], "imgs": [{"u": "actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20Partida%20de%20defuncion%20de%20Brigida%20Nelli%20-%20Santa%20Fe%20acta%201257.jpg", "t": "Partida de defuncion de Brigida Nelli - Santa Fe acta 1257"}], "zooms": [{"u": "actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20zoom%20-%20hija%20de%20Angel%20Alberto%20Nelli%20y%20Filomena%2C%20mismo%20domicilio%20que%20Domingo.jpg", "t": "Hija de Angel Alberto Nelli y Filomena, mismo domicilio que Domingo"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "angel_nelli": {"id": "angel_nelli", "nombre": "Ángel Alberto Nelli", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["faienza"], "resumen": "El padre de Brígida. Entra en el árbol el 28 de agosto de 2026, por la partida de defunción de su hija: hasta ese día era sólo una inicial en una fe de bautismo.", "datos": [["Quién era", "padre de BRÍGIDA MARÍA ANA NELLI, nacida en la provincia de Santa Fe en enero de 1901"], ["Nombre completo", "ÁNGEL ALBERTO. La fe de bautismo de su hija sólo daba «D. Ángel A. Nelli»; la partida de defunción de 1984 revela la segunda inicial"], ["Mujer", "FILOMENA PAGLIARONE"], ["Tratamiento", "en la fe de bautismo de 1901 el cura le pone «DON», que en esa época y en ese libro no se daba a cualquiera"], ["Dónde estaba en 1901", "en Santa Fe capital: allí nació y se bautizó su hija"]], "vida": "", "lug": "", "mapa": null, "sinacta": "NO SE SABE SI ERA ITALIANO O YA ARGENTINO, y es la pregunta que hay que resolver. El apellido NELLI es italiano, y su hija nació en Santa Fe en 1901, en plena inmigración. La vía más corta sería su propia partida de defunción en el Registro Civil de Santa Fe —que daría edad, nacionalidad y pueblo— o el acta de matrimonio con Filomena.\n\n*** 29 DE AGOSTO DE 2026 — YA SABEMOS ALGO DE ÉL, Y ES POR AUSENCIA. *** Se barrió entero el censo provincial de Santa Fe de 1887 —que es gratis y está indexado nombre por nombre— buscando NELLI y PAGLIARONE con trece grafías distintas, porque el indexador escribe los apellidos italianos de oído (ALASIA aparece de siete maneras en ese mismo censo). PAGLIARONE no existe en toda la provincia. De NELLI salen tres personas, y las tres se caen: dos son unos chicos de catorce y trece años metidos dentro de una casa SUIZA —los Burgi, con los Pfeiffer al lado— en HUMBOLDT, colonia suizo-alemana del departamento de Las Colonias; el tercero es un Juan de dieciocho años, también en Las Colonias. Nuestra familia vivió siempre en la CAPITAL.\n\n*** LUEGO ÁNGEL Y FILOMENA NO ESTABAN EN LA PROVINCIA EN JUNIO DE 1887. *** Y como su hija Brígida nace en Santa Fe en enero de 1901, llegaron entre esas dos fechas. Eso deja su boda en una horquilla de catorce años y en dos sitios posibles: Italia antes de embarcar, o SANTA FE entre 1888 y 1900. Si fue lo segundo, su acta está en el Registro Civil de Santa Fe y nombraría a los cuatro abuelos de Brígida, que hoy son cuatro huecos enteros.\n\nPOR ESO LA PARTIDA DE NACIMIENTO DE BRÍGIDA (enero de 1901) SUBE DE PRIORIDAD: un acta argentina de esa época da la edad y la nacionalidad de los dos padres, y muchas veces los años que llevaban en el país. Contestaría de una vez si era italiano o ya argentino. Relacionado: [[filomena_pagliarone]].", "padre": null, "madre": null, "conyuge": "filomena_pagliarone", "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_pagliarone": {"id": "filomena_pagliarone", "nombre": "Filomena Pagliarone", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 7, "ramas": ["faienza"], "resumen": "La madre de Brígida. Su nombre de pila está claro en dos documentos; el apellido es el único punto flojo de esta pareja, porque las dos fuentes lo escriben distinto.", "datos": [["Quién era", "madre de BRÍGIDA MARÍA ANA NELLI"], ["Marido", "ÁNGEL ALBERTO NELLI"], ["El nombre", "FILOMENA, sin discusión: así lo escriben la fe de bautismo de 1901 y la partida de defunción de 1984"], ["El apellido", "PROBABLE, NO PROBADO. En la fe de bautismo leí PALLARONE; en la partida de defunción la letra da algo como PAGLIQEOME. Ninguna de las dos lecturas es firme, pero juntas apuntan a PAGLIARONE"], ["Por qué encaja", "PAGLIARONE es apellido real y del ABRUZZO. Su yerno, Domingo Faienza, era de PAGLIETA, en la provincia de Chieti — también Abruzzo. Es una coincidencia sugerente, y nada más que eso"]], "vida": "", "lug": "", "mapa": null, "sinacta": "EL APELLIDO ESTÁ SIN CERRAR y es lo primero que hay que arreglar de esta pareja. Se resolvería con el acta de matrimonio de Ángel y Filomena, o con la partida de nacimiento de Brígida en el Registro Civil de Santa Fe (1901), que la escribiría una tercera vez. Con tres lecturas independientes el apellido quedaría fijado.\n\n*** Y NO SIRVE DE NADA BUSCARLA TODAVÍA EN ITALIA. *** El 29 de agosto de 2026 se barrió el censo provincial de Santa Fe de 1887 con ocho grafías del apellido —PAGLIARONE, PALLARONE, PAGLIARON, PAGLIERONE, PALLIARONE, PAGLIARONI, PAJARONE y PAGLIARO— y no existe NI UNA SOLA persona así en toda la provincia. Lo único parecido es una «Pagliaro Margarita» de cuarenta y dos años en Las Colonias, que es otro apellido. Junto con la misma ausencia de su marido, eso prueba que llegaron DESPUÉS de junio de 1887.\n\nLo que significa en la práctica: mientras el apellido no esté fijado y no sepamos el pueblo, buscarla en un archivo italiano es tirar el tiempo — Antenati se organiza por municipio y no se puede buscar un apellido a ciegas en toda Italia. El orden correcto es al revés: primero la partida argentina que fije el apellido y dé el pueblo, y después Italia. Relacionado: [[angel_nelli]].", "padre": null, "madre": null, "conyuge": "angel_nelli", "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "par ijos": [], "hermanos": ["tomas_r"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "anna_cundari": {"id": "anna_cundari", "nombre": "Anna Cundari", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 9, "ramas": ["salerno"], "resumen": "Mujer de Giovanni, el hermano de Settimo que se quedó en Rende. Apareció en una anotación al margen del acta de nacimiento de él.", "datos": [["Matrimonio", "24 de julio de 1926, Rende — acta 34"], ["Cónyuge", "Giovanni Salerno, nacido en Rende en 1904"], ["Fuente", "anotación marginal del acta de nacimiento de él (Rende 1904, acta 5)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Su acta de matrimonio tiene referencia exacta —RENDE, MATRIMONI 1926, ACTA 34— pero los fondos de Rende en Antenati terminan en 1910, así que hay que pedirla al Comune di Rende. Nombraría a sus padres, daría su edad y su pueblo, y abriría toda una rama: los descendientes de Giovanni siguen probablemente en Rende hoy.", "padre": null, "madre": null, "conyuge": "giovanni_hijo", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "caterina_misurelli": {"id": "caterina_misurelli", "nombre": "Caterina Santa Misurelli", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 9, "ramas": ["salerno"], "resumen": "Mujer de Salvatore, el sobrino que quedó huérfano de padre a los trece meses. Apareció en una anotación al margen del acta de nacimiento de él.", "datos": [["Matrimonio", "15 de octubre de 1921, Rende — acta 67"], ["Cónyuge", "Salvatore Salerno, nacido en Rende en 1899"], ["Apellido", "leído «-elli»; la letra tras «Mi» es dudosa: Misurelli o Miturelli"], ["Fuente", "anotación marginal del acta de nacimiento de él (Rende 1899, acta 13)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Referencia exacta —RENDE, MATRIMONI 1921, ACTA 67— fuera del alcance de Antenati, que se detiene en 1910. Hay que pedirla al Comune di Rende. Fijaría de paso la grafía del apellido, hoy dudosa.", "padre": null, "madre": null, "conyuge": "salvatore", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marcos_ramon_rivas": {"id": "marcos_ramon_rivas", "nombre": "Ramón Marcos Rivas", "legal": "RAMÓN MARCOS, no Marcos Ramón — así lo escriben sus dos actas y el registro del cementerio", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 9, "ramas": ["rivas", "celeri"], "resumen": "Abuelo paterno de Gonzalo. El 31 de agosto de 2026 pasó de ser el hueco más grande del árbol —un hombre sin fechas, sin pueblo y sin padres probados— a tener DOS ACTAS del Registro Civil de Santa Fe. Nació en CAYASTACITO, departamento de SAN JUSTO, en noviembre de 1909, fue empleado en Calchaquí, se casó en Jobson en 1948 y murió en Santa Fe en 2002, a los noventa y dos años. Y sus actas nombran por fin a sus padres: RAMÓN RIVAS, hacendado de San Justo, y ROSA BUDIÑO.", "datos": [["Nacimiento", "*** NOVIEMBRE DE 1909, en CAYASTACITO, departamento de SAN JUSTO, provincia de Santa Fe. *** El DÍA baila: su acta de matrimonio de 1948, donde lo declara él mismo, dice el VEINTITRÉS; su partida de defunción de 2002 y el registro del cementerio dicen el VEINTIOCHO"], ["Los dos lugares son el mismo", "el matrimonio dice «San Justo» y la defunción «Cayastacito». No se contradicen: Cayastacito es la LOCALIDAD y San Justo el DEPARTAMENTO. Uno dio el pueblo y el otro la comarca"], ["Defunción", "18 de noviembre de 2002, a las 07:35, en la ciudad de Santa Fe — tomo 5°B, acta 1237, año 2002. Diez días antes de cumplir noventa y tres"], ["Matrimonio", "10 de abril de 1948, JOBSON, departamento Vera, Santa Fe — acta 15, ante Julio H. Deiber, jefe del Registro del Estado Civil"], ["Padre", "*** RAMÓN RIVAS, argentino, domiciliado en SAN JUSTO, de profesión HACENDADO *** — CONFIRMADO POR ACTA, y por las dos: el matrimonio de 1948 y la defunción de 2002"], ["Madre", "*** ROSA BUDIÑO *** — nombre nuevo en este árbol, y también confirmado por las dos actas. En abril de 1948 ya había muerto"], ["Oficio", "EMPLEADO en 1948; JUBILADO al morir en 2002"], ["Domicilios", "CALCHAQUÍ cuando se casó, en 1948; y su casa de Ruta n.º 1, kilómetro 5,5 al oeste, SAN JOSÉ DEL RINCÓN, donde estaba domiciliado al morir. *** Pero no murió allí: el acta dice que la muerte ocurrió en la CIUDAD DE SANTA FE ***"], ["Documento", "M 2.479.755"], ["Cónyuge", "ELVA AGUSTINA CELERI, con quien se casó a los treinta y ocho años; ella tenía veintiséis"], ["Hijos", "Marcos César (1950), Héctor Omar, Beatriz Margarita y Raúl"], ["Hermanos", "al menos uno, que fue a visitarlo de viejo y era igual a él. Sigue sin nombre"], ["Quién declaró su muerte", "GUILLERMO BERTONE, documento 24.232.601, domiciliado en Santo Tomé, «en virtud de ser persona autorizada para tal fin» — o sea un gestor, no un pariente"]], "vida": "1909–2002", "lug": "CAYASTACITO", "mapa": null, "sinacta": null, "padre": "ramon_rivas", "madre": "rosa_budino", "conyuge": "elba_celeri", "hijos": ["marcos_rivas", "hector_omar_rivas", "beatriz_rivas", "raul_rivas"], "hermanos": [], "actas": [{"titulo": "Acta de matrimonio con Elva Agustina Celeri", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "10 de abril de 1948", "lugar": "Jobson, departamento Vera, Santa Fe, Argentina", "ref": "acta 15", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se consiguió", "pedida en línea por Gonzalo el 31 de agosto de 2026, expedida ese mismo día. Trámite 26-00-287-372"], ["Oficial", "Julio H. Deiber, jefe del Registro del Estado Civil de Jobson"], ["Formulario", "«Modelo B» — el impreso de matrimonios de la provincia"]], "literal": "", "traduccion": "Acta número QUINCE. En JOBSON, departamento VERA, provincia de Santa Fe, el día DIEZ de ABRIL del año mil novecientos CUARENTA Y OCHO. Ante mí, JULIO H. DEIBER, jefe del Registro del Estado Civil, comparecieron:\n\nDon RAMÓN MARCOS RIVAS, de nacionalidad ARGENTINA, de estado SOLTERO, NACIDO EN SAN JUSTO el día VEINTITRÉS DE NOVIEMBRE DE MIL NOVECIENTOS NUEVE, domiciliado en CALCHAQUÍ y de profesión EMPLEADO; HIJO DE DON RAMÓN RIVAS, de nacionalidad ARGENTINA, domiciliado en SAN JUSTO y de profesión HACENDADO, y DE DOÑA ROSA BUDIÑO, FALLECIDA.\n\nY doña ELVA AGUSTINA CELERI, de nacionalidad ARGENTINA, de estado SOLTERA, NACIDA EN JOBSON el día VEINTISÉIS DE DICIEMBRE DE MIL NOVECIENTOS VEINTIUNO, domiciliada en JOBSON y de profesión EMPLEADA; hija de don TEBALDO CELERI, FALLECIDO, y de doña MARGARITA ALASIO, de nacionalidad ARGENTINA, de profesión DOMÉSTICOS y domiciliada en JOBSON.\n\nAmbos comparecientes manifestaron que era su voluntad casarse, tomándose recíprocamente por marido y mujer y que no había impedimento alguno para la celebración de su matrimonio.\n\nLos testigos don ESTEBAN LUIS CORTI, de TREINTA Y CINCO años de edad, de nacionalidad argentina, domiciliado en CALCHAQUÍ, y don EDUARDO CEPZ, de CUARENTA Y UN años de edad, de nacionalidad argentina, domiciliado en JOBSON, vecindario y hábiles para este acto, declararon sobre la identidad de los futuros esposos.\n\nPrevia lectura de los artículos 50, 51 y 53 de la ley nacional de matrimonio, interrogué a don Ramón Marcos Rivas si quería por su esposa a doña Elva Agustina Celeri, y a ella si lo quería por su esposo; y habiendo contestado los dos que sí, declaro que quedan unidos en legítimo matrimonio. Leída el acta, los interesados manifestaron su conformidad y LA FIRMARON con los testigos. — Ella firma «Elba Celeri».", "notas": ["*** ES EL ACTA QUE ABRE LA RAMA RIVAS, LA ÚNICA QUE NO TENÍA NI UN PAPEL. *** Hasta el 31 de agosto de 2026 esta rama entera —treinta y dos personas— estaba en el árbol por memoria familiar y sin un solo documento. Este acta nombra de golpe a los cuatro padres de los novios y da fechas y pueblos.", "*** RAMÓN RIVAS EXISTE, Y ERA HACENDADO. *** La ficha de su padre decía «en teoría Ramón — el nombre viene de la tradición familiar, no de un papel». Ahora hay papel, y dice más de lo que se esperaba: ARGENTINO, DOMICILIADO EN SAN JUSTO y de profesión HACENDADO. No era un jornalero: en la Argentina de entonces un hacendado es un propietario de campo. La partida de defunción de 2002 lo confirma por segunda vía.", "*** ROSA BUDIÑO ES UN NOMBRE NUEVO EN ESTE ÁRBOL. *** La madre de Marcos Ramón no figuraba en ninguna parte, ni siquiera como recuerdo. El acta la nombra y añade un dato: en abril de 1948 YA HABÍA MUERTO. El impreso pone «fallecida» en la casilla de su nacionalidad, que es como estos formularios marcan a los padres difuntos.", "*** Y CORRIGE EL NOMBRE DE LOS DOS ABUELOS. *** Él no es «Marcos Ramón» sino RAMÓN MARCOS: el acta lo escribe así seis veces, y su partida de defunción y el registro del cementerio también. Y ella no es «Elba Celeri» sino ELVA AGUSTINA CELERI — aunque al pie del acta ella misma firma «Elba Celeri», que es como la llamaban. Las dos cosas importan al pedir papeles: quien busque «Marcos Ramón» o «Elba» en un índice alfabético puede no encontrarlos.", "LA FECHA DE ÉL NO CUADRA CON SU DEFUNCIÓN. Aquí declara haber nacido el VEINTITRÉS de noviembre de 1909; su partida de defunción de 2002 y el registro del cementerio dicen el VEINTIOCHO. Cinco días de diferencia. Dos fuentes contra una — pero la una es él mismo, a los treinta y ocho años, y las otras dos las declara un gestor cincuenta y cuatro años después. NO SE PUEDE DECIDIR SIN SU PARTIDA DE NACIMIENTO.", "TEBALDO CELERI YA HABÍA MUERTO en abril de 1948, y MARGARITA ALASIA SEGUÍA VIVA, domiciliada en Jobson y de profesión «domésticos». Es el último rastro conocido de ella. Su apellido aquí se escribe ALASIO, una grafía más que sumar a las siete del censo de 1887.", "DÓNDE VIVÍAN: él en CALCHAQUÍ, ella en JOBSON — los dos en el norte de Santa Fe, y Jobson es justo donde se había establecido Tebaldo Celeri al llegar de Trassilico. Los dos constan como EMPLEADO y EMPLEADA, no como campesinos."], "imgs": [{"u": "actas/1948%20-%20Matrimonio%20Ramon%20Marcos%20Rivas%20y%20Elva%20Agustina%20Celeri/1948-04-10%20M%20Acta%20de%20matrimonio%20-%20Jobson%20acta%2015%20pagina%201.jpg", "t": "Acta de matrimonio - Jobson acta 15 pagina 1"}, {"u": "actas/1948%20-%20Matrimonio%20Ramon%20Marcos%20Rivas%20y%20Elva%20Agustina%20Celeri/1948-04-10%20M%20Acta%20de%20matrimonio%20-%20Jobson%20acta%2015%20pagina%202.jpg", "t": "Acta de matrimonio - Jobson acta 15 pagina 2"}], "zooms": []}, {"titulo": "Partida de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "18 de noviembre de 2002, a las 07:35", "lugar": "ciudad de Santa Fe, departamento La Capital, Argentina", "ref": "tomo 5°B, acta 1237", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se consiguió", "pedida en línea por Gonzalo el 31 de agosto de 2026, expedida ese mismo día. Trámite 26-00-287-370"], ["Certificado médico", "Cristian Meser"]], "literal": "", "traduccion": "REPÚBLICA ARGENTINA, PROVINCIA DE SANTA FE. Registro del Estado Civil. Tomo 5°B, acta 1237, año 2002.\n\nEn SANTA FE, departamento LA CAPITAL, provincia de Santa Fe, República Argentina, a 19 de NOVIEMBRE de 2002, yo, Oficial Público de este Registro, inscribo la DEFUNCIÓN de RAMÓN MARCOS RIVAS.\n\nSexo MASCULINO, nacionalidad ARGENTINA. Estado: CASADO. Profesión: JUBILADO. Documento de identidad: M 2.479.755. Domicilio: RUTA N.º 1, KM 5,5 AL OESTE, SAN JOSÉ DEL RINCÓN, Santa Fe.\n\nHIJO DE RAMÓN RIVAS Y DE ROSA BUDIÑO.\n\nNACIDO EN CAYASTACITO, SANTA FE, EL 28 DE NOVIEMBRE DE 1909.\n\nOcurrida en Santa Fe el 18 de noviembre de 2002 a las 07:35 horas. Causa de la defunción: enfermedad. Certificado médico de CRISTIAN MESER. Declarante: GUILLERMO BERTONE, documento de identidad 24.232.601, domicilio Santo Tomé, Santa Fe, obra en virtud de ser persona autorizada para tal fin.", "notas": ["*** ESTE ACTA DA EL PUEBLO, QUE ERA LO QUE FALTABA: CAYASTACITO. *** El registro del cementerio decía dónde lo enterraron, no dónde nació. Con este dato ya se puede pedir su partida de nacimiento, que es el siguiente eslabón y el que nombraría a Rosa Budiño con su edad y diría si Ramón Rivas lo reconoció.", "Y ENCAJA CON EL ACTA DE MATRIMONIO en vez de contradecirla. Allí dijo «San Justo»; aquí pone «Cayastacito». *** Cayastacito es la localidad y San Justo el departamento ***, así que las dos son ciertas a distinto nivel. Uno dio el pueblo, el otro la comarca. Curiosidad archivística: en el censo provincial de 1887 Cayastacito figura todavía dentro del departamento de LA CAPITAL, no del de San Justo — los límites se movieron.", "PERO LA FECHA SÍ SE CONTRADICE: aquí el 28 de noviembre, en su matrimonio el 23. Y aquí quien declara no es la familia sino GUILLERMO BERTONE, «persona autorizada para tal fin» — un gestor. Es el mismo patrón que en las otras cuatro partidas argentinas de este archivo: el declarante nunca es un pariente.", "MURIÓ DIEZ DÍAS ANTES DE CUMPLIR NOVENTA Y TRES AÑOS, a las siete y treinta y cinco de la mañana. *** Y conviene no confundir las dos direcciones que da el acta: TENÍA CASA en SAN JOSÉ DEL RINCÓN —ruta 1, kilómetro 5,5— y ahí estaba domiciliado, pero la muerte «ocurrida en Santa Fe» es en la CIUDAD, no en el Rincón. *** Y confirma por segunda vía a sus dos padres, cincuenta y cuatro años después del matrimonio y con un declarante distinto: RAMÓN RIVAS y ROSA BUDIÑO."], "imgs": [{"u": "actas/2002%20-%20Ramon%20Marcos%20Rivas/2002-11-18%20D%20Partida%20de%20defuncion%20-%20Santa%20Fe%20tomo%205B%20acta%201237.jpg", "t": "Partida de defuncion - Santa Fe tomo 5B acta 1237"}], "zooms": []}], "nActas": 2, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "elba_celeri": {"id": "elba_celeri", "nombre": "Elva Agustina Celeri", "legal": "ELVA AGUSTINA en su acta de matrimonio — pero ella firma «Elba Celeri»", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 9, "ramas": ["rivas", "celeri"], "resumen": "Abuela paterna de Gonzalo, una de al menos cinco hermanas. Hasta el 31 de agosto de 2026 figuraba aquí como «Elba Celeri», sin fechas: su acta de matrimonio le devolvió el nombre completo y el día exacto en que nació. Su padre fue Tebaldo Celeri, el inmigrante de Trassilico; por ella entra en el árbol la Toscana.", "datos": [["Nacimiento", "*** 26 DE DICIEMBRE DE 1921, en JOBSON *** (departamento Vera, Santa Fe) — por su acta de matrimonio de 1948"], ["Su nombre", "el acta la llama ELVA AGUSTINA CELERI, pero al pie *** ella misma firma «Elba Celeri» ***, que es como la conocía la familia. Las dos son suyas; al buscarla en un índice hay que probar las dos"], ["Matrimonio", "10 de abril de 1948, Jobson, acta 15 — a los veintiséis años, con un hombre de treinta y ocho"], ["Oficio", "EMPLEADA, según su acta de matrimonio"], ["Padres", "TEBALDO CELERI, ya difunto en abril de 1948, y MARGARITA ALASIO, argentina, de profesión «domésticos», domiciliada entonces en Jobson — CONFIRMADOS POR ACTA"], ["Cónyuge", "Ramón Marcos Rivas"], ["Hijos", "Marcos César (1950), Héctor Omar, Beatriz Margarita y Raúl"], ["Hermanas", "Olga, Ercilia (o Hercilia), Rosa y Nerina. Puede haber más"], ["Fuente", "acta de matrimonio de 1948, archivada en la ficha de su marido"]], "vida": "n.1921", "lug": "JOBSON", "mapa": null, "sinacta": "Su acta de matrimonio, guardada en la ficha de Ramón Marcos Rivas, le puso por fin nombre completo y fecha: ELVA AGUSTINA CELERI, nacida en JOBSON el 26 DE DICIEMBRE DE 1921.\n\n*** LO QUE ESO CONFIRMA. *** Que era hija de Tebaldo Celeri y Margarita Alasio, cosa que hasta ahora sólo decía la memoria familiar. Y que en abril de 1948 su padre ya había muerto mientras su madre vivía, en Jobson — el último rastro conocido de Margarita.\n\nLO QUE FALTA ES SU PARTIDA DE NACIMIENTO, Jobson o el departamento de Vera, 26 de diciembre de 1921. Daría las edades de Tebaldo y Margarita en 1921 y su domicilio exacto, y sería el primer documento argentino que describa a Tebaldo ya viejo. Y su DEFUNCIÓN, sin fecha conocida.\n\nY SIGUEN FALTANDO SUS CUATRO HERMANAS: Olga, Ercilia, Rosa y Nerina, todas por memoria familiar. Con la fecha de Elva ya se sabe dónde buscarlas — los nacimientos de Jobson y Vera de los años veinte — y NERINA es el nombre más raro y por tanto el más fácil de encontrar.", "padre": "tebaldo_celeri", "madre": "margarita_alasia", "conyuge": "marcos_ramon_rivas", "hijos": ["marcos_rivas", "hector_omar_rivas", "beatriz_rivas", "raul_rivas"], "hermanos": ["olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "hector_omar_rivas": {"id": "hector_omar_rivas", "nombre": "Héctor Omar Rivas", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 10, "ramas": ["rivas", "celeri"], "resumen": "Segundo hijo de Marcos Ramón y Elba. Tío de Gonzalo.", "datos": [["Padres", "Marcos Ramón Rivas y Elba Celeri"], ["Hijos", "sí, pero no se publican: pertenecen a las generaciones reservadas"], ["Fuente", "memoria familiar"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Sin datos de archivo.", "padre": "marcos_ramon_rivas", "madre": "elba_celeri", "conyuge": null, "hijos": ["lisandro_rivas", "omar_rivas"], "hermanos": ["marcos_rivas", "beatriz_rivas", "raul_rivas"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "beatriz_rivas": {"id": "beatriz_rivas", "nombre": "Beatriz Margarita Rivas", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 10, "ramas": ["rivas", "celeri"], "resumen": "Tercera hija de Marcos Ramón y Elba. Tía de Gonzalo. Sus hijos pertenecen a las generaciones reservadas y no se publican.", "datos": [["Padres", "Marcos Ramón Rivas y Elba Celeri"], ["Hijos", "sí, pero no se publican: pertenecen a las generaciones reservadas"], ["Fuente", "memoria familiar"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Sin datos de archivo. Falta el nombre de su marido. Sus hijos pertenecen a las generaciones reservadas y no se publican.", "padre": "mar  y cuatro años de diferencia, el mismo nombre"], ["Hijo", "RAMÓN MARCOS RIVAS, nacido en Cayastacito, departamento de San Justo, en noviembre de 1909"], ["¿Y un segundo hijo?", "FRANCISCO, bautizado en la catedral de Santa Fe el 20 de agosto de 1913, hijo natural de «Doña Rosa Budiño, de veinticinco años». Tres años y medio menor que Ramón Marcos. Encaja, pero NO ESTÁ PROBADO"], ["Muerta antes de", "abril de 1948 — el acta de matrimonio de su hijo la marca «fallecida»"], ["Nacimiento", "sin fecha. Si es la Rosa Budiño del bautismo de 1913, habría nacido hacia 1888 y tendría VEINTIUNO al nacer Ramón Marcos. NO ESTÁ PROBADO"], ["El apellido", "BUDIÑO es apellido GALLEGO, de Pontevedra y Ourense. No italiano. Es la primera vez que esta genealogía sale de Italia y de la Argentina criolla"], ["Su pareja", "RAMÓN RIVAS, hacendado de San Justo. NO CONSTA QUE ESTUVIERAN CASADOS: ningún documento los une más que por el hijo"], ["Fuente", "las dos actas de su hijo, archivadas en la ficha de él"]], "vida": "†<1948", "lug": "", "mapa": null, "sinacta": null, "padre": null, "madre": null, "conyuge": "ramon_rivas", "hijos": ["marcos_ramon_rivas"], "hermanos": [], "actas": [{"titulo": "Bautismo de Francisco, hijo natural de una Rosa Budiño", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "20 de agosto de 1913 el bautismo; nació el 10 de mayo de 1913", "lugar": "Catedral de Todos los Santos, Santa Fe, Argentina", "ref": "libro parroquial, página 389", "fuente": [["Archivo", "Archivo de la Notaría Mayor Eclesiástica de la Arquidiócesis de Santa Fe"], ["Cómo se encontró", "FamilySearch, grupo de imágenes 004482429, imagen 471 de 583 — hallado por Gonzalo el 31 de agosto de 2026"], ["Estado de la prueba", "*** NO ESTÁ PROBADO que esta Rosa Budiño sea la nuestra ***"]], "literal": "", "traduccion": "En Santa Fe, a los VEINTE del mes de AGOSTO del año del Señor de mil novecientos TRECE, el infrascripto Cura de esta Parroquia bautizó solemnemente a FRANCISCO, que nació el día DIEZ del
