gos: LUZIO IANNONE, de veintidós años, ESCRIBIENTE, y EMIDIO FLOCCO, de cincuenta y seis años, CAFETERO, ambos residentes en este municipio.\n\nEl documento presentado es el certificado de las amonestaciones hechas por mí mismo como Oficial del Estado Civil de Atessa, la primera el día DIECIOCHO y la segunda el día VEINTICINCO del corriente diciembre.\n\nA dicho matrimonio ha dado su consentimiento EL PADRE DEL ESPOSO, según resulta y se explica en el acta de solicitud de las amonestaciones.\n\n(a) Las palabras interlineadas «vita in» valgan por no escritas.\n\nLeída la presente acta a todos los intervinientes, los esposos y los testigos la han firmado conmigo.", "notas": ["ERA EL CABO MÁS CORTO Y MÁS RENTABLE QUE HABÍA ABIERTO, Y HA PAGADO. De Nicola Faienza no se sabía nada en absoluto: ni la edad, ni el oficio, ni el pueblo, ni los padres. El acta da las cuatro cosas en un solo renglón.", "MATA LA PISTA DE PAGLIETA DEFINITIVAMENTE. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Ni el novio ni su padre eran de Paglieta. Aquel pueblo venía del bloque familiar sin fuentes, y con ésta van tres veces que ese bloque falla en una comprobación directa.", "AÑADE UNA GENERACIÓN DE FAIENZA: Giuseppe Faienza y Maria Staniscia, los padres del novio, que hasta hoy no existían en ningún papel. Él vivo en 1892, ella ya muerta.", "EL CONSENTIMIENTO PATERNO NO ES FÓRMULA. El Código Civil lo exigía a los varones menores de veinticinco años y Nicola tenía veintitrés, igual que le pasó a Francesco Salerno en Rende dos años después. Que conste por escrito es la prueba de que Giuseppe Faienza estaba vivo y a mano en diciembre de 1892.", "LOS DOS NOVIOS SABÍAN ESCRIBIR, y eso en estos registros es excepcional: la fórmula habitual de la época es «essendo i testimoni analfabeti». Aquí firman los cuatro. El padre de ella, Domenico Pizzi, también firmaba: lo hizo en 1869 al declarar el nacimiento de esta misma novia.", "CONFIRMA A LA NOVIA PUNTO POR PUNTO: veintitrés años (nació el 12 de febrero de 1869), hija del difunto Domenico (murió el 28 de septiembre de 1891) y de Teresa Flocco, que seguía viva. La corrección (a) al pie tacha el «in vita» que el escribano había interlineado sobre ella: no era una viuda más, estaba viva.", "CORRIGE UNA LECTURA ANTERIOR. La delegación del alcalde en Francesco Falcucci se anotó en la ficha del acta de 1891 como «24 de noviembre de 1889». Aquí se lee VENTICINQUE, y los nacimientos de Atessa de 1899 repiten «venticinque». Era el 25.", "SE LOCALIZÓ EN CUATRO IMÁGENES Y A LA PRIMERA en la última: el número lo daba la nota al margen de 1869, y la portada de la PARTE II en la página 110 dejaba la aritmética servida.", "LO QUE ABRE: la partida de nacimiento del propio Nicola, en los Nati de Atessa hacia 1869 —el mismo registro y casi el mismo año que el de su mujer—, y el matrimonio de sus padres, hacia 1865."], "imgs": [{"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 1, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "nicola_faienza": {"id": "nicola_faienza", "nombre": "Nicola Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Cónyuge", "gen": 7, "ramas": ["faienza"], "resumen": "Campesino de Atessa, nacido hacia 1869. Casó con Angiolina Pizzi el 29 de diciembre de 1892, acta 101 del registro de Atessa. Hasta agosto de 2026 no se sabía absolutamente nada de él; el acta de matrimonio lo dice todo de golpe: dónde nació, a qué se dedicaba y de quién era hijo.", "datos": [["Nacimiento", "hacia 1869, ATESSA — el acta de matrimonio le da veintitrés años en diciembre de 1892 y lo declara «nato in Atessa». Su partida estaría en los Nati de Atessa de 1868-1870"], ["Oficio", "CONTADINO (campesino)"], ["Residencia", "ATESSA"], ["Padres", "GIUSEPPE FAIENZA, contadino de Atessa, vivo en 1892; y MARIA STANISCIA, ya difunta en 1892"], ["Matrimonio", "29 de diciembre de 1892, 11:15, casa comunal de Atessa — ACTA 101"], ["Cónyuge", "Angiolina (Angela) Pizzi, nacida en Atessa el 12 de febrero de 1869, de su misma edad"], ["Sabía escribir", "sí: firmó el acta de su boda de su puño, «Faienza Nicola», y su mujer también"], ["Hijo", "Domenico Faienza, emigrado a Argentina. Su partida sigue sin localizar: no está ni en Paglieta 1899 ni en Atessa 1899"]], "vida": "n.c.1869", "lug": "ATESSA", "mapa": null, "sinacta": "RESUELTO EN AGOSTO DE 2026 CON EL ACTA 101 DE ATESSA, que está transcrita entera en la ficha del matrimonio. La cadena fue ésta: al margen de la partida de nacimiento de Angiolina Pizzi (Atessa, 1869, acta 65) una mano posterior anotó «nel 1892 al N. 101 sposò NICOLA FAIENZA», con fecha de 26 de agosto de 1893. Con el año, el número y el municipio se pidió el documento, y el documento contestó a todo.\n\nLO QUE DICE: que tenía VEINTITRÉS AÑOS —o sea que nació hacia 1869, el mismo año que su mujer—, que era CONTADINO, que había NACIDO EN ATESSA y vivía en Atessa, y que era hijo de GIUSEPPE FAIENZA, contadino de Atessa y vivo entonces, y de la difunta MARIA STANISCIA. Como no llegaba a los veinticinco años, el Código Civil exigía el consentimiento de su padre, y el acta lo hace constar: «ha prestato il consenso il padre dello sposo». Ese trámite es, de paso, la prueba de que Giuseppe Faienza estaba vivo y localizable en Atessa en diciembre de 1892.\n\nY LO QUE TUMBA: la pista de PAGLIETA, definitivamente. Nicola no era de Paglieta ni de ningún otro sitio: era de Atessa, como su padre y como su mujer. Aquélla venía del mismo bloque familiar sin una sola cita que ya había errado antes, y con ésta van tres veces comprobadas.\n\nLO QUE FALTA: su propia partida de nacimiento, en los Nati de Atessa hacia 1869, y la de su hijo Domenico, que no está en Atessa 1899 —el índice del año se ha leído entero— y habrá que buscar en 1900.", "padre": "giuseppe_faienza", "madre": "maria_staniscia", "conyuge": "angela_pizzi", "hijos": ["domenico_faienza"], "hermanos": [], "actas": [{"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "29 de diciembre de 1892, 11:15", "lugar": "Atessa (Chieti)", "ref": "acta 101", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1892, atti di matrimonio"], ["Registro", "hash del contenedor: wWpoWmX — 138 páginas"], ["Página", "103 de 138"], ["Año manuscrito", "«mille ottocento novantadue» — coincide con el catálogo"], ["Oficial", "Francesco Falcucci, assessore municipale delegado por el sindaco «con atto del venticinque novembre milleottocentottantanove, debitamente approvato»"], ["Cómo se localizó", "el número de acta ya se sabía por la nota al margen del acta 65 de 1869. El índice alfabético va en las páginas 135 a 138 y el matrimonio más alto que indexa es el 104. La página 110 es la portada de la PARTE II, así que la parte I ocupa las páginas 1 a 109 a razón de una acta por imagen; un sondeo en la página 60 dio el acta 58, o sea acta = página − 2, y la 103 dio la 101 a la primera. Cuatro imágenes en total"]], "literal": "Numero 101 — Faienza Nicola / Angiolina Pizzi\n\nL'anno mille ottocento novantadue, addì ventinove di Dicembre, a ore\nantimeridiane undici e minuti quindici, nella Casa Comunale di Atessa, aperto al\npubblico. Avanti di me Francesco Falcucci Assessore Municipale delegato dal\nSindaco con atto del venticinque novembre milleottocentottantanove, debitamente\napprovato, Ufficiale dello Stato Civile, vestito in forma ufficiale, sono\npersonalmente comparsi:\n\n1. NICOLA FAIENZA, di anni ventitré, contadino, nato in Atessa, residente in\nAtessa, figlio di GIUSEPPE, contadino, residente in Atessa, e della fu MARIA\nSTANISCIA, residente in vita in Atessa;\n\n2. ANGIOLINA PIZZI, di anni ventitré, donna di casa, nata in Atessa, residente in\nAtessa, figlia del fu DOMENICO, residente in vita in Atessa, e di TERESA FLOCCO,\nresidente in Atessa…\n\n…A questo atto sono stati presenti: Luzio Iannone, di anni ventidue, scrivano, e\nEmidio Flocco, di anni cinquantasei, caffettiere, entrambi residenti in questo\nComune. Il documento presentato è il certificato delle pubblicazioni eseguite da\nme Uffiziale dello Stato Civile di Atessa, cioè la prima nel dì diciotto e la\nseconda nel dì venticinque volgente Dicembre. Al suddetto matrimonio ha prestato\nil consenso IL PADRE DELLO SPOSO, come risulta ed è spiegato dall'atto di\nrichiesta delle pubblicazioni. — (a) le parole interlineate «vita in» valgano per\nnon scritte. Letto il presente atto a tutti gl'intervenuti, gli sposi ed i\ntestimoni si sono meco sottoscritti.\n\nFaienza Nicola · Angiolina Pizzi · Luzio Iannone testimone · Emidio Flocco\ntestimone · L'Ufficiale dello Stato Civile, Francesco Falcucci", "traduccion": "El año mil ochocientos noventa y dos, el día VEINTINUEVE DE DICIEMBRE, a las ONCE Y QUINCE de la mañana, en la casa comunal de ATESSA, abierta al público.\n\nAnte mí, FRANCESCO FALCUCCI, asesor municipal delegado por el alcalde mediante acta del veinticinco de noviembre de mil ochocientos ochenta y nueve, debidamente aprobada, Oficial del Estado Civil, vestido de forma oficial, han comparecido personalmente:\n\n1.º NICOLA FAIENZA, de VEINTITRÉS AÑOS, CAMPESINO, NACIDO EN ATESSA, residente en Atessa, HIJO DE GIUSEPPE, campesino, residente en Atessa, Y DE LA DIFUNTA MARIA STANISCIA, que en vida residió en Atessa.\n\n2.º ANGIOLINA PIZZI, de VEINTITRÉS AÑOS, ama de casa, nacida en Atessa, residente en Atessa, HIJA DEL DIFUNTO DOMENICO, que en vida residió en Atessa, Y DE TERESA FLOCCO, residente en Atessa.\n\nLos cuales me han pedido unirlos en matrimonio. A tal efecto me han presentado un solo documento; leídos a los esposos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y habiendo preguntado al esposo si quiere tomar por mujer a la aquí presente ANGIOLINA PIZZI, y a ésta si quiere tomar por marido al aquí presente NICOLA FAIENZA, y habiendo respondido cada uno afirmativamente, he pronunciado en nombre de la ley que quedan unidos en matrimonio.\n\nTestigos: LUZIO IANNONE, de veintidós años, ESCRIBIENTE, y EMIDIO FLOCCO, de cincuenta y seis años, CAFETERO, ambos residentes en este municipio.\n\nEl documento presentado es el certificado de las amonestaciones hechas por mí mismo como Oficial del Estado Civil de Atessa, la primera el día DIECIOCHO y la segunda el día VEINTICINCO del corriente diciembre.\n\nA dicho matrimonio ha dado su consentimiento EL PADRE DEL ESPOSO, según resulta y se explica en el acta de solicitud de las amonestaciones.\n\n(a) Las palabras interlineadas «vita in» valgan por no escritas.\n\nLeída la presente acta a todos los intervinientes, los esposos y los testigos la han firmado conmigo.", "notas": ["ERA EL CABO MÁS CORTO Y MÁS RENTABLE QUE HABÍA ABIERTO, Y HA PAGADO. De Nicola Faienza no se sabía nada en absoluto: ni la edad, ni el oficio, ni el pueblo, ni los padres. El acta da las cuatro cosas en un solo renglón.", "MATA LA PISTA DE PAGLIETA DEFINITIVAMENTE. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Ni el novio ni su padre eran de Paglieta. Aquel pueblo venía del bloque familiar sin fuentes, y con ésta van tres veces que ese bloque falla en una comprobación directa.", "AÑADE UNA GENERACIÓN DE FAIENZA: Giuseppe Faienza y Maria Staniscia, los padres del novio, que hasta hoy no existían en ningún papel. Él vivo en 1892, ella ya muerta.", "EL CONSENTIMIENTO PATERNO NO ES FÓRMULA. El Código Civil lo exigía a los varones menores de veinticinco años y Nicola tenía veintitrés, igual que le pasó a Francesco Salerno en Rende dos años después. Que conste por escrito es la prueba de que Giuseppe Faienza estaba vivo y a mano en diciembre de 1892.", "LOS DOS NOVIOS SABÍAN ESCRIBIR, y eso en estos registros es excepcional: la fórmula habitual de la época es «essendo i testimoni analfabeti». Aquí firman los cuatro. El padre de ella, Domenico Pizzi, también firmaba: lo hizo en 1869 al declarar el nacimiento de esta misma novia.", "CONFIRMA A LA NOVIA PUNTO POR PUNTO: veintitrés años (nació el 12 de febrero de 1869), hija del difunto Domenico (murió el 28 de septiembre de 1891) y de Teresa Flocco, que seguía viva. La corrección (a) al pie tacha el «in vita» que el escribano había interlineado sobre ella: no era una viuda más, estaba viva.", "CORRIGE UNA LECTURA ANTERIOR. La delegación del alcalde en Francesco Falcucci se anotó en la ficha del acta de 1891 como «24 de noviembre de 1889». Aquí se lee VENTICINQUE, y los nacimientos de Atessa de 1899 repiten «venticinque». Era el 25.", "SE LOCALIZÓ EN CUATRO IMÁGENES Y A LA PRIMERA en la última: el número lo daba la nota al margen de 1869, y la portada de la PARTE II en la página 110 dejaba la aritmética servida.", "LO QUE ABRE: la partida de nacimiento del propio Nicola, en los Nati de Atessa hacia 1869 —el mismo registro y casi el mismo año que el de su mujer—, y el matrimonio de sus padres, hacia 1865."], "imgs": [{"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_faienza": {"id": "giuseppe_faienza", "nombre": "Giuseppe Faienza", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 6, "ramas": ["faienza"], "resumen": "Campesino de Atessa, padre de Nicola Faienza. Nacido hacia 1840. Estaba vivo en diciembre de 1892 y tuvo que dar su consentimiento para que su hijo se casara.", "datos": [["Nacimiento", "hacia 1840, presumiblemente Atessa — su hijo nació allí hacia 1869"], ["Oficio", "contadino (campesino)"], ["Residencia", "ATESSA — el acta de 1892 lo da «residente in Atessa», sin «fu»: vivo"], ["Cónyuge", "MARIA STANISCIA, ya difunta en diciembre de 1892"], ["Hijo", "Nicola Faienza (hacia 1869), contadino, casado con Angiolina Pizzi"], ["Defunción", "sin localizar — posterior a diciembre de 1892"], ["De dónde sale", "acta de matrimonio de su hijo: Atessa, Matrimoni 1892, acta 101"]], "vida": "c.1840–1892", "lug": "", "mapa": null, "sinacta": "NUEVO EN AGOSTO DE 2026, y es el primer Faienza de una generación anterior a Nicola que aparece escrito en un documento. Sale del acta de matrimonio de su hijo (Atessa, 29 de diciembre de 1892, acta 101, transcrita en la ficha del matrimonio): «NICOLA FAIENZA… figlio di GIUSEPPE, contadino, residente in Atessa».\n\nQUE ESTABA VIVO NO ES UNA DEDUCCIÓN DEL FORMULARIO, ES UN HECHO DEL ACTA. Nicola tenía veintitrés años y el Código Civil exigía consentimiento paterno por debajo de los veinticinco; el acta anota que «ha prestato il consenso il padre dello sposo, come risulta ed è spiegato dall'atto di richiesta delle pubblicazioni». Alguien fue a declararlo ante el oficial en diciembre de 1892.\n\nLO QUE NO SE SABE: cuándo nació, de quién era hijo y cuándo murió. Su matrimonio con Maria Staniscia sería de hacia 1865 y estaría en los Matrimoni de Atessa; su defunción, en los Morti de Atessa posteriores a 1892. Conviene tener presente que en Atessa hay varias familias Faienza a la vez —en los nacimientos de 1899 aparecen tres distintas, la de Michele fu Carmine y las de Antonio y Vincenzo di Pasquale—, así que el apellido solo no basta: hará falta el nombre del padre en cada acta.", "padre": null, "madre": null, "conyuge": "maria_staniscia", "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_staniscia": {"id": "maria_staniscia", "nombre": "Maria Staniscia", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 6, "ramas": ["faienza"], "resumen": "Madre de Nicola Faienza, de Atessa. Nacida hacia 1845. Ya había muerto cuando su hijo se casó, en diciembre de 1892.", "datos": [["Nacimiento", "hacia 1845, presumiblemente Atessa"], ["Residencia", "ATESSA — «residente IN VITA in Atessa», la fórmula que el impreso reserva a los padres muertos"], ["Cónyuge", "Giuseppe Faienza, contadino de Atessa"], ["Hijo", "Nicola Faienza (hacia 1869)"], ["Defunción", "sin localizar — anterior a diciembre de 1892"], ["De dónde sale", "acta de matrimonio de su hijo: Atessa, Matrimoni 1892, acta 101"]], "vida": "c.1845–1892", "lug": "", "mapa": null, "sinacta": "NUEVA EN AGOSTO DE 2026. El acta de matrimonio de su hijo Nicola (Atessa, 29 de diciembre de 1892, acta 101) dice «e della FU MARIA STANISCIA, residente in vita in Atessa». El «fu» y el «in vita» dicen lo mismo dos veces: en diciembre de 1892 ya estaba muerta, y mientras vivió vivió en Atessa.\n\nEs la tercera madre seguida que las actas de Atessa se molestan en nombrar —después de Santa Menna en 1841, Rosa Iacobitti en 1847 y Antonia di Iorio en 1891—, frente a los cuatro formularios gemelos de Rende que dejaron el hueco en blanco cuatro veces. STANISCIA es apellido corriente en Atessa: el índice de matrimonios de 1892 trae varios, y en los nacimientos de 1899 vuelve a salir.\n\nSu defunción tendría que estar en los Morti de Atessa anteriores a 1892.", "padre": null, "madre": null, "conyuge": "giuseppe_faienza", "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe": {"id": "giuseppe", "nombre": "Giuseppe Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "El primer hijo. Nacido en Rende en 1895; tenía 24 años en 1919.", "datos": [["Nacimiento", "23 de febrero de 1895, 10 h, Rende — acta 43"], ["Lugar", "contrada Saporito"], ["Padres", "Salerno Francesco y Chiappetta Filomena"]], "vida": "n.1895", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "24 de febrero de 1895, 10 h", "lugar": "Rende", "ref": "acta 43", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Nati»"], ["Aviso", "catalogado 1894, pero contiene actas de 1895"], ["Registro", "an_ua35983864 · hash 03Ar6ql"], ["Página", "28 de 98"], ["Oficial", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, agricoltore… Chiappetta Filomena, donna di casa, sua moglie…", "traduccion": "El año mil ochocientos noventa y cinco, el día veinticuatro de febrero, a las diez de la mañana, en la casa comunal, ante Spina Raffaele, secretario delegado por acta del alcalde de dieciséis de diciembre de mil ochocientos noventa y cuatro, ha comparecido SALERNO FRANCESCO, agricultor, domiciliado en Rende.\n\nDeclara que de CHIAPPETTA FILOMENA, mujer de su casa, su esposa conviviente con él, ha nacido el día veintitrés del corriente, a las diez de la mañana, en la casa sita en contrada Saporito, un niño, al que impone el nombre de GIUSEPPE.\n\nTestigos: Zicarelli Carmine, de veintiocho años, bracero; y Marchese Vincenzo, de sesenta años, agricultor.", "notas": ["La edad declarada del padre (30) es errónea: Francesco había nacido el 7 de diciembre de 1870, luego tenía 24. Las edades declaradas en estos registros son aproximadas.", "El bloque de texto de arriba a la derecha de esa misma página —un acuerdo de ama de cría con Bruno Maria— NO pertenece a esta acta, sino a la 42."], "imgs": [{"u": "actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20Giuseppe%20Salerno%20-%20Rende%20acta%2043.jpg", "t": "Giuseppe Salerno - Rende acta 43"}], "zooms": [{"u": "actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20nombre%20impuesto%20y%20testigos.jpg", "t": "Nombre impuesto y testigos"}, {"u": "actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "El primero de nueve", "parrafos": ["Nació el 23 de febrero de 1895 a las diez de la mañana, en la contrada Saporito de Rende. Su padre lo inscribió al día siguiente, a la misma hora, ante Spina Raffaele, secretario delegado por el alcalde. Los testigos fueron Zicarelli Carmine, jornalero de veintiocho años, y Marchese Vincenzo, agricultor de sesenta.", "En esa acta Francesco declaró treinta años. Tenía veinticuatro. Es la primera de una serie de edades mal declaradas que ha obligado a comprobar cada acta de esta familia por el nombre de la madre y el número de orden, y nunca por la edad del padre.", "Es el primer hijo de Francesco y Filomena, nacido once meses después de la boda. En 1919 tenía veinticuatro años y fue de los que cruzaron a Argentina — aunque el año del viaje sigue sin cerrarse: Italia no permitió emigrar a los varones en edad militar hasta después de la guerra, y la emigración a Argentina no se reanuda hasta marzo de 1920."], "claves": [["Nacimiento", "23 de febrero de 1895, 10 h, contrada Saporito, Rende"], ["Lugar entre los hermanos", "el mayor de los nueve"], ["Edad declarada del padre", "30 años, cuando tenía 24"], ["En 1919", "24 años; emigró"]]}, "antonio": {"id": "antonio", "nombre": "Antonio Salerno", "legal": "ANTHONY SALERNO en Estados Unidos", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "El hermano que se fue a Chicago. Segundo hijo de Francesco y Filomena, nacido en Rende en 1896; embarcó en Nápoles con diecisiete años y desembarcó en Nueva York el 16 de abril de 1914. Murió en Illinois en 1981, a los ochenta y cuatro, después de sesenta y siete años en el mismo pueblo y treinta y tantos en la misma fábrica de pienso. Es el hermano de Settimo del que más se sabe, y con diferencia.", "datos": [["Nacimiento", "13 de junio de 1896, Rende — acta 117, contrada S. Agostino"], ["Padres", "Salerno Francesco (25 años) y Chiappetta Filomena"], ["Emigración", "salió de NÁPOLES hacia el 8 de abril de 1914 y llegó a NUEVA YORK el 16 de abril de 1914, en el vapor BERLIN. Tenía diecisiete años"], ["En Illinois desde", "21 de octubre de 1914"], ["Matrimonio", "19 de mayo de 1920, con ROSINA SALERNO — también Salerno de apellido, también de la provincia de Cosenza"], ["Hijos", "DOMENICO, nacido el 11 de febrero de 1922, y FILOMENA, el 8 de febrero de 1925, los dos en Riverdale, Illinois"], ["Nacionalizado", "25 de enero de 1929, U.S. District Court, Chicago — petición n.º 19857, presentada el 10 de julio de 1925; declaración de intención n.º 22117"], ["Domicilio", "13832 y luego 13838 South Emerald Avenue, RIVERDALE, condado de Cook, Illinois. Vivió allí toda su vida americana"], ["Oficio", "LABORER (peón) en la HALES AND HUNTER FEED COMPANY, en la esquina de la calle 140 con Halsted, Riverdale. En el censo de 1950 seguía allí, 40 horas semanales"], ["Cómo era", "en febrero de 1942, con 44 años: 5 pies 4 pulgadas —1,63 m—, 145 libras —66 kg—, OJOS MARRONES, PELO NEGRO, TEZ OSCURA, sin señas particulares"], ["Defunción", "martes 5 de mayo de 1981, en el Ingalls Memorial Hospital de Harvey, Illinois. Funeral el viernes 8 en la iglesia de St. Mary de Riverdale"], ["Enterrado", "CEMENTERIO DE ST. BENEDICT, Chicago"], ["Dejó", "su mujer Rose, su hijo Dominic, un hermano Vincenzo de Riverdale, dos nietos y cinco bisnietos"]], "vida": "1896–1981", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "rosina_salerno", "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": ["giuseppe", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Esquela en el periódico", "tipo": "D", "tipoNombre": "Defunción", "fecha": "martes 5 de mayo de 1981", "lugar": "Riverdale, Illinois", "ref": "«The Star», 10 de mayo de 1981", "fuente": [["Publicación", "«The Star», Illinois, 10 de mayo de 1981"], ["Vía", "FamilySearch — Hammond, Lake, Indiana, imagen 3285 de 3302, grupo de imágenes 007596074"]], "literal": "ANTONIO SALERNO. Services were Friday for Antonio Salerno of Riverdale. Mr. Salerno died Tuesday at Ingalls Memorial hospital, Harvey. The funeral mass was at St. Mary's church, Riverdale. Burial was at St. Benedict's cemetery, Chicago. A former laborer at the Hales and Hunter Feed company in Riverdale, Mr. Salerno was born June 13, 1896, in Italy. He is survived by his wife, Rose; a son, Dominic of Riverdale; a brothr, Vincenzo of Riverdale; two grandchildren, and five great-grandchildren.", "traduccion": "ANTONIO SALERNO. El funeral por Antonio Salerno, de Riverdale, se celebró el viernes. El señor Salerno murió el martes en el hospital Ingalls Memorial de Harvey. La misa fue en la iglesia de St. Mary de Riverdale. Fue enterrado en el cementerio de St. Benedict, en Chicago.\n\nAntiguo peón de la Hales and Hunter Feed Company de Riverdale, el señor Salerno había nacido el 13 DE JUNIO DE 1896 EN ITALIA.\n\nLe sobreviven su mujer, Rose; un hijo, Dominic, de Riverdale; un hermano, Vincenzo, de Riverdale; dos nietos y cinco bisnietos.", "notas": ["*** ESTA ESQUELA CIERRA LA IDENTIFICACIÓN. *** Da «13 de junio de 1896», que es EXACTAMENTE la fecha de su acta de nacimiento de Rende. Sus papeles americanos —la naturalización de 1925 y la ficha de reclutamiento de 1942— decían 1897; el periódico acierta donde los formularios fallaban. No hay ninguna duda de que es el hermano de Settimo.", "MURIÓ UN MARTES: el 10 de mayo de 1981 fue domingo, el funeral fue el viernes 8, así que la muerte cae el MARTES 5 DE MAYO DE 1981. Tenía ochenta y cuatro años.", "«A BROTHR, VINCENZO OF RIVERDALE». Es la línea más intrigante de todo el documento y está sin resolver — ver el cabo abierto que lleva su nombre.", "SESENTA Y SIETE AÑOS EN EL MISMO SITIO. Llegó a Riverdale con diecisiete años y allí murió con ochenta y cuatro. La fábrica donde trabajó, la Hales and Hunter, estaba a seis manzanas de su casa."], "imgs": [{"u": "actas/1896%20-%20Antonio%20Salerno/1981-05-10%20D%20Esquela%20de%20Antonio%20Salerno%20-%20The%20Star%2C%20Illinois.jpg", "t": "Esquela de Antonio Salerno - The Star, Illinois"}], "zooms": []}, {"titulo": "Petición de naturalización", "tipo": "C", "tipoNombre": "Certificado", "fecha": "presentada el 10 de julio de 1925; concedida el 25 de enero de 1929", "lugar": "U.S. District Court, Chicago", "ref": "petición n.º 19857", "fuente": [["Archivo", "United States District Court, Northern District of Illinois"], ["Vía", "FamilySearch — imagen 632 de 1246, grupo 007789231"], ["Declaración de intención", "n.º 22117, agosto de 1921"]], "literal": "ANTONIO SALERNO. My place of residence is 13832 So. Emerald Ave., Riverdale, Illinois. My occupation is laborer. I was born on the 13th day of June, anno Domini 1897, at Cosenza, Italy. I emigrated to the United States from Naples, Italy, on or about the 8th day of April anno Domini 1914, and arrived at the United States, at the port of New York, on the 16th day of April anno Domini 1914, on the vessel BERLIN. […] My wife's name is Rosina. She was born in Italy and now resides with me. I have 2 children: Domenico born Feb. 11, 1922; Filomena, Feb. 8, 1925, both born at Riverdale, Ill., and reside with me.", "traduccion": "Antonio Salerno, peón, con domicilio en el 13832 de South Emerald Avenue, Riverdale, Illinois, declara haber nacido el 13 de junio de 1897 en Cosenza, Italia.\n\nEMIGRÓ DESDE NÁPOLES hacia el 8 de abril de 1914 y LLEGÓ AL PUERTO DE NUEVA YORK EL 16 DE ABRIL DE 1914, A BORDO DEL VAPOR «BERLIN».\n\nReside en Illinois desde el 21 de octubre de 1914. Su mujer se llama ROSINA, nacida en Italia y residente con él. Tiene dos hijos: DOMENICO, nacido el 11 de febrero de 1922, y FILOMENA, el 8 de febrero de 1925, los dos nacidos en Riverdale.\n\nRenuncia a toda fidelidad a Víctor Manuel III, rey de Italia. Firmaron como testigos GABRIELE PRETE, peón, del 800 de South Loomis St. de Chicago, y SARFINO ARIELLO, guardagujas, del 13643 de South Halsted St. de Riverdale, que declaran conocerlo desde el 1 de noviembre de 1919.", "notas": ["*** AQUÍ ESTÁ EL BARCO. *** Después de agotar el CEMLA sin encontrar a nadie, resulta que la respuesta estaba en el otro hemisferio: Antonio no fue a Buenos Aires, fue a Nueva York, y su nombre está en la lista del vapor BERLIN que atracó el 16 de abril de 1914. La lista de pasajeros de ese viaje es un documento que ahora se puede pedir.", "SALIÓ EN 1914, NO EN 1919. Toda la reconstrucción familiar daba por hecho que los hermanos emigraron juntos después de la guerra. Antonio se fue CINCO AÑOS ANTES, y con diecisiete recién cumplidos. La familia no se dispersó de golpe: se fue deshilachando.", "Su año de nacimiento aquí es 1897, y en su acta de Rende es 1896. El día y el mes coinciden exactamente. Su esquela de 1981 dice 1896 y zanja la cuestión.", "El testigo Gabriele Prete reaparece en el censo de 1950 viviendo a dos casas. Y el otro, Sarfino Ariello, vivía en el 13643 de Halsted, la misma manzana donde el censo sitúa a los Cundari. Era un barrio entero de paisanos."], "imgs": [{"u": "actas/1896%20-%20Antonio%20Salerno/1925-07-10%20C%20Peticion%20de%20naturalizacion%20de%20Antonio%20Salerno%20-%20Chicago%20n%2019857.jpg", "t": "Peticion de naturalizacion de Antonio Salerno - Chicago n 19857"}], "zooms": []}, {"titulo": "Ficha de reclutamiento de la Segunda Guerra Mundial", "tipo": "C", "tipoNombre": "Certificado", "fecha": "16 de febrero de 1942", "lugar": "Riverdale, Illinois", "ref": "serial 798, orden 11239", "fuente": [["Archivo", "National Personnel Records Center, St. Louis, Missouri"], ["Vía", "FamilySearch — imagen 816 de 1081, grupo 104612912"], ["Junta local", "n.º 11, Harvey, condado de Cook, Illinois"]], "literal": "Antonio (None) Salerno. 13838 Emerald Ave., Riverdale, Cook, Illinois. Telephone Riverdale 188 J. Age 44. Date of birth June 13, 1897. Place of birth Cosenza, Italy. Name and address of person who will always know your address: GUS CUNDARI, 13851 S. Halsted, Riverdale, Illinois. Employer: Hales and Hunter, 140th and Halsted. — White, 5'4\", 145 lbs, eyes brown, hair black, complexion dark. Other obvious physical characteristics: None.", "traduccion": "Ficha de inscripción del llamado «registro de los mayores», el censo de varones de 45 a 64 años que Estados Unidos levantó al entrar en la guerra. Antonio Salerno, sin segundo nombre, del 13838 de Emerald Avenue, Riverdale. Teléfono: Riverdale 188 J. Cuarenta y cuatro años, nacido el 13 de junio de 1897 en Cosenza, Italia.\n\nPersona que siempre sabrá su dirección: GUS CUNDARI, del 13851 de South Halsted, Riverdale. Trabaja en Hales and Hunter, en la 140 con Halsted.\n\nDESCRIPCIÓN: blanco, CINCO PIES CUATRO PULGADAS (1,63 m), CIENTO CUARENTA Y CINCO LIBRAS (66 kg), OJOS MARRONES, PELO NEGRO, TEZ OSCURA. Ninguna otra seña particular.", "notas": ["*** ES LA ÚNICA DESCRIPCIÓN FÍSICA DE NADIE EN TODO ESTE ÁRBOL. *** De ciento treinta personas y doscientos años de papeles, éste es el único documento que dice cómo era alguien: bajo, fuerte, moreno de piel, pelo negro y ojos marrones. Su hermano Settimo sería probablemente parecido.", "GUS CUNDARI COMO CONTACTO. Cundari es el apellido de su suegra, Cherubina Cundari, y también el de Anna Cundari, la mujer con la que se casó su hermano Giovanni en Rende en 1926. Dos hermanos Salerno emparentados con Cundari, uno en Rende y otro en Illinois.", "En 1942 seguía en la misma fábrica y en la misma calle que en 1925. Sólo había cambiado de número: del 13832 al 13838."], "imgs": [{"u": "actas/1896%20-%20Antonio%20Salerno/1942-02-16%20C%20Ficha%20de%20reclutamiento%20de%20Antonio%20Salerno%20-%20Riverdale%20Illinois.jpg", "t": "Ficha de reclutamiento de Antonio Salerno - Riverdale Illinois"}], "zooms": []}, {"titulo": "Censo de los Estados Unidos", "tipo": "C", "tipoNombre": "Certificado", "fecha": "abril de 1950", "lugar": "Riverdale, condado de Cook, Illinois", "ref": "hoja 3, vivienda 21 — 13838 Emerald Ave.", "fuente": [["Archivo", "National Archives and Records Administration"], ["Vía", "FamilySearch — imagen 4 de 39, grupo 108925561"]], "literal": "SALERNO, Anthony — Head, W, M, 53, Mar., born Italy, naturalized. 40 hrs. Laborer, Feed Mill. / Rose — Wife, W, F, 43, Mar., born Italy, naturalized. / Dominick D. — Son, W, M, 27, Mar. 36 hrs. Switchman, Railroad Co. / Mary L. — Daughter-in-law, W, F, 21, Mar. / Beverlee — Granddaughter, W, F, 2, Sin.", "traduccion": "En abril de 1950 la casa del 13838 de Emerald Avenue tenía dentro tres generaciones:\n\nANTHONY SALERNO, cabeza de familia, 53 años, casado, nacido en Italia, naturalizado. Cuarenta horas semanales de peón en un molino de pienso.\nROSE, su mujer, 43 años, nacida en Italia, naturalizada.\nDOMINICK D., el hijo, 27 años, casado, GUARDAGUJAS DE LA COMPAÑÍA DE FERROCARRIL, 36 horas.\nMARY L., su nuera, 21 años.\nBEVERLEE, la nieta, 2 años.\n\nDos casas más allá, en la misma hoja del censo, vivía CONSTANTINO CUNDARI, de 62 años, nacido en Italia, capataz de la compañía de ferrocarril, con su mujer ANGELINA, de 57.", "notas": ["TRES GENERACIONES BAJO EL MISMO TECHO, y una cuarta a dos puertas: los Cundari, la familia de su suegra. La calle Emerald de Riverdale era una aldea calabresa trasplantada.", "Su hija Filomena, de veinticinco años en 1950, ya no vive en casa: se habría casado.", "El hijo entró en el ferrocarril, no en la fábrica de pienso. La generación siguiente salió del trabajo del padre."], "imgs": [{"u": "actas/1896%20-%20Antonio%20Salerno/1950-04-15%20C%20Censo%20de%20Estados%20Unidos%20-%20Riverdale%20Cook%20Illinois.jpg", "t": "Censo de Estados Unidos - Riverdale Cook Illinois"}], "zooms": []}, {"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "14 de junio de 1896, 7 h", "lugar": "Rende", "ref": "acta 117", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 87 «Nati»"], ["Aviso", "catalogado 1895, pero contiene actas de 1896"], ["Registro", "an_ua35983865 · hash 57okQgj"], ["Página", "55 de 89"], ["Oficial", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, di anni venticinque, agricoltore…", "traduccion": "El año mil ochocientos noventa y seis, el día catorce de junio, a las siete de la mañana, en la casa comunal, ante Spina Raffaele, secretario delegado por acta del alcalde de uno de diciembre de mil ochocientos noventa y cinco, ha comparecido SALERNO FRANCESCO, de veinticinco años, agricultor, domiciliado en Rende.\n\nDeclara que de CHIAPPETTA FILOMENA, mujer de su casa, su esposa conviviente con él, ha nacido el día trece del corriente, en la casa sita en contrada S. Agostino, un niño, al que impone el nombre de ANTONIO.\n\nTestigos: Greco Pasquale, agricultor; y Serpe Serafino, agricultor.", "notas": ["Es el acta que permitió detectar el desfase del catálogo de Antenati. El año manuscrito dice «novantasei» con toda claridad, y la edad del padre (25) cuadra exactamente con su nacimiento en diciembre de 1870.", "La familia se ha mudado de contrada Saporito a contrada S. Agostino, donde seguirá en 1900."], "imgs": [{"u": "actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20Antonio%20Salerno%20-%20Rende%20acta%20117.jpg", "t": "Antonio Salerno - Rende acta 117"}], "zooms": [{"u": "actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 5, "nImgs": 7, "titulo": "El acta que delató el catálogo", "parrafos": ["Nació el 13 de junio de 1896 en la contrada S. Agostino de Rende y fue inscrito al día siguiente a las siete de la mañana. Su padre declaró veinticinco años, y esta vez la cifra era exacta. Los testigos, dos agricultores del pueblo: Greco Pasquale y Serpe Serafino.", "Esa exactitud resolvió un problema serio. El registro donde está su acta, el 87 de Rende, figura en el catálogo del archivo como «Nati 1895», pero el año manuscrito de la cabecera dice «novantasei» con toda claridad y la edad del padre encaja con 1896. De ahí se descubrió que la datación del catálogo no es fiable y que los volúmenes de nacimientos de Rende no van uno por año: parten años en dos. Desde entonces hay una regla en esta investigación — leer el año escrito a mano antes de dar un acta por buena.", "La familia se había mudado de Saporito, donde había nacido Giuseppe, a S. Agostino, la contrada donde volverá a vivir a partir de 1904.", "La memoria familiar lo sitúa en Chicago, junto a un Vincenzo. No hay todavía ningún documento que lo respalde: es una pista, no un hecho."], "claves": [["Nacimiento", "13 de junio de 1896, contrada S. Agostino, Rende, acta 117"], ["Lo que probó su acta", "que el catálogo del archivo databa mal el registro"], ["Edad declarada del padre", "25 años — correcta"], ["En 1919", "23 años; emigró"]]}, "umberto": {"id": "umberto", "nombre": "Umberto Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "Tercer hijo, nacido en Rende en 1897. Tenía 22 años en 1919.", "datos": [["Nacimiento", "22 de noviembre de 1897, 6 de la mañana, Rende — acta 240"], ["Lugar", "contrada Saporito"], ["Padres", "Salerno Francesco y Chiappetta Filomena"]], "vida": "n.1897", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "22 de noviembre de 1897, 10:10 h", "lugar": "Rende", "ref": "acta 240", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Nati» 1897"], ["Registro", "an_ua35983867 · hash wlpK8pB"], ["Página", "85 de 101"], ["Oficial", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, contadino… di anni ventiquattro…", "traduccion": "El año mil ochocientos noventa y siete, el día veintidós de noviembre, a las diez y diez de la mañana, en la casa comunal, ante Spina Raffaele, secretario delegado por acta del alcalde de dieciséis de diciembre de mil ochocientos noventa y seis, debidamente aprobada, ha comparecido SALERNO FRANCESCO, campesino, domiciliado en Rende.\n\nDeclara que de CHIAPPETTA FILOMENA, campesina, su esposa conviviente con él, ha nacido el día veintidós del corriente mes, a las seis de la mañana, en la casa sita en contrada Saporito, un niño de sexo masculino, al que impone el nombre de UMBERTO.\n\nTestigos: Spizzirri Giovanni, de cuarenta y nueve años, agricultor; y Picarelli Vincenzo, de sesenta y ocho años, agricultor, ambos residentes en el municipio. Analfabetos: no firman; firma sólo el oficial.", "notas": ["La edad declarada del padre está escrita con tinta muy pálida. La lectura más probable es «ventiquattro» (24), pero Francesco tenía 26 en noviembre de 1897. Otra edad declarada errónea.", "La familia ha vuelto a contrada Saporito, donde ya estaba en 1895. En 1896 estaba en S. Agostino y en 1899 estará en Campagnano. Se mudaban mucho.", "Para localizar esta acta hubo que descubrir que el digitalizador refotografía la misma apertura dos veces cuando lleva un papel suelto encima. Aquí se ha guardado la toma limpia."], "imgs": [{"u": "actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20Umberto%20Salerno%20-%20Rende%20acta%20240.jpg", "t": "Umberto Salerno - Rende acta 240"}], "zooms": [{"u": "actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20acta%20240%20completa.jpg", "t": "Acta 240 completa"}, {"u": "actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20cabecera%2C%20padre%20Francesco%20y%20contrada%20Saporito.jpg", "t": "Cabecera, padre Francesco y contrada Saporito"}, {"u": "actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 4, "titulo": "Inscrito el mismo día", "parrafos": ["Nació el 22 de noviembre de 1897 a las seis de la mañana, en la contrada Saporito. A las diez y diez de esa misma mañana su padre ya estaba en la casa comunal declarándolo: cuatro horas y diez minutos entre el parto y el registro.", "La edad que declaró Francesco está escrita con tinta muy pálida; la lectura más probable es veinticuatro, y tenía veintiséis. Los testigos fueron dos agricultores del pueblo, Spizzirri Giovanni de cuarenta y nueve años y Picarelli Vincenzo de sesenta y ocho. No firmó nadie salvo el secretario, Spina Raffaele.", "Su acta costó encontrarla más que ninguna. El registro de 1897 tiene páginas refotografiadas: cuando el volumen lleva encima un papel suelto —anotaciones de defunción que otros ayuntamientos mandaban décadas después—, el digitalizador hace dos tomas de la misma apertura. La página 86 lleva un papel que tapa media plana; la 85 es la limpia, y es la que se guardó.", "Con Umberto la familia había vuelto a la contrada Saporito, donde ya estaba en 1895. En 1919 tenía veintidós años y fue uno de los que se marcharon."], "claves": [["Nacimiento", "22 de noviembre de 1897, 6 de la mañana, contrada Saporito, Rende"], ["Registrado", "el mismo día, cuatro horas después"], ["Edad declarada del padre", "24 años, cuando tenía 26"], ["En 1919", "22 años; emigró"]]}, "settimo": {"id": "settimo", "nombre": "Settimo Salerno", "legal": "Settimo — no «Settino»", "rol": "directa", "rolNombre": "Línea directa", "gen": 8, "ramas": ["salerno"], "resumen": "El bisabuelo que Gonzalo llegó a conocer. Gemelo, el primero en nacer, a las cuatro y media de la madrugada del 24 de octubre de 1899 en Rende. Cruzó el Atlántico, se casó en Santa Fe a los veintitrés y tuvo que pelearse veintisiete años con el Registro Civil argentino para que le escribieran bien su propio nombre.", "datos": [["Nacimiento", "24 de octubre de 1899, a las 4:30 de la madrugada, Rende — acta 231"], ["Lugar", "contrada Campagnano"], ["Gemelo de", "SAVERIO, nacido veinticinco minutos después"], ["Orden", "«il primo nato» — el primero en nacer"], ["Su nombre", "SETTIMO, «el séptimo». No es un capricho: venía de una fila larga de hermanos"], ["Padres", "SALERNO FRANCESCO, de 28 años en 1899, y CHIAPPETTA FILOMENA. En 1923 seguían viviendo en RENDE: no emigraron con él"], ["Emigración", "sin fecha, sin barco y sin lista de desembarco. Lo único seguro es que en marzo de 1923 ya estaba en Santa Fe"], ["Oficio documentado", "PANADERO — así consta en su acta de matrimonio de 1923, a los veintitrés años"], ["Oficio por memoria familiar", "COLCHONERO. Lo cuenta la familia y NO está documentado: el único papel que da un oficio dice panadero. Las dos cosas caben en una vida larga, pero no hay que mezclarlas"], ["Matrimonio", "26 de marzo de 1923, ciudad de Santa Fe, acta 140, con CRISTINA RIZZO, argentina, hija de Salvador Rizzo y Ángela Costabile"], ["Dónde vivían los Salerno", "en CALLE FRANCIA, Santa Fe capital, todos los hermanos juntos, según la memoria familiar. Sin documentar"], ["Muerte", "entre 1977 y 1980, según la familia. *** El árbol dice 1975 y esa fecha está mal: *** Gonzalo nació en septiembre de 1977 y llegó a conocerlo — hay una foto de los dos"]], "vida": "1899–c.1977/80", "lug": "Rende", "mapa": null, "sinacta": "*** LA HISTORIA DE SU NOMBRE, QUE ES LA SUYA. *** Se llamaba SETTIMO, «el séptimo». Su acta de nacimiento de Rende lo dice con todas las letras y dos veces: en el cuerpo —«il nome di Settimo, e ch'è gemello»— y en el epígrafe del margen, «Salerno Settimo».\n\n*** Y A PARTIR DE AHÍ NADIE VOLVIÓ A ESCRIBÍRSELO BIEN. *** El índice del propio registro italiano lo transcribe **SETTINO**, con ene — y por culpa de ese índice entró en este árbol con el nombre equivocado, hasta que se abrió el acta original. En Argentina fue peor: en su acta de matrimonio de 1923 quedó mal escrito, él mismo firmó **«Settimio»**, y cuando murió su mujer, en 1967, el oficial del Registro Civil todavía escribió **«Settino Salerno»**.\n\n*** EN 1950 FUE A ARREGLARLO. *** Al margen de su acta de matrimonio hay una nota de la Dirección General del Registro Civil, de agosto de 1950, que rectifica la partida «estableciendo que el verdadero nombre del contrayente es SETTIMO». Veintisiete años después de casarse, con unos cincuenta encima, este hombre hizo el trámite de recuperar su propio nombre. Y aun así, diecisiete años más tarde, se lo volvieron a escribir mal.\n\n*** LO QUE FALTA DE ÉL, Y ES MUCHO. *** No hay fecha de emigración, ni barco, ni acta de defunción. Llegó antes de marzo de 1923 y murió entre 1977 y 1980. Su partida de defunción, en el Registro Civil de Santa Fe, daría la fecha exacta, el domicilio y el oficio con que murió — y ahí se sabría si acabó de colchonero, como cuenta la familia, o siguió de panadero. Es de lo primero que hay que pedir.\n\nRelacionado: [[cristina_rizzo]], [[carlos_salerno]].", "padre": "francesco", "madre": "filomena", "conyuge": "cristina_rizzo", "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": ["giuseppe", "antonio", "umberto", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Acta de matrimonio con Cristina Rizzo", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "26 de marzo de 1923", "lugar": "ciudad de Santa Fe, Argentina", "ref": "acta 140", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verificación", "trámite 26-00-284-316 · hash D436-F555-6EF1-EE25-20B7-FA23-3C5D-8A13-78B9-EA89"]], "literal": "", "traduccion": "Acta número ciento cuarenta. En la ciudad de SANTA FE, departamento La Capital, provincia de Santa Fe, el día veintiséis de marzo del año mil novecientos veintitrés. Ante mí, jefe del Registro del Estado Civil, comparecieron:\n\nDon SETTIMO SALERNO, de veintitrés años de edad, de nacionalidad ITALIANA, NACIDO EN RENDE, domiciliado en esta ciudad, de profesión PANADERO; hijo de don FRANCISCO SALERNO, de cuarenta años, italiano, DOMICILIADO EN RENDE, ITALIA, agricultor, y de doña FILOMENA CHIAPPETTA, de cincuenta años, italiana, domiciliada en Rende;\n\ny doña CRISTINA RIZZO, de veintitrés años de edad, de nacionalidad ARGENTINA; hija de don SALVADOR RIZZO y de doña ÁNGELA COSTABILE, italiana, domiciliada en esta ciudad.\n\nAmbos comparecientes manifestaron que era su voluntad casarse, tomándose recíprocamente por marido y mujer... declaro que don SETTIMO SALERNO y doña CRISTINA RIZZO quedan unidos en legítimo matrimonio.", "notas": ["*** CONFIRMA A SUS PADRES POR VÍA ARGENTINA. *** El acta italiana de 1899 daba «Salerno Francesco, de 28 años, y Chiappetta Filomena». Ésta, veinticuatro años después y en otro continente, da los mismos dos nombres — y añade que en 1923 SEGUÍAN VIVIENDO EN RENDE. No emigraron con el hijo.", "*** Y DA POR FIN LOS PADRES DE LA NOVIA: SALVADOR RIZZO y ÁNGELA COSTABILE. *** Hasta este día los Rizzo eran una sola persona suelta en todo el árbol.", "ERA PANADERO. A los veintitrés años, recién llegado de Rende.", "OJO CON LA EDAD DEL PADRE: el acta le pone cuarenta años, pero el acta de nacimiento de 1899 le daba veintiocho, o sea que en 1923 tendría cincuenta y dos. Doce años de error — normal, porque el padre estaba en Italia y la edad la dio el hijo de memoria.", "*** UNA NOTA AL MARGEN DE 1950 RECTIFICA SU PROPIO NOMBRE. *** La Dirección General del Registro Civil hizo constar, veintisiete años después, «que el verdadero nombre del contrayente es SETTIMO». En su acta de boda estaba mal escrito."], "imgs": [{"u": "actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%201.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 1"}, {"u": "actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%202.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 2"}], "zooms": []}, {"titulo": "Los cuatro hermanos en Argentina", "tipo": "F", "tipoNombre": "Acta", "fecha": "hacia 1925-1930", "lugar": "Argentina — estudio fotográfico", "ref": "fotografía de familia", "fuente": [["Procedencia", "álbum familiar, rama argentina"], ["Soporte", "copia de estudio, telón pintado con palmera"]], "literal": "", "traduccion": "Cuatro hombres jóvenes posando en un estudio fotográfico, delante de un telón pintado con una palmera y un paisaje. Dos de pie, con traje oscuro; dos sentados en un banco, con traje claro de verano y el sombrero sobre la rodilla — un canotier de paja con cinta oscura el de la izquierda, un fieltro de ala blanda el de la derecha. Todos con camisa blanca de cuello duro y corbata oscura ancha.\n\nLa familia la identifica como los CUATRO HERMANOS SALERNO recién llegados a Argentina. Con seguridad están SETTIMO y SAVERIO; de los otros dos no hay certeza.", "notas": ["*** LA FOTO CORRIGE LA FECHA DE LA EMIGRACIÓN. *** La familia siempre dijo que llegaron «en 1919, después de la guerra». La ropa dice otra cosa: el canotier de paja y los pantalones de raya ancha con cintura alta son de mediados de los años veinte para adelante. Y ninguno de los cuatro aparenta menos de veinte largos: si ARTURO, nacido en 1907, es uno de ellos, en 1919 tendría DOCE AÑOS, y ahí no hay ningún chico de doce. Conclusión: o Arturo no está en la foto, o LLEGARON HACIA 1925-1930, no en 1919.\n\nY lo segundo encaja con todo lo demás: Antonio se fue solo en 1914, Giovanni seguía en Rende casándose en 1926. La familia no se rompió de golpe en 1919 — se fue deshilachando a lo largo de quince años. La fecha de 1919 es memoria, y la memoria ya falló una vez con Antonio.", "*** LOS DOS SENTADOS PODRÍAN SER LOS MELLIZOS. *** Es una hipótesis de mirada, no un dato: son los dos que visten igual —traje claro de verano—, están sentados en posición simétrica, los dos con el sombrero sobre la rodilla, y tienen la cara más parecida entre sí que ninguno de los otros dos pares. Settimo y Saverio nacieron el mismo día de 1899 con veinticinco minutos de diferencia. Nadie que lo sepa puede mirar esa foto sin pensarlo.", "QUIÉNES PUEDEN SER LOS CUATRO, por eliminación documental. De los siete hijos varones, ANTONIO se fue a Chicago en 1914 y allí murió en 1981; GIOVANNI se quedó en Rende y se casó allí en 1926. Quedan cinco candidatos para cuatro sillas: GIUSEPPE (1895), UMBERTO (1897), SETTIMO (1899), SAVERIO (1899) y ARTURO (1907).", "Y AQUÍ HAY ALGO QUE MERECE PENSARSE. La familia recuerda a los que vinieron como «Saverio, Settimo, y creería que Raffaele y Angelo». Pero Raffaele y Angelo no aparecen en ninguna partida, y en cambio UMBERTO y ARTURO sí existen y su destino está completamente en blanco. En esta genealogía ya ha pasado dos veces que una persona viviera con un nombre distinto del registrado: SETTIMO se hacía llamar Setimio en Argentina, y AQUILA figura como Rosalia en su propia acta de matrimonio. No sería extraño que los hombres que la familia recuerda como Raffaele y Angelo sean Umberto y Arturo.", "Un dato para no confundirse: ANGELINA, la hermana nacida en 1902, MURIÓ EN RENDE EL 29 DE AGOSTO DE 1910, con ocho años. No pudo emigrar. Si la memoria familiar recuerda un «Angelo», o es otra persona o es ella mal recordada.", "Lo que la foto sí prueba, sin discusión: LLEGARON JUNTOS Y SE HICIERON UN RETRATO. Cuatro hermanos de un pueblo de Calabria, con el traje bueno y el sombrero en la mano, posando delante de una palmera pintada el día que empezaron otra vida. Es la única imagen de esta familia anterior a la generación de los abuelos."], "imgs": [{"u": "actas/1899%20-%20Settimo%20Salerno/1920s%20F%20Los%20cuatro%20hermanos%20Salerno%20recien%20llegados%20a%20Argentina.jpg", "t": "1920s F Los cuatro hermanos Salerno recien llegados a Argentina"}], "zooms": []}, {"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "28 de octubre de 1899, 10:40 h", "lugar": "Rende", "ref": "acta 231", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Año manuscrito", "«milleottocento novantanove» — coincide con el catálogo"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "86 de 115"], ["Oficial", "Pisani Domenico, asesor decano"]], "literal": "…a cui dà il nome di Settimo, e ch'è gemello un altro mi conserva l'atto seguente.\n\nIl dichiarante ha inoltre attestato che il bambino suddetto è il primo nato.", "traduccion": "El año mil ochocientos noventa y nueve, el día veintiocho de octubre, a las diez y cuarenta de la mañana, en la casa comunal, ante Pisani Domenico, asesor decano por el alcalde impedido, ha comparecido SALERNO FRANCESCO, de veintiocho años, campesino, domiciliado en Rende.\n\nDeclara que de CHIAPPETTA FILOMENA, campesina, su esposa conviviente con él, ha nacido el día veinticuatro del corriente mes, a las cuatro y media de la mañana, en la casa sita en contrada Campagnano, un niño de sexo masculino, al que da el nombre de SETTIMO, y que es gemelo de otro que consta en el acta siguiente.\n\nTestigos: Perri Pietro, de sesenta y un años, campesino; y Spizzirri Giovanni, de cuarenta y seis años, campesino, ambos residentes en el municipio.\n\nEl declarante ha atestiguado además que el niño susodicho es EL PRIMERO EN NACER.", "notas": ["EL NOMBRE NO ES «SETTINO» SINO SETTIMO. El índice del que se partía lo transcribe mal. El acta original lo dice con claridad tanto en el cuerpo como en el epígrafe del margen.", "La edad del padre (28) es CORRECTA, nacido en diciembre de 1870. Es de las pocas veces que Francesco declara bien su edad.", "«Settimo» significa séptimo, pero por el índice es el cuarto hijo documentado. O el nombre es sólo un nombre, o hubo hermanos antes de 1899 que no constan. No es prueba de nada, pero apunta hacia los catorce hijos de la memoria familiar."], "imgs": [{"u": "actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20Settimo%20Salerno%20-%20Rende%20acta%20231.jpg", "t": "Settimo Salerno - Rende acta 231"}], "zooms": [{"u": "actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20completa.jpg", "t": "Acta 231 completa"}, {"u": "actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20entera%20y%20margen%20sin%20anotaciones.jpg", "t": "Acta 231 entera y margen sin anotaciones"}, {"u": "actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20nombre%20Settimo%20y%20mencion%20del%20gemelo.jpg", "t": "Nombre Settimo y mencion del gemelo"}]}], "nActas": 3, "nImgs": 7, "titulo": "Veinticinco minutos mayor", "parrafos": ["Nació el 24 de octubre de 1899 a las cuatro y media de la madrugada, en la contrada Campagnano de Rende. Su hermano Saverio nació veinticinco minutos después. Cuatro días más tarde, el 28 de octubre a las diez y cuarenta de la mañana, su padre los inscribió en dos actas seguidas, con los mismos dos testigos y cinco minutos de diferencia entre una y otra.", "Que eran gemelos no es una deducción por la cercanía de los números: lo dicen las dos actas por escrito y se remiten la una a la otra. La suya dice «e ch'è gemello un altro mi conserva l'atto seguente»; la de Saverio, «l'atto precedente». Y la suya añade una línea que nadie estaba obligado a escribir: «Il dichiarante ha inoltre attestato che il bambino suddetto è IL PRIMO NATO». El orden de nacimiento lo aportó el propio padre, no una comadrona.", "El índice del que partió esta investigación lo llama «Settino». El acta original dice SETTIMO, con toda claridad, tanto en el cuerpo como en el epígrafe del margen. Settimo es el nombre italiano corriente para un séptimo hijo; por los papeles es el cuarto documentado. O el nombre es sólo un nombre, o hubo hermanos anteriores que no constan. No prueba nada, pero apunta hacia los catorce hijos de la memoria familiar.", "Es de la clase del 99, los ragazzi del '99, la leva que Italia llamó a filas en 1917 con dieciocho años recién cumplidos; la familia conserva sus medallas de la Primera Guerra Mundial. Acabó en Santa Fe, Argentina, donde se hacía llamar Setimio. Su mujer, Cristina Rizzo, murió allí en noviembre de 1967, y él entre 1977 y 1980, con setenta y ocho u ochenta y un años. No aparece en el índice de llegadas al puerto de Buenos Aires con ninguna grafía de su nombre."], "claves": [["Nacimiento", "24 de octubre de 1899, 4:30 de la madrugada, contrada Campagnano"], ["Gemelo", "de Saverio, veinticinco minutos menor"], ["El acta dice", "«il primo nato», el primero en nacer"], ["Su nombre", "Settimo — el índice lo llama Settino y se equivoca"], ["Después", "clase de 1899, guerra; y Santa Fe, Argentina, como Setimio"]]}, "saverio": {"id": "saverio", "nombre": "Saverio Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "Gemelo de Settimo, el segundo en nacer, veinticinco minutos después. Tenía 20 años en 1919.", "datos": [["Nacimiento", "24 de octubre de 1899, 4:55 de la madrugada, Rende — acta 232"], ["Lugar", "contrada Campagnano"], ["Gemelo de", "Settimo"], ["Orden", "«il secondo nato» — el segundo en nacer"], ["Padres", "Salerno Francesco (28 años) y Chiappetta Filomena"]], "vida": "n.1899", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "28 de octubre de 1899, 10:45 h", "lugar": "Rende", "ref": "acta 232", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "87 de 115"], ["Detalle", "redactada cinco minutos después del acta 231"]], "literal": "…a cui dà il nome di Saverio, e ch'è gemello un altro mi conserva l'atto precedente.\n\nIl dichiarante ha inoltre attestato che il bambino soddetto è il secondo nato.", "traduccion": "El año mil ochocientos noventa y nueve, el día veintiocho de octubre, a las diez y cuarenta y cinco de la mañana —cinco minutos después del acta anterior—, en la casa comunal, ante Pisani Domenico, ha comparecido SALERNO FRANCESCO, de veintiocho años, campesino.\n\nDeclara que de CHIAPPETTA FILOMENA, campesina, su esposa, ha nacido el día veinticuatro del corriente, a las cuatro y cincuenta y cinco de la mañana, en la casa sita en contrada Campagnano, un niño de sexo masculino, al que da el nombre de SAVERIO, y que es gemelo de otro que consta en el acta precedente.\n\nTestigos: los mismos dos del acta anterior.\n\nEl declarante ha atestiguado además que el niño susodicho es EL SEGUNDO EN NACER.", "notas": ["Los gemelos no son una deducción por la proximidad de los números: las dos actas lo dicen por escrito y se remiten la una a la otra.", "El dato del parto doble lo aporta el propio padre («il dichiarante ha inoltre attestato»), no la comadrona."], "imgs": [{"u": "actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20Saverio%20Salerno%20-%20Rende%20acta%20232.jpg", "t": "Saverio Salerno - Rende acta 232"}], "zooms": [{"u": "actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20232%20completa.jpg", "t": "Acta 232 completa"}, {"u": "actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 3, "titulo": "El segundo, por veinticinco minutos", "parrafos": ["Nació a las cuatro y cincuenta y cinco de la madrugada del 24 de octubre de 1899, en la misma casa de la contrada Campagnano y veinticinco minutos después que su hermano.", "Su acta se redactó a las diez y cuarenta y cinco del 28 de octubre, cinco minutos después de la de Settimo, ante el mismo oficial y con los mismos dos testigos —Perri Pietro, de sesenta y un años, y Spizzirri Giovanni, de cuarenta y seis, los dos campesinos—. Cierra con la fórmula simétrica de la otra: «il bambino soddetto è IL SECONDO NATO». Ninguno de los comparecientes firmó.", "En 1919 tenía veinte años y fue uno de los que se fueron. En el índice de llegadas a Buenos Aires no consta, igual que su gemelo."], "claves": [["Nacimiento", "24 de octubre de 1899, 4:55 de la madrugada, contrada Campagnano"], ["Gemelo", "de Settimo, veinticinco minutos mayor"], ["El acta dice", "«il secondo nato», el segundo en nacer"], ["En 1919", "20 años; emigró"]]}, "angelina": {"id": "angelina", "nombre": "Angelina Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "Nacida en contrada Campagnano el 14 de mayo de 1902 y muerta en contrada Sant'Agostino el 29 de agosto de 1910, con ocho años y tres meses. No emigró.", "datos": [["Nacimiento", "14 de mayo de 1902, 12:30, Rende — acta 55"], ["Lugar de nacimiento", "contrada Campagnano"], ["Defunción", "29 de agosto de 1910, 12 h, Rende — acta 81"], ["Lugar de defunción", "contrada Sant'Agostino"], ["Edad al morir", "ocho años y tres meses (el acta dice diez, y se equivoca)"], ["Padres", "Salerno Francesco y Chiappetta Filomena"]], "vida": "1902–1910", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "16 de mayo de 1902, 10:05 h", "lugar": "Rende", "ref": "acta 55", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 94 «Nati» 1902"], ["Registro", "an_ua35988531 · hash LNyKqBl"], ["Página", "21 de 77"], ["Año manuscrito", "«millenovecento due» — coincide con el catálogo"], ["Oficial", "Pisani Domenico, asesor por el alcalde impedido"]], "literal": "è comparso Salerno Francesco, di anni trenta, bracciante, domiciliato in Rende…\n…nella casa posta in contrada Campagnano, da Chiappetta Filomena sua moglie\ncontadina seco lui convivente… il nome di Angelina", "traduccion": "El año mil novecientos dos, el día dieciséis de mayo, a las diez y cinco de la mañana, en la casa comunal, ante Pisani Domenico, asesor por el alcalde impedido, Oficial del Estado Civil del municipio de Rende, ha comparecido SALERNO FRANCESCO, de treinta años, BRACCIANTE (jornalero), domiciliado en Rende.\n\nDeclara que a las doce y treinta del día catorce del corriente mes, en la casa sita en CONTRADA CAMPAGNANO, de CHIAPPETTA FILOMENA, su esposa, campesina, conviviente con él, ha nacido una niña de sexo femenino que él me presenta, y a la que da el nombre de ANGELINA.\n\nTestigos: Presta Francesco, de veintiséis años, jornalero; y Bartucci Antonio, de setenta años, campesino, ambos residentes en este municipio.\n\nLeída el acta a los comparecientes, no la han firmado conmigo por ser analfabetos, según han declarado. Firma sólo Domenico Pisani.", "notas": ["El margen del acta 55 está EN BLANCO: la muerte de Angelina en 1910 no se anotó nunca al margen de su nacimiento, aunque el acta de defunción existe y está aquí al lado.", "El oficio del padre baila con los años: «contadino» en 1899, «bracciante» aquí en 1902, y otra vez «contadino» en 1904, 1907 y 1909.", "La contrada también cambia: Campagnano en 1899 y 1902, Santo Agostino a partir de 1904."], "imgs": [{"u": "actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20Angelina%20Salerno%20-%20Rende%20acta%2055.jpg", "t": "Angelina Salerno - Rende acta 55"}], "zooms": [{"u": "actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20acta%2055%20completa.jpg", "t": "Acta 55 completa"}, {"u": "actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20contrada%20Campagnano.jpg", "t": "Padre Francesco Salerno y contrada Campagnano"}]}, {"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "30 de agosto de 1910, 13 h", "lugar": "Rende", "ref": "acta 81", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 102 «Morti» 1910"], ["Registro", "an_ua35988770 · hash LPAJpg1"], ["Página", "23 de 54"], ["Año manuscrito", "«millenovecento dieci» — coincide con el catálogo"], ["Oficial", "Vercillo Giuseppe, asesor por el alcalde"]], "literal": "sono comparsi Salerno Domenico, di anni cinquanta, contadino, domiciliato in Rende,\ne Chiappetta Giovanni, di anni sessanta, contadino, domiciliato in Rende…\n…nella casa posta in contrada Sant'Agostino… è morta Salerno Angelina,\ndi anni dieci… nata in Rende da Francesco… e da Chiappetta Filomena", "traduccion": "El año mil novecientos diez, el día treinta de agosto, a las trece horas, en la casa comunal, ante VERCILLO GIUSEPPE, asesor por el alcalde, Oficial del Estado Civil del municipio de Rende, han comparecido SALERNO DOMENICO, de cincuenta años, campesino, domiciliado en Rende, y CHIAPPETTA GIOVANNI, de sesenta años, campesino, domiciliado en Rende.\n\nLos cuales me han declarado que a las doce horas de AYER, en la casa sita en CONTRADA SANT'AGOSTINO, ha muerto SALERNO ANGELINA, de diez años, campesina, residente en Rende, nacida en Rende, hija de FRANCESCO, campesino, domiciliado en Rende, y de CHIAPPETTA FILOMENA, campesina, domiciliada en Rende.\n\nTestigos: Perri Domenico, de veintiséis años, campesino; y Vercillo Ferdinando, de treinta y cinco años, BARBERO, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado con el declarante CHIAPPETTA y con el testigo VERCILLO, habiendo afirmado los demás ser analfabetos.", "notas": ["LA EDAD DEL ACTA ESTÁ MAL. Dice «di anni dieci», diez años. Angelina nació el 14 de mayo de 1902 —su acta de nacimiento está aquí mismo—, así que el 29 de agosto de 1910 tenía OCHO AÑOS Y TRES MESES. Quienes declaran no son los padres, sino un tío y un abuelo, y redondean de más.", "LOS DECLARANTES SON EL DATO BUENO. El primero, SALERNO DOMENICO de cincuenta años, es el hermano mayor de Francesco: diez semanas más tarde se casaba con Giuseppina Cairo declarando cincuenta y uno. Las dos cifras se cruzan en un nacimiento de hacia 1859.", "El segundo, CHIAPPETTA GIOVANNI de sesenta años, es el padre de Filomena, el abuelo materno. Ya constaba como padre de ella en el acta de nacimiento de 1877. Seguía vivo, y SABÍA FIRMAR: es de los pocos de la familia que no firma con una cruz.", "No comparece ninguno de los dos padres de la niña."], "imgs": [{"u": "actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20Angelina%20Salerno%20-%20Rende%20acta%2081.jpg", "t": "Angelina Salerno - Rende acta 81"}], "zooms": [{"u": "actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20acta%2081%20completa.jpg", "t": "Acta 81 completa"}, {"u": "actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20declarantes%20Salerno%20Domenico%20y%20Chiappetta%20Giovanni.jpg", "t": "Declarantes Salerno Domenico y Chiappetta Giovanni"}, {"u": "actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20testigos%20y%20firmas.jpg", "t": "Testigos y firmas"}]}], "nActas": 2, "nImgs": 8, "titulo": "El acta le puso diez años", "parrafos": ["Nació el 14 de mayo de 1902 a las doce y media, en la contrada Campagnano. Su padre la inscribió dos días después y declaró treinta años: tenía treinta y uno. Los testigos fueron Presta Francesco, jornalero de veintiséis años, y Bartucci Antonio, campesino de setenta.", "Murió el 29 de agosto de 1910 a las doce del mediodía, en la contrada Sant'Agostino, en la misma casa donde habían nacido sus hermanos Giovanni, Arturo y Maria. El acta de defunción dice «di anni dieci», diez años. Se equivoca, y la prueba está a dos registros de distancia: su propia acta de nacimiento. Tenía ocho años y tres meses.", "A declarar la muerte no fueron sus padres. Fueron su tío Salerno Domenico, de cincuenta años, y su abuelo materno, Chiappetta Giovanni, de sesenta, y entre los dos redondearon mal la edad de la niña. El abuelo firmó el acta; los demás declararon ser analfabetos. De testigos, un campesino de veintiséis años y un barbero de treinta y cinco.", "El margen de su acta de nacimiento está en blanco: la muerte no se anotó nunca allí, aunque el acta existe y está en el registro de al lado. Durante un tiempo se dio por hecho que Angelina había emigrado a Argentina con la familia. No lo hizo: murió nueve años antes de que sus hermanos embarcaran."], "claves": [["Nacimiento", "14 de mayo de 1902, 12:30, contrada Campagnano"], ["Muerte", "29 de agosto de 1910, 12 h, contrada Sant'Agostino"], ["Edad real al morir", "ocho años y tres meses — el acta dice diez"], ["Quién la declaró", "su tío y su abuelo; ninguno de los padres"]]}, "giovanni_hijo": {"id": "giovanni_hijo", "nombre": "Giovanni Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "Nacido el primer día de 1904, cuatro años después de morir su tío del mismo nombre. Tenía 15 años en 1919 — y en 1926 se casaba en Rende.", "datos": [["Nacimiento", "1 de enero de 1904, 2 de la madrugada, Rende — acta 5"], ["Lugar", "contrada Santo Agostino"], ["Padres", "Salerno Francesco y Chiappetta Filomena"], ["Matrimonio", "24 de julio de 1926, Rende — acta 34, con Cundari Anna"]], "vida": "n.1904", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "anna_cundari", "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "arturo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "3 de enero de 1904, 10 h", "lugar": "Rende", "ref": "acta 5", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 96 «Nati» 1904"], ["Registro", "an_ua35988725 · hash LeNPZXl"], ["Página", "4 de 93"], ["Año manuscrito", "«millenovecento quattro» — coincide con el catálogo"], ["Oficial", "Mercavallo Michelangelo, secretario delegado"]], "literal": "è comparso Salerno Francesco, di anni trentaquattro, contadino, domiciliato in Rende…\n…del dì primo del corrente mese, nella casa posta in contrada Santo Agostino,\nda Chiappetta Filomena, sua moglie, contadina, seco lui convivente… il nome di Giovanni", "traduccion": "El año mil novecientos cuatro, el día tres de enero, a las diez de la mañana, en la casa comunal, ante MERCAVALLO MICHELANGELO, secretario delegado por acta del alcalde de fecha veinte de agosto de mil novecientos dos, aprobada, Oficial del Estado Civil del municipio de Rende, ha comparecido SALERNO FRANCESCO, de treinta y cuatro años, campesino, domiciliado en Rende.\n\nDeclara que a las dos de la madrugada del día PRIMERO del corriente mes, en la casa sita en CONTRADA SANTO AGOSTINO, de CHIAPPETTA FILOMENA, su esposa, campesina, conviviente con él, ha nacido un niño de sexo masculino que él me presenta, y al que da el nombre de GIOVANNI.\n\nTestigos: Cosentino Rosario, de treinta y cuatro años, campesino; y Alfano Domenico, de cuarenta y cinco años, campesino, ambos residentes en este municipio.\n\nLeída el acta a los comparecientes, no la han firmado conmigo por ser analfabetos, según han declarado. Firma sólo M. Mercavallo.", "notas": ["ANOTACIÓN MARGINAL, de mano posterior y con rúbrica: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». Giovanni se casó en Rende el 24 de julio de 1926, acta nº 34, con CUNDARI ANNA. Dato nuevo.", "Y dato de peso: si se casó en Rende en 1926, o no embarcó con la familia en 1919 o volvió. Conviene revisar el supuesto de que emigraron todos.", "Nació el 1 de enero: es de los primeros nacimientos del año, y por eso su acta lleva el número 5 y está casi al principio del volumen — el índice de este registro es cortísimo.", "La familia ya vive en contrada Santo Agostino; en 1902, con Angelina, estaban en Campagnano."], "imgs": [{"u": "actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20Giovanni%20Salerno%20-%20Rende%20acta%205.jpg", "t": "Giovanni Salerno - Rende acta 5"}], "zooms": [{"u": "actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20acta%205%20completa.jpg", "t": "Acta 5 completa"}, {"u": "actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201926%20con%20Cundari%20Anna.jpg", "t": "Anotacion marginal matrimonio 1926 con Cundari Anna"}, {"u": "actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 4, "titulo": "Se quedó en Rende", "parrafos": ["Nació el 1 de enero de 1904 a las dos de la madrugada, en la contrada Santo Agostino: el primer nacimiento del año en la familia, y una de las primeras actas del registro, la número 5. Su padre lo inscribió el día 3 a las diez de la mañana y declaró treinta y cuatro años. Lleva el nombre de su tío, muerto cuatro años antes con veintiséis.", "Al margen del acta, una mano posterior escribió con rúbrica: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». Se casó en Rende el 24 de julio de 1926. Esa línea cambió el relato: si estaba en el pueblo en 1926, o no embarcó nunca o volvió. Tenía quince años cuando se marcharon los mayores.", "Es el documento que mejor sostiene lo que cuenta la familia: que la casa se partió en dos, que cruzaron los hermanos grandes y que Francesco y Filomena se quedaron en Rende con los pequeños. Y significa que hay una rama viva allí, descendiente de Giovanni y Anna Cundari."], "claves": [["Nacimiento", "1 de enero de 1904, 2 de la madrugada, contrada Santo Agostino"], ["Nota al margen", "casado en Rende el 24 de julio de 1926 con Cundari Anna"], ["En 1919", "15 años; se quedó"], ["Lleva el nombre", "de su tío Giovanni, muerto en 1900"]]}, "arturo": {"id": "arturo", "nombre": "Arturo Salerno", "legal": "", "rol": "hermano", "rolNombre": "Hermano", "gen": 8, "ramas": ["salerno"], "resumen": "Nacido de madrugada el 21 de diciembre de 1907 e inscrito esa misma mañana. Tenía 12 años en 1919.", "datos": [["Nacimiento", "21 de diciembre de 1907, 4:30 de la madrugada, Rende — acta 215"], ["Lugar", "contrada S. Agostino"], ["Padres", "Salerno Francesco y Chiappetta Filomena"]], "vida": "n.1907", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "maria"], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "21 de diciembre de 1907, 11:50 h", "lugar": "Rende", "ref": "acta 215", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 99, suppl. 2 «Nati» 1907"], ["Registro", "an_ua35988728 · hash wOpm92Y"], ["Página", "77 de 94"], ["Año manuscrito", "«millenovecento sette» — coincide con el catálogo"], ["Oficial", "Pisani Domenico, asesor por el alcalde"]], "literal": "è comparso Salerno Francesco di anni trentotto, contadino, domiciliato in Rende…\n…alle ore quattro e minuti trenta, del dì ventuno del corrente mese, nella casa\nposta in contrada S. Agostino, da Chiappetta Filomena, contadina, sua moglie\nseco lui convivente… il nome di Arturo", "traduccion": "El año mil novecientos siete, el día veintiuno de diciembre, a las once y cincuenta de la mañana, en la casa comunal, ante PISANI DOMENICO, asesor por el alcalde, Oficial del Estado Civil del municipio de Rende, ha comparecido SALERNO FRANCESCO, de treinta y ocho años, campesino, domiciliado en Rende.\n\nDeclara que a las cuatro y treinta de la madrugada del día veintiuno del corriente mes, en la casa sita en CONTRADA S. AGOSTINO, de CHIAPPETTA FILOMENA, campesina, su esposa, conviviente con él, ha nacido un niño de sexo masculino que él me presenta, y al que da el nombre de ARTURO.\n\nTestigos: Sicilia Pasquale, de sesenta y un años, CARPINTERO; y Bruno Giovanni, de setenta y siete años, ZAPATERO, ambos residentes en este municipio.\n\nLeída el acta a los comparecientes, no la han firmado conmigo por ser analfabetos, según han declarado. Firma sólo Domenico Pisani.", "notas": ["Nació y se inscribió EL MISMO DÍA: parto a las 4:30 de la madrugada, acta a las 11:50 de la mañana, siete horas después. Es el registro más rápido de toda la familia.", "Los dos testigos no son campesinos, como suele ocurrir, sino artesanos del pueblo: un carpintero de 61 años y un zapatero de 77.", "El volumen es el Reg. 99 «suppl. 2». El Reg. 99 «normal» tiene sólo dos páginas: es un resto. El suplemento se cierra con la firma de Domenico Pisani el 1 de enero de 1908."], "imgs": [{"u": "actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20Arturo%20Salerno%20-%20Rende%20acta%20215.jpg", "t": "Arturo Salerno - Rende acta 215"}], "zooms": [{"u": "actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20acta%20215%20completa.jpg", "t": "Acta 215 completa"}, {"u": "actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20fechas%20y%20padre%20Francesco%20Salerno.jpg", "t": "Fechas y padre Francesco Salerno"}, {"u": "actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 5, "titulo": "Un carpintero y un zapatero", "parrafos": ["Nació el 21 de diciembre de 1907 a las cuatro y media de la madrugada, en la contrada S. Agostino, y su padre lo inscribió esa misma mañana a las once y cincuenta: siete horas después del parto.", "Los testigos de su acta no son los jornaleros de siempre. Firman como testigos Sicilia Pasquale, carpintero de sesenta y un años, y Bruno Giovanni, zapatero de setenta y siete —
