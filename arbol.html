<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árbol familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F5F2; --card:#FFFFFF; --sunk:#ECECE8; --rail:#FAFAF8;
  --ink:#16171A; --ink2:#43474D; --muted:#787D85; --faint:#A2A7AE;
  --rule:#DEDFDB; --rule2:#EBEBE7;
  --linea:#1F4B73; --linea-bg:#E8EFF6;
  --sello:#8C3A2E; --sello-bg:#F7EBE8;
  --hecho:#2E6A4E; --hecho-bg:#E6F0EA;
  --sombra:0 1px 1px rgba(20,22,26,.04), 0 8px 24px -16px rgba(20,22,26,.22);
  --sombra-alta:0 2px 6px rgba(20,22,26,.08), 0 24px 60px -24px rgba(20,22,26,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,.nom{font-family:"Newsreader",Georgia,serif;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer}

/* ─────────── cabecera ─────────── */
header{
  min-height:62px; display:flex; align-items:center; gap:14px 20px; flex-wrap:wrap;
  padding:9px 24px; background:var(--card); border-bottom:1px solid var(--rule);
  position:relative; z-index:40;
}
/* Que la cabecera quepa en UNA fila en pantallas anchas: el buscador cede
   espacio antes que los botones, que son los que hay que poder pulsar. */
header .buscar input{width:190px;min-width:120px}
@media (min-width:1100px){ header{flex-wrap:nowrap} header .der{flex-wrap:nowrap} }
@media (max-width:1099px){ header .sub{display:none} }

/* la navegación va siempre junta y nunca se corta: se agrupa y, si hace falta,
   baja a una segunda línea entera en vez de salirse por la derecha */
/* El buscador y los botones forman UN bloque: así, cuando la cabecera no cabe,
   bajan juntos y alineados en vez de quedar sueltos a media altura. */
header .der{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
header .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
header .sub{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}

header .rr{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--linea); background:var(--linea-bg);
  border:1px solid #C6D8E8; border-radius:20px; padding:3px 10px; white-space:nowrap;
}
header .rr[hidden]{display:none}
.linaje .rama{color:var(--muted)}
header .sp{flex:1}
header .btn{text-decoration:none}
header a.vol{color:var(--linea);border-color:var(--linea);background:var(--linea-bg)}
header a.vol:hover{background:var(--linea);color:var(--card)}
@media (max-width:820px){ header .sub{display:none} }
@media (max-width:640px){
  header{padding:9px 16px;gap:10px 12px}
  header h1{font-size:17px}
  header .der{margin-left:0;width:100%;justify-content:flex-start}
  header .buscar{flex:1 1 100%}
}
.btn{
  border:1px solid var(--rule); background:var(--card); border-radius:6px;
  padding:7px 13px; font-size:13px; color:var(--ink2);
}
.btn:hover{background:var(--sunk);color:var(--ink)}
.btn.on{background:var(--linea-bg);border-color:#C6D8E8;color:var(--linea)}

.buscar{position:relative}
.buscar input{
  width:210px; padding:7px 11px; font:inherit; font-size:13px; color:var(--ink);
  background:var(--rail); border:1px solid var(--rule); border-radius:6px; outline:none;
}
.buscar input:focus{border-color:var(--linea);background:var(--card);box-shadow:0 0 0 3px var(--linea-bg)}
#sug{
  position:absolute; top:38px; left:0; width:290px; max-height:340px; overflow-y:auto;
  background:var(--card); border:1px solid var(--rule); border-radius:8px;
  box-shadow:var(--sombra-alta); display:none; z-index:70; padding:5px;
}
#sug.on{display:block}
#sug button{
  display:block; width:100%; text-align:left; border:0; background:none;
  padding:7px 10px; border-radius:5px; font-size:13.5px; color:var(--ink2);
}
#sug button:hover,#sug button.sel{background:var(--linea-bg);color:var(--linea)}
#sug button i{font-style:normal;color:var(--faint);font-size:11px;margin-left:7px}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--card);color:var(--ink2)}

/* ─────────── descendientes ─────────── */
#abajo{
  border-top:1px solid var(--rule); margin-top:52px; padding-top:26px;
}
#abajo .tit{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-bottom:18px;
}
.dn{display:flex;flex-direction:column;gap:14px}
.dn > .fila{display:flex;align-items:flex-start;gap:64px}
.dn .kids{display:flex;flex-direction:column;gap:14px}

/* ─────────── lienzo ─────────── */
/* El desplazamiento superior lo fija el JS con la altura REAL de la cabecera.
   Estaba clavado en 62px, y cuando la cabecera envolvía a dos filas escondía
   debajo la franja de generaciones: por eso no se veía ningún rótulo. */
#lienzo{
  position:absolute; inset:var(--hh, 62px) 0 0 0; overflow:auto;
  background:
    radial-gradient(circle at 1px 1px, rgba(22,23,26,.055) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
}
#pista{position:relative;display:inline-block;padding:56px 72px 90px}
#hilos{position:absolute;inset:0;pointer-events:none;overflow:visible}
#hilos path{fill:none;stroke:var(--rule);stroke-width:1.25}
#hilos path.dir{stroke:var(--linea);stroke-width:1.75}
#hilos marker path{fill:var(--rule);stroke:none}
#hilos marker.d path{fill:var(--linea)}

/* grados de parentesco, encima de cada columna */
/* Franja de generaciones: PEGADA ARRIBA. Antes vivía dentro del lienzo y se
   iba de la vista en cuanto se bajaba un poco, con lo que no servía de nada.
   Ahora se queda fija en vertical y acompaña al árbol en horizontal. */
#grados{
  position:sticky; top:0; z-index:6; height:30px; min-width:100%; width:max-content;
  pointer-events:none;
  background:linear-gradient(var(--paper) 62%, transparent);
}
#grados span{
  position:absolute; top:8px; transform:translateX(-50%);
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
  background:var(--paper); padding:1px 8px; border-radius:10px;
  border:1px solid var(--rule2);
}
/* raya vertical tenue que separa cada generación */
#grados span::after{
  content:""; position:absolute; left:50%; top:100%; width:1px; height:60vh;
  background:linear-gradient(var(--rule2), transparent 85%);
}

/* ─────────── nodos ─────────── */
.n{display:flex;align-items:center;gap:64px}
.up{display:flex;flex-direction:column;gap:16px}

.card{
  position:relative; width:228px; flex:none;
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:12px 14px 11px; box-shadow:var(--sombra);
  text-align:left; transition:box-shadow .16s, transform .16s, border-color .16s;
}
.card:hover{box-shadow:var(--sombra-alta);transform:translateY(-1px);border-color:#CFD3D7}
.card::before{
  content:''; position:absolute; left:0; top:12px; bottom:12px; width:2px;
  border-radius:2px; background:var(--rule);
}
.card.dir::before{background:var(--linea)}
.card.foco{border-color:var(--linea);box-shadow:0 0 0 3px var(--linea-bg),var(--sombra-alta)}

.card .nom{font-size:16.5px;font-weight:500;line-height:1.22;letter-spacing:-.01em;display:block}
.card .vida{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.card .lug{font-size:11.5px;color:var(--faint);margin-top:1px;font-style:italic}

.sellos{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.s{
  font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.06em;
  padding:2px 6px; border-radius:3px; background:var(--hecho-bg); color:var(--hecho);
}
.s.falta{background:transparent;color:var(--faint);border:1px dashed var(--rule)}

.subir{
  position:absolute; right:8px; top:8px; width:22px; height:22px; padding:0;
  border:1px solid var(--rule); border-radius:5px; background:var(--card);
  color:var(--faint); font-size:11px; line-height:1; display:none;
}
.card:hover .subir{display:block}
.subir:hover{background:var(--linea-bg);color:var(--linea);border-color:#C6D8E8}

.vacio{
  width:228px; flex:none; border:1px dashed var(--rule); border-radius:9px;
  padding:13px 14px; color:var(--faint); font-size:12.5px; background:transparent;
}

/* ─────────── franja de familia ─────────── */
/* ─────────── lupas de zoom, flotando sobre el lienzo ─────────── */
/* Fuera del lienzo a propósito: dentro se iban con el scroll. Y ABAJO, no
   arriba: la cabecera cambia de altura cuando envuelve y tapaba el botón «+». */
#lupas{
  position:fixed; right:20px; bottom:calc(var(--fh, 62px) + 20px); z-index:30;
  display:flex; flex-direction:column; gap:6px;
}
#lupas button{
  width:38px; height:34px; padding:0; cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:15px; line-height:1;
  color:var(--ink2); background:var(--card);
  border:1px solid var(--rule); border-radius:8px; box-shadow:var(--sombra);
}
#lupas #zPct{font-size:10.5px;letter-spacing:.02em;color:var(--muted)}
#lupas button:hover{background:var(--sunk);color:var(--ink)}
#lupas button:active{transform:translateY(1px)}
@media (max-width:640px){ #lupas{right:10px;top:10px} #lupas button{width:34px;height:31px} }

#pista{transform-origin:0 0}

#familia{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  background:var(--card); border-top:1px solid var(--rule);
  padding:13px 24px 15px; display:flex; gap:26px; align-items:flex-start;
  overflow-x:auto;
}
.grupo{display:flex;gap:9px;align-items:center;flex:none}
.grupo > b{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); font-weight:400;
  align-self:center; margin-right:2px; white-space:nowrap;
}
.chip{
  border:1px solid var(--rule); background:var(--rail); border-radius:20px;
  padding:5px 12px; font-size:13px; color:var(--ink2); white-space:nowrap;
}
.chip:hover{background:var(--sunk);color:var(--ink)}
.chip.dir{border-color:#C6D8E8;background:var(--linea-bg);color:var(--linea);font-weight:500}
.chip i{font-style:normal;color:var(--faint);font-size:11px;margin-left:5px}

/* ─────────── ficha ─────────── */
#velo{
  position:fixed; inset:0; background:rgba(22,23,26,.34); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#velo.on{opacity:1;pointer-events:auto}
#ficha{
  position:fixed; top:0; right:0; bottom:0; width:min(680px,94vw); z-index:60;
  background:var(--paper); border-left:1px solid var(--rule);
  transform:translateX(100%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
  overflow-y:auto; box-shadow:-30px 0 80px -40px rgba(20,22,26,.4);
}
#ficha.on{transform:none}
#ficha .top{
  position:sticky; top:0; background:var(--paper); z-index:2;
  padding:22px 34px 16px; border-bottom:1px solid var(--rule);
}
#ficha .cerrar{
  position:absolute; right:22px; top:20px; width:30px; height:30px; padding:0;
  border:1px solid var(--rule); border-radius:7px; background:var(--card); color:var(--muted);
}
#ficha .cerrar:hover{background:var(--sunk);color:var(--ink)}
.rol{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:3px;
  background:var(--sunk); color:var(--muted); margin-bottom:9px;
}
.rol.dir{background:var(--linea-bg);color:var(--linea)}
#ficha h2{font-size:31px;font-weight:600;line-height:1.08;letter-spacing:-.02em}
#ficha .epi{
  font-family:"Newsreader",Georgia,serif; font-style:italic; font-size:17px;
  color:var(--linea); margin-top:5px;
}
#ficha .cuerpo{padding:24px 34px 80px}

.res{font-family:"Newsreader",Georgia,serif;font-size:18.5px;line-height:1.5;color:var(--ink2);max-width:60ch;margin:0 0 22px}
.rel p{font-family:"Newsreader",Georgia,serif;font-size:16.5px;line-height:1.62;color:var(--ink);max-width:62ch;margin:0 0 13px}

.claves{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 24px}
.clave{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:7px 11px;font-size:12.5px}
.clave b{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:400;
}

.linaje{font-size:13.5px;margin:0 0 6px;color:var(--ink2)}
.linaje > span{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin-right:8px;
}
.linaje a{color:var(--linea);text-decoration:none;border-bottom:1px solid #C6D8E8;cursor:pointer}
.linaje a:hover{background:var(--linea-bg)}

figure.mapa{margin:22px 0 6px;padding:0;border:1px solid var(--rule2);border-radius:6px;
  overflow:hidden;background:rgba(0,0,0,.02)}
figure.mapa iframe{display:block;width:100%;height:300px;border:0}
figcaption.mapa-tit{padding:8px 12px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--rule2)}
figcaption.mapa-pie{padding:9px 12px;font-size:13.5px;line-height:1.5;color:var(--muted);
  border-top:1px solid var(--rule2)}
dl.dat{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:0 22px;margin:22px 0 0;font-size:14px}
dl.dat dt{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); padding:9px 0 0; border-top:1px solid var(--rule2);
  max-width:11rem; overflow-wrap:anywhere;
}
dl.dat dd a.ext{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--rule-2);
  font-variant-caps:all-small-caps;letter-spacing:.05em;white-space:nowrap}
dl.dat dd{margin:0;padding:9px 0 0;border-top:1px solid var(--rule2)}

h3.sec{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); margin:34px 0 12px; font-weight:400;
}
.acta{background:var(--card);border:1px solid var(--rule2);border-radius:9px;padding:19px 21px;margin:0 0 13px;box-shadow:var(--sombra)}
.acta .hd{border-bottom:1px solid var(--rule2);padding-bottom:11px;margin-bottom:14px}
.pill{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  letter-spacing:.13em; text-transform:uppercase; padding:3px 8px; border-radius:3px;
  background:var(--hecho-bg); color:var(--hecho); margin-bottom:8px;
}
.acta h4{font-family:"Newsreader",Georgia,serif;font-size:19px;font-weight:600;margin:0}
.acta .ref{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.acta figure{margin:0 0 11px}
.acta figure a{display:block;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;background:var(--sunk)}
.acta figure img{display:block;width:100%;height:auto}
.acta figcaption{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;gap:9px}
.lupa{margin-left:auto;color:var(--linea);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;font-size:9px;letter-spacing:.07em;text-transform:uppercase}
.zz{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-top:11px}
.lit{margin:14px 0 0;padding:14px 16px;background:var(--sunk);border-left:2px solid var(--sello);border-radius:0 6px 6px 0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.62;color:var(--sello);white-space:pre-wrap;word-break:break-word}
.tra p{font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.6;color:var(--ink2);margin:0 0 10px;max-width:64ch}
.notas{border-top:1px solid var(--rule2);margin-top:15px;padding-top:13px}
.notas ul{margin:0;padding-left:18px}
.notas li{font-size:13.5px;color:var(--ink2);margin:0 0 8px;line-height:1.5}
.pend{background:var(--sello-bg);border-left:2px solid var(--sello);border-radius:0 8px 8px 0;padding:16px 19px}
.pend b{display:block;font-family:"Newsreader",Georgia,serif;font-size:16px;color:var(--sello);margin-bottom:5px}
.pend p{margin:0;font-size:14px;color:var(--ink2);max-width:62ch}

#ficha .legal{font-size:14px;color:var(--muted);margin:6px 0 0}
#ficha .rot{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  margin:18px 0 7px; font-weight:500;
}
#ficha .fuente{
  display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0 0;
  font-size:14px;
}
#ficha .fuente dt{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding-top:3px; white-space:nowrap;
}
#ficha .fuente dd{margin:0}
@media (max-width:560px){ #ficha .fuente{grid-template-columns:1fr;gap:1px 0}
  #ficha .fuente dd{margin:0 0 8px} }

@media (max-width:760px){
  .n{gap:34px} .card,.vacio{width:190px}
  #ficha .top,#ficha .cuerpo{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<header>
  <h1 id="tit">Árbol familiar</h1>
  <span class="rr" id="rr" hidden></span>
  <span class="sub">161 personas · 82 actas · 294 imágenes</span>

  <div class="der">
  <div class="buscar">
    <input id="q" type="search" placeholder="Buscar a alguien…" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
  <div class="nav">
    <button class="btn" id="bAtras" disabled title="Volver a la persona anterior">← Atrás</button>
    <button class="btn" id="bDir">Solo línea directa</button>
    <button class="btn" id="bMenos" title="Una generación menos">&minus; gen.</button>
    <button class="btn" id="bMas" title="Una generación más">+ gen.</button>
    <a class="btn vol" href="./">Inicio</a>
    <a class="btn vol" href="fichas.html">Fichas</a>
    <a class="btn" href="en/arbol.html" hreflang="en" lang="en">English</a>
  </div>
  </div>
</header>

<div id="lupas">
  <button id="zMas"  title="Acercar"  aria-label="Acercar">+</button>
  <button id="zPct"  title="Volver al 100%" aria-label="Volver al 100%">100%</button>
  <button id="zMenos" title="Alejar" aria-label="Alejar">&minus;</button>
</div>

<div id="lienzo">
  <div id="grados"></div>
  <div id="pista">
    <svg id="hilos"></svg>
    <div id="raiz"></div>
    <div id="abajo"></div>
  </div>
</div>

<div id="familia"></div>

<div id="velo"></div>

<script>
const G = {"domenico_pizzi_viejo": {"id": "domenico_pizzi_viejo", "nombre": "Domenico Pizzi", "legal": "«il fu Domenico Pizzi» en el acta de 1841", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 1, "ramas": ["faienza"], "resumen": "Albañil de Atessa, en los Abruzos. Es la persona más antigua del árbol entero. Su hijo Leone nació hacia 1761, de modo que él es de la generación de 1730-1740. Ya había muerto en octubre de 1841.", "datos": [["Nacimiento", "hacia 1730-1740, presumiblemente Atessa (provincia de Chieti, Abruzos)"], ["Oficio", "muratore (albañil) — el mismo oficio que su hijo, su nieto y su bisnieto"], ["Hijo", "Leone Pizzi (hacia 1761 – 26 de octubre de 1841)"], ["Cónyuge", "Santa Menna, también difunta en 1841"], ["Defunción", "sin localizar — anterior a octubre de 1841"], ["De dónde sale", "acta de defunción de su hijo Leone: Atessa, Morti 1841, acta 293"]], "vida": "c.1730–1841", "lug": "Abruzos", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026, y con esto el árbol gana una generación entera. El acta de defunción de su hijo Leone (Atessa, 26 de octubre de 1841, acta 293, descargada y transcrita en la ficha de Leone) dice «figlio del FU DOMENICO PIZZI di professione MURATORE». El «fu» dice que ya estaba muerto en 1841; el oficio, que la albañilería viene de familia — Leone es muratore, su nieto Domenico es muratore, y el acta de 1869 lo repite. Su propia acta de defunción no está al alcance: el estado civil de los Abruzos arranca en 1809 y él, con un hijo nacido hacia 1761, casi con seguridad murió antes. Lo que quedaría son los libros parroquiales de Atessa, en el Archivio Diocesano di Chieti-Vasto.", "padre": null, "madre": null, "conyuge": "santa_menna", "hijos": ["leone_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "santa_menna": {"id": "santa_menna", "nombre": "Santa Menna", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 1, "ramas": ["faienza"], "resumen": "Madre de Leone Pizzi, de Atessa. Nacida hacia 1730-1740. Es la mujer más antigua documentada del árbol, y la primera madre que un acta de esta tanda se molesta en nombrar.", "datos": [["Nacimiento", "hacia 1730-1740, presumiblemente Atessa"], ["Hijo", "Leone Pizzi (hacia 1761 – 26 de octubre de 1841)"], ["Cónyuge", "Domenico Pizzi, muratore"], ["Defunción", "sin localizar — anterior a octubre de 1841; el acta la llama «quondam»"], ["Apellido", "MENNA es uno de los apellidos más corrientes de Atessa: el acta número 1 de los nacimientos de 1869 es de una Maria Arcangela Menna"]], "vida": "c.1730–1841", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026, y vale la pena subrayar lo excepcional que es. En las cuatro actas de defunción de Rende leídas en esta misma genealogía, LAS CUATRO dejan en blanco el nombre de la madre. Aquí, en Atessa y cincuenta años antes, el formulario del Reino de las Dos Sicilias obliga a rellenar las dos casillas y el escribano las rellena: «e della QUONDAM SANTA MENNA». «Quondam» es el latín de «fu»: ya había muerto en octubre de 1841. No se le da oficio ni domicilio —esas dos rayas quedan vacías—, pero el nombre está, y con él una rama materna nueva que empieza a mediados del siglo XVIII.", "padre": null, "madre": null, "conyuge": "domenico_pizzi_viejo", "hijos": ["leone_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "leone_pizzi": {"id": "leone_pizzi", "nombre": "Leone Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 2, "ramas": ["faienza"], "resumen": "Albañil de Atessa, del rione di Santa Croce, nacido hacia 1761. Enviudó tres veces. Murió el 26 de octubre de 1841, con ochenta años, y su acta —la más antigua de toda esta genealogía— nombra a sus padres. La de su hijo Giuseppe, seis años posterior, nombra a Leone: es el eslabón que une los dos tramos del árbol de Atessa.", "datos": [["Nacimiento", "hacia 1761, ATESSA — por los ochenta años que le da el acta de defunción"], ["Padres", "Domenico Pizzi, muratore, y Santa Menna; los dos ya muertos en 1841"], ["Oficio", "muratore (albañil)"], ["Residencia", "Atessa, rione di SANTA CROCE"], ["Primer matrimonio", "Anna Iano"], ["Segundo matrimonio", "ROSA IACOBITTI — y es la que le dio a Giuseppe. El acta de 1841 dejó la lectura del nombre en duda entre «Nora» y «Rosa»; la defunción de Giuseppe, de 1847, escribe ROSA sin ambigüedad"], ["Tercer matrimonio", "Erminia Vitulli"], ["Defunción", "26 de octubre de 1841, a las 17 h, en su casa — Atessa, acta 293"], ["Descendencia", "GIUSEPPE PIZZI (hacia 1787 – 29 de abril de 1847), muratore del mismo rione di Santa Croce. PROBADO POR ACTA: la defunción de Giuseppe, Atessa 1847, acta 106, lo llama «figlio del fu LEONE PIZZI di professione muratore»"]], "vida": "c.1761–1841", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "domenico_pizzi_viejo", "madre": "santa_menna", "conyuge": "rosa_iacobitti", "hijos": ["giuseppe_pizzi"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "26 de octubre de 1841, 17 h", "lugar": "Atessa (Abruzo Citeriore)", "ref": "acta 293", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile della restaurazione > Atessa > 1841, atti di morte"], ["Registro", "hash del contenedor: LPgBWdB"], ["Página", "183 de 213 (el propio registro la numera «Pag. 147»)"], ["Colocación", "columna derecha de la apertura; a la izquierda, el acta 292"], ["Año manuscrito", "«mille ottocento quarantuno» — coincide con el catálogo"], ["Oficial", "Giuseppe Salvucci, Secondo Eletto, por el alcalde impedido; canciller Giovannantonio Bassani"], ["Cómo se localizó", "este registro NO lleva índice alfabético (acaba en páginas en blanco, actas 352-353 sin usar). Se fijó la recta con dos sondeos —página 200 = actas 326-327 y página 213 = 352-353— y salió limpia: dos actas por imagen, acta = 2×página − 74. Tres páginas bajadas y a la tercera estaba"]], "literal": "Num. d'ordine 293 — Pag. 147\nL'anno mille ottocento quarantuno, il dì ventisette del mese di Ottobre, alle ore\nquindici d'Italia, avanti di noi Giuseppe Salvucci Secondo Eletto pel Sindaco\nimpedito ed uffiziale dello Stato civile del Comune di Atessa, Distretto di Vasto,\nProvincia di Abruzzo Citeriore, sono comparsi Luigi Tiroli di anni trenta, di\nprofessione contadino, regnicolo, domiciliato in questo Comune nel rione del\nCastello, e Giuseppe Ciccarelli di anni quaranta, di professione contadino,\nregnicolo, domiciliato in questo medesimo Comune nel rione di Santa Croce, i quali\nhan dichiarato, che nel giorno ventisei del mese di Ottobre anno corrente, alle ore\ndiciassette è morto nella sua casa LEONE PIZZI di anni ottanta, vedovo in primo\nvoto di Anna Iano, in secondo voto di Nora Iacobitti, ed in terzo voto di Erminia\nVitulli, nato in Atessa, di professione muratore, domiciliato ivi nel rione di\nSanta Croce, figlio del fu DOMENICO PIZZI di professione muratore, domiciliato\n————, e della quondam SANTA MENNA, domiciliata ————.", "traduccion": "El año mil ochocientos cuarenta y uno, el día VEINTISIETE del mes de OCTUBRE, a las QUINCE HORAS A LA ITALIANA.\n\nAnte nos, GIUSEPPE SALVUCCI, Segundo Electo por el Alcalde impedido y oficial del Estado Civil del municipio de ATESSA, Distrito de VASTO, Provincia de Abruzo Citerior, han comparecido LUIGI TIROLI, de treinta años, de profesión campesino, súbdito del reino, domiciliado en este municipio en el BARRIO DEL CASTELLO, y GIUSEPPE CICCARELLI, de cuarenta años, de profesión campesino, súbdito del reino, domiciliado en este mismo municipio en el BARRIO DE SANTA CROCE.\n\nLos cuales han declarado que el día VEINTISÉIS del mes de OCTUBRE del año corriente, a las DIECISIETE HORAS, ha muerto EN SU PROPIA CASA LEONE PIZZI, DE OCHENTA AÑOS, VIUDO en primeras nupcias de ANNA IANO, en segundas nupcias de NORA IACOBITTI y en terceras nupcias de ERMINIA VITULLI, NACIDO EN ATESSA, de profesión ALBAÑIL, domiciliado allí mismo en el barrio de Santa Croce, HIJO DEL DIFUNTO DOMENICO PIZZI, de profesión ALBAÑIL, y DE LA DIFUNTA SANTA MENNA.\n\nEn ejecución de la ley nos hemos trasladado junto con dichos testigos a donde la persona difunta, y hemos reconocido su efectiva muerte. Hemos formado acto seguido la presente acta, que hemos inscrito sobre los dos registros, y tras darle lectura a los declarantes, se ha firmado por nos en el día, mes y año arriba dichos, habiendo declarado los comparecientes no saber escribir. — Giuseppe Salvucci; Giovannantonio Bassani, canciller.", "notas": ["OCHENTA AÑOS EN OCTUBRE DE 1841: nació hacia 1761. Es, con diferencia, la fecha de nacimiento más antigua de todo el árbol; el segundo más antiguo, Pietro Chiappetta, es de hacia 1780.", "EL ACTA NOMBRA A SUS PADRES, y esto es el hallazgo de la tanda. «Figlio del FU DOMENICO PIZZI di professione MURATORE, e della QUONDAM SANTA MENNA». Dos nombres completos, un oficio, y los dos marcados como muertos («fu» y «quondam»). Con Leone nacido hacia 1761, sus padres nacieron hacia 1730-1740: EL ÁRBOL GANA UNA GENERACIÓN ENTERA, y por primera vez llega al siglo XVIII.", "Y NOMBRA A LA MADRE. En las cuatro actas de defunción de Rende leídas en esta misma genealogía las cuatro dejan la casilla de la madre en blanco. El formulario del Reino de las Dos Sicilias, cincuenta años anterior, la rellena. Santa Menna es la primera abuela materna con nombre propio de todo el corpus.", "TRES VIUDEDADES. «Vedovo in primo voto di Anna Iano, in secondo voto di Nora Iacobitti, ed in terzo voto di Erminia Vitulli». Enterró a tres mujeres y murió solo. Cuál de las tres es la madre de la rama que sigue está sin resolver: haría falta el matrimonio de Giuseppe Pizzi o su acta de nacimiento.", "ALBAÑILES DE PADRE A HIJO. Su padre muratore, él muratore, y en 1869 su presunto nieto Domenico Pizzi se declara muratore ante el alcalde de Atessa. Tres generaciones seguidas del mismo oficio, en un mundo de actas donde todo el mundo es contadino.", "EL BARRIO ES SANTA CROCE. Uno de los dos declarantes, Giuseppe Ciccarelli, vive en el mismo rione. En 1869 la familia se ha movido al rione del Castello.", "LA LECTURA DUDOSA ES EL NOMBRE DE LA SEGUNDA MUJER: «Nora Iacobitti» podría ser «Rosa». El apellido Iacobitti se lee sin problema. El del primer declarante, TIROLI, aparece también en 1891 (Donato Tiroli, declarante del acta de Domenico Pizzi): la misma familia dando fe de las muertes de los Pizzi con cincuenta años de diferencia.", "EL REGISTRO NO TIENE ÍNDICE. Acaba en formularios en blanco (actas 352 y 353 sin usar), así que el año 1841 se cerró con unas 351 defunciones. Hubo que interpolar."], "imgs": [{"u": "actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20Leone%20Pizzi%20-%20Atessa%20acta%20293.jpg", "t": "Leone Pizzi - Atessa acta 293"}], "zooms": [{"u": "actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20zoom%20-%2080%20anos%2C%20viudo%20tres%20veces%2C%20hijo%20del%20fu%20Domenico%20Pizzi%20y%20de%20Santa%20Menna.jpg", "t": "80 anos, viudo tres veces, hijo del fu Domenico Pizzi y de Santa Menna"}, {"u": "actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20zoom%20-%20acta%20293%20completa.jpg", "t": "Acta 293 completa"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "rosa_iacobitti": {"id": "rosa_iacobitti", "nombre": "Rosa Iacobitti", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 2, "ramas": ["faienza"], "resumen": "Segunda mujer de Leone Pizzi y madre de Giuseppe Pizzi. Nacida hacia 1765. Es la única de las tres esposas de Leone que está en la línea de sangre, y sólo se sabe por el acta de defunción de su hijo.", "datos": [["Nacimiento", "hacia 1765, presumiblemente Atessa — su hijo nació allí hacia 1787"], ["Cónyuge", "LEONE PIZZI, muratore del rione di Santa Croce (hacia 1761 – 1841). Fue su segunda mujer: antes estuvo Anna Iano, después Erminia Vitulli"], ["Hijo", "Giuseppe Pizzi (hacia 1787 – 29 de abril de 1847), muratore"], ["Defunción", "sin localizar — anterior a abril de 1847, y anterior también a octubre de 1841, porque el acta de Leone ya la da por muerta"], ["De dónde sale", "acta de defunción de su hijo Giuseppe: Atessa, Morti 1847, acta 106"], ["El nombre", "ROSA. El acta de 1841 se leyó en su día como «Nora Iacobitti», con la duda anotada; la de 1847, de otra mano, escribe Rosa con claridad"]], "vida": "c.1765–1847", "lug": "", "mapa": null, "sinacta": "NUEVA EN AGOSTO DE 2026, y llega por el mismo renglón que engancha a su hijo con su marido. El acta de defunción de GIUSEPPE PIZZI (Atessa, 29 de abril de 1847, acta 106, transcrita en la ficha de él) dice «figlio del fu LEONE PIZZI di professione muratore, e della fu ROSA IACOBITTI». Ese «della fu» hace dos cosas a la vez: la nombra y la da por muerta.\n\nLO QUE RESUELVE. Leone Pizzi enviudó tres veces —de Anna Iano, de Rosa Iacobitti y de Erminia Vitulli— y su propia acta, la de 1841, las nombra a las tres sin decir cuál le dio hijos. Durante un tiempo eso dejó tres tatarabuelas posibles y ninguna segura. El acta de 1847 elige: es ella. Las otras dos salen de la línea de sangre.\n\nLO QUE NO SE SABE: cuándo nació, de quién era hija y cuándo murió. Su matrimonio con Leone sería anterior a 1787 y por tanto anterior al estado civil napoleónico, así que habría que ir a los libros parroquiales de Atessa, en el Archivio Diocesano di Chieti-Vasto. El apellido IACOBITTI es de la zona y aparece también en Atessa en 1899.", "padre": null, "madre": null, "conyuge": "leone_pizzi", "hijos": ["giuseppe_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "santo_bosco": {"id": "santo_bosco", "nombre": "Santo Bosco", "legal": "«figli di fu Santo» en el acta de 1865", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 2, "ramas": ["salerno"], "resumen": "Padre de Maria Bosco, de Marano Principato. Nacido hacia 1760-1775. Es nuevo de agosto de 2026 y es el nombre más antiguo de toda la rama RICCHIO — la que baja hasta Filomena Chiappetta por su bisabuela Carmina Ricchio.", "datos": [["Nacimiento", "hacia 1760-1775, presumiblemente MARANO PRINCIPATO — su hija nació allí hacia 1797"], ["Hija", "Maria Bosco (hacia 1797 – 11 de agosto de 1865), mujer de Giuseppe Ricchio"], ["Cónyuge", "no consta. El acta que lo nombra dice de la madre que «s'ignora»"], ["Oficio", "en blanco — el impreso lo pide y el escribano no lo rellenó"], ["Defunción", "sin localizar — anterior a agosto de 1865; el acta lo llama «fu»"], ["De dónde sale", "acta de defunción de su hija Maria: Castrolibero, Morti 1865, acta 11"]], "vida": "c.1760–1865", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA el 26 de agosto de 2026. El acta de defunción de su hija MARIA BOSCO (Castrolibero, 11 de agosto de 1865, acta 11, descargada y transcrita en la ficha de ella) dice «figli di FU SANTO». El impreso del Reino de las Dos Sicilias sólo pide ahí el nombre de pila, porque el apellido es el de la difunta: BOSCO. El «fu» dice que ya había muerto en agosto de 1865.\n\nPOR QUÉ IMPORTA: hasta el 25 de agosto de 2026 no se sabía siquiera que Maria Bosco existiera. El acta de defunción de su hija Carmina (Rende, 1883) nombraba sólo al padre y dejaba la casilla de la madre en blanco. Primero un índice dio a Maria Bosco, después el acta de 1865 la confirmó, y de paso soltó a su padre. Dos generaciones nuevas en dos días, en la rama de la que menos se sabía.\n\nLO QUE NO SE SABE: nada más. Ni oficio, ni domicilio, ni con quién estuvo casado — el acta de 1865 declara expresamente que la madre de Maria «s'ignora». Su propia acta de defunción sería de Marano Principato, anterior a 1865; su matrimonio y su nacimiento son casi con seguridad parroquiales.", "padre": null, "madre": null, "conyuge": null, "hijos": ["maria_bosco"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "pietro_chiappetta": {"id": "pietro_chiappetta", "nombre": "Pietro Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Jornalero de Castrolibero, padre de Raffaele Chiappetta. Nacido hacia 1780. Ya había muerto en diciembre de 1880.", "datos": [["Nacimiento", "hacia 1780, presumiblemente Castrolibero — su hijo nació allí hacia 1805"], ["Oficio", "bracciante (jornalero)"], ["Residencia", "Castrolibero — el acta dice «domiciliato in detto Castrolibero»"], ["Hijo", "Raffaele Chiappetta (hacia 1805 – 3 de diciembre de 1880)"], ["Cónyuge", "sin nombre — el acta de su hijo la da por muerta pero no la nombra"], ["Defunción", "sin localizar — anterior a diciembre de 1880"]], "vida": "c.1780–1880", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026. La defunción de su hijo Raffaele (Rende, 3 de diciembre de 1880, acta 135, descargada y transcrita en la ficha de Raffaele) dice «da FU PIETRO, bracciante, domiciliato in detto Castrolibero». Tres datos en una línea: que se llamaba Pietro, que era jornalero y que vivió en Castrolibero; y el «fu», que en diciembre de 1880 ya estaba muerto. Su propia acta habría que buscarla en Castrolibero, y con un hijo nacido hacia 1805 la ventana de su nacimiento cae hacia 1775-1785 — fuera del alcance del estado civil, que en Calabria empieza en 1809. Su defunción, en cambio, sí podría estar: Castrolibero tiene registros desde 1809.", "padre": null, "madre": null, "conyuge": null, "hijos": ["raffaele_chiappetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Tres datos en una línea", "parrafos": ["Todo lo que se sabe de él cabe en una línea escrita el 4 de diciembre de 1880, cuando dos jornaleros de Rende fueron a la casa comunal a declarar la muerte de su hijo Raffaele. El escribano anotó que el difunto era hijo «da fu Pietro, bracciante, domiciliato in detto Castrolibero». Ahí está todo: cómo se llamaba, de qué vivía y dónde. Y el «fu», que en estos formularios significa difunto: en diciembre de 1880 Pietro llevaba tiempo muerto.", "Su hijo nació hacia 1805, de modo que él debió de nacer entre 1775 y 1785. Eso lo deja fuera de alcance por la vía civil: el estado civil en Calabria arranca en 1809 y antes de esa fecha sólo hay libros parroquiales. Su acta de defunción, en cambio, sí podría existir, en los registros de difuntos de Castrolibero anteriores a 1880.", "Hay una pista sobre su mujer, la que el acta de 1880 dejó sin nombre. En tres matrimonios de otros Chiappetta recogidos en el corpus del blog —Castrolibero 1832, Marano Principato 1839 y Castrolibero 1849— los padres del novio son «Chiappetta, Pietro» y «Veltri, Pasqualina». Si es el mismo Pietro, ella se llamaba Pasqualina Veltri. No está confirmado: ninguna acta leída lo dice de él directamente."], "claves": [["Oficio", "bracciante, jornalero sin tierra"], ["Pueblo", "Castrolibero"], ["Actas propias", "ninguna; su nacimiento es anterior al registro civil"], ["Muerto antes de", "diciembre de 1880"], ["Su mujer", "sin nombre en el acta; ¿Pasqualina Veltri?, sin confirmar"]]}, "carmine_molinaro": {"id": "carmine_molinaro", "nombre": "Carmine Molinaro", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Se le tiene por padre de Teresa Molinaro, pero el acta de defunción de ella NO lo nombra. El nombre viene sólo del índice.", "datos": [["Hija", "Teresa Molinaro (hacia 1819 – 19 de diciembre de 1879)"], ["Cónyuge", "Carmina Covello — igual de sin confirmar que él"], ["Estado de la prueba", "SIN CONFIRMAR por acta original"], ["Lo único documentado", "que el padre de Teresa había muerto antes de diciembre de 1879"]], "vida": "", "lug": "", "mapa": null, "sinacta": "AVISO, agosto de 2026. Se bajó el acta de defunción de su hija Teresa (Rende, 19 de diciembre de 1879, acta 94) contando con que nombrase a los padres, porque el formulario de estos registros tiene casilla para los dos. NO LOS NOMBRA. El escribano escribió «da fu ______» y «e dalla fu ______» y dejó los dos nombres en blanco, cosa que no hizo en las otras tres actas de esta misma tanda, donde sí puso el nombre del padre. Así que «Carmine Mulinaro» sigue siendo lo que era: una entrada de índice sin documento detrás. Lo único que el acta aporta de verdad es el «fu»: quienquiera que fuese el padre de Teresa, había muerto antes de diciembre de 1879. Y que el apellido de la familia se escribe MOLINARO, no «Mulinaro».", "padre": null, "madre": null, "conyuge": "carmina_covello", "hijos": ["teresa_molinaro"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Dos casillas en blanco", "parrafos": ["El 20 de diciembre de 1879 se levantó en Rende el acta de defunción de su hija Teresa. El formulario tenía sitio para los dos padres. El escribano escribió «da fu ______» y «e dalla fu ______» y dejó los dos nombres en blanco, cosa que no hizo en las otras tres actas de esa misma generación, donde sí puso el del padre. Se había bajado ese acta precisamente contando con que lo nombrase.", "Así que Carmine Molinaro sigue siendo lo que era antes: una línea de índice sin documento detrás. Lo único que el acta aporta de verdad es el «fu»: quienquiera que fuese el padre de Teresa, había muerto antes de diciembre de 1879. Y una corrección de grafía, que no es poca cosa cuando se busca en índices: el apellido se escribe MOLINARO, con o, tanto en el cuerpo del acta como en el epígrafe del margen, en el índice anual del propio registro y en el matrimonio de su nieto en 1873. El «Mulinaro» de los índices modernos está deformado.", "Queda una hipótesis bonita y sin acta que la sostenga. En los matrimonios de Marano Principato de 1839 se casa Antonio Chiappetta, hijo de Pietro Chiappetta y Pasqualina Veltri, con Saveria Maria Mulinaro, hija de Carmine Mulinaro y Carmina Covello. Si nuestro Raffaele —también hijo de Pietro— se casó con Teresa —hija de Carmine—, serían dos hermanos casados con dos hermanas. Encaja, pero la boda de Raffaele y Teresa se buscó en 1838 y 1841-1845 en Marano Principato, página por página, y no está: en esos cuarenta y seis matrimonios no aparece ningún Chiappetta."], "claves": [["Estado de la prueba", "sin confirmar: sólo lo dice un índice"], ["Lo único documentado", "el padre de Teresa había muerto antes de diciembre de 1879"], ["Grafía del apellido", "Molinaro, nunca Mulinaro"], ["Hija", "Teresa Molinaro, hacia 1819 – 19 de diciembre de 1879"]]}, "carmina_covello": {"id": "carmina_covello", "nombre": "Carmina Covello", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Se la tiene por madre de Teresa Molinaro. Ninguna acta leída hasta hoy la nombra.", "datos": [["Hija", "Teresa Molinaro"], ["Cónyuge", "Carmine Molinaro"], ["Estado de la prueba", "SIN CONFIRMAR por acta original"], ["Lo único documentado", "que la madre de Teresa había muerto antes de diciembre de 1879"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Misma situación que su marido, y por el mismo motivo. El acta de defunción de su hija Teresa (Rende, 1879, acta 94) tiene la casilla de la madre —«e dalla fu ______ domiciliata in ______»— y está en blanco. Se la mantiene en el árbol por el índice, marcada como no confirmada. Vale la pena señalar el patrón: de las cuatro actas de defunción de esta generación leídas en 2026, LAS CUATRO callan el nombre de la madre. Tres de ellas sí dan el del padre. En estos registros de Rende la filiación materna es el dato que se pierde primero.", "padre": null, "madre": null, "conyuge": "carmine_molinaro", "hijos": ["teresa_molinaro"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "La madre que nadie escribió", "parrafos": ["Su nombre viene de la misma línea de índice que el de su marido, y el documento que tenía que respaldarlo no lo hace. En el acta de defunción de su hija Teresa, de diciembre de 1879, la casilla dice «e dalla fu ______ domiciliata in ______» y está vacía.", "No es un descuido aislado, es un patrón. De las cuatro actas de defunción de esa generación leídas en 2026 —Teresa Molinaro en 1879, Raffaele Chiappetta en 1880, Carmina Ricchio en 1883 y Domenico Massei en 1891—, las cuatro callan el nombre de la madre; tres de ellas sí dan el del padre. En estos registros de Rende la filiación materna es lo primero que se pierde. El caso más raro es el de 1891: el escribano dejó el nombre en blanco y sin embargo rellenó «domiciliata in Rende». Sabía dónde había vivido aquella mujer y no supo cómo se llamaba.", "De Carmina Covello, por tanto, sólo está documentado que la madre de Teresa había muerto antes de diciembre de 1879. Se la mantiene en el árbol marcada como no confirmada."], "claves": [["Estado de la prueba", "sin confirmar por ninguna acta"], ["Lo único documentado", "había muerto antes de diciembre de 1879"], ["Por qué falta", "las cuatro actas de su generación omiten el nombre de la madre"]]}, "giuseppe_ricchio": {"id": "giuseppe_ricchio", "nombre": "Giuseppe Ricchio", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Jornalero de Marano Principato, padre de Carmina Ricchio. Nacido hacia 1800. Ya había muerto en diciembre de 1883, y nunca se movió de su pueblo.", "datos": [["Nacimiento", "hacia 1800, presumiblemente Marano Principato"], ["Oficio", "bracciante (jornalero)"], ["Residencia", "Marano Principato — el acta dice «domiciliato IN VITA in Marano Principato»"], ["Hija", "Carmina Ricchio (hacia 1828 – 11 de diciembre de 1883)"], ["Cónyuge", "MARIA BOSCO († 11 de agosto de 1865, Castrolibero) — el acta de su hija la daba por muerta sin nombrarla; el acta de defunción de ella, leída en agosto de 2026, la nombra y lo nombra a él: «vedova del fu Giuseppe Ricchio»"], ["Defunción", "sin localizar todavía en imagen — el índice la sitúa en Castrolibero, Morti 1855, acta 28. En agosto de 1865 su mujer ya era viuda, lo que encaja"]], "vida": "n.c.1800", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026, y con una pista de dónde buscarlo. La defunción de su hija Carmina (Rende, 11 de diciembre de 1883, acta 163, transcrita en la ficha de ella) dice «da FU GIUSEPPE, bracciante, domiciliato IN VITA in Marano Principato». Ese «in vita» es oro: no sólo confirma que había muerto, sino que dice dónde vivió hasta el final. Su acta de defunción debería estar, por tanto, en los registros de MARANO PRINCIPATO, anteriores a 1883 — un municipio que hasta esta tanda no aparecía en el árbol y que ahora resulta ser el pueblo de origen de dos de los cuatro bisabuelos de Filomena.\n\nCORRECCIÓN DEL 26 DE AGOSTO DE 2026, y va en sentido contrario. El acta de defunción de su mujer MARIA BOSCO (Castrolibero, 11 de agosto de 1865, acta 11) la llama «VEDOVA DEL FU GIUSEPPE RICCHIO» y la sitúa viviendo en CASTROLIBERO, contrada Feudo, aunque nacida en Marano Principato. O sea: la familia se había mudado a Castrolibero, allí se casó su hija Carmina en 1849 y allí murió su mujer. El «domiciliato in vita in Marano Principato» del acta de 1883 lo dijo un yerno dieciocho años después de morir ella y veintiocho después de morir él, y probablemente confunde el pueblo de origen con el último domicilio. El índice sitúa su defunción en CASTROLIBERO, Morti 1855, acta 28 — que es donde hay que ir a buscarla, y no en Marano Principato.", "padre": null, "madre": null, "conyuge": "maria_bosco", "hijos": ["carmina_ricchio"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Domiciliado en vida en Marano", "parrafos": ["El 12 de diciembre de 1883, en la casa comunal de Rende, su yerno Giovanni Chiappetta declaró la muerte de Carmina Ricchio, ocurrida la víspera al mediodía. Al identificar a la difunta, el acta la llama hija «da fu Giuseppe, bracciante, domiciliato in vita in Marano Principato».", "Ese «in vita» —en vida— es lo que convierte la frase en dato útil. No sólo dice que Giuseppe había muerto: dice dónde vivió hasta el final. Su acta de defunción no hay que buscarla en Rende, donde murió su hija, sino en los registros de Marano Principato anteriores a 1883.", "Marano Principato no aparecía en este árbol hasta esa tanda de lecturas. De golpe resultó ser el pueblo de origen de dos de los cuatro abuelos de Filomena: Carmina Ricchio y Teresa Molinaro. Giuseppe, jornalero como casi todos los hombres de esta línea, nació presumiblemente allí hacia 1800, calculando desde el nacimiento de su hija hacia 1828."], "claves": [["Oficio", "bracciante, jornalero"], ["Pueblo", "Marano Principato, donde vivió hasta morir"], ["Muerto antes de", "diciembre de 1883"], ["Hija", "Carmina Ricchio, hacia 1828 – 11 de diciembre de 1883"]]}, "maria_bosco": {"id": "maria_bosco", "nombre": "Maria Bosco", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Campesina nacida en Marano Principato hacia 1797, mujer de Giuseppe Ricchio y madre de Carmina Ricchio. Murió viuda en Castrolibero, contrada Feudo, el 11 de agosto de 1865, con sesenta y ocho años. Hasta el 25 de agosto de 2026 no se sabía que existiera.", "datos": [["Nacimiento", "hacia 1797, MARANO PRINCIPATO — el acta dice «nato in Marano Principato» y le da 68 años"], ["Padres", "SANTO BOSCO, ya difunto en 1865. La madre NO consta: donde el impreso pide su nombre, el escribano escribió «s'ignora» y dejó la raya vacía"], ["Oficio", "contadina (campesina)"], ["Cónyuge", "Giuseppe Ricchio, bracciante († Castrolibero, 1855 según el índice) — el acta la llama «vedova del fu Giuseppe Ricchio»"], ["Hija", "Carmina Ricchio (hacia 1828, Marano Principato – 11 de diciembre de 1883, Rende)"], ["Residencia", "Castrolibero, CONTRADA FEUDO — no su pueblo natal"], ["Defunción", "11 de agosto de 1865, 16 h, en su propia casa — Castrolibero, acta 11"]], "vida": "c.1797–1865", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "santo_bosco", "madre": null, "conyuge": "giuseppe_ricchio", "hijos": ["carmina_ricchio"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "12 de agosto de 1865, 20 h (el acta); murió el 11 a las 16 h", "lugar": "Castrolibero", "ref": "acta 11", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Castrolibero > Registro 57 «Morti» 1865"], ["Registro", "hash del contenedor: 57oe7Dz (23 páginas)"], ["Página", "7 de 23, columna DERECHA — folio 6 (a la izquierda, el acta 10)"], ["Año manuscrito", "el año va IMPRESO en el formulario, «L'anno mille ottocento sessantacinque»; sólo el día va a mano. Coincide con el catálogo"], ["Oficial", "Pietro Perri, f.f. da Sindaco; refrenda Pasquale Perri, secretario comunal"], ["Cómo se localizó", "por proporción: acta = 2 × página − 3 para la columna derecha. Acertada a la primera, sin ningún sondeo"]], "literal": "…è morta nella casa di sua abitazione MARIA BOSCO vedova del fu GIUSEPPE RICCHIO, nato in Marano Principato, figli di FU SANTO ———— di professione ———— domiciliato ————, e di s'ignora ———— domiciliata ———— di anni SESSANTOTTO di professione CONTADINA domiciliata in Castrolibero, Contrada Feudo.", "traduccion": "El año mil ochocientos sesenta y cinco, el día DOCE del mes de AGOSTO, a las VEINTE horas, ante Nos, PIETRO PERRI, en funciones de alcalde y oficial del Estado Civil del municipio de CASTROLIBERO, distrito de Cosenza, provincia de Calabria Citra, han comparecido FERDINANDO STILLATO, YERNO DE LA DIFUNTA, de treinta años, de profesión BRACCIALE, del reino, domiciliado en Castrolibero, contrada Feudo; y GIACINTO BOSCO, de treinta años, de profesión bracciale, del reino, domiciliado en este municipio.\n\nLos cuales han declarado que el día ONCE del mes de AGOSTO del año corriente, a las DIECISÉIS horas, ha muerto EN LA CASA DE SU HABITACIÓN MARIA BOSCO, VIUDA DEL DIFUNTO GIUSEPPE RICCHIO, nacida en MARANO PRINCIPATO, HIJA DEL DIFUNTO SANTO —de profesión (en blanco), domiciliado (en blanco)— Y DE MADRE QUE SE IGNORA (en blanco), DE SESENTA Y OCHO AÑOS, de profesión CONTADINA, domiciliada en CASTROLIBERO, CONTRADA FEUDO.\n\nEn cumplimiento de las leyes nos hemos trasladado junto con dichos testigos hasta la persona difunta y hemos reconocido su muerte efectiva. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros, y leída a los declarantes, se ha firmado por Nos en el día, mes y año arriba señalados, habiendo declarado los testigos declarantes no saber escribir.", "notas": ["LO QUE IDENTIFICA A ÉSTA Y NO A OTRA es el CÓNYUGE: «VEDOVA DEL FU GIUSEPPE RICCHIO». En Castrolibero y Marano Principato hay varias familias Ricchio y Bosco entrelazadas, y la columna del cónyuge era la que tenía que decidir. Decide. Y todo lo demás encaja: nacida en MARANO PRINCIPATO, que es donde nació su hija Carmina y donde el acta de 1883 sitúa a Giuseppe Ricchio; y muerta VIUDA, coherente con la defunción de él en 1855.", "*** SANTO BOSCO, CONFIRMADO. *** «figli di FU SANTO». El impreso sólo pide el nombre de pila porque el apellido es el de la difunta. El «fu» dice que ya había muerto. Es una generación entera nueva en la rama por la que Filomena Chiappetta desciende de los Ricchio, y el nombre más antiguo de esa rama.", "*** MARIA ESPOSITO, NO CONFIRMADA — Y ADEMÁS CONTRADICHA. *** El índice del blog daba los dos padres, «Bosco, Santo — Esposito, Maria». El acta confirma al primero y niega al segundo: donde el impreso pide el nombre de la madre, el escribano escribió «S'IGNORA» —se ignora— y dejó vacías las tres rayas del nombre, el oficio y el domicilio. No es un olvido como el del acta de Carmina Spizzirri de 1864, donde las casillas quedaron simplemente en blanco: aquí el escribano se molesta en escribir una palabra donde tendría que ir un nombre. NOTA DE LECTURA, para ser honestos: la palabra está clarísima letra a letra —S, i, g, n, o, r, a— y admite dos lecturas, «s'ignora» (se ignora) o el tratamiento «Signora» puesto donde debería ir el nombre. En los dos casos el resultado es el mismo y es el que importa: EN EL ACTA NO HAY NINGÚN NOMBRE DE MADRE. MARIA ESPOSITO sigue siendo evidencia de índice y nada más, y no se ha metido en este árbol como persona.", "SESENTA Y OCHO AÑOS EN AGOSTO DE 1865: nació hacia 1797. Con Carmina nacida hacia 1828 la tuvo con unos treinta y uno, que es normal. Con Cherubina, que los índices ponen en 1849, tendría cincuenta y dos, que ya no lo es: o Cherubina no es hija suya, o alguna de las edades declaradas está redondeada. Queda anotado y sin resolver.", "VIVÍA EN CASTROLIBERO, CONTRADA FEUDO, no en Marano Principato. La familia se había mudado: allí se casó su hija Carmina en 1849, allí murió su marido en 1855 y allí muere ella. Esto corrige la lectura que se venía haciendo del acta de 1883, que llamaba a Giuseppe Ricchio «domiciliato in vita in Marano Principato» — el yerno que lo declaró confundió, casi con seguridad, el pueblo de origen con el último domicilio.", "EL PRIMER DECLARANTE ES UN YERNO Y NO ES EL NUESTRO. «FERDINANDO STILLATO, GENERO DELLA DEFUNTA», de treinta años. Carmina Ricchio estaba casada con Domenico Antonio Mazzei y vivía en Rende, así que Stillato es el marido de OTRA hija. La candidata es CHERUBINA RICCHIO, que los índices dan nacida en Marano Principato en 1849 y muerta en Castrolibero en 1901 (acta 18). Sin comprobar, pero es la línea a tirar.", "EL SEGUNDO DECLARANTE, GIACINTO BOSCO, treinta años, bracciale, lleva el apellido de la difunta. Sobrino o pariente cercano; nada en el acta lo precisa.", "DÓNDE PODRÍA SALIR LA MADRE: en el matrimonio de Maria Bosco con Giuseppe Ricchio, que por la edad de Carmina sería de hacia 1825-1828 en Marano Principato, o en el nacimiento de la propia Maria, hacia 1797, que ya es parroquial y anterior al estado civil."], "imgs": [{"u": "actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20Maria%20Bosco%20-%20Castrolibero%20acta%2011.jpg", "t": "Maria Bosco - Castrolibero acta 11"}], "zooms": [{"u": "actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20acta%2011%20completa.jpg", "t": "Acta 11 completa"}, {"u": "actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20declarante%20Ferdinando%20Stillato%2C%20yerno%20de%20la%20difunta.jpg", "t": "Declarante Ferdinando Stillato, yerno de la difunta"}, {"u": "actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20hija%20del%20difunto%20Santo%2C%20la%20madre%20sin%20nombre%2C%2068%20anos.jpg", "t": "Hija del difunto Santo, la madre sin nombre, 68 anos"}, {"u": "actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20viuda%20del%20difunto%20Giuseppe%20Ricchio.jpg", "t": "Viuda del difunto Giuseppe Ricchio"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "filippo_massei": {"id": "filippo_massei", "nombre": "Filippo Massei", "legal": "Filippo Mazzei en el acta de 1891", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Jornalero de Rende, padre de Domenico Massei. Nacido hacia 1795. Ya había muerto en noviembre de 1891.", "datos": [["Nacimiento", "hacia 1795, presumiblemente Rende — su hijo nació allí hacia 1821"], ["Oficio", "bracciante (jornalero)"], ["Residencia", "Rende"], ["Hijo", "Domenico Massei (hacia 1821 – 8 de noviembre de 1891)"], ["Cónyuge", "sin nombre — el acta de su hijo dice que había muerto y que vivió en Rende"], ["Defunción", "sin localizar — anterior a noviembre de 1891"], ["Grafía", "el acta que lo nombra escribe MAZZEI"]], "vida": "c.1795–1891", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026. La defunción de su hijo Domenico (Rende, 8 de noviembre de 1891, acta 112, transcrita en la ficha de él) dice «dal FU FILIPPO, bracciante, domiciliato in Rende». Con el hijo nacido en Rende hacia 1821, esta rama resulta ser de Rende de toda la vida, y no de Castrolibero como se venía suponiendo. Su acta de defunción tendría que estar en los Morti de Rende anteriores a 1891 — que están en Antenati y son alcanzables — sin más pista que el nombre y el oficio. Su nacimiento, hacia 1795, queda fuera: el estado civil de Calabria arranca en 1809.", "padre": null, "madre": null, "conyuge": null, "hijos": ["domenico_massei"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "De Rende, no de Castrolibero", "parrafos": ["Aparece en una sola frase, la del acta de defunción de su hijo Domenico, levantada en Rende el 9 de noviembre de 1891: «dal fu Filippo, bracciante, domiciliato in Rende».", "Esa frase corrigió una suposición que llevaba tiempo en pie. Se tenía a los Massei por gente de Castrolibero, porque allí había nacido Angela, la hija de Domenico, hacia 1858. Pero el acta dice que Domenico nació en Rende hacia 1821 y que su padre estaba domiciliado en Rende. La familia era de Rende de toda la vida; fue Domenico quien se movió y quien volvió.", "Su acta de defunción debería estar en los registros de difuntos de Rende anteriores a 1891 —fondos ya conocidos y accesibles—, con la sola pista del nombre y el oficio. Su nacimiento, hacia 1795, queda fuera de alcance. Y el apellido: el acta de 1891 lo escribe MAZZEI, con doble zeta inconfundible, mientras que las actas de la rama que sigue viva (1873, 1877, 1894) escriben MASSEI. Las dos formas son reales y dependen del escribano, no del portador."], "claves": [["Oficio", "bracciante, jornalero"], ["Pueblo", "Rende"], ["Muerto antes de", "noviembre de 1891"], ["Grafía", "Mazzei en el acta que lo nombra; Massei en el resto de la rama"]]}, "giuseppe_pizzi": {"id": "giuseppe_pizzi", "nombre": "Giuseppe Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["faienza"], "resumen": "Albañil de Atessa, del rione di Santa Croce, nacido hacia 1787. Murió el 29 de abril de 1847, con sesenta años, y su acta de defunción es la que ata esta rama por arriba: dice, con todas las letras, que era hijo de Leone Pizzi.", "datos": [["Nacimiento", "hacia 1787, ATESSA — por los sesenta años que le da el acta de defunción"], ["Padres", "LEONE PIZZI, muratore, y ROSA IACOBITTI; los dos ya muertos en abril de 1847"], ["Oficio", "MURATORE (albañil) en su propia acta de 1847. La de su hijo, de 1891, lo llama «artigiano»: la misma cosa dicha cuarenta y cuatro años después"], ["Residencia", "Atessa, rione di SANTA CROCE — el mismo barrio en que murió su padre"], ["Cónyuge", "ANTONIA DI IORIO, filatrice. En 1847 vivía: el acta lo llama «marito», no «vedovo»"], ["Hijo", "Domenico Pizzi (hacia 1824-1830 – 28 de septiembre de 1891)"], ["Defunción", "29 de abril de 1847, a las 22 h, en su casa — Atessa, acta 106"]], "vida": "c.1787–1847", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "leone_pizzi", "madre": "rosa_iacobitti", "conyuge": "antonia_di_iorio", "hijos": ["domenico_pizzi"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "29 de abril de 1847, 22 h", "lugar": "Atessa (Abruzo Citeriore)", "ref": "acta 106", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile della restaurazione > Atessa > 1847, atti di morte"], ["Registro", "hash del contenedor: wWe3JmB — 191 páginas"], ["Página", "86 de 191 (el propio registro la numera «54»)"], ["Colocación", "columna izquierda de la apertura; a la derecha, el acta 107"], ["Año manuscrito", "«mille ottocento quarantasette» — coincide con el catálogo"], ["Oficial", "Luigi Rossi, Secondo Eletto por el alcalde impedido; canciller sustituto Ottaviano Cardone"], ["Cómo se localizó", "este registro tampoco lleva índice alfabético: acaba en formularios en blanco, actas 308-309 sin usar. Dos actas por imagen, y en cada folio del registro van las actas 2P−2 y 2P−1; pero la correspondencia imagen→folio NO es constante (folio = imagen − 36 en diciembre, folio = imagen − 32 en abril), así que la fórmula que sirvió para 1841 aquí falla por ocho actas. Ocho sondeos: 191, 188, 185, 87, 80, 83, 85 y 86. El paso decisivo fue ver que el acta 108 ya era del 17 de mayo: eso encerraba el 29 de abril entre las actas 102 y 107, seis actas y tres imágenes"]], "literal": "Num. d'ordine 106\nL'anno mille ottocento quarantasette, il dì trenta del mese di Aprile, alle ore\nquattordici d'Italia, avanti di noi Luigi Rossi Secondo Eletto pel Sindaco\nimpedito ed uffiziale dello stato civile del Comune di Atessa, Distretto di Vasto,\nProvincia di Abruzzo Citeriore, sono comparsi Domenico Fidelibus di anni\ncinquantotto, di professione contadino, regnicolo, domiciliato in questo Comune nel\nrione del Mercato, e Nobile Domenico di anni sessanta, di professione contadino,\nregnicolo, domiciliato in questo Comune nel rione del Castello, i quali han\ndichiarato, che nel giorno ventinove del mese di Aprile anno corrente, alle ore\nventidue è morto nella sua casa GIUSEPPE PIZZI di anni sessanta, marito di Antonia\ndi Iorio, nato in Atessa, di professione muratore, domiciliato ivi nel rione di\nSanta Croce, figlio del fu LEONE PIZZI di professione muratore, domiciliato ————,\ne della fu ROSA IACOBITTI, domiciliata ————.", "traduccion": "El año mil ochocientos cuarenta y siete, el día TREINTA del mes de ABRIL, a las CATORCE HORAS A LA ITALIANA.\n\nAnte nos, LUIGI ROSSI, Segundo Electo por el Alcalde impedido y oficial del Estado Civil del municipio de ATESSA, Distrito de VASTO, Provincia de Abruzo Citerior, han comparecido DOMENICO FIDELIBUS, de cincuenta y ocho años, de profesión campesino, súbdito del reino, domiciliado en este municipio en el BARRIO DEL MERCATO, y DOMENICO NOBILE, de sesenta años, de profesión campesino, súbdito del reino, domiciliado en este mismo municipio en el BARRIO DEL CASTELLO.\n\nLos cuales han declarado que el día VEINTINUEVE del mes de ABRIL del año corriente, a las VEINTIDÓS HORAS, murió en su propia casa GIUSEPPE PIZZI, de SESENTA AÑOS, MARIDO DE ANTONIA DI IORIO, nacido en Atessa, de profesión ALBAÑIL, domiciliado allí mismo en el BARRIO DE SANTA CROCE, HIJO DEL DIFUNTO LEONE PIZZI, de profesión ALBAÑIL, domiciliado ————, Y DE LA DIFUNTA ROSA IACOBITTI, domiciliada ————.\n\nEn ejecución de la ley nos hemos trasladado junto con dichos testigos ante la persona difunta y hemos reconocido su efectiva muerte. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros y leído a los declarantes; se ha firmado por nos en el día, mes y año arriba dichos, habiendo declarado los declarantes no saber escribir.", "notas": ["ES EL ACTA QUE ENGANCHA LA GENERACIÓN DE 1730. Hasta hoy, que Giuseppe Pizzi fuera hijo de Leone lo decía únicamente un bloque familiar sin una sola cita, el mismo que ya había errado tres veces comprobadas. Ahora lo dice el documento: «figlio del fu LEONE PIZZI di professione MURATORE». Con ese renglón entran al árbol, ya probados, Leone y —a través de la propia acta de Leone de 1841— sus padres Domenico Pizzi y Santa Menna, que son de la generación de 1730-1740.", "Y RESUELVE EL SEGUNDO CABO, EL DE LAS TRES MUJERES. Leone enviudó tres veces y su acta de 1841 no dice cuál le dio hijos. Ésta sí: la madre de Giuseppe es ROSA IACOBITTI, la segunda esposa. Anna Iano y Erminia Vitulli quedan fuera de la línea de sangre.", "DE PASO CORRIGE UNA LECTURA. En el acta de 1841 el nombre de la segunda mujer se anotó como dudoso, «Nora Iacobitti (podría ser Rosa)». Aquí, otra mano y seis años antes, escribe ROSA sin ambigüedad. Dos escribanos distintos, el mismo apellido, y el nombre de pila ya fijado.", "EL OFICIO VA DE PADRES A HIJOS, Y AHORA SON CUATRO SEGUIDOS. Domenico el viejo (hacia 1730) muratore, Leone (hacia 1761) muratore, Giuseppe (hacia 1787) muratore, y Domenico (hacia 1824-1830) muratore. Ciento cincuenta años de albañiles en el mismo pueblo, y dos de ellos en el mismo barrio, el rione di Santa Croce.", "CIERRA TAMBIÉN CON EL ACTA DE 1891. Ésta lo da «marito di ANTONIA DI IORIO»; la defunción de su hijo Domenico, cuarenta y cuatro años después, nombra a la madre como «fu Antonia di Iorio, filatrice». Es la misma mujer, y las dos actas se confirman entre sí sin haberse consultado.", "LAS EDADES CUADRAN SIN FORZAR NADA: Leone nació hacia 1761 y Giuseppe hacia 1787, veintiséis años de diferencia entre padre e hijo.", "UN DETALLE DEL AÑO: el acta inmediatamente anterior, la 105, es de otra muerta del mismo 29 de abril, una niña de dos meses. Abril de 1847 iba en Atessa a razón de una defunción diaria; en mayo el ritmo cae a menos de la mitad."], "imgs": [{"u": "actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20Giuseppe%20Pizzi%20-%20Atessa%20acta%20106.jpg", "t": "Giuseppe Pizzi - Atessa acta 106"}], "zooms": [{"u": "actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%2060%20anos%2C%20muratore%2C%20marido%20de%20Antonia%20di%20Iorio%2C%20hijo%20del%20fu%20Leone%20Pizzi%20y%20de%20la%20fu%20Rosa%20Iacobitti.jpg", "t": "60 anos, muratore, marido de Antonia di Iorio, hijo del fu Leone Pizzi y de la fu Rosa Iacobitti"}, {"u": "actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%20acta%20106%20completa.jpg", "t": "Acta 106 completa"}, {"u": "actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%20cabecera%2C%20declarantes%20y%20la%20muerte%20el%2029%20de%20abril%20a%20las%2022%20h.jpg", "t": "Cabecera, declarantes y la muerte el 29 de abril a las 22 h"}]}], "nActas": 1, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "antonia_di_iorio": {"id": "antonia_di_iorio", "nombre": "Antonia di Iorio", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["faienza"], "resumen": "Hilandera de Atessa, madre de Domenico Pizzi. Nacida hacia 1795-1805. Su nombre lo rescata el acta de defunción de su hijo en 1891.", "datos": [["Nacimiento", "hacia 1795-1805, presumiblemente Atessa"], ["Oficio", "filatrice (hilandera)"], ["Residencia", "Atessa — «domiciliata IN VITA in Atessa»"], ["Hijo", "Domenico Pizzi (hacia 1824 – 28 de septiembre de 1891)"], ["Cónyuge", "Giuseppe Pizzi, artigiano"], ["Defunción", "sin localizar — anterior a septiembre de 1891"]], "vida": "c.1795–1891", "lug": "", "mapa": null, "sinacta": "CONFIRMADA POR ACTA en agosto de 2026, y es una pequeña victoria contra la costumbre. La defunción de su hijo Domenico (Atessa, 28 de septiembre de 1891, acta 238, transcrita en la ficha de él) dice «e da FU ANTONIA DI IORIO, FILATRICE, domiciliata IN VITA in Atessa». Nombre y apellido completos, oficio y pueblo: exactamente lo que los cuatro formularios gemelos de Rende callaron cuatro veces seguidas en esos mismos años. En Atessa, el mismo impreso del Reino de Italia, con el mismo hueco impreso, sí se rellenó. Su defunción tendría que estar en los Morti de Atessa anteriores a 1891.", "padre": null, "madre": null, "conyuge": "giuseppe_pizzi", "hijos": ["domenico_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "lorenzo_palermo": {"id": "lorenzo_palermo", "nombre": "Lorenzo Palermo", "legal": "«il fu Lorenzo» en el acta de 1863", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Padre de Giuseppe Palermo, el de Marano Marchesato. Como su hijo nació hacia 1773, él es de la generación de 1740-1750. Ya había muerto en marzo de 1863.", "datos": [["Nacimiento", "hacia 1740-1750, presumiblemente MARANO MARCHESATO — su hijo Giuseppe consta «nato in Marano medesimo»"], ["Hijo", "GIUSEPPE PALERMO (hacia 1773 – 6 de marzo de 1863), pastore y bracciale"], ["Cónyuge", "Giulia Chiappetta, también difunta en 1863"], ["Oficio", "NO CONSTA — el acta de 1863 deja la casilla de profesión del padre en blanco"], ["Defunción", "sin localizar — anterior a marzo de 1863"], ["De dónde sale", "acta de defunción de su hijo Giuseppe: Marano Marchesato, Morti 1863, acta 24, «figlio di FU LORENZO»"]], "vida": "c.1740–1863", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026. El acta de defunción de su hijo Giuseppe —Marano Marchesato, 6 de marzo de 1863, acta 24, descargada y transcrita en la ficha de Giuseppe— dice «figlio di FU LORENZO... e di FU GIULIA CHIAPPETTA». El «fu» lo da ya muerto en 1863. Hasta esa lectura, Lorenzo Palermo era sólo una casilla de un índice de blog.\n\nSu propia acta de defunción no está al alcance por la vía fácil: con un hijo nacido hacia 1773, lo normal es que muriera entre 1800 y 1840. Si fue después de 1809 estaría en los Morti de Marano Marchesato, que están en Antenati desde 1822; si fue antes, sólo queda la parroquia de S. Maria del Carmine. Aviso: en Marano conviven a la vez al menos ocho familias Palermo, y el índice de 1809-1826 trae otro Lorenzo Palermo casado con Francesca Chiappetta que NO es éste — o al menos no está probado que lo sea.", "padre": null, "madre": null, "conyuge": "giulia_chiappetta", "hijos": ["giuseppe_palermo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giulia_chiappetta": {"id": "giulia_chiappetta", "nombre": "Giulia Chiappetta", "legal": "«fu Giulia Chiappetta» en el acta de 1863", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Madre de Giuseppe Palermo. Nacida hacia 1740-1750, muerta antes de marzo de 1863. Es una de las pocas madres que los formularios de Marano se molestan en nombrar.", "datos": [["Nacimiento", "hacia 1740-1750, presumiblemente Marano Marchesato"], ["Hijo", "GIUSEPPE PALERMO (hacia 1773 – 6 de marzo de 1863)"], ["Cónyuge", "Lorenzo Palermo, también difunto en 1863"], ["Defunción", "sin localizar — anterior a marzo de 1863; el acta la llama «fu»"], ["Apellido", "CHIAPPETTA es de los más corrientes de la zona, y el mismo de la rama de Filomena Chiappetta que entra en la familia ochenta años después, por Castrolibero. No hay ninguna relación probada entre las dos"], ["De dónde sale", "acta de defunción de su hijo Giuseppe: Marano Marchesato, Morti 1863, acta 24"]], "vida": "c.1740–1863", "lug": "", "mapa": null, "sinacta": "CONFIRMADA POR ACTA en agosto de 2026, y conviene subrayar lo poco frecuente que es. En las cuatro actas de defunción de Rende leídas en esta genealogía, LAS CUATRO dejan en blanco el nombre de la madre; y en el acta de su propia nuera, Carmina Spizzirri (Marano, 1864), las dos casillas de padre y madre quedan igualmente vacías. Aquí, en cambio, el escribano de Marano las rellenó: «figlio di fu Lorenzo... e di FU GIULIA CHIAPPETTA». La lectura del apellido es firme —Chiappetta, no Chiappella— y coincide con lo que daba el índice del blog. No se le anota oficio ni domicilio: esas rayas sí quedaron en blanco.", "padre": null, "madre": null, "conyuge": "lorenzo_palermo", "hijos": ["giuseppe_palermo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "michele_volpintesta": {"id": "michele_volpintesta", "nombre": "Michele Volpintesta", "legal": "«il fu Michele» en el acta de 1823; VOLPENTESTA en la grafía de Marano", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Nacido hacia 1723. Murió en RENDE el 20 de agosto de 1793, a los setenta años, y lo enterraron dos horas después en la propia iglesia de Santa Maria Maggiore. Es el antepasado más antiguo fechado de todo el árbol.", "datos": [["Nacimiento", "hacia 1723 — los setenta años que le da su extracto de defunción de 1793. Es la fecha de nacimiento más antigua de todo el árbol"], ["Oficio", "BRACCIALE (jornalero) — el mismo que su hijo Vincenzo"], ["Hijo", "VINCENZO VOLPENTESTA (hacia 1773 – 19 de marzo de 1823), bracciale, casado con Teresa Luchetta"], ["Cónyuge", "TERESA TENUTA — CONFIRMADA POR DOCUMENTO desde el 26 de agosto de 2026: el extracto parroquial de su defunción lo llama «MICHAEL VOLPENTESTA VIR THERESIAE TENUTA»"], ["Defunción", "20 de agosto de 1793, RENDE — parroquia de Santa Maria Maggiore, folio 48 del libro de difuntos, con SETENTA años"], ["De dónde sale", "acta de defunción de su hijo Vincenzo: Marano Marchesato, Morti 1823, acta 8, «figlio del FU MICHELE di professione BRACCIALE»"]], "vida": "c.1723–1793", "lug": "", "mapa": null, "sinacta": "DOS DOCUMENTOS LO SOSTIENEN. El acta de defunción de su hijo Vincenzo —Marano, 19 de marzo de 1823, acta 8— dice «figlio del FU MICHELE, di professione BRACCIALE», y el «fu» lo da ya muerto. Y desde el 26 de agosto de 2026 hay algo mucho mejor: SU PROPIO EXTRACTO DE DEFUNCIÓN, guardado dentro del expediente matrimonial de su nieta Carmina (Rende 1837, processetto 20, página 230).\n\n«ANNO DOMINI 1793 DIE VIGESIMO AUGUSTI RENDIS — MICHAEL VOLPENTESTA VIR THERESIAE TENUTA, AETATIS SUAE ANN. SEPTUAGINTA». Con todos los sacramentos, y su cuerpo llevado a la iglesia parroquial y enterrado allí mismo dos horas después. Lo firma el párroco Nicolaus Rovella; el extracto lo expidió Balthasar Bartucci el 19 de octubre de 1837, el mes de la boda.\n\nMURIÓ EN RENDE, NO EN MARANO, y eso importa: la familia Volpentesta ya tenía vínculo con Rende en el siglo XVIII, dos generaciones antes de que su nieta se avecindara allí y se casara —en esa misma iglesia de Santa Maria Maggiore—. No fue un traslado nuevo.\n\nFalta su nacimiento, hacia 1723, y su matrimonio con Teresa Tenuta. Los dos serían parroquiales: el registro civil no existe hasta 1809.\n\nUNA TRAMPA QUE CONVIENE CONOCER (29 de agosto de 2026). En los entierros parroquiales de Rende de 1807, acta 203, muere OTRO MICHELE VOLPINTESTA, hijo de Giovanni y casado con Maria Rosaria Benincasa. NO ES ÉSTE. El nuestro murió en Rende el 20 de agosto de 1793, a los setenta años, casado con Teresa Tenuta. Son dos hombres distintos con catorce años de diferencia, y quien busque «Michele Volpintesta» en Rende va a tropezar primero con el otro. Los Volpintesta son allí un apellido abundante: sólo en las tablas de 1796 y 1807 aparecen como cabezas de casa Salvatore, Gaetano, Gennaro, Giovanni y Giuseppe.", "padre": null, "madre": null, "conyuge": "teresa_tenuta", "hijos": ["vincenzo_volpintesta"], "hermanos": [], "actas": [{"titulo": "Extracto parroquial de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "20 de agosto de 1793", "lugar": "Rende", "ref": "folio 48 del libro de difuntos", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni, processetti» 1837"], ["Registro", "ark an_ua35976841 · hash del contenedor: LPAZyGB (269 imágenes)"], ["Página", "230 de 269 — expediente 20, el de la boda de su nieta Carmina"], ["Original", "libro de difuntos de la parroquia de SANTA MARIA MAGGIORE de Rende, folio 48. El extracto lo expidió el párroco Balthasar Bartucci el 19 de octubre de 1837, «ad fidem pro usu Matrimonii»"], ["Párroco de 1793", "Nicolaus Rovella"], ["Cómo se localizó", "no se buscó: apareció dentro del expediente matrimonial de 1837, entre los documentos que los novios tuvieron que presentar para casarse"]], "literal": "Anno Domini 1793 die vigesimo Augusti Rendis — MICHAEL VOLPENTESTA VIR THERESIAE TENUTA, aetatis suae ann. septuaginta, omnibus SS. munitus, in C.S.M.E. animam suam Deo reddidit, ejusque corpus ad Ecclesiam Parochialem delatum, et post horas duas ibidem sepultum fuit. — Nicolaus Rovella, Rector.", "traduccion": "Yo, el infrascrito rector de la iglesia parroquial del pueblo de Rende, bajo la advocación de SANTA MARÍA LA MAYOR, habiendo consultado el libro de difuntos, doy fe de haber hallado la siguiente partida en el folio 48, a saber:\n\n«EL AÑO DEL SEÑOR 1793, EL DÍA VEINTE DE AGOSTO, EN RENDE — MICHELE VOLPENTESTA, MARIDO DE TERESA TENUTA, de SETENTA AÑOS de edad, provisto de todos los sacramentos, entregó su alma a Dios; y su cuerpo fue llevado a la iglesia parroquial y allí mismo sepultado dos horas después. — Nicolás Rovella, rector.»\n\nY doy fe de ello para uso de matrimonio. En Rende, a 19 de octubre de 1837. Baltasar Bartucci, rector.", "notas": ["*** ESTE DOCUMENTO RESCATA A TERESA TENUTA. *** Tres palabras —VIR THERESIAE TENUTA— que la convierten de nombre de índice en persona documentada. Llevaba todo el proyecto sin ficha propia porque el acta de 1823 deja la casilla de la madre en blanco, y se había decidido no darla por buena.", "ES EL DOCUMENTO MÁS ANTIGUO DEL ÁRBOL, y lleva la cadena hasta 1723 — setenta años antes de 1793. Por delante de Domenico Pizzi y Santa Menna, que rondaban 1730.", "MURIÓ EN RENDE, NO EN MARANO. Los Volpentesta ya tenían vínculo con Rende en el siglo XVIII, dos generaciones antes de que su nieta Carmina se avecindara allí. Y se casó en ESA MISMA IGLESIA, Santa Maria Maggiore, en 1837. La familia volvió al sitio del que había salido.", "Lo enterraron dentro de la iglesia parroquial dos horas después de morir. En agosto, en Calabria, la prisa se explica sola.", "El índice del blog fechaba esta muerte en 1793 y acertó. Pero el mismo índice daba la de su hijo Vincenzo en 1827 cuando el acta es de 1823. Acertar una vez no lo vuelve fiable: sigue siendo pista, no prueba.", "*** 29 DE AGOSTO DE 2026 — YA TIENE HIJOS, Y TIENEN FECHA. *** Como murió en Rende, sus hijos tenían que estar bautizados en Rende, y los bautizos de esa parroquia empiezan en 1731 y están transcritos en el blog calabrés que ya estaba en disco. Barridos año por año, aparecen TRES hijos suyos y de Teresa Tenuta, siempre con la misma fórmula «Volpintesta, Michele — Tenuta, Teresa»: PIETRO GAETANO (1767, acta 13), VINCENZO MERCURIO (1770, acta 48) y GREGORIO GIOACCHINO (1773, acta 41). El del medio podría ser nuestro Vincenzo; eso se discute en su propia ficha, porque hay un choque de fechas y de pueblo que no se puede tapar.", "CUIDADO: EN RENDE HABÍA A LA VEZ POR LO MENOS CUATRO MICHELE VOLPINTESTA. Uno hijo de Tommaso y de Isabella Pellegrino, casado en 1758 con Orsola Pellegrino y viudo al año siguiente, que volvió a casarse en 1759 con Arcangela Pranno y tuvo hijos en 1761, 1763, 1765, 1768, 1771 y 1774. Otro casado con Saveria Santanna en 1764. El nombre suelto no vale para nada: lo que identifica al nuestro es SIEMPRE el nombre de la mujer, Teresa Tenuta.", "SU MATRIMONIO NO ESTÁ EN RENDE, Y
