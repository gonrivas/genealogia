2, pecoraio al morir"], ["Contradas", "Palazzo (1841), Langhi (1845), Cerzi (1852) en Marano; luego Rende"], ["Defunción", "13 de mayo de 1867, 16 h, Rende — acta 35, con 60 años"]], "vida": "c.1807–1867", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": "carmina_volpintesta", "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": ["aquila_palermo"], "actas": [{"titulo": "Extracto parroquial de bautismo", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "14 de febrero de 1809", "lugar": "Marano Marchesato", "ref": "parroquia del Carmine", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni, processetti» 1837"], ["Registro", "ark an_ua35976841 · hash del contenedor: LPAZyGB (269 imágenes)"], ["Página", "225 de 269 — expediente 20, el de su propia boda"], ["Original", "libro de bautizados de la iglesia de SANTA MARIA DEL MONTE CARMELO de Marano Marchesato. Extracto expedido por el rector Dominicus Laura el 27 de septiembre de 1837"], ["Legalización", "F. Spizzirri, sindaco de Marano, y el canciller Benedetto Conforti"], ["Cómo se localizó", "dentro del expediente de su matrimonio de 1837, entre los documentos que tuvo que presentar para casarse"]], "literal": "Anno Domini Mille Octingentesimo NONO die 14 mensis FEBRUARII Marani, R.D. MATTHAEUS SANTANNA baptizavit infantem natum ex JOSEPHO PALERMO et CARMELA SPIZZIRRI legitimis conjugibus, cui impositum est nomen FRANCISCUS JACOBUS; compater BARBARA SANTANNA.", "traduccion": "Yo, el infrascrito rector de la iglesia de SANTA MARÍA DEL MONTE CARMELO del pueblo de Marano, habiendo consultado el libro de bautizados, doy fe de haber hallado la siguiente partida:\n\n«EL AÑO DEL SEÑOR MIL OCHOCIENTOS NUEVE, EL DÍA 14 DEL MES DE FEBRERO, EN MARANO, el reverendo don MATEO SANTANNA bautizó a un niño nacido de JOSÉ PALERMO Y CARMELA SPIZZIRRI, LEGÍTIMOS CÓNYUGES, a quien se le impuso el nombre de FRANCISCO JACOBO; madrina, BÁRBARA SANTANNA.»\n\nDado en Marano, a cinco de las calendas de octubre de 1837. Domingo Laura, rector.", "notas": ["*** LA PIEZA QUE FALTABA DESDE EL PRINCIPIO. *** Su nacimiento NO está en el registro civil de Marano de 1809: ese año se leyó entero, ochenta y cuatro actas, y los dos únicos Palermo son hijos de otros. Este extracto, guardado dentro del expediente de su boda, es probablemente la única copia que sobrevive fuera del libro parroquial.", "«LEGITIMIS CONJUGIBUS» — legítimos cónyuges. Giuseppe Palermo y Carmela Spizzirri YA ESTABAN CASADOS en febrero de 1809. Hasta ahora sólo se sabía que lo estaban antes de 1812, por el primer hijo conocido. Su matrimonio hay que buscarlo ANTES DE 1809, y es el documento que daría por fin los padres de Carmina Spizzirri.", "Los veintiocho años que declara al casarse en octubre de 1837 dan 1809. Coincide exactamente con este bautismo, y con el año que el índice del expediente le atribuía.", "La madre aparece aquí como CARMELA, igual que en el acta de matrimonio de 1837 y al revés que en todo lo demás, donde es CARMINA. Dos documentos distintos, la misma variante: puede que Carmela fuera su nombre de pila real y Carmina el de uso."], "imgs": [{"u": "actas/1867%20-%20Francesco%20Giacomo%20Palermo/1809-02-14%20N%20Bautismo%20de%20Francesco%20Giacomo%20Palermo%20-%20Marano%20Marchesato%2C%20parroquia%20del%20Carmine.jpg", "t": "Bautismo de Francesco Giacomo Palermo - Marano Marchesato, parroquia del Carmine"}], "zooms": []}, {"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "13 de mayo de 1867, 16 h", "lugar": "Rende", "ref": "acta 35", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 59 «Morti» 1867"], ["Registro", "an_ua35985546 · hash LD1KnvN"], ["Página", "11 de 36"], ["Oficial", "Luigi Perugini, asesor por el alcalde impedido"], ["Año manuscrito", "«milleottocento sessantasette» — coincide con el catálogo"]], "literal": "…è morto Giacomo Palermo, di anni sessanta, di professione pecoraio, domiciliato a Rende, marito di Carmina Volpintesta fu Vincenzo, nato a Marano Marchesato, figlio del fu Giuseppe.", "traduccion": "El año mil ochocientos sesenta y siete, el día catorce del mes de mayo, a las diecisiete horas, en la casa comunal de Rende, circondario de Cosenza, provincia de Calabria Citerior.\n\nAnte mí, LUIGI PERUGINI, asesor en funciones por el alcalde impedido, Oficial del Estado Civil de dicho municipio, han comparecido PASQUALE SACCO, hijo del difunto Antonio, de cincuenta años, de profesión VETTURALE (carretero), y COSTANTINO PERUGINI, hijo del difunto Domenico, de cuarenta y dos años, de profesión SARTORE (sastre), ambos domiciliados en Rende.\n\nLos cuales me han declarado que el día trece del mes arriba dicho, a las dieciséis horas, en este municipio de Rende, en la casa de su habitación sita en la contrada Nocolitani (lectura dudosa), ha muerto GIACOMO PALERMO, DE SESENTA AÑOS, de profesión PECORAIO (pastor de ovejas), domiciliado en Rende, MARIDO DE CARMINA VOLPINTESTA, hija del difunto Vincenzo, NACIDO EN MARANO MARCHESATO, HIJO DEL DIFUNTO GIUSEPPE.\n\nLeída el acta a los declarantes, que han declarado no saber escribir, la he firmado yo solo. — El Asesor, Luigi Perugini.", "notas": ["El acta NO NOMBRA A LA MADRE. Se corta en «figlio del fu Giuseppe». Se esperaba que confirmase a Carmina Spizzirri y no lo hace. — ACTUALIZACIÓN, agosto de 2026: el nombre de la madre ya no depende de esta acta. Apareció en otra, el matrimonio de Rosalia Palermo (Marano Marchesato, 8 de diciembre de 1838, acta 19), que nombra a la pareja entera: Giuseppe Palermo, pastore, y Carmina Spizzirri. Lo que falta ahora no es el nombre, sino la prueba de que Rosalia y Giacomo eran hermanos.", "*** 26 DE AGOSTO DE 2026: CAE LA ÚLTIMA OBJECIÓN CONTRA CARMINA SPIZZIRRI. *** El acta de defunción de ella (1864) le daba setenta años, o sea nacida hacia 1794, y con esa cuenta habría tenido TRECE al nacer él, hacia 1807 — motivo suficiente para dejar de darla por madre suya y sospechar un primer matrimonio de Giuseppe Palermo. El nacimiento de su hermana AQUILA (Marano, 22 de junio de 1821, acta 34) hace declarar a Giuseppe que Carmina tiene TREINTA Y DOS años: nacida hacia 1789, dieciocho al nacer Francesco Giacomo. La cuenta encaja y el matrimonio anterior deja de hacer falta. Sigue sin haber prueba directa —ningún documento nombra juntos a Carmina y a Francesco Giacomo— pero ya no hay nada en contra.", "Los dos «fu» del acta valen tanto como el resto: Giuseppe Palermo estaba muerto, y Vincenzo Volpintesta, el padre de la viuda, también.", "«Marito di», no «vedovo»: Carmina Volpintesta seguía viva en mayo de 1867. Enviudó a los cincuenta y pocos años.", "LA EDAD OBLIGA A CORREGIR LA FICHA. Sesenta años en mayo de 1867 sitúan su nacimiento hacia 1806-1807, no hacia 1812 como se venía diciendo a partir de los 27 años que declaró en 1839. Las actas de sus otros tres hijos dan 36 años en 1841, 38 en 1845 y 40 en 1852: cuatro de las cinco cifras caen entre 1805 y 1812, con la mediana en 1807.", "El oficial que levanta el acta es LUIGI PERUGINI, el mismo que como alcalde de Rende había casado a su hija Maria Antonia con Michele Salerno nueve años antes, en agosto de 1858.", "Murió en Rende habiendo nacido en Marano Marchesato: la familia ya se había mudado, lo que explica que la boda de su hija en 1858 se celebrara en Rende."], "imgs": [{"u": "actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20Francesco%20Giacomo%20Palermo%20-%20Rende%20acta%2035.jpg", "t": "Francesco Giacomo Palermo - Rende acta 35"}], "zooms": [{"u": "actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20acta%2035%20completa.jpg", "t": "Acta 35 completa"}, {"u": "actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20declarantes%20Pasquale%20Sacco%20y%20Costantino%20Perugini.jpg", "t": "Declarantes Pasquale Sacco y Costantino Perugini"}, {"u": "actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20edad%2C%20oficio%20pecoraio%20y%20esposa%20Carmina%20Volpintesta.jpg", "t": "Edad, oficio pecoraio y esposa Carmina Volpintesta"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "19 de octubre de 1837, 21 h", "lugar": "Rende", "ref": "acta 20", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni» 1837"], ["Registro", "ark an_ua35976844 · hash del contenedor: wbVEAb4 (28 imágenes)"], ["Página", "21 de 28 — folio 20 del libro; un acta por imagen, en la mitad derecha"], ["Oficial", "Mario Magdalone, sindaco de Rende"], ["Año manuscrito", "«mille ottocento trentasette» — coincide con el catálogo"], ["Cómo se localizó", "primero en el índice escaneado de matrimonios de Rende de 1837, fila 20; después el acta, acertando a la primera con la recta página = acta + 1"]], "literal": "…sono comparsi nella casa comunale FRANCESCO GIACOMO PALERMO di anni VENTOTTO, nato in MARANO MARCHESATO, professione PECORAJO, domiciliato ivi, figlio di GIUSEPPE, domiciliato ivi, di professione PECORAJO, e di CARMELA SPIZZIRRI, domiciliata ivi; e CARMINA VOLPENTESTA di anni VENTITRE, nata in MARANO MARCHESATO, domiciliata RENDE, figlia del FU VINCENZO, domiciliato ————, e di TERESA LUCHETTA, domiciliata ivi…", "traduccion": "El año mil ochocientos treinta y siete, el día DIECINUEVE del mes de OCTUBRE, a las VEINTIUNA horas, ante Nos, MARIO MAGDALONE, alcalde y oficial del Estado Civil del municipio de RENDE, distrito de Cosenza, provincia de Calabria Citra, han comparecido en la casa comunal:\n\nFRANCESCO GIACOMO PALERMO, DE VEINTIOCHO AÑOS, nacido en MARANO MARCHESATO, de profesión PECORAJO (pastor de ovejas), domiciliado allí, HIJO DE GIUSEPPE, domiciliado allí, de profesión PECORAJO, Y DE CARMELA SPIZZIRRI, domiciliada allí;\n\ny CARMINA VOLPENTESTA, DE VEINTITRÉS AÑOS, nacida en MARANO MARCHESATO, domiciliada en RENDE, HIJA DEL DIFUNTO VINCENZO y DE TERESA LUCHETTA, domiciliada allí.\n\nLa notificación de la promesa se fijó en la puerta de la casa comunal de Rende el día primero, domingo, de octubre, Y EN MARANO MARCHESATO el mismo día — en los dos pueblos, porque él era de Marano y ella vivía ya en Rende.\n\nDocumentos presentados: 1.º la partida de nacimiento del esposo; 2.º la de la esposa; 3.º el certificado de que el esposo es célibe y no está sujeto al vínculo militar; 4.º el de que la esposa es célibe; 5.º LA FE DE MUERTE DEL PADRE DE LA ESPOSA; 6.º LA FE DE MUERTE DE SU ABUELO PATERNO; 7.º la fe de muerte de su madre; 8.º el extracto de las notificaciones, contra las cuales no hubo oposición.\n\nCuatro testigos: SALVATORE PORRO, de treinta años, bracciale, de Rende; SALVATORE COSTABILE, de veintitrés, SARTORE (sastre); GIUSEPPE DE PAOLA, de veintiocho, FALEGNAME (carpintero); y FRANCESCO DE GENNARO, de treinta y tres, sartore. Todos de Rende.\n\n[Columna de la derecha] El párroco de SANTA MARIA MAGGIORE devolvió una de las copias, certificando al pie que la celebración canónica del matrimonio siguió el día VEINTE del mismo mes, ante los testigos IGNAZIO MANDARINO y PIETRO PERUGINI.", "notas": ["*** ESTA ES EL ACTA QUE CIERRA LA FILIACIÓN DE FRANCESCO GIACOMO. *** Hasta el 26 de agosto de 2026, que fuese hijo de Giuseppe Palermo y Carmina Spizzirri era una inferencia por convergencia: se apoyaba en el acta de su hermana Rosalia de 1838 y en la coincidencia de pueblo, nombre y oficio. Aquí lo dice su propia acta de boda. Por tanto ROSALIA y AQUILA PALERMO son sus hermanas de padre y de madre, y Carmina Spizzirri es bisabuela por línea directa sin ninguna reserva.", "Se buscó esta boda durante meses en MARANO MARCHESATO, y no está: nueve índices, de 1830 a 1838, ciento ochenta y tres bodas, ni un Palermo varón con ninguna Volpintesta. Estaba en RENDE. La lección, apuntada: cuando los dos novios son de un pueblo pero ella ya vive en otro, la boda se celebra donde vive ELLA. La notificación doble —Rende y Marano— lo dice en el propio acta.", "LA MADRE SE LLAMA «CARMELA» AQUÍ Y «CARMINA» EN TODO LO DEMÁS. Son variantes de la misma raíz y el escribano de Rende no la conocía. El padre, el pueblo y el oficio coinciden, así que no hay motivo para dudar de que sea la misma mujer, pero queda anotado.", "MICHELE VOLPINTESTA, CONFIRMADO POR ACTA. El documento número 6 es la fe de muerte del abuelo paterno de la novia: es Michele, el padre del difunto Vincenzo. Hasta ahora ese abuelo dependía del índice del blog y del índice del expediente; ahora lo respalda un acta original.", "EL PUNTO 7 CHIRRÍA, y conviene decirlo: pide la fe de muerte «della di lei madre», y la madre de la novia, Teresa Luchetta, aparece VIVA tres líneas más arriba en esta misma acta y no muere hasta 1851. Lo más probable es que sea formulario: la ley pedía acreditar quién debía dar el consentimiento —muerto el padre pasa al abuelo paterno, muerto éste a la madre— y el escribano copió la lista entera. NO tomarlo como indicio de otra madre.", "Las cinco actas de Marano encajan con ésta sin forzar nada: Vincenzo consta «fu» y murió en 1823; Teresa Luchetta consta viva y murió en 1851; Giuseppe y Carmela constan vivos y murieron en 1863 y 1864. Y los veintiocho años del novio dan 1809, que es exactamente el año que el índice del expediente atribuye a su nacimiento.", "LO QUE FALTA AHORA: el PROCESSETTO de Rende 1837. Los documentos 1 y 2 de la lista son las partidas de nacimiento de los dos novios, y el expediente las conserva. La de Francesco Giacomo (1809, Marano) es la pieza que lleva años faltando: no está en el registro civil de Marano de 1809, leído entero, así que ese extracto puede ser la única copia que quede."], "imgs": [{"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 2, "nImgs": 5, "titulo": "Empezó y acabó de pastor", "parrafos": ["Los papeles lo llaman casi siempre Giacomo Palermo, a secas; el «Francesco Giacomo» completo sólo sale en el matrimonio de su hija en 1858. Nació en Marano Marchesato hacia 1807, y esa fecha es una media de cifras que no cuadran entre sí: declaró veintisiete años en 1839, treinta y seis en octubre de 1841, treinta y ocho en febrero de 1845, cuarenta en enero de 1852, y su acta de defunción le pone sesenta en mayo de 1867. Cuatro de las cinco caen entre 1805 y 1812.", "El oficio va y viene con los años: pastore cuando inscribe a Antonio en 1841, bracciale en 1845 y en 1852, pecoraio —pastor de ovejas— cuando muere. Empieza y acaba con el ganado. Las contradas también se mueven: Palazzo en 1841, Langhi en 1845, Cerzi en 1852, todas dentro de Marano; y después el pueblo entero, porque la familia acabó instalada en Rende.", "Murió allí el 13 de mayo de 1867 a las cuatro de la tarde, en su casa, en una contrada que el acta escribe «Nocolitani» y que está en el límite de resolución del escaneo. El acta dice «marito di Carmina Volpintesta»: no murió viudo, ella le sobrevivió. Y añade que era «figlio del fu Giuseppe», sin nombrar a la madre.", "Quien firmaba el acta como oficial era Luigi Perugini, asesor en funciones. Nueve años antes, siendo alcalde de Rende, había sido él quien casó a su hija Maria Antonia con Michele Salerno."], "claves": [["Oficio", "pastore y pecoraio; bracciale en los años de en medio"], ["Nacido", "hacia 1807 en Marano Marchesato"], ["Contradas", "Palazzo, Langhi y Cerzi en Marano; luego Rende"], ["Sabía firmar", "no"], ["Muerte", "13 de mayo de 1867, a los 60 años"]]}, "carmina_volpintesta": {"id": "carmina_volpintesta", "nombre": "Carmina Volpintesta", "legal": "VOLPENTESTA en las actas de Marano; Volpintesta en las de Rende", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["salerno"], "resumen": "Mujer de Giacomo Palermo y madre de Maria Antonia. Nacida en Marano Marchesato en mayo de 1814, hija de Vincenzo Volpentesta y Teresa Luchetta. Quedó huérfana de padre a los ocho años y enviudó en Rende en mayo de 1867.", "datos": [["Nacimiento", "mayo de 1814, MARANO MARCHESATO — acta 41; el día se lee 12 con reserva (ver las notas del acta)"], ["Padres", "VINCENZO VOLPENTESTA, bracciale, 38 años, y TERESA LUCHETTA, 31 años — CONFIRMADOS de primera mano por su propia acta de nacimiento"], ["Cónyuge", "Francesco Giacomo Palermo, pecoraio († 13 de mayo de 1867)"], ["Matrimonio", "19 de octubre de 1837, RENDE — acta 20. CONSEGUIDA. Tenía 23 años y ya vivía en Rende; el acta la da hija del difunto Vincenzo y de Teresa Luchetta, exactamente lo que decía su partida de 1814"], ["Hijos documentados", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Hermano documentado", "EMMANUELE VOLPENTESTA, casado con Michelina Cairo, muerto en Marano en 1864 (acta 11 del índice)"], ["Huérfana de padre", "19 de marzo de 1823, a los ocho años y diez meses"], ["Viva aún en", "13 de mayo de 1867 — el acta de defunción de su marido dice «marito di», no «vedovo»"], ["Grafía", "Volpintesta en Rende; Volpentesta en las actas de Marano, incluida la suya"]], "vida": "1814–>1867", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "vincenzo_volpintesta", "madre": "teresa_luchetta", "conyuge": "francesco_giacomo", "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "mayo de 1814, 14 h — nació el mismo día del acta", "lugar": "Marano Marchesato", "ref": "acta 41", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile napoleonico > Marano Marchesato > Registro 6 «Nati» 1814"], ["Registro", "hash del contenedor: w1yyOoo"], ["Página", "24 de 64, columna DERECHA (a la izquierda, el acta 40)"], ["Año manuscrito", "el impreso dice «L'anno milleottocento TREDICI»; está tachado y corregido a mano a QUATTORDECI, 1814. Concuerda con el catálogo y con el acta 63 del mismo registro, de agosto de 1814"], ["Oficial", "Francesco Conforti, sindaco"], ["Cómo se localizó", "este registro NO cumple la recta de los de defunción. La página 41 tiene una sola acta, la 63; la 27 tiene dos, la 46 y la 47. En ese tramo va a dos por imagen y la 41 cae en la página 24"]], "literal": "…è comparso Vincenzo Volpentesta di anni trenta otto di professione Bracciale domiciliato nel detto comune… ed ha dichiarato che il giorno soprain[dicato]… è nato in sua casa da esso dichiarante e da Teresa Luchetta sua moglie legittima di anni trenta una, una femina che ci ha presentato… a cui si è dato il nome di CARMINA.", "traduccion": "El año mil ochocientos CATORCE, a (día) del mes de MAYO, a las CATORCE horas, ante Nos, FRANCESCO CONFORTI, alcalde y oficial del estado civil del municipio de MARANO MARCHESATO, provincia de Calabria Citra, ha comparecido VINCENZO VOLPENTESTA, DE TREINTA Y OCHO AÑOS, de profesión BRACCIALE, domiciliado en el dicho municipio.\n\nY ha declarado que el día ARRIBA INDICADO ha nacido EN SU CASA, de él mismo, el declarante, y de TERESA LUCHETTA, SU LEGÍTIMA ESPOSA, DE TREINTA Y UN AÑOS, UNA NIÑA que nos ha presentado, y A LA CUAL SE LE HA DADO EL NOMBRE DE CARMINA.\n\nLa presentación y declaración se ha hecho en presencia de GIOVANNI VINCIULLO, de veintiséis años, de profesión CONTADINO, domiciliado en el susodicho lugar, y de GIOVANNI ROSSO, de veintiocho años, también de profesión CONTADINO, domiciliado en la misma contrada, testigos.\n\nLa presente acta ha sido leída tanto al declarante como a los testigos, y después firmada por Nos y por el declarante: VINCENZO VOLPENTESTA.", "notas": ["SU FILIACIÓN YA NO DEPENDE DEL ACTA DE SU MARIDO. Hasta ahora Carmina era hija de Vincenzo sólo porque el acta de defunción de Giacomo Palermo (Rende, 1867) la llamaba «Carmina Volpintesta FU VINCENZO», y Teresa Luchetta no aparecía en ningún papel. Aquí el propio Vincenzo se presenta ante el alcalde, declara su edad y su oficio y nombra a su mujer. Es la fuente de primera mano.", "EL DÍA NO SE LEE CON CERTEZA, y conviene no fingir que sí. El número del día está partido por el salto de línea —termina en «...ce» al empezar el renglón siguiente— y el trozo que queda en el primer renglón está pisado por una anotación marginal muy posterior. Se lee «D...ce» y lo más probable con diferencia es DODECE, doce. Lo que sí es seguro: es MAYO DE 1814 y es POSTERIOR AL DÍA 10, porque el acta 40, en la misma abertura, es del día «Diece» a las dieciséis horas, y ésta se extendió a las catorce. Los ficheros van fechados 1814-05-12 con esa reserva.", "NO DA CONTRADA. El acta sólo dice que el padre está «domiciliato nel detto comune» y que la niña nació «in sua casa». Este formulario napoleónico no tiene casilla de contrada; los de la Restauración sí, y por eso de sus propios hijos sabemos las contradas Langhi y Cerzi.", "LAS EDADES DE LOS PADRES. Él treinta y ocho —nacido hacia 1776— y ella treinta y uno —hacia 1783—. Sus actas de defunción dan cincuenta años en 1823 (hacia 1773) y setenta y dos en 1851 (hacia 1779). Las dos parejas de cifras se llevan tres y cuatro años, que es lo normal: en estos registros nadie sabía su edad exacta.", "VINCENZO FIRMA. Al pie del acta está su firma, «Vincenzo Volpentesta», mientras que los dos testigos son iletrados. Un bracciale que sabe escribir su nombre en 1814 no es lo corriente.", "EL AÑO ESTABA MAL IMPRESO. El formulario venía preimpreso «L'anno milleottocento TREDICI» —1813— y el escribano lo tachó y escribió encima QUATTORDECI. Es el mismo cuaderno reaprovechado de un año para otro.", "Nació en mayo de 1814 y su padre murió en marzo de 1823: tenía ocho años y diez meses. Su madre, Teresa Luchetta, la crió viuda y vivió hasta 1851."], "imgs": [{"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Carmina%20Volpintesta%20-%20Marano%20Marchesato%20acta%2041.jpg", "t": "Carmina Volpintesta - Marano Marchesato acta 41"}, {"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Copia%20certificada%20de%201837%20del%20acta%2041%20-%20Marano%20Marchesato.jpg", "t": "Copia certificada de 1837 del acta 41 - Marano Marchesato"}], "zooms": [{"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20acta%2041%20completa.jpg", "t": "Acta 41 completa"}, {"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20cabecera%2C%20ano%201814%20y%20acta%2041.jpg", "t": "Cabecera, ano 1814 y acta 41"}, {"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20nombre%20impuesto%20Carmina.jpg", "t": "Nombre impuesto Carmina"}, {"u": "actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20padres%20Vincenzo%20Volpentesta%2038%20y%20Teresa%20Luchetta%2031.jpg", "t": "Padres Vincenzo Volpentesta 38 y Teresa Luchetta 31"}]}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "19 de octubre de 1837, 21 h", "lugar": "Rende", "ref": "acta 20", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni» 1837"], ["Registro", "ark an_ua35976844 · hash del contenedor: wbVEAb4 (28 imágenes)"], ["Página", "21 de 28 — folio 20 del libro; un acta por imagen, en la mitad derecha"], ["Oficial", "Mario Magdalone, sindaco de Rende"], ["Año manuscrito", "«mille ottocento trentasette» — coincide con el catálogo"], ["Cómo se localizó", "primero en el índice escaneado de matrimonios de Rende de 1837, fila 20; después el acta, acertando a la primera con la recta página = acta + 1"]], "literal": "…sono comparsi nella casa comunale FRANCESCO GIACOMO PALERMO di anni VENTOTTO, nato in MARANO MARCHESATO, professione PECORAJO, domiciliato ivi, figlio di GIUSEPPE, domiciliato ivi, di professione PECORAJO, e di CARMELA SPIZZIRRI, domiciliata ivi; e CARMINA VOLPENTESTA di anni VENTITRE, nata in MARANO MARCHESATO, domiciliata RENDE, figlia del FU VINCENZO, domiciliato ————, e di TERESA LUCHETTA, domiciliata ivi…", "traduccion": "El año mil ochocientos treinta y siete, el día DIECINUEVE del mes de OCTUBRE, a las VEINTIUNA horas, ante Nos, MARIO MAGDALONE, alcalde y oficial del Estado Civil del municipio de RENDE, distrito de Cosenza, provincia de Calabria Citra, han comparecido en la casa comunal:\n\nFRANCESCO GIACOMO PALERMO, DE VEINTIOCHO AÑOS, nacido en MARANO MARCHESATO, de profesión PECORAJO (pastor de ovejas), domiciliado allí, HIJO DE GIUSEPPE, domiciliado allí, de profesión PECORAJO, Y DE CARMELA SPIZZIRRI, domiciliada allí;\n\ny CARMINA VOLPENTESTA, DE VEINTITRÉS AÑOS, nacida en MARANO MARCHESATO, domiciliada en RENDE, HIJA DEL DIFUNTO VINCENZO y DE TERESA LUCHETTA, domiciliada allí.\n\nLa notificación de la promesa se fijó en la puerta de la casa comunal de Rende el día primero, domingo, de octubre, Y EN MARANO MARCHESATO el mismo día — en los dos pueblos, porque él era de Marano y ella vivía ya en Rende.\n\nDocumentos presentados: 1.º la partida de nacimiento del esposo; 2.º la de la esposa; 3.º el certificado de que el esposo es célibe y no está sujeto al vínculo militar; 4.º el de que la esposa es célibe; 5.º LA FE DE MUERTE DEL PADRE DE LA ESPOSA; 6.º LA FE DE MUERTE DE SU ABUELO PATERNO; 7.º la fe de muerte de su madre; 8.º el extracto de las notificaciones, contra las cuales no hubo oposición.\n\nCuatro testigos: SALVATORE PORRO, de treinta años, bracciale, de Rende; SALVATORE COSTABILE, de veintitrés, SARTORE (sastre); GIUSEPPE DE PAOLA, de veintiocho, FALEGNAME (carpintero); y FRANCESCO DE GENNARO, de treinta y tres, sartore. Todos de Rende.\n\n[Columna de la derecha] El párroco de SANTA MARIA MAGGIORE devolvió una de las copias, certificando al pie que la celebración canónica del matrimonio siguió el día VEINTE del mismo mes, ante los testigos IGNAZIO MANDARINO y PIETRO PERUGINI.", "notas": ["*** ESTA ES EL ACTA QUE CIERRA LA FILIACIÓN DE FRANCESCO GIACOMO. *** Hasta el 26 de agosto de 2026, que fuese hijo de Giuseppe Palermo y Carmina Spizzirri era una inferencia por convergencia: se apoyaba en el acta de su hermana Rosalia de 1838 y en la coincidencia de pueblo, nombre y oficio. Aquí lo dice su propia acta de boda. Por tanto ROSALIA y AQUILA PALERMO son sus hermanas de padre y de madre, y Carmina Spizzirri es bisabuela por línea directa sin ninguna reserva.", "Se buscó esta boda durante meses en MARANO MARCHESATO, y no está: nueve índices, de 1830 a 1838, ciento ochenta y tres bodas, ni un Palermo varón con ninguna Volpintesta. Estaba en RENDE. La lección, apuntada: cuando los dos novios son de un pueblo pero ella ya vive en otro, la boda se celebra donde vive ELLA. La notificación doble —Rende y Marano— lo dice en el propio acta.", "LA MADRE SE LLAMA «CARMELA» AQUÍ Y «CARMINA» EN TODO LO DEMÁS. Son variantes de la misma raíz y el escribano de Rende no la conocía. El padre, el pueblo y el oficio coinciden, así que no hay motivo para dudar de que sea la misma mujer, pero queda anotado.", "MICHELE VOLPINTESTA, CONFIRMADO POR ACTA. El documento número 6 es la fe de muerte del abuelo paterno de la novia: es Michele, el padre del difunto Vincenzo. Hasta ahora ese abuelo dependía del índice del blog y del índice del expediente; ahora lo respalda un acta original.", "EL PUNTO 7 CHIRRÍA, y conviene decirlo: pide la fe de muerte «della di lei madre», y la madre de la novia, Teresa Luchetta, aparece VIVA tres líneas más arriba en esta misma acta y no muere hasta 1851. Lo más probable es que sea formulario: la ley pedía acreditar quién debía dar el consentimiento —muerto el padre pasa al abuelo paterno, muerto éste a la madre— y el escribano copió la lista entera. NO tomarlo como indicio de otra madre.", "Las cinco actas de Marano encajan con ésta sin forzar nada: Vincenzo consta «fu» y murió en 1823; Teresa Luchetta consta viva y murió en 1851; Giuseppe y Carmela constan vivos y murieron en 1863 y 1864. Y los veintiocho años del novio dan 1809, que es exactamente el año que el índice del expediente atribuye a su nacimiento.", "LO QUE FALTA AHORA: el PROCESSETTO de Rende 1837. Los documentos 1 y 2 de la lista son las partidas de nacimiento de los dos novios, y el expediente las conserva. La de Francesco Giacomo (1809, Marano) es la pieza que lleva años faltando: no está en el registro civil de Marano de 1809, leído entero, así que ese extracto puede ser la única copia que quede."], "imgs": [{"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 1, "nImgs": 6, "titulo": "Treinta años, dos veces", "parrafos": ["No tiene acta propia y, sin embargo, aparece en cinco: los nacimientos de sus cuatro hijos —Maria Antonia en 1839, Antonio en 1841, Annunciata en 1845 y Teresa en 1852— y la defunción de su marido en 1867.", "Las edades que él declara de ella son un buen ejemplo de lo poco que valen estas cifras: treinta años en octubre de 1841, treinta otra vez en febrero de 1845 y treinta y cinco en enero de 1852. La sitúan en algún punto entre 1812 y 1817, y no más cerca.", "En mayo de 1867 estaba viva: el acta de defunción de su marido lo llama «marito di Carmina Volpintesta», no viudo. Y de paso dice «fu Vincenzo», con lo que su propio padre ya había muerto. El apellido se escribe Volpintesta en las actas de Rende y Volpentesta en las de Marano. Su nacimiento habría que buscarlo hacia 1815; el «de Rende» que le atribuye el índice de partida no lo confirma ninguna acta leída."], "claves": [["Nacida", "entre 1812 y 1817, lugar sin confirmar"], ["Aparece en", "cinco actas, ninguna suya"], ["Hijos documentados", "cuatro, entre 1839 y 1852"], ["Viva aún en", "mayo de 1867"]]}, "aquila_palermo": {"id": "aquila_palermo", "nombre": "Aquila Palermo", "legal": "«Rosalia Palermo» en su acta de matrimonio", "rol": "hermano", "rolNombre": "Hermano", "gen": 5, "ramas": ["salerno"], "resumen": "Hermana de Francesco Giacomo. Nació en Marano Marchesato el 22 de junio de 1821 y se casó allí mismo el 8 de diciembre de 1838, con diecisiete años. Durante meses figuró en este árbol como DOS mujeres —Aquila y Rosalia— porque los papeles la llaman de las dos maneras. Su expediente de boda demostró que era una sola.", "datos": [["Nacimiento", "22 de junio de 1821, a las 11 h, en casa de sus padres — Marano Marchesato, contrada Malvitani"], ["Nombre", "AQUILA en su partida, en la nota del párroco y en la portada de su expediente matrimonial. ROSALIA en el acta de matrimonio propiamente dicha. La misma mujer"], ["Padres", "Giuseppe Palermo, BRACCIALE, 40 años; y Carmina Spizzirri, 32 años"], ["Bautismo", "el mismo 22 de junio de 1821, parroquia de Marano"], ["Matrimonio", "8 de diciembre de 1838, Marano Marchesato — acta 19, con VINCENZO GAETANO SANTELLI, bracciale de 28 años"], ["Hermanos", "FRANCESCO GIACOMO PALERMO, probado por el acta de matrimonio de él (Rende 1837), que lo da hijo de los mismos dos. Y por índice: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) y Francesca (1823)"], ["Después de 1838", "*** YA NO ES NADA. *** El índice de difuntos de Marano de 1864 trae, en el acta 91, a GAETANA SANTELLI, «hija de Santelli, Vincenzo Gaetano y de Palermo, Aquila» — su hija. Veintiséis años de silencio rotos por una fila. Su propia defunción sigue sin localizar"]], "vida": "n.1821", "lug": "", "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": null, "hijos": [], "hermanos": ["francesco_giacomo"], "actas": [{"titulo": "Expediente matrimonial (processetto)", "tipo": "P", "tipoNombre": "Publicación", "fecha": "noviembre-diciembre de 1838", "lugar": "Marano Marchesato", "ref": "processetti 1838, expediente 19", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni, processetti» 1838"], ["Registro", "ark an_ua35968823 · hash del contenedor: Lollxnp (179 imágenes)"], ["Página", "157 a 162 de 179 — el expediente 19"], ["Contenido", "portada; partida del novio (Marano 1810, acta 10); PARTIDA DE LA NOVIA, que es el acta 34 de 1821; y defunción de la madre del novio (Marano 1816, acta 42)"]], "literal": "Comune di Marano Marchesato — Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO, di detta Comune.", "traduccion": "PORTADA DEL EXPEDIENTE: «Municipio de Marano Marchesato. Acta de solemne promesa de matrimonio entre VINCENZO GAETANO SANTELLI y AQUILA PALERMO, de dicho municipio.» Visto por el alcalde Luigi De Filippis, 16 de noviembre de 1838.\n\nDENTRO VAN CUATRO DOCUMENTOS:\n\n1. La partida de nacimiento del novio — Marano, acta 10 de 1810: Gennaro Santelli, bracciale de 24 años, del paraje llamado Pascalone, presenta un niño nacido el 5 de febrero de 1810 de su legítima mujer ANNA MARIA DI BARTOLO, y le impone los nombres de VINCENZO GAETANO.\n\n2. LA PARTIDA DE NACIMIENTO DE LA NOVIA — y es el ACTA 34 DE 1821, la de AQUILA: Giuseppe Palermo, de cuarenta años, bracciale, de la contrada Malvitani, presenta una niña nacida de Carmina Spizzirri, de treinta y dos, y le da el nombre de AQUILA.\n\n3. El acta de defunción de la madre del novio — Marano, acta 42 de 1816: ANNA MARIA DE BARTOLO, hija del difunto Francesco y esposa de Gennaro Santelli, de veinticuatro años, contadina, de la calle Pascalone, murió el 21 de agosto de 1816 en su propia casa. Declararon su muerte dos vecinos y parientes, Domenico y Raffaele Santelli.\n\n4. Las notificaciones, fijadas sin oposición.", "notas": ["*** ESTE EXPEDIENTE ES EL QUE DEMUESTRA QUE AQUILA Y ROSALIA SON LA MISMA MUJER. *** La portada la llama Aquila. Su partida la llama Aquila. Y el acta de matrimonio que sale de este mismo expediente la llama Rosalia. No hay dos hermanas: hay una mujer con dos nombres, el del registro y el de la casa.", "Y explica el enigma que llevaba meses abierto: ROSALIA PALERMO no aparece en ningún registro de nacidos de Marano entre 1809 y 1826, barridos año por año, PORQUE ESTÁ INSCRITA COMO AQUILA.", "La lección de método, y es la segunda vez en dos días: EL EXPEDIENTE VALE MÁS QUE EL ACTA. Primero fue el de Rende 1837, que sacó un bautismo de 1809 inexistente en el civil y una defunción de 1793. Ahora éste, que deshace una identidad equivocada. Pedir siempre el processetto.", "Del novio se saca de propina toda su rama: Vincenzo Gaetano Santelli, nacido el 5 de febrero de 1810, hijo de Gennaro Santelli, bracciale, y de Anna Maria de Bartolo, que murió con veinticuatro años cuando él tenía seis. Vivían en el paraje de Pascalone."], "imgs": [{"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20la%20partida%20de%20la%20novia%20es%20el%20acta%2034%20de%20Aquila.jpg", "t": "Expediente 19, la partida de la novia es el acta 34 de Aquila"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20muerte%20de%20la%20madre%20del%20novio%2C%201816%20acta%2042.jpg", "t": "Expediente 19, muerte de la madre del novio, 1816 acta 42"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20partida%20del%20novio%2C%201810%20acta%2010.jpg", "t": "Expediente 19, partida del novio, 1810 acta 10"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20portada%3A%20Santelli%20ed%20AQUILA%20PALERMO.jpg", "t": "Expediente 19, portada: Santelli ed AQUILA PALERMO"}], "zooms": []}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "8 de diciembre de 1838, 21 h", "lugar": "Marano Marchesato", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni» 1838"], ["Registro", "hash del contenedor dam- : wlppqoW (25 páginas)"], ["Página", "20 de 25 — folio 19 del libro"], ["Oficial", "Luigi De Filippis, sindaco"], ["Año manuscrito", "«L'anno mille ottocento trentotto» — coincide con el catálogo"], ["Cómo se localizó", "por la «Tavola alfabetica» del final del registro, páginas 24 y 25, fila 19"]], "literal": "…sono comparsi nella casa comunale VINCENZO GAETANO SANTELLI di anni ventotto, nato in Marano suddetto, di professione bracciale, domiciliato ivi, figlio di GENNARO di professione bracciale domiciliato ivi, e di FU ALMA MARIA DI BARTOLO; e ROSALIA PALERMO di anni diciassette, nata in Marano medesimo, domiciliata ivi, figlia di GIUSEPPE di professione PASTORE domiciliato ivi, e di CARMINA SPIZZIRRI domiciliata col di lei marito…", "traduccion": "El año mil ochocientos treinta y ocho, el día ocho del mes de diciembre, a las veintiuna horas, ante Nos, LUIGI DE FILIPPIS, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, han comparecido en la casa comunal:\n\nVINCENZO GAETANO SANTELLI, DE VEINTIOCHO AÑOS, nacido en Marano, de profesión BRACCIALE (jornalero), domiciliado aquí, hijo de GENNARO, de profesión bracciale, domiciliado aquí, y de la DIFUNTA ALMA MARIA DI BARTOLO;\n\ny ROSALIA PALERMO, DE DIECISIETE AÑOS, nacida en Marano mismo, domiciliada aquí, HIJA DE GIUSEPPE, DE PROFESIÓN PASTORE, DOMICILIADO AQUÍ, Y DE CARMINA SPIZZIRRI, DOMICILIADA CON SU MARIDO.\n\nLos cuales, en presencia de los testigos que se indicarán, nos han pedido recibir su solemne promesa de celebrar ante la Iglesia, según las formas prescritas por el Sacro Concilio de Trento, el matrimonio entre ellos proyectado. La notificación de esta promesa fue fijada en la puerta de la casa comunal de Marano Marchesato el día dieciocho, domingo, del mes de noviembre del año corriente.\n\nDocumentos presentados: 1.º las actas de nacimiento del esposo y de la esposa; 2.º el acta de defunción de ALMA MARIA DI BARTOLO, madre del esposo. Consta además que el esposo no está ligado al vínculo militar, y que el esposo y la esposa son célibes. En el acto de las notificaciones no hubo impedimento alguno. Finalmente, EL PADRE DEL ESPOSO Y LOS PADRES DE LA ESPOSA han prestado oralmente su consentimiento.\n\nCuatro testigos intervinieron en la solemne promesa: ANTONIO CAIRA, de cincuenta años, bracciale, domiciliado en Marano; GIUSEPPE GENUITA, de treinta y seis años, MOLINARO (molinero); MICHELE SCOLA, de cincuenta años, bracciale; y SAVERIO VITIELI, de veintiséis años, bracciale. Los contrayentes y los testigos han declarado NO SABER ESCRIBIR.\n\n[Columna de la derecha] El párroco de Marano nos ha remitido una de las copias de la susodicha promesa; al pie de la cual ha certificado que la celebración del matrimonio se ha seguido el día OCHO del mes de DICIEMBRE del año corriente, en presencia de los testigos GIUSEPPE MARRONE y GASPARE BARTUCCI.", "notas": ["ESTA ES EL ACTA QUE RESCATA A CARMINA SPIZZIRRI. Se fue a buscar a Marano de 1838 la boda de Giacomo Palermo con Carmina Volpintesta y no está —el índice del año, con sus veintiuna bodas, no trae ningún Palermo varón ni ninguna Volpentesta—. Pero en la fila 19 había una novia Palermo «di Giuseppe», y el acta la desarrolla nombrando a los dos padres.", "Giuseppe Palermo aparece VIVO y con oficio: PASTORE. Es el mismo oficio de su presunto hijo Giacomo, que fue pastore en 1841 y murió pecoraio en 1867. La coincidencia de pueblo, nombre y oficio es lo que sostiene el parentesco.", "Carmina Spizzirri aparece VIVA, «domiciliata col di lei marito». Es la primera vez que su nombre sale de un documento original.", "Los dos «fu» del acta son del lado del novio, no del nuestro: el muerto es Alma Maria di Bartolo, madre de Vincenzo Santelli. Del lado Palermo no hay ningún «fu», y por eso sabemos que los dos padres de Rosalia vivían.", "LO QUE NO DICE, y hay que ser honestos: no dice que Rosalia sea hermana de Francesco Giacomo. Nadie la ha visto nombrada en ninguna acta de la familia de Rende. El parentesco es una inferencia por convergencia, muy fuerte pero inferencia. Se cerraría con el nacimiento de Francesco Giacomo (Marano, hacia 1807) o con el de la propia Rosalia (Marano, hacia 1821): los dos nombrarían a la misma pareja.", "Nota de resolución: los escaneos de Marano son de 2164 × 1900 píxeles, que es su tamaño original; los recortes archivados se pidieron al servidor en esas mismas coordenadas y no están reescalados.", "*** RECTIFICACIÓN DEL 26 DE AGOSTO DE 2026, POR LA TARDE: AQUILA Y ROSALIA SON LA MISMA MUJER. *** Por la mañana se había concluido lo contrario, y con un razonamiento que parecía sólido: el acta 34 de 1821 impone UN SOLO nombre, AQUILA, y lo repiten la nota del párroco y la tabla anual del registro. De ahí se dedujo que Rosalia tenía que ser otra hermana. Era una deducción, no una prueba, y estaba equivocada.\n\nLo zanjó el EXPEDIENTE DE SU PROPIA BODA —Marano Marchesato, processetti 1838, expediente 19, páginas 157 a 162—. La portada dice, con todas las letras: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». Y la partida de nacimiento que la novia presentó, cosida dentro del legajo, ES EL ACTA 34 DE 1821, la de Aquila.\n\nEs decir: el expediente la llama Aquila, su partida la llama Aquila, y el acta de matrimonio que sale de ese mismo expediente la llama Rosalia. El escribano usó el nombre por el que la conocían en el pueblo. Y eso explica de una vez el enigma que llevaba meses abierto: ROSALIA PALERMO NO APARECE EN NINGÚN REGISTRO DE NACIDOS DE MARANO ENTRE 1809 Y 1826 —barridos año por año— PORQUE ESTÁ INSCRITA COMO AQUILA."], "imgs": [{"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20Vincenzo%20Santelli%20y%20Rosalia%20Palermo%20-%20Marano%20Marchesato%20acta%2019.jpg", "t": "Vincenzo Santelli y Rosalia Palermo - Marano Marchesato acta 19"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%201%20a%2010.jpg", "t": "Indice alfabetico 1838 - actas 1 a 10"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%2011%20a%2021.jpg", "t": "Indice alfabetico 1838 - actas 11 a 21"}], "zooms": [{"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20celebracion%20canonica%20y%20testigos.jpg", "t": "Celebracion canonica y testigos"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20documentos%20presentados.jpg", "t": "Documentos presentados"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20novios%2C%20edades%20y%20oficios.jpg", "t": "Novios, edades y oficios"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20padres%20de%20la%20novia%20Giuseppe%20Palermo%20y%20Carmina%20Spizzirri.jpg", "t": "Padres de la novia Giuseppe Palermo y Carmina Spizzirri"}]}, {"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "22 de junio de 1821, 19 h (el acta); nació el mismo día a las 11 h", "lugar": "Marano Marchesato", "ref": "acta 34", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 13 «Nati» 1821"], ["Registro", "hash del contenedor: 5gZZmB2 (53 páginas)"], ["Página", "19 de 53, columna IZQUIERDA (a la derecha, el acta 35)"], ["Año manuscrito", "va IMPRESO en el formulario del Reino de las Dos Sicilias: «L'anno mille ottocento ventuno». Coincide con el catálogo"], ["Oficial", "Fedele Turco, sindaco y oficial del estado civil"], ["Cómo se localizó", "sondeo en la página 18 = actas 32 y 33; la recta acta = 2 × página − 4 pone la 34 en la página 19"], ["Tabla anual", "el registro trae una «Tavola annuale alfabetica de' nati» en la página 44, con las actas 19 a 54; la fila 34 dice «Aquila | Giuseppe Palermo | 22 detto»"]], "literal": "…è comparso [il Signor, tachado] GIUSEPPE PALERMO di anni QUARANTA di professione BRACCIALE domiciliato in Marano, Contrada Malvitani, e ci ha presentato una bambina; secondo che abbiamo ocularmente riconosciuto, e ci ha dichiarato che la stessa è nata da CARMINA SPIZZIRRI d'anni TRENTADUE domiciliata con esso, e da lui dichiarante di professione come sopra domiciliato come sopra, nel giorno VENTIDUE del mese di sopra detto anno corrente all'ore UNDICI nella Casa di sua abitazione. — Ha in oltre dichiarato di dare alla Bambina il Nome di AQUILA ———", "traduccion": "El año mil ochocientos veintiuno, el día VEINTIDÓS del mes de JUNIO, a las DIECINUEVE horas, ante Nos, FEDELE TURCO, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, ha comparecido GIUSEPPE PALERMO, DE CUARENTA AÑOS, de profesión BRACCIALE (jornalero), domiciliado en Marano, CONTRADA MALVITANI.\n\nY nos ha presentado una niña, según hemos reconocido con nuestros propios ojos, y nos ha declarado que la misma ha nacido DE CARMINA SPIZZIRRI, DE TREINTA Y DOS AÑOS, domiciliada con él, y de él mismo, el declarante, de profesión como arriba y domiciliado como arriba, el día VEINTIDÓS del mes arriba dicho del año corriente, A LAS ONCE HORAS, EN LA CASA DE SU HABITACIÓN.\n\nHA DECLARADO ADEMÁS DAR A LA NIÑA EL NOMBRE DE AQUILA. ———\n\nLa presentación y declaración susodicha se ha hecho en presencia de GABRIELE DE SPOSITO (lectura del apellido dudosa), de cuarenta años, de profesión MURATORE (albañil), domiciliado en Marano, contrada Langhi; y de GIUSEPPE SCOLA, de sesenta años, de profesión bracciale, domiciliado en Marano, contrada Palazzo, testigos que han intervenido en el presente acto y han sido elegidos por el propio declarante.\n\n[Columna de la derecha] El párroco de la iglesia de Marano nos ha devuelto el notamento que le habíamos remitido, certificando al pie que el Sacramento del Bautismo ha sido administrado a dicha niña, LLAMADA AQUILA PALERMO, el día VEINTIDÓS del indicado mes.", "notas": ["*** SE FUE A ESTE ACTA A PREGUNTARLE SI ERA ROSALIA, Y LA RESPUESTA ES NO. *** La hipótesis era razonable: en estos registros se imponen a menudo dos o tres nombres de pila y el índice recoge sólo uno, así que «Aquila Rosalia» habría cerrado de un golpe el nacimiento de Rosalia Palermo, la novia de 1838. El acta dice AQUILA y nada más: la raya del impreso queda rellena con un trazo largo que no deja sitio a un segundo nombre.\n\n*** RECTIFICACIÓN DEL 26 DE AGOSTO DE 2026, POR LA TARDE: AQUILA Y ROSALIA SON LA MISMA MUJER. *** Por la mañana se había concluido lo contrario, y con un razonamiento que parecía sólido: el acta 34 de 1821 impone UN SOLO nombre, AQUILA, y lo repiten la nota del párroco y la tabla anual del registro. De ahí se dedujo que Rosalia tenía que ser otra hermana. Era una deducción, no una prueba, y estaba equivocada.\n\nLo zanjó el EXPEDIENTE DE SU PROPIA BODA —Marano Marchesato, processetti 1838, expediente 19, páginas 157 a 162—. La portada dice, con todas las letras: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». Y la partida de nacimiento que la novia presentó, cosida dentro del legajo, ES EL ACTA 34 DE 1821, la de Aquila.\n\nEs decir: el expediente la llama Aquila, su partida la llama Aquila, y el acta de matrimonio que sale de ese mismo expediente la llama Rosalia. El escribano usó el nombre por el que la conocían en el pueblo. Y eso explica de una vez el enigma que llevaba meses abierto: ROSALIA PALERMO NO APARECE EN NINGÚN REGISTRO DE NACIDOS DE MARANO ENTRE 1809 Y 1826 —barridos año por año— PORQUE ESTÁ INSCRITA COMO AQUILA.", "Y NO PUEDEN SER LAS DOS DE 1821. Aquila nació el 22 de junio; una hermana entera no cabe ni antes ni después dentro del mismo año civil. Rosalia, que declaró diecisiete años en diciembre de 1838, tiene que ser de 1820 — sus diecisiete encajan igual de bien con un nacimiento a finales de aquel año. El registro de NATI 1820 de Marano Marchesato es el objetivo inmediato.", "*** LA EDAD DE CARMINA SPIZZIRRI, QUE ERA LO QUE MÁS FALTA HACÍA. *** «nata da CARMINA SPIZZIRRI D'ANNI TRENTADUE»: treinta y dos años en junio de 1821, o sea nacida hacia 1789. Su acta de defunción de 1864 le daba setenta, o sea 1794, y con esa cuenta habría tenido trece años al nacer Francesco Giacomo (hacia 1807) — el hijo por el que desciende esta familia. Con 1789 tendría dieciocho, y la objeción se cae. Los cinco años de diferencia entre las dos declaraciones son de lo más normal, pero la de 1821 es mucho más fiable: la da su propio marido a los pocos días del parto, y no unos vecinos ante un cadáver cuarenta y tres años después.", "OJO: esto no PRUEBA que Francesco Giacomo sea hijo de Carmina. Sigue sin haber ningún documento que los nombre juntos. Lo que hace es quitar de en medio la única objeción seria que había —la cronológica—, y con ella la necesidad de suponerle a Giuseppe Palermo un matrimonio anterior.", "LA EDAD DEL PADRE SE MUEVE EN SENTIDO CONTRARIO. Aquí tiene CUARENTA años, o sea nacido hacia 1781; su acta de defunción de 1863 le daba noventa, o sea 1773. Ocho años de diferencia. Los noventa de un acta de defunción son casi siempre una redonda de vecinos; los cuarenta los dice él. Giuseppe Palermo es con toda probabilidad de hacia 1781, y no el patriarca de noventa años que parecía.", "EL OFICIO CAMBIA TRES VECES: BRACCIALE en 1821, PASTORE en el matrimonio de Rosalia de 1838, y de nuevo bracciale al morir en 1863. No son tres hombres: en 1821 ya está casado con Carmina Spizzirri, y eso lo fija. En Marano un jornalero podía pasar años guardando ovejas y volver al jornal.", "LA CONTRADA ES MALVITANI, que es un dato nuevo. En 1838 el acta de Rosalia no dice contrada, y en 1863 y 1864 tampoco. Es la única dirección conocida de esta familia en Marano.", "DETALLE DE CLASE: el impreso dice «è comparso IL SIGNOR ———» y el escribano TACHA «il Signor» antes de escribir Giuseppe Palermo. En el mismo registro se lo deja puesto a otros. No era un señor, era un bracciale, y el escribano lo corrigió.", "LA TABLA ANUAL DEL REGISTRO es un hallazgo aparte y queda archivada: «TAVOLA annuale alfabetica de' nati in questo comune dell'anno 1821», página 44, con las actas 19 a 54 — número de orden, nombre del nacido, nombre y apellido del PADRE y día. Entre la 19 y la 54 no hay ningún otro Palermo. AVISO PARA QUIEN VUELVA A ESTE CONTENEDOR: las páginas 45 a 53 no son de Marano ni de 1821, sino un legajo suelto de APRIGLIANO de 1819 encuadernado al final; el índice está en las páginas 43 y 44."], "imgs": [{"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20Aquila%20Palermo%20-%20Marano%20Marchesato%20acta%2034.jpg", "t": "Aquila Palermo - Marano Marchesato acta 34"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20tabla%20anual%20de%20nacidos%201821%20-%20actas%2019%20a%2054.jpg", "t": "Tabla anual de nacidos 1821 - actas 19 a 54"}], "zooms": [{"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20Giuseppe%20Palermo%2040%20anos%20y%20Carmina%20Spizzirri%2032%20anos.jpg", "t": "Giuseppe Palermo 40 anos y Carmina Spizzirri 32 anos"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20acta%2034%20completa.jpg", "t": "Acta 34 completa"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20parroco%20la%20bautiza%20Aquila%20Palermo.jpg", "t": "El parroco la bautiza Aquila Palermo"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20unico%20nombre%20impuesto%20es%20Aquila.jpg", "t": "El unico nombre impuesto es Aquila"}, {"u": "actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20tabla%20anual%2C%20fila%2034%20Aquila%20de%20Giuseppe%20Palermo.jpg", "t": "Tabla anual, fila 34 Aquila de Giuseppe Palermo"}]}], "nActas": 3, "nImgs": 18, "titulo": "", "parrafos": [], "claves": []}, "giovanni_chiappetta": {"id": "giovanni_chiappetta", "nombre": "Giovanni Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["salerno"], "resumen": "Jornalero nacido en Castrolibero hacia 1848. Se casó en Rende en 1873 y allí tuvo a Filomena. Todavía vivo, y sabiendo firmar, en 1910.", "datos": [["Nacimiento", "hacia 1848, CASTROLIBERO — declara 25 años cumplidos en octubre de 1873"], ["Padres", "Raffaele Chiappetta y Teresa Molinaro"], ["Oficio", "bracciale (jornalero); contadino en 1910"], ["Matrimonio", "19 de octubre de 1873, Rende — acta 32, con 25 años"], ["Cónyuge", "Angela Massei"], ["Hija", "Filomena Chiappetta (Rende, 11 de mayo de 1877)"], ["Vivo aún en", "30 de agosto de 1910 — declara la muerte de su nieta Angelina con 60 años, y FIRMA"]], "vida": "c.1848–>1910", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "Su acta de nacimiento no se ha localizado, pero desde agosto de 2026 se sabe dónde buscarla: el acta de su matrimonio (Rende, 1873, acta 32, en la ficha de esa unión) dice que nació en CASTROLIBERO —no en Rende— y que tenía veinticinco años cumplidos, o sea que nació hacia 1848. Aparece además en el nacimiento de Filomena (1877, con 29 años) y en la defunción de su nieta Angelina (1910, con 60 años, y firmando de su puño: sabía escribir, cosa rara en esta familia).", "padre": "raffaele_chiappetta", "madre": "teresa_molinaro", "conyuge": "angela_massei", "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "19 de octubre de 1873, 15 h", "lugar": "Rende", "ref": "acta 32", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Registro", "an_ua35985510 · hash 03ArRZ4"], ["Página", "17 de 19"], ["Oficial", "Vincenzo Martino, sindaco"], ["Año manuscrito", "«milleottocento settantatré» — coincide con el catálogo"]], "literal": "…sono comparsi Giovanni Chiappetta, di anni venticinque compiti, bracciale, nato a Castrolibero, qui residente, figlio di Raffaele bracciale, e di Teresa Molinaro, contadina, quivi residenti;\n\ned Angela Massei, di anni quindici compiti, contadina, nata a Castrolibero, qui residente, figlia di Domenico, bracciale, e di Carmina Ricchio, contadina, qui residenti;\n\nnon che i testimoni Antonio Loizzo o Guallatta, di anni quaranta, bracciale, e Santo Palermo fu Luigi, di anni ventisei, bracciale, qui domiciliati.", "traduccion": "El año mil ochocientos setenta y tres, el día diecinueve de octubre, en la casa comunal de Rende, circondario de Cosenza, provincia de Calabria Citerior, a las quince horas.\n\nAnte Nos, VINCENZO MARTINO, alcalde y Oficial del Estado Civil de dicho municipio, han comparecido:\n\nGIOVANNI CHIAPPETTA, de veinticinco años cumplidos, jornalero, NACIDO EN CASTROLIBERO, residente aquí, hijo de RAFFAELE, jornalero, y de TERESA MOLINARO, campesina, residentes aquí;\n\ny ANGELA MASSEI, de quince años cumplidos, campesina, NACIDA EN CASTROLIBERO, residente aquí, hija de DOMENICO, jornalero, y de CARMINA RICCHIO, campesina, residentes aquí;\n\nasí como los testigos Antonio Loizzo o Guallatta, de cuarenta años, jornalero, y Santo Palermo, hijo del difunto Luigi, de veintiséis años, jornalero, domiciliados aquí.\n\nLos dichos Chiappetta y Massei, en presencia de dichos testigos, me han hecho formal petición de que procediera a la celebración del matrimonio entre ellos proyectado, hechas ya las dos publicaciones los días veintiocho de septiembre último y cinco del corriente octubre, sin que se produjera oposición alguna, según resulta del certificado expedido por este Oficial del Estado Civil el día nueve de dicho octubre.\n\nAccediendo a tal petición, les he leído en presencia de los testigos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y recibida de los propios esposos, uno después del otro, la declaración de quererse tomar por marido y mujer, he pronunciado en nombre de la ley que GIOVANNI CHIAPPETTA y ANGELA MASSEI quedan legítimamente unidos en matrimonio.\n\nEl acta la firmo yo solo: los esposos y los testigos han declarado no saber escribir. — El Alcalde, Vincenzo Martino.", "notas": ["Este acta es la que hace subir el árbol un piso entero por el lado Chiappetta: da de golpe cuatro personas nuevas —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei y Carmina Ricchio— y dice que los cuatro estaban vivos.", "Que estaban vivos no es una suposición. El formulario de 1873 distingue con rigor: en el mismo acta llama a un testigo «Santo Palermo FU Luigi», y a los cuatro padres los da sin «fu» y como «residenti».", "LOS DOS NOVIOS NACIERON EN CASTROLIBERO. Es el hallazgo colateral: la rama Chiappetta viene del mismo pueblo del que venían Michele Salerno (De Rango) y Maria Palermo. Filomena ya nace en Rende, en 1877. Dos familias haciendo el mismo camino en los mismos años.", "EL APELLIDO ES MASSEI, NO MAZZEI. El índice del que se partió lo transcribe «Mazzei» y «Mazza»; el acta original, el nacimiento de Filomena (1877) y el matrimonio de 1894 escriben los tres MASSEI. Igual pasa con «Mulinaro», que en el acta es MOLINARO.", "El padre de la novia se llama sólo DOMENICO en el acta; el «Antonio» que le añadía el índice no está en el original.", "Ella tenía quince años cumplidos. Cuatro años después nacía Filomena, y veintiún años después Filomena se casaba a los dieciséis: dos generaciones seguidas de novias adolescentes.", "El apellido del primer testigo es de lectura dudosa. Está escrito con la fórmula de alias «X o Y»: lo más probable es «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "Sabía firmar", "parrafos": ["Nació en Castrolibero hacia 1848 y se casó en Rende el 19 de octubre de 1873, a las tres de la tarde, con Angela Massei. Él declaró veinticinco años cumplidos; ella, quince. Aquel día no firmó nadie: ni los novios ni los testigos sabían escribir, y el acta la rubrica sólo el sindaco Vincenzo Martino.", "En mayo de 1877 volvió a la casa comunal a inscribir a su hija Filomena: veintinueve años, jornalero, la niña nacida el día anterior a las nueve de la mañana en la contrada Soprano. Tres actas distintas —el matrimonio de 1873, ese nacimiento de 1877 y su comparecencia como testigo en 1891 con cuarenta y tres años— apuntan al mismo año de nacimiento. La cuarta, la de 1910, se desvía dos años.", "Y ahí está lo que lo distingue. El 30 de agosto de 1910 fue a declarar la muerte de su nieta Angelina, de ocho años, junto al tío de la niña. Al pie del acta consta que firman el declarante Chiappetta Giovanni y el testigo Vercillo Ferdinando; los demás declararon ser analfabetos. En una familia en la que no firma casi nadie —ni los novios de 1873, ni los de 1894, ni Francesco en ninguna de las nueve actas de sus hijos—, Giovanni Chiappetta sabía escribir su nombre."], "claves": [["Oficio", "bracciale, jornalero; contadino en 1910"], ["Nacido", "hacia 1848 en Castrolibero"], ["Sabía firmar", "sí — el único de la familia que lo hace"], ["Casado a los", "25 años"], ["Vivo aún en", "agosto de 1910, con 60 años declarados"]]}, "angela_massei": {"id": "angela_massei", "nombre": "Angela Massei", "legal": "Angela Massei (el índice la da como «Mazzei»)", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["salerno"], "resumen": "Nacida en Castrolibero hacia 1858. Se casó a los quince años recién cumplidos y fue madre de Filomena a los diecinueve.", "datos": [["Nacimiento", "hacia 1858, CASTROLIBERO — declara 15 años cumplidos en octubre de 1873"], ["Padres", "Domenico Massei y Carmina Ricchio"], ["Oficio", "contadina (campesina)"], ["Matrimonio", "19 de octubre de 1873, Rende — acta 32, con 15 años"], ["Cónyuge", "Giovanni Chiappetta"], ["Hija", "Filomena Chiappetta (Rende, 11 de mayo de 1877)"], ["Viva aún en", "1 de abril de 1894 — da su consentimiento en la boda de Filomena"]], "vida": "c.1858–>1894", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "Sin acta propia. Su matrimonio de 1873 (acta 32, en la ficha de esa unión) dice que nació en CASTROLIBERO y que tenía quince años cumplidos: nacida hacia 1858. Se casó, pues, con quince y tuvo a Filomena con diecinueve. En 1894 seguía viva: comparece a dar su consentimiento para la boda de su hija. El apellido: el acta de 1873 escribe MASSEI, igual que el nacimiento de Filomena en 1877 y el matrimonio de 1894; el índice del que se partió lo daba como «Mazzei» y como «Mazza».", "padre": "domenico_massei", "madre": "carmina_ricchio", "conyuge": "giovanni_chiappetta", "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "19 de octubre de 1873, 15 h", "lugar": "Rende", "ref": "acta 32", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Registro", "an_ua35985510 · hash 03ArRZ4"], ["Página", "17 de 19"], ["Oficial", "Vincenzo Martino, sindaco"], ["Año manuscrito", "«milleottocento settantatré» — coincide con el catálogo"]], "literal": "…sono comparsi Giovanni Chiappetta, di anni venticinque compiti, bracciale, nato a Castrolibero, qui residente, figlio di Raffaele bracciale, e di Teresa Molinaro, contadina, quivi residenti;\n\ned Angela Massei, di anni quindici compiti, contadina, nata a Castrolibero, qui residente, figlia di Domenico, bracciale, e di Carmina Ricchio, contadina, qui residenti;\n\nnon che i testimoni Antonio Loizzo o Guallatta, di anni quaranta, bracciale, e Santo Palermo fu Luigi, di anni ventisei, bracciale, qui domiciliati.", "traduccion": "El año mil ochocientos setenta y tres, el día diecinueve de octubre, en la casa comunal de Rende, circondario de Cosenza, provincia de Calabria Citerior, a las quince horas.\n\nAnte Nos, VINCENZO MARTINO, alcalde y Oficial del Estado Civil de dicho municipio, han comparecido:\n\nGIOVANNI CHIAPPETTA, de veinticinco años cumplidos, jornalero, NACIDO EN CASTROLIBERO, residente aquí, hijo de RAFFAELE, jornalero, y de TERESA MOLINARO, campesina, residentes aquí;\n\ny ANGELA MASSEI, de quince años cumplidos, campesina, NACIDA EN CASTROLIBERO, residente aquí, hija de DOMENICO, jornalero, y de CARMINA RICCHIO, campesina, residentes aquí;\n\nasí como los testigos Antonio Loizzo o Guallatta, de cuarenta años, jornalero, y Santo Palermo, hijo del difunto Luigi, de veintiséis años, jornalero, domiciliados aquí.\n\nLos dichos Chiappetta y Massei, en presencia de dichos testigos, me han hecho formal petición de que procediera a la celebración del matrimonio entre ellos proyectado, hechas ya las dos publicaciones los días veintiocho de septiembre último y cinco del corriente octubre, sin que se produjera oposición alguna, según resulta del certificado expedido por este Oficial del Estado Civil el día nueve de dicho octubre.\n\nAccediendo a tal petición, les he leído en presencia de los testigos los artículos ciento treinta, ciento treinta y uno y ciento treinta y dos del Código Civil, y recibida de los propios esposos, uno después del otro, la declaración de quererse tomar por marido y mujer, he pronunciado en nombre de la ley que GIOVANNI CHIAPPETTA y ANGELA MASSEI quedan legítimamente unidos en matrimonio.\n\nEl acta la firmo yo solo: los esposos y los testigos han declarado no saber escribir. — El Alcalde, Vincenzo Martino.", "notas": ["Este acta es la que hace subir el árbol un piso entero por el lado Chiappetta: da de golpe cuatro personas nuevas —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei y Carmina Ricchio— y dice que los cuatro estaban vivos.", "Que estaban vivos no es una suposición. El formulario de 1873 distingue con rigor: en el mismo acta llama a un testigo «Santo Palermo FU Luigi», y a los cuatro padres los da sin «fu» y como «residenti».", "LOS DOS NOVIOS NACIERON EN CASTROLIBERO. Es el hallazgo colateral: la rama Chiappetta viene del mismo pueblo del que venían Michele Salerno (De Rango) y Maria Palermo. Filomena ya nace en Rende, en 1877. Dos familias haciendo el mismo camino en los mismos años.", "EL APELLIDO ES MASSEI, NO MAZZEI. El índice del que se partió lo transcribe «Mazzei» y «Mazza»; el acta original, el nacimiento de Filomena (1877) y el matrimonio de 1894 escriben los tres MASSEI. Igual pasa con «Mulinaro», que en el acta es MOLINARO.", "El padre de la novia se llama sólo DOMENICO en el acta; el «Antonio» que le añadía el índice no está en el original.", "Ella tenía quince años cumplidos. Cuatro años después nacía Filomena, y veintiún años después Filomena se casaba a los dieciséis: dos generaciones seguidas de novias adolescentes.", "El apellido del primer testigo es de lectura dudosa. Está escrito con la fórmula de alias «X o Y»: lo más probable es «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "Quince años cumplidos", "parrafos": ["El acta de su boda no deja lugar a la duda: «di anni quindici compiti», quince años cumplidos. Se casó el 19 de octubre de 1873, en la casa comunal de Rende, con Giovanni Chiappetta, jornalero de veinticinco. Los dos habían nacido en Castrolibero y los dos vivían ya en Rende; los cuatro padres estaban vivos y el acta los da como residentes en el pueblo.", "Tuvo a Filomena a los diecinueve, el 11 de mayo de 1877. Y veintiún años después, el 1 de abril de 1894, volvió a la misma casa comunal a dar su consentimiento para que su hija se casara con dieciséis. La misma escena, un año de diferencia.", "No sabía escribir, y su acta de nacimiento —hacia 1858, en Castrolibero— no se ha localizado. El apellido se escribe MASSEI en su matrimonio, en el nacimiento de Filomena y en la boda de 1894; el índice del que se partió lo da como «Mazzei» y también como «Mazza»."], "claves": [["Oficio", "contadina, campesina"], ["Nacida", "hacia 1858 en Castrolibero"], ["Casada a los", "15 años"], ["Madre a los", "19 años"], ["Sabía firmar", "no"]]}, "michele": {"id": "michele", "nombre": "Michele Salerno", "legal": "Michele Salerno di Rende", "rol": "directa", "rolNombre": "Línea directa", "gen": 6, "ramas": ["salerno"], "resumen": "Expósito. Hallado en el torno del hospicio de Cosenza el 3 de mayo de 1825. Jornalero. Usó tres apellidos a lo largo de su vida y no tuvo ninguno propio.", "datos": [["Nacimiento", "3 de mayo de 1825, Cosenza — acta 254"], ["Condición", "expósito: sin padres inscritos"], ["Nombre impuesto", "Michele Salerno di Rende"], ["Oficio", "bracciale (jornalero)"], ["Matrimonio", "22 de agosto de 1858, Rende — acta 19"], ["Cónyuge", "Maria Antonia Palermo"], ["Vivo aún en", "5 de noviembre de 1910 — figura sin «fu» y residente en Rende en la boda de su hijo Domenico, con 85 años"], ["Defunción", "sin localizar — posterior a noviembre de 1910"]], "vida": "1825–1910", "lug": "Cosenza", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "maria_antonia", "hijos": ["domenico", "arcangela", "francesco", "giovanni"], "hermanos": [], "actas": [{"titulo": "Acta de nacimiento", "tipo": "N", "tipoNombre": "Nacimiento", "fecha": "3 de mayo de 1825, 15 h", "lugar": "Cosenza", "ref": "acta 254, folio 122 vuelto", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Hallada en", "Rende, Reg. 50 «Matrimoni, processetti» 1858, pág. 209 de 569"], ["Registro", "an_ua35977232 · hash LyxMQVl"], ["Copia expedida", "10 de agosto de 1858, Archivio Provinciale di Cosenza"]], "literal": "…un fanciullo involto in fascia bianca, e senza alcun segno al di lui corpo.\n\nLo stesso ha inoltre dichiarato di dare al bambino il nome\ndi  Michele Salerno di Rende", "traduccion": "El año mil ochocientos veinticinco, el día tres del mes de mayo, a las quince horas, ante Nos, FRANCESCO BARONE FERRERI, alcalde y oficial del estado civil del municipio de Cosenza, distrito de Cosenza, provincia de Calabria Citerior, ha comparecido el señor EMIDDIO CARLI, de cuarenta y un años, de profesión SIRVIENTE, domiciliado en Cosenza, contrada del Ospedale, y nos ha presentado un niño que hemos reconocido con nuestros propios ojos, declarando que el mismo ha nacido según el informe del capellán del hospicio, el señor don Gaetano Barra.\n\nDe dicho informe resulta que hoy, a las trece horas, fue hallado en el torno de la referida casa un niño envuelto en un paño blanco, y sin ninguna señal en su cuerpo.\n\nY Nos, Oficial del Estado Civil, en cumplimiento del artículo cincuenta y dos de las leyes civiles, después de haber transcrito el informe antedicho, lo hemos rubricado e inscrito en el volumen de los documentos al folio doscientos cincuenta y cuatro, y finalmente será depositado en el plazo que fija la ley en la Cancillería del Tribunal Civil.\n\nEl capellán ha declarado haber administrado el Santo Bautismo, y que se le impuso ese mismo día.\n\nEl mismo ha declarado además dar al niño el nombre de MICHELE SALERNO DI RENDE.\n\n[El apartado de testigos queda EN BLANCO. La columna de la derecha, reservada a la notificación del bautismo por parte de la parroquia, también queda EN BLANCO.]", "notas": ["«Senza alcun segno al di lui corpo» — sin ninguna señal en el cuerpo. No es un detalle de trámite: lo habitual era dejar al expósito con una prenda partida en dos, media moneda o una cinta, guardando la otra mitad para poder reclamarlo. La ausencia de señal significa que nadie pensaba volver.", "«Salerno» no lo adoptó de mayor: se lo impusieron el mismo día de su hallazgo. A los expósitos se les inventaba apellido, y con frecuencia se echaba mano de un topónimo.", "Quién le puso el nombre: no el cura ni el alcalde, sino el declarante. El formulario dice «Lo stesso ha inoltre dichiarato di dare al bambino il nome di…» — «el mismo», es decir Emiddio Carli, el sirviente del hospicio que lo llevó al ayuntamiento. El capellán Gaetano Barra lo había bautizado esa misma mañana; el alcalde sólo lo escribió.", "El acta dice Cosenza. El apéndice «di Rende» del nombre acabó leyéndose como lugar de nacimiento: en 1858 el alcalde de Castelfranco lo certifica como «esposito nativo di Rende». Michele no podía saber dónde había nacido."], "imgs": [{"u": "actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20Michele%20Salerno%20di%20Rende%20-%20Cosenza%20acta%20254.jpg", "t": "Michele Salerno di Rende - Cosenza acta 254"}], "zooms": [{"u": "actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20nombre%20impuesto.jpg", "t": "Nombre impuesto"}, {"u": "actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20relato%20del%20hallazgo%20en%20el%20torno.jpg", "t": "Relato del hallazgo en el torno"}]}, {"titulo": "Certificado del alcalde de Castelfranco", "tipo": "C", "tipoNombre": "Certificado", "fecha": "agosto de 1858", "lugar": "Castelfranco (hoy Castrolibero)", "ref": "documento del expediente matrimonial", "fuente": [["Hallado en", "Rende, Reg. 50 «Matrimoni, processetti» 1858"], ["Registro", "an_ua35977232 · hash LyxMQVl"]], "literal": "…esposito nativo di Rende…", "traduccion": "Certificado expedido por el alcalde de Castelfranco para el expediente matrimonial, en el que se describe a Michele como «expósito nativo de Rende».", "notas": ["Contradice al acta de 1825, que lo sitúa en el torno del hospicio de Cosenza. Es la prueba de cómo el «di Rende» de su nombre se convirtió en un lugar de nacimiento."], "imgs": [{"u": "actas/1825%20-%20Michele%20Salerno%20di%20Rende/1858-08%20C%20Certificado%20del%20alcalde%20de%20Castelfranco%20-%20esposito%20nativo%20di%20Rende.jpg", "t": "Certificado del alcalde de Castelfranco - esposito nativo di Rende"}], "zooms": []}, {"titulo": "Acta de matrimonio", "tipo": "M", "tipoNombre": "Matrimonio", "fecha": "22 de agosto de 1858, 14 h", "lugar": "Rende", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Rende > Registro 50"], ["Registro", "an_ua35977235"], ["Página", "20 de 51"]], "literal": "acta 19 | Michele Esposito Salerno | N/A\nacta 19 | Maria Antonia Palermo    | Palermo, Francesco Giacomo  Volpintesta, Carmina", "traduccion": "Matrimonio celebrado ante Luigi Perugini, alcalde de Rende. El novio figura como «Michele Esposito Salerno», de 33 años, con la casilla de padres en blanco por su condición de expósito. La novia, Maria Antonia Palermo, de 19 años, hija de Francesco Giacomo Palermo y de Carmina Volpintesta. En el expediente se conservan las partidas de nacimiento de ambos y el certificado del alcalde de Castelfranco.", "notas": ["Ese mismo año se casaron en Rende DOS hombres llamados Michele Salerno. El otro es el acta 3: Michele Salerno, hijo de Gaetano Salerno e Isabella Iorio, con Rosa Cundari. Cualquier buscador que cruce «Michele Salerno + Rende + 1858» devuelve al que no es.", "Aceptar al homónimo le pondría padres a un hombre que documentalmente no los tiene, y desviaría la rama entera."], "imgs": [{"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20Michele%20y%20Maria%20Antonia%20-%20Rende%20acta%2019%20-%20doble%20pagina.png", "t": "Michele y Maria Antonia - Rende acta 19 - doble pagina"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20processetti%20-%20transcripcion%20del%20acta%2019.jpg", "t": "Processetti - transcripcion del acta 19"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20registro%20de%20matrimonios%20-%20pagina.jpg", "t": "Registro de matrimonios - pagina"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20visor%20completo.png", "t": "Visor completo"}], "zooms": [{"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20datos%20de%20los%20novios.png", "t": "Datos de los novios"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20b.png", "t": "Documentos presentados b"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20c.png", "t": "Documentos presentados c"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados.png", "t": "Documentos presentados"}, {"u": "actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-
