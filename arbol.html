ESO YA ES UN RESULTADO. Se leyeron los índices de matrimonios parroquiales de Rende de TREINTA Y NUEVE años seguidos —1733 a 1750 y 1752 a 1772— y en ninguno se casa un Michele Volpintesta con una Tenuta. Queda UN SOLO HUECO, 1751, que es el único año que el blog no tiene. La otra explicación, más sencilla, es que se casaran EN LA PARROQUIA DE ELLA, que es lo normal, y entonces el acta está en otro pueblo de los alrededores."], "imgs": [{"u": "actas/1793%20-%20Michele%20Volpentesta/1793-08-20%20D%20Muerte%20de%20Michele%20Volpentesta%20-%20Rende%2C%20Santa%20Maria%20Maggiore.jpg", "t": "Muerte de Michele Volpentesta - Rende, Santa Maria Maggiore"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "antonio_luchetta": {"id": "antonio_luchetta", "nombre": "Gio: Antonio Luchetta", "legal": "«il fu Gio: Antonio» en el acta de 1851 — abreviatura de Giovanni Antonio", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Bracciale de Marano Marchesato, padre de Teresa Luchetta. Nacido hacia 1750-1760. Ya había muerto en junio de 1851.", "datos": [["Nacimiento", "hacia 1750-1760, presumiblemente MARANO MARCHESATO — su hija Teresa consta «nata in Marano suddetto»"], ["Oficio", "BRACCIALE (jornalero)"], ["Nombre", "el acta escribe «Gio: Antonio», la abreviatura corriente de GIOVANNI ANTONIO. El índice del blog lo daba sólo como «Antonio»"], ["Cónyuge", "MARIANNA CONFORTI, también difunta en 1851"], ["Hijos documentados", "TERESA LUCHETTA (hacia 1779 – 6 de junio de 1851), casada con Vincenzo Volpentesta; y un ANTONIO LUCHETTA casado con Caterina Cosentino, muerto en 1834 (acta 17 del índice de Marano)"], ["Defunción", "sin localizar — anterior a junio de 1851"], ["De dónde sale", "acta de defunción de su hija Teresa: Marano Marchesato, Morti 1851, acta 44"]], "vida": "c.1750–1851", "lug": "", "mapa": null, "sinacta": "CONFIRMADO POR ACTA en agosto de 2026, y por partida doble. El acta de defunción de su hija Teresa —Marano Marchesato, 6 de junio de 1851, acta 44, descargada y transcrita en la ficha de ella— dice «figlia del FU GIO: ANTONIO, di professione BRACCIALE, e della FU MARIANNA CONFORTI». Y el índice de defunciones de Marano de 1834, acta 17, trae un Antonio Luchetta «di Antonio e Conforti Marianna», casado con Caterina Cosentino: un hermano de Teresa, que confirma el matrimonio por una segunda vía independiente.\n\nSu acta propia habría que buscarla en los Morti de Marano Marchesato anteriores a junio de 1851. La serie está en Antenati desde 1822, así que si murió después de esa fecha es alcanzable; el barrido de índices de 1822 a 1867 ya hecho no lo encontró, lo que empuja su muerte a antes de 1822 y, con ella, a los libros parroquiales.", "padre": null, "madre": null, "conyuge": "marianna_conforti", "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marianna_conforti": {"id": "marianna_conforti", "nombre": "Marianna Conforti", "legal": "«la fu Marianna Conforti» en el acta de 1851", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 3, "ramas": ["salerno"], "resumen": "Madre de Teresa Luchetta. Nacida hacia 1750-1760, muerta antes de junio de 1851. Su nombre aparece en dos documentos distintos, cosa rara en esta genealogía.", "datos": [["Nacimiento", "hacia 1750-1760, presumiblemente Marano Marchesato"], ["Cónyuge", "Gio: Antonio Luchetta, bracciale, también difunto en 1851"], ["Hijos documentados", "TERESA LUCHETTA (hacia 1779 – 1851) y ANTONIO LUCHETTA († 1834)"], ["Defunción", "sin localizar — anterior a junio de 1851; el acta la llama «fu»"], ["Apellido", "CONFORTI es el apellido de los alcaldes de Marano de medio siglo: Francesco Conforti firma el nacimiento de Carmina en 1814, Ferdinando Conforti la defunción de Teresa en 1851 y Gioacchino Conforti la de Carmina Spizzirri en 1864. No hay parentesco probado con ninguno"], ["De dónde sale", "acta de defunción de su hija Teresa (Marano, Morti 1851, acta 44) y, por segunda vía, el índice de Morti de Marano de 1834, acta 17"]], "vida": "c.1750–1851", "lug": "", "mapa": null, "sinacta": "CONFIRMADA POR ACTA en agosto de 2026. El acta de defunción de su hija Teresa Luchetta —Marano Marchesato, 6 de junio de 1851, acta 44— la nombra con todas las letras: «e della FU MARIANNA CONFORTI». Es exactamente lo que daba el índice del blog, ahora respaldado por el documento. Y hay una segunda vía independiente: la defunción de 1834, acta 17, de un Antonio Luchetta «di Antonio e Conforti Marianna», hermano de Teresa.\n\nQue un acta de Marano nombre a la madre no es cosa que se pueda dar por descontada: el acta de Vincenzo Volpentesta de 1823 dejó esa casilla en blanco, y la de Carmina Spizzirri de 1864 dejó en blanco las dos. Aquí el escribano las rellenó, y con eso Teresa Luchetta pasó de no tener ningún papel a tener padre y madre en una sola línea.", "padre": null, "madre": null, "conyuge": "antonio_luchetta", "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_palermo": {"id": "giuseppe_palermo", "nombre": "Giuseppe Palermo", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Pastor y jornalero de Marano Marchesato, padre de Francesco Giacomo Palermo. Nació hacia 1773 y murió en su propia casa el 6 de marzo de 1863, con NOVENTA AÑOS. Su acta de defunción, leída en agosto de 2026, nombra por fin a sus padres: Lorenzo Palermo y Giulia Chiappetta.", "datos": [["Nacimiento", "hacia 1781, y no 1773, MARANO MARCHESATO — «nato in Marano medesimo». El acta de nacimiento de su hija Aquila (1821) le da CUARENTA años; los noventa de su acta de defunción de 1863 darían 1773. Ocho años de diferencia, y la cifra de 1821 la dice él mismo"], ["Padres", "LORENZO PALERMO y GIULIA CHIAPPETTA, los dos ya difuntos en 1863 — CONFIRMADOS por acta original desde agosto de 2026"], ["Oficio", "BRACCIALE en junio de 1821, al declarar el nacimiento de Aquila; PASTORE en diciembre de 1838, cuando casó a su hija Rosalia; BRACCIALE otra vez en su acta de defunción de 1863"], ["Domicilio", "Marano Marchesato, CONTRADA MALVITANI — la única dirección conocida de esta familia, y sale del acta de 1821"], ["Cónyuge", "CARMINA SPIZZIRRI, contadina († 11 de octubre de 1864) — confirmada por dos actas: la de Rosalia de 1838 y la suya propia de 1863"], ["Hijos documentados", "AQUILA, nacida el 22 de junio de 1821 y CONFIRMADA POR ACTA (Marano, acta 34), y ROSALIA, casada en 1838 y también confirmada por acta — Y SON LA MISMA MUJER: su expediente de boda de 1838 presenta el acta 34 de 1821 como partida de la novia. Por índice, además: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) y Francesca (1823). Y Francesco Giacomo, hijo suyo con seguridad"], ["Defunción", "6 de marzo de 1863, 8 h, en su propia casa — Marano Marchesato, acta 24"], ["Vivo en", "8 de diciembre de 1838, Marano Marchesato"]], "vida": "c.1781–1863", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "lorenzo_palermo", "madre": "giulia_chiappetta", "conyuge": "carmina_spizzirri", "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "6 de marzo de 1863, 16 h (el acta); murió a las 8 h", "lugar": "Marano Marchesato", "ref": "acta 24", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 55 «Morti» 1863"], ["Registro", "hash del contenedor: wRlVKnp"], ["Página", "14 de 85, columna IZQUIERDA (a la derecha, el acta 25)"], ["Año manuscrito", "«mille ottocento sessantatre» — coincide con el catálogo"], ["Oficial", "Costantino Belmonte, sindaco; canciller Salvadore Spizzirri"], ["Cómo se localizó", "dos actas por imagen y número de orden IMPRESO en la cabecera; la recta es acta = 2 × página − 4, y el primer sondeo, en la página 14, cayó justo en las actas 24 y 25"]], "literal": "…è morto nella propria sua casa GIUSEPPE PALERMO sposo di Carmina Spizzirri, nato in Marano medesimo, figlio di fu Lorenzo di professione ——— domiciliato ———, e di fu Giulia Chiappetta domiciliata ——— di anni novanta di professione Bracciale domiciliato ivi.", "traduccion": "El año mil ochocientos sesenta y tres, el día SEIS del mes de MARZO, a las dieciséis horas, ante Nos, COSTANTINO BELMONTE, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, han comparecido GIOVANNI CALDARAZZO, de cuarenta y tres años, de profesión PINTORE, del reino, domiciliado en Marano, y GAETANO ZICCARELLI, de cincuenta años, de profesión BRACCIALE, del reino, domiciliado allí mismo.\n\nLos cuales han declarado que el día SEIS del mes de MARZO del año corriente, a las OCHO horas, ha muerto EN SU PROPIA CASA GIUSEPPE PALERMO, ESPOSO DE CARMINA SPIZZIRRI, nacido en el mismo Marano, HIJO DEL DIFUNTO LORENZO —de profesión (en blanco), domiciliado (en blanco)— Y DE LA DIFUNTA GIULIA CHIAPPETTA, domiciliada (en blanco), DE NOVENTA AÑOS, de profesión BRACCIALE, domiciliado allí mismo.\n\nEn cumplimiento de las leyes nos hemos trasladado junto con dichos testigos hasta la persona difunta y hemos reconocido su muerte efectiva. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros, y leída a los declarantes, se ha firmado por Nos en el día, mes y año arriba señalados, mientras que los testigos han declarado NO SABER ESCRIBIR.", "notas": ["ES EL ACTA QUE AÑADE UNA GENERACIÓN POR EL LADO PALERMO. La defunción de su hijo Francesco Giacomo (Rende, 1867, acta 35) se cortaba en «figlio del fu Giuseppe» y no nombraba a la madre. Aquí, en cambio, el formulario de Marano rellena las dos casillas: LORENZO PALERMO y GIULIA CHIAPPETTA, los dos ya muertos en 1863. Confirma punto por punto lo que daba el índice del blog.", "NOVENTA AÑOS. Es la edad más alta de toda la genealogía y sitúa su nacimiento hacia 1773, en pleno Reino de Nápoles borbónico, treinta y seis años antes de que existiera el registro civil. Su partida de bautismo, si se conserva, está en la parroquia de S. Maria del Carmine de Marano.", "EL OFICIO CAMBIA, y no es un error. En 1838 el acta de matrimonio de su hija Rosalia lo llama PASTORE; aquí, veinticinco años después, BRACCIALE. A los noventa años ya no andaría con el ganado, y «bracciale» es la categoría por defecto del escribano de Marano. Su hijo Giacomo fue pecoraio toda la vida, que es lo mismo que pastore.", "LO QUE IDENTIFICA A ÉSTE Y NO A OTRO es «sposo di Carmina Spizzirri». En Marano conviven al menos ocho familias Palermo distintas; el nombre de pila solo no vale para nada.", "El primer declarante, Giovanni Caldarazzo, es PINTORE — pintor. Es un oficio poco común en estos registros, donde casi todo el mundo es bracciale o contadino."], "imgs": [{"u": "actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20Giuseppe%20Palermo%20-%20Marano%20Marchesato%20acta%2024.jpg", "t": "Giuseppe Palermo - Marano Marchesato acta 24"}], "zooms": [{"u": "actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20acta%2024%20completa.jpg", "t": "Acta 24 completa"}, {"u": "actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20hijo%20del%20fu%20Lorenzo%20y%20de%20la%20fu%20Giulia%20Chiappetta%2C%2090%20anos.jpg", "t": "Hijo del fu Lorenzo y de la fu Giulia Chiappetta, 90 anos"}]}], "nActas": 1, "nImgs": 3, "titulo": "De cuatro palabras a dos generaciones", "parrafos": ["Durante meses todo lo que se sabía de él cabía en cuatro palabras. El 14 de mayo de 1867, dos vecinos de Rende con oficio de pueblo —Pasquale Sacco, carretero, y Costantino Perugini, sastre— declararon la muerte de su hijo Giacomo Palermo, pastor de ovejas. La filiación del difunto se cerraba así: «figlio del fu Giuseppe». Nombre, y nada más. Ni la madre, ni el pueblo, ni la edad.", "En agosto de 2026 apareció su propia acta, y es de las que cambian un árbol entero. Murió el 6 de marzo de 1863 a las ocho de la mañana, en su propia casa de Marano Marchesato, y el acta 24 le pone *** NOVENTA AÑOS ***: la edad más alta de toda esta genealogía. Y nombra a sus padres —LORENZO PALERMO y GIULIA CHIAPPETTA, los dos ya difuntos—, con lo que la línea sube de golpe a gente nacida hacia 1740-1750, treinta años antes de que existiera el registro civil en Calabria.", "El oficio va y viene con los años, como el de su hijo: bracciale en junio de 1821, cuando declara el nacimiento de su hija Aquila; pastore en diciembre de 1838, cuando la casa; y bracciale otra vez al morir. La única dirección conocida de esta familia sale de aquel acta de 1821: contrada Malvitani, en Marano.", "Queda una discrepancia sin resolver, y conviene no taparla. Los noventa años de 1863 sitúan su nacimiento hacia 1773; pero en 1821, declarando él mismo, dijo tener cuarenta, lo que daría 1781. Ocho años de diferencia. La cifra de 1821 la dice él y la de 1863 la dicen dos vecinos, así que la primera es probablemente la buena."], "claves": [["Nacimiento", "hacia 1781 según él mismo en 1821; hacia 1773 según su acta de defunción"], ["Padres", "Lorenzo Palermo y Giulia Chiappetta — CONFIRMADOS por acta"], ["Oficio", "bracciale y pastore, según el año"], ["Domicilio", "contrada Malvitani, Marano Marchesato"], ["Defunción", "6 de marzo de 1863, a los noventa años — Marano, acta 24"]]}, "carmina_spizzirri": {"id": "carmina_spizzirri", "nombre": "Carmina Spizzirri", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Campesina de Marano Marchesato, mujer de Giuseppe Palermo. Nació hacia 1789 y murió viuda el 11 de octubre de 1864. Su acta de defunción se fue a buscar para sacarle los padres, y es el único documento del árbol que deja esas dos casillas deliberadamente en blanco; su edad la fija, mejor que esa acta, el nacimiento de su hija Aquila en 1821.", "datos": [["Nacimiento", "hacia 1789, MARANO MARCHESATO — «nata in Marano medesimo». Los 32 años que declara su marido en 1821 dan 1789; los 70 del acta de defunción de 1864 darían 1794. Se prefiere la primera cifra"], ["Padres", "*** NO SE SABEN ***. El acta de 1864 dice «figlia del fu ———» y «della fu ———», con los dos nombres en blanco. Lo único que prueba es que en octubre de 1864 los dos ya habían muerto"], ["Oficio", "CONTADINA (campesina)"], ["Cónyuge", "Giuseppe Palermo, pastore y bracciale († 6 de marzo de 1863)"], ["Hijas documentadas por acta", "AQUILA PALERMO, nacida el 22 de junio de 1821 (Marano, acta 34), y ROSALIA PALERMO, casada en diciembre de 1838 (acta 19). SON LA MISMA MUJER, no dos: lo demuestra su expediente de boda. Los índices de Marano le dan además otros hijos entre 1812 y 1823"], ["Viuda desde", "6 de marzo de 1863 — dieciocho meses de viudez"], ["Defunción", "11 de octubre de 1864, 11 h, en su propia casa — Marano Marchesato, acta 74"], ["Comprobado dos veces", "el 29 de agosto de 2026 se leyó también el índice de difuntos de Marano de 1864 en las transcripciones del blog calabrés: la fila del acta 74 trae sólo «Spizzirri» en la columna de padres, sin nombres, exactamente como el acta original. *** No hay error de nadie: los huecos están en el papel. *** La columna del cónyuge dice «Giuseppe Palermo», que es lo único que la identifica — porque en ese mismo índice hay OTRA Carmina Spizzirri, casada con un Giuseppe Pellegrino"]], "vida": "c.1789–1864", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "giuseppe_palermo", "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "12 de octubre de 1864, 15 h (el acta); murió el 11 a las 11 h", "lugar": "Marano Marchesato", "ref": "acta 74", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 56 «Morti» 1864"], ["Registro", "hash del contenedor: 0Aq9RaN"], ["Página", "39 de 60, columna IZQUIERDA (a la derecha, el acta 75)"], ["Año manuscrito", "«mille ottocento sessantaquattro» — coincide con el catálogo"], ["Oficial", "Gioacchino Conforti, sindaco; canciller Salvadore Spizzirri"], ["Cómo se localizó", "sondeo en la página 38 = actas 72 y 73; la recta acta = 2 × página − 4 pone la 74 en la página 39"]], "literal": "…è morta nella propria sua casa CARMINA SPIZZIRRI vedova di Giuseppe Palermo, nata in Marano medesimo, figlia del fu ————— di professione ——— domiciliato ———, e della fu ————— domiciliata ——— di anni settanta di professione Contadina domiciliata ivi.", "traduccion": "El año mil ochocientos sesenta y cuatro, el día DOCE del mes de OCTUBRE, a las quince horas, ante Nos, GIOACCHINO CONFORTI, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, han comparecido GIULIO DE LUCA, de cuarenta años, de profesión ARMIERE, del reino, domiciliado en Marano, y VINCENZO BELMONTE, de treinta y tres años, de profesión BRACCIALE, del reino, domiciliado allí mismo.\n\nLos cuales han declarado que el día ONCE del mes de OCTUBRE del año corriente, a las ONCE horas, ha muerto EN SU PROPIA CASA CARMINA SPIZZIRRI, VIUDA DE GIUSEPPE PALERMO, nacida en el mismo Marano, HIJA DEL DIFUNTO (nombre en blanco) —de profesión (en blanco), domiciliado (en blanco)— Y DE LA DIFUNTA (nombre en blanco), domiciliada (en blanco), DE SETENTA AÑOS, de profesión CONTADINA, domiciliada allí mismo.\n\nEn cumplimiento de las leyes nos hemos trasladado junto con dichos testigos hasta la persona difunta y hemos reconocido su muerte efectiva. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros, y leída a los declarantes, se ha firmado por Nos en el día, mes y año arriba señalados, mientras que los testigos han declarado no saber escribir.", "notas": ["SE FUE A ESTE ACTA A POR LOS PADRES, Y NO ESTÁN. Era el único sitio donde podían aparecer, porque el índice del blog no los da. La respuesta es negativa, pero es una negativa limpia y no una laguna de lectura: el impreso tiene las dos casillas, el escribano escribió los dos «fu» —«figlia DEL FU...», «e DELLA FU...»— y dejó los dos NOMBRES en blanco, con las rayas impresas sin rellenar. Sabía que estaban muertos y no sabía cómo se llamaban, o no se lo dijeron los declarantes.", "LO ÚNICO QUE SE SACA de esas dos líneas es que en octubre de 1864 el padre y la madre de Carmina ya habían muerto. Para los nombres ya sólo quedan los libros parroquiales de Marano anteriores a 1809 o su acta de matrimonio con Giuseppe Palermo, que es anterior a 1812 y por tanto también parroquial.", "*** ESTA NOTA QUEDÓ RESUELTA EL 26 DE AGOSTO DE 2026 — LÉASE SABIENDO CÓMO ACABA. *** El acta de nacimiento de su hija AQUILA (Marano, 22 de junio de 1821, acta 34) hace declarar a su marido que la madre tiene TREINTA Y DOS AÑOS. Eso la pone en 1789, no en 1794, y con 1789 tendría dieciocho años al nacer Francesco Giacomo, no trece. La objeción cronológica que sigue se cae. La edad de 1821 es mucho más fiable que la de 1864: la da su marido a los pocos días del parto; los setenta de 1864 los dieron un armero y un jornalero ante un cadáver.", "*** LA EDAD ABRE UN PROBLEMA SERIO [texto de agosto de 2026, antes de leer el acta de 1821]. *** Setenta años en octubre de 1864 la hacen nacer hacia 1794. Su marido, de noventa al morir en 1863, nació hacia 1773: veintiún años mayor. Y sobre todo, FRANCESCO GIACOMO PALERMO nació hacia 1805-1812 según las edades que él mismo fue declarando, con lo que Carmina habría tenido entre once y dieciocho años. Con los demás hijos la cosa encaja bien —Antonio Benedetto 1812, Francesca 1816, Vincenzo 1818, Aquila 1821, Francesca 1823: de los dieciocho a los veintinueve— pero Francesco Giacomo se queda fuera o justo al borde.", "CONSECUENCIA: que Carmina Spizzirri sea la MADRE de Francesco Giacomo deja de poder darse por bueno. Lo que sigue probado es que Giuseppe Palermo era su padre («figlio del fu Giuseppe», Rende 1867) y que Giuseppe estuvo casado con Carmina. Pero cabe perfectamente que Francesco Giacomo sea de un matrimonio ANTERIOR de Giuseppe, que hacia 1807 ya tenía treinta y tantos años. Lo resolvería el nacimiento de Francesco Giacomo (Marano, hacia 1807, parroquial) o el matrimonio de Giuseppe con Carmina.", "CIERRE DE ESA CONSECUENCIA: con los treinta y dos años de 1821, el matrimonio anterior de Giuseppe deja de hacer falta. Que Carmina sea la madre de Francesco Giacomo sigue sin estar probado —no hay documento que los nombre juntos— pero vuelve a ser lo más sencillo, y ya no choca con ninguna cuenta.", "El primer declarante, Giulio De Luca, es ARMIERE — armero. Otro oficio raro en un registro donde casi todos son bracciali."], "imgs": [{"u": "actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20Carmina%20Spizzirri%20-%20Marano%20Marchesato%20acta%2074.jpg", "t": "Carmina Spizzirri - Marano Marchesato acta 74"}], "zooms": [{"u": "actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20acta%2074%20completa.jpg", "t": "Acta 74 completa"}, {"u": "actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20filiacion%20en%20blanco%2C%20del%20fu%20y%20della%20fu%20sin%20nombres.jpg", "t": "Filiacion en blanco, del fu y della fu sin nombres"}]}], "nActas": 1, "nImgs": 3, "titulo": "El acta que se buscó y salió en blanco", "parrafos": ["Se fue a buscar su acta de defunción por una razón concreta: era el único sitio del mundo donde podían aparecer los nombres de sus padres. El índice del blog calabrés no los daba, y por encima de 1809 en Calabria no hay estado civil.", "El acta apareció —Marano Marchesato, 12 de octubre de 1864, acta 74— y la respuesta es negativa. El impreso dice «figlia del fu ———» y «della fu ———», con los dos nombres en blanco. *** Es el único documento de todo el árbol que deja esas dos casillas deliberadamente vacías. *** Lo único que prueba es que en octubre de 1864 su padre y su madre ya habían muerto.", "Y no es una laguna de lectura. El 29 de agosto de 2026 se comprobó por segunda vía: el índice de difuntos de Marano de 1864, transcrito por otra persona, trae en la fila del acta 74 sólo «Spizzirri» en la columna de padres, sin nombres, exactamente igual que el original. *** Los huecos están en el papel. ***", "Lo que el acta sí da, y no es poco, es su identidad. La columna del cónyuge dice «Giuseppe Palermo», y eso la fija sin margen de error — porque en ese mismo índice hay OTRA Carmina Spizzirri, casada con un Giuseppe Pellegrino. Murió el 11 de octubre de 1864 a las once de la mañana, en su casa, después de dieciocho meses de viudez.", "Su edad, en cambio, la fija mejor otro documento. El acta de 1864 le pone setenta años, que darían 1794; pero en junio de 1821 su marido declaró que ella tenía treinta y dos, lo que da 1789. Para los nombres de sus padres ya sólo quedan los libros parroquiales de Marano anteriores a 1809, o su acta de matrimonio."], "claves": [["Nacimiento", "hacia 1789 — la cifra de 1821, más fiable que la de su acta"], ["Padres", "*** SIGUEN SIN SABERSE ***: el acta deja las dos casillas en blanco"], ["Lo que sí prueba el acta", "que en octubre de 1864 sus dos padres ya habían muerto"], ["Cómo se la identifica", "por la columna del cónyuge: hay otra Carmina Spizzirri en el mismo índice"], ["Defunción", "11 de octubre de 1864, a los setenta años — Marano, acta 74"]]}, "vincenzo_volpintesta": {"id": "vincenzo_volpintesta", "nombre": "Vincenzo Volpintesta", "legal": "VOLPENTESTA en las actas de Marano; Volpintesta en las de Rende", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Jornalero de Marano Marchesato, padre de Carmina Volpintesta. Nació hacia 1773 y murió en su casa el 19 de marzo de 1823, con cincuenta años, cuando su hija Carmina tenía ocho. Su acta de defunción da el nombre de su padre: Michele.", "datos": [["Nacimiento", "hacia 1773, MARANO MARCHESATO — «nato in Marano suddetto». El acta de nacimiento de su hija, de 1814, le da treinta y ocho años, que apuntarían más bien a 1776; las edades declaradas son aproximadas"], ["Padres", "MICHELE VOLPENTESTA, bracciale, ya difunto en 1823 — CONFIRMADO por acta. La MADRE NO SE NOMBRA: esa casilla del acta quedó en blanco"], ["Oficio", "BRACCIALE (jornalero) — el mismo que su padre"], ["Cónyuge", "TERESA LUCHETTA († 6 de junio de 1851) — CONFIRMADA por acta desde agosto de 2026, por las dos puntas: él es «sposo di Teresa Luchetta» en 1823 y ella «vedova di Vincenzo Volpentesta» en 1851"], ["Hijos documentados", "CARMINA (12 de mayo de 1814), la que casó con Francesco Giacomo Palermo; y EMMANUELE, casado con Michelina Cairo, muerto en 1864 (acta 11 del índice de Marano)"], ["Defunción", "19 de marzo de 1823, 12 h, en su propia casa — Marano Marchesato, acta 8"]], "vida": "c.1773–1823", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "michele_volpintesta", "madre": null, "conyuge": "teresa_luchetta", "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "19 de marzo de 1823, 18 h (el acta); murió a las 12 h", "lugar": "Marano Marchesato", "ref": "acta 8", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 15 «Morti» 1823"], ["Registro", "hash del contenedor: 5Y44mlm"], ["Página", "6 de 33, columna IZQUIERDA (a la derecha, el acta 9)"], ["Año manuscrito", "«mille ottocento ventitre» — coincide con el catálogo"], ["Oficial", "Raffaele Ruffolo, sindaco"], ["Cómo se localizó", "este registro no lleva índice alfabético. Un sondeo en la página 5 dio las actas 6 y 7, de donde sale la recta acta = 2 × página − 4 y la 8 en la página siguiente"]], "literal": "…è morto nella propria sua casa VINCENZO VOLPENTESTA, nato in Marano suddetto, figlio del fu Michele di professione Bracciale domiciliato ———, e di ————— domiciliata ————— di anni cinquanta di professione Bracciale domiciliato ivi, e sposo di Teresa Luchetta.", "traduccion": "El año mil ochocientos veintitrés, el día DIECINUEVE del mes de MARZO, a las dieciocho horas, ante Nos, RAFFAELE RUFFOLO, alcalde y oficial del estado civil del Comune de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, han comparecido NICOLA ROSSO, de cuarenta años, de profesión BRACCIALE, del reino, domiciliado en Marano, y ANTONIO CAIRO, de treinta y ocho años, de profesión BRACCIALE, del reino, domiciliado allí mismo.\n\nLos cuales han declarado que el día DIECINUEVE del mes de MARZO del año corriente, a las DOCE horas, ha muerto EN SU PROPIA CASA VINCENZO VOLPENTESTA, nacido en el dicho Marano, HIJO DEL DIFUNTO MICHELE, de profesión BRACCIALE, domiciliado (en blanco), Y DE (nombre en blanco), domiciliada (en blanco), DE CINCUENTA AÑOS, de profesión BRACCIALE, domiciliado allí mismo, Y ESPOSO DE TERESA LUCHETTA.\n\nEn cumplimiento de las leyes nos hemos trasladado junto con dichos testigos hasta la persona difunta y hemos reconocido su muerte efectiva. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros, y leída a los declarantes, se ha firmado por Nos en el día, mes y año arriba señalados, y firmada con una CRUZ por los testigos, que son iletrados.", "notas": ["«E SPOSO DI TERESA LUCHETTA» ES LA LÍNEA QUE LO IDENTIFICA. En Marano viven a la vez al menos cuatro o cinco Vincenzo Volpintesta —uno casado con Arcangela Bartelli, otro con Rosa Mancino, otro hijo de Antonio y Francesca Morrone, otro hijo de Ferdinando y Anna Maria Tenuta—. El nombre suelto no vale; el cónyuge sí. Y encaja con el acta de nacimiento de Carmina de 1814, donde declara él mismo y nombra a Teresa Luchetta.", "EL PADRE, SÍ: «figlio del FU MICHELE di professione BRACCIALE». Confirma lo que daba el índice y añade el oficio, que se hereda: Michele bracciale, Vincenzo bracciale.", "LA MADRE, NO. El índice del blog daba a Vincenzo por hijo de Michele y de TERESA TENUTA. El acta tiene la casilla —«e di ————— domiciliata —————»— y el escribano la dejó vacía. Teresa Tenuta sigue, por tanto, sin ningún respaldo documental, y por eso no se le ha abierto ficha en este árbol. Ojo además con que en el mismo pueblo hay otro Vincenzo Volpintesta hijo de Ferdinando y de ANNA MARIA TENUTA: el apellido de esa madre es el mismo, y la familia no.", "CINCUENTA AÑOS al morir, o sea nacido hacia 1773. El acta de nacimiento de su hija Carmina, de mayo de 1814, le daba treinta y ocho, que darían 1776. Tres años de diferencia es lo normal en estos registros; ninguna de las dos cifras es un censo.", "MURIÓ JOVEN Y DEJÓ HUÉRFANA A CARMINA A LOS OCHO AÑOS. Ella nació en mayo de 1814 y él murió en marzo de 1823. Teresa Luchetta quedó viuda con treinta y tantos años y así siguió veintiocho años más, hasta 1851: en su acta de defunción todavía la llaman «vedova di Vincenzo Volpentesta».", "La cabecera del acta lleva el mes TACHADO —el escribano venía arrastrando «Febbrajo» de las actas anteriores— y corregido. El cuerpo del acta dice MARZO dos veces, sin duda.", "*** 29 DE AGOSTO DE 2026 — HA APARECIDO UN BAUTIZO QUE PODRÍA SER EL SUYO, Y HAY QUE CONTAR TAMBIÉN LO QUE NO CUADRA. *** Su padre Michele murió en RENDE en 1793, así que sus hijos tenían que estar bautizados allí. Los libros de bautizos de la parroquia de Rende empiezan en 1731 y están transcritos, año por año, en el blog calabrés que ya teníamos descargado en disco. Se barrieron. Y en el de 1770 está esto: RENDE, BAUTIZOS DE 1770, ACTA 48 — VINCENZO MERCURIO VOLPINTESTA, «Volpintesta, Michele — Tenuta, Teresa».\n\nEncaja en cuatro cosas: el nombre, el padre MICHELE —lo único que su acta de defunción dice de sus padres—, la madre TERESA TENUTA —que es justamente la casilla que esa acta dejó en blanco— y el pueblo. Y tiene dos hermanos en las mismas tablas: PIETRO GAETANO (bautizos de 1767, acta 13) y GREGORIO GIOACCHINO (bautizos de 1773, acta 41), los dos hijos de la misma pareja. La familia estaba en Rende en 1767, en 1770 y en 1773.\n\n*** PERO SU PROPIA ACTA DE DEFUNCIÓN DICE QUE NACIÓ EN MARANO: «nato in Marano suddetto». Y las edades no cuadran: la de 1823 le da cincuenta años (nacido hacia 1773) y el acta de su hija Carmina, de 1814, le da treinta y ocho (nacido hacia 1776). El bautizo es de 1770. *** Las dos lecturas honradas son: o es él, y las edades vienen redondeadas —las declararon dos jornaleros iletrados cincuenta y tres años después, y el «nacido en Marano» pudo ser una suposición del escribano—, o es un hermano mayor muerto de niño cuyo nombre se repitió, que era costumbre corriente. A favor de la primera: en los bautizos de Rende de 1774 a 1783, barridos uno a uno, NO hay ningún otro hijo de Michele y Teresa Tenuta ni un segundo Vincenzo; y de Marano no existen libros anteriores a 1809 en ningún sitio consultable.\n\n*** NO SE DA POR BUENO. *** Es una transcripción hecha por otra persona, no el libro. Y el libro no está en Antenati —el fondo de Rende empieza en 1809 y esto es parroquial de 1770—: está en una película de FamilySearch. Para comprobarlo hay que pedir allí los BAUTIZOS de la parroquia de RENDE (Cosenza), AÑO 1770, ACTA 48."], "imgs": [{"u": "actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20Vincenzo%20Volpintesta%20-%20Marano%20Marchesato%20acta%208.jpg", "t": "Vincenzo Volpintesta - Marano Marchesato acta 8"}], "zooms": [{"u": "actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20acta%208%20completa.jpg", "t": "Acta 8 completa"}, {"u": "actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20copia%20certificada%20de%201837%2C%20la%20madre%20sigue%20en%20blanco.jpg", "t": "Copia certificada de 1837, la madre sigue en blanco"}, {"u": "actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20hijo%20del%20fu%20Michele%2C%20edad%2050%20y%20esposo%20de%20Teresa%20Luchetta.jpg", "t": "Hijo del fu Michele, edad 50 y esposo de Teresa Luchetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "Cincuenta años, y el nombre de su padre", "parrafos": ["Entró en este árbol de refilón, en un acta que no era suya. La defunción de su yerno Giacomo Palermo (Rende, 14 de mayo de 1867) decía que era «marito di Carmina Volpintesta fu Vincenzo»: cuatro palabras escritas para otra cosa que probaban dos, que el padre de Carmina se llamaba Vincenzo y que ya había muerto.", "En agosto de 2026 apareció su acta propia y ya no hace falta el rodeo. Murió el 19 de marzo de 1823 a mediodía, en su casa de Marano Marchesato, con cincuenta años, cuando su hija Carmina tenía ocho. El acta 8 da su oficio —bracciale, jornalero— y el nombre de su padre: *** «figlio del FU MICHELE di professione BRACCIALE» ***. El oficio se heredaba: Michele bracciale, Vincenzo bracciale. La madre, en cambio, no se nombra: esa casilla quedó en blanco, como en tantas otras de la comarca.", "Hay un detalle que hace imprescindible esa acta y no otra. En Marano viven a la vez al menos cuatro o cinco Vincenzo Volpintesta —uno casado con Arcangela Bartelli, otro con Rosa Mancino, otro hijo de Antonio y Francesca—, y sin una línea que los distinga cualquiera valdría. La que lo identifica es «e sposo di TERESA LUCHETTA».", "Ella le sobrevivió veintiocho años y su propia acta, de 1851, lo llama «vedova di Vincenzo Volpentesta». El matrimonio queda confirmado por las dos puntas."], "claves": [["Nacimiento", "hacia 1773 según su acta; hacia 1776 según la de su hija en 1814"], ["Padre", "Michele Volpentesta, bracciale, ya difunto en 1823 — CONFIRMADO por acta"], ["Madre", "no se nombra: la casilla quedó en blanco"], ["Cómo se le distingue", "por su mujer: hay varios Vincenzo Volpintesta en Marano a la vez"], ["Defunción", "19 de marzo de 1823, a los cincuenta años — Marano, acta 8"]]}, "teresa_luchetta": {"id": "teresa_luchetta", "nombre": "Teresa Luchetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Campesina de Marano Marchesato, mujer de Vincenzo Volpentesta y madre de Carmina. Nació hacia 1779 y murió el 6 de junio de 1851, con setenta y dos años, después de veintiocho de viudez. Era, hasta agosto de 2026, la única persona del árbol sin un solo documento; ahora tiene acta propia y los dos padres nombrados.", "datos": [["Nacimiento", "hacia 1779, MARANO MARCHESATO — «nata in Marano suddetto», por los setenta y dos años que le da el acta de defunción. El acta de su hija, de 1814, le daba treinta y un años, que apuntarían a 1783"], ["Padres", "GIO: ANTONIO LUCHETTA, bracciale, y MARIANNA CONFORTI, los dos ya difuntos en 1851 — CONFIRMADOS por acta original desde agosto de 2026"], ["Oficio", "CONTADINA (campesina)"], ["Cónyuge", "VINCENZO VOLPENTESTA, bracciale († 19 de marzo de 1823) — CONFIRMADO por acta"], ["Hijos documentados", "CARMINA (12 de mayo de 1814) y EMMANUELE, casado con Michelina Cairo, muerto en 1864"], ["Viuda desde", "marzo de 1823 — veintiocho años de viudez"], ["Defunción", "6 de junio de 1851, 8 h, en su propia casa — Marano Marchesato, acta 44"]], "vida": "c.1779–1851", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "antonio_luchetta", "madre": "marianna_conforti", "conyuge": "vincenzo_volpintesta", "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "6 de junio de 1851, 15 h (el acta); murió a las 8 h", "lugar": "Marano Marchesato", "ref": "acta 44", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 43 «Morti» 1851"], ["Registro", "hash del contenedor: 5Y46Aky"], ["Página", "24 de 51, columna IZQUIERDA (a la derecha, el acta 45)"], ["Año manuscrito", "«mille ottocento cinquantuno» — coincide con el catálogo"], ["Oficial", "Ferdinando Conforti, sindaco — el mismo que inscribió a su nieta Teresa Palermo en enero de 1852"], ["Cómo se localizó", "sondeo en la página 23 = actas 42 y 43, con el número de orden impreso en la cabecera; la 44 cae en la página 24"]], "literal": "…è morta nella propria sua casa TERESA LUCHETTA, nata in Marano suddetto, figlia del fu Gio: Antonio di professione Bracciale domiciliato ———, e della fu Marianna Conforti domiciliata ——— di anni settantadue di professione Contadina domiciliata ivi, vedova di Vincenzo Volpentesta.", "traduccion": "El año mil ochocientos cincuenta y uno, el día SEIS del mes de JUNIO, a las quince horas, ante Nos, FERDINANDO CONFORTI, alcalde y oficial del Estado Civil del municipio de MARANO MARCHESATO, distrito de Cosenza, provincia de Calabria Citra, han comparecido IGNAZIO CONFORTI, de cincuenta años, de profesión BRACCIALE, del reino, domiciliado allí, y GIUSEPPE ZUPPO, de veintiocho años, de profesión BRACCIALE, del reino, domiciliado allí mismo.\n\nLos cuales han declarado que el día SEIS del mes de JUNIO del año corriente, a las OCHO horas, ha muerto EN SU PROPIA CASA TERESA LUCHETTA, nacida en el dicho Marano, HIJA DEL DIFUNTO GIO: ANTONIO, de profesión BRACCIALE, domiciliado (en blanco), Y DE LA DIFUNTA MARIANNA CONFORTI, domiciliada (en blanco), DE SETENTA Y DOS AÑOS, de profesión CONTADINA, domiciliada allí mismo, VIUDA DE VINCENZO VOLPENTESTA.\n\nEn cumplimiento de las leyes nos hemos trasladado junto con dichos testigos hasta la persona difunta y hemos reconocido su muerte efectiva. Hemos formado después la presente acta, que hemos inscrito sobre los dos registros, y leída a los declarantes, se ha firmado por Nos en el día, mes y año arriba señalados. Los testigos han declarado NO SABER ESCRIBIR.", "notas": ["ES LA MEJOR DE LAS CINCO ACTAS DE ESTA TANDA. Da el cónyuge, los dos padres, la edad y el oficio, todo en el mismo párrafo, y confirma punto por punto lo que hasta ahora era una línea de índice de blog sin ningún respaldo.", "DE NO TENER NADA A TENERLO TODO. En agosto de 2026 se había escrito de ella que era «el único de los cuatro ascendientes sin papeles que sigue exactamente igual que estaba» y que «de Teresa Luchetta no hay hoy absolutamente nada, sólo un nombre heredado de un índice de blog». Este acta lo cancela entero.", "«FIGLIA DEL FU GIO: ANTONIO». El acta escribe la abreviatura corriente de GIOVANNI ANTONIO, no un «Antonio» a secas como daba el índice. Y le pone oficio: bracciale.", "«E DELLA FU MARIANNA CONFORTI». La madre, con nombre y apellido. Que un acta de Marano nombre a la madre no es cosa segura: la de su marido Vincenzo, de 1823, dejó esa casilla en blanco, y la de Carmina Spizzirri, de 1864, dejó en blanco las dos.", "CUADRA POR UNA SEGUNDA VÍA. El índice de defunciones de Marano de 1834, acta 17, trae un ANTONIO LUCHETTA «di Antonio e Conforti Marianna», casado con Caterina Cosentino: un hermano suyo. Dos documentos independientes dando el mismo matrimonio de padres.", "SETENTA Y DOS AÑOS, o sea nacida hacia 1779. El acta de nacimiento de su hija Carmina, de mayo de 1814, le daba treinta y un años, que darían 1783. Cuatro años de diferencia, dentro de lo corriente. Enviudó hacia los cuarenta y cuatro y vivió viuda veintiocho años más.", "Murió siete meses antes de que naciera su bisnieta Teresa Palermo, a la que inscribió el mismo alcalde, Ferdinando Conforti, en enero de 1852."], "imgs": [{"u": "actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20Teresa%20Luchetta%20-%20Marano%20Marchesato%20acta%2044.jpg", "t": "Teresa Luchetta - Marano Marchesato acta 44"}], "zooms": [{"u": "actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20acta%2044%20completa.jpg", "t": "Acta 44 completa"}, {"u": "actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20hija%20del%20fu%20Gio%20Antonio%20y%20de%20la%20fu%20Marianna%20Conforti.jpg", "t": "Hija del fu Gio Antonio y de la fu Marianna Conforti"}]}], "nActas": 1, "nImgs": 3, "titulo": "De no tener nada a tenerlo todo", "parrafos": ["Su nombre venía de un solo sitio, y ese sitio resultó no existir. Se le atribuía una publicación matrimonial de Marano Marchesato de 1837, la de la boda de su hija Carmina con Francesco Giacomo Palermo. Se fue a buscarla y no está: el registro de 1837 lleva índice alfabético al final, con sus veinticinco bodas una por una, y no hay ni un Palermo ni una Volpintesta; el legajo de expedientes de ese año, de doscientas treinta y cinco páginas, corresponde exactamente a esas veinticinco y no deja sitio para una vigesimosexta. La boda estaba en Rende, no en Marano.", "Durante un tiempo fue, por tanto, la única persona del árbol sin un solo documento. Llegó a escribirse de ella que era «el único de los cuatro ascendientes sin papeles que sigue exactamente igual que estaba».", "*** Y entonces apareció su acta, que resultó ser la mejor de toda la tanda. *** Marano Marchesato, 6 de junio de 1851, acta 44. Murió a las ocho de la mañana en su propia casa, con setenta y dos años, después de veintiocho de viudez. En un solo párrafo el impreso da el cónyuge —«vedova di Vincenzo Volpentesta»—, la edad, el oficio de contadina y *** LOS DOS PADRES: GIO: ANTONIO LUCHETTA, bracciale, y MARIANNA CONFORTI ***, los dos ya difuntos. Es raro que estas actas nombren a la madre; ésta lo hace.", "Con eso entran al árbol dos nombres más de la generación de 1740-1760, y la que no tenía nada pasó a ser la que más aporta. Su propio nacimiento, hacia 1779, queda ya fuera de alcance por vía civil: sólo lo tendrían los libros de la parroquia de S. Maria del Carmine de Marano."], "claves": [["Nacimiento", "hacia 1779 según su acta; hacia 1783 según la de su hija en 1814"], ["Padres", "Gio: Antonio Luchetta y Marianna Conforti — CONFIRMADOS por acta"], ["Oficio", "contadina, campesina"], ["Viuda desde", "marzo de 1823 — veintiocho años de viudez"], ["Defunción", "6 de junio de 1851, a los setenta y dos años — Marano, acta 44"]]}, "raffaele_chiappetta": {"id": "raffaele_chiappetta", "nombre": "Raffaele Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Jornalero nacido en Castrolibero hacia 1805. Padre de Giovanni Chiappetta y, por tanto, bisabuelo de los Salerno de Argentina. Murió viudo en Rende, contrada Surdo, el 3 de diciembre de 1880, con setenta y cinco años, un año menos de doce meses después que su mujer.", "datos": [["Nacimiento", "hacia 1805, CASTROLIBERO — por los 75 años que le da el acta de defunción"], ["Padres", "Pietro Chiappetta, bracciante, que vivió y murió en Castrolibero; la madre NO consta en el acta, sólo que ya había muerto"], ["Oficio", "bracciale / bracciante (jornalero)"], ["Cónyuge", "Teresa Molinaro († 19 de diciembre de 1879) — muere «vedovo di» ella"], ["Hijos documentados", "Giovanni (hacia 1848); probablemente también Pasquale, que en 1883 declara 28 años, y Vincenzo y Pietro, testigos en Rende"], ["Residencia", "Rende, contrada Surdo"], ["Defunción", "3 de diciembre de 1880, 15 h, Rende — acta 135, con 75 años"]], "vida": "c.1805–1880", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "", "padre": "pietro_chiappetta", "madre": null, "conyuge": "teresa_molinaro", "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "3 de diciembre de 1880, 15 h", "lugar": "Rende", "ref": "acta 135", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 72 «Morti» 1880"], ["Registro", "hash del contenedor: LyxaZkV"], ["Página", "35 de 42"], ["Colocación", "columna derecha, mitad superior de la apertura"], ["Año manuscrito", "«milleottocento ottanta» — coincide con el catálogo"], ["Oficial", "Martino Vincenzo, asesor anciano por el alcalde"]], "literal": "…è morto Chiappetta Raffaele di anni settantacinque, di bracciante, residente in\nRende, nato in Castrolibero, da fu Pietro, bracciante, domiciliato in detto\nCastrolibero, e da fu ————, domiciliata in ————, vedovo di Molinaro Teresa.", "traduccion": "El año mil ochocientos ochenta, el día cuatro de diciembre, a las diez de la mañana, en la casa comunal.\n\nAnte mí, MARTINO VINCENZO, asesor anciano por el alcalde, Oficial del Estado Civil del municipio de Rende, han comparecido BRUNO SALVATORE, de treinta años, bracciante, domiciliado en Rende, y STELLATO ANDREA, de treinta y siete años, bracciante, domiciliado en Rende.\n\nLos cuales me han declarado que a las tres de la tarde de AYER, en la casa sita en CONTRADA SURDO, ha muerto CHIAPPETTA RAFFAELE, DE SETENTA Y CINCO AÑOS, de profesión BRACCIANTE (jornalero), residente en Rende, NACIDO EN CASTROLIBERO, HIJO DEL DIFUNTO PIETRO, bracciante, domiciliado en dicho Castrolibero, Y DE LA DIFUNTA ———— (el nombre queda en blanco), VIUDO DE MOLINARO TERESA.\n\nA este acto han estado presentes como testigos ROSSA LUIGI (lectura dudosa), de sesenta y seis años, MURATORE (albañil), y ROSSA GIUSEPPE, de treinta y siete años, bracciante, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado yo solo por ser ellos analfabetos. — Vincenzo Martino.", "notas": ["LA EDAD, QUE ES LO QUE SE BUSCABA. Setenta y cinco años el 3 de diciembre de 1880: nació hacia 1805, seguramente en 1805 y no más tarde. Es el ascendiente de nacimiento más antiguo alcanzado por esta línea después de Giuseppe Palermo.", "NACIÓ EN CASTROLIBERO. Se sospechaba por el matrimonio de su hijo Giovanni, que declaró haber nacido allí; el acta lo confirma directamente para el padre. La familia Chiappetta es de Castrolibero y sólo después baja a Rende.", "EL PADRE: PIETRO CHIAPPETTA, «fu Pietro, bracciante, domiciliato in detto Castrolibero». El índice ya lo daba y el acta original lo confirma, y además añade su oficio y que vivió en Castrolibero. El «fu» dice que había muerto antes de diciembre de 1880.", "LA MADRE SIGUE SIN NOMBRE. El formulario tiene su casilla —«e da ______ domiciliata in ______»— y el escribano escribió sólo «fu» y dejó el nombre en blanco. No es un descuido de lectura: en la misma línea del padre sí puso nombre y oficio. El dato no existe en el acta. Lo único que se saca es que ella también había muerto ya.", "«VEDOVO DI MOLINARO TERESA». Murió viudo: su mujer se le había adelantado once meses y medio, el 19 de diciembre de 1879. Y el apellido se escribe MOLINARO, no «Mulinaro».", "Los dos vivían en CONTRADA SURDO, la misma en la que morirá Carmina Ricchio tres años después. Las dos familias consuegras eran vecinas."], "imgs": [{"u": "actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20Raffaele%20Chiappetta%20-%20Rende%20acta%20135.jpg", "t": "Raffaele Chiappetta - Rende acta 135"}], "zooms": [{"u": "actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%2075%20anos%2C%20nacido%20en%20Castrolibero%2C%20hijo%20del%20fu%20Pietro.jpg", "t": "75 anos, nacido en Castrolibero, hijo del fu Pietro"}, {"u": "actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20acta%20135%20completa.jpg", "t": "Acta 135 completa"}, {"u": "actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20declarantes%20Bruno%20Salvatore%20y%20Stellato%20Andrea.jpg", "t": "Declarantes Bruno Salvatore y Stellato Andrea"}]}], "nActas": 1, "nImgs": 4, "titulo": "Once meses viudo", "parrafos": ["Nació en Castrolibero hacia 1805 —lo dicen los setenta y cinco años que le pone su acta de defunción— y es el antepasado de nacimiento más antiguo al que llega esta línea por documento. Jornalero, como su padre Pietro y como casi todos los hombres del árbol.", "Su mujer, Teresa Molinaro, murió el 19 de diciembre de 1879 en la contrada Surdo de Rende. Él murió en la misma contrada el 3 de diciembre de 1880, a las tres de la tarde, once meses y medio después; el acta lo llama «vedovo di Molinaro Teresa». Fueron a declararlo dos jornaleros del pueblo, Bruno Salvatore de treinta años y Stellato Andrea de treinta y siete. De testigos, un albañil de sesenta y seis y un jornalero de treinta y siete. No firmó nadie salvo el oficial, Vincenzo Martino.", "El acta nombra a su padre —«da fu Pietro, bracciante, domiciliato in detto Castrolibero»— y deja la casilla de la madre en blanco. De sus hijos, el documentado es Giovanni, nacido hacia 1848; probablemente también un Pasquale que en 1883 declara veintiocho años, y los Vincenzo y Pietro Chiappetta que aparecen de testigos en actas de la familia. Eso último es deducción por edades y apellido, no prueba."], "claves": [["Oficio", "bracciante, jornalero"], ["Nacido", "hacia 1805 en Castrolibero"], ["Contrada", "Surdo, en Rende"], ["Sabía firmar", "no"], ["Muerte", "3 de diciembre de 1880, a los 75 años"]]}, "teresa_molinaro": {"id": "teresa_molinaro", "nombre": "Teresa Molinaro", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Campesina nacida en Marano Principato hacia 1819, madre de Giovanni Chiappetta. Murió en Rende, contrada Surdo, el 19 de diciembre de 1879, con sesenta años. La muerte se la declaró su consuegro, Domenico Massei.", "datos": [["Nacimiento", "hacia 1819, MARANO PRINCIPATO — por los 60 años que le da el acta de defunción"], ["Padres", "NINGUNO DE LOS DOS se nombra en el acta; sólo dice que ambos habían muerto ya"], ["Oficio", "contadina (campesina)"], ["Cónyuge", "Raffaele Chiappetta († 3 de diciembre de 1880), que le sobrevivió once meses"], ["Hijo", "Giovanni Chiappetta (hacia 1848)"], ["Residencia", "Rende, contrada Surdo"], ["Defunción", "19 de diciembre de 1879, 13 h, Rende — acta 94, con 60 años"]], "vida": "c.1819–1879", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "carmine_molinaro", "madre": "carmina_covello", "conyuge": "raffaele_chiappetta", "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "19 de diciembre de 1879, 13 h", "lugar": "Rende", "ref": "acta 94", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 71 «Morti» 1879"], ["Registro", "hash del contenedor: 5x2ENZg"], ["Página", "24 de 29"], ["Colocación", "columna izquierda, mitad inferior de la apertura"], ["Año manuscrito", "«milleottocentosettantanove» — coincide con el catálogo"], ["Oficial", "Martino Vincenzo, asesor anciano por el alcalde"]], "literal": "…è morta Molinaro Teresa di anni sessanta, contadina, residente in Rende, nata in\nMarano Principato, da fu ————, domiciliato in ————, e dalla fu ————,\ndomiciliata in ————, moglie di Chiappetta Raffaele.", "traduccion": "El año mil ochocientos setenta y nueve, el día veinte de diciembre, a las diez de la mañana, en la casa comunal.\n\nAnte mí, MARTINO VINCENZO, asesor anciano por el alcalde, Oficial del Estado Civil del municipio de Rende, han comparecido MASSEI DOMENICO, de unos cincuenta y tantos años (la cifra está escrita con tinta muy pálida), BRACCIALE, domiciliado en Rende, y DE RANGO GASPARE (lectura probable), de sesenta y ocho años, bracciale, domiciliado en Rende.\n\nLos cuales me han declarado que a la una de la tarde de AYER, en la casa sita en CONTRADA SURDO, ha muerto MOLINARO TERESA, DE SESENTA AÑOS, CONTADINA (campesina), residente en Rende, NACIDA EN MARANO PRINCIPATO, hija de la DIFUNTA ———— y del DIFUNTO ———— (los dos nombres quedan en blanco), MUJER DE CHIAPPETTA RAFFAELE.\n\nA este acto han estado presentes como testigos CHIANELLO GAETANO, de cincuenta años, bracciale, y BENA SERAFINO (lectura dudosa), de treinta años, bracciale, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado yo solo por ser ellos analfabetos. — Vincenzo Martino.", "notas": ["SESENTA AÑOS EN DICIEMBRE DE 1879: nació hacia 1819. Tuvo a Giovanni con unos veintinueve.", "NACIÓ EN MARANO PRINCIPATO, no en Castrolibero. Es un pueblo nuevo en este árbol, y conviene no confundirlo con Marano Marchesato, de donde venían los Palermo: son dos municipios distintos y vecinos. Curiosamente Carmina Ricchio, la otra abuela, también nació en Marano Principato.", "EL ACTA NO NOMBRA A NINGUNO DE SUS PADRES. El índice daba Carmine Mulinaro y Carmina Covello; el original no confirma ni a uno ni a otro. En las dos casillas el escribano escribió «fu» y dejó el nombre en blanco. De modo que esos dos nombres siguen apoyándose sólo en el índice.", "LO QUE SÍ APORTA: ese doble «fu» dice que en diciembre de 1879 sus dos padres ya habían muerto. Si nació hacia 1819, sus padres serían de hacia 1790-1795.", "EL APELLIDO ES MOLINARO. Lo escribe así el cuerpo del acta, el epígrafe del margen («Molinaro Teresa») y el índice anual del propio registro. El «Mulinaro» del índice moderno es una deformación. Coincide con la lectura del matrimonio de su hijo en 1873.", "EL PRIMER DECLARANTE ES SU CONSUEGRO. Quien va al ayuntamiento a declarar la muerte es MASSEI DOMENICO — el padre de Angela Massei, con cuya hija se había casado el hijo de la difunta seis años antes. Es la prueba de que las dos familias vivían pegadas y de que el parentesco del índice es real. Él mismo morirá en 1891 y su acta está también aquí.", "El segundo declarante se lee DE RANGO GASPARE. De Rango es precisamente el apellido de expósito con que los Salerno estaban inscritos en Castrolibero. Puede ser casualidad —es apellido frecuentísimo en la zona— pero queda anotado."], "imgs": [{"u": "actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20Teresa%20Molinaro%20-%20Rende%20acta%2094.jpg", "t": "Teresa Molinaro - Rende acta 94"}], "zooms": [{"u": "actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%2060%20anos%2C%20nacida%20en%20Marano%20Principato%2C%20padres%20sin%20nombre.jpg", "t": "60 anos, nacida en Marano Principato, padres sin nombre"}, {"u": "actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20acta%2094%20completa.jpg", "t": "Acta 94 completa"}, {"u": "actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20declarantes%20Massei%20Domenico%20y%20De%20Rango%20Gaspare.jpg", "t": "Declarantes Massei Domenico y De Rango Gaspare"}]}], "nActas": 1, "nImgs": 4, "titulo": "La declaró su consuegro", "parrafos": ["Murió el 19 de diciembre de 1879, a la una de la tarde, en la contrada Surdo de Rende, con sesenta años. Había nacido hacia 1819 en Marano Principato, un pueblo que hasta esa lectura no figuraba en este árbol.", "Quien fue a la casa comunal a declararlo, a las diez de la mañana siguiente, no fue un hijo ni un vecino cualquiera: fue Massei Domenico, jornalero, el padre de Angela Massei, es decir el suegro de su hijo Giovanni. Su edad está escrita con tinta tan pálida que sólo se lee «cincuenta y tantos». Le acompañaba un jornalero de sesenta y ocho años cuyo apellido se lee, con probabilidad, De Rango: el mismo apellido de expósito que usaba Michele Salerno en Castrolibero, aunque nada prueba que hubiera parentesco.", "El acta escribe MOLINARO, con o, igual que el epígrafe del margen y el índice anual del registro. Y deja en blanco las dos casillas de los padres, con lo que los nombres que dan los índices —Carmine Molinaro y Carmina Covello— siguen sin respaldo. Su marido le sobrevivió once meses y medio y murió en la misma contrada."], "claves": [["Oficio", "contadina, campesina"], ["Nacida", "hacia 1819 en Marano Principato"], ["Contrada", "Surdo, en Rende"], ["Muerte", "19 de diciembre de 1879, a los 60 años"], ["Quién la declaró", "su consuegro, Domenico Massei"]]}, "domenico_massei": {"id": "domenico_massei", "nombre": "Domenico Massei", "legal": "Mazzei Domenico en sus dos últimas actas", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Jornalero NACIDO EN RENDE hacia 1821, padre de Angela Massei. Enviudó en 1883 y murió viudo el 8 de noviembre de 1891, en contrada Saporito, con setenta años. Uno de los dos testigos de su acta es su yerno, Giovanni Chiappetta.", "datos": [["Nacimiento", "hacia 1821, RENDE — por los 70 años que le da el acta de defunción"], ["Padres", "Filippo Mazzei, bracciante, domiciliado en Rende († antes de 1891); la madre NO se nombra, sólo que había muerto y que vivió en Rende"], ["Oficio", "bracciale / bracciante (jornalero)"], ["Cónyuge", "Carmina Ricchio († 11 de diciembre de 1883) — muere «vedovo di» ella"], ["Hija", "Angela Massei (hacia 1858, Castrolibero)"], ["Contradas", "Surdo en 1883 (con su mujer); Saporito al morir en 1891"], ["Defunción", "8 de noviembre de 1891, 14 h, Rende — acta 112, con 70 años"], ["Grafía", "MASSEI en 1873 y 1879; MAZZEI en 1883 y 1891 — cambia con el escribano"]], "vida": "c.1821–1891", "lug": "RENDE", "mapa": null, "sinacta": "", "padre": "filippo_massei", "madre": null, "conyuge": "carmina_ricchio", "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "8 de noviembre de 1891, 14 h", "lugar": "Rende", "ref": "acta 112", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 83 «Morti» 1891"], ["Registro", "hash del contenedor: wQ9a7O8"], ["Página", "29 de 42"], ["Colocación", "columna derecha, mitad inferior de la apertura"], ["Año manuscrito", "«milleottocento novantuno» — coincide con el catálogo"], ["Oficial", "Mercavallo Gabriele (lectura dudosa), secretario delegado por acta del alcalde de 19 de septiembre de 1884"]], "literal": "…è morto Mazzei Domenico di anni settanta, bracciante, residente in Rende, nato in\nRende, dal fu Filippo, bracciante, domiciliato in Rende, e dalla fu ————,\ndomiciliata in Rende — Vedovo di Ricchio Carmina.", "traduccion": "El año mil ochocientos noventa y uno, el día nueve de noviembre, a las once de la mañana, en la casa comunal.\n\nAnte mí, MERCAVALLO GABRIELE (lectura dudosa), Secretario delegado por acta del Alcalde de diecinueve de septiembre de mil ochocientos ochenta y cuatro, Oficial del Estado Civil del municipio de Rende, han comparecido RICCHIO ANTONIO, de cincuenta y seis años, bracciante, domiciliado en Rende, y TURCO PIETRO, de veintiséis años, bracciante, domiciliado en Rende.\n\nLos cuales me han declarado que a las dos de la tarde de AYER, en la casa sita en CONTRADA SAPORITO, ha muerto MAZZEI DOMENICO, DE SETENTA AÑOS, BRACCIANTE, residente en Rende, NACIDO EN RENDE, HIJO DEL DIFUNTO FILIPPO, bracciante, domiciliado en Rende, y de la DIFUNTA ———— (el nombre queda en blanco), que estuvo domiciliada en Rende. VIUDO DE RICCHIO CARMINA.\n\nA este acto han estado presentes como testigos TURCO PASQUALE, de treinta y siete años, bracciante, y GIOVANNI CHIAPPETTA, de cuarenta y tres años, bracciante, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado yo solo, siendo los demás analfabetos. — Gabriele Mercavallo.", "notas": ["SETENTA AÑOS EN NOVIEMBRE DE 1891: nació hacia 1821.", "NACIÓ EN RENDE, y esto corrige lo que se venía suponiendo. Se le tenía por hombre de Castrolibero porque su hija Angela nació allí; pero él es de Rende. La familia se movió: él nace en Rende, su hija nace en Castrolibero hacia 1858, y en 1873 están otra vez todos en Rende.", "EL PADRE: FILIPPO, bracciante, domiciliado en Rende. El índice lo daba y el acta lo confirma, añadiendo oficio y pueblo. El «fu» dice que ya había muerto en 1891.", "LA MADRE, OTRA VEZ SIN NOMBRE — pero con un detalle que las otras tres actas no dan: el escribano dejó el nombre en blanco Y SIN EMBARGO rellenó la casilla siguiente, «domiciliata in Rende». Sabía dónde había vivido y no supo cómo se llamaba. También ella había muerto ya.", "EL TESTIGO ES SU YERNO. «Giovanni Chiappetta, di anni quarantatre, bracciante»: es el marido de su hija Angela y el padre de Filomena. Cuarenta y tres años en noviembre de 1891 lo sitúa en 1848, exactamente donde lo ponen su matrimonio de 1873 (25 años) y el nacimiento de Filomena en 1877 (29 años). Tres actas independientes, la misma fecha.", "EL PRIMER DECLARANTE ES UN RICCHIO: Ricchio Antonio, de cincuenta y seis años. Casi con seguridad familia de su mujer difunta.", "EL APELLIDO SE ESCRIBE AQUÍ MAZZEI, con doble zeta bien marcada, igual que en el acta de su mujer de 1883. En cambio en el matrimonio de su hija de 1873 y en el acta de Teresa Molinaro de 1879 —las dos de mano de Vincenzo Martino— se lee MASSEI. No hay una grafía «correcta»: depende del escribano. Se mantiene MASSEI en el árbol porque es la forma que usan las actas de la rama que sigue viva (1873, 1877, 1894).", "MURIÓ EN CONTRADA SAPORITO, no en Surdo, donde vivía en 1883. Es la misma contrada en la que su bisnieto Giuseppe nacerá en 1895 y su bisnieto Umberto en 1897."], "imgs": [{"u": "actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20Domenico%20Antonio%20Massei%20-%20Rende%20acta%20112.jpg", "t": "Domenico Antonio Massei - Rende acta 112"}], "zooms": [{"u": "actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%2070%20anos%2C%20nacido%20en%20Rende%2C%20hijo%20del%20fu%20Filippo.jpg", "t": "70 anos, nacido en Rende, hijo del fu Filippo"}, {"u": "actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20acta%20112%20completa.jpg", "t": "Acta 112 completa"}, {"u": "actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20testigo%20Giovanni%20Chiappetta%2C%20su%20yerno.jpg", "t": "Testigo Giovanni Chiappetta, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "El testigo era su yerno", "parrafos": ["Nació en Rende hacia 1821 y murió allí el 8 de noviembre de 1891, a las dos de la tarde, en la contrada Saporito, con setenta años. Había enviudado ocho años antes de Carmina Ricchio, y su acta lo llama «vedovo di».", "Los dos consuegros se enterraron el uno al otro, y las actas lo dejan escrito. En diciembre de 1879 fue Domenico quien declaró la muerte de Teresa Molinaro, la madre de su yerno. En diciembre de 1883 fue el yerno, Giovanni Chiappetta, quien declaró la de Carmina Ricchio, su suegra. Y en noviembre de 1891, en el acta del propio Domenico, uno de los dos testigos es «Giovanni Chiappetta, di anni quarantatre, bracciante»: el mismo hombre otra vez.", "Del padre, el acta da nombre y oficio: «dal fu Filippo, bracciante, domiciliato in Rende». De la madre, sólo el hueco — pero con un matiz que no tienen las otras tres actas de esa generación: el escribano dejó el nombre en blanco y aun así rellenó «domiciliata in Rende».", "El apellido cambia de escribano en escribano y no de hombre en hombre: MASSEI en 1873 y 1879, MAZZEI en 1883 y 1891. En el árbol se mantiene Massei, que es la forma de las actas de la rama que sigue viva."], "claves": [["Oficio", "bracciante, jornalero"], ["Nacido", "hacia 1821 en Rende, no en Castrolibero como se suponía"], ["Contradas", "Surdo en 1883; Saporito al morir"], ["Muerte", "8 de noviembre de 1891, a los 70 años"]]}, "carmina_ricchio": {"id": "carmina_ricchio", "nombre": "Carmina Ricchio", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["salerno"], "resumen": "Campesina nacida en Marano Principato hacia 1828, madre de Angela Massei. Murió en Rende, contrada Surdo, el 11 de diciembre de 1883, con cincuenta y cinco años. Quien fue a declarar su muerte fue su yerno, Giovanni Chiappetta.", "datos": [["Nacimiento", "hacia 1828, MARANO PRINCIPATO — por los 55 años que le da el acta de defunción"], ["Padres", "Giuseppe Ricchio, bracciante; y MARIA BOSCO, que este acta no nombra pero sí da por muerta. El nombre de la madre llegó después, por el acta de defunción de ella misma (Castrolibero, 1865, acta 11)"], ["Oficio", "contadina (campesina)"], ["Cónyuge", "Domenico Massei († 8 de noviembre de 1891), que le sobrevivió ocho años"], ["Hija", "Angela Massei (hacia 1858, Castrolibero)"], ["Residencia", "Rende, contrada Surdo"], ["Defunción", "11 de diciembre de 1883, 12 h, Rende — acta 163, con 55 años"]], "vida": "c.1828–1883", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "giuseppe_ricchio", "madre": "maria_bosco", "conyuge": "domenico_massei", "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "11 de diciembre de 1883, 12 h", "lugar": "Rende", "ref": "acta 163", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 75 «Morti» 1883"], ["Registro", "hash del contenedor: LpnQEoq"], ["Página", "42 de 50"], ["Colocación", "columna derecha, mitad superior de la apertura"], ["Año manuscrito", "«milleottocento ottantatre» — coincide con el catálogo"], ["Oficial", "Bruno Vincenzo, asesor en funciones por el alcalde"]], "literal": "…è morta Ricchio Carmina di anni cinquantacinque, contadina, residente in Rende,\nnata in Marano Principato, da fu Giuseppe, bracciante, domiciliato in vita in\nMarano Principato, e dalla fu ————, domiciliata in ————, moglie di Mazzei Domenico.", "traduccion": "El año mil ochocientos ochenta y tres, el día doce de diciembre, a las once de la mañana, en la casa comunal.\n\nAnte mí, BRUNO VINCENZO, asesor en funciones por el alcalde, Oficial del Estado Civil del municipio de Rende, han comparecido CHIAPPETTA GIOVANNI, de treinta y tres años, bracciante, domiciliado en Rende, y CHIAPPETTA PASQUALE, de veintiocho años, bracciante, domiciliado en Rende.\n\nLos cuales me han declarado que a las doce del mediodía de AYER, en la casa sita en CONTRADA SURDO, ha muerto RICCHIO CARMINA, DE CINCUENTA Y CINCO AÑOS, CONTADINA (campesina), residente en Rende, NACIDA EN MARANO PRINCIPATO, HIJA DEL DIFUNTO GIUSEPPE, bracciante, que estuvo domiciliado en vida en Marano Principato, y de la DIFUNTA ———— (el nombre queda en blanco), MUJER DE MAZZEI DOMENICO.\n\nA este acto han estado presentes como testigos CHIAPPETTA VINCENZO, de veinticinco años, bracciante, y CHIAPPETTA PIETRO, de cincuenta años, bracciante, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado yo solo, siendo los demás analfabetos. — Vincenzo Bruno.", "notas": ["CINCUENTA Y CINCO AÑOS EN DICIEMBRE DE 1883: nació hacia 1828. Es la más joven de los cuatro abuelos y la que murió antes en edad. Tuvo a Angela con unos treinta.", "NACIÓ EN MARANO PRINCIPATO, igual que Teresa Molinaro. Dos de los cuatro bisabuelos de Filomena salen del mismo pueblo, que hasta ahora no aparecía en este árbol.", "EL PADRE: GIUSEPPE RICCHIO, bracciante, «domiciliato in vita in Marano Principato». El índice lo daba sin más; el acta le pone oficio y pueblo, y con el «fu» y el «in vita» deja claro que había muerto y que nunca se mudó de Marano.", "LA MADRE, SIN NOMBRE. Tercera vez de cuatro: el escribano escribe «e dalla fu» y deja el resto en blanco. No hay ningún nombre que rescatar. — RESUELTO EL 26 DE AGOSTO DE 2026, y no aquí sino en otro archivo: la madre era MARIA BOSCO, y su propia acta de defunción (Castrolibero, 11 de agosto de 1865, acta 11) la nombra y la identifica como «vedova del fu Giuseppe Ricchio». Ese «dalla fu» de 1883 era cierto: llevaba dieciocho años muerta.", "EL ACTA ES UNA REUNIÓN DE CHIAPPETTAS. Los dos declarantes y los dos testigos llevan ese apellido. El primer declarante es CHIAPPETTA GIOVANNI, su yerno, el marido de Angela y padre de Filomena. El segundo, CHIAPPETTA PASQUALE, de veintiocho años, es casi con seguridad hermano de Giovanni: encaja con un hijo más de Raffaele y Teresa, nacido hacia 1855. Y entre los testigos, Chiappetta Vincenzo (25) y Chiappetta Pietro (50). La familia del yerno enterró a la suegra.", "AQUÍ EL APELLIDO DEL MARIDO SE ESCRIBE MAZZEI, con la doble zeta inconfundible, mientras que el matrimonio de 1873 escribía MASSEI. Es el mismo hombre.", "Su marido le sobrevivió ocho años: murió el 8 de noviembre de 1891, «vedovo di Ricchio Carmina», y su acta está también en este archivo."], "imgs": [{"u": "actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20Carmina%20Ricchio%20-%20Rende%20acta%20163.jpg", "t": "Carmina Ricchio - Rende acta 163"}], "zooms": [{"u": "actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%2055%20anos%2C%20hija%20del%20fu%20Giuseppe%20Ricchio%20de%20Marano%20Principato.jpg", "t": "55 anos, hija del fu Giuseppe Ricchio de Marano Principato"}, {"u": "actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20acta%20163%20completa.jpg", "t": "Acta 163 completa"}, {"u": "actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20declarante%20Chiappetta%20Giovanni%2C%20su%20yerno.jpg", "t": "Declarante Chiappetta Giovanni, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "Cuatro Chiappetta en su acta", "parrafos": ["Murió el 11 de diciembre de 1883, a las doce del mediodía, en la contrada Surdo de Rende, con cincuenta y cinco años. De los cuatro abuelos de Filomena es la que murió más joven. Había nacido hacia 1828 en Marano Principato.", "Su acta es una reunión de Chiappettas: la declaran Giovanni Chiappetta, de treinta y tres años —su yerno—, y Pasquale Chiappetta, de veintiocho; y firman de testigos Vincenzo Chiappetta, de veinticinco, y Pietro Chiappetta, de cincuenta. Ese Pasquale encaja como hermano de Giovanni, un hijo más de Raffaele y Teresa nacido hacia 1855. Es una pista para seguir, no una prueba.", "De su padre, el acta dice «da fu Giuseppe, bracciante, domiciliato in vita in Marano Principato»; de su madre, nada. No firmó ninguno de los comparecientes: sólo el oficial, Vincenzo Bruno, que además escribe el apellido del marido con doble zeta, Mazzei.", "Tres de los cuatro abuelos de Filomena murieron en la misma contrada Surdo y en tres diciembres: Teresa Molinaro el 19 de diciembre de 1879, Raffaele Chiappetta el 3 de diciembre de 1880 y ella el 11 de diciembre de 1883."], "claves": [["Oficio", "contadina, campesina"], ["Nacida", "hacia 1828 en Marano Principato"], ["Contrada", "Surdo, en Rende"], ["Muerte", "11 de diciembre de 1883, a los 55 años"], ["Quién la declaró", "su yerno, Giovanni Chiappetta"]]}, "domenico_pizzi": {"id": "domenico_pizzi", "nombre": "Domenico Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["faienza"], "resumen": "Albañil de Atessa, nacido hacia 1824, padre de Angiolina Pizzi. Sabía firmar, cosa rara entre los suyos. Murió el 28 de septiembre de 1891 en la casa de Via di Mezzo, con sesenta y siete años, casado todavía con Teresa Flocco.", "datos": [["Nacimiento", "hacia 1824, ATESSA — por los 67 años que le da el acta de defunción"], ["Padres", "Giuseppe Pizzi, artigiano († antes de 1869), y Antonia di Iorio, filatrice († antes de 1891); los dos vivieron y murieron en Atessa"], ["Oficio", "muratore (albañil), en 1869 y en 1891"], ["Cónyuge", "Teresa Flocco, hija del fu Pasquale — le sobrevivió"], ["Hija", "Angiolina (Angela) Pizzi, nacida el 12 de febrero de 1869"], ["Residencias", "rione del CASTELLO en 1869; VIA DI MEZZO al morir en 1891"], ["Sabía escribir", "SÍ. Firmó de su puño el acta de nacimiento de su hija en 1869, mientras los dos testigos declaraban no saber"], ["Defunción", "28 de septiembre de 1891, 20:05 h, Atessa — acta 238, con 67 años"], ["Aviso sobre la edad", "el acta de 1869 le pone 39 años (nacido hacia 1830) y la de 1891 le pone 67 (nacido hacia 1824). Seis años de diferencia entre dos actas suyas"]], "vida": "c.1824–1891", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "giuseppe_pizzi", "madre": "antonia_di_iorio", "conyuge": "teresa_flocco", "hijos": ["angela_pizzi"], "hermanos": [], "actas": [{"titulo": "Acta de defunción", "tipo": "D", "tipoNombre": "Defunción", "fecha": "28 de septiembre de 1891, 20:05 h", "lugar": "Atessa (Chieti)", "ref": "acta 238", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1891, atti di morte"], ["Registro", "hash del contenedor: 5v7V2Ay"], ["Página", "121 de 170"], ["Colocación", "mitad inferior de la plana; encima, el acta 237"], ["Año manuscrito", "«mille ottocento novantuno» — coincide con el catálogo"], ["Oficial", "Francesco Falcucci (lectura dudosa: «Falcuni»), asesor municipal delegado por el alcalde por acta de 24 de noviembre de 1889"], ["Cómo se localizó", "por el índice alfabético del final del registro (página 168 de 170), donde consta un único Pizzi: «Pizzi Domenico — 238». Un sondeo en la página 120 dio las actas 235-236, fechadas el 28 de septiembre: la 238 estaba en la página siguiente"]], "literal": "Numero 238 — Domenico Pizzi\nL'anno mille ottocento novantuno, addì ventinove di Settembre, a ore pomeridiane\nquattro e minuti dieci, nella Casa Comunale. Avanti di me Francesco Falcucci\nassessore Municipale delegato dal Sindaco con atto del ventiquattro Novembre\nmille ottocento ottantanove, debitamente approvato, Ufficiale dello Stato Civile\ndel Comune di Atessa, sono comparsi Donato Tiroli, di anni settanta, contadino,\ndomiciliato in Atessa, e Tommaso D'Amelio, di anni settantatre, contadino,\ndomiciliato in Atessa, i quali mi hanno dichiarato che a ore pomeridiane otto e\nminuti cinque di ieri, nella casa posta in Via di Mezzo al numero ——, è morto\nDOMENICO PIZZI, di anni sessantasette, muratore, residente in Atessa, nato in\nAtessa, da fu GIUSEPPE, artigiano, domiciliato in vita in Atessa, e da fu ANTONIA\nDI IORIO, filatrice, domiciliata in vita in Atessa, marito di TERESA FLOCCO.", "traduccion": "El año mil ochocientos noventa y uno, el día veintinueve de septiembre, a las cuatro y diez de la tarde, en la casa comunal.\n\nAnte mí, FRANCESCO FALCUCCI, asesor municipal delegado por el Alcalde mediante acta de veinticuatro de noviembre de mil ochocientos ochenta y nueve, debidamente aprobada, Oficial del Estado Civil del municipio de ATESSA, han comparecido DONATO TIROLI, de setenta años, campesino, domiciliado en Atessa, y TOMMASO D'AMELIO, de setenta y tres años, campesino, domiciliado en Atessa.\n\nLos cuales me han declarado que a las OCHO Y CINCO DE LA TARDE DE AYER, en la casa sita en VIA DI MEZZO, ha muerto DOMENICO PIZZI, DE SESENTA Y SIETE AÑOS, ALBAÑIL, residente en Atessa, NACIDO EN ATESSA, HIJO DEL DIFUNTO GIUSEPPE, artesano, que estuvo domiciliado en vida en Atessa, y de la DIFUNTA ANTONIA DI IORIO, hilandera, que estuvo domiciliada en vida en Atessa. MARIDO DE TERESA FLOCCO.\n\nA este acto han estado presentes como testigos FILIPPO FEDELIBUS, de cincuenta y un años, campesino, y GIACOMO PASQUINI (lectura dudosa), de cuarenta y ocho años, campesino, ambos residentes en este municipio.\n\nLeída el acta a todos los intervinientes, la he firmado yo solo, habiendo declarado los declarantes y los testigos no saber escribir. — Francesco Falcucci.", "notas": ["SESENTA Y SIETE AÑOS EN SEPTIEMBRE DE 1891: nació hacia 1824. Es justo lo que se esperaba de él, y encaja con una hija nacida en 1869, cuando tendría cuarenta y cinco.", "EL ACTA SÍ NOMBRA A SU MADRE, y era la pregunta que se traía esta descarga. «E da FU ANTONIA DI IORIO, FILATRICE, domiciliata IN VITA in Atessa». Nombre completo, oficio y pueblo. Una rama materna nueva —DI IORIO— entra en el árbol por esta línea.", "EL PADRE: GIUSEPPE, artigiano, domiciliado en vida en Atessa. El «fu» y el «in vita» dicen que había muerto y que nunca se movió del pueblo. Es exactamente el mismo Giuseppe que el acta de 1869 nombra al presentar al declarante como «Domenico Pizzi FU Giuseppe»: dos actas separadas por veintidós años dando el mismo padre.", "«MARITO DI TERESA FLOCCO», no «vedovo». Ella le sobrevivió. Su defunción habría que buscarla en los Morti de Atessa posteriores a 1891.", "MURIÓ EN VIA DI MEZZO. En 1869 la familia vivía en el rione del CASTELLO; veintidós años después está en Via di Mezzo, dentro del mismo casco.", "LA DISCREPANCIA DE EDAD. El acta de 1869 lo da de treinta y nueve años, que lo pondría en 1830; ésta lo da de sesenta y siete, que lo pone en 1824. Son sus dos únicas actas y no se ponen de acuerdo. Lo habitual en estos registros es que la edad declarada en una defunción sea la más redondeada, así que su nacimiento cae en la ventana 1824-1830 y hay que buscarlo en los Nati de Atessa de esos años.", "EL DECLARANTE ES UN TIROLI, igual que en la defunción de Leone Pizzi de 1841 (Luigi Tiroli, treinta años). Cincuenta años después, un Donato Tiroli de setenta años vuelve a ser quien va al ayuntamiento a declarar la muerte de un Pizzi. Vecindad de siempre."], "imgs": [{"u": "actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20Domenico%20Pizzi%20-%20Atessa%20acta%20238.jpg", "t": "Domenico Pizzi - Atessa acta 238"}], "zooms": [{"u": "actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%2067%20anos%2C%20hijo%20del%20fu%20Giuseppe%20y%20de%20la%20fu%20Antonia%20di%20Iorio%2C%20marido%20de%20Teresa%20Flocco.jpg", "t": "67 anos, hijo del fu Giuseppe y de la fu Antonia di Iorio, marido de Teresa Flocco"}, {"u": "actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%20acta%20238%20completa.jpg", "t": "Acta 238 completa"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "teresa_flocco": {"id": "teresa_flocco", "nombre": "Teresa Flocco", "legal": "", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 4, "ramas": ["faienza"], "resumen": "Hilandera de Atessa, nacida hacia 1834, mujer de Domenico Pizzi y madre de Angiolina. Enviudó en septiembre de 1891.", "datos": [["Nacimiento", "hacia 1834 — el acta de 1869 le da treinta y cinco años"], ["Padre", "PASQUALE FLOCCO, ya difunto en febrero de 1869 («fu Pasquale»)"], ["Madre", "no consta en ninguna de las dos actas"], ["Oficio", "filatrice (hilandera)"], ["Cónyuge", "Domenico Pizzi, muratore († 28 de septiembre de 1891)"], ["Hija", "Angiolina (Angela) Pizzi, nacida el 12 de febrero de 1869"], ["Residencia", "Atessa, rione del Castello en 1869"], ["Defunción", "sin localizar — posterior a septiembre de 1891, porque su marido muere «marito di» ella y no «vedovo»"]], "vida": "c.1834–1891", "lug": "", "mapa": null, "sinacta": "CONFIRMADA POR DOS ACTAS, aunque no tenga carpeta propia. En el nacimiento de su hija (Atessa, 12 de febrero de 1869, acta 65) el marido la declara: «da sua moglie TERESA FLOCCO FU PASQUALE, d'anni trentacinque, FILATRICE, seco lui domiciliata». Y en la defunción de él (Atessa, 28 de septiembre de 1891, acta 238) figura como su mujer viva. Las dos actas están descargadas y transcritas en las fichas de Angela y de Domenico.\n\nEL DATO QUE HAY QUE APUNTAR es ese «fu Pasquale»: su padre se llamaba PASQUALE FLOCCO y ya había muerto en febrero de 1869. No se le ha abierto ficha porque de él no se sabe nada más —ni oficio ni edad ni pueblo, aunque Flocco es apellido de Atessa: en el mismo registro de 1869 aparece un «Signor Filippo Flocco» propietario de una masería—, pero es un nombre nuevo y comprobado, de la generación de 1800, y da por dónde seguir: los Morti de Atessa anteriores a 1869.", "padre": null, "madre": null, "conyuge": "domenico_pizzi", "hijos": ["angela_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francesco_giacomo": {"id": "francesco_giacomo", "nombre": "Francesco Giacomo Palermo", "legal": "Giacomo Palermo", "rol": "ascendiente", "rolNombre": "Ascendiente", "gen": 5, "ramas": ["salerno"], "resumen": "Pastor de Marano Marchesato. Los papeles lo llaman casi siempre «Giacomo Palermo» a secas. Tuvo al menos cuatro hijos en Marano entre 1839 y 1852, se mudó con la familia a Rende y allí murió el 13 de mayo de 1867, con sesenta años.", "datos": [["Nacimiento", "hacia 1807, Marano Marchesato — por la edad que declara al morir"], ["Padres", "GIUSEPPE PALERMO, pecorajo, y CARMINA SPIZZIRRI — CONFIRMADOS POR SU PROPIA ACTA DE MATRIMONIO (Rende, 1837, acta 20), donde a ella la llaman «Carmela». Los dos vivos en 1837. Ya no es una inferencia"], ["Cónyuge", "Carmina Volpintesta"], ["Matrimonio", "19 de octubre de 1837, RENDE — acta 20. CONSEGUIDA. Se buscó años en Marano, donde no está: se casaron en el pueblo de ella"], ["Hermanas", "ROSALIA PALERMO, casada en Marano en 1838 con diecisiete años, y AQUILA PALERMO, nacida en Marano el 22 de junio de 1821. Hermanas de padre Y DE MADRE, probado: su acta de matrimonio de 1837 lo da hijo de los mismos dos"], ["Hijos documentados", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Oficio", "pastore en 1841, bracciale en 1845 y 185
