ef": "acta 13", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "9 de 115"], ["Registrar", "Pisani Domenico, asesor decano"]], "literal": "è comparso Salerno Giovanni, di anni ventiquattro, contadino, domiciliato in Rende…\n…da Morelli Vincenzina sua moglie contadina seco lui convivente…", "traduccion": "In the year eighteen hundred and ninety-nine, on the thirteenth day of January, at twenty past nine in the morning, at the town hall, before Pisani Domenico, senior assessor for the mayor being indisposed, there appeared SALERNO GIOVANNI, aged twenty-four, farmhand, resident at Rende.\n\nHe declares that of MORELLI VINCENZINA, countrywoman, his wife living with him, there was born on the twelfth of the current month, at three in the morning, in the house situated in contrada Mari, a child of the male sex, upon whom he bestows the name SALVATORE.\n\nWitnesses: Cannata Giovanni, aged fifty-one, farmer; and Cannataro Giuseppe, aged thirty, farmhand.", "notas": ["ESTE SALVATORE ES SOBRINO, NO HERMANO. Se pidió el acta creyendo que era hijo de Francesco y Filomena, y el original es tajante: el declarante es Salerno GIOVANNI y la madre MORELLI VINCENZINA.", "Encaja perfectamente: boda de sus padres en octubre de 1897, primer hijo en enero de 1899. Y da un dato duro: cuando Giovanni murió el 23 de febrero de 1900, dejaba un hijo de trece meses.", "Anotación marginal de mano del siglo XX: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa».", "Si la familia esperaba un hermano llamado Salvatore, hay que buscarlo en otro año."], "imgs": [{"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20Salvatore%20Salerno%20-%20Rende%20acta%2013.jpg", "t": "Salvatore Salerno - Rende acta 13"}], "zooms": [{"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20acta%2013%20completa.jpg", "t": "Acta 13 completa"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201921.jpg", "t": "Anotacion marginal matrimonio 1921"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20contrada%20y%20nombre%20de%20la%20madre.jpg", "t": "Contrada y nombre de la madre"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20padre%20Giovanni%20Salerno%20y%20madre%20Morelli%20Vincenzina.jpg", "t": "Padre Giovanni Salerno y madre Morelli Vincenzina"}]}], "nActas": 1, "nImgs": 5, "titulo": "He was taken for a brother", "parrafos": ["He was born on 12 January 1899 at three in the morning, in a contrada written in a hand so fine that it reads «Mari», «Nari» or «Maio» and is none of the ones known to the family. His father registered him the following day at twenty past nine, before Pisani Domenico. The witnesses were a fifty-one-year-old farmer and a thirty-year-old farmhand.", "His record was ordered on the assumption that he was another child of Francesco and Filomena. He is not, and the original is emphatic: the informant is SALERNO GIOVANNI and the mother MORELLI VINCENZINA. Salvatore is the son of Francesco's younger brother — that is, Settimo's first cousin and not his brother. It fits without forcing anything: his parents married in October 1897 and he was born in January 1899.", "The find also produced the hardest fact yet about his father. When Giovanni died, on 23 February 1900, Salvatore was thirteen months old. His mother was left a widow with him. And one more age that does not add up: Giovanni declared twenty-four years when registering him, when he had turned twenty-six.", "In the margin of the record a twentieth-century hand noted: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa». He married at Rende in October 1921, aged twenty-two."], "claves": [["Birth", "12 January 1899, 3 a.m., Rende, record 13"], ["Relationship", "first cousin of the nine, not a brother"], ["Orphaned of his father", "at thirteen months"], ["Marginal note", "married at Rende in October 1921 to Misuraca Caterina Santa"]]}, "domenico_faienza": {"id": "domenico_faienza", "nombre": "Domenico Faienza", "legal": "Domingo Faienza en Argentina", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["faienza"], "resumen": "Son of Nicola Faienza and Angiolina Pizzi. He emigrated to Argentina, where he died at Santa Fe on 13 December 1985, aged eighty-five. *** HIS ARGENTINE DEATH CERTIFICATE TURNED UP IN AUGUST 2026 AND CHANGED EVERYTHING: *** it says he was BORN AT PAGLIETA (Italy) on 1 March 1900, and it confirms his parents. The Italian record has still not been found, but now it is known exactly where and when to look — and why it never surfaced: it had been sought in 1899, and he was born in 1900.", "datos": [["Birth", "1 de marzo de 1900 en PAGLIETA (Chieti), según su partida de defunción argentina de 1985. La misma fecha que ya daba el registro del cementerio: dos fuentes argentinas independientes coinciden"], ["Parents", "NICOLA FAIENZA, contadino de Atessa, hijo de Giuseppe Faienza y Maria Staniscia; y ANGIOLINA (Angela) PIZZI. Casados en Atessa el 29 de diciembre de 1892, acta 101"], ["Death", "13 de diciembre de 1985, con 85 años, enterrado en Santa Fe (La Capital), Argentina"], ["Dónde NO nació (1)", "PAGLIETA en 1899. Índice anual completo leído: 161 nacimientos, ningún Faienza en ninguna letra"], ["Dónde NO nació (2)", "ATESSA en 1899. Índice anual completo leído: 396 nacimientos y cuatro Faienza — Antonio, Carmine, Luzio y Rosina—, ningún Domenico. Y los cuatro se han abierto: son de otras tres familias Faienza del pueblo, no de la nuestra"], ["De qué pueblo son los FAIENZA", "ATESSA: el acta de matrimonio de 1892 declara al padre nacido y residente allí, y al abuelo paterno también"], ["Dónde nació ÉL", "PAGLIETA — y no es lo mismo. Los padres se casaron en Atessa en diciembre de 1892 y se mudaron a Paglieta, a trece kilómetros, donde nació el hijo ocho años después"], ["Dónde hay que buscarlo", "*** PAGLIETA, NACIMIENTOS DE 1900, un varón nacido el 1 de marzo. *** Pero NO por internet: Antenati sólo tiene Paglieta hasta 1899. Hay que pedírsela al AYUNTAMIENTO DE PAGLIETA, que es quien guarda los libros que el Archivio di Stato todavía no ha recibido. Carta escrita y lista, con los contactos comprobados en la web oficial del comune"], ["Death", "13 de diciembre de 1985 a las 19:30, en Santa Fe. Jubilado, y todavía de nacionalidad italiana tras toda una vida en Argentina. Vivía en la calle JUAN PABLO LÓPEZ 2643"], ["Documento argentino", "Cédula de Identidad 177.029"]], "mapa": null, "sinacta": "", "padre": "nicola_faienza", "madre": "angela_pizzi", "conyuge": "brigida_nelli", "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "13 de diciembre de 1985", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "tomo 4-C, acta 1155", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verificación", "trámite 26-00-278-953 · hash EABE-3072-19D1-FC11-B4CB-603E-7871-EC78-4C2D-5E8C, comprobable en santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "At SANTA FE, department of La Capital, province of Santa Fe, Argentine Republic, on 19 December 1985. I, Public Officer of this Registry, record the DEATH of DOMINGO FAIENZA. Male, ITALIAN nationality. Status: married. Occupation: RETIRED. Identity document: Cédula 177,029. Address: J. P. López 2643.\n\nSON OF NICOLÁS FAIENZA AND ÁNGELA PIZZI.\n\nBORN AT PAGLIETA (ITALY) ON 1 MARCH 1900.\n\nOccurring at Santa Fe on 13 December 1985 at 19:30. Cause of death: illness. Medical certificate of Doctor César Carli, 19 December 1985. Informant: SIXTO GÓMEZ, L.E. 5,261,009, address Berutti 5663, acting by virtue of being a person authorised for that purpose. — Arsenia del R. Ibáñez de Quintana, Deputy Head of the Deaths Subsection.", "notas": ["*** DEVUELVE PAGLIETA AL MAPA, Y CORRIGE ALGO QUE YO HABÍA DADO POR CERRADO. *** Tras leer el acta de matrimonio de Atessa de 1892 escribí que la pista de Paglieta quedaba tumbada «definitivamente». Estaba mal. Aquel acta probaba que NICOLA, el padre, había nacido y vivía en Atessa en 1892 — no decía nada de dónde nacería su hijo ocho años después. Esta partida lo dice en letra clara: PAGLIETA. Las dos cosas son compatibles.", "*** Y EXPLICA POR QUÉ NO LO ENCONTRABA: BUSQUÉ EN EL AÑO EQUIVOCADO. *** Se barrieron enteros los índices de nacimientos de Paglieta 1899 y de Atessa 1899 sin hallar ningún Domenico Faienza. Normal: nació el 1 de marzo de **1900**, un año que no se ha mirado nunca. Aquellos negativos siguen valiendo, pero eran del año que no tocaba.", "CONFIRMA A SUS PADRES POR VÍA ARGENTINA. «Hijo de NICOLÁS FAIENZA y de ÁNGELA PIZZI» es exactamente la pareja del acta de matrimonio de Atessa de 1892. Dos archivos de dos países distintos, sin relación entre sí, dan los mismos dos nombres.", "MURIÓ SIENDO ITALIANO. Después de más de sesenta años en Argentina el acta lo sigue registrando de nacionalidad italiana: nunca se nacionalizó.", "EL DECLARANTE NO ERA DE LA FAMILIA. Sixto Gómez «obra en virtud de su persona autorizada para tal fin»: es un gestor, casi con seguridad de la funeraria. Berutti 5663 es SU domicilio, no el de los Faienza."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20Partida%20de%20defuncion%20de%20Domingo%20Faienza%20-%20Santa%20Fe%20acta%201155.jpg", "t": "Partida de defuncion de Domingo Faienza - Santa Fe acta 1155"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20zoom%20-%20nacido%20en%20PAGLIETA%2C%20hijo%20de%20Nicolas%20Faienza%20y%20Angela%20Pizzi.jpg", "t": "Nacido en PAGLIETA, hijo de Nicolas Faienza y Angela Pizzi"}]}, {"titulo": "Negative search in the annual index of births", "tipo": "I", "tipoNombre": "Record", "fecha": "año 1899 completo", "lugar": "Paglieta (Chieti)", "ref": "índice del registro entero", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Paglieta > 1899, atti di nascita"], ["Registro", "hash del contenedor: 5xOMBDz — 120 páginas"], ["Índice", "portada en la página 116; entradas en las páginas 117, 118 y 119; la 120 está en blanco"], ["Portada", "«ANNO 1899 · Comune di PAGLIETA · Provincia di CHIETI · INDICE ANNUALE del REGISTRO degli Atti di NASCITA»"], ["Alcance", "el índice cubre el año entero, incluidas las actas de la parte II, que van marcadas «2ª P.». El número de acta más alto que aparece es el 161"]], "literal": "LA LETRA F ENTERA, tal como está en la página 117:\n  Florio (di) Antonio ............ 1\n  Fazia (fu) Domenico ............ 8\n  Florio (di) Sebastiano ......... 15\n  Falcis (di) Carmela ............ 42\n  Florio (di) Antonio ............ 65\n  Formica Pietro Nicola .......... 68\n  Florio (di) Antonia ............ 109\n  Felice (di) Etterina Maria Nicola  124\n  Fabrizio Verina ................ 160\nY después, directamente, la G. Nueve apellidos con F y ninguno es FAIENZA.", "traduccion": "THERE IS NO RECORD TO TRANSCRIBE: this is a negative result, and it is filed as such.\n\nThe complete alphabetical index of the Paglieta birth register for 1899 was downloaded — the cover and all three pages of entries — and read letter by letter. The F occupies nine lines, all legible, and none of them says Faienza. Nor does the surname appear under any other letter of the index, or spelled any other way (Faenza, Fajenza).\n\nThe index leaves no gap: it is the register's official annual index, it covers records numbered 1 to 161 and also includes those of part II, marked «2ª P.». So at Paglieta, in 1899, no Faienza was born.", "notas": ["NEGATIVO FIRME, Y ES LA MITAD DEL ENCARGO. En el índice de nacimientos de Paglieta de 1899 NO HAY NINGÚN FAIENZA. Ni con los padres correctos ni con otros: no hay ninguno.", "EL PUEBLO NUNCA ESTUVO PROBADO. «Paglieta» venía del mismo bloque familiar sin una sola cita que ya había errado dos veces comprobadas. Lo que convierte un hallazgo en prueba no es el pueblo: son los padres. Y los padres han aparecido, pero en otro sitio.", "DÓNDE HAY QUE BUSCARLO AHORA: EN ATESSA. La nota al margen de la partida de nacimiento de su madre dice que Angiolina Pizzi casó con Nicola Faienza en 1892, acta 101, EN EL REGISTRO DE ATESSA. La familia materna es de Atessa desde 1730. El nacimiento del hijo hay que pedirlo a los Nati de Atessa de 1899 y de 1900.", "Y HAY UNA RAZÓN PARA MIRAR 1900 ANTES QUE 1899. El registro de cementerio argentino da a Domingo Faienza nacido el 1 de MARZO DE 1900 y muerto el 13 de diciembre de 1985 con 85 años, y las dos cifras cuadran entre sí. Si esa fecha es buena, su acta no está en 1899 en ningún pueblo. Paglieta 1900 no existe en Antenati —cero registros, comprobado—, pero ATESSA 1900 sí debería existir: la serie de Atessa es de las largas.", "UN DETALLE CURIOSO DEL ÍNDICE DE PAGLIETA: sí hay un «PIZZI Bambino», acta 142. Un recién nacido apellidado Pizzi, sin nombre de pila en el índice. No es nuestro Domenico —el apellido es el de la madre, no el del padre—, pero deja constancia de que el apellido Pizzi también circula por Paglieta.", "COSTE DE ESTE NEGATIVO: cinco imágenes. Es lo que vale leer un año entero de golpe cuando el registro trae índice al final."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20A-G%20-%20Paglieta.jpg", "t": "Indice alfabetico letras A-G - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20G-P%20-%20Paglieta.jpg", "t": "Indice alfabetico letras G-P - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20P-V%20-%20Paglieta.jpg", "t": "Indice alfabetico letras P-V - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Portada%20del%20indice%20anual%20de%20nacimientos%20-%20Paglieta.jpg", "t": "Portada del indice anual de nacimientos - Paglieta"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20completa%2C%20sin%20ningun%20Faienza.jpg", "t": "La letra F del indice completa, sin ningun Faienza"}]}, {"titulo": "Negative search in the annual index of births", "tipo": "I", "tipoNombre": "Record", "fecha": "año 1899 completo", "lugar": "Atessa (Chieti)", "ref": "índice del registro entero", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1899, atti di nascita"], ["Registro", "hash del contenedor: LyOB1Ve — 302 páginas"], ["Índice", "alfabético al final del volumen. La letra F entera está en la página 297 de 302; se miraron además la 296 (C y D), la 299 (M a P) y la 302, que es la última y sólo lleva la columna de números"], ["Alcance", "el año completo, incluidas las actas de la PARTE II, que van marcadas «p. II» dentro de la misma lista. Número de acta más alto indexado: 396"], ["Actas abiertas", "las cuatro de apellido Faienza: la 382 y la 383 (página 259), la 215 (página 145) y la 139 (página 95)"], ["Cómo se recorrió", "la parte I llega hasta la página ~270 a razón de 1,42 actas por imagen; sondeos en las páginas 200 (acta 297), 240 (acta 354) y 279 (ya parte II) fijaron la recta. Doce imágenes para cerrar un año de 396 nacimientos"]], "literal": "LA LETRA F ENTERA DEL ÍNDICE DE ATESSA 1899, tal como está en la página 297:\n  FAIENZA Antonio .............. 382\n  FAIENZA Carmine .............. 383\n  FAIENZA Luzio ................ 215\n  FAIENZA Rosina ............... 139\n  Falcone · Falcucci · Fanelli · Fantauzzi · Fantini · Fania · Favorito ·\n  Fiori · Fidelibus · Filamarino · Fiorito · Flocco · De Francesco · Fritti\ny a continuación, directamente, la G.\n\nY LO QUE DICEN LAS CUATRO ACTAS:\n  Actas 382 y 383 — gemelos, Antonio y Carmine, nacidos el 18 de diciembre de\n  1899 a las 22:15 y 22:30 en la contrada Piazzano. «È comparso MICHELE FAIENZA\n  FU CARMINE, di anni quarantatré, contadino, domiciliato in Atessa… da CELESTE\n  SERAFINI sua moglie, contadina, seco lui convivente».\n  Acta 215 — Luzio, varón, nacido el 4 de junio de 1899 a la 1:15 en la contrada\n  Carafella. «È comparso ANTONIO FAIENZA DI PASQUALE, di anni quarantaquattro,\n  contadino… da ANTONIA GIAGNORIO sua moglie». Al margen, «morto nel 1899».\n  Acta 139 — Rosina, niña, nacida el 4 de abril de 1899 a las 20:15 en la misma\n  contrada Carafella. «È comparso VINCENZO FAIENZA DI PASQUALE, di anni\n  trentasette, contadino… da BAMBINA ROSSI sua moglie».", "traduccion": "THERE IS NO RECORD TO TRANSCRIBE: this is another negative result, and it is filed as such. But it is a negative of a different kind from Paglieta's, and a good deal stronger.\n\nAt Paglieta the surname Faienza did not appear under any letter of the index and that was enough. At Atessa it appears four times, so it was not enough: all four records had to be opened and the parents checked. None of the four children is the child of Nicola Faienza and Angiolina Pizzi. They belong to three other Faienza families of the same village: that of MICHELE FAIENZA FU CARMINE and Celeste Serafini, in the contrada Piazzano, who had twins in December; and those of ANTONIO and VINCENZO FAIENZA DI PASQUALE — brothers, almost certainly, both of the contrada Carafella — each with one child that year.\n\nOur Nicola is «figlio di GIUSEPPE». Not Michele fu Carmine, nor Antonio di Pasquale, nor Vincenzo di Pasquale.\n\nSo at Atessa, in 1899, no child of Nicola Faienza and Angiolina Pizzi was born, and certainly no Domenico Faienza of anybody.", "notas": ["SEGUNDO NEGATIVO FIRME, Y MÁS SÓLIDO QUE EL PRIMERO. En Atessa 1899 no hay ningún Domenico Faienza —entre «Carmine» y «Luzio» es donde iría, y no está— y, además, ninguno de los cuatro Faienza del año pertenece a nuestra pareja. No es que no aparezca el apellido: es que aparece y se descarta uno por uno.", "LO QUE ESTA TANDA SÍ HA RESUELTO ES EL PUEBLO. El acta de matrimonio de 1892 declara a Nicola Faienza «nato in Atessa, residente in Atessa», y a su padre Giuseppe residente en Atessa. La familia es de Atessa y no de Paglieta. Lo que queda por acertar no es el sitio, es el año.", "Y EL AÑO QUE QUEDA ES 1900. Cerrado 1899 en los dos pueblos, la fecha del registro de cementerio argentino —1 de marzo de 1900, coherente con los 85 años que declara al morir en diciembre de 1985— vuelve a ser la hipótesis buena. La búsqueda de «Atessa 1900» en Antenati dio cero registros en su día; conviene repetirla, porque el fondo de Atessa es de los largos y las altas de catálogo son frecuentes, y si sigue sin estar, pedir la partida al Comune di Atessa.", "UNA MEDIDA ÚTIL QUE DEJA ESTE BARRIDO: el apellido FAIENZA es corriente en Atessa. Tres familias distintas con hijos en un solo año. Eso quiere decir que coincidir en el apellido no prueba nada, y que en la próxima tanda habrá que mirar siempre el nombre del padre: «di Giuseppe». Es exactamente el mismo error que se cometió con Paglieta, sólo que al revés.", "UN DETALLE QUE VIENE DEL MISMO REGISTRO: el acta 214, justo encima del Faienza Luzio, es de un Iacobitti Antonio con una anotación marginal del consulado que lo da fallecido en Carapachay (Buenos Aires) el 6 de junio de 1957. La emigración de Atessa al Río de la Plata está escrita en los márgenes de estos mismos libros.", "COSTE DE ESTE NEGATIVO: doce imágenes para un año de 396 nacimientos. Cuatro del índice y del final del volumen, tres de sondeo y cinco de actas."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Antonio%20y%20Carmine%20gemelos%20-%20Atessa%20actas%20382%20y%20383.jpg", "t": "Faienza Antonio y Carmine gemelos - Atessa actas 382 y 383"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Luzio%20-%20Atessa%20acta%20215.jpg", "t": "Faienza Luzio - Atessa acta 215"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Rosina%20-%20Atessa%20acta%20139.jpg", "t": "Faienza Rosina - Atessa acta 139"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letra%20F%20-%20Atessa.jpg", "t": "Indice alfabetico letra F - Atessa"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20139%2C%20Rosina%20es%20hija%20de%20Vincenzo%20Faienza%20di%20Pasquale%20y%20Bambina%20Rossi.jpg", "t": "Acta 139, Rosina es hija de Vincenzo Faienza di Pasquale y Bambina Rossi"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20215%2C%20Luzio%20es%20hijo%20de%20Antonio%20Faienza%20di%20Pasquale%20y%20Antonia%20Giagnorio.jpg", "t": "Acta 215, Luzio es hijo de Antonio Faienza di Pasquale y Antonia Giagnorio"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20382%2C%20gemelos%20hijos%20de%20Michele%20Faienza%20fu%20Carmine%20y%20Celeste%20Serafini.jpg", "t": "Acta 382, gemelos hijos de Michele Faienza fu Carmine y Celeste Serafini"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20de%20Atessa%2C%20cuatro%20Faienza%20y%20ningun%20Domenico.jpg", "t": "La letra F del indice de Atessa, cuatro Faienza y ningun Domenico"}]}], "nActas": 3, "nImgs": 15, "titulo": "", "parrafos": [], "claves": []}, "cristina_rizzo": {"id": "cristina_rizzo", "nombre": "Cristina Rizzo", "legal": "«Cristina Rizzo de Salerno» en su partida", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["salerno"], "resumen": "Argentine, born in the city of Santa Fe. Until 29 August 2026 she was a loose thread in the whole tree: no parents were known for her. Two civil registry certificates gave them both at once.", "datos": [["Birth", "en la CIUDAD DE SANTA FE. El año no se puede fijar: su acta de matrimonio de 1923 le da 23 años (n. ~1900) y su partida de defunción le da 74 (n. ~1893). Siete años de diferencia"], ["Parents", "*** SALVADOR RIZZO y ÁNGELA COSTABILE ***, los dos nombrados igual en el acta de matrimonio de 1923 y en la de defunción de 1967"], ["Marriage", "26 de marzo de 1923, Santa Fe, acta 140, con SETTIMO SALERNO, panadero de veintitrés años recién llegado de Rende"], ["Trade", "«sus labores»"], ["Documento", "Libreta Cívica 1.529.760"], ["Death", "24 de noviembre de 1967, a las TRES Y MEDIA DE LA MADRUGADA, en Santa Fe. Inscrita el 27"], ["Inhumación", "27 de noviembre de 1967, Cementerio Municipal de Santa Fe"]], "mapa": null, "sinacta": "", "padre": "salvador_rizzo", "madre": "angela_costabile", "conyuge": "settimo", "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "24 de noviembre de 1967, a las 3:30 de la madrugada", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "acta 854", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verificación", "trámite 26-00-284-315 · hash F90C-1521-80AD-0D07-1EEA-7DA4-799E-1CA6-5475-2025"]], "literal": "", "traduccion": "Record number eight hundred and fifty-four. At SANTA FE, department of La Capital, on the twenty-seventh day of November nineteen hundred and sixty-seven, at eight fifteen. Before me, SANTIAGO SATALÉ, head of the Registry of Civil Status, there appeared don ALEJO RIESTRA, merchant, resident at Las Heras 3299,\n\ndeclaring that at THREE THIRTY ON THE TWENTY-FOURTH of the present month, in this Capital, there died doña CRISTINA RIZZO DE SALERNO, of Argentine nationality, BORN IN THIS CITY, aged seventy-four, married, occupation housewife, Civic Registration number 1,529,760, as a consequence of illness, as stated in the medical certificate of Doctor OSCAR BENAZZOLA.\n\nTHAT SHE WAS MARRIED TO SETTINO SALERNO.\n\nTHAT THE DECEASED WAS THE DAUGHTER OF DON SALVADOR RIZZO AND DOÑA ÁNGELA COSTABILE.\n\nThis record having been read, it was signed with me by the informant and by don AURENCIO VILLAFAÑE, resident at Villa Yapeyú, competent witnesses.", "notas": ["*** DA SUS PADRES, Y HASTA HOY LOS RIZZO ERAN UNA SOLA PERSONA SUELTA EN TODO EL ÁRBOL. *** SALVADOR RIZZO y ÁNGELA COSTABILE. Y no es un dato aislado: el acta de matrimonio de 1923, cuarenta y cuatro años antes y con otro declarante, da exactamente los mismos dos nombres.", "COSTABILE ES APELLIDO DEL SUR DE ITALIA, y encaja con que los Salerno vinieran de RENDE, en Cosenza: la colonia calabresa de Santa Fe se casaba entre sí.", "MURIÓ A LAS TRES Y MEDIA DE LA MADRUGADA. La inscripción se hizo tres días después, y coincide con la fecha de la ficha del cementerio municipal.", "*** SU AÑO DE NACIMIENTO NO SE PUEDE FIJAR CON LO QUE HAY. *** Aquí declara 74 años (nacida hacia 1893); en su acta de matrimonio de 1923 declaró 23 (nacida hacia 1900). Siete años de diferencia. Haría falta su partida de nacimiento, que según esta acta es de Santa Fe capital.", "NI EL DECLARANTE NI EL TESTIGO ERAN DE LA FAMILIA — un comerciante de Las Heras y un vecino de Villa Yapeyú. Mismo patrón que en las partidas de los Faienza: gestores, probablemente de la funeraria. Sus domicilios NO son de la familia."], "imgs": [{"u": "../actas/1967%20-%20Cristina%20Rizzo/1967-11-24%20D%20Partida%20de%20defuncion%20de%20Cristina%20Rizzo%20-%20Santa%20Fe%20acta%20854.jpg", "t": "Partida de defuncion de Cristina Rizzo - Santa Fe acta 854"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "salvador_rizzo": {"id": "salvador_rizzo", "nombre": "Salvador Rizzo", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["salerno"], "resumen": "Father of Cristina Rizzo. He entered the tree on 29 August 2026, through two Argentine certificates forty-four years apart that name him identically.", "datos": [["Quién era", "padre de CRISTINA RIZZO, nacida en la ciudad de Santa Fe entre 1893 y 1900"], ["Wife", "ÁNGELA COSTABILE, italiana"], ["Dónde estaba", "en Santa Fe: allí nació y se casó su hija"], ["Fuentes", "acta de matrimonio de su hija (1923) y partida de defunción de su hija (1967)"]], "mapa": null, "sinacta": "NO SE SABE SI ERA ITALIANO O YA ARGENTINO — el acta de matrimonio de su hija deja el hueco de la nacionalidad casi ilegible, y la de defunción no lo dice.\n\n*** ¿SE PUEDE TIRAR PARA ATRÁS DE ÉL EN LOS ARCHIVOS ITALIANOS? SÍ, PERO FALTA UNA COSA. *** El 29 de agosto de 2026 se comprobó que RENDE está en el Portal Antenati **de 1809 a 1910, ciento un años seguidos**, con nacimientos, matrimonios y defunciones. O sea que si él y Ángela se casaron en Rende hacia 1870-1890, el acta está en línea y es gratis de leer, y nombraría a los cuatro abuelos de Cristina.\n\n*** EL PROBLEMA ES QUE NO SABEMOS DE QUÉ PUEBLO ERAN. *** Antenati se organiza por municipio: sin pueblo no hay búsqueda posible, porque no existe un índice de nombres global. Hay indicios a favor de Rende —el apellido RIZZO aparece allí en 1858, y su hija se casó con un Salerno de Rende— pero son indicios, no pruebas.\n\nLO QUE LO RESOLVERÍA DE UN GOLPE: la partida de nacimiento de su hija CRISTINA, nacida en Santa Fe capital entre 1893 y 1900. Un acta argentina de esa época nombra a los padres con edad, nacionalidad y muchas veces el pueblo. Está en la lista de pedidos al Registro Civil.\n\n*** 29 DE AGOSTO DE 2026 — SE HAN LEÍDO DIECISÉIS AÑOS DE MATRIMONIOS DE RENDE Y EL RESULTADO VA EN SU CONTRA. *** Se barrieron las transcripciones de los matrimonios de Rende de 1850 a 1865, año por año, buscando novios RIZZO — porque si él nació hacia 1859, sus padres se casaron justo en ese tramo. En dieciséis años aparecen *** sólo TRES novios Rizzo ***: Michele Maria y Pietro, hermanos, los dos casados en 1850 e hijos de GABRIELE RIZZO y MARIA ESPOSITO FAVA; y Vincenzo, casado en 1862, hijo de Michele Rizzo y Carmina Spina.\n\n*** Y sin embargo el apellido está por todas partes como nombre de MADRE o de NOVIA: *** Angela Maria Rizzo aparece de madre en cuatro bodas distintas, y hay además Francesca, Eleonora, Arcangela y Beatrice Rizzo. Es exactamente el mismo patrón que salió al barrer 1880-1885, donde hubo cinco novias Rizzo y ni un solo novio. O sea que *** en Rende hay mujeres Rizzo por todas partes y muy pocos varones Rizzo que se casen. *** Para un hombre llamado Salvador Rizzo nacido allí hacia 1859 eso deja muy pocos padres posibles. No lo descarta, pero lo hace bastante menos probable de lo que se suponía.\n\nSi aun así Rende fuera el pueblo, los únicos candidatos a padre suyo son los dos hermanos de 1850, y la comprobación sería barata: buscar en los nacimientos de Rende de 1856-1866 un SALVATORE RIZZO hijo de Michele Maria o de Pietro. Nada de esto entra en el árbol: son transcripciones de otra persona, y no hay ni un dato que una a esos Rizzo con él.\n\n*** Y EL MISMO DÍA SE VIO QUE LA BÚSQUEDA NO TENÍA POR QUÉ LIMITARSE A RENDE. *** Las transcripciones calabresas que teníamos en disco se creían cortadas en 1865, pero eso sólo vale para Rende: *** ocho pueblos del anillo de Cosenza llegan hasta 1910 *** — Carolei, Cerisano, Falconara, Guardia Piemontese, los dos Marano, Mendicino y San Vincenzo la Costa. Es decir que los años 1870-1893, que son los que importan para su boda, se pueden barrer enteros y gratis en ocho pueblos vecinos, y no sólo en el que se suponía.\n\nEl primero, SAN VINCENZO LA COSTA, ya está barrido en seis años —1880, 1881, 1882, 1885, 1886 y 1887—: *** ni un solo Rizzo ni un solo Costabile ***, en un pueblo cuyo repertorio de apellidos es bastante distinto del de Rende.\n\nY el segundo, *** MARANO MARCHESATO, está barrido entero: diecinueve años seguidos, de 1875 a 1893, y tampoco hay ni un novio Rizzo ni un solo Costabile. *** Se eligió ese pueblo porque es el que ya ha dado familia nuestra —los Volpintesta, los Palermo, los Luchetta—, así que era el entorno con más sentido.\n\n*** Y de los dos barridos empieza a salir algo que vale más que el resultado. *** Cada uno de esos pueblos tiene un repertorio de apellidos muy suyo que se repite año tras año, y ni Rizzo ni Costabile figuran en ninguno de los dos. En cambio en Rende los dos están bien documentados: seis casas Costabile en una sola generación y varias familias Rizzo. *** Parecen apellidos de Rende y de Cosenza ciudad, no del anillo de pueblos. *** Si eso se confirma en los seis que faltan, el anillo no va a producir la boda, y sólo quedan dos salidas: que esté en Rende entre 1870 y 1893, o que la boda fuera argentina.\n\n*** Y MUESTREANDO TRES AÑOS DE CADA UNO DE LOS SEIS PUEBLOS QUE FALTABAN, HA SALIDO UNO. *** En MENDICINO, en 1885, se casa *** SALVATORE RIZZO, hijo de GIUSEPPE RIZZO y de ANTONIA FORTUNATA DODARO ***. Es el primer novio Rizzo que aparece fuera de Rende en todo el anillo, y encima se llama Salvatore.\n\n*** No es el nuestro: se casa con una MARIA ROSARIA FILIPPELLI, no con Ángela Costabile. Pero no se puede descartar del todo *** — si esa mujer murió joven, cosa corrientísima, él pudo enviudar, casarse en segundas nupcias hacia 1888-1892, emigrar y tener a Cristina en Santa Fe. Las fechas encajan sin forzar nada. Se comprueba gratis y en el mismo sitio: buscando a Maria Rosaria Filippelli en los difuntos de Mendicino de 1885-1893, y un segundo casamiento suyo en los matrimonios de esos años. Si apareciera una boda Rizzo × Costabile en Mendicino, se acabó la búsqueda.\n\n*** SE COMPROBÓ EL MISMO DÍA, Y NO SALE. *** Mendicino está ahora barrido entero: diecinueve años de matrimonios (1875-1893) y nueve de difuntos (1885-1893). En los matrimonios hay exactamente DOS novios Rizzo, y son hermanos —Antonio en 1883 y Salvatore en 1885, los dos hijos de Giuseppe Rizzo y Antonia Fortunata Dodaro— y *** ni un solo Costabile en los diecinueve años. *** Y en los difuntos, que traen columna de cónyuge, *** no muere ninguna Maria Rosaria Filippelli casada con un Salvatore Rizzo ***: las dos que aparecen con ese nombre son otras, casadas con un Piscitelli y con un Barone. O sea que él no enviudó allí, y la hipótesis de las segundas nupcias se queda sin apoyo.\n\n*** Y CON ESO EL ANILLO DE COSENZA QUEDA CERRADO Y ES NEGATIVO. *** Diez tramos barridos —Rende 1850-1865 y 1880-1885, Marano Marchesato y Mendicino enteros, San Vincenzo la Costa, y muestreos de Cerisano, Carolei, Falconara, Guardia Piemontese y Marano Principato— y *** en ninguno hay una boda Rizzo × Costabile. *** Juntando eso con que Ángela Costabile no estaba en la provincia de Santa Fe en junio de 1887 y con que Cristina nace allí entre 1893 y 1900, la conclusión más probable, y ahora con peso, es que *** se casaron en Argentina entre 1888 y 1900 y su acta está en el Registro Civil de Santa Fe ***, no en Italia. Falta sólo leer los años de Rende que siguen sin abrir —1866-1879 y 1886-1893—, bloqueados desde hace dieciséis ventanas.\n\nY un aviso que salió de paso, en Cerisano: allí hay una *** ANGELA COSTABILE casada con un SALVATORE *** — pero un Salvatore MUTO, y de una generación anterior. Los dos nombres de pila juntos con ese apellido no son una combinación única en la comarca: antes de cantar victoria hay que mirar siempre el apellido del marido.\n\nSi en los ocho no apareciera ninguna boda Rizzo × Costabile entre 1875 y 1893, eso sería un negativo muy grande: querría decir que no se casaron en el entorno de Cosenza, y reforzaría casi hasta la certeza que *** se casaron en Argentina entre 1888 y 1900 ***, que es hacia donde apuntan ya el censo de 1887 y la escasez de varones Rizzo. Relacionado: [[angela_costabile]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "angela_costabile", "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "angela_costabile": {"id": "angela_costabile", "nombre": "Ángela Costabile", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["salerno"], "resumen": "Mother of Cristina Rizzo, Italian, resident at Santa Fe in 1923.", "datos": [["Quién era", "madre de CRISTINA RIZZO"], ["Husband", "SALVADOR RIZZO"], ["Nacionalidad", "ITALIANA — así lo dice el acta de matrimonio de su hija"], ["Dónde vivía en 1923", "«en esta ciudad», Santa Fe"], ["El apellido", "COSTABILE es del sur de Italia, y sobre todo de Calabria. Encaja con que su hija se casara con un Salerno de RENDE, en la provincia de Cosenza: la colonia calabresa de Santa Fe se casaba entre sí"]], "mapa": null, "sinacta": "ES ITALIANA Y NO SABEMOS DE DÓNDE, y ésa es la única puerta que falta para subir por esta rama.\n\n*** LO QUE SÍ SE HA PODIDO COMPROBAR: COSTABILE ES APELLIDO DE RENDE, Y CON NOMBRES PROPIOS. *** FEDERICO COSTABILE era el *assessore delegato* del estado civil de Rende en 1909 y firma el acta de nacimiento de una de las hermanas de Settimo. SALVATORE COSTABILE, sastre de veintitrés años, fue testigo de una boda de la familia en 1897. Y en el índice de matrimonios de Rende de 1858 están los hermanos SALVATORE y LUIGI GAETANO COSTABILE, hijos de Francesco Saverio Costabile y Arcangela Maria Giraldi.\n\nQue ella fuera de Rende deja de ser una corazonada por la terminación del apellido y pasa a ser razonable. *** PERO SIGUE SIN PROBARSE: *** Costabile es apellido extendido por toda la provincia de Cosenza, y ella pudo venir de cualquiera de sus pueblos.\n\nLO RESOLVERÍA la partida de nacimiento de su hija Cristina, en Santa Fe.\n\n*** 29 DE AGOSTO DE 2026 — Y AQUÍ LA COSA MEJORA PARA ELLA. *** Se leyeron los matrimonios de Rende de 1850 a 1865 enteros, dieciséis años seguidos. *** COSTABILE resulta ser allí un linaje masculino grande y antiguo: ocho novios Costabile en ese tramo, de SEIS casas distintas ***, todas con padre y madre documentados — Diego Costabile con Carmela Infusino, Pasquale con Maria Rosaria Scaglione, Francesco Saverio con Arcangela Maria Giraldi, Giovanni con Rosaria Bartucci, Saverio Lorenzo con Elena Rosaria Porro, Domenico con Anna Maria Stillo y Natale con Costantina Leone. En 1857 hasta se casa un Costabile con una Costabile.\n\nEs decir: *** que una mujer llamada Ángela Costabile saliera de Rende encaja bien con lo que el pueblo tenía. *** Y el contraste con su marido es notable: en esos mismos dieciséis años hay ocho novios Costabile y sólo tres novios Rizzo. Sigue sin probarse nada —Costabile es apellido de toda la provincia de Cosenza— pero de los dos, la que mejor encaja con Rende es ella.\n\nUn detalle que conviene no olvidar: en el barrido no aparece NINGUNA boda Rizzo × Costabile entre 1850 y 1865. Si esa pareja se casó en Rende, fue después. Y si ella llegó a Santa Fe después de 1887 —que es lo que dice el censo— la boda pudo ser perfectamente argentina. Relacionado: [[salvador_rizzo]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "salvador_rizzo", "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "carlos_salerno": {"id": "carlos_salerno", "nombre": "Carlos Francisco Salerno", "legal": "", "rol": "directa", "rolNombre": "Direct line", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Son of Settimo and Cristina, born in Argentina. A chartered accountant and a public figure in Santa Fe: president of Club Atlético Colón from 1970 to 1974 and an official in the provincial administration. He died on 13 August 2002. He is the only person in the tree with a published newspaper biography.", "datos": [["Parents", "Settimo Salerno y Cristina Rizzo"], ["Death", "13 de agosto de 2002, Santa Fe — «esta madrugada», dice El Litoral de ese mismo día. CORRIGE el «2003» que este árbol daba antes de memoria"], ["Spouse", "Adelina Faienza"], ["Occupation", "CONTADOR PÚBLICO — el diario lo llama «el contador Salerno» de principio a fin"], ["Office", "PRESIDENTE DEL CLUB ATLÉTICO COLÓN de Santa Fe, de finales de 1970 a 1974"], ["Public administration", "hizo carrera en la provincia y «alcanzó notoriedad durante la segunda gobernación de Sylvestre Begnis»"], ["According to the family", "fue además presidente de la CÁMARA DE COMERCIO de Santa Fe y de EMAÚS. El obituario no lo dice: consta como testimonio familiar, no como hecho probado"], ["Source", "El Litoral (Santa Fe), edición impresa del 13 de agosto de 2002, sección Deportes, página DEPO-06: «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html"]], "mapa": null, "sinacta": "Sin acta todavía, pero SÍ con fuente publicada, y es el único del árbol que la tiene. El 13 de agosto de 2002 EL LITORAL de Santa Fe le dedicó un obituario entero.\n\nLO QUE EL DIARIO PRUEBA. Que era CONTADOR. Que murió «esta madrugada», o sea la del 13 de agosto de 2002 — el árbol decía 2003 de memoria y queda corregido. Que en 1970 fue elegido vicepresidente de Colón en la lista «Nuevo Colón» que encabezaba José Relañez Passini; que a finales de ese mismo año Relañez fue desvinculado y ASUMIÓ ÉL LA PRESIDENCIA, hasta 1974. Que bajo su gestión el club salió de una situación económica difícil y se levantaron la PILETA DE NATACIÓN, la SEDE SOCIAL y el foso del sector oeste, y se remodeló el estadio. Que consiguió del municipio el dinero de la pileta y él mismo ideó la forma legal de recibirlo PARA QUE NO PUDIERA DESVIARSE AL FÚTBOL; el diario subraya «la seriedad y claridad con la que manejó las finanzas». Que por sus manos pasaron Enzo Trossero, «Cococho» Álvarez, Trullet, Zuccarelli, Di Meola, Aráoz y Costantino, y el técnico Urriolabeitia. Y que hizo carrera en la ADMINISTRACIÓN PÚBLICA provincial, con notoriedad durante la segunda gobernación de Sylvestre Begnis.\n\nLA ANÉCDOTA QUE MEJOR LO RETRATA. El 25 de enero de 1981 volvió a presentarse y la elección se decidió por CUATRO VOTOS. Se había proclamado ganadora a su lista; fue ÉL MISMO quien detectó el error que daba vuelta el resultado, lo señaló y reconoció la derrota. El diario usa la palabra «hidalgamente». Años después José Néstor Vignatti lo llamaba «padre espiritual» de su grupo y lo consultaba de continuo.\n\nLO QUE APORTA LA FAMILIA Y EL DIARIO NO DICE. Que fue también presidente de la CÁMARA DE COMERCIO de Santa Fe y de EMAÚS. Encaja con ese perfil, pero el obituario es de la sección de deportes y sólo mira a Colón, así que aquí quedan como TESTIMONIO FAMILIAR y no como hecho probado. Se confirmarían en la prensa local o en los archivos de esas dos instituciones.\n\nLO QUE SIGUE FALTANDO. Su PARTIDA DE NACIMIENTO en el Registro Civil de Santa Fe, que nombraría a Settimo con el nombre que usaba en Argentina y daría su edad declarada: sería el primer documento argentino que ate esta rama con las 48 actas italianas. Y ahora también su ACTA DE DEFUNCIÓN que, con la fecha exacta ya en la mano, es una petición fácil.\n\nFUENTE: El Litoral (Santa Fe), 13 de agosto de 2002, Deportes, DEPO-06, «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html", "padre": "settimo", "madre": "cristina_rizzo", "conyuge": "adelina_faienza", "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": ["nilda_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "adelina_faienza": {"id": "adelina_faienza", "nombre": "Adelina Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Daughter of Domenico Faienza and Brigida Nelli. She is where the two branches meet: the Salerno of Calabria and the Faienza and Pizzi of Abruzzo.", "datos": [["Parents", "Domenico Faienza y Brigida Nelli"], ["Spouse", "Carlos Francisco Salerno"], ["Daughters", "Stella Maris, Norma, Beatriz, Susana y Maria Cristina"], ["Source", "árbol familiar — sin acta"]], "mapa": null, "sinacta": "Sin acta. Su nacimiento estaría en el Registro Civil de Santa Fe.", "padre": "domenico_faienza", "madre": "brigida_nelli", "conyuge": "carlos_salerno", "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "brigida_nelli": {"id": "brigida_nelli", "nombre": "Brigida Maria Ana Nelli", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["faienza"], "resumen": "Born at Santa Fe in January 1901 and baptised in the Cathedral. She is the first Argentine of that branch: her parents were already here. Her death certificate, obtained in August 2026, finally gave her parents' full names.", "datos": [["Birth", "enero de 1901, provincia de SANTA FE. La fe de bautismo dice el día 13; la partida de defunción dice el 12. Vale más la fe, escrita a los pocos días"], ["Baptism", "1901, Catedral de Todos los Santos, Santa Fe"], ["Parents", "ÁNGEL ALBERTO NELLI y FILOMENA PAGLIARONE"], ["Spouse", "DOMINGO FAIENZA, el italiano de Paglieta. Vivían juntos en la calle JUAN PABLO LÓPEZ 2643, de Santa Fe capital"], ["Trade", "ama de casa"], ["Documento argentino", "Libreta Cívica 6.119.349"], ["Death", "19 de agosto de 1984 a las 20 horas, en su casa de Santa Fe, a los 83 años"]], "mapa": null, "sinacta": "Su fe de bautismo está localizada y leída en imagen, pero no descargada a este archivo. Dice: «bautizó solemnemente a Brígida M. Ana, que nació el día trece de enero del corriente año, hija legítima de D. Ángel A. Nelli y de Doña Filomena Pallarone». Corrigió dos errores del árbol familiar: el apellido es NELLI con dos eles, y su madre NO era Catterina Volpi.", "padre": "angel_nelli", "madre": "filomena_pagliarone", "conyuge": "domenico_faienza", "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "19 de agosto de 1984", "lugar": "Santa Fe, departamento La Capital, Argentina", "ref": "tomo 5-A, acta 1257", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verificación", "trámite 26-00-278-984 · hash D9CC-7428-D598-5FBA-6A3E-0BA2-B8F6-3037-ED61-C905, comprobable en santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "At SANTA FE, department of La Capital, province of Santa Fe, on 21 August 1984. I, Public Officer of this Registry, record the DEATH of BRÍGIDA MARÍA ANA NELLI. Female, ARGENTINE nationality. Status: married. Occupation: housewife. Identity document: Civic Registration 6,119,349. Address: J. P. López 2643.\n\nDAUGHTER OF ÁNGEL ALBERTO NELLI AND FILOMENA PAGLIARONE.\n\nBORN IN THE PROVINCE OF SANTA FE ON 12 JANUARY 1901.\n\nOccurring at Santa Fe on 19 August 1984 at 20:00. Cause of death: illness. Medical certificate Miguel Hominal. Informant: VÍCTOR BORREI, L.E. 8,501,792, address Belgrano 6578, acting by virtue of being a person authorised for that purpose. — María M. Pierozzi, Head of the Deaths Subsection of Santa Fe.", "notas": ["*** LO QUE PRUEBA QUE ES ELLA, Y NO OTRA NELLI: EL DOMICILIO. *** Esta acta y la de DOMINGO FAIENZA dan la misma casa — J. P. López 2643. Ella muere allí en agosto de 1984; él, en la misma casa, dieciséis meses después. Eran marido y mujer y vivían juntos hasta el final.", "OJO CON LAS OTRAS DOS DIRECCIONES QUE APARECEN. Belgrano 6578 y Berutti 5663 son los domicilios de los DECLARANTES, no de la familia. Las dos actas dicen que el declarante «obra en virtud de su persona autorizada para tal fin»: son gestores, casi seguro de la funeraria, y en cada acta es un hombre distinto. Esas direcciones no significan que hubiera otra casa ni otra familia.", "*** DA EL NOMBRE COMPLETO DEL PADRE. *** La fe de bautismo decía sólo «D. Ángel A. Nelli». Ahora se sabe que la A. es de ALBERTO. Y con esta acta entran en el árbol dos personas que hasta hoy no existían: sus padres.", "CASA CON LA FE DE BAUTISMO EN CUATRO COSAS: el nombre completo en el mismo orden (Brígida M. Ana), el mes y el año, el padre y el nombre de la madre.", "DOS FRICCIONES, que se anotan sin taparlas. (1) EL DÍA: la fe dice 13 de enero, esta acta dice 12. Un día de diferencia entre un papel escrito a los pocos días del parto y otro dictado 83 años después por alguien que no era de la familia. (2) EL APELLIDO DE LA MADRE: en la fe leí PALLARONE; aquí la letra da algo como PAGLIQEOME. Ninguna lectura es segura por separado, pero juntas apuntan a PAGLIARONE.", "Y CONFIRMA QUE ERA ARGENTINA DE NACIMIENTO: «nacida en la provincia de Santa Fe». La fe de bautismo dejaba esa casilla en blanco."], "imgs": [{"u": "../actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20Partida%20de%20defuncion%20de%20Brigida%20Nelli%20-%20Santa%20Fe%20acta%201257.jpg", "t": "Partida de defuncion de Brigida Nelli - Santa Fe acta 1257"}], "zooms": [{"u": "../actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20zoom%20-%20hija%20de%20Angel%20Alberto%20Nelli%20y%20Filomena%2C%20mismo%20domicilio%20que%20Domingo.jpg", "t": "Hija de Angel Alberto Nelli y Filomena, mismo domicilio que Domingo"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "angel_nelli": {"id": "angel_nelli", "nombre": "Ángel Alberto Nelli", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["faienza"], "resumen": "Brígida's father. He entered the tree on 28 August 2026, through his daughter's death certificate: until that day he was only an initial on a baptismal record.", "datos": [["Quién era", "padre de BRÍGIDA MARÍA ANA NELLI, nacida en la provincia de Santa Fe en enero de 1901"], ["Nombre completo", "ÁNGEL ALBERTO. La fe de bautismo de su hija sólo daba «D. Ángel A. Nelli»; la partida de defunción de 1984 revela la segunda inicial"], ["Wife", "FILOMENA PAGLIARONE"], ["Tratamiento", "en la fe de bautismo de 1901 el cura le pone «DON», que en esa época y en ese libro no se daba a cualquiera"], ["Dónde estaba en 1901", "en Santa Fe capital: allí nació y se bautizó su hija"]], "mapa": null, "sinacta": "NO SE SABE SI ERA ITALIANO O YA ARGENTINO, y es la pregunta que hay que resolver. El apellido NELLI es italiano, y su hija nació en Santa Fe en 1901, en plena inmigración. La vía más corta sería su propia partida de defunción en el Registro Civil de Santa Fe —que daría edad, nacionalidad y pueblo— o el acta de matrimonio con Filomena.\n\n*** 29 DE AGOSTO DE 2026 — YA SABEMOS ALGO DE ÉL, Y ES POR AUSENCIA. *** Se barrió entero el censo provincial de Santa Fe de 1887 —que es gratis y está indexado nombre por nombre— buscando NELLI y PAGLIARONE con trece grafías distintas, porque el indexador escribe los apellidos italianos de oído (ALASIA aparece de siete maneras en ese mismo censo). PAGLIARONE no existe en toda la provincia. De NELLI salen tres personas, y las tres se caen: dos son unos chicos de catorce y trece años metidos dentro de una casa SUIZA —los Burgi, con los Pfeiffer al lado— en HUMBOLDT, colonia suizo-alemana del departamento de Las Colonias; el tercero es un Juan de dieciocho años, también en Las Colonias. Nuestra familia vivió siempre en la CAPITAL.\n\n*** LUEGO ÁNGEL Y FILOMENA NO ESTABAN EN LA PROVINCIA EN JUNIO DE 1887. *** Y como su hija Brígida nace en Santa Fe en enero de 1901, llegaron entre esas dos fechas. Eso deja su boda en una horquilla de catorce años y en dos sitios posibles: Italia antes de embarcar, o SANTA FE entre 1888 y 1900. Si fue lo segundo, su acta está en el Registro Civil de Santa Fe y nombraría a los cuatro abuelos de Brígida, que hoy son cuatro huecos enteros.\n\nPOR ESO LA PARTIDA DE NACIMIENTO DE BRÍGIDA (enero de 1901) SUBE DE PRIORIDAD: un acta argentina de esa época da la edad y la nacionalidad de los dos padres, y muchas veces los años que llevaban en el país. Contestaría de una vez si era italiano o ya argentino. Relacionado: [[filomena_pagliarone]].", "padre": null, "madre": null, "conyuge": "filomena_pagliarone", "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_pagliarone": {"id": "filomena_pagliarone", "nombre": "Filomena Pagliarone", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["faienza"], "resumen": "Brígida's mother. Her forename is clear in two documents; the surname is the one weak point of this couple, because the two sources spell it differently.", "datos": [["Quién era", "madre de BRÍGIDA MARÍA ANA NELLI"], ["Husband", "ÁNGEL ALBERTO NELLI"], ["El nombre", "FILOMENA, sin discusión: así lo escriben la fe de bautismo de 1901 y la partida de defunción de 1984"], ["El apellido", "PROBABLE, NO PROBADO. En la fe de bautismo leí PALLARONE; en la partida de defunción la letra da algo como PAGLIQEOME. Ninguna de las dos lecturas es firme, pero juntas apuntan a PAGLIARONE"], ["Por qué encaja", "PAGLIARONE es apellido real y del ABRUZZO. Su yerno, Domingo Faienza, era de PAGLIETA, en la provincia de Chieti — también Abruzzo. Es una coincidencia sugerente, y nada más que eso"]], "mapa": null, "sinacta": "EL APELLIDO ESTÁ SIN CERRAR y es lo primero que hay que arreglar de esta pareja. Se resolvería con el acta de matrimonio de Ángel y Filomena, o con la partida de nacimiento de Brígida en el Registro Civil de Santa Fe (1901), que la escribiría una tercera vez. Con tres lecturas independientes el apellido quedaría fijado.\n\n*** Y NO SIRVE DE NADA BUSCARLA TODAVÍA EN ITALIA. *** El 29 de agosto de 2026 se barrió el censo provincial de Santa Fe de 1887 con ocho grafías del apellido —PAGLIARONE, PALLARONE, PAGLIARON, PAGLIERONE, PALLIARONE, PAGLIARONI, PAJARONE y PAGLIARO— y no existe NI UNA SOLA persona así en toda la provincia. Lo único parecido es una «Pagliaro Margarita» de cuarenta y dos años en Las Colonias, que es otro apellido. Junto con la misma ausencia de su marido, eso prueba que llegaron DESPUÉS de junio de 1887.\n\nLo que significa en la práctica: mientras el apellido no esté fijado y no sepamos el pueblo, buscarla en un archivo italiano es tirar el tiempo — Antenati se organiza por municipio y no se puede buscar un apellido a ciegas en toda Italia. El orden correcto es al revés: primero la partida argentina que fije el apellido y dé el pueblo, y después Italia. Relacionado: [[angel_nelli]].", "padre": null, "madre": null, "conyuge": "angel_nelli", "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "stella_maris": {"id": "stella_maris", "nombre": "Stella Maris Salerno", "legal": "", "rol": "directa", "rolNombre": "Direct line", "gen": 10, "ramas": ["rivas", "salerno", "celeri", "faienza"], "resumen": "Born at Santa Fe on 23 December 1953. Gonzalo's mother.", "datos": [["Birth", "23 de diciembre de 1953, Santa Fe, Argentina"], ["Parents", "Carlos Francisco Salerno y Adelina Faienza"], ["Spouse", "Marcos Cesar Rivas"], ["Source", "árbol familiar"]], "mapa": null, "sinacta": "Persona viva o reciente: sus datos vienen del árbol familiar, no de archivo.", "padre": "carlos_salerno", "madre": "adelina_faienza", "conyuge": "marcos_rivas", "hijos": ["gonzalo", "luciano_rivas", "alfonsina_rivas"], "hermanos": ["susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marcos_rivas": {"id": "marcos_rivas", "nombre": "Marcos Cesar Rivas", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 10, "ramas": ["rivas", "salerno", "ce ily's life.", "datos": [["Children", "Marcos Ramón Rivas y al menos un hermano suyo; con varias mujeres, así que el número real se desconoce"], ["Name", "«en teoría Ramón» — así lo cuenta la familia. El segundo nombre de su hijo, Marcos RAMÓN, lo respalda: es la costumbre de poner al hijo el nombre del padre"], ["Source", "memoria familiar"]], "mapa": null, "sinacta": "El techo actual de la rama Rivas, y un techo difícil: un hombre con hijos en varias casas que se borró deja poco rastro civil y mucho rastro disperso. La vía no es buscarlo a él sino a sus hijos: cada partida de nacimiento de cada hermano lo nombra como padre, y cruzando dos o tres se fija su nombre completo, su edad y su pueblo. El hermano que fue a visitar a Marcos Ramón de viejo es la mejor pista viva: sus descendientes sabrán cosas que este lado de la familia no sabe.", "padre": null, "madre": null, "conyuge": null, "hijos": ["marcos_ramon_rivas", "hermano_marcos_ramon"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "hermano_marcos_ramon": {"id": "hermano_marcos_ramon", "nombre": "Hermano de Marcos Ramón", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 9, "ramas": ["rivas"], "resumen": "He came to visit Marcos Ramón when both were already old men. He looked exactly like him. We do not know his name.", "datos": [["Father", "Ramón Rivas"], ["Lo que se recuerda", "que apareció de visita ya de mayores y que el parecido entre los dos era total"], ["Source", "memoria familiar"]], "mapa": null, "sinacta": "Sin nombre, y es justo el dato que más rendiría: con su nombre y su partida se fija de golpe el nombre completo del padre. Se lo puede preguntar a Marcos César y a sus hermanos, que vivieron esa visita.", "padre": "ramon_rivas", "madre": null, "conyuge": null, "hijos": [], "hermanos": ["marcos_ramon_rivas"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "tebaldo_celeri": {"id": "tebaldo_celeri", "nombre": "Tebaldo Celeri", "legal": "TEBALDO JACOPO ARCHIMEDE CELERI en su partida de nacimiento", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-grandfather. He emigrated from Italy and ended up in the north of Santa Fe province, at Jobson, beside Vera station. He lost his first wife and married again in 1900, aged thirty-eight, to a girl of nineteen. For months he was a nameless gap in this tree: «the Celeri immigrant». On 27 August 2026 he stopped being one.", "datos": [["Birth", "*** 25 DE JULIO DE 1862, a las ocho de la mañana, en TRASSILICO (Garfagnana, provincia de Massa, hoy de Lucca) — acta 52 ***"], ["Nombre completo", "TEBALDO JACOPO ARCHIMEDE. Tres nombres, y dos de ellos cultos: Jacopo y ARCHIMEDE, por Arquímedes. No es un nombre de campesino"], ["Dónde nació", "en casa de la señora LUISA VANNI, en el paraje de Trassilico llamado ALLA MAESTÀ. Casa de la familia de su madre, no del padre"], ["Bautizado", "el mismo día de nacer, por don DOMENICO GRANDI, párroco de Trassilico"], ["Parents", "CALLISTO CELERI, de 31 años, SECRETARIO DEL AYUNTAMIENTO de Trassilico, hijo del difunto DESIDERIO; y ENRICHETTA VANNI, de 27, hija del difunto DOCTOR PIETRO VANNI"], ["Primera mujer", "ENCARNACIÓN FERNÁNDEZ. En octubre de 1900 él ya era VIUDO de ella"], ["Segunda mujer", "MARGARITA ALASIA, de diecinueve años, natural de Colonia Emilia — casados en VERA (Santa Fe) el 25 de octubre de 1900"], ["Address", "JOBSON, estación de Vera, departamento Vera, norte de la provincia de Santa Fe. Zona de colonias agrícolas fundadas por inmigrantes"], ["Hijos conocidos", "del primer matrimonio, ENRIQUETA (hacia 1894). Del segundo, ELBA y sus hermanas Olga, Ercilia, Rosa y Nerina"], ["Origin", "*** TRASSILICO, provincia de LUCCA, en la Garfagnana toscana — CONFIRMADO el 27 de agosto de 2026. *** Los dos actos argentinos decían sólo «natural de Italia»; lo que lo fija es el acta de defunción de su MADRE, que murió en Trassilico en 1923. La memoria familiar acertó el pueblo exacto"], ["Casa de la familia", "TRASSILICO, VIA DEL CENTRO, NÚMERO 17 — la dirección donde murió su madre, y el sitio del que salió hacia Argentina. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["La calle, hoy", "VIA DEL CENTRO YA NO EXISTE. Se le pidieron a OpenStreetMap todas las calles con nombre de Trassilico y son once, ninguna con ese nombre: Via Antonio Vallisneri, Via San Ansano, Via Leonardo Nobli, Via della Quercia, Via di Mezzo, Via Borghetto, Via Caraglia delle Gioie, Via della Fontana, y las plazas Umberto I, Giovanni Pierelli y Guglielmo Marconi. Los nombres cambiaron."], ["Calle probable", "VIA ANTONIO VALLISNERI. Medidas las once calles una por una: Via della Fontana tiene 2.085 m pero es la carretera de acceso desde el valle, fuera del casco. Dentro del pueblo las mayores son San Ansano (362 m) y VIA ANTONIO VALLISNERI (335 m) — y el centro de Vallisneri cae en 44.04151, 10.40348, que es exactamente el centroide del pueblo. ES LA CALLE CENTRAL. Y ANTONIO VALLISNERI (1661-1730), naturalista famoso, NACIÓ EN TRASSILICO: es el hijo ilustre del pueblo. https://www.google.com/maps/search/?api=1&query=Via+Antonio+Vallisneri%2C+Trassilico%2C+Gallicano%2C+Lucca"], ["Por qué cambió", "TRASSILICO FUE MUNICIPIO PROPIO hasta que Gallicano lo absorbió, hacia 1928. Cuando dos municipios se fusionan hay que renombrar las calles con nombre repetido, y «Via del Centro» es justo el tipo de nombre genérico que colisiona — Gallicano tendría la suya. Lo lógico es que la de Trassilico pasara a llamarse por el hijo ilustre. Y encaja con las fechas: Enrichetta murió en Via del Centro 17 en 1923, CINCO AÑOS ANTES de la fusión. Ese nombre era el vivo entonces. TODO ESTO ES INFERENCIA, no documento."], ["Alternativa", "Hay un número 17 realmente cartografiado, en VIA LEONARDO NOBLI (44.04216, 10.40396), junto a la Rocca Estense. Pero ésa es la calle del extremo norte, no el centro. En cambio Vallisneri tiene mapeados sólo los portales PARES, del 16 al 32: los impares no los ha cartografiado nadie, así que un 17 ahí es perfectamente posible y sencillamente no figura."], ["Cómo probarlo", "El STRADARIO del Comune di Gallicano, que suele conservar la concordancia entre nombres viejos y nuevos. Es una pregunta de dos líneas por correo: comunegallicano@postacert.toscana.it"], ["La iglesia", "SS. PIETRO E PAOLO de Trassilico — donde lo bautizaron el mismo día de nacer y donde se habían casado sus padres tres años antes. Es el edificio que sí está localizado. https://www.google.com/maps/search/?api=1&query=Chiesa+dei+Santi+Pietro+e+Paolo%2C+Trassilico%2C+Gallicano%2C+Lucca"]], "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico, Garfagnana — provincia de Lucca", "pie": "El pueblo donde nació el 25 de julio de 1862, a las ocho de la mañana. Cabe entero en doscientos cincuenta metros de norte a sur: lo que se ve aquí es todo Trassilico. La casa de VIA DEL CENTRO, 17 está en una de estas calles — esa calle ya no se llama así, y la candidata más probable es la VIA ANTONIO VALLISNERI, que atraviesa el centro justo por debajo del marcador. Al norte, a ochenta metros, la ROCCA ESTENSE. Al este, la iglesia de SAN PIETRO (44.04207, 10.40551), donde lo bautizaron el mismo día de nacer y donde sus padres se habían casado tres años antes."}, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": "margarita_alasia", "hijos": ["elba_celeri", "enriqueta_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["ciro_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "25 de julio de 1862, 8 de la mañana; inscrito el 30", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 52", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240 en Antenati)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 51.5 «Nati» 1862"], ["Registro", "ark an_ua35853262 · hash del contenedor: 5xxX6OE (30 imágenes)"], ["Página", "18 de 30 — folio 15 del libro; tres actas por página"], ["Registrar", "RANIERI BERTOLI BARSOTTI, sindaco y oficial del estado civil"], ["Cómo se localizó", "por el índice alfabético del final del registro, páginas 28 y 29: «Celeri Tebaldo Jacopo Archimede — paternità Callisto — 1862, Luglio 30, atto 52»"]], "literal": "52. L'anno 1862 milleottocento sessantadue, il giorno 30 trenta del mese di Luglio. Davanti me sottoscritto BERTOLI BARSOTTI RANIERI, Sindaco ufficiale dello Stato Civile del Comune di TRASSILICO, Circondario di GARFAGNANA, Provincia di MASSA, è comparso CELERI CALLISTO FU DESIDERIO, di anni 31 trentuno, SEGRETARIO COMUNALE, il quale, presenti Andreini Michele fu Matteo di anni 60 sessanta e Andreini Pietro fu Carlo di anni 30, ambidue DOTTORI FISICI e domiciliati tutti in Trassilico, ha dichiarato che nel giorno 25 venticinque del mese ed anno suddetti, alle ore 8 otto antemeridiane, gli è nato in casa della Signora VANNI LUISA posta in Trassilico luogo detto ALLA MAESTÀ, da CELERI ENRICHETTA DEL FU VANNI DOTTOR PIETRO di anni 27 ventisette sua consorte, un figlio di sesso mascolino, cui furono imposti i nomi di TEBALDO JACOPO ARCHIMEDE, e come dalla fede del Battesimo conferitogli dal Signor Don DOMENICO GRANDI Parroco locale il giorno stesso della sua nascita, che si unisce.", "traduccion": "Record 52. The year 1862, on the THIRTIETH OF JULY. Before me, RANIERI BERTOLI BARSOTTI, mayor and registrar of the Civil Status of the COMUNE OF TRASSILICO, district of the GARFAGNANA, province of MASSA, there appeared:\n\nCALLISTO CELERI, SON OF THE LATE DESIDERIO, aged THIRTY-ONE, TOWN CLERK.\n\nWho, in the presence of MICHELE ANDREINI, son of the late Matteo, aged sixty, and PIETRO ANDREINI, son of the late Carlo, aged thirty, BOTH PHYSICIANS and all three resident at Trassilico, declared that on the TWENTY-FIFTH of the same month and year, AT EIGHT IN THE MORNING, there was born to him — in the house of signora LUISA VANNI, situated at Trassilico, in the place called ALLA MAESTÀ — of ENRICHETTA CELERI, DAUGHTER OF THE LATE DOCTOR PIETRO VANNI, aged TWENTY-SEVEN, his wife, a son of the male sex, upon whom were bestowed the names TEBALDO JACOPO ARCHIMEDE.\n\nAnd so it appears in the certificate of baptism conferred on him by don DOMENICO GRANDI, the local parish priest, ON THE VERY DAY OF HIS BIRTH, which is annexed.", "notas": ["*** ES LA PARTIDA QUE CIERRA LA RAMA CELERI, Y APARECIÓ EL 27 DE AGOSTO DE 2026, EL MISMO DÍA QUE EL PUEBLO. *** Cuarenta y ocho horas antes, el padre de Elba era «un inmigrante italiano, creo que del norte», sin nombre.", "*** LA FAMILIA NO ERA CAMPESINA, Y ESTO CAMBIA EL RETRATO ENTERO. *** El padre era SEGRETARIO COMUNALE —el secretario del ayuntamiento de Trassilico, el hombre que escribía las actas del pueblo—. El abuelo materno era DOCTOR EN MEDICINA. Los dos testigos eran MÉDICOS. Y al niño le pusieron ARCHIMEDE, por Arquímedes. Compárese con la rama calabresa, donde todos, sin excepción, son braccianti, pecorai y contadini.", "*** GENERACIÓN NUEVA: DESIDERIO CELERI. *** «Celeri Callisto FU DESIDERIO» — el padre de Callisto, ya muerto en 1862. Con Callisto de 31 años en 1862, Desiderio sería de la generación de 1800 o antes.", "LA EDAD DE LA MADRE ENCAJA AL DEDILLO. Aquí tiene 27 años en julio de 1862 → nacida hacia 1835. Su acta de defunción de 1923 le da 88 años → nacida hacia 1835. Dos documentos separados por sesenta y un años y por mil kilómetros de archivo, con la misma cifra.", "PIETRO VANNI NO ERA MÉDICO SINO ABOGADO, y esto hay que rectificarlo: de este acta se dedujo que «dottor Pietro» significaba médico, y no. El acta de matrimonio de su otra hija, Luisa, en abril de 1863, lo dice sin ambigüedad: «di professione LEGALE, nato in LUCCA». Era hombre de leyes y venía de la ciudad. Ya había muerto en 1862.", "NACIÓ EN CASA DE LA SEÑORA LUISA VANNI, en el paraje de ALLA MAESTÀ — y el 27 de agosto de 2026 se supo quién era: *** LA HERMANA MAYOR DE SU MADRE. *** El acta de matrimonio de Luisa, de abril de 1863, la declara hija de los mismos padres. Tebaldo nació en casa de su tía carnal: Enrichetta fue a parir a casa de su hermana. Sesenta y un años después su madre moriría en la VIA DEL CENTRO, número 17. Son dos direcciones distintas del mismo pueblo.", "«TRASSILICO, CIRCONDARIO DI GARFAGNANA, PROVINCIA DI MASSA». En 1862 la Garfagnana pertenecía a la provincia de MASSA, no a la de Lucca. Por eso sus registros están en el Archivio di Stato di Massa y no en el de Lucca — dato que costó encontrar y que conviene no olvidar."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Fe%20de%20bautismo%20de%20Tebaldo%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Tebaldo - parroquia de Trassilico"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Nacimiento%20de%20Tebaldo%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2052.jpg", "t": "Nacimiento de Tebaldo Celeri - Trassilico, Lucca acta 52"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Portada%20del%20fasciculo%20de%20anexos%20-%20Atti%20di%20Nascita%20n%2052.jpg", "t": "Portada del fasciculo de anexos - Atti di Nascita n 52"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20Celeri%20Tebaldo%20fila%2014.jpg", "t": "Indice alfabetico de nacidos 1862 - Celeri Tebaldo fila 14"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20segunda%20mitad.jpg", "t": "Indice alfabetico de nacidos 1862 - segunda mitad"}], "zooms": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20Callisto%20del%20fu%20Desiderio%20del%20fu%20DOMENICO%20CELERI.jpg", "t": "Callisto del fu Desiderio del fu DOMENICO CELERI"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20comparece%20Celeri%20Callisto%20fu%20Desiderio.jpg", "t": "Acta 52, comparece Celeri Callisto fu Desiderio"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20la%20madre%20Enrichetta%20Vanni%20y%20los%20tres%20nombres.jpg", "t": "Acta 52, la madre Enrichetta Vanni y los tres nombres"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20la%20madre%2C%20hija%20del%20fu%20Vanni%20DOTTOR%20Pietro.jpg", "t": "La madre, hija del fu Vanni DOTTOR Pietro"}]}, {"titulo": "National Census of 1895", "tipo": "C", "tipoNombre": "Certificate", "fecha": "mayo de 1895", "lugar": "Vera, departamento Vera, Santa Fe, Argentina", "ref": "cédula censal, filas 8 a 10", "fuente": [["Archivo", "Archivo General de la Nación (Argentina)"], ["Fondo", "Segundo Censo Nacional de la República Argentina, 1895 — Vera, Vera, Santa Fe; imagen 520 de 626, grupo de imágenes 004163156"], ["Vía", "FamilySearch"]], "literal": "8 · Celeri · Tebaldo · V · 33 · C · Italia · — · Peluquero · sí\n9 · Fernandez · Concepción · M · 25 · C · Argentina · Córdoba · — · sí\n10 · Celeri · Enriqueta · M · 3 · — · Argentina · Santa Fe · — · —", "traduccion": "The columns of the census form are: surname, forename, whether male or female, how many years completed, whether single / married / widowed, which nation they belong to, if Argentine which province they were born in, what profession or trade they have, and whether they can read and write.\n\n· **TEBALDO CELERI**, male, THIRTY-THREE, MARRIED, of ITALIAN nationality, by trade a **BARBER**, can read and write.\n· **CONCEPCIÓN FERNÁNDEZ**, female, TWENTY-FIVE, MARRIED, ARGENTINE, born in the province of **CÓRDOBA**, can read and write.\n· **ENRIQUETA CELERI**, female, THREE, ARGENTINE, born in **SANTA FE**.\n\nOn the same page live a Campana family of French nationality, some Arzongas, merchants and shop assistants, a Peralta and a Moirad: the portrait of a newly founded farming frontier town, with French, Italians and Argentines mixed together.", "notas": ["*** ES LA FOTOGRAFÍA DE LA PRIMERA FAMILIA DE TEBALDO, CINCO AÑOS ANTES DE ENVIUDAR. *** Los tres seguidos en la cédula: el matrimonio y la niña. Es el único documento en que aparecen juntos.", "LA EDAD CUADRA AL DÍA. Treinta y tres años en 1895 → nacido en 1862, que es exactamente lo que dice su partida de Trassilico: 25 de julio de 1862. Dos archivos separados por el Atlántico y por treinta y tres años, con la misma cifra.", "*** ERA PELUQUERO. *** No agricultor ni jornalero, como casi todos sus vecinos. Y sabe leer y escribir. Encaja con la familia que dejó en Trassilico: un padre secretario del ayuntamiento y un abuelo médico.", "*** Y AQUÍ LA PRIMERA MUJER DEJA DE SER UN NOMBRE SUELTO. *** El acta de defunción de su hija, en 1946, la llamaba ENCARNACIÓN FERNÁNDEZ. El censo, cincuenta y un años antes y en vida de ella, la llama **CONCEPCIÓN FERNÁNDEZ**. Son dos advocaciones marianas y se confunden con facilidad medio siglo después; lo más probable es que el nombre bueno sea el del censo, escrito cuando ella estaba delante.", "Y da lo que faltaba de ella: **ARGENTINA, NACIDA EN LA PROVINCIA DE CÓRDOBA, de veinticinco años en 1895 → nacida hacia 1870**. No era italiana. Su acta de nacimiento estaría en Córdoba, y su matrimonio con Tebaldo —anterior a 1892— en Santa Fe.", "ENRIQUETA TENÍA TRES AÑOS EN 1895 → nacida hacia 1892. Su acta de defunción de 1946 le da cincuenta y dos años, que darían 1894. Dos años de diferencia; se prefiere el censo, tomado cuando la niña estaba viva y delante.", "VERA ERA UN PUEBLO NUEVO. El departamento Vera se colonizó en los años ochenta del siglo XIX; en 1895 Tebaldo llevaba ya unos quince años en Argentina y era el peluquero del sitio."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20Censo%20de%20Vera%2C%20Santa%20Fe%20-%20pagina%20del%20padron.jpg", "t": "Censo de Vera, Santa Fe - pagina del padron"}], "zooms": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20zoom%20-%20censo%2C%20filas%208%20a%2010%3A%20Tebaldo%2C%20Concepcion%20Fernandez%20y%20Enriqueta.jpg", "t": "Censo, filas 8 a 10: Tebaldo, Concepcion Fernandez y Enriqueta"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "25 de octubre de 1900", "lugar": "Vera, Santa Fe, Argentina", "ref": "libro parroquial, folio 101", "fuente": [["Archivo", "Archivo de la Notaría Mayor Eclesiástica de la Arquidiócesis de Santa Fe"], ["Fondo", "Colonia Dolores, San Justo, Santa Fe — imagen 57 de 164, grupo de imágenes 004518108"], ["Vía", "FamilySearch"], ["Oficiante", "el párroco de Vera"]], "literal": "En Vera, el día veinticinco del mes de Octubre del año de mil novecientos, autorizó el Matrimonio de Don TEBALDO CELERI de treinta y ocho años, natural de Italia, de estado VIUDO, hijo legítimo de Don CALISTO CELERI y de Doña ENRIQUETA VANNI, domiciliado en Jobson (Est. Vera), con Doña MARGARITA ALASIA de diecinueve años, natural de Col. Emilia, de estado soltera, hija legítima de Don BENITO ALASIA y de Doña MAGDALENA BERTINI, domiciliada en Vera, siendo testigos del acto Don DOMINGO ALASIA y Doña MARÍA DE ALASIA.", "traduccion": "The record is in Spanish and is transcribed as it stands. What it says, fact by fact:\n\n· HIM: Tebaldo Celeri, THIRTY-EIGHT (born around 1862), a native of ITALY — no village specified — of WIDOWED status, lawful son of CALISTO CELERI and ENRIQUETA VANNI, resident at JOBSON, beside Vera station.\n· HER: Margarita Alasia, NINETEEN, a native of COLONIA EMILIA (Santa Fe), unmarried, lawful daughter of BENITO ALASIA and MAGDALENA BERTINI, resident at Vera.\n· WITNESSES: Domingo Alasia and María de Alasia — relatives of hers.", "notas": ["*** ESTA ACTA CONVIERTE UN HUECO EN UNA PERSONA. *** Hasta ayer, el padre de Elba era «un inmigrante italiano, creo que del norte», sin nombre. Ahora tiene nombre, año de nacimiento, pueblo argentino, dos matrimonios y dos padres.", "«DE ESTADO VIUDO» — y ahí estaba escondida una familia entera. El acta de defunción de su hija Enriqueta, en Chaco en 1946, nombra como madre a ENCARNACIÓN FERNÁNDEZ. Es la primera mujer, la que murió antes de 1900. Hay por tanto una rama Celeri-Fernández anterior, sin explorar.", "DIECINUEVE AÑOS ELLA, TREINTA Y OCHO ÉL. Justo el doble. Un viudo de mediana edad casándose con la hija de otra familia de colonos: el patrón más corriente del norte santafesino de entonces.", "ESTA ACTA NO DICE DE QUÉ PUEBLO ERA — pone sólo «natural de Italia». Lo resolvió, el mismo día, un documento que nadie fue a buscar para eso: el acta de defunción de su MADRE, muerta en TRASSILICO (Lucca) en 1923. Los papeles de un emigrante rara vez dicen de dónde vino; los de quien se quedó, siempre.", "JOBSON existe todavía: es una localidad del departamento Vera, en el norte de Santa Fe, nacida alrededor de la estación del ferrocarril."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1900-10-25%20M%20Matrimonio%20de%20Tebaldo%20Celeri%20y%20Margarita%20Alasia%20-%20Vera%2C%20Santa%20Fe.jpg", "t": "Matrimonio de Tebaldo Celeri y Margarita Alasia - Vera, Santa Fe"}], "zooms": []}], "nActas": 3, "nImgs": 12, "titulo": "", "parrafos": [], "claves": []}, "margarita_alasia": {"id": "margarita_alasia", "nombre": "Margarita Alasia", "legal": "hija de «Benito Alasia y Magdalena Bertini» en el acta", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-grandmother. Born at Colonia Emilia, in the heart of the Piedmontese farming colonies of Santa Fe, and married at nineteen to an Italian widower twice her age.", "datos": [["Birth", "hacia 1882, COLONIA EMILIA, provincia de Santa Fe — los diecinueve años que declara al casarse. Argentina de nacimiento, italiana de sangre"], ["Parents", "BENEDETTO (Benito) ALASIA y MARIA MADDALENA BERTINO — por su acta de matrimonio de 1900"], ["Marriage", "25 de octubre de 1900, Vera, Santa Fe, con Tebaldo Celeri"], ["Daughters", "Elba, Olga, Ercilia, Rosa y Nerina Celeri. Puede haber más"], ["Origen de su familia", "SAVIGLIANO, provincia de CUNEO, PIAMONTE — sus padres se casaron allí, en la iglesia de San Giovanni Battista, el 13 de abril de 1857"]], "mapa": null, "sinacta": "Su acta de matrimonio está archivada en la ficha de Tebaldo. Falta su partida de nacimiento —Colonia Emilia, hacia 1881— y su defunción.\n\nUNA DEDUCCIÓN QUE SÍ ES FIRME, Y QUE CAMBIA DÓNDE HAY QUE BUSCAR. El acta de 1900 dice que era «natural de COL. EMILIA» y que tenía DIECINUEVE AÑOS. Nació, por tanto, EN ARGENTINA, hacia 1881. Y si ella nació aquí, SUS PADRES YA HABÍAN DESEMBARCADO ANTES DE 1881 — es decir, ANTES DE QUE EMPEZARA EL REGISTRO DEL CEMLA, que arranca en 1882. Por eso no hay que perder tiempo buscándolos en las listas de desembarco: llegaron antes de que existieran.\n\nY POR LO MISMO SE CAE UNA PISTA QUE PARECÍA BUENA. En CISEI figura un grupo familiar ALASIA completo desembarcado el 25 de febrero de 1882 —Bartolomeo de 17, Battista de 14, Clemente de 8 y un Bartolomeo de seis meses—. Se anotó como «verificar». NO PUEDE SER ESTA FAMILIA: llegan después de que Margarita naciera en Colonia Emilia, y una madre con un bebé de seis meses en febrero de 1882 no puede haber tenido otra hija en 1881. Queda descartado.\n\n*** APARECIÓ EN EL CENSO DE 1887, CON CINCO AÑOS. *** Colonia Emilia, tomo 12, libreto 12: «ALAZIO MARGARITA, 5, Argentina, Santa Fe», hija de OLAZIO BENEDETTO de 65 y de BERTINA MADALENA de 47. Con ella, sus hermanos DOMINGO (24, ya casado con MARÍA MOLINA), NICOLÁS (15), JUAN (11), FRANCISCO (9), MARÍA (7) y MADALENIA (1). Su madre declara CATORCE HIJOS.\n\nSUS DOS HERMANOS MAYORES FIRMARON SU BODA. Los testigos del acta de 1900, «Don DOMINGO ALASIA y Doña MARÍA DE ALASIA», son ese Domingo y su mujer.\n\nY EL CENSO FECHA LA EMIGRACIÓN sin necesidad de listas de barco: Domingo (n. 1863) y Nicolás (n. 1872) nacieron en Italia; Juan (n. 1876) ya nació en Santa Fe. LA FAMILIA DESEMBARCÓ ENTRE 1872 Y 1876 — diez años antes de que existiera el registro del CEMLA, que es exactamente por lo que nunca aparecían en él.\n\nLOS TESTIGOS DE SU BODA SON FAMILIA SUYA, casi con seguridad: Don DOMINGO ALASIA y Doña MARÍA DE ALASIA — «de Alasia» es la fórmula argentina de la mujer casada. Un hermano y una cuñada. Buscarlos es otra manera de llegar a los padres.\n\nSU APELLIDO ABRE UNA SEGUNDA ITALIA, Y NO ES LA MISMA. Los Alasia vienen de SAVIGLIANO, en la provincia de CUNEO, Piamonte; los Celeri, según la familia, de la Toscana. La abuela Elba tenía por tanto un padre italiano y una madre hija de italianos, de dos regiones distintas del norte. La memoria familiar decía «del norte» y acertaba dos veces.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "tebaldo_celeri", "hijos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["domingo_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "encarnacion_fernandez": {"id": "encarnacion_fernandez", "nombre": "Concepción Fernández", "legal": "«Encarnación Fernández» en el acta de defunción de su hija, de 1946", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Tebaldo Celeri's first wife, and she was not Italian: an Argentine from CÓRDOBA. For one day she was only a name in this tree, taken from a daughter's death certificate; the 1895 census put her back among the living, with an age, a province and, beside her, her husband and the little girl.", "datos": [["Name", "CONCEPCIÓN en el censo de 1895, tomado en vida suya. ENCARNACIÓN en el acta de defunción de su hija, cincuenta y un años después. Se prefiere el censo"], ["Birth", "hacia 1870, provincia de CÓRDOBA, Argentina — los veinticinco años que declara en el censo de 1895"], ["Nacionalidad", "ARGENTINA. Sabe leer y escribir"], ["Spouse", "TEBALDO CELERI, peluquero. Casados antes de 1892"], ["Hija conocida", "ENRIQUETA CELERI, de tres años en 1895 → n
