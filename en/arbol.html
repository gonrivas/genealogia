l him plain «Giacomo Palermo». He had at least four children at Marano between 1839 and 1852, moved with the family to Rende and died there on 13 May 1867, aged sixty.", "datos": [["Birth", "c. 1807, Marano Marchesato — from the age he declares at his death"], ["Parents", "GIUSEPPE PALERMO, pecorajo, and CARMINA SPIZZIRRI — CONFIRMED BY HIS OWN MARRIAGE RECORD (Rende, 1837, record 20), where she is called «Carmela». Both alive in 1837. It is no longer an inference"], ["Spouse", "Carmina Volpintesta"], ["Marriage", "19 October 1837, RENDE — record 20. OBTAINED. It was sought for years at Marano, where it is not: they married in her village"], ["Sisters", "ROSALIA PALERMO, married at Marano in 1838 at the age of seventeen, and AQUILA PALERMO, born at Marano on 22 June 1821. Sisters by father AND BY MOTHER, proven: his marriage record of 1837 gives him as the son of the same two"], ["Documented children", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Trade", "pastore in 1841, bracciale in 1845 and 1852, pecoraio when he died"], ["Contradas", "Palazzo (1841), Langhi (1845), Cerzi (1852) at Marano; then Rende"], ["Death", "13 May 1867, 4 p.m., Rende — record 35, aged 60"]], "vida": "c.1807–1867", "lug": "Marano Marchesato", "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": "carmina_volpintesta", "unionLibre": false, "otrasParejas": [], "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": ["aquila_palermo"], "actas": [{"titulo": "Parish extract of baptism", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 February 1809", "lugar": "Marano Marchesato", "ref": "parish of the Carmine", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni, processetti» 1837"], ["Register", "ark an_ua35976841 · container hash: LPAZyGB (269 images)"], ["Page", "225 of 269 — dossier 20, that of his own wedding"], ["Original", "book of the baptised of the church of SANTA MARIA DEL MONTE CARMELO of Marano Marchesato. Extract issued by the rector Dominicus Laura on 27 September 1837"], ["Legalisation", "F. Spizzirri, sindaco of Marano, and the chancellor Benedetto Conforti"], ["How it was located", "inside the dossier of his marriage of 1837, among the documents he had to produce in order to marry"]], "literal": "Anno Domini Mille Octingentesimo NONO die 14 mensis FEBRUARII Marani, R.D. MATTHAEUS SANTANNA baptizavit infantem natum ex JOSEPHO PALERMO et CARMELA SPIZZIRRI legitimis conjugibus, cui impositum est nomen FRANCISCUS JACOBUS; compater BARBARA SANTANNA.", "traduccion": "I, the undersigned rector of the church of SANTA MARIA DEL MONTE CARMELO of the town of Marano, having consulted the book of the baptised, certify that I have found the following entry:\n\n«IN THE YEAR OF OUR LORD EIGHTEEN HUNDRED AND NINE, ON THE 14th DAY OF THE MONTH OF FEBRUARY, AT MARANO, the reverend don MATEO SANTANNA baptised a boy born of GIUSEPPE PALERMO AND CARMELA SPIZZIRRI, LAWFULLY MARRIED, upon whom was bestowed the name FRANCESCO GIACOMO; godmother, BARBARA SANTANNA.»\n\nGiven at Marano, on the fifth of the calends of October 1837. Domingo Laura, rector.", "notas": ["THE PIECE THAT HAD BEEN MISSING FROM THE START. His birth is NOT in the civil registration of Marano for 1809: that year was read in full, eighty-four records, and the only two Palermo are the sons of other men. This extract, kept inside his marriage dossier, is probably the only copy that survives outside the parish book.", "«LEGITIMIS CONJUGIBUS» — lawfully wedded. Giuseppe Palermo and Carmela Spizzirri WERE ALREADY MARRIED in February 1809. Until now it was known only that they were married before 1812, from the first known child. Their marriage must be sought BEFORE 1809, and it is the document that would at last give the parents of Carmina Spizzirri.", "The twenty-eight years he declares on marrying in October 1837 give 1809. It coincides exactly with this baptism, and with the year the dossier's index attributed to him.", "The mother appears here as CARMELA, just as in the marriage record of 1837 and contrary to everything else, where she is CARMINA. Two different documents, the same variant: it may be that Carmela was her real baptismal name and Carmina the one in use."], "imgs": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1809-02-14%20N%20Bautismo%20de%20Francesco%20Giacomo%20Palermo%20-%20Marano%20Marchesato%2C%20parroquia%20del%20Carmine.jpg", "t": "Bautismo de Francesco Giacomo Palermo - Marano Marchesato, parroquia del Carmine"}], "zooms": []}, {"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "13 May 1867, 16 h", "lugar": "Rende", "ref": "record 35", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 59 «Morti» 1867"], ["Register", "an_ua35985546 · hash LD1KnvN"], ["Page", "11 of 36"], ["Registrar", "Luigi Perugini, assessor for the mayor being indisposed"], ["Handwritten year", "«milleottocento sessantasette» — agrees with the catalogue"]], "literal": "…è morto Giacomo Palermo, di anni sessanta, di professione pecoraio, domiciliato a Rende, marito di Carmina Volpintesta fu Vincenzo, nato a Marano Marchesato, figlio del fu Giuseppe.", "traduccion": "In the year eighteen hundred and sixty-seven, on the fourteenth day of the month of May, at seventeen hours, at the town hall of Rende, circondario of Cosenza, province of Calabria Citeriore.\n\nBefore me, LUIGI PERUGINI, acting assessor for the mayor being indisposed, Registrar of the Civil Status of the said comune, there appeared PASQUALE SACCO, son of the late Antonio, aged fifty, by trade a VETTURALE (carter), and COSTANTINO PERUGINI, son of the late Domenico, aged forty-two, by trade a SARTORE (tailor), both resident at Rende.\n\nWho declared to me that on the thirteenth day of the month aforesaid, at sixteen hours, in this comune of Rende, in the house of his dwelling situated in the contrada Nocolitani (uncertain reading), there died GIACOMO PALERMO, AGED SIXTY, by trade a PECORAIO (shepherd), resident at Rende, HUSBAND OF CARMINA VOLPINTESTA, daughter of the late Vincenzo, BORN AT MARANO MARCHESATO, SON OF THE LATE GIUSEPPE.\n\nThe record having been read to the informants, who declared that they could not write, I signed it alone. — The Assessor, Luigi Perugini.", "notas": ["The record DOES NOT NAME THE MOTHER. It breaks off at «figlio del fu Giuseppe». It was expected to confirm Carmina Spizzirri and it does not. — UPDATE, August 2026: the mother's name no longer depends on this record. It appeared in another, the marriage of Rosalia Palermo (Marano Marchesato, 8 December 1838, record 19), which names the whole couple: Giuseppe Palermo, pastore, and Carmina Spizzirri. What is missing now is not the name, but the proof that Rosalia and Giacomo were brother and sister.", "26 AUGUST 2026: THE LAST OBJECTION AGAINST CARMINA SPIZZIRRI FALLS. Her death record (1864) gave her seventy years, that is, born c. 1794, and on that reckoning she would have been THIRTEEN when he was born, c. 1807 — reason enough to stop taking her as his mother and to suspect a first marriage of Giuseppe Palermo. The birth of his sister AQUILA (Marano, 22 June 1821, record 34) has Giuseppe declare that Carmina is THIRTY-TWO years old: born c. 1789, eighteen when Francesco Giacomo was born. The reckoning fits and the earlier marriage ceases to be needed. There is still no direct proof —no document names Carmina and Francesco Giacomo together— but there is nothing against it any more.", "The two «fu» of the record are worth as much as the rest: Giuseppe Palermo was dead, and Vincenzo Volpintesta, the widow's father, was too.", "«Marito di», not «vedovo»: Carmina Volpintesta was still alive in May 1867. She was widowed in her early fifties.", "THE AGE FORCES A CORRECTION OF THE PAGE. Sixty years old in May 1867 places his birth c. 1806-1807, not c. 1812 as had been said on the strength of the 27 years he declared in 1839. The records of his other three children give 36 years in 1841, 38 in 1845 and 40 in 1852: four of the five figures fall between 1805 and 1812, with the median in 1807.", "The officer who draws up the record is LUIGI PERUGINI, the same man who as mayor of Rende had married his daughter Maria Antonia to Michele Salerno nine years earlier, in August 1858.", "He died in Rende having been born in Marano Marchesato: the family had already moved, which explains why his daughter's wedding in 1858 was celebrated in Rende."], "imgs": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20Francesco%20Giacomo%20Palermo%20-%20Rende%20acta%2035.jpg", "t": "Francesco Giacomo Palermo - Rende acta 35"}], "zooms": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20acta%2035%20completa.jpg", "t": "Acta 35 completa"}, {"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20declarantes%20Pasquale%20Sacco%20y%20Costantino%20Perugini.jpg", "t": "Declarantes Pasquale Sacco y Costantino Perugini"}, {"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20edad%2C%20oficio%20pecoraio%20y%20esposa%20Carmina%20Volpintesta.jpg", "t": "Edad, oficio pecoraio y esposa Carmina Volpintesta"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 October 1837, 21 h", "lugar": "Rende", "ref": "record 20", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni» 1837"], ["Register", "ark an_ua35976844 · container hash: wbVEAb4 (28 images)"], ["Page", "21 of 28 — folio 20 of the book; one record to the image, in the right-hand half"], ["Registrar", "Mario Magdalone, sindaco of Rende"], ["Handwritten year", "«mille ottocento trentasette» — agrees with the catalogue"], ["How it was located", "first in the scanned index of the marriages of Rende for 1837, row 20; then the record itself, right at the first try with the straight line page = record + 1"]], "literal": "…sono comparsi nella casa comunale FRANCESCO GIACOMO PALERMO di anni VENTOTTO, nato in MARANO MARCHESATO, professione PECORAJO, domiciliato ivi, figlio di GIUSEPPE, domiciliato ivi, di professione PECORAJO, e di CARMELA SPIZZIRRI, domiciliata ivi; e CARMINA VOLPENTESTA di anni VENTITRE, nata in MARANO MARCHESATO, domiciliata RENDE, figlia del FU VINCENZO, domiciliato ————, e di TERESA LUCHETTA, domiciliata ivi…", "traduccion": "In the year eighteen hundred and thirty-seven, on the NINETEENTH day of the month of OCTOBER, at TWENTY-ONE hours, before Us, MARIO MAGDALONE, mayor and registrar of the Civil Status of the comune of RENDE, district of Cosenza, province of Calabria Citra, there appeared at the town hall:\n\nFRANCESCO GIACOMO PALERMO, AGED TWENTY-EIGHT, born at MARANO MARCHESATO, by trade a PECORAJO (shepherd), resident there, SON OF GIUSEPPE, resident there, by trade a PECORAJO, AND OF CARMELA SPIZZIRRI, resident there;\n\nand CARMINA VOLPENTESTA, AGED TWENTY-THREE, born at MARANO MARCHESATO, resident at RENDE, DAUGHTER OF THE LATE VINCENZO and OF TERESA LUCHETTA, resident there.\n\nNotice of the promise was posted on the door of the town hall of Rende on Sunday the first of October, AND AT MARANO MARCHESATO on the same day — in both villages, because he was from Marano and she was already living at Rende.\n\nDocuments presented: 1st the husband's birth record; 2nd the wife's; 3rd the certificate that the husband is unmarried and under no military obligation; 4th that the wife is unmarried; 5th THE DEATH CERTIFICATE OF THE WIFE'S FATHER; 6th THE DEATH CERTIFICATE OF HER PATERNAL GRANDFATHER; 7th the death certificate of her mother; 8th the extract of the notices, against which there was no opposition.\n\nFour witnesses: SALVATORE PORRO, aged thirty, bracciale, of Rende; SALVATORE COSTABILE, aged twenty-three, SARTORE (tailor); GIUSEPPE DE PAOLA, aged twenty-eight, FALEGNAME (carpenter); and FRANCESCO DE GENNARO, aged thirty-three, sartore. All of Rende.\n\n[Right-hand column] The parish priest of SANTA MARIA MAGGIORE returned one of the copies, certifying at the foot that the canonical celebration of the marriage followed on the TWENTIETH of the same month, before the witnesses IGNAZIO MANDARINO and PIETRO PERUGINI.", "notas": ["THIS IS THE RECORD THAT CLOSES THE FILIATION OF FRANCESCO GIACOMO. Until 26 August 2026, that he was the son of Giuseppe Palermo and Carmina Spizzirri was an inference by convergence: it rested on his sister Rosalia's record of 1838 and on the coincidence of village, name and trade. Here his own marriage record says it. Therefore ROSALIA and AQUILA PALERMO are his sisters of both father and mother, and Carmina Spizzirri is a great-grandmother in the direct line without any reservation.", "This wedding was looked for over months in MARANO MARCHESATO, and it is not there: nine indexes, from 1830 to 1838, a hundred and eighty-three weddings, not a single male Palermo with any Volpintesta. It was in RENDE. The lesson, noted down: when both bride and groom are from one village but she is already living in another, the wedding is celebrated where SHE lives. The double notification — Rende and Marano — says so in the record itself.", "THE MOTHER IS CALLED «CARMELA» HERE AND «CARMINA» IN EVERYTHING ELSE. They are variants of the same root and the Rende clerk did not know her. The father, the village and the trade all match, so there is no reason to doubt that it is the same woman, but it is noted.", "MICHELE VOLPINTESTA, CONFIRMED BY RECORD. Document number 6 is the death certificate of the bride's paternal grandfather: it is Michele, the father of the late Vincenzo. Until now that grandfather depended on the blog index and on the index of the dossier; now an original record backs him up.", "POINT 7 JARS, and it is worth saying so: it calls for the death certificate «della di lei madre», and the bride's mother, Teresa Luchetta, appears ALIVE three lines higher up in this very record and does not die until 1851. Most probably it is boilerplate: the law required proof of who was to give consent — the father dead, it passes to the paternal grandfather, and he dead, to the mother — and the clerk copied out the whole list. It is NOT to be taken as an indication of another mother.", "The five Marano records fit with this one without forcing anything: Vincenzo appears as «fu» and died in 1823; Teresa Luchetta appears alive and died in 1851; Giuseppe and Carmela appear alive and died in 1863 and 1864. And the groom's twenty-eight years give 1809, which is exactly the year the dossier index attributes to his birth.", "WHAT IS MISSING NOW: the PROCESSETTO of Rende 1837. Documents 1 and 2 of the list are the birth records of the two spouses, and the dossier preserves them. That of Francesco Giacomo (1809, Marano) is the piece that has been missing for years: it is not in the civil registration of Marano for 1809, read in full, so that extract may be the only copy left."], "imgs": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 2, "nImgs": 5, "titulo": "He began and ended as a shepherd", "parrafos": ["The records almost always call him plain Giacomo Palermo; the full «Francesco Giacomo» appears only at his daughter's marriage in 1858. He was born at Marano Marchesato around 1807, and that date is an average of figures that do not agree with one another: he declared twenty-seven in 1839, thirty-six in October 1841, thirty-eight in February 1845, forty in January 1852, and his death record puts him at sixty in May 1867. Four of the five fall between 1805 and 1812.", "The trade comes and goes with the years: pastore when he registers Antonio in 1841, bracciale in 1845 and 1852, pecoraio — sheep-herder — when he dies. He begins and ends with livestock. The contradas move too: Palazzo in 1841, Langhi in 1845, Cerzi in 1852, all within Marano; and then the whole village, because the family ended up settled at Rende.", "He died there on 13 May 1867 at four in the afternoon, at home, in a contrada the record writes as «Nocolitani» and which is at the resolution limit of the scan. The record says «marito di Carmina Volpintesta»: he did not die a widower, she outlived him. And it adds that he was «figlio del fu Giuseppe», without naming the mother.", "The man signing the record as registrar was Luigi Perugini, acting assessor. Nine years earlier, as mayor of Rende, it was he who had married his daughter Maria Antonia to Michele Salerno."], "claves": [["Trade", "pastore and pecoraio; bracciale in the middle years"], ["Born", "c. 1807 at Marano Marchesato"], ["Contradas", "Palazzo, Langhi and Cerzi at Marano; then Rende"], ["Could sign", "no"], ["Death", "13 May 1867, aged 60"]]}, "carmina_volpintesta": {"id": "carmina_volpintesta", "nombre": "Carmina Volpintesta", "legal": "VOLPENTESTA in the Marano records; Volpintesta in those of Rende", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "Wife of Giacomo Palermo and mother of Maria Antonia. Born at Marano Marchesato in May 1814, daughter of Vincenzo Volpentesta and Teresa Luchetta. She lost her father at eight and was widowed at Rende in May 1867.", "datos": [["Birth", "May 1814, MARANO MARCHESATO — record 41; the day is read as 12 with reservations (see the notes to the record)"], ["Parents", "VINCENZO VOLPENTESTA, bracciale, 38 years old, and TERESA LUCHETTA, 31 years old — CONFIRMED at first hand by her own birth record"], ["Spouse", "Francesco Giacomo Palermo, pecoraio († 13 May 1867)"], ["Marriage", "19 October 1837, RENDE — record 20. OBTAINED. She was 23 and already living at Rende; the record gives her as the daughter of the late Vincenzo and of Teresa Luchetta, exactly what her certificate of 1814 said"], ["Documented children", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Documented brother", "EMMANUELE VOLPENTESTA, married to Michelina Cairo, dead at Marano in 1864 (record 11 of the index)"], ["Orphaned of her father", "19 March 1823, at eight years and ten months old"], ["Still alive in", "13 May 1867 — her husband's death record says «marito di», not «vedovo»"], ["Spelling", "Volpintesta at Rende; Volpentesta in the Marano records, her own included"]], "vida": "1814–>1867", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "vincenzo_volpintesta", "madre": "teresa_luchetta", "conyuge": "francesco_giacomo", "unionLibre": false, "otrasParejas": [], "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "May 1814, 14 h — born on the mismo día dthe record", "lugar": "Marano Marchesato", "ref": "record 41", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile napoleonico > Marano Marchesato > Registro 6 «Nati» 1814"], ["Register", "container hash: w1yyOoo"], ["Page", "24 of 64, RIGHT-hand column (on the left, record 40)"], ["Handwritten year", "the printed form says «L'anno milleottocento TREDICI»; it is struck through and corrected by hand to QUATTORDECI, 1814. It agrees with the catalogue and with record 63 of the same register, of August 1814"], ["Registrar", "Francesco Conforti, sindaco"], ["How it was located", "this register does NOT follow the straight line of the death registers. Page 41 has a single record, 63; page 27 has two, 46 and 47. In that stretch it runs two to the image and record 41 falls on page 24"]], "literal": "…è comparso Vincenzo Volpentesta di anni trenta otto di professione Bracciale domiciliato nel detto comune… ed ha dichiarato che il giorno soprain[dicato]… è nato in sua casa da esso dichiarante e da Teresa Luchetta sua moglie legittima di anni trenta una, una femina che ci ha presentato… a cui si è dato il nome di CARMINA.", "traduccion": "In the year eighteen hundred and FOURTEEN, on the (day) of the month of MAY, at FOURTEEN hours, before Us, FRANCESCO CONFORTI, mayor and registrar of the civil status of the comune of MARANO MARCHESATO, province of Calabria Citra, there appeared VINCENZO VOLPENTESTA, AGED THIRTY-EIGHT, by trade a BRACCIALE, resident in the said comune.\n\nAnd he declared that on the DAY STATED ABOVE there was born IN HIS HOUSE, of himself, the informant, and of TERESA LUCHETTA, HIS LAWFUL WIFE, AGED THIRTY-ONE, A GIRL whom he has presented to us, and TO WHOM HAS BEEN GIVEN THE NAME CARMINA.\n\nThe presentation and declaration were made in the presence of GIOVANNI VINCIULLO, aged twenty-six, by trade a CONTADINO, resident in the aforesaid place, and of GIOVANNI ROSSO, aged twenty-eight, likewise by trade a CONTADINO, resident in the same contrada, witnesses.\n\nThe present record was read both to the informant and to the witnesses, and thereafter signed by Us and by the informant: VINCENZO VOLPENTESTA.", "notas": ["HER PARENTAGE NO LONGER DEPENDS ON HER HUSBAND'S RECORD. Until now Carmina was the daughter of Vincenzo only because the death record of Giacomo Palermo (Rende, 1867) called her «Carmina Volpintesta FU VINCENZO», and Teresa Luchetta appeared on no paper at all. Here Vincenzo himself appears before the mayor, declares his age and his trade and names his wife. It is the first-hand source.", "THE DAY CANNOT BE READ WITH CERTAINTY, and it is best not to pretend otherwise. The number of the day is split by the line break —it ends in «...ce» at the start of the following line— and the piece left on the first line is overlaid by a much later marginal annotation. It reads «D...ce» and by far the most probable is DODECE, twelve. What is certain: it is MAY 1814 and it is LATER THAN THE 10th, because record 40, on the same opening, is of the day «Diece» at sixteen hours, and this one was drawn up at fourteen. The files are dated 1814-05-12 with that reservation.", "IT GIVES NO CONTRADA. The record says only that the father is «domiciliato nel detto comune» and that the girl was born «in sua casa». This Napoleonic form has no contrada box; those of the Restoration do, and that is why for her own children we know the contrade Langhi and Cerzi.", "THE PARENTS' AGES. He thirty-eight —born c. 1776— and she thirty-one —c. 1783—. Their death records give fifty years in 1823 (c. 1773) and seventy-two in 1851 (c. 1779). The two pairs of figures differ by three and four years, which is the normal thing: in these registers nobody knew their exact age.", "VINCENZO SIGNS. At the foot of the record is his signature, «Vincenzo Volpentesta», while the two witnesses are illiterate. A bracciale who can write his name in 1814 is not the usual thing.", "THE YEAR WAS MISPRINTED. The form came preprinted «L'anno milleottocento TREDICI» —1813— and the clerk struck it out and wrote QUATTORDECI over it. It is the same notebook reused from one year to the next.", "She was born in May 1814 and her father died in March 1823: she was eight years and ten months old. Her mother, Teresa Luchetta, raised her as a widow and lived until 1851."], "imgs": [{"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Carmina%20Volpintesta%20-%20Marano%20Marchesato%20acta%2041.jpg", "t": "Carmina Volpintesta - Marano Marchesato acta 41"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Copia%20certificada%20de%201837%20del%20acta%2041%20-%20Marano%20Marchesato.jpg", "t": "Copia certificada de 1837 del acta 41 - Marano Marchesato"}], "zooms": [{"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20acta%2041%20completa.jpg", "t": "Acta 41 completa"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20cabecera%2C%20ano%201814%20y%20acta%2041.jpg", "t": "Cabecera, ano 1814 y a  there: nine indexes, from 1830 to 1838, a hundred and eighty-three weddings, not a single male Palermo with any Volpintesta. It was in RENDE. The lesson, noted down: when both bride and groom are from one village but she is already living in another, the wedding is celebrated where SHE lives. The double notification — Rende and Marano — says so in the record itself.", "THE MOTHER IS CALLED «CARMELA» HERE AND «CARMINA» IN EVERYTHING ELSE. They are variants of the same root and the Rende clerk did not know her. The father, the village and the trade all match, so there is no reason to doubt that it is the same woman, but it is noted.", "MICHELE VOLPINTESTA, CONFIRMED BY RECORD. Document number 6 is the death certificate of the bride's paternal grandfather: it is Michele, the father of the late Vincenzo. Until now that grandfather depended on the blog index and on the index of the dossier; now an original record backs him up.", "POINT 7 JARS, and it is worth saying so: it calls for the death certificate «della di lei madre», and the bride's mother, Teresa Luchetta, appears ALIVE three lines higher up in this very record and does not die until 1851. Most probably it is boilerplate: the law required proof of who was to give consent — the father dead, it passes to the paternal grandfather, and he dead, to the mother — and the clerk copied out the whole list. It is NOT to be taken as an indication of another mother.", "The five Marano records fit with this one without forcing anything: Vincenzo appears as «fu» and died in 1823; Teresa Luchetta appears alive and died in 1851; Giuseppe and Carmela appear alive and died in 1863 and 1864. And the groom's twenty-eight years give 1809, which is exactly the year the dossier index attributes to his birth.", "WHAT IS MISSING NOW: the PROCESSETTO of Rende 1837. Documents 1 and 2 of the list are the birth records of the two spouses, and the dossier preserves them. That of Francesco Giacomo (1809, Marano) is the piece that has been missing for years: it is not in the civil registration of Marano for 1809, read in full, so that extract may be the only copy left."], "imgs": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 1, "nImgs": 6, "titulo": "Thirty years old, twice", "parrafos": ["She has no record of her own and yet appears in five: the births of her four children — Maria Antonia in 1839, Antonio in 1841, Annunciata in 1845 and Teresa in 1852 — and her husband's death in 1867.", "The ages he declares for her are a good illustration of how little these figures are worth: thirty in October 1841, thirty again in February 1845, and thirty-five in January 1852. They place her somewhere between 1812 and 1817, and no closer.", "In May 1867 she was alive: her husband's death record calls him «marito di Carmina Volpintesta», not a widower. And in passing it says «fu Vincenzo», so her own father was by then dead. The surname is written Volpintesta in the Rende records and Volpentesta in the Marano ones. Her birth would have to be sought around 1815; the «of Rende» the starting index gives her is confirmed by no record read."], "claves": [["Born", "between 1812 and 1817, place unconfirmed"], ["Appears in", "five records, none of them hers"], ["Documented children", "four, between 1839 and 1852"], ["Still alive in", "May 1867"]]}, "aquila_palermo": {"id": "aquila_palermo", "nombre": "Aquila Palermo", "legal": "«Rosalia Palermo» on her marriage record", "rol": "hermano", "rolNombre": "Sibling", "gen": 5, "ramas": ["salerno"], "resumen": "Sister of Francesco Giacomo. She was born at Marano Marchesato on 22 June 1821 and married there on 8 December 1838, aged seventeen. For months she appeared in this tree as TWO women — Aquila and Rosalia — because the records call her by both names. Her marriage file proved she was one.", "datos": [["Birth", "22 June 1821, at 11 a.m., in her parents' house — Marano Marchesato, contrada Malvitani"], ["Name", "AQUILA in her certificate, in the parish priest's note and on the cover of her marriage dossier. ROSALIA in the marriage record proper. The same woman"], ["Parents", "Giuseppe Palermo, BRACCIALE, 40 years old; and Carmina Spizzirri, 32 years old"], ["Baptism", "that same 22 June 1821, parish of Marano"], ["Marriage", "8 December 1838, Marano Marchesato — record 19, to VINCENZO GAETANO SANTELLI, bracciale, aged 28"], ["Siblings", "FRANCESCO GIACOMO PALERMO, proven by his own marriage record (Rende 1837), which gives him as the son of the same two. And by index: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) and Francesca (1823)"], ["After 1838", "NOTHING ANY LONGER. The Marano index of the dead for 1864 carries, at record 91, GAETANA SANTELLI, «daughter of Santelli, Vincenzo Gaetano and of Palermo, Aquila» — her daughter. Twenty-six years of silence broken by one row. Her own death is still not located"]], "vida": "b.1821", "lug": "", "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["francesco_giacomo"], "actas": [{"titulo": "Marriage dossier (processetto)", "tipo": "P", "tipoNombre": "Banns", "fecha": "noviembre-December 1838", "lugar": "Marano Marchesato", "ref": "processetti 1838, dossier 19", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni, processetti» 1838"], ["Register", "ark an_ua35968823 · container hash: Lollxnp (179 images)"], ["Page", "157 to 162 of 179 — dossier 19"], ["Contents", "cover sheet; the groom's certificate (Marano 1810, record 10); THE BRIDE'S CERTIFICATE, which is record 34 of 1821; and the death record of the groom's mother (Marano 1816, record 42)"]], "literal": "Comune di Marano Marchesato — Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO, di detta Comune.", "traduccion": "COVER OF THE DOSSIER: «Comune of Marano Marchesato. Act of solemn promise of marriage between VINCENZO GAETANO SANTELLI and AQUILA PALERMO, of the said comune.» Seen by the mayor Luigi De Filippis, 16 November 1838.\n\nIT CONTAINS FOUR DOCUMENTS:\n\n1. The groom's birth record — Marano, record 10 of 1810: Gennaro Santelli, a bracciale aged 24, of the place called Pascalone, presents a boy born on 5 February 1810 of his lawful wife ANNA MARIA DI BARTOLO, and bestows on him the names VINCENZO GAETANO.\n\n2. THE BRIDE'S BIRTH RECORD — and it is RECORD 34 OF 1821, that of AQUILA: Giuseppe Palermo, aged forty, bracciale, of the contrada Malvitani, presents a girl born of Carmina Spizzirri, aged thirty-two, and gives her the name AQUILA.\n\n3. The death record of the groom's mother — Marano, record 42 of 1816: ANNA MARIA DE BARTOLO, daughter of the late Francesco and wife of Gennaro Santelli, aged twenty-four, contadina, of the street Pascalone, died on 21 August 1816 in her own house. Her death was reported by two neighbours and kinsmen, Domenico and Raffaele Santelli.\n\n4. The notices, posted without opposition.", "notas": ["THIS DOSSIER IS THE ONE THAT PROVES THAT AQUILA AND ROSALIA ARE THE SAME WOMAN. The cover calls her Aquila. Her birth certificate calls her Aquila. And the marriage record that comes out of this very dossier calls her Rosalia. There are not two sisters: there is one woman with two names, the register's and the household's.", "And it explains the puzzle that had been open for months: ROSALIA PALERMO does not appear in any register of births of Marano between 1809 and 1826, swept year by year, BECAUSE SHE IS REGISTERED AS AQUILA.", "The lesson in method, and it is the second time in two days: THE DOSSIER IS WORTH MORE THAN THE RECORD. First it was the Rende one of 1837, which yielded a baptism of 1809 non-existent in the civil registration and a death of 1793. Now this one, which undoes a mistaken identity. Always ask for the processetto.", "From the bridegroom one gets his whole branch into the bargain: Vincenzo Gaetano Santelli, born 5 February 1810, son of Gennaro Santelli, bracciale, and of Anna Maria de Bartolo, who died aged twenty-four when he was six. They lived at the place called Pascalone."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20la%20partida%20de%20la%20novia%20es%20el%20acta%2034%20de%20Aquila.jpg", "t": "Expediente 19, la partida de la novia es el acta 34 de Aquila"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20muerte%20de%20la%20madre%20del%20novio%2C%201816%20acta%2042.jpg", "t": "Expediente 19, muerte de la madre del novio, 1816 acta 42"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20partida%20del%20novio%2C%201810%20acta%2010.jpg", "t": "Expediente 19, partida del novio, 1810 acta 10"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20portada%3A%20Santelli%20ed%20AQUILA%20PALERMO.jpg", "t": "Expediente 19, portada: Santelli ed AQUILA PALERMO"}], "zooms": []}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "8 December 1838, 21 h", "lugar": "Marano Marchesato", "ref": "record 19", "fuente": [["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni» 1838"], ["Register", "container hash dam- : wlppqoW (25 pages)"], ["Page", "20 of 25 — folio 19 of the book"], ["Registrar", "Luigi De Filippis, sindaco"], ["Handwritten year", "«L'anno mille ottocento trentotto» — agrees with the catalogue"], ["How it was located", "by the «Tavola alfabetica» at the end of the register, pages 24 and 25, row 19"]], "literal": "…sono comparsi nella casa comunale VINCENZO GAETANO SANTELLI di anni ventotto, nato in Marano suddetto, di professione bracciale, domiciliato ivi, figlio di GENNARO di professione bracciale domiciliato ivi, e di FU ALMA MARIA DI BARTOLO; e ROSALIA PALERMO di anni diciassette, nata in Marano medesimo, domiciliata ivi, figlia di GIUSEPPE di professione PASTORE domiciliato ivi, e di CARMINA SPIZZIRRI domiciliata col di lei marito…", "traduccion": "In the year eighteen hundred and thirty-eight, on the eighth day of the month of December, at twenty-one hours, before Us, LUIGI DE FILIPPIS, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared at the town hall:\n\nVINCENZO GAETANO SANTELLI, AGED TWENTY-EIGHT, born at Marano, by trade a BRACCIALE (day labourer), resident here, son of GENNARO, by trade a bracciale, resident here, and of the LATE ALMA MARIA DI BARTOLO;\n\nand ROSALIA PALERMO, AGED SEVENTEEN, born at Marano itself, resident here, DAUGHTER OF GIUSEPPE, BY TRADE A PASTORE, RESIDENT HERE, AND OF CARMINA SPIZZIRRI, RESIDENT WITH HER HUSBAND.\n\nWho, in the presence of the witnesses named below, requested us to receive their solemn promise to celebrate before the Church, in the forms prescribed by the Holy Council of Trent, the marriage proposed between them. Notice of this promise was posted on the door of the town hall of Marano Marchesato on Sunday the eighteenth of November of the current year.\n\nDocuments presented: 1st the birth records of the husband and of the wife; 2nd the death record of ALMA MARIA DI BARTOLO, the husband's mother. It is further established that the husband is under no military obligation, and that husband and wife are unmarried. At the posting of the notices there was no impediment whatever. Finally, THE HUSBAND'S FATHER AND THE WIFE'S PARENTS gave their consent orally.\n\nFour witnesses took part in the solemn promise: ANTONIO CAIRA, aged fifty, bracciale, resident at Marano; GIUSEPPE GENUITA, aged thirty-six, MOLINARO (miller); MICHELE SCOLA, aged fifty, bracciale; and SAVERIO VITIELI, aged twenty-six, bracciale. The contracting parties and the witnesses declared that they COULD NOT WRITE.\n\n[Right-hand column] The parish priest of Marano returned to us one of the copies of the aforesaid promise; at the foot of which he certified that the celebration of the marriage followed on the EIGHTH day of the month of DECEMBER of the current year, in the presence of the witnesses GIUSEPPE MARRONE and GASPARE BARTUCCI.", "notas": ["THIS IS THE RECORD THAT RESCUES CARMINA SPIZZIRRI. Marano of 1838 was searched for the wedding of Giacomo Palermo to Carmina Volpintesta and it is not there —the index of the year, with its twenty-one weddings, brings no male Palermo nor any Volpentesta—. But in row 19 there was a Palermo bride «di Giuseppe», and the record develops it by naming both parents.", "Giuseppe Palermo appears ALIVE and with a trade: PASTORE. It is the same trade as his presumed son Giacomo, who was a pastore in 1841 and died a pecoraio in 1867. The coincidence of village, name and trade is what sustains the kinship.", "Carmina Spizzirri appears ALIVE, «domiciliata col di lei marito». It is the first time her name comes out of an original document.", "The two «fu» of the record are on the bridegroom's side, not on ours: the dead person is Alma Maria di Bartolo, mother of Vincenzo Santelli. On the Palermo side there is no «fu» at all, and that is how we know that both of Rosalia's parents were alive.", "WHAT IT DOES NOT SAY, and one must be honest: it does not say that Rosalia is the sister of Francesco Giacomo. Nobody has seen her named in any record of the Rende family. The kinship is an inference by convergence, a very strong one but an inference. It would be closed by the birth of Francesco Giacomo (Marano, c. 1807) or by that of Rosalia herself (Marano, c. 1821): both would name the same couple.", "Note on resolution: the Marano scans are 2164 × 1900 pixels, which is their original size; the archived crops were requested from the server at those same coordinates and are not rescaled.", "RECTIFICATION OF 26 AUGUST 2026, IN THE AFTERNOON: AQUILA AND ROSALIA ARE THE SAME WOMAN. In the morning the opposite had been concluded, and with reasoning that seemed sound: record 34 of 1821 imposes ONE SINGLE name, AQUILA, and the parish priest's note and the register's annual table repeat it. From that it was deduced that Rosalia had to be another sister. It was a deduction, not proof, and it was wrong.\n\nIt was settled by THE DOSSIER OF HER OWN WEDDING —Marano Marchesato, processetti 1838, dossier 19, pages 157 to 162—. The cover says, in so many words: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». And the birth certificate the bride presented, sewn inside the bundle, IS RECORD 34 OF 1821, that of Aquila.\n\nThat is to say: the dossier calls her Aquila, her birth certificate calls her Aquila, and the marriage record that comes out of that same dossier calls her Rosalia. The clerk used the name by which she was known in the village. And that explains once and for all the puzzle that had been open for months: ROSALIA PALERMO DOES NOT APPEAR IN ANY REGISTER OF BIRTHS OF MARANO BETWEEN 1809 AND 1826 —swept year by year— BECAUSE SHE IS REGISTERED AS AQUILA."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20Vincenzo%20Santelli%20y%20Rosalia%20Palermo%20-%20Marano%20Marchesato%20acta%2019.jpg", "t": "Vincenzo Santelli y Rosalia Palermo - Marano Marchesato acta 19"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%201%20a%2010.jpg", "t": "Indice alfabetico 1838 - actas 1 a 10"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%2011%20a%2021.jpg", "t": "Indice alfabetico 1838 - actas 11 a 21"}], "zooms": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20celebracion%20canonica%20y%20testigos.jpg", "t": "Celebracion canonica y testigos"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20documentos%20presentados.jpg", "t": "Documentos presentados"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20novios%2C%20edades%20y%20oficios.jpg", "t": "Novios, edades y oficios"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20padres%20de%20la%20novia%20Giuseppe%20Palermo%20y%20Carmina%20Spizzirri.jpg", "t": "Padres de la novia Giuseppe Palermo y Carmina Spizzirri"}]}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "22 June 1821, 19 h (the record); born the same day at 11 h", "lugar": "Marano Marchesato", "ref": "record 34", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 13 «Nati» 1821"], ["Register", "container hash: 5gZZmB2 (53 pages)"], ["Page", "19 of 53, LEFT-hand column (on the right, record 35)"], ["Handwritten year", "it is PRINTED on the form of the Kingdom of the Two Sicilies: «L'anno mille ottocento ventuno». It agrees with the catalogue"], ["Registrar", "Fedele Turco, sindaco and registrar of the civil status"], ["How it was located", "a probe on page 18 = records 32 and 33; the straight line record = 2 × page − 4 puts 34 on page 19"], ["Annual table", "the register carries a «Tavola annuale alfabetica de' nati» on page 44, with records 19 to 54; row 34 says «Aquila | Giuseppe Palermo | 22 detto»"]], "literal": "…è comparso [il Signor, tachado] GIUSEPPE PALERMO di anni QUARANTA di professione BRACCIALE domiciliato in Marano, Contrada Malvitani, e ci ha presentato una bambina; secondo che abbiamo ocularmente riconosciuto, e ci ha dichiarato che la stessa è nata da CARMINA SPIZZIRRI d'anni TRENTADUE domiciliata con esso, e da lui dichiarante di professione come sopra domiciliato come sopra, nel giorno VENTIDUE del mese di sopra detto anno corrente all'ore UNDICI nella Casa di sua abitazione. — Ha in oltre dichiarato di dare alla Bambina il Nome di AQUILA ———", "traduccion": "In the year eighteen hundred and twenty-one, on the TWENTY-SECOND day of the month of JUNE, at NINETEEN hours, before Us, FEDELE TURCO, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIUSEPPE PALERMO, AGED FORTY, by trade a BRACCIALE (day labourer), resident at Marano, CONTRADA MALVITANI.\n\nAnd he presented to us a girl, as we ascertained with our own eyes, and declared to us that she was born OF CARMINA SPIZZIRRI, AGED THIRTY-TWO, resident with him, and of himself, the informant, of the trade stated above and resident as above, on the TWENTY-SECOND day of the month aforesaid of the current year, AT ELEVEN HOURS, IN THE HOUSE OF THEIR DWELLING.\n\nHE FURTHER DECLARED THAT HE GAVE THE GIRL THE NAME AQUILA. ———\n\nThe aforesaid presentation and declaration were made in the presence of GABRIELE DE SPOSITO (surname reading uncertain), aged forty, by trade a MURATORE (stonemason), resident at Marano, contrada Langhi; and of GIUSEPPE SCOLA, aged sixty, by trade a bracciale, resident at Marano, contrada Palazzo, witnesses who took part in the present act and were chosen by the informant himself.\n\n[Right-hand column] The parish priest of the church of Marano returned to us the notice we had sent him, certifying at the foot that the Sacrament of Baptism was administered to the said girl, CALLED AQUILA PALERMO, on the TWENTY-SECOND day of the month indicated.", "notas": ["THIS RECORD WAS APPROACHED TO ASK IT WHETHER SHE WAS ROSALIA, AND THE ANSWER IS NO. The hypothesis was reasonable: in these registers two or three forenames are often imposed and the index picks up only one, so «Aquila Rosalia» would have closed at a stroke the birth of Rosalia Palermo, the bride of 1838. The record says AQUILA and nothing more: the rule on the printed form is filled with a long stroke that leaves no room for a second name. RECTIFICATION OF 26 AUGUST 2026, IN THE AFTERNOON: AQUILA AND ROSALIA ARE THE SAME WOMAN. In the morning the opposite had been concluded, and with reasoning that seemed sound: record 34 of 1821 imposes ONE SINGLE name, AQUILA, and the parish priest's note and the register's annual table repeat it. From that it was deduced that Rosalia had to be another sister. It was a deduction, not proof, and it was wrong.\n\nIt was settled by THE DOSSIER OF HER OWN WEDDING —Marano Marchesato, processetti 1838, dossier 19, pages 157 to 162—. The cover says, in so many words: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». And the birth certificate the bride presented, sewn inside the bundle, IS RECORD 34 OF 1821, that of Aquila.\n\nThat is to say: the dossier calls her Aquila, her birth certificate calls her Aquila, and the marriage record that comes out of that same dossier calls her Rosalia. The clerk used the name by which she was known in the village. And that explains once and for all the puzzle that had been open for months: ROSALIA PALERMO DOES NOT APPEAR IN ANY REGISTER OF BIRTHS OF MARANO BETWEEN 1809 AND 1826 —swept year by year— BECAUSE SHE IS REGISTERED AS AQUILA.", "AND THEY CANNOT BOTH BE OF 1821. Aquila was born on 22 June; a whole sister fits neither before nor after within the same calendar year. Rosalia, who declared seventeen years in December 1838, must be of 1820 — her seventeen fit just as well with a birth at the end of that year. The register of NATI 1820 of Marano Marchesato is the immediate objective.", "THE AGE OF CARMINA SPIZZIRRI, WHICH WAS WHAT WAS MOST NEEDED. «nata da CARMINA SPIZZIRRI D'ANNI TRENTADUE»: thirty-two years old in June 1821, that is, born c. 1789. Her death record of 1864 gave her seventy, that is, 1794, and on that reckoning she would have been thirteen when Francesco Giacomo was born (c. 1807) — the son through whom this family descends. With 1789 she would be eighteen, and the objection collapses. The five years' difference between the two declarations is entirely ordinary, but that of 1821 is far more reliable: it is given by her own husband within days of the birth, and not by a few neighbours over a corpse forty-three years later.", "NOTE: this does not PROVE that Francesco Giacomo is Carmina's son. There is still no document naming them together. What it does is remove the only serious objection there was —the chronological one— and with it the need to suppose an earlier marriage for Giuseppe Palermo.", "THE FATHER'S AGE MOVES IN THE OPPOSITE DIRECTION. Here he is FORTY, that is, born c. 1781; his death record of 1863 gave him ninety, that is, 1773. Eight years' difference. The ninety of a death record is almost always a round figure from neighbours; the forty he says himself. Giuseppe Palermo is in all probability of c. 1781, and not the ninety-year-old patriarch he seemed.", "THE TRADE CHANGES THREE TIMES: BRACCIALE in 1821, PASTORE in Rosalia's marriage of 1838, and bracciale again on his death in 1863. They are not three men: in 1821 he is already married to Carmina Spizzirri, and that fixes it. In Marano a day labourer could spend years minding sheep and go back to day labour.", "THE CONTRADA IS MALVITANI, which is a new datum. In 1838 Rosalia's record gives no contrada, and in 1863 and 1864 neither do they. It is the only known address of this family in Marano.", "A DETAIL OF CLASS: the printed form says «è comparso IL SIGNOR ———» and the clerk STRIKES OUT «il Signor» before writing Giuseppe Palermo. In the same register he leaves it standing for others. He was no gentleman, he was a bracciale, and the clerk corrected it.", "THE ANNUAL TABLE OF THE REGISTER is a separate find and is archived: «TAVOLA annuale alfabetica de' nati in questo comune dell'anno 1821», page 44, with records 19 to 54 — order number, name of the child, name and surname of the FATHER and day. Between 19 and 54 there is no other Palermo. WARNING FOR WHOEVER RETURNS TO THIS CONTAINER: pages 45 to 53 are not from Marano nor from 1821, but a loose bundle from APRIGLIANO of 1819 bound in at the end; the index is on pages 43 and 44."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20Aquila%20Palermo%20-%20Marano%20Marchesato%20acta%2034.jpg", "t": "Aquila Palermo - Marano Marchesato acta 34"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20tabla%20anual%20de%20nacidos%201821%20-%20actas%2019%20a%2054.jpg", "t": "Tabla anual de nacidos 1821 - actas 19 a 54"}], "zooms": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20Giuseppe%20Palermo%2040%20anos%20y%20Carmina%20Spizzirri%2032%20anos.jpg", "t": "Giuseppe Palermo 40 anos y Carmina Spizzirri 32 anos"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20acta%2034%20completa.jpg", "t": "Acta 34 completa"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20parroco%20la%20bautiza%20Aquila%20Palermo.jpg", "t": "El parroco la bautiza Aquila Palermo"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20unico%20nombre%20impuesto%20es%20Aquila.jpg", "t": "El unico nombre impuesto es Aquila"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20tabla%20anual%2C%20fila%2034%20Aquila%20de%20Giuseppe%20Palermo.jpg", "t": "Tabla anual, fila 34 Aquila de Giuseppe Palermo"}]}], "nActas": 3, "nImgs": 18, "titulo": "", "parrafos": [], "claves": []}, "giovanni_chiappetta": {"id": "giovanni_chiappetta", "nombre": "Giovanni Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "A day labourer born in Castrolibero around 1848. He married at Rende in 1873 and had Filomena there. Still alive, and still able to sign, in 1910.", "datos": [["Birth", "c. 1848, CASTROLIBERO — he declares 25 years completed in October 1873"], ["Parents", "Raffaele Chiappetta and Teresa Molinaro"], ["Trade", "bracciale (day labourer); contadino in 1910"], ["Marriage", "19 October 1873, Rende — record 32, aged 25"], ["Spouse", "Angela Massei"], ["Daughter", "Filomena Chiappetta (Rende, 11 May 1877)"], ["Still alive in", "30 August 1910 — he reports the death of his granddaughter Angelina at the age of 60, and SIGNS"]], "vida": "c.1848–>1910", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "His birth record has not been located, but since August 2026 it is known where to look for it: his marriage record (Rende, 1873, record 32, in the file of that union) says that he was born in CASTROLIBERO —not in Rende— and that he had turned twenty-five, that is, that he was born c. 1848. He appears besides in the birth of Filomena (1877, aged 29) and in the death of his granddaughter Angelina (1910, aged 60, and signing in his own hand: he could write, a rare thing in this family).", "padre": "raffaele_chiappetta", "madre": "teresa_molinaro", "conyuge": "angela_massei", "unionLibre": false, "otrasParejas": [], "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 October 1873, 15 h", "lugar": "Rende", "ref": "record 32", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Register", "an_ua35985510 · hash 03ArRZ4"], ["Page", "17 of 19"], ["Registrar", "Vincenzo Martino, sindaco"], ["Handwritten year", "«milleottocento settantatré» — agrees with the catalogue"]], "literal": "…sono comparsi Giovanni Chiappetta, di anni venticinque compiti, bracciale, nato a Castrolibero, qui residente, figlio di Raffaele bracciale, e di Teresa Molinaro, contadina, quivi residenti;\n\ned Angela Massei, di anni quindici compiti, contadina, nata a Castrolibero, qui residente, figlia di Domenico, bracciale, e di Carmina Ricchio, contadina, qui residenti;\n\nnon che i testimoni Antonio Loizzo o Guallatta, di anni quaranta, bracciale, e Santo Palermo fu Luigi, di anni ventisei, bracciale, qui domiciliati.", "traduccion": "In the year eighteen hundred and seventy-three, on the nineteenth day of October, at the town hall of Rende, circondario of Cosenza, province of Calabria Citeriore, at fifteen hours.\n\nBefore Us, VINCENZO MARTINO, mayor and Registrar of the Civil Status of the said comune, there appeared:\n\nGIOVANNI CHIAPPETTA, aged twenty-five years completed, day labourer, BORN AT CASTROLIBERO, resident here, son of RAFFAELE, day labourer, and of TERESA MOLINARO, countrywoman, resident here;\n\nand ANGELA MASSEI, aged fifteen years completed, countrywoman, BORN AT CASTROLIBERO, resident here, daughter of DOMENICO, day labourer, and of CARMINA RICCHIO, countrywoman, resident here;\n\ntogether with the witnesses Antonio Loizzo or Guallatta, aged forty, day labourer, and Santo Palermo, son of the late Luigi, aged twenty-six, day labourer, resident here.\n\nThe said Chiappetta and Massei, in the presence of the said witnesses, formally requested me to proceed to the celebration of the marriage proposed between them, the two publications having already been made on the twenty-eighth of last September and the fifth of the current October, without any opposition arising, as appears from the certificate issued by this Registrar of the Civil Status on the ninth of the said October.\n\nGranting that request, I read to them in the presence of the witnesses articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code, and having received from the spouses themselves, one after the other, the declaration that they wished to take each other as husband and wife, I pronounced in the name of the law that GIOVANNI CHIAPPETTA and ANGELA MASSEI are lawfully united in marriage.\n\nThe record is signed by me alone: the spouses and the witnesses declared that they could not write. — The Mayor, Vincenzo Martino.", "notas": ["This record is the one that raises the tree by a whole storey on the Chiappetta side: it gives four new people at a stroke —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei and Carmina Ricchio— and says that all four were alive.", "That they were alive is not a supposition. The 1873 form distinguishes rigorously: in the same record it calls a witness «Santo Palermo FU Luigi», and it gives the four parents without «fu» and as «residenti».", "BOTH BRIDE AND GROOM WERE BORN IN CASTROLIBERO. It is the collateral find: the Chiappetta branch comes from the same village that Michele Salerno (De Rango) and Maria Palermo came from. Filomena is already born in Rende, in 1877. Two families making the same journey in the same years.", "THE SURNAME IS MASSEI, NOT MAZZEI. The index that was the starting point transcribes it «Mazzei» and «Mazza»; the original record, Filomena's birth (1877) and the marriage of 1894 all three write MASSEI. The same happens with «Mulinaro», which in the record is MOLINARO.", "The bride's father is called only DOMENICO in the record; the «Antonio» the index added to him is not in the original.", "She had turned fifteen. Four years later Filomena was born, and twenty-one years later Filomena married at sixteen: two consecutive generations of adolescent brides.", "The first witness's surname is of doubtful reading. It is written with the alias formula «X o Y»: the most probable is «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "He could sign his name", "parrafos": ["He was born at Castrolibero around 1848 and married at Rende on 19 October 1873, at three in the afternoon, to Angela Massei. He declared twenty-five years completed; she, fifteen. That day nobody signed: neither the couple nor the witnesses could write, and the record is initialled only by the sindaco Vincenzo Martino.", "In May 1877 he came back to the town hall to register his daughter Filomena: twenty-nine years old, day labourer, the child born the previous day at nine in the morning in the contrada Soprano. Three separate records — the marriage of 1873, that birth of 1877 and his appearance as a witness in 1891 aged forty-three — point to the same year of birth. The fourth, that of 1910, is two years out.", "And here is what sets him apart. On 30 August 1910 he went to report the death of his granddaughter Angelina, aged eight, together with the child's uncle. At the foot of the record it is stated that the informant Chiappetta Giovanni and the witness Vercillo Ferdinando sign; the others declared themselves illiterate. In a family where almost nobody signs — not the couple of 1873, nor those of 1894, nor Francesco on any of the nine records of his children — Giovanni Chiappetta could write his own name."], "claves": [["Trade", "bracciale, day labourer; contadino in 1910"], ["Born", "c. 1848 at Castrolibero"], ["Could sign", "yes — the only one in the family who does"], ["Married at", "25"], ["Still alive in", "August 1910, declaring 60 years"]]}, "angela_massei": {"id": "angela_massei", "nombre": "Angela Massei", "legal": "Angela Massei (the index gives her as «Mazzei»)", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "Born at Castrolibero around 1858. She married at barely fifteen and was Filomena's mother at nineteen.", "datos": [["Birth", "c. 1858, CASTROLIBERO — she declares 15 years completed in October 1873"], ["Parents", "Domenico Massei and Carmina Ricchio"], ["Trade", "contadina (countrywoman)"], ["Marriage", "19 October 1873, Rende — record 32, aged 15"], ["Spouse", "Giovanni Chiappetta"], ["Daughter", "Filomena Chiappetta (Rende, 11 May 1877)"], ["Still alive in", "1 April 1894 — she gives her consent at Filomena's wedding"]], "vida": "c.1858–>1894", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "No record of her own. Her marriage of 1873 (record 32, in the file of that union) says that she was born in CASTROLIBERO and that she had turned fifteen: born c. 1858. She married, then, at fifteen and had Filomena at nineteen. In 1894 she was still alive: she appears to give her consent to her daughter's wedding. The surname: the 1873 record writes MASSEI, as do the birth of Filomena in 1877 and the marriage of 1894; the index from which the search started gave it as «Mazzei» and as «Mazza».", "padre": "domenico_massei", "madre": "carmina_ricchio", "conyuge": "giovanni_chiappetta", "unionLibre": false, "otrasParejas": [], "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 October 1873, 15 h", "lugar": "Rende", "ref": "record 32", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Register", "an_ua35985510 · hash 03ArRZ4"], ["Page", "17 of 19"], ["Registrar", "Vincenzo Martino, sindaco"], ["Handwritten year", "«milleottocento settantatré» — agrees with the catalogue"]], "literal": "…sono comparsi Giovanni Chiappetta, di anni venticinque compiti, bracciale, nato a Castrolibero, qui residente, figlio di Raffaele bracciale, e di Teresa Molinaro, contadina, quivi residenti;\n\ned Angela Massei, di anni quindici compiti, contadina, nata a Castrolibero, qui residente, figlia di Domenico, bracciale, e di Carmina Ricchio, contadina, qui residenti;\n\nnon che i testimoni Antonio Loizzo o Guallatta, di anni quaranta, bracciale, e Santo Palermo fu Luigi, di anni ventisei, bracciale, qui domiciliati.", "traduccion": "In the year eighteen hundred and seventy-three, on the nineteenth day of October, at the town hall of Rende, circondario of Cosenza, province of Calabria Citeriore, at fifteen hours.\n\nBefore Us, VINCENZO MARTINO, mayor and Registrar of the Civil Status of the said comune, there appeared:\n\nGIOVANNI CHIAPPETTA, aged twenty-five years completed, day labourer, BORN AT CASTROLIBERO, resident here, son of RAFFAELE, day labourer, and of TERESA MOLINARO, countrywoman, resident here;\n\nand ANGELA MASSEI, aged fifteen years completed, countrywoman, BORN AT CASTROLIBERO, resident here, daughter of DOMENICO, day labourer, and of CARMINA RICCHIO, countrywoman, resident here;\n\ntogether with the witnesses Antonio Loizzo or Guallatta, aged forty, day labourer, and Santo Palermo, son of the late Luigi, aged twenty-six, day labourer, resident here.\n\nThe said Chiappetta and Massei, in the presence of the said witnesses, formally requested me to proceed to the celebration of the marriage proposed between them, the two publications having already been made on the twenty-eighth of last September and the fifth of the current October, without any opposition arising, as appears from the certificate issued by this Registrar of the Civil Status on the ninth of the said October.\n\nGranting that request, I read to them in the presence of the witnesses articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code, and having received from the spouses themselves, one after the other, the declaration that they wished to take each other as husband and wife, I pronounced in the name of the law that GIOVANNI CHIAPPETTA and ANGELA MASSEI are lawfully united in marriage.\n\nThe record is signed by me alone: the spouses and the witnesses declared that they could not write. — The Mayor, Vincenzo Martino.", "notas": ["This record is the one that raises the tree by a whole storey on the Chiappetta side: it gives four new people at a stroke —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei and Carmina Ricchio— and says that all four were alive.", "That they were alive is not a supposition. The 1873 form distinguishes rigorously: in the same record it calls a witness «Santo Palermo FU Luigi», and it gives the four parents without «fu» and as «residenti».", "BOTH BRIDE AND GROOM WERE BORN IN CASTROLIBERO. It is the collateral find: the Chiappetta branch comes from the same village that Michele Salerno (De Rango) and Maria Palermo came from. Filomena is already born in Rende, in 1877. Two families making the same journey in the same years.", "THE SURNAME IS MASSEI, NOT MAZZEI. The index that was the starting point transcribes it «Mazzei» and «Mazza»; the original record, Filomena's birth (1877) and the marriage of 1894 all three write MASSEI. The same happens with «Mulinaro», which in the record is MOLINARO.", "The bride's father is called only DOMENICO in the record; the «Antonio» the index added to him is not in the original.", "She had turned fifteen. Four years later Filomena was born, and twenty-one years later Filomena married at sixteen: two consecutive generations of adolescent brides.", "The first witness's surname is of doubtful reading. It is written with the alias formula «X o Y»: the most probable is «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "Fifteen years completed", "parrafos": ["Her marriage record leaves no room for doubt: «di anni quindici compiti», fifteen years completed. She married on 19 October 1873, at the town hall of Rende, to Giovanni Chiappetta, a twenty-five-year-old day labourer. Both had been born at Castrolibero and both were already living at Rende; all four parents were alive and the record gives them as resident in the village.", "She had Filomena at nineteen, on 11 May 1877. And twenty-one years later, on 1 April 1894, she went back to the same town hall to give her consent for her daughter to marry at sixteen. The same scene, one year apart.", "She could not write, and her birth record — around 1858, at Castrolibero — has not been located. The surname is written MASSEI on her marriage, on Filomena's birth and at the 1894 wedding; the index this began from gives it as «Mazzei» and also as «Mazza»."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1858 at Castrolibero"], ["Married at", "15"], ["A mother at", "19"], ["Could sign", "no"]]}, "michele": {"id": "michele", "nombre": "Michele Salerno", "legal": "Michele Salerno di Rende", "rol": "directa", "rolNombre": "Direct line", "gen": 6, "ramas": ["salerno"], "resumen": "A foundling. Found at the wheel of the Cosenza hospice on 3 May 1825. A day labourer. He used three surnames over his lifetime and had none of his own.", "datos": [["Birth", "3 May 1825, Cosenza — record 254"], ["Standing", "foundling: no parents registered"], ["Name given", "Michele Salerno di Rende"], ["Trade", "bracciale (day labourer)"], ["Marriage", "22 August 1858, Rende — record 19"], ["Spouse", "Maria Antonia Palermo"], ["Still alive in", "5 November 1910 — he appears without «fu» and resident at Rende at the wedding of his son Domenico, aged 85"], ["Death", "not located — after November 1910"]], "vida": "1825–>1910", "lug": "Cosenza", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "maria_antonia", "unionLibre": false, "otrasParejas": [], "hijos": ["domenico", "arcangela", "francesco", "giovanni"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "3 May 1825, 15 h", "lugar": "Cosenza", "ref": "record 254, folio 122 verso", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Found in", "Rende, Reg. 50 «Matrimoni, processetti» 1858, p. 209 of 569"], ["Register", "an_ua35977232 · hash LyxMQVl"], ["Copy issued", "10 August 1858, Archivio Provinciale di Cosenza"]], "literal": "…un fanciullo involto in fascia bianca, e senza alcun segno al di lui corpo.\n\nLo stesso ha inoltre dichiarato di dare al bambino il nome\ndi  Michele Salerno di Rende", "traduccion": "In the year eighteen hundred and twenty-five, on the third day of the month of May, at fifteen hours, before Us, FRANCESCO BARONE FERRERI, mayor and registrar of the civil status of the comune of Cosenza, district of Cosenza, province of Calabria Citeriore, there appeared signor EMIDDIO CARLI, aged forty-one, by trade a SERVANT, resident at Cosenza, contrada del Ospedale, and he presented to us a child whom we ascertained with our own eyes, declaring that the same was born according to the report of the chaplain of the hospice, signor don Gaetano Barra.\n\nFrom the said report it appears that today, at thirteen hours, there was found at the wheel of the aforesaid house a child wrapped in a white cloth, and with no mark whatever on his body.\n\nAnd We, Registrar of the Civil Status, in compliance with article fifty-two of the civil laws, having transcribed the aforesaid report, have initialled it and entered it in the volume of documents at folio two hundred and fifty-four, and it shall finally be deposited within the term fixed by law in the Chancery of the Civil Court.\n\nThe chaplain declared that he had administered Holy Baptism, and that it was conferred that same day.\n\nThe same further declared that he gave the child the name MICHELE SALERNO DI RENDE.\n\n[The section for witnesses is left BLANK. The right-hand column, reserved for notification of the baptism by the parish, is also left BLANK.]", "notas": ["«Senza alcun segno al di lui corpo» — without any mark on his body. It is not a formality: the usual thing was to leave the foundling with a garment torn in two, half a coin or a ribbon, keeping the other half in order to be able to reclaim him. The absence of a token means that nobody intended to come back.", "«Salerno» was not adopted by him in later life: it was imposed on him on the very day he was found. Foundlings had surnames invented for them, and frequently a place name was pressed into service.", "Who gave him his name: not the priest nor the mayor, but the informant. The form says «Lo stesso ha inoltre dichiarato di dare al bambino il nome di…» — «the same man», that is Emiddio Carli, the servant of the foundling hospital who took him to the town hall. The chaplain Gaetano Barra had baptised him that same morning; the mayor merely wrote it down.", "The record says Cosenza. The appendix «di Rende» in his name ended up being read as his place of birth: in 1858 the mayor of Castelfranco certifies him as «esposito nativo di Rende». Michele could not know where he had been born."], "imgs": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20Michele%20Salerno%20di%20Rende%20-%20Cosenza%20acta%20254.jpg", "t": "Michele Salerno di Rende - Cosenza acta 254"}], "zooms": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20nombre%20impuesto.jpg", "t": "Nombre impuesto"}, {"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20relato%20del%20hallazgo%20en%20el%20torno.jpg", "t": "Relato del hallazgo en el torno"}]}, {"titulo": "Certificate from the mayor of Castelfranco", "tipo": "C", "tipoNombre": "Certificate", "fecha": "August 1858", "lugar": "Castelfranco (today Castrolibero)", "ref": "document from the marriage dossier", "fuente": [["Found in", "Rende, Reg. 50 «Matrimoni, processetti» 1858"], ["Register", "an_ua35977232 · hash LyxMQVl"]], "literal": "…esposito nativo di Rende…", "traduccion": "Certificate issued by the mayor of Castelfranco for the marriage dossier, in which Michele is described as a «foundling native of Rende».", "notas": ["It contradicts the 1825 record, which places him in the foundling wheel of the Cosenza hospital. It is the proof of how the «di Rende» of his name turned into a place of birth."], "imgs": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1858-08%20C%20Certificado%20del%20alcalde%20de%20Castelfranco%20-%20esposito%20nativo%20di%20Rende.jpg", "t": "Certificado del alcalde de Castelfranco - esposito nativo di Rende"}], "zooms": []}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "22 August 1858, 14 h", "lugar": "Rende", "ref": "record 19", "fuente": [["Collection", "Stato civile della Restaurazione > Rende > Registro 50"], ["Register", "an_ua35977235"], ["Page", "20 of 51"]], "literal": "acta 19 | Michele Esposito Salerno | N/A\nacta 19 | Maria Antonia Palermo    | Palermo, Francesco Giacomo  Volpintesta, Carmina", "traduccion": "Marriage celebrated before Luigi Perugini, mayor of Rende. The groom appears as «Michele Esposito Salerno», aged 33, with the parents' box left blank on account of his being a foundling. The bride, Maria Antonia Palermo, aged 19, daughter of Francesco Giacomo Palermo and of Carmina Volpintesta. The dossier preserves the birth records of both and the certificate from the mayor of Castelfranco.", "notas": ["In that same year TWO men called Michele Salerno married in Rende. The other is record 3: Michele Salerno, son of Gaetano Salerno and Isabella Iorio, with Rosa Cundari. Any search engine crossing «Michele Salerno + Rende + 1858» returns the wrong one.", "Accepting the namesake would give parents to a man who documentarily has none, and would divert the whole branch."], "imgs": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20Michele%20y%20Maria%20Antonia%20-%20Rende%20acta%2019%20-%20doble%20pagina.png", "t": "Michele y Maria Antonia - Rende acta 19 - doble pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20processetti%20-%20transcripcion%20del%20acta%2019.jpg", "t": "Processetti - transcripcion del acta 19"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20registro%20de%20matrimonios%20-%20pagina.jpg", "t": "Registro de matrimonios - pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20visor%20completo.png", "t": "Visor completo"}], "zooms": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20datos%20de%20los%20novios.png", "t": "Datos de los novios"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20b.png", "t": "Documentos presentados b"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20c.png", "t": "Documentos presentados c"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados.png", "t": "Documentos presentados"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20pie%20y%20celebracion%20canonica.png", "t": "Pie y celebracion canonica"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20testigos.png", "t": "Testigos"}]}], "nActas": 2, "nImgs": 4, "titulo": "The child at the wheel", "parrafos": ["On 3 May 1825, at one in the afternoon, a child appeared at the foundling wheel of the Cosenza hospice, wrapped in a white cloth and «senza alcun segno al di lui corpo» — with no mark on his body. Two hours later, at three, Emiddio Carli, a servant of the hospice, forty-one years old, resident in the contrada del Ospedale, carried him before the mayor Francesco Barone Ferreri and presented him. The chaplain don Gaetano Barra had already baptised him that same morning.", "The business of the mark is not a piece of boilerplate. The usual thing was to leave a foundling with a garment torn in two, half a coin or a ribbon, and to keep the other half in order to be able to claim him one day. That he carried nothing means nobody intended to come back for him. On the record, the section for witnesses was left blank, and so was the column reserved for the parish to notify the baptism.", "The name was given by the servant, not by the priest or the mayor: the form says «lo stesso ha inoltre dichiarato di dare al bambino il nome di Michele Salerno di Rende», and «the same» is Emiddio Carli. Foundlings had surnames invented for them and a place name was often pressed into service. That «di Rende» stuck to the name ended up being read as a birthplace: in 185
