"caporal_pietro_vanni", "nombre": "Pietro Vanni, el cabo", "legal": "«del caporal Pietro» in the 1832 certificate", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["celeri"], "resumen": "The oldest ancestor of the whole maternal branch, and the only soldier in the tree. He surfaced on 27 August 2026, in four words of a baptismal record of 1832.", "datos": [["Who this was", "father of the LAWYER GIUSEPPE VANNI and great-grandfather of Enrichetta"], ["Trade", "CAPORALE — corporal. He is the only soldier documented in the whole tree"], ["Birth", "no date. If his great-granddaughter was born in 1832 and his son was already dead by then, he would have been born around 1740-1760"], ["His name travelled", "his grandson was called PIETRO after him — the Italian custom of giving the first-born son the paternal grandfather's name"], ["Where it comes from", "the baptismal record of his great-granddaughter LUISA VANNI — Trassilico, book of the baptised «Lettera F», page 26, entry 68, copied in 1863"]], "vida": "", "lug": "", "mapa": null, "sinacta": "He exists by four words: «del caporal Pietro». But with him the maternal branch reaches the eighteenth century.\n\nA CORPORAL, A LAWYER, A LAWYER AND A MISTRESS OF THE HOUSE. The sequence of three generations that comes out of this record says a great deal about a family on the way up: the father is a soldier of the ranks, the son becomes a lawyer, the grandson likewise, and the grandson marries the daughter of another property owner and goes up to a mountain village to practise.\n\nWHERE TO LOOK FOR HIM. His grandson Pietro WAS BORN IN LUCCA, so it is most probable that this family was from the city. Everything of his would be in the Archivio di Stato di Lucca or in the Archivio Storico Diocesano of Lucca — not in Massa.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["giuseppe_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_vanni": {"id": "teresa_vanni", "nombre": "Teresa", "legal": "«comare Teresa madre di detto Dottor Vanni»", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Wife of the lawyer Giuseppe Vanni and mother of Doctor Pietro. In August 1832 she held her granddaughter Luisa at the font.", "datos": [["Who this was", "wife of the LAWYER GIUSEPPE VANNI, mother of DOCTOR PIETRO VANNI"], ["Alive in", "9 August 1832, when she stood GODMOTHER to her granddaughter Luisa — and already a widow, because the record calls her husband «il fu»"], ["Surname", "UNKNOWN. The record calls her only «Teresa, mother of the said doctor Vanni»"], ["His name travelled", "her granddaughter was named ALOISA **TERESA** after her"], ["Where it comes from", "the baptismal record of Luisa Vanni, Trassilico, 9 August 1832"]], "vida": "†>1832", "lug": "", "mapa": null, "sinacta": "Of her we know the given name, that she was alive and widowed in 1832, and that she was godmother to her granddaughter. Nothing more — no surname, no town, no dates.\n\nHER SURNAME WOULD BE in the marriage record of her son Pietro with Livia Righini, c. 1830, or in the baptismal record of Pietro himself, c. 1808 and probably in LUCCA. Neither of the two has been located.", "padre": null, "madre": null, "conyuge": "giuseppe_vanni", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "bernardo_righini": {"id": "bernardo_righini", "nombre": "Bernardo Righini", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Livia Righini, of Castelnuovo. He surfaced on 27 August 2026, in his granddaughter Luisa's baptismal record.", "datos": [["Who this was", "father of LIVIA RIGHINI and maternal grandfather of Enrichetta Vanni"], ["Village", "CASTELNUOVO — the record says «Livia del fu Bernardo Righini di Castelnuovo». It is the third time a document places this family there"], ["Dead before", "August 1832 — the record already calls him «il fu»"], ["Birth", "c. 1780 or earlier, if his daughter was born around 1813"], ["Where it comes from", "the baptismal record of his granddaughter LUISA VANNI, Trassilico, 9 August 1832"]], "vida": "c.1780–<1832", "lug": "", "mapa": null, "sinacta": "He exists by five words: «del fu Bernardo Righini di Castelnuovo».\n\nAND WITH HIM THE SEARCH MOVES TOWN. Livia was from CASTELNUOVO DI GARFAGNANA, the capital of the valley, not from Trassilico. Her birth c. 1813, her wedding with the doctor Pietro Vanni c. 1830 and everything concerning Bernardo would be in the registers of Castelnuovo — another comune, another holding.\n\nTHERE IS BESIDES ANOTHER LOOSE RIGHINI: Luisa's godfather was GIOVANNI DI CARLO RIGHINI. Son of a Carlo, and almost certainly a relative of Livia — a brother of hers or a cousin.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["lucia_righini"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_vanni": {"id": "giuseppe_vanni", "nombre": "Giuseppe Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Doctor Pietro Vanni, and the oldest documented ancestor of the whole maternal branch. He surfaced on 27 August 2026, in three words of a parish record of 1841.", "datos": [["Trade", "LAWYER — «AVVOCATO GIUSEPPE». So says the baptismal record of his granddaughter Luisa, of 1832. Two consecutive generations of men of law: he and his son Pietro"], ["Father", "CORPORAL PIETRO VANNI — «del caporal Pietro». The only soldier in the tree, and the earliest ancestor of the whole maternal branch"], ["Spouse", "TERESA, alive in 1832, when she stood godmother to her granddaughter Luisa. Her forename is known but not her surname"], ["Who this was", "father of DOCTOR PIETRO VANNI, lawyer, born at LUCCA c. 1808-1809"], ["Dead before", "AUGUST 1832 — his granddaughter's record already calls him «il fu avvocato Giuseppe»"], ["Birth", "c. 1780 or earlier, if his son was born around 1808"], ["Where he lived", "undetermined. His son WAS BORN AT LUCCA, the city, so the family might be from there and not from the mountains"], ["Where it comes from", "his son's death record — parish of the SS. Pietro e Paolo of Trassilico, book of the dead «Lettera D», page 32, entry 182, copied in 1863 within the marriage dossier of his granddaughter Luisa"]], "vida": "c.1780–<1832", "lug": "", "mapa": null, "sinacta": "He exists by four words: «figlio del fu Giuseppe Vanni». But those four words go up a whole generation and carry the maternal branch back to the eighteenth century.\n\nWHERE TO LOOK FOR HIM. His son Pietro WAS BORN IN LUCCA —so says Luisa's marriage record, of 1863—, so it is most probable that this family was not from Trassilico but from the city, and that Pietro went up to the mountains already qualified as a lawyer. If so, Pietro's baptism, c. 1808, and everything concerning Giuseppe would be in LUCCA: in the Archivio di Stato di Lucca or in the Archivio Storico Diocesano of the city, not in Massa.\n\nTHAT OPENS A WHOLE NEW FRONT. Until now this branch was shut up in a village of a hundred inhabitants; with Giuseppe Vanni it moves to a city with archives that begin in the Middle Ages.", "padre": "caporal_pietro_vanni", "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["pietro_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "pietro_vanni": {"id": "pietro_vanni", "nombre": "Pietro Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Of Trassilico, in the Garfagnana. Father of Enrichetta Vanni and great-great-grandfather of Gonzalo's paternal grandfather.", "datos": [["Trade", "A LAWYER, NOT A PHYSICIAN. «Di professione LEGALE», says the marriage record of his daughter Luisa, of April 1863. For days he was taken for the village doctor because his grandson Tebaldo's record calls him «dottor Pietro» — but in Italy «dottore» is any graduate. He was a man of law"], ["Village", "HE WAS BORN AT LUCCA, the city, and was domiciled at TRASSILICO. He was the outsider with a degree who goes up to a mountain village"], ["Birth", "c. 1805, if his daughter was born in 1835 — but see the note on his age"], ["DEATH", "22 MARCH 1841, and buried on the 23rd. So says his parish record, copied in 1863: «morì ieri, e oggi previe solenni esequie, è stato sepolto»"], ["Father", "GIUSEPPE VANNI, already deceased in 1841 — the earliest documented ancestor of this branch"], ["Age at death", "THIRTY-TWO years, according to the marriage record of his daughter Luisa → born c. 1808-1809"], ["Spouse", "LIVIA RIGHINI, born at CASTELNUOVO c. 1813"], ["Daughters", "LUISA (c. 1832) and ENRICHETTA (c. 1835) — both «possidenti»"], ["Dead before", "September 1923 — his daughter's record calls him «fu Pietro»"], ["Where it comes from", "his daughter's death record: Trassilico, 9 September 1923, record 10"], ["AND BEWARE OF THE OTHER GIUSEPPE VANNI, WHO IS NOT HIS FATHER", "his father was called GIUSEPPE VANNI, and at LE FABBRICHE there is ANOTHER GIUSEPPE VANNI, a nailmaker, with children documented in 1858 and 1859. They are not the same man: ours is the father of a graduate born at Lucca; the other, an artisan from a forge hamlet"], ["A PIETRO VANNI MARRYING IN 1864 IS NOT HIM", "the marriage index of 1864 carries a VANNI PIETRO marrying Barsotti Giovanna (record 10). For a day it stood as an open question, and it was not one: he died on 22 March 1841, so that groom is necessarily another man — in all probability the «Pietro Vanni fu Francesco, chiodajuolo di Le Fabbriche» already ruled out in 1863"], ["NOT TO BE CONFUSED WITH THE OTHER VANNI", "in the same comune there is a whole VANNI family, numerous and unrelated: the NAILMAKERS OF LE FABBRICHE"]], "vida": "c.1805–1841", "lug": "", "mapa": null, "sinacta": "IN TRASSILICO THERE ARE TWO VANNI FAMILIES THAT HAVE NOTHING TO DO WITH EACH OTHER, AND CONFUSING THEM COSTS DAYS. **OURS** are the VANNI OF THE VILLAGE: he, a LAWYER —«di professione LEGALE»— and **BORN IN LUCCA**, an outsider with a profession; his wife LIVIA RIGHINI, of Castelnuovo; and their daughters ENRICHETTA and LUISA, both «POSSIDENTI».\n\n**THE OTHERS** are the VANNI OF LE FABBRICHE: **CHIODAJUOLI, nailmakers**, who made nails by hand. Le Fabbriche —«the forges»— was a village of ironwork and there the trade passed from father to son. Four have come up already: Pietro fu Francesco (1863), and ANGELO with his children ROSA and PIETRO, married four days apart in May 1864. A VANNI OF LE FABBRICHE IS NOT OF THIS FAMILY. CONFIRMED BY RECORD, though not by his own: the death record of his daughter, in 1923, gives him as father, places him in Trassilico and declares him dead («fu Pietro», «domiciliato IN VITA a Trassilico»).\n\nHe is, with his wife, the oldest documented generation of the Celeri branch: born c. 1805, in a village of the Apuan Alps. Everything of his would be in the parish registers of Trassilico. THE CIVIL SEARCH IS CLOSED, AND WITH A RESULT. The marriage record of his daughter, of 4 February 1859, already calls him «fu dottor Pietro». And as of 27 August 2026 the death indexes of THE ELEVEN YEARS THAT EXIST have been read in full —1852, 1853, 1854, 1855, 1856, 1857, 1858, 1859, 1860, 1861 and 1865—: he appears in none of them. As the civil registration of Trassilico begins in 1852, HE DIED BEFORE 1852 and his record is PARISH, not civil — SS. Pietro e Paolo of Trassilico, which since 1853 falls under the Diocese of MASSA and not that of Lucca.\n\nA CANDIDATE THAT LOOKED GOOD WAS EXAMINED AND DISCARDED: «VANNETTI PIETRO fu Giovanni», who died on 21 February 1852 (record 4). He is not the man, for two reasons. VANNETTI and VANNI are distinct surnames in these very indexes —in 1859 one Vanni and three Vannetti live side by side—; and above all, these indexes DO write the title of doctor where there is one: in that of 1855 «Barsotti DOTT. Roberto» and «Barsotti DOTT. Michele» are recorded. The village doctor would have carried his «Dott.» just as the Barsotti did. AND ON THE NIGHT OF 27 AUGUST A DOOR THAT SEEMED CLOSED WAS OPENED. It had been concluded —and it remains true— that he died before 1852 and that his record is parish, not civil. But that no longer means that it is out of reach. The ALLEGATI of the Trassilico marriages TRANSCRIBE THE PARISH REGISTER ENTRIES LITERALLY, with the number and the page of the original book, and they reach years in which there was no civil registration. It is proven: in the 1863 file there is an extract from the «registro dei Morti della Chiesa di S. Michele Arcangelo di Vallico Sopra, partita n. 358, pagina 88», copied out by the parish priest and endorsed by the mayor. AND IT IS ON RECORD THAT HIS WAS ATTACHED. The marriage record of his daughter LUISA, of April 1863, says that there were handed in «le fedi pure autentiche della morte del Vincenti Antonio, DEL VANNI DOTTOR PIETRO». His death record is therefore inside that dossier. And by the same reasoning it ought also to be in the ALLEGATI OF THE MARRIAGE OF CALLISTO AND ENRICHETTA, of 4 February 1859 — together with those of DESIDERIO CELERI and ANGELA MENGHI.\n\nTHAT MAKES THE ALLEGATI OF THE MATRIMONI OF 1859 THE PRINCIPAL OBJECTIVE OF THE WHOLE PROJECT.\n\nHis death record is among the most valuable still outstanding in the whole tree: it would name HIS parents, and, he being a country doctor, it could besides reveal that he came from another town. A doctor in a place of a hundred inhabitants had rarely been born there.\n\nA LEAD WAS TRIED AND IT CAME OUT BADLY, AND IT IS WORTH LEAVING IT WRITTEN DOWN. The index of births of Trassilico for 1863 registers under record 2 a VANNI MARIA FRANCESCA «di PIETRO», and as the doctor had already been dead since before 1859, it seemed that this could be a son of his of the same name, that is, a brother of Enrichetta. The record was read in full: HE IS NOT HIM NOR IS HE A RELATIVE. That man is «VANNI PIETRO FU FRANCESCO», aged forty-one, CHIODAJUOLO —nailmaker—, domiciled in LE FABBRICHE and married to a Rosa Vanni, daughter of Cristoforo Rigali. A different father, a different trade, a different hamlet.\n\nTHE LESSON HOLDS FOR THE WHOLE TREE: the index writes only «di Pietro». In a village where Vanni is a common surname, the coincidence of a given name proves absolutely nothing until the record itself is read.", "padre": "giuseppe_vanni", "madre": null, "conyuge": "lucia_righini", "unionLibre": false, "otrasParejas": [], "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [{"titulo": "Parish death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "22 March 1841; sepultado the 23", "lugar": "Trassilico — parish of the Holy Apostles Peter and Paul", "ref": "book of the dead «Lettera D», page 32, entry 182", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Where it turned up", "not in a register of deaths, but INSIDE THE MARRIAGE DOSSIER OF HIS DAUGHTER LUISA: Trassilico, Matrimoni allegati 1863, Registro 64.11, page 103 of 119"], ["Shelfmark", "ark:/12657/an_ua35853779 — hash Lok9x2p"]], "literal": "", "traduccion": "I, the undersigned Parish Priest, certify that from the BOOK OF THE DEAD of this my Church erected under the title of the HOLY APOSTLES PETER AND PAUL, marked with the LETTER D, at page 32, number 182, the following appears:\n\nON 23 MARCH 1841. DOCTOR PIETRO, SON OF THE LATE GIUSEPPE VANNI, fortified with the sacraments of confession, communion and the commendation of the soul, DIED YESTERDAY, and today, after solemn obsequies, has been buried. I so certify, DOMENICO GRANDI, Rector.\n\nAnd in witness that I have extracted it from an authentic book. Trassilico, 25 April 1863.\n\nOn 26 April 1863. Seen, the signature and standing of signor Dom. Grandi are certified true. The Mayor, R. Bertoli Barsotti.", "notas": ["HE DIED ON 22 MARCH 1841. Until today it was known only that he was dead «before 1859». Now there is a day.", "AND HIS FATHER APPEARS: GIUSEPPE VANNI, already deceased in 1841. He is the earliest documented ancestor of the whole maternal branch.", "A DIFFICULTY THAT HAD BEEN LEFT OPEN IS RESOLVED. The marriage record of his daughter Luisa, of 1863, gave him «aged thirty-two years», a figure that seemed impossible with daughters born in 1832 and 1835. It is not: if he died in March 1841 aged thirty-two, he was born about 1808-1809, had Luisa at twenty-three and Enrichetta at twenty-six. The clerk was not mistaken; the fact was missing.", "AND SO LIVIA RIGHINI WAS WIDOWED AT TWENTY-EIGHT, with Luisa aged nine and Enrichetta six. She did not remarry: in 1863, at fifty, she is still signing «Righini Livia». Twenty-two years of widowhood, and many more still to come.", "WHERE IT TURNED UP, WHICH IS THE LESSON. Not in a register of deaths — he died eleven years before the civil registration of Trassilico existed — but INSIDE THE MARRIAGE DOSSIER OF HIS DAUGHTER, in 1863. The allegati transcribe parish records verbatim, with book, page and number. By that same route one must look for DESIDERIO CELERI and ANGELA MENGHI.", "THE EXACT REFERENCE OF THE ORIGINAL BOOK: parish of SS. Pietro e Paolo of Trassilico, book of the dead «Lettera D», page 32, entry 182. With that the whole book can be requested from the Archivio Diocesano di Massa.", "IT IS SIGNED BY DON DOMENICO GRANDI, the same priest who married Callisto and Enrichetta in 1859, baptised Tebaldo in 1862 and married Desiderio Celeri in 1863. In 1841 he was already rector: twenty-two years later he copied out of his own book a record he had himself written as a young man."], "imgs": [{"u": "../actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20Partida%20de%20defuncion%20parroquial%20-%20Trassilico%2C%20libro%20D%20pag%2032%20n%20182.jpg", "t": "Partida de defuncion parroquial - Trassilico, libro D pag 32 n 182"}, {"u": "../actas/1841%20-%20Pietro%20Vanni/1863-04%20D%20Consentimiento%20notarial%20de%20Elisabetta%20viuda%20Vincenti%20-%20mismo%20expediente.jpg", "t": "Consentimiento notarial de Elisabetta viuda Vincenti - mismo expediente"}], "zooms": [{"u": "../actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20zoom%20-%20hijo%20del%20difunto%20GIUSEPPE%20VANNI.jpg", "t": "Hijo del difunto GIUSEPPE VANNI"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "lucia_righini": {"id": "lucia_righini", "nombre": "Livia Righini", "legal": "«Lucia Righini» in the FamilySearch tree; the record says LIVIA", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Of Trassilico. Mother of Enrichetta Vanni. Her name was written wrongly until the record turned up.", "datos": [["Name", "LIVIA, according to her daughter's death record. The FamilySearch tree calls her «Lucia»: the record is preferred"], ["Village", "SHE WAS BORN AT CASTELNUOVO, not at Trassilico. So says the birth record of her grandson Giuseppe, of 1860: of the parents-in-law, «il primo nato e domiciliato in Trassilico, e LA SECONDA NATA IN CASTELNUOVO e domiciliata in Trassilico». She lived and died at Trassilico"], ["Birth", "c. 1813 — from the FIFTY years she declares at the wedding of her daughter Luisa, in April 1863"], ["Alive in", "April 1863, when she SIGNED Luisa's marriage record in her own hand; and on 18 November 1860 — her grandson's record names her «la Sig.ra Livia Righini», WITHOUT the «fu» that her husband does carry"], ["Father", "BERNARDO RIGHINI, of CASTELNUOVO, already deceased in August 1832"], ["Spouse", "PIETRO VANNI"], ["Daughter", "ENRICHETTA VANNI (c. 1835 – 1923)"], ["Dead before", "September 1923 — her daughter's record says «da FU Righini Livia»"]], "vida": "c.1813–<1923", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD: the death record of her daughter, Trassilico 1923, which gives her as mother, dead and a resident of the same village.\n\nRIGHINI is a Tuscan and Emilian surname, and it fits the Garfagnana. Together with VANNI, they are the two surnames that even before this document appeared pointed to Tuscany when there was as yet nothing to prove it. AND ON 27 AUGUST 2026 SHE CAME OUT OF THE VILLAGE. The birth record of her grandson Giuseppe —Trassilico, 18 November 1860, record 76— says that of Enrichetta's parents «the first was born and is domiciled in Trassilico, and THE SECOND WAS BORN IN CASTELNUOVO and is domiciled in Trassilico». It is the first time this branch sets foot in another town. Castelnuovo di Garfagnana is the capital of the valley, some ten kilometres away: the doctor's wife came from the big town.\n\nTHE READING IS VERY PROBABLE, NOT CERTAIN. The word carries an «st» ligature which at first sight looks like a double s. The stroke was compared with the «Trassilico» on the same line, where the double s is short and tight, whereas here there are two tall ascenders — which points to CA-ST-E-L-NUOVO. It would be as well to reconfirm it in another record.\n\nIF IT IS CONFIRMED, THE SEARCH MOVES: her birth, c. 1810, and her wedding with the doctor Pietro Vanni, c. 1830, would have to be looked for in CASTELNUOVO DI GARFAGNANA and not in Trassilico. And she was ALIVE in November 1860, so her death falls between that date and 1923.", "padre": "bernardo_righini", "madre": null, "conyuge": "pietro_vanni", "unionLibre": false, "otrasParejas": [], "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "domingo_alasia": {"id": "domingo_alasia", "nombre": "Domingo Alasia", "legal": "«Don Domingo Alasia» in the 1900 record; ALAZIO DOMINGO in the census", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["celeri"], "resumen": "Margarita's elder brother. Born in Piedmont, emigrated as a child, and the man who thirteen years later signed as a witness at his little sister's wedding.", "datos": [["Birth", "c. 1863, in ITALY — from the twenty-four years he declares in the census of 1887. He is the eldest of the documented children"], ["Emigration", "as a child, with his parents, between 1872 and 1876"], ["In 1887", "he is living at COLONIA EMILIA with his parents, already married, with his wife MARÍA MOLINA and two children"], ["Spouse", "MARÍA MOLINA, Italian, aged twenty-three in 1887"], ["Parents", "BENEDETTO ALASIA and MADALENA BERTINA"], ["Her mark on the tree", "on 25 October 1900 he was a WITNESS at Margarita's wedding to Tebaldo Celeri, at Vera. His wife signed alongside him"]], "vida": "b.c.1863", "lug": "ITALIA", "mapa": null, "sinacta": "He has no record of his own as yet, but he is proven by two documents that cross: the 1887 census puts him as son of Benedetto and Madalena, and the marriage record of 1900 puts him as witness for his sister.\n\nIT WAS HE WHO CLINCHED THE IDENTIFICATION OF THIS WHOLE BRANCH. For days there were doubts as to whether the Alasia of the tree were really Margarita's parents. What settled it was not a date: it was seeing that the two witnesses who sign the wedding of 1900 —«Don Domingo Alasia and Doña María de Alasia»— had been sitting thirteen years earlier at the table of the same household, in the census, as son and daughter-in-law.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "maria_molina", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["margarita_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_molina": {"id": "maria_molina", "nombre": "María Molina", "legal": "«Doña María de Alasia» in the 1900 record", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Wife of Domingo Alasia and Margarita's sister-in-law. She signed as a witness at the 1900 wedding.", "datos": [["Birth", "c. 1864, in ITALY — from the twenty-three years of the census of 1887"], ["Spouse", "DOMINGO ALASIA"], ["Children", "two already by 1887"], ["In the 1900 record", "«Doña MARÍA DE ALASIA» — the Argentine formula for a married woman"]], "vida": "b.c.1864", "lug": "ITALIA", "mapa": null, "sinacta": "She appears in the 1887 census as DAUGHTER-IN-LAW in the household of Benedetto Alasia, and in the marriage record of 1900 as a witness. Nothing more is known of her as yet: her parents, her town and the date of her wedding to Domingo are missing, the last of which would be earlier than 1885.", "padre": null, "madre": null, "conyuge": "domingo_alasia", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "benedetto_alasia": {"id": "benedetto_alasia", "nombre": "Benedetto Alasia", "legal": "«Don Benito Alasia» in the 1900 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "A Piedmontese from Savigliano, a settler in Santa Fe. Father of Margarita and great-grandfather of Marcos César Rivas.", "datos": [["Birth", "1822, according to the FamilySearch tree"], ["Death", "1892, same source"], ["Marriage", "13 April 1857, church of SAN GIOVANNI BATTISTA, SAVIGLIANO, province of CUNEO, PIEDMONT"], ["Spouse", "MARIA MADDALENA BERTINO (1839-1899)"], ["Parents", "BARTOLOMEO ALLASIA and LUCIA GAIDO, from the FamilySearch tree"], ["Daughter", "MARGARITA ALASIA, born c. 1882 at Colonia Emilia, Santa Fe"], ["Surname", "ALLASIA in Piedmont, ALASIA in Argentina — an l was lost along the way"]], "vida": "1822–1892", "lug": "", "mapa": null, "sinacta": "CONFIRMED ON 27 AUGUST 2026, AND BY A DOCUMENT, NOT BY A RESEMBLANCE. The provincial census of Santa Fe of June 1887 has, in COLONIA EMILIA, volume 12, booklet 12, this whole household: OLAZIO BENEDETTO, aged SIXTY-FIVE, Italian, head of the family; BERTINA MADALENA, aged FORTY-SEVEN, his wife, WHO DECLARES FOURTEEN CHILDREN; and of these ALAZIO DOMINGO, aged twenty-four and married, with his wife MOLINA MARÍA beside him, plus Nicolás, Juan, Francisco, María, MARGARITA AGED FIVE BORN IN SANTA FE, and Madalenia aged one. AND ON 29 AUGUST, ON REREADING THAT ENTRY WITH THE FIELDS THAT THE CENSUS DOES PUBLISH AND THAT WERE BEING LOST, MORE CAME OUT. He is recorded as PATRÓN —a colonist with land, not a day labourer— and neither he nor his wife could read or write; she declares the fourteen children and thirty-one years married, which places the wedding in 1856, within a year of the 13 April 1857 that the record gives. And his son Domingo declares two years married: he married María Molina in 1885, not «around 1885-86». AND THERE ARE TWO OTHER ALASIA HOUSEHOLDS IN THE SAME COLONY, AND NOW SOMETHING CAN BE SAID ABOUT THEM. One is that of ALACIO DOMINGO, aged sixty-four —one year less than him—, also a patrón, married to a Luigia who declares eight children and thirty-two years married, that is, a wedding in 1855, a year before his own. Two men of the same age, married in consecutive years, both patrones, in a village of a hundred households: it looks like a textbook case of their being brothers. The other is that of ALAZIO JUAN, aged forty-five, a patrón and illiterate like him, married in 1872 to Lucia Silvestre, with seven children all born already in Santa Fe — a household that until today was not noted down anywhere. BUT THE TEST OF THE NAMES SAYS THAT THEY ARE NOT HIS BROTHERS. Custom dictates that the first male child bear the name of the paternal grandfather, and he follows it to the letter: his father was called BARTOLOMEO and his eldest son is called BARTOLOMEO. If Domingo and Juan were brothers of his, their first sons should be called the same — and the eldest of Alacio Domingo is TOMASO and that of Alazio Juan is ANGELO. Most probably they were cousins: three Alasia families from the same Piedmontese valley arrived in the same colony, which is how those chains worked. It is not proof —custom binds only for the first male, and a child who died young breaks the series— but for the first time the question ceases to be at «cannot be decided».\n\n\n\nTHE MISSING DAUGHTERS: ONE MORE ROUTE THAT CLOSES (29 August 2026). Magdalena declared FOURTEEN children and only eight appear alive in the census. Married daughters are lost because the census roll enters them under the husband's surname and does not give the maiden name. The blog of Hugo Alloa, built on the records of the parish of Emilia, names nine surnames that married into the Allasia — BARONI, BUSATTO, CHARTIER, DACARRO, GIUPPONI, PALMIER, RONZONI, ROSSINI and ZANUTICH — and their households were searched for an Italian woman of the right age. There are 92 people of those surnames in the colony, 17 married women, and NONE passes: two are French, six were born before 1856 (that is, before Benedetto's wedding, and cannot be daughters of his), and eight break the Italian custom of names, because their second son ought to be called Benito and none of them is. In fact THERE IS NOT A SINGLE GRANDSON CALLED BENITO in the 1,385 entries of the colony: the five Benito or Benedetto that come up are Benedetto himself (indexed OLAZIO), a man of 32, a French boy, a newborn and a girl of eight whom the census roll entered as male. ONE remains impossible to judge: BARONI TERESA, 25 years old, married in 1884, the only one of the seventeen who declares «Italy, TORINO», which is where the Alasia are from — but she has only one child, and without a second son custom says nothing. Neither ruled out nor confirmed. And three of the nine surnames —DACARRO, GIUPPONI and ZANUTICH— DO NOT EXIST in the colony in 1887, so those weddings are later than the census. THIS DOES NOT PROVE that no daughter married a Baroni or a Rossini: it proves that the census cannot identify her. That is decided by the records of the parish of Emilia, already requested by letter. AND LATER THE SAME DAY THE WHOLE CENSUS ROLL OF THE COLONY WAS DOWNLOADED —1,368 people, with the twelve fields— and the test of the names ceased to be a sounding. Filtering by who could be a daughter of his —Italian, born after 1858, married after 1873— FIFTY-NINE women come out, not the eight from the nine surnames that had been looked at. And searching the 1,368 entries for every Benito, Benedetto, Magdalena and Bartolomeo, ten people appear, of whom none is a grandchild of his: he and his wife, his youngest daughter Madalenia, the girl of the Bertino household, two infants from a criollo and a Swiss household, an adult man and two Maddalena born already in Italy. There is not a single grandson called Benito in the whole of Colonia Emilia. The negative is exhaustive, not a sample — although it is conclusive only for the fourteen women married before 1880 and with three children or more; for those married later the second son had not yet been born in 1887, and for those the proof of the 1895 census remains. And that says something about the four children of his that are missing: they are not married daughters living in the colony. Added to the fact that the three eldest do not appear anywhere in the province, the most economical explanation —and it is an inference, not a fact— is that a good part of the fourteen died in infancy. That a woman married in 1857 should declare fourteen births and only ten identifiable children was the norm, not the exception. AND THERE IS A SECOND DOOR, WHICH OPENED ON LISTING THE THIRTEEN «NEPHEWS AND NIECES» OF THE COLONY. In the household of the Chartier there lives a girl of three registered as «ALASIA LUISA, niece», born in Santa Fe. That the enumerator gave her a surname DIFFERENT from that of the head of household is a deliberate act: Luisa is not a Chartier, she is an Alasia. And if she is a niece of that house and bears that surname, she is so on INÉS's side, not on that of the Frenchman Eduardo — that is, Inés was an Allasia by birth, just as the parish indexes said. And with the whole census roll before one, something can be seen that could not be seen before: Luisa's father is not in the colony. Having gone over the three Alasia households and all their children, there is no Luisa anywhere. Her father —an Alasia male with a daughter born c. 1884— was not living there in June 1887; and that the girl is being brought up by her aunt suggests that he had died. That opens another explanation for his eldest children, and it must be stated as a hypothesis: if Inés is a daughter of his, Luisa's father would be another son of his — and the candidates are Bartolomeo, Salvatore Fortunato Antonio and Domenico Carlo, who in 1884 would have been between twenty-one and twenty-four. Instead of having died as children in Italy, at least one would have reached Argentina, married, had a daughter c. 1884 and died young. Both explanations still stand; this one holds only if Inés turns out to be a daughter of his, and that is settled by the Chartier × Allasia marriage record already requested. AND THERE IS A FOURTH ALASIA IN THE COLONY THAT NOBODY HAD COUNTED, AND HE SAYS WHERE THEY WERE FROM. Listing the twenty-eight Alasia of the census roll under the seven spellings there appears, alone and on his own line, «ALASIO ANTONIO, 22 years old, single, PATRÓN, born in ITALY, CUNEO». He belongs to none of the three known households and no relationship to anyone is recorded. He is the only Alasia in the whole colony who declares the Italian province. Until today the Piedmontese origin of this family rested on the FamilySearch tree and on the 1857 record from Savigliano; now there is an Argentine document, an independent one, that ties an Alasia of that same colony to the province of Cuneo — where Savigliano has been since 1859. And it fits with the other piece of provincial information we had, Teresa Baroni's «Italy, TORINO»: Savigliano belonged to Turin until 1859 and to Cuneo afterwards, so the two do not contradict each other but reinforce each other.\n\nAnd he is a candidate to be one of the four children of his still unlocated: born c. 1865 in Italy, he would have crossed as a child, and between Domenico Carlo (1863) and Nicolás (1872) there is a gap of nine years in which he fits. Besides, he is a patrón, like him: he has land of his own at twenty-two, which is what a colonist does when he sets up a son. It is not proven — he does not live in his household and no relationship is recorded, and he could be a nephew or a cousin. AND THE NATIONAL CENSUS OF 1895 CONFIRMS IT AGAIN, SEPARATELY. In the same Colonia Emilia, eight years later: «BERTINO MAGDALENA, 56 years old, WIDOW, Italian, farm labourer, can read and write, OWNS REAL PROPERTY, FOURTEEN CHILDREN», and with her Domingo Juan aged 19, Francisco aged 17, María aged 15 and MARGARITA AGED 13. The four siblings have aged EXACTLY EIGHT YEARS with respect to the 1887 census —11→19, 9→17, 7→15, 5→13—, which is precisely the interval between the two census rolls. It is not a resemblance of names: it is the same family documented twice.\n\nAnd that second census adds three things. BENEDETTO HAD DIED: she is recorded as a WIDOW in 1895 and he was alive and head of the family in 1887, so he died between those two dates — the tree said 1892 and that falls within. She is 56, that is, BORN c. 1839, the exact date in the tree. And she was no day labourer: SHE HAD LAND OF HER OWN AND COULD READ, being a woman, a widow and an immigrant, in 1895.\n\nSIX THINGS FIT AT ONCE. The father is called BENEDETTO, not a hispanicised «Benito». He is sixty-five years old, that is, he was born c. 1822 — the exact date in the tree. The mother was born c. 1840; the tree said 1839. There is a Margarita of five born in Santa Fe, and the Vera record of 1900 gives her nineteen and makes her «a native of Col. Emilia». And there they are, in the same household, THE TWO WITNESSES OF HER WEDDING: «Don DOMINGO ALASIA and Doña MARÍA DE ALASIA» of the record are DOMINGO, her eldest brother, and MARÍA MOLINA, Domingo's wife. Thirteen years later they signed their little sister's wedding.\n\nAND THE ONLY SERIOUS OBJECTION LEFT FALLS AWAY. It used to be said that the chronology was tight: a mother of forty-two at Margarita's birth, twenty-four years after marrying. It was not tight: SHE HAD FOURTEEN CHILDREN, and Margarita was the twelfth.\n\nTHEY WERE NOT ALONE IN THE COLONY. The same census roll of 1887 has TWO OTHER HOUSEHOLDS of the surname in Colonia Emilia: that of ALACIO DOMINGO, aged SIXTY-FOUR, with his wife Luigia and two already married sons living under his roof —Tomaso and Bernardo, with their wives and their children—, and that of ALAZIO JUAN, aged forty-five, with seven children. Domingo is sixty-four and Benedetto sixty-five: two men of the same surname and the same age in a colony of thirteen hundred souls. Most probably they were BROTHERS, and the emigration was a chain migration. IT IS NOT PROVEN —the census gives no filiations— and it would be checked with the Argentine deaths of the two of them or with the books of the parish of Natividad de la Virgen Niña of Emilia.\n\nIT WAS FOUND BECAUSE THE SEARCH BY SURNAME WAS ABANDONED. Searching for «Alasia» in Emilia gave a single person and had been blocking this for two days. The WHOLE CENSUS ROLL of the district had to be downloaded —1,383 people, 348 surnames— and compared by similarity: in the same colony FOUR SPELLINGS of the surname lived side by side, ALASIA, ALASIO, ALACIO and ALAZIO, and the family was written OLAZIO and ALAZIO. No search engine working by name would have produced it. AND ON THE AFTERNOON OF 27 AUGUST THE LAST LOOSE END WAS TIED. One difficulty remained: the «how many years married» box of the 1895 census read TWENTY-FIVE, which would give a wedding around 1870 and not in 1857. The complete list of children resolves it. The first, LUCIA, is born in 1859 —two years after the wedding— and after her come BARTOLOMEO in 1860, SALVATORE in 1861, DOMENICO CARLO in 1863, DOMINGO in 1864 and another LUCIA in 1866. With six children before 1870, a wedding in 1870 is impossible. The census figure is a THIRTY-FIVE badly written or badly read: 1857 plus 35 is 1892, the year in which she was widowed. She counted how long the marriage LASTED, not the time elapsed up to 1895.\n\nAND THERE IS AN ONOMASTIC DETAIL THAT SUPPORTS THE GRANDPARENTS: the first male child was called BARTOLOMEO, and Benedetto's father would be BARTOLOMEO ALLASIA. Piedmontese custom gave the first male the name of the paternal grandfather. It is not proof, but it is exactly what one would expect. The same goes for the two LUCIA, of 1859 and 1866, and the maternal grandmother LUCIA GAIDO.\n\nTHE TEN CHILDREN KNOWN TO HIM, adding together the tree and the two censuses: Lucia (1859-1859), Bartolomeo (1860), Salvatore Fortunato (1861), Domenico Carlo (1863), Domingo (1864), Lucia Margarita (1866-1866), Nicolás (~1872), Juan (1875), Francisco (1878), María Magdalena (1879), MARGARITA (1882) and Madalenia (~1886). Twelve of the fourteen that she declared.\n\nWHAT FOLLOWS IS THE EARLIER REASONING, WHICH IS LEFT AS IT STOOD BECAUSE IT IS THE STORY OF HOW ONE GOT THERE:\n\nTHE ONLY THING A RECORD SAYS is that Margarita Alasia was the «legitimate daughter of Don BENITO ALASIA and of Doña MAGDALENA BERTINI» (Vera, 25-10-1900). Nothing more. No dates, no town for them, no word as to whether they were alive.\n\nEVERYTHING ELSE —that he was born in 1822, that he died in 1892, that he married in Savigliano on 13 April 1857, and with it the four grandparents— comes from a FamilySearch tree, not from a document. To identify the «Benito Alasia» of the Argentine record with the «Benedetto Alasia» of Savigliano is an INFERENCE, and these are its two faces:\n\nIN FAVOUR. BOTH surnames and BOTH given names coincide at once (Benito = Benedetto, Magdalena = Maddalena): that is much stronger than a surname on its own. ALASIA/ALLASIA is almost exclusively Piedmontese —of 101 occurrences in Italy, 89 in Piedmont— and Colonia Emilia, in the department of San Justo, was an area of Piedmontese colonists. And the tree has already shown that it works from documents: it said that Enrichetta Vanni died in 1923 and the Trassilico record confirmed it.\n\nAGAINST. If the wife was born in 1839, at Margarita's birth c. 1881 she would have been FORTY-TWO and twenty-four years would have passed since the wedding: possible, but right at the limit. And BERTINO is not only Piedmontese: of 240 occurrences, 98 are Sicilian and 92 Piedmontese. Besides, the Piedmontese colonists of Santa Fe arrived en bloc from the same towns, so one and the same pair of surnames may be repeated within the same colony.\n\nVERDICT: probable, not proven. It stands as long as no other Benito Alasia married to a Magdalena Bertini turns up in the same area. A FIRST SWEEP OF THE 1887 CENSUS SEEMED TO WEAKEN IT, AND IT WAS A FALSE ALARM OF MINE. I looked for the family under the spellings ALASIA, ALLASIA, ALACIA, BERTINO and BERTINI and found nobody: no Benito of sixty-five, no Magdalena, no Margarita at all. I even noted it down as three worrying absences. THEY WERE ALL THERE. THE FAULT WAS MINE: SPELLINGS WERE MISSING. In Argentine census rolls the surname is written by ear, and this one has SEVEN different forms in the same census — Alasia, Alazio, Alassia, Alacio, Alasio, Allasia and Olazio. **Benedetto is indexed OLAZIO and his children ALAZIO**, which were precisely the two I had not tried. With them the whole household appeared in Colonia Emilia, with Margarita aged five. THE LESSON, and it holds for every search in census rolls: NEVER GIVE A NEGATIVE WITHOUT HAVING TRIED ALL THE PHONETIC VARIANTS.\n\nIF HE MARRIED IN SAVIGLIANO IN 1857 AND HIS DAUGHTER WAS BORN IN SANTA FE c. 1882, THE FAMILY EMIGRATED BETWEEN THOSE TWO DATES. Colonia Emilia and the colonies of the department of San Justo were settled above all by Piedmontese in the eighteen-seventies: it fits.\n\nWHERE EACH THING IS, verified on 27-8-2026:\n\n1802-1813 · HERE I WAS WRONG, AND THE CORRECTION MATTERS. I wrote that Savigliano was digitised on Antenati with Napoleonic Nati, Matrimoni and Morti, and that the same series was indexed on FamilySearch. **Both things are false.** They came from a search-engine summary, not from the catalogue. On reading the catalogue itself: the Archivio di Stato di CUNEO has 191 comuni and 50,891 registers, and **of Savigliano there is ONE SINGLE ONE**. And FamilySearch collection 1392991 covers the tribunals of Saluzzo and Mondovì, not Savigliano. AND ON 28 AUGUST THAT SINGLE REGISTER WAS READ, IN FULL. They are the MARRIAGE ANNEXES OF 1808 for the district of Savigliano: sixteen pages, four wedding dossiers, papers from Lagnasco, Cherasco, Cavallermaggiore, Saluzzo and Casale. **Not one Alasia nor one Bertino in any of them.** Firm negative: Antenati is closed for this branch.\n\nBUT IT DID YIELD SOMETHING USEFUL. The extracts of 1808 cite book and page of the parishes of Savigliano, and they name two that we did not know of: **SAN SALVATORE and SAN PIETRO**, besides the San Giovanni Battista that the tree gave. Savigliano had at least THREE parishes, so the letters now ask that all three be looked at.\n\n1814-1865 · THE HOLE. In the Kingdom of Sardinia there was no civil registration: between the fall of Napoleon and unification, EVERYTHING is parish. And precisely the three dates that matter fall there: Benedetto's birth (1822), that of his wife (1839) and the wedding of the two (1857). It must be requested from the parish or from the Archivio Diocesano di Torino.\n\n1866 ONWARDS · the civil registration of the Comune di Savigliano. But by then the family was already in Santa Fe.\n\nAND THERE IS A FOURTH ROUTE, ARGENTINE AND CHEAPER: the NATIONAL CENSUS OF 1895. Benedetto had died (1892), but his widow was still living —she died in 1899— and Margarita was thirteen. The 1895 census asks for the YEAR OF ARRIVAL in the country: a single sheet of Colonia Emilia would give the date of the emigration, the whole list of the children and which Italian province they declared themselves from.", "padre": "bartolomeo_allasia", "madre": "lucia_gaido", "conyuge": "maria_maddalena_bertino", "unionLibre": false, "otrasParejas": [], "hijos": ["margarita_alasia", "domingo_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_maddalena_bertino": {"id": "maria_maddalena_bertino", "nombre": "Maria Maddalena Bertino", "legal": "«Doña Magdalena Bertini» in the 1900 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "A Piedmontese woman from Savigliano, mother of Margarita Alasia.", "datos": [["Birth", "1839, according to the FamilySearch tree"], ["Death", "1899, same source — a year before her daughter's wedding"], ["Marriage", "13 April 1857, San Giovanni Battista, Savigliano, Cuneo"], ["Spouse", "BENEDETTO ALASIA"], ["Parents", "GIOVANNI DOMENICO BERTINO and CATTERINA BONAVIA, from FamilySearch"], ["FOURTEEN CHILDREN", "that is what she declares herself in the national census of 1895, already a widow. Ten are known from the tree, and only eight appear alive in the census of 1887: six are missing"], ["The three eldest never reached Argentina", "BARTOLOMEO (1860), SALVATORE FORTUNATO ANTONIO (1861) and DOMENICO CARLO (1863) do NOT appear in the census of 1887 anywhere in the province, under any of the seven spellings of the surname. The likeliest thing is that they died as children at Savigliano, before the emigration — but that is a deduction, not a proven fact"], ["Surname", "BERTINO in Piedmont, «Bertini» in the Argentine record"]], "vida": "1839–1899", "lug": "", "mapa": null, "sinacta": "Proven as Margarita's mother by the marriage record of 1900. If she died in 1899, her daughter married in recent mourning, aged nineteen and with no mother.\n\nShe married aged eighteen. All of it still needs to be verified against records. 29 AUGUST 2026 — THE NET TIGHTENS AROUND THE MISSING DAUGHTERS. Of the fourteen children she herself declared, six are still without a name, and the married daughters are the hardest to find because they disappear beneath the husband's surname: the census gives no maiden surname. The only lead are the indexes of the parish of Emilia published by Hugo Alloa, which list nine surnames married to ALLASIA — Baroni, Busatto, Chartier, Dacarro, Giupponi, Palmier, Ronzoni, Rossini and Zanutich.\n\nAll nine were searched for in the census of 1887. Four gave zero, but that zero was badly made: they had been searched with a single spelling, when her husband's own surname appears in seven ways in that same census roll. Repeated with thirty-two phonetic variants, two of the four zeros were false. The one that counts is ZANUTICH, indexed without the final «ch»: in the whole province there were three, and all three unmarried — ALBERTO aged twenty, JUAN aged eighteen and LUDOVICO aged sixteen, Italians, in San Justo, Colonia Angeloni, among Friulian neighbours, which is exactly where that surname comes from. So the Zanutich × Allasia wedding of the parish of Emilia is later than June 1887 and the groom is almost certainly one of those three. That turns a vague question into a concrete request to the Archdiocesan Archive, already added to the letter. If that Allasia turns out to be a daughter of hers, she is one of the six that are missing. It is not proven: what is proven is that there was no other Zanutich in the province and that these three were unmarried.\n\nThe other three are closed: BUSATTO and GIUPPONI do not exist in the province, not even with eight variants each, so those weddings are also later than 1887 or were celebrated elsewhere; and the only DACARO is a woman of thirty, alone in a boarding house in the town centre of Santa Fe, not in the colony, and she is ruled out. THE SAME DAY, LATER — A NEW METHOD WAS TRIED: THE GRANDCHILDREN'S NAMES. In these families the order of names was not free: the first male child bore the name of the paternal grandfather and the second that of the maternal grandfather; the first daughter that of the paternal grandmother and the second that of the maternal grandmother. That means that a daughter of hers married to anyone at all ought to have among her children a BENITO — for her father — and a MAGDALENA — for herself. And those names the census does give, even though it does not give the maiden surname. It is the only way of looking inside a family without knowing what surname the mother was born with. The thirty-one children of the eight households of those surnames in Colonia Emilia were read. Not a single Benito, Benedetto or Magdalena. The negative weakens the hypothesis, but does not kill it: the custom is strong and is not a law, in Piedmont it is followed less than in the south, and only five of the eight households have two children or more, which is the minimum for the test to mean anything. WHAT IS FIRM IS THE ARITHMETIC, AND IT ELIMINATES THREE. She married on 13 April 1857 and her eldest known child is of 1860, so no daughter of hers could have been born before 1858. That rules out RONZONI PAULA (35 years old, that is, born c. 1852, five years before the wedding), BARONI JUANA, Enrique's (32, c. 1855) and BARONI ANTONIA (30, c. 1857 — and besides, her four children were born in Italy, that is, she married there c. 1877, when this family had been in Argentina for years). Five survive: Inés Chartier, Teresa, Juana, María and Clementina Baroni. AND OUT OF THAT COMES A TEST THAT CAN BE MADE AND THAT CAN FAIL, which is exactly what was missing. The entire household of the best candidate was reconstructed and it is three people: Juan Baroni aged thirty-two, Teresa aged twenty-five and a single child, JOSÉ, aged one. By the rule of names that José bears the name of Juan's father — and the second male child ought to bear that of Teresa's father. If in the census of 1895 that couple has a second boy called BENITO, Teresa Baroni is a daughter of hers and one of the fourteen is recovered; if he is called something else, she is ruled out. It is a concrete request for the FamilySearch session, and until now this line produced only candidates that could neither be confirmed nor discarded. AND ON RECOVERING THE FIELDS THAT THE CENSUS DOES PUBLISH, THE LIST ORDERS ITSELF PROPERLY. The YEARS MARRIED give the year of the wedding directly, which is far more decisive than the age. With that, of the eight candidates three are eliminated beyond argument: RONZONI PAULA married in 1872, when Benedetto's eldest daughter was twelve; BARONI JUANA, Enrique's, was born c. 1855, two years before Benedetto's wedding; and BARONI ANTONIA married in 1877 and had her four children in Italy, when this family had been five years in Argentina.\n\nAnd a pattern appears that had not been visible: three Baroni — Juan, Jesús and Antonio, who by their ages and by living in consecutive libretos (census booklets) look like brothers — all three married in 1884, and all three have a single child in 1887. Three brothers marrying in the same season is common; with three sisters, even more so. And she still has four of the fourteen to locate: four daughters born between 1864 and 1872 would be between fifteen and twenty-three years old in 1887 and would already be married and out of the house — which is exactly the band into which Teresa, Juana, María and Clementina fall. It is a striking coincidence and nothing more: the census gives no maiden surnames and Baroni is a common surname. AND APPLYING THE SAME TEST TO THE WHOLE COLONY, INSTEAD OF TO NINE SURNAMES, SOMETHING CAME OUT THAT NOBODY WAS LOOKING FOR: HER OWN FAMILY. The census search engine also finds given names, not only surnames, so BENITO and MAGDALENA were searched across the whole province and Colonia Emilia was filtered out. The method validated itself: among the results appear «Olazio Benedetto, 65» and «Bertina Madalena, 47», one beside the other — she and her husband in person.\n\nAnd one of the hits was a one-year-old girl called MAGDALENA BERTHA. On reconstructing her surroundings there appeared, all together and in the same volume, a whole household of nine people with her surname: Juan Bertha aged 45, Dominga Bertina aged 28, CATARINA BERTINA aged 57, Gabriel Bertina aged 26, Valentín Bertha aged 55, and four children — María aged 5, Domingo aged 4, Caterina aged 3 and Magdalena aged 1. The indexer writes the same family «Bertina» and «Bertha» on consecutive lines, which is exactly why nobody had seen them: her surname had never been swept with variants. With the ten done, in Colonia Emilia there are exactly TEN: those nine and her. (I correct here a figure I gave wrongly the same day: I wrote that in the whole province there were 216 Bertino. There are 105. The census search engine searches within the full name, and BERTA and BERTHA are extremely common given names among the Swiss and Germans who settled Las Colonias: of the 216, one hundred and eleven are girls called Berta, not people bearing that surname. The real surnames are distributed across Las Colonias 44, Iriondo 23 and La Capital 22.) Until today her branch was a total void in Argentina — of her we had only the name, the wedding of 1857 and parents with no record. And there are three things that fit: Magdalena's mother was called CATTERINA and in that household there is a Catarina aged 57; Juan aged 45 is of her own year-group and a candidate for brother; and the one-year-old girl is called MAGDALENA, which by the custom of names comes from a grandmother or an aunt — and she lived a few blocks away. It is not proven: nowhere does the census say that these people are family of hers, and the colonies were settled by chains of countrymen from the same valley, so two unrelated Bertino families in the same village is perfectly possible. It would be closed by the marriage of Juan Bertino to Dominga, c. 1880 in the parish of Emilia, which would name his parents; or by the baptism of the girl Magdalena, c. 1886, where it is very probable that the godparents were she herself or Benedetto. Both things have been added to the letter to the Archdiocesan Archive. AND THE SAME DAY, LATER, THE MOST CONCRETE COINCIDENCE OF ALL APPEARED. The census entries publish seven fields that until today were being lost through a fault in my own script — relationship to the head, marital status, CHILDREN BORNE, YEARS MARRIED, dependency, and whether they could read and write. Recovered, they say this:\n\n MAGDALENA BERTINO... 47 years old, 31 years married, 14 children\n CATARINA BERTINO.... 57 years old, 31 years married, 3 children Two women of the same surname, in the same village of a hundred houses, declaring exactly the same year of marriage: 1856. Marrying off two sisters in the same season was the commonest thing in the world. And the four children of that household are called María, Domingo, CATERINA and MAGDALENA — which are precisely her own name and that of her mother, Catterina Bonavia. That is the fourth coincidence, and still nothing is proven: the census does not say that the two households are related, nor does it give maiden surnames. And looking for her outside Emilia has yielded nothing. In LAS COLONIAS, the neighbouring department, there are forty-four people with her surname, and not one can be proposed as a sister or brother of hers. The only one of her own year-group is BERTINI DOMINGO, aged forty-six, an employer, with a daughter Caterina and another Magdalena — but he reached Argentina c. 1880-1884, eight or ten years after this family, and he can read and write, which she could not. A weak candidate. The household of Colonia Emilia remains, by far, the best lead: it is the only one in the whole province where a Bertino woman declares exactly the same thirty-one years married. AND IN IRIONDO, THE LAST DEPARTMENT LEFT, THERE IS A SECOND HOUSEHOLD. COSTANZO BERTINO, aged sixty, an employer, married since 1847 to a Margarita of fifty-five who declares six children; four sons and another, Marco, with his own house next door. He was born c. 1827, thirteen years before her, and emigrated in the same wave. By age and by condition he is the most plausible candidate for an elder brother that has appeared in the whole province, and his surname is written exactly BERTINO, which is the correct Piedmontese spelling. But there is a criterion that had not occurred to me to use and that tips the balance: literacy. She was illiterate, her husband too, and of her ten known children only two could read. In the Colonia Emilia household not one of the nine can read; in the Iriondo one the father and the four sons read and write. The level of schooling is inherited within a family and within a village. Added to the rest — the same colony, the same thirty-one years married, and children called Caterina and Magdalena —, the Colonia Emilia household remains clearly the best candidate; Iriondo is not ruled out.\n\n(And a refinement of the figure: of the 105 real surnames of the province, forty-six are BERTON — which is not a spelling of Bertino but a Venetian and Piedmontese surname in its own right. Removing it, the set that really matters is some thirty-eight people in the whole province, and all three departments where they are have now been looked at.)\n\nA detail that orders the request: if Catarina married in 1856 it cannot have been in Emilia — the colony did not yet exist — but in Piedmont. Her marriage record would name her parents, and if they are Giovanni Domenico Bertino and Catterina Bonavia, she is a sister of hers.\n\nAnd in passing the census confirms her own case by a second route: she declares the FOURTEEN CHILDREN already in June 1887, eight years earlier than in the national census of 1895 and while still married, not widowed. And her 31 years married point to 1856, within a year of the 13 April 1857 that the record gives — normal in a figure given from memory.", "padre": "giovanni_domenico_bertino", "madre": "catterina_bonavia", "conyuge": "benedetto_alasia", "unionLibre": false, "otrasParejas": [], "hijos": ["margarita_alasia", "domingo_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "bartolomeo_allasia": {"id": "bartolomeo_allasia", "nombre": "Bartolomeo Allasia", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Piedmontese, born around 1797. The oldest ancestor of the Rivas branch.", "datos": [["Birth", "1797, according to the FamilySearch tree"], ["Spouse", "LUCIA GAIDO (1800)"], ["Son", "BENEDETTO ALASIA (1822-1892)"], ["Area", "SAVIGLIANO, province of Cuneo, Piedmont"], ["Source", "FamilySearch tree, identifier GZTS-5MB — no record"]], "vida": "b.1797", "lug": "", "mapa": null, "sinacta": "No record. If the date of 1797 is good, he is the oldest ancestor on the whole Rivas side of the tree — almost a century further back than there was two days ago, when this entire branch was a void.\n\nSavigliano preserves parish registers from the sixteenth century. There is much to be gained here. RECTIFICATION, OF THAT SAME 27-8-2026. I wrote in the morning that Savigliano was digitised on Antenati with Nati, Matrimoni and Morti of the Napoleonic period. IT WAS FALSE: I had taken it from a search engine's summary, not from the catalogue. Having read the real catalogue of the Archivio di Stato di Cuneo — 191 municipalities and 50,891 registers —, SAVIGLIANO HAS A SINGLE REGISTER, in the same batch as Racconigi, Ruffia or Villafranca Piemonte. And MONASTEROLO DI SAVIGLIANO IS NOT THERE: the only «Monasterolo» in the catalogue is Monasterolo Casotto, which is a different village and in the Mondovì area.\n\nSO THE ANTENATI ROUTE FOR THIS BRANCH IS PRACTICALLY DEAD. Three remain: the FamilySearch index (collection 1392991, which requires a session and could not be tested), the PARISH BOOKS of Savigliano — one has to write —, and above all the ARGENTINE SIDE, which is where the documents that can actually be consulted are.\n\nWHAT REMAINS TRUE OF THE REASONING: Bartolomeo was born c. 1797 and Lucia c. 1800: both fall just below the start of the fonds. But HIS SIBLINGS born between 1802 and 1813 are indeed there, and a single record of a sibling names Bartolomeo's father and mother with age and trade. And the DEATHS of 1802-1813 would already reach his grandparents, people born c. 1740.\n\nMOREOVER IT IS INDEXED BY NAME, free, on FamilySearch: collection 1392991, «Italy, Cuneo, Civil Registration (State Archive), 1795-1915», with index and images. ALLASIA and GAIDO can be searched in Savigliano without turning a single page.", "padre": null, "madre": null, "conyuge": "lucia_gaido", "unionLibre": false, "otrasParejas": [], "hijos": ["benedetto_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "lucia_gaido": {"id": "lucia_gaido", "nombre": "Lucia Gaido", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Piedmontese, born around 1800. Mother of Benedetto Alasia.", "datos": [["Birth", "1800, according to the FamilySearch tree"], ["Spouse", "BARTOLOMEO ALLASIA"], ["Son", "BENEDETTO ALASIA"], ["Source", "FamilySearch tree, identifier GZTS-G1R — no record"]], "vida": "b.1800", "lug": "", "mapa": null, "sinacta": "No record. GAIDO is a surname characteristic of Piedmont, of the Cuneo and Turin area.\n\nShe is searched for in the same way as her husband: Savigliano, STATO CIVILE NAPOLEONICO 1802-1813, on Antenati (archivio=201) and indexed on FamilySearch (collection 1392991). A brother of hers born in those eleven years would give her parents at a stroke.", "padre": null, "madre": null, "conyuge": "bartolomeo_allasia", "unionLibre": false, "otrasParejas": [], "hijos": ["benedetto_alasia"], "hermanos": [], "actas": [], "nAc eleri", "ercilia_celeri", "nerina_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "nerina_celeri": {"id": "nerina_celeri", "nombre": "Nerina Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 9, "ramas": ["celeri"], "resumen": "Elba's sister. Hers is the most Italian name of the five and the easiest to find in a register.", "datos": [["Father", "the Celeri immigrant"], ["Name", "NERINA is Italian and uncommon; in an Argentine census roll it identifies the family almost on its own"], ["Source", "family memory"]], "vida": "", "lug": "", "mapa": null, "sinacta": "No archival data.", "padre": "tebaldo_celeri", "madre": "margarita_alasia", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_tenuta": {"id": "teresa_tenuta", "nombre": "Teresa Tenuta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Wife of Michele Volpentesta. For two years she was in this tree as an index name with nothing behind it, and on 26 August 2026 a parish extract of 1793 finally named her.", "datos": [["Spouse", "MICHELE VOLPENTESTA († Rende, 20 August 1793, aged seventy)"], ["Children", "VINCENZO VOLPENTESTA (c. 1776 – 19 March 1823), and PIETRO VOLPINTESTA, married to Anna Belmonte († 1827) — the latter by index only"], ["Where it comes from", "the death extract of her husband, which calls him «MICHAEL VOLPENTESTA VIR THERESIAE TENUTA» — husband of Teresa Tenuta"], ["Widowed since", "August 1793"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Her case is the best example of why in this tree the index does not count as proof. The scanned indexes from the blog gave her as Vincenzo's mother from the very beginning, in two different rows (Vincenzo 1823/8 and his son Pietro 1827/34). But the record of 1823 was read twice — the original and the certified copy of 1837 — and both leave the mother's box BLANK, with the printed rule left unfilled. So it was decided not to open an entry for her: a name without a document does not get in.\n\nWhat rescued her was the parish extract of her husband's death, hidden inside her granddaughter's marriage dossier. A document in Latin, of 1793, that names her in three words: VIR THERESIAE TENUTA.\n\nOf herself nothing more is known: neither year, nor village, nor parents, nor when she died. In 1793 she was widowed. Everything of hers would be parochial, because civil registration does not begin until 1809. A side fact worth not forgetting: in Marano itself there is another Vincenzo Volpintesta, son of a Ferdinando and of an ANNA MARIA TENUTA, who died in 1855. Identical mother's surname and a different family. 29 AUGUST 2026 — SHE NOW HAS CHILDREN WITH NAMES AND YEARS. The baptismal books of the parish of Rende begin in 1731 and are transcribed on the Calabrian blog. Swept year by year, THREE children of hers come out, all three with the same formula «Volpintesta, Michele — Tenuta, Teresa»: PIETRO GAETANO in 1767 (record 13), VINCENZO MERCURIO in 1770 (record 48) and GREGORIO GIOACCHINO in 1773 (record 41). That is: she was living in RENDE at least from 1767 to 1773, and there she was widowed in 1793. AND THE ONE OF 1770 IS CALLED VINCENZO. If that child is our Vincenzo, then the box that the record of 1823 left blank is at last filled in by an independent route, and she ceases to depend on the three Latin words of 1793. But there is a clash — the death record says that Vincenzo was born in Marano, and the ages give 1773 or 1776, not 1770 — which is explained in full in his own entry. It is still not accepted as good until the original book is seen, which is on FamilySearch and not on Antenati.\n\nOF HER OWN PARENTS NOTHING IS STILL KNOWN, and it will not be easy: the marriage to Michele is not in the thirty-nine years of Rende marriage indexes that have been read (1733-1750 and 1752-1772). Either it is in the one year that is missing, 1751, or they married in her own parish. TENUTA families of Rende of those years, in case one of them is hers: Gaetano Tenuta with Isabella Chiappetta, Tommaso Tenuta with Chiara Russo, Biaggio Tenuta with Teresa Rocchetto, Vincenzo Tenuta with Rosa Rizzo and Antonio Tenuta with Carmina Di Simone. SHE WAS SEARCHED FOR IN SIXTEEN YEARS OF BAPTISMS AND SHE IS NOT THERE — AND IT IS KNOWN WHY. On 29 August 2026 the Rende baptisms of 1735 and of 1741 to 1755 were swept, year by year, in the alphabetical band where TENUTA falls. Not one Teresa. But the fault is not hers: the transcriptions jump from 1735 to 1741 — 1736, 1737, 1738, 1739 and 1740 are missing, and those five years fall right in the centre of the range in which she must have been born. Her children are baptised in 1767, 1770 and 1773; born before 1735 she would have been over thirty-two at the first, and born after 1755, twelve. Either she is in those five missing years, or she was not from Rende.\n\nThe sweep was not in vain: it left FIVE Tenuta families of Rende documented with children in those years, and one of them will be hers. The first one to look at is NICOLA TENUTA with TERESA CHIAPPETTA, with children in 1745, 1748, 1751 and 1753 — because the mother is called Teresa, and giving a daughter the mother's name was the commonest thing in the world. The other four: Giuseppe Tenuta with Innocenza Turano, Tommaso Tenuta with Chiara, Biaggio Tenuta with Teresa Rocchetto and Michele Tenuta with Innocenza Mirabelli.\n\nNOR IS SHE BURIED IN RENDE BETWEEN 1802 AND 1809, the eight years having been swept. She was widowed in August 1793, so either she died between 1793 and 1801 — years the transcriptions do not have — or she died from 1809 onwards, and then her record is already CIVIL and is on Antenati.\n\nAnd a warning that comes out of the same sweep and that must be kept in mind when reading anything that comes from those tables: the wife of Tommaso Tenuta is called Chiara in five rows, and her surname is transcribed in THREE different ways — Ruffolo, Russo and Di Bartolo. The column of the mother's surname is not always to be trusted. That does not touch her, because her name does not come from a transcription but from a document: the three Latin words of 1793.\n\nWHERE SHE IS NOT, AND THAT IS ALREADY A FACT (29 August 2026). Four Rende parish tables have been read — the marriages of 1796 and 1798 and the burials of 1804 and 1807, several hundred people — and NOT A SINGLE TENUTA APPEARS: not as bride, not as mother, not as deceased, not as wife of a deceased. This is added to the earlier search for her baptism in Rende (1735 and 1741-1755), which also gave zero. That was put down to the blog lacking the years 1736-1740; it can no longer be put down to that. The simple explanation is that TENUTA IS NOT A RENDE SURNAME, and it fits the conflict already noted in the entry of her son Vincenzo, whose death record says that he was born in MARANO. So the search here stops: she must be looked for in MARANO MARCHESATO, which is where this branch lives. This does not prove that no Tenuta exists in Rende in other years — it is a strong indication, not a demonstration.", "padre": null, "madre": null, "conyuge": "michele_volpintesta", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "rosina_salerno": {"id": "rosina_salerno", "nombre": "Rosina Salerno", "legal": "ROSE SALERNO in the United States", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["salerno"], "resumen": "Antonio's wife. Salerno by her maiden name too, as he was, and also from the province of Cosenza. She reached New York on the steamer Giuseppe Verdi and outlived her husband.", "datos": [["Birth", "c. 1901-1907, province of COSENZA, Italy — the census of 1950 gives her 43 years, her naturalisation petition a somewhat earlier date"], ["Surname", "SALERNO by birth. She married a Salerno without being any known relation: in these villages the surname does not identify a family"], ["Emigration", "she reached NEW YORK on the steamer GIUSEPPE VERDI, in a February of the nineteen-twenties — the exact figure of the year cannot be read with certainty"], ["Marriage", "19 May 1920, to Antonio Salerno"], ["Children", "Domenico (1922) and Filomena (1925), both at Riverdale, Illinois"], ["Naturalisation", "petition of her own no. 60555; her husband was naturalised on 25 January 1929"], ["Parents", "from the FamilySearch tree, RAFFAELE SALERNO and CHERUBINA CUNDARI — no record"], ["Alive in", "May 1981, when she was widowed"]], "vida": "c.1901–>1981", "lug": "Italia", "mapa": null, "sinacta": "Her naturalisation petition is filed in Antonio's entry, but the image is of low resolution and several figures — her year of birth and that of the voyage — cannot be read with certainty. It would be worth requesting it again from FamilySearch at full size.\n\nWhat is clear: she married on 19 May 1920, arrived on the GIUSEPPE VERDI, and her husband was naturalised on 25 January 1929. The FamilySearch tree makes her a daughter of Raffaele Salerno and Cherubina Cundari, and a granddaughter of Vincenzo Salerno and Angela Rosa Cardamone on one side and of Giuseppe Cundari and Anna Motta on the other. None of that has a record yet.", "padre": null, "madre": null, "conyuge": "antonio", "unionLibre": false, "otrasParejas": [], "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dominick_salerno": {"id": "dominick_salerno", "nombre": "Domenico Salerno", "legal": "DOMINICK D. SALERNO", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 9, "ramas": ["salerno"], "resumen": "Eldest son of Antonio and Rosina, the first of the family born in the United States. A railway switchman.", "datos": [["Birth", "11 February 1922, RIVERDALE, Illinois"], ["Name", "DOMENICO, after his uncle Domenico Salerno, his father's eldest brother, who stayed at Rende"], ["Parents", "Antonio Salerno and Rosina Salerno"], ["Trade", "SWITCHMAN with the railway company, thirty-six hours in 1950"], ["Family", "in 1950 he was living in his parents' house with his wife MARY L. and a two-year-old daughter, BEVERLEE"], ["Alive in", "May 1981, at Riverdale, when his father died"]], "vida": "1922–>1981", "lug": "RIVERDALE", "mapa": null, "sinacta": "He comes out of three documents of his father's: the naturalisation petition of 1925 gives his exact date of birth, the census of 1950 places him at home with a wife and a daughter, and the death notice of 1981 names him as the surviving son. His own certificate would be in Cook County, Illinois.\n\nThe «two grandchildren and five great-grandchildren» of the death notice of 1981 come almost certainly from him: in 1950 he already had a two-year-old daughter. Through this branch there is living American descent.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["filomena_salerno_usa"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_salerno_usa": {"id": "filomena_salerno_usa", "nombre": "Filomena Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 9, "ramas": ["salerno"], "resumen": "Daughter of Antonio and Rosina, born in Illinois and christened with her Calabrian grandmother's name.", "datos": [["Birth", "8 February 1925, RIVERDALE, Illinois"], ["Name", "FILOMENA, after her grandmother Filomena Chiappetta, who was still alive at Rende. Her father gave her the name of a woman the child would never come to know"], ["Parents", "Antonio Salerno and Rosina Salerno"], ["In 1950", "she is no longer living in her parents' house, aged twenty-five — probably married"]], "vida": "b.1925", "lug": "RIVERDALE", "mapa": null, "sinacta": "We know her only through her father's naturalisation petition, of 1925, which gives her exact date. She does not appear in the census of 1950 nor in the death notice of 1981, so either she married and changed surname, or she died before her father. Her birth certificate would be in Cook County, Illinois, and it would be the document that said whom she married.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["dominick_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "ciro_celeri": {"id": "ciro_celeri", "nombre": "Ciro Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "The fourth child of Callisto and Enrichetta, and the only one born after the digitised registers run out. He died at twenty-three.", "datos": [["Birth", "1867, Trassilico — according to the FamilySearch tree (GVC6-C8J)"], ["Death", "1890, at the age of twenty-three — same source"], ["Parents", "CALLISTO CELERI and ENRICHETTA VANNI"], ["Siblings", "Giuseppe Tullio Polinice (1860), Tebaldo (1862) and Dante Giuseppe (1864)"], ["Source", "FamilySearch tree. NO RECORD"]], "vida": "1867–1890", "lug": "Trassilico", "mapa": null, "sinacta": "He has no record, and there is a clean reason for it: THE DIGITISED FONDS OF TRASSILICO ENDS IN 1865, AND CIRO WAS BORN IN 1867. He falls right in the gap. It is not that he has not been searched for: it is that he cannot be seen.\n\nTHAT VERY THING MAKES HIM INTERESTING. Before knowing of him it had been concluded, by sweeping the birth indexes of 1861, 1863 and 1865, that no more siblings were going to come out of Antenati and that those after 1866 were already Italian civil registration not digitised. Ciro appears exactly where that conclusion said that what was missing would have to be.\n\nHIS BIRTH RECORD AND HIS DEATH RECORD EXIST, but in the Comune di Trassilico or in the Tribunale di Lucca, not on Antenati. And his death in 1890, aged twenty-three, falls in the years when his brother Tebaldo had already been in Argentina for some time.", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["tebaldo_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dante_celeri": {"id": "dante_celeri", "nombre": "Dante Giuseppe Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Tebaldo's younger brother, born twenty months after him. He surfaced on 27 August 2026, in the index of births for 1864.", "datos": [["Birth", "5 April 1864, at EIGHT IN THE MORNING, at TRASSILICO"], ["Where", "in his parents' own house, at the place called «NELLA PIAZZA DELLA MAESTÀ» — the same square where Tebaldo had been born two years earlier"], ["Registration", "10 April 1864, Comune di Trassilico, record 25. His father reported it"], ["Parents", "CALLISTO CELERI, aged 34, SEGRETARIO COMUNALE, and ENRICHETTA VANNI, aged 30"], ["Witnesses", "DARIO PIEROTTI, son of Angelo, and LEOPOLDO GAMBI, son of Jacopo, farmer"], ["Who signed the record", "DOCTOR PIETRO ANDREINI, son of the late Carlo, «Delegato Ufficiale dello Stato Civile» by an act of 30 December 1863"], ["The forename", "DANTE. After Polinice and Archimede, the town clerk's third son is named after the poet"]], "vida": "b.1864", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["tebaldo_celeri", "ciro_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "5 April 1864 the birth; 10 the record", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 25", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 51.7 «Nati» 1864"], ["Shelfmark", "ark:/12657/an_ua35853264 — hash 5vX82KK, 44 images; the record on page 14, the alphabetical index on pages 42 and 43"]], "literal": "", "traduccion": "The year 1864, the 10th day of April. Before me, the undersigned ANDREINI DOCTOR PIETRO, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, Circondario of the Garfagnana, there appeared CELERI CALLISTO, SON OF THE LATE DESIDERIO, aged THIRTY-FOUR, TOWN CLERK, born and resident at Trassilico,\n\nwho, in the presence of DARIO PIEROTTI son of Angelo, without profession, and of LEOPOLDO GAMBI son of Jacopo, farmer, witnesses of full age, both born and resident at Trassilico, declared that on the FIFTH of the current month and year, at EIGHT IN THE MORNING, there was born to him in the house of his dwelling, situated at Trassilico, IN THE PLACE CALLED ON THE SQUARE OF THE MAESTÀ,\n\nof VANNI ENRICHETTA, daughter of the late Pietro, aged THIRTY, without profession, born and resident at Trassilico, his lawful consort, a son upon whom were bestowed the names DANTE GIUSEPPE.", "notas": ["THE THIRD DOCUMENTED CHILD OF CALLISTO AND ENRICHETTA. They run Giuseppe Tullio Polinice (November 1860), Tebaldo Jacopo Archimede (July 1862) and Dante Giuseppe (April 1864): one every twenty months.", "AND THE SAME LEARNED OBSESSION CONTINUES. Polinice, Archimede and now DANTE. In a village of a hundred households, the town clerk christened his children with the library open in front of him.", "THE HOUSE IS NOW HIS OWN AND IT IS ON THE SQUARE. In 1860 they lived «dai Bottegai»; in 1862 Tebaldo was born in the house of LUISA VANNI, «Alla Maestà»; in 1864 Callisto's own house is «NELLA PIAZZA DELLA MAESTÀ». It is the same square: what happened in 1862 was not a move to another quarter, it was the house next door.", "AND IT PROVES THAT
