, "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francisco_r": {"id": "francisco_r", "nombre": "Withheld", "legal": null, "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 12, "ramas": ["rivas", "salerno", "celeri", "faienza"], "resumen": "A living person. By family decision their details are not published on this site: the name, dates and places are not in the file at all, only in the private copy.", "datos": [], "vida": "", "lug": "", "mapa": null, "sinacta": "There is nothing to show here, and that is deliberate. This person belongs to the two most recent generations of the tree and is alive, so the published version keeps them only as a link: you can see whom they descend from, so the line is not broken, and nothing more. The details remain complete in the family's private copy.", "padre": "alfonsina_rivas", "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["tomas_r"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "anna_cundari": {"id": "anna_cundari", "nombre": "Anna Cundari", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 9, "ramas": ["salerno"], "resumen": "Wife of Giovanni, the brother of Settimo who stayed at Rende. She surfaced in a note in the margin of his birth record.", "datos": [["Marriage", "24 July 1926, Rende — record 34"], ["Spouse", "Giovanni Salerno, born at Rende in 1904"], ["Source", "marginal note on his birth record (Rende 1904, record 5)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "Her marriage record has an exact reference —RENDE, MATRIMONI 1926, RECORD 34— but the Rende holdings on Antenati end in 1910, so it must be requested from the Comune di Rende. It would name her parents, give her age and her town, and open up a whole branch: Giovanni's descendants are probably still in Rende today.", "padre": null, "madre": null, "conyuge": "giovanni_hijo", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "caterina_misurelli": {"id": "caterina_misurelli", "nombre": "Caterina Santa Misurelli", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 9, "ramas": ["salerno"], "resumen": "Wife of Salvatore, the nephew who lost his father at thirteen months. She surfaced in a note in the margin of his birth record.", "datos": [["Marriage", "15 October 1921, Rende — record 67"], ["Spouse", "Salvatore Salerno, born at Rende in 1899"], ["Surname", "read as «-elli»; the letter after «Mi» is doubtful: Misurelli or Miturelli"], ["Source", "marginal note on his birth record (Rende 1899, record 13)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "An exact reference —RENDE, MATRIMONI 1921, RECORD 67— beyond the reach of Antenati, which stops in 1910. It must be requested from the Comune di Rende. It would incidentally fix the spelling of the surname, today uncertain.", "padre": null, "madre": null, "conyuge": "salvatore", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marcos_ramon_rivas": {"id": "marcos_ramon_rivas", "nombre": "Ramón Marcos Rivas", "legal": "RAMÓN MARCOS, not Marcos Ramón — so both his records and the cemetery register write it", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 9, "ramas": ["rivas", "celeri"], "resumen": "Gonzalo's paternal grandfather. On 31 August 2026 he went from being the largest gap in the tree — a man with no dates, no village and no proven parents — to having TWO RECORDS from the Santa Fe civil registry. He was born at CAYASTACITO, department of SAN JUSTO, in November 1909, worked as a clerk at Calchaquí, married at Jobson in 1948 and died at Santa Fe in 2002, aged ninety-two. And his records name his parents at last: RAMÓN RIVAS, a landowner of San Justo, and ROSA BUDIÑO.", "datos": [["Birth", "28 NOVEMBER 1909, AT TWO IN THE MORNING, AT CAYASTACITO, department of SAN JUSTO, province of Santa Fe — in his mother's home. Act 66, registered on 12 December. SETTLED BY HIS OWN BIRTH RECORD on 3 September 2026"], ["The date that kept shifting, settled", "THE TWENTY-EIGHTH WINS. His 1948 marriage record said the 23rd; his 2002 death record and the cemetery register said the 28th. The birth record, made fourteen days after the birth, says TWENTY-EIGHT"], ["How his father acknowledged him", "ON 3 SEPTEMBER 1942, BY A NOTE IN THE MARGIN OF THIS VERY RECORD. «By act two hundred and one of the birth book of the San Justo office, Don RAMÓN RIVAS acknowledged the present registrant as his own natural son.» File 593. He was thirty-two; his father, fifty-three. In 1909 the father's box had been left BLANK"], ["Both places are the same", "the marriage says «San Justo» and the death certificate «Cayastacito». They do not contradict each other: Cayastacito is the LOCALITY and San Justo the DEPARTMENT. One gave the village, the other the district"], ["Death", "18 November 2002, at 07:35, in the city of Santa Fe — volume 5°B, record 1237, year 2002. Ten days before he would have turned ninety-three"], ["Marriage", "10 April 1948, JOBSON, department of Vera, Santa Fe — record 15, before Julio H. Deiber, head of the Registry of Civil Status"], ["Father", "RAMÓN RIVAS (14 January 1889 – 24 August 1971), Argentine, of SAN JUSTO, a HACENDADO. He was TWENTY when this son was born. He acknowledged him formally in 1942. His own death record, found on 3 September 2026, also gives his parents: Evergisto Rivas and Rita Álvarez"], ["Mother", "ROSA BUDIÑO, aged SEVENTEEN, single, a seamstress, unable to write. She went alone to the register office at Cayastacito to record him. Daughter of Antoliano Budiño and Teresa Álvarez. A new name in this tree, confirmed by all three records. By April 1948 she was already dead"], ["Trade", "EMPLEADO (clerk) in 1948; RETIRED when he died in 2002"], ["Addresses", "CALCHAQUÍ when he married, in 1948; and his house at Ruta n.º 1, kilometre 5.5 west, SAN JOSÉ DEL RINCÓN, where he was resident when he died. But he did not die there: the record says the death occurred in the CITY OF SANTA FE"], ["Identity document", "M 2,479,755"], ["Spouse", "ELVA AGUSTINA CELERI, whom he married at thirty-eight; she was twenty-six"], ["Children", "Marcos César (1950), Héctor Omar, Beatriz Margarita and Raúl"], ["Siblings", "at least one, who visited him in old age and looked just like him. Still without a name. One candidate was checked — a Francisco, natural son of a different Rosa Budiño — and ruled out: he died at three months old in 1913"], ["Who reported his death", "GUILLERMO BERTONE, document 24,232,601, resident at Santo Tomé, «by virtue of being a person authorised for that purpose» — that is, an agent, not a relative"]], "vida": "1909–2002", "lug": "A LAS DOS DE LA MAÑANA", "mapa": null, "sinacta": "No record yet, but since 31 August 2026 WITH DATES. Gonzalo found his entry in the index of Argentine cemetery records: born on 28 NOVEMBER 1909, died on 18 NOVEMBER 2002 aged ninety-two, and buried that same day at Santa Fe. THE FIRST THING IS A WARNING ABOUT HIS NAME. The record calls him RAMON MARCOS RIVAS: his two names the other way round from what the family called him. It is no small detail, because anyone searching an alphabetical index for «Marcos Ramón» may never find him. When ordering any paper of his, both forms must be given. This archive has already tripped over the same thing three times: Settimo appears as «Settino», Aquila as «Rosalia» and Livia as «Lucia». AND IT CHANGES THE ORDER OF WHAT TO REQUEST. Until now not even his year was known, so the marriage was the way in. Now the best is his DEATH CERTIFICATE: the date is known exactly — 18 November 2002, Santa Fe — and it is the modern form, the one that carries printed the DATE AND PLACE OF BIRTH of the deceased as well as his parents. It is exactly the kind of record that made Paglieta appear in the Faienza branch.\n\nWHAT IS STILL MISSING IS THE PLACE. His birth record of 28 November 1909 cannot be requested until it is known in which locality it was entered — and his death certificate would say.\n\nAND THE MARRIAGE to Elba Celeri still stands, around 1948 or 1949, for a reason no other paper covers: a death certificate is reported by somebody else, but the marriage record was declared by HIM. It is the one moment of his life when he was obliged to state whose son he was, with his signature at the foot. If what he said there does not match his birth record, that discrepancy would be the finding.\n\nA WARNING ABOUT THE SOURCE: «Argentina, Cemetery Records, 1833-2020» is a FamilySearch INDEX, not the original document. It counts as a firm lead, not as proof — and this project has already caught FamilySearch getting a name wrong with Livia Righini.\n\nHe had at least one brother: see his card.", "padre": "ramon_rivas", "madre": "rosa_budino", "conyuge": "elba_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["marcos_rivas", "hector_omar_rivas", "beatriz_rivas", "raul_rivas"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "28 November 1909, at 2 a.m.; registered on 12 December", "lugar": "Cayastacito, departamento de San Justo, Santa Fe, Argentina", "ref": "act number 66", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se pidió", "copia legalizada, pedida por Gonzalo en línea el 31 de agosto de 2026 y expedida el 3 de septiembre"], ["Certifica", "el jefe del archivo central de Santa Fe, con firma digital"], ["Qué se archiva aquí", "sólo la hoja del acta. La segunda hoja del PDF original es el comprobante de pago y lleva datos personales de Gonzalo: no se archiva ni se publica"]], "literal": "", "traduccion": "Act number SIXTY-SIX.\n\nAt CAYASTACITO, department of SAN JUSTO, province of Santa Fe, on the TWELFTH day of DECEMBER nineteen hundred and nine, at ELEVEN in the morning. Before me, [V.] N. ÁVILA, registrar of Civil Status, there appeared DOÑA ROSA BUDIÑO, SEVENTEEN YEARS of age, SINGLE, of ARGENTINE nationality, by trade a SEAMSTRESS, resident of this village, declaring:\n\nThat AT HER HOME, on the TWENTY-EIGHTH day of NOVEMBER last, at TWO in the morning, was born a BOY of WHITE colour, who is the DECLARANT'S OWN NATURAL SON.\n\nThat he is the grandson, on the paternal side, of ———— (left BLANK), and on the maternal side of Don [Ignacio] ANTOLIANO BUDIÑO and Doña TERESA ÁLVAREZ.\n\nAnd that the said boy has been given the name RAMÓN MARCOS.\n\nAll of which was witnessed by Don PASCUAL MAURIZI, TWENTY-NINE years of age, single, of ITALIAN nationality, resident in this village; and Don LUIS BOASSI, FIFTY-SIX years of age, married, of ITALIAN nationality, by trade a MERCHANT, resident in this village.\n\nThe record having been read, it was ratified in its content, signed together with me by the witnesses and by Don [S.] ROMÁN, of full age, of this neighbourhood, AT THE REQUEST OF THE DECLARANT BECAUSE SHE CANNOT WRITE.\n\n════════ IN THE MARGIN ════════\n\n«Directorate General […]. September THIRD, nineteen hundred and FORTY-TWO. By act TWO HUNDRED AND ONE of the birth book of the SAN JUSTO office of the current year, Don RAMÓN RIVAS ACKNOWLEDGED THE PRESENT REGISTRANT AS HIS OWN NATURAL SON. Be it recorded. File no. 593.»\n\n(And above, another annotation: Santa Fe, 24 February 1972, a copy of this record is issued at the request of the interested party.)", "notas": ["THIS IS THE RECORD THAT CLOSES THE RIVAS BRANCH. It was ordered to settle three things and it settled all three at once: the exact day of his birth, who his mother was, and whether his father acknowledged him. And it threw in the names of two great-great-grandparents nobody knew.", "THE DAY IS THE TWENTY-EIGHTH. There was a five-day discrepancy that had stood unresolved for months: the 1948 marriage record said 23 November; the 2002 death record and the cemetery register said the 28th. Two against one, but the one had been declared by the man himself at thirty-eight. THE TWENTY-EIGHTH WINS, being what the register made fourteen days after the birth says. He was born at TWO IN THE MORNING, at home.", "HIS MOTHER WAS SEVENTEEN, A SEAMSTRESS, AND COULD NOT WRITE. She went to the register office alone, unmarried, to record the child as her own natural son. The last line of the record says another person signed «at the request of the declarant because she cannot write». Gonzalo had feared she was fifteen; she was seventeen.", "AND BY NAMING HER PARENTS, IT IDENTIFIES HER. The record states that the child is the grandson on the maternal side of ANTOLIANO BUDIÑO and TERESA ÁLVAREZ. That couple was already in this archive without anyone knowing it: they head the Budiño household of the 1895 national census, where a ROSA aged one appears. There were two candidate Rosa Budiños; this is the one.", "THE FATHER'S BOX, BLANK. In December 1909 the child is registered with no father: the line for the paternal grandparents is left empty. Ramón Rivas was twenty and was not there.", "BUT IN THE MARGIN, THIRTY-THREE YEARS LATER: THE ACKNOWLEDGEMENT. «September third, nineteen hundred and forty-two […] Don RAMÓN RIVAS acknowledged the present registrant as his own natural son.» By act 201 of the San Justo office, file 593. Ramón Marcos was thirty-two; his father, fifty-three. It is the documented answer to why he bore the surname Rivas.", "SIX YEARS AFTER THAT ACKNOWLEDGEMENT he married at Jobson, and in the marriage record his father appears with a name and a trade. The order of things matters: acknowledgement first, wedding after.", "AND THERE IS A THIRD ANNOTATION, top left: in FEBRUARY 1972 someone requested a copy of this record. Ramón Rivas had died in August 1971.", "THE WITNESSES ARE TWO ITALIANS — Pascual Maurizi, twenty-nine, and Luis Boassi, a merchant of fifty-six — both residents of Cayastacito. Neither appears in the 1887 provincial census, so they arrived later: this is the settling of the colonies, which in those years was changing everything thereabouts."], "imgs": [{"u": "../actas/1909%20-%20Nacimiento%20de%20Ramon%20Marcos%20Rivas/1909-11-28%20N%20Acta%20de%20nacimiento%20-%20Cayastacito%20acta%2066.png", "t": "Acta de nacimiento - Cayastacito acta 66"}], "zooms": []}, {"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "18 de noviembre de 2002, a las 07:35", "lugar": "ciudad de Santa Fe, departamento La Capital, Argentina", "ref": "tomo 5°B, acta 1237", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se consiguió", "requested online by Gonzalo on 31 August 2026 and issued the same day. Application 26-00-287-370"], ["Certificado médico", "Cristian Meser"]], "literal": "", "traduccion": "ARGENTINE REPUBLIC, PROVINCE OF SANTA FE. Registry of Civil Status. Volume 5°B, record 1237, year 2002.\n\nAt SANTA FE, department of LA CAPITAL, province of Santa Fe, Argentine Republic, on 19 NOVEMBER 2002, I, Public Officer of this Registry, record the DEATH of RAMÓN MARCOS RIVAS.\n\nSex MALE, nationality ARGENTINE. Status: MARRIED. Occupation: RETIRED. Identity document: M 2,479,755. Address: RUTA N.º 1, KM 5.5 WEST, SAN JOSÉ DEL RINCÓN, Santa Fe.\n\nSON OF RAMÓN RIVAS AND OF ROSA BUDIÑO.\n\nBORN AT CAYASTACITO, SANTA FE, ON 28 NOVEMBER 1909.\n\nOccurring at Santa Fe on 18 November 2002 at 07:35. Cause of death: illness. Medical certificate of CRISTIAN MESER. Informant: GUILLERMO BERTONE, identity document 24,232,601, address Santo Tomé, Santa Fe, acting by virtue of being a person authorised for that purpose.", "notas": ["THIS RECORD GIVES THE VILLAGE, WHICH WAS WHAT WAS MISSING: CAYASTACITO. The cemetery register said where he was buried, not where he was born. With this it is now possible to request his birth record, which is the next link and the one that would name Rosa Budiño with her age and say whether Ramón Rivas acknowledged him.", "AND IT FITS THE MARRIAGE RECORD RATHER THAN CONTRADICTING IT. There he said «San Justo»; here it says «Cayastacito». Cayastacito is the locality and San Justo the department, so both are true at different levels. One gave the village, the other the district. An archival curiosity: in the provincial census of 1887 Cayastacito still appears within the department of LA CAPITAL, not San Justo — the boundaries moved.", "BUT THE DATE DOES CONTRADICT: here 28 November, on his marriage the 23rd. And here the informant is not the family but GUILLERMO BERTONE, «a person authorised for that purpose» — an agent. It is the same pattern as in the other four Argentine certificates in this archive: the informant is never a relative.", "HE DIED TEN DAYS BEFORE HIS NINETY-THIRD BIRTHDAY, at twenty-five to eight in the morning. And the two addresses the record gives must not be confused: HE HAD A HOUSE at SAN JOSÉ DEL RINCÓN — Route 1, kilometre 5.5 — and that is where he was resident, but the death «occurring at Santa Fe» is in the CITY, not at the Rincón. And it confirms both his parents by a second route, fifty-four years after the marriage and with a different informant: RAMÓN RIVAS and ROSA BUDIÑO."], "imgs": [{"u": "../actas/2002%20-%20Ramon%20Marcos%20Rivas/2002-11-18%20D%20Partida%20de%20defuncion%20-%20Santa%20Fe%20tomo%205B%20acta%201237.jpg", "t": "Partida de defuncion - Santa Fe tomo 5B acta 1237"}], "zooms": []}, {"titulo": "Marriage record with Elva Agustina Celeri", "tipo": "M", "tipoNombre": "Marriage", "fecha": "10 de abril de 1948", "lugar": "Jobson, departamento Vera, Santa Fe, Argentina", "ref": "acta 15", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se consiguió", "pedida en línea por Gonzalo el 31 de agosto de 2026, expedida ese mismo día. Trámite 26-00-287-372"], ["Registrar", "Julio H. Deiber, jefe del Registro del Estado Civil de Jobson"], ["Formulario", "«Modelo B» — el impreso de matrimonios de la provincia"]], "literal": "", "traduccion": "Record number FIFTEEN. At JOBSON, department of VERA, province of Santa Fe, on the TENTH day of APRIL in the year nineteen hundred and FORTY-EIGHT. Before me, JULIO H. DEIBER, head of the Registry of Civil Status, there appeared:\n\nDon RAMÓN MARCOS RIVAS, of ARGENTINE nationality, UNMARRIED, BORN AT SAN JUSTO on the TWENTY-THIRD OF NOVEMBER NINETEEN HUNDRED AND NINE, resident at CALCHAQUÍ and by trade a CLERK; SON OF DON RAMÓN RIVAS, of ARGENTINE nationality, resident at SAN JUSTO and by trade a HACENDADO (landowner), and OF DOÑA ROSA BUDIÑO, DECEASED.\n\nAnd doña ELVA AGUSTINA CELERI, of ARGENTINE nationality, UNMARRIED, BORN AT JOBSON on the TWENTY-SIXTH OF DECEMBER NINETEEN HUNDRED AND TWENTY-ONE, resident at JOBSON and by trade a CLERK; daughter of don TEBALDO CELERI, DECEASED, and of doña MARGARITA ALASIO, of ARGENTINE nationality, by trade «domésticos» and resident at JOBSON.\n\nBoth parties stated that it was their will to marry, taking each other as husband and wife, and that there was no impediment whatever to the celebration of their marriage.\n\nThe witnesses don ESTEBAN LUIS CORTI, aged THIRTY-FIVE, of Argentine nationality, resident at CALCHAQUÍ, and don EDUARDO CEPZ, aged FORTY-ONE, of Argentine nationality, resident at JOBSON, neighbours and competent for this act, declared as to the identity of the future spouses.\n\nThe articles 50, 51 and 53 of the national marriage law having been read, I asked don Ramón Marcos Rivas whether he wished doña Elva Agustina Celeri for his wife, and her whether she wished him for her husband; and both having answered yes, I declare that they are joined in lawful marriage. The record having been read, the parties expressed their agreement and SIGNED IT with the witnesses. — She signs «Elba Celeri».", "notas": ["This is the record that opened the Rivas branch. Until 31 August 2026 that whole branch stood in the tree on family memory alone, without a single document; this was the first, and from it came the names of Ramón Rivas and Rosa Budiño. Four days later the branch had twelve records and reached generation 5.", "Here RAMÓN RIVAS appeared for the first time with a document behind him: Argentine, resident at SAN JUSTO and by trade a HACENDADO. Until then he was only a name from family tradition. He now also has his baptism record, from 1888, and his death record, from 1971, both in his profile.", "And here ROSA BUDIÑO appeared, who was not in the tree even as a memory. The record gives her name and a date: by April 1948 she was already dead — the form puts «deceased» in the box for her nationality, which is how these forms mark dead parents. Her son's birth record, found later, identified her as Rosa Bernarda, daughter of Antoliano Budiño and Agustina Teresa Álvarez.", "AND IT CORRECTS THE NAMES OF BOTH GRANDPARENTS. He is not «Marcos Ramón» but RAMÓN MARCOS: the record writes it so six times, and his death certificate and the cemetery register agree. And she is not «Elba Celeri» but ELVA AGUSTINA CELERI — although at the foot of the record she herself signs «Elba Celeri», which is what she was called. Both matter when ordering papers: anyone searching an alphabetical index for «Marcos Ramón» or «Elba» may not find them.", "HERE HE DECLARES A DATE THAT WAS NOT HIS. He says he was born on the TWENTY-THIRD of November 1909; his death record and the cemetery register say the TWENTY-EIGHTH. His birth record, found on 3 September 2026, settles it: he was born on the 28th, at two in the morning. He got it wrong himself, at his own wedding, aged thirty-eight.", "TEBALDO CELERI WAS ALREADY DEAD by April 1948, and MARGARITA ALASIA WAS STILL ALIVE, resident at Jobson and by trade «domésticos». It is the last known trace of her. Her surname is written ALASIO here, one more spelling to add to the seven from the 1887 census.", "WHERE THEY LIVED: he at CALCHAQUÍ, she at JOBSON — both in the north of Santa Fe, and Jobson is exactly where Tebaldo Celeri had settled on arriving from Trassilico. Both are recorded as CLERKS, not as farm people."], "imgs": [{"u": "../actas/1948%20-%20Matrimonio%20Ramon%20Marcos%20Rivas%20y%20Elva%20Agustina%20Celeri/1948-04-10%20M%20Acta%20de%20matrimonio%20-%20Jobson%20acta%2015%20pagina%201.jpg", "t": "Acta de matrimonio - Jobson acta 15 pagina 1"}, {"u": "../actas/1948%20-%20Matrimonio%20Ramon%20Marcos%20Rivas%20y%20Elva%20Agustina%20Celeri/1948-04-10%20M%20Acta%20de%20matrimonio%20-%20Jobson%20acta%2015%20pagina%202.jpg", "t": "Acta de matrimonio - Jobson acta 15 pagina 2"}], "zooms": []}], "nActas": 2, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "elba_celeri": {"id": "elba_celeri", "nombre": "Elva Agustina Celeri", "legal": "ELVA AGUSTINA on her marriage record — but she signs «Elba Celeri»", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 9, "ramas": ["rivas", "celeri"], "resumen": "Gonzalo's paternal grandmother, one of at least five sisters. Until 31 August 2026 she appeared here as «Elba Celeri», with no dates: her marriage record gave her back her full name and the exact day she was born. Her father was Tebaldo Celeri, the immigrant from Trassilico; Tuscany enters the tree through her.", "datos": [["Birth", "26 DECEMBER 1921, at JOBSON (department of Vera, Santa Fe) — from her marriage record of 1948"], ["Her name", "the record calls her ELVA AGUSTINA CELERI, but at the foot she herself signs «Elba Celeri», which is what the family called her. Both are hers; when searching an index, try both"], ["Marriage", "10 April 1948, Jobson, record 15 — at twenty-six, to a man of thirty-eight"], ["Trade", "EMPLEADA (clerk), according to her marriage record"], ["Parents", "TEBALDO CELERI, already dead by April 1948, and MARGARITA ALASIO, Argentine, by trade «domésticos», then resident at Jobson — CONFIRMED BY RECORD"], ["Spouse", "Ramón Marcos Rivas"], ["Children", "Marcos César (1950), Héctor Omar, Beatriz Margarita and Raúl"], ["Sisters", "Olga, Ercilia (or Hercilia), Rosa and Nerina. There may be more"], ["Source", "the marriage record of 1948, filed on her husband's card"]], "vida": "b.1921", "lug": "JOBSON", "mapa": null, "sinacta": "Her marriage record, filed on Ramón Marcos Rivas's card, at last gave her a full name and a date: ELVA AGUSTINA CELERI, born at JOBSON on 26 DECEMBER 1921. WHAT THAT CONFIRMS. That she was the daughter of Tebaldo Celeri and Margarita Alasio, something only family memory had said until now. And that in April 1948 her father was already dead while her mother was living, at Jobson — the last known trace of Margarita.\n\nWHAT IS MISSING IS HER BIRTH RECORD, Jobson or the department of Vera, 26 December 1921. It would give the ages of Tebaldo and Margarita in 1921 and their exact address, and would be the first Argentine document to describe Tebaldo as an old man. And her DEATH, with no known date.\n\nAND HER FOUR SISTERS ARE STILL MISSING: Olga, Ercilia, Rosa and Nerina, all on family memory. With Elva's date it is now known where to look — the births of Jobson and Vera in the 1920s — and NERINA is the rarest name and therefore the easiest to find.", "padre": "tebaldo_celeri", "madre": "margarita_alasia", "conyuge": "marcos_ramon_rivas", "unionLibre": false, "otrasParejas": [], "hijos": ["marcos_rivas", "hector_omar_rivas", "beatriz_rivas", "raul_rivas"], "hermanos": ["olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "actas": [{"titulo": "Marriage record with Elva Agustina Celeri", "tipo": "M", "tipoNombre": "Marriage", "fecha": "10 de abril de 1948", "lugar": "Jobson, departamento Vera, Santa Fe, Argentina", "ref": "acta 15", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se consiguió", "pedida en línea por Gonzalo el 31 de agosto de 2026, expedida ese mismo día. Trámite 26-00-287-372"], ["Registrar", "Julio H. Deiber, jefe del Registro del Estado Civil de Jobson"], ["Formulario", "«Modelo B» — el impre : ["amanda_esposito"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "rosa_budino": {"id": "rosa_budino", "nombre": "Rosa Bernarda Budiño", "legal": "las tres actas de su hijo la llaman sólo «Rosa Budiño»; el nombre completo sale del árbol colaborativo de FamilySearch", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["rivas"], "resumen": "Gonzalo's paternal great-grandmother. She was not in this tree even as a memory until August 2026, when her son's marriage record named her. His birth record identified her beyond doubt: daughter of Antoliano Budiño and Agustina Teresa Álvarez, the one-year-old girl of the 1895 census. She was a seamstress, unmarried, and could not write. She had died before April 1948.", "datos": [["Confirmed by record", "YES, and by three: her son's birth record (Cayastacito, 1909, act 66), his marriage (Jobson, 1948) and his death record (Santa Fe, 2002)"], ["Birth", "about 1894-95, and the sources disagree. The May 1895 national census gives her ONE YEAR OLD. The FamilySearch tree gives her born in 1895. And she herself declares SEVENTEEN YEARS in December 1909, which would mean 1892. No exact date"], ["How old she was when she became a mother", "if she was born in 1894 or 1895, she was FOURTEEN OR FIFTEEN when Ramón Marcos was born in November 1909. The age she declared at the register office — seventeen — is the only one of the three sources that gives that figure"], ["Her full name", "ROSA BERNARDA. Her son's three records call her only «Rosa Budiño»; the second forename comes from the FamilySearch collaborative tree, profile KGXW-FPW, which Gonzalo accepted"], ["Her brothers and sisters", "IRENEO (about 1888) · DERMILIO or DELMIRO (1890) · FERNANDO FELIS (1893) · herself · ANITA (1896) · LAUREANO ULRICO (1901) · MICAELA PAULINA. The first four are in the 1895 schedule; the last three only in the FamilySearch tree"], ["Parents", "ANTOLIANO BUDIÑO and TERESA ÁLVAREZ, according to her son's birth record, which names her as the child's maternal grandmother. They are the couple heading the Budiño household in the city of Santa Fe in 1895"], ["Trade", "SEAMSTRESS, at seventeen, at Cayastacito"], ["She could not write", "the last line of the record says so: it was signed for her by «Don [S.] Román, of full age, of this neighbourhood, AT THE REQUEST OF THE DECLARANT BECAUSE SHE CANNOT WRITE»"], ["Marital status", "SINGLE. She registered the child as HER OWN NATURAL SON, with the father's box left blank"], ["Son", "RAMÓN MARCOS RIVAS, born at Cayastacito on 28 November 1909 at two in the morning, in her own home"], ["Her partner", "RAMÓN RIVAS, a landowner of San Justo, who was twenty. THERE IS NO RECORD THAT THEY MARRIED, and he acknowledged the child thirty-three years later"], ["Dead before", "April 1948 — her son's marriage record marks her «deceased»"], ["The surname", "BUDIÑO is a GALICIAN surname, from Pontevedra and Ourense. But the Budiños of Santa Fe came from CÓRDOBA: her grandmother Luisa was born there about 1827"], ["Her world, in figures", "From the 1887 provincial census: of the people of Santa Fe enumerated, 87,042 COULD NOT WRITE and 62,608 could — 58% were illiterate. SEAMSTRESS was the SIXTH most common occupation in the province, with 2,689 women. And ESTANCIERO, her father's trade, the SEVENTH, with 2,460"], ["How many Budiños there were", "MEASURED, NOT ASSUMED. In the 1887 provincial census there are SEVENTEEN people of that surname in the whole province, ten of them at HELVECIA — and among those, her father"], ["Source", "her son's birth record, in his profile; and the 1887 and 1895 censuses, in her father's profile"]], "vida": "c.1894–<1948", "lug": "", "mapa": null, "sinacta": "IDENTIFIED, BUT WITHOUT A SINGLE PAPER OF HER OWN. Neither her birth nor her death survives, and there is no photograph. Everything known about her comes from other people's documents: her son's birth record, which gives her age, her trade, her status and her parents' names; and the two censuses, which place her as a child in Antoliano Budiño's house. What is missing is her death, before April 1948, which would give her exact age and date of birth. She is not in FamilySearch's «Argentina, Cemetery Records», where a search has already been made.", "padre": "antoliano_budino", "madre": "teresa_alvarez", "conyuge": "ramon_rivas", "unionLibre": true, "otrasParejas": [], "hijos": ["marcos_ramon_rivas"], "hermanos": ["ireneo_budino", "dermilio_budino", "fernando_budino", "anita_budino", "laureano_budino", "micaela_budino"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "evergisto_rivas": {"id": "evergisto_rivas", "nombre": "Evergisto Rivas", "legal": "«Evargisto» in the 1887 census; «Evergisto» in his son's death record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["rivas"], "resumen": "Gonzalo's great-great-grandfather and the first Rivas in this genealogy with a name of his own. He was born in CÓRDOBA about 1853 and brought his family to Santa Fe around 1884. In the 1887 census he is head of household at HELVECIA, married to Rita Álvarez, and the dependency column reads PATRÓN — an employer. Two years later his son Ramón was born nearby, by then in San Justo.", "datos": [["Confirmed by record", "YES, and by two sources that do not know of each other: his son Ramón's death record (San Justo, 1971, act 84) names him, and the 1887 provincial census has him with his whole household"], ["Birth", "1861, at «VILLA DE SAN JUAN» in CÓRDOBA. His military enrolment card says so: class of 1861. It fits his marriage record, where in April 1882 he declares «twenty and [ink blot] years» — twenty-one. The 1887 census gives him thirty-four, which would mean 1853, and it is the only one of the three sources that says so"], ["Where he was born", "«Villa de San Juan», province of CÓRDOBA. The enrolment form follows the pattern «born at [village] of [province]», the same as on his son's card: «born at Cayastacito of Santa Fe». The village name is worth checking against a Córdoba gazetteer"], ["Enrolment number", "169, military district 38, series E X 333, section I 4222"], ["Where they came from", "he and his wife were born in CÓRDOBA, according to the 1887 census. When they crossed to Santa Fe is not known: by April 1882 both were already living in the Colonia Cayastacito, where they married"], ["Where he lived", "HELVECIA, department of San José, RURAL population, book 9, line 7 of the 1887 roll. Helvecia is on the Paraná just south of Cayastá"], ["Standing", "HEAD of household and, in the dependency column, PATRÓN — that is, he gave work rather than took it. His son Ramón would be a HACENDADO"], ["Sabía leer y escribir", "NO, neither he nor his wife. The 1887 census asks it in two separate columns and both say «no» for both of them"], ["Spouse", "RITA ÁLVAREZ, whom he married on 27 April 1882 in the church at Emilia. The 1887 census credits them with seven years of marriage, which would give 1880; the record wins"], ["Known children", "at least eleven. In the 1887 census are MARGARITA (about 1882), DESIDERIA (1884) and EVERGISTO (1885). RAMÓN was born on 25 January 1888, after the census. The rest come from the FamilySearch collaborative tree and have profiles of their own"], ["Careful with the name", "the census writes EVARGISTO and his son's death record EVERGISTO. Neither is «Evaristo», which is what one would expect and what will make an index search fail"], ["Death", "not located"]], "vida": "b.1861", "lug": "", "mapa": null, "sinacta": null, "padre": "domingo_rivas", "madre": "ana_navarro", "conyuge": "rita_alvarez", "unionLibre": false, "otrasParejas": [], "hijos": ["margarita_rivas_h", "desideria_rivas", "evergisto_rivas_h", "cipriano_rivas", "manuel_rivas_h", "serapio_rivas", "zeferino_rivas", "francisco_alejandro_rivas", "juana_rita_rivas", "felipe_rivas", "ramon_rivas"], "hermanos": ["pascacio_rivas", "domingo_rivas_h", "paulina_rivas", "crescencia_rivas", "petrona_rivas"], "actas": [{"titulo": "Military enrolment card", "tipo": "C", "tipoNombre": "Certificate", "fecha": "clase de 1861", "lugar": "«Villa de San Juan», provincia de Córdoba, Argentina", "ref": "matrícula 169 · serie E X 333 · sección I 4222", "fuente": [["Archive", "Archivo General del Ejército (Argentina)"], ["Cómo se encontró", "hallado por Gonzalo el 3 de septiembre de 2026"]], "literal": "", "traduccion": "Class of 1861.\n\nRIVAS, EVERGISTO, son of DOMINGO and of ANITA NAVARRO.\nBorn at VILLA DE SAN JUAN, of CÓRDOBA.\nIII Military Region · Military District No. 38.\nEnrolment office of M.D. No. 38 · Enrolment No. 169.\nAddress: blank. Series E X 333 · Section I 4222.", "notas": ["This is the first document to give a VILLAGE in Córdoba, and not just the province. Until now all that was known was that he and his wife were born there.", "«Class of 1861» is the year of birth for conscription purposes, and it fits his marriage record: in April 1882 he declares «twenty and [ink blot] years», and twenty-one fits the blot. The 1887 census gives him thirty-four. Two sources against one.", "It confirms his parents' names, already given by the 1882 record: DOMINGO and ANITA NAVARRO. Here she is «Anita» and in the record «Ana».", "With the year and the village one can look for his baptism, from 1861, in that place's parish. That baptism would give the full filiation of Domingo and Anita.", "His son Evergisto has an identical card, from the class of 1892, and there the village is Cayastacito. Father and son, same name, same military district 38."], "imgs": [{"u": "../actas/1861%20-%20Evergisto%20Rivas%2C%20enrolamiento/1861%20C%20Ficha%20de%20enrolamiento%20militar%20-%20Evergisto%20Rivas.jpg", "t": "Ficha de enrolamiento militar - Evergisto Rivas"}], "zooms": [{"u": "../actas/1861%20-%20Evergisto%20Rivas%2C%20enrolamiento/1861%20C%20zoom%20-%20Villa%20de%20San%20Juan%20de%20Cordoba.jpg", "t": "Villa de San Juan de Cordoba"}]}, {"titulo": "The Rivas household at Helvecia, 1887 provincial census", "tipo": "C", "tipoNombre": "Certificate", "fecha": "1887", "lugar": "Helvecia, departamento de San José, Santa Fe, Argentina", "ref": "volume 3, book 9, lines 7 to 10 and the next", "fuente": [["Archive", "Archivo General de la Provincia de Santa Fe · CFI"], ["Colección", "Primer Censo Provincial de Santa Fe, 1887 — padrones con información nominativa, buscador público y gratuito"], ["Cómo se encontró", "reconstruido por números de ficha correlativos: en este censo el índice sigue el orden de las líneas del padrón, así que pidiendo las fichas contiguas sale el hogar entero"], ["Enlace", "santafe.gov.ar/censo1887 — fichas 73497 a 73501 (Rivas) y 73360 a 73367 (Budiño)"], ["Warning", "la profesión y la religión salen «bloqueado» sin cuenta; el resto de los campos es público"]], "literal": "", "traduccion": "The roll's records, one per person, in the order in which they are written:\n\n· line 7 · RIVAS EVARGISTO, male, 34, HEAD, married, Argentine, born in Córdoba. Dependency: PATRÓN (employer).\n· line 8 · ÁLVARES RITA, female, 25, WIFE, married, Argentine. Children borne: 3. Years married: 7.\n· line 9 · RIVAS MARGARITA, female, 5, daughter, born in Córdoba.\n· line 10 · RIVAS DESIDERIA, female, 3, daughter, born in Córdoba.\n· line 1 of the next book · RIVAS EVARGISTO, male, 2, son, born in SANTA FE.\n\nPopulation: RURAL.", "notas": ["ESTE HOGAR SE ENCONTRÓ PORQUE LA DEFUNCIÓN DE 1971 DIO LOS DOS NOMBRES. Sin «Evergisto Rivas y Rita Álvarez» no había manera de distinguirlo entre los sesenta y ocho Rivas de la provincia. Con los dos nombres juntos, y encima como jefe y esposa en líneas consecutivas, no hay duda posible.", "La cédula pone CÓRDOBA como lugar de nacimiento de Margarita (5) y Desideria (3), y SANTA FE para Evargisto hijo (2). Con el acta de matrimonio de 1882 delante, eso no cuadra: en abril de ese año los padres ya vivían en Cayastacito. Lo más probable es que el empadronador arrastrara las comillas del renglón de los padres, que sí eran cordobeses.", "«3 HIJOS, 7 AÑOS DE MATRIMONIO» CUADRA EXACTAMENTE con los tres niños listados, y sitúa la boda hacia 1880. Ramón, el bisabuelo de Gonzalo, es el cuarto y nació año y medio después de este censo.", "Y RESUELVE LA RAREZA QUE HABÍA QUEDADO PENDIENTE. Se había medido que en 1887 no había NI UN SOLO Rivas en el departamento de San Justo, sobre 1.655 personas indexadas, y sin embargo Ramón nació allí en enero de 1889. La respuesta es que en 1887 la familia estaba en HELVECIA, en el departamento de al lado. Se movieron entre una fecha y otra.", "NI ÉL NI SU MUJER SABÍAN LEER NI ESCRIBIR, y el censo lo pregunta en dos casillas separadas. En el conjunto de la provincia, 87.042 personas no sabían escribir y 62.608 sí.", "CUÁNTO PESABAN LOS DOS HOGARES EN EL PUEBLO, PORQUE LA PREGUNTA VALE LA PENA. Helvecia tenía 2.439 censados en 1887 —el décimo distrito más poblado de la provincia—, y entre las dos casas, Rivas y Budiño, suman TRECE personas: el 0,5%, una de cada ciento noventa. No eran el pueblo, eran dos casas de un pueblo mediano.", "Y SER DE CÓRDOBA ALLÍ NO ERA RARO: TAMBIÉN SE MIDIÓ. Sobre una muestra de cincuenta fichas correlativas de ese mismo tramo del padrón, OCHO habían nacido en Córdoba: el 16%. En el conjunto de la provincia los nacidos en Córdoba son 9.467 sobre 156.502 indexados, un 6%. Helvecia tenía casi el triple de cordobeses que la media, o sea que era un destino de esa migración. Que las dos familias vinieran de allí no es una señal de que se conocieran: es la demografía del pueblo.", "LOS BUDIÑO ESTABAN EN EL MISMO PUEBLO Y VENÍAN DEL MISMO SITIO. Antoliano Budiño —el otro bisabuelo, el padre de Rosa— es la ficha 73360 de este mismo censo, y Evergisto Rivas la 73497: el mismo distrito de Helvecia, a menos de ciento cuarenta líneas de padrón. Y las dos familias son de CÓRDOBA. Veintidós años antes de que naciera Ramón Marcos, sus dos ramas paternas vivían en el mismo pueblo del Paraná."], "imgs": [{"u": "../actas/1861%20-%20Evergisto%20Rivas%2C%20enrolamiento/1861%20C%20Ficha%20de%20enrolamiento%20militar%20-%20Evergisto%20Rivas.jpg", "t": "Ficha de enrolamiento militar - Evergisto Rivas"}], "zooms": [{"u": "../actas/1861%20-%20Evergisto%20Rivas%2C%20enrolamiento/1861%20C%20zoom%20-%20Villa%20de%20San%20Juan%20de%20Cordoba.jpg", "t": "Villa de San Juan de Cordoba"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "27 de abril de 1882", "lugar": "Iglesia de Emilia, departamento La Capital, Santa Fe, Argentina", "ref": "acta 23, folio 149", "fuente": [["Archive", "Arzobispado de Santa Fe — parroquia de Nuestra Señora de la Purificación, Emilia"], ["Colección", "«Argentina, Santa Fe, registros parroquiales, 1634-2003»"], ["Cómo se encontró", "FamilySearch — hallado por Gonzalo el 3 de septiembre de 2026"]], "literal": "", "traduccion": "Today, the twenty-seventh day of April eighteen hundred and eighty-two, the marriage which EBERGITO RIVAS, legitimate son of the late DOMINGO and ANA NAVARRO, unmarried, aged twenty-[ink blot], Argentine and resident of the Colonia Cayastacito, and RITA ÁLVAREZ, legitimate daughter of DANIEL and the late ANACLETA ACOSTA, unmarried, aged twenty, Argentine and resident of Cayastacito, intended to contract having been proclaimed on three feast days;\n\nno impediment having arisen, and they being instructed in what Holy Mother the Roman Catholic and Apostolic Church commands, I the undersigned solemnly married the said couple in the Church of Emilia, having heard their mutual and free consent, witnessed by SANTIAGO LAZARINO and his wife. They were then veiled and took communion at holy Mass, having first confessed. To which I attest.", "notas": ["The four names in the parents' line — Domingo Rivas, Ana Navarro, Daniel Álvarez and Anacleta Acosta — are four people who did not exist in this tree until now. Two of them were already dead in 1882.", "It had been written here that Evergisto and Rita married in Córdoba, inferred from both being born there and from their two eldest daughters appearing as from Córdoba in the 1887 census. The record says otherwise: they married in Santa Fe and by April 1882 both were living in the Colonia Cayastacito.", "It remains to be explained why the 1887 census gives Córdoba as the birthplace of Margarita and Desideria, born about 1882 and 1884. Most likely the enumerator carried down the ditto marks from the parents' line, and the parents were indeed from Córdoba. The schedule is full of «ídem».", "His age has an ink blot over it: it reads «aged twenty and ___». The 1887 census gives him thirty-four, which would make him twenty-nine here. That fits.", "SANTIAGO LAZARINO, the witness, turns up again seven years later: he and Angelita Lazzarini are the godparents at Ramón's baptism, in the same church at Emilia."], "imgs": [{"u": "../actas/1882%20-%20Matrimonio%20de%20Evergisto%20Rivas%20y%20Rita%20Alvarez/1882-04-27%20M%20Acta%20de%20matrimonio%20-%20Iglesia%20de%20Emilia%20acta%2023.jpg", "t": "Acta de matrimonio - Iglesia de Emilia acta 23"}], "zooms": [{"u": "../actas/1882%20-%20Matrimonio%20de%20Evergisto%20Rivas%20y%20Rita%20Alvarez/1882-04-27%20M%20Acta%20de%20matrimonio%20-%20Iglesia%20de%20Emilia%20acta%2023%20%E2%80%94%20zoom.jpg", "t": "Acta de matrimonio - Iglesia de Emilia acta 23 — zoom"}]}], "nActas": 2, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "rita_alvarez": {"id": "rita_alvarez", "nombre": "Rita Álvarez", "legal": "«Alvares Rita» in the 1887 census", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["rivas"], "resumen": "Gonzalo's great-great-grandmother. In the 1887 census she is twenty-five, wife of Evergisto Rivas, seven years married with three children. She was born in Córdoba and crossed to Santa Fe with him.", "datos": [["Confirmed by record", "YES: her son Ramón's death record (San Justo, 1971) names her, and she appears as WIFE in the 1887 census"], ["Birth", "about 1862 — twenty-five in the 1887 census"], ["Marriage", "27 April 1882, church at Emilia, to EVERGISTO RIVAS. She was twenty and living in the Colonia Cayastacito"], ["Children", "THREE in 1887 — Margarita, Desideria and Evergisto — and RAMÓN in January 1889"], ["Where he lived", "HELVECIA, department of San José, Santa Fe, in 1887"], ["Death", "not located"]], "vida": "b.c.1862", "lug": "", "mapa": null, "sinacta": "Everything known about her fits in two documents and neither is hers: line 8 of the 1887 roll, where she appears as a wife with her three children and her seven years of marriage, and her son Ramón's death record eighty-four years later, where someone names her from memory. Her own birth would be in CÓRDOBA, about 1862, and that is the next thread in this branch.", "padre": "daniel_alvarez", "madre": "anacleta_acosta", "conyuge": "evergisto_rivas", "unionLibre": false, "otrasParejas": [], "hijos": ["margarita_rivas_h", "desideria_rivas", "evergisto_rivas_h", "cipriano_rivas", "manuel_rivas_h", "serapio_rivas", "zeferino_rivas", "francisco_alejandro_rivas", "juana_rita_rivas", "felipe_rivas", "ramon_rivas"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "27 de abril de 1882", "lugar": "Iglesia de Emilia, departamento La Capital, Santa Fe, Argentina", "ref": "acta 23, folio 149", "fuente": [["Archive", "Arzobispado de Santa Fe — parroquia de Nuestra Señora de la Purificación, Emilia"], ["Colección", "«Argentina, Santa Fe, registros parroquiales, 1634-2003»"], ["Cómo se encontró", "FamilySearch — hallado por Gonzalo el 3 de septiembre de 2026"]], "literal": "", "traduccion": "Today, the twenty-seventh day of April eighteen hundred and eighty-two, the marriage which EBERGITO RIVAS, legitimate son of the late DOMINGO and ANA NAVARRO, unmarried, aged twenty-[ink blot], Argentine and resident of the Colonia Cayastacito, and RITA ÁLVAREZ, legitimate daughter of DANIEL and the late ANACLETA ACOSTA, unmarried, aged twenty, Argentine and resident of Cayastacito, intended to contract having been proclaimed on three feast days;\n\nno impediment having arisen, and they being instructed in what Holy Mother the Roman Catholic and Apostolic Church commands, I the undersigned solemnly married the said couple in the Church of Emilia, having heard their mutual and free consent, witnessed by SANTIAGO LAZARINO and his wife. They were then veiled and took communion at holy Mass, having first confessed. To which I attest.", "notas": ["The four names in the parents' line — Domingo Rivas, Ana Navarro, Daniel Álvarez and Anacleta Acosta — are four people who did not exist in this tree until now. Two of them were already dead in 1882.", "It had been written here that Evergisto and Rita married in Córdoba, inferred from both being born there and from their two eldest daughters appearing as from Córdoba in the 1887 census. The record says otherwise: they married in Santa Fe and by April 1882 both were living in the Colonia Cayastacito.", "It remains to be explained why the 1887 census gives Córdoba as the birthplace of Margarita and Desideria, born about 1882 and 1884. Most likely the enumerator carried down the ditto marks from the parents' line, and the parents were indeed from Córdoba. The schedule is full of «ídem».", "His age has an ink blot over it: it reads «aged twenty and ___». The 1887 census gives him thirty-four, which would make him twenty-nine here. That fits.", "SANTIAGO LAZARINO, the witness, turns up again seven years later: he and Angelita Lazzarini are the godparents at Ramón's baptism, in the same church at Emilia."], "imgs": [{"u": "../actas/1882%20-%20Matrimonio%20de%20Evergisto%20Rivas%20y%20Rita%20Alvarez/1882-04-27%20M%20Acta%20de%20matrimonio%20-%20Iglesia%20de%20Emilia%20acta%2023.jpg", "t": "Acta de matrimonio - Iglesia de Emilia acta 23"}], "zooms": [{"u": "../actas/1882%20-%20Matrimonio%20de%20Evergisto%20Rivas%20y%20Rita%20Alvarez/1882-04-27%20M%20Acta%20de%20matrimonio%20-%20Iglesia%20de%20Emilia%20acta%2023%20%E2%80%94%20zoom.jpg", "t": "Acta de matrimonio - Iglesia de Emilia acta 23 — zoom"}]}], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "antoliano_budino": {"id": "antoliano_budino", "nombre": "Antoliano Budiño", "legal": "«Budino Antoliano» in both censuses", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["rivas"], "resumen": "Gonzalo's great-great-grandfather and the father of Rosa Budiño. In 1887 he is head of a household at HELVECIA, newly married to Teresa Álvarez; by 1895 the whole house is in the department of LA CAPITAL and he is recorded as an ESTANCIERO owning real property. His surname is Galician and his family arrived by way of Córdoba.", "datos": [["Confirmed by record", "YES, and his is the name that settles his daughter's identity: Ramón Marcos's birth record (Cayastacito, 1909) states that the child is the grandson, on the maternal side, of ANTOLIANO BUDIÑO and TERESA ÁLVAREZ. The two of them are together in the 1887 census"], ["Birth", "about 1861 in SANTA FE. His marriage record gives him TWENTY-SIX in May 1887 and the 1895 national census thirty-five: both point to 1860-61. The 1887 provincial census gives him thirty-three, which fits neither of the others"], ["Spouse", "TERESA ÁLVAREZ, whom he married on 21 MAY 1887 in the chapel of the Colonia Helvecia, act 172"], ["And before her, another wife", "he was a WIDOWER when he married Teresa: the record calls him «widower of the late ANASTASIA JUÁREZ, Argentine». She is a whole woman nobody knew about, and she has a profile of her own"], ["His surname, corrected", "the 1887 record writes it BUDIGÑO, and in the margin, in different ink, the diocesan Curia itself corrects it: «this name is rectified: Antulian Budigño to ANTOLIANO BUDIÑO». Worth trying both spellings when searching"], ["Known children", "IRINEO (about 1888) · DELMIRO (about 1890) · FERNANDO (about 1893) · and ROSA, one year old in May 1895, Gonzalo's great-grandmother"], ["Where he lived", "HELVECIA, department of San José, in 1887 · department of LA CAPITAL in 1895. The schedule gives the department, not the district, and La Capital was large back then: it included CAYASTACITO, EMILIA and other country villages besides the city"], ["Cayastacito and La Capital", "CAYASTACITO WAS INSIDE THE DEPARTMENT OF LA CAPITAL in 1887 — the provincial census records it there, with 661 inhabitants — and by 1909 it appears in that of SAN JUSTO: the boundaries moved in between. So this family may have been at or near Cayastacito in 1895, which is where their grandson was born fourteen years later"], ["Trade", "ESTANCIERO (rancher), and owning real property, according to the 1895 national census"], ["How many estancieros there were", "In the 1887 provincial census there are 2,460 estancieros in Santa Fe: the SEVENTH most common occupation, behind farmer, day labourer, farmhand, ploughman, shopkeeper and seamstress. In the dependency column there are 16,249 «patrón» against 16,500 «peón». And his 1887 house held TWO family units, his widowed mother and an uncle, under one roof"], ["His mother", "LUISA SOSA DE BUDIÑO, a widow born in Córdoba, who lived with him in both censuses"], ["Sabía leer y escribir", "NO, and in 1895 he still could not. Nor his wife, nor his mother, nor his uncle Pedro Sosa. Of the whole 1887 household, the only one who could was MANUEL BUDIÑO, aged thirty-four"], ["Standing", "en 1887 la casilla de dependencia dice PATRÓN para toda la casa — la misma que el hogar Rivas del mismo distrito"], ["Death", "not located"]], "vida": "b.c.1861", "lug": "SANTA FE", "mapa": null, "sinacta": null, "padre": "francisco_budino", "madre": "luisa_sosa", "conyuge": "teresa_alvarez", "unionLibre": false, "otrasParejas": [["anastasia_juarez", "Earlier married"]], "hijos": ["rosa_budino", "ireneo_budino", "dermilio_budino", "fernando_budino", "anita_budino", "laureano_budino", "micaela_budino"], "hermanos": [], "actas": [{"titulo": "The Budiño household at Helvecia, 1887 provincial census", "tipo": "C", "tipoNombre": "Certificate", "fecha": "1887", "lugar": "Helvecia, departamento de San José, Santa Fe, Argentina", "ref": "book 8, line 10 onwards", "fuente": [["Archive", "Archivo General de la Provincia de Santa Fe · CFI"], ["Colección", "Primer Censo Provincial de Santa Fe, 1887 — padrones con información nominativa, buscador público y gratuito"], ["Cómo se encontró", "reconstruido por números de ficha correlativos: en este censo el índice sigue el orden de las líneas del padrón, así que pidiendo las fichas contiguas sale el hogar entero"], ["Enlace", "santafe.gov.ar/censo1887 — fichas 73497 a 73501 (Rivas) y 73360 a 73367 (Budiño)"], ["Warning", "la profesión y la religión salen «bloqueado» sin cuenta; el resto de los campos es público"]], "literal": "", "traduccion": "The roll's records, in the order in which they are written:\n\n· BUDINO ANTOLIANO, male, 33, HEAD, married, Argentine.\n· ÁLVARES TERESA, female, 18, WIFE, married, Argentine. Children borne: 0. Years married: 1.\n· SOSA LUISA DE BUDINO, female, 60, MOTHER, widow, born in CÓRDOBA. Children borne: 4. Years married: 30.\n· SOSA PEDRO, male, 60, UNCLE, widower.\n· BUDINO MANUEL, male, 34, head (of another unit in the same house), married.\n· BUDINO ROSARIO, male, 10, son · BUDINO JUANA, female, 6, daughter.\n· BUDINO ANASTACIO, male, 20, NEPHEW, single.", "notas": ["THIS RECORD SETTLES A READING PROBLEM THAT HAD BEEN CARRIED FORWARD. In Ramón Marcos's birth record, the maternal grandmother's surname is written in a hand that read as «Leiva» or «Deira». The 1887 census registers her explicitly as Antoliano's WIFE and writes it ÁLVARES TERESA, and the 1895 national census repeats it. It is Álvarez, and my first reading was wrong.", "ONE YEAR MARRIED AND NO CHILDREN IN 1887. They married in 1886, and that fits the four children of the 1895 census: the eldest, Irineo, was seven there, so born about 1888.", "LUISA SOSA DE BUDIÑO, the mother, at SIXTY, with FOUR children and THIRTY years of marriage, is the oldest person in this branch: born about 1827 in CÓRDOBA and married about 1857. With her the Galician surname enters the tree by way of Córdoba, not directly from Galicia."], "imgs": [{"u": "../actas/1895%20-%20Hogar%20de%20Antoliano%20Budino%20en%20La%20Capital/1895%20C%20Censo%20Nacional%20-%20hogar%20de%20Antoliano%20Budino%2C%20La%20Capital.png", "t": "Censo Nacional - hogar de Antoliano Budino, La Capital"}], "zooms": []}, {"titulo": "Antoliano Budiño's household in the department of La Capital", "tipo": "C", "tipoNombre": "Certificate", "fecha": "May 1895", "lugar": "La Capital, Santa Fe, Argentina", "ref": "census schedule, lines 7 to 15", "fuente": [["Archive", "Archivo General de la Nación (Argentina)"], ["Colección", "Segundo Censo Nacional de la República Argentina, 1895"], ["Cómo se encontró", "FamilySearch, grupo de imágenes 004159962, imagen 236 de 512 — hallado por Gonzalo el 31 de agosto de 2026"], ["State of the evidence", "IDENTIFICADO EL 3 DE SEPTIEMBRE DE 2026, cuando la partida de nacimiento de Ramón Marcos dio el nombre de los padres de Rosa"]], "literal": "", "traduccion": "A Budiño household in the department of La Capital, lines 7 to 15 of the schedule. The columns are surname and forename, sex, years completed, marital status, nation, province if Argentine, occupation and whether they can read and write.\n\n· BUDIÑO ANTOLIANO, male, 35, married, Argentine, born at SANTA FE, by trade an ESTANCIERO (rancher), owns real property.\n· BUDIÑO LUISA, female, 65, WIDOW, Argentine, born at CÓRDOBA.\n· ÁLVAREZ TERESA, female, 24, married, Argentine, Santa Fe.\n· BUDIÑO JUANA, 17, single, Argentine.\n· BUDIÑO ROSARIO, 20, single, Argentine, DAY LABOURER.\n· BUDIÑO IRINEO, 7 · BUDIÑO DELMIRO, 5 · BUDIÑO FERNANDO, 2 · BUDIÑO ROSA, 1.", "notas": ["THE ONE-YEAR-OLD ROSA OF THIS SCHEDULE IS GONZALO'S GREAT-GRANDMOTHER. For a few days there were two candidates and neither was proven. It was closed by her son's birth record, which names her parents: ANTOLIANO BUDIÑO and TERESA ÁLVAREZ. They are the couple on lines 7 and 9 of this very schedule.", "THE AGE DOES NOT QUITE MATCH AND IT IS ONLY FAIR TO SAY SO. Here she is ONE YEAR OLD in May 1895, so born about 1894; in December 1909 she declares SEVENTEEN, so born about 1892. Two years' difference. In these rolls the ages of small children are notoriously loose, and a sixteen-year-old unmarried mother declaring seventeen would surprise nobody either. The identification does not rest on the age but on the parents' names, which are unmistakable.", "THE SCHEDULE GIVES THE DEPARTMENT, NOT THE DISTRICT: «La Capital». And in those years La Capital included CAYASTACITO — 661 inhabitants in the 1887 census — which only later passed to the department of San Justo. So this household may have been at or near Cayastacito rather than in the city.", "The same household appears eight years earlier at HELVECIA, in the 1887 provincial census: Antoliano aged 33, Teresa aged 18 newly married, the mother Luisa born in Córdoba, Rosario and Juana. The family moved from Helvecia to the capital between 1887 and 1895."], "imgs": [{"u": "../actas/1895%20-%20Hogar%20de%20Antoliano%20Budino%20en%20La%20Capital/1895%20C%20Censo%20Nacional%20-%20hogar%20de%20Antoliano%20Budino%2C%20La%20Capital.png", "t": "Censo Nacional - hogar de Antoliano Budino, La Capital"}], "zooms": []}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "21 de mayo de 1887", "lugar": "Colonia Helvecia, departamento San José, Santa Fe, Argentina", "ref": "acta 172, folio 145", "fuente": [["Archive", "Arzobispado de Santa Fe — parroquia de Nuestra Señora del Carmen, Helvecia"], ["Colección", "«Argentina, Santa Fe, registros parroquiales, 1634-2003»"], ["Referencia", "ark:/61903/1:1:QPWY-F8T7"], ["Cómo se encontró", "FamilySearch — hallado por Gonzalo el 3 de septiembre de 2026, y esta vez SÍ estaba indexado, así que salió buscando por nombre"]], "literal": "", "traduccion": "Act number 172. In the margin: «Antulian Budigño, with Teresa Álvarez, Argentines».\n\nColonia Helvecia, 21 May 1887.\n\nIn the temporary Chapel of the Colonia Helvecia, on the TWENTY-FIRST day of MAY in the year eighteen hundred and eighty-seven, the legal enquiry having been made, the three conciliar banns having been read and the other requirements of law fulfilled, no canonical impediment having arisen, I the undersigned, priest in charge of the cura animarum of the Colonias CAYASTÁ and HELVECIA, married according to the Rite of Our Holy Mother the Church:\n\n· ANTULIANO BUDIGÑO, aged TWENTY-SIX, WIDOWER OF THE LATE ANASTASIA JUÁREZ, Argentine;\n· to TERESA ÁLVAREZ, UNMARRIED, aged EIGHTEEN, LEGITIMATE DAUGHTER OF THE LATE YSIDRO ÁLVAREZ AND OF JUANA LEYVA, BOTH FROM CÓRDOBA;\n\nboth natives of Santa Fe and residents here.\n\nWitnesses to the marriage were MANUEL BUDIGÑO and Doña MICAELA PÉREZ, to which I attest. — Fray Gerónimo Marchetti.\n\n════════ IN THE MARGIN, IN DIFFERENT INK ════════\n\n«By order of the Ecclesiastical Curia and L. I-107, this name is rectified: Antulian Budigño to ANTOLIANO BUDIÑO. Be it recorded.» — with the seal of the parish of Nuestra Señora del Carmen, Helvecia, Archbishopric of Santa Fe.", "notas": ["THE DATE IS 21 MAY 1887, not 1886. Here 1886 had been inferred from the census, which credited them with «one year of marriage». The record wins: they married in May of 1887 itself, and the enumerator rounded a few weeks up to a year.", "TERESA'S PARENTS, WHICH IS WHAT WE WERE AFTER: YSIDRO ÁLVAREZ, already dead, and JUANA LEYVA, both FROM CÓRDOBA. With them the tree gains a generation on this side and a third Córdoba origin, after the Rivas and the Budiño.", "ANTOLIANO WAS A WIDOWER, which nobody knew. His first wife was ANASTASIA JUÁREZ, Argentine, dead before May 1887. She has a profile of her own, with the little there is.", "HIS PARENTS ARE NOT NAMED. That is the record's disappointment: because he was a widower rather than a bachelor, the priest did not write down his filiation. The Budiño grandfather — Luisa Sosa's husband — is still without a name.", "THE SURNAME WAS WRITTEN «BUDIGÑO», AND THE CURIA ITSELF CORRECTED IT. In the margin, in different ink: «this name is rectified: Antulian Budigño to Antoliano Budiño». A warning for any search: try BUDIGÑO as well as Budiño and Budino.", "THE AGE DOES NOT MATCH THE CENSUS, AND THE RECORD WINS. Here he declares TWENTY-SIX in May 1887; the provincial census of the same year gives him THIRTY-THREE. But the 1895 national census gives him thirty-five, which comes of being born about 1860. Two sources against one: he was born about 1861, not about 1854.", "THE WITNESS IS MANUEL BUDIGÑO, who in that same year's census heads the other family unit in the same house. That he signs as a witness confirms he is close family, almost certainly a brother.", "A USEFUL POINT FOR FURTHER SEARCHING: a single priest served the colonies of CAYASTÁ and HELVECIA, so this register covers both villages. On the facing page there is a marriage celebrated at Cayastá two months earlier."], "imgs": [{"u": "../actas/1887%20-%20Matrimonio%20de%20Antoliano%20Budino%20y%20Teresa%20Alvarez/1887-05-21%20M%20Acta%20de%20matrimonio%20-%20Helvecia%20acta%20172.jpg", "t": "Acta de matrimonio - Helvecia acta 172"}], "zooms": [{"u": "../actas/1887%20-%20Matrimonio%20de%20Antoliano%20Budino%20y%20Teresa%20Alvarez/1887-05-21%20M%20zoom%20-%20el%20acta%20172%20y%20la%20rectificacion%20del%20nombre%20al%20margen.jpg", "t": "El acta 172 y la rectificacion del nombre al margen"}]}], "nActas": 2, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "pascacio_rivas": {"id": "pascacio_rivas", "nombre": "Pascacio Casiani Rivas", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["rivas"], "resumen": "Evergisto's brother. In the 1887 census he lives at Helvecia, aged thirty and born in Córdoba, just like UANA LEYVA, also from Córdoba, who outlived him"], ["Known daughter", "TERESA ÁLVAREZ, born in the province of SANTA FE about 1869 — so the family had already crossed from Córdoba to Santa Fe by then"], ["Death", "not located — before May 1887"]], "vida": "", "lug": "", "mapa": null, "sinacta": "He exists only in one line of his daughter's marriage record, and that line gives three things: that he was called Ysidro, that he was from CÓRDOBA, and that he had already died by May 1887. His daughter was born in Santa Fe about 1869, so he and Juana Leyva crossed from one province to the other before then. The next step would be their marriage, in Córdoba, about 1860.", "padre": "zacarias_alvarez", "madre": "tomasa_molla", "conyuge": "juana_leyva", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_alvarez"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "juana_leyva": {"id": "juana_leyva", "nombre": "Juana Leyva", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["rivas"], "resumen": "Mother of Teresa Álvarez. From Córdoba. In May 1887 she was still alive: her daughter's marriage record marks only the father as deceased.", "datos": [["Confirmed by record", "YES: her daughter's marriage record (Helvecia, 21 May 1887, act 172), which names her beside her husband"], ["Where they were from", "CÓRDOBA. The record says «cordoveses» of her and her husband"], ["Spouse", "YSIDRO ÁLVAREZ, already dead by May 1887"], ["Known daughter", "TERESA ÁLVAREZ, born in the province of Santa Fe about 1869"], ["Still alive in", "May 1887 — the record does not mark her as deceased, which it does do for her husband"], ["Death", "not located"]], "vida": "†>1887", "lug": "", "mapa": null, "sinacta": "Like her husband, she exists in a single line of their daughter's marriage record. That the record marks him «finado» and her not says she was still alive in May 1887. LEYVA is a common surname in Córdoba.", "padre": "antonio_leyva", "madre": "leonarda_olivera", "conyuge": "ysidro_alvarez", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_alvarez"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "anastasia_juarez": {"id": "anastasia_juarez", "nombre": "Anastasia Juárez", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 7, "ramas": [], "resumen": "Antoliano Budiño's first wife, and a person entirely unknown until 3 September 2026. Argentine. She had died before May 1887, when he married Teresa Álvarez.", "datos": [["Confirmed by record", "YES: Antoliano's marriage to Teresa (Helvecia, 21 May 1887) describes him as «widower of the late ANASTASIA JUÁREZ, Argentine»"], ["What is known of her", "her name, her nationality, and that she had already died. Nothing else"], ["Whether she had children", "NOT RECORDED. In the 1887 household there are two Budiño children — Rosario, ten, and Juana, six — listed after Manuel Budiño, so they are probably his; but by age they could be from this first marriage. Unverified"], ["Death", "not located — before May 1887"]], "vida": "", "lug": "", "mapa": null, "sinacta": "She turned up in four words of someone else's record: «widower of the late Anastasia Juárez». She is not an ancestor of Gonzalo — the line comes through Teresa Álvarez — but she changes Antoliano's biography, which until now looked like a single marriage. What would find her: her own death record, before May 1887, and her marriage to Antoliano, before that.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_alvarez": {"id": "teresa_alvarez", "nombre": "Agustina Teresa Álvarez", "legal": "«Alvares Teresa» in the 1887 census; the hand is doubtful in the 1909 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["rivas"], "resumen": "Gonzalo's great-great-grandmother and the mother of Rosa Budiño. She was born in the province of Santa Fe about 1869 and married Antoliano Budiño about 1886, aged around seventeen. In 1887 the census finds her at Helvecia, one year married and with no children; by 1895 she was living in the department of La Capital with four, the youngest of whom is Rosa.", "datos": [["Confirmed by record", "YES, and by three: her grandson Ramón Marcos's birth record (1909) names her as his maternal grandmother, and the 1887 and 1895 censuses have her with her husband"], ["Birth", "27 August 1868, at SAN PEDRO. Her baptism record says so; it was found on 3 September 2026"], ["Marriage", "21 MAY 1887, in the temporary chapel of the Colonia HELVECIA, to ANTOLIANO BUDIÑO, who was a widower. She was EIGHTEEN and unmarried. Act 172, before Fray Gerónimo Marchetti"], ["Children", "IRINEO, DELMIRO, FERNANDO and ROSA — all four in the 1895 schedule"], ["Careful with the surname", "in the 1909 record her surname is written in a hand that looks like «Leiva». It is not: both censuses write it ÁLVARES / ÁLVAREZ, and the 1887 one identifies her as WIFE on the line following her husband's"], ["Death", "not located"]], "vida": "b.1868", "lug": "SAN PEDRO", "mapa": null, "sinacta": "There is no document of her own: she is in the 1887 census as an eighteen-year-old wife, in the 1895 census as the mother of four, and in her grandson's 1909 birth record as a name her daughter dictated from memory without being able to write it. Her birth, about 1869, and her 1886 marriage would be in the books of the San José department.", "padre": "ysidro_alvarez", "madre": "juana_leyva", "conyuge": "antoliano_budino", "unionLibre": false, "otrasParejas": [], "hijos": ["rosa_budino", "ireneo_budino", "dermilio_budino", "fernando_budino", "anita_budino", "laureano_budino", "micaela_budino"], "hermanos": [], "actas": [{"titulo": "Baptism record", "tipo": "N", "tipoNombre": "Birth", "fecha": "nació el 27 de agosto de 1868; óleo y crisma el 31 de octubre", "lugar": "Reducción de Cayastacito, Santa Fe, Argentina", "ref": "acta 467, folio 181", "fuente": [["Archive", "Arzobispado de Santa Fe — Reducción de Cayastacito"], ["Colección", "«Argentina, Santa Fe, registros parroquiales, 1634-2003»"], ["Cómo se encontró", "FamilySearch — hallado por Gonzalo el 3 de septiembre de 2026"]], "literal": "", "traduccion": "Act 467. In the margin: «Agustina Teresa Alvarez — Criolla».\n\nOn the thirty-first day of October eighteen hundred and sixty-eight, I the undersigned President of this Reducción de Cayastacito administered Oil and Chrism to AGUSTINA TERESA, born on the TWENTY-SEVENTH OF AUGUST, baptised privately by myself in case of necessity, BORN AT SAN PEDRO, legitimate daughter of YSIDRO ALVAREZ and JUANA LEYVA. Her godparents were Agustín Cáceres and Mercedes Junco, to which I attest. — Fray Bernardo Friggini.", "notas": ["She was born on 27 August 1868. The friar baptised her urgently himself — «in case of necessity» — and administered oil and chrism two months later, once the child was out of danger.", "Her full name is AGUSTINA TERESA. In her marriage record and in both censuses she appears only as Teresa.", "The register is that of the Reducción de Cayastacito. In 1868 Cayastacito was a Franciscan reduction: the entries on that same page carry «criollo», «criolla» or «indígena» in the margin. She is marked Criolla. Forty-one years later her grandson Ramón Marcos would be born in that village.", "It says she was born at SAN PEDRO. Her marriage record, from 1887, says her parents were from Córdoba, and the FamilySearch tree places Ysidro and Juana's wedding at San Pedro de Jujuy. The three do not fit together and it is unresolved."], "imgs": [{"u": "../actas/1868%20-%20Bautismo%20de%20Agustina%20Teresa%20Alvarez/1868-10-31%20N%20Partida%20de%20bautismo%20-%20Reduccion%20de%20Cayastacito%20acta%20467.jpg", "t": "Partida de bautismo - Reduccion de Cayastacito acta 467"}], "zooms": [{"u": "../actas/1868%20-%20Bautismo%20de%20Agustina%20Teresa%20Alvarez/1868-10-31%20N%20Partida%20de%20bautismo%20-%20Reduccion%20de%20Cayastacito%20acta%20467%20%E2%80%94%20zoom.jpg", "t": "Partida de bautismo - Reduccion de Cayastacito acta 467 — zoom"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "21 de mayo de 1887", "lugar": "Colonia Helvecia, departamento San José, Santa Fe, Argentina", "ref": "acta 172, folio 145", "fuente": [["Archive", "Arzobispado de Santa Fe — parroquia de Nuestra Señora del Carmen, Helvecia"], ["Colección", "«Argentina, Santa Fe, registros parroquiales, 1634-2003»"], ["Referencia", "ark:/61903/1:1:QPWY-F8T7"], ["Cómo se encontró", "FamilySearch — hallado por Gonzalo el 3 de septiembre de 2026, y esta vez SÍ estaba indexado, así que salió buscando por nombre"]], "literal": "", "traduccion": "Act number 172. In the margin: «Antulian Budigño, with Teresa Álvarez, Argentines».\n\nColonia Helvecia, 21 May 1887.\n\nIn the temporary Chapel of the Colonia Helvecia, on the TWENTY-FIRST day of MAY in the year eighteen hundred and eighty-seven, the legal enquiry having been made, the three conciliar banns having been read and the other requirements of law fulfilled, no canonical impediment having arisen, I the undersigned, priest in charge of the cura animarum of the Colonias CAYASTÁ and HELVECIA, married according to the Rite of Our Holy Mother the Church:\n\n· ANTULIANO BUDIGÑO, aged TWENTY-SIX, WIDOWER OF THE LATE ANASTASIA JUÁREZ, Argentine;\n· to TERESA ÁLVAREZ, UNMARRIED, aged EIGHTEEN, LEGITIMATE DAUGHTER OF THE LATE YSIDRO ÁLVAREZ AND OF JUANA LEYVA, BOTH FROM CÓRDOBA;\n\nboth natives of Santa Fe and residents here.\n\nWitnesses to the marriage were MANUEL BUDIGÑO and Doña MICAELA PÉREZ, to which I attest. — Fray Gerónimo Marchetti.\n\n════════ IN THE MARGIN, IN DIFFERENT INK ════════\n\n«By order of the Ecclesiastical Curia and L. I-107, this name is rectified: Antulian Budigño to ANTOLIANO BUDIÑO. Be it recorded.» — with the seal of the parish of Nuestra Señora del Carmen, Helvecia, Archbishopric of Santa Fe.", "notas": ["THE DATE IS 21 MAY 1887, not 1886. Here 1886 had been inferred from the census, which credited them with «one year of marriage». The record wins: they married in May of 1887 itself, and the enumerator rounded a few weeks up to a year.", "TERESA'S PARENTS, WHICH IS WHAT WE WERE AFTER: YSIDRO ÁLVAREZ, already dead, and JUANA LEYVA, both FROM CÓRDOBA. With them the tree gains a generation on this side and a third Córdoba origin, after the Rivas and the Budiño.", "ANTOLIANO WAS A WIDOWER, which nobody knew. His first wife was ANASTASIA JUÁREZ, Argentine, dead before May 1887. She has a profile of her own, with the little there is.", "HIS PARENTS ARE NOT NAMED. That is the record's disappointment: because he was a widower rather than a bachelor, the priest did not write down his filiation. The Budiño grandfather — Luisa Sosa's husband — is still without a name.", "THE SURNAME WAS WRITTEN «BUDIGÑO», AND THE CURIA ITSELF CORRECTED IT. In the margin, in different ink: «this name is rectified: Antulian Budigño to Antoliano Budiño». A warning for any search: try BUDIGÑO as well as Budiño and Budino.", "THE AGE DOES NOT MATCH THE CENSUS, AND THE RECORD WINS. Here he declares TWENTY-SIX in May 1887; the provincial census of the same year gives him THIRTY-THREE. But the 1895 national census gives him thirty-five, which comes of being born about 1860. Two sources against one: he was born about 1861, not about 1854.", "THE WITNESS IS MANUEL BUDIGÑO, who in that same year's census heads the other family unit in the same house. That he signs as a witness confirms he is close family, almost certainly a brother.", "A USEFUL POINT FOR FURTHER SEARCHING: a single priest served the colonies of CAYASTÁ and HELVECIA, so this register covers both villages. On the facing page there is a marriage celebrated at Cayastá two months earlier."], "imgs": [{"u": "../actas/1887%20-%20Matrimonio%20de%20Antoliano%20Budino%20y%20Teresa%20Alvarez/1887-05-21%20M%20Acta%20de%20matrimonio%20-%20Helvecia%20acta%20172.jpg", "t": "Acta de matrimonio - Helvecia acta 172"}], "zooms": [{"u": "../actas/1887%20-%20Matrimonio%20de%20Antoliano%20Budino%20y%20Teresa%20Alvarez/1887-05-21%20M%20zoom%20-%20el%20acta%20172%20y%20la%20rectificacion%20del%20nombre%20al%20margen.jpg", "t": "El acta 172 y la rectificacion del nombre al margen"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "luisa_sosa": {"id": "luisa_sosa", "nombre": "Luisa Sosa de Budiño", "legal": "«Sosa Luisa de Budino» in the 1887 census", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["rivas"], "resumen": "The oldest person in the Rivas-Budiño branch: born in CÓRDOBA about 1827. In 1887 she lives with her son Antoliano at Helvecia, a widow of sixty, with four children raised and thirty years of marriage behind her. The Galician surname Budiño enters this genealogy with her — and it enters by way of Córdoba.", "datos": [["Confirmed by record", "YES: 1887 provincial census, record 73362, where she appears as MOTHER in Antoliano's household; and the 1895 national census, where she is still with him in the department of La Capital"], ["Birth", "about 1827 in CÓRDOBA — sixty in 1887 and sixty-five in 1895"], ["Marriage", "about 1857: the census credits her with THIRTY YEARS OF MARRIAGE. Her husband, a Budiño whose name is unknown, had died before 1887"], ["Children", "FOUR, according to the census. ANTOLIANO is known and, probably, MANUEL, who lives in the same house aged thirty-four"], ["How the surname travelled", "BUDIÑO IS GALICIAN, from Pontevedra and Ourense, but the Budiños of Santa Fe are almost all born in CÓRDOBA or children of people from Córdoba. The route was Galicia → Córdoba → Santa Fe, and she is the Córdoba step"], ["Still alive in", "mayo de 1895 — el censo nacional la encuentra con sesenta y cinco años, viviendo en casa de su hijo Antoliano"], ["Death", "not located — later than May 1895, when she was still alive"]], "vida": "c.1827–>1895", "lug": "CÓRDOBA", "mapa": null, "sinacta": "She appears only in two censuses, and in both as the widowed mother living in her son's house. What those two lines give is more than it looks: born in Córdoba about 1827, married about 1857, four children, widowed before 1887. Her birth and her marriage would be in the parish books of CÓRDOBA — a whole province this genealogy has not yet touched.", "padre": null, "madre": null, "conyuge": "francisco_budino", "unionLibre": false, "otrasParejas": [], "hijos": ["antoliano_budino"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "cristina_romero": {"id": "cristina_romero", "nombre": "Cristina Romero", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": [], "resumen": "Ramón Rivas's wife. She had died before August 1971: his death record declares him a WIDOWER. She is not Ramón Marcos's mother.", "datos": [["Confirmed by record", "her husband's death record, San Justo, 1971, act 84: «That he was married to CRISTINA ROMERO»"], ["What is known of her", "her name and that she died before him. Nothing else"], ["Cuándo se casaron", "not located. Ramón Rivas had Ramón Marcos with Rosa Bernarda Budiño in 1909 without marrying her, so his marriage to Cristina Romero belongs to another part of his life"], ["Whether she had children", "not recorded. Ramón Rivas had children by several women, and the brother Gonzalo remembers could be from this marriage"], ["Death", "not located; before August 1971"]], "vida": "", "lug": "", "mapa": null, "sinacta": "She exists in five words of her husband's death record: «that he was married to Cristina Romero». What would take her further is their marriage, probably in the department of San Justo, which would give her age and her parents' names.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "ramon_rivas": {"id": "ramon_rivas", "nombre": "Ramón Rivas", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["rivas"], "resumen": "Gonzalo's paternal great-grandfather. For a long time he was only a name from family tradition, with no dates and no origin. He was born on 25 January 1888 and baptised in the church at Emilia; he was a son of Evergisto Rivas and Rita Álvarez, a family come from Córdoba who in 1887 were living at Helvecia. He was a hacendado all his life. He had Ramón Marcos with Rosa Bernarda Budiño at twenty-one, without marrying her, and acknowledged him formally thirty-three years later. He married Cristina Romero and outlived her. He died at San Justo on 24 August 1971.", "datos": [["Confirmed by record", "YES, and now by three: his son's marriage (Jobson, 1948, act 15), his son's death record (Santa Fe, 2002) and, since 3 September 2026, HIS OWN DEATH RECORD (San Justo, 1971, act 84)"], ["Birth", "25 January 1888. His baptism record says so, made in the church at Emilia. His death record, sixty years later, says 14 January 1889 and that he was born at San Justo"], ["Death", "24 AUGUST 1971, at ten in the morning, at SAN JUSTO, of illness, certified by Dr Edgardo Nelson García. Eighty-three years old, counting from his baptism"], ["Nationality", "ARGENTINE — not an immigrant, contrary to what might have been assumed"], ["Trade", "HACENDADO (landowner), and he remained one to the end: it is stated so in his son's 1948 record and again in his own death record of 1971, twenty-three years later"], ["Identity document", "L.E. 2,356,204"], ["Parents", "EVERGISTO RIVAS and RITA ÁLVAREZ, both born in CÓRDOBA. This is the whole line that was missing, and it was found afterwards in the 1887 census living at HELVECIA"], ["Spouse", "CRISTINA ROMERO. In 1971 he is recorded as a WIDOWER, so she died first. She
