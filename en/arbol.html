sa, y que era hijo de GIUSEPPE FAIENZA, contadino de Atessa y vivo entonces, y de la difunta MARIA STANISCIA. Como no llegaba a los veinticinco años, el Código Civil exigía el consentimiento de su padre, y el acta lo hace constar: «ha prestato il consenso il padre dello sposo». Ese trámite es, de paso, la prueba de que Giuseppe Faienza estaba vivo y localizable en Atessa en diciembre de 1892.\n\nY LO QUE TUMBA: la pista de PAGLIETA, definitivamente. Nicola no era de Paglieta ni de ningún otro sitio: era de Atessa, como su padre y como su mujer. Aquélla venía del mismo bloque familiar sin una sola cita que ya había errado antes, y con ésta van tres veces comprobadas.\n\nLO QUE FALTA: su propia partida de nacimiento, en los Nati de Atessa hacia 1869, y la de su hijo Domenico, que no está en Atessa 1899 —el índice del año se ha leído entero— y habrá que buscar en 1900.", "padre": "giuseppe_faienza", "madre": "maria_staniscia", "conyuge": "angela_pizzi", "hijos": ["domenico_faienza"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "29 de diciembre de 1892, 11:15", "lugar": "Atessa (Chieti)", "ref": "acta 101", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1892, atti di matrimonio"], ["Registro", "hash del contenedor: wWpoWmX — 138 páginas"], ["Página", "103 de 138"], ["Año manuscrito", "«mille ottocento novantadue» — coincide con el catálogo"], ["Registrar", "Francesco Falcucci, assessore municipale delegado por el sindaco «con atto del venticinque novembre milleottocentottantanove, debitamente approvato»"], ["Cómo se localizó", "el número de acta ya se sabía por la nota al margen del acta 65 de 1869. El índice alfabético va en las páginas 135 a 138 y el matrimonio más alto que indexa es el 104. La página 110 es la portada de la PARTE II, así que la parte I ocupa las páginas 1 a 109 a razón de una acta por imagen; un sondeo en la página 60 dio el acta 58, o sea acta = página − 2, y la 103 dio la 101 a la primera. Cuatro imágenes en total"]], "literal": "Numero 101 — Faienza Nicola / Angiolina Pizzi\n\nL'anno mille ottocento novantadue, addì ventinove di Dicembre, a ore\nantimeridiane undici e minuti quindici, nella Casa Comunale di Atessa, aperto al\npubblico. Avanti di me Francesco Falcucci Assessore Municipale delegato dal\nSindaco con atto del venticinque novembre milleottocentottantanove, debitamente\napprovato, Ufficiale dello Stato Civile, vestito in forma ufficiale, sono\npersonalmente comparsi:\n\n1. NICOLA FAIENZA, di anni ventitré, contadino, nato in Atessa, residente in\nAtessa, figlio di GIUSEPPE, contadino, residente in Atessa, e della fu MARIA\nSTANISCIA, residente in vita in Atessa;\n\n2. ANGIOLINA PIZZI, di anni ventitré, donna di casa, nata in Atessa, residente in\nAtessa, figlia del fu DOMENICO, residente in vita in Atessa, e di TERESA FLOCCO,\nresidente in Atessa…\n\n…A questo atto sono stati presenti: Luzio Iannone, di anni ventidue, scrivano, e\nEmidio Flocco, di anni cinquantasei, caffettiere, entrambi residenti in questo\nComune. Il documento presentato è il certificato delle pubblicazioni eseguite da\nme Uffiziale dello Stato Civile di Atessa, cioè la prima nel dì diciotto e la\nseconda nel dì venticinque volgente Dicembre. Al suddetto matrimonio ha prestato\nil consenso IL PADRE DELLO SPOSO, come risulta ed è spiegato dall'atto di\nrichiesta delle pubblicazioni. — (a) le parole interlineate «vita in» valgano per\nnon scritte. Letto il presente atto a tutti gl'intervenuti, gli sposi ed i\ntestimoni si sono meco sottoscritti.\n\nFaienza Nicola · Angiolina Pizzi · Luzio Iannone testimone · Emidio Flocco\ntestimone · L'Ufficiale dello Stato Civile, Francesco Falcucci", "traduccion": "In the year eighteen hundred and ninety-two, on the TWENTY-NINTH OF DECEMBER, at a QUARTER PAST ELEVEN in the morning, at the town hall of ATESSA, open to the public.\n\nBefore me, FRANCESCO FALCUCCI, municipal assessor delegated by the mayor by act of the twenty-fifth of November eighteen hundred and eighty-nine, duly approved, Registrar of the Civil Status, in official dress, there appeared in person:\n\n1st NICOLA FAIENZA, aged TWENTY-THREE, FARMHAND, BORN AT ATESSA, resident at Atessa, SON OF GIUSEPPE, farmhand, resident at Atessa, AND OF THE LATE MARIA STANISCIA, who in life resided at Atessa.\n\n2nd ANGIOLINA PIZZI, aged TWENTY-THREE, housewife, born at Atessa, resident at Atessa, DAUGHTER OF THE LATE DOMENICO, who in life resided at Atessa, AND OF TERESA FLOCCO, resident at Atessa.\n\nWho requested me to unite them in marriage. To that end they presented me with a single document; the articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code having been read to the spouses, and having asked the husband whether he wishes to take as his wife the ANGIOLINA PIZZI here present, and her whether she wishes to take as her husband the NICOLA FAIENZA here present, and each having answered in the affirmative, I pronounced in the name of the law that they are united in marriage.\n\nWitnesses: LUZIO IANNONE, aged twenty-two, CLERK, and EMIDIO FLOCCO, aged fifty-six, CAFÉ KEEPER, both resident in this comune.\n\nThe document presented is the certificate of the banns made by myself as Registrar of the Civil Status of Atessa, the first on the EIGHTEENTH and the second on the TWENTY-FIFTH of the current December.\n\nTo the said marriage consent was given by THE HUSBAND'S FATHER, as appears and is set out in the act requesting the banns.\n\n(a) The interlined words «vita in» are to be taken as not written.\n\nThe present record having been read to all present, the spouses and the witnesses signed it with me.", "notas": ["ERA EL CABO MÁS CORTO Y MÁS RENTABLE QUE HABÍA ABIERTO, Y HA PAGADO. De Nicola Faienza no se sabía nada en absoluto: ni la edad, ni el oficio, ni el pueblo, ni los padres. El acta da las cuatro cosas en un solo renglón.", "MATA LA PISTA DE PAGLIETA DEFINITIVAMENTE. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Ni el novio ni su padre eran de Paglieta. Aquel pueblo venía del bloque familiar sin fuentes, y con ésta van tres veces que ese bloque falla en una comprobación directa.", "AÑADE UNA GENERACIÓN DE FAIENZA: Giuseppe Faienza y Maria Staniscia, los padres del novio, que hasta hoy no existían en ningún papel. Él vivo en 1892, ella ya muerta.", "EL CONSENTIMIENTO PATERNO NO ES FÓRMULA. El Código Civil lo exigía a los varones menores de veinticinco años y Nicola tenía veintitrés, igual que le pasó a Francesco Salerno en Rende dos años después. Que conste por escrito es la prueba de que Giuseppe Faienza estaba vivo y a mano en diciembre de 1892.", "LOS DOS NOVIOS SABÍAN ESCRIBIR, y eso en estos registros es excepcional: la fórmula habitual de la época es «essendo i testimoni analfabeti». Aquí firman los cuatro. El padre de ella, Domenico Pizzi, también firmaba: lo hizo en 1869 al declarar el nacimiento de esta misma novia.", "CONFIRMA A LA NOVIA PUNTO POR PUNTO: veintitrés años (nació el 12 de febrero de 1869), hija del difunto Domenico (murió el 28 de septiembre de 1891) y de Teresa Flocco, que seguía viva. La corrección (a) al pie tacha el «in vita» que el escribano había interlineado sobre ella: no era una viuda más, estaba viva.", "CORRIGE UNA LECTURA ANTERIOR. La delegación del alcalde en Francesco Falcucci se anotó en la ficha del acta de 1891 como «24 de noviembre de 1889». Aquí se lee VENTICINQUE, y los nacimientos de Atessa de 1899 repiten «venticinque». Era el 25.", "SE LOCALIZÓ EN CUATRO IMÁGENES Y A LA PRIMERA en la última: el número lo daba la nota al margen de 1869, y la portada de la PARTE II en la página 110 dejaba la aritmética servida.", "LO QUE ABRE: la partida de nacimiento del propio Nicola, en los Nati de Atessa hacia 1869 —el mismo registro y casi el mismo año que el de su mujer—, y el matrimonio de sus padres, hacia 1865."], "imgs": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_faienza": {"id": "giuseppe_faienza", "nombre": "Giuseppe Faienza", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["faienza"], "resumen": "A farmhand from Atessa, father of Nicola Faienza. Born around 1840. He was alive in December 1892 and had to give his consent for his son to marry.", "datos": [["Birth", "hacia 1840, presumiblemente Atessa — su hijo nació allí hacia 1869"], ["Trade", "contadino (campesino)"], ["Residence", "ATESSA — el acta de 1892 lo da «residente in Atessa», sin «fu»: vivo"], ["Spouse", "MARIA STANISCIA, ya difunta en diciembre de 1892"], ["Son", "Nicola Faienza (hacia 1869), contadino, casado con Angiolina Pizzi"], ["Death", "sin localizar — posterior a diciembre de 1892"], ["Where this comes from", "acta de matrimonio de su hijo: Atessa, Matrimoni 1892, acta 101"]], "mapa": null, "sinacta": "NUEVO EN AGOSTO DE 2026, y es el primer Faienza de una generación anterior a Nicola que aparece escrito en un documento. Sale del acta de matrimonio de su hijo (Atessa, 29 de diciembre de 1892, acta 101, transcrita en la ficha del matrimonio): «NICOLA FAIENZA… figlio di GIUSEPPE, contadino, residente in Atessa».\n\nQUE ESTABA VIVO NO ES UNA DEDUCCIÓN DEL FORMULARIO, ES UN HECHO DEL ACTA. Nicola tenía veintitrés años y el Código Civil exigía consentimiento paterno por debajo de los veinticinco; el acta anota que «ha prestato il consenso il padre dello sposo, come risulta ed è spiegato dall'atto di richiesta delle pubblicazioni». Alguien fue a declararlo ante el oficial en diciembre de 1892.\n\nLO QUE NO SE SABE: cuándo nació, de quién era hijo y cuándo murió. Su matrimonio con Maria Staniscia sería de hacia 1865 y estaría en los Matrimoni de Atessa; su defunción, en los Morti de Atessa posteriores a 1892. Conviene tener presente que en Atessa hay varias familias Faienza a la vez —en los nacimientos de 1899 aparecen tres distintas, la de Michele fu Carmine y las de Antonio y Vincenzo di Pasquale—, así que el apellido solo no basta: hará falta el nombre del padre en cada acta.", "padre": null, "madre": null, "conyuge": "maria_staniscia", "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_staniscia": {"id": "maria_staniscia", "nombre": "Maria Staniscia", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["faienza"], "resumen": "Mother of Nicola Faienza, from Atessa. Born around 1845. She was already dead when her son married, in December 1892.", "datos": [["Birth", "hacia 1845, presumiblemente Atessa"], ["Residence", "ATESSA — «residente IN VITA in Atessa», la fórmula que el impreso reserva a los padres muertos"], ["Spouse", "Giuseppe Faienza, contadino de Atessa"], ["Son", "Nicola Faienza (hacia 1869)"], ["Death", "sin localizar — anterior a diciembre de 1892"], ["Where this comes from", "acta de matrimonio de su hijo: Atessa, Matrimoni 1892, acta 101"]], "mapa": null, "sinacta": "NUEVA EN AGOSTO DE 2026. El acta de matrimonio de su hijo Nicola (Atessa, 29 de diciembre de 1892, acta 101) dice «e della FU MARIA STANISCIA, residente in vita in Atessa». El «fu» y el «in vita» dicen lo mismo dos veces: en diciembre de 1892 ya estaba muerta, y mientras vivió vivió en Atessa.\n\nEs la tercera madre seguida que las actas de Atessa se molestan en nombrar —después de Santa Menna en 1841, Rosa Iacobitti en 1847 y Antonia di Iorio en 1891—, frente a los cuatro formularios gemelos de Rende que dejaron el hueco en blanco cuatro veces. STANISCIA es apellido corriente en Atessa: el índice de matrimonios de 1892 trae varios, y en los nacimientos de 1899 vuelve a salir.\n\nSu defunción tendría que estar en los Morti de Atessa anteriores a 1892.", "padre": null, "madre": null, "conyuge": "giuseppe_faienza", "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe": {"id": "giuseppe", "nombre": "Giuseppe Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The first son. Born at Rende in 1895; he was 24 in 1919.", "datos": [["Birth", "23 de febrero de 1895, 10 h, Rende — acta 43"], ["Place", "contrada Saporito"], ["Parents", "Salerno Francesco y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "24 de febrero de 1895, 10 h", "lugar": "Rende", "ref": "acta 43", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Nati»"], ["Aviso", "catalogado 1894, pero contiene actas de 1895"], ["Registro", "an_ua35983864 · hash 03Ar6ql"], ["Página", "28 de 98"], ["Registrar", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, agricoltore… Chiappetta Filomena, donna di casa, sua moglie…", "traduccion": "In the year eighteen hundred and ninety-five, on the twenty-fourth day of February, at ten in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the sixteenth of December eighteen hundred and ninety-four, there appeared SALERNO FRANCESCO, farmer, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, housewife, his wife living with him, there was born on the twenty-third of the current month, at ten in the morning, in the house situated in contrada Saporito, a boy, upon whom he bestows the name GIUSEPPE.\n\nWitnesses: Zicarelli Carmine, aged twenty-eight, labourer; and Marchese Vincenzo, aged sixty, farmer.", "notas": ["La edad declarada del padre (30) es errónea: Francesco había nacido el 7 de diciembre de 1870, luego tenía 24. Las edades declaradas en estos registros son aproximadas.", "El bloque de texto de arriba a la derecha de esa misma página —un acuerdo de ama de cría con Bruno Maria— NO pertenece a esta acta, sino a la 42."], "imgs": [{"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20Giuseppe%20Salerno%20-%20Rende%20acta%2043.jpg", "t": "Giuseppe Salerno - Rende acta 43"}], "zooms": [{"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20nombre%20impuesto%20y%20testigos.jpg", "t": "Nombre impuesto y testigos"}, {"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "The first of nine", "parrafos": ["He was born on 23 February 1895 at ten in the morning, in the contrada Saporito at Rende. His father registered him the next day at the same hour, before Spina Raffaele, secretary delegated by the mayor. The witnesses were Zicarelli Carmine, a twenty-eight-year-old day labourer, and Marchese Vincenzo, a sixty-year-old farmer.", "On that record Francesco declared thirty years. He was twenty-four. It is the first in a run of misdeclared ages that has forced every record of this family to be checked by the mother's name and the sequence number, and never by the father's age.", "He is the first child of Francesco and Filomena, born eleven months after the wedding. In 1919 he was twenty-four and was among those who crossed to Argentina — though the year of the voyage is still not settled: Italy did not allow men of military age to emigrate until after the war, and emigration to Argentina did not resume until March 1920."], "claves": [["Birth", "23 February 1895, 10 a.m., contrada Saporito, Rende"], ["Place among the siblings", "the eldest of the nine"], ["Father's declared age", "30, when he was 24"], ["In 1919", "24 years old; emigrated"]]}, "antonio": {"id": "antonio", "nombre": "Antonio Salerno", "legal": "ANTHONY SALERNO en Estados Unidos", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The brother who went to Chicago. Second son of Francesco and Filomena, born at Rende in 1896; he boarded at Naples at seventeen and landed in New York on 16 April 1914. He died in Illinois in 1981, aged eighty-four, after sixty-seven years in the same town and thirty-odd in the same feed mill. He is by far the brother of Settimo about whom most is known.", "datos": [["Birth", "13 de junio de 1896, Rende — acta 117, contrada S. Agostino"], ["Parents", "Salerno Francesco (25 años) y Chiappetta Filomena"], ["Emigration", "salió de NÁPOLES hacia el 8 de abril de 1914 y llegó a NUEVA YORK el 16 de abril de 1914, en el vapor BERLIN. Tenía diecisiete años"], ["En Illinois desde", "21 de octubre de 1914"], ["Marriage", "19 de mayo de 1920, con ROSINA SALERNO — también Salerno de apellido, también de la provincia de Cosenza"], ["Children", "DOMENICO, nacido el 11 de febrero de 1922, y FILOMENA, el 8 de febrero de 1925, los dos en Riverdale, Illinois"], ["Nacionalizado", "25 de enero de 1929, U.S. District Court, Chicago — petición n.º 19857, presentada el 10 de julio de 1925; declaración de intención n.º 22117"], ["Address", "13832 y luego 13838 South Emerald Avenue, RIVERDALE, condado de Cook, Illinois. Vivió allí toda su vida americana"], ["Trade", "LABORER (peón) en la HALES AND HUNTER FEED COMPANY, en la esquina de la calle 140 con Halsted, Riverdale. En el censo de 1950 seguía allí, 40 horas semanales"], ["Cómo era", "en febrero de 1942, con 44 años: 5 pies 4 pulgadas —1,63 m—, 145 libras —66 kg—, OJOS MARRONES, PELO NEGRO, TEZ OSCURA, sin señas particulares"], ["Death", "martes 5 de mayo de 1981, en el Ingalls Memorial Hospital de Harvey, Illinois. Funeral el viernes 8 en la iglesia de St. Mary de Riverdale"], ["Enterrado", "CEMENTERIO DE ST. BENEDICT, Chicago"], ["Dejó", "su mujer Rose, su hijo Dominic, un hermano Vincenzo de Riverdale, dos nietos y cinco bisnietos"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "rosina_salerno", "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": ["giuseppe", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Newspaper obituary", "tipo": "D", "tipoNombre": "Death", "fecha": "martes 5 de mayo de 1981", "lugar": "Riverdale, Illinois", "ref": "«The Star», 10 de mayo de 1981", "fuente": [["Publicación", "«The Star», Illinois, 10 de mayo de 1981"], ["Vía", "FamilySearch — Hammond, Lake, Indiana, imagen 3285 de 3302, grupo de imágenes 007596074"]], "literal": "ANTONIO SALERNO. Services were Friday for Antonio Salerno of Riverdale. Mr. Salerno died Tuesday at Ingalls Memorial hospital, Harvey. The funeral mass was at St. Mary's church, Riverdale. Burial was at St. Benedict's cemetery, Chicago. A former laborer at the Hales and Hunter Feed company in Riverdale, Mr. Salerno was born June 13, 1896, in Italy. He is survived by his wife, Rose; a son, Dominic of Riverdale; a brothr, Vincenzo of Riverdale; two grandchildren, and five great-grandchildren.", "traduccion": "ANTONIO SALERNO. Services for Antonio Salerno, of Riverdale, were held on Friday. Mr Salerno died on Tuesday at Ingalls Memorial Hospital in Harvey. Mass was at St Mary's Church, Riverdale. Burial was at St Benedict Cemetery, Chicago.\n\nA former labourer at the Hales and Hunter Feed Company of Riverdale, Mr Salerno had been born on 13 JUNE 1896 IN ITALY.\n\nHe is survived by his wife, Rose; a son, Dominic, of Riverdale; a brother, Vincenzo, of Riverdale; two grandchildren and five great-grandchildren.", "notas": ["*** ESTA ESQUELA CIERRA LA IDENTIFICACIÓN. *** Da «13 de junio de 1896», que es EXACTAMENTE la fecha de su acta de nacimiento de Rende. Sus papeles americanos —la naturalización de 1925 y la ficha de reclutamiento de 1942— decían 1897; el periódico acierta donde los formularios fallaban. No hay ninguna duda de que es el hermano de Settimo.", "MURIÓ UN MARTES: el 10 de mayo de 1981 fue domingo, el funeral fue el viernes 8, así que la muerte cae el MARTES 5 DE MAYO DE 1981. Tenía ochenta y cuatro años.", "«A BROTHR, VINCENZO OF RIVERDALE». Es la línea más intrigante de todo el documento y está sin resolver — ver el cabo abierto que lleva su nombre.", "SESENTA Y SIETE AÑOS EN EL MISMO SITIO. Llegó a Riverdale con diecisiete años y allí murió con ochenta y cuatro. La fábrica donde trabajó, la Hales and Hunter, estaba a seis manzanas de su casa."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1981-05-10%20D%20Esquela%20de%20Antonio%20Salerno%20-%20The%20Star%2C%20Illinois.jpg", "t": "Esquela de Antonio Salerno - The Star, Illinois"}], "zooms": []}, {"titulo": "Petition for naturalisation", "tipo": "C", "tipoNombre": "Certificate", "fecha": "presentada el 10 de julio de 1925; concedida el 25 de enero de 1929", "lugar": "U.S. District Court, Chicago", "ref": "petición n.º 19857", "fuente": [["Archivo", "United States District Court, Northern District of Illinois"], ["Vía", "FamilySearch — imagen 632 de 1246, grupo 007789231"], ["Declaración de intención", "n.º 22117, agosto de 1921"]], "literal": "ANTONIO SALERNO. My place of residence is 13832 So. Emerald Ave., Riverdale, Illinois. My occupation is laborer. I was born on the 13th day of June, anno Domini 1897, at Cosenza, Italy. I emigrated to the United States from Naples, Italy, on or about the 8th day of April anno Domini 1914, and arrived at the United States, at the port of New York, on the 16th day of April anno Domini 1914, on the vessel BERLIN. […] My wife's name is Rosina. She was born in Italy and now resides with me. I have 2 children: Domenico born Feb. 11, 1922; Filomena, Feb. 8, 1925, both born at Riverdale, Ill., and reside with me.", "traduccion": "Antonio Salerno, labourer, resident at 13832 South Emerald Avenue, Riverdale, Illinois, declares that he was born on 13 June 1897 at Cosenza, Italy.\n\nHE EMIGRATED FROM NAPLES around 8 April 1914 and ARRIVED AT THE PORT OF NEW YORK ON 16 APRIL 1914, ABOARD THE STEAMER «BERLIN».\n\nHe has lived in Illinois since 21 October 1914. His wife is called ROSINA, born in Italy and living with him. He has two children: DOMENICO, born 11 February 1922, and FILOMENA, 8 February 1925, both born at Riverdale.\n\nHe renounces all allegiance to Victor Emmanuel III, King of Italy. Signing as witnesses were GABRIELE PRETE, labourer, of 800 South Loomis St., Chicago, and SARFINO ARIELLO, switchman, of 13643 South Halsted St., Riverdale, who declare that they have known him since 1 November 1919.", "notas": ["*** AQUÍ ESTÁ EL BARCO. *** Después de agotar el CEMLA sin encontrar a nadie, resulta que la respuesta estaba en el otro hemisferio: Antonio no fue a Buenos Aires, fue a Nueva York, y su nombre está en la lista del vapor BERLIN que atracó el 16 de abril de 1914. La lista de pasajeros de ese viaje es un documento que ahora se puede pedir.", "SALIÓ EN 1914, NO EN 1919. Toda la reconstrucción familiar daba por hecho que los hermanos emigraron juntos después de la guerra. Antonio se fue CINCO AÑOS ANTES, y con diecisiete recién cumplidos. La familia no se dispersó de golpe: se fue deshilachando.", "Su año de nacimiento aquí es 1897, y en su acta de Rende es 1896. El día y el mes coinciden exactamente. Su esquela de 1981 dice 1896 y zanja la cuestión.", "El testigo Gabriele Prete reaparece en el censo de 1950 viviendo a dos casas. Y el otro, Sarfino Ariello, vivía en el 13643 de Halsted, la misma manzana donde el censo sitúa a los Cundari. Era un barrio entero de paisanos."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1925-07-10%20C%20Peticion%20de%20naturalizacion%20de%20Antonio%20Salerno%20-%20Chicago%20n%2019857.jpg", "t": "Peticion de naturalizacion de Antonio Salerno - Chicago n 19857"}], "zooms": []}, {"titulo": "Second World War draft card", "tipo": "C", "tipoNombre": "Certificate", "fecha": "16 de febrero de 1942", "lugar": "Riverdale, Illinois", "ref": "serial 798, orden 11239", "fuente": [["Archivo", "National Personnel Records Center, St. Louis, Missouri"], ["Vía", "FamilySearch — imagen 816 de 1081, grupo 104612912"], ["Junta local", "n.º 11, Harvey, condado de Cook, Illinois"]], "literal": "Antonio (None) Salerno. 13838 Emerald Ave., Riverdale, Cook, Illinois. Telephone Riverdale 188 J. Age 44. Date of birth June 13, 1897. Place of birth Cosenza, Italy. Name and address of person who will always know your address: GUS CUNDARI, 13851 S. Halsted, Riverdale, Illinois. Employer: Hales and Hunter, 140th and Halsted. — White, 5'4\", 145 lbs, eyes brown, hair black, complexion dark. Other obvious physical characteristics: None.", "traduccion": "Registration card for what was called the «old man's registration», the census of men aged 45 to 64 that the United States took on entering the war. Antonio Salerno, no middle name, of 13838 Emerald Avenue, Riverdale. Telephone: Riverdale 188 J. Forty-four years old, born 13 June 1897 at Cosenza, Italy.\n\nPerson who will always know his address: GUS CUNDARI, of 13851 South Halsted, Riverdale. Employed at Hales and Hunter, at 140th and Halsted.\n\nDESCRIPTION: white, FIVE FEET FOUR INCHES (1.63 m), ONE HUNDRED AND FORTY-FIVE POUNDS (66 kg), BROWN EYES, BLACK HAIR, DARK COMPLEXION. No other distinguishing marks.", "notas": ["*** ES LA ÚNICA DESCRIPCIÓN FÍSICA DE NADIE EN TODO ESTE ÁRBOL. *** De ciento treinta personas y doscientos años de papeles, éste es el único documento que dice cómo era alguien: bajo, fuerte, moreno de piel, pelo negro y ojos marrones. Su hermano Settimo sería probablemente parecido.", "GUS CUNDARI COMO CONTACTO. Cundari es el apellido de su suegra, Cherubina Cundari, y también el de Anna Cundari, la mujer con la que se casó su hermano Giovanni en Rende en 1926. Dos hermanos Salerno emparentados con Cundari, uno en Rende y otro en Illinois.", "En 1942 seguía en la misma fábrica y en la misma calle que en 1925. Sólo había cambiado de número: del 13832 al 13838."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1942-02-16%20C%20Ficha%20de%20reclutamiento%20de%20Antonio%20Salerno%20-%20Riverdale%20Illinois.jpg", "t": "Ficha de reclutamiento de Antonio Salerno - Riverdale Illinois"}], "zooms": []}, {"titulo": "United States census", "tipo": "C", "tipoNombre": "Certificate", "fecha": "abril de 1950", "lugar": "Riverdale, condado de Cook, Illinois", "ref": "hoja 3, vivienda 21 — 13838 Emerald Ave.", "fuente": [["Archivo", "National Archives and Records Administration"], ["Vía", "FamilySearch — imagen 4 de 39, grupo 108925561"]], "literal": "SALERNO, Anthony — Head, W, M, 53, Mar., born Italy, naturalized. 40 hrs. Laborer, Feed Mill. / Rose — Wife, W, F, 43, Mar., born Italy, naturalized. / Dominick D. — Son, W, M, 27, Mar. 36 hrs. Switchman, Railroad Co. / Mary L. — Daughter-in-law, W, F, 21, Mar. / Beverlee — Granddaughter, W, F, 2, Sin.", "traduccion": "In April 1950 the house at 13838 Emerald Avenue held three generations:\n\nANTHONY SALERNO, head of household, 53, married, born in Italy, naturalised. Forty hours a week as a labourer in a feed mill.\nROSE, his wife, 43, born in Italy, naturalised.\nDOMINICK D., the son, 27, married, RAILROAD COMPANY SWITCHMAN, 36 hours.\nMARY L., his daughter-in-law, 21.\nBEVERLEE, the granddaughter, 2.\n\nTwo houses along, on the same census sheet, lived CONSTANTINO CUNDARI, 62, born in Italy, foreman with the railroad company, with his wife ANGELINA, 57.", "notas": ["TRES GENERACIONES BAJO EL MISMO TECHO, y una cuarta a dos puertas: los Cundari, la familia de su suegra. La calle Emerald de Riverdale era una aldea calabresa trasplantada.", "Su hija Filomena, de veinticinco años en 1950, ya no vive en casa: se habría casado.", "El hijo entró en el ferrocarril, no en la fábrica de pienso. La generación siguiente salió del trabajo del padre."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1950-04-15%20C%20Censo%20de%20Estados%20Unidos%20-%20Riverdale%20Cook%20Illinois.jpg", "t": "Censo de Estados Unidos - Riverdale Cook Illinois"}], "zooms": []}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 de junio de 1896, 7 h", "lugar": "Rende", "ref": "acta 117", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 87 «Nati»"], ["Aviso", "catalogado 1895, pero contiene actas de 1896"], ["Registro", "an_ua35983865 · hash 57okQgj"], ["Página", "55 de 89"], ["Registrar", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, di anni venticinque, agricoltore…", "traduccion": "In the year eighteen hundred and ninety-six, on the fourteenth day of June, at seven in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the first of December eighteen hundred and ninety-five, there appeared SALERNO FRANCESCO, aged twenty-five, farmer, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, housewife, his wife living with him, there was born on the thirteenth of the current month, in the house situated in contrada S. Agostino, a boy, upon whom he bestows the name ANTONIO.\n\nWitnesses: Greco Pasquale, farmer; and Serpe Serafino, farmer.", "notas": ["Es el acta que permitió detectar el desfase del catálogo de Antenati. El año manuscrito dice «novantasei» con toda claridad, y la edad del padre (25) cuadra exactamente con su nacimiento en diciembre de 1870.", "La familia se ha mudado de contrada Saporito a contrada S. Agostino, donde seguirá en 1900."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20Antonio%20Salerno%20-%20Rende%20acta%20117.jpg", "t": "Antonio Salerno - Rende acta 117"}], "zooms": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 5, "nImgs": 7, "titulo": "The record that exposed the catalogue", "parrafos": ["He was born on 13 June 1896 in the contrada S. Agostino at Rende and was registered the following day at seven in the morning. His father declared twenty-five years, and this time the figure was exact. The witnesses were two village farmers: Greco Pasquale and Serpe Serafino.", "That exactness solved a serious problem. The register holding his record, Rende's number 87, is listed in the archive catalogue as «Births 1895», but the handwritten year in the heading says «novantasei» quite clearly and the father's age fits 1896. From this it emerged that the catalogue's dating is not reliable and that the Rende birth volumes do not run one per year: they split years in two. Since then there has been a rule in this investigation — read the handwritten year before accepting any record.", "The family had moved from Saporito, where Giuseppe had been born, to S. Agostino, the contrada where they would live again from 1904.", "Family memory places him in Chicago, alongside a Vincenzo. There is as yet no document to support it: it is a lead, not a fact."], "claves": [["Birth", "13 June 1896, contrada S. Agostino, Rende, record 117"], ["What his record proved", "that the archive catalogue dated the register wrongly"], ["Father's declared age", "25 — correct"], ["In 1919", "23 years old; emigrated"]]}, "umberto": {"id": "umberto", "nombre": "Umberto Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Third son, born at Rende in 1897. He was 22 in 1919.", "datos": [["Birth", "22 de noviembre de 1897, 6 de la mañana, Rende — acta 240"], ["Place", "contrada Saporito"], ["Parents", "Salerno Francesco y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "22 de noviembre de 1897, 10:10 h", "lugar": "Rende", "ref": "acta 240", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Nati» 1897"], ["Registro", "an_ua35983867 · hash wlpK8pB"], ["Página", "85 de 101"], ["Registrar", "Spina Raffaele, secretario delegado"]], "literal": "Salerno Francesco, contadino… di anni ventiquattro…", "traduccion": "In the year eighteen hundred and ninety-seven, on the twenty-second day of November, at ten past ten in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the sixteenth of December eighteen hundred and ninety-six, duly approved, there appeared SALERNO FRANCESCO, farmhand, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife living with him, there was born on the twenty-second of the current month, at six in the morning, in the house situated in contrada Saporito, a child of the male sex, upon whom he bestows the name UMBERTO.\n\nWitnesses: Spizzirri Giovanni, aged forty-nine, farmer; and Picarelli Vincenzo, aged sixty-eight, farmer, both resident in the comune. Illiterate: they do not sign; only the registrar signs.", "notas": ["La edad declarada del padre está escrita con tinta muy pálida. La lectura más probable es «ventiquattro» (24), pero Francesco tenía 26 en noviembre de 1897. Otra edad declarada errónea.", "La familia ha vuelto a contrada Saporito, donde ya estaba en 1895. En 1896 estaba en S. Agostino y en 1899 estará en Campagnano. Se mudaban mucho.", "Para localizar esta acta hubo que descubrir que el digitalizador refotografía la misma apertura dos veces cuando lleva un papel suelto encima. Aquí se ha guardado la toma limpia."], "imgs": [{"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20Umberto%20Salerno%20-%20Rende%20acta%20240.jpg", "t": "Umberto Salerno - Rende acta 240"}], "zooms": [{"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20acta%20240%20completa.jpg", "t": "Acta 240 completa"}, {"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20cabecera%2C%20padre%20Francesco%20y%20contrada%20Saporito.jpg", "t": "Cabecera, padre Francesco y contrada Saporito"}, {"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 4, "titulo": "Registered the same day", "parrafos": ["He was born on 22 November 1897 at six in the morning, in the contrada Saporito. By ten past ten that same morning his father was at the town hall declaring him: four hours and ten minutes between the birth and the registration.", "The age Francesco declared is written in very faint ink; the likeliest reading is twenty-four, and he was twenty-six. The witnesses were two village farmers, Spizzirri Giovanni, forty-nine, and Picarelli Vincenzo, sixty-eight. Nobody signed but the secretary, Spina Raffaele.", "His record was harder to find than any other. The 1897 register has re-photographed pages: when the volume has a loose sheet lying on it — death annotations that other town halls would send decades later — the digitiser takes two shots of the same opening. Page 86 carries a sheet covering half the spread; page 85 is the clean one, and that is the one that was saved.", "With Umberto the family had gone back to the contrada Saporito, where they had already been in 1895. In 1919 he was twenty-two and was one of those who left."], "claves": [["Birth", "22 November 1897, 6 a.m., contrada Saporito, Rende"], ["Registered", "the same day, four hours later"], ["Father's declared age", "24, when he was 26"], ["In 1919", "22 years old; emigrated"]]}, "settimo": {"id": "settimo", "nombre": "Settimo Salerno", "legal": "Settimo — no «Settino»", "rol": "directa", "rolNombre": "Direct line", "gen": 8, "ramas": ["salerno"], "resumen": "The great-grandfather Gonzalo lived to know. A twin, the first born, at half past four in the morning of 24 October 1899 at Rende. He crossed the Atlantic, married at Santa Fe at twenty-three, and had to fight the Argentine civil registry for twenty-seven years to get his own name spelled correctly.", "datos": [["Birth", "24 de octubre de 1899, a las 4:30 de la madrugada, Rende — acta 231"], ["Place", "contrada Campagnano"], ["Gemelo de", "SAVERIO, nacido veinticinco minutos después"], ["Orden", "«il primo nato» — el primero en nacer"], ["Su nombre", "SETTIMO, «el séptimo». No es un capricho: venía de una fila larga de hermanos"], ["Parents", "SALERNO FRANCESCO, de 28 años en 1899, y CHIAPPETTA FILOMENA. En 1923 seguían viviendo en RENDE: no emigraron con él"], ["Emigration", "sin fecha, sin barco y sin lista de desembarco. Lo único seguro es que en marzo de 1923 ya estaba en Santa Fe"], ["Oficio documentado", "PANADERO — así consta en su acta de matrimonio de 1923, a los veintitrés años"], ["Oficio por memoria familiar", "COLCHONERO. Lo cuenta la familia y NO está documentado: el único papel que da un oficio dice panadero. Las dos cosas caben en una vida larga, pero no hay que mezclarlas"], ["Marriage", "26 de marzo de 1923, ciudad de Santa Fe, acta 140, con CRISTINA RIZZO, argentina, hija de Salvador Rizzo y Ángela Costabile"], ["Dónde vivían los Salerno", "en CALLE FRANCIA, Santa Fe capital, todos los hermanos juntos, según la memoria familiar. Sin documentar"], ["Death", "entre 1977 y 1980, según la familia. *** El árbol dice 1975 y esa fecha está mal: *** Gonzalo nació en septiembre de 1977 y llegó a conocerlo — hay una foto de los dos"]], "mapa": null, "sinacta": "*** LA HISTORIA DE SU NOMBRE, QUE ES LA SUYA. *** Se llamaba SETTIMO, «el séptimo». Su acta de nacimiento de Rende lo dice con todas las letras y dos veces: en el cuerpo —«il nome di Settimo, e ch'è gemello»— y en el epígrafe del margen, «Salerno Settimo».\n\n*** Y A PARTIR DE AHÍ NADIE VOLVIÓ A ESCRIBÍRSELO BIEN. *** El índice del propio registro italiano lo transcribe **SETTINO**, con ene — y por culpa de ese índice entró en este árbol con el nombre equivocado, hasta que se abrió el acta original. En Argentina fue peor: en su acta de matrimonio de 1923 quedó mal escrito, él mismo firmó **«Settimio»**, y cuando murió su mujer, en 1967, el oficial del Registro Civil todavía escribió **«Settino Salerno»**.\n\n*** EN 1950 FUE A ARREGLARLO. *** Al margen de su acta de matrimonio hay una nota de la Dirección General del Registro Civil, de agosto de 1950, que rectifica la partida «estableciendo que el verdadero nombre del contrayente es SETTIMO». Veintisiete años después de casarse, con unos cincuenta encima, este hombre hizo el trámite de recuperar su propio nombre. Y aun así, diecisiete años más tarde, se lo volvieron a escribir mal.\n\n*** LO QUE FALTA DE ÉL, Y ES MUCHO. *** No hay fecha de emigración, ni barco, ni acta de defunción. Llegó antes de marzo de 1923 y murió entre 1977 y 1980. Su partida de defunción, en el Registro Civil de Santa Fe, daría la fecha exacta, el domicilio y el oficio con que murió — y ahí se sabría si acabó de colchonero, como cuenta la familia, o siguió de panadero. Es de lo primero que hay que pedir.\n\nRelacionado: [[cristina_rizzo]], [[carlos_salerno]].", "padre": "francesco", "madre": "filomena", "conyuge": "cristina_rizzo", "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": ["giuseppe", "antonio", "umberto", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Marriage record with Cristina Rizzo", "tipo": "M", "tipoNombre": "Marriage", "fecha": "26 de marzo de 1923", "lugar": "ciudad de Santa Fe, Argentina", "ref": "acta 140", "fuente": [["Archivo", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se obtuvo", "trámite digital en santafe.gob.ar/rcdigital, pedido por Gonzalo el 25 de agosto de 2026"], ["Firma digital", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verificación", "trámite 26-00-284-316 · hash D436-F555-6EF1-EE25-20B7-FA23-3C5D-8A13-78B9-EA89"]], "literal": "", "traduccion": "Record number one hundred and forty. In the city of SANTA FE, department of La Capital, province of Santa Fe, on the twenty-sixth day of March in the year nineteen hundred and twenty-three. Before me, head of the Registry of Civil Status, there appeared:\n\nDon SETTIMO SALERNO, aged twenty-three, of ITALIAN nationality, BORN AT RENDE, resident in this city, by trade a BAKER; son of don FRANCISCO SALERNO, aged forty, Italian, RESIDENT AT RENDE, ITALY, farmer, and of doña FILOMENA CHIAPPETTA, aged fifty, Italian, resident at Rende;\n\nand doña CRISTINA RIZZO, aged twenty-three, of ARGENTINE nationality; daughter of don SALVADOR RIZZO and of doña ÁNGELA COSTABILE, Italian, resident in this city.\n\nBoth parties stated that it was their will to marry, taking each other as husband and wife... I declare that don SETTIMO SALERNO and doña CRISTINA RIZZO are joined in lawful marriage.", "notas": ["*** CONFIRMA A SUS PADRES POR VÍA ARGENTINA. *** El acta italiana de 1899 daba «Salerno Francesco, de 28 años, y Chiappetta Filomena». Ésta, veinticuatro años después y en otro continente, da los mismos dos nombres — y añade que en 1923 SEGUÍAN VIVIENDO EN RENDE. No emigraron con el hijo.", "*** Y DA POR FIN LOS PADRES DE LA NOVIA: SALVADOR RIZZO y ÁNGELA COSTABILE. *** Hasta este día los Rizzo eran una sola persona suelta en todo el árbol.", "ERA PANADERO. A los veintitrés años, recién llegado de Rende.", "OJO CON LA EDAD DEL PADRE: el acta le pone cuarenta años, pero el acta de nacimiento de 1899 le daba veintiocho, o sea que en 1923 tendría cincuenta y dos. Doce años de error — normal, porque el padre estaba en Italia y la edad la dio el hijo de memoria.", "*** UNA NOTA AL MARGEN DE 1950 RECTIFICA SU PROPIO NOMBRE. *** La Dirección General del Registro Civil hizo constar, veintisiete años después, «que el verdadero nombre del contrayente es SETTIMO». En su acta de boda estaba mal escrito."], "imgs": [{"u": "../actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%201.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 1"}, {"u": "../actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%202.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 2"}], "zooms": []}, {"titulo": "The four brothers in Argentina", "tipo": "F", "tipoNombre": "Record", "fecha": "hacia 1925-1930", "lugar": "Argentina — estudio fotográfico", "ref": "fotografía de familia", "fuente": [["Procedencia", "álbum familiar, rama argentina"], ["Soporte", "copia de estudio, telón pintado con palmera"]], "literal": "", "traduccion": "Four young men posing in a photographic studio, in front of a painted backdrop with a palm tree and a landscape. Two standing, in dark suits; two seated on a bench, in light summer suits with their hats on their knees — a straw boater with a dark band on the left, a soft-brimmed felt on the right. All in white stiff-collared shirts and wide dark ties.\n\nThe family identifies them as the FOUR SALERNO BROTHERS newly arrived in Argentina. SETTIMO and SAVERIO are certainly among them; about the other two there is no certainty.", "notas": ["*** LA FOTO CORRIGE LA FECHA DE LA EMIGRACIÓN. *** La familia siempre dijo que llegaron «en 1919, después de la guerra». La ropa dice otra cosa: el canotier de paja y los pantalones de raya ancha con cintura alta son de mediados de los años veinte para adelante. Y ninguno de los cuatro aparenta menos de veinte largos: si ARTURO, nacido en 1907, es uno de ellos, en 1919 tendría DOCE AÑOS, y ahí no hay ningún chico de doce. Conclusión: o Arturo no está en la foto, o LLEGARON HACIA 1925-1930, no en 1919.\n\nY lo segundo encaja con todo lo demás: Antonio se fue solo en 1914, Giovanni seguía en Rende casándose en 1926. La familia no se rompió de golpe en 1919 — se fue deshilachando a lo largo de quince años. La fecha de 1919 es memoria, y la memoria ya falló una vez con Antonio.", "*** LOS DOS SENTADOS PODRÍAN SER LOS MELLIZOS. *** Es una hipótesis de mirada, no un dato: son los dos que visten igual —traje claro de verano—, están sentados en posición simétrica, los dos con el sombrero sobre la rodilla, y tienen la cara más parecida entre sí que ninguno de los otros dos pares. Settimo y Saverio nacieron el mismo día de 1899 con veinticinco minutos de diferencia. Nadie que lo sepa puede mirar esa foto sin pensarlo.", "QUIÉNES PUEDEN SER LOS CUATRO, por eliminación documental. De los siete hijos varones, ANTONIO se fue a Chicago en 1914 y allí murió en 1981; GIOVANNI se quedó en Rende y se casó allí en 1926. Quedan cinco candidatos para cuatro sillas: GIUSEPPE (1895), UMBERTO (1897), SETTIMO (1899), SAVERIO (1899) y ARTURO (1907).", "Y AQUÍ HAY ALGO QUE MERECE PENSARSE. La familia recuerda a los que vinieron como «Saverio, Settimo, y creería que Raffaele y Angelo». Pero Raffaele y Angelo no aparecen en ninguna partida, y en cambio UMBERTO y ARTURO sí existen y su destino está completamente en blanco. En esta genealogía ya ha pasado dos veces que una persona viviera con un nombre distinto del registrado: SETTIMO se hacía llamar Setimio en Argentina, y AQUILA figura como Rosalia en su propia acta de matrimonio. No sería extraño que los hombres que la familia recuerda como Raffaele y Angelo sean Umberto y Arturo.", "Un dato para no confundirse: ANGELINA, la hermana nacida en 1902, MURIÓ EN RENDE EL 29 DE AGOSTO DE 1910, con ocho años. No pudo emigrar. Si la memoria familiar recuerda un «Angelo», o es otra persona o es ella mal recordada.", "Lo que la foto sí prueba, sin discusión: LLEGARON JUNTOS Y SE HICIERON UN RETRATO. Cuatro hermanos de un pueblo de Calabria, con el traje bueno y el sombrero en la mano, posando delante de una palmera pintada el día que empezaron otra vida. Es la única imagen de esta familia anterior a la generación de los abuelos."], "imgs": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1920s%20F%20Los%20cuatro%20hermanos%20Salerno%20recien%20llegados%20a%20Argentina.jpg", "t": "1920s F Los cuatro hermanos Salerno recien llegados a Argentina"}], "zooms": []}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "28 de octubre de 1899, 10:40 h", "lugar": "Rende", "ref": "acta 231", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Año manuscrito", "«milleottocento novantanove» — coincide con el catálogo"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "86 de 115"], ["Registrar", "Pisani Domenico, asesor decano"]], "literal": "…a cui dà il nome di Settimo, e ch'è gemello un altro mi conserva l'atto seguente.\n\nIl dichiarante ha inoltre attestato che il bambino suddetto è il primo nato.", "traduccion": "In the year eighteen hundred and ninety-nine, on the twenty-eighth day of October, at twenty to eleven in the morning, at the town hall, before Pisani Domenico, senior assessor for the mayor being indisposed, there appeared SALERNO FRANCESCO, aged twenty-eight, farmhand, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife living with him, there was born on the twenty-fourth of the current month, at half past four in the morning, in the house situated in contrada Campagnano, a child of the male sex, to whom he gives the name SETTIMO, and who is the twin of another recorded in the following entry.\n\nWitnesses: Perri Pietro, aged sixty-one, farmhand; and Spizzirri Giovanni, aged forty-six, farmhand, both resident in the comune.\n\nThe informant further attested that the said child is THE FIRST BORN.", "notas": ["EL NOMBRE NO ES «SETTINO» SINO SETTIMO. El índice del que se partía lo transcribe mal. El acta original lo dice con claridad tanto en el cuerpo como en el epígrafe del margen.", "La edad del padre (28) es CORRECTA, nacido en diciembre de 1870. Es de las pocas veces que Francesco declara bien su edad.", "«Settimo» significa séptimo, pero por el índice es el cuarto hijo documentado. O el nombre es sólo un nombre, o hubo hermanos antes de 1899 que no constan. No es prueba de nada, pero apunta hacia los catorce hijos de la memoria familiar."], "imgs": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20Settimo%20Salerno%20-%20Rende%20acta%20231.jpg", "t": "Settimo Salerno - Rende acta 231"}], "zooms": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20completa.jpg", "t": "Acta 231 completa"}, {"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20entera%20y%20margen%20sin%20anotaciones.jpg", "t": "Acta 231 entera y margen sin anotaciones"}, {"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20nombre%20Settimo%20y%20mencion%20del%20gemelo.jpg", "t": "Nombre Settimo y mencion del gemelo"}]}], "nActas": 3, "nImgs": 7, "titulo": "Twenty-five minutes the elder", "parrafos": ["He was born on 24 October 1899 at half past four in the morning, in the contrada Campagnano at Rende. His brother Saverio was born twenty-five minutes later. Four days after, on 28 October at twenty to eleven in the morning, their father registered them in two consecutive records, with the same two witnesses and five minutes between one and the other.", "That they were twins is not an inference from the closeness of the numbers: both records say so in writing and refer to each other. His says «e ch'è gemello un altro mi conserva l'atto seguente»; Saverio's, «l'atto precedente». And his adds a line nobody was obliged to write: «Il dichiarante ha inoltre attestato che il bambino suddetto è IL PRIMO NATO». The order of birth was supplied by the father himself, not by a midwife.", "The index this investigation started from calls him «Settino». The original record says SETTIMO, quite clearly, both in the body and in the marginal heading. Settimo is the ordinary Italian name for a seventh child; on paper he is the fourth documented. Either the name is only a name, or there were earlier children who are not recorded. It proves nothing, but it points towards the fourteen children of family memory.", "He belongs to the class of '99, the ragazzi del '99, the cohort Italy called up in 1917 at barely eighteen; the family keeps his First World War medals. He ended up at Santa Fe, Argentina, where he went by Setimio. His wife, Cristina Rizzo, died there in November 1967, and he between 1977 and 1980, aged seventy-eight or eighty-one. He does not appear in the index of arrivals at the port of Buenos Aires under any spelling of his name."], "claves": [["Birth", "24 October 1899, 4:30 a.m., contrada Campagnano"], ["Twin", "of Saverio, twenty-five minutes younger"], ["The record says", "«il primo nato», the first born"], ["His name", "Settimo — the index calls him Settino and is wrong"], ["Afterwards", "the class of 1899, the war; and Santa Fe, Argentina, as Setimio"]]}, "saverio": {"id": "saverio", "nombre": "Saverio Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Settimo's twin, the second born, twenty-five minutes later. He was 20 in 1919.", "datos": [["Birth", "24 de octubre de 1899, 4:55 de la madrugada, Rende — acta 232"], ["Place", "contrada Campagnano"], ["Gemelo de", "Settimo"], ["Orden", "«il secondo nato» — el segundo en nacer"], ["Parents", "Salerno Francesco (28 años) y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "28 de octubre de 1899, 10:45 h", "lugar": "Rende", "ref": "acta 232", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Registro", "an_ua35983869 · hash LyxaADX"], ["Página", "87 de 115"], ["Detalle", "redactada cinco minutos después del acta 231"]], "literal": "…a cui dà il nome di Saverio, e ch'è gemello un altro mi conserva l'atto precedente.\n\nIl dichiarante ha inoltre attestato che il bambino soddetto è il secondo nato.", "traduccion": "In the year eighteen hundred and ninety-nine, on the twenty-eighth day of October, at a quarter to eleven in the morning — five minutes after the preceding record — at the town hall, before Pisani Domenico, there appeared SALERNO FRANCESCO, aged twenty-eight, farmhand.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife, there was born on the twenty-fourth of the current month, at four fifty-five in the morning, in the house situated in contrada Campagnano, a child of the male sex, to whom he gives the name SAVERIO, and who is the twin of another recorded in the preceding entry.\n\nWitnesses: the same two as in the preceding record.\n\nThe informant further attested that the said child is THE SECOND BORN.", "notas": ["Los gemelos no son una deducción por la proximidad de los números: las dos actas lo dicen por escrito y se remiten la una a la otra.", "El dato del parto doble lo aporta el propio padre («il dichiarante ha inoltre attestato»), no la comadrona."], "imgs": [{"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20Saverio%20Salerno%20-%20Rende%20acta%20232.jpg", "t": "Saverio Salerno - Rende acta 232"}], "zooms": [{"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20232%20completa.jpg", "t": "Acta 232 completa"}, {"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 3, "titulo": "The second, by twenty-five minutes", "parrafos": ["He was born at four fifty-five in the morning on 24 October 1899, in the same house in the contrada Campagnano and twenty-five minutes after his brother.", "His record was drawn up at ten forty-five on 28 October, five minutes after Settimo's, before the same official and with the same two witnesses — Perri Pietro, sixty-one, and Spizzirri Giovanni, forty-six, both farmhands. It closes with the mirror of the other's formula: «il bambino soddetto è IL SECONDO NATO». None of those present signed.", "In 1919 he was twenty and was one of those who left. He does not appear in the Buenos Aires arrivals index, just like his twin."], "claves": [["Birth", "24 October 1899, 4:55 a.m., contrada Campagnano"], ["Twin", "of Settimo, twenty-five minutes older"], ["The record says", "«il secondo nato», the second born"], ["In 1919", "20 years old; emigrated"]]}, "angelina": {"id": "angelina", "nombre": "Angelina Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born in contrada Campagnano on 14 May 1902 and dead in contrada Sant'Agostino on 29 August 1910, aged eight years and three months. She did not emigrate.", "datos": [["Birth", "14 de mayo de 1902, 12:30, Rende — acta 55"], ["Lugar de nacimiento", "contrada Campagnano"], ["Death", "29 de agosto de 1910, 12 h, Rende — acta 81"], ["Lugar de defunción", "contrada Sant'Agostino"], ["Edad al morir", "ocho años y tres meses (el acta dice diez, y se equivoca)"], ["Parents", "Salerno Francesco y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "16 de mayo de 1902, 10:05 h", "lugar": "Rende", "ref": "acta 55", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 94 «Nati» 1902"], ["Registro", "an_ua35988531 · hash LNyKqBl"], ["Página", "21 de 77"], ["Año manuscrito", "«millenovecento due» — coincide con el catálogo"], ["Registrar", "Pisani Domenico, asesor por el alcalde impedido"]], "literal": "è comparso Salerno Francesco, di anni trenta, bracciante, domiciliato in Rende…\n…nella casa posta in contrada Campagnano, da Chiappetta Filomena sua moglie\ncontadina seco lui convivente… il nome di Angelina", "traduccion": "In the year nineteen hundred and two, on the sixteenth day of May, at five past ten in the morning, at the town hall, before Pisani Domenico, assessor for the mayor being indisposed, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty, BRACCIANTE (day labourer), resident at Rende.\n\nHe declares that at half past twelve on the fourteenth of the current month, in the house situated in CONTRADA CAMPAGNANO, of CHIAPPETTA FILOMENA, his wife, countrywoman, living with him, there was born a child of the female sex whom he presents to me, and to whom he gives the name ANGELINA.\n\nWitnesses: Presta Francesco, aged twenty-six, day labourer; and Bartucci Antonio, aged seventy, farmhand, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only Domenico Pisani signs.", "notas": ["El margen del acta 55 está EN BLANCO: la muerte de Angelina en 1910 no se anotó nunca al margen de su nacimiento, aunque el acta de defunción existe y está aquí al lado.", "El oficio del padre baila con los años: «contadino» en 1899, «bracciante» aquí en 1902, y otra vez «contadino» en 1904, 1907 y 1909.", "La contrada también cambia: Campagnano en 1899 y 1902, Santo Agostino a partir de 1904."], "imgs": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20Angelina%20Salerno%20-%20Rende%20acta%2055.jpg", "t": "Angelina Salerno - Rende acta 55"}], "zooms": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20acta%2055%20completa.jpg", "t": "Acta 55 completa"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20contrada%20Campagnano.jpg", "t": "Padre Francesco Salerno y contrada Campagnano"}]}, {"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "30 de agosto de 1910, 13 h", "lugar": "Rende", "ref": "acta 81", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 102 «Morti» 1910"], ["Registro", "an_ua35988770 · hash LPAJpg1"], ["Página", "23 de 54"], ["Año manuscrito", "«millenovecento dieci» — coincide con el catálogo"], ["Registrar", "Vercillo Giuseppe, asesor por el alcalde"]], "literal": "sono comparsi Salerno Domenico, di anni cinquanta, contadino, domiciliato in Rende,\ne Chiappetta Giovanni, di anni sessanta, contadino, domiciliato in Rende…\n…nella casa posta in contrada Sant'Agostino… è morta Salerno Angelina,\ndi anni dieci… nata in Rende da Francesco… e da Chiappetta Filomena", "traduccion": "In the year nineteen hundred and ten, on the thirtieth day of August, at thirteen hours, at the town hall, before VERCILLO GIUSEPPE, assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO DOMENICO, aged fifty, farmhand, resident at Rende, and CHIAPPETTA GIOVANNI, aged sixty, farmhand, resident at Rende.\n\nWho declared to me that at twelve o'clock YESTERDAY, in the house situated in CONTRADA SANT'AGOSTINO, there died SALERNO ANGELINA, aged ten, countrywoman, resident at Rende, born at Rende, daughter of FRANCESCO, farmhand, resident at Rende, and of CHIAPPETTA FILOMENA, countrywoman, resident at Rende.\n\nWitnesses: Perri Domenico, aged twenty-six, farmhand; and Vercillo Ferdinando, aged thirty-five, BARBER, both resident in this comune.\n\nThe record having been read to all present, I signed it with the informant CHIAPPETTA and with the witness VERCILLO, the others having stated that they were illiterate.", "notas": ["LA EDAD DEL ACTA ESTÁ MAL. Dice «di anni dieci», diez años. Angelina nació el 14 de mayo de 1902 —su acta de nacimiento está aquí mismo—, así que el 29 de agosto de 1910 tenía OCHO AÑOS Y TRES MESES. Quienes declaran no son los padres, sino un tío y un abuelo, y redondean de más.", "LOS DECLARANTES SON EL DATO BUENO. El primero, SALERNO DOMENICO de cincuenta años, es el hermano mayor de Francesco: diez semanas más tarde se casaba con Giuseppina Cairo declarando cincuenta y uno. Las dos cifras se cruzan en un nacimiento de hacia 1859.", "El segundo, CHIAPPETTA GIOVANNI de sesenta años, es el padre de Filomena, el abuelo materno. Ya constaba como padre de ella en el acta de nacimiento de 1877. Seguía vivo, y SABÍA FIRMAR: es de los pocos de la familia que no firma con una cruz.", "No comparece ninguno de los dos padres de la niña."], "imgs": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20Angelina%20Salerno%20-%20Rende%20acta%2081.jpg", "t": "Angelina Salerno - Rende acta 81"}], "zooms": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20acta%2081%20completa.jpg", "t": "Acta 81 completa"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20declarantes%20Salerno%20Domenico%20y%20Chiappetta%20Giovanni.jpg", "t": "Declarantes Salerno Domenico y Chiappetta Giovanni"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20testigos%20y%20firmas.jpg", "t": "Testigos y firmas"}]}], "nActas": 2, "nImgs": 8, "titulo": "The record made her ten", "parrafos": ["She was born on 14 May 1902 at half past twelve, in the contrada Campagnano. Her father registered her two days later and declared thirty years: he was thirty-one. The witnesses were Presta Francesco, a twenty-six-year-old day labourer, and Bartucci Antonio, a seventy-year-old farmhand.", "She died on 29 August 1910 at noon, in the contrada Sant'Agostino, in the same house where her brothers Giovanni and Arturo and her sister Maria had been born. The death record says «di anni dieci», ten years old. It is wrong, and the proof is two registers away: her own birth record. She was eight years and three months old.", "It was not her parents who reported the death. It was her uncle Salerno Domenico, fifty, and her maternal grandfather, Chiappetta Giovanni, sixty, and between them they rounded the child's age badly. The grandfather signed the record; the others declared themselves illiterate. The witnesses were a twenty-six-year-old farmhand and a thirty-five-year-old barber.", "The margin of her birth record is blank: the death was never noted there, although the record exists and sits in the next register along. For a time it was assumed that Angelina had emigrated to Argentina with the family. She did not: she died nine years before her brothers sailed."], "claves": [["Birth", "14 May 1902, 12:30, contrada Campagnano"], ["Death", "29 August 1910, noon, contrada Sant'Agostino"], ["Real age at death", "eight years and three months — the record says ten"], ["Who reported it", "her uncle and her grandfather; neither parent"]]}, "giovanni_hijo": {"id": "giovanni_hijo", "nombre": "Giovanni Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born on the first day of 1904, four years after the death of the uncle whose name he carried. He was 15 in 1919 — and in 1926 he married at Rende.", "datos": [["Birth", "1 de enero de 1904, 2 de la madrugada, Rende — acta 5"], ["Place", "contrada Santo Agostino"], ["Parents", "Salerno Francesco y Chiappetta Filomena"], ["Marriage", "24 de julio de 1926, Rende — acta 34, con Cundari Anna"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "anna_cundari", "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "3 de enero de 1904, 10 h", "lugar": "Rende", "ref": "acta 5", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 96 «Nati» 1904"], ["Registro", "an_ua35988725 · hash LeNPZXl"], ["Página", "4 de 93"], ["Año manuscrito", "«millenovecento quattro» — coincide con el catálogo"], ["Registrar", "Mercavallo Michelangelo, secretario delegado"]], "literal": "è comparso Salerno Francesco, di anni trentaquattro, contadino, domiciliato in Rende…\n…del dì primo del corrente mese, nella casa posta in contrada Santo Agostino,\nda Chiappetta Filomena, sua moglie, contadina, seco lui convivente… il nome di Giovanni", "traduccion": "In the year nineteen hundred and four, on the third day of January, at ten in the morning, at the town hall, before MERCAVALLO MICHELANGELO, secretary delegated by act of the mayor dated the twentieth of August nineteen hundred and two, approved, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-four, farmhand, resident at Rende.\n\nHe declares that at two in the morning on the FIRST of the current month, in the house situated in CONTRADA SANTO AGOSTINO, of CHIAPPETTA FILOMENA, his wife, countrywoman, living with him, there was born a child of the male sex whom he presents to me, and to whom he gives the name GIOVANNI.\n\nWitnesses: Cosentino Rosario, aged thirty-four, farmhand; and Alfano Domenico, aged forty-five, farmhand, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only M. Mercavallo signs.", "notas": ["ANOTACIÓN MARGINAL, de mano posterior y con rúbrica: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». Giovanni se casó en Rende el 24 de julio de 1926, acta nº 34, con CUNDARI ANNA. Dato nuevo.", "Y dato de peso: si se casó en Rende en 1926, o no embarcó con la familia en 1919 o volvió. Conviene revisar el supuesto de que emigraron todos.", "Nació el 1 de enero: es de los primeros nacimientos del año, y por eso su acta lleva el número 5 y está casi al principio del volumen — el índice de este registro es cortísimo.", "La familia ya vive en contrada Santo Agostino; en 1902, con Angelina, estaban en Campagnano."], "imgs": [{"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20Giovanni%20Salerno%20-%20Rende%20acta%205.jpg", "t": "Giovanni Salerno - Rende acta 5"}], "zooms": [{"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20acta%205%20completa.jpg", "t": "Acta 5 completa"}, {"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201926%20con%20Cundari%20Anna.jpg", "t": "Anotacion marginal matrimonio 1926 con Cundari Anna"}, {"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 4, "titulo": "He stayed at Rende", "parrafos": ["He was born on 1 January 1904 at two in the morning, in the contrada Santo Agostino: the family's first birth of the year, and one of the register's first records, number 5. His father registered him on the 3rd at ten in the morning and declared thirty-four years. He carries the name of his uncle, dead four years earlier at twenty-six.", "In the margin of the record a later hand wrote, with a flourish: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». He married at Rende on 24 July 1926. That line changed the story: if he was in the village in 1926, either he never sailed or he came back. He was fifteen when the older ones left.", "It is the document that best supports what the family tells: that the household split in two, that the elder brothers crossed, and that Francesco and Filomena stayed at Rende with the younger ones. And it means there is a living branch there, descended from Giovanni and Anna Cundari."], "claves": [["Birth", "1 January 1904, 2 a.m., contrada Santo Agostino"], ["Marginal note", "married at Rende on 24 July 1926 to Cundari Anna"], ["In 1919", "15 years old; he stayed"], ["He carries the name", "of his uncle Giovanni, dead in 1900"]]}, "arturo": {"id": "arturo", "nombre": "Arturo Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born before dawn on 21 December 1907 and registered that same morning. He was 12 in 1919.", "datos": [["Birth", "21 de diciembre de 1907, 4:30 de la madrugada, Rende — acta 215"], ["Place", "contrada S. Agostino"], ["Parents", "Salerno Francesco y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "21 de diciembre de 1907, 11:50 h", "lugar": "Rende", "ref": "acta 215", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 99, suppl. 2 «Nati» 1907"], ["Registro", "an_ua35988728 · hash wOpm92Y"], ["Página", "77 de 94"], ["Año manuscrito", "«millenovecento sette» — coincide con el catálogo"], ["Registrar", "Pisani Domenico, asesor por el alcalde"]], "literal": "è comparso Salerno Francesco di anni trentotto, contadino, domiciliato in Rende…\n…alle ore quattro e minuti trenta, del dì ventuno del corrente mese, nella casa\nposta in contrada S. Agostino, da Chiappetta Filomena, contadina, sua moglie\nseco lui convivente… il nome di Arturo", "traduccion": "In the year nineteen hundred and seven, on the twenty-first day of December, at ten to twelve in the morning, at the town hall, before PISANI DOMENICO, assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-eight, farmhand, resident at Rende.\n\nHe declares that at half past four in the morning on the twenty-first of the current month, in the house situated in CONTRADA S. AGOSTINO, of CHIAPPETTA FILOMENA, countrywoman, his wife, living with him, there was born a child of the male sex whom he presents to me, and to whom he gives the name ARTURO.\n\nWitnesses: Sicilia Pasquale, aged sixty-one, CARPENTER; and Bruno Giovanni, aged seventy-seven, SHOEMAKER, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only Domenico Pisani signs.", "notas": ["Nació y se inscribió EL MISMO DÍA: parto a las 4:30 de la madrugada, acta a las 11:50 de la mañana, siete horas después. Es el registro más rápido de toda la familia.", "Los dos testigos no son campesinos, como suele ocurrir, sino artesanos del pueblo: un carpintero de 61 años y un zapatero de 77.", "El volumen es el Reg. 99 «suppl. 2». El Reg. 99 «normal» tiene sólo dos páginas: es un resto. El suplemento se cierra con la firma de Domenico Pisani el 1 de enero de 1908."], "imgs": [{"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20Arturo%20Salerno%20-%20Rende%20acta%20215.jpg", "t": "Arturo Salerno - Rende acta 215"}], "zooms": [{"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20acta%20215%20completa.jpg", "t": "Acta 215 completa"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20fechas%20y%20padre%20Francesco%20Salerno.jpg", "t": "Fechas y padre Francesco Salerno"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 5, "titulo": "A carpenter and a shoemaker", "parrafos": ["He was born on 21 December 1907 at half past four in the morning, in the contrada S. Agostino, and his father registered him that same morning at ten to twelve: seven hours after the birth.", "The witnesses on his record are not the usual day labourers. Signing as witnesses are Sicilia Pasquale, a sixty-one-year-old carpenter, and Bruno Giovanni, a seventy-seven-year-old shoemaker — two village trades and two old men. Francesco declared thirty-eight years on the very day he turned thirty-seven.", "His record sits in a treacherous volume: Rende's «ordinary» register 99 has only two pages, and the real one is «supplement 2», with ninety-four. It is closed by Domenico Pisani at Rende on 1 January 1908.", "He was twelve in 1919. He stayed in Italy with his parents."], "claves": [["Birth", "21 December 1907, 4:30 a.m., contrada S. Agostino"], ["Registered", "the same day, seven hours later"], ["Witnesses", "a carpenter of 61 and a shoemaker of 77"], ["In 1919", "12 years old; he stayed"]]}, "maria": {"id": "maria", "nombre": "Maria Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The youngest of the nine documented children. Born in contrada S. Agostino on the night of 23 September 1909; she was 10 in 1919.", "datos": [["Birth", "23 de septiembre de 1909, 23:35, Rende — acta 206"], ["Place", "contrada S. Agostino"], ["Parents", "Salerno Francesco y Chiappetta Filomena"]], "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "24 de septiembre de 1909, 10:40 h", "lugar": "Rende", "ref": "acta 206", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 101 «Nati» 1909"], ["Registro", "an_ua35988732 · hash 5G6v3x6"], ["Página", "77 de 109"], ["Año manuscrito", "«millenovecento nove» — coincide con el catálogo"], ["Registrar", "Costabile Federico (firma al pie; la línea «Avanti di me» quedó en blanco)"]], "literal": "è comparso Salerno Francesco, di anni trentotto, contadino, domiciliato in Rende…\n…alle ore ventitre e minuti trentacinque, del dì ventitre del corrente mese, nella\ncasa posta in Contrada S. Agostino, da Chiappetta Filomena, contadina, sua legittima\nmoglie seco lui convivente… il nome di Maria", "traduccion": "In the year nineteen hundred and nine, on the twenty-fourth day of September, at twenty to eleven in the morning, at the town hall. Before [the line for the registrar's name was left BLANK], Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-eight, farmhand, resident at Rende.\n\nHe declares that at twenty-three thirty-five on the twenty-third of the current month, in the house situated in CONTRADA S. AGOSTINO, of CHIAPPETTA FILOMENA, countrywoman, his LAWFUL wife, living with him, there was born a child of the female sex whom he presents to me, and to whom he gives the name MARIA.\n\nWitnesses: Ruffolo Serafino, aged fifty-three, farmhand; and Rende Tommaso, aged thirty-five, farmhand, both resident in this comune.\n\nThe record having been read to all present, they did not sign it with me, being illiterate. Signed FEDERICO COSTABILE.", "notas": ["El escribano se dejó SIN RELLENAR la línea «Avanti di me»: el acta no dice quién la autorizó. Lo resuelve la firma del pie, Federico Costabile, que en las actas vecinas de la misma apertura consta como «assessore delegato per gli atti di Stato Civile».", "Aquí la edad declarada del padre es EXACTA por una vez: treinta y ocho años, y había nacido en diciembre de 1870. En 1902 y 1904 se había quedado corto o largo por un año.", "En la MISMA apertura, el acta 207 lleva como testigo a un «Salerno Francesco, di anni trentotto, contadino»: misma edad y mismo oficio. Es él, que se quedó de testigo del vecino después de inscribir a su hija. Y ese acta 207 lo declara una comadrona porque el marido «è in America»: el pueblo ya estaba emigrando."], "imgs": [{"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20Maria%20Salerno%20-%20Rende%20acta%20206.jpg", "t": "Maria Salerno - Rende acta 206"}], "zooms": [{"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20acta%20206%20completa.jpg", "t": "Acta 206 completa"}, {"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20testigos%20y%20firma%20de%20Federico%20Costabile.jpg", "t": "Testigos y firma de Federico Costabile"}]}], "nActas": 1, "nImgs": 4, "titulo": "The clerk forgot his own name", "parrafos": ["She was born on the night of 23 September 1909, at twenty-five to twelve, in the contrada S. Agostino. She is the youngest of the nine documented children. Her father registered her the next morning and this time declared his age correctly: thirty-eight.", "The record has an odd gap. The line «Avanti di me» — before me — was left blank: the clerk never got round to writing his own name. The man signing at the foot is Federico Costabile, who on neighbouring records appears as assessor delegated for civil registration. The witnesses were two farmhands, Ruffolo Serafino, fifty-three, and Rende Tommaso, thirty-five.", "On the same opening of the register, the next record carries as a witness a «Salerno Francesco, di anni trentotto, contadino»: same age, same trade. It is him, staying on as a witness for the neighbour after registering his daughter. That record was reported by a midwife because the husband «è in America». The village was already emigrating.", "She was ten in 1919 and stayed with her parents. The family remembers a «Marietta» who ended up in Canada; Marietta is the ordinary diminutive of Maria, so it could be her or her aunt Maria Chiappetta, born in 1901. No document settles it."], "claves": [["Birth", "23 September 1909, 11:35 p.m., contrada S. Agostino"], ["Oddity of the record", "the registrar's line was left blank"], ["Father's declared age", "38 — exact, for once"], ["In 1919", "10 years old; she stayed"]]}, "salvatore": {"id": "salvatore", "nombre": "Salvatore Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 8, "ramas": ["salerno"], "resumen": "A first cousin, not a brother. Son of Giovanni and Vincenzina. He was thirteen months old when his father died.", "datos": [["Birth", "12 de enero de 1899, 3 de la madrugada, Rende — acta 13"], ["Place", "contrada Mari (lectura dudosa)"], ["Parents", "Salerno Giovanni y Morelli Vincenzina"], ["Marriage", "octubre de 1921, Rende, nº 67, con Misuraca Caterina Santa"], ["Huérfano", "de padre, a los trece meses"]], "mapa": null, "sinacta": "", "padre": "giovanni", "madre": "vincenzina", "conyuge": "caterina_misurelli", "hijos": [], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "13 de enero de 1899, 9:20 h", "lugar": "Rende", "r
