ibros parroquiales.", "padre": null, "madre": null, "conyuge": "marianna_conforti", "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marianna_conforti": {"id": "marianna_conforti", "nombre": "Marianna Conforti", "legal": "«la fu Marianna Conforti» en el acta de 1851", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Mother of Teresa Luchetta. Born around 1750-1760, dead before June 1851. Her name appears in two separate documents, which is rare in this genealogy.", "datos": [["Birth", "hacia 1750-1760, presumiblemente Marano Marchesato"], ["Spouse", "Gio: Antonio Luchetta, bracciale, también difunto en 1851"], ["Hijos documentados", "TERESA LUCHETTA (hacia 1779 – 1851) y ANTONIO LUCHETTA († 1834)"], ["Death", "sin localizar — anterior a junio de 1851; el acta la llama «fu»"], ["Apellido", "CONFORTI es el apellido de los alcaldes de Marano de medio siglo: Francesco Conforti firma el nacimiento de Carmina en 1814, Ferdinando Conforti la defunción de Teresa en 1851 y Gioacchino Conforti la de Carmina Spizzirri en 1864. No hay parentesco probado con ninguno"], ["Where this comes from", "acta de defunción de su hija Teresa (Marano, Morti 1851, acta 44) y, por segunda vía, el índice de Morti de Marano de 1834, acta 17"]], "mapa": null, "sinacta": "CONFIRMADA POR ACTA en agosto de 2026. El acta de defunción de su hija Teresa Luchetta —Marano Marchesato, 6 de junio de 1851, acta 44— la nombra con todas las letras: «e della FU MARIANNA CONFORTI». Es exactamente lo que daba el índice del blog, ahora respaldado por el documento. Y hay una segunda vía independiente: la defunción de 1834, acta 17, de un Antonio Luchetta «di Antonio e Conforti Marianna», hermano de Teresa.\n\nQue un acta de Marano nombre a la madre no es cosa que se pueda dar por descontada: el acta de Vincenzo Volpentesta de 1823 dejó esa casilla en blanco, y la de Carmina Spizzirri de 1864 dejó en blanco las dos. Aquí el escribano las rellenó, y con eso Teresa Luchetta pasó de no tener ningún papel a tener padre y madre en una sola línea.", "padre": null, "madre": null, "conyuge": "antonio_luchetta", "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_palermo": {"id": "giuseppe_palermo", "nombre": "Giuseppe Palermo", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A shepherd and day labourer from Marano Marchesato, father of Francesco Giacomo Palermo. He was born around 1773 and died in his own house on 6 March 1863, aged NINETY. His death record, read in August 2026, at last names his parents: Lorenzo Palermo and Giulia Chiappetta.", "datos": [["Birth", "hacia 1781, y no 1773, MARANO MARCHESATO — «nato in Marano medesimo». El acta de nacimiento de su hija Aquila (1821) le da CUARENTA años; los noventa de su acta de defunción de 1863 darían 1773. Ocho años de diferencia, y la cifra de 1821 la dice él mismo"], ["Parents", "LORENZO PALERMO y GIULIA CHIAPPETTA, los dos ya difuntos en 1863 — CONFIRMADOS por acta original desde agosto de 2026"], ["Trade", "BRACCIALE en junio de 1821, al declarar el nacimiento de Aquila; PASTORE en diciembre de 1838, cuando casó a su hija Rosalia; BRACCIALE otra vez en su acta de defunción de 1863"], ["Address", "Marano Marchesato, CONTRADA MALVITANI — la única dirección conocida de esta familia, y sale del acta de 1821"], ["Spouse", "CARMINA SPIZZIRRI, contadina († 11 de octubre de 1864) — confirmada por dos actas: la de Rosalia de 1838 y la suya propia de 1863"], ["Hijos documentados", "AQUILA, nacida el 22 de junio de 1821 y CONFIRMADA POR ACTA (Marano, acta 34), y ROSALIA, casada en 1838 y también confirmada por acta — Y SON LA MISMA MUJER: su expediente de boda de 1838 presenta el acta 34 de 1821 como partida de la novia. Por índice, además: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) y Francesca (1823). Y Francesco Giacomo, hijo suyo con seguridad"], ["Death", "6 de marzo de 1863, 8 h, en su propia casa — Marano Marchesato, acta 24"], ["Vivo en", "8 de diciembre de 1838, Marano Marchesato"]], "mapa": null, "sinacta": "", "padre": "lorenzo_palermo", "madre": "giulia_chiappetta", "conyuge": "carmina_spizzirri", "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "6 de marzo de 1863, 16 h (el acta); murió a las 8 h", "lugar": "Marano Marchesato", "ref": "acta 24", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 55 «Morti» 1863"], ["Registro", "hash del contenedor: wRlVKnp"], ["Página", "14 de 85, columna IZQUIERDA (a la derecha, el acta 25)"], ["Año manuscrito", "«mille ottocento sessantatre» — coincide con el catálogo"], ["Registrar", "Costantino Belmonte, sindaco; canciller Salvadore Spizzirri"], ["Cómo se localizó", "dos actas por imagen y número de orden IMPRESO en la cabecera; la recta es acta = 2 × página − 4, y el primer sondeo, en la página 14, cayó justo en las actas 24 y 25"]], "literal": "…è morto nella propria sua casa GIUSEPPE PALERMO sposo di Carmina Spizzirri, nato in Marano medesimo, figlio di fu Lorenzo di professione ——— domiciliato ———, e di fu Giulia Chiappetta domiciliata ——— di anni novanta di professione Bracciale domiciliato ivi.", "traduccion": "In the year eighteen hundred and sixty-three, on the SIXTH day of the month of MARCH, at sixteen hours, before Us, COSTANTINO BELMONTE, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIOVANNI CALDARAZZO, aged forty-three, by trade a PINTORE, of the kingdom, resident at Marano, and GAETANO ZICCARELLI, aged fifty, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the SIXTH day of the month of MARCH of the current year, at EIGHT hours, there died IN HIS OWN HOUSE GIUSEPPE PALERMO, HUSBAND OF CARMINA SPIZZIRRI, born in the said Marano, SON OF THE LATE LORENZO — by trade (blank), resident (blank) — AND OF THE LATE GIULIA CHIAPPETTA, resident (blank), AGED NINETY, by trade a BRACCIALE, resident in the same place.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained his actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, while the witnesses declared that they COULD NOT WRITE.", "notas": ["ES EL ACTA QUE AÑADE UNA GENERACIÓN POR EL LADO PALERMO. La defunción de su hijo Francesco Giacomo (Rende, 1867, acta 35) se cortaba en «figlio del fu Giuseppe» y no nombraba a la madre. Aquí, en cambio, el formulario de Marano rellena las dos casillas: LORENZO PALERMO y GIULIA CHIAPPETTA, los dos ya muertos en 1863. Confirma punto por punto lo que daba el índice del blog.", "NOVENTA AÑOS. Es la edad más alta de toda la genealogía y sitúa su nacimiento hacia 1773, en pleno Reino de Nápoles borbónico, treinta y seis años antes de que existiera el registro civil. Su partida de bautismo, si se conserva, está en la parroquia de S. Maria del Carmine de Marano.", "EL OFICIO CAMBIA, y no es un error. En 1838 el acta de matrimonio de su hija Rosalia lo llama PASTORE; aquí, veinticinco años después, BRACCIALE. A los noventa años ya no andaría con el ganado, y «bracciale» es la categoría por defecto del escribano de Marano. Su hijo Giacomo fue pecoraio toda la vida, que es lo mismo que pastore.", "LO QUE IDENTIFICA A ÉSTE Y NO A OTRO es «sposo di Carmina Spizzirri». En Marano conviven al menos ocho familias Palermo distintas; el nombre de pila solo no vale para nada.", "El primer declarante, Giovanni Caldarazzo, es PINTORE — pintor. Es un oficio poco común en estos registros, donde casi todo el mundo es bracciale o contadino."], "imgs": [{"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20Giuseppe%20Palermo%20-%20Marano%20Marchesato%20acta%2024.jpg", "t": "Giuseppe Palermo - Marano Marchesato acta 24"}], "zooms": [{"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20acta%2024%20completa.jpg", "t": "Acta 24 completa"}, {"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20hijo%20del%20fu%20Lorenzo%20y%20de%20la%20fu%20Giulia%20Chiappetta%2C%2090%20anos.jpg", "t": "Hijo del fu Lorenzo y de la fu Giulia Chiappetta, 90 anos"}]}], "nActas": 1, "nImgs": 3, "titulo": "From four words to two generations", "parrafos": ["For months everything known about him fitted into four words. On 14 May 1867 two neighbours from Rende with village trades — Pasquale Sacco, a carter, and Costantino Perugini, a tailor — reported the death of his son Giacomo Palermo, a shepherd. The parentage of the deceased was settled like this: «figlio del fu Giuseppe». A name, and nothing else. No mother, no village, no age.", "In August 2026 his own record turned up, and it is one of those that change a whole tree. He died on 6 March 1863 at eight in the morning, in his own house at Marano Marchesato, and record 24 puts him at *** NINETY YEARS OLD ***: the greatest age in this entire genealogy. And it names his parents — LORENZO PALERMO and GIULIA CHIAPPETTA, both already dead — so the line climbs at a stroke to people born around 1740-1750, thirty years before civil registration existed in Calabria.", "The trade comes and goes with the years, like his son's: bracciale in June 1821, when he registers his daughter Aquila's birth; pastore in December 1838, when he marries her off; and bracciale again when he dies. The only known address of this family comes from that 1821 record: contrada Malvitani, at Marano.", "One discrepancy remains unresolved, and it is better not to paper over it. The ninety years of 1863 place his birth around 1773; but in 1821, declaring for himself, he said he was forty, which would give 1781. Eight years apart. The 1821 figure comes from his own mouth and the 1863 one from two neighbours, so the first is probably the sound one."], "claves": [["Birth", "c. 1781 by his own declaration in 1821; c. 1773 by his death record"], ["Parents", "Lorenzo Palermo and Giulia Chiappetta — CONFIRMED by record"], ["Trade", "bracciale and pastore, depending on the year"], ["Address", "contrada Malvitani, Marano Marchesato"], ["Death", "6 March 1863, aged ninety — Marano, record 24"]]}, "carmina_spizzirri": {"id": "carmina_spizzirri", "nombre": "Carmina Spizzirri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman of Marano Marchesato, wife of Giuseppe Palermo. She was born around 1789 and died a widow on 11 October 1864. Her death record was sought precisely to get her parents out of it, and it is the one document in the tree that leaves those two boxes deliberately blank; her age is fixed better by the birth of her daughter Aquila in 1821 than by that record.", "datos": [["Birth", "hacia 1789, MARANO MARCHESATO — «nata in Marano medesimo». Los 32 años que declara su marido en 1821 dan 1789; los 70 del acta de defunción de 1864 darían 1794. Se prefiere la primera cifra"], ["Parents", "*** NO SE SABEN ***. El acta de 1864 dice «figlia del fu ———» y «della fu ———», con los dos nombres en blanco. Lo único que prueba es que en octubre de 1864 los dos ya habían muerto"], ["Trade", "CONTADINA (campesina)"], ["Spouse", "Giuseppe Palermo, pastore y bracciale († 6 de marzo de 1863)"], ["Hijas documentadas por acta", "AQUILA PALERMO, nacida el 22 de junio de 1821 (Marano, acta 34), y ROSALIA PALERMO, casada en diciembre de 1838 (acta 19). SON LA MISMA MUJER, no dos: lo demuestra su expediente de boda. Los índices de Marano le dan además otros hijos entre 1812 y 1823"], ["Viuda desde", "6 de marzo de 1863 — dieciocho meses de viudez"], ["Death", "11 de octubre de 1864, 11 h, en su propia casa — Marano Marchesato, acta 74"], ["Comprobado dos veces", "el 29 de agosto de 2026 se leyó también el índice de difuntos de Marano de 1864 en las transcripciones del blog calabrés: la fila del acta 74 trae sólo «Spizzirri» en la columna de padres, sin nombres, exactamente como el acta original. *** No hay error de nadie: los huecos están en el papel. *** La columna del cónyuge dice «Giuseppe Palermo», que es lo único que la identifica — porque en ese mismo índice hay OTRA Carmina Spizzirri, casada con un Giuseppe Pellegrino"]], "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "giuseppe_palermo", "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "12 de octubre de 1864, 15 h (el acta); murió el 11 a las 11 h", "lugar": "Marano Marchesato", "ref": "acta 74", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 56 «Morti» 1864"], ["Registro", "hash del contenedor: 0Aq9RaN"], ["Página", "39 de 60, columna IZQUIERDA (a la derecha, el acta 75)"], ["Año manuscrito", "«mille ottocento sessantaquattro» — coincide con el catálogo"], ["Registrar", "Gioacchino Conforti, sindaco; canciller Salvadore Spizzirri"], ["Cómo se localizó", "sondeo en la página 38 = actas 72 y 73; la recta acta = 2 × página − 4 pone la 74 en la página 39"]], "literal": "…è morta nella propria sua casa CARMINA SPIZZIRRI vedova di Giuseppe Palermo, nata in Marano medesimo, figlia del fu ————— di professione ——— domiciliato ———, e della fu ————— domiciliata ——— di anni settanta di professione Contadina domiciliata ivi.", "traduccion": "In the year eighteen hundred and sixty-four, on the TWELFTH day of the month of OCTOBER, at fifteen hours, before Us, GIOACCHINO CONFORTI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIULIO DE LUCA, aged forty, by trade an ARMIERE, of the kingdom, resident at Marano, and VINCENZO BELMONTE, aged thirty-three, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the ELEVENTH day of the month of OCTOBER of the current year, at ELEVEN hours, there died IN HER OWN HOUSE CARMINA SPIZZIRRI, WIDOW OF GIUSEPPE PALERMO, born in the said Marano, DAUGHTER OF THE LATE (name blank) — by trade (blank), resident (blank) — AND OF THE LATE (name blank), resident (blank), AGED SEVENTY, by trade a CONTADINA, resident in the same place.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained her actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, while the witnesses declared that they could not write.", "notas": ["SE FUE A ESTE ACTA A POR LOS PADRES, Y NO ESTÁN. Era el único sitio donde podían aparecer, porque el índice del blog no los da. La respuesta es negativa, pero es una negativa limpia y no una laguna de lectura: el impreso tiene las dos casillas, el escribano escribió los dos «fu» —«figlia DEL FU...», «e DELLA FU...»— y dejó los dos NOMBRES en blanco, con las rayas impresas sin rellenar. Sabía que estaban muertos y no sabía cómo se llamaban, o no se lo dijeron los declarantes.", "LO ÚNICO QUE SE SACA de esas dos líneas es que en octubre de 1864 el padre y la madre de Carmina ya habían muerto. Para los nombres ya sólo quedan los libros parroquiales de Marano anteriores a 1809 o su acta de matrimonio con Giuseppe Palermo, que es anterior a 1812 y por tanto también parroquial.", "*** ESTA NOTA QUEDÓ RESUELTA EL 26 DE AGOSTO DE 2026 — LÉASE SABIENDO CÓMO ACABA. *** El acta de nacimiento de su hija AQUILA (Marano, 22 de junio de 1821, acta 34) hace declarar a su marido que la madre tiene TREINTA Y DOS AÑOS. Eso la pone en 1789, no en 1794, y con 1789 tendría dieciocho años al nacer Francesco Giacomo, no trece. La objeción cronológica que sigue se cae. La edad de 1821 es mucho más fiable que la de 1864: la da su marido a los pocos días del parto; los setenta de 1864 los dieron un armero y un jornalero ante un cadáver.", "*** LA EDAD ABRE UN PROBLEMA SERIO [texto de agosto de 2026, antes de leer el acta de 1821]. *** Setenta años en octubre de 1864 la hacen nacer hacia 1794. Su marido, de noventa al morir en 1863, nació hacia 1773: veintiún años mayor. Y sobre todo, FRANCESCO GIACOMO PALERMO nació hacia 1805-1812 según las edades que él mismo fue declarando, con lo que Carmina habría tenido entre once y dieciocho años. Con los demás hijos la cosa encaja bien —Antonio Benedetto 1812, Francesca 1816, Vincenzo 1818, Aquila 1821, Francesca 1823: de los dieciocho a los veintinueve— pero Francesco Giacomo se queda fuera o justo al borde.", "CONSECUENCIA: que Carmina Spizzirri sea la MADRE de Francesco Giacomo deja de poder darse por bueno. Lo que sigue probado es que Giuseppe Palermo era su padre («figlio del fu Giuseppe», Rende 1867) y que Giuseppe estuvo casado con Carmina. Pero cabe perfectamente que Francesco Giacomo sea de un matrimonio ANTERIOR de Giuseppe, que hacia 1807 ya tenía treinta y tantos años. Lo resolvería el nacimiento de Francesco Giacomo (Marano, hacia 1807, parroquial) o el matrimonio de Giuseppe con Carmina.", "CIERRE DE ESA CONSECUENCIA: con los treinta y dos años de 1821, el matrimonio anterior de Giuseppe deja de hacer falta. Que Carmina sea la madre de Francesco Giacomo sigue sin estar probado —no hay documento que los nombre juntos— pero vuelve a ser lo más sencillo, y ya no choca con ninguna cuenta.", "El primer declarante, Giulio De Luca, es ARMIERE — armero. Otro oficio raro en un registro donde casi todos son bracciali."], "imgs": [{"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20Carmina%20Spizzirri%20-%20Marano%20Marchesato%20acta%2074.jpg", "t": "Carmina Spizzirri - Marano Marchesato acta 74"}], "zooms": [{"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20acta%2074%20completa.jpg", "t": "Acta 74 completa"}, {"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20filiacion%20en%20blanco%2C%20del%20fu%20y%20della%20fu%20sin%20nombres.jpg", "t": "Filiacion en blanco, del fu y della fu sin nombres"}]}], "nActas": 1, "nImgs": 3, "titulo": "The record that was sought and came back blank", "parrafos": ["Her death record was sought for a precise reason: it was the one place in the world where her parents' names could appear. The Calabrian blog's index did not give them, and above 1809 there is no civil registration in Calabria.", "The record turned up — Marano Marchesato, 12 October 1864, record 74 — and the answer is negative. The printed form says «figlia del fu ———» and «della fu ———», with both names left blank. *** It is the only document in the whole tree that leaves those two boxes deliberately empty. *** All it proves is that by October 1864 her father and mother were both dead.", "And it is not a gap in the reading. On 29 August 2026 it was checked by a second route: the Marano death index for 1864, transcribed by someone else, gives in the row for record 74 only «Spizzirri» in the parents column, with no names, exactly as the original does. *** The gaps are in the paper. ***", "What the record does give, and it is not nothing, is her identity. The spouse column says «Giuseppe Palermo», and that pins her down beyond error — because in that same index there is ANOTHER Carmina Spizzirri, married to a Giuseppe Pellegrino. She died on 11 October 1864 at eleven in the morning, at home, after eighteen months of widowhood.", "Her age, on the other hand, is better fixed by another document. The 1864 record puts her at seventy, which would give 1794; but in June 1821 her husband declared her thirty-two, which gives 1789. For her parents' names all that is left are the Marano parish books before 1809, or her marriage record."], "claves": [["Birth", "c. 1789 — the 1821 figure, more reliable than her own record's"], ["Parents", "*** STILL UNKNOWN ***: the record leaves both boxes blank"], ["What the record does prove", "that by October 1864 both her parents were dead"], ["How she is identified", "by the spouse column: there is another Carmina Spizzirri in the same index"], ["Death", "11 October 1864, aged seventy — Marano, record 74"]]}, "vincenzo_volpintesta": {"id": "vincenzo_volpintesta", "nombre": "Vincenzo Volpintesta", "legal": "VOLPENTESTA en las actas de Marano; Volpintesta en las de Rende", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer from Marano Marchesato, father of Carmina Volpintesta. He was born around 1773 and died at home on 19 March 1823, aged fifty, when his daughter Carmina was eight. His death record gives his father's name: Michele.", "datos": [["Birth", "hacia 1773, MARANO MARCHESATO — «nato in Marano suddetto». El acta de nacimiento de su hija, de 1814, le da treinta y ocho años, que apuntarían más bien a 1776; las edades declaradas son aproximadas"], ["Parents", "MICHELE VOLPENTESTA, bracciale, ya difunto en 1823 — CONFIRMADO por acta. La MADRE NO SE NOMBRA: esa casilla del acta quedó en blanco"], ["Trade", "BRACCIALE (jornalero) — el mismo que su padre"], ["Spouse", "TERESA LUCHETTA († 6 de junio de 1851) — CONFIRMADA por acta desde agosto de 2026, por las dos puntas: él es «sposo di Teresa Luchetta» en 1823 y ella «vedova di Vincenzo Volpentesta» en 1851"], ["Hijos documentados", "CARMINA (12 de mayo de 1814), la que casó con Francesco Giacomo Palermo; y EMMANUELE, casado con Michelina Cairo, muerto en 1864 (acta 11 del índice de Marano)"], ["Death", "19 de marzo de 1823, 12 h, en su propia casa — Marano Marchesato, acta 8"]], "mapa": null, "sinacta": "", "padre": "michele_volpintesta", "madre": null, "conyuge": "teresa_luchetta", "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "19 de marzo de 1823, 18 h (el acta); murió a las 12 h", "lugar": "Marano Marchesato", "ref": "acta 8", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 15 «Morti» 1823"], ["Registro", "hash del contenedor: 5Y44mlm"], ["Página", "6 de 33, columna IZQUIERDA (a la derecha, el acta 9)"], ["Año manuscrito", "«mille ottocento ventitre» — coincide con el catálogo"], ["Registrar", "Raffaele Ruffolo, sindaco"], ["Cómo se localizó", "este registro no lleva índice alfabético. Un sondeo en la página 5 dio las actas 6 y 7, de donde sale la recta acta = 2 × página − 4 y la 8 en la página siguiente"]], "literal": "…è morto nella propria sua casa VINCENZO VOLPENTESTA, nato in Marano suddetto, figlio del fu Michele di professione Bracciale domiciliato ———, e di ————— domiciliata ————— di anni cinquanta di professione Bracciale domiciliato ivi, e sposo di Teresa Luchetta.", "traduccion": "In the year eighteen hundred and twenty-three, on the NINETEENTH day of the month of MARCH, at eighteen hours, before Us, RAFFAELE RUFFOLO, mayor and registrar of the civil status of the Comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared NICOLA ROSSO, aged forty, by trade a BRACCIALE, of the kingdom, resident at Marano, and ANTONIO CAIRO, aged thirty-eight, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the NINETEENTH day of the month of MARCH of the current year, at TWELVE hours, there died IN HIS OWN HOUSE VINCENZO VOLPENTESTA, born in the said Marano, SON OF THE LATE MICHELE, by trade a BRACCIALE, resident (blank), AND OF (name blank), resident (blank), AGED FIFTY, by trade a BRACCIALE, resident in the same place, AND HUSBAND OF TERESA LUCHETTA.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained his actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, and signed with a CROSS by the witnesses, who are unlettered.", "notas": ["«E SPOSO DI TERESA LUCHETTA» ES LA LÍNEA QUE LO IDENTIFICA. En Marano viven a la vez al menos cuatro o cinco Vincenzo Volpintesta —uno casado con Arcangela Bartelli, otro con Rosa Mancino, otro hijo de Antonio y Francesca Morrone, otro hijo de Ferdinando y Anna Maria Tenuta—. El nombre suelto no vale; el cónyuge sí. Y encaja con el acta de nacimiento de Carmina de 1814, donde declara él mismo y nombra a Teresa Luchetta.", "EL PADRE, SÍ: «figlio del FU MICHELE di professione BRACCIALE». Confirma lo que daba el índice y añade el oficio, que se hereda: Michele bracciale, Vincenzo bracciale.", "LA MADRE, NO. El índice del blog daba a Vincenzo por hijo de Michele y de TERESA TENUTA. El acta tiene la casilla —«e di ————— domiciliata —————»— y el escribano la dejó vacía. Teresa Tenuta sigue, por tanto, sin ningún respaldo documental, y por eso no se le ha abierto ficha en este árbol. Ojo además con que en el mismo pueblo hay otro Vincenzo Volpintesta hijo de Ferdinando y de ANNA MARIA TENUTA: el apellido de esa madre es el mismo, y la familia no.", "CINCUENTA AÑOS al morir, o sea nacido hacia 1773. El acta de nacimiento de su hija Carmina, de mayo de 1814, le daba treinta y ocho, que darían 1776. Tres años de diferencia es lo normal en estos registros; ninguna de las dos cifras es un censo.", "MURIÓ JOVEN Y DEJÓ HUÉRFANA A CARMINA A LOS OCHO AÑOS. Ella nació en mayo de 1814 y él murió en marzo de 1823. Teresa Luchetta quedó viuda con treinta y tantos años y así siguió veintiocho años más, hasta 1851: en su acta de defunción todavía la llaman «vedova di Vincenzo Volpentesta».", "La cabecera del acta lleva el mes TACHADO —el escribano venía arrastrando «Febbrajo» de las actas anteriores— y corregido. El cuerpo del acta dice MARZO dos veces, sin duda.", "*** 29 DE AGOSTO DE 2026 — HA APARECIDO UN BAUTIZO QUE PODRÍA SER EL SUYO, Y HAY QUE CONTAR TAMBIÉN LO QUE NO CUADRA. *** Su padre Michele murió en RENDE en 1793, así que sus hijos tenían que estar bautizados allí. Los libros de bautizos de la parroquia de Rende empiezan en 1731 y están transcritos, año por año, en el blog calabrés que ya teníamos descargado en disco. Se barrieron. Y en el de 1770 está esto: RENDE, BAUTIZOS DE 1770, ACTA 48 — VINCENZO MERCURIO VOLPINTESTA, «Volpintesta, Michele — Tenuta, Teresa».\n\nEncaja en cuatro cosas: el nombre, el padre MICHELE —lo único que su acta de defunción dice de sus padres—, la madre TERESA TENUTA —que es justamente la casilla que esa acta dejó en blanco— y el pueblo. Y tiene dos hermanos en las mismas tablas: PIETRO GAETANO (bautizos de 1767, acta 13) y GREGORIO GIOACCHINO (bautizos de 1773, acta 41), los dos hijos de la misma pareja. La familia estaba en Rende en 1767, en 1770 y en 1773.\n\n*** PERO SU PROPIA ACTA DE DEFUNCIÓN DICE QUE NACIÓ EN MARANO: «nato in Marano suddetto». Y las edades no cuadran: la de 1823 le da cincuenta años (nacido hacia 1773) y el acta de su hija Carmina, de 1814, le da treinta y ocho (nacido hacia 1776). El bautizo es de 1770. *** Las dos lecturas honradas son: o es él, y las edades vienen redondeadas —las declararon dos jornaleros iletrados cincuenta y tres años después, y el «nacido en Marano» pudo ser una suposición del escribano—, o es un hermano mayor muerto de niño cuyo nombre se repitió, que era costumbre corriente. A favor de la primera: en los bautizos de Rende de 1774 a 1783, barridos uno a uno, NO hay ningún otro hijo de Michele y Teresa Tenuta ni un segundo Vincenzo; y de Marano no existen libros anteriores a 1809 en ningún sitio consultable.\n\n*** NO SE DA POR BUENO. *** Es una transcripción hecha por otra persona, no el libro. Y el libro no está en Antenati —el fondo de Rende empieza en 1809 y esto es parroquial de 1770—: está en una película de FamilySearch. Para comprobarlo hay que pedir allí los BAUTIZOS de la parroquia de RENDE (Cosenza), AÑO 1770, ACTA 48."], "imgs": [{"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20Vincenzo%20Volpintesta%20-%20Marano%20Marchesato%20acta%208.jpg", "t": "Vincenzo Volpintesta - Marano Marchesato acta 8"}], "zooms": [{"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20acta%208%20completa.jpg", "t": "Acta 8 completa"}, {"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20copia%20certificada%20de%201837%2C%20la%20madre%20sigue%20en%20blanco.jpg", "t": "Copia certificada de 1837, la madre sigue en blanco"}, {"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20hijo%20del%20fu%20Michele%2C%20edad%2050%20y%20esposo%20de%20Teresa%20Luchetta.jpg", "t": "Hijo del fu Michele, edad 50 y esposo de Teresa Luchetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "Fifty years old, and his father's name", "parrafos": ["He entered this tree sideways, in a record that was not his. The death record of his son-in-law Giacomo Palermo (Rende, 14 May 1867) said he was the «marito di Carmina Volpintesta fu Vincenzo»: four words written for something else that proved two, that Carmina's father was called Vincenzo and that he was already dead.", "In August 2026 his own record turned up and the detour is no longer needed. He died on 19 March 1823 at midday, at his house in Marano Marchesato, aged fifty, when his daughter Carmina was eight. Record 8 gives his trade — bracciale, day labourer — and his father's name: *** «figlio del FU MICHELE di professione BRACCIALE» ***. The trade was inherited: Michele bracciale, Vincenzo bracciale. The mother, though, is not named: that box was left blank, as in so many others across the district.", "There is a detail that makes that record indispensable and no other. At Marano there live at the same time at least four or five Vincenzo Volpintestas — one married to Arcangela Bartelli, another to Rosa Mancino, another the son of Antonio and Francesca — and without a line to tell them apart any of them would do. The one that identifies him is «e sposo di TERESA LUCHETTA».", "She outlived him by twenty-eight years, and her own record, of 1851, calls her «vedova di Vincenzo Volpentesta». The marriage is confirmed from both ends."], "claves": [["Birth", "c. 1773 by his own record; c. 1776 by his daughter's in 1814"], ["Father", "Michele Volpentesta, bracciale, already dead in 1823 — CONFIRMED by record"], ["Mother", "not named: the box was left blank"], ["How he is told apart", "by his wife: there are several Vincenzo Volpintestas at Marano at once"], ["Death", "19 March 1823, aged fifty — Marano, record 8"]]}, "teresa_luchetta": {"id": "teresa_luchetta", "nombre": "Teresa Luchetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman of Marano Marchesato, wife of Vincenzo Volpentesta and mother of Carmina. She was born around 1779 and died on 6 June 1851, aged seventy-two, after twenty-eight years of widowhood. Until August 2026 she was the only person in the tree without a single document; she now has a record of her own and both parents named.", "datos": [["Birth", "hacia 1779, MARANO MARCHESATO — «nata in Marano suddetto», por los setenta y dos años que le da el acta de defunción. El acta de su hija, de 1814, le daba treinta y un años, que apuntarían a 1783"], ["Parents", "GIO: ANTONIO LUCHETTA, bracciale, y MARIANNA CONFORTI, los dos ya difuntos en 1851 — CONFIRMADOS por acta original desde agosto de 2026"], ["Trade", "CONTADINA (campesina)"], ["Spouse", "VINCENZO VOLPENTESTA, bracciale († 19 de marzo de 1823) — CONFIRMADO por acta"], ["Hijos documentados", "CARMINA (12 de mayo de 1814) y EMMANUELE, casado con Michelina Cairo, muerto en 1864"], ["Viuda desde", "marzo de 1823 — veintiocho años de viudez"], ["Death", "6 de junio de 1851, 8 h, en su propia casa — Marano Marchesato, acta 44"]], "mapa": null, "sinacta": "", "padre": "antonio_luchetta", "madre": "marianna_conforti", "conyuge": "vincenzo_volpintesta", "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "6 de junio de 1851, 15 h (el acta); murió a las 8 h", "lugar": "Marano Marchesato", "ref": "acta 44", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 43 «Morti» 1851"], ["Registro", "hash del contenedor: 5Y46Aky"], ["Página", "24 de 51, columna IZQUIERDA (a la derecha, el acta 45)"], ["Año manuscrito", "«mille ottocento cinquantuno» — coincide con el catálogo"], ["Registrar", "Ferdinando Conforti, sindaco — el mismo que inscribió a su nieta Teresa Palermo en enero de 1852"], ["Cómo se localizó", "sondeo en la página 23 = actas 42 y 43, con el número de orden impreso en la cabecera; la 44 cae en la página 24"]], "literal": "…è morta nella propria sua casa TERESA LUCHETTA, nata in Marano suddetto, figlia del fu Gio: Antonio di professione Bracciale domiciliato ———, e della fu Marianna Conforti domiciliata ——— di anni settantadue di professione Contadina domiciliata ivi, vedova di Vincenzo Volpentesta.", "traduccion": "In the year eighteen hundred and fifty-one, on the SIXTH day of the month of JUNE, at fifteen hours, before Us, FERDINANDO CONFORTI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared IGNAZIO CONFORTI, aged fifty, by trade a BRACCIALE, of the kingdom, resident there, and GIUSEPPE ZUPPO, aged twenty-eight, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the SIXTH day of the month of JUNE of the current year, at EIGHT hours, there died IN HER OWN HOUSE TERESA LUCHETTA, born in the said Marano, DAUGHTER OF THE LATE GIO: ANTONIO, by trade a BRACCIALE, resident (blank), AND OF THE LATE MARIANNA CONFORTI, resident (blank), AGED SEVENTY-TWO, by trade a CONTADINA, resident in the same place, WIDOW OF VINCENZO VOLPENTESTA.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained her actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above. The witnesses declared that they COULD NOT WRITE.", "notas": ["ES LA MEJOR DE LAS CINCO ACTAS DE ESTA TANDA. Da el cónyuge, los dos padres, la edad y el oficio, todo en el mismo párrafo, y confirma punto por punto lo que hasta ahora era una línea de índice de blog sin ningún respaldo.", "DE NO TENER NADA A TENERLO TODO. En agosto de 2026 se había escrito de ella que era «el único de los cuatro ascendientes sin papeles que sigue exactamente igual que estaba» y que «de Teresa Luchetta no hay hoy absolutamente nada, sólo un nombre heredado de un índice de blog». Este acta lo cancela entero.", "«FIGLIA DEL FU GIO: ANTONIO». El acta escribe la abreviatura corriente de GIOVANNI ANTONIO, no un «Antonio» a secas como daba el índice. Y le pone oficio: bracciale.", "«E DELLA FU MARIANNA CONFORTI». La madre, con nombre y apellido. Que un acta de Marano nombre a la madre no es cosa segura: la de su marido Vincenzo, de 1823, dejó esa casilla en blanco, y la de Carmina Spizzirri, de 1864, dejó en blanco las dos.", "CUADRA POR UNA SEGUNDA VÍA. El índice de defunciones de Marano de 1834, acta 17, trae un ANTONIO LUCHETTA «di Antonio e Conforti Marianna», casado con Caterina Cosentino: un hermano suyo. Dos documentos independientes dando el mismo matrimonio de padres.", "SETENTA Y DOS AÑOS, o sea nacida hacia 1779. El acta de nacimiento de su hija Carmina, de mayo de 1814, le daba treinta y un años, que darían 1783. Cuatro años de diferencia, dentro de lo corriente. Enviudó hacia los cuarenta y cuatro y vivió viuda veintiocho años más.", "Murió siete meses antes de que naciera su bisnieta Teresa Palermo, a la que inscribió el mismo alcalde, Ferdinando Conforti, en enero de 1852."], "imgs": [{"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20Teresa%20Luchetta%20-%20Marano%20Marchesato%20acta%2044.jpg", "t": "Teresa Luchetta - Marano Marchesato acta 44"}], "zooms": [{"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20acta%2044%20completa.jpg", "t": "Acta 44 completa"}, {"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20hija%20del%20fu%20Gio%20Antonio%20y%20de%20la%20fu%20Marianna%20Conforti.jpg", "t": "Hija del fu Gio Antonio y de la fu Marianna Conforti"}]}], "nActas": 1, "nImgs": 3, "titulo": "From having nothing to having everything", "parrafos": ["Her name came from a single place, and that place turned out not to exist. She was credited to a marriage banns record at Marano Marchesato in 1837, for the wedding of her daughter Carmina to Francesco Giacomo Palermo. It was searched for and it is not there: the 1837 register carries an alphabetical index at the end, with its twenty-five weddings one by one, and there is not a single Palermo or Volpintesta; the dossier file for that year, two hundred and thirty-five pages long, corresponds exactly to those twenty-five and leaves no room for a twenty-sixth. The wedding was at Rende, not at Marano.", "For a time she was therefore the only person in the tree without a single document. It was even written of her that she was «the only one of the four undocumented forebears still exactly where she was».", "*** And then her record appeared, and it turned out to be the best of the whole batch. *** Marano Marchesato, 6 June 1851, record 44. She died at eight in the morning in her own house, aged seventy-two, after twenty-eight years of widowhood. In a single paragraph the form gives the spouse — «vedova di Vincenzo Volpentesta» — the age, the trade of contadina and *** BOTH PARENTS: GIO: ANTONIO LUCHETTA, bracciale, and MARIANNA CONFORTI ***, both already dead. It is rare for these records to name the mother; this one does.", "With that, two more names of the 1740-1760 generation enter the tree, and the woman who had nothing became the one who gives most. Her own birth, around 1779, is now out of reach by the civil route: only the books of the parish of S. Maria del Carmine at Marano would hold it."], "claves": [["Birth", "c. 1779 by her own record; c. 1783 by her daughter's in 1814"], ["Parents", "Gio: Antonio Luchetta and Marianna Conforti — CONFIRMED by record"], ["Trade", "contadina, countrywoman"], ["Widowed since", "March 1823 — twenty-eight years of widowhood"], ["Death", "6 June 1851, aged seventy-two — Marano, record 44"]]}, "raffaele_chiappetta": {"id": "raffaele_chiappetta", "nombre": "Raffaele Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer born in Castrolibero around 1805. Father of Giovanni Chiappetta and therefore great-grandfather of the Argentine Salernos. He died a widower at Rende, contrada Surdo, on 3 December 1880, aged seventy-five, one year less twelve days after his wife.", "datos": [["Birth", "hacia 1805, CASTROLIBERO — por los 75 años que le da el acta de defunción"], ["Parents", "Pietro Chiappetta, bracciante, que vivió y murió en Castrolibero; la madre NO consta en el acta, sólo que ya había muerto"], ["Trade", "bracciale / bracciante (jornalero)"], ["Spouse", "Teresa Molinaro († 19 de diciembre de 1879) — muere «vedovo di» ella"], ["Hijos documentados", "Giovanni (hacia 1848); probablemente también Pasquale, que en 1883 declara 28 años, y Vincenzo y Pietro, testigos en Rende"], ["Residence", "Rende, contrada Surdo"], ["Death", "3 de diciembre de 1880, 15 h, Rende — acta 135, con 75 años"]], "mapa": null, "sinacta": "", "padre": "pietro_chiappetta", "madre": null, "conyuge": "teresa_molinaro", "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "3 de diciembre de 1880, 15 h", "lugar": "Rende", "ref": "acta 135", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 72 «Morti» 1880"], ["Registro", "hash del contenedor: LyxaZkV"], ["Página", "35 de 42"], ["Colocación", "columna derecha, mitad superior de la apertura"], ["Año manuscrito", "«milleottocento ottanta» — coincide con el catálogo"], ["Registrar", "Martino Vincenzo, asesor anciano por el alcalde"]], "literal": "…è morto Chiappetta Raffaele di anni settantacinque, di bracciante, residente in\nRende, nato in Castrolibero, da fu Pietro, bracciante, domiciliato in detto\nCastrolibero, e da fu ————, domiciliata in ————, vedovo di Molinaro Teresa.", "traduccion": "In the year eighteen hundred and eighty, on the fourth day of December, at ten in the morning, at the town hall.\n\nBefore me, MARTINO VINCENZO, senior assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared BRUNO SALVATORE, aged thirty, bracciante, resident at Rende, and STELLATO ANDREA, aged thirty-seven, bracciante, resident at Rende.\n\nWho declared to me that at three in the afternoon YESTERDAY, in the house situated in CONTRADA SURDO, there died CHIAPPETTA RAFFAELE, AGED SEVENTY-FIVE, by trade a BRACCIANTE (day labourer), resident at Rende, BORN AT CASTROLIBERO, SON OF THE LATE PIETRO, bracciante, resident in the said Castrolibero, AND OF THE LATE ———— (the name is left blank), WIDOWER OF MOLINARO TERESA.\n\nPresent at this act as witnesses were ROSSA LUIGI (uncertain reading), aged sixty-six, MURATORE (stonemason), and ROSSA GIUSEPPE, aged thirty-seven, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, they being illiterate. — Vincenzo Martino.", "notas": ["LA EDAD, QUE ES LO QUE SE BUSCABA. Setenta y cinco años el 3 de diciembre de 1880: nació hacia 1805, seguramente en 1805 y no más tarde. Es el ascendiente de nacimiento más antiguo alcanzado por esta línea después de Giuseppe Palermo.", "NACIÓ EN CASTROLIBERO. Se sospechaba por el matrimonio de su hijo Giovanni, que declaró haber nacido allí; el acta lo confirma directamente para el padre. La familia Chiappetta es de Castrolibero y sólo después baja a Rende.", "EL PADRE: PIETRO CHIAPPETTA, «fu Pietro, bracciante, domiciliato in detto Castrolibero». El índice ya lo daba y el acta original lo confirma, y además añade su oficio y que vivió en Castrolibero. El «fu» dice que había muerto antes de diciembre de 1880.", "LA MADRE SIGUE SIN NOMBRE. El formulario tiene su casilla —«e da ______ domiciliata in ______»— y el escribano escribió sólo «fu» y dejó el nombre en blanco. No es un descuido de lectura: en la misma línea del padre sí puso nombre y oficio. El dato no existe en el acta. Lo único que se saca es que ella también había muerto ya.", "«VEDOVO DI MOLINARO TERESA». Murió viudo: su mujer se le había adelantado once meses y medio, el 19 de diciembre de 1879. Y el apellido se escribe MOLINARO, no «Mulinaro».", "Los dos vivían en CONTRADA SURDO, la misma en la que morirá Carmina Ricchio tres años después. Las dos familias consuegras eran vecinas."], "imgs": [{"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20Raffaele%20Chiappetta%20-%20Rende%20acta%20135.jpg", "t": "Raffaele Chiappetta - Rende acta 135"}], "zooms": [{"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%2075%20anos%2C%20nacido%20en%20Castrolibero%2C%20hijo%20del%20fu%20Pietro.jpg", "t": "75 anos, nacido en Castrolibero, hijo del fu Pietro"}, {"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20acta%20135%20completa.jpg", "t": "Acta 135 completa"}, {"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20declarantes%20Bruno%20Salvatore%20y%20Stellato%20Andrea.jpg", "t": "Declarantes Bruno Salvatore y Stellato Andrea"}]}], "nActas": 1, "nImgs": 4, "titulo": "Eleven months a widower", "parrafos": ["He was born at Castrolibero around 1805 — his death record's seventy-five years say so — and he is the earliest-born ancestor this line reaches by document. A day labourer, like his father Pietro and like almost every man in the tree.", "His wife, Teresa Molinaro, died on 19 December 1879 in the contrada Surdo at Rende. He died in the same contrada on 3 December 1880, at three in the afternoon, eleven and a half months later; the record calls him «vedovo di Molinaro Teresa». Two village day labourers went to report it, Bruno Salvatore, thirty, and Stellato Andrea, thirty-seven. The witnesses were a stonemason of sixty-six and a day labourer of thirty-seven. Nobody signed but the registrar, Vincenzo Martino.", "The record names his father — «da fu Pietro, bracciante, domiciliato in detto Castrolibero» — and leaves the mother's box blank. Of his children, the documented one is Giovanni, born around 1848; probably also a Pasquale who in 1883 declares himself twenty-eight, and the Vincenzo and Pietro Chiappetta who appear as witnesses on family records. That last is inference from ages and surname, not proof."], "claves": [["Trade", "bracciante, day labourer"], ["Born", "c. 1805 at Castrolibero"], ["Contrada", "Surdo, at Rende"], ["Could sign", "no"], ["Death", "3 December 1880, aged 75"]]}, "teresa_molinaro": {"id": "teresa_molinaro", "nombre": "Teresa Molinaro", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman born in Marano Principato around 1819, mother of Giovanni Chiappetta. She died at Rende, contrada Surdo, on 19 December 1879, aged sixty. Her death was reported by her son's father-in-law, Domenico Massei.", "datos": [["Birth", "hacia 1819, MARANO PRINCIPATO — por los 60 años que le da el acta de defunción"], ["Parents", "NINGUNO DE LOS DOS se nombra en el acta; sólo dice que ambos habían muerto ya"], ["Trade", "contadina (campesina)"], ["Spouse", "Raffaele Chiappetta († 3 de diciembre de 1880), que le sobrevivió once meses"], ["Son", "Giovanni Chiappetta (hacia 1848)"], ["Residence", "Rende, contrada Surdo"], ["Death", "19 de diciembre de 1879, 13 h, Rende — acta 94, con 60 años"]], "mapa": null, "sinacta": "", "padre": "carmine_molinaro", "madre": "carmina_covello", "conyuge": "raffaele_chiappetta", "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "19 de diciembre de 1879, 13 h", "lugar": "Rende", "ref": "acta 94", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 71 «Morti» 1879"], ["Registro", "hash del contenedor: 5x2ENZg"], ["Página", "24 de 29"], ["Colocación", "columna izquierda, mitad inferior de la apertura"], ["Año manuscrito", "«milleottocentosettantanove» — coincide con el catálogo"], ["Registrar", "Martino Vincenzo, asesor anciano por el alcalde"]], "literal": "…è morta Molinaro Teresa di anni sessanta, contadina, residente in Rende, nata in\nMarano Principato, da fu ————, domiciliato in ————, e dalla fu ————,\ndomiciliata in ————, moglie di Chiappetta Raffaele.", "traduccion": "In the year eighteen hundred and seventy-nine, on the twentieth day of December, at ten in the morning, at the town hall.\n\nBefore me, MARTINO VINCENZO, senior assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared MASSEI DOMENICO, aged some fifty-odd years (the figure is written in very faint ink), BRACCIALE, resident at Rende, and DE RANGO GASPARE (probable reading), aged sixty-eight, bracciale, resident at Rende.\n\nWho declared to me that at one in the afternoon YESTERDAY, in the house situated in CONTRADA SURDO, there died MOLINARO TERESA, AGED SIXTY, CONTADINA (countrywoman), resident at Rende, BORN AT MARANO PRINCIPATO, daughter of the LATE ———— and of the LATE ———— (both names are left blank), WIFE OF CHIAPPETTA RAFFAELE.\n\nPresent at this act as witnesses were CHIANELLO GAETANO, aged fifty, bracciale, and BENA SERAFINO (uncertain reading), aged thirty, bracciale, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, they being illiterate. — Vincenzo Martino.", "notas": ["SESENTA AÑOS EN DICIEMBRE DE 1879: nació hacia 1819. Tuvo a Giovanni con unos veintinueve.", "NACIÓ EN MARANO PRINCIPATO, no en Castrolibero. Es un pueblo nuevo en este árbol, y conviene no confundirlo con Marano Marchesato, de donde venían los Palermo: son dos municipios distintos y vecinos. Curiosamente Carmina Ricchio, la otra abuela, también nació en Marano Principato.", "EL ACTA NO NOMBRA A NINGUNO DE SUS PADRES. El índice daba Carmine Mulinaro y Carmina Covello; el original no confirma ni a uno ni a otro. En las dos casillas el escribano escribió «fu» y dejó el nombre en blanco. De modo que esos dos nombres siguen apoyándose sólo en el índice.", "LO QUE SÍ APORTA: ese doble «fu» dice que en diciembre de 1879 sus dos padres ya habían muerto. Si nació hacia 1819, sus padres serían de hacia 1790-1795.", "EL APELLIDO ES MOLINARO. Lo escribe así el cuerpo del acta, el epígrafe del margen («Molinaro Teresa») y el índice anual del propio registro. El «Mulinaro» del índice moderno es una deformación. Coincide con la lectura del matrimonio de su hijo en 1873.", "EL PRIMER DECLARANTE ES SU CONSUEGRO. Quien va al ayuntamiento a declarar la muerte es MASSEI DOMENICO — el padre de Angela Massei, con cuya hija se había casado el hijo de la difunta seis años antes. Es la prueba de que las dos familias vivían pegadas y de que el parentesco del índice es real. Él mismo morirá en 1891 y su acta está también aquí.", "El segundo declarante se lee DE RANGO GASPARE. De Rango es precisamente el apellido de expósito con que los Salerno estaban inscritos en Castrolibero. Puede ser casualidad —es apellido frecuentísimo en la zona— pero queda anotado."], "imgs": [{"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20Teresa%20Molinaro%20-%20Rende%20acta%2094.jpg", "t": "Teresa Molinaro - Rende acta 94"}], "zooms": [{"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%2060%20anos%2C%20nacida%20en%20Marano%20Principato%2C%20padres%20sin%20nombre.jpg", "t": "60 anos, nacida en Marano Principato, padres sin nombre"}, {"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20acta%2094%20completa.jpg", "t": "Acta 94 completa"}, {"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20declarantes%20Massei%20Domenico%20y%20De%20Rango%20Gaspare.jpg", "t": "Declarantes Massei Domenico y De Rango Gaspare"}]}], "nActas": 1, "nImgs": 4, "titulo": "Reported by her son's father-in-law", "parrafos": ["She died on 19 December 1879, at one in the afternoon, in the contrada Surdo at Rende, aged sixty. She had been born around 1819 at Marano Principato, a village that did not figure in this tree until that reading.", "The man who went to the town hall to report it, at ten the following morning, was neither a son nor an ordinary neighbour: it was Massei Domenico, a day labourer, the father of Angela Massei — that is, the father-in-law of her son Giovanni. His age is written in ink so faint that all one can read is «fifty-something». With him was a sixty-eight-year-old day labourer whose surname probably reads De Rango: the same foundling surname Michele Salerno used at Castrolibero, though nothing proves any kinship.", "The record spells MOLINARO, with an o, as do the marginal heading and the register's annual index. And it leaves both parents' boxes blank, so the names the indexes give — Carmine Molinaro and Carmina Covello — remain unsupported. Her husband outlived her by eleven and a half months and died in the same contrada."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1819 at Marano Principato"], ["Contrada", "Surdo, at Rende"], ["Death", "19 December 1879, aged 60"], ["Who reported it", "her son's father-in-law, Domenico Massei"]]}, "domenico_massei": {"id": "domenico_massei", "nombre": "Domenico Massei", "legal": "Mazzei Domenico en sus dos últimas actas", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer BORN IN RENDE around 1821, father of Angela Massei. He was widowed in 1883 and died a widower on 8 November 1891, in contrada Saporito, aged seventy. One of the two witnesses on his record is his son-in-law, Giovanni Chiappetta.", "datos": [["Birth", "hacia 1821, RENDE — por los 70 años que le da el acta de defunción"], ["Parents", "Filippo Mazzei, bracciante, domiciliado en Rende († antes de 1891); la madre NO se nombra, sólo que había muerto y que vivió en Rende"], ["Trade", "bracciale / bracciante (jornalero)"], ["Spouse", "Carmina Ricchio († 11 de diciembre de 1883) — muere «vedovo di» ella"], ["Daughter", "Angela Massei (hacia 1858, Castrolibero)"], ["Contradas", "Surdo en 1883 (con su mujer); Saporito al morir en 1891"], ["Death", "8 de noviembre de 1891, 14 h, Rende — acta 112, con 70 años"], ["Grafía", "MASSEI en 1873 y 1879; MAZZEI en 1883 y 1891 — cambia con el escribano"]], "mapa": null, "sinacta": "", "padre": "filippo_massei", "madre": null, "conyuge": "carmina_ricchio", "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "8 de noviembre de 1891, 14 h", "lugar": "Rende", "ref": "acta 112", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 83 «Morti» 1891"], ["Registro", "hash del contenedor: wQ9a7O8"], ["Página", "29 de 42"], ["Colocación", "columna derecha, mitad inferior de la apertura"], ["Año manuscrito", "«milleottocento novantuno» — coincide con el catálogo"], ["Registrar", "Mercavallo Gabriele (lectura dudosa), secretario delegado por acta del alcalde de 19 de septiembre de 1884"]], "literal": "…è morto Mazzei Domenico di anni settanta, bracciante, residente in Rende, nato in\nRende, dal fu Filippo, bracciante, domiciliato in Rende, e dalla fu ————,\ndomiciliata in Rende — Vedovo di Ricchio Carmina.", "traduccion": "In the year eighteen hundred and ninety-one, on the ninth day of November, at eleven in the morning, at the town hall.\n\nBefore me, MERCAVALLO GABRIELE (uncertain reading), Secretary delegated by act of the Mayor of the nineteenth of September eighteen hundred and eighty-four, Registrar of the Civil Status of the comune of Rende, there appeared RICCHIO ANTONIO, aged fifty-six, bracciante, resident at Rende, and TURCO PIETRO, aged twenty-six, bracciante, resident at Rende.\n\nWho declared to me that at two in the afternoon YESTERDAY, in the house situated in CONTRADA SAPORITO, there died MAZZEI DOMENICO, AGED SEVENTY, BRACCIANTE, resident at Rende, BORN AT RENDE, SON OF THE LATE FILIPPO, bracciante, resident at Rende, and of the LATE ———— (the name is left blank), who had been resident at Rende. WIDOWER OF RICCHIO CARMINA.\n\nPresent at this act as witnesses were TURCO PASQUALE, aged thirty-seven, bracciante, and GIOVANNI CHIAPPETTA, aged forty-three, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the others being illiterate. — Gabriele Mercavallo.", "notas": ["SETENTA AÑOS EN NOVIEMBRE DE 1891: nació hacia 1821.", "NACIÓ EN RENDE, y esto corrige lo que se venía suponiendo. Se le tenía por hombre de Castrolibero porque su hija Angela nació allí; pero él es de Rende. La familia se movió: él nace en Rende, su hija nace en Castrolibero hacia 1858, y en 1873 están otra vez todos en Rende.", "EL PADRE: FILIPPO, bracciante, domiciliado en Rende. El índice lo daba y el acta lo confirma, añadiendo oficio y pueblo. El «fu» dice que ya había muerto en 1891.", "LA MADRE, OTRA VEZ SIN NOMBRE — pero con un detalle que las otras tres actas no dan: el escribano dejó el nombre en blanco Y SIN EMBARGO rellenó la casilla siguiente, «domiciliata in Rende». Sabía dónde había vivido y no supo cómo se llamaba. También ella había muerto ya.", "EL TESTIGO ES SU YERNO. «Giovanni Chiappetta, di anni quarantatre, bracciante»: es el marido de su hija Angela y el padre de Filomena. Cuarenta y tres años en noviembre de 1891 lo sitúa en 1848, exactamente donde lo ponen su matrimonio de 1873 (25 años) y el nacimiento de Filomena en 1877 (29 años). Tres actas independientes, la misma fecha.", "EL PRIMER DECLARANTE ES UN RICCHIO: Ricchio Antonio, de cincuenta y seis años. Casi con seguridad familia de su mujer difunta.", "EL APELLIDO SE ESCRIBE AQUÍ MAZZEI, con doble zeta bien marcada, igual que en el acta de su mujer de 1883. En cambio en el matrimonio de su hija de 1873 y en el acta de Teresa Molinaro de 1879 —las dos de mano de Vincenzo Martino— se lee MASSEI. No hay una grafía «correcta»: depende del escribano. Se mantiene MASSEI en el árbol porque es la forma que usan las actas de la rama que sigue viva (1873, 1877, 1894).", "MURIÓ EN CONTRADA SAPORITO, no en Surdo, donde vivía en 1883. Es la misma contrada en la que su bisnieto Giuseppe nacerá en 1895 y su bisnieto Umberto en 1897."], "imgs": [{"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20Domenico%20Antonio%20Massei%20-%20Rende%20acta%20112.jpg", "t": "Domenico Antonio Massei - Rende acta 112"}], "zooms": [{"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%2070%20anos%2C%20nacido%20en%20Rende%2C%20hijo%20del%20fu%20Filippo.jpg", "t": "70 anos, nacido en Rende, hijo del fu Filippo"}, {"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20acta%20112%20completa.jpg", "t": "Acta 112 completa"}, {"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20testigo%20Giovanni%20Chiappetta%2C%20su%20yerno.jpg", "t": "Testigo Giovanni Chiappetta, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "The witness was his son-in-law", "parrafos": ["He was born at Rende around 1821 and died there on 8 November 1891, at two in the afternoon, in the contrada Saporito, aged seventy. He had been widowed eight years earlier of Carmina Ricchio, and his record calls him «vedovo di».", "The two fathers-in-law buried one another, and the records set it down. In December 1879 it was Domenico who reported the death of Teresa Molinaro, his son-in-law's mother. In December 1883 it was the son-in-law, Giovanni Chiappetta, who reported that of Carmina Ricchio, his own mother-in-law. And in November 1891, on Domenico's own record, one of the two witnesses is «Giovanni Chiappetta, di anni quarantatre, bracciante»: the same man again.", "Of the father, the record gives name and trade: «dal fu Filippo, bracciante, domiciliato in Rende». Of the mother, only the gap — but with a detail the other three records of that generation lack: the clerk left the name blank and still filled in «domiciliata in Rende».", "The surname changes from clerk to clerk and not from man to man: MASSEI in 1873 and 1879, MAZZEI in 1883 and 1891. The tree keeps Massei, which is the form used in the records of the branch that lives on."], "claves": [["Trade", "bracciante, day labourer"], ["Born", "c. 1821 at Rende, not Castrolibero as had been assumed"], ["Contradas", "Surdo in 1883; Saporito when he died"], ["Death", "8 November 1891, aged 70"]]}, "carmina_ricchio": {"id": "carmina_ricchio", "nombre": "Carmina Ricchio", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman born in Marano Principato around 1828, mother of Angela Massei. She died at Rende, contrada Surdo, on 11 December 1883, aged fifty-five. The man who went to report her death was her son-in-law, Giovanni Chiappetta.", "datos": [["Birth", "hacia 1828, MARANO PRINCIPATO — por los 55 años que le da el acta de defunción"], ["Parents", "Giuseppe Ricchio, bracciante; y MARIA BOSCO, que este acta no nombra pero sí da por muerta. El nombre de la madre llegó después, por el acta de defunción de ella misma (Castrolibero, 1865, acta 11)"], ["Trade", "contadina (campesina)"], ["Spouse", "Domenico Massei († 8 de noviembre de 1891), que le sobrevivió ocho años"], ["Daughter", "Angela Massei (hacia 1858, Castrolibero)"], ["Residence", "Rende, contrada Surdo"], ["Death", "11 de diciembre de 1883, 12 h, Rende — acta 163, con 55 años"]], "mapa": null, "sinacta": "", "padre": "giuseppe_ricchio", "madre": "maria_bosco", "conyuge": "domenico_massei", "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "11 de diciembre de 1883, 12 h", "lugar": "Rende", "ref": "acta 163", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 75 «Morti» 1883"], ["Registro", "hash del contenedor: LpnQEoq"], ["Página", "42 de 50"], ["Colocación", "columna derecha, mitad superior de la apertura"], ["Año manuscrito", "«milleottocento ottantatre» — coincide con el catálogo"], ["Registrar", "Bruno Vincenzo, asesor en funciones por el alcalde"]], "literal": "…è morta Ricchio Carmina di anni cinquantacinque, contadina, residente in Rende,\nnata in Marano Principato, da fu Giuseppe, bracciante, domiciliato in vita in\nMarano Principato, e dalla fu ————, domiciliata in ————, moglie di Mazzei Domenico.", "traduccion": "In the year eighteen hundred and eighty-three, on the twelfth day of December, at eleven in the morning, at the town hall.\n\nBefore me, BRUNO VINCENZO, acting assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared CHIAPPETTA GIOVANNI, aged thirty-three, bracciante, resident at Rende, and CHIAPPETTA PASQUALE, aged twenty-eight, bracciante, resident at Rende.\n\nWho declared to me that at noon YESTERDAY, in the house situated in CONTRADA SURDO, there died RICCHIO CARMINA, AGED FIFTY-FIVE, CONTADINA (countrywoman), resident at Rende, BORN AT MARANO PRINCIPATO, DAUGHTER OF THE LATE GIUSEPPE, bracciante, who was resident in life at Marano Principato, and of the LATE ———— (the name is left blank), WIFE OF MAZZEI DOMENICO.\n\nPresent at this act as witnesses were CHIAPPETTA VINCENZO, aged twenty-five, bracciante, and CHIAPPETTA PIETRO, aged fifty, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the others being illiterate. — Vincenzo Bruno.", "notas": ["CINCUENTA Y CINCO AÑOS EN DICIEMBRE DE 1883: nació hacia 1828. Es la más joven de los cuatro abuelos y la que murió antes en edad. Tuvo a Angela con unos treinta.", "NACIÓ EN MARANO PRINCIPATO, igual que Teresa Molinaro. Dos de los cuatro bisabuelos de Filomena salen del mismo pueblo, que hasta ahora no aparecía en este árbol.", "EL PADRE: GIUSEPPE RICCHIO, bracciante, «domiciliato in vita in Marano Principato». El índice lo daba sin más; el acta le pone oficio y pueblo, y con el «fu» y el «in vita» deja claro que había muerto y que nunca se mudó de Marano.", "LA MADRE, SIN NOMBRE. Tercera vez de cuatro: el escribano escribe «e dalla fu» y deja el resto en blanco. No hay ningún nombre que rescatar. — RESUELTO EL 26 DE AGOSTO DE 2026, y no aquí sino en otro archivo: la madre era MARIA BOSCO, y su propia acta de defunción (Castrolibero, 11 de agosto de 1865, acta 11) la nombra y la identifica como «vedova del fu Giuseppe Ricchio». Ese «dalla fu» de 1883 era cierto: llevaba dieciocho años muerta.", "EL ACTA ES UNA REUNIÓN DE CHIAPPETTAS. Los dos declarantes y los dos testigos llevan ese apellido. El primer declarante es CHIAPPETTA GIOVANNI, su yerno, el marido de Angela y padre de Filomena. El segundo, CHIAPPETTA PASQUALE, de veintiocho años, es casi con seguridad hermano de Giovanni: encaja con un hijo más de Raffaele y Teresa, nacido hacia 1855. Y entre los testigos, Chiappetta Vincenzo (25) y Chiappetta Pietro (50). La familia del yerno enterró a la suegra.", "AQUÍ EL APELLIDO DEL MARIDO SE ESCRIBE MAZZEI, con la doble zeta inconfundible, mientras que el matrimonio de 1873 escribía MASSEI. Es el mismo hombre.", "Su marido le sobrevivió ocho años: murió el 8 de noviembre de 1891, «vedovo di Ricchio Carmina», y su acta está también en este archivo."], "imgs": [{"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20Carmina%20Ricchio%20-%20Rende%20acta%20163.jpg", "t": "Carmina Ricchio - Rende acta 163"}], "zooms": [{"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%2055%20anos%2C%20hija%20del%20fu%20Giuseppe%20Ricchio%20de%20Marano%20Principato.jpg", "t": "55 anos, hija del fu Giuseppe Ricchio de Marano Principato"}, {"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20acta%20163%20completa.jpg", "t": "Acta 163 completa"}, {"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20declarante%20Chiappetta%20Giovanni%2C%20su%20yerno.jpg", "t": "Declarante Chiappetta Giovanni, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "Four Chiappettas on her record", "parrafos": ["She died on 11 December 1883, at noon, in the contrada Surdo at Rende, aged fifty-five. Of Filomena's four grandparents she is the one who died youngest. She had been born around 1828 at Marano Principato.", "Her record is a gathering of Chiappettas: it is reported by Giovanni Chiappetta, thirty-three — her son-in-law — and Pasquale Chiappetta, twenty-eight; and the witnesses are Vincenzo Chiappetta, twenty-five, and Pietro Chiappetta, fifty. That Pasquale fits as a brother of Giovanni, another son of Raffaele and Teresa born around 1855. It is a lead to follow, not a proof.", "Of her father the record says «da fu Giuseppe, bracciante, domiciliato in vita in Marano Principato»; of her mother, nothing. None of those present signed: only the registrar, Vincenzo Bruno, who also spells the husband's surname with a double z, Mazzei.", "Three of Filomena's four grandparents died in the same contrada Surdo and in three Decembers: Teresa Molinaro on 19 December 1879, Raffaele Chiappetta on 3 December 1880 and she on 11 December 1883."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1828 at Marano Principato"], ["Contrada", "Surdo, at Rende"], ["Death", "11 December 1883, aged 55"], ["Who reported it", "her son-in-law, Giovanni Chiappetta"]]}, "domenico_pizzi": {"id": "domenico_pizzi", "nombre": "Domenico Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["faienza"], "resumen": "A stonemason from Atessa, born around 1824, father of Angiolina Pizzi. He could sign his name, which was rare among his people. He died on 28 September 1891 at the house on Via di Mezzo, aged sixty-seven, still married to Teresa Flocco.", "datos": [["Birth", "hacia 1824, ATESSA — por los 67 años que le da el acta de defunción"], ["Parents", "Giuseppe Pizzi, artigiano († antes de 1869), y Antonia di Iorio, filatrice († antes de 1891); los dos vivieron y murieron en Atessa"], ["Trade", "muratore (albañil), en 1869 y en 1891"], ["Spouse", "Teresa Flocco, hija del fu Pasquale — le sobrevivió"], ["Daughter", "Angiolina (Angela) Pizzi, nacida el 12 de febrero de 1869"], ["Residencias", "rione del CASTELLO en 1869; VIA DI MEZZO al morir en 1891"], ["Sabía escribir", "SÍ. Firmó de su puño el acta de nacimiento de su hija en 1869, mientras los dos testigos declaraban no saber"], ["Death", "28 de septiembre de 1891, 20:05 h, Atessa — acta 238, con 67 años"], ["Aviso sobre la edad", "el acta de 1869 le pone 39 años (nacido hacia 1830) y la de 1891 le pone 67 (nacido hacia 1824). Seis años de diferencia entre dos actas suyas"]], "mapa": null, "sinacta": "", "padre": "giuseppe_pizzi", "madre": "antonia_di_iorio", "conyuge": "teresa_flocco", "hijos": ["angela_pizzi"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "28 de septiembre de 1891, 20:05 h", "lugar": "Atessa (Chieti)", "ref": "acta 238", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1891, atti di morte"], ["Registro", "hash del contenedor: 5v7V2Ay"], ["Página", "121 de 170"], ["Colocación", "mitad inferior de la plana; encima, el acta 237"], ["Año manuscrito", "«mille ottocento novantuno» — coincide con el catálogo"], ["Registrar", "Francesco Falcucci (lectura dudosa: «Falcuni»), asesor municipal delegado por el alcalde por acta de 24 de noviembre de 1889"], ["Cómo se localizó", "por el índice alfabético del final del registro (página 168 de 170), donde consta un único Pizzi: «Pizzi Domenico — 238». Un sondeo en la página 120 dio las actas 235-236, fechadas el 28 de septiembre: la 238 estaba en la página siguiente"]], "literal": "Numero 238 — Domenico Pizzi\nL'anno mille ottocento novantuno, addì ventinove di Settembre, a ore pomeridiane\nquattro e minuti dieci, nella Casa Comunale. Avanti di me Francesco Falcucci\nassessore Municipale delegato dal Sindaco con atto del ventiquattro Novembre\nmille ottocento ottantanove, debitamente approvato, Ufficiale dello Stato Civile\ndel Comune di Atessa, sono comparsi Donato Tiroli, di anni settanta, contadino,\ndomiciliato in Atessa, e Tommaso D'Amelio, di anni settantatre, contadino,\ndomiciliato in Atessa, i quali mi hanno dichiarato che a ore pomeridiane otto e\nminuti cinque di ieri, nella casa posta in Via di Mezzo al numero ——, è morto\nDOMENICO PIZZI, di anni sessantasette, muratore, residente in Atessa, nato in\nAtessa, da fu GIUSEPPE, artigiano, domiciliato in vita in Atessa, e da fu ANTONIA\nDI IORIO, filatrice, domiciliata in vita in Atessa, marito di TERESA FLOCCO.", "traduccion": "In the year eighteen hundred and ninety-one, on the twenty-ninth day of September, at ten past four in the afternoon, at the town hall.\n\nBefore me, FRANCESCO FALCUCCI, municipal assessor delegated by the Mayor by act of the twenty-fourth of November eighteen hundred and eighty-nine, duly approved, Registrar of the Civil Status of the comune of ATESSA, there appeared DONATO TIROLI, aged seventy, farmhand, resident at Atessa, and TOMMASO D'AMELIO, aged seventy-three, farmhand, resident at Atessa.\n\nWho declared to me that at FIVE PAST EIGHT YESTERDAY EVENING, in the house situated in VIA DI MEZZO, there died DOMENICO PIZZI, AGED SIXTY-SEVEN, STONEMASON, resident at Atessa, BORN AT ATESSA, SON OF THE LATE GIUSEPPE, artisan, who was resident in life at Atessa, and of the LATE ANTONIA DI IORIO, spinner, who was resident in life at Atessa. HUSBAND OF TERESA FLOCCO.\n\nPresent at this act as witnesses were FILIPPO FEDELIBUS, aged fifty-one, farmhand, and GIACOMO PASQUINI (uncertain reading), aged forty-eight, farmhand, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the informants and the witnesses having declared that they could not write. — Francesco Falcucci.", "notas": ["SESENTA Y SIETE AÑOS EN SEPTIEMBRE DE 1891: nació hacia 1824. Es justo lo que se esperaba de él, y encaja con una hija nacida en 1869, cuando tendría cuarenta y cinco.", "EL ACTA SÍ NOMBRA A SU MADRE, y era la pregunta que se traía esta descarga. «E da FU ANTONIA DI IORIO, FILATRICE, domiciliata IN VITA in Atessa». Nombre completo, oficio y pueblo. Una rama materna nueva —DI IORIO— entra en el árbol por esta línea.", "EL PADRE: GIUSEPPE, artigiano, domiciliado en vida en Atessa. El «fu» y el «in vita» dicen que había muerto y que nunca se movió del pueblo. Es exactamente el mismo Giuseppe que el acta de 1869 nombra al presentar al declarante como «Domenico Pizzi FU Giuseppe»: dos actas separadas por veintidós años dando el mismo padre.", "«MARITO DI TERESA FLOCCO», no «vedovo». Ella le sobrevivió. Su defunción habría que buscarla en los Morti de Atessa posteriores a 1891.", "MURIÓ EN VIA DI MEZZO. En 1869 la familia vivía en el rione del CASTELLO; veintidós años después está en Via di Mezzo, dentro del mismo casco.", "LA DISCREPANCIA DE EDAD. El acta de 1869 lo da de treinta y nueve años, que lo pondría en 1830; ésta lo da de sesenta y siete, que lo pone en 1824. Son sus dos únicas actas y no se ponen de acuerdo. Lo habitual en estos registros es que la edad declarada en una defunción sea la más redondeada, así que su nacimiento cae en la ventana 1824-1830 y hay que buscarlo en los Nati de Atessa de esos años.", "EL DECLARANTE ES UN TIROLI, igual que en la defunción de Leone Pizzi de 1841 (Luigi Tiroli, treinta años). Cincuenta años después, un Donato Tiroli de setenta años vuelve a ser quien va al ayuntamiento a declarar la muerte de un Pizzi. Vecindad de siempre."], "imgs": [{"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20Domenico%20Pizzi%20-%20Atessa%20acta%20238.jpg", "t": "Domenico Pizzi - Atessa acta 238"}], "zooms": [{"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%2067%20anos%2C%20hijo%20del%20fu%20Giuseppe%20y%20de%20la%20fu%20Antonia%20di%20Iorio%2C%20marido%20de%20Teresa%20Flocco.jpg", "t": "67 anos, hijo del fu Giuseppe y de la fu Antonia di Iorio, marido de Teresa Flocco"}, {"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%20acta%20238%20completa.jpg", "t": "Acta 238 completa"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "teresa_flocco": {"id": "teresa_flocco", "nombre": "Teresa Flocco", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["faienza"], "resumen": "A spinner from Atessa, born around 1834, wife of Domenico Pizzi and mother of Angiolina. She was widowed in September 1891.", "datos": [["Birth", "hacia 1834 — el acta de 1869 le da treinta y cinco años"], ["Father", "PASQUALE FLOCCO, ya difunto en febrero de 1869 («fu Pasquale»)"], ["Mother", "no consta en ninguna de las dos actas"], ["Trade", "filatrice (hilandera)"], ["Spouse", "Domenico Pizzi, muratore († 28 de septiembre de 1891)"], ["Daughter", "Angiolina (Angela) Pizzi, nacida el 12 de febrero de 1869"], ["Residence", "Atessa, rione del Castello en 1869"], ["Death", "sin localizar — posterior a septiembre de 1891, porque su marido muere «marito di» ella y no «vedovo»"]], "mapa": null, "sinacta": "CONFIRMADA POR DOS ACTAS, aunque no tenga carpeta propia. En el nacimiento de su hija (Atessa, 12 de febrero de 1869, acta 65) el marido la declara: «da sua moglie TERESA FLOCCO FU PASQUALE, d'anni trentacinque, FILATRICE, seco lui domiciliata». Y en la defunción de él (Atessa, 28 de septiembre de 1891, acta 238) figura como su mujer viva. Las dos actas están descargadas y transcritas en las fichas de Angela y de Domenico.\n\nEL DATO QUE HAY QUE APUNTAR es ese «fu Pasquale»: su padre se llamaba PASQUALE FLOCCO y ya había muerto en febrero de 1869. No se le ha abierto ficha porque de él no se sabe nada más —ni oficio ni edad ni pueblo, aunque Flocco es apellido de Atessa: en el mismo registro de 1869 aparece un «Signor Filippo Flocco» propietario de una masería—, pero es un nombre nuevo y comprobado, de la generación de 1800, y da por dónde seguir: los Morti de Atessa anteriores a 1869.", "padre": null, "madre": null, "conyuge": "domenico_pizzi", "hijos": ["angela_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francesco_giacomo": {"id": "francesco_giacomo", "nombre": "Francesco Giacomo Palermo", "legal": "Giacomo Palermo", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "A shepherd of Marano Marchesato. The records almost always call him plain «Giacomo Palermo». He had at least four children at Marano between 1839 and 1852, moved with the family to Rende and died there on 13 May 1867, aged sixty.", "datos": [["Birth", "hacia 1807, Marano Marchesato — por la edad que declara al morir"], ["Parents", "GIUSEPPE PALERMO, pecorajo, y CARMINA SPIZZIRRI — CONFIRMADOS POR SU PROPIA ACTA DE MATRIMONIO (Rende, 1837, acta 20), donde a ella la llaman «Carmela». Los dos vivos en 1837. Ya no es una inferencia"], ["Spouse", "Carmina Volpintesta"], ["Marriage", "19 de octubre de 1837, RENDE — acta 20. CONSEGUIDA. Se buscó años en Marano, donde no está: se casaron en el pueblo de ella"], ["Hermanas", "ROSALIA PALERMO, casada en Marano en 1838 con diecisiete años, y AQUILA PALERMO, nacida en Marano el 22 de junio de 1821. Hermanas de padre Y DE MADRE, probado: su acta de matrimonio de 1837 lo da hijo de los mismos dos"], ["Hijos documentados", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Trade", "pastore en 1841, bracciale en 1845 y 1852, pecoraio al morir"], ["Contradas", "Palazzo (1841), Langhi (1845), Cerzi (1852) en Marano; luego Rende"], ["Death", "13 de mayo de 1867, 16 h, Rende — acta 35, con 60 años"]], "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": "carmina_volpintesta", "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": ["aquila_palermo"], "actas": [{"titulo": "Parish extract of baptism", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 de febrero de 1809", "lugar": "Marano Marchesato", "ref": "parroquia del Carmine", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni, processetti» 1837"], ["Registro", "ark an_ua35976841 · hash del contenedor: LPAZyGB (269 imágenes)"], ["Página", "225 de 269 — expediente 20, el de su propia boda"], ["Original", "libro de bautizados de la iglesia de SANTA MARIA DEL MONTE CARMELO de Marano Marchesato. Extracto expedido por el rector Dominicus Laura el 27 de septiembre de 1837"], ["Legalización", "F. Spizzirri, sindaco de Marano, y el canciller Benedetto Conforti"], ["Cómo se localizó", "dentro del expediente de su matrimonio de 1837, entre los documentos que tuvo que presentar para casarse"]], "literal": "Anno Domini Mille Octingentesimo NONO die 14 mensis FEBRUARII Marani, R.D. MATTHAEUS SANTANNA baptizavit infantem natum ex JOSEPHO PALERMO et CARMELA SPIZZIRRI legitimis conjugibus, cui impositum est nomen FRANCISCUS JACOBUS; compater BARBARA SANTANNA.", "traduccion": "I, the undersigned rector of the church of SANTA MARIA DEL MONTE CARMELO of the town of Marano, having consulted the book of the baptised, certify that I have found the following entry:\n\n«IN THE YEAR OF OUR LORD EIGHTEEN HUNDRED AND NINE, ON THE 14th DAY OF THE MONTH OF FEBRUARY, AT MARANO, the reverend don MATEO SANTANNA baptised a boy born of GIUSEPPE PALERMO AND CARMELA SPIZZIRRI, LAWFULLY MARRIED, upon whom was bestowed the name FRANCESCO GIACOMO; godmother, BARBARA SANTANNA.»\n\nGiven at Marano, on the fifth of the calends of October 1837. Domingo Laura, rector.", "notas": ["*** LA PIEZA QUE FALTABA DESDE EL PRINCIPIO. *** Su nacimiento NO está en el registro civil de Marano de 1809: ese año se leyó entero, ochenta y cuatro actas, y los dos únicos Palermo son hijos de otros. Este extracto, guardado dentro del expediente de su boda, es probablemente la única copia que sobrevive fuera del libro parroquial.", "«LEGITIMIS CONJUGIBUS» — legítimos cónyuges. Giuseppe Palermo y Carmela Spizzirri YA ESTABAN CASADOS en febrero de 1809. Hasta ahora sólo se sabía que lo estaban antes de 1812, por el primer hijo conocido. Su matrimonio hay que buscarlo ANTES DE 1809, y es el documento que daría por fin los padres de Carmina Spizzirri.", "Los veintiocho años que declara al casarse en octubre de 1837 dan 1809. Coincide exactamente con este bautismo, y con el año que el índice del expediente le atribuía.", "La madre aparece aquí como CARMELA, igual que en el acta de matrimonio de 1837 y al revés que en todo lo demás, donde es CARMINA. Dos documentos distintos, la misma variante: puede que Carmela fuera su nombre de pila real y Carmina el de uso."], "imgs": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1809-02-14%20N%20Bautismo%20de%20Francesco%20Giacomo%20Palermo%20-%20Marano%20Marchesato%2C%20parroquia%20del%20Carmine.jpg", "t": "Bautismo de Francesco Giacomo Palermo - Marano Marchesato, parroquia del Carmine"}], "zooms": []}, {"titulo": "Death record", "tipo": "D", "t
