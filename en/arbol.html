was not Ramón Marcos's mother"], ["Earlier known partner", "ROSA BUDIÑO, mother of Ramón Marcos and already dead by 1948. THERE IS NO RECORD THAT THEY MARRIED: no document links them except through the son"], ["Children", "RAMÓN MARCOS (Cayastacito, 28 November 1909) and at least one brother of his, unnamed, whom the family remembers. By several women, so the real number is unknown"], ["Did he acknowledge his son", "YES, AND WITH A DATE: 3 September 1942, by act 201 of the birth book of the San Justo office. It is noted in the margin of Ramón Marcos's birth record. He was fifty-three; his son, thirty-two"], ["How old he was when he became a father", "twenty-one. He was born in January 1888 and Ramón Marcos in November 1909"], ["How many Rivas there were", "MEASURED, NOT ASSUMED. In the 1887 provincial census of Santa Fe there are SIXTY-EIGHT people surnamed Rivas in the whole province. They were listed one by one to find his family, and it turned up: the Helvecia household"], ["Why he was not in San Justo in 1887", "BECAUSE THEY HAD NOT ARRIVED YET. It had been measured that there were NO Rivas at all in the department of San Justo in 1887, out of 1,655 people indexed, and he was born there in January 1889. The family was at HELVECIA, the next department, and moved between the two dates"], ["Family memory, checked", "Gonzalo remembers his family always at VERA, SAN JUSTO, CAYASTÁ and CAYASTACITO. Helvecia is in that same Paraná corridor, south of Cayastá"], ["Source", "his own death record, filed here; and the two records of his son, in his son's profile"]], "vida": "1888–1971", "lug": "San Justo", "mapa": null, "sinacta": "CONFIRMED BY RECORD ON 31 AUGUST 2026, and with a profile nobody expected. Throughout this investigation his card said «Ramón in theory — the name comes from family tradition, not from a document». Now there are two documents, fifty-four years and two different informants apart, and both say the same: RAMÓN RIVAS. AND HE WAS A HACENDADO. His son's marriage record describes him as ARGENTINE, RESIDENT AT SAN JUSTO and by trade a HACENDADO — a landowner. That turns on its head the picture there was of him: an owner of land, not a day labourer. And it changes where to look, because landowners leave a trail where day labourers do not: deeds, tax rolls, notices and obituaries in the local press, rural societies. HE WAS ALIVE IN APRIL 1948. The form marks the groom's mother «fallecida» and marks nothing on him: that is how these forms distinguish dead parents. His son was marrying at thirty-eight and he was still at San Justo. WHAT TO REQUEST NOW, IN ORDER. First his son's BIRTH RECORD — Cayastacito, San Justo, November 1909 — which would give his age and address at the time and whether he acknowledged the child. Then his own DEATH in the department of San Justo, later than April 1948. And his MARRIAGE, if there was one: nothing says he was married to Rosa Budiño. AND NOW THERE ARE TWO CANDIDATES, MEASURED AGAINST THE 1887 CENSUS. Gonzalo feared that searching for a «Ramón Rivas» would be hopeless because the name is so common. It was measured instead of assumed: in the whole province of Santa Fe there are SIXTY-FIVE Rivas and ONE SINGLE MALE called Ramón. It is not a common surname here.\n\n · THE ROSARIO ONE — four years old in the 1895 census, born around 1890-91. He would have been EIGHTEEN when Ramón Marcos was born.\n · THE SAN JAVIER ONE — twelve years old in the 1887 census, born around 1875. He would have been THIRTY-FOUR in 1909 and seventy-three in 1948, and he is in the department where the surname concentrates: one in every five hundred and fifty inhabitants.\n\nThe San Javier one fits «hacendado» better — at thirty-four a man may have land of his own; at eighteen it is far rarer. But neither is proven, and a single figure separates them: the father's age on the 1909 birth record, already ordered. Eighteen, and Rosario wins; thirty-four, and San Javier wins; anything else, and both fall.\n\nTHE BROTHER IS STILL MISSING. The unnamed brother who came to visit Marcos Ramón in old age is still the most productive fact in this branch: with his record, another document would name Ramón and perhaps say by which mother. Marcos César and his siblings lived through that visit and may know the name.", "padre": "evergisto_rivas", "madre": "rita_alvarez", "conyuge": "rosa_budino", "unionLibre": true, "otrasParejas": [["cristina_romero", "Married"]], "hijos": ["marcos_ramon_rivas"], "hermanos": ["margarita_rivas_h", "desideria_rivas", "evergisto_rivas_h", "cipriano_rivas", "manuel_rivas_h", "serapio_rivas", "zeferino_rivas", "francisco_alejandro_rivas", "juana_rita_rivas", "felipe_rivas"], "actas": [{"titulo": "Baptism record", "tipo": "N", "tipoNombre": "Birth", "fecha": "nació el 25 de enero de 1888; bautizado el 11 de junio de 1889", "lugar": "Iglesia de Emilia, departamento La Capital, Santa Fe, Argentina", "ref": "libro parroquial, folio 194", "fuente": [["Archive", "Archivo General de la Nación (Argentina)"], ["Colección", "Segundo Censo Nacional de la República Argentina, 1895 — Rosario"], ["Cómo se encontró", "FamilySearch, image group 004160727, image 69 of 400 — found by Gonzalo on 31 August 2026"]], "literal": "", "traduccion": "On the eleventh day of June in the year eighteen hundred and eighty-nine, I the undersigned priest solemnly baptised in this Church of Nuestra Señora de la Purificación of Emilia a boy, born on the TWENTY-FIFTH OF JANUARY of eighteen hundred and EIGHTY-EIGHT, to whom I gave the name RAMÓN. He is the legitimate son of EVERGHITO RIVA and RITA ALVARI, his godparents being SANTIAGO LAZARINI and ANGELITA LAZZARINI, whom I advised of the spiritual kinship and the other obligations. And in witness whereof I sign, priest Francisco Lionetti.", "notas": ["He was born on 25 January 1888. His death record, from 1971, says 14 January 1889: a year and eleven days apart. The death was declared by a neighbour eighty-three years later; this baptism was made seventeen months after the birth.", "With this date he was twenty-one when Ramón Marcos was born, and eighty-three when he died, not eighty-two.", "He was baptised at Emilia. The death record says he was born at San Justo. Emilia and Cayastacito then belonged to the department of La Capital, and Cayastacito passed to San Justo later.", "The godparents are Santiago Lazarini and Angelita Lazzarini. He had been a witness at the parents' wedding, in this same church, seven years earlier.", "The priest writes «Everghito Riva and Rita Alvari». One more spelling to add to Evargisto, Evergisto and Evaristo."], "imgs": [{"u": "../actas/1888%20-%20Nacimiento%20de%20Ramon%20Rivas/1889-06-11%20N%20Partida%20de%20bautismo%20-%20Emilia.jpg", "t": "Partida de bautismo - Emilia"}], "zooms": [{"u": "../actas/1888%20-%20Nacimiento%20de%20Ramon%20Rivas/1889-06-11%20N%20Partida%20de%20bautismo%20-%20Emilia%20%E2%80%94%20zoom.jpg", "t": "Partida de bautismo - Emilia — zoom"}]}, {"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "24 August 1971, at 10 a.m.; registered on the 25th", "lugar": "San Justo, departamento de San Justo, Santa Fe, Argentina", "ref": "death entry no. 84 · copy 117863", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["Cómo se pidió", "copia legalizada, pedida por Gonzalo en línea y expedida el 3 de septiembre de 2026"], ["Firma el original", "Miguel [—] Nelli, jefe del Registro Civil de San Justo"], ["Qué se archiva aquí", "sólo la hoja del acta. La segunda hoja del PDF original es el comprobante de pago y lleva datos personales de Gonzalo: no se archiva ni se publica"]], "literal": "", "traduccion": "DEATH ENTRY No. 84.\n\nAt SAN JUSTO, department of SAN JUSTO, province of Santa Fe, Argentine Republic, on the TWENTY-FIFTH day of AUGUST 1971, before me, head of the Registry of Civil Status, there appears ISMAEL OLIVA, identity document 2,510,056, resident at San Justo, declaring that:\n\nAt TEN HOURS on the TWENTY-FOURTH day of the current month, and at SAN JUSTO, there died RAMÓN RIVAS, male, of ARGENTINE nationality, a WIDOWER, by profession a HACENDADO (landowner), resident at SAN JUSTO, identity document L.E. 2,356,204, BORN AT SAN JUSTO ON 14 JANUARY 1889, as a consequence of ILLNESS, according to the medical certificate of Dr EDGARDO NELSON GARCÍA.\n\nThat he was married to CRISTINA ROMERO.\nSON OF EVERGISTO RIVAS AND RITA ÁLVAREZ.\n\nRead out, the declarant signs together with me.", "notas": ["THIS IS THE DOCUMENT THAT GIVES BACK THE MAN WHO HAD ERASED HIMSELF. Until 3 September 2026, all that was known of Ramón Rivas was what his son's records said: Argentine, of San Justo, a landowner, and alive in April 1948. Not one date. This record gives his exact birth, his exact death, his identity number, his wife and his parents, in fourteen lines.", "HE WAS BORN ON 14 JANUARY 1889, SO HE WAS TWENTY WHEN HE BECAME A FATHER. And that rules out at a stroke the two candidates that had been under consideration: the four-year-old of the Rosario census (born about 1891) and the twelve-year-old of the San Javier census (born about 1875). He was neither.", "IT GIVES TWO NEW GENERATIONS IN A SINGLE LINE: «SON OF EVERGISTO RIVAS AND RITA ÁLVAREZ». With those two names the 1887 provincial census was searched again and both appeared, together, as head and wife of a household at HELVECIA — with three daughters and seven years of marriage. They have profiles of their own.", "HE DIED A LANDOWNER AT EIGHTY-THREE. The same trade he declared in 1948 at his son's wedding. Twenty-three years later he was still the same thing, which says it was not a run of luck but a position.", "HE WAS THE WIDOWER OF CRISTINA ROMERO, WHO IS NOT RAMÓN MARCOS'S MOTHER. Rosa Budiño had died before April 1948 and was never married to him. Cristina Romero is a new woman in this story and had also died before 1971.", "AN ODDITY THAT RESOLVES ITSELF: it had been measured that in 1887 there was NOT ONE Rivas in the department of San Justo, out of 1,655 people indexed, and here he is born there in January 1889. The answer is in the census: in 1887 the family lived at HELVECIA, department of San José, next door. They moved between the census and the birth.", "WHO DECLARED IT: ISMAEL OLIVA, of San Justo, document 2,510,056. Not family, by the surname. In 1971 Ramón Marcos was living in the city of Santa Fe and was sixty-one; that the errand fell to a neighbour and not to the son fits a distant relationship, which is exactly what the family remembers."], "imgs": [{"u": "../actas/1971%20-%20Defuncion%20de%20Ramon%20Rivas/1971-08-25%20D%20Acta%20de%20defuncion%20-%20San%20Justo%20acta%2084.png", "t": "Acta de defuncion - San Justo acta 84"}], "zooms": []}], "nActas": 2, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "tebaldo_celeri": {"id": "tebaldo_celeri", "nombre": "Tebaldo Celeri", "legal": "TEBALDO JACOPO ARCHIMEDE CELERI on his birth record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-grandfather. He emigrated from Italy and ended up in the north of Santa Fe province, at Jobson, beside Vera station. He lost his first wife and married again in 1900, aged thirty-eight, to a girl of nineteen. For months he was a nameless gap in this tree: «the Celeri immigrant». On 27 August 2026 he stopped being one.", "datos": [["Birth", "25 JULY 1862, at eight in the morning, at TRASSILICO (Garfagnana, province of Massa, today of Lucca) — record 52"], ["Full name", "TEBALDO JACOPO ARCHIMEDE. Three names, and two of them learned ones: Jacopo and ARCHIMEDE, after Archimedes. It is not a peasant's name"], ["Where he was born", "in the house of the signora LUISA VANNI, at the place in Trassilico called ALLA MAESTÀ. The house of his mother's family, not his father's"], ["Baptised", "on the very day of his birth, by don DOMENICO GRANDI, parish priest of Trassilico"], ["Parents", "CALLISTO CELERI, aged 31, TOWN CLERK of Trassilico, son of the late DESIDERIO; and ENRICHETTA VANNI, aged 27, daughter of the late DOCTOR PIETRO VANNI"], ["First wife", "ENCARNACIÓN FERNÁNDEZ. By October 1900 he was already a WIDOWER of hers"], ["Second wife", "MARGARITA ALASIA, aged nineteen, a native of Colonia Emilia — married at VERA (Santa Fe) on 25 October 1900"], ["Address", "JOBSON, Vera station, department of Vera, in the north of the province of Santa Fe. A district of farming colonies founded by immigrants"], ["Known children", "from the first marriage, ENRIQUETA (c. 1894). From the second, ELBA and her sisters Olga, Ercilia, Rosa and Nerina"], ["Origin", "TRASSILICO, province of LUCCA, in the Tuscan Garfagnana — CONFIRMED on 27 August 2026. The two Argentine records said only «natural de Italia»; what fixes it is the death record of his MOTHER, who died at Trassilico in 1923. Family memory had the exact village right"], ["The family house", "TRASSILICO, VIA DEL CENTRO, NUMBER 17 — the address where his mother died, and the place he set out from for Argentina. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["The street today", "VIA DEL CENTRO NO LONGER EXISTS. OpenStreetMap was asked for every named street in Trassilico and there are eleven, none of that name: Via Antonio Vallisneri, Via San Ansano, Via Leonardo Nobli, Via della Quercia, Via di Mezzo, Via Borghetto, Via Caraglia delle Gioie, Via della Fontana, and the squares Umberto I, Giovanni Pierelli and Guglielmo Marconi. The names changed."], ["Probable street", "VIA ANTONIO VALLISNERI. All eleven streets measured one by one: Via della Fontana is 2,085 m long but it is the access road up from the valley, outside the built-up village. Within the village the longest are San Ansano (362 m) and VIA ANTONIO VALLISNERI (335 m) — and the centre of Vallisneri falls at 44.04151, 10.40348, which is exactly the centroid of the village. IT IS THE CENTRAL STREET. And ANTONIO VALLISNERI (1661-1730), the famous naturalist, WAS BORN AT TRASSILICO: he is the village's illustrious son. https://www.google.com/maps/search/?api=1&query=Via+Antonio+Vallisneri%2C+Trassilico%2C+Gallicano%2C+Lucca"], ["Why it changed", "TRASSILICO WAS A COMUNE OF ITS OWN until Gallicano absorbed it, around 1928. When two comuni merge, streets with duplicate names have to be renamed, and «Via del Centro» is just the kind of generic name that collides — Gallicano would have had its own. The natural thing is that the Trassilico one should be renamed after the illustrious son. And it fits the dates: Enrichetta died at Via del Centro 17 in 1923, FIVE YEARS BEFORE the merger. That was the name in use then. ALL THIS IS INFERENCE, not document."], ["Alternative", "There is a number 17 actually mapped, in VIA LEONARDO NOBLI (44.04216, 10.40396), beside the Rocca Estense. But that is the street at the northern end, not the centre. Vallisneri, on the other hand, has only the EVEN door numbers mapped, from 16 to 32: nobody has mapped the odd ones, so a number 17 there is perfectly possible and simply does not appear."], ["How to prove it", "The STRADARIO of the Comune di Gallicano, which usually preserves the concordance between old and new names. It is a two-line question by post: comunegallicano@postacert.toscana.it"], ["The church", "SS. PIETRO E PAOLO of Trassilico — where he was baptised on the very day of his birth and where his parents had married three years earlier. It is the building that has been located. https://www.google.com/maps/search/?api=1&query=Chiesa+dei+Santi+Pietro+e+Paolo%2C+Trassilico%2C+Gallicano%2C+Lucca"]], "vida": "b.1862", "lug": "TRASSILICO", "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico, Garfagnana — province of Lucca", "pie": "The village where he was born on 25 July 1862, at eight in the morning. The whole of it fits into two hundred and fifty metres from north to south: what is seen here is all of Trassilico. The house at VIA DEL CENTRO, 17 stands in one of these streets — that street is no longer called by that name, and the likeliest candidate is VIA ANTONIO VALLISNERI, which crosses the centre just below the marker. To the north, eighty metres away, the ROCCA ESTENSE. To the east, the church of SAN PIETRO (44.04207, 10.40551), where he was baptised on the very day of his birth and where his parents had married three years before."}, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": "margarita_alasia", "unionLibre": false, "otrasParejas": [], "hijos": ["elba_celeri", "enriqueta_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["ciro_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "25 July 1862, 8 in the morning; registered on the 30th", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 52", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240 on Antenati)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 51.5 «Nati» 1862"], ["Register", "ark an_ua35853262 · container hash: 5xxX6OE (30 images)"], ["Page", "18 of 30 — folio 15 of the book; three records to the page"], ["Registrar", "RANIERI BERTOLI BARSOTTI, sindaco and registrar of the civil status"], ["How it was located", "by the alphabetical index at the end of the register, pages 28 and 29: «Celeri Tebaldo Jacopo Archimede — paternità Callisto — 1862, Luglio 30, atto 52»"]], "literal": "52. L'anno 1862 milleottocento sessantadue, il giorno 30 trenta del mese di Luglio. Davanti me sottoscritto BERTOLI BARSOTTI RANIERI, Sindaco ufficiale dello Stato Civile del Comune di TRASSILICO, Circondario di GARFAGNANA, Provincia di MASSA, è comparso CELERI CALLISTO FU DESIDERIO, di anni 31 trentuno, SEGRETARIO COMUNALE, il quale, presenti Andreini Michele fu Matteo di anni 60 sessanta e Andreini Pietro fu Carlo di anni 30, ambidue DOTTORI FISICI e domiciliati tutti in Trassilico, ha dichiarato che nel giorno 25 venticinque del mese ed anno suddetti, alle ore 8 otto antemeridiane, gli è nato in casa della Signora VANNI LUISA posta in Trassilico luogo detto ALLA MAESTÀ, da CELERI ENRICHETTA DEL FU VANNI DOTTOR PIETRO di anni 27 ventisette sua consorte, un figlio di sesso mascolino, cui furono imposti i nomi di TEBALDO JACOPO ARCHIMEDE, e come dalla fede del Battesimo conferitogli dal Signor Don DOMENICO GRANDI Parroco locale il giorno stesso della sua nascita, che si unisce.", "traduccion": "Record 52. The year 1862, on the THIRTIETH OF JULY. Before me, RANIERI BERTOLI BARSOTTI, mayor and registrar of the Civil Status of the COMUNE OF TRASSILICO, district of the GARFAGNANA, province of MASSA, there appeared:\n\nCALLISTO CELERI, SON OF THE LATE DESIDERIO, aged THIRTY-ONE, TOWN CLERK.\n\nWho, in the presence of MICHELE ANDREINI, son of the late Matteo, aged sixty, and PIETRO ANDREINI, son of the late Carlo, aged thirty, BOTH PHYSICIANS and all three resident at Trassilico, declared that on the TWENTY-FIFTH of the same month and year, AT EIGHT IN THE MORNING, there was born to him — in the house of signora LUISA VANNI, situated at Trassilico, in the place called ALLA MAESTÀ — of ENRICHETTA CELERI, DAUGHTER OF THE LATE DOCTOR PIETRO VANNI, aged TWENTY-SEVEN, his wife, a son of the male sex, upon whom were bestowed the names TEBALDO JACOPO ARCHIMEDE.\n\nAnd so it appears in the certificate of baptism conferred on him by don DOMENICO GRANDI, the local parish priest, ON THE VERY DAY OF HIS BIRTH, which is annexed.", "notas": ["IT IS THE RECORD THAT CLOSES THE CELERI BRANCH, AND IT APPEARED ON 27 AUGUST 2026, THE SAME DAY AS THE VILLAGE. Forty-eight hours earlier, Elba's father was «an Italian immigrant, from the north I think», without a name.", "THE FAMILY WERE NOT COUNTRY PEOPLE, AND THIS CHANGES THE WHOLE PORTRAIT. The father was SEGRETARIO COMUNALE — the town clerk of Trassilico, the man who wrote the village's records. The maternal grandfather was a DOCTOR OF MEDICINE. Both witnesses were PHYSICIANS. And the child was named ARCHIMEDE, after Archimedes. Compare this with the Calabrian branch, where all of them, without exception, are braccianti, pecorai and contadini.", "A NEW GENERATION: DESIDERIO CELERI. «Celeri Callisto FU DESIDERIO» — Callisto's father, already dead in 1862. With Callisto aged 31 in 1862, Desiderio would be of the generation of 1800 or earlier.", "THE MOTHER'S AGE FITS TO THE LETTER. Here she is 27 in July 1862 → born about 1835. Her death record of 1923 gives her 88 → born about 1835. Two documents separated by sixty-one years and by a thousand kilometres of archive, with the same figure.", "PIETRO VANNI WAS NOT A PHYSICIAN BUT A LAWYER, and this must be corrected: from this record it was inferred that «dottor Pietro» meant a doctor of medicine, and it did not. The marriage record of his other daughter, Luisa, in April 1863, says so unambiguously: «di professione LEGALE, nato in LUCCA». He was a man of law and he came from the city. He had already died by 1862.", "HE WAS BORN IN THE HOUSE OF SIGNORA LUISA VANNI, at the place called ALLA MAESTÀ — and on 27 August 2026 it became known who she was: HIS MOTHER'S ELDER SISTER. Luisa's marriage record, of April 1863, declares her the daughter of the same parents. Tebaldo was born in the house of his own aunt: Enrichetta went to give birth at her sister's. Sixty-one years later his mother would die in the VIA DEL CENTRO, number 17. They are two different addresses in the same village.", "«TRASSILICO, CIRCONDARIO DI GARFAGNANA, PROVINCIA DI MASSA». In 1862 the Garfagnana belonged to the province of MASSA, not to that of Lucca. That is why its registers are in the Archivio di Stato di Massa and not in that of Lucca — a fact that took some finding and is best not forgotten."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Fe%20de%20bautismo%20de%20Tebaldo%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Tebaldo - parroquia de Trassilico"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Nacimiento%20de%20Tebaldo%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2052.jpg", "t": "Nacimiento de Tebaldo Celeri - Trassilico, Lucca acta 52"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20Portada%20del%20fasciculo%20de%20anexos%20-%20Atti%20di%20Nascita%20n%2052.jpg", "t": "Portada del fasciculo de anexos - Atti di Nascita n 52"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20Celeri%20Tebaldo%20fila%2014.jpg", "t": "Indice alfabetico de nacidos 1862 - Celeri Tebaldo fila 14"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20indice%20alfabetico%20de%20nacidos%201862%20-%20segunda%20mitad.jpg", "t": "Indice alfabetico de nacidos 1862 - segunda mitad"}], "zooms": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20Callisto%20del%20fu%20Desiderio%20del%20fu%20DOMENICO%20CELERI.jpg", "t": "Callisto del fu Desiderio del fu DOMENICO CELERI"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20comparece%20Celeri%20Callisto%20fu%20Desiderio.jpg", "t": "Acta 52, comparece Celeri Callisto fu Desiderio"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20acta%2052%2C%20la%20madre%20Enrichetta%20Vanni%20y%20los%20tres%20nombres.jpg", "t": "Acta 52, la madre Enrichetta Vanni y los tres nombres"}, {"u": "../actas/1862%20-%20Tebaldo%20Celeri/1862-07-25%20N%20zoom%20-%20la%20madre%2C%20hija%20del%20fu%20Vanni%20DOTTOR%20Pietro.jpg", "t": "La madre, hija del fu Vanni DOTTOR Pietro"}]}, {"titulo": "National Census of 1895", "tipo": "C", "tipoNombre": "Certificate", "fecha": "May 1895", "lugar": "Vera, department of Vera, Santa Fe, Argentina", "ref": "census schedule, lines 8 to 10", "fuente": [["Archive", "Archivo General de la Nación (Argentina)"], ["Collection", "Segundo Censo Nacional de la República Argentina, 1895 — Vera, Vera, Santa Fe; image 520 of 626, image group 004163156"], ["Via", "FamilySearch"]], "literal": "8 · Celeri · Tebaldo · V · 33 · C · Italia · — · Peluquero · sí\n9 · Fernandez · Concepción · M · 25 · C · Argentina · Córdoba · — · sí\n10 · Celeri · Enriqueta · M · 3 · — · Argentina · Santa Fe · — · —", "traduccion": "The columns of the census form are: surname, forename, whether male or female, how many years completed, whether single / married / widowed, which nation they belong to, if Argentine which province they were born in, what profession or trade they have, and whether they can read and write.\n\n· **TEBALDO CELERI**, male, THIRTY-THREE, MARRIED, of ITALIAN nationality, by trade a **BARBER**, can read and write.\n· **CONCEPCIÓN FERNÁNDEZ**, female, TWENTY-FIVE, MARRIED, ARGENTINE, born in the province of **CÓRDOBA**, can read and write.\n· **ENRIQUETA CELERI**, female, THREE, ARGENTINE, born in **SANTA FE**.\n\nOn the same page live a Campana family of French nationality, some Arzongas, merchants and shop assistants, a Peralta and a Moirad: the portrait of a newly founded farming frontier town, with French, Italians and Argentines mixed together.", "notas": ["IT IS THE PHOTOGRAPH OF TEBALDO'S FIRST FAMILY, FIVE YEARS BEFORE HE WAS WIDOWED. The three of them one after another on the schedule: the married couple and the girl. It is the only document in which they appear together.", "THE AGE TALLIES TO THE DAY. Thirty-three years in 1895 → born in 1862, which is exactly what his Trassilico record says: 25 July 1862. Two archives separated by the Atlantic and by thirty-three years, with the same figure.", "HE WAS A BARBER. Not a farmer or a day labourer, like almost all his neighbours. And he can read and write. It fits with the family he left behind in Trassilico: a father who was town clerk and a grandfather who was a physician.", "AND HERE THE FIRST WIFE CEASES TO BE A LOOSE NAME. The death record of her daughter, in 1946, called her ENCARNACIÓN FERNÁNDEZ. The census, fifty-one years earlier and in her lifetime, calls her **CONCEPCIÓN FERNÁNDEZ**. They are two Marian invocations and are easily confused half a century later; most probably the good name is the one in the census, written down when she was standing there.", "And it gives what was missing about her: **ARGENTINE, BORN IN THE PROVINCE OF CÓRDOBA, aged twenty-five in 1895 → born about 1870**. She was not Italian. Her birth record would be in Córdoba, and her marriage to Tebaldo — earlier than 1892 — in Santa Fe.", "ENRIQUETA WAS THREE YEARS OLD IN 1895 → born about 1892. Her death record of 1946 gives her fifty-two years, which would give 1894. Two years' difference; the census is preferred, taken when the girl was alive and standing there.", "VERA WAS A NEW TOWN. The department of Vera was colonised in the eighteen-eighties; by 1895 Tebaldo had already been some fifteen years in Argentina and was the local barber."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20Censo%20de%20Vera%2C%20Santa%20Fe%20-%20pagina%20del%20padron.jpg", "t": "Censo de Vera, Santa Fe - pagina del padron"}], "zooms": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1895%20C%20zoom%20-%20censo%2C%20filas%208%20a%2010%3A%20Tebaldo%2C%20Concepcion%20Fernandez%20y%20Enriqueta.jpg", "t": "Censo, filas 8 a 10: Tebaldo, Concepcion Fernandez y Enriqueta"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "25 October 1900", "lugar": "Vera, Santa Fe, Argentina", "ref": "parish book, folio 101", "fuente": [["Archive", "Archivo de la Notaría Mayor Eclesiástica de la Arquidiócesis de Santa Fe"], ["Collection", "Colonia Dolores, San Justo, Santa Fe — image 57 of 164, image group 004518108"], ["Via", "FamilySearch"], ["Officiant", "the parish priest of Vera"]], "literal": "En Vera, el día veinticinco del mes de Octubre del año de mil novecientos, autorizó el Matrimonio de Don TEBALDO CELERI de treinta y ocho años, natural de Italia, de estado VIUDO, hijo legítimo de Don CALISTO CELERI y de Doña ENRIQUETA VANNI, domiciliado en Jobson (Est. Vera), con Doña MARGARITA ALASIA de diecinueve años, natural de Col. Emilia, de estado soltera, hija legítima de Don BENITO ALASIA y de Doña MAGDALENA BERTINI, domiciliada en Vera, siendo testigos del acto Don DOMINGO ALASIA y Doña MARÍA DE ALASIA.", "traduccion": "The record is in Spanish and is transcribed as it stands. What it says, fact by fact:\n\n· HIM: Tebaldo Celeri, THIRTY-EIGHT (born around 1862), a native of ITALY — no village specified — of WIDOWED status, lawful son of CALISTO CELERI and ENRIQUETA VANNI, resident at JOBSON, beside Vera station.\n· HER: Margarita Alasia, NINETEEN, a native of COLONIA EMILIA (Santa Fe), unmarried, lawful daughter of BENITO ALASIA and MAGDALENA BERTINI, resident at Vera.\n· WITNESSES: Domingo Alasia and María de Alasia — relatives of hers.", "notas": ["THIS RECORD TURNS A GAP INTO A PERSON. Until yesterday, Elba's father was «an Italian immigrant, from the north I think», without a name. Now he has a name, a year of birth, an Argentine town, two marriages and two parents.", "«OF WIDOWED STATUS» — and there an entire family was hidden. The death record of his daughter Enriqueta, in Chaco in 1946, names as her mother ENCARNACIÓN FERNÁNDEZ. She is the first wife, the one who died before 1900. There is therefore an earlier Celeri-Fernández branch, unexplored.", "NINETEEN YEARS OLD SHE, THIRTY-EIGHT HE. Exactly double. A middle-aged widower marrying the daughter of another settler family: the commonest pattern in the north of Santa Fe at the time.", "THIS RECORD DOES NOT SAY WHICH VILLAGE HE WAS FROM — it puts only «a native of Italy». It was resolved, that same day, by a document nobody had gone looking for with that in mind: the death record of his MOTHER, who died in TRASSILICO (Lucca) in 1923. An emigrant's papers rarely say where he came from; those of the one who stayed behind always do.", "JOBSON still exists: it is a locality of the department of Vera, in the north of Santa Fe, born around the railway station."], "imgs": [{"u": "../actas/1862%20-%20Tebaldo%20Celeri/1900-10-25%20M%20Matrimonio%20de%20Tebaldo%20Celeri%20y%20Margarita%20Alasia%20-%20Vera%2C%20Santa%20Fe.jpg", "t": "Matrimonio de Tebaldo Celeri y Margarita Alasia - Vera, Santa Fe"}], "zooms": []}], "nActas": 3, "nImgs": 12, "titulo": "", "parrafos": [], "claves": []}, "margarita_alasia": {"id": "margarita_alasia", "nombre": "Margarita Alasia", "legal": "daughter of «Benito Alasia y Magdalena Bertini» in the record", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-grandmother. Born at Colonia Emilia, in the heart of the Piedmontese farming colonies of Santa Fe, and married at nineteen to an Italian widower twice her age.", "datos": [["Birth", "c. 1882, COLONIA EMILIA, province of Santa Fe — from the nineteen years she declares on marrying. Argentine by birth, Italian by blood"], ["Parents", "BENEDETTO (Benito) ALASIA and MARIA MADDALENA BERTINO — from her marriage record of 1900"], ["Marriage", "25 October 1900, Vera, Santa Fe, to Tebaldo Celeri"], ["Daughters", "Elba, Olga, Ercilia, Rosa and Nerina Celeri. There may be more"], ["Where her family came from", "SAVIGLIANO, province of CUNEO, PIEDMONT — her parents married there, in the church of San Giovanni Battista, on 13 April 1857"]], "vida": "b.c.1882", "lug": "COLONIA EMILIA", "mapa": null, "sinacta": "Her marriage record is filed in Tebaldo's file. Her birth certificate —Colonia Emilia, c. 1881— and her death are missing.\n\nAN INFERENCE THAT IS FIRM, AND THAT CHANGES WHERE ONE MUST LOOK. The 1900 record says that she was «a native of COL. EMILIA» and that she was NINETEEN YEARS OLD. She was born, therefore, IN ARGENTINA, c. 1881. And if she was born here, HER PARENTS HAD ALREADY DISEMBARKED BEFORE 1881 — that is, BEFORE THE CEMLA REGISTER BEGAN, which starts in 1882. For that reason there is no point in wasting time looking for them in the disembarkation lists: they arrived before those existed.\n\nAND BY THE SAME TOKEN A LEAD THAT LOOKED GOOD FALLS AWAY. In CISEI there figures a complete ALASIA family group disembarked on 25 February 1882 —Bartolomeo aged 17, Battista aged 14, Clemente aged 8 and a Bartolomeo of six months—. It was noted down as «to be verified». IT CANNOT BE THIS FAMILY: they arrive after Margarita was born in Colonia Emilia, and a mother with a six-month-old baby in February 1882 cannot have had another daughter in 1881. It is ruled out. SHE TURNED UP IN THE 1887 CENSUS, AGED FIVE. Colonia Emilia, volume 12, booklet 12: «ALAZIO MARGARITA, 5, Argentina, Santa Fe», daughter of OLAZIO BENEDETTO, 65, and of BERTINA MADALENA, 47. With her, her siblings DOMINGO (24, already married to MARÍA MOLINA), NICOLÁS (15), JUAN (11), FRANCISCO (9), MARÍA (7) and MADALENIA (1). Her mother declares FOURTEEN CHILDREN.\n\nHER TWO ELDER BROTHERS SIGNED HER WEDDING. The witnesses of the 1900 record, «Don DOMINGO ALASIA and Doña MARÍA DE ALASIA», are that Domingo and his wife.\n\nAND THE CENSUS DATES THE EMIGRATION without any need for ship lists: Domingo (b. 1863) and Nicolás (b. 1872) were born in Italy; Juan (b. 1876) was already born in Santa Fe. THE FAMILY DISEMBARKED BETWEEN 1872 AND 1876 — ten years before the CEMLA register existed, which is exactly why they never appeared in it.\n\nTHE WITNESSES OF HER WEDDING ARE FAMILY OF HERS, almost certainly: Don DOMINGO ALASIA and Doña MARÍA DE ALASIA — «de Alasia» is the Argentine formula for a married woman. A brother and a sister-in-law. Looking for them is another way of getting to the parents.\n\nHER SURNAME OPENS A SECOND ITALY, AND IT IS NOT THE SAME ONE. The Alasia come from SAVIGLIANO, in the province of CUNEO, Piedmont; the Celeri, according to the family, from Tuscany. Grandmother Elba therefore had an Italian father and a mother who was the daughter of Italians, from two different regions of the north. Family memory said «from the north» and was right twice over.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "tebaldo_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["elba_celeri", "olga_celeri", "ercilia_celeri", "rosa_celeri", "nerina_celeri"], "hermanos": ["domingo_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "encarnacion_fernandez": {"id": "encarnacion_fernandez", "nombre": "Concepción Fernández", "legal": "«Encarnación Fernández» on her daughter's death record, of 1946", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Tebaldo Celeri's first wife, and she was not Italian: an Argentine from CÓRDOBA. For one day she was only a name in this tree, taken from a daughter's death certificate; the 1895 census put her back among the living, with an age, a province and, beside her, her husband and the little girl.", "datos": [["Name", "CONCEPCIÓN in the census of 1895, taken in her lifetime. ENCARNACIÓN in her daughter's death record, fifty-one years later. The census is preferred"], ["Birth", "c. 1870, province of CÓRDOBA, Argentina — from the twenty-five years she declares in the census of 1895"], ["Nationality", "ARGENTINE. She can read and write"], ["Spouse", "TEBALDO CELERI, barber. Married before 1892"], ["Known daughter", "ENRIQUETA CELERI, aged three in 1895 → born c. 1892"], ["In 1895", "she is living at VERA, Santa Fe, with her husband and her daughter"], ["Died between", "May 1895 and 25 October 1900, when Tebaldo marries as a WIDOWER"], ["Where it comes from", "the national census of 1895 (rows 8 to 10) and her daughter's death record — Villa Ángela, Chaco, 1946, record 88"]], "vida": "b.c.1870", "lug": "Argentina", "mapa": null, "sinacta": "Her parents, her birth certificate and her death are missing — but it is already known where to look for them.\n\nHER BIRTH, c. 1870, would be in the province of CÓRDOBA: civil registry or parish. HER MARRIAGE to Tebaldo is earlier than 1892 and would be from Santa Fe or from Córdoba; it would name her parents and —what for days was the open question of this branch— his Italian town. HER DEATH falls between May 1895 and October 1900, in Vera or thereabouts: a window of five and a half years, narrow and traceable.\n\nAND IF SHE HAD MORE CHILDREN, there are undiscovered half-siblings of Elba. In 1895 only Enriqueta is recorded, aged three, but between that date and her death she could have had more.", "padre": null, "madre": null, "conyuge": "tebaldo_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["enriqueta_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "enriqueta_celeri": {"id": "enriqueta_celeri", "nombre": "Enriqueta Celeri", "legal": "Enriqueta C. de González", "rol": "hermano", "rolNombre": "Sibling", "gen": 9, "ramas": ["celeri"], "resumen": "Daughter of Tebaldo's first marriage, and Elba's half-sister. She carries the name of her Italian grandmother. She died in Chaco in 1946.", "datos": [["Birth", "c. 1892, in the province of SANTA FE — from the three years the census of 1895 gives her, taken in her lifetime. Her death record of 1946 gives her fifty-two years, which would give 1894: the census is preferred"], ["In 1895", "she is living at VERA with her parents, Tebaldo and Concepción"], ["Name", "ENRIQUETA, after her paternal grandmother Enrichetta Vanni"], ["Parents", "TEBALDO CELERI and ENCARNACIÓN FERNÁNDEZ"], ["Spouse", "CASIMIRO GONZÁLEZ, who in 1946 was fifty-eight"], ["Trade", "«Domésticos», according to the record"], ["Death", "15 August 1946, at 9 p.m., at VILLA ÁNGELA, department of Río Zapallar, Territorio Nacional del Chaco — record 88"], ["Cause", "meningeal haemorrhage, certified by Doctor José V. Fender"]], "vida": "c.1892–1946", "lug": "", "mapa": null, "sinacta": "", "padre": "tebaldo_celeri", "madre": "encarnacion_fernandez", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "15 August 1946, 21 h; registered on the 16", "lugar": "Villa Ángela, Chaco", "ref": "record 88", "fuente": [["Archive", "Registro Civil de los Territorios Nacionales — Chaco"], ["Collection", "Villa Ángela, Mayor Luis J. Fontana, Chaco — image 94 of 225, image group 107171596"], ["Via", "FamilySearch"]], "literal": "NÚMERO ochenta y ocho. En Villa Ángela, Departamento Río Zapallar, Territorio Nacional del Chaco, República Argentina, a diez y seis de Agosto de mil novecientos cuarenta y seis, Yo, Encargado del Registro del Estado Civil, procedo a inscribir la DEFUNCIÓN de: ENRIQUETA C. DE GONZÁLEZ, de nacionalidad Argentina, de sexo femenino, edad cincuenta y dos años, de profesión Domésticos, de estado casada, domiciliada en Villa Ángela. Ocurrida en Villa Ángela a las veintiuna horas del día quince del mes de Agosto de mil novecientos cuarenta y seis, diagnóstico Hemorragia meníngea. La persona fallecida es hija de: TEBALDO CELERI […] y de ENCARNACIÓN FERNÁNDEZ. Esta inscripción se efectúa según declaración prestada por CASIMIRO GONZÁLEZ, estado casado, edad cincuenta y ocho años, domiciliado en Villa Ángela, quien ha visto el cadáver. Ante el testigo HÉCTOR J. CARRARA, estado soltero, edad veintinueve años.", "traduccion": "The record is in Spanish and is transcribed literally.", "notas": ["IT IS THE RECORD THAT UNCOVERS TEBALDO'S FIRST MARRIAGE. The record of 1900 gave him as «widowed» and did not say of whom. This one, forty-six years later and in another province, names the mother: ENCARNACIÓN FERNÁNDEZ. Two documents that know nothing of each other, fitting together at one corner.", "SHE WAS CALLED ENRIQUETA AFTER HER ITALIAN GRANDMOTHER, Enrichetta Vanni, who in 1894 was still alive in Italy and died in 1923. Tebaldo gave his daughter his mother's name, ten thousand kilometres away.", "SHE DIED IN THE CHACO, not in Santa Fe. The family moved north, to the agricultural frontier: Villa Ángela was then a national territory, not a province.", "Her siblings remain to be looked for: if Tebaldo and Encarnación had more children, they are Elba's half-siblings and there is Argentine descent still unlocated."], "imgs": [{"u": "../actas/1946%20-%20Enriqueta%20Celeri/1946-08-15%20D%20Muerte%20de%20Enriqueta%20Celeri%20de%20Gonzalez%20-%20Villa%20Angela%2C%20Chaco%20acta%2088.jpg", "t": "Muerte de Enriqueta Celeri de Gonzalez - Villa Angela, Chaco acta 88"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "calisto_celeri": {"id": "calisto_celeri", "nombre": "Callisto Celeri", "legal": "«Calisto» in the Argentine record of 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "TOWN CLERK OF TRASSILICO — the man who wrote the village's records. Born around 1831, son of a Desiderio Celeri already dead by then. Father of Tebaldo, and the proof that this family were not peasants.", "datos": [["Name", "CALLISTO in the Italian record of 1923; «Calisto» in the Argentine one of 1900. From the Latin Callistus. It is rare, and for that reason the easiest to trace in the whole branch"], ["Birth", "between November 1830 and July 1831 — he declares THIRTY-ONE YEARS in November 1861 and again in July 1862, which brackets the date"], ["Father", "DESIDERIO CELERI, already deceased in 1862 — «Celeri Callisto FU Desiderio»"], ["Trade", "POSSIDENTE E SEGRETARIO COMUNALE of the Comune di Trassilico. Both things at once: he had property and he kept the civil registration and the correspondence of the comune. Eight records of 1861 and 1862 describe him in exactly those terms"], ["How he was addressed", "the records call him SIGNORE: «alla presenza delli SIGNORI Andreini Dottor Pietro… e Celeri Callisto». He and the doctor were the two witnesses ex officio of the village — the only two lettered men in a comune where almost every declarant signs «per essere illetterato»"], ["Village", "TRASSILICO, then circondario of Garfagnana, province of MASSA"], ["Spouse", "ENRICHETTA VANNI, of Trassilico (c. 1835 – 9 September 1923). Married on 30 January 1859 in the church of Trassilico"], ["Known son", "TEBALDO CELERI, born c. 1862, who emigrated to Argentina"], ["Dead before", "September 1923 — his wife appears as a WIDOW in the record of that month"], ["Where it comes from", "his son's marriage record (Vera, Santa Fe, 1900) and his wife's death record (Trassilico, Lucca, 1923), which calls her «moglie di CELERI CALLISTO» and corrects it to «vedova»"]], "vida": "1830–<1923", "lug": "", "mapa": null, "sinacta": "Three records name him and none of them is his own. That of his son, in Argentina, and that of his wife, in Trassilico — which gives him as already dead in September 1923, by correcting «wife» to «widow» in the margin.\n\nHis birth, his marriage and his death are missing, and all three would be in TRASSILICO (Lucca): Italian civil registration begins in 1866, and before that there are parish registers. If his wife was born c. 1835 and his son in 1862, the wedding would be from the fifties or the beginning of the sixties.\n\nCALLISTO is the name that yields most in this whole branch. In a mountain village of three hundred inhabitants, a Callisto Celeri is not to be confused with anyone.", "padre": "desiderio_celeri", "madre": "angela_menghi", "conyuge": "enrichetta_vanni", "unionLibre": false, "otrasParejas": [], "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": [], "actas": [{"titulo": "His handwriting", "tipo": "F", "tipoNombre": "Photograph", "fecha": "1858 a 1866", "lugar": "Trassilico, Garfagnana", "ref": "eight records from seven different registers of the Comune di Trassilico", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico — registers 54.7 (Morti 1858), 53.1 (Matrimoni 1859), 53.3 (Matrimoni 1861), 51.5 (Nati 1862), 51.7 (Nati 1864) and 51.8 (Nati 1865)"]], "literal": "Compilato dal sottoscritto SEGRETARIO COMUNALE il presente Indice questo giorno 30 Gennajo 1859. — CELERI", "traduccion": "Four samples of the same hand, taken from four different registers:\n\n· **1858** — at the foot of the alphabetical index of deaths: «This index compiled by the undersigned TOWN CLERK, today 30 January 1859. — Celeri». **He wrote that whole index**, and signed it SIX DAYS BEFORE HIS WEDDING.\n· **1859** — «Celeri Callisto, dichiarante», at the foot of his own marriage record.\n· **1861** — «Celeri Callisto, testimone», at the wedding of Maria Celeri, Nicolao's daughter.\n· **1862** — «Celeri Callisto, dichiarante», the day he went to register Tebaldo.\n· **1863, January** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», closing the index of marriages for 1862.\n· **1863, April** — «Celeri Callisto, testimone», at the wedding of his sister-in-law LUISA VANNI to Doctor Matteo Vincenti.\n· **1864** — «Celeri Callisto, testimone», on 3 July, standing as witness at the civil registration of a neighbour's child.\n· **1866** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», closing the index of births for 1865. **It is the last signature of his that is known.**", "notas": ["HOW FAR THE CERTAINTY GOES, AND IT IS WORTH SAYING SO. What is proven is that these signatures say «CELERI» and the office «SEGRETARIO COMUNALE», and that Callisto was the town clerk of Trassilico — that is on record in eight documents between 1859 and 1862. From there to asserting that he wrote in his own hand the entire body of each index is a step that is NOT demonstrated: a clerk could sign the work of a copyist. What is certainly his are the SIGNATURES: «Celeri Callisto, dichiarante» at the foot of his own marriage record and of Tebaldo's, and «Celeri» closing the indexes. AND THESE SIGNATURES DATE HIS CAREER, WHICH WAS WHAT WAS BEING SOUGHT. It had been an ongoing attempt to establish when Callisto left the clerkship, because narrowing the date of his death depended on it. Now there is firm ground: in 1864 he signs as a witness in records 24, 25, 47, 48, 49, 52 and 53 of the register of births, always as «Celeri Callisto fu Desiderio, SEGRETARIO COMUNALE»; and at the beginning of 1866 it is still he who compiles and signs the index of births for 1865. **HE WAS STILL IN OFFICE IN 1866, aged thirty-six.** Whatever comes after that is already Italian civil registration and is not in Antenati. EVEN SO, IT IS THE ONLY PHYSICAL THING LEFT OF HIM. Of no other person in this tree — a hundred and forty-one of them, two hundred years — is any trace of the body preserved except the description of Antonio Salerno on his 1942 draft registration card. Of Callisto what remains is his handwriting.", "He signs as clerk the annual indexes of deaths for 1856, 1857, 1858, 1860 and 1861 — every year, at the end of January, he closed the previous year's. The indexes we have swept looking for his father carry his signature at the foot.", "AND THAT OPENS A ROUTE TO DATING HIS DEATH. If he signed every year, the year in which his signature disappears brackets when he left office. In the index for 1865 — the last of the holding — HE IS NO LONGER THERE: it is authenticated by «D.r PIETRO ANDREINI, ufficiale dello stato civile», the same physician who was a witness at Tebaldo's birth. BUT BEWARE: the format of the register changed in between, with the unification of Italy, and the clerk's line simply no longer appears. The absence does NOT prove that he had died. What would really bracket it are the indexes for 1862, 1863 and 1864.", "THE COINCIDENCE OF 30 JANUARY 1859. That day he signed the index of the previous year's dead… and that same day he married Enrichetta in the church of Trassilico. The wedding in the morning or in the afternoon, and the work finished all the same.", "His signature is short and decided — «Celeri», with a long flourish beneath it — set against the schoolroom, laborious hand of those declarants who could write, and against the dozens of records in the same register that end «omessa la firma per essere illetterato»."], "imgs": [{"u": "../actas/1830%20-%20Callisto%20Celeri/1858%20F%20caligrafia%20-%20firma%20Celeri%20al%20pie%20del%20indice%20de%20difuntos%20de%201858.jpg", "t": "1858 F caligrafia - firma Celeri al pie del indice de difuntos de 1858"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1859%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20en%20su%20propia%20acta%20de%20boda.jpg", "t": "1859 F caligrafia - Celeri Callisto Dichiarante en su propia acta de boda"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1861%20F%20caligrafia%20-%20Celeri%20Callisto%20testimone%20en%20la%20boda%20de%20Maria%20Celeri.jpg", "t": "1861 F caligrafia - Celeri Callisto testimone en la boda de Maria Celeri"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1862%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20al%20inscribir%20a%20Tebaldo.jpg", "t": "1862 F caligrafia - Celeri Callisto Dichiarante al inscribir a Tebaldo"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20matrimonios%20de%201862%20-%20Trassilico.jpg", "t": "1863-01 F Firma de Callisto cerrando el indice de matrimonios de 1862 - Trassilico"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1864-07-03%20F%20Firma%20de%20Callisto%20Celeri%20como%20testigo%20-%20Trassilico%20acta%2048.jpg", "t": "1864-07-03 F Firma de Callisto Celeri como testigo - Trassilico acta 48"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20nacidos%20de%201865%20-%20Trassilico.jpg", "t": "1866-01 F Firma de Callisto cerrando el indice de nacidos de 1865 - Trassilico"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Indice%20de%20nacidos%20de%201865%2C%20pagina%20de%20cierre%20-%20Trassilico.jpg", "t": "1866-01 F Indice de nacidos de 1865, pagina de cierre - Trassilico"}], "zooms": [{"u": "../actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20zoom%20-%20Celeri%20Segretario%20Comunale%20al%20pie%20del%20indice%20de%20matrimonios%20de%201862.jpg", "t": "1863-01 F Firma Celeri Segretario Comunale al pie del indice de matrimonios de 1862"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "30 January 1859 the wedding; 4 February the civil record", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 3", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Register", "ark an_ua35853344 · container hash: 03QyK9Z (18 images)"], ["Page", "5 of 18 — record 3 occupies the centre of the sheet"], ["How it was located", "by the alphabetical index at the end (page 18), the row «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». 1861 and 1860 had already been ruled out by reading their indexes in full"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Record 3. The year 1859, the FOURTH OF FEBRUARY. Before me, registrar of the Civil Status of the COMUNE OF TRASSILICO, province of Garfagnana, there appeared CALLISTO CELERI, aged TWENTY-EIGHT, A MAN OF PROPERTY AND TOWN CLERK, born and resident at Trassilico, SON OF THE LATE DESIDERIO.\n\nIn the presence of ERMENEGILDO GALANTI, son of the living Felice, and of GIOVANNI REBECHI, son of the late Paolino, both of full age, men of property and resident at Trassilico, he stated: THAT ON THE THIRTIETH OF JANUARY of the current year his marriage was celebrated with SIGNORA ENRICHETTA VANNI, DAUGHTER OF THE LATE DOCTOR PIETRO, aged TWENTY-FOUR, without profession, born and resident at Trassilico, before signor don Grandi, parish priest.\n\nTHE PARISH PRIEST'S CERTIFICATE: «The undersigned parish priest certifies that signor CALLISTO, son of the late DESIDERIO CELERI, aged twenty-eight, born and resident at Trassilico, A MAN OF PROPERTY and TOWN CLERK, and signora ENRICHETTA VANNI, aged twenty-four, likewise born and resident at Trassilico, A WOMAN OF PROPERTY, celebrated on the thirtieth of January 1859 their marriage according to the rites of the Catholic Church before me, in the presence of PIETRO BONETTI, son of the late Antonio, and PIETRO MENGHI, son of the late Luigi, both witnesses of Trassilico. And in witness whereof, from the parish house of Trassilico, today 4 February 1859. DOMENICO GRANDI, rector.»", "notas": ["IT IS THE WEDDING THAT WAS BEING SOUGHT, AND IT COST THREE YEARS OF INDEXES. First 1861 (forty weddings) and 1860 were ruled out, by reading their alphabetical indexes in full, before it was found in 1859. That method — one image of an index per year instead of a whole register — is what made the search viable.", "THE AGES TALLY WITH EVERYTHING ELSE. He, twenty-eight in February 1859 → born about 1830-31, the same as the thirty-one he declares in 1861 and 1862. She, twenty-four → born about 1834-35, the same as the twenty-seven of 1862 and the eighty-eight of her death record of 1923. Four documents, sixty-four years and two different archives, all pointing to the same pair of dates.", "BOTH WERE «POSSIDENTI» — PROPERTY OWNERS. And she in her own right: the parish priest's certificate calls her possidente, not «daughter of». In a mountain village where the neighbouring record describes the couple as «agricoltore» and «agricoltrice», and where most sign «per essere illetterato», this marriage is that of two property owners who can write. Their two civil witnesses are possidenti too.", "WHAT THE RECORD DOES NOT GIVE, AND IT MUST BE SAID: IT DOES NOT NAME THE MOTHERS. Of him only «figlio del fu Desiderio»; of her only «figlia del fu Dr. Pietro». Callisto's mother remains unknown. Enrichetta's — LIVIA RIGHINI — we know by another route: her death record of 1923.", "THEY MARRIED IN JANUARY AND TEBALDO WAS BORN IN JULY 1862 — three and a half years later. If there were no children in between, and the indexes of births for 1861 and 1862 carry none, 1859 and 1860 remain to be swept.", "DON DOMENICO GRANDI married them in 1859 and baptised Tebaldo in 1862. The same priest, in the same village, in the two most important records of this branch."], "imgs": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "enrichetta_vanni": {"id": "enrichetta_vanni", "nombre": "Enrichetta Vanni", "legal": "«Doña Enriqueta Vanni» in the Argentine record of 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-great-grandmother. She was born and died at TRASSILICO, a mountain village in the Garfagnana, province of Lucca, and lived eighty-eight years without leaving it. Her death record is the one that gave this whole branch a village: until it surfaced, all that was known of Tebaldo was that he was «a native of Italy».", "datos": [["Birth", "c. 1835, TRASSILICO, province of Lucca, Tuscany — from the eighty-eight years her death record gives her"], ["Parents", "PIETRO VANNI and LIVIA RIGHINI, both of Trassilico and both already dead in 1923"], ["Spouse", "CALLISTO CELERI — the record calls her «moglie di Celeri Callisto», corrected in the margin to «anzi VEDOVA»"], ["Known son", "TEBALDO CELERI, born c. 1862, who emigrated to Argentina"], ["Address", "TRASSILICO, VIA DEL CENTRO, number 17 — the house where she was born and where she died eighty-eight years later. The link leads to the village: there is no mapped street numbering there. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["Trade", "«atta a casa» — given over to her house"], ["Marriage", "30 January 1859, church of Trassilico, to CALLISTO CELERI — civil record 3, of 4 February. She was twenty-four"], ["Standing", "POSSIDENTE — a property owner in her own right, as the parish priest's certificate of 1859 calls her"], ["Death", "9 September 1923, at 3:30 in the morning, at her house in Trassilico — record 10, registered on the 10th at 2:25 p.m."]], "vida": "c.1835–1923", "lug": "TRASSILICO", "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico — Via del Centro, 17", "pie": "She was born here around 1835 and died here on 9 September 1923, at half past three in the morning, aged eighty-eight. In the same house, in the same village, which she probably never left. Her son Tebaldo had by then been more than forty years in Argentina."}, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": "calisto_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": ["luisa_vanni"], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "9 September 1923, 3:30 h; registered on the 10 at 14:25", "lugar": "Trassilico, Lucca", "ref": "record 10", "fuente": [["Archive", "Tribunale di Lucca"], ["Collection", "Vagli Sopra / Vagli di Sotto, Lucca, Tuscany — image 887 of 2093, image group 007977983"], ["Via", "FamilySearch"], ["Registrar", "Pasquale Biglini, prefectural commissioner and registrar of the civil status of the Comune di Trassilico"]], "literal": "Numero 10 — VANNI ENRICHETTA fu PIETRO, VEDOVA CELERI.\nL'anno millenovecento ventitre, addì dieci di Settembre, a ore pomeridiane due e minuti venticinque, nella Casa Comunale. Avanti di me Biglini Pasquale Commissario Prefettizio ed Ufficiale dello stato civile del Comune di TRASSILICO, sono comparsi Bonetti Angelo di Jacopo, di anni quaranta, agricoltore, domiciliato in Trassilico, e Simoni Cirio fu Egisto, di anni trentadue, bracciante, domiciliato in Trassilico, i quali mi hanno dichiarato che a ore antimeridiane tre e minuti trenta di ieri, nella casa posta in Trassilico in VIA DEL CENTRO al numero diciassette, è morta VANNI ENRICHETTA di anni ottantotto, atta a casa, residente in Trassilico, nata in Trassilico, da fu PIETRO, domiciliato in vita a Trassilico, e da fu RIGHINI LIVIA, domiciliata in vita in detto luogo, MOGLIE DI CELERI CALLISTO. [al margen: anzi VEDOVA]\nA quest'atto sono stati presenti quali testimoni Bonetti Jacopo fu Angelo, di anni settantaquattro, agricoltore, e Paoli Amilcare fu Giacomo, di anni trentadue, falegname, ambi residenti in questo Comune.", "traduccion": "Number 10 — VANNI ENRICHETTA, daughter of the late Pietro, WIDOW CELERI.\n\nIn the year nineteen hundred and twenty-three, on the TENTH OF SEPTEMBER, at twenty-five past two in the afternoon, at the Town Hall. Before me, PASQUALE BIGLINI, prefectural commissioner and registrar of the civil status of the COMUNE OF TRASSILICO, there appeared ANGELO BONETTI, son of Jacopo, aged forty, farmer, resident at Trassilico, and CIRIO SIMONI, son of the late Egisto, aged thirty-two, day labourer, resident at Trassilico.\n\nWho declared to me that AT HALF PAST THREE YESTERDAY MORNING, in the house situated at TRASSILICO, IN VIA DEL CENTRO, NUMBER SEVENTEEN, there died ENRICHETTA VANNI, AGED EIGHTY-EIGHT, keeping her own house, resident at Trassilico, BORN AT TRASSILICO, daughter of the late PIETRO, resident in life at Trassilico, and of the late LIVIA RIGHINI, resident in life in the same place, WIFE OF CALLISTO CELERI. — In the margin, correcting: «rather WIDOW».\n\nPresent as witnesses were JACOPO BONETTI, son of the late Angelo, aged seventy-four, farmer, and AMILCARE PAOLI, son of the late Giacomo, aged thirty-two, carpenter, both resident in this comune.", "notas": ["THIS IS THE RECORD THAT GIVES THE WHOLE BRANCH A VILLAGE. The two Argentine documents of her son Tebaldo — the marriage of 1900 and the death of his granddaughter in 1946 — say only «a native of Italy». Neither gives the village. This one does, and by the most indirect route: it is not the paper of the one who left, it is that of the one who stayed.", "AND IT CONFIRMS FAMILY MEMORY TO THE LETTER. Gonzalo remembered her as «Trasilico de Galicanto, Lucca». The record says COMUNE DI TRASSILICO, province of Lucca. In 1923 Trassilico was a municipality in its own right; it was merged with GALLICANO shortly afterwards. The family kept both names, that of the village and that of the municipality that swallowed it, for a hundred years and at ten thousand kilometres' distance.", "THE HOUSE: TRASSILICO, VIA DEL CENTRO, NUMBER 17. It is the only specific address known for this branch, and the place from which Tebaldo left for Argentina. Trassilico is a mountain village of the Garfagnana, in the Serchio valley, beneath the Apuan Alps, and it fits entire within two hundred and fifty metres.\n\nBEWARE: VIA DEL CENTRO NO LONGER EXISTS. Trassilico today has eleven named streets and none is called that — the names changed, in all probability when the municipality merged with Gallicano around 1928, five years after this record. The firmest candidate is the VIA ANTONIO VALLISNERI, which is the village's central street and bears the name of its illustrious son. All of that is explained in Tebaldo's file, with the measurements. On the map: https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia", "«MOGLIE DI CELERI CALLISTO», CORRECTED IN THE MARGIN TO «ANZI VEDOVA». The clerk first wrote «wife» and then somebody emended it to «widow». It is the proof that Callisto was already dead in September 1923, even though nobody knows when.", "HER PARENTS, CONFIRMED AND BOTH DEAD: PIETRO VANNI and LIVIA RIGHINI, both of Trassilico. The FamilySearch tree gave her as the daughter of Pietro Vanni and «Lucia» Righini; the record says LIVIA. The record is preferred.", "NOT A SINGLE SIBLING OF HERS IS STILL KNOWN. A «Vanni Maria Francesca di Pietro» from the 1863 index was tried, in case that Pietro were a son of the doctor; on reading the record, she turned out to be a nailmaker's daughter from Le Fabbriche, the child of a Francesco. Ruled out.", "SHE DIED AT THE AGE OF EIGHTY-EIGHT IN THE HOUSE IN WHICH SHE WAS BORN, in a village she probably never left. Her son had by then been more than forty years in Argentina, and her Argentine granddaughter — whom she never met — was called Enriqueta after her."], "imgs": [{"u": "../actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20Muerte%20de%20Enrichetta%20Vanni%20viuda%20de%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2010.jpg", "t": "Muerte de Enrichetta Vanni viuda de Celeri - Trassilico, Lucca acta 10"}], "zooms": [{"u": "../actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20zoom%20-%20acta%2010%20completa%2C%20Trassilico.jpg", "t": "Acta 10 completa, Trassilico"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "30 January 1859 the wedding; 4 February the civil record", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 3", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Register", "ark an_ua35853344 · container hash: 03QyK9Z (18 images)"], ["Page", "5 of 18 — record 3 occupies the centre of the sheet"], ["How it was located", "by the alphabetical index at the end (page 18), the row «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». 1861 and 1860 had already been ruled out by reading their indexes in full"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Record 3. The year 1859, the FOURTH OF FEBRUARY. Before me, registrar of the Civil Status of the COMUNE OF TRASSILICO, province of Garfagnana, there appeared CALLISTO CELERI, aged TWENTY-EIGHT, A MAN OF PROPERTY AND TOWN CLERK, born and resident at Trassilico, SON OF THE LATE DESIDERIO.\n\nIn the presence of ERMENEGILDO GALANTI, son of the living Felice, and of GIOVANNI REBECHI, son of the late Paolino, both of full age, men of property and resident at Trassilico, he stated: THAT ON THE THIRTIETH OF JANUARY of the current year his marriage was celebrated with SIGNORA ENRICHETTA VANNI, DAUGHTER OF THE LATE DOCTOR PIETRO, aged TWENTY-FOUR, without profession, born and resident at Trassilico, before signor don Grandi, parish priest.\n\nTHE PARISH PRIEST'S CERTIFICATE: «The undersigned parish priest certifies that signor CALLISTO, son of the late DESIDERIO CELERI, aged twenty-eight, born and resident at Trassilico, A MAN OF PROPERTY and TOWN CLERK, and signora ENRICHETTA VANNI, aged twenty-four, likewise born and resident at Trassilico, A WOMAN OF PROPERTY, celebrated on the thirtieth of January 1859 their marriage according to the rites of the Catholic Church before me, in the presence of PIETRO BONETTI, son of the late Antonio, and PIETRO MENGHI, son of the late Luigi, both witnesses of Trassilico. And in witness whereof, from the parish house of Trassilico, today 4 February 1859. DOMENICO GRANDI, rector.»", "notas": ["IT IS THE WEDDING THAT WAS BEING SOUGHT, AND IT COST THREE YEARS OF INDEXES. First 1861 (forty weddings) and 1860 were ruled out, by reading their alphabetical indexes in full, before it was found in 1859. That method — one image of an index per year instead of a whole register — is what made the search viable.", "THE AGES TALLY WITH EVERYTHING ELSE. He, twenty-eight in February 1859 → born about 1830-31, the same as the thirty-one he declares in 1861 and 1862. She, twenty-four → born about 1834-35, the same as the twenty-seven of 1862 and the eighty-eight of her death record of 1923. Four documents, sixty-four years and two different archives, all pointing to the same pair of dates.", "BOTH WERE «POSSIDENTI» — PROPERTY OWNERS. And she in her own right: the parish priest's certificate calls her possidente, not «daughter of». In a mountain village where the neighbouring record describes the couple as «agricoltore» and «agricoltrice», and where most sign «per essere illetterato», this marriage is that of two property owners who can write. Their two civil witnesses are possidenti too.", "WHAT THE RECORD DOES NOT GIVE, AND IT MUST BE SAID: IT DOES NOT NAME THE MOTHERS. Of him only «figlio del fu Desiderio»; of her only «figlia del fu Dr. Pietro». Callisto's mother remains unknown. Enrichetta's — LIVIA RIGHINI — we know by another route: her death record of 1923.", "THEY MARRIED IN JANUARY AND TEBALDO WAS BORN IN JULY 1862 — three and a half years later. If there were no children in between, and the indexes of births for 1861 and 1862 carry none, 1859 and 1860 remain to be swept.", "DON DOMENICO GRANDI married them in 1859 and baptised Tebaldo in 1862. The same priest, in the same village, in the two most important records of this branch."], "imgs": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "luisa_vanni": {"id": "luisa_vanni", "nombre": "Luisa Vanni", "legal": "«ALOISA» in the body of the record; she signs LUISA", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Enrichetta's elder sister, and the woman in whose house Tebaldo was born. For days she was only a loose name in the 1862 record; on 27 August 2026 she turned out to be his aunt.", "datos": [["Birth", "c. 1832, TRASSILICO — from the thirty-one years she declares on marrying in April 1863"], ["Parents", "the late DOTTOR PIETRO VANNI, a lawyer born at Lucca, and LIVIA RIGHINI, born at Castelnuovo — THE SAME PARENTS AS ENRICHETTA"], ["Standing", "POSSIDENTE — a property owner, just like her sister"], ["Marriage", "26 April 1863 the promise, the 29th the solemnisation — Trassilico, records 3 and 6"], ["Husband", "DOCTOR MATTEO VINCENTI, aged thirty-four, PHYSICIAN, born and domiciled at COREGLIA ANTELMINELLI, son of the late Antonio Vincenti and of Elisabetta Serafini, both «possidenti»"], ["Her mark on the tree", "on 25 July 1862, TEBALDO WAS BORN IN HER HOUSE, at the place called «Alla Maestà». Ten months before she married"], ["Signature", "she signed her marriage record in her own hand: «LUISA VANNI»"]], "vida": "b.c.1832", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["enrichetta_vanni"], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "26 April 1863 the promise; 29 the celebration", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "records 3 and 6", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.5 «Matrimoni» 1863"], ["Shelfmark", "ark:/12657/an_ua35853348 — hash 03QyKYJ, 20 images; the record on page 5, the index on page 20"]], "literal": "", "traduccion": "The year 1863, the 26th day of April. Before me, the undersigned BERTOLI BARSOTTI RANIERI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, Province of Massa, Circondario of the Garfagnana, there appeared:\n\nVINCENTI DOCTOR MATTEO, aged thirty-four, born and resident at COREGLIA ANTELMINELLI, by profession a PHYSICIAN, son of the late VINCENTI ANTONIO, aged eighty-three, a man of property, and of SERAFINI ELISABETTA, aged sixty, likewise of property, both born and resident in the said Coreglia;\n\nand VANNI ALOISA, aged thirty-one, born and resident at Trassilico, A WOMAN OF PROPERTY, DAUGHTER OF THE LATE DOCTOR PIETRO VANNI — by profession a LAWYER, BORN AT LUCCA and resident at Trassilico — AND OF RIGHINI LIVIA, aged fifty, without profession, BORN AT CASTELNUOVO and resident at Trassilico;\n\nwho, in the presence of CELERI CALLISTO, son of the late Desiderio, aged thirty-two, TOWN CLERK, and of BONETTI PIETRO, son of the late Antonio, aged thirty-three, farmer, both born and resident at Trassilico, witnesses, declared to me that it was their intention to be joined in marriage.", "notas": ["LUISA VANNI WAS ENRICHETTA'S ELDER SISTER. The record calls her «Aloisa» in the body, but she signs «LUISA VANNI» in her own hand, and it declares her the daughter of the late doctor Pietro Vanni and of Livia Righini: exactly the same parents.", "AND THAT EXPLAINS THE ODDEST FACT IN THE TREE. Tebaldo was born on 25 July 1862 «in the house of Luisa Vanni, Alla Maestà». It was not a neighbour's house: it was his AUNT'S house. Enrichetta went to give birth at her sister's. Ten months later, Luisa married.", "THE FATHER WAS NOT A PHYSICIAN, HE WAS A LAWYER, AND HE WAS NOT FROM TRASSILICO. «Di professione LEGALE, nato in LUCCA». He had been taken for the village doctor because Tebaldo's record calls him «dottor Pietro» — but in Italy «dottore» is any graduate. He was a man of law, and he came from the city.", "LIVIA RIGHINI WAS ALIVE, WAS FIFTY YEARS OLD AND SIGNED. And the record confirms in black and white that SHE WAS BORN IN CASTELNUOVO, which was the doubtful reading of the 1860 record. Her signature and her daughter's are the first two women's signatures in this branch.", "A DIFFICULTY THAT IS NOT COVERED UP: of the late Pietro Vanni the record says «aged thirty-two years». This register does give the age of dead parents — it gives the groom's father eighty-three — but thirty-two is incompatible with having one daughter in 1832 and another in 1835, unless he died about 1835 with Luisa aged three and Enrichetta newly born, leaving Livia a widow at twenty-two. It is possible, but extraordinary. It may also be a slip of the clerk's. It is not resolved by this document.", "CALLISTO CELERI, aged thirty-two and town clerk, was a witness at his sister-in-law's wedding. It is the seventh known specimen of his signature."], "imgs": [{"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20Partida%20de%20bautismo%20de%20Luisa%20Vanni%20-%20Trassilico%2C%20libro%20F%20pag%2026%20n%2068.jpg", "t": "Partida de bautismo de Luisa Vanni - Trassilico, libro F pag 26 n 68"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863%20I%20Indice%20de%20matrimonios%20de%20Trassilico%201863.jpg", "t": "1863 I Indice de matrimonios de Trassilico 1863"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Acta%20notarial%20de%20asenso%20de%20Elisabetta%20Serafini%20-%20Borgo%20a%20Mozzano.jpg", "t": "Acta notarial de asenso de Elisabetta Serafini - Borgo a Mozzano"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Certificado%20del%20prior%20de%20Coreglia%20sobre%20los%20Vincenti%20-%20tres%20generaciones.jpg", "t": "Certificado del prior de Coreglia sobre los Vincenti - tres generaciones"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20F%20Firmas%20de%20Luisa%20Vanni%20y%20de%20Livia%20Righini%20-%20Trassilico%20acta%203.jpg", "t": "1863-04-26 F Firmas de Luisa Vanni y de Livia Righini - Trassilico acta 3"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20Acta%20de%20matrimonio%20-%20Trassilico%20acta%203.jpg", "t": "Acta de matrimonio - Trassilico acta 3"}], "zooms": [{"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20zoom%20-%20del%20fu%20avvocato%20Giuseppe%20del%20caporal%20Pietro%20Vanni.jpg", "t": "Del fu avvocato Giuseppe del caporal Pietro Vanni"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20el%20padre%2C%20dottor%20Pietro%20Vanni%2C%20nacido%20en%20LUCCA%20y%20de%20profesion%20legal.jpg", "t": "El padre, dottor Pietro Vanni, nacido en LUCCA y de profesion legal"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20la%20madre%2C%20Livia%20Righini%20de%2050%20anios%2C%20nacida%20en%20Castelnuovo.jpg", "t": "La madre, Livia Righini de 50 anios, nacida en Castelnuovo"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "caporal_pietro_vanni": {"id":
