índice"], ["Where this comes from", "el extracto de defunción de su marido, que lo llama «MICHAEL VOLPENTESTA VIR THERESIAE TENUTA» — marido de Teresa Tenuta"], ["Viuda desde", "agosto de 1793"]], "mapa": null, "sinacta": "Su caso es el mejor ejemplo de por qué en este árbol el índice no cuenta como prueba. Los índices escaneados del blog la daban como madre de Vincenzo desde el principio, en dos filas distintas (Vincenzo 1823/8 y su hijo Pietro 1827/34). Pero el acta de 1823 se leyó dos veces —el original y la copia certificada de 1837— y las dos dejan la casilla de la madre EN BLANCO, con la raya impresa sin rellenar. Así que se decidió no abrirle ficha: un nombre sin documento no entra.\n\nLo que la rescató fue el extracto parroquial de la muerte de su marido, escondido dentro del expediente matrimonial de su nieta. Un documento en latín, de 1793, que la nombra en tres palabras: VIR THERESIAE TENUTA.\n\nDe ella misma no se sabe nada más: ni año, ni pueblo, ni padres, ni cuándo murió. En 1793 enviudó. Todo lo suyo sería parroquial, porque el registro civil no empieza hasta 1809. Dato al margen que conviene no olvidar: en el mismo Marano hay otro Vincenzo Volpintesta, hijo de un Ferdinando y de una ANNA MARIA TENUTA, muerto en 1855. Apellido de madre idéntico y familia distinta.\n\n*** 29 DE AGOSTO DE 2026 — AHORA TIENE HIJOS CON NOMBRE Y AÑO. *** Los libros de bautizos de la parroquia de Rende empiezan en 1731 y están transcritos en el blog calabrés. Barridos año por año, salen TRES hijos suyos, los tres con la misma fórmula «Volpintesta, Michele — Tenuta, Teresa»: PIETRO GAETANO en 1767 (acta 13), VINCENZO MERCURIO en 1770 (acta 48) y GREGORIO GIOACCHINO en 1773 (acta 41). Es decir: estuvo viviendo en RENDE por lo menos de 1767 a 1773, y allí enviudó en 1793.\n\n*** Y EL DE 1770 SE LLAMA VINCENZO. *** Si ese niño es nuestro Vincenzo, entonces la casilla que el acta de 1823 dejó en blanco queda por fin rellenada por una vía independiente, y ella deja de depender de las tres palabras latinas de 1793. Pero hay un choque —el acta de defunción dice que Vincenzo nació en Marano, y las edades dan 1773 o 1776, no 1770— que está explicado entero en la ficha de él. Sigue sin darse por bueno hasta ver el libro original, que está en FamilySearch y no en Antenati.\n\nDE SUS PROPIOS PADRES SIGUE SIN SABERSE NADA, y no será fácil: el matrimonio con Michele no está en los treinta y nueve años de índices de matrimonios de Rende que se han leído (1733-1750 y 1752-1772). O está en el único año que falta, 1751, o se casaron en la parroquia de ella. Familias TENUTA de Rende de aquellos años, por si alguna es la suya: Gaetano Tenuta con Isabella Chiappetta, Tommaso Tenuta con Chiara Russo, Biaggio Tenuta con Teresa Rocchetto, Vincenzo Tenuta con Rosa Rizzo y Antonio Tenuta con Carmina Di Simone.\n\n*** SE LA BUSCÓ EN DIECISÉIS AÑOS DE BAUTIZOS Y NO ESTÁ — Y SE SABE POR QUÉ. *** El 29 de agosto de 2026 se barrieron los bautizos de Rende de 1735 y de 1741 a 1755, año por año, en la franja alfabética donde cae TENUTA. Ninguna Teresa. Pero el fallo no es de ella: *** las transcripciones saltan de 1735 a 1741 — faltan 1736, 1737, 1738, 1739 y 1740 ***, y esos cinco años caen justo en el centro de la horquilla en que tuvo que nacer. Sus hijos se bautizan en 1767, 1770 y 1773; naciendo antes de 1735 habría tenido más de treinta y dos años al primero, y naciendo después de 1755, doce. O está en esos cinco años que faltan, o no era de Rende.\n\nEl barrido no fue en balde: dejó CINCO familias Tenuta de Rende documentadas con hijos en esos años, y una de ellas será la suya. *** La primera que hay que mirar es NICOLA TENUTA con TERESA CHIAPPETTA ***, con hijos en 1745, 1748, 1751 y 1753 — porque la madre se llama Teresa, y ponerle a una hija el nombre de la madre era lo más corriente del mundo. Las otras cuatro: Giuseppe Tenuta con Innocenza Turano, Tommaso Tenuta con Chiara, Biaggio Tenuta con Teresa Rocchetto y Michele Tenuta con Innocenza Mirabelli.\n\nTAMPOCO ESTÁ ENTERRADA EN RENDE ENTRE 1802 Y 1809, barridos los ocho años. Enviudó en agosto de 1793, así que o murió entre 1793 y 1801 —años que las transcripciones no tienen— o murió de 1809 en adelante, y entonces su acta ya es CIVIL y está en Antenati.\n\nY una advertencia que sale del mismo barrido y que hay que tener presente al leer todo lo que venga de esas tablas: la mujer de Tommaso Tenuta se llama Chiara en cinco filas, y su apellido está transcrito de TRES maneras distintas —Ruffolo, Russo y Di Bartolo—. *** La columna del apellido de la madre no siempre es de fiar. *** A ella eso no la toca, porque su nombre no viene de una transcripción sino de un documento: las tres palabras latinas de 1793.\n\nDONDE NO ESTÁ, Y ESO YA ES UN DATO (29 de agosto de 2026). Se han leído cuatro tablas parroquiales de Rende —los matrimonios de 1796 y 1798 y los entierros de 1804 y 1807, varios centenares de personas— y NO APARECE UN SOLO TENUTA: ni de novia, ni de madre, ni de difunta, ni de mujer de difunto. Se suma a la búsqueda anterior de su bautismo en Rende (1735 y 1741-1755), que también dio cero. Aquello se achacó a que al blog le faltan los años 1736-1740; ya no se puede achacar a eso. La explicación sencilla es que TENUTA NO ES UN APELLIDO DE RENDE, y encaja con el conflicto ya anotado en la ficha de su hijo Vincenzo, cuya acta de defunción dice que nació en MARANO. Así que deja de buscarse aquí: hay que buscarla en MARANO MARCHESATO, que es donde vive esta rama. Esto no prueba que no exista ningún Tenuta en Rende en otros años — es un indicio fuerte, no una demostración.", "padre": null, "madre": null, "conyuge": "michele_volpintesta", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "rosina_salerno": {"id": "rosina_salerno", "nombre": "Rosina Salerno", "legal": "ROSE SALERNO en Estados Unidos", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["salerno"], "resumen": "Antonio's wife. Salerno by her maiden name too, as he was, and also from the province of Cosenza. She reached New York on the steamer Giuseppe Verdi and outlived her husband.", "datos": [["Birth", "hacia 1901-1907, provincia de COSENZA, Italia — el censo de 1950 le da 43 años, su petición de naturalización una fecha algo anterior"], ["Apellido", "SALERNO de soltera. Se casó con un Salerno sin ser pariente conocida: en estos pueblos el apellido no identifica a una familia"], ["Emigration", "llegó a NUEVA YORK en el vapor GIUSEPPE VERDI, en febrero de los años veinte — la cifra exacta del año no se lee con seguridad"], ["Marriage", "19 de mayo de 1920, con Antonio Salerno"], ["Children", "Domenico (1922) y Filomena (1925), los dos en Riverdale, Illinois"], ["Nacionalización", "petición propia n.º 60555; su marido se nacionalizó el 25 de enero de 1929"], ["Parents", "por el árbol de FamilySearch, RAFFAELE SALERNO y CHERUBINA CUNDARI — sin acta"], ["Viva en", "mayo de 1981, cuando enviudó"]], "mapa": null, "sinacta": "Su petición de naturalización está archivada en la ficha de Antonio, pero la imagen es de baja resolución y varias cifras —su año de nacimiento y el del viaje— no se leen con seguridad. Convendría volver a pedirla a FamilySearch en tamaño completo.\n\nLo que sí queda claro: se casó el 19 de mayo de 1920, llegó en el GIUSEPPE VERDI, y su marido se nacionalizó el 25 de enero de 1929. El árbol de FamilySearch la hace hija de Raffaele Salerno y Cherubina Cundari, y nieta de Vincenzo Salerno y Angela Rosa Cardamone por un lado y de Giuseppe Cundari y Anna Motta por otro. Nada de eso tiene acta todavía.", "padre": null, "madre": null, "conyuge": "antonio", "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dominick_salerno": {"id": "dominick_salerno", "nombre": "Domenico Salerno", "legal": "DOMINICK D. SALERNO", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 9, "ramas": ["salerno"], "resumen": "Eldest son of Antonio and Rosina, the first of the family born in the United States. A railway switchman.", "datos": [["Birth", "11 de febrero de 1922, RIVERDALE, Illinois"], ["Name", "DOMENICO, por su tío Domenico Salerno, el hermano mayor de su padre que se quedó en Rende"], ["Parents", "Antonio Salerno y Rosina Salerno"], ["Trade", "SWITCHMAN (guardagujas) de la compañía de ferrocarril, 36 horas en 1950"], ["Familia", "en 1950 vivía en casa de sus padres con su mujer MARY L. y una hija de dos años, BEVERLEE"], ["Vivo en", "mayo de 1981, en Riverdale, cuando murió su padre"]], "mapa": null, "sinacta": "Sale de tres documentos de su padre: la petición de naturalización de 1925 le da la fecha exacta de nacimiento, el censo de 1950 lo pone en casa con mujer e hija, y la esquela de 1981 lo nombra como el hijo que sobrevive. Su propia partida estaría en el condado de Cook, Illinois.\n\nLos «dos nietos y cinco bisnietos» de la esquela de 1981 salen casi seguro de él: en 1950 ya tenía una hija de dos años. Por esta rama hay descendencia americana viva.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "hijos": [], "hermanos": ["filomena_salerno_usa"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_salerno_usa": {"id": "filomena_salerno_usa", "nombre": "Filomena Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 9, "ramas": ["salerno"], "resumen": "Daughter of Antonio and Rosina, born in Illinois and christened with her Calabrian grandmother's name.", "datos": [["Birth", "8 de febrero de 1925, RIVERDALE, Illinois"], ["Name", "FILOMENA, por su abuela Filomena Chiappetta, que seguía viva en Rende. Su padre le puso el nombre de una mujer a la que la niña no llegaría a conocer"], ["Parents", "Antonio Salerno y Rosina Salerno"], ["En 1950", "ya no vive en casa de sus padres, con veinticinco años — probablemente casada"]], "mapa": null, "sinacta": "Sólo la conocemos por la petición de naturalización de su padre, de 1925, que da su fecha exacta. No aparece en el censo de 1950 ni en la esquela de 1981, así que o se casó y cambió de apellido, o murió antes que su padre. Su partida de nacimiento estaría en el condado de Cook, Illinois, y sería el documento que dijera con quién se casó.", "padre": "antonio", "madre": "rosina_salerno", "conyuge": null, "hijos": [], "hermanos": ["dominick_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "ciro_celeri": {"id": "ciro_celeri", "nombre": "Ciro Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "The fourth child of Callisto and Enrichetta, and the only one born after the digitised registers run out. He died at twenty-three.", "datos": [["Birth", "1867, Trassilico — según el árbol de FamilySearch (GVC6-C8J)"], ["Death", "1890, a los veintitrés años — misma fuente"], ["Parents", "CALLISTO CELERI y ENRICHETTA VANNI"], ["Siblings", "Giuseppe Tullio Polinice (1860), Tebaldo (1862) y Dante Giuseppe (1864)"], ["Source", "árbol de FamilySearch. SIN ACTA"]], "mapa": null, "sinacta": "No tiene acta, y hay una razón limpia para ello: *** EL FONDO DIGITALIZADO DE TRASSILICO TERMINA EN 1865, Y CIRO NACIÓ EN 1867. *** Cae justo en el hueco. No es que no se haya buscado: es que no se puede ver.\n\nESO MISMO LO VUELVE INTERESANTE. Antes de conocerlo se había concluido, barriendo los índices de nacidos de 1861, 1863 y 1865, que con Antenati no iban a salir más hermanos y que los posteriores a 1866 ya eran registro civil italiano no digitalizado. Ciro aparece exactamente donde esa conclusión decía que tendría que estar lo que faltaba.\n\nSU ACTA DE NACIMIENTO Y LA DE DEFUNCIÓN EXISTEN, pero en el Comune di Trassilico o en el Tribunale di Lucca, no en Antenati. Y su muerte en 1890, con veintitrés años, cae en los años en que su hermano Tebaldo ya llevaba tiempo en Argentina.", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "hijos": [], "hermanos": ["tebaldo_celeri", "dante_celeri", "giuseppe_celeri"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "dante_celeri": {"id": "dante_celeri", "nombre": "Dante Giuseppe Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Tebaldo's younger brother, born twenty months after him. He surfaced on 27 August 2026, in the index of births for 1864.", "datos": [["Birth", "5 de abril de 1864, a las OCHO DE LA MAÑANA, en TRASSILICO"], ["Dónde", "en la casa propia de sus padres, en el paraje llamado «NELLA PIAZZA DELLA MAESTÀ» — la misma plaza donde había nacido Tebaldo dos años antes"], ["Inscripción", "10 de abril de 1864, Comune di Trassilico, acta 25. Lo declaró su padre"], ["Parents", "CALLISTO CELERI, de 34 años, SEGRETARIO COMUNALE, y ENRICHETTA VANNI, de 30"], ["Witnesses", "DARIO PIEROTTI, hijo de Angelo, y LEOPOLDO GAMBI, hijo de Jacopo, agricultor"], ["Quién firmó el acta", "el DOCTOR PIETRO ANDREINI, hijo del difunto Carlo, «Delegato Ufficiale dello Stato Civile» por acto del 30 de diciembre de 1863"], ["El nombre", "DANTE. Después de Polinice y de Archimede, el tercer hijo del secretario se llama como el poeta"]], "mapa": null, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "hijos": [], "hermanos": ["tebaldo_celeri", "ciro_celeri", "giuseppe_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "5 de abril de 1864 el parto; 10 el acta", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 25", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 51.7 «Nati» 1864"], ["Signatura", "ark:/12657/an_ua35853264 — hash 5vX82KK, 44 imágenes; el acta en la página 14, el índice alfabético en las 42 y 43"]], "literal": "", "traduccion": "The year 1864, the 10th day of April. Before me, the undersigned ANDREINI DOCTOR PIETRO, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, Circondario of the Garfagnana, there appeared CELERI CALLISTO, SON OF THE LATE DESIDERIO, aged THIRTY-FOUR, TOWN CLERK, born and resident at Trassilico,\n\nwho, in the presence of DARIO PIEROTTI son of Angelo, without profession, and of LEOPOLDO GAMBI son of Jacopo, farmer, witnesses of full age, both born and resident at Trassilico, declared that on the FIFTH of the current month and year, at EIGHT IN THE MORNING, there was born to him in the house of his dwelling, situated at Trassilico, IN THE PLACE CALLED ON THE SQUARE OF THE MAESTÀ,\n\nof VANNI ENRICHETTA, daughter of the late Pietro, aged THIRTY, without profession, born and resident at Trassilico, his lawful consort, a son upon whom were bestowed the names DANTE GIUSEPPE.", "notas": ["*** EL TERCER HIJO DOCUMENTADO DE CALLISTO Y ENRICHETTA. *** Van Giuseppe Tullio Polinice (noviembre de 1860), Tebaldo Jacopo Archimede (julio de 1862) y Dante Giuseppe (abril de 1864): uno cada veinte meses.", "Y SIGUE LA MISMA MANÍA CULTA. Polinice, Archimede y ahora DANTE. En un pueblo de cien vecinos, el secretario del ayuntamiento bautizaba a sus hijos con la biblioteca delante.", "LA CASA YA ES SUYA Y ESTÁ EN LA PLAZA. En 1860 vivían «dai Bottegai»; en 1862 Tebaldo nació en casa de LUISA VANNI, «Alla Maestà»; en 1864 la casa propia de Callisto está «NELLA PIAZZA DELLA MAESTÀ». Es la misma plaza: lo de 1862 no fue un traslado a otro barrio, fue la casa de al lado.", "*** Y PRUEBA QUE CALLISTO SEGUÍA DE SECRETARIO EN 1864. *** No sólo aquí: en ese mismo registro firma como testigo de vecinos en las actas 24, 47, 48, 49, 52 y 53, siempre como «Celeri Callisto fu Desiderio, Segretario Comunale». La pregunta de cuándo dejó el cargo queda acotada: en julio de 1864 seguía en él.", "*** Y APARECIÓ SU FE DE BAUTISMO, CON UN DETALLE QUE VALE. *** Está en los anexos de nacimientos de 1864 (Registro 63.5, página 124), y dice que nació el 5 de abril hacia las ocho de la mañana y que **lo bautizaron al día siguiente, el 6** — no el mismo día, como a sus dos hermanos mayores. Bautizar en el día era lo que se hacía cuando había miedo de que el niño no aguantara; esperar sugiere que éste nació más fuerte. Es una lectura, no un hecho.\n\n*** Y EL PADRINO FUE SU TÍO POLÍTICO. *** «Compare VINCENTI DOTT. MATTEO fu Antonio, di COREGLIA» — el médico que se había casado con LUISA VANNI, hermana de Enrichetta, exactamente un año antes, en abril de 1863. Un año después sostiene en la pila al hijo de su cuñada. La madrina, CESIRA PIEROTTI hija de Angelo, era hermana de Dario Pierotti, que firma como testigo en las actas civiles de la familia.\n\nCAMBIA QUIEN FIRMA EN EL AYUNTAMIENTO. En enero de 1863 el oficial del estado civil era el alcalde, Bertoli Barsotti Ranieri. Desde un acto del 30 de diciembre de 1863 delega en el médico, el DOCTOR PIETRO ANDREINI — el mismo que asistió al nacimiento de Tebaldo."], "imgs": [{"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864%20I%20Indice%20de%20nacidos%20de%20Trassilico%201864%20-%20primera%20mitad.jpg", "t": "1864 I Indice de nacidos de Trassilico 1864 - primera mitad"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-05%20N%20Fe%20de%20bautismo%20de%20Dante%20Giuseppe%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Dante Giuseppe - parroquia de Trassilico"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-10%20N%20Acta%20de%20nacimiento%20-%20Trassilico%20acta%2025.jpg", "t": "Acta de nacimiento - Trassilico acta 25"}], "zooms": [{"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864%20I%20Indice%20zoom%2C%20los%20tres%20Celeri%20de%201864%20-%20Trassilico.jpg", "t": "1864 I Indice zoom, los tres Celeri de 1864 - Trassilico"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-05%20N%20zoom%20-%20padrino%20el%20doctor%20Matteo%20Vincenti%20de%20Coreglia.jpg", "t": "Padrino el doctor Matteo Vincenti de Coreglia"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "angela_menghi": {"id": "angela_menghi", "nombre": "Angela Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "The mother of Callisto Celeri, and for weeks the most conspicuous gap in this branch. She surfaced on 27 August 2026, in a grandson's birth record.", "datos": [["Quién era", "mujer de DESIDERIO CELERI y madre de CALLISTO — es decir, la tatarabuela del abuelo paterno de Gonzalo"], ["Village", "TRASSILICO. El acta dice de ella y de su marido «essi pure di Trassilico»"], ["Birth", "hacia 1800 o antes — su hijo Callisto nació hacia 1830"], ["Dead before", "el 18 de noviembre de 1860, cuando el acta la llama «la FU Angela Menghi»"], ["Where this comes from", "acta de nacimiento de su nieto GIUSEPPE TULLIO POLINICE CELERI — Trassilico, 18 de noviembre de 1860, acta 76: «figlio del fu DESIDERIO, e della fu ANGELA MENGHI»"]], "mapa": null, "sinacta": "Existe por cuatro palabras: «della fu Angela Menghi». Pero esas cuatro palabras completan una generación entera: hasta ahora Desiderio Celeri era un viudo sin mujer y Callisto un hombre sin madre.\n\nMENGHI ES APELLIDO MUY DE TRASSILICO. En los índices de difuntos del pueblo aparecen Menghi Luigi, Menghi Filippo, Menghi Pietro y Menghi Antonio: es una de las familias del sitio, no un apellido llegado de fuera. Eso hace probable que su nacimiento y su boda con Desiderio —hacia 1825-1830— estén también en Trassilico.\n\n*** CORRECCIÓN DEL 29 DE AGOSTO DE 2026, Y ES IMPORTANTE. *** Aquí abajo escribí que el registro civil de Trassilico empieza en 1852 y que por tanto todo lo suyo era parroquial. Eso es falso: *** hay un registro civil anterior ***, el del Principado de Lucca, napoleónico, y Trassilico está dentro — con NACIMIENTOS, MATRIMONIOS y DEFUNCIONES de 1808 a 1812, digitalizados y localizados. Y las actas napoleónicas son las más detalladas de todo el registro civil italiano: dan la hora, el oficio y la edad del declarante, y *** los dos padres con su edad. ***\n\n*** Ella nació hacia 1800-1810. Si nació entre 1808 y 1812, su acta de nacimiento está ahí y nombra a sus padres *** — y eso cerraría de un golpe la pregunta de si Luigi Menghi era su hermano o su padre. Los cinco registros de nacimientos están identificados y esperando a que el servidor de imágenes deje de bloquear.\n\nLo que sigue siendo cierto es lo de su MUERTE: entre 1813 y 1851 no hay registro civil ninguno, y ella murió antes de 1860, así que su defunción sí es casi con seguridad parroquial.\n\nPERO NO ESTARÁN EN ANTENATI. El registro civil de Trassilico empieza en 1852 y ella ya había muerto en 1860 sin figurar en ninguno de los once años barridos, igual que su marido. Los dos murieron antes de 1852 y sus actas son PARROQUIALES — SS. Pietro e Paolo de Trassilico, Diócesis de Massa.\n\n*** HAY UNA VÍA INDIRECTA PARA VOLVER A NOMBRARLA, Y ESTÁ ABIERTA. *** Un acta de matrimonio italiana de aquellos años nombra a los cuatro padres de los novios. Si encontramos a otro hijo de Angela casándose en Trassilico, ella vuelve a aparecer escrita, y con suerte con el nombre de sus propios padres al lado. El 29 de agosto de 2026 salió la primera candidata: *** CELERI AGNESE, casada en Trassilico el 9 de mayo de 1857 con LUIGI MARTINI ***, acta nº 2 de aquel año. Si el acta la llama hija del difunto Desiderio y de la difunta Angela Menghi, Agnese es hija de esta mujer y hermana de Callisto. Está sin comprobar; se resuelve leyendo una sola página. La explicación entera está en la ficha de DESIDERIO CELERI.", "padre": null, "madre": null, "conyuge": "desiderio_celeri", "hijos": ["calisto_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_celeri": {"id": "giuseppe_celeri", "nombre": "Giuseppe Tullio Polinice Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Tebaldo's elder brother, born twenty months before him. No one knew he had existed until 27 August 2026.", "datos": [["Birth", "14 de noviembre de 1860, en TRASSILICO. El acta civil dice A LAS ONCE DE LA MAÑANA; la fe de bautismo del cura dice A LA UNA DE LA MADRUGADA"], ["Dónde", "en la casa propia de sus padres, en el paraje llamado «DAI BOTTEGAI»"], ["Baptism", "el mismo día 14, por el párroco don DOMENICO GRANDI — el mismo cura que había casado a sus padres en 1859 y que bautizaría a Tebaldo en 1862"], ["Inscripción", "18 de noviembre de 1860, Comune di Trassilico, acta 76. Lo declara su propio padre"], ["Parents", "CALLISTO CELERI, de 30 años, secretario del ayuntamiento, y ENRICHETTA VANNI, de 26"], ["Witnesses", "el doctor MICHELE ANDREINI y ERMENEGILDO GALANTI, hijo de Felice"], ["Los nombres", "GIUSEPPE, TULLIO y POLINICE. Polinice es POLINICES, el hijo de Edipo que muere ante las puertas de Tebas"]], "mapa": null, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "hijos": [], "hermanos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 de noviembre de 1860 el parto; 18 el acta", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 76", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 51.3 «Nati» 1860"], ["Signatura", "ark:/12657/an_ua35853260 — hash 03QypyJ, 36 imágenes; el acta en la página 30, el índice alfabético en las 34 y 35"]], "literal": "", "traduccion": "Before me, the undersigned Mayor and Registrar of the Civil Status of the Comune of Trassilico in the Garfagnana, there appeared signor CELERI CALLISTO, aged thirty, by profession SECRETARY, born and resident at Trassilico, SON OF THE LATE DESIDERIO AND OF THE LATE ANGELA MENGHI, both likewise of Trassilico,\n\nwho, in the presence of signori ANDREINI DOCTOR MICHELE and ERMENEGILDO GALANTI son of Felice, known witnesses, both of Trassilico, declared that on the FOURTEENTH of November 1860, at ELEVEN in the morning, there was born to him, IN THE HOUSE OF HIS OWN DWELLING situated at Trassilico, in the place called DAI BOTTEGAI,\n\nof signora ENRICHETTA VANNI, aged twenty-six, born and resident at Trassilico, daughter of the late signor DOCTOR PIETRO VANNI and of signora LIVIA RIGHINI — the former born and resident at Trassilico, the latter BORN AT CASTELNUOVO and resident at Trassilico — his lawful consort,\n\na son of the male sex, upon whom were bestowed the names GIUSEPPE, TULLIO, POLINICE, as appears in the certificate of baptism conferred on him by the local parish priest don DOMENICO GRANDI on 14 November 1860, which is annexed.", "notas": ["*** TEBALDO TENÍA UN HERMANO MAYOR, Y NADIE LO SABÍA. *** Nació veinte meses antes que él, del mismo padre y de la misma madre, y es el primer hijo documentado del matrimonio de enero de 1859.", "*** APARECE LA MADRE DE CALLISTO: ANGELA MENGHI. *** Era la incógnita más vieja de esta rama. Con ella, Desiderio Celeri deja de ser un viudo sin mujer y la generación de 1800 queda completa por el lado Celeri.", "*** LIVIA RIGHINI ESTABA VIVA, Y NO ERA DE TRASSILICO. *** El acta la nombra «la señora Livia Righini», sin el «fu» que sí lleva su marido, y dice que NACIÓ EN CASTELNUOVO. Es la primera vez que esta familia sale del pueblo.", "LA CASA ERA SUYA: «in casa di sua abitazione», en el paraje DAI BOTTEGAI. Dos años después, Tebaldo nacería en casa de LUISA VANNI, en ALLA MAESTÀ — otro sitio del mismo pueblo.", "LOS NOMBRES DICEN QUIÉNES ERAN. Giuseppe, Tullio y POLINICE: Polinices, el hijo de Edipo. En un pueblo de cien vecinos, el secretario del ayuntamiento le pone a su primer hijo el nombre de un personaje de la tragedia griega. Dos años después vendrá «Tebaldo Jacopo ARCHIMEDE». No era gente de campo.", "*** Y HOY APARECIÓ SU FE DE BAUTISMO, LA TERCERA Y ÚLTIMA DE LOS HERMANOS. *** Está en los anexos de nacimientos de 1860, página 18, y la firma el mismo párroco DOMENICO GRANDI. Dice: «Atestiguo que el 14 del mes corriente de 1860 bauticé a GIUSEPPE, TULLIO, POLINICE, hijo del señor CALLISTO, del difunto DESIDERIO CELERI, y de la señora ENRICHETTA, del difunto doctor PIETRO VANNI, ambos de Trassilico, legítimos cónyuges; NACIDO EL MISMO DÍA A LA UNA DE LA MADRUGADA».\n\n*** Y AHÍ HAY UNA CONTRADICCIÓN QUE NO SE PUEDE RESOLVER. *** El acta civil —que escribió el propio Callisto, secretario del ayuntamiento— dice que nació «a las ONCE de la mañana». La fe del cura dice «A LA UNA DE LA MADRUGADA». Diez horas de diferencia. No hay forma de saber cuál es la buena: las dos vienen de la misma familia. Se anotan las dos.\n\nLo que sí encaja es el resto: nacer de madrugada y bautizar ese mismo día es lo que se hacía cuando había prisa. A Tebaldo también lo bautizaron el día del parto; a Dante, al día siguiente.\n\nEsta fe, como la de Dante, dice sólo «del fu Desiderio»: NO añade la generación de DOMENICO CELERI. La única de las tres que sube tres generaciones es la de Tebaldo. El cura no escribía siempre lo mismo.\n\nNO SE SABE SI VIVIÓ. No muere en los índices de difuntos de 1860, 1861 ni 1865, que están barridos, así que sobrevivió al menos a esos años. Lo que venga después ya es registro civil italiano posterior a 1866, y eso no está en Antenati."], "imgs": [{"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860%20I%20Indice%20de%20nacidos%20de%20Trassilico%201860%20-%20pagina%2034.jpg", "t": "1860 I Indice de nacidos de Trassilico 1860 - pagina 34"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-14%20N%20Fe%20de%20bautismo%20de%20Giuseppe%20Tullio%20Polinice%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Giuseppe Tullio Polinice - parroquia de Trassilico"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento - Trassilico acta 76"}], "zooms": [{"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860%20I%20Indice%20de%20nacidos%20zoom%20Celeri%20-%20Trassilico%201860.jpg", "t": "1860 I Indice de nacidos zoom Celeri - Trassilico 1860"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20madre%20y%20casa%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom madre y casa - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20nombres%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom nombres - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20origen%20de%20Livia%20Righini%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom origen de Livia Righini - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20padres%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom padres - Trassilico acta 76"}]}], "nActas": 1, "nImgs": 8, "titulo": "", "parrafos": [], "claves": []}, "luigi_menghi": {"id": "luigi_menghi", "nombre": "Luigi Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Head of the MENGHI family of Trassilico — the surname of Callisto's mother. He surfaced on 29 August 2026 at his son's second marriage. That he is a relative of Angela Menghi is likely, given the village and the generation, but it is NOT proven.", "datos": [["Cuándo vivió", "generación de 1795-1805. *** YA HABÍA MUERTO EL 30 DE ENERO DE 1859 ***, cuando el acta de matrimonio de Callisto llama a su hijo Pietro «hijo del difunto Luigi». Antes se creía que había muerto sólo antes de agosto de 1864"], ["Wife", "MATTEA BONETTI, también difunta en 1864"], ["Hijos documentados", "ANTONIO (jornalero, nacido hacia 1827) y PIETRO (zapatero)"], ["Dónde", "Trassilico"]], "mapa": null, "sinacta": "*** POR QUÉ IMPORTA ESTA FAMILIA: *** ANGELA MENGHI, la madre de Callisto y por tanto antepasada directa, era una Menghi de Trassilico. Ésta es la única familia Menghi del pueblo que hemos podido documentar, y su cabeza es de la generación adecuada.\n\nPERO NO HAY NADA QUE LO ATE. Angela había muerto antes de 1860 y Callisto nació hacia 1831, así que ella nació hacia 1805-1810. Su hijo Antonio nació hacia 1827. Si Angela fuera HERMANA de Antonio habría veinte años entre ellos: posible, pero forzado. Es más verosímil que fuera de la generación del propio Luigi —hermana suya, y por tanto tía de Antonio—, y eso tampoco está probado.\n\nLO RESOLVERÍA la fe de bautismo de Angela o su acta de defunción, las dos parroquiales y anteriores a 1852. Ya va pedido en la carta al Archivio di Stato di Massa.\n\n*** 29 DE AGOSTO DE 2026 — SU HIJO PIETRO FUE TESTIGO DE LA BODA DE CALLISTO, Y ESO CAMBIA DOS COSAS. *** Salió de cruzar dos actas que ya estaban leídas. El acta de matrimonio de Callisto y Enrichetta, del 30 de enero de 1859, da dos testigos de iglesia: «PIETRO BONETTI, hijo del difunto Antonio, y *** PIETRO MENGHI, HIJO DEL DIFUNTO LUIGI ***». Y por el acta de las segundas nupcias de su hijo Antonio se sabe que Luigi y Mattea Bonetti tuvieron dos hijos: Antonio el jornalero y *** PIETRO el zapatero ***. Es el mismo hombre.\n\n*** LO PRIMERO QUE GANA ES UNA FECHA: Luigi Menghi murió antes del 30 de enero de 1859 ***, no sólo antes de agosto de 1864 como decía esta ficha. Cinco años y medio de adelanto, y documentado, no inferido.\n\n*** Y LO SEGUNDO REFUERZA LO QUE AQUÍ SE VENÍA SOSPECHANDO. *** En una boda de iglesia italiana los testigos son parientes próximos o compadres, no vecinos cualesquiera. Callisto era huérfano de padre y de madre, así que sus parientes cercanos eran los de ella, ANGELA MENGHI. Y elige precisamente a un MENGHI y a un BONETTI — y la mujer de Luigi era una Bonetti. *** Los dos testigos salen del mismo matrimonio Menghi-Bonetti. *** Si Luigi era hermano de Angela, como se apuntaba más arriba, entonces Pietro Menghi era primo hermano de Callisto — que es exactamente a quien se pide que sea testigo. Sigue sin probarse: el acta no dice el parentesco y Menghi era apellido común allí. Pero la elección de los testigos deja de parecer casual.\n\nLO CERRARÍA UN DOCUMENTO YA LOCALIZADO: su hijo Antonio se casó en 1864, y el legajo de anexos de los matrimonios de ese año guarda la fe de bautismo de cada novio. Si esa fe nombra al padre de Luigi, y ese hombre resulta ser también el padre de Angela, queda probado. El registro está identificado y su hash guardado; falta sólo que el servidor de imágenes de Antenati deje de bloquear.\n\n*** Y HAY UN TERCER APELLIDO QUE ATA A LOS OTROS DOS: LOS BONETTI. *** Su mujer era MATTEA BONETTI. Y al ordenar todos los Bonetti de Trassilico aparece esto: BATTISTA BONETTI estaba casado con una CELERI —Santa—; él, cabeza de los Menghi, se casó con una BONETTI; y Jacopo/Paolo Celeri se casó con MARIA CATERINA BONETTI, que era precisamente la hija de Battista Bonetti y Celeri Santa. Los tres apellidos van trenzados.\n\n*** Y hay un hilo que atraviesa sesenta y cuatro años. *** En la boda de Callisto, el 30 de enero de 1859, los dos testigos de iglesia son su hijo PIETRO MENGHI y PIETRO BONETTI. Y el 10 de septiembre de 1923, cuando muere Enrichetta Vanni —la viuda de Callisto— a los ochenta y ocho años, quienes van al ayuntamiento a declararlo y a firmar de testigos son *** BONETTI ANGELO DI JACOPO, de cuarenta años, y BONETTI JACOPO FU ANGELO, de setenta y cuatro ***: padre e hijo. Sus hijos ya no estaban —Tebaldo llevaba más de veinte años en Argentina— y los que la acompañaron hasta el final fueron los de esa casa. No prueba parentesco: en un pueblo de cien vecinos el declarante suele ser un vecino. Pero es un hecho constante y documentado, no una impresión. Relacionado: [[antonio_menghi]].", "padre": null, "madre": null, "conyuge": null, "hijos": ["antonio_menghi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "antonio_menghi": {"id": "antonio_menghi", "nombre": "Antonio Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A day labourer of Trassilico. In twenty-six months he buried a child, a newborn and his wife, and married again. His story was pieced together from three separate registers.", "datos": [["Birth", "hacia 1827. Ojo: en junio de 1862 declara 33 años y en agosto de 1864 declara 37, cuando deberían ser 35 — dos años de deriva en veintiséis meses. Las edades de estos registros son aproximadas"], ["Trade", "BRACCIANTE, jornalero"], ["Parents", "el difunto LUIGI MENGHI y la difunta MATTEA BONETTI"], ["Brother", "MENGHI PIETRO, CALZOLAJO (zapatero), que le hizo de testigo"], ["Primera mujer", "MARIA MENGHI — del mismo apellido—, muerta el 17 de mayo de 1863"], ["Su casa", "en Trassilico, en el paraje llamado «ALLA FOCE»"], ["Segundas nupcias", "13 de agosto de 1864 con MARIGLIANI OLIVA, de 35 años, hija del difunto Isaia y de la viva ANNA MORI, naturales de MOLAZZANA. Boda el 20 de agosto"]], "mapa": null, "sinacta": "", "padre": "luigi_menghi", "madre": null, "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of a second marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "13 de agosto de 1864; boda el 20", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "actas 21 y 28", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.6 «Matrimoni» 1864"], ["Signatura", "ark:/12657/an_ua35853349 — hash 5YmyeY3, 32 imágenes; el acta en la página 15"]], "literal": "", "traduccion": "Year 1864, day 13 August. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear:\n\nMENGHI ANTONIO, aged thirty-seven, DAY LABOURER, WIDOWER, SON OF THE LATE LUIGI AND OF THE LATE MATTEA BONETTI, all born and resident at Trassilico;\n\nand MARIGLIANI OLIVA, aged thirty-five, without profession, daughter of the late Isaia and of the LIVING ANNA MORI, aged sixty, without profession, NATIVES OF MOLAZZANA and resident at Trassilico;\n\nwho, in the presence of DARIO PIEROTTI, son of Angelo, without profession, and of MENGHI PIETRO, SON OF THE LATE LUIGI, SHOEMAKER, witnesses of full age, declared that it is their intention to be joined in marriage, and handed me their birth certificates, together with the death certificates of the groom's parents and of the bride's father, and further the certificate of the previous marriage AND OF THE DEATH OF THE WIFE of the said Menghi.", "notas": ["*** DA LOS PADRES DE LA FAMILIA MENGHI DE TRASSILICO: LUIGI MENGHI y MATTEA BONETTI. *** Es la generación que podría emparentar con ANGELA MENGHI, la madre de Callisto — ver su ficha, donde explico por qué no lo doy por probado.", "*** Y CONFIRMA, POR EL ESTADO CIVIL DEL ACTA, UNA HISTORIA QUE VENÍA LEYENDO A TROZOS. *** El 28 de agosto encontré en el índice de difuntos de 1863 que un MENGHI NEONATO y una MENGHI MARIA morían el MISMO DÍA, y escribí que probablemente eran madre e hijo muertos en el parto — marcándolo como lectura, no como hecho. Este acta dice que Antonio es VIUDO y que entrega «el certificado del matrimonio anterior y de la muerte de su esposa». La lectura queda confirmada.", "LA SECUENCIA COMPLETA, EN VEINTISÉIS MESES: junio de 1862, muere su hijo LUIGI en la casa «alla Foce», y lo declara su mujer María. 17 de mayo de 1863, mueren el mismo día María y un recién nacido. 13 de agosto de 1864, Antonio se vuelve a casar.", "UN DETALLE QUE ENCAJA: el hijo muerto en 1862 se llamaba LUIGI, como su abuelo paterno. La costumbre italiana de nombrar al primer hijo por el abuelo, otra vez.", "SU HERMANO ERA ZAPATERO. Pietro Menghi, «calzolajo», firma como testigo: mismo patronímico «fu Luigi».", "LA NOVIA VENÍA DE FUERA: los padres de Oliva Marigliani eran naturales de MOLAZZANA, comune vecino que no había aparecido hasta ahora en este archivo."], "imgs": [{"u": "../actas/1864%20-%20Los%20Menghi%20de%20Trassilico/1864-08-13%20M%20Segundas%20nupcias%20de%20Antonio%20Menghi%20-%20Trassilico%20acta%2021.jpg", "t": "Segundas nupcias de Antonio Menghi - Trassilico acta 21"}], "zooms": [{"u": "../actas/1864%20-%20Los%20Menghi%20de%20Trassilico/1864-08-13%20M%20zoom%20-%20VEDOVO%2C%20hijo%20del%20difunto%20LUIGI%20y%20de%20la%20difunta%20BONETTI%20MATTEA.jpg", "t": "VEDOVO, hijo del difunto LUIGI y de la difunta BONETTI MATTEA"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "pietro_celeri_1814": {"id": "pietro_celeri_1814", "nombre": "Pietro Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer of Trassilico, born around 1814. The NINTH Celeri father in the village, and the first to appear with his wife's name. He came out on 28 August 2026 of his daughter's marriage promise.", "datos": [["Birth", "hacia 1814 — los cincuenta años que declara en agosto de 1864"], ["Trade", "AGRICOLTORE"], ["Wife", "ELISABETTA SANTI, nacida hacia 1815"], ["Hija conocida", "MARIA LEONILDA, casada en agosto de 1864 con Rocchi Celeste"], ["Dónde", "nacido y domiciliado en Trassilico"], ["En agosto de 1864", "estaba VIVO: compareció en persona a dar su consentimiento para la boda de su hija"]], "mapa": null, "sinacta": "EL ENCARGO TENÍA OCHO PADRES CELERI EN TRASSILICO — Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolino, Carlo Agostino y Jacopo. *** PIETRO NO ESTABA: SON NUEVE. ***\n\nES DE LA MISMA QUINTA QUE DESIDERIO, el bisabuelo: Pietro nació hacia 1814, y Desiderio tuvo a Callisto hacia 1831. Podrían ser hermanos. *** PERO NO HAY NADA QUE LO PRUEBE, y hay una razón de formato: *** en las promesas de matrimonio los padres que están VIVOS comparecen en persona, así que el acta no les pone patronímico. No sabemos de quién era hijo Pietro. Lo diría su acta de defunción — posterior a 1865 y por tanto ya fuera de Antenati. Relacionado: [[elisabetta_santi]], [[leonilda_celeri]].", "padre": null, "madre": null, "conyuge": "elisabetta_santi", "hijos": ["leonilda_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "elisabetta_santi": {"id": "elisabetta_santi", "nombre": "Elisabetta Santi", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 6, "ramas": [], "resumen": "Wife of Pietro Celeri. She was alive in August 1864 and appeared in person at her daughter's marriage promise.", "datos": [["Birth", "hacia 1815 — los cuarenta y nueve años que declara en agosto de 1864"], ["Occupation", "«senza professione», como casi todas las mujeres de este fondo"], ["Husband", "PIETRO CELERI, agricultor"], ["Hija conocida", "MARIA LEONILDA CELERI"], ["Sabía firmar", "no: el acta hace constar que la declarante y los cuatro padres «si sono dichiarati illetterati»"]], "mapa": null, "sinacta": "Se sabe de ella lo que dice una sola línea de la promesa de matrimonio de su hija. Relacionado: [[pietro_celeri_1814]].", "padre": null, "madre": null, "conyuge": "pietro_celeri_1814", "hijos": ["leonilda_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "leonilda_celeri": {"id": "leonilda_celeri", "nombre": "Maria Leonilda Celeri", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 7, "ramas": [], "resumen": "She married at twenty, in August 1864, to the village blacksmith's son. Her marriage promise is what uncovered her parents.", "datos": [["Birth", "hacia 1844 — los veinte años que declara"], ["Parents", "PIETRO CELERI, agricultor de 50 años, y ELISABETTA SANTI, de 49"], ["Husband", "ROCCHI CELESTE, de 30 años, agricultor, hijo de MATTEO ROCCHI —HERRERO— y de MARIA DOMENICA BONETTI"], ["Promesa", "8 de agosto de 1864, acta 15, ante el doctor Pietro Andreini"], ["Marriage", "17 de agosto de 1864, acta 22"], ["Witness", "CALLISTO CELERI, el secretario del ayuntamiento — de oficio, como en casi todas las actas del pueblo"], ["Su cuñado se casó el mismo día", "el acta 16, justo debajo, es la de ROCCHI MASSIMILIANO, hermano del novio, con PIEROTTI ALBINA. Los dos hijos del herrero se prometieron el 8 y se casaron el 17"]], "mapa": null, "sinacta": "", "padre": "pietro_celeri_1814", "madre": "elisabetta_santi", "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "8 de agosto de 1864; boda el 17", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "actas 15 y 22", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.6 «Matrimoni» 1864"], ["Signatura", "ark:/12657/an_ua35853349 — hash 5YmyeY3, 32 imágenes; el acta en la página 12, el índice en las 30 y 31"]], "literal": "", "traduccion": "Year 1864, day 8 August. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear:\n\nROCCHI CELESTE, aged thirty, farmer, son of MATTEO, aged fifty-four, BLACKSMITH, and of MARIA DOMENICA BONETTI, aged fifty-six, without profession;\n\nand CELERI MARIA LEONILDA, aged TWENTY, without profession, DAUGHTER OF PIETRO, aged FIFTY, FARMER, and of ELISABETTA SANTI, aged forty-nine, without profession; all born and resident at Trassilico.\n\nWho, in the presence of DARIO PIEROTTI, son of Angelo, without profession, and of CELERI CALLISTO, SON OF THE LATE DESIDERIO, TOWN CLERK, witnesses of full age, both born and resident at Trassilico, declared that it is their intention to be joined in marriage; and their parents being present and having given their full consent, and there being besides no opposition whatever to the marriage, the certification prescribed by law is issued to them.", "notas": ["*** DESCUBRE UN NOVENO PADRE CELERI EN TRASSILICO: PIETRO. *** La lista que teníamos era de ocho —Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolino, Carlo Agostino y Jacopo—. Y es el primero que aparece con el nombre de su mujer: ELISABETTA SANTI.", "PIETRO ES DE LA MISMA QUINTA QUE DESIDERIO, el bisabuelo. Podrían ser hermanos, y entonces Leonilda sería prima carnal de Callisto. *** NO HAY NADA QUE LO PRUEBE. *** Y hay una razón de formato por la que este acta no puede decirlo: en las promesas de matrimonio los padres VIVOS comparecen en persona, así que no se les pone patronímico.", "LOS CUATRO PADRES ESTABAN VIVOS Y PRESENTES, dando su consentimiento — y los cinco declarantes «si sono dichiarati illetterati», no sabían firmar. Firman sólo el novio, los dos testigos y el oficial.", "*** DOS HERMANOS SE CASAN EL MISMO DÍA. *** El acta 16, justo debajo, es la de ROCCHI MASSIMILIANO, de 28 años, hijo de los mismos padres, con PIEROTTI ALBINA. Los dos hijos del herrero Matteo Rocchi se prometieron el 8 de agosto y se casaron el 17.", "EL PADRE DEL NOVIO ERA FABBRO, HERRERO. En este fondo los oficios artesanos son minoría frente a los «agricoltori» y «braccianti»."], "imgs": [{"u": "../actas/1864%20-%20Maria%20Leonilda%20Celeri%20di%20Pietro/1864-08-08%20M%20Promesa%20de%20matrimonio%20de%20Maria%20Leonilda%20Celeri%20-%20Trassilico%20actas%2015%20y%2016.jpg", "t": "Promesa de matrimonio de Maria Leonilda Celeri - Trassilico actas 15 y 16"}], "zooms": [{"u": "../actas/1864%20-%20Maria%20Leonilda%20Celeri%20di%20Pietro/1864-08-08%20M%20zoom%20-%20hija%20de%20PIETRO%20CELERI%20y%20ELISABETTA%20SANTI.jpg", "t": "Hija de PIETRO CELERI y ELISABETTA SANTI"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "jacopo_celeri": {"id": "jacopo_celeri", "nombre": "Jacopo Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer of Trassilico, born around 1809. He surfaced on 28 August 2026 in his wife's death record — carrying a patronymic that may change everything: «FU GIO. DOMENICO».", "datos": [["Birth", "hacia 1809 — los cincuenta y tres años que declara en mayo de 1862"], ["Trade", "AGRICOLTORE, de Trassilico"], ["Father", "*** el difunto GIOVANNI DOMENICO CELERI ***"], ["Wife", "CATERINA BONETTI, costurera, muerta el 13 de mayo de 1862"], ["Casa", "en Trassilico, en el paraje llamado «DAI DRAGONI»"]], "mapa": null, "sinacta": "*** AQUÍ HAY UNA POSIBILIDAD GRANDE, Y NO LA VOY A DAR POR BUENA TODAVÍA. *** La fe de bautismo de Tebaldo dice que Callisto era hijo de Desiderio y NIETO de un DOMENICO CELERI. Si el «Gio. Domenico» de Jacopo fuera ese mismo hombre, JACOPO SERÍA HERMANO DE DESIDERIO y por tanto TÍO CARNAL DE CALLISTO. Las edades encajan bien: Jacopo nació hacia 1809 y Desiderio tuvo a Callisto hacia 1831.\n\nPERO «Domenico» y «Giovanni Domenico» pueden ser el mismo hombre o dos distintos, y los dos nombres están entre los más comunes del pueblo. Para cerrarlo hace falta un documento que nombre a los dos hermanos juntos, o el acta de defunción del propio Jacopo, que sería posterior a 1865 y por tanto ya no está en Antenati sino en el Archivio del Tribunale di Lucca.\n\n*** 29 DE AGOSTO DE 2026 — JACOPO Y «PAOLO CELERI» SON EL MISMO HOMBRE. *** No hizo falta ningún documento nuevo: salió de cruzar dos actas que ya estaban leídas y archivadas.\n\nEl acta de defunción de su mujer, de mayo de 1862, lo describe así: «CELERI JACOPO, hijo del difunto GIOVANNI DOMENICO, de CINCUENTA Y TRES AÑOS», marido de CATERINA BONETTI, muerta el 13 de mayo, y con dos testigos vecinos de VALLICO SOPRA.\n\nEl acta de matrimonio de septiembre de 1863 describe a otro: «CELERI DESIDERIO de veintiún años, hijo de CELERI PAOLO de CINCUENTA Y CUATRO AÑOS y de la difunta BONETTI CATERINA de cincuenta y ocho», agricultor y analfabeto, y la celebra el capellán de VALICO SOPRA.\n\n*** Cuatro coincidencias y ninguna discrepancia: *** el mismo año de nacimiento (1809, y las dos edades encajan mes a mes), la misma mujer con nombre y apellido, la misma aldea y la misma condición de agricultor analfabeto. Y CELERI es apellido raro allí — en los setenta y tres nacimientos de Trassilico de 1862 hay UN solo Celeri. Dos hombres distintos, los dos nacidos en 1809, los dos casados con una Caterina Bonetti muerta antes de 1863 y los dos de Vallico Sopra, no se sostiene. *** Es un hombre con dos nombres de pila ***, que allí era lo normal: en este mismo pueblo están «Tebaldo Jacopo Archimede» y «Giuseppe Tullio Polinice». Un escribano apunta uno y otro apunta el otro. Con esto, los NUEVE padres Celeri de Trassilico son OCHO.\n\n*** Y ARRASTRA ALGO MUCHO MÁS GRANDE. *** Si Paolo es Jacopo, entonces Paolo es «fu Gio. Domenico» — y el hijo de Paolo es DESIDERIO CELERI DI PAOLO, el que emigró a Santa Fe y cuya familia está identificada allí por cuatro coincidencias. Es decir: *** si ese «Giovanni Domenico» es el «Domenico» de la fe de bautismo de Tebaldo, el Celeri de Santa Fe es PRIMO HERMANO de Callisto. *** Y eso explicaría por fin algo que llevaba días sin explicación: por qué dos familias Celeri de un pueblo de cien vecinos de la Garfagnana acaban en la misma ciudad argentina. No es casualidad: es la cadena migratoria de siempre, un primo que llama al otro.\n\nEse último paso NO está probado y no se da por bueno: «Domenico» y «Giovanni Domenico» pueden ser el mismo hombre o dos. Lo cerraría su propia acta de defunción —estaba vivo en septiembre de 1863 y los índices de difuntos de 1864 y 1865 están limpios, así que murió después de 1865 y su acta está en el Archivio del Tribunale di Lucca— o el legajo de anexos de aquella boda de 1863, que guardaría la fe de bautismo del novio.\n\n*** Y MÁS TARDE EL MISMO DÍA APARECIÓ ALGO MEJOR: SU PROPIA ACTA DE NACIMIENTO PODRÍA EXISTIR. *** Todo el proyecto daba por hecho que en Trassilico no hay registro civil antes de 1852. Es falso: existe el estado civil napoleónico del Principado de Lucca, y Trassilico está dentro, con nacimientos, matrimonios y defunciones *** de 1808 a 1812. ***\n\nY las dos actas que lo describen dan su edad por caminos distintos: *** cincuenta y tres años en mayo de 1862 y cincuenta y cuatro en septiembre de 1863 ***, lo que lo sitúa naciendo entre mediados de 1808 y mediados de 1809 — justo el primer tramo de ese fondo.\n\n*** Una sola acta cerraría la pregunta más grande de esta rama. *** Un acta de nacimiento napoleónica nombra al padre Y A LA MADRE, los dos con su edad. La suya confirmaría de quién era hijo sin depender de un patronímico suelto, daría por primera vez el nombre de la mujer de Giovanni Domenico Celeri —hoy un hueco total— y, si ese Giovanni Domenico es el Domenico de la fe de bautismo de Tebaldo, probaría que era hermano de Desiderio y tío carnal de Callisto, y que el Celeri de Santa Fe es primo hermano de Tebaldo. Los dos registros que hacen falta —los nacimientos de 1808 y de 1809— ya están localizados. Relacionado: [[caterina_bonetti]].", "padre": null, "madre": null, "conyuge": null, "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "caterina_bonetti": {"id": "caterina_bonetti", "nombre": "Caterina Bonetti", "legal": "«Celeri Caterina» en el acta, por su marido", "rol": "conyuge", "rolNombre": "Spouse", "gen": 6, "ramas": [], "resumen": "A seamstress of Trassilico, who died at home at eleven at night on 13 May 1862. Her death record is the one that uncovered her husband and her parents.", "datos": [["Trade", "SARTA, costurera — y eso es raro de ver: en este fondo casi todas las mujeres constan «sin profesión» o «agricultora»"], ["Parents", "los difuntos BONETTI BATTISTA y CELERI SANTA, agricultores de Trassilico"], ["Husband", "JACOPO CELERI, hijo del difunto Giovanni Domenico"], ["Death", "13 de mayo de 1862, a las once de la noche, en su propia casa de Trassilico, en el paraje llamado «DAI DRAGONI». La declaró su propio marido"], ["Un detalle del pueblo", "era CELERI por parte de madre Y ADEMÁS se casó con un Celeri"]], "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "jacopo_celeri", "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "13 de mayo de 1862, a las once de la noche", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 35", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 55.4 «Morti» 1862"], ["Signatura", "ark:/12657/an_ua35853432 — hash 0A2x1jD, 28 imágenes; el acta en la página 13, el índice en las 26 y 27"]], "literal": "", "traduccion": "Year 1862, day 16 May. Before me, RANIERI BERTOLI BARSOTTI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, there appear CELERI JACOPO, SON OF THE LATE GIOVANNI DOMENICO, aged fifty-three, and BONETTI FRANCESCO, son of the late Mariano, aged forty-eight, farmers of Trassilico, THE FIRST THE HUSBAND and the second a NEIGHBOUR of the deceased;\n\nwho, in the presence of AMBROGIO BARSOTTI, son of the late Lorenzo, aged fifty-nine, day labourer, and of STEFANO MANCINI, son of the late Giuseppe, aged fifty-two, stonemason, both resident at VALLICO SOPRA, declared to me that on the thirteenth of the said month, at eleven at night,\n\nCELERI CATERINA, SEAMSTRESS, WIFE OF THE INFORMANT CELERI, born at Trassilico of the late spouses BONETTI BATTISTA and CELERI SANTA, farmers of the same Trassilico, died in her own house, situated at Trassilico, in the place called DAI DRAGONI.", "notas": ["*** LO QUE HACE VALIOSA ESTA ACTA NO ES ELLA, ES SU MARIDO. *** «CELERI JACOPO FU GIO. DOMENICO». El encargo tenía a Jacopo en la lista de los ocho padres Celeri de Trassilico sin saber de quién era hijo. Ya se sabe, y el patronímico es justo el que podría conectarlo con nuestra rama — ver su ficha, donde explico por qué NO lo doy por probado.", "DOS PERSONAS MÁS DE LA GENERACIÓN ANTERIOR: BONETTI BATTISTA y CELERI SANTA, sus padres, ya muertos en 1862.", "ERA COSTURERA, y eso llama la atención: en todo este fondo las mujeres constan «senza professione» o «agricoltrice». Un oficio propio, y con nombre.", "LA DECLARÓ SU MARIDO, con un vecino de testigo. Murió en casa, a las once de la noche.", "TOPÓNIMO NUEVO: «DAI DRAGONI». Se suma a los otros tres que van saliendo en Trassilico — «dai Bottegai», «alla Maestà» y «la Piazza della Maestà»."], "imgs": [{"u": "../actas/1862%20-%20Caterina%20Bonetti%2C%20mujer%20de%20Jacopo%20Celeri/1862-05-13%20D%20Acta%20de%20defuncion%20de%20Caterina%20Bonetti%20-%20Trassilico%20acta%2035.jpg", "t": "Acta de defuncion de Caterina Bonetti - Trassilico acta 35"}], "zooms": [{"u": "../actas/1862%20-%20Caterina%20Bonetti%2C%20mujer%20de%20Jacopo%20Celeri/1862-05-13%20D%20zoom%20-%20CELERI%20JACOPO%20FU%20GIO%20DOMENICO%2C%20el%20marido.jpg", "t": "CELERI JACOPO FU GIO DOMENICO, el marido"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "giovanni_antonio_celeri": {"id": "giovanni_antonio_celeri", "nombre": "Giovanni Antonio Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Another Celeri patriarch of the Garfagnana, of the same generation as Domenico — Tebaldo's great-grandfather. He surfaced on 28 August 2026 in the death record of his son Francesco. Whether the two branches touch is unknown.", "datos": [["Cuándo vivió", "nacido hacia 1770-1780. Ya había muerto en marzo de 1864"], ["Wife", "MARIANGELA GIUSTI, también difunta en 1864"], ["Dónde vivían", "«Valliggiatto», una aldea del municipio de Trassilico — el topónimo es MI LECTURA de la letra y no es segura: podría ser alguno de los Vallico"], ["Hijos documentados", "FRANCESCO (hacia 1802-1864, soltero); MICHELE (muerto antes de 1864, padre de Antonio); y una hija casada con un MORONI, que se deduce porque Moroni Pellegrino declara ser «cuñado» de Francesco y Francesco murió soltero"], ["Nieto vivo en 1864", "CELERI ANTONIO, hijo del difunto Michele, de 33 años, agricultor"]], "mapa": null, "sinacta": "NO HAY NADA QUE LO ATE A NUESTRA RAMA, y conviene decirlo claro. Es una pareja Celeri de la misma generación que DOMENICO CELERI en el mismo municipio, y nada más. Además viven en sitio distinto: los nuestros en el pueblo de Trassilico, éstos en la aldea. Que CALLISTO firme como testigo del acta tampoco prueba parentesco: era el secretario del ayuntamiento y firmaba de oficio en casi todas. Relacionado: [[francesco_celeri_1802]].", "padre": null, "madre": null, "conyuge": "mariangela_giusti", "hijos": ["francesco_celeri_1802"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "mariangela_giusti": {"id": "mariangela_giusti", "nombre": "Mariangela Giusti", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Wife of Giovanni Antonio Celeri. She is known only from her son's death record, which names her as already dead.", "datos": [["Cuándo vivió", "nacida hacia 1770-1780; muerta antes de marzo de 1864"], ["Husband", "GIOVANNI ANTONIO CELERI"], ["El apellido", "GIUSTI es de los más comunes de Trassilico: en el índice de difuntos de 1864 hay cinco, y tres más en el de 1863"]], "mapa": null, "sinacta": "Un nombre y nada más, que es lo normal para una mujer de esa generación. Relacionado: [[giovanni_antonio_celeri]].", "padre": null, "madre": null, "conyuge": "giovanni_antonio_celeri", "hijos": ["francesco_celeri_1802"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francesco_celeri_1802": {"id": "francesco_celeri_1802", "nombre": "Francesco Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer, unmarried all his life, dead at sixty-two in his own house. His death record is the one that uncovered his parents and with them a whole Celeri branch.", "datos": [["Birth", "hacia 1802 — los sesenta y dos años que declara el acta"], ["Trade", "AGRICOLTORE"], ["Estado", "NUBILE, soltero. Murió sin casarse"], ["Parents", "el difunto CELERI GIOVANNI ANTONIO y la difunta GIUSTI MARIANGELA"], ["Death", "18 de marzo de 1864, a las doce del mediodía, en su casa del paraje llamado «la Traffallina»"], ["Quién lo declaró", "su sobrino CELERI ANTONIO, hijo del difunto Michele, de 33 años, y su cuñado MORONI PELLEGRINO, de 60"], ["Quién firmó de testigo", "CALLISTO CELERI, el secretario del ayuntamiento — de oficio, no por parentesco"]], "mapa": null, "sinacta": "", "padre": "giovanni_antonio_celeri", "madre": "mariangela_giusti", "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "18 de marzo de 1864, a las doce del mediodía", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 16", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 55.6 «Morti» 1864"], ["Signatura", "ark:/12657/an_ua35853434 — hash 5BxgVnQ, 34 imágenes; el acta en la página 11, el índice en las 32 y 33"]], "literal": "", "traduccion": "Year 1864, day 20 March. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear CELERI ANTONIO, son of the late MICHELE, aged 33, farmer, and MORONI PELLEGRINO, son of the late Jacopo, aged 60, farmhand — THE FIRST A NEPHEW AND THE SECOND A BROTHER-IN-LAW of the deceased — both born and resident at Valliggiatto;\n\nwho, in the presence of PIEROTTI DARIO son of Angelo, without profession, and of CELERI CALLISTO, SON OF THE LATE DESIDERIO, TOWN CLERK, witnesses of full age, both born and resident at Trassilico, declared to me that on the 18th of the current month and year, at twelve noon,\n\nCELERI FRANCESCO, aged sixty-two, FARMER, UNMARRIED, SON OF THE LATE CELERI GIOVANNI ANTONIO AND OF THE LATE GIUSTI MARIANGELA, born and resident at Valliggiatto, died in the house of his own dwelling, situated at Valliggiatto, in the place called «la Traffallina».", "notas": ["*** ABRE UNA RAMA CELERI ENTERA QUE NO CONOCÍAMOS. *** De un solo acta salen cuatro personas: los padres GIOVANNI ANTONIO CELERI y MARIANGELA GIUSTI —la generación de 1770-80, la misma altura que Domenico Celeri—, el hermano MICHELE y el sobrino ANTONIO.", "Y una quinta, por deducción: MORONI PELLEGRINO declara ser **cuñado** del muerto, pero Francesco murió SOLTERO. Un cuñado de un soltero sólo puede serlo por haberse casado con una hermana suya. *** LUEGO GIOVANNI ANTONIO TUVO TAMBIÉN UNA HIJA, CASADA CON UN MORONI. *** No se sabe su nombre.", "MURIÓ SOLTERO A LOS SESENTA Y DOS, en su casa, a mediodía. Quien lo declara no es un hijo —no los tuvo— sino un sobrino y un cuñado: la familia que le quedaba.", "*** LO QUE NO PRUEBA. *** No hay nada que ate a estos Celeri con los nuestros. Son dos familias del mismo apellido en el mismo municipio, y viven en sitios distintos. Que CALLISTO firme de testigo NO significa parentesco: era el secretario y firmaba de oficio en casi todas las actas del pueblo.", "AVISO DE LECTURA: el topónimo que transcribo «VALLIGGIATTO» es mi lectura de la letra y no la doy por segura. Podría ser alguno de los VALLICO (Sopra o Sotto), aldeas de la misma zona que aparecen en otros papeles de este mismo fondo."], "imgs": [{"u": "../actas/1864%20-%20Francesco%20Celeri%20di%20Giovanni%20Antonio/1864-03-18%20D%20Acta%20de%20defuncion%20de%20Francesco%20Celeri%20-%20Trassilico%20acta%2016.jpg", "t": "Acta de defuncion de Francesco Celeri - Trassilico acta 16"}], "zooms": [{"u": "../actas/1864%20-%20Francesco%20Celeri%20di%20Giovanni%20Antonio/1864-03-18%20D%20zoom%20-%20hijo%20del%20difunto%20Gio%20Antonio%20Celeri%20y%20de%20Giusti%20Mariangela.jpg", "t": "Hijo del difunto Gio Antonio Celeri y de Giusti Mariangela"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "desiderio_di_paolo": {"id": "desiderio_di_paolo", "nombre": "Desiderio Celeri di Paolo", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 7, "ramas": [], "resumen": "Another Celeri of Trassilico, a farmhand, who is almost certainly the Desiderio Celeri who appears in the city of Santa Fe in 1887 surrounded by surnames from his village. He is no close relative of Tebaldo, but he explains why Tebaldo ended up there.", "datos": [["Birth", "hacia 1842, TRASSILICO — los veintiún años que declara al prometerse en septiembre de 1863"], ["Trade", "CONTADINO, agricultor"], ["Parents", "CELERI PAOLO, de cincuenta y cuatro años en 1863 —nacido hacia 1809, agricultor y ANALFABETO— y la difunta BONETTI CATERINA, muerta a los cincuenta y ocho"], ["Marriage", "promesa el 17 de septiembre de 1863 (acta 21), boda en la iglesia el 19 y transcripción civil el 26 (acta 23)"], ["Wife", "REBECHI ANGELA, de dieciocho años, hija de REBECHI GIOVANNI —agricultor, cuarenta años— y de la difunta CAROLA FRATI, muerta a los treinta y dos y nacida en VALDICASTELLO, en la Versilia"], ["Hijo conocido", "MASSIMILIANO PAOLO NARCISO, nacido el 27 de junio de 1864 a las ocho de la mañana, en el paraje «al Troviale» — nueve meses justos después de la boda"], ["Quién le hizo de testigo", "CALLISTO CELERI, el secretario del ayuntamiento, en la inscripción de su hijo"]], "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "17 de septiembre de 1863; boda el 19, transcripción el 26", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "actas 21 y 23", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.5 «Matrimoni» 1863, y Registro 51.7 «Nati» 1864"], ["Signatura", "ark:/12657/an_ua35853348 — hash 03QyKYJ; el acta en la página 14"]], "literal": "", "traduccion": "The year 1863, the 17th day of September. Before me, the undersigned BERTOLI BARSOTTI RANIERI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, there appeared CELERI DESIDERIO, aged TWENTY-ONE, son of CELERI PAOLO aged fifty-four and of the late BONETTI CATERINA aged fifty-eight; and REBECHI ANGELA, aged EIGHTEEN, daughter of REBECHI GIOVANNI aged forty and of the late CAROLA FRATI aged thirty-two, BORN AT VALDICASTELLO — the others all born at Trassilico and resident there, ALL BY TRADE FARMERS;\n\nwho, in the presence of the witnesses DON GIO. BATTISTA FORISCHI, aged fifty, and DON ANGELO GRAZIANI, aged fifty-six, the first parish priest and the second chaplain of Valico Sopra, declared that it is their intention to be joined in marriage, and handed me the authentic certificate of their birth and further the authentic certificates of the DEATH OF CATERINA BONETTI AND OF CAROLA FRATI, the mothers of the couple; and their parents here present having given their full consent...\n\nDesiderio Celeri and Giovanni Rebechi sign. CELERI PAOLO AND REBECHI ANGELA are EXCLUDED FROM SIGNING «perché detti si illetterati» — because they are illiterate.", "notas": ["*** ES, CASI CON SEGURIDAD, EL DESIDERIO CELERI QUE APARECE EN SANTA FE. *** El censo argentino de 1887 tiene en la ciudad de Santa Fe una casa con CELERI DESIDERIO de 45 años, su mujer REBEQUI ANGELA de 42, su hijo PABLO de 23 casado con FRATTI INÉS, y un CARLI JOSÉ. Aquí: él nacido hacia 1842, ella hacia 1845, y su hijo PAOLO nacido el 27 de junio de 1864. Cuatro coincidencias y ninguna discrepancia — y hasta el apellido de la nuera, FRATTI, es el de la madre de Angela.", "*** Y ESO EXPLICA POR QUÉ TEBALDO ACABÓ EN SANTA FE. *** No fue al azar: había gente de Trassilico allí. En esa misma ciudad hay Rebechi que declaran «Italia, TOSCANA», y los cuatro apellidos de aquella casa —Celeri, Rebechi, Fratti y Carli— salen todos en los índices de Trassilico.", "NO ES HERMANO DE CALLISTO, y conviene decirlo porque durante unas horas se pensó que sí. Su padre es PAOLO, vivo en 1863; el padre de Callisto era DESIDERIO y llevaba muerto desde antes de 1852.", "DOS RAMAS DEL MISMO APELLIDO Y DE DISTINTA CONDICIÓN. Paolo Celeri no sabía firmar y era agricultor; Callisto Celeri era secretario del ayuntamiento, possidente, y su letra cierra los índices del pueblo. En la inscripción del hijo de Desiderio, en julio de 1864, fue Callisto quien hizo de testigo.", "TIENE UN HERMANO, Y SE LLAMA FRANCESCO. El acta 23 —la que transcribe la boda religiosa— lo pone de testigo: «CELERI FRANCESCO DI PAOLO». Otro hijo del mismo Paolo.", "Y EL MISMO REGISTRO, DOS ACTAS MÁS ABAJO, DESTAPA UN NOVENO PADRE CELERI. El acta 24 casa a CELERI DOMENICO, de treinta y dos años, campesino de VALICO SOTTO, hijo del difunto *** VENANZIO CELERI *** —muerto a los sesenta y cuatro— y de la difunta MARIA ANGELI. Con él ya son nueve los Celeri distintos que aparecen como padres en Trassilico: Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolo, Carlo Agostino, Jacopo y Venanzio.", "Y SE VE LA GEOGRAFÍA DEL APELLIDO: los Celeri de Venanzio son de VALICO SOTTO; los de Paolo viven en el pueblo, en el paraje «al Troviale»; los nuestros, los de Desiderio, también en el pueblo pero «dai Bottegai» primero y «nella Piazza della Maestà» después. El apellido está repartido por todas las aldeas del municipio.", "EL CURA ES SIEMPRE EL MISMO: DON DOMENICO GRANDI casó a Callisto y Enrichetta en 1859, bautizó a Tebaldo en 1862 y casó a este Desiderio en 1863. Un solo párroco para todo el pueblo.", "*** Y LOS ALLEGATI APARECIERON, CON LAS DOS PARTIDAS DENTRO. *** El expediente está en el Registro 64.11, páginas 40 a 42: «FASCICOLO N. 4 del mese di Settembre 1863 — Atto di Matrimonio N. 21 — Sposi Celeri Desiderio e Rebechi Angela — ALLEGATI N. 2». Y los dos adjuntos son extractos literales del libro de difuntos de la parroquia:\n\n· «A 13 DE ABRIL DE 1859. CAROLINA, mujer de Giovanni Rebechi e HIJA DE FRANCESCO FRATI, habitante en esta feligresía, provista de todos los auxilios de nuestra Santa Religión, murió el dicho día».\n· «1862, EL DÍA 13 DE MAYO. MARIA CATERINA, HIJA DEL DIFUNTO BATTISTA BONETTI y mujer de CELERI PAOLO, murió a las once de la noche».\n\nDOS PADRES NUEVOS, de la generación de 1780-1800: **FRANCESCO FRATI** y **BATTISTA BONETTI**.\n\nY UN DETALLE QUE EL PAPEL DICE SIN QUERER: el certificado se expide «in carta libera attesa la POVERTÀ DEI RICHIEDENTI» — en papel sin timbre, porque los novios eran pobres. Encaja con que Paolo Celeri no supiera firmar y con que todos fueran «agricoltori». Y contrasta de lleno con el expediente de la boda de Luisa Vanni, lleno de notarios, prefectos y «possidenti».", "*** Y EL MISMO LEGAJO GUARDA LA OTRA RAMA CELERI DEL PUEBLO, LA DE VALICO SOTTO. *** El fascículo del acto 24 —la boda de CELERI DOMENICO con Maria Elisabetta Porta, el 1 de octubre de 1863— trae dos certificados del párroco de Valico Sotto:\n\n· «DOMENICO, hijo de VENANZIO CELERI y de MARIA ANGELI, nació el 16 DE ABRIL DE 1831 a las doce del mediodía y fue bautizado ese mismo día».\n· «*** VENANZIO, HIJO DEL DIFUNTO SEÑOR DOMENICO CELERI, y padre de Domenico Celeri ***, pasó de esta a mejor vida el 3 DE NOVIEMBRE DE 1858 A LAS TRES DE LA MADRUGADA, a la edad de SESENTA Y CUATRO AÑOS».\n\n*** ESO SACA AL CELERI MÁS ANTIGUO DE TODO EL ÁRBOL: UN DOMENICO CELERI NACIDO HACIA 1760-1775 ***, padre de Venanzio y abuelo del novio, que lleva su nombre. Es la tercera vez que se ve la costumbre italiana de bautizar al nieto con el nombre del abuelo — como Pietro Vanni por el cabo Pietro, o Bartolomeo Alasia por Bartolomeo Allasia.\n\nY CONFIRMA POR CUARTA VEZ que este registro da la EDAD AL MORIR de los padres difuntos: el acta civil decía «fu Celeri Venanzio di anni 64», y la partida parroquial dice exactamente sesenta y cuatro.\n\nLOS ALLEGATI DE ESTA BODA EXISTEN Y ESTÁN CITADOS EN EL ACTA: las fes de nacimiento de los novios y las de defunción de las dos madres. Si el registro de allegati de 1863 está digitalizado, ahí hay dos partidas de defunción esperando.", "*** 29 DE AGOSTO DE 2026 — YA SE SABE QUÉ DOCUMENTO CIERRA LA PREGUNTA, DÓNDE ESTÁ Y EN QUÉ PÁGINA. *** Su padre, PAOLO CELERI, ha resultado ser el mismo hombre que JACOPO CELERI, que en un acta de 1862 consta como «FU GIO. DOMENICO» (la explicación entera está en la ficha de Jacopo). Y Callisto es «del fu Desiderio DEL FU DOMENICO». Si esos dos Domenico son el mismo, *** él es primo hermano de Callisto ***, y eso explicaría por fin por qué dos familias Celeri de un pueblo de cien vecinos acaban en la misma ciudad argentina.\n\nLo que lo probaría está en la manera de escribir del párroco. De las tres fes de bautismo de los hijos de Callisto, dos dicen sólo dos generaciones, pero *** la de Tebaldo dice tres: «figlio di Callisto del fu Desiderio DEL FU DOMENICO Celeri». *** Ese cura escribía a veces hasta el abuelo. Y él tuvo un hijo, PAOLO CELERI, nacido el 27 de junio de 1864 e inscrito el 3 de julio, acta 48 — la misma en la que Callisto firma como testigo.\n\n*** Esa fe de bautismo está en el legajo de anexos de 1864, que es EL MISMO que ya se abrió para leer la de Dante Giuseppe, y su identificador ya está guardado: no cuesta ni una petición. *** Al leer aquella se calibró el legajo con tres sondeos —página 115 = acta 32, página 121 = acta 27, página 125 = acta 24—, de donde se ve que va al revés, a razón de un cuarto de página de más por cada acta menos. Aplicándolo, el acta 48 cae *** hacia la página 95 ***, y basta mirar de la 90 a la 100.\n\nSi ahí pone «figlio di Celeri Desiderio del fu Paolo del fu DOMENICO», queda probado. Si pone otro nombre, quedan separadas las dos ramas — que también sirve. Y si el cura sólo escribió dos generaciones, habría que ir al legajo de anexos de su propia boda de 1863, donde estaría su fe de bautismo. Lo único que falta es que el servidor de imágenes de Antenati deje de bloquear."], "imgs": [{"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20Acta%2021%2C%20promesa%20de%20Desiderio%20Celeri%20y%20Angela%20Rebechi%20-%20Trassilico.jpg", "t": "Acta 21, promesa de Desiderio Celeri y Angela Rebechi - Trassilico"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1864-07%20N%20Actas%2052%20y%2053%2C%20Callisto%20Celeri%20testigo%20como%20segretario%20comunale%20-%20Trassilico.jpg", "t": "Actas 52 y 53, Callisto Celeri testigo como segretario comunale - Trassilico"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1864-07-03%20N%20Acta%2048%2C%20Massimiliano%20Paolo%20Narciso%20de%20Desiderio%20di%20Paolo%20-%20Trassilico.jpg", "t": "Acta 48, Massimiliano Paolo Narciso de Desiderio di Paolo - Trassilico"}], "zooms": [{"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20zoom%20-%20la%20madre%20de%20el%2C%20fu%20Bonetti%20Caterina%2C%20y%20la%20novia%20Rebechi%20Angela.jpg", "t": "La madre de el, fu Bonetti Caterina, y la novia Rebechi Angela"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20zoom%20-%20los%20padres%20de%20ella%2C%20Rebechi%20Giovanni%20y%20fu%20Carola%20Frati%20de%20Valdicastello.jpg", "t": "Los padres de ella, Rebechi Giovanni y fu Carola Frati de Valdicastello"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "domenico_celeri_viejo": {"id": "domenico_celeri_viejo", "nombre": "Domenico Celeri", "legal": "«del fu Domenico Celeri» en la fe de bautismo de Tebaldo", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Desiderio Celeri, and the oldest Celeri in the direct line. He surfaced on 28 August 2026, in the baptismal record of his great-grandson Tebaldo.", "datos": [["Quién era", "padre de DESIDERIO CELERI, abuelo de Callisto y bisabuelo de Tebaldo"], ["Birth", "hacia 1770-1780, si su hijo Desiderio nació hacia 1800-1805"], ["Dead before", "julio de 1862 — la fe de bautismo de Tebaldo lo llama «il fu Domenico Celeri». Probablemente mucho antes"], ["Village", "TRASSILICO"], ["Where this comes from", "fe de bautismo de TEBALDO CELERI, parroquia de Trassilico, 25 de julio de 1862: «figlio di CALLISTO DEL FU DESIDERIO DEL FU DOMENICO CELERI»"]], "mapa": null, "sinacta": "Existe por cinco palabras — «del fu Desiderio del fu Domenico Celeri» — y con ellas la línea paterna sube una generación más, hasta gente nacida hacia 1770.\n\n*** DÓNDE APARECIÓ, Y POR QUÉ IMPORTA EL DETALLE. *** El acta CIVIL de nacimiento de Tebaldo, la del ayuntamiento, sólo dice «Callisto fu Desiderio». La que añade al abuelo es la FE DE BAUTISMO que escribió el cura y que se archivó adjunta al expediente. Es la diferencia entre los dos papeles: el funcionario anotaba lo mínimo, el párroco conocía a las familias y escribía dos generaciones.\n\n*** Y PUEDE UNIR DOS DE LAS NUEVE RAMAS CELERI DEL PUEBLO. *** En el expediente de otra boda apareció «VENANZIO **del fu Sig. DOMENICO CELERI**», muerto en 1858 a los sesenta y cuatro años, o sea nacido hacia 1794. Si ese Domenico y éste son el mismo hombre, DESIDERIO Y VENANZIO ERAN HERMANOS y la rama campesina de Valico Sotto es la misma que ésta. NO ESTÁ PROBADO —Domenico es nombre corriente— pero son dos hombres de la misma generación, del mismo pueblo y con el padre del mismo nombre. Es la primera pista real para unir las ramas Celeri, que hasta ahora eran nueve apellidos sueltos.\n\nCÓMO SE PROBARÍA: el libro de bautizados de Trassilico de 1794-1805, o el acta de matrimonio de Desiderio con Angela Menghi, hacia 1825-1830. Las dos cosas son parroquiales y habría que pedirlas al archivo que custodie esos libros.\n\n*** Y EL MISMO DÍA, MÁS TARDE, APARECIÓ EL SITIO DONDE PODRÍA ESTAR EL NOMBRE DE SU MUJER. *** De él sabemos que existió y nada más; de su mujer, ni el nombre. Todo el proyecto daba por hecho que antes de 1852 no había registro civil en Trassilico y que sólo quedaban los libros de la parroquia. *** Es falso: existe el estado civil napoleónico del Principado de Lucca, y Trassilico está dentro, con nacimientos, matrimonios y defunciones de 1808 a 1812. *** Cuarenta y cuatro años antes del fondo que llevamos todo el día leyendo.\n\nSu hijo Desiderio nació hacia 1800-1805, demasiado pronto para esos libros. Pero *** cualquier otro hijo suyo nacido entre 1808 y 1812 tendría acta allí, y un acta de nacimiento napoleónica nombra al padre Y A LA MADRE, los dos con su edad. *** Un solo acta de ésas daría a la mujer de Domenico Celeri, que hoy es un hueco completo. Y los libros de difuntos de esos mismos años alcanzan a la generación nacida hacia 1730-1770, o sea a sus propios padres.\n\n*** Y ORDENANDO BIEN LAS GENERACIONES, EL 29 DE AGOSTO POR LA TARDE, TODO APUNTA A QUE TUVO AL MENOS TRES HIJOS. *** Yo había metido a los nueve Celeri padres de Trassilico en una sola quinta, y estaba mal: *** él no puede ser de la generación de 1800 ***, porque su hijo VENANZIO murió en 1858 a los sesenta y cuatro años —dato confirmado dos veces— y por tanto nació en 1794. Un hombre cuyo hijo nace en 1794 nació hacia 1760-1775.\n\nPuestas así las cosas, los tres encajan como hermanos: *** VENANZIO en 1794, DESIDERIO hacia 1802 y JACOPO/PAOLO en 1808-09 ***. Quince años entre el mayor y el menor, que es lo más normal del mundo. Y entonces ILARIO —hermano probado suyo— sería tío abuelo de Callisto, y el hijo de Venanzio, ese Domenico nacido el 16 de abril de 1831 que lleva su nombre, sería primo hermano de Callisto: los dos nacidos el mismo año.\n\n*** La objeción seria, y hay que decirla: la rama de Venanzio y la de Paolo son POBRES y la de Desiderio no. *** Los extractos parroquiales de Venanzio se expiden «in carta semplice attesa la povertà», y Paolo era agricultor analfabeto; en cambio Callisto es possidente y secret /* Escapa y convierte las URLs sueltas en enlaces. */
function escEnl(t){
  t = String(t == null ? '' : t);
  let out = '', i = 0, mm;
  const re = /https?:[/][/][^\s)\]]+/g;
  while((mm = re.exec(t)) !== null){
    out += esc(t.slice(i, mm.index));
    const u = mm[0].replace(/[.,;]+$/, '');
    out += '<a class="ext" href="' + esc(u) + '" target="_blank" rel="noopener">ver en el mapa</a>';
    i = mm.index + u.length;
  }
  return out + esc(t.slice(i));
}
