0"], ["Registro", "an_ua35977235"], ["Página", "20 de 51"]], "literal": "acta 19 | Michele Esposito Salerno | N/A\nacta 19 | Maria Antonia Palermo    | Palermo, Francesco Giacomo  Volpintesta, Carmina", "traduccion": "Marriage celebrated before Luigi Perugini, mayor of Rende. The groom appears as «Michele Esposito Salerno», aged 33, with the parents' box left blank on account of his being a foundling. The bride, Maria Antonia Palermo, aged 19, daughter of Francesco Giacomo Palermo and of Carmina Volpintesta. The dossier preserves the birth records of both and the certificate from the mayor of Castelfranco.", "notas": ["Ese mismo año se casaron en Rende DOS hombres llamados Michele Salerno. El otro es el acta 3: Michele Salerno, hijo de Gaetano Salerno e Isabella Iorio, con Rosa Cundari. Cualquier buscador que cruce «Michele Salerno + Rende + 1858» devuelve al que no es.", "Aceptar al homónimo le pondría padres a un hombre que documentalmente no los tiene, y desviaría la rama entera."], "imgs": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20Michele%20y%20Maria%20Antonia%20-%20Rende%20acta%2019%20-%20doble%20pagina.png", "t": "Michele y Maria Antonia - Rende acta 19 - doble pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20processetti%20-%20transcripcion%20del%20acta%2019.jpg", "t": "Processetti - transcripcion del acta 19"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20registro%20de%20matrimonios%20-%20pagina.jpg", "t": "Registro de matrimonios - pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20visor%20completo.png", "t": "Visor completo"}], "zooms": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20datos%20de%20los%20novios.png", "t": "Datos de los novios"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20b.png", "t": "Documentos presentados b"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20c.png", "t": "Documentos presentados c"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados.png", "t": "Documentos presentados"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20pie%20y%20celebracion%20canonica.png", "t": "Pie y celebracion canonica"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20testigos.png", "t": "Testigos"}]}], "nActas": 1, "nImgs": 3, "titulo": "The index changed her name", "parrafos": ["She was born at Marano Marchesato in March 1839. Her record was drawn up by the sindaco Giuseppe Filippelli at four in the afternoon, with her father Giacomo Palermo appearing and declaring twenty-seven years, and the name given was written down as «Maria Antonia».", "The index this investigation started from transcribes that same record 18 of 1839 as «Maria Francesca Palermo». It is an index error, and an expensive kind: searching for a Maria Francesca finds nobody. The rule that came out of this holds for everything else: if the record number, the year and the parents match and only the name is wrong, the original record wins.", "She married on 22 August 1858, at two in the afternoon, at the town hall of Rende, aged nineteen; he was thirty-three, fourteen years older. The banns were read at Castrolibero, where he lived, and they were married by the mayor of Rende, Luigi Perugini — the same official who nine years later would sign her father's death record.", "On her children's records she appears as contadina, a countrywoman, and in 1873 as filatrice, a spinner. She is almost always called «Palermo Maria», without the Antonia: the full name appears only on her own birth record. She was still alive in November 1910, aged seventy-one, when her eldest son married."], "claves": [["Birth", "March 1839, Marano Marchesato, record 18"], ["The index calls her", "Maria Francesca — the record says Maria Antonia"], ["Married at", "19, to a man fourteen years older"], ["Trade", "contadina; filatrice, spinner, in 1873"], ["Still alive in", "November 1910, aged 71"]]}, "antonio_palermo": {"id": "antonio_palermo", "nombre": "Antonio Palermo", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 6, "ramas": ["salerno"], "resumen": "Brother of Maria Antonia. Born at Marano Marchesato on 10 October 1841, in the contrada Palazzo, when his father was a shepherd.", "datos": [["Birth", "10 de octubre de 1841, 10 h, Marano Marchesato — acta 67"], ["Place", "contrada Palazzo"], ["Parents", "Giacomo Palermo, pastore, 36 años, y Carmina Volpentesta, 30 años"], ["Baptism", "el mismo día 10 de octubre, parroquia de Marano"], ["Después de 1841", "no se sabe nada de él"]], "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "annunciata_palermo", "teresa_palermo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "10 de octubre de 1841, 16 h (el acta); nacido a las 10 h", "lugar": "Marano Marchesato", "ref": "acta 67", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 33 «Nati» 1841"], ["Registro", "an_ua35968838 · hash wQ99VDb"], ["Página", "35 de 50"], ["Registrar", "Francesco Spizzirri, sindaco"], ["Año manuscrito", "«mille ottocento quarantuno» — coincide con el catálogo"]], "literal": "…è comparso il Signor Giacomo Palermo di anni trentasei di professione pastore domiciliato in Marano contrada Palazzo… da Carmina Volpentesta di anni trenta domiciliata con esso… il nome di Antonio.", "traduccion": "In the year eighteen hundred and forty-one, on the tenth day of the month of October, at sixteen hours, before Us, FRANCESCO SPIZZIRRI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared signor GIACOMO PALERMO, AGED THIRTY-SIX, by trade a PASTORE, resident at Marano, CONTRADA PALAZZO.\n\nAnd he presented to us a boy, as we ascertained with our own eyes, and declared to us that the same was born of CARMINA VOLPENTESTA, aged thirty, resident with him, on the tenth day of the month aforesaid of the current year, at ten in the morning, in the house of their dwelling.\n\nThe same further declared that he gave the boy the name ANTONIO.\n\nThe presentation and declaration were made in the presence of BRUNO PARRO, aged thirty, day labourer, resident at Marano, contrada Palazzo, and of DOMENICO BELMONTE, aged forty, day labourer, resident at Marano, contrada Palazzo, witnesses.\n\n[In the right-hand column] The parish priest of the church of Marano returned to us the notice stating that the Sacrament of baptism was administered to the said boy, called ANTONIO PALERMO, on the tenth day of the month indicated.", "notas": ["Es la única de las cinco actas de este hombre en la que declara ser PASTORE. En 1845 y 1852 dirá «bracciale», y al morir en 1867 el acta lo llama «pecoraio». Empieza y termina de pastor.", "Treinta y seis años en octubre de 1841 lo sitúan hacia 1805. Es la cifra más antigua de las cinco que se le conocen.", "Nació y se inscribió el mismo día, y lo bautizaron también el mismo día. Era lo normal: la mortalidad infantil no dejaba esperar.", "El apellido del primer testigo es de lectura dudosa: «Bruno Parro» o «Bruno Perri»."], "imgs": [{"u": "../actas/1841%20-%20Antonio%20Palermo/1841-10-10%20N%20Antonio%20Palermo%20-%20Marano%20Marchesato%20acta%2067.jpg", "t": "Antonio Palermo - Marano Marchesato acta 67"}], "zooms": [{"u": "../actas/1841%20-%20Antonio%20Palermo/1841-10-10%20N%20zoom%20-%20acta%2067%2C%20padre%20Giacomo%20Palermo%20pastore%20y%20madre%20Carmina%20Volpentesta.jpg", "t": "Acta 67, padre Giacomo Palermo pastore y madre Carmina Volpentesta"}]}], "nActas": 1, "nImgs": 2, "titulo": "Baptised the same day", "parrafos": ["He was born on 10 October 1841 at ten in the morning, in his parents' house, in the contrada Palazzo of Marano Marchesato. That same afternoon, at four, his father took him before Francesco Spizzirri, sindaco and registrar. Giacomo Palermo declared thirty-six years and the trade of shepherd.", "The right-hand column of the record certifies that the parish priest of Marano baptised him that same 10th. The witnesses were two day labourers from his own contrada, Bruno Parro — an uncertain reading — aged thirty, and Domenico Belmonte, forty. None of the three could write: only the mayor signs.", "He is the second of the four documented children of Giacomo and Carmina, and Maria Antonia's brother. After that day he never appears in any paper again: no marriage, no death, no mention on anyone else's record."], "claves": [["Birth", "10 October 1841, 10 a.m., contrada Palazzo, Marano Marchesato"], ["Baptism", "the same day"], ["Father's trade then", "pastore"], ["After 1841", "nothing"]]}, "annunciata_palermo": {"id": "annunciata_palermo", "nombre": "Annunziata Palermo", "legal": "Annunciata Palermo", "rol": "hermano", "rolNombre": "Sibling", "gen": 6, "ramas": ["salerno"], "resumen": "Sister of Maria Antonia. Born at Marano Marchesato on 3 February 1845, in the contrada Langhi.", "datos": [["Birth", "3 de febrero de 1845, 9 h, Marano Marchesato — acta 7"], ["Place", "contrada Langhi"], ["Parents", "Giacomo Palermo, bracciale, 38 años, y Carmina Volpentesta, 30 años"], ["Baptism", "el mismo día 3 de febrero"], ["Después de 1845", "no se sabe nada de ella"]], "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "antonio_palermo", "teresa_palermo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "3 de febrero de 1845, 14 h (el acta); nacida a las 9 h", "lugar": "Marano Marchesato", "ref": "acta 7", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 37 «Nati» 1845"], ["Registro", "an_ua35968858 · hash 5Y44zaB"], ["Página", "5 de 51"], ["Registrar", "Francesco Spizzirri, sindaco"], ["Año manuscrito", "«mille ottocento quarantacinque» — coincide con el catálogo"]], "literal": "…è comparso il Signor Giacomo Palermo di anni trentotto di professione bracciale domiciliato in Marano contrada Langhi… da Carmina Volpentesta sua moglie legittima di anni trenta… il nome di Annunciata.", "traduccion": "In the year eighteen hundred and forty-five, on the third day of the month of February, at fourteen hours, before Us, FRANCESCO SPIZZIRRI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared signor GIACOMO PALERMO, AGED THIRTY-EIGHT, by trade a BRACCIALE (day labourer), resident at Marano, CONTRADA LANGHI.\n\nAnd he presented to us a girl, as we ascertained with our own eyes, and declared to us that the same was born of CARMINA VOLPENTESTA, his lawful wife, AGED THIRTY, resident with him, on the third day of the month aforesaid of the current year, at nine in the morning, in the house of their dwelling.\n\nThe same further declared that he gave the girl the name ANNUNCIATA.\n\nThe presentation and declaration were made in the presence of FRANCESCO CONFORTI, aged thirty, day labourer, resident at Marano, contrada Conchiali, and of GAETANO DE LUCA, aged forty-two, day labourer, resident at Marano, contrada Conchiali, witnesses.\n\n[In the right-hand column] The parish priest of Marano certifies that baptism was administered to the girl, called ANNUNCIATA PALERMO, on the third day of the month indicated.", "notas": ["El índice del que se partió la llama «Annunziata»; el acta original y la partida de bautismo escriben ANNUNCIATA, con c. La carpeta se dejó con el nombre acordado y el fichero lleva la grafía del acta.", "La familia se ha mudado: en 1841 vivían en contrada Palazzo y aquí están en contrada Langhi. En 1852 estarán en Cerzi.", "El padre declara treinta y ocho años, que lo sitúan hacia 1807 — la misma cuenta que saldrá de su acta de defunción de 1867.", "La madre declara treinta años, los mismos que declaró en 1841. Las edades de las mujeres en estos registros se repiten y se redondean con toda naturalidad.", "Gaetano De Luca vuelve a ser testigo siete años después, en el nacimiento de Teresa."], "imgs": [{"u": "../actas/1845%20-%20Annunziata%20Palermo/1845-02-03%20N%20Annunciata%20Palermo%20-%20Marano%20Marchesato%20acta%207.jpg", "t": "Annunciata Palermo - Marano Marchesato acta 7"}], "zooms": [{"u": "../actas/1845%20-%20Annunziata%20Palermo/1845-02-03%20N%20zoom%20-%20acta%207%20completa%2C%20padres%20y%20testigos.jpg", "t": "Acta 7 completa, padres y testigos"}]}], "nActas": 1, "nImgs": 2, "titulo": "Annunciata, with a c", "parrafos": ["She was born on 3 February 1845 at nine in the morning, in the contrada Langhi of Marano Marchesato, and her father registered her at two that same afternoon. Giacomo Palermo then declared thirty-eight years and the trade of day labourer; four years earlier he had declared shepherd.", "The modern index calls her Annunziata, with a z. The original record and the baptismal entry write ANNUNCIATA, with a c. The spelling of the document is what governs.", "One of her two witnesses, Gaetano De Luca, a forty-two-year-old day labourer from the contrada Conchiali, will sign again seven years later at her sister Teresa's birth. After 1845 nothing more is known of her."], "claves": [["Birth", "3 February 1845, 9 a.m., contrada Langhi, Marano Marchesato"], ["Spelling", "Annunciata on the record and at the baptism; Annunziata only in the index"], ["Baptism", "the same day"], ["After 1845", "nothing"]]}, "teresa_palermo": {"id": "teresa_palermo", "nombre": "Teresa Palermo", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 6, "ramas": ["salerno"], "resumen": "The youngest of the documented siblings. Born at Marano Marchesato on 16 January 1852, in the contrada Cerzi.", "datos": [["Birth", "16 de enero de 1852, 10 h, Marano Marchesato — acta 5"], ["Place", "contrada Cerzi (lectura dudosa)"], ["Parents", "Giacomo Palermo, bracciale, 40 años, y Carmina Volpentesta, 35 años"], ["Baptism", "el mismo día 16 de enero, parroquia de S. Maria del Carmine"], ["Después de 1852", "no se sabe nada de ella"]], "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": null, "hijos": [], "hermanos": ["maria_antonia", "antonio_palermo", "annunciata_palermo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "16 de enero de 1852, 17 h (el acta); nacida a las 10 h", "lugar": "Marano Marchesato", "ref": "acta 5", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 44 «Nati» 1852"], ["Registro", "an_ua35969306 · hash 0nk2Gxl"], ["Página", "4 de 58"], ["Registrar", "Ferdinando Conforti, sindaco"], ["Año manuscrito", "«mille ottocento cinquantadue» — coincide con el catálogo"]], "literal": "…è comparso il signor Giacomo Palermo di anni quaranta di professione bracciale domiciliato in Marano contrada Cerzi… da Carmina Volpentesta sua moglie legittima di anni trentacinque… il nome di Teresa.", "traduccion": "In the year eighteen hundred and fifty-two, on the sixteenth day of the month of January, at seventeen hours, before Us, FERDINANDO CONFORTI, mayor and registrar of the civil status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared signor GIACOMO PALERMO, AGED FORTY, by trade a BRACCIALE, resident at Marano, CONTRADA CERZI.\n\nAnd he presented to us a girl, as we ascertained with our own eyes, and declared to us that the same was born of CARMINA VOLPENTESTA, his lawful wife, AGED THIRTY-FIVE, resident with him, on the sixteenth day of the month aforesaid of the current year, at ten in the morning, in the house of their dwelling.\n\nThe same further declared that he gave the girl the name TERESA.\n\nThe presentation and declaration were made in the presence of LUIGI SICILIA, aged fifty, day labourer, resident at Marano, contrada Langhi, and of GAETANO DE LUCA, aged forty-eight, day labourer, resident at Marano, contrada Langhi, witnesses.\n\n[In the right-hand column] The parish priest of S. Maria del Carmine certifies that baptism was administered to the girl, called TERESA PALERMO, on the sixteenth day of the month indicated.", "notas": ["Ha cambiado el alcalde: hasta 1845 firmaba Francesco Spizzirri y ahora firma Ferdinando Conforti.", "Es la única de las tres actas en que aparece el nombre de la parroquia: SANTA MARIA DEL CARMINE de Marano.", "El padre declara cuarenta años, que darían un nacimiento hacia 1812. Es la cifra que peor encaja con las demás (36 en 1841, 38 en 1845, 60 al morir en 1867); las edades declaradas en estos registros son aproximadas.", "El nombre de la contrada es de lectura dudosa: «Cerzi» es lo más probable. Los volúmenes de la Restauración están escaneados a menos resolución que los posteriores y algunas palabras no se dejan leer por mucho que se amplíe.", "Trece años separan a Teresa de su hermana mayor Maria Antonia. Entre 1839 y 1852 casi seguro hay más hermanos sin buscar."], "imgs": [{"u": "../actas/1852%20-%20Teresa%20Palermo/1852-01-16%20N%20Teresa%20Palermo%20-%20Marano%20Marchesato%20acta%205.jpg", "t": "Teresa Palermo - Marano Marchesato acta 5"}], "zooms": [{"u": "../actas/1852%20-%20Teresa%20Palermo/1852-01-16%20N%20zoom%20-%20acta%205%2C%20padre%20Giacomo%20Palermo%20y%20madre%20Carmina%20Volpentesta.jpg", "t": "Acta 5, padre Giacomo Palermo y madre Carmina Volpentesta"}]}], "nActas": 1, "nImgs": 2, "titulo": "The last one from Marano", "parrafos": ["She was born on 16 January 1852 at ten in the morning, in the contrada Cerzi — an uncertain reading — and was registered at five that same afternoon. She was baptised that day in the parish of S. Maria del Carmine at Marano.", "Her father declared forty years. The mayor was no longer Francesco Spizzirri, who signed in 1841 and 1845, but Ferdinando Conforti. And among the witnesses is Gaetano De Luca again, now aged forty-eight.", "She is the youngest of the four documented children, and eleven years separate her from the eldest. Between 1839 and 1852 nobody has yet swept the Marano births: it is very likely there are more siblings to find. Of Teresa's life after that 16 January nothing is known."], "claves": [["Birth", "16 January 1852, 10 a.m., contrada Cerzi, Marano Marchesato"], ["Baptism", "the same day, S. Maria del Carmine"], ["Place among the siblings", "the youngest of the four documented"], ["After 1852", "nothing"]]}, "domenico": {"id": "domenico", "nombre": "Domenico Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["salerno"], "resumen": "The eldest of the four brothers. He posted banns at Rende in 1888 and married Giuseppina Cairo in 1910. He was widowed at least once.", "datos": [["Birth", "hacia 1859, CASTROLIBERO — según declara él mismo en 1910"], ["Parents", "Michele Salerno y Maria Antonia Palermo"], ["Publicación", "1888, Rende"], ["Primer matrimonio", "sin localizar — en 1910 consta VIUDO"], ["Marriage", "5 de noviembre de 1910, Rende — acta 44, con Giuseppina Cairo"], ["Trade", "contadino"], ["Hijos documentados", "Salvatore (1906) y Michele (1909), con Maria Russo"]], "mapa": null, "sinacta": "Su acta de nacimiento sigue sin aparecer, pero desde 2026 se sabe dónde buscarla. En su boda de 1910 (acta 44, ya descargada y transcrita en la ficha del matrimonio) declara CINCUENTA Y UN AÑOS y haber NACIDO EN CASTROLIBERO; y diez semanas antes, al declarar la muerte de su sobrina Angelina, había dicho cincuenta. Las dos cifras apuntan a un nacimiento hacia 1859, unos diez meses después de la boda de sus padres: sería el primogénito. El barrido anterior de Castrolibero, que arrancaba en 1859 y buscaba «Salerno», no lo encontró; hay que repetirlo sobre 1858 y 1859 buscando DE RANGO, que es el apellido con el que Michele inscribía allí a sus hijos.", "padre": "michele", "madre": "maria_antonia", "conyuge": null, "hijos": [], "hermanos": ["arcangela", "francesco", "giovanni"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "A widower at fifty-one", "parrafos": ["He is the eldest of the four brothers and the only one whose birth record has not turned up. What there is are two declarations of his own, ten weeks apart and both from 1910: on 30 August, reporting the death of his niece Angelina, he said he was fifty; on 5 November, marrying, he said fifty-one. The two figures cross at a birth around 1859, some ten months after his parents' wedding. He would therefore be the first-born.", "His marriage record states unambiguously that he was born at Castrolibero. That clashes with an earlier check which had ruled Castrolibero out after sweeping fourteen years of registers. The likeliest explanation is that the wrong surname was searched: there Michele registered his children as DE RANGO. 1858 and 1859 must be looked at again for a «De Rango Domenico», son of Michele and Maria Palermo.", "He married on 5 November 1910, at half past nine in the morning, to Giuseppina Cairo, a spinster of thirty-two, orphaned of both parents. The record calls him «vedovo»: it was not his first wedding, and of the first wife neither the name nor the date of death is known. Nobody appears to give consent — he was fifty-one, she thirty-two — and neither of them signs; the witnesses do, a forty-eight-year-old tailor and a twenty-seven-year-old «civile». Two children by a Maria Russo are attributed to him, Salvatore in 1906 and Michele in 1909, but no record confirms it.", "His wedding is, incidentally, the single most productive document of the whole investigation. By naming his parents without the «fu» — when on the same page the same clerk writes «figlia di fu Giovanni» of the bride — it proves that Michele and Maria Antonia were still alive in November 1910."], "claves": [["Born", "c. 1859 at Castrolibero, by his own declaration"], ["Trade", "contadino, farmhand"], ["Status on marrying in 1910", "widower, aged 51"], ["Could sign", "no"], ["Birth record", "not located; look for it as De Rango"]]}, "arcangela": {"id": "arcangela", "nombre": "Arcangela Salerno", "legal": "Arcangela De Rango", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["salerno"], "resumen": "The only daughter. Born at Castrolibero in 1868 and registered under the surname De Rango.", "datos": [["Birth", "23 de junio de 1868, 2 de la madrugada, Castrolibero — acta 18"], ["Place", "strada Feudo"], ["Parents", "Michele De Rango («figlio di Esposito») y Maria Palermo"], ["Inscrita como", "De Rango Arcangela"]], "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": null, "hijos": [], "hermanos": ["domenico", "francesco", "giovanni"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "24 de junio de 1868, 8 h", "lugar": "Castrolibero", "ref": "acta 18", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 60 «Nati» 1868"], ["Registro", "an_ua35982616 · hash 5d6rYkz"], ["Página", "9 de 18"], ["Registrar", "Giovanni Morelli, asesor decano en funciones de alcalde"]], "literal": "Michele De Rango, figlio di Esposito, di anni quarantadue, di professione bracciale…", "traduccion": "In the year eighteen hundred and sixty-eight, on the twenty-fourth day of June, at eight in the morning, at the town hall, before Giovanni Morelli, senior assessor acting as mayor in the absence of the incumbent, there appeared MICHELE DE RANGO, son of Esposito, aged forty-two, by trade a day labourer, resident in this comune.\n\nHe declares that of MARIA PALERMO, countrywoman, resident in this comune, there was born on the twenty-third of the current month, at two in the morning, in the house of their dwelling situated in this comune, strada Feudo, a girl, upon whom he bestows the name ARCANGELA.\n\nWitnesses: Pasquale Sarentino, son of the late Michele, aged thirty-eight, day labourer; and Ippolito Stellato, son of the late Domenico, aged thirty-six, day labourer. Neither the informant nor the witnesses sign, being illiterate.", "notas": ["Primera aparición del apellido DE RANGO. En Castrolibero la familia entera se inscribe así; en Rende, la misma gente es Salerno.", "La edad del padre (42 en 1868) es la que mejor cuadra con el expósito de 1825, que tendría 43."], "imgs": [{"u": "../actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20Arcangela%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%2018.jpg", "t": "Arcangela Salerno (De Rango) - Castrolibero acta 18"}], "zooms": [{"u": "../actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20cabecera%2C%20padre%20y%20testigos.jpg", "t": "Cabecera, padre y testigos"}, {"u": "../actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20madre%20Maria%20Palermo%20y%20nombre%20impuesto.jpg", "t": "Madre Maria Palermo y nombre impuesto"}, {"u": "../actas/1868%20-%20Arcangela%20Salerno/1868-06-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 4, "titulo": "The only girl in the house", "parrafos": ["She was born on 23 June 1868 at two in the morning, in her parents' house, on the strada Feudo at Castrolibero. Her father went to register her at eight the following morning, before Giovanni Morelli, senior assessor acting as mayor in the absence of the incumbent.", "The record calls him «MICHELE DE RANGO, figlio di Esposito», forty-two years old, by trade bracciale; and her mother «MARIA PALERMO, contadina». It is the first of the three Castrolibero records that write De Rango where Rende will put Salerno. The two witnesses were day labourers like him, Pasquale Sarentino, thirty-eight, and Ippolito Stellato, thirty-six, and none of them signed: the record notes that father, informant and witnesses are illiterate.", "She is the only daughter of Michele and Maria Antonia for whom there is documentary evidence. After that record she never appears again: no marriage, no death, not a mention on her brothers' records."], "claves": [["Birth", "23 June 1868, 2 a.m., strada Feudo, Castrolibero"], ["Registered as", "De Rango Arcangela"], ["Father's declared age", "42 — the one that best fits the foundling of 1825"], ["After 1868", "nothing"]]}, "francesco": {"id": "francesco", "nombre": "Francesco Salerno", "legal": "Francesco De Rango", "rol": "directa", "rolNombre": "Direct line", "gen": 7, "ramas": ["salerno"], "resumen": "Born at Castrolibero in 1870 and registered as De Rango. He married at Rende in 1894, by then as Salerno. A day labourer and farmhand; the family moved from one contrada to another almost every year.", "datos": [["Birth", "7 de diciembre de 1870, 6 de la mañana, Castrolibero — acta 39"], ["Place", "contrada Sciolle / Feudo"], ["Parents", "Michele De Rango Esposito y Maria Palermo"], ["Marriage", "1 de abril de 1894, Rende — acta 16, con 23 años"], ["Spouse", "Filomena Chiappetta"], ["Trade", "agricoltore / contadino"], ["Hijos documentados", "nueve, entre 1895 y 1909"]], "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": "filomena", "hijos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "hermanos": ["domenico", "arcangela", "giovanni"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "8 de diciembre de 1870, 14 h", "lugar": "Castrolibero", "ref": "acta 39", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 62 «Nati» 1870"], ["Registro", "an_ua35982618 · hash w6nGQyQ"], ["Página", "19 de 24"], ["Registrar", "Giovanni Morelli, Sindaco"]], "literal": "…è comparso Michele De Rango Esposito, di anni quarantotto, di professione bracciale, domiciliato in questo comune, contrada Feudo…\n\n…è nato dalla sua legittima moglie Maria Palermo, contadina, domiciliata con suo marito, che il giorno sette del corrente mese ed anno ad ore sei antimeridiane…\n\nLo stesso dichiarante ha imposto al bambino il nome di Francesco.", "traduccion": "In the year eighteen hundred and seventy, on the eighth day of the month of December, at the town hall of Castrolibero, district of Cosenza, province of Calabria Citeriore, at two in the afternoon. Before me, Giovanni Morelli, mayor and Registrar of the Civil Status of the said comune, there appeared MICHELE DE RANGO ESPOSITO, aged forty-eight, by trade a day labourer, resident in this comune, contrada Feudo.\n\nWho, in the presence of the witnesses chosen by him — Alessandro Calabrese, son of the late Vincenzo, aged twenty-eight, and Michele Cosentino, son of the late Antonio, aged thirty-seven, both day labourers resident in this comune — presented to me a child of the male sex whom I ascertained with my own eyes, and declared that the same was born of his lawful wife MARIA PALERMO, countrywoman, resident with her husband, on the seventh of the current month and year, at six in the morning, in the house of their dwelling situated in this comune, contrada as above.\n\nThe same informant bestowed on the child the name FRANCESCO.", "notas": ["Concuerda con el matrimonio de 1894, donde Francesco declara 23 años y haber nacido en Castrolibero, hijo de Michele y de Palermo Maria. Y con el acta 117 de 1896, donde consta con 25 años.", "La edad del padre baila entre actas: 42 en 1868, 48 en 1870, 40 en 1873. Michele era expósito y analfabeto: nunca supo su día de nacimiento y calculaba a ojo."], "imgs": [{"u": "../actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20Francesco%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%2039.jpg", "t": "Francesco Salerno (De Rango) - Castrolibero acta 39"}], "zooms": [{"u": "../actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20madre%20Maria%20Palermo%20y%20nombre%20impuesto.jpg", "t": "Madre Maria Palermo y nombre impuesto"}, {"u": "../actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1870%20-%20Francesco%20Salerno/1870-12-07%20N%20zoom%20-%20padre%20Michele%20De%20Rango%20esposito%20y%20testigos.jpg", "t": "Padre Michele De Rango esposito y testigos"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "1 de abril de 1894, 10:30 h", "lugar": "Rende", "ref": "acta 16", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Matrimoni» 1894"], ["Registro", "an_ua35985531 · hash 5BPDpKk"], ["Página", "9 de 36"]], "literal": "1° Salerno Francesco, di anni ventitré, celibe, nato in Castrolibero, residente in Rende, figlio di Michele, residente in Rende, e di Palermo Maria, residente in detto luogo;\n\n2° Chiappetta Filomena, di anni sedici, nubile, nata in Rende, residente in Rende, figlia di Giovanni, residente in Rende, e di Massei Angela, residente in Rende.\n\nAl presente matrimonio hanno dato il loro consenso Salerno Michele e Palermo Maria, genitori dello sposo, e Chiappetta Giovanni e Massei Angela, genitori della sposa.", "traduccion": "In the year eighteen hundred and ninety-four, on the first day of April, at half past ten in the morning, at the town hall of Rende, open to the public. Before me, Lo Celso Giuseppe, senior assessor standing in for the mayor being indisposed, Registrar of the Civil Status, in official dress, there appeared in person:\n\n1st SALERNO FRANCESCO, aged twenty-three, unmarried, born at Castrolibero, resident at Rende, son of Michele, resident at Rende, and of Palermo Maria, resident in the said place.\n\n2nd CHIAPPETTA FILOMENA, aged sixteen, unmarried, born at Rende, resident at Rende, daughter of Giovanni, resident at Rende, and of Massei Angela, resident at Rende.\n\nWho requested me to unite them in marriage. To that end they presented me with a single document, the certificate of the banns celebrated in this comune on Sundays the fourth and the eleventh of March of the current year.\n\nThe articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code having been read to the spouses, and each having answered in the affirmative, I pronounced in the name of the law that they are united in marriage.\n\nWitnesses: Rendano Alfonso, aged thirty-five, landholder; and Vercillo Salvatore, aged forty-five, farmer.\n\nTo the present marriage their consent was given by SALERNO MICHELE and PALERMO MARIA, the husband's parents, and CHIAPPETTA GIOVANNI and MASSEI ANGELA, the wife's parents.", "notas": ["El consentimiento de los padres no es una fórmula: el Código Civil lo exigía para los varones menores de veinticinco años, y Francesco tenía veintitrés. Michele y Maria Antonia tuvieron que comparecer en persona.", "Es el rastro más tardío que tenemos de Michele: el expósito del torno estaba vivo el 1 de abril de 1894, con unos 69 años, viendo casarse a su hijo. Su defunción es posterior a esa fecha.", "Los novios no firman «per essere analfabeti come hanno dichiarato». Firman los dos testigos y el oficial.", "Los processetti de 1894 NO existen: esa serie en Rende acaba en 1865, con el fondo de la Restauración. Y el propio acta dice que se presentó un solo documento."], "imgs": [{"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20Francesco%20Salerno%20y%20Filomena%20Chiappetta%20-%20Rende%20acta%2016.jpg", "t": "Francesco Salerno y Filomena Chiappetta - Rende acta 16"}], "zooms": [{"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20firmas.jpg", "t": "Firmas"}, {"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 4, "titulo": "He never knew his age", "parrafos": ["He was born on 7 December 1870 at six in the morning at Castrolibero, and his father registered him the next day at two in the afternoon, presenting himself as «Michele De Rango Esposito, forty-eight years old, day labourer». The contrada reads Feudo in some transcriptions and Sciolle in others; it is the same field where Arcangela had been born two years earlier and where Giovanni would be born in 1873.", "The ages he declared over his lifetime almost never add up. In February 1895, registering his first child, he said thirty: he was twenty-four. On marrying in April 1894 he had said twenty-four, when he was twenty-three. In November 1897 he said twenty-four again and was twenty-six. In May 1902 he said thirty and was thirty-one; in December 1907 he said thirty-eight on the very day he turned thirty-seven. He got it right twice: twenty-five in June 1896 and twenty-eight in October 1899. He was illiterate and signed none of those records.", "He married on 1 April 1894, at half past ten in the morning, to Filomena Chiappetta, aged sixteen. Both declared they could not write. They had nine documented children between 1895 and 1909, and the household moved with almost every one: contrada Saporito in 1895, S. Agostino in 1896, Saporito again in 1897, Campagnano in 1899 and 1902, S. Agostino from 1904. The trade wobbles on paper too — agricoltore, contadino, bracciante — though the work was always the same.", "On 24 September 1909 he went to register his daughter Maria and stayed on as a witness to the next record, that of his neighbour Benincasa: there appears a «Salerno Francesco, di anni trentotto, contadino», the same age and the same trade. That record was reported by a midwife because the husband «è in America». Ten years later his eldest sons would emigrate; he and Filomena stayed at Rende."], "claves": [["Trade", "agricoltore, contadino, bracciante — depending on the year"], ["Could sign", "no"], ["Married at", "23, though the record puts him at 24"], ["Documented children", "nine, between 1895 and 1909"], ["Contradas", "Saporito, S. Agostino, Campagnano — they moved often"]]}, "giovanni": {"id": "giovanni", "nombre": "Giovanni Salerno", "legal": "Giovanni De Rango", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["salerno"], "resumen": "The youngest. Born at Castrolibero in 1873, married at Rende in 1897 and dead at twenty-six, leaving a thirteen-month-old son.", "datos": [["Birth", "24 de enero de 1873, 14 h, Castrolibero — acta 8"], ["Place", "strada Sciolle"], ["Parents", "De Rango Michele Esposito y Palermo Maria"], ["Marriage", "17 de octubre de 1897, Rende — acta 36, con 24 años"], ["Spouse", "Vincenzina Morelli"], ["Son", "Salvatore, enero de 1899"], ["Death", "23 de febrero de 1900, Rende — acta 31, con 26 años"]], "mapa": null, "sinacta": "", "padre": "michele", "madre": "maria_antonia", "conyuge": "vincenzina", "hijos": ["salvatore"], "hermanos": ["domenico", "arcangela", "francesco"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "25 de enero de 1873, 11 h", "lugar": "Castrolibero", "ref": "acta 8", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 65 «Nati» 1873"], ["Registro", "an_ua35982620 · hash 5gZOXp1"], ["Página", "5 de 23"], ["Registrar", "Vina Silvestro (lectura dudosa), Sindaco"]], "literal": "De Rango Michele Esposito, di anni quaranta, di professione bracciale…\n…Palermo Maria, di professione filatrice…", "traduccion": "In the year eighteen hundred and seventy-three, on the twenty-fifth day of January, at eleven in the morning, at the town hall, before the mayor and Registrar of the Civil Status, there appeared DE RANGO MICHELE ESPOSITO, aged forty, by trade a day labourer, resident at Castrolibero.\n\nHe declares that of PALERMO MARIA, by trade a spinner, resident in the said comune, there was born on the twenty-fourth of January of the current year, at two in the afternoon, in his own dwelling, strada Sciolle, a child upon whom he bestows the name GIOVANNI.\n\nWitnesses: Calabria Alessandro, son of the late Vincenzo, aged thirty-nine; and Sollato Spoglia, son of the late Domenico, aged forty-six, both day labourers of Castrolibero.", "notas": ["El escribano escribió «un bambino di sesso femminile» pero impuso el nombre GIOVANNI, y el índice del margen dice «De Rango Giovanni di Michele». Es un lapsus de pluma: copió la fórmula del acta vecina, que sí era de niña. Es varón — se casa en 1897 y muere en 1900 como varón.", "La madre figura aquí como hilandera; en 1868 y 1870 era campesina."], "imgs": [{"u": "../actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20Giovanni%20Salerno%20%28De%20Rango%29%20-%20Castrolibero%20acta%208.jpg", "t": "Giovanni Salerno (De Rango) - Castrolibero acta 8"}], "zooms": [{"u": "../actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20cabecera%2C%20padre%20y%20testigos.jpg", "t": "Cabecera, padre y testigos"}, {"u": "../actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20madre%20Palermo%20Maria%20y%20nombre%20impuesto.jpg", "t": "Madre Palermo Maria y nombre impuesto"}, {"u": "../actas/1873%20-%20Giovanni%20Salerno/1873-01-24%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}, {"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "24 de febrero de 1900, 10:20 h", "lugar": "Rende", "ref": "acta 31", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 92 «Morti» 1900"], ["Registro", "an_ua35985579 · hash LNynZKy"], ["Página", "9 de 36"], ["Registrar", "Cifani Domenico, asesor decano"]], "literal": "Salerno Giovanni, di anni ventisei, contadino… figlio di Michele… e di Palermo Maria… marito di Morelli Vincenzina.", "traduccion": "In the year nineteen hundred, on the twenty-fourth day of February, at twenty past ten in the morning, at the town hall. Before the Registrar of the Civil Status there appeared Cacciaro Raffaele, aged twenty-nine, farmhand, and Stellato Andrea, aged forty-one, farmhand, both of Rende, who declared that yesterday, at ten past ten in the morning, in the house situated in contrada S. Agostino, there died SALERNO GIOVANNI, aged twenty-six, farmhand, resident at Rende, born at Rende, son of Michele, farmhand resident at Rende, and of PALERMO MARIA, countrywoman resident at Rende, husband of MORELLI VINCENZINA.\n\nWitnesses: De Rango Salvatore, aged thirty, farmhand; and Spizzirri Giovanni, aged forty-seven, farmhand.", "notas": ["El acta dice que nació en Rende, pero su partida es de Castrolibero y así lo declaró él mismo al casarse en 1897. El error es de los dos vecinos que fueron a declarar la muerte.", "Uno de los testigos es DE RANGO SALVATORE: el apellido de expósito de la familia seguía vivo en Rende en 1900.", "Murió a los dos años y cuatro meses de casarse, dejando un hijo de trece meses."], "imgs": [{"u": "../actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20Giovanni%20Salerno%20-%20Rende%20acta%2031.jpg", "t": "Giovanni Salerno - Rende acta 31"}], "zooms": [{"u": "../actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20zoom%20-%20cabecera%20y%20declarantes.jpg", "t": "Cabecera y declarantes"}, {"u": "../actas/1873%20-%20Giovanni%20Salerno/1900-02-23%20D%20zoom%20-%20padres%2C%20esposa%20y%20testigos.jpg", "t": "Padres, esposa y testigos"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "17 de octubre de 1897, 16 h", "lugar": "Rende", "ref": "acta 36", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Matrimoni» 1897"], ["Registro", "an_ua35985535 · hash wEVmEnd"], ["Página", "19 de 28"]], "literal": "Salerno Giovanni, di anni ventiquattro, celibe, nato in Castrolibero… figlio di Michele… e di Palermo Maria…", "traduccion": "In the year eighteen hundred and ninety-seven, on the seventeenth day of October, at four in the afternoon, at the town hall of Rende. There appeared:\n\n1st SALERNO GIOVANNI, aged twenty-four, unmarried, born at Castrolibero, resident at Rende, son of Michele, resident at Rende, and of Palermo Maria, resident at Rende.\n\n2nd MORELLI VINCENZINA, aged twenty-three, unmarried, born at Castrolibero, daughter of Antonio, resident at Rende, and of Vina Maria, resident at Rende.\n\nDocument presented: the certificate of the banns celebrated on Sundays the third and the tenth of October.\n\nWitnesses: Pellicori Antonio, aged thirty-two, café keeper; and Cianci Costantino, merchant.\n\nConsent was given by Salerno Michele and Palermo Maria, the husband's parents; and Morelli Antonio and Vina Maria, the wife's parents.", "notas": ["La edad (24) cuadra con su nacimiento el 24 de enero de 1873 en Castrolibero.", "Es la prueba del cambio de apellido: el mismo hombre inscrito como DE RANGO al nacer se casa como SALERNO.", "Sus padres seguían vivos en octubre de 1897 — tres años después de la boda de Francesco."], "imgs": [{"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20Giovanni%20Salerno%20y%20Vincenza%20Morelli%20-%20Rende%20acta%2036.jpg", "t": "Giovanni Salerno y Vincenza Morelli - Rende acta 36"}], "zooms": [{"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 2, "nImgs": 7, "titulo": "The clerk wrote «girl»", "parrafos": ["He was born on 24 January 1873 at two in the afternoon, on the strada Sciolle at Castrolibero, and was registered the following day at eleven in the morning. On the record the clerk wrote «un bambino di sesso femminile» — a girl — and then immediately gave the child the name GIOVANNI; the marginal heading says «De Rango Giovanni di Michele». It is a slip of the pen: he copied the wording from the neighbouring record, which really was a girl's. He was male, and everything that followed confirms it.", "He married on 17 October 1897, at four in the afternoon, to Vincenzina Morelli, aged twenty-three. Neither signed. That record is the hinge of the whole tree: the same man registered as DE RANGO at birth marries as SALERNO, with the same parents, Michele and Palermo Maria. Without it there would be no way to stitch the Castrolibero records to those of Rende.", "His son Salvatore was born on 12 January 1899. Giovanni died on 23 February 1900, at ten past ten in the morning, in the contrada S. Agostino, aged twenty-six: two years and four months after marrying, leaving a thirteen-month-old child. Two village farmhands went to report it, Cacciaro Raffaele, twenty-nine, and Stellato Andrea, forty-one.", "The record says he had been born at Rende. That is an error by the informants, who were neighbours and not family: his birth record is from Castrolibero, and he had said so himself on marrying three years earlier. One further detail from that record: one of the witnesses was called De Rango Salvatore. The family's foundling surname was still alive at Rende in 1900."], "claves": [["Birth", "24 January 1873, 2 p.m., strada Sciolle, Castrolibero"], ["The record says", "«di sesso femminile», and then gives him a boy's name"], ["Registered as", "De Rango Giovanni; he marries as Salerno"], ["Could sign", "no"], ["Death", "23 February 1900, aged 26, leaving a thirteen-month-old son"]]}, "filomena": {"id": "filomena", "nombre": "Filomena Chiappetta", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 7, "ramas": ["salerno"], "resumen": "Born at Rende in 1877. She married at sixteen. Mother of the nine documented children.", "datos": [["Birth", "11 de mayo de 1877, 9 h, Rende — acta 64"], ["Place", "contrada Soprano (lectura dudosa)"], ["Parents", "Chiappetta Giovanni, jornalero, y Massei Angela, campesina"], ["Marriage", "1 de abril de 1894, Rende — acta 16, con 16 años"], ["Spouse", "Francesco Salerno"], ["Trade", "«donna di casa» en 1895-1897; contadina desde 1899"]], "mapa": null, "sinacta": "", "padre": "giovanni_chiappetta", "madre": "angela_massei", "conyuge": "francesco", "hijos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "12 de mayo de 1877, 9 h", "lugar": "Rende", "ref": "acta 64", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 69 «Nati» 1877"], ["Registro", "an_ua35983847 · hash LmAmd1R"], ["Página", "31 de 94"], ["Registrar", "Martino Vincenzo, asesor decano"]], "literal": "Chiappetta Giovanni, di anni ventinove, di professione bracciale…\n…Massei Angela, contadina, sua moglie, seco lui convivente…", "traduccion": "In the year eighteen hundred and seventy-seven, on the twelfth day of May, at nine in the morning, at the town hall, before Martino Vincenzo, senior assessor for the mayor, there appeared CHIAPPETTA GIOVANNI, aged twenty-nine, by trade a day labourer, resident at Rende.\n\nHe declares that of MASSEI ANGELA, countrywoman, his wife living with him, there was born on the eleventh of the current month, at nine in the morning, in the house situated in contrada Soprano, a girl, upon whom he bestows the name FILOMENA.\n\nWitnesses: Raffaele Antonio, day labourer, aged thirty-four; and Molinaro Gaspare, day labourer, aged forty-two.", "notas": ["Su edad de 16 años en la boda de abril de 1894 confirma que este registro contiene efectivamente actas de 1877 y no de 1878 — comprobación necesaria, porque la datación del catálogo de Antenati no siempre coincide con el contenido."], "imgs": [{"u": "../actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20Filomena%20Chiappetta%20-%20Rende%20acta%2064.jpg", "t": "Filomena Chiappetta - Rende acta 64"}], "zooms": [{"u": "../actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1877%20-%20Filomena%20Chiappetta/1877-05-11%20N%20zoom%20-%20padres%20Giovanni%20Chiappetta%20y%20Angela%20Massei.jpg", "t": "Padres Giovanni Chiappetta y Angela Massei"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "1 de abril de 1894, 10:30 h", "lugar": "Rende", "ref": "acta 16", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 86 «Matrimoni» 1894"], ["Registro", "an_ua35985531 · hash 5BPDpKk"], ["Página", "9 de 36"]], "literal": "1° Salerno Francesco, di anni ventitré, celibe, nato in Castrolibero, residente in Rende, figlio di Michele, residente in Rende, e di Palermo Maria, residente in detto luogo;\n\n2° Chiappetta Filomena, di anni sedici, nubile, nata in Rende, residente in Rende, figlia di Giovanni, residente in Rende, e di Massei Angela, residente in Rende.\n\nAl presente matrimonio hanno dato il loro consenso Salerno Michele e Palermo Maria, genitori dello sposo, e Chiappetta Giovanni e Massei Angela, genitori della sposa.", "traduccion": "In the year eighteen hundred and ninety-four, on the first day of April, at half past ten in the morning, at the town hall of Rende, open to the public. Before me, Lo Celso Giuseppe, senior assessor standing in for the mayor being indisposed, Registrar of the Civil Status, in official dress, there appeared in person:\n\n1st SALERNO FRANCESCO, aged twenty-three, unmarried, born at Castrolibero, resident at Rende, son of Michele, resident at Rende, and of Palermo Maria, resident in the said place.\n\n2nd CHIAPPETTA FILOMENA, aged sixteen, unmarried, born at Rende, resident at Rende, daughter of Giovanni, resident at Rende, and of Massei Angela, resident at Rende.\n\nWho requested me to unite them in marriage. To that end they presented me with a single document, the certificate of the banns celebrated in this comune on Sundays the fourth and the eleventh of March of the current year.\n\nThe articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code having been read to the spouses, and each having answered in the affirmative, I pronounced in the name of the law that they are united in marriage.\n\nWitnesses: Rendano Alfonso, aged thirty-five, landholder; and Vercillo Salvatore, aged forty-five, farmer.\n\nTo the present marriage their consent was given by SALERNO MICHELE and PALERMO MARIA, the husband's parents, and CHIAPPETTA GIOVANNI and MASSEI ANGELA, the wife's parents.", "notas": ["El consentimiento de los padres no es una fórmula: el Código Civil lo exigía para los varones menores de veinticinco años, y Francesco tenía veintitrés. Michele y Maria Antonia tuvieron que comparecer en persona.", "Es el rastro más tardío que tenemos de Michele: el expósito del torno estaba vivo el 1 de abril de 1894, con unos 69 años, viendo casarse a su hijo. Su defunción es posterior a esa fecha.", "Los novios no firman «per essere analfabeti come hanno dichiarato». Firman los dos testigos y el oficial.", "Los processetti de 1894 NO existen: esa serie en Rende acaba en 1865, con el fondo de la Restauración. Y el propio acta dice que se presentó un solo documento."], "imgs": [{"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20Francesco%20Salerno%20y%20Filomena%20Chiappetta%20-%20Rende%20acta%2016.jpg", "t": "Francesco Salerno y Filomena Chiappetta - Rende acta 16"}], "zooms": [{"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20firmas.jpg", "t": "Firmas"}, {"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "../actas/1894%20-%20Matrimonio%20Francesco%20y%20Filomena/1894-04-01%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 3, "titulo": "Married at sixteen", "parrafos": ["She was born on 11 May 1877 at nine in the morning, in the contrada Soprano — an uncertain reading — at Rende. Her father, Giovanni Chiappetta, a twenty-nine-year-old day labourer, registered her at the same hour the next day, before the senior assessor Vincenzo Martino.", "She married on 1 April 1894 at sixteen. Her mother, Angela Massei, had married at fifteen. On the record all four parents appear to give consent, and neither the couple nor they sign: «per essere analfabeti come hanno dichiarato». The two witnesses signed — Rendano Alfonso, a thirty-five-year-old landholder, and Vercillo Salvatore, a forty-five-year-old farmer — and the registrar.", "Between 1895 and 1909 she had nine documented children: Giuseppe, Antonio, Umberto, the twins Settimo and Saverio, Angelina, Giovanni, Arturo and Maria. On the records she appears as «donna di casa» until 1897 and as contadina from 1899. In August 1910 she lost Angelina, aged eight; the death was reported not by her or her husband but by her father and her brother-in-law.", "Family memory speaks of fourteen children. The sweep of the Rende births from 1893 to 1910, complete year by year and with no gaps, gives nine to Filomena; the other Salernos with a father named Francesco who turn up in those years belong to three other women in the village. There may have been more children between 1911 and 1918, which is the stretch that is not digitised — but that, as things stand, is a hypothesis."], "claves": [["Birth", "11 May 1877, 9 a.m., Rende, record 64"], ["Married at", "16; her mother married at 15"], ["Could sign", "no"], ["Trade", "«donna di casa» until 1897; contadina from 1899"], ["Documented children", "nine"]]}, "vincenzina": {"id": "vincenzina", "nombre": "Vincenzina Morelli", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 7, "ramas": ["salerno"], "resumen": "Born at Castrolibero on 4 April 1874, on the Strada Marchesato, daughter of a day labourer and a spinner. She married Giovanni in 1897 and was widowed two and a half years later, with a thirteen-month-old son.", "datos": [["Birth", "4 de abril de 1874, 17 h, CASTROLIBERO, Strada Marchesato — acta 17"], ["Parents", "ANTONIO MORELLI, jornalero, 32 años, hijo de Paolo; y MARIA VINA, hilandera"], ["Marriage", "17 de octubre de 1897, Rende — acta 36, con 23 años"], ["Spouse", "Giovanni Salerno († 1900)"], ["Son", "Salvatore, enero de 1899"], ["Grafía", "«Vicenzina» en el cuerpo del acta; «Vincenzina» en el margen y en el índice anual"]], "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "giovanni", "hijos": ["salvatore"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "5 de abril de 1874, 9 h (el acta); nacida el 4 de abril a las 17 h", "lugar": "Castrolibero", "ref": "acta 17", "fuente": [["Fondo", "Stato civile italiano > Castrolibero > Registro 66 «Nati» 1874"], ["Registro", "hash del contenedor dam- : w6nGQNK (20 páginas)"], ["Página", "9 de 20 — folio 8 del libro"], ["Registrar", "Silvestro Vina, sindaco"], ["Año manuscrito", "«mille ottocento settantaquattro» — coincide con el catálogo"], ["Cómo se localizó", "«Indice annuale» del final del registro, página 20 de 20: fila «Morelli Vincenzina — 17»"]], "literal": "…è comparso MORELLI ANTONIO FIGLIO DI PAOLO di anni trentadue di professione bracciale domiciliato in questo comune… mi ha presentato una bambina di sesso femminile… e ha dichiarato che la stessa è nata dalla sua legittima moglie VINA MARIA di professione FILATRICE domiciliata in questo comune, nel giorno quattro del mese di aprile dell'anno corrente alle ore cinque pomeridiane nella casa di sua abitazione, sita in questo comune, STRADA MARCHESATO… il nome di VICENZINA.", "traduccion": "In the year eighteen hundred and seventy-four, on the fifth day of the month of April, at nine in the morning, at the town hall of CASTROLIBERO, district of Cosenza, province of Calabria Citra.\n\nBefore me, SILVESTRO VINA, mayor and registrar of the Civil Status of the aforesaid comune, there appeared ANTONIO MORELLI, SON OF PAOLO, AGED THIRTY-TWO, by trade a BRACCIALE (day labourer), resident in this comune.\n\nWho, in the presence of two witnesses chosen by him — RAFFAELE PINCENTE, son of the late Gaetano, aged forty-nine, and RAFFAELE COSTABILE, son of Pasquale, aged thirty-two, both day labourers resident in this comune — presented to me A GIRL of the female sex, as I ascertained with my own eyes.\n\nAnd he declared that the same was born of his lawful wife MARIA VINA, by trade a FILATRICE (spinner), resident in this comune, ON THE FOURTH DAY OF THE MONTH OF APRIL of the current year, AT FIVE IN THE AFTERNOON, in the house of their dwelling, situated in this comune, STRADA MARCHESATO.\n\nThe same informant bestowed on the girl the name VICENZINA.\n\nWhereof the present record was drawn up, entered in both registers; read to the informant and the witnesses, it was signed by me alone, since the informant and the witnesses stated that they COULD NOT WRITE.", "notas": ["Coincide con todo lo que se buscaba: los padres son exactamente los dos nombres que ella declaró en su boda de Rende de 1897 —Antonio Morelli y Maria Vina—, nació en Castrolibero, y el 17 de octubre de 1897 tenía veintitrés años cumplidos, que es la edad que declaró aquel día. Encaje perfecto, sin forzar nada.", "El acta añade un ascendiente nuevo de regalo: PAOLO MORELLI, padre de Antonio. El acta dice «figlio di Paolo», sin «fu», así que en abril de 1874 probablemente seguía vivo.", "El padre, Antonio Morelli, tenía treinta y dos años en abril de 1874: nació hacia 1842, y su acta habría que buscarla en los Nati de Castrolibero de esos años.", "OJO CON LA HOMONIMIA: el mismo índice de 1874 trae una MARCHESE VINCENZINA, acta 9, que no es ésta. Dos Vincenzinas del mismo año y del mismo pueblo, distinguibles sólo por el apellido.", "El apellido VINA es abundante en Castrolibero en 1874 —el índice trae cuatro Vina más— y el propio oficial del Estado Civil que firma el acta se llamaba Silvestro Vina.", "Nota de resolución: el escaneo original de esta página mide 5082 × 3984 píxeles, pero el servidor no entrega más de diez millones de píxeles por petición, de modo que la imagen de la página completa viene a 3570 × 2799. Los recortes de zoom SÍ están pedidos en coordenadas del original y a tamaño nativo: no están reescalados ni interpolados."], "imgs": [{"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20Vincenzina%20Morelli%20-%20Castrolibero%20acta%2017.jpg", "t": "Vincenzina Morelli - Castrolibero acta 17"}, {"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20indice%20anual%201874%20-%20Morelli%20Vincenzina%20acta%2017.jpg", "t": "Indice anual 1874 - Morelli Vincenzina acta 17"}], "zooms": [{"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20acta%2017%20completa.jpg", "t": "Acta 17 completa"}, {"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20linea%20del%20indice%20anual.jpg", "t": "Linea del indice anual"}, {"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20nombre%20impuesto%20Vincenzina.jpg", "t": "Nombre impuesto Vincenzina"}, {"u": "../actas/1874%20-%20Vincenzina%20Morelli/1874-04-04%20N%20zoom%20-%20padres%20Antonio%20Morelli%20y%20Maria%20Vina.jpg", "t": "Padres Antonio Morelli y Maria Vina"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "17 de octubre de 1897, 16 h", "lugar": "Rende", "ref": "acta 36", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 89 «Matrimoni» 1897"], ["Registro", "an_ua35985535 · hash wEVmEnd"], ["Página", "19 de 28"]], "literal": "Salerno Giovanni, di anni ventiquattro, celibe, nato in Castrolibero… figlio di Michele… e di Palermo Maria…", "traduccion": "In the year eighteen hundred and ninety-seven, on the seventeenth day of October, at four in the afternoon, at the town hall of Rende. There appeared:\n\n1st SALERNO GIOVANNI, aged twenty-four, unmarried, born at Castrolibero, resident at Rende, son of Michele, resident at Rende, and of Palermo Maria, resident at Rende.\n\n2nd MORELLI VINCENZINA, aged twenty-three, unmarried, born at Castrolibero, daughter of Antonio, resident at Rende, and of Vina Maria, resident at Rende.\n\nDocument presented: the certificate of the banns celebrated on Sundays the third and the tenth of October.\n\nWitnesses: Pellicori Antonio, aged thirty-two, café keeper; and Cianci Costantino, merchant.\n\nConsent was given by Salerno Michele and Palermo Maria, the husband's parents; and Morelli Antonio and Vina Maria, the wife's parents.", "notas": ["La edad (24) cuadra con su nacimiento el 24 de enero de 1873 en Castrolibero.", "Es la prueba del cambio de apellido: el mismo hombre inscrito como DE RANGO al nacer se casa como SALERNO.", "Sus padres seguían vivos en octubre de 1897 — tres años después de la boda de Francesco."], "imgs": [{"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20Giovanni%20Salerno%20y%20Vincenza%20Morelli%20-%20Rende%20acta%2036.jpg", "t": "Giovanni Salerno y Vincenza Morelli - Rende acta 36"}], "zooms": [{"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20novios%2C%20edades%20y%20padres.jpg", "t": "Novios, edades y padres"}, {"u": "../actas/1897%20-%20Matrimonio%20Giovanni%20y%20Vincenza/1897-10-17%20M%20zoom%20-%20testigos%20y%20consentimiento.jpg", "t": "Testigos y consentimiento"}]}], "nActas": 1, "nImgs": 6, "titulo": "Two and a half years of marriage", "parrafos": ["She was born at Castrolibero around 1874, daughter of Morelli Antonio and Vina Maria. Her birth record has not been located: everything known about her comes from two records belonging to other people.", "She married on 17 October 1897, at four in the afternoon, at the town hall of Rende, to Giovanni Salerno. She declared twenty-three years; he, twenty-four. The witnesses were not day labourers, as at almost every wedding in this family, but Pellicori Antonio, a thirty-two-year-old café keeper, and Cianci Costantino, a merchant. The couple did not sign.", "Her son Salvatore was born on 12 January 1899 at three in the morning. Thirteen months later, on 23 February 1900, her husband died aged twenty-six. She was widowed at about twenty-six, with a thirteen-month-old child. Of her life from then on nothing is recorded — except that the boy grew up: in October 1921 he married at Rende."], "claves": [["Born", "c. 1874 at Castrolibero"], ["Married at", "23"], ["Widowed in", "February 1900, with a thirteen-month-old son"], ["Records of her own", "none; she appears in the 1897 marriage and the 1900 death"]]}, "angela_pizzi": {"id": "angela_pizzi", "nombre": "Angela Pizzi", "legal": "ANGIOLINA Pizzi — el nombre que le impone el acta", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["faienza"], "resumen": "Born at Atessa on 12 February 1869, daughter of the stonemason Domenico Pizzi and the spinner Teresa Flocco. In 1892 she married NICOLA FAIENZA, and the note in the margin of her own birth record is what ties this branch to the Faienza surname.", "datos": [["Birth", "12 de febrero de 1869, a las «ocho horas italianas», ATESSA — acta 65"], ["Nombre en el acta", "ANGIOLINA. En la familia se la llama Angela"], ["Parents", "Domenico Pizzi fu Giuseppe, 39 años, muratore, del rione del Castello; y Teresa Flocco fu Pasquale, 35 años, filatrice"], ["Residencia al nacer", "Atessa, rione del CASTELLO"], ["Marriage", "con NICOLA FAIENZA — anotado al margen del acta: «nel 1892 al N. 101 sposò Nicola Faienza», anotación fechada el 26 de agosto de 1893"], ["Son", "Domenico Faienza (hacia 1899-1900), sin acta localizada todavía"], ["Death", "sin localizar"]], "mapa": null, "sinacta": "", "padre": "domenico_pizzi", "madre": "teresa_flocco", "conyuge": "nicola_faienza", "hijos": ["domenico_faienza"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "12 de febrero de 1869, 8 h «italianas»", "lugar": "Atessa (Chieti)", "ref": "acta 65", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1869, atti di nascita"], ["Registro", "hash del contenedor: LegbzDy"], ["Página", "31 de 228"], ["Colocación", "mitad de la plana izquierda; la nota marginal, en la columna de la izquierda"], ["Año manuscrito", "«mille ottocento sessantanove» — coincide con el catálogo"], ["Registrar", "Giuseppe Falcucci, sindaco y oficial del estado civil"], ["Cómo se localizó", "por el índice alfabético del final del registro (página 225 de 228), que da siete Pizzi: Nicola 17, ANGIOLINA 65, Amalia 81, Bambina 90, Filomena Giuditta 266, Filomena 280 y Rocco 312. Ninguna «Angela»"]], "literal": "Numero 65 — Angiolina Pizzi\nL'anno mille ottocento sessantanove, il giorno dodici del mese di Febbrajo, nella\nCasa Comunale di Atessa, alle ore sedici. Avanti di me Giuseppe Falcucci Sindaco,\ned uffiziale dello Stato civile del Comune di Atessa, Circondario di Vasto,\nProvincia di Chieti, è comparso DOMENICO PIZZI fu Giuseppe, d'anni trentanove,\nmuratore, domiciliato in Atessa nel rione del Castello, il quale mi ha presentato\nuna bambina di sesso femminile, che dichiara essergli nata il dì sopradetto, alle\nore otto italiane, da sua moglie TERESA FLOCCO fu Pasquale, d'anni trentacinque,\nfilatrice, seco lui domiciliata, alla quale figlia dichiara di dare il nome di\nANGIOLINA.\n[al margen] nel 1892 al N. 101 sposò Nicola Faienza — 26 agosto 93", "traduccion": "In the year eighteen hundred and sixty-nine, on the TWELFTH day of the month of FEBRUARY, at the Town Hall of Atessa, at SIXTEEN HOURS.\n\nBefore me, GIUSEPPE FALCUCCI, Mayor and registrar of the Civil Status of the comune of ATESSA, District of VASTO, Province of CHIETI, there appeared DOMENICO PIZZI, SON OF THE LATE GIUSEPPE, aged THIRTY-NINE, STONEMASON, resident at Atessa in the QUARTER OF THE CASTELLO.\n\nWho presented to me A GIRL of the female sex, whom he declares was born to him ON THE DAY AFORESAID, at EIGHT HOURS ITALIAN STYLE, OF HIS WIFE TERESA FLOCCO, DAUGHTER OF THE LATE PASQUALE, aged THIRTY-FIVE, SPINNER, resident with him; upon which daughter he declares he bestows the name ANGIOLINA.\n\nThe said declaration was made in the presence of FRANCESCO MARCUCCI (uncertain reading), son of the late Giuseppantonio, aged fifty, and of ALBERTO FARINA (uncertain reading), son of the late Domenico, aged thirty-six, farmhands resident at Atessa, witnesses chosen by the informant; to whom I read the present record, drawn up at the same time in both original registers, and signed by no one but me AND THE INFORMANT, the witnesses having stated that they could not write. — Domenico Pizzi. — The Registrar of the Civil Status, Giuseppe Falcucci.\n\nIN THE MARGIN, in another hand: «In 1892, under number 101, she married NICOLA FAIENZA» — a note dated 26 August 1893.", "notas": ["SE LLAMA ANGIOLINA, NO ANGELA. El acta le impone «Angiolina» y el índice del registro la recoge así. «Angela» es como la nombra la memoria familiar. Es la misma persona: lo prueban los padres.", "NACIÓ EL 12 DE FEBRERO, NO EL 17. El bloque familiar sin fuentes daba el 17 de febrero de 1869. El acta dice «il giorno DODICI del mese di Febbrajo» y que la niña nació «il dì sopradetto», ese mismo día. Cinco días de error, y son cinco días que confirman lo que ya se sabía de ese bloque: los datos están, pero no son fiables al detalle.", "LOS PADRES CUADRAN EXACTAMENTE. «Domenico Pizzi FU GIUSEPPE, muratore» y «Teresa Flocco FU PASQUALE, filatrice». Es la prueba que se buscaba, y de propina rescata dos abuelos: Giuseppe Pizzi y Pasquale Flocco, los dos ya muertos en febrero de 1869.", "LA NOTA AL MARGEN ES EL HALLAZGO GRANDE: «nel 1892 al N. 101 SPOSÒ NICOLA FAIENZA». La boda con el apellido Faienza deja de ser un dato de un árbol ajeno y pasa a estar escrita al margen de una partida original. Y dice dónde: la anotación está en el registro de ATESSA, con número de acta del propio municipio, así que el matrimonio se celebró EN ATESSA en 1892 (acta 101) y no en Paglieta.", "CONSECUENCIA INMEDIATA PARA BUSCAR A DOMENICO FAIENZA: si sus padres se casaron en Atessa en 1892 y la familia de ella es de Atessa de varias generaciones, el nacimiento del hijo hay que buscarlo en ATESSA, no en Paglieta. El índice de Paglieta 1899, que se ha leído entero, no tiene ni un Faienza.", "EL PADRE FIRMÓ. El formulario acaba «e non firmato che da me, E DAL DICHIARANTE, avendo asserito i testimoni di non saper scrivere», y debajo está la firma «Domenico Pizzi». Un albañil que sabe escribir en 1869, con dos testigos analfabetos al lado. En toda la rama calabresa de este árbol no hay una sola firma de un antepasado.", "«ORE OTTO ITALIANE»: el acta usa todavía la hora italiana, contada desde el atardecer. En Atessa, a mediados de febrero, ocho horas después de la puesta de sol son aproximadamente las dos de la madrugada."], "imgs": [{"u": "../actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20Angela%20Pizzi%20%28Angiolina%29%20-%20Atessa%20acta%2065.jpg", "t": "Angela Pizzi (Angiolina) - Atessa acta 65"}], "zooms": [{"u": "../actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20acta%2065%20completa.jpg", "t": "Acta 65 completa"}, {"u": "../actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20nota%20al%20margen%2C%20en%201892%20caso%20con%20Nicola%20Faienza.jpg", "t": "Nota al margen, en 1892 caso con Nicola Faienza"}, {"u": "../actas/1869%20-%20Angela%20Pizzi/1869-02-12%20N%20zoom%20-%20padre%20Domenico%20Pizzi%20fu%20Giuseppe%20muratore%20y%20madre%20Teresa%20Flocco%20fu%20Pasquale.jpg", "t": "Padre Domenico Pizzi fu Giuseppe muratore y madre Teresa Flocco fu Pasquale"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "29 de diciembre de 1892, 11:15", "lugar": "Atessa (Chieti)", "ref": "acta 101", "fuente": [["Archivo", "Archivio di Stato di Chieti"], ["Fondo", "Stato civile italiano > Atessa > 1892, atti di matrimonio"], ["Registro", "hash del contenedor: wWpoWmX — 138 páginas"], ["Página", "103 de 138"], ["Año manuscrito", "«mille ottocento novantadue» — coincide con el catálogo"], ["Registrar", "Francesco Falcucci, assessore municipale delegado por el sindaco «con atto del venticinque novembre milleottocentottantanove, debitamente approvato»"], ["Cómo se localizó", "el número de acta ya se sabía por la nota al margen del acta 65 de 1869. El índice alfabético va en las páginas 135 a 138 y el matrimonio más alto que indexa es el 104. La página 110 es la portada de la PARTE II, así que la parte I ocupa las páginas 1 a 109 a razón de una acta por imagen; un sondeo en la página 60 dio el acta 58, o sea acta = página − 2, y la 103 dio la 101 a la primera. Cuatro imágenes en total"]], "literal": "Numero 101 — Faienza Nicola / Angiolina Pizzi\n\nL'anno mille ottocento novantadue, addì ventinove di Dicembre, a ore\nantimeridiane undici e minuti quindici, nella Casa Comunale di Atessa, aperto al\npubblico. Avanti di me Francesco Falcucci Assessore Municipale delegato dal\nSindaco con atto del venticinque novembre milleottocentottantanove, debitamente\napprovato, Ufficiale dello Stato Civile, vestito in forma ufficiale, sono\npersonalmente comparsi:\n\n1. NICOLA FAIENZA, di anni ventitré, contadino, nato in Atessa, residente in\nAtessa, figlio di GIUSEPPE, contadino, residente in Atessa, e della fu MARIA\nSTANISCIA, residente in vita in Atessa;\n\n2. ANGIOLINA PIZZI, di anni ventitré, donna di casa, nata in Atessa, residente in\nAtessa, figlia del fu DOMENICO, residente in vita in Atessa, e di TERESA FLOCCO,\nresidente in Atessa…\n\n…A questo atto sono stati presenti: Luzio Iannone, di anni ventidue, scrivano, e\nEmidio Flocco, di anni cinquantasei, caffettiere, entrambi residenti in questo\nComune. Il documento presentato è il certificato delle pubblicazioni eseguite da\nme Uffiziale dello Stato Civile di Atessa, cioè la prima nel dì diciotto e la\nseconda nel dì venticinque volgente Dicembre. Al suddetto matrimonio ha prestato\nil consenso IL PADRE DELLO SPOSO, come risulta ed è spiegato dall'atto di\nrichiesta delle pubblicazioni. — (a) le parole interlineate «vita in» valgano per\nnon scritte. Letto il presente atto a tutti gl'intervenuti, gli sposi ed i\ntestimoni si sono meco sottoscritti.\n\nFaienza Nicola · Angiolina Pizzi · Luzio Iannone testimone · Emidio Flocco\ntestimone · L'Ufficiale dello Stato Civile, Francesco Falcucci", "traduccion": "In the year eighteen hundred and ninety-two, on the TWENTY-NINTH OF DECEMBER, at a QUARTER PAST ELEVEN in the morning, at the town hall of ATESSA, open to the public.\n\nBefore me, FRANCESCO FALCUCCI, municipal assessor delegated by the mayor by act of the twenty-fifth of November eighteen hundred and eighty-nine, duly approved, Registrar of the Civil Status, in official dress, there appeared in person:\n\n1st NICOLA FAIENZA, aged TWENTY-THREE, FARMHAND, BORN AT ATESSA, resident at Atessa, SON OF GIUSEPPE, farmhand, resident at Atessa, AND OF THE LATE MARIA STANISCIA, who in life resided at Atessa.\n\n2nd ANGIOLINA PIZZI, aged TWENTY-THREE, housewife, born at Atessa, resident at Atessa, DAUGHTER OF THE LATE DOMENICO, who in life resided at Atessa, AND OF TERESA FLOCCO, resident at Atessa.\n\nWho requested me to unite them in marriage. To that end they presented me with a single document; the articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code having been read to the spouses, and having asked the husband whether he wishes to take as his wife the ANGIOLINA PIZZI here present, and her whether she wishes to take as her husband the NICOLA FAIENZA here present, and each having answered in the affirmative, I pronounced in the name of the law that they are united in marriage.\n\nWitnesses: LUZIO IANNONE, aged twenty-two, CLERK, and EMIDIO FLOCCO, aged fifty-six, CAFÉ KEEPER, both resident in this comune.\n\nThe document presented is the certificate of the banns made by myself as Registrar of the Civil Status of Atessa, the first on the EIGHTEENTH and the second on the TWENTY-FIFTH of the current December.\n\nTo the said marriage consent was given by THE HUSBAND'S FATHER, as appears and is set out in the act requesting the banns.\n\n(a) The interlined words «vita in» are to be taken as not written.\n\nThe present record having been read to all present, the spouses and the witnesses signed it with me.", "notas": ["ERA EL CABO MÁS CORTO Y MÁS RENTABLE QUE HABÍA ABIERTO, Y HA PAGADO. De Nicola Faienza no se sabía nada en absoluto: ni la edad, ni el oficio, ni el pueblo, ni los padres. El acta da las cuatro cosas en un solo renglón.", "MATA LA PISTA DE PAGLIETA DEFINITIVAMENTE. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Ni el novio ni su padre eran de Paglieta. Aquel pueblo venía del bloque familiar sin fuentes, y con ésta van tres veces que ese bloque falla en una comprobación directa.", "AÑADE UNA GENERACIÓN DE FAIENZA: Giuseppe Faienza y Maria Staniscia, los padres del novio, que hasta hoy no existían en ningún papel. Él vivo en 1892, ella ya muerta.", "EL CONSENTIMIENTO PATERNO NO ES FÓRMULA. El Código Civil lo exigía a los varones menores de veinticinco años y Nicola tenía veintitrés, igual que le pasó a Francesco Salerno en Rende dos años después. Que conste por escrito es la prueba de que Giuseppe Faienza estaba vivo y a mano en diciembre de 1892.", "LOS DOS NOVIOS SABÍAN ESCRIBIR, y eso en estos registros es excepcional: la fórmula habitual de la época es «essendo i testimoni analfabeti». Aquí firman los cuatro. El padre de ella, Domenico Pizzi, también firmaba: lo hizo en 1869 al declarar el nacimiento de esta misma novia.", "CONFIRMA A LA NOVIA PUNTO POR PUNTO: veintitrés años (nació el 12 de febrero de 1869), hija del difunto Domenico (murió el 28 de septiembre de 1891) y de Teresa Flocco, que seguía viva. La corrección (a) al pie tacha el «in vita» que el escribano había interlineado sobre ella: no era una viuda más, estaba viva.", "CORRIGE UNA LECTURA ANTERIOR. La delegación del alcalde en Francesco Falcucci se anotó en la ficha del acta de 1891 como «24 de noviembre de 1889». Aquí se lee VENTICINQUE, y los nacimientos de Atessa de 1899 repiten «venticinque». Era el 25.", "SE LOCALIZÓ EN CUATRO IMÁGENES Y A LA PRIMERA en la última: el número lo daba la nota al margen de 1869, y la portada de la PARTE II en la página 110 dejaba la aritmética servida.", "LO QUE ABRE: la partida de nacimiento del propio Nicola, en los Nati de Atessa hacia 1869 —el mismo registro y casi el mismo año que el de su mujer—, y el matrimonio de sus padres, hacia 1865."], "imgs": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 1, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "nicola_faienza": {"id": "nicola_faienza", "nombre": "Nicola Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 7, "ramas": ["faienza"], "resumen": "A farmhand from Atessa, born around 1869. He married Angiolina Pizzi on 29 December 1892, record 101 of the Atessa register. Until August 2026 absolutely nothing was known about him; the marriage record says it all at once: where he was born, what he did and whose son he was.", "datos": [["Birth", "hacia 1869, ATESSA — el acta de matrimonio le da veintitrés años en diciembre de 1892 y lo declara «nato in Atessa». Su partida estaría en los Nati de Atessa de 1868-1870"], ["Trade", "CONTADINO (campesino)"], ["Residence", "ATESSA"], ["Parents", "GIUSEPPE FAIENZA, contadino de Atessa, vivo en 1892; y MARIA STANISCIA, ya difunta en 1892"], ["Marriage", "29 de diciembre de 1892, 11:15, casa comunal de Atessa — ACTA 101"], ["Spouse", "Angiolina (Angela) Pizzi, nacida en Atessa el 12 de febrero de 1869, de su misma edad"], ["Sabía escribir", "sí: firmó el acta de su boda de su puño, «Faienza Nicola», y su mujer también"], ["Son", "Domenico Faienza, emigrado a Argentina. Su partida sigue sin localizar: no está ni en Paglieta 1899 ni en Atessa 1899"]], "mapa": null, "sinacta": "RESUELTO EN AGOSTO DE 2026 CON EL ACTA 101 DE ATESSA, que está transcrita entera en la ficha del matrimonio. La cadena fue ésta: al margen de la partida de nacimiento de Angiolina Pizzi (Atessa, 1869, acta 65) una mano posterior anotó «nel 1892 al N. 101 sposò NICOLA FAIENZA», con fecha de 26 de agosto de 1893. Con el año, el número y el municipio se pidió el documento, y el documento contestó a todo.\n\nLO QUE DICE: que tenía VEINTITRÉS AÑOS —o sea que nació hacia 1869, el mismo año que su mujer—, que era CONTADINO, que había NACIDO EN ATESSA y vivía en Ates
