 CALLISTO WAS STILL CLERK IN 1864. Not only here: in that same register he signs as a witness for neighbours in records 24, 47, 48, 49, 52 and 53, always as «Celeri Callisto fu Desiderio, Segretario Comunale». The question of when he left office is bracketed: in July 1864 he was still in it.", "AND HIS CERTIFICATE OF BAPTISM TURNED UP, WITH A DETAIL WORTH HAVING. It is in the annexes to the births of 1864 (Register 63.5, page 124), and it says that he was born on 5 April at about eight in the morning and that **he was baptised the following day, the 6th** — not the same day, as his two elder brothers were. Baptising on the day was what was done when there was fear the child would not last; waiting suggests that this one was born stronger. It is a reading, not a fact. AND THE GODFATHER WAS HIS UNCLE BY MARRIAGE. «Compare VINCENTI DOTT. MATTEO fu Antonio, di COREGLIA» — the physician who had married LUISA VANNI, Enrichetta's sister, exactly a year earlier, in April 1863. A year later he holds his sister-in-law's son at the font. The godmother, CESIRA PIEROTTI daughter of Angelo, was the sister of Dario Pierotti, who signs as a witness in the family's civil records.\n\nTHE SIGNATORY AT THE TOWN HALL CHANGES. In January 1863 the registrar of the civil status was the mayor, Bertoli Barsotti Ranieri. From an act of 30 December 1863 he delegates to the physician, DOCTOR PIETRO ANDREINI — the same man who attended Tebaldo's birth."], "imgs": [{"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864%20I%20Indice%20de%20nacidos%20de%20Trassilico%201864%20-%20primera%20mitad.jpg", "t": "1864 I Indice de nacidos de Trassilico 1864 - primera mitad"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-05%20N%20Fe%20de%20bautismo%20de%20Dante%20Giuseppe%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Dante Giuseppe - parroquia de Trassilico"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-10%20N%20Acta%20de%20nacimiento%20-%20Trassilico%20acta%2025.jpg", "t": "Acta de nacimiento - Trassilico acta 25"}], "zooms": [{"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864%20I%20Indice%20zoom%2C%20los%20tres%20Celeri%20de%201864%20-%20Trassilico.jpg", "t": "1864 I Indice zoom, los tres Celeri de 1864 - Trassilico"}, {"u": "../actas/1864%20-%20Dante%20Giuseppe%20Celeri/1864-04-05%20N%20zoom%20-%20padrino%20el%20doctor%20Matteo%20Vincenti%20de%20Coreglia.jpg", "t": "Padrino el doctor Matteo Vincenti de Coreglia"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "angela_menghi": {"id": "angela_menghi", "nombre": "Angela Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "The mother of Callisto Celeri, and for weeks the most conspicuous gap in this branch. She surfaced on 27 August 2026, in a grandson's birth record.", "datos": [["Who this was", "wife of DESIDERIO CELERI and mother of CALLISTO — that is, the great-great-grandmother of Gonzalo's paternal grandfather"], ["Village", "TRASSILICO. The record says of her and of her husband «essi pure di Trassilico»"], ["Birth", "c. 1800 or earlier — her son Callisto was born around 1830"], ["Dead before", "18 November 1860, when the record calls her «la FU Angela Menghi»"], ["Where it comes from", "the birth record of her grandson GIUSEPPE TULLIO POLINICE CELERI — Trassilico, 18 November 1860, record 76: «figlio del fu DESIDERIO, e della fu ANGELA MENGHI»"]], "vida": "c.1800–<1860", "lug": "", "mapa": null, "sinacta": "She exists by four words: «della fu Angela Menghi». But those four words complete an entire generation: until now Desiderio Celeri was a widower without a wife and Callisto a man without a mother.\n\nMENGHI IS A VERY TRASSILICO SURNAME. In the village's death indexes there appear Menghi Luigi, Menghi Filippo, Menghi Pietro and Menghi Antonio: it is one of the families of the place, not a surname arrived from outside. That makes it probable that her birth and her wedding to Desiderio — c. 1825-1830 — are also in Trassilico. CORRECTION OF 29 AUGUST 2026, AND IT IS IMPORTANT. Below here I wrote that the civil registration of Trassilico begins in 1852 and that therefore everything of hers was parochial. That is false: there is an earlier civil registration, that of the Principality of Lucca, Napoleonic, and Trassilico is within it — with BIRTHS, MARRIAGES and DEATHS from 1808 to 1812, digitised and located. And Napoleonic records are the most detailed of all Italian civil registration: they give the hour, the trade and the age of the declarant, and both parents with their age. She was born c. 1800-1810. If she was born between 1808 and 1812, her birth record is there and names her parents — and that would close at a stroke the question of whether Luigi Menghi was her brother or her father. The five birth registers are identified and waiting for the image server to stop blocking.\n\nWhat remains true is the matter of her DEATH: between 1813 and 1851 there is no civil registration at all, and she died before 1860, so her death record is almost certainly parochial.\n\nBUT THEY WILL NOT BE ON ANTENATI. The civil registration of Trassilico begins in 1852 and she was already dead by 1860 without figuring in any of the eleven years swept, just like her husband. Both died before 1852 and their records are PAROCHIAL — SS. Pietro e Paolo of Trassilico, Diocese of Massa. THERE IS AN INDIRECT ROUTE TO HAVE HER NAMED AGAIN, AND IT IS OPEN. An Italian marriage record of those years names the four parents of the bride and groom. If we find another child of Angela's marrying in Trassilico, she appears written down again, and with luck with the names of her own parents beside it. On 29 August 2026 the first candidate came out: CELERI AGNESE, married in Trassilico on 9 May 1857 to LUIGI MARTINI, record no. 2 of that year. If the record calls her the daughter of the late Desiderio and of the late Angela Menghi, Agnese is a daughter of this woman and a sister of Callisto. It is unverified; it is resolved by reading a single page. The whole explanation is in the entry for DESIDERIO CELERI.", "padre": null, "madre": null, "conyuge": "desiderio_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["calisto_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_celeri": {"id": "giuseppe_celeri", "nombre": "Giuseppe Tullio Polinice Celeri", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Tebaldo's elder brother, born twenty months before him. No one knew he had existed until 27 August 2026.", "datos": [["Birth", "14 November 1860, at TRASSILICO. The civil record says AT ELEVEN IN THE MORNING; the priest's certificate of baptism says AT ONE IN THE MORNING"], ["Where", "in his parents' own house, at the place called «DAI BOTTEGAI»"], ["Baptism", "that same 14th, by the parish priest don DOMENICO GRANDI — the same priest who had married his parents in 1859 and who would baptise Tebaldo in 1862"], ["Registration", "18 November 1860, Comune di Trassilico, record 76. His own father reports it"], ["Parents", "CALLISTO CELERI, aged 30, town clerk, and ENRICHETTA VANNI, aged 26"], ["Witnesses", "Doctor MICHELE ANDREINI and ERMENEGILDO GALANTI, son of Felice"], ["The names", "GIUSEPPE, TULLIO and POLINICE. Polinice is POLYNEICES, the son of Oedipus who dies before the gates of Thebes"]], "vida": "b.1860", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": "calisto_celeri", "madre": "enrichetta_vanni", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 November 1860 the birth; 18 the record", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 76", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 51.3 «Nati» 1860"], ["Shelfmark", "ark:/12657/an_ua35853260 — hash 03QypyJ, 36 images; the record on page 30, the alphabetical index on pages 34 and 35"]], "literal": "", "traduccion": "Before me, the undersigned Mayor and Registrar of the Civil Status of the Comune of Trassilico in the Garfagnana, there appeared signor CELERI CALLISTO, aged thirty, by profession SECRETARY, born and resident at Trassilico, SON OF THE LATE DESIDERIO AND OF THE LATE ANGELA MENGHI, both likewise of Trassilico,\n\nwho, in the presence of signori ANDREINI DOCTOR MICHELE and ERMENEGILDO GALANTI son of Felice, known witnesses, both of Trassilico, declared that on the FOURTEENTH of November 1860, at ELEVEN in the morning, there was born to him, IN THE HOUSE OF HIS OWN DWELLING situated at Trassilico, in the place called DAI BOTTEGAI,\n\nof signora ENRICHETTA VANNI, aged twenty-six, born and resident at Trassilico, daughter of the late signor DOCTOR PIETRO VANNI and of signora LIVIA RIGHINI — the former born and resident at Trassilico, the latter BORN AT CASTELNUOVO and resident at Trassilico — his lawful consort,\n\na son of the male sex, upon whom were bestowed the names GIUSEPPE, TULLIO, POLINICE, as appears in the certificate of baptism conferred on him by the local parish priest don DOMENICO GRANDI on 14 November 1860, which is annexed.", "notas": ["TEBALDO HAD AN ELDER BROTHER, AND NOBODY KNEW IT. He was born twenty months before him, of the same father and the same mother, and he is the first documented child of the marriage of January 1859.", "CALLISTO'S MOTHER APPEARS: ANGELA MENGHI. She was the oldest unknown in this branch. With her, Desiderio Celeri ceases to be a widower without a wife and the generation of 1800 is complete on the Celeri side.", "LIVIA RIGHINI WAS ALIVE, AND SHE WAS NOT FROM TRASSILICO. The record names her «signora Livia Righini», without the «fu» that her husband does carry, and says that SHE WAS BORN IN CASTELNUOVO. It is the first time this family leaves the village.", "THE HOUSE WAS THEIR OWN: «in casa di sua abitazione», at the place called DAI BOTTEGAI. Two years later, Tebaldo would be born in the house of LUISA VANNI, at ALLA MAESTÀ — another spot in the same village.", "THE NAMES SAY WHO THEY WERE. Giuseppe, Tullio and POLINICE: Polynices, the son of Oedipus. In a village of a hundred households, the town clerk gives his first son the name of a character out of Greek tragedy. Two years later will come «Tebaldo Jacopo ARCHIMEDE». They were not country people.", "AND TODAY HIS CERTIFICATE OF BAPTISM TURNED UP, THE THIRD AND LAST OF THE BROTHERS. It is in the annexes to the births of 1860, page 18, and it is signed by the same parish priest DOMENICO GRANDI. It says: «I attest that on the 14th of the current month of 1860 I baptised GIUSEPPE, TULLIO, POLINICE, son of signor CALLISTO, of the late DESIDERIO CELERI, and of signora ENRICHETTA, of the late doctor PIETRO VANNI, both of Trassilico, lawful spouses; BORN THE SAME DAY AT ONE IN THE MORNING». AND THERE IS A CONTRADICTION HERE THAT CANNOT BE RESOLVED. The civil record — which Callisto himself, the town clerk, wrote — says he was born «at ELEVEN in the morning». The priest's certificate says «AT ONE IN THE MORNING». Ten hours' difference. There is no way of knowing which is the good one: both come from the same family. Both are noted.\n\nWhat does fit is the rest: to be born in the small hours and be baptised that same day is what was done when there was haste. Tebaldo too was baptised on the day of the birth; Dante, the following day.\n\nThis certificate, like Dante's, says only «del fu Desiderio»: it does NOT add the generation of DOMENICO CELERI. The only one of the three that goes up three generations is Tebaldo's. The priest did not always write the same thing.\n\nIT IS NOT KNOWN WHETHER HE LIVED. He does not die in the indexes of the dead for 1860, 1861 or 1865, which have been swept, so he survived at least those years. What comes after that is already Italian civil registration later than 1866, and that is not in Antenati."], "imgs": [{"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860%20I%20Indice%20de%20nacidos%20de%20Trassilico%201860%20-%20pagina%2034.jpg", "t": "1860 I Indice de nacidos de Trassilico 1860 - pagina 34"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-14%20N%20Fe%20de%20bautismo%20de%20Giuseppe%20Tullio%20Polinice%20-%20parroquia%20de%20Trassilico.jpg", "t": "Fe de bautismo de Giuseppe Tullio Polinice - parroquia de Trassilico"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento - Trassilico acta 76"}], "zooms": [{"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860%20I%20Indice%20de%20nacidos%20zoom%20Celeri%20-%20Trassilico%201860.jpg", "t": "1860 I Indice de nacidos zoom Celeri - Trassilico 1860"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20madre%20y%20casa%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom madre y casa - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20nombres%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom nombres - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20origen%20de%20Livia%20Righini%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom origen de Livia Righini - Trassilico acta 76"}, {"u": "../actas/1860%20-%20Giuseppe%20Tullio%20Polinice%20Celeri/1860-11-18%20N%20Acta%20de%20nacimiento%20zoom%20padres%20-%20Trassilico%20acta%2076.jpg", "t": "Acta de nacimiento zoom padres - Trassilico acta 76"}]}], "nActas": 1, "nImgs": 8, "titulo": "", "parrafos": [], "claves": []}, "luigi_menghi": {"id": "luigi_menghi", "nombre": "Luigi Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Head of the MENGHI family of Trassilico — the surname of Callisto's mother. He surfaced on 29 August 2026 at his son's second marriage. That he is a relative of Angela Menghi is likely, given the village and the generation, but it is NOT proven.", "datos": [["When he lived", "the generation of 1795-1805. HE WAS ALREADY DEAD BY 30 JANUARY 1859, when the marriage record of Callisto calls his son Pietro «son of the late Luigi». It used to be thought that he had died only before August 1864"], ["Wife", "MATTEA BONETTI, also deceased by 1864"], ["Documented children", "ANTONIO (day labourer, born c. 1827) and PIETRO (shoemaker)"], ["Where", "Trassilico"]], "vida": "", "lug": "", "mapa": null, "sinacta": "WHY THIS FAMILY MATTERS: ANGELA MENGHI, Callisto's mother and therefore a direct ancestor, was a Menghi of Trassilico. This is the only Menghi family of the village that we have been able to document, and its head is of the right generation.\n\nBUT THERE IS NOTHING THAT TIES IT. Angela had died before 1860 and Callisto was born c. 1831, so she was born c. 1805-1810. His son Antonio was born c. 1827. If Angela were Antonio's SISTER there would be twenty years between them: possible, but strained. It is more plausible that she was of Luigi's own generation — his sister, and therefore Antonio's aunt —, and that is not proven either.\n\nIT WOULD BE RESOLVED by Angela's certificate of baptism or her death record, both parochial and earlier than 1852. It has already been requested in the letter to the Archivio di Stato di Massa. 29 AUGUST 2026 — HIS SON PIETRO WAS A WITNESS AT CALLISTO'S WEDDING, AND THAT CHANGES TWO THINGS. It came out of crossing two records that had already been read. The marriage record of Callisto and Enrichetta, of 30 January 1859, gives two church witnesses: «PIETRO BONETTI, son of the late Antonio, and PIETRO MENGHI, SON OF THE LATE LUIGI». And from the record of the second marriage of his son Antonio it is known that Luigi and Mattea Bonetti had two children: Antonio the day labourer and PIETRO the shoemaker. It is the same man. THE FIRST THING GAINED IS A DATE: Luigi Menghi died before 30 January 1859, not merely before August 1864 as this entry used to say. Five and a half years earlier, and documented, not inferred. AND THE SECOND REINFORCES WHAT WAS ALREADY BEING SUSPECTED HERE. At an Italian church wedding the witnesses are close relatives or compadres, not just any neighbours. Callisto was orphaned of both father and mother, so his close relatives were hers, ANGELA MENGHI's. And he chooses precisely a MENGHI and a BONETTI — and Luigi's wife was a Bonetti. Both witnesses come out of the same Menghi-Bonetti marriage. If Luigi was Angela's brother, as suggested above, then Pietro Menghi was Callisto's first cousin — which is exactly the person one asks to be a witness. It remains unproven: the record does not state the relationship and Menghi was a common surname there. But the choice of the witnesses ceases to look like chance.\n\nIT WOULD BE CLOSED BY A DOCUMENT ALREADY LOCATED: his son Antonio married in 1864, and the file of annexes to the marriages of that year keeps the certificate of baptism of each spouse. If that certificate names Luigi's father, and that man turns out also to be Angela's father, it is proven. The register is identified and its hash saved; all that is missing is for the Antenati image server to stop blocking. AND THERE IS A THIRD SURNAME THAT TIES THE OTHER TWO: THE BONETTI. His wife was MATTEA BONETTI. And on ordering all the Bonetti of Trassilico this appears: BATTISTA BONETTI was married to a CELERI — Santa; he, head of the Menghi, married a BONETTI; and Jacopo/Paolo Celeri married MARIA CATERINA BONETTI, who was precisely the daughter of Battista Bonetti and Celeri Santa. The three surnames are braided together. And there is a thread that runs across sixty-four years. At Callisto's wedding, on 30 January 1859, the two church witnesses are his son PIETRO MENGHI and PIETRO BONETTI. And on 10 September 1923, when Enrichetta Vanni — Callisto's widow — dies at the age of eighty-eight, those who go to the town hall to declare it and to sign as witnesses are BONETTI ANGELO DI JACOPO, aged forty, and BONETTI JACOPO FU ANGELO, aged seventy-four: father and son. Her children were no longer there — Tebaldo had been more than twenty years in Argentina — and those who accompanied her to the end were the people of that house. It does not prove kinship: in a village of a hundred neighbours the declarant is usually a neighbour. But it is a constant and documented fact, not an impression. Related: [[antonio_menghi]].", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["antonio_menghi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "antonio_menghi": {"id": "antonio_menghi", "nombre": "Antonio Menghi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A day labourer of Trassilico. In twenty-six months he buried a child, a newborn and his wife, and married again. His story was pieced together from three separate registers.", "datos": [["Birth", "c. 1827. Note: in June 1862 he declares 33 years and in August 1864 he declares 37, when they should be 35 — two years of drift in twenty-six months. The ages in these registers are approximate"], ["Trade", "BRACCIANTE, day labourer"], ["Parents", "the late LUIGI MENGHI and the late MATTEA BONETTI"], ["Brother", "MENGHI PIETRO, CALZOLAJO (shoemaker), who stood witness for him"], ["First wife", "MARIA MENGHI — of the same surname —, dead on 17 May 1863"], ["His house", "at Trassilico, at the place called «ALLA FOCE»"], ["Second marriage", "13 August 1864 to MARIGLIANI OLIVA, aged 35, daughter of the late Isaia and of the living ANNA MORI, natives of MOLAZZANA. The wedding on the 20th of August"]], "vida": "b.c.1827", "lug": "", "mapa": null, "sinacta": "", "padre": "luigi_menghi", "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of a second marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "13 August 1864; boda the 20", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "records 21 and 28", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.6 «Matrimoni» 1864"], ["Shelfmark", "ark:/12657/an_ua35853349 — hash 5YmyeY3, 32 images; the record on page 15"]], "literal": "", "traduccion": "Year 1864, day 13 August. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear:\n\nMENGHI ANTONIO, aged thirty-seven, DAY LABOURER, WIDOWER, SON OF THE LATE LUIGI AND OF THE LATE MATTEA BONETTI, all born and resident at Trassilico;\n\nand MARIGLIANI OLIVA, aged thirty-five, without profession, daughter of the late Isaia and of the LIVING ANNA MORI, aged sixty, without profession, NATIVES OF MOLAZZANA and resident at Trassilico;\n\nwho, in the presence of DARIO PIEROTTI, son of Angelo, without profession, and of MENGHI PIETRO, SON OF THE LATE LUIGI, SHOEMAKER, witnesses of full age, declared that it is their intention to be joined in marriage, and handed me their birth certificates, together with the death certificates of the groom's parents and of the bride's father, and further the certificate of the previous marriage AND OF THE DEATH OF THE WIFE of the said Menghi.", "notas": ["IT GIVES THE PARENTS OF THE MENGHI FAMILY OF TRASSILICO: LUIGI MENGHI and MATTEA BONETTI. It is the generation that might connect with ANGELA MENGHI, Callisto's mother — see her file, where I explain why I do not take it as proven.", "AND IT CONFIRMS, THROUGH THE MARITAL STATUS GIVEN IN THE RECORD, A STORY I HAD BEEN READING IN PIECES. On 28 August I found in the index of the dead for 1863 that a MENGHI NEWBORN and a MENGHI MARIA died on the SAME DAY, and I wrote that they were probably mother and child dead in childbirth — marking it as a reading, not as a fact. This record says that Antonio is a WIDOWER and that he submits «the certificate of the previous marriage and of the death of his wife». The reading is confirmed.", "THE COMPLETE SEQUENCE, IN TWENTY-SIX MONTHS: June 1862, his son LUIGI dies in the house «alla Foce», and his wife María declares it. 17 May 1863, María and a newborn die on the same day. 13 August 1864, Antonio marries again.", "A DETAIL THAT FITS: the son who died in 1862 was called LUIGI, like his paternal grandfather. The Italian custom of naming the first son after the grandfather, once again.", "HIS BROTHER WAS A SHOEMAKER. Pietro Menghi, «calzolajo», signs as a witness: same patronymic «fu Luigi».", "THE BRIDE CAME FROM OUTSIDE: the parents of Oliva Marigliani were natives of MOLAZZANA, a neighbouring comune that had not appeared in this archive until now."], "imgs": [{"u": "../actas/1864%20-%20Los%20Menghi%20de%20Trassilico/1864-08-13%20M%20Segundas%20nupcias%20de%20Antonio%20Menghi%20-%20Trassilico%20acta%2021.jpg", "t": "Segundas nupcias de Antonio Menghi - Trassilico acta 21"}], "zooms": [{"u": "../actas/1864%20-%20Los%20Menghi%20de%20Trassilico/1864-08-13%20M%20zoom%20-%20VEDOVO%2C%20hijo%20del%20difunto%20LUIGI%20y%20de%20la%20difunta%20BONETTI%20MATTEA.jpg", "t": "VEDOVO, hijo del difunto LUIGI y de la difunta BONETTI MATTEA"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "pietro_celeri_1814": {"id": "pietro_celeri_1814", "nombre": "Pietro Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer of Trassilico, born around 1814. The NINTH Celeri father in the village, and the first to appear with his wife's name. He came out on 28 August 2026 of his daughter's marriage promise.", "datos": [["Birth", "c. 1814 — from the fifty years he declares in August 1864"], ["Trade", "AGRICOLTORE"], ["Wife", "ELISABETTA SANTI, born c. 1815"], ["Known daughter", "MARIA LEONILDA, married in August 1864 to Rocchi Celeste"], ["Where", "born and domiciled at Trassilico"], ["In August 1864", "he was ALIVE: he appeared in person to give his consent to his daughter's wedding"]], "vida": "b.c.1814", "lug": "", "mapa": null, "sinacta": "THE COMMISSION HAD EIGHT CELERI FATHERS IN TRASSILICO — Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolino, Carlo Agostino and Jacopo. PIETRO WAS NOT AMONG THEM: THERE ARE NINE. HE IS OF THE SAME YEAR-GROUP AS DESIDERIO, the great-grandfather: Pietro was born c. 1814, and Desiderio had Callisto c. 1831. They could be brothers. BUT THERE IS NOTHING THAT PROVES IT, and there is a reason of form: in marriage promises the parents who are ALIVE appear in person, so the record gives them no patronymic. We do not know whose son Pietro was. His death record would say — later than 1865 and therefore already outside Antenati. Related: [[elisabetta_santi]], [[leonilda_celeri]].", "padre": null, "madre": null, "conyuge": "elisabetta_santi", "unionLibre": false, "otrasParejas": [], "hijos": ["leonilda_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "elisabetta_santi": {"id": "elisabetta_santi", "nombre": "Elisabetta Santi", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 6, "ramas": [], "resumen": "Wife of Pietro Celeri. She was alive in August 1864 and appeared in person at her daughter's marriage promise.", "datos": [["Birth", "c. 1815 — from the forty-nine years she declares in August 1864"], ["Occupation", "«senza professione», like almost every woman in this collection"], ["Husband", "PIETRO CELERI, farmer"], ["Known daughter", "MARIA LEONILDA CELERI"], ["Could sign", "no: the record states that the declarant and the four parents «si sono dichiarati illetterati»"]], "vida": "b.c.1815", "lug": "", "mapa": null, "sinacta": "What is known of her is what a single line of her daughter's marriage promise says. Related: [[pietro_celeri_1814]].", "padre": null, "madre": null, "conyuge": "pietro_celeri_1814", "unionLibre": false, "otrasParejas": [], "hijos": ["leonilda_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "leonilda_celeri": {"id": "leonilda_celeri", "nombre": "Maria Leonilda Celeri", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 7, "ramas": [], "resumen": "She married at twenty, in August 1864, to the village blacksmith's son. Her marriage promise is what uncovered her parents.", "datos": [["Birth", "c. 1844 — from the twenty years she declares"], ["Parents", "PIETRO CELERI, farmer, aged 50, and ELISABETTA SANTI, aged 49"], ["Husband", "ROCCHI CELESTE, aged 30, farmer, son of MATTEO ROCCHI —a BLACKSMITH— and of MARIA DOMENICA BONETTI"], ["Promise of marriage", "8 August 1864, record 15, before Doctor Pietro Andreini"], ["Marriage", "17 August 1864, record 22"], ["Witness", "CALLISTO CELERI, the town clerk — ex officio, as in almost every record of the village"], ["His brother-in-law married the same day", "record 16, immediately below, is that of ROCCHI MASSIMILIANO, the groom's brother, to PIEROTTI ALBINA. The blacksmith's two sons were betrothed on the 8th and married on the 17th"]], "vida": "b.c.1844", "lug": "", "mapa": null, "sinacta": "", "padre": "pietro_celeri_1814", "madre": "elisabetta_santi", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "8 August 1864; boda the 17", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "records 15 and 22", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.6 «Matrimoni» 1864"], ["Shelfmark", "ark:/12657/an_ua35853349 — hash 5YmyeY3, 32 images; the record on page 12, the index on pages 30 and 31"]], "literal": "", "traduccion": "Year 1864, day 8 August. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear:\n\nROCCHI CELESTE, aged thirty, farmer, son of MATTEO, aged fifty-four, BLACKSMITH, and of MARIA DOMENICA BONETTI, aged fifty-six, without profession;\n\nand CELERI MARIA LEONILDA, aged TWENTY, without profession, DAUGHTER OF PIETRO, aged FIFTY, FARMER, and of ELISABETTA SANTI, aged forty-nine, without profession; all born and resident at Trassilico.\n\nWho, in the presence of DARIO PIEROTTI, son of Angelo, without profession, and of CELERI CALLISTO, SON OF THE LATE DESIDERIO, TOWN CLERK, witnesses of full age, both born and resident at Trassilico, declared that it is their intention to be joined in marriage; and their parents being present and having given their full consent, and there being besides no opposition whatever to the marriage, the certification prescribed by law is issued to them.", "notas": ["IT UNCOVERS A NINTH CELERI FATHER IN TRASSILICO: PIETRO. The list we had was of eight — Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolino, Carlo Agostino and Jacopo. And he is the first to appear with his wife's name: ELISABETTA SANTI.", "PIETRO IS OF THE SAME BIRTH COHORT AS DESIDERIO, the great-grandfather. They could be brothers, and then Leonilda would be Callisto's first cousin. THERE IS NOTHING TO PROVE IT. And there is a reason of form why this record cannot say so: in promises of marriage the LIVING parents appear in person, so they are given no patronymic.", "THE FOUR PARENTS WERE ALIVE AND PRESENT, giving their consent — and the five declarants «si sono dichiarati illetterati», they could not sign. Only the groom, the two witnesses and the officer sign.", "TWO BROTHERS MARRY ON THE SAME DAY. Record 16, immediately below, is that of ROCCHI MASSIMILIANO, aged 28, son of the same parents, with PIEROTTI ALBINA. The two sons of the blacksmith Matteo Rocchi made their promise on 8 August and married on the 17th.", "THE GROOM'S FATHER WAS A FABBRO, A BLACKSMITH. In this holding the artisan trades are a minority against the «agricoltori» and «braccianti»."], "imgs": [{"u": "../actas/1864%20-%20Maria%20Leonilda%20Celeri%20di%20Pietro/1864-08-08%20M%20Promesa%20de%20matrimonio%20de%20Maria%20Leonilda%20Celeri%20-%20Trassilico%20actas%2015%20y%2016.jpg", "t": "Promesa de matrimonio de Maria Leonilda Celeri - Trassilico actas 15 y 16"}], "zooms": [{"u": "../actas/1864%20-%20Maria%20Leonilda%20Celeri%20di%20Pietro/1864-08-08%20M%20zoom%20-%20hija%20de%20PIETRO%20CELERI%20y%20ELISABETTA%20SANTI.jpg", "t": "Hija de PIETRO CELERI y ELISABETTA SANTI"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "jacopo_celeri": {"id": "jacopo_celeri", "nombre": "Jacopo Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer of Trassilico, born around 1809. He surfaced on 28 August 2026 in his wife's death record — carrying a patronymic that may change everything: «FU GIO. DOMENICO».", "datos": [["Birth", "c. 1809 — from the fifty-three years he declares in May 1862"], ["Trade", "AGRICOLTORE, of Trassilico"], ["Father", "the late GIOVANNI DOMENICO CELERI"], ["Wife", "CATERINA BONETTI, seamstress, dead on 13 May 1862"], ["House", "at Trassilico, at the place called «DAI DRAGONI»"]], "vida": "b.c.1809", "lug": "", "mapa": null, "sinacta": "THERE IS A BIG POSSIBILITY HERE, AND I AM NOT GOING TO ACCEPT IT AS GOOD YET. Tebaldo's certificate of baptism says that Callisto was the son of Desiderio and the GRANDSON of a DOMENICO CELERI. If Jacopo's «Gio. Domenico» were that same man, JACOPO WOULD BE DESIDERIO'S BROTHER and therefore CALLISTO'S UNCLE BY BLOOD. The ages fit well: Jacopo was born c. 1809 and Desiderio had Callisto c. 1831.\n\nBUT «Domenico» and «Giovanni Domenico» may be the same man or two different ones, and both names are among the commonest in the village. To close it, a document is needed that names the two brothers together, or the death record of Jacopo himself, which would be later than 1865 and therefore no longer on Antenati but in the Archivio del Tribunale di Lucca. 29 AUGUST 2026 — JACOPO AND «PAOLO CELERI» ARE THE SAME MAN. No new document was needed: it came out of crossing two records that had already been read and filed.\n\nThe death record of his wife, of May 1862, describes him thus: «CELERI JACOPO, son of the late GIOVANNI DOMENICO, aged FIFTY-THREE», husband of CATERINA BONETTI, who died on 13 May, and with two witnesses resident in VALLICO SOPRA.\n\nThe marriage record of September 1863 describes another: «CELERI DESIDERIO, aged twenty-one, son of CELERI PAOLO, aged FIFTY-FOUR, and of the late BONETTI CATERINA, aged fifty-eight», a farmer and illiterate, and it is celebrated by the chaplain of VALICO SOPRA. Four coincidences and not one discrepancy: the same year of birth (1809, and the two ages fit month by month), the same wife with name and surname, the same hamlet and the same condition of illiterate farmer. And CELERI is a rare surname there — among the seventy-three births of Trassilico of 1862 there is ONE single Celeri. Two different men, both born in 1809, both married to a Caterina Bonetti who died before 1863 and both from Vallico Sopra, does not stand up. It is one man with two given names, which there was the normal thing: in this same village there are «Tebaldo Jacopo Archimede» and «Giuseppe Tullio Polinice». One scribe writes down the one and another writes down the other. With this, the NINE Celeri fathers of Trassilico are EIGHT. AND IT DRAGS SOMETHING MUCH BIGGER WITH IT. If Paolo is Jacopo, then Paolo is «fu Gio. Domenico» — and Paolo's son is DESIDERIO CELERI DI PAOLO, the one who emigrated to Santa Fe and whose family is identified there by four coincidences. That is: if that «Giovanni Domenico» is the «Domenico» of Tebaldo's certificate of baptism, the Celeri of Santa Fe is CALLISTO'S FIRST COUSIN. And that would at last explain something that had gone for days without explanation: why two Celeri families from a village of a hundred neighbours in the Garfagnana end up in the same Argentine city. It is not chance: it is the migratory chain of always, one cousin calling the other.\n\nThat last step is NOT proven and is not accepted as good: «Domenico» and «Giovanni Domenico» may be the same man or two. It would be closed by his own death record — he was alive in September 1863 and the death indexes of 1864 and 1865 are clean, so he died after 1865 and his record is in the Archivio del Tribunale di Lucca — or by the file of annexes to that wedding of 1863, which would keep the groom's certificate of baptism. AND LATER THE SAME DAY SOMETHING BETTER APPEARED: HIS OWN BIRTH RECORD MIGHT EXIST. The whole project took it for granted that in Trassilico there is no civil registration before 1852. It is false: the Napoleonic civil status of the Principality of Lucca exists, and Trassilico is within it, with births, marriages and deaths from 1808 to 1812. And the two records that describe him give his age by different routes: fifty-three years old in May 1862 and fifty-four in September 1863, which places him being born between mid-1808 and mid-1809 — precisely the first stretch of that fonds. A single record would close the biggest question of this branch. A Napoleonic birth record names the father AND THE MOTHER, both with their age. His would confirm whose son he was without depending on a loose patronymic, would give for the first time the name of the wife of Giovanni Domenico Celeri — today a total void — and, if that Giovanni Domenico is the Domenico of Tebaldo's certificate of baptism, would prove that he was Desiderio's brother and Callisto's uncle by blood, and that the Celeri of Santa Fe is Tebaldo's first cousin. The two registers that are needed — the births of 1808 and of 1809 — are already located. Related: [[caterina_bonetti]].", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "caterina_bonetti": {"id": "caterina_bonetti", "nombre": "Caterina Bonetti", "legal": "«Celeri Caterina» in the record, after her husband", "rol": "conyuge", "rolNombre": "Spouse", "gen": 6, "ramas": [], "resumen": "A seamstress of Trassilico, who died at home at eleven at night on 13 May 1862. Her death record is the one that uncovered her husband and her parents.", "datos": [["Trade", "SARTA, seamstress — and that is a rare thing to see: in this collection almost every woman is recorded as «without profession» or as «farm worker»"], ["Parents", "the late BONETTI BATTISTA and CELERI SANTA, farmers of Trassilico"], ["Husband", "JACOPO CELERI, son of the late Giovanni Domenico"], ["Death", "13 May 1862, at eleven at night, in her own house at Trassilico, at the place called «DAI DRAGONI». Her own husband reported it"], ["A detail of the village", "she was a CELERI on her mother's side AND she married a Celeri as well"]], "vida": "†1862", "lug": "", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "jacopo_celeri", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "13 May 1862, at eleven at night", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 35", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 55.4 «Morti» 1862"], ["Shelfmark", "ark:/12657/an_ua35853432 — hash 0A2x1jD, 28 images; the record on page 13, the index on pages 26 and 27"]], "literal": "", "traduccion": "Year 1862, day 16 May. Before me, RANIERI BERTOLI BARSOTTI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, there appear CELERI JACOPO, SON OF THE LATE GIOVANNI DOMENICO, aged fifty-three, and BONETTI FRANCESCO, son of the late Mariano, aged forty-eight, farmers of Trassilico, THE FIRST THE HUSBAND and the second a NEIGHBOUR of the deceased;\n\nwho, in the presence of AMBROGIO BARSOTTI, son of the late Lorenzo, aged fifty-nine, day labourer, and of STEFANO MANCINI, son of the late Giuseppe, aged fifty-two, stonemason, both resident at VALLICO SOPRA, declared to me that on the thirteenth of the said month, at eleven at night,\n\nCELERI CATERINA, SEAMSTRESS, WIFE OF THE INFORMANT CELERI, born at Trassilico of the late spouses BONETTI BATTISTA and CELERI SANTA, farmers of the same Trassilico, died in her own house, situated at Trassilico, in the place called DAI DRAGONI.", "notas": ["WHAT MAKES THIS RECORD VALUABLE IS NOT HER, IT IS HER HUSBAND. «CELERI JACOPO FU GIO. DOMENICO». The commission had Jacopo on the list of the eight Celeri fathers of Trassilico without knowing whose son he was. Now it is known, and the patronymic is precisely the one that might connect him with our branch — see his file, where I explain why I do NOT take it as proven.", "TWO MORE PEOPLE OF THE PREVIOUS GENERATION: BONETTI BATTISTA and CELERI SANTA, her parents, already dead in 1862.", "SHE WAS A SEAMSTRESS, and that is striking: in this whole holding the women appear as «senza professione» or «agricoltrice». A trade of her own, and with a name.", "HER HUSBAND DECLARED IT, with a neighbour as witness. She died at home, at eleven at night.", "A NEW PLACE-NAME: «DAI DRAGONI». It joins the other three that keep coming up in Trassilico — «dai Bottegai», «alla Maestà» and «la Piazza della Maestà»."], "imgs": [{"u": "../actas/1862%20-%20Caterina%20Bonetti%2C%20mujer%20de%20Jacopo%20Celeri/1862-05-13%20D%20Acta%20de%20defuncion%20de%20Caterina%20Bonetti%20-%20Trassilico%20acta%2035.jpg", "t": "Acta de defuncion de Caterina Bonetti - Trassilico acta 35"}], "zooms": [{"u": "../actas/1862%20-%20Caterina%20Bonetti%2C%20mujer%20de%20Jacopo%20Celeri/1862-05-13%20D%20zoom%20-%20CELERI%20JACOPO%20FU%20GIO%20DOMENICO%2C%20el%20marido.jpg", "t": "CELERI JACOPO FU GIO DOMENICO, el marido"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "giovanni_antonio_celeri": {"id": "giovanni_antonio_celeri", "nombre": "Giovanni Antonio Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Another Celeri patriarch of the Garfagnana, of the same generation as Domenico — Tebaldo's great-grandfather. He surfaced on 28 August 2026 in the death record of his son Francesco. Whether the two branches touch is unknown.", "datos": [["When he lived", "born c. 1770-1780. He was already dead by March 1864"], ["Wife", "MARIANGELA GIUSTI, also deceased by 1864"], ["Where they lived", "«Valliggiatto», a hamlet of the comune of Trassilico — the place name is MY READING of the hand and is not certain: it could be one of the Vallico"], ["Documented children", "FRANCESCO (c. 1802-1864, unmarried); MICHELE (dead before 1864, father of Antonio); and a daughter married to a MORONI, inferred because Moroni Pellegrino declares himself «brother-in-law» of Francesco and Francesco died unmarried"], ["Grandson alive in 1864", "CELERI ANTONIO, son of the late Michele, aged 33, farmer"]], "vida": "", "lug": "", "mapa": null, "sinacta": "THERE IS NOTHING THAT TIES HIM TO OUR BRANCH, and it is as well to say so plainly. It is a Celeri couple of the same generation as DOMENICO CELERI in the same municipality, and nothing more. Besides, they live in a different place: ours in the village of Trassilico, these in the hamlet. That CALLISTO signs as a witness of the record does not prove kinship either: he was the town clerk and signed ex officio on almost all of them. Related: [[francesco_celeri_1802]].", "padre": null, "madre": null, "conyuge": "mariangela_giusti", "unionLibre": false, "otrasParejas": [], "hijos": ["francesco_celeri_1802"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "mariangela_giusti": {"id": "mariangela_giusti", "nombre": "Mariangela Giusti", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": [], "resumen": "Wife of Giovanni Antonio Celeri. She is known only from her son's death record, which names her as already dead.", "datos": [["When he lived", "born c. 1770-1780; dead before March 1864"], ["Husband", "GIOVANNI ANTONIO CELERI"], ["The surname", "GIUSTI is among the commonest at Trassilico: in the index of the dead for 1864 there are five, and three more in that for 1863"]], "vida": "", "lug": "", "mapa": null, "sinacta": "A name and nothing more, which is the normal thing for a woman of that generation. Related: [[giovanni_antonio_celeri]].", "padre": null, "madre": null, "conyuge": "giovanni_antonio_celeri", "unionLibre": false, "otrasParejas": [], "hijos": ["francesco_celeri_1802"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francesco_celeri_1802": {"id": "francesco_celeri_1802", "nombre": "Francesco Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": [], "resumen": "A farmer, unmarried all his life, dead at sixty-two in his own house. His death record is the one that uncovered his parents and with them a whole Celeri branch.", "datos": [["Birth", "c. 1802 — from the sixty-two years the record declares"], ["Trade", "AGRICOLTORE"], ["Status", "NUBILE, unmarried. He died without marrying"], ["Parents", "the late CELERI GIOVANNI ANTONIO and the late GIUSTI MARIANGELA"], ["Death", "18 March 1864, at twelve noon, at his house in the place called «la Traffallina»"], ["Who reported it", "his nephew CELERI ANTONIO, son of the late Michele, aged 33, and his brother-in-law MORONI PELLEGRINO, aged 60"], ["Who signed as witness", "CALLISTO CELERI, the town clerk — ex officio, not by kinship"]], "vida": "c.1802–1864", "lug": "", "mapa": null, "sinacta": "", "padre": "giovanni_antonio_celeri", "madre": "mariangela_giusti", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "18 March 1864, at doce del mediodía", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "record 16", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 55.6 «Morti» 1864"], ["Shelfmark", "ark:/12657/an_ua35853434 — hash 5BxgVnQ, 34 images; the record on page 11, the index on pages 32 and 33"]], "literal": "", "traduccion": "Year 1864, day 20 March. Before me, doctor PIETRO ANDREINI, son of the late Carlo, Delegated Registrar of the Civil Status of the Comune of Trassilico, there appear CELERI ANTONIO, son of the late MICHELE, aged 33, farmer, and MORONI PELLEGRINO, son of the late Jacopo, aged 60, farmhand — THE FIRST A NEPHEW AND THE SECOND A BROTHER-IN-LAW of the deceased — both born and resident at Valliggiatto;\n\nwho, in the presence of PIEROTTI DARIO son of Angelo, without profession, and of CELERI CALLISTO, SON OF THE LATE DESIDERIO, TOWN CLERK, witnesses of full age, both born and resident at Trassilico, declared to me that on the 18th of the current month and year, at twelve noon,\n\nCELERI FRANCESCO, aged sixty-two, FARMER, UNMARRIED, SON OF THE LATE CELERI GIOVANNI ANTONIO AND OF THE LATE GIUSTI MARIANGELA, born and resident at Valliggiatto, died in the house of his own dwelling, situated at Valliggiatto, in the place called «la Traffallina».", "notas": ["IT OPENS UP AN ENTIRE CELERI BRANCH WE DID NOT KNOW OF. Out of a single record come four people: the parents GIOVANNI ANTONIO CELERI and MARIANGELA GIUSTI — the generation of 1770-80, the same level as Domenico Celeri — the brother MICHELE and the nephew ANTONIO.", "And a fifth, by inference: MORONI PELLEGRINO declares himself the **brother-in-law** of the dead man, but Francesco died UNMARRIED. A bachelor's brother-in-law can only be so by having married a sister of his. THEREFORE GIOVANNI ANTONIO ALSO HAD A DAUGHTER, MARRIED TO A MORONI. Her name is not known.", "HE DIED UNMARRIED AT SIXTY-TWO, at home, at midday. Those who declare it are not a son — he had none — but a nephew and a brother-in-law: the family he had left.", "WHAT IT DOES NOT PROVE. There is nothing that ties these Celeris to ours. They are two families of the same surname in the same municipality, and they live in different places. That CALLISTO signs as a witness does NOT mean kinship: he was the clerk and signed ex officio on almost every record in the village.", "A NOTE ON THE READING: the place-name I transcribe as «VALLIGGIATTO» is my reading of the hand and I do not take it as secure. It could be one of the VALLICO (Sopra or Sotto), hamlets of the same area that appear in other papers of this same holding."], "imgs": [{"u": "../actas/1864%20-%20Francesco%20Celeri%20di%20Giovanni%20Antonio/1864-03-18%20D%20Acta%20de%20defuncion%20de%20Francesco%20Celeri%20-%20Trassilico%20acta%2016.jpg", "t": "Acta de defuncion de Francesco Celeri - Trassilico acta 16"}], "zooms": [{"u": "../actas/1864%20-%20Francesco%20Celeri%20di%20Giovanni%20Antonio/1864-03-18%20D%20zoom%20-%20hijo%20del%20difunto%20Gio%20Antonio%20Celeri%20y%20de%20Giusti%20Mariangela.jpg", "t": "Hijo del difunto Gio Antonio Celeri y de Giusti Mariangela"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "desiderio_di_paolo": {"id": "desiderio_di_paolo", "nombre": "Desiderio Celeri di Paolo", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 7, "ramas": [], "resumen": "Another Celeri of Trassilico, a farmhand, who is almost certainly the Desiderio Celeri who appears in the city of Santa Fe in 1887 surrounded by surnames from his village. He is no close relative of Tebaldo, but he explains why Tebaldo ended up there.", "datos": [["Birth", "c. 1842, TRASSILICO — from the twenty-one years he declares on becoming betrothed in September 1863"], ["Trade", "CONTADINO, farmhand"], ["Parents", "CELERI PAOLO, aged fifty-four in 1863 —born c. 1809, a farmer and ILLITERATE— and the late BONETTI CATERINA, dead at fifty-eight"], ["Marriage", "the promise on 17 September 1863 (record 21), the church wedding on the 19th and the civil transcription on the 26th (record 23)"], ["Wife", "REBECHI ANGELA, aged eighteen, daughter of REBECHI GIOVANNI —farmer, aged forty— and of the late CAROLA FRATI, dead at thirty-two and born at VALDICASTELLO, in the Versilia"], ["Known son", "MASSIMILIANO PAOLO NARCISO, born on 27 June 1864 at eight in the morning, at the place «al Troviale» — nine months to the day after the wedding"], ["Who stood witness for him", "CALLISTO CELERI, the town clerk, at his son's registration"]], "vida": "b.c.1842", "lug": "TRASSILICO", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Promise of marriage", "tipo": "M", "tipoNombre": "Marriage", "fecha": "17 September 1863; boda the 19, transcripción the 26", "lugar": "Trassilico, Garfagnana, province of Massa", "ref": "records 21 and 23", "fuente": [["Archive", "Archivio di Stato di MASSA (archive 240)"], ["Collection", "Stato civile della Restaurazione > Trassilico > Registro 53.5 «Matrimoni» 1863, and Registro 51.7 «Nati» 1864"], ["Shelfmark", "ark:/12657/an_ua35853348 — hash 03QyKYJ; the record on page 14"]], "literal": "", "traduccion": "The year 1863, the 17th day of September. Before me, the undersigned BERTOLI BARSOTTI RANIERI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, there appeared CELERI DESIDERIO, aged TWENTY-ONE, son of CELERI PAOLO aged fifty-four and of the late BONETTI CATERINA aged fifty-eight; and REBECHI ANGELA, aged EIGHTEEN, daughter of REBECHI GIOVANNI aged forty and of the late CAROLA FRATI aged thirty-two, BORN AT VALDICASTELLO — the others all born at Trassilico and resident there, ALL BY TRADE FARMERS;\n\nwho, in the presence of the witnesses DON GIO. BATTISTA FORISCHI, aged fifty, and DON ANGELO GRAZIANI, aged fifty-six, the first parish priest and the second chaplain of Valico Sopra, declared that it is their intention to be joined in marriage, and handed me the authentic certificate of their birth and further the authentic certificates of the DEATH OF CATERINA BONETTI AND OF CAROLA FRATI, the mothers of the couple; and their parents here present having given their full consent...\n\nDesiderio Celeri and Giovanni Rebechi sign. CELERI PAOLO AND REBECHI ANGELA are EXCLUDED FROM SIGNING «perché detti si illetterati» — because they are illiterate.", "notas": ["HE IS, ALMOST CERTAINLY, THE DESIDERIO CELERI WHO APPEARS IN SANTA FE. The Argentine census of 1887 has in the city of Santa Fe a house with CELERI DESIDERIO aged 45, his wife REBEQUI ANGELA aged 42, his son PABLO aged 23 married to FRATTI INÉS, and a CARLI JOSÉ. Here: he born about 1842, she about 1845, and their son PAOLO born on 27 June 1864. Four correspondences and not one discrepancy — and even the daughter-in-law's surname, FRATTI, is that of Angela's mother.", "AND THAT EXPLAINS WHY TEBALDO ENDED UP IN SANTA FE. It was not by chance: there were people from Trassilico there. In that same city there are Rebechis who declare «Italy, TUSCANY», and the four surnames of that house — Celeri, Rebechi, Fratti and Carli — all appear in the Trassilico indexes.", "HE IS NOT CALLISTO'S BROTHER, and it is worth saying so because for a few hours it was thought he was. His father is PAOLO, alive in 1863; Callisto's father was DESIDERIO and had been dead since before 1852.", "TWO BRANCHES OF THE SAME SURNAME AND OF DIFFERENT STANDING. Paolo Celeri could not sign and was a farmer; Callisto Celeri was town clerk, a possidente, and his handwriting closes the village indexes. At the registration of Desiderio's son, in July 1864, it was Callisto who acted as witness.", "HE HAS A BROTHER, AND HIS NAME IS FRANCESCO. Record 23 — the one that transcribes the religious wedding — puts him down as a witness: «CELERI FRANCESCO DI PAOLO». Another son of the same Paolo.", "AND THE SAME REGISTER, TWO RECORDS FURTHER DOWN, UNCOVERS A NINTH CELERI FATHER. Record 24 marries CELERI DOMENICO, aged thirty-two, a countryman of VALICO SOTTO, son of the late VENANZIO CELERI — dead at sixty-four — and of the late MARIA ANGELI. With him there are now nine different Celeris appearing as fathers in Trassilico: Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolo, Carlo Agostino, Jacopo and Venanzio.", "AND THE GEOGRAPHY OF THE SURNAME CAN BE SEEN: the Celeris of Venanzio are from VALICO SOTTO; those of Paolo live in the village, at the place called «al Troviale»; ours, those of Desiderio, also in the village but «dai Bottegai» first and «nella Piazza della Maestà» afterwards. The surname is spread across every hamlet of the municipality.", "THE PRIEST IS ALWAYS THE SAME: DON DOMENICO GRANDI married Callisto and Enrichetta in 1859, baptised Tebaldo in 1862 and married this Desiderio in 1863. A single parish priest for the whole village.", "AND THE ALLEGATI TURNED UP, WITH THE TWO RECORDS INSIDE. The dossier is in Register 64.11, pages 40 to 42: «FASCICOLO N. 4 del mese di Settembre 1863 — Atto di Matrimonio N. 21 — Sposi Celeri Desiderio e Rebechi Angela — ALLEGATI N. 2». And the two annexes are verbatim extracts from the parish book of the dead:\n\n· «ON 13 APRIL 1859. CAROLINA, wife of Giovanni Rebechi and DAUGHTER OF FRANCESCO FRATI, dwelling in this parish, provided with all the comforts of our Holy Religion, died on the said day».\n· «1862, ON THE 13th DAY OF MAY. MARIA CATERINA, DAUGHTER OF THE LATE BATTISTA BONETTI and wife of CELERI PAOLO, died at eleven at night».\n\nTWO NEW FATHERS, of the generation of 1780-1800: **FRANCESCO FRATI** and **BATTISTA BONETTI**.\n\nAND A DETAIL THE PAPER GIVES AWAY WITHOUT MEANING TO: the certificate is issued «in carta libera attesa la POVERTÀ DEI RICHIEDENTI» — on unstamped paper, because the couple were poor. It fits with Paolo Celeri's being unable to sign and with all of them being «agricoltori». And it contrasts squarely with the dossier of Luisa Vanni's wedding, full of notaries, prefects and «possidenti».", "AND THE SAME BUNDLE HOLDS THE OTHER CELERI BRANCH OF THE VILLAGE, THAT OF VALICO SOTTO. The fascicle of act 24 — the wedding of CELERI DOMENICO with Maria Elisabetta Porta, on 1 October 1863 — carries two certificates from the parish priest of Valico Sotto:\n\n· «DOMENICO, son of VENANZIO CELERI and of MARIA ANGELI, was born on 16 APRIL 1831 at twelve midday and was baptised that same day».\n· «VENANZIO, SON OF THE LATE SIGNOR DOMENICO CELERI, and father of Domenico Celeri, passed from this life to a better one on 3 NOVEMBER 1858 AT THREE IN THE MORNING, at the age of SIXTY-FOUR YEARS». THAT BRINGS OUT THE OLDEST CELERI IN THE WHOLE TREE: A DOMENICO CELERI BORN ABOUT 1760-1775, father of Venanzio and grandfather of the groom, who bears his name. It is the third time we have seen the Italian custom of christening the grandson with the grandfather's name — like Pietro Vanni after the corporal Pietro, or Bartolomeo Alasia after Bartolomeo Allasia.\n\nAND IT CONFIRMS FOR THE FOURTH TIME that this register gives the AGE AT DEATH of dead parents: the civil record said «fu Celeri Venanzio di anni 64», and the parish record says exactly sixty-four.\n\nTHE ALLEGATI OF THIS WEDDING EXIST AND ARE CITED IN THE RECORD: the birth certificates of the couple and the death certificates of the two mothers. If the register of allegati for 1863 is digitised, there are two death records waiting there.", "29 AUGUST 2026 — IT IS NOW KNOWN WHICH DOCUMENT CLOSES THE QUESTION, WHERE IT IS AND ON WHICH PAGE. His father, PAOLO CELERI, has turned out to be the same man as JACOPO CELERI, who in a record of 1862 appears as «FU GIO. DOMENICO» (the whole explanation is in Jacopo's file). And Callisto is «del fu Desiderio DEL FU DOMENICO». If those two Domenicos are the same man, he is Callisto's first cousin, and that would explain at last why two Celeri families from a village of a hundred households end up in the same Argentine city.\n\nWhat would prove it lies in the parish priest's manner of writing. Of the three certificates of baptism of Callisto's children, two give only two generations, but Tebaldo's gives three: «figlio di Callisto del fu Desiderio DEL FU DOMENICO Celeri». That priest sometimes wrote as far up as the grandfather. And he had a son, PAOLO CELERI, born on 27 June 1864 and registered on 3 July, record 48 — the very one in which Callisto signs as a witness. That certificate of baptism is in the bundle of annexes for 1864, which is THE SAME one that was already opened to read that of Dante Giuseppe, and its identifier is already saved: it does not cost so much as one request. In reading that one the bundle was calibrated with three soundings — page 115 = record 32, page 121 = record 27, page 125 = record 24 — from which it can be seen that it runs backwards, at the rate of a quarter of a page more for each record fewer. Applying that, record 48 falls at about page 95, and it is enough to look from 90 to 100.\n\nIf it says there «figlio di Celeri Desiderio del fu Paolo del fu DOMENICO», it is proven. If it says another name, the two branches are separated — which is also useful. And if the priest wrote only two generations, one would have to go to the bundle of annexes of his own wedding of 1863, where his certificate of baptism would be. All that is missing is for the Antenati image server to stop blocking."], "imgs": [{"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20Acta%2021%2C%20promesa%20de%20Desiderio%20Celeri%20y%20Angela%20Rebechi%20-%20Trassilico.jpg", "t": "Acta 21, promesa de Desiderio Celeri y Angela Rebechi - Trassilico"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1864-07%20N%20Actas%2052%20y%2053%2C%20Callisto%20Celeri%20testigo%20como%20segretario%20comunale%20-%20Trassilico.jpg", "t": "Actas 52 y 53, Callisto Celeri testigo como segretario comunale - Trassilico"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1864-07-03%20N%20Acta%2048%2C%20Massimiliano%20Paolo%20Narciso%20de%20Desiderio%20di%20Paolo%20-%20Trassilico.jpg", "t": "Acta 48, Massimiliano Paolo Narciso de Desiderio di Paolo - Trassilico"}], "zooms": [{"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20zoom%20-%20la%20madre%20de%20el%2C%20fu%20Bonetti%20Caterina%2C%20y%20la%20novia%20Rebechi%20Angela.jpg", "t": "La madre de el, fu Bonetti Caterina, y la novia Rebechi Angela"}, {"u": "../actas/1861%20-%20Los%20otros%20Celeri%20de%20Trassilico/1863-09-17%20M%20zoom%20-%20los%20padres%20de%20ella%2C%20Rebechi%20Giovanni%20y%20fu%20Carola%20Frati%20de%20Valdicastello.jpg", "t": "Los padres de ella, Rebechi Giovanni y fu Carola Frati de Valdicastello"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "domenico_celeri_viejo": {"id": "domenico_celeri_viejo", "nombre": "Domenico Celeri", "legal": "«del fu Domenico Celeri» in Tebaldo's certificate of baptism", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Desiderio Celeri, and the oldest Celeri in the direct line. He surfaced on 28 August 2026, in the baptismal record of his great-grandson Tebaldo.", "datos": [["Who this was", "father of DESIDERIO CELERI, grandfather of Callisto and great-grandfather of Tebaldo"], ["Birth", "c. 1770-1780, if his son Desiderio was born around 1800-1805"], ["Dead before", "July 1862 — Tebaldo's certificate of baptism calls him «il fu Domenico Celeri». Probably much earlier"], ["Village", "TRASSILICO"], ["Where it comes from", "the certificate of baptism of TEBALDO CELERI, parish of Trassilico, 25 July 1862: «figlio di CALLISTO DEL FU DESIDERIO DEL FU DOMENICO CELERI»"]], "vida": "c.1770–<1862", "lug": "", "mapa": null, "sinacta": "He exists by five words — «del fu Desiderio del fu Domenico Celeri» — and with them the paternal line climbs one generation further, to people born c. 1770. WHERE IT APPEARED, AND WHY THE DETAIL MATTERS. The CIVIL birth record of Tebaldo, the town hall one, says only «Callisto fu Desiderio». The one that adds the grandfather is the CERTIFICATE OF BAPTISM written by the priest and filed as an annex to the dossier. That is the difference between the two papers: the official noted down the minimum, the parish priest knew the families and wrote two generations. AND IT MAY JOIN TWO OF THE NINE CELERI BRANCHES OF THE VILLAGE. In the dossier of another wedding there appeared «VENANZIO **del fu Sig. DOMENICO CELERI**», who died in 1858 at sixty-four, that is, born c. 1794. If that Domenico and this one are the same man, DESIDERIO AND VENANZIO WERE BROTHERS and the peasant branch of Valico Sotto is the same as this one. IT IS NOT PROVEN — Domenico is a common name — but they are two men of the same generation, from the same village and with a father of the same name. It is the first real lead for joining the Celeri branches, which until now were nine loose surnames.\n\nHOW IT WOULD BE PROVEN: the book of baptisms of Trassilico for 1794-1805, or the marriage record of Desiderio with Angela Menghi, c. 1825-1830. Both things are parochial and would have to be requested from the archive that holds those books. AND THE SAME DAY, LATER, THE PLACE APPEARED WHERE HIS WIFE'S NAME MIGHT BE. Of him we know that he existed and nothing more; of his wife, not even the name. The whole project took it for granted that before 1852 there was no civil registration in Trassilico and that only the parish books remained. It is false: the Napoleonic civil status of the Principality of Lucca exists, and Trassilico is within it, with births, marriages and deaths from 1808 to 1812. Forty-four years before the fonds we have been reading all day.\n\nHis son Desiderio was born c. 1800-1805, too early for those books. But any other son of his born between 1808 and 1812 would have a record there, and a Napoleonic birth record names the father AND THE MOTHER, both with their age. A single record of that kind would give the wife of Domenico Celeri, who today is a complete void. And the death books of those same years reach the generation born c. 1730-1770, that is, his own parents. AND ON ORDERING THE GENERATIONS PROPERLY, ON 29 AUGUST IN THE AFTERNOON, EVERYTHING POINTS TO HIS HAVING HAD AT LEAST THREE SONS. I had put the nine Celeri fathers of Trassilico into a single year-group, and that was wrong: he cannot be of the generation of 1800, because his son VENANZIO died in 1858 at sixty-four — a fact confirmed twice — and therefore was born in 1794. A man whose son is born in 1794 was born c. 1760-1775.\n\nPut that way, the three fit as brothers: VENANZIO in 1794, DESIDERIO c. 1802 and JACOPO/PAOLO in 1808-09. Fifteen years between the eldest and the youngest, which is the most normal thing in the world. And then ILARIO — his proven brother — would be Callisto's great-uncle, and Venanzio's son, that Domenico born on 16 April 1831 who bears his name, would be Callisto's first cousin: both born in the same year. The serious objection, and it must be stated: the branch of Venanzio and that of Paolo are POOR and Desiderio's is not. Venanzio's parish extracts are issued «in carta semplice attesa la povertà», and Paolo was an illiterate farmer; whereas Callisto is a possidente (man of property) and town clerk and marries the daughter of a lawyer. Three brothers with such different fates is possible — schooling and a good marriage raise a house in one generation — but it is the best argument against. And there is a test that can fail. The birth record of Jacopo/Paolo is in the Napoleonic fonds, and a record of that kind gives the AGE of the father. If it says that Domenico was between forty and forty-eight years old, the reconstruction fits; if it says thirty or sixty, it breaks and there would be two different Domenico Celeri. The two registers where it may be are already located. 29 AUGUST 2026 — THERE IS A SECOND CANDIDATE FOR A SON OF HIS, AND HE IS STRONGER THAN VENANZIO. Between 1852 and 1865 there appear in Trassilico NINE different men called Celeri who are fathers of someone, all of the same year-group — born c. 1795-1815 —: Desiderio, Nicolao, Domenico, Ilario, Antonio, Paolino, Carlo, Jacopo and Pietro. In a village of a hundred neighbours, nine heads of family with such a rare surname and of the same age are almost certainly brothers or cousins. The question of this entry is which of them are SONS OF HIS. And there is one who is called «FU GIO. DOMENICO»: JACOPO CELERI, born c. 1809, married to Caterina Bonetti. His record says that he was the son of a GIOVANNI DOMENICO CELERI. If that Giovanni Domenico is this Domenico, Jacopo is Desiderio's brother and Callisto's uncle by blood, and the ages fit without forcing anything. He is today the best candidate of the remaining eight, ahead of Domenico and Venanzio. It remains unproven.\n\nOF THE NINE, ONLY ONE RELATIONSHIP IS PROVEN: Domenico and Ilario are brothers, «fratelli Domenico e Ilario Celeri», by record 45 of the births of 1861, which describes the house that the two of them had in Valico Sotto. Everything else is indication. WHAT WOULD RESOLVE IT IS A SINGLE CLASS OF PAPER, AND IT IS WORTH UNDERSTANDING WHY. The death record of a SON names his father and his mother; that of ONE OF THEM would name HIS parents, which is what is needed. But they all appear already deceased between 1856 and 1865, so their deaths fall for the most part before 1852 — when civil registration starts — and are parochial. The route that is within reach are the MATRIMONI ALLEGATI: the files in which the parish priest filed the certificates of baptism copied from his own books, which is exactly what made this name appear in Tebaldo's certificate. The oldest file that exists, that of 1852, is already located and waiting.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["desiderio_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "desiderio_celeri": {"id": "desiderio_celeri", "nombre": "Desiderio Celeri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "The oldest Celeri known. Father of Callisto and great-grandfather of grandmother Elba. He surfaced on 27 August 2026, in three words of a record of 1862.", "datos": [["Birth", "c. 1800 or earlier — his son Callisto was thirty-one years old in 1862"], ["Village", "TRASSILICO, circondario of Garfagnana, then province of Massa"], ["Son", "CALLISTO CELERI, town clerk of Trassilico"], ["Dead before", "July 1862"], ["Name", "DESIDERIO. Rare even for the period, and for that reason easy to find"], ["Where it comes from", "the birth record of his grandson Tebaldo: «è comparso CELERI CALLISTO FU DESIDERIO» — Trassilico, 30 July 1862, record 52"]], "vida": "c.1800–<1862", "lug": "", "mapa": null, "sinacta": "He exists by three words: «fu Desiderio». The «fu» gives him as already dead in July 1862, and nothing more is known of him.\n\nWHERE TO LOOK FOR HIM, and it is within reach: the Archivio di Stato di MASSA has digitised on Antenati the registers of Trassilico of the Stato civile della Restaurazione — eighty-two in all, with births, marriages and deaths. His DEATH, earlier than 1862, ought to be there, and would name his own parents. Also his MARRIAGE, c. 1825-1830, which would give the same twice over.\n\nIf his son rose to be town clerk, it is probable that Desiderio was already someone with letters in a mountain village. That leaves a trace. AND NOW HE HAS ONLY TWO YEARS LEFT. Callisto's marriage record, of 4 February 1859, already calls him «fu Desiderio»: he was dead by then. And as of today the death indexes of Trassilico of 1854, 1855, 1856, 1857, 1858, 1859, 1860, 1861 and 1865 have been swept and are clean — in none of them does he appear. By elimination, DESIDERIO DIED IN 1852 OR IN 1853, which are the only two years of the fonds not read, OR BEFORE 1852, and then his record is parochial and not civil. AND ON 27 AUGUST 2026 THE CIVIL SEARCH WAS CLOSED. The death indexes of the ELEVEN years that exist have been read in full — 1852, 1853, 1854, 1855, 1856, 1857, 1858, 1859, 1860, 1861 and 1865 — and in none of them does he appear. Since the civil registration of Trassilico STARTS in 1852, the conclusion is unavoidable: DESIDERIO DIED BEFORE 1852, and his record is not civil but PAROCHIAL — SS. Pietro e Paolo of Trassilico, which since 1853 depends on the Diocese of MASSA. There is nothing more to look for on Antenati for this.\n\nTHERE IS ALSO AN OPEN QUESTION THAT MAY BE WORTH A GREAT DEAL. The death indexes are closed each January by a signature that reads «Celeri, Segretario Comunale». That of January 1856 could be Callisto's, who was twenty-five, or it could be DESIDERIO'S — and in that case the post would have passed from father to son, and Desiderio would still have been alive in 1856. That would clash with the sweep, so either the signature is Callisto's from the start, or Desiderio died outside Trassilico. It is not resolved. 29 AUGUST 2026 — ANOTHER CELERI WOMAN HAS APPEARED, AND SHE IS THE BEST LEAD THIS BRANCH HAS. If his death record is parochial and we cannot see it, a second route remains for bringing Desiderio out of the shadow: finding ANOTHER CHILD OF HIS marrying in Trassilico. The Italian marriage record of that period is obliged to name both parents of each spouse and to say whether they are living or have died; a brother or sister of Callisto marrying there would give us Desiderio and Angela by a second route and eleven years earlier than any paper we have today. That is why the marriage indexes of Trassilico earlier than 1859 are being read, one by one.\n\nAnd in the index of 1857 — read in full, twelve marriages, not one escapes — there is CELERI AGNESE, married on 9 May 1857 to LUIGI MARTINI. She is the first Celeri to appear in a marriage index earlier than 1859, after those of 1859 to 1865 had already been swept without a single one. A woman who marries in 1857 was typically born between 1832 and 1840: exactly Callisto's generation, who is of 1830.\n\nHer record is resolved by reading A SINGLE PAGE. Ordering by date the twelve marriages of that year, hers is the second: record no. 2 of 1857, in images 2 or 3 of the register (identifiers wjyjNA8 and wQm4KZ8, already saved). If it says «figlia del fu Desiderio Celeri e della fu Angela Menghi», Agnese is Callisto's sister and this entry changes from top to bottom. If it names another father, that serves too: then we shall know that in Trassilico there was MORE THAN ONE Celeri family, and by what name to tell them apart — which is exactly what is needed in order to stop attributing to Desiderio every Celeri that turns up. Nothing is proven yet.\n\nThe reading was left half done because Cloudflare blocked the Antenati image server just as the crop of the column of the record number was requested. Nothing was lost: the index was already downloaded and read, and the record number was deduced from the date without needing the image. AND ON 29 AUGUST, IN THE AFTERNOON, A SECOND ROUTE TO AGNESE OPENED THAT MAY GIVE MORE THAN THE FIRST. The civil record of a marriage names the parents of the bride and groom and stops there. But every wedding carried attached a file of annexes with the certificate of baptism of each spouse, written by the parish priest copying from his own books — and those sometimes climb one generation further: Tebaldo's is the one that gave DOMENICO CELERI, the grandfather, whom the civil record does not name. So Agnese's certificate of baptism could give her father AND her grandfather at one stroke. The file of annexes to the marriages of 1857 is already located and saved, and will cost no request when the image server returns. Inside there are, besides, the certificates of baptism of the twenty-four spouses of that year. AND THERE IS A THIRD ROUTE, OPENED THE SAME DAY, THAT COULD REACH FURTHER THAN THE OTHER TWO. A register of «allegati» — annexes — does not contain records: it contains the papers that the bride and groom had to hand in in order to be able to marry, and among them go the CERTIFICATES OF BAPTISM copied by the parish priest from the church books. That matters because the parish books are much older than the civil registration: the civil registration of Trassilico starts in 1852, but a certificate of baptism tucked into a marriage file may come copied from a book of 1820. It is the only chink through which Antenati lets one see papers earlier than 1852 — and it has already worked once: of the three certificates of baptism of Callisto's children, only Tebaldo's climbs as far as DOMENICO CELERI.\n\nThat series had been given up as impossible to calculate, because the identifiers do not follow the order of the years. On 29 August 2026 it broke: the identifiers do run out of order, yes, but the REGISTER NUMBERS are chronological, and that is enough. Register 64.8 is 1859 and 64.11 is 1863, both read; from that it follows that register 64.1 is that of 1852, that is, THE FIRST MARRIAGE FILE THAT EXISTS IN TRASSILICO. The spouses of 1852 were born c. 1825-1830 — the generation of Desiderio's children — and their certificates of baptism would be copied from books of those years. It is already located and saved; all that is missing is for the image server to stop blocking.\n\n(The year of 64.1 is deduction, not reading: the register's entry gives the number but not the year. It will be confirmed on opening it.)", "padre": "domenico_celeri_viejo", "madre": null, "conyuge": "angela_menghi", "unionLibre": false, "otrasParejas": [], "hijos": ["calisto_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}};
const GRADOS = ["", "Parents", "Grandparents", "Great-grandparents", "2× great-grandparents", "3× great-grandparents", "4× great-grandparents", "5× great-grandparents", "6× great-grandparents", "7× great-grandparents", "8× great-grandparents", "9× great-grandparents"];
const RAMAS = {"rivas": "Rivas", "salerno": "Salerno", "celeri": "Celeri", "faienza": "Faienza"};
const L = {"legal": "In the records: ", "vidaAyuda": "Years of birth and death. “c.” = estimated, not documented · “†1948” = died in 1948 · “†<1948” = already dead by 1948 · “†>1948” = still alive in 1948, so died later", "rama": "Branch", "hijoDe": "Child of", "casoCon": "Married", "parejaDe": "Partner of", "padreDe": "Parent of", "acta": "record", "actas": "records", "leidas": "read in the original", "literal": "What the manuscript says", "traduccion": "Translation", "notas": "What you need to know about this record", "sinActa": "No record obtained", "loQueSabemos": "What we know and where it comes from", "pantalla": "open full screen", "ampliar": "enlarge", "arbolFamiliar": "Family tree", "arbolDe": "%s family tree", "fFicha": "Profile", "fConyuge": "Spouse", "fHermanos": "Siblings", "fHijos": "Children", "zoomIn": "Zoom in", "zoomOut": "Zoom out", "zoomReset": "Reset zoom", "masGen": "One more generation", "menosGen": "One generation fewer"};
let foco = "gonzalo";
let prof = 10;
let escala = 1;   /* zoom visual; 1 = 100% */
let soloDir = false;

const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
/* Escapa y convierte las URLs sueltas en enlaces. */
function escEnl(t){
  t = String(t == null ? '' : t);
  let out = '', i = 0, mm;
  const re = /https?:[/][/][^\s)\]]+/g;
  while((mm = re.exec(t)) !== null){
    out += esc(t.slice(i, mm.index));
    const u = mm[0].replace(/[.,;]+$/, '');
    out += '<a class="ext" href="' + esc(u) + '" target="_blank" rel="noopener">ver en el mapa</a>';
    i = mm.index + u.length;
  }
  return out + esc(t.slice(i));
}

/* la línea directa del usuario, para pintarla distinta */
const DIRECTA = new Set();
(function marca(id){
  if(!id || !G[id] || DIRECTA.has(id)) return;
  DIRECTA.add(id);
  marca(G[id].padre); marca(G[id].madre);
})('gonzalo');

/* El encabezado va con la rama del foco: centrado en un Celeri pone
   «Árbol Celeri»; en un Faienza, «Árbol Faienza». Gonzalo, sus padres,
   sus hermanos y sus hijas están en varias ramas a la vez, y entonces
   pone «Árbol familiar» con el rótulo de las ramas al lado. */
function titulo(){
  const p = G[foco];
  const rr = (p && p.ramas) ? p.ramas : [];
  const t = rr.length === 1 ? L.arbolDe.replace('%s', RAMAS[rr[0]]) : L.arbolFamiliar;
  $('#tit').textContent = t;
  document.title = t;
  const rot = $('#rr');
  if(rr.length > 1){
    rot.textContent = rr.map(c => RAMAS[c]).join(' · ');
    rot.hidden = false;
  } else if(rr.length === 0){
    rot.textContent = 'sin rama asignada';
    rot.hidden = false;
  } else {
    rot.hidden = true;
  }
}

/* los años y el lugar vienen ya calculados desde Python (vidas.py). Antes se
   sacaban aqui buscando las etiquetas «Nacimiento» y «Defuncion» — en castellano,
   asi que en la pagina inglesa no salia nada— y ademas cogian el primer año del
   texto aunque fuera el de otra persona. */
function vida(p){ return p.vida || ''; }
function lugar(p){ return p.lug || ''; }

function tarjeta(id, esFoco){
  const p = G[id];
  if(!p) return '<div class="vacio">sin identificar</div>';
  const dir = DIRECTA.has(id);
  const sellos = ['N','M','D'].map(t => {
    const tiene = (p.actas||[]).some(a => a.tipo===t && a.imgs.length);
    return `<span class="s ${tiene?'':'falta'}">${t}</span>`;
  }).join('');
  const v = vida(p), l = lugar(p);
  return `<div class="card ${dir?'dir':''} ${esFoco?'foco':''}" data-id="${id}" role="button" tabindex="0">
      <button class="subir" data-foco="${id}" title="centrar el árbol aquí">⤢</button>
      <span class="nom">${esc(p.nombre)}</span>
      ${v?`<div class="vida" title="${esc(L.vidaAyuda)}">${esc(v)}</div>`:''}
      ${l?`<div class="lug">${esc(l)}</div>`:''}
      <div class="sellos">${sellos}</div>
    </div>`;
}

function nodo(id, nivel, esFoco){
  const p = G[id];
  const arriba = (nivel < prof && p) ? [p.padre, p.madre].filter(x => x || nivel===0) : [];
  const hay = arriba.some(Boolean);
  let h = `<div class="n" data-nivel="${nivel}">` + tarjeta(id, esFoco);
  if(hay){
    const vis = [p.padre, p.madre].filter(x => x && (!soloDir || DIRECTA.has(x)));
    if(vis.length){
      h += '<div class="up">' + vis.map(x => nodo(x, nivel+1, false)).join('') + '</div>';
    }
  }
  return h + '</div>';
}

let hist = [];

function irA(id, guardar=true){
  if(!G[id] || id === foco) return;
  if(guardar) hist.push(foco);
  foco = id;
  cierra();
  pinta();
  history.replaceState(null,'','#'+foco);
}
function atras(){
  if(!hist.length) return;
  foco = hist.pop();
  cierra(); pinta();
  history.replaceState(null,'','#'+foco);
}

/* ── descendientes: todo lo que cuelga por debajo del foco ── */
function bajada(id, nivel){
  const p = G[id];
  const hijos = (p ? p.hijos : []).filter(x => G[x]);
  let h = '<div class="dn"><div class="fila">' + tarjeta(id, nivel===0);
  if(hijos.length && nivel < 4){
    h += '<div class="kids">' + hijos.map(x => bajada(x, nivel+1)).join('') + '</div>';
  }
  return h + '</div></div>';
}

function pinta(){
  $('#raiz').innerHTML = nodo(foco, 0, true);
  const p = G[foco];
  const tieneHijos = p && p.hijos.filter(x => G[x]).length;
  $('#abajo').innerHTML = tieneHijos
