LOOSE END THAT HAD BEEN OPENED, AND IT HAS PAID OFF. Of Nicola Faienza absolutely nothing was known: not the age, nor the trade, nor the village, nor the parents. The record gives all four things in a single line.", "IT KILLS THE PAGLIETA LEAD DEFINITIVELY. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Neither the bridegroom nor his father were from Paglieta. That village came from the family block without sources, and with this one that block has failed a direct check three times.", "IT ADDS A GENERATION OF FAIENZA: Giuseppe Faienza and Maria Staniscia, the bridegroom's parents, who until today existed on no paper. He alive in 1892, she already dead.", "THE PATERNAL CONSENT IS NOT A FORMALITY. The Civil Code required it of males under twenty-five and Nicola was twenty-three, just as happened to Francesco Salerno in Rende two years later. That it is set down in writing is the proof that Giuseppe Faienza was alive and at hand in December 1892.", "BOTH BRIDE AND GROOM COULD WRITE, and in these registers that is exceptional: the usual formula of the period is «essendo i testimoni analfabeti». Here all four sign. Her father, Domenico Pizzi, also signed: he did so in 1869 when reporting the birth of this same bride.", "IT CONFIRMS THE BRIDE POINT BY POINT: twenty-three years old (she was born on 12 February 1869), daughter of the late Domenico (he died on 28 September 1891) and of Teresa Flocco, who was still alive. The correction (a) at the foot strikes out the «in vita» that the clerk had interlined above her: she was not one more widow, she was alive.", "IT CORRECTS AN EARLIER READING. The mayor's delegation to Francesco Falcucci was noted on the page of the 1891 record as «24 November 1889». Here it reads VENTICINQUE, and the Atessa births of 1899 repeat «venticinque». It was the 25th.", "IT WAS LOCATED IN FOUR IMAGES AND AT THE FIRST ATTEMPT IN THE LAST ONE: the number was given by the marginal note of 1869, and the title page of PART II on page 110 left the arithmetic ready-made.", "WHAT IT OPENS: the birth certificate of Nicola himself, in the Nati of Atessa c. 1869 —the same register and almost the same year as his wife's—, and the marriage of his parents, c. 1865."], "imgs": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 1, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "nicola_faienza": {"id": "nicola_faienza", "nombre": "Nicola Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 7, "ramas": ["faienza"], "resumen": "A farmhand from Atessa, born around 1869. He married Angiolina Pizzi on 29 December 1892, record 101 of the Atessa register. Until August 2026 absolutely nothing was known about him; the marriage record says it all at once: where he was born, what he did and whose son he was.", "datos": [["Birth", "c. 1869, ATESSA — the marriage record gives him twenty-three years in December 1892 and declares him «nato in Atessa». His certificate would be in the Nati of Atessa for 1868-1870"], ["Trade", "CONTADINO (farmhand)"], ["Residence", "ATESSA"], ["Parents", "GIUSEPPE FAIENZA, contadino of Atessa, alive in 1892; and MARIA STANISCIA, already deceased in 1892"], ["Marriage", "29 December 1892, 11:15, town hall of Atessa — RECORD 101"], ["Spouse", "Angiolina (Angela) Pizzi, born at Atessa on 12 February 1869, of the same age as himself"], ["Could write", "yes: he signed his marriage record in his own hand, «Faienza Nicola», and his wife did so too"], ["Son", "Domenico Faienza, who emigrated to Argentina. His certificate is still not located: it is neither in Paglieta 1899 nor in Atessa 1899"]], "vida": "b.c.1869", "lug": "ATESSA", "mapa": null, "sinacta": "SETTLED IN AUGUST 2026 WITH RECORD 101 OF ATESSA, which is transcribed in full in the file of the marriage. The chain ran thus: in the margin of the birth record of Angiolina Pizzi (Atessa, 1869, record 65) a later hand noted «nel 1892 al N. 101 sposò NICOLA FAIENZA», dated 26 August 1893. With the year, the number and the comune the document was requested, and the document answered everything.\n\nWHAT IT SAYS: that he was TWENTY-THREE YEARS OLD —that is, that he was born c. 1869, the same year as his wife—, that he was a CONTADINO (farmhand), that he had been BORN IN ATESSA and lived in Atessa, and that he was the son of GIUSEPPE FAIENZA, contadino of Atessa and then living, and of the late MARIA STANISCIA. As he was not yet twenty-five, the Civil Code required his father's consent, and the record puts it on record: «ha prestato il consenso il padre dello sposo». That formality is, incidentally, the proof that Giuseppe Faienza was alive and traceable in Atessa in December 1892.\n\nAND WHAT IT KNOCKS DOWN: the PAGLIETA lead, definitively. Nicola was not from Paglieta nor from anywhere else: he was from Atessa, like his father and like his wife. That lead came from the same block of family information without a single citation which had gone wrong before, and with this one it has now been proved wrong three times.\n\nWHAT IS MISSING: his own birth record, in the Nati of Atessa around 1869, and that of his son Domenico, which is not in Atessa 1899 —the annual index has been read in full— and will have to be looked for in 1900.", "padre": "giuseppe_faienza", "madre": "maria_staniscia", "conyuge": "angela_pizzi", "unionLibre": false, "otrasParejas": [], "hijos": ["domenico_faienza"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "29 December 1892, 11:15", "lugar": "Atessa (Chieti)", "ref": "record 101", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile italiano > Atessa > 1892, atti di matrimonio"], ["Register", "container hash: wWpoWmX — 138 pages"], ["Page", "103 of 138"], ["Handwritten year", "«mille ottocento novantadue» — agrees with the catalogue"], ["Registrar", "Francesco Falcucci, assessore municipale delegated by the sindaco «con atto del venticinque novembre milleottocentottantanove, debitamente approvato»"], ["How it was located", "the record number was already known from the marginal note on record 65 of 1869. The alphabetical index runs over pages 135 to 138 and the highest marriage it indexes is 104. Page 110 is the title page of PART II, so part I occupies pages 1 to 109 at the rate of one record per image; a probe on page 60 gave record 58, that is, record = page − 2, and page 103 gave record 101 at the first try. Four images in all"]], "literal": "Numero 101 — Faienza Nicola / Angiolina Pizzi\n\nL'anno mille ottocento novantadue, addì ventinove di Dicembre, a ore\nantimeridiane undici e minuti quindici, nella Casa Comunale di Atessa, aperto al\npubblico. Avanti di me Francesco Falcucci Assessore Municipale delegato dal\nSindaco con atto del venticinque novembre milleottocentottantanove, debitamente\napprovato, Ufficiale dello Stato Civile, vestito in forma ufficiale, sono\npersonalmente comparsi:\n\n1. NICOLA FAIENZA, di anni ventitré, contadino, nato in Atessa, residente in\nAtessa, figlio di GIUSEPPE, contadino, residente in Atessa, e della fu MARIA\nSTANISCIA, residente in vita in Atessa;\n\n2. ANGIOLINA PIZZI, di anni ventitré, donna di casa, nata in Atessa, residente in\nAtessa, figlia del fu DOMENICO, residente in vita in Atessa, e di TERESA FLOCCO,\nresidente in Atessa…\n\n…A questo atto sono stati presenti: Luzio Iannone, di anni ventidue, scrivano, e\nEmidio Flocco, di anni cinquantasei, caffettiere, entrambi residenti in questo\nComune. Il documento presentato è il certificato delle pubblicazioni eseguite da\nme Uffiziale dello Stato Civile di Atessa, cioè la prima nel dì diciotto e la\nseconda nel dì venticinque volgente Dicembre. Al suddetto matrimonio ha prestato\nil consenso IL PADRE DELLO SPOSO, come risulta ed è spiegato dall'atto di\nrichiesta delle pubblicazioni. — (a) le parole interlineate «vita in» valgano per\nnon scritte. Letto il presente atto a tutti gl'intervenuti, gli sposi ed i\ntestimoni si sono meco sottoscritti.\n\nFaienza Nicola · Angiolina Pizzi · Luzio Iannone testimone · Emidio Flocco\ntestimone · L'Ufficiale dello Stato Civile, Francesco Falcucci", "traduccion": "In the year eighteen hundred and ninety-two, on the TWENTY-NINTH OF DECEMBER, at a QUARTER PAST ELEVEN in the morning, at the town hall of ATESSA, open to the public.\n\nBefore me, FRANCESCO FALCUCCI, municipal assessor delegated by the mayor by act of the twenty-fifth of November eighteen hundred and eighty-nine, duly approved, Registrar of the Civil Status, in official dress, there appeared in person:\n\n1st NICOLA FAIENZA, aged TWENTY-THREE, FARMHAND, BORN AT ATESSA, resident at Atessa, SON OF GIUSEPPE, farmhand, resident at Atessa, AND OF THE LATE MARIA STANISCIA, who in life resided at Atessa.\n\n2nd ANGIOLINA PIZZI, aged TWENTY-THREE, housewife, born at Atessa, resident at Atessa, DAUGHTER OF THE LATE DOMENICO, who in life resided at Atessa, AND OF TERESA FLOCCO, resident at Atessa.\n\nWho requested me to unite them in marriage. To that end they presented me with a single document; the articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code having been read to the spouses, and having asked the husband whether he wishes to take as his wife the ANGIOLINA PIZZI here present, and her whether she wishes to take as her husband the NICOLA FAIENZA here present, and each having answered in the affirmative, I pronounced in the name of the law that they are united in marriage.\n\nWitnesses: LUZIO IANNONE, aged twenty-two, CLERK, and EMIDIO FLOCCO, aged fifty-six, CAFÉ KEEPER, both resident in this comune.\n\nThe document presented is the certificate of the banns made by myself as Registrar of the Civil Status of Atessa, the first on the EIGHTEENTH and the second on the TWENTY-FIFTH of the current December.\n\nTo the said marriage consent was given by THE HUSBAND'S FATHER, as appears and is set out in the act requesting the banns.\n\n(a) The interlined words «vita in» are to be taken as not written.\n\nThe present record having been read to all present, the spouses and the witnesses signed it with me.", "notas": ["IT WAS THE SHORTEST AND MOST PROFITABLE LOOSE END THAT HAD BEEN OPENED, AND IT HAS PAID OFF. Of Nicola Faienza absolutely nothing was known: not the age, nor the trade, nor the village, nor the parents. The record gives all four things in a single line.", "IT KILLS THE PAGLIETA LEAD DEFINITIVELY. «Nato in Atessa, residente in Atessa, figlio di Giuseppe, contadino, residente in Atessa». Neither the bridegroom nor his father were from Paglieta. That village came from the family block without sources, and with this one that block has failed a direct check three times.", "IT ADDS A GENERATION OF FAIENZA: Giuseppe Faienza and Maria Staniscia, the bridegroom's parents, who until today existed on no paper. He alive in 1892, she already dead.", "THE PATERNAL CONSENT IS NOT A FORMALITY. The Civil Code required it of males under twenty-five and Nicola was twenty-three, just as happened to Francesco Salerno in Rende two years later. That it is set down in writing is the proof that Giuseppe Faienza was alive and at hand in December 1892.", "BOTH BRIDE AND GROOM COULD WRITE, and in these registers that is exceptional: the usual formula of the period is «essendo i testimoni analfabeti». Here all four sign. Her father, Domenico Pizzi, also signed: he did so in 1869 when reporting the birth of this same bride.", "IT CONFIRMS THE BRIDE POINT BY POINT: twenty-three years old (she was born on 12 February 1869), daughter of the late Domenico (he died on 28 September 1891) and of Teresa Flocco, who was still alive. The correction (a) at the foot strikes out the «in vita» that the clerk had interlined above her: she was not one more widow, she was alive.", "IT CORRECTS AN EARLIER READING. The mayor's delegation to Francesco Falcucci was noted on the page of the 1891 record as «24 November 1889». Here it reads VENTICINQUE, and the Atessa births of 1899 repeat «venticinque». It was the 25th.", "IT WAS LOCATED IN FOUR IMAGES AND AT THE FIRST ATTEMPT IN THE LAST ONE: the number was given by the marginal note of 1869, and the title page of PART II on page 110 left the arithmetic ready-made.", "WHAT IT OPENS: the birth certificate of Nicola himself, in the Nati of Atessa c. 1869 —the same register and almost the same year as his wife's—, and the marriage of his parents, c. 1865."], "imgs": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20Nicola%20Faienza%20y%20Angiolina%20Pizzi%20-%20Atessa%20acta%20101.jpg", "t": "Nicola Faienza y Angiolina Pizzi - Atessa acta 101"}], "zooms": [{"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20acta%20101%20completa.jpg", "t": "Acta 101 completa"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20cabecera%2C%2029%20de%20diciembre%20de%201892%20y%20el%20oficial%20Falcucci.jpg", "t": "Cabecera, 29 de diciembre de 1892 y el oficial Falcucci"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20los%20novios%2C%20edades%2C%20oficios%20y%20padres.jpg", "t": "Los novios, edades, oficios y padres"}, {"u": "../actas/1892%20-%20Matrimonio%20Nicola%20Faienza%20y%20Angiolina%20Pizzi/1892-12-29%20M%20zoom%20-%20testigos%2C%20publicaciones%20y%20consentimiento%20del%20padre%20del%20novio.jpg", "t": "Testigos, publicaciones y consentimiento del padre del novio"}]}], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_faienza": {"id": "giuseppe_faienza", "nombre": "Giuseppe Faienza", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["faienza"], "resumen": "A farmhand from Atessa, father of Nicola Faienza. Born around 1840. He was alive in December 1892 and had to give his consent for his son to marry.", "datos": [["Birth", "c. 1840, presumably Atessa — his son was born there around 1869"], ["Trade", "contadino (farmhand)"], ["Residence", "ATESSA — the 1892 record gives him as «residente in Atessa», without «fu»: alive"], ["Spouse", "MARIA STANISCIA, already deceased in December 1892"], ["Son", "Nicola Faienza (c. 1869), contadino, married to Angiolina Pizzi"], ["Death", "not located — after December 1892"], ["Where it comes from", "his son's marriage record: Atessa, Matrimoni 1892, record 101"]], "vida": "b.c.1840", "lug": "", "mapa": null, "sinacta": "NEW IN AUGUST 2026, and he is the first Faienza of a generation earlier than Nicola to appear written down in a document. He comes out of the marriage record of his son (Atessa, 29 December 1892, record 101, transcribed in the file of the marriage): «NICOLA FAIENZA… figlio di GIUSEPPE, contadino, residente in Atessa».\n\nTHAT HE WAS ALIVE IS NOT AN INFERENCE FROM THE FORM, IT IS A FACT OF THE RECORD. Nicola was twenty-three and the Civil Code required paternal consent below the age of twenty-five; the record notes that «ha prestato il consenso il padre dello sposo, come risulta ed è spiegato dall'atto di richiesta delle pubblicazioni». Someone went to declare it before the registrar in December 1892.\n\nWHAT IS NOT KNOWN: when he was born, whose son he was and when he died. His marriage to Maria Staniscia would be from around 1865 and would be in the Matrimoni of Atessa; his death, in the Morti of Atessa later than 1892. It is worth bearing in mind that in Atessa there are several Faienza families at the same time —in the births of 1899 three different ones appear, that of Michele fu Carmine and those of Antonio and Vincenzo di Pasquale—, so the surname alone is not enough: the father's name will be needed in each record.", "padre": null, "madre": null, "conyuge": "maria_staniscia", "unionLibre": false, "otrasParejas": [], "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_staniscia": {"id": "maria_staniscia", "nombre": "Maria Staniscia", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["faienza"], "resumen": "Mother of Nicola Faienza, from Atessa. Born around 1845. She was already dead when her son married, in December 1892.", "datos": [["Birth", "c. 1845, presumably Atessa"], ["Residence", "ATESSA — «residente IN VITA in Atessa», the formula the printed form reserves for dead parents"], ["Spouse", "Giuseppe Faienza, contadino of Atessa"], ["Son", "Nicola Faienza (c. 1869)"], ["Death", "not located — before December 1892"], ["Where it comes from", "his son's marriage record: Atessa, Matrimoni 1892, record 101"]], "vida": "b.c.1845", "lug": "", "mapa": null, "sinacta": "NEW IN AUGUST 2026. The marriage record of her son Nicola (Atessa, 29 December 1892, record 101) says «e della FU MARIA STANISCIA, residente in vita in Atessa». The «fu» and the «in vita» say the same thing twice over: by December 1892 she was already dead, and while she lived she lived in Atessa.\n\nShe is the third mother in a row whom the Atessa records take the trouble to name —after Santa Menna in 1841, Rosa Iacobitti in 1847 and Antonia di Iorio in 1891—, as against the four twin forms from Rende that left the gap blank four times. STANISCIA is a common surname in Atessa: the marriage index of 1892 carries several, and in the births of 1899 it comes up again.\n\nHer death ought to be in the Morti of Atessa earlier than 1892.", "padre": null, "madre": null, "conyuge": "giuseppe_faienza", "unionLibre": false, "otrasParejas": [], "hijos": ["nicola_faienza"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe": {"id": "giuseppe", "nombre": "Giuseppe Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The first son. Born at Rende in 1895; he was 24 in 1919.", "datos": [["Birth", "23 February 1895, 10 a.m., Rende — record 43"], ["Place", "contrada Saporito"], ["Parents", "Salerno Francesco and Chiappetta Filomena"]], "vida": "b.1895", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "24 February 1895, 10 h", "lugar": "Rende", "ref": "record 43", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 86 «Nati»"], ["Warning", "catalogued as 1894, but it contains records of 1895"], ["Register", "an_ua35983864 · hash 03Ar6ql"], ["Page", "28 of 98"], ["Registrar", "Spina Raffaele, secretary delegate"]], "literal": "Salerno Francesco, agricoltore… Chiappetta Filomena, donna di casa, sua moglie…", "traduccion": "In the year eighteen hundred and ninety-five, on the twenty-fourth day of February, at ten in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the sixteenth of December eighteen hundred and ninety-four, there appeared SALERNO FRANCESCO, farmer, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, housewife, his wife living with him, there was born on the twenty-third of the current month, at ten in the morning, in the house situated in contrada Saporito, a boy, upon whom he bestows the name GIUSEPPE.\n\nWitnesses: Zicarelli Carmine, aged twenty-eight, labourer; and Marchese Vincenzo, aged sixty, farmer.", "notas": ["The father's declared age (30) is wrong: Francesco had been born on 7 December 1870, so he was 24. The ages declared in these registers are approximate.", "The block of text at the top right of that same page —a wet-nurse agreement with Bruno Maria— does NOT belong to this record, but to record 42."], "imgs": [{"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20Giuseppe%20Salerno%20-%20Rende%20acta%2043.jpg", "t": "Giuseppe Salerno - Rende acta 43"}], "zooms": [{"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20nombre%20impuesto%20y%20testigos.jpg", "t": "Nombre impuesto y testigos"}, {"u": "../actas/1895%20-%20Giuseppe%20Salerno/1895-02-23%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "The first of nine", "parrafos": ["He was born on 23 February 1895 at ten in the morning, in the contrada Saporito at Rende. His father registered him the next day at the same hour, before Spina Raffaele, secretary delegated by the mayor. The witnesses were Zicarelli Carmine, a twenty-eight-year-old day labourer, and Marchese Vincenzo, a sixty-year-old farmer.", "On that record Francesco declared thirty years. He was twenty-four. It is the first in a run of misdeclared ages that has forced every record of this family to be checked by the mother's name and the sequence number, and never by the father's age.", "He is the first child of Francesco and Filomena, born eleven months after the wedding. In 1919 he was twenty-four and was among those who crossed to Argentina — though the year of the voyage is still not settled: Italy did not allow men of military age to emigrate until after the war, and emigration to Argentina did not resume until March 1920."], "claves": [["Birth", "23 February 1895, 10 a.m., contrada Saporito, Rende"], ["Place among the siblings", "the eldest of the nine"], ["Father's declared age", "30, when he was 24"], ["In 1919", "24 years old; emigrated"]]}, "antonio": {"id": "antonio", "nombre": "Antonio Salerno", "legal": "ANTHONY SALERNO in the United States", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The brother who went to Chicago. Second son of Francesco and Filomena, born at Rende in 1896; he boarded at Naples at seventeen and landed in New York on 16 April 1914. He died in Illinois in 1981, aged eighty-four, after sixty-seven years in the same town and thirty-odd in the same feed mill. He is by far the brother of Settimo about whom most is known.", "datos": [["Birth", "13 June 1896, Rende — record 117, contrada S. Agostino"], ["Parents", "Salerno Francesco (25 years old) and Chiappetta Filomena"], ["Emigration", "he left NAPLES about 8 April 1914 and reached NEW YORK on 16 April 1914, on the steamer BERLIN. He was seventeen"], ["In Illinois since", "21 October 1914"], ["Marriage", "19 May 1920, to ROSINA SALERNO — a Salerno by surname too, and also from the province of Cosenza"], ["Children", "DOMENICO, born on 11 February 1922, and FILOMENA, on 8 February 1925, both at Riverdale, Illinois"], ["Naturalised", "25 January 1929, U.S. District Court, Chicago — petition no. 19857, filed on 10 July 1925; declaration of intention no. 22117"], ["Address", "13832 and later 13838 South Emerald Avenue, RIVERDALE, Cook County, Illinois. He lived there for the whole of his American life"], ["Trade", "LABORER at the HALES AND HUNTER FEED COMPANY, at the corner of 140th Street and Halsted, Riverdale. In the 1950 census he was still there, forty hours a week"], ["What he looked like", "in February 1942, aged 44: 5 feet 4 inches —1.63 m—, 145 pounds —66 kg—, BROWN EYES, BLACK HAIR, DARK COMPLEXION, no distinguishing marks"], ["Death", "Tuesday 5 May 1981, at the Ingalls Memorial Hospital in Harvey, Illinois. The funeral on the Friday, the 8th, at St Mary's church in Riverdale"], ["Buried", "ST BENEDICT CEMETERY, Chicago"], ["He left", "his wife Rose, his son Dominic, a brother Vincenzo of Riverdale, two grandchildren and five great-grandchildren"]], "vida": "1896–1981", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "rosina_salerno", "unionLibre": false, "otrasParejas": [], "hijos": ["dominick_salerno", "filomena_salerno_usa"], "hermanos": ["giuseppe", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Newspaper obituary", "tipo": "D", "tipoNombre": "Death", "fecha": "martes 5 May 1981", "lugar": "Riverdale, Illinois", "ref": "«The Star», 10 May 1981", "fuente": [["Banns", "«The Star», Illinois, 10 May 1981"], ["Via", "FamilySearch — Hammond, Lake, Indiana, image 3285 of 3302, image group 007596074"]], "literal": "ANTONIO SALERNO. Services were Friday for Antonio Salerno of Riverdale. Mr. Salerno died Tuesday at Ingalls Memorial hospital, Harvey. The funeral mass was at St. Mary's church, Riverdale. Burial was at St. Benedict's cemetery, Chicago. A former laborer at the Hales and Hunter Feed company in Riverdale, Mr. Salerno was born June 13, 1896, in Italy. He is survived by his wife, Rose; a son, Dominic of Riverdale; a brothr, Vincenzo of Riverdale; two grandchildren, and five great-grandchildren.", "traduccion": "ANTONIO SALERNO. Services for Antonio Salerno, of Riverdale, were held on Friday. Mr Salerno died on Tuesday at Ingalls Memorial Hospital in Harvey. Mass was at St Mary's Church, Riverdale. Burial was at St Benedict Cemetery, Chicago.\n\nA former labourer at the Hales and Hunter Feed Company of Riverdale, Mr Salerno had been born on 13 JUNE 1896 IN ITALY.\n\nHe is survived by his wife, Rose; a son, Dominic, of Riverdale; a brother, Vincenzo, of Riverdale; two grandchildren and five great-grandchildren.", "notas": ["THIS OBITUARY CLOSES THE IDENTIFICATION. It gives «13 June 1896», which is EXACTLY the date of his birth record from Rende. His American papers —the naturalisation of 1925 and the draft card of 1942— said 1897; the newspaper is right where the forms failed. There is no doubt at all that he is Settimo's brother.", "HE DIED ON A TUESDAY: 10 May 1981 was a Sunday, the funeral was on Friday the 8th, so the death falls on TUESDAY 5 MAY 1981. He was eighty-four years old.", "«A BROTHR, VINCENZO OF RIVERDALE». It is the most intriguing line in the whole document and it is unresolved — see the loose end that bears his name.", "SIXTY-SEVEN YEARS IN THE SAME PLACE. He arrived in Riverdale at seventeen and there he died at eighty-four. The factory where he worked, Hales and Hunter, was six blocks from his house."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1981-05-10%20D%20Esquela%20de%20Antonio%20Salerno%20-%20The%20Star%2C%20Illinois.jpg", "t": "Esquela de Antonio Salerno - The Star, Illinois"}], "zooms": []}, {"titulo": "Petition for naturalisation", "tipo": "C", "tipoNombre": "Certificate", "fecha": "filed on 10 July 1925; granted on 25 January 1929", "lugar": "U.S. District Court, Chicago", "ref": "petition no. 19857", "fuente": [["Archive", "United States District Court, Northern District of Illinois"], ["Via", "FamilySearch — image 632 of 1246, group 007789231"], ["Declaration of intention", "no. 22117, August 1921"]], "literal": "ANTONIO SALERNO. My place of residence is 13832 So. Emerald Ave., Riverdale, Illinois. My occupation is laborer. I was born on the 13th day of June, anno Domini 1897, at Cosenza, Italy. I emigrated to the United States from Naples, Italy, on or about the 8th day of April anno Domini 1914, and arrived at the United States, at the port of New York, on the 16th day of April anno Domini 1914, on the vessel BERLIN. […] My wife's name is Rosina. She was born in Italy and now resides with me. I have 2 children: Domenico born Feb. 11, 1922; Filomena, Feb. 8, 1925, both born at Riverdale, Ill., and reside with me.", "traduccion": "Antonio Salerno, labourer, resident at 13832 South Emerald Avenue, Riverdale, Illinois, declares that he was born on 13 June 1897 at Cosenza, Italy.\n\nHE EMIGRATED FROM NAPLES around 8 April 1914 and ARRIVED AT THE PORT OF NEW YORK ON 16 APRIL 1914, ABOARD THE STEAMER «BERLIN».\n\nHe has lived in Illinois since 21 October 1914. His wife is called ROSINA, born in Italy and living with him. He has two children: DOMENICO, born 11 February 1922, and FILOMENA, 8 February 1925, both born at Riverdale.\n\nHe renounces all allegiance to Victor Emmanuel III, King of Italy. Signing as witnesses were GABRIELE PRETE, labourer, of 800 South Loomis St., Chicago, and SARFINO ARIELLO, switchman, of 13643 South Halsted St., Riverdale, who declare that they have known him since 1 November 1919.", "notas": ["HERE IS THE SHIP. After exhausting the CEMLA without finding anyone, it turns out the answer lay in the other hemisphere: Antonio did not go to Buenos Aires, he went to New York, and his name is on the list of the steamer BERLIN which docked on 16 April 1914. The passenger list for that voyage is a document that can now be ordered.", "HE LEFT IN 1914, NOT IN 1919. The whole family reconstruction had taken for granted that the brothers emigrated together after the war. Antonio left FIVE YEARS EARLIER, and had only just turned seventeen. The family did not scatter all at once: it frayed away.", "His year of birth here is 1897, and in his Rende record it is 1896. The day and the month match exactly. His 1981 obituary notice says 1896 and settles the matter.", "The witness Gabriele Prete reappears in the 1950 census living two doors away. And the other, Sarfino Ariello, lived at 13643 Halsted, the same block where the census places the Cundari family. It was an entire neighbourhood of fellow villagers."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1925-07-10%20C%20Peticion%20de%20naturalizacion%20de%20Antonio%20Salerno%20-%20Chicago%20n%2019857.jpg", "t": "Peticion de naturalizacion de Antonio Salerno - Chicago n 19857"}], "zooms": []}, {"titulo": "Second World War draft card", "tipo": "C", "tipoNombre": "Certificate", "fecha": "16 February 1942", "lugar": "Riverdale, Illinois", "ref": "serial 798, order 11239", "fuente": [["Archive", "National Personnel Records Center, St. Louis, Missouri"], ["Via", "FamilySearch — image 816 of 1081, group 104612912"], ["Local board", "no. 11, Harvey, Cook County, Illinois"]], "literal": "Antonio (None) Salerno. 13838 Emerald Ave., Riverdale, Cook, Illinois. Telephone Riverdale 188 J. Age 44. Date of birth June 13, 1897. Place of birth Cosenza, Italy. Name and address of person who will always know your address: GUS CUNDARI, 13851 S. Halsted, Riverdale, Illinois. Employer: Hales and Hunter, 140th and Halsted. — White, 5'4\", 145 lbs, eyes brown, hair black, complexion dark. Other obvious physical characteristics: None.", "traduccion": "Registration card for what was called the «old man's registration», the census of men aged 45 to 64 that the United States took on entering the war. Antonio Salerno, no middle name, of 13838 Emerald Avenue, Riverdale. Telephone: Riverdale 188 J. Forty-four years old, born 13 June 1897 at Cosenza, Italy.\n\nPerson who will always know his address: GUS CUNDARI, of 13851 South Halsted, Riverdale. Employed at Hales and Hunter, at 140th and Halsted.\n\nDESCRIPTION: white, FIVE FEET FOUR INCHES (1.63 m), ONE HUNDRED AND FORTY-FIVE POUNDS (66 kg), BROWN EYES, BLACK HAIR, DARK COMPLEXION. No other distinguishing marks.", "notas": ["IT IS THE ONLY PHYSICAL DESCRIPTION OF ANYONE IN THIS ENTIRE TREE. Out of a hundred and thirty people and two hundred years of paperwork, this is the only document that says what someone looked like: short, stocky, dark-skinned, black hair and brown eyes. His brother Settimo would probably have been similar.", "GUS CUNDARI AS CONTACT. Cundari is the surname of his mother-in-law, Cherubina Cundari, and also that of Anna Cundari, the woman his brother Giovanni married in Rende in 1926. Two Salerno brothers related by marriage to Cundaris, one in Rende and the other in Illinois.", "In 1942 he was still at the same factory and on the same street as in 1925. Only the number had changed: from 13832 to 13838."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1942-02-16%20C%20Ficha%20de%20reclutamiento%20de%20Antonio%20Salerno%20-%20Riverdale%20Illinois.jpg", "t": "Ficha de reclutamiento de Antonio Salerno - Riverdale Illinois"}], "zooms": []}, {"titulo": "United States census", "tipo": "C", "tipoNombre": "Certificate", "fecha": "April 1950", "lugar": "Riverdale, Cook County, Illinois", "ref": "sheet 3, dwelling 21 — 13838 Emerald Ave.", "fuente": [["Archive", "National Archives and Records Administration"], ["Via", "FamilySearch — image 4 of 39, group 108925561"]], "literal": "SALERNO, Anthony — Head, W, M, 53, Mar., born Italy, naturalized. 40 hrs. Laborer, Feed Mill. / Rose — Wife, W, F, 43, Mar., born Italy, naturalized. / Dominick D. — Son, W, M, 27, Mar. 36 hrs. Switchman, Railroad Co. / Mary L. — Daughter-in-law, W, F, 21, Mar. / Beverlee — Granddaughter, W, F, 2, Sin.", "traduccion": "In April 1950 the house at 13838 Emerald Avenue held three generations:\n\nANTHONY SALERNO, head of household, 53, married, born in Italy, naturalised. Forty hours a week as a labourer in a feed mill.\nROSE, his wife, 43, born in Italy, naturalised.\nDOMINICK D., the son, 27, married, RAILROAD COMPANY SWITCHMAN, 36 hours.\nMARY L., his daughter-in-law, 21.\nBEVERLEE, the granddaughter, 2.\n\nTwo houses along, on the same census sheet, lived CONSTANTINO CUNDARI, 62, born in Italy, foreman with the railroad company, with his wife ANGELINA, 57.", "notas": ["THREE GENERATIONS UNDER THE SAME ROOF, and a fourth two doors away: the Cundaris, his mother-in-law's family. Emerald Street in Riverdale was a Calabrian village transplanted.", "His daughter Filomena, aged twenty-five in 1950, no longer lives at home: she would have married.", "The son went into the railway, not into the feed mill. The next generation moved out of the father's trade."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1950-04-15%20C%20Censo%20de%20Estados%20Unidos%20-%20Riverdale%20Cook%20Illinois.jpg", "t": "Censo de Estados Unidos - Riverdale Cook Illinois"}], "zooms": []}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "14 June 1896, 7 h", "lugar": "Rende", "ref": "record 117", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 87 «Nati»"], ["Warning", "catalogued as 1895, but it contains records of 1896"], ["Register", "an_ua35983865 · hash 57okQgj"], ["Page", "55 of 89"], ["Registrar", "Spina Raffaele, secretary delegate"]], "literal": "Salerno Francesco, di anni venticinque, agricoltore…", "traduccion": "In the year eighteen hundred and ninety-six, on the fourteenth day of June, at seven in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the first of December eighteen hundred and ninety-five, there appeared SALERNO FRANCESCO, aged twenty-five, farmer, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, housewife, his wife living with him, there was born on the thirteenth of the current month, in the house situated in contrada S. Agostino, a boy, upon whom he bestows the name ANTONIO.\n\nWitnesses: Greco Pasquale, farmer; and Serpe Serafino, farmer.", "notas": ["It is the record that made it possible to detect the offset in the Antenati catalogue. The handwritten year says «novantasei» perfectly clearly, and the father's age (25) tallies exactly with his birth in December 1870.", "The family has moved from contrada Saporito to contrada S. Agostino, where they will still be in 1900."], "imgs": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20Antonio%20Salerno%20-%20Rende%20acta%20117.jpg", "t": "Antonio Salerno - Rende acta 117"}], "zooms": [{"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1896%20-%20Antonio%20Salerno/1896-06-13%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20madre%20Filomena%20Chiappetta.jpg", "t": "Padre Francesco Salerno y madre Filomena Chiappetta"}]}], "nActas": 5, "nImgs": 7, "titulo": "The record that exposed the catalogue", "parrafos": ["He was born on 13 June 1896 in the contrada S. Agostino at Rende and was registered the following day at seven in the morning. His father declared twenty-five years, and this time the figure was exact. The witnesses were two village farmers: Greco Pasquale and Serpe Serafino.", "That exactness solved a serious problem. The register holding his record, Rende's number 87, is listed in the archive catalogue as «Births 1895», but the handwritten year in the heading says «novantasei» quite clearly and the father's age fits 1896. From this it emerged that the catalogue's dating is not reliable and that the Rende birth volumes do not run one per year: they split years in two. Since then there has been a rule in this investigation — read the handwritten year before accepting any record.", "The family had moved from Saporito, where Giuseppe had been born, to S. Agostino, the contrada where they would live again from 1904.", "Family memory places him in Chicago, alongside a Vincenzo. There is as yet no document to support it: it is a lead, not a fact."], "claves": [["Birth", "13 June 1896, contrada S. Agostino, Rende, record 117"], ["What his record proved", "that the archive catalogue dated the register wrongly"], ["Father's declared age", "25 — correct"], ["In 1919", "23 years old; emigrated"]]}, "umberto": {"id": "umberto", "nombre": "Umberto Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Third son, born at Rende in 1897. He was 22 in 1919.", "datos": [["Birth", "22 November 1897, 6 a.m., Rende — record 240"], ["Place", "contrada Saporito"], ["Parents", "Salerno Francesco and Chiappetta Filomena"]], "vida": "b.1897", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "22 November 1897, 10:10 h", "lugar": "Rende", "ref": "record 240", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 89 «Nati» 1897"], ["Register", "an_ua35983867 · hash wlpK8pB"], ["Page", "85 of 101"], ["Registrar", "Spina Raffaele, secretary delegate"]], "literal": "Salerno Francesco, contadino… di anni ventiquattro…", "traduccion": "In the year eighteen hundred and ninety-seven, on the twenty-second day of November, at ten past ten in the morning, at the town hall, before Spina Raffaele, secretary delegated by act of the mayor of the sixteenth of December eighteen hundred and ninety-six, duly approved, there appeared SALERNO FRANCESCO, farmhand, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife living with him, there was born on the twenty-second of the current month, at six in the morning, in the house situated in contrada Saporito, a child of the male sex, upon whom he bestows the name UMBERTO.\n\nWitnesses: Spizzirri Giovanni, aged forty-nine, farmer; and Picarelli Vincenzo, aged sixty-eight, farmer, both resident in the comune. Illiterate: they do not sign; only the registrar signs.", "notas": ["The father's declared age is written in very pale ink. The most probable reading is «ventiquattro» (24), but Francesco was 26 in November 1897. Another erroneous declared age.", "The family has gone back to contrada Saporito, where they already were in 1895. In 1896 they were in S. Agostino and in 1899 they will be in Campagnano. They moved a great deal.", "To locate this record it was necessary to discover that the digitiser rephotographs the same opening twice when a loose sheet is lying on top of it. The clean shot has been kept here."], "imgs": [{"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20Umberto%20Salerno%20-%20Rende%20acta%20240.jpg", "t": "Umberto Salerno - Rende acta 240"}], "zooms": [{"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20acta%20240%20completa.jpg", "t": "Acta 240 completa"}, {"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20cabecera%2C%20padre%20Francesco%20y%20contrada%20Saporito.jpg", "t": "Cabecera, padre Francesco y contrada Saporito"}, {"u": "../actas/1897%20-%20Umberto%20Salerno/1897-11-22%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 4, "titulo": "Registered the same day", "parrafos": ["He was born on 22 November 1897 at six in the morning, in the contrada Saporito. By ten past ten that same morning his father was at the town hall declaring him: four hours and ten minutes between the birth and the registration.", "The age Francesco declared is written in very faint ink; the likeliest reading is twenty-four, and he was twenty-six. The witnesses were two village farmers, Spizzirri Giovanni, forty-nine, and Picarelli Vincenzo, sixty-eight. Nobody signed but the secretary, Spina Raffaele.", "His record was harder to find than any other. The 1897 register has re-photographed pages: when the volume has a loose sheet lying on it — death annotations that other town halls would send decades later — the digitiser takes two shots of the same opening. Page 86 carries a sheet covering half the spread; page 85 is the clean one, and that is the one that was saved.", "With Umberto the family had gone back to the contrada Saporito, where they had already been in 1895. In 1919 he was twenty-two and was one of those who left."], "claves": [["Birth", "22 November 1897, 6 a.m., contrada Saporito, Rende"], ["Registered", "the same day, four hours later"], ["Father's declared age", "24, when he was 26"], ["In 1919", "22 years old; emigrated"]]}, "settimo": {"id": "settimo", "nombre": "Settimo Salerno", "legal": "Settimo — not «Settino»", "rol": "directa", "rolNombre": "Direct line", "gen": 8, "ramas": ["salerno"], "resumen": "The great-grandfather Gonzalo lived to know. A twin, the first born, at half past four in the morning of 24 October 1899 at Rende. He crossed the Atlantic, married at Santa Fe at twenty-three, and had to fight the Argentine civil registry for twenty-seven years to get his own name spelled correctly.", "datos": [["Birth", "24 October 1899, at 4:30 a.m., Rende — record 231"], ["Place", "contrada Campagnano"], ["Twin of", "SAVERIO, born twenty-five minutes later"], ["Order of birth", "«il primo nato» — the first born"], ["Her name", "SETTIMO, «the seventh». It is not a whim: he came from a long line of brothers and sisters"], ["Parents", "SALERNO FRANCESCO, aged 28 in 1899, and CHIAPPETTA FILOMENA. In 1923 they were still living at RENDE: they did not emigrate with him"], ["Emigration", "no date, no ship and no landing list. The only certainty is that by March 1923 he was already in Santa Fe"], ["Documented trade", "BAKER — so it stands in his marriage record of 1923, at the age of twenty-three"], ["Trade by family memory", "MATTRESS-MAKER. The family tells it and it is NOT documented: the one paper that gives a trade says baker. Both can fit into a long life, but they are not to be mixed"], ["Marriage", "26 March 1923, city of Santa Fe, record 140, to CRISTINA RIZZO, Argentine, daughter of Salvador Rizzo and Ángela Costabile"], ["Where the Salernos lived", "in CALLE FRANCIA, Santa Fe city, all the brothers together, according to family memory. Undocumented"], ["Death", "between 1977 and 1980, according to the family. The tree says 1975 and that date is wrong: Gonzalo was born in September 1977 and did come to know him — there is a photograph of the two of them"]], "vida": "1899–c.1977/80", "lug": "Rende", "mapa": null, "sinacta": "THE STORY OF HIS NAME, WHICH IS HIS OWN STORY. He was called SETTIMO, «the seventh». His Rende birth record says so in full and twice over: in the body —«il nome di Settimo, e ch'è gemello»— and in the marginal heading, «Salerno Settimo». AND FROM THAT POINT ON NOBODY EVER WROTE IT CORRECTLY AGAIN. The index of the Italian register itself transcribes it **SETTINO**, with an n — and because of that index he entered this tree under the wrong name, until the original record was opened. In Argentina it was worse: in his marriage record of 1923 it was written incorrectly, he himself signed **«Settimio»**, and when his wife died, in 1967, the registrar of the civil status still wrote **«Settino Salerno»**. IN 1950 HE WENT TO PUT IT RIGHT. In the margin of his marriage record there is a note from the Dirección General del Registro Civil, of August 1950, rectifying the record «establishing that the true name of the groom is SETTIMO». Twenty-seven years after marrying, at about fifty years of age, this man went through the formalities of recovering his own name. And even so, seventeen years later, they wrote it wrongly again. WHAT IS MISSING OF HIM, AND IT IS A GREAT DEAL. There is no date of emigration, no ship, no death record. He arrived before March 1923 and died between 1977 and 1980. His death certificate, in the Civil Registry of Santa Fe, would give the exact date, the domicile and the trade he died in — and there it would be known whether he ended up as a mattress-maker, as the family tells it, or went on as a baker. It is one of the first things to be requested.\n\nRelated: [[cristina_rizzo]], [[carlos_salerno]].", "padre": "francesco", "madre": "filomena", "conyuge": "cristina_rizzo", "unionLibre": false, "otrasParejas": [], "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": ["giuseppe", "antonio", "umberto", "saverio", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Marriage record with Cristina Rizzo", "tipo": "M", "tipoNombre": "Marriage", "fecha": "26 March 1923", "lugar": "city of Santa Fe, Argentina", "ref": "record 140", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["How it was obtained", "digital application at santafe.gob.ar/rcdigital, requested by Gonzalo on 25 August 2026"], ["Digital signature", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verification", "application 26-00-284-316 · hash D436-F555-6EF1-EE25-20B7-FA23-3C5D-8A13-78B9-EA89"]], "literal": "", "traduccion": "Record number one hundred and forty. In the city of SANTA FE, department of La Capital, province of Santa Fe, on the twenty-sixth day of March in the year nineteen hundred and twenty-three. Before me, head of the Registry of Civil Status, there appeared:\n\nDon SETTIMO SALERNO, aged twenty-three, of ITALIAN nationality, BORN AT RENDE, resident in this city, by trade a BAKER; son of don FRANCISCO SALERNO, aged forty, Italian, RESIDENT AT RENDE, ITALY, farmer, and of doña FILOMENA CHIAPPETTA, aged fifty, Italian, resident at Rende;\n\nand doña CRISTINA RIZZO, aged twenty-three, of ARGENTINE nationality; daughter of don SALVADOR RIZZO and of doña ÁNGELA COSTABILE, Italian, resident in this city.\n\nBoth parties stated that it was their will to marry, taking each other as husband and wife... I declare that don SETTIMO SALERNO and doña CRISTINA RIZZO are joined in lawful marriage.", "notas": ["IT CONFIRMS HIS PARENTS BY THE ARGENTINE ROUTE. The Italian record of 1899 gave «Salerno Francesco, aged 28, and Chiappetta Filomena». This one, twenty-four years later and on another continent, gives the same two names — and adds that in 1923 they were STILL LIVING IN RENDE. They did not emigrate with their son.", "AND AT LAST IT GIVES THE BRIDE'S PARENTS: SALVADOR RIZZO and ÁNGELA COSTABILE. Until this day the Rizzos were a single loose person in the whole tree.", "HE WAS A BAKER. At twenty-three, newly arrived from Rende.", "MIND THE FATHER'S AGE: the record puts him at forty, but the birth record of 1899 gave him twenty-eight, which would make him fifty-two in 1923. Twelve years out — understandable, because the father was in Italy and the age was given by the son from memory.", "A MARGINAL NOTE OF 1950 CORRECTS HIS OWN NAME. The Dirección General del Registro Civil recorded, twenty-seven years later, «that the groom's true name is SETTIMO». On his marriage record it was misspelt."], "imgs": [{"u": "../actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%201.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 1"}, {"u": "../actas/1923%20-%20Matrimonio%20de%20Settimo%20Salerno%20y%20Cristina%20Rizzo/1923-03-26%20M%20Acta%20de%20matrimonio%20-%20Santa%20Fe%20acta%20140%20pagina%202.jpg", "t": "Acta de matrimonio - Santa Fe acta 140 pagina 2"}], "zooms": []}, {"titulo": "The four brothers in Argentina", "tipo": "F", "tipoNombre": "Photograph", "fecha": "c. 1925-1930", "lugar": "Argentina — photographic studio", "ref": "family photograph", "fuente": [["Provenance", "family album, Argentine branch"], ["Medium", "studio print, painted backdrop with a palm tree"]], "literal": "", "traduccion": "Four young men posing in a photographic studio, in front of a painted backdrop with a palm tree and a landscape. Two standing, in dark suits; two seated on a bench, in light summer suits with their hats on their knees — a straw boater with a dark band on the left, a soft-brimmed felt on the right. All in white stiff-collared shirts and wide dark ties.\n\nThe family identifies them as the FOUR SALERNO BROTHERS newly arrived in Argentina. SETTIMO and SAVERIO are certainly among them; about the other two there is no certainty.", "notas": ["THE PHOTOGRAPH CORRECTS THE DATE OF THE EMIGRATION. The family always said they arrived «in 1919, after the war». The clothing says otherwise: the straw boater and the wide-striped, high-waisted trousers are from the mid-twenties onwards. And none of the four looks under a good twenty: if ARTURO, born in 1907, is one of them, in 1919 he would have been TWELVE YEARS OLD, and there is no boy of twelve there. Conclusion: either Arturo is not in the photograph, or THEY ARRIVED AROUND 1925-1930, not in 1919.\n\nAnd the second fits everything else: Antonio left alone in 1914, Giovanni was still in Rende marrying in 1926. The family did not break up all at once in 1919 — it frayed away over fifteen years. The 1919 date is memory, and memory has already failed once, with Antonio.", "THE TWO SEATED MEN COULD BE THE TWINS. It is a hypothesis of the eye, not a fact: they are the two dressed alike — light summer suits — they are seated in symmetrical postures, both with their hats on their knees, and their faces resemble one another more than either of the other two pairs. Settimo and Saverio were born on the same day in 1899, twenty-five minutes apart. Nobody who knows that can look at the photograph without thinking of it.", "WHO THE FOUR MIGHT BE, by documentary elimination. Of the seven sons, ANTONIO went to Chicago in 1914 and died there in 1981; GIOVANNI stayed in Rende and married there in 1926. That leaves five candidates for four chairs: GIUSEPPE (1895), UMBERTO (1897), SETTIMO (1899), SAVERIO (1899) and ARTURO (1907).", "AND HERE IS SOMETHING WORTH THINKING ABOUT. The family remembers those who came as «Saverio, Settimo, and I would think Raffaele and Angelo». But Raffaele and Angelo appear in no record, whereas UMBERTO and ARTURO do exist and their fate is a complete blank. In this genealogy it has already happened twice that a person lived under a name different from the registered one: SETTIMO called himself Setimio in Argentina, and AQUILA appears as Rosalia on her own marriage record. It would not be strange if the men the family remembers as Raffaele and Angelo were Umberto and Arturo.", "A fact so as not to get confused: ANGELINA, the sister born in 1902, DIED IN RENDE ON 29 AUGUST 1910, aged eight. She could not have emigrated. If family memory recalls an «Angelo», either it is another person or it is her, misremembered.", "What the photograph does prove, beyond argument: THEY ARRIVED TOGETHER AND HAD A PORTRAIT TAKEN. Four brothers from a village in Calabria, in their good suits and with their hats in their hands, posing in front of a painted palm tree on the day they began another life. It is the only image of this family earlier than the grandparents' generation."], "imgs": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1920s%20F%20Los%20cuatro%20hermanos%20Salerno%20recien%20llegados%20a%20Argentina.jpg", "t": "1920s F Los cuatro hermanos Salerno recien llegados a Argentina"}], "zooms": []}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "28 October 1899, 10:40 h", "lugar": "Rende", "ref": "record 231", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Handwritten year", "«milleottocento novantanove» — agrees with the catalogue"], ["Register", "an_ua35983869 · hash LyxaADX"], ["Page", "86 of 115"], ["Registrar", "Pisani Domenico, senior assessor"]], "literal": "…a cui dà il nome di Settimo, e ch'è gemello un altro mi conserva l'atto seguente.\n\nIl dichiarante ha inoltre attestato che il bambino suddetto è il primo nato.", "traduccion": "In the year eighteen hundred and ninety-nine, on the twenty-eighth day of October, at twenty to eleven in the morning, at the town hall, before Pisani Domenico, senior assessor for the mayor being indisposed, there appeared SALERNO FRANCESCO, aged twenty-eight, farmhand, resident at Rende.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife living with him, there was born on the twenty-fourth of the current month, at half past four in the morning, in the house situated in contrada Campagnano, a child of the male sex, to whom he gives the name SETTIMO, and who is the twin of another recorded in the following entry.\n\nWitnesses: Perri Pietro, aged sixty-one, farmhand; and Spizzirri Giovanni, aged forty-six, farmhand, both resident in the comune.\n\nThe informant further attested that the said child is THE FIRST BORN.", "notas": ["THE NAME IS NOT «SETTINO» BUT SETTIMO. The index that was the starting point transcribes it wrongly. The original record says it clearly both in the body and in the marginal heading.", "The father's age (28) is CORRECT, born in December 1870. It is one of the few times Francesco declares his age accurately.", "«Settimo» means seventh, but by the index he is the fourth documented child. Either the name is only a name, or there were siblings before 1899 who are not on record. It is proof of nothing, but it points towards the fourteen children of family memory."], "imgs": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20Settimo%20Salerno%20-%20Rende%20acta%20231.jpg", "t": "Settimo Salerno - Rende acta 231"}], "zooms": [{"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20completa.jpg", "t": "Acta 231 completa"}, {"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20231%20entera%20y%20margen%20sin%20anotaciones.jpg", "t": "Acta 231 entera y margen sin anotaciones"}, {"u": "../actas/1899%20-%20Settimo%20Salerno/1899-10-24%20N%20zoom%20-%20nombre%20Settimo%20y%20mencion%20del%20gemelo.jpg", "t": "Nombre Settimo y mencion del gemelo"}]}], "nActas": 3, "nImgs": 7, "titulo": "Twenty-five minutes the elder", "parrafos": ["He was born on 24 October 1899 at half past four in the morning, in the contrada Campagnano at Rende. His brother Saverio was born twenty-five minutes later. Four days after, on 28 October at twenty to eleven in the morning, their father registered them in two consecutive records, with the same two witnesses and five minutes between one and the other.", "That they were twins is not an inference from the closeness of the numbers: both records say so in writing and refer to each other. His says «e ch'è gemello un altro mi conserva l'atto seguente»; Saverio's, «l'atto precedente». And his adds a line nobody was obliged to write: «Il dichiarante ha inoltre attestato che il bambino suddetto è IL PRIMO NATO». The order of birth was supplied by the father himself, not by a midwife.", "The index this investigation started from calls him «Settino». The original record says SETTIMO, quite clearly, both in the body and in the marginal heading. Settimo is the ordinary Italian name for a seventh child; on paper he is the fourth documented. Either the name is only a name, or there were earlier children who are not recorded. It proves nothing, but it points towards the fourteen children of family memory.", "He belongs to the class of '99, the ragazzi del '99, the cohort Italy called up in 1917 at barely eighteen; the family keeps his First World War medals. He ended up at Santa Fe, Argentina, where he went by Setimio. His wife, Cristina Rizzo, died there in November 1967, and he between 1977 and 1980, aged seventy-eight or eighty-one. He does not appear in the index of arrivals at the port of Buenos Aires under any spelling of his name."], "claves": [["Birth", "24 October 1899, 4:30 a.m., contrada Campagnano"], ["Twin", "of Saverio, twenty-five minutes younger"], ["The record says", "«il primo nato», the first born"], ["His name", "Settimo — the index calls him Settino and is wrong"], ["Afterwards", "the class of 1899, the war; and Santa Fe, Argentina, as Setimio"]]}, "saverio": {"id": "saverio", "nombre": "Saverio Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Settimo's twin, the second born, twenty-five minutes later. He was 20 in 1919.", "datos": [["Birth", "24 October 1899, 4:55 a.m., Rende — record 232"], ["Place", "contrada Campagnano"], ["Twin of", "Settimo"], ["Order of birth", "«il secondo nato» — the second born"], ["Parents", "Salerno Francesco (28 years old) and Chiappetta Filomena"]], "vida": "b.1899", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "angelina", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "28 October 1899, 10:45 h", "lugar": "Rende", "ref": "record 232", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Register", "an_ua35983869 · hash LyxaADX"], ["Page", "87 of 115"], ["Detail", "drawn up five minutes after record 231"]], "literal": "…a cui dà il nome di Saverio, e ch'è gemello un altro mi conserva l'atto precedente.\n\nIl dichiarante ha inoltre attestato che il bambino soddetto è il secondo nato.", "traduccion": "In the year eighteen hundred and ninety-nine, on the twenty-eighth day of October, at a quarter to eleven in the morning — five minutes after the preceding record — at the town hall, before Pisani Domenico, there appeared SALERNO FRANCESCO, aged twenty-eight, farmhand.\n\nHe declares that of CHIAPPETTA FILOMENA, countrywoman, his wife, there was born on the twenty-fourth of the current month, at four fifty-five in the morning, in the house situated in contrada Campagnano, a child of the male sex, to whom he gives the name SAVERIO, and who is the twin of another recorded in the preceding entry.\n\nWitnesses: the same two as in the preceding record.\n\nThe informant further attested that the said child is THE SECOND BORN.", "notas": ["The twins are not an inference from the proximity of the numbers: the two records say so in writing and refer to one another.", "The fact of the double birth is supplied by the father himself («il dichiarante ha inoltre attestato»), not by the midwife."], "imgs": [{"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20Saverio%20Salerno%20-%20Rende%20acta%20232.jpg", "t": "Saverio Salerno - Rende acta 232"}], "zooms": [{"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20acta%20232%20completa.jpg", "t": "Acta 232 completa"}, {"u": "../actas/1899%20-%20Saverio%20Salerno/1899-10-24%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}]}], "nActas": 1, "nImgs": 3, "titulo": "The second, by twenty-five minutes", "parrafos": ["He was born at four fifty-five in the morning on 24 October 1899, in the same house in the contrada Campagnano and twenty-five minutes after his brother.", "His record was drawn up at ten forty-five on 28 October, five minutes after Settimo's, before the same official and with the same two witnesses — Perri Pietro, sixty-one, and Spizzirri Giovanni, forty-six, both farmhands. It closes with the mirror of the other's formula: «il bambino soddetto è IL SECONDO NATO». None of those present signed.", "In 1919 he was twenty and was one of those who left. He does not appear in the Buenos Aires arrivals index, just like his twin."], "claves": [["Birth", "24 October 1899, 4:55 a.m., contrada Campagnano"], ["Twin", "of Settimo, twenty-five minutes older"], ["The record says", "«il secondo nato», the second born"], ["In 1919", "20 years old; emigrated"]]}, "angelina": {"id": "angelina", "nombre": "Angelina Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born in contrada Campagnano on 14 May 1902 and dead in contrada Sant'Agostino on 29 August 1910, aged eight years and three months. She did not emigrate.", "datos": [["Birth", "14 May 1902, 12:30, Rende — record 55"], ["Place of birth", "contrada Campagnano"], ["Death", "29 August 1910, noon, Rende — record 81"], ["Place of death", "contrada Sant'Agostino"], ["Age at death", "eight years and three months (the record says ten, and is wrong)"], ["Parents", "Salerno Francesco and Chiappetta Filomena"]], "vida": "1902–1910", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "giovanni_hijo", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "16 May 1902, 10:05 h", "lugar": "Rende", "ref": "record 55", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 94 «Nati» 1902"], ["Register", "an_ua35988531 · hash LNyKqBl"], ["Page", "21 of 77"], ["Handwritten year", "«millenovecento due» — agrees with the catalogue"], ["Registrar", "Pisani Domenico, assessor for the mayor being indisposed"]], "literal": "è comparso Salerno Francesco, di anni trenta, bracciante, domiciliato in Rende…\n…nella casa posta in contrada Campagnano, da Chiappetta Filomena sua moglie\ncontadina seco lui convivente… il nome di Angelina", "traduccion": "In the year nineteen hundred and two, on the sixteenth day of May, at five past ten in the morning, at the town hall, before Pisani Domenico, assessor for the mayor being indisposed, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty, BRACCIANTE (day labourer), resident at Rende.\n\nHe declares that at half past twelve on the fourteenth of the current month, in the house situated in CONTRADA CAMPAGNANO, of CHIAPPETTA FILOMENA, his wife, countrywoman, living with him, there was born a child of the female sex whom he presents to me, and to whom he gives the name ANGELINA.\n\nWitnesses: Presta Francesco, aged twenty-six, day labourer; and Bartucci Antonio, aged seventy, farmhand, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only Domenico Pisani signs.", "notas": ["The margin of record 55 is BLANK: Angelina's death in 1910 was never annotated in the margin of her birth record, even though the death record exists and is right here alongside.", "The father's trade shifts over the years: «contadino» in 1899, «bracciante» here in 1902, and «contadino» again in 1904, 1907 and 1909.", "The contrada also changes: Campagnano in 1899 and 1902, Santo Agostino from 1904 onwards."], "imgs": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20Angelina%20Salerno%20-%20Rende%20acta%2055.jpg", "t": "Angelina Salerno - Rende acta 55"}], "zooms": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20acta%2055%20completa.jpg", "t": "Acta 55 completa"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1902-05-14%20N%20zoom%20-%20padre%20Francesco%20Salerno%20y%20contrada%20Campagnano.jpg", "t": "Padre Francesco Salerno y contrada Campagnano"}]}, {"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "30 August 1910, 13 h", "lugar": "Rende", "ref": "record 81", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 102 «Morti» 1910"], ["Register", "an_ua35988770 · hash LPAJpg1"], ["Page", "23 of 54"], ["Handwritten year", "«millenovecento dieci» — agrees with the catalogue"], ["Registrar", "Vercillo Giuseppe, assessor for the mayor"]], "literal": "sono comparsi Salerno Domenico, di anni cinquanta, contadino, domiciliato in Rende,\ne Chiappetta Giovanni, di anni sessanta, contadino, domiciliato in Rende…\n…nella casa posta in contrada Sant'Agostino… è morta Salerno Angelina,\ndi anni dieci… nata in Rende da Francesco… e da Chiappetta Filomena", "traduccion": "In the year nineteen hundred and ten, on the thirtieth day of August, at thirteen hours, at the town hall, before VERCILLO GIUSEPPE, assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO DOMENICO, aged fifty, farmhand, resident at Rende, and CHIAPPETTA GIOVANNI, aged sixty, farmhand, resident at Rende.\n\nWho declared to me that at twelve o'clock YESTERDAY, in the house situated in CONTRADA SANT'AGOSTINO, there died SALERNO ANGELINA, aged ten, countrywoman, resident at Rende, born at Rende, daughter of FRANCESCO, farmhand, resident at Rende, and of CHIAPPETTA FILOMENA, countrywoman, resident at Rende.\n\nWitnesses: Perri Domenico, aged twenty-six, farmhand; and Vercillo Ferdinando, aged thirty-five, BARBER, both resident in this comune.\n\nThe record having been read to all present, I signed it with the informant CHIAPPETTA and with the witness VERCILLO, the others having stated that they were illiterate.", "notas": ["THE AGE ON THE RECORD IS WRONG. It says «di anni dieci», ten years. Angelina was born on 14 May 1902 — her birth record is right here — so on 29 August 1910 she was EIGHT YEARS AND THREE MONTHS old. Those who declare are not the parents but an uncle and a grandfather, and they round upwards.", "THE DECLARANTS ARE THE GOOD DATA. The first, SALERNO DOMENICO aged fifty, is Francesco's elder brother: ten weeks later he was marrying Giuseppina Cairo and declaring fifty-one. The two figures cross at a birth in about 1859.", "The second, CHIAPPETTA GIOVANNI aged sixty, is Filomena's father, the maternal grandfather. He was already on record as her father in the birth record of 1877. He was still alive, and HE COULD SIGN: he is one of the few in the family who does not sign with a cross.", "Neither of the girl's parents appears."], "imgs": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20Angelina%20Salerno%20-%20Rende%20acta%2081.jpg", "t": "Angelina Salerno - Rende acta 81"}], "zooms": [{"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20acta%2081%20completa.jpg", "t": "Acta 81 completa"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20declarantes%20Salerno%20Domenico%20y%20Chiappetta%20Giovanni.jpg", "t": "Declarantes Salerno Domenico y Chiappetta Giovanni"}, {"u": "../actas/1902%20-%20Angelina%20Salerno/1910-08-29%20D%20zoom%20-%20testigos%20y%20firmas.jpg", "t": "Testigos y firmas"}]}], "nActas": 2, "nImgs": 8, "titulo": "The record made her ten", "parrafos": ["She was born on 14 May 1902 at half past twelve, in the contrada Campagnano. Her father registered her two days later and declared thirty years: he was thirty-one. The witnesses were Presta Francesco, a twenty-six-year-old day labourer, and Bartucci Antonio, a seventy-year-old farmhand.", "She died on 29 August 1910 at noon, in the contrada Sant'Agostino, in the same house where her brothers Giovanni and Arturo and her sister Maria had been born. The death record says «di anni dieci», ten years old. It is wrong, and the proof is two registers away: her own birth record. She was eight years and three months old.", "It was not her parents who reported the death. It was her uncle Salerno Domenico, fifty, and her maternal grandfather, Chiappetta Giovanni, sixty, and between them they rounded the child's age badly. The grandfather signed the record; the others declared themselves illiterate. The witnesses were a twenty-six-year-old farmhand and a thirty-five-year-old barber.", "The margin of her birth record is blank: the death was never noted there, although the record exists and sits in the next register along. For a time it was assumed that Angelina had emigrated to Argentina with the family. She did not: she died nine years before her brothers sailed."], "claves": [["Birth", "14 May 1902, 12:30, contrada Campagnano"], ["Death", "29 August 1910, noon, contrada Sant'Agostino"], ["Real age at death", "eight years and three months — the record says ten"], ["Who reported it", "her uncle and her grandfather; neither parent"]]}, "giovanni_hijo": {"id": "giovanni_hijo", "nombre": "Giovanni Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born on the first day of 1904, four years after the death of the uncle whose name he carried. He was 15 in 1919 — and in 1926 he married at Rende.", "datos": [["Birth", "1 January 1904, 2 a.m., Rende — record 5"], ["Place", "contrada Santo Agostino"], ["Parents", "Salerno Francesco and Chiappetta Filomena"], ["Marriage", "24 July 1926, Rende — record 34, to Cundari Anna"]], "vida": "b.1904", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": "anna_cundari", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "arturo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "3 January 1904, 10 h", "lugar": "Rende", "ref": "record 5", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 96 «Nati» 1904"], ["Register", "an_ua35988725 · hash LeNPZXl"], ["Page", "4 of 93"], ["Handwritten year", "«millenovecento quattro» — agrees with the catalogue"], ["Registrar", "Mercavallo Michelangelo, secretary delegate"]], "literal": "è comparso Salerno Francesco, di anni trentaquattro, contadino, domiciliato in Rende…\n…del dì primo del corrente mese, nella casa posta in contrada Santo Agostino,\nda Chiappetta Filomena, sua moglie, contadina, seco lui convivente… il nome di Giovanni", "traduccion": "In the year nineteen hundred and four, on the third day of January, at ten in the morning, at the town hall, before MERCAVALLO MICHELANGELO, secretary delegated by act of the mayor dated the twentieth of August nineteen hundred and two, approved, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-four, farmhand, resident at Rende.\n\nHe declares that at two in the morning on the FIRST of the current month, in the house situated in CONTRADA SANTO AGOSTINO, of CHIAPPETTA FILOMENA, his wife, countrywoman, living with him, there was born a child of the male sex whom he presents to me, and to whom he gives the name GIOVANNI.\n\nWitnesses: Cosentino Rosario, aged thirty-four, farmhand; and Alfano Domenico, aged forty-five, farmhand, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only M. Mercavallo signs.", "notas": ["MARGINAL ANNOTATION, in a later hand and with a flourish: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». Giovanni married in Rende on 24 July 1926, record no. 34, to CUNDARI ANNA. New information.", "And weighty information: if he married in Rende in 1926, either he did not embark with the family in 1919 or he came back. The assumption that they all emigrated should be reviewed.", "He was born on 1 January: he is among the first births of the year, and that is why his record bears the number 5 and is almost at the beginning of the volume — the index of this register is very short indeed.", "The family is already living in contrada Santo Agostino; in 1902, with Angelina, they were in Campagnano."], "imgs": [{"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20Giovanni%20Salerno%20-%20Rende%20acta%205.jpg", "t": "Giovanni Salerno - Rende acta 5"}], "zooms": [{"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20acta%205%20completa.jpg", "t": "Acta 5 completa"}, {"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201926%20con%20Cundari%20Anna.jpg", "t": "Anotacion marginal matrimonio 1926 con Cundari Anna"}, {"u": "../actas/1904%20-%20Giovanni%20Salerno%20hijo/1904-01-01%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 4, "titulo": "He stayed at Rende", "parrafos": ["He was born on 1 January 1904 at two in the morning, in the contrada Santo Agostino: the family's first birth of the year, and one of the register's first records, number 5. His father registered him on the 3rd at ten in the morning and declared thirty-four years. He carries the name of his uncle, dead four years earlier at twenty-six.", "In the margin of the record a later hand wrote, with a flourish: «Addì 24-7-1926 in Rende n° 34 sposò Cundari Anna». He married at Rende on 24 July 1926. That line changed the story: if he was in the village in 1926, either he never sailed or he came back. He was fifteen when the older ones left.", "It is the document that best supports what the family tells: that the household split in two, that the elder brothers crossed, and that Francesco and Filomena stayed at Rende with the younger ones. And it means there is a living branch there, descended from Giovanni and Anna Cundari."], "claves": [["Birth", "1 January 1904, 2 a.m., contrada Santo Agostino"], ["Marginal note", "married at Rende on 24 July 1926 to Cundari Anna"], ["In 1919", "15 years old; he stayed"], ["He carries the name", "of his uncle Giovanni, dead in 1900"]]}, "arturo": {"id": "arturo", "nombre": "Arturo Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "Born before dawn on 21 December 1907 and registered that same morning. He was 12 in 1919.", "datos": [["Birth", "21 December 1907, 4:30 a.m., Rende — record 215"], ["Place", "contrada S. Agostino"], ["Parents", "Salerno Francesco and Chiappetta Filomena"]], "vida": "b.1907", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "maria"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "21 December 1907, 11:50 h", "lugar": "Rende", "ref": "record 215", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 99, suppl. 2 «Nati» 1907"], ["Register", "an_ua35988728 · hash wOpm92Y"], ["Page", "77 of 94"], ["Handwritten year", "«millenovecento sette» — agrees with the catalogue"], ["Registrar", "Pisani Domenico, assessor for the mayor"]], "literal": "è comparso Salerno Francesco di anni trentotto, contadino, domiciliato in Rende…\n…alle ore quattro e minuti trenta, del dì ventuno del corrente mese, nella casa\nposta in contrada S. Agostino, da Chiappetta Filomena, contadina, sua moglie\nseco lui convivente… il nome di Arturo", "traduccion": "In the year nineteen hundred and seven, on the twenty-first day of December, at ten to twelve in the morning, at the town hall, before PISANI DOMENICO, assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-eight, farmhand, resident at Rende.\n\nHe declares that at half past four in the morning on the twenty-first of the current month, in the house situated in CONTRADA S. AGOSTINO, of CHIAPPETTA FILOMENA, countrywoman, his wife, living with him, there was born a child of the male sex whom he presents to me, and to whom he gives the name ARTURO.\n\nWitnesses: Sicilia Pasquale, aged sixty-one, CARPENTER; and Bruno Giovanni, aged seventy-seven, SHOEMAKER, both resident in this comune.\n\nThe record having been read to those present, they did not sign it with me, being illiterate, as they declared. Only Domenico Pisani signs.", "notas": ["He was born and registered ON THE SAME DAY: birth at 4.30 in the morning, record at 11.50 in the morning, seven hours later. It is the fastest registration in the whole family.", "The two witnesses are not countrymen, as is usually the case, but village artisans: a carpenter of 61 and a shoemaker of 77.", "The volume is Reg. 99 «suppl. 2». The «normal» Reg. 99 has only two pages: it is a remnant. The supplement closes with the signature of Domenico Pisani on 1 January 1908."], "imgs": [{"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20Arturo%20Salerno%20-%20Rende%20acta%20215.jpg", "t": "Arturo Salerno - Rende acta 215"}], "zooms": [{"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20acta%20215%20completa.jpg", "t": "Acta 215 completa"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20fechas%20y%20padre%20Francesco%20Salerno.jpg", "t": "Fechas y padre Francesco Salerno"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1907%20-%20Arturo%20Salerno/1907-12-21%20N%20zoom%20-%20testigos%20y%20firma.jpg", "t": "Testigos y firma"}]}], "nActas": 1, "nImgs": 5, "titulo": "A carpenter and a shoemaker", "parrafos": ["He was born on 21 December 1907 at half past four in the morning, in the contrada S. Agostino, and his father registered him that same morning at ten to twelve: seven hours after the birth.", "The witnesses on his record are not the usual day labourers. Signing as witnesses are Sicilia Pasquale, a sixty-one-year-old carpenter, and Bruno Giovanni, a seventy-seven-year-old shoemaker — two village trades and two old men. Francesco declared thirty-eight years on the very day he turned thirty-seven.", "His record sits in a treacherous volume: Rende's «ordinary» register 99 has only two pages, and the real one is «supple
