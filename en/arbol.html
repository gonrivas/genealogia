    ? '<div class="tit">Descendientes de ' + esc(p.nombre) + '</div>' + bajada(foco, 0)
    : '';
  $('#bAtras').disabled = !hist.length;
  titulo();
  franja();
  requestAnimationFrame(() => { hilos(); rotulos(); });
}

function hilos(){
  const svg = $('#hilos'), pista = $('#pista');
  const R = pista.getBoundingClientRect();
  /* el rect llega YA escalado y el SVG vive dentro del contenedor escalado:
     hay que devolver las medidas a escala 1 o las líneas saldrían al doble. */
  const E = escala || 1;
  svg.setAttribute('width', pista.scrollWidth);
  svg.setAttribute('height', pista.scrollHeight);
  let d = `<defs>
    <marker id="pf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="pfd" class="d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>`;
  pista.querySelectorAll('.dn').forEach(n => {
    const fila = n.children[0];
    if(!fila) return;
    const padre = fila.children[0];
    const kids = fila.querySelector(':scope > .kids');
    if(!padre || !kids) return;
    const a = padre.getBoundingClientRect();
    const x1 = (a.right - R.left)/E, y1 = (a.top + a.height/2 - R.top)/E;
    [...kids.children].forEach(c => {
      const t = c.querySelector('.fila > .card, .fila > .vacio');
      if(!t) return;
      const b = t.getBoundingClientRect();
      const x2 = (b.left - R.left)/E, y2 = (b.top + b.height/2 - R.top)/E;
      const mx = x1 + (x2 - x1) * 0.5;
      const dir = t.classList.contains('dir') && padre.classList.contains('dir');
      d += `<path class="${dir?'dir':''}" marker-end="url(#${dir?'pfd':'pf'})" d="M ${x1} ${y1} H ${mx} V ${y2} H ${x2}"/>`;
    });
  });
  pista.querySelectorAll('.n').forEach(n => {
    const hijo = n.children[0];
    const up = n.querySelector(':scope > .up');
    if(!up || !hijo.classList.contains('card') && !hijo.classList.contains('vacio')) return;
    if(!up) return;
    const a = hijo.getBoundingClientRect();
    const x1 = (a.right - R.left)/E, y1 = (a.top + a.height/2 - R.top)/E;
    [...up.children].forEach(c => {
      const t = c.children[0];
      if(!t) return;
      const b = t.getBoundingClientRect();
      const x2 = (b.left - R.left)/E, y2 = (b.top + b.height/2 - R.top)/E;
      const mx = x1 + (x2 - x1) * 0.5;
      const dir = t.classList.contains('dir') && hijo.classList.contains('dir');
      d += `<path class="${dir?'dir':''}" marker-end="url(#${dir?'pfd':'pf'})" d="M ${x2} ${y2} H ${mx} V ${y1} H ${x1}"/>`;
    });
  });
  svg.innerHTML = d;
}

function rotulos(){
  const pista = $('#pista'), R = pista.getBoundingClientRect();
  const cols = new Map();
  /* #grados vive fuera de #pista y por tanto NO está escalado: sus posiciones
     van en píxeles de pantalla, que es justo lo que devuelve el rect. */
  pista.querySelectorAll('.n > .card, .n > .vacio').forEach(c => {
    const n = +c.parentElement.dataset.nivel;
    const r = c.getBoundingClientRect();
    const x = r.left - R.left + r.width/2;
    if(!cols.has(n)) cols.set(n, x);
  });
  $('#grados').style.width = pista.getBoundingClientRect().width + 'px';
  $('#grados').innerHTML = [...cols.entries()]
    .filter(([n]) => n > 0 && GRADOS[n])
    .map(([n,x]) => `<span style="left:${x}px">${GRADOS[n]}</span>`).join('');
}

function franja(){
  const p = G[foco]; if(!p) return;
  const chip = (id, extra='') => {
    const q = G[id]; if(!q) return '';
    return `<button class="chip ${DIRECTA.has(id)?'dir':''}" data-id="${id}">${esc(q.nombre)}${extra}</button>`;
  };
  let h = `<div class="grupo"><b>${L.fFicha}</b>${chip(foco)}</div>`;
  if(p.conyuge) h += `<div class="grupo"><b>${L.fConyuge}</b>${chip(p.conyuge)}</div>`;
  if(p.hermanos.length) h += `<div class="grupo"><b>${L.fHermanos}</b>${p.hermanos.map(i=>chip(i)).join('')}</div>`;
  if(p.hijos.length) h += `<div class="grupo"><b>${L.fHijos}</b>${p.hijos.map(i=>chip(i)).join('')}</div>`;
  $('#familia').innerHTML = h;
  document.documentElement.style.setProperty('--fh', $('#familia').offsetHeight + 'px');
  $('#lienzo').style.bottom = $('#familia').offsetHeight + 'px';
}

/* ─────────── ficha lateral ─────────── */
function imgs(a){
  let h = '';
  a.imgs.forEach(i => {
    h += `<figure><a href="${i.u}" target="_blank" rel="noopener"><img loading="lazy" src="${i.u}" alt="${esc(i.t)}"></a>
      <figcaption>${esc(i.t)}<span class="lupa">${L.ampliar}</span></figcaption></figure>`;
  });
  if(a.zooms.length){
    h += '<div class="zz">' + a.zooms.map(i =>
      `<figure><a href="${i.u}" target="_blank" rel="noopener"><img loading="lazy" src="${i.u}" alt="${esc(i.t)}"></a>
       <figcaption>${esc(i.t)}</figcaption></figure>`).join('') + '</div>';
  }
  return h;
}

function abre(id){
  const p = G[id]; if(!p) return;
  const enl = l => l.filter(x=>G[x]).map(x =>
    `<a data-id="${x}">${esc(G[x].nombre)}</a>`).join(' · ');
  let h = `<div class="top">
      <button class="cerrar" aria-label="cerrar">✕</button>
      <span class="rol ${DIRECTA.has(id)?'dir':''}">${esc(p.rolNombre||p.rol||'')}</span>
      <h2>${esc(p.nombre)}</h2>
      ${p.legal?`<div class="legal">${L.legal}<b>${esc(p.legal)}</b></div>`:''}
      ${p.titulo?`<div class="epi">${esc(p.titulo)}</div>`:''}
    </div><div class="cuerpo">`;

  if(p.resumen) h += `<p class="res">${esc(p.resumen)}</p>`;
  if(p.claves && p.claves.length)
    h += '<div class="claves">' + p.claves.map(c =>
      `<div class="clave"><b>${esc(c[0])}</b>${esc(c[1])}</div>`).join('') + '</div>';
  if(p.parrafos && p.parrafos.length)
    h += '<div class="rel">' + p.parrafos.map(t=>`<p>${esc(t)}</p>`).join('') + '</div>';

  if(p.ramas && p.ramas.length)
    h += `<p class="linaje"><span>${L.rama}</span><span class="rama">${esc(p.ramas.map(c=>RAMAS[c]).join(' · '))}</span></p>`;

  const pad = [p.padre,p.madre].filter(Boolean);
  if(pad.length) h += `<p class="linaje"><span>${L.hijoDe}</span>${enl(pad)}</p>`;
  if(p.conyuge) h += `<p class="linaje"><span>${p.unionLibre ? L.parejaDe : L.casoCon}</span>${enl([p.conyuge])}</p>`;
  (p.otrasParejas||[]).forEach(u => {
    h += `<p class="linaje"><span>${esc(u[1])}</span>${enl([u[0]])}</p>`;
  });
  if(p.hijos.length) h += `<p class="linaje"><span>${L.padreDe}</span>${enl(p.hijos)}</p>`;

  if(p.datos && p.datos.length)
    h += '<dl class="dat">' + p.datos.map(d =>
      `<dt>${esc(d[0])}</dt><dd>${escEnl(d[1])}</dd>`).join('') + '</dl>';

  if(p.mapa){
    const m = p.mapa, dx = 0.0032, dy = 0.0016;
    const bb = [(m.lon-dx).toFixed(5),(m.lat-dy).toFixed(5),
                (m.lon+dx).toFixed(5),(m.lat+dy).toFixed(5)].join(',');
    const src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bb +
                '&layer=mapnik&marker=' + m.lat.toFixed(5) + ',' + m.lon.toFixed(5);
    const full = 'https://www.openstreetmap.org/?mlat=' + m.lat.toFixed(5) +
                 '&mlon=' + m.lon.toFixed(5) + '#map=17/' + m.lat.toFixed(5) + '/' + m.lon.toFixed(5);
    h += '<figure class="mapa"><figcaption class="mapa-tit">' + esc(m.titulo) + '</figcaption>' +
         '<iframe src="' + esc(src) + '" title="' + esc(m.titulo) + '"></iframe>' +
         '<figcaption class="mapa-pie">' + escEnl(m.pie) +
         ' <a class="ext" href="' + esc(full) + '" target="_blank" rel="noopener">' + L.pantalla + '</a>' +
         '</figcaption></figure>';
  }

  if(p.actas.length){
    h += `<h3 class="sec">${p.actas.length} ${p.actas.length>1?L.actas:L.acta} · ${L.leidas}</h3>`;
    p.actas.forEach(a => {
      h += `<article class="acta"><div class="hd">
          <span class="pill">${esc(a.tipoNombre)}</span>
          <h4>${esc(a.titulo)}</h4>
          <div class="ref">${esc(a.lugar)} · ${esc(a.ref)} · ${esc(a.fecha)}</div>
        </div>`;
      h += imgs(a);
      if(a.fuente && a.fuente.length)
        h += '<dl class="fuente">' + a.fuente.map(f =>
          `<dt>${esc(f[0])}</dt><dd>${escEnl(f[1])}</dd>`).join('') + '</dl>';
      if(a.literal) h += `<h5 class="rot">${L.literal}</h5><div class="lit">${esc(a.literal)}</div>`;
      if(a.traduccion) h += `<h5 class="rot">${L.traduccion}</h5><div class="tra">` + a.traduccion.split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('') + '</div>';
      if(a.notas && a.notas.length)
        h += `<h5 class="rot">${L.notas}</h5><div class="notas"><ul>` + a.notas.map(n=>`<li>${esc(n)}</li>`).join('') + '</ul></div>';
      h += '</article>';
    });
  } else if(p.sinacta){
    h += `<h3 class="sec">${L.sinActa}</h3><div class="pend"><b>${L.loQueSabemos}</b><p>${esc(p.sinacta)}</p></div>`;
  }

  h += '</div>';
  $('#ficha').innerHTML = h;
  $('#ficha').classList.add('on');
  $('#ficha').setAttribute('aria-hidden','false');
  $('#velo').classList.add('on');
  $('#ficha').scrollTop = 0;
}
function cierra(){
  $('#ficha').classList.remove('on');
  $('#ficha').setAttribute('aria-hidden','true');
  $('#velo').classList.remove('on');
}

/* ─────────── eventos ─────────── */
document.addEventListener('click', ev => {
  const sub = ev.target.closest('[data-foco]');
  if(sub){ ev.stopPropagation(); irA(sub.dataset.foco); return; }
  if(ev.target.closest('.cerrar') || ev.target.id==='velo'){ cierra(); return; }
  const t = ev.target.closest('[data-id]');
  if(t){ abre(t.dataset.id); return; }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){
    if($('#ficha').classList.contains('on')) cierra();
    else if(document.activeElement !== $('#q')) atras();
  }
  if((ev.key === 'Backspace' || ev.key === 'ArrowLeft') && ev.altKey) atras();
});
$('#bAtras').onclick = atras;
$('#bDir').onclick = e => { soloDir = !soloDir; e.target.classList.toggle('on', soloDir); pinta(); };

/* ── buscador ── */
const TODOS = Object.values(G).map(p => ({
  id:p.id, n:p.nombre,
  k:(p.nombre+' '+(p.legal||'')).toLowerCase()
     .normalize('NFD').replace(/[̀-ͯ]/g,''),
  v:vida(p)
})).sort((a,b) => a.n.localeCompare(b.n,'es'));

function sugerir(){
  const t = $('#q').value.trim().toLowerCase()
            .normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(!t){ $('#sug').classList.remove('on'); return; }
  const r = TODOS.filter(x => x.k.includes(t)).slice(0, 14);
  $('#sug').innerHTML = r.length
    ? r.map(x => `<button data-ver="${x.id}">${esc(x.n)}${x.v?`<i>${esc(x.v)}</i>`:''}</button>`).join('')
    : '<button disabled style="color:var(--faint)">Nadie con ese nombre</button>';
  $('#sug').classList.add('on');
}
$('#q').addEventListener('input', sugerir);
$('#q').addEventListener('focus', sugerir);
$('#q').addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ $('#q').value=''; $('#sug').classList.remove('on'); $('#q').blur(); }
  if(ev.key === 'Enter'){
    const b = $('#sug').querySelector('button[data-ver]');
    if(b){ irA(b.dataset.ver); $('#q').value=''; $('#sug').classList.remove('on'); $('#q').blur(); }
  }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('#sug button[data-ver]');
  if(b){ irA(b.dataset.ver); $('#q').value=''; $('#sug').classList.remove('on'); return; }
  if(!ev.target.closest('.buscar')) $('#sug').classList.remove('on');
});
/* ─────────── zoom visual ───────────
   Escala el lienzo entero sin volver a calcular el árbol: sirve para que quepa
   más de golpe. Es distinto de + y −, que añaden o quitan GENERACIONES. */
function zoom(z, centrar){
  const l = $('#lienzo');
  const antes = escala;
  escala = Math.min(2, Math.max(0.35, +z.toFixed(2)));
  const cx = l.scrollLeft + l.clientWidth/2, cy = l.scrollTop + l.clientHeight/2;
  $('#pista').style.transform = escala === 1 ? '' : `scale(${escala})`;
  $('#zPct').textContent = Math.round(escala*100) + '%';
  /* Los rótulos de generación viven FUERA del contenedor escalado, así que sus
     posiciones hay que volver a medirlas: si no, se quedan donde estaban al 100%
     y quedan desfasados respecto a las columnas. */
  requestAnimationFrame(rotulos);
  if(centrar !== false){
    const k = escala/antes;
    l.scrollLeft = cx*k - l.clientWidth/2;
    l.scrollTop  = cy*k - l.clientHeight/2;
  }
}
$('#zMas').onclick   = () => zoom(escala + (escala < 1 ? 0.1 : 0.2));
$('#zMenos').onclick = () => zoom(escala - (escala <= 1 ? 0.1 : 0.2));
$('#zPct').onclick   = () => zoom(1);
addEventListener('keydown', ev => {
  if(ev.target.tagName === 'INPUT') return;
  if(ev.key === '+' || ev.key === '=') { ev.preventDefault(); $('#zMas').onclick(); }
  if(ev.key === '-' || ev.key === '_') { ev.preventDefault(); $('#zMenos').onclick(); }
  if(ev.key === '0') { ev.preventDefault(); zoom(1); }
});
/* ctrl/⌘ + rueda: zoom, como en cualquier mapa */
$('#lienzo').addEventListener('wheel', ev => {
  if(!(ev.ctrlKey || ev.metaKey)) return;
  ev.preventDefault();
  zoom(escala + (ev.deltaY < 0 ? 0.08 : -0.08));
}, {passive:false});

$('#bMas').onclick = () => { prof = Math.min(prof+1, 9); pinta(); };
$('#bMenos').onclick = () => { prof = Math.max(prof-1, 1); pinta(); };
function altoCabecera(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
}
altoCabecera();
addEventListener('resize', () => { altoCabecera(); hilos(); rotulos(); });
if(window.ResizeObserver) new ResizeObserver(altoCabecera).observe(document.querySelector('header'));

const ini = (location.hash||'').slice(1);
if(ini && G[ini]) foco = ini;
pinta();
</script>
</body>
</html>
