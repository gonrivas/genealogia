ipoNombre": "Death", "fecha": "13 de mayo de 1867, 16 h", "lugar": "Rende", "ref": "acta 35", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 59 «Morti» 1867"], ["Registro", "an_ua35985546 · hash LD1KnvN"], ["Página", "11 de 36"], ["Registrar", "Luigi Perugini, asesor por el alcalde impedido"], ["Año manuscrito", "«milleottocento sessantasette» — coincide con el catálogo"]], "literal": "…è morto Giacomo Palermo, di anni sessanta, di professione pecoraio, domiciliato a Rende, marito di Carmina Volpintesta fu Vincenzo, nato a Marano Marchesato, figlio del fu Giuseppe.", "traduccion": "In the year eighteen hundred and sixty-seven, on the fourteenth day of the month of May, at seventeen hours, at the town hall of Rende, circondario of Cosenza, province of Calabria Citeriore.\n\nBefore me, LUIGI PERUGINI, acting assessor for the mayor being indisposed, Registrar of the Civil Status of the said comune, there appeared PASQUALE SACCO, son of the late Antonio, aged fifty, by trade a VETTURALE (carter), and COSTANTINO PERUGINI, son of the late Domenico, aged forty-two, by trade a SARTORE (tailor), both resident at Rende.\n\nWho declared to me that on the thirteenth day of the month aforesaid, at sixteen hours, in this comune of Rende, in the house of his dwelling situated in the contrada Nocolitani (uncertain reading), there died GIACOMO PALERMO, AGED SIXTY, by trade a PECORAIO (shepherd), resident at Rende, HUSBAND OF CARMINA VOLPINTESTA, daughter of the late Vincenzo, BORN AT MARANO MARCHESATO, SON OF THE LATE GIUSEPPE.\n\nThe record having been read to the informants, who declared that they could not write, I signed it alone. — The Assessor, Luigi Perugini.", "notas": ["El acta NO NOMBRA A LA MADRE. Se corta en «figlio del fu Giuseppe». Se esperaba que confirmase a Carmina Spizzirri y no lo hace. — ACTUALIZACIÓN, agosto de 2026: el nombre de la madre ya no depende de esta acta. Apareció en otra, el matrimonio de Rosalia Palermo (Marano Marchesato, 8 de diciembre de 1838, acta 19), que nombra a la pareja entera: Giuseppe Palermo, pastore, y Carmina Spizzirri. Lo que falta ahora no es el nombre, sino la prueba de que Rosalia y Giacomo eran hermanos.", "*** 26 DE AGOSTO DE 2026: CAE LA ÚLTIMA OBJECIÓN CONTRA CARMINA SPIZZIRRI. *** El acta de defunción de ella (1864) le daba setenta años, o sea nacida hacia 1794, y con esa cuenta habría tenido TRECE al nacer él, hacia 1807 — motivo suficiente para dejar de darla por madre suya y sospechar un primer matrimonio de Giuseppe Palermo. El nacimiento de su hermana AQUILA (Marano, 22 de junio de 1821, acta 34) hace declarar a Giuseppe que Carmina tiene TREINTA Y DOS años: nacida hacia 1789, dieciocho al nacer Francesco Giacomo. La cuenta encaja y el matrimonio anterior deja de hacer falta. Sigue sin haber prueba directa —ningún documento nombra juntos a Carmina y a Francesco Giacomo— pero ya no hay nada en contra.", "Los dos «fu» del acta valen tanto como el resto: Giuseppe Palermo estaba muerto, y Vincenzo Volpintesta, el padre de la viuda, también.", "«Marito di», no «vedovo»: Carmina Volpintesta seguía viva en mayo de 1867. Enviudó a los cincuenta y pocos años.", "LA EDAD OBLIGA A CORREGIR LA FICHA. Sesenta años en mayo de 1867 sitúan su nacimiento hacia 1806-1807, no hacia 1812 como se venía diciendo a partir de los 27 años que declaró en 1839. Las actas de sus otros tres hijos dan 36 años en 1841, 38 en 1845 y 40 en 1852: cuatro de las cinco cifras caen entre 1805 y 1812, con la mediana en 1807.", "El oficial que levanta el acta es LUIGI PERUGINI, el mismo que como alcalde de Rende había casado a su hija Maria Antonia con Michele Salerno nueve años antes, en agosto de 1858.", "Murió en Rende habiendo nacido en Marano Marchesato: la familia ya se había mudado, lo que explica que la boda de su hija en 1858 se celebrara en Rende."], "imgs": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20Francesco%20Giacomo%20Palermo%20-%20Rende%20acta%2035.jpg", "t": "Francesco Giacomo Palermo - Rende acta 35"}], "zooms": [{"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20acta%2035%20completa.jpg", "t": "Acta 35 completa"}, {"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20declarantes%20Pasquale%20Sacco%20y%20Costantino%20Perugini.jpg", "t": "Declarantes Pasquale Sacco y Costantino Perugini"}, {"u": "../actas/1867%20-%20Francesco%20Giacomo%20Palermo/1867-05-13%20D%20zoom%20-%20edad%2C%20oficio%20pecoraio%20y%20esposa%20Carmina%20Volpintesta.jpg", "t": "Edad, oficio pecoraio y esposa Carmina Volpintesta"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 de octubre de 1837, 21 h", "lugar": "Rende", "ref": "acta 20", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni» 1837"], ["Registro", "ark an_ua35976844 · hash del contenedor: wbVEAb4 (28 imágenes)"], ["Página", "21 de 28 — folio 20 del libro; un acta por imagen, en la mitad derecha"], ["Registrar", "Mario Magdalone, sindaco de Rende"], ["Año manuscrito", "«mille ottocento trentasette» — coincide con el catálogo"], ["Cómo se localizó", "primero en el índice escaneado de matrimonios de Rende de 1837, fila 20; después el acta, acertando a la primera con la recta página = acta + 1"]], "literal": "…sono comparsi nella casa comunale FRANCESCO GIACOMO PALERMO di anni VENTOTTO, nato in MARANO MARCHESATO, professione PECORAJO, domiciliato ivi, figlio di GIUSEPPE, domiciliato ivi, di professione PECORAJO, e di CARMELA SPIZZIRRI, domiciliata ivi; e CARMINA VOLPENTESTA di anni VENTITRE, nata in MARANO MARCHESATO, domiciliata RENDE, figlia del FU VINCENZO, domiciliato ————, e di TERESA LUCHETTA, domiciliata ivi…", "traduccion": "In the year eighteen hundred and thirty-seven, on the NINETEENTH day of the month of OCTOBER, at TWENTY-ONE hours, before Us, MARIO MAGDALONE, mayor and registrar of the Civil Status of the comune of RENDE, district of Cosenza, province of Calabria Citra, there appeared at the town hall:\n\nFRANCESCO GIACOMO PALERMO, AGED TWENTY-EIGHT, born at MARANO MARCHESATO, by trade a PECORAJO (shepherd), resident there, SON OF GIUSEPPE, resident there, by trade a PECORAJO, AND OF CARMELA SPIZZIRRI, resident there;\n\nand CARMINA VOLPENTESTA, AGED TWENTY-THREE, born at MARANO MARCHESATO, resident at RENDE, DAUGHTER OF THE LATE VINCENZO and OF TERESA LUCHETTA, resident there.\n\nNotice of the promise was posted on the door of the town hall of Rende on Sunday the first of October, AND AT MARANO MARCHESATO on the same day — in both villages, because he was from Marano and she was already living at Rende.\n\nDocuments presented: 1st the husband's birth record; 2nd the wife's; 3rd the certificate that the husband is unmarried and under no military obligation; 4th that the wife is unmarried; 5th THE DEATH CERTIFICATE OF THE WIFE'S FATHER; 6th THE DEATH CERTIFICATE OF HER PATERNAL GRANDFATHER; 7th the death certificate of her mother; 8th the extract of the notices, against which there was no opposition.\n\nFour witnesses: SALVATORE PORRO, aged thirty, bracciale, of Rende; SALVATORE COSTABILE, aged twenty-three, SARTORE (tailor); GIUSEPPE DE PAOLA, aged twenty-eight, FALEGNAME (carpenter); and FRANCESCO DE GENNARO, aged thirty-three, sartore. All of Rende.\n\n[Right-hand column] The parish priest of SANTA MARIA MAGGIORE returned one of the copies, certifying at the foot that the canonical celebration of the marriage followed on the TWENTIETH of the same month, before the witnesses IGNAZIO MANDARINO and PIETRO PERUGINI.", "notas": ["*** ESTA ES EL ACTA QUE CIERRA LA FILIACIÓN DE FRANCESCO GIACOMO. *** Hasta el 26 de agosto de 2026, que fuese hijo de Giuseppe Palermo y Carmina Spizzirri era una inferencia por convergencia: se apoyaba en el acta de su hermana Rosalia de 1838 y en la coincidencia de pueblo, nombre y oficio. Aquí lo dice su propia acta de boda. Por tanto ROSALIA y AQUILA PALERMO son sus hermanas de padre y de madre, y Carmina Spizzirri es bisabuela por línea directa sin ninguna reserva.", "Se buscó esta boda durante meses en MARANO MARCHESATO, y no está: nueve índices, de 1830 a 1838, ciento ochenta y tres bodas, ni un Palermo varón con ninguna Volpintesta. Estaba en RENDE. La lección, apuntada: cuando los dos novios son de un pueblo pero ella ya vive en otro, la boda se celebra donde vive ELLA. La notificación doble —Rende y Marano— lo dice en el propio acta.", "LA MADRE SE LLAMA «CARMELA» AQUÍ Y «CARMINA» EN TODO LO DEMÁS. Son variantes de la misma raíz y el escribano de Rende no la conocía. El padre, el pueblo y el oficio coinciden, así que no hay motivo para dudar de que sea la misma mujer, pero queda anotado.", "MICHELE VOLPINTESTA, CONFIRMADO POR ACTA. El documento número 6 es la fe de muerte del abuelo paterno de la novia: es Michele, el padre del difunto Vincenzo. Hasta ahora ese abuelo dependía del índice del blog y del índice del expediente; ahora lo respalda un acta original.", "EL PUNTO 7 CHIRRÍA, y conviene decirlo: pide la fe de muerte «della di lei madre», y la madre de la novia, Teresa Luchetta, aparece VIVA tres líneas más arriba en esta misma acta y no muere hasta 1851. Lo más probable es que sea formulario: la ley pedía acreditar quién debía dar el consentimiento —muerto el padre pasa al abuelo paterno, muerto éste a la madre— y el escribano copió la lista entera. NO tomarlo como indicio de otra madre.", "Las cinco actas de Marano encajan con ésta sin forzar nada: Vincenzo consta «fu» y murió en 1823; Teresa Luchetta consta viva y murió en 1851; Giuseppe y Carmela constan vivos y murieron en 1863 y 1864. Y los veintiocho años del novio dan 1809, que es exactamente el año que el índice del expediente atribuye a su nacimiento.", "LO QUE FALTA AHORA: el PROCESSETTO de Rende 1837. Los documentos 1 y 2 de la lista son las partidas de nacimiento de los dos novios, y el expediente las conserva. La de Francesco Giacomo (1809, Marano) es la pieza que lleva años faltando: no está en el registro civil de Marano de 1809, leído entero, así que ese extracto puede ser la única copia que quede."], "imgs": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 2, "nImgs": 5, "titulo": "He began and ended as a shepherd", "parrafos": ["The records almost always call him plain Giacomo Palermo; the full «Francesco Giacomo» appears only at his daughter's marriage in 1858. He was born at Marano Marchesato around 1807, and that date is an average of figures that do not agree with one another: he declared twenty-seven in 1839, thirty-six in October 1841, thirty-eight in February 1845, forty in January 1852, and his death record puts him at sixty in May 1867. Four of the five fall between 1805 and 1812.", "The trade comes and goes with the years: pastore when he registers Antonio in 1841, bracciale in 1845 and 1852, pecoraio — sheep-herder — when he dies. He begins and ends with livestock. The contradas move too: Palazzo in 1841, Langhi in 1845, Cerzi in 1852, all within Marano; and then the whole village, because the family ended up settled at Rende.", "He died there on 13 May 1867 at four in the afternoon, at home, in a contrada the record writes as «Nocolitani» and which is at the resolution limit of the scan. The record says «marito di Carmina Volpintesta»: he did not die a widower, she outlived him. And it adds that he was «figlio del fu Giuseppe», without naming the mother.", "The man signing the record as registrar was Luigi Perugini, acting assessor. Nine years earlier, as mayor of Rende, it was he who had married his daughter Maria Antonia to Michele Salerno."], "claves": [["Trade", "pastore and pecoraio; bracciale in the middle years"], ["Born", "c. 1807 at Marano Marchesato"], ["Contradas", "Palazzo, Langhi and Cerzi at Marano; then Rende"], ["Could sign", "no"], ["Death", "13 May 1867, aged 60"]]}, "carmina_volpintesta": {"id": "carmina_volpintesta", "nombre": "Carmina Volpintesta", "legal": "VOLPENTESTA en las actas de Marano; Volpintesta en las de Rende", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "Wife of Giacomo Palermo and mother of Maria Antonia. Born at Marano Marchesato in May 1814, daughter of Vincenzo Volpentesta and Teresa Luchetta. She lost her father at eight and was widowed at Rende in May 1867.", "datos": [["Birth", "mayo de 1814, MARANO MARCHESATO — acta 41; el día se lee 12 con reserva (ver las notas del acta)"], ["Parents", "VINCENZO VOLPENTESTA, bracciale, 38 años, y TERESA LUCHETTA, 31 años — CONFIRMADOS de primera mano por su propia acta de nacimiento"], ["Spouse", "Francesco Giacomo Palermo, pecoraio († 13 de mayo de 1867)"], ["Marriage", "19 de octubre de 1837, RENDE — acta 20. CONSEGUIDA. Tenía 23 años y ya vivía en Rende; el acta la da hija del difunto Vincenzo y de Teresa Luchetta, exactamente lo que decía su partida de 1814"], ["Hijos documentados", "Maria Antonia (1839), Antonio (1841), Annunciata (1845), Teresa (1852)"], ["Hermano documentado", "EMMANUELE VOLPENTESTA, casado con Michelina Cairo, muerto en Marano en 1864 (acta 11 del índice)"], ["Huérfana de padre", "19 de marzo de 1823, a los ocho años y diez meses"], ["Still alive in", "13 de mayo de 1867 — el acta de defunción de su marido dice «marito di», no «vedovo»"], ["Grafía", "Volpintesta en Rende; Volpentesta en las actas de Marano, incluida la suya"]], "mapa": null, "sinacta": "", "padre": "vincenzo_volpintesta", "madre": "teresa_luchetta", "conyuge": "francesco_giacomo", "hijos": ["maria_antonia", "antonio_palermo", "annunciata_palermo", "teresa_palermo"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "mayo de 1814, 14 h — nació el mismo día del acta", "lugar": "Marano Marchesato", "ref": "acta 41", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile napoleonico > Marano Marchesato > Registro 6 «Nati» 1814"], ["Registro", "hash del contenedor: w1yyOoo"], ["Página", "24 de 64, columna DERECHA (a la izquierda, el acta 40)"], ["Año manuscrito", "el impreso dice «L'anno milleottocento TREDICI»; está tachado y corregido a mano a QUATTORDECI, 1814. Concuerda con el catálogo y con el acta 63 del mismo registro, de agosto de 1814"], ["Registrar", "Francesco Conforti, sindaco"], ["Cómo se localizó", "este registro NO cumple la recta de los de defunción. La página 41 tiene una sola acta, la 63; la 27 tiene dos, la 46 y la 47. En ese tramo va a dos por imagen y la 41 cae en la página 24"]], "literal": "…è comparso Vincenzo Volpentesta di anni trenta otto di professione Bracciale domiciliato nel detto comune… ed ha dichiarato che il giorno soprain[dicato]… è nato in sua casa da esso dichiarante e da Teresa Luchetta sua moglie legittima di anni trenta una, una femina che ci ha presentato… a cui si è dato il nome di CARMINA.", "traduccion": "In the year eighteen hundred and FOURTEEN, on the (day) of the month of MAY, at FOURTEEN hours, before Us, FRANCESCO CONFORTI, mayor and registrar of the civil status of the comune of MARANO MARCHESATO, province of Calabria Citra, there appeared VINCENZO VOLPENTESTA, AGED THIRTY-EIGHT, by trade a BRACCIALE, resident in the said comune.\n\nAnd he declared that on the DAY STATED ABOVE there was born IN HIS HOUSE, of himself, the informant, and of TERESA LUCHETTA, HIS LAWFUL WIFE, AGED THIRTY-ONE, A GIRL whom he has presented to us, and TO WHOM HAS BEEN GIVEN THE NAME CARMINA.\n\nThe presentation and declaration were made in the presence of GIOVANNI VINCIULLO, aged twenty-six, by trade a CONTADINO, resident in the aforesaid place, and of GIOVANNI ROSSO, aged twenty-eight, likewise by trade a CONTADINO, resident in the same contrada, witnesses.\n\nThe present record was read both to the informant and to the witnesses, and thereafter signed by Us and by the informant: VINCENZO VOLPENTESTA.", "notas": ["SU FILIACIÓN YA NO DEPENDE DEL ACTA DE SU MARIDO. Hasta ahora Carmina era hija de Vincenzo sólo porque el acta de defunción de Giacomo Palermo (Rende, 1867) la llamaba «Carmina Volpintesta FU VINCENZO», y Teresa Luchetta no aparecía en ningún papel. Aquí el propio Vincenzo se presenta ante el alcalde, declara su edad y su oficio y nombra a su mujer. Es la fuente de primera mano.", "EL DÍA NO SE LEE CON CERTEZA, y conviene no fingir que sí. El número del día está partido por el salto de línea —termina en «...ce» al empezar el renglón siguiente— y el trozo que queda en el primer renglón está pisado por una anotación marginal muy posterior. Se lee «D...ce» y lo más probable con diferencia es DODECE, doce. Lo que sí es seguro: es MAYO DE 1814 y es POSTERIOR AL DÍA 10, porque el acta 40, en la misma abertura, es del día «Diece» a las dieciséis horas, y ésta se extendió a las catorce. Los ficheros van fechados 1814-05-12 con esa reserva.", "NO DA CONTRADA. El acta sólo dice que el padre está «domiciliato nel detto comune» y que la niña nació «in sua casa». Este formulario napoleónico no tiene casilla de contrada; los de la Restauración sí, y por eso de sus propios hijos sabemos las contradas Langhi y Cerzi.", "LAS EDADES DE LOS PADRES. Él treinta y ocho —nacido hacia 1776— y ella treinta y uno —hacia 1783—. Sus actas de defunción dan cincuenta años en 1823 (hacia 1773) y setenta y dos en 1851 (hacia 1779). Las dos parejas de cifras se llevan tres y cuatro años, que es lo normal: en estos registros nadie sabía su edad exacta.", "VINCENZO FIRMA. Al pie del acta está su firma, «Vincenzo Volpentesta», mientras que los dos testigos son iletrados. Un bracciale que sabe escribir su nombre en 1814 no es lo corriente.", "EL AÑO ESTABA MAL IMPRESO. El formulario venía preimpreso «L'anno milleottocento TREDICI» —1813— y el escribano lo tachó y escribió encima QUATTORDECI. Es el mismo cuaderno reaprovechado de un año para otro.", "Nació en mayo de 1814 y su padre murió en marzo de 1823: tenía ocho años y diez meses. Su madre, Teresa Luchetta, la crió viuda y vivió hasta 1851."], "imgs": [{"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Carmina%20Volpintesta%20-%20Marano%20Marchesato%20acta%2041.jpg", "t": "Carmina Volpintesta - Marano Marchesato acta 41"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20Copia%20certificada%20de%201837%20del%20acta%2041%20-%20Marano%20Marchesato.jpg", "t": "Copia certificada de 1837 del acta 41 - Marano Marchesato"}], "zooms": [{"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20acta%2041%20completa.jpg", "t": "Acta 41 completa"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20cabecera%2C%20ano%201814%20y%20acta%2041.jpg", "t": "Cabecera, ano 1814 y acta 41"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20nombre%20impuesto%20Carmina.jpg", "t": "Nombre impuesto Carmina"}, {"u": "../actas/1814%20-%20Carmina%20Volpintesta/1814-05-10%20N%20zoom%20-%20padres%20Vincenzo%20Volpentesta%2038%20y%20Teresa%20Luchetta%2031.jpg", "t": "Padres Vincenzo Volpentesta 38 y Teresa Luchetta 31"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 de octubre de 1837, 21 h", "lugar": "Rende", "ref": "acta 20", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni» 1837"], ["Registro", "ark an_ua35976844 · hash del contenedor: wbVEAb4 (28 imágenes)"], ["Página", "21 de 28 — folio 20 del libro; un acta por imagen, en la mitad derecha"], ["Registrar", "Mario Magdalone, sindaco de Rende"], ["Año manuscrito", "«mille ottocento trentasette» — coincide con el catálogo"], ["Cómo se localizó", "primero en el índice escaneado de matrimonios de Rende de 1837, fila 20; después el acta, acertando a la primera con la recta página = acta + 1"]], "literal": "…sono comparsi nella casa comunale FRANCESCO GIACOMO PALERMO di anni VENTOTTO, nato in MARANO MARCHESATO, professione PECORAJO, domiciliato ivi, figlio di GIUSEPPE, domiciliato ivi, di professione PECORAJO, e di CARMELA SPIZZIRRI, domiciliata ivi; e CARMINA VOLPENTESTA di anni VENTITRE, nata in MARANO MARCHESATO, domiciliata RENDE, figlia del FU VINCENZO, domiciliato ————, e di TERESA LUCHETTA, domiciliata ivi…", "traduccion": "In the year eighteen hundred and thirty-seven, on the NINETEENTH day of the month of OCTOBER, at TWENTY-ONE hours, before Us, MARIO MAGDALONE, mayor and registrar of the Civil Status of the comune of RENDE, district of Cosenza, province of Calabria Citra, there appeared at the town hall:\n\nFRANCESCO GIACOMO PALERMO, AGED TWENTY-EIGHT, born at MARANO MARCHESATO, by trade a PECORAJO (shepherd), resident there, SON OF GIUSEPPE, resident there, by trade a PECORAJO, AND OF CARMELA SPIZZIRRI, resident there;\n\nand CARMINA VOLPENTESTA, AGED TWENTY-THREE, born at MARANO MARCHESATO, resident at RENDE, DAUGHTER OF THE LATE VINCENZO and OF TERESA LUCHETTA, resident there.\n\nNotice of the promise was posted on the door of the town hall of Rende on Sunday the first of October, AND AT MARANO MARCHESATO on the same day — in both villages, because he was from Marano and she was already living at Rende.\n\nDocuments presented: 1st the husband's birth record; 2nd the wife's; 3rd the certificate that the husband is unmarried and under no military obligation; 4th that the wife is unmarried; 5th THE DEATH CERTIFICATE OF THE WIFE'S FATHER; 6th THE DEATH CERTIFICATE OF HER PATERNAL GRANDFATHER; 7th the death certificate of her mother; 8th the extract of the notices, against which there was no opposition.\n\nFour witnesses: SALVATORE PORRO, aged thirty, bracciale, of Rende; SALVATORE COSTABILE, aged twenty-three, SARTORE (tailor); GIUSEPPE DE PAOLA, aged twenty-eight, FALEGNAME (carpenter); and FRANCESCO DE GENNARO, aged thirty-three, sartore. All of Rende.\n\n[Right-hand column] The parish priest of SANTA MARIA MAGGIORE returned one of the copies, certifying at the foot that the canonical celebration of the marriage followed on the TWENTIETH of the same month, before the witnesses IGNAZIO MANDARINO and PIETRO PERUGINI.", "notas": ["*** ESTA ES EL ACTA QUE CIERRA LA FILIACIÓN DE FRANCESCO GIACOMO. *** Hasta el 26 de agosto de 2026, que fuese hijo de Giuseppe Palermo y Carmina Spizzirri era una inferencia por convergencia: se apoyaba en el acta de su hermana Rosalia de 1838 y en la coincidencia de pueblo, nombre y oficio. Aquí lo dice su propia acta de boda. Por tanto ROSALIA y AQUILA PALERMO son sus hermanas de padre y de madre, y Carmina Spizzirri es bisabuela por línea directa sin ninguna reserva.", "Se buscó esta boda durante meses en MARANO MARCHESATO, y no está: nueve índices, de 1830 a 1838, ciento ochenta y tres bodas, ni un Palermo varón con ninguna Volpintesta. Estaba en RENDE. La lección, apuntada: cuando los dos novios son de un pueblo pero ella ya vive en otro, la boda se celebra donde vive ELLA. La notificación doble —Rende y Marano— lo dice en el propio acta.", "LA MADRE SE LLAMA «CARMELA» AQUÍ Y «CARMINA» EN TODO LO DEMÁS. Son variantes de la misma raíz y el escribano de Rende no la conocía. El padre, el pueblo y el oficio coinciden, así que no hay motivo para dudar de que sea la misma mujer, pero queda anotado.", "MICHELE VOLPINTESTA, CONFIRMADO POR ACTA. El documento número 6 es la fe de muerte del abuelo paterno de la novia: es Michele, el padre del difunto Vincenzo. Hasta ahora ese abuelo dependía del índice del blog y del índice del expediente; ahora lo respalda un acta original.", "EL PUNTO 7 CHIRRÍA, y conviene decirlo: pide la fe de muerte «della di lei madre», y la madre de la novia, Teresa Luchetta, aparece VIVA tres líneas más arriba en esta misma acta y no muere hasta 1851. Lo más probable es que sea formulario: la ley pedía acreditar quién debía dar el consentimiento —muerto el padre pasa al abuelo paterno, muerto éste a la madre— y el escribano copió la lista entera. NO tomarlo como indicio de otra madre.", "Las cinco actas de Marano encajan con ésta sin forzar nada: Vincenzo consta «fu» y murió en 1823; Teresa Luchetta consta viva y murió en 1851; Giuseppe y Carmela constan vivos y murieron en 1863 y 1864. Y los veintiocho años del novio dan 1809, que es exactamente el año que el índice del expediente atribuye a su nacimiento.", "LO QUE FALTA AHORA: el PROCESSETTO de Rende 1837. Los documentos 1 y 2 de la lista son las partidas de nacimiento de los dos novios, y el expediente las conserva. La de Francesco Giacomo (1809, Marano) es la pieza que lleva años faltando: no está en el registro civil de Marano de 1809, leído entero, así que ese extracto puede ser la única copia que quede."], "imgs": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20Matrimonio%20de%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta%20-%20Rende%20acta%2020.jpg", "t": "Matrimonio de Giacomo Palermo y Carmina Volpintesta - Rende acta 20"}], "zooms": [{"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20acta%2020%2C%20los%20dos%20novios%20y%20los%20cuatro%20padres.jpg", "t": "Acta 20, los dos novios y los cuatro padres"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20columna%20del%20parroco%20de%20Santa%20Maria%20Maggiore.jpg", "t": "Columna del parroco de Santa Maria Maggiore"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20documentos%20aportados%2C%20puntos%204%20a%208.jpg", "t": "Documentos aportados, puntos 4 a 8"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2020%2C%20portada%20del%20legajo.jpg", "t": "Expediente 20, portada del legajo"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltera%20de%20ella.jpg", "t": "Expediente, fe de soltera de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20expediente%2C%20fe%20de%20soltero%20y%20no%20militar%20de%20el.jpg", "t": "Expediente, fe de soltero y no militar de el"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20fe%20de%20muerte%20del%20padre%20y%20del%20abuelo%20paterno%20de%20ella.jpg", "t": "Fe de muerte del padre y del abuelo paterno de ella"}, {"u": "../actas/1837%20-%20Matrimonio%20Francesco%20Giacomo%20Palermo%20y%20Carmina%20Volpintesta/1837-10-19%20M%20zoom%20-%20los%20cuatro%20testigos.jpg", "t": "Los cuatro testigos"}]}], "nActas": 1, "nImgs": 6, "titulo": "Thirty years old, twice", "parrafos": ["She has no record of her own and yet appears in five: the births of her four children — Maria Antonia in 1839, Antonio in 1841, Annunciata in 1845 and Teresa in 1852 — and her husband's death in 1867.", "The ages he declares for her are a good illustration of how little these figures are worth: thirty in October 1841, thirty again in February 1845, and thirty-five in January 1852. They place her somewhere between 1812 and 1817, and no closer.", "In May 1867 she was alive: her husband's death record calls him «marito di Carmina Volpintesta», not a widower. And in passing it says «fu Vincenzo», so her own father was by then dead. The surname is written Volpintesta in the Rende records and Volpentesta in the Marano ones. Her birth would have to be sought around 1815; the «of Rende» the starting index gives her is confirmed by no record read."], "claves": [["Born", "between 1812 and 1817, place unconfirmed"], ["Appears in", "five records, none of them hers"], ["Documented children", "four, between 1839 and 1852"], ["Still alive in", "May 1867"]]}, "aquila_palermo": {"id": "aquila_palermo", "nombre": "Aquila Palermo", "legal": "«Rosalia Palermo» en su acta de matrimonio", "rol": "hermano", "rolNombre": "Sibling", "gen": 5, "ramas": ["salerno"], "resumen": "Sister of Francesco Giacomo. She was born at Marano Marchesato on 22 June 1821 and married there on 8 December 1838, aged seventeen. For months she appeared in this tree as TWO women — Aquila and Rosalia — because the records call her by both names. Her marriage file proved she was one.", "datos": [["Birth", "22 de junio de 1821, a las 11 h, en casa de sus padres — Marano Marchesato, contrada Malvitani"], ["Name", "AQUILA en su partida, en la nota del párroco y en la portada de su expediente matrimonial. ROSALIA en el acta de matrimonio propiamente dicha. La misma mujer"], ["Parents", "Giuseppe Palermo, BRACCIALE, 40 años; y Carmina Spizzirri, 32 años"], ["Baptism", "el mismo 22 de junio de 1821, parroquia de Marano"], ["Marriage", "8 de diciembre de 1838, Marano Marchesato — acta 19, con VINCENZO GAETANO SANTELLI, bracciale de 28 años"], ["Siblings", "FRANCESCO GIACOMO PALERMO, probado por el acta de matrimonio de él (Rende 1837), que lo da hijo de los mismos dos. Y por índice: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) y Francesca (1823)"], ["Después de 1838", "*** YA NO ES NADA. *** El índice de difuntos de Marano de 1864 trae, en el acta 91, a GAETANA SANTELLI, «hija de Santelli, Vincenzo Gaetano y de Palermo, Aquila» — su hija. Veintiséis años de silencio rotos por una fila. Su propia defunción sigue sin localizar"]], "mapa": null, "sinacta": "", "padre": "giuseppe_palermo", "madre": "carmina_spizzirri", "conyuge": null, "hijos": [], "hermanos": ["francesco_giacomo"], "actas": [{"titulo": "Marriage dossier (processetto)", "tipo": "P", "tipoNombre": "Banns", "fecha": "noviembre-diciembre de 1838", "lugar": "Marano Marchesato", "ref": "processetti 1838, expediente 19", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni, processetti» 1838"], ["Registro", "ark an_ua35968823 · hash del contenedor: Lollxnp (179 imágenes)"], ["Página", "157 a 162 de 179 — el expediente 19"], ["Contenido", "portada; partida del novio (Marano 1810, acta 10); PARTIDA DE LA NOVIA, que es el acta 34 de 1821; y defunción de la madre del novio (Marano 1816, acta 42)"]], "literal": "Comune di Marano Marchesato — Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO, di detta Comune.", "traduccion": "COVER OF THE DOSSIER: «Comune of Marano Marchesato. Act of solemn promise of marriage between VINCENZO GAETANO SANTELLI and AQUILA PALERMO, of the said comune.» Seen by the mayor Luigi De Filippis, 16 November 1838.\n\nIT CONTAINS FOUR DOCUMENTS:\n\n1. The groom's birth record — Marano, record 10 of 1810: Gennaro Santelli, a bracciale aged 24, of the place called Pascalone, presents a boy born on 5 February 1810 of his lawful wife ANNA MARIA DI BARTOLO, and bestows on him the names VINCENZO GAETANO.\n\n2. THE BRIDE'S BIRTH RECORD — and it is RECORD 34 OF 1821, that of AQUILA: Giuseppe Palermo, aged forty, bracciale, of the contrada Malvitani, presents a girl born of Carmina Spizzirri, aged thirty-two, and gives her the name AQUILA.\n\n3. The death record of the groom's mother — Marano, record 42 of 1816: ANNA MARIA DE BARTOLO, daughter of the late Francesco and wife of Gennaro Santelli, aged twenty-four, contadina, of the street Pascalone, died on 21 August 1816 in her own house. Her death was reported by two neighbours and kinsmen, Domenico and Raffaele Santelli.\n\n4. The notices, posted without opposition.", "notas": ["*** ESTE EXPEDIENTE ES EL QUE DEMUESTRA QUE AQUILA Y ROSALIA SON LA MISMA MUJER. *** La portada la llama Aquila. Su partida la llama Aquila. Y el acta de matrimonio que sale de este mismo expediente la llama Rosalia. No hay dos hermanas: hay una mujer con dos nombres, el del registro y el de la casa.", "Y explica el enigma que llevaba meses abierto: ROSALIA PALERMO no aparece en ningún registro de nacidos de Marano entre 1809 y 1826, barridos año por año, PORQUE ESTÁ INSCRITA COMO AQUILA.", "La lección de método, y es la segunda vez en dos días: EL EXPEDIENTE VALE MÁS QUE EL ACTA. Primero fue el de Rende 1837, que sacó un bautismo de 1809 inexistente en el civil y una defunción de 1793. Ahora éste, que deshace una identidad equivocada. Pedir siempre el processetto.", "Del novio se saca de propina toda su rama: Vincenzo Gaetano Santelli, nacido el 5 de febrero de 1810, hijo de Gennaro Santelli, bracciale, y de Anna Maria de Bartolo, que murió con veinticuatro años cuando él tenía seis. Vivían en el paraje de Pascalone."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20la%20partida%20de%20la%20novia%20es%20el%20acta%2034%20de%20Aquila.jpg", "t": "Expediente 19, la partida de la novia es el acta 34 de Aquila"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20muerte%20de%20la%20madre%20del%20novio%2C%201816%20acta%2042.jpg", "t": "Expediente 19, muerte de la madre del novio, 1816 acta 42"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20partida%20del%20novio%2C%201810%20acta%2010.jpg", "t": "Expediente 19, partida del novio, 1810 acta 10"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20P%20expediente%2019%2C%20portada%3A%20Santelli%20ed%20AQUILA%20PALERMO.jpg", "t": "Expediente 19, portada: Santelli ed AQUILA PALERMO"}], "zooms": []}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "8 de diciembre de 1838, 21 h", "lugar": "Marano Marchesato", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 30 «Matrimoni» 1838"], ["Registro", "hash del contenedor dam- : wlppqoW (25 páginas)"], ["Página", "20 de 25 — folio 19 del libro"], ["Registrar", "Luigi De Filippis, sindaco"], ["Año manuscrito", "«L'anno mille ottocento trentotto» — coincide con el catálogo"], ["Cómo se localizó", "por la «Tavola alfabetica» del final del registro, páginas 24 y 25, fila 19"]], "literal": "…sono comparsi nella casa comunale VINCENZO GAETANO SANTELLI di anni ventotto, nato in Marano suddetto, di professione bracciale, domiciliato ivi, figlio di GENNARO di professione bracciale domiciliato ivi, e di FU ALMA MARIA DI BARTOLO; e ROSALIA PALERMO di anni diciassette, nata in Marano medesimo, domiciliata ivi, figlia di GIUSEPPE di professione PASTORE domiciliato ivi, e di CARMINA SPIZZIRRI domiciliata col di lei marito…", "traduccion": "In the year eighteen hundred and thirty-eight, on the eighth day of the month of December, at twenty-one hours, before Us, LUIGI DE FILIPPIS, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared at the town hall:\n\nVINCENZO GAETANO SANTELLI, AGED TWENTY-EIGHT, born at Marano, by trade a BRACCIALE (day labourer), resident here, son of GENNARO, by trade a bracciale, resident here, and of the LATE ALMA MARIA DI BARTOLO;\n\nand ROSALIA PALERMO, AGED SEVENTEEN, born at Marano itself, resident here, DAUGHTER OF GIUSEPPE, BY TRADE A PASTORE, RESIDENT HERE, AND OF CARMINA SPIZZIRRI, RESIDENT WITH HER HUSBAND.\n\nWho, in the presence of the witnesses named below, requested us to receive their solemn promise to celebrate before the Church, in the forms prescribed by the Holy Council of Trent, the marriage proposed between them. Notice of this promise was posted on the door of the town hall of Marano Marchesato on Sunday the eighteenth of November of the current year.\n\nDocuments presented: 1st the birth records of the husband and of the wife; 2nd the death record of ALMA MARIA DI BARTOLO, the husband's mother. It is further established that the husband is under no military obligation, and that husband and wife are unmarried. At the posting of the notices there was no impediment whatever. Finally, THE HUSBAND'S FATHER AND THE WIFE'S PARENTS gave their consent orally.\n\nFour witnesses took part in the solemn promise: ANTONIO CAIRA, aged fifty, bracciale, resident at Marano; GIUSEPPE GENUITA, aged thirty-six, MOLINARO (miller); MICHELE SCOLA, aged fifty, bracciale; and SAVERIO VITIELI, aged twenty-six, bracciale. The contracting parties and the witnesses declared that they COULD NOT WRITE.\n\n[Right-hand column] The parish priest of Marano returned to us one of the copies of the aforesaid promise; at the foot of which he certified that the celebration of the marriage followed on the EIGHTH day of the month of DECEMBER of the current year, in the presence of the witnesses GIUSEPPE MARRONE and GASPARE BARTUCCI.", "notas": ["ESTA ES EL ACTA QUE RESCATA A CARMINA SPIZZIRRI. Se fue a buscar a Marano de 1838 la boda de Giacomo Palermo con Carmina Volpintesta y no está —el índice del año, con sus veintiuna bodas, no trae ningún Palermo varón ni ninguna Volpentesta—. Pero en la fila 19 había una novia Palermo «di Giuseppe», y el acta la desarrolla nombrando a los dos padres.", "Giuseppe Palermo aparece VIVO y con oficio: PASTORE. Es el mismo oficio de su presunto hijo Giacomo, que fue pastore en 1841 y murió pecoraio en 1867. La coincidencia de pueblo, nombre y oficio es lo que sostiene el parentesco.", "Carmina Spizzirri aparece VIVA, «domiciliata col di lei marito». Es la primera vez que su nombre sale de un documento original.", "Los dos «fu» del acta son del lado del novio, no del nuestro: el muerto es Alma Maria di Bartolo, madre de Vincenzo Santelli. Del lado Palermo no hay ningún «fu», y por eso sabemos que los dos padres de Rosalia vivían.", "LO QUE NO DICE, y hay que ser honestos: no dice que Rosalia sea hermana de Francesco Giacomo. Nadie la ha visto nombrada en ninguna acta de la familia de Rende. El parentesco es una inferencia por convergencia, muy fuerte pero inferencia. Se cerraría con el nacimiento de Francesco Giacomo (Marano, hacia 1807) o con el de la propia Rosalia (Marano, hacia 1821): los dos nombrarían a la misma pareja.", "Nota de resolución: los escaneos de Marano son de 2164 × 1900 píxeles, que es su tamaño original; los recortes archivados se pidieron al servidor en esas mismas coordenadas y no están reescalados.", "*** RECTIFICACIÓN DEL 26 DE AGOSTO DE 2026, POR LA TARDE: AQUILA Y ROSALIA SON LA MISMA MUJER. *** Por la mañana se había concluido lo contrario, y con un razonamiento que parecía sólido: el acta 34 de 1821 impone UN SOLO nombre, AQUILA, y lo repiten la nota del párroco y la tabla anual del registro. De ahí se dedujo que Rosalia tenía que ser otra hermana. Era una deducción, no una prueba, y estaba equivocada.\n\nLo zanjó el EXPEDIENTE DE SU PROPIA BODA —Marano Marchesato, processetti 1838, expediente 19, páginas 157 a 162—. La portada dice, con todas las letras: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». Y la partida de nacimiento que la novia presentó, cosida dentro del legajo, ES EL ACTA 34 DE 1821, la de Aquila.\n\nEs decir: el expediente la llama Aquila, su partida la llama Aquila, y el acta de matrimonio que sale de ese mismo expediente la llama Rosalia. El escribano usó el nombre por el que la conocían en el pueblo. Y eso explica de una vez el enigma que llevaba meses abierto: ROSALIA PALERMO NO APARECE EN NINGÚN REGISTRO DE NACIDOS DE MARANO ENTRE 1809 Y 1826 —barridos año por año— PORQUE ESTÁ INSCRITA COMO AQUILA."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20Vincenzo%20Santelli%20y%20Rosalia%20Palermo%20-%20Marano%20Marchesato%20acta%2019.jpg", "t": "Vincenzo Santelli y Rosalia Palermo - Marano Marchesato acta 19"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%201%20a%2010.jpg", "t": "Indice alfabetico 1838 - actas 1 a 10"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20indice%20alfabetico%201838%20-%20actas%2011%20a%2021.jpg", "t": "Indice alfabetico 1838 - actas 11 a 21"}], "zooms": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20celebracion%20canonica%20y%20testigos.jpg", "t": "Celebracion canonica y testigos"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20documentos%20presentados.jpg", "t": "Documentos presentados"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20novios%2C%20edades%20y%20oficios.jpg", "t": "Novios, edades y oficios"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1838-12-08%20M%20zoom%20-%20padres%20de%20la%20novia%20Giuseppe%20Palermo%20y%20Carmina%20Spizzirri.jpg", "t": "Padres de la novia Giuseppe Palermo y Carmina Spizzirri"}]}, {"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "22 de junio de 1821, 19 h (el acta); nació el mismo día a las 11 h", "lugar": "Marano Marchesato", "ref": "acta 34", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Fondo", "Stato civile della Restaurazione > Marano Marchesato > Registro 13 «Nati» 1821"], ["Registro", "hash del contenedor: 5gZZmB2 (53 páginas)"], ["Página", "19 de 53, columna IZQUIERDA (a la derecha, el acta 35)"], ["Año manuscrito", "va IMPRESO en el formulario del Reino de las Dos Sicilias: «L'anno mille ottocento ventuno». Coincide con el catálogo"], ["Registrar", "Fedele Turco, sindaco y oficial del estado civil"], ["Cómo se localizó", "sondeo en la página 18 = actas 32 y 33; la recta acta = 2 × página − 4 pone la 34 en la página 19"], ["Tabla anual", "el registro trae una «Tavola annuale alfabetica de' nati» en la página 44, con las actas 19 a 54; la fila 34 dice «Aquila | Giuseppe Palermo | 22 detto»"]], "literal": "…è comparso [il Signor, tachado] GIUSEPPE PALERMO di anni QUARANTA di professione BRACCIALE domiciliato in Marano, Contrada Malvitani, e ci ha presentato una bambina; secondo che abbiamo ocularmente riconosciuto, e ci ha dichiarato che la stessa è nata da CARMINA SPIZZIRRI d'anni TRENTADUE domiciliata con esso, e da lui dichiarante di professione come sopra domiciliato come sopra, nel giorno VENTIDUE del mese di sopra detto anno corrente all'ore UNDICI nella Casa di sua abitazione. — Ha in oltre dichiarato di dare alla Bambina il Nome di AQUILA ———", "traduccion": "In the year eighteen hundred and twenty-one, on the TWENTY-SECOND day of the month of JUNE, at NINETEEN hours, before Us, FEDELE TURCO, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIUSEPPE PALERMO, AGED FORTY, by trade a BRACCIALE (day labourer), resident at Marano, CONTRADA MALVITANI.\n\nAnd he presented to us a girl, as we ascertained with our own eyes, and declared to us that she was born OF CARMINA SPIZZIRRI, AGED THIRTY-TWO, resident with him, and of himself, the informant, of the trade stated above and resident as above, on the TWENTY-SECOND day of the month aforesaid of the current year, AT ELEVEN HOURS, IN THE HOUSE OF THEIR DWELLING.\n\nHE FURTHER DECLARED THAT HE GAVE THE GIRL THE NAME AQUILA. ———\n\nThe aforesaid presentation and declaration were made in the presence of GABRIELE DE SPOSITO (surname reading uncertain), aged forty, by trade a MURATORE (stonemason), resident at Marano, contrada Langhi; and of GIUSEPPE SCOLA, aged sixty, by trade a bracciale, resident at Marano, contrada Palazzo, witnesses who took part in the present act and were chosen by the informant himself.\n\n[Right-hand column] The parish priest of the church of Marano returned to us the notice we had sent him, certifying at the foot that the Sacrament of Baptism was administered to the said girl, CALLED AQUILA PALERMO, on the TWENTY-SECOND day of the month indicated.", "notas": ["*** SE FUE A ESTE ACTA A PREGUNTARLE SI ERA ROSALIA, Y LA RESPUESTA ES NO. *** La hipótesis era razonable: en estos registros se imponen a menudo dos o tres nombres de pila y el índice recoge sólo uno, así que «Aquila Rosalia» habría cerrado de un golpe el nacimiento de Rosalia Palermo, la novia de 1838. El acta dice AQUILA y nada más: la raya del impreso queda rellena con un trazo largo que no deja sitio a un segundo *** RECTIFICACIÓN DEL 26 DE AGOSTO DE 2026, POR LA TARDE: AQUILA Y ROSALIA SON LA MISMA MUJER. *** Por la mañana se había concluido lo contrario, y con un razonamiento que parecía sólido: el acta 34 de 1821 impone UN SOLO nombre, AQUILA, y lo repiten la nota del párroco y la tabla anual del registro. De ahí se dedujo que Rosalia tenía que ser otra hermana. Era una deducción, no una prueba, y estaba equivocada.\n\nLo zanjó el EXPEDIENTE DE SU PROPIA BODA —Marano Marchesato, processetti 1838, expediente 19, páginas 157 a 162—. La portada dice, con todas las letras: «Atto di solenne promessa di matrimonio tra VINCENZO GAETANO SANTELLI ed AQUILA PALERMO». Y la partida de nacimiento que la novia presentó, cosida dentro del legajo, ES EL ACTA 34 DE 1821, la de Aquila.\n\nEs decir: el expediente la llama Aquila, su partida la llama Aquila, y el acta de matrimonio que sale de ese mismo expediente la llama Rosalia. El escribano usó el nombre por el que la conocían en el pueblo. Y eso explica de una vez el enigma que llevaba meses abierto: ROSALIA PALERMO NO APARECE EN NINGÚN REGISTRO DE NACIDOS DE MARANO ENTRE 1809 Y 1826 —barridos año por año— PORQUE ESTÁ INSCRITA COMO AQUILA.", "Y NO PUEDEN SER LAS DOS DE 1821. Aquila nació el 22 de junio; una hermana entera no cabe ni antes ni después dentro del mismo año civil. Rosalia, que declaró diecisiete años en diciembre de 1838, tiene que ser de 1820 — sus diecisiete encajan igual de bien con un nacimiento a finales de aquel año. El registro de NATI 1820 de Marano Marchesato es el objetivo inmediato.", "*** LA EDAD DE CARMINA SPIZZIRRI, QUE ERA LO QUE MÁS FALTA HACÍA. *** «nata da CARMINA SPIZZIRRI D'ANNI TRENTADUE»: treinta y dos años en junio de 1821, o sea nacida hacia 1789. Su acta de defunción de 1864 le daba setenta, o sea 1794, y con esa cuenta habría tenido trece años al nacer Francesco Giacomo (hacia 1807) — el hijo por el que desciende esta familia. Con 1789 tendría dieciocho, y la objeción se cae. Los cinco años de diferencia entre las dos declaraciones son de lo más normal, pero la de 1821 es mucho más fiable: la da su propio marido a los pocos días del parto, y no unos vecinos ante un cadáver cuarenta y tres años después.", "OJO: esto no PRUEBA que Francesco Giacomo sea hijo de Carmina. Sigue sin haber ningún documento que los nombre juntos. Lo que hace es quitar de en medio la única objeción seria que había —la cronológica—, y con ella la necesidad de suponerle a Giuseppe Palermo un matrimonio anterior.", "LA EDAD DEL PADRE SE MUEVE EN SENTIDO CONTRARIO. Aquí tiene CUARENTA años, o sea nacido hacia 1781; su acta de defunción de 1863 le daba noventa, o sea 1773. Ocho años de diferencia. Los noventa de un acta de defunción son casi siempre una redonda de vecinos; los cuarenta los dice él. Giuseppe Palermo es con toda probabilidad de hacia 1781, y no el patriarca de noventa años que parecía.", "EL OFICIO CAMBIA TRES VECES: BRACCIALE en 1821, PASTORE en el matrimonio de Rosalia de 1838, y de nuevo bracciale al morir en 1863. No son tres hombres: en 1821 ya está casado con Carmina Spizzirri, y eso lo fija. En Marano un jornalero podía pasar años guardando ovejas y volver al jornal.", "LA CONTRADA ES MALVITANI, que es un dato nuevo. En 1838 el acta de Rosalia no dice contrada, y en 1863 y 1864 tampoco. Es la única dirección conocida de esta familia en Marano.", "DETALLE DE CLASE: el impreso dice «è comparso IL SIGNOR ———» y el escribano TACHA «il Signor» antes de escribir Giuseppe Palermo. En el mismo registro se lo deja puesto a otros. No era un señor, era un bracciale, y el escribano lo corrigió.", "LA TABLA ANUAL DEL REGISTRO es un hallazgo aparte y queda archivada: «TAVOLA annuale alfabetica de' nati in questo comune dell'anno 1821», página 44, con las actas 19 a 54 — número de orden, nombre del nacido, nombre y apellido del PADRE y día. Entre la 19 y la 54 no hay ningún otro Palermo. AVISO PARA QUIEN VUELVA A ESTE CONTENEDOR: las páginas 45 a 53 no son de Marano ni de 1821, sino un legajo suelto de APRIGLIANO de 1819 encuadernado al final; el índice está en las páginas 43 y 44."], "imgs": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20Aquila%20Palermo%20-%20Marano%20Marchesato%20acta%2034.jpg", "t": "Aquila Palermo - Marano Marchesato acta 34"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20tabla%20anual%20de%20nacidos%201821%20-%20actas%2019%20a%2054.jpg", "t": "Tabla anual de nacidos 1821 - actas 19 a 54"}], "zooms": [{"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20Giuseppe%20Palermo%2040%20anos%20y%20Carmina%20Spizzirri%2032%20anos.jpg", "t": "Giuseppe Palermo 40 anos y Carmina Spizzirri 32 anos"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20acta%2034%20completa.jpg", "t": "Acta 34 completa"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20parroco%20la%20bautiza%20Aquila%20Palermo.jpg", "t": "El parroco la bautiza Aquila Palermo"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20el%20unico%20nombre%20impuesto%20es%20Aquila.jpg", "t": "El unico nombre impuesto es Aquila"}, {"u": "../actas/1821%20-%20Aquila%20Palermo/1821-06-22%20N%20zoom%20-%20tabla%20anual%2C%20fila%2034%20Aquila%20de%20Giuseppe%20Palermo.jpg", "t": "Tabla anual, fila 34 Aquila de Giuseppe Palermo"}]}], "nActas": 3, "nImgs": 18, "titulo": "", "parrafos": [], "claves": []}, "giovanni_chiappetta": {"id": "giovanni_chiappetta", "nombre": "Giovanni Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "A day labourer born in Castrolibero around 1848. He married at Rende in 1873 and had Filomena there. Still alive, and still able to sign, in 1910.", "datos": [["Birth", "hacia 1848, CASTROLIBERO — declara 25 años cumplidos en octubre de 1873"], ["Parents", "Raffaele Chiappetta y Teresa Molinaro"], ["Trade", "bracciale (jornalero); contadino en 1910"], ["Marriage", "19 de octubre de 1873, Rende — acta 32, con 25 años"], ["Spouse", "Angela Massei"], ["Daughter", "Filomena Chiappetta (Rende, 11 de mayo de 1877)"], ["Still alive in", "30 de agosto de 1910 — declara la muerte de su nieta Angelina con 60 años, y FIRMA"]], "mapa": null, "sinacta": "Su acta de nacimiento no se ha localizado, pero desde agosto de 2026 se sabe dónde buscarla: el acta de su matrimonio (Rende, 1873, acta 32, en la ficha de esa unión) dice que nació en CASTROLIBERO —no en Rende— y que tenía veinticinco años cumplidos, o sea que nació hacia 1848. Aparece además en el nacimiento de Filomena (1877, con 29 años) y en la defunción de su nieta Angelina (1910, con 60 años, y firmando de su puño: sabía escribir, cosa rara en esta familia).", "padre": "raffaele_chiappetta", "madre": "teresa_molinaro", "conyuge": "angela_massei", "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 de octubre de 1873, 15 h", "lugar": "Rende", "ref": "acta 32", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Registro", "an_ua35985510 · hash 03ArRZ4"], ["Página", "17 de 19"], ["Registrar", "Vincenzo Martino, sindaco"], ["Año manuscrito", "«milleottocento settantatré» — coincide con el catálogo"]], "literal": "…sono comparsi Giovanni Chiappetta, di anni venticinque compiti, bracciale, nato a Castrolibero, qui residente, figlio di Raffaele bracciale, e di Teresa Molinaro, contadina, quivi residenti;\n\ned Angela Massei, di anni quindici compiti, contadina, nata a Castrolibero, qui residente, figlia di Domenico, bracciale, e di Carmina Ricchio, contadina, qui residenti;\n\nnon che i testimoni Antonio Loizzo o Guallatta, di anni quaranta, bracciale, e Santo Palermo fu Luigi, di anni ventisei, bracciale, qui domiciliati.", "traduccion": "In the year eighteen hundred and seventy-three, on the nineteenth day of October, at the town hall of Rende, circondario of Cosenza, province of Calabria Citeriore, at fifteen hours.\n\nBefore Us, VINCENZO MARTINO, mayor and Registrar of the Civil Status of the said comune, there appeared:\n\nGIOVANNI CHIAPPETTA, aged twenty-five years completed, day labourer, BORN AT CASTROLIBERO, resident here, son of RAFFAELE, day labourer, and of TERESA MOLINARO, countrywoman, resident here;\n\nand ANGELA MASSEI, aged fifteen years completed, countrywoman, BORN AT CASTROLIBERO, resident here, daughter of DOMENICO, day labourer, and of CARMINA RICCHIO, countrywoman, resident here;\n\ntogether with the witnesses Antonio Loizzo or Guallatta, aged forty, day labourer, and Santo Palermo, son of the late Luigi, aged twenty-six, day labourer, resident here.\n\nThe said Chiappetta and Massei, in the presence of the said witnesses, formally requested me to proceed to the celebration of the marriage proposed between them, the two publications having already been made on the twenty-eighth of last September and the fifth of the current October, without any opposition arising, as appears from the certificate issued by this Registrar of the Civil Status on the ninth of the said October.\n\nGranting that request, I read to them in the presence of the witnesses articles one hundred and thirty, one hundred and thirty-one and one hundred and thirty-two of the Civil Code, and having received from the spouses themselves, one after the other, the declaration that they wished to take each other as husband and wife, I pronounced in the name of the law that GIOVANNI CHIAPPETTA and ANGELA MASSEI are lawfully united in marriage.\n\nThe record is signed by me alone: the spouses and the witnesses declared that they could not write. — The Mayor, Vincenzo Martino.", "notas": ["Este acta es la que hace subir el árbol un piso entero por el lado Chiappetta: da de golpe cuatro personas nuevas —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei y Carmina Ricchio— y dice que los cuatro estaban vivos.", "Que estaban vivos no es una suposición. El formulario de 1873 distingue con rigor: en el mismo acta llama a un testigo «Santo Palermo FU Luigi», y a los cuatro padres los da sin «fu» y como «residenti».", "LOS DOS NOVIOS NACIERON EN CASTROLIBERO. Es el hallazgo colateral: la rama Chiappetta viene del mismo pueblo del que venían Michele Salerno (De Rango) y Maria Palermo. Filomena ya nace en Rende, en 1877. Dos familias haciendo el mismo camino en los mismos años.", "EL APELLIDO ES MASSEI, NO MAZZEI. El índice del que se partió lo transcribe «Mazzei» y «Mazza»; el acta original, el nacimiento de Filomena (1877) y el matrimonio de 1894 escriben los tres MASSEI. Igual pasa con «Mulinaro», que en el acta es MOLINARO.", "El padre de la novia se llama sólo DOMENICO en el acta; el «Antonio» que le añadía el índice no está en el original.", "Ella tenía quince años cumplidos. Cuatro años después nacía Filomena, y veintiún años después Filomena se casaba a los dieciséis: dos generaciones seguidas de novias adolescentes.", "El apellido del primer testigo es de lectura dudosa. Está escrito con la fórmula de alias «X o Y»: lo más probable es «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "He could sign his name", "parrafos": ["He was born at Castrolibero around 1848 and married at Rende on 19 October 1873, at three in the afternoon, to Angela Massei. He declared twenty-five years completed; she, fifteen. That day nobody signed: neither the couple nor the witnesses could write, and the record is initialled only by the sindaco Vincenzo Martino.", "In May 1877 he came back to the town hall to register his daughter Filomena: twenty-nine years old, day labourer, the child born the previous day at nine in the morning in the contrada Soprano. Three separate records — the marriage of 1873, that birth of 1877 and his appearance as a witness in 1891 aged forty-three — point to the same year of birth. The fourth, that of 1910, is two years out.", "And here is what sets him apart. On 30 August 1910 he went to report the death of his granddaughter Angelina, aged eight, together with the child's uncle. At the foot of the record it is stated that the informant Chiappetta Giovanni and the witness Vercillo Ferdinando sign; the others declared themselves illiterate. In a family where almost nobody signs — not the couple of 1873, nor those of 1894, nor Francesco on any of the nine records of his children — Giovanni Chiappetta could write his own name."], "claves": [["Trade", "bracciale, day labourer; contadino in 1910"], ["Born", "c. 1848 at Castrolibero"], ["Could sign", "yes — the only one in the family who does"], ["Married at", "25"], ["Still alive in", "August 1910, declaring 60 years"]]}, "angela_massei": {"id": "angela_massei", "nombre": "Angela Massei", "legal": "Angela Massei (el índice la da como «Mazzei»)", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "Born at Castrolibero around 1858. She married at barely fifteen and was Filomena's mother at nineteen.", "datos": [["Birth", "hacia 1858, CASTROLIBERO — declara 15 años cumplidos en octubre de 1873"], ["Parents", "Domenico Massei y Carmina Ricchio"], ["Trade", "contadina (campesina)"], ["Marriage", "19 de octubre de 1873, Rende — acta 32, con 15 años"], ["Spouse", "Giovanni Chiappetta"], ["Daughter", "Filomena Chiappetta (Rende, 11 de mayo de 1877)"], ["Still alive in", "1 de abril de 1894 — da su consentimiento en la boda de Filomena"]], "mapa": null, "sinacta": "Sin acta propia. Su matrimonio de 1873 (acta 32, en la ficha de esa unión) dice que nació en CASTROLIBERO y que tenía quince años cumplidos: nacida hacia 1858. Se casó, pues, con quince y tuvo a Filomena con diecinueve. En 1894 seguía viva: comparece a dar su consentimiento para la boda de su hija. El apellido: el acta de 1873 escribe MASSEI, igual que el nacimiento de Filomena en 1877 y el matrimonio de 1894; el índice del que se partió lo daba como «Mazzei» y como «Mazza».", "padre": "domenico_massei", "madre": "carmina_ricchio", "conyuge": "giovanni_chiappetta", "hijos": ["filomena"], "hermanos": [], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "19 de octubre de 1873, 15 h", "lugar": "Rende", "ref": "acta 32", "fuente": [["Fondo", "Stato civile italiano > Rende > Registro 65 «Matrimoni» 1873"], ["Registro", "an_ua35985510 · hash 03ArRZ4"], ["Página", "17 de 19"], ["Registrar", "Vincenzo Martino, sindaco"], ["Año manuscrito", "«milleottocento settantatré» — coincide con el catálogo"]], "lit  Code, and having received from the spouses themselves, one after the other, the declaration that they wished to take each other as husband and wife, I pronounced in the name of the law that GIOVANNI CHIAPPETTA and ANGELA MASSEI are lawfully united in marriage.\n\nThe record is signed by me alone: the spouses and the witnesses declared that they could not write. — The Mayor, Vincenzo Martino.", "notas": ["Este acta es la que hace subir el árbol un piso entero por el lado Chiappetta: da de golpe cuatro personas nuevas —Raffaele Chiappetta, Teresa Molinaro, Domenico Massei y Carmina Ricchio— y dice que los cuatro estaban vivos.", "Que estaban vivos no es una suposición. El formulario de 1873 distingue con rigor: en el mismo acta llama a un testigo «Santo Palermo FU Luigi», y a los cuatro padres los da sin «fu» y como «residenti».", "LOS DOS NOVIOS NACIERON EN CASTROLIBERO. Es el hallazgo colateral: la rama Chiappetta viene del mismo pueblo del que venían Michele Salerno (De Rango) y Maria Palermo. Filomena ya nace en Rende, en 1877. Dos familias haciendo el mismo camino en los mismos años.", "EL APELLIDO ES MASSEI, NO MAZZEI. El índice del que se partió lo transcribe «Mazzei» y «Mazza»; el acta original, el nacimiento de Filomena (1877) y el matrimonio de 1894 escriben los tres MASSEI. Igual pasa con «Mulinaro», que en el acta es MOLINARO.", "El padre de la novia se llama sólo DOMENICO en el acta; el «Antonio» que le añadía el índice no está en el original.", "Ella tenía quince años cumplidos. Cuatro años después nacía Filomena, y veintiún años después Filomena se casaba a los dieciséis: dos generaciones seguidas de novias adolescentes.", "El apellido del primer testigo es de lectura dudosa. Está escrito con la fórmula de alias «X o Y»: lo más probable es «Antonio Loizzo o Guallatta»."], "imgs": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20Giovanni%20Chiappetta%20y%20Angela%20Massei%20-%20Rende%20acta%2032.jpg", "t": "Giovanni Chiappetta y Angela Massei - Rende acta 32"}], "zooms": [{"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Angela%20Massei%2015%20anos%2C%20hija%20de%20Domenico%20y%20Carmina%20Ricchio.jpg", "t": "Angela Massei 15 anos, hija de Domenico y Carmina Ricchio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20Giovanni%2025%20anos%2C%20hijo%20de%20Raffaele%20y%20Teresa%20Molinaro.jpg", "t": "Giovanni 25 anos, hijo de Raffaele y Teresa Molinaro"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20inicio%20del%20acta%20y%20datos%20del%20novio.jpg", "t": "Inicio del acta y datos del novio"}, {"u": "../actas/1873%20-%20Matrimonio%20Giovanni%20Chiappetta%20y%20Angela%20Mazzei/1873-10-19%20M%20zoom%20-%20novia%2C%20sus%20padres%20y%20testigos.jpg", "t": "Novia, sus padres y testigos"}]}], "nActas": 0, "nImgs": 0, "titulo": "Fifteen years completed", "parrafos": ["Her marriage record leaves no room for doubt: «di anni quindici compiti», fifteen years completed. She married on 19 October 1873, at the town hall of Rende, to Giovanni Chiappetta, a twenty-five-year-old day labourer. Both had been born at Castrolibero and both were already living at Rende; all four parents were alive and the record gives them as resident in the village.", "She had Filomena at nineteen, on 11 May 1877. And twenty-one years later, on 1 April 1894, she went back to the same town hall to give her consent for her daughter to marry at sixteen. The same scene, one year apart.", "She could not write, and her birth record — around 1858, at Castrolibero — has not been located. The surname is written MASSEI on her marriage, on Filomena's birth and at the 1894 wedding; the index this began from gives it as «Mazzei» and also as «Mazza»."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1858 at Castrolibero"], ["Married at", "15"], ["A mother at", "19"], ["Could sign", "no"]]}, "michele": {"id": "michele", "nombre": "Michele Salerno", "legal": "Michele Salerno di Rende", "rol": "directa", "rolNombre": "Direct line", "gen": 6, "ramas": ["salerno"], "resumen": "A foundling. Found at the wheel of the Cosenza hospice on 3 May 1825. A day labourer. He used three surnames over his lifetime and had none of his own.", "datos": [["Birth", "3 de mayo de 1825, Cosenza — acta 254"], ["Condición", "expósito: sin padres inscritos"], ["Nombre impuesto", "Michele Salerno di Rende"], ["Trade", "bracciale (jornalero)"], ["Marriage", "22 de agosto de 1858, Rende — acta 19"], ["Spouse", "Maria Antonia Palermo"], ["Still alive in", "5 de noviembre de 1910 — figura sin «fu» y residente en Rende en la boda de su hijo Domenico, con 85 años"], ["Death", "sin localizar — posterior a noviembre de 1910"]], "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "maria_antonia", "hijos": ["domenico", "arcangela", "francesco", "giovanni"], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "3 de mayo de 1825, 15 h", "lugar": "Cosenza", "ref": "acta 254, folio 122 vuelto", "fuente": [["Archivo", "Archivio di Stato di Cosenza"], ["Hallada en", "Rende, Reg. 50 «Matrimoni, processetti» 1858, pág. 209 de 569"], ["Registro", "an_ua35977232 · hash LyxMQVl"], ["Copia expedida", "10 de agosto de 1858, Archivio Provinciale di Cosenza"]], "literal": "…un fanciullo involto in fascia bianca, e senza alcun segno al di lui corpo.\n\nLo stesso ha inoltre dichiarato di dare al bambino il nome\ndi  Michele Salerno di Rende", "traduccion": "In the year eighteen hundred and twenty-five, on the third day of the month of May, at fifteen hours, before Us, FRANCESCO BARONE FERRERI, mayor and registrar of the civil status of the comune of Cosenza, district of Cosenza, province of Calabria Citeriore, there appeared signor EMIDDIO CARLI, aged forty-one, by trade a SERVANT, resident at Cosenza, contrada del Ospedale, and he presented to us a child whom we ascertained with our own eyes, declaring that the same was born according to the report of the chaplain of the hospice, signor don Gaetano Barra.\n\nFrom the said report it appears that today, at thirteen hours, there was found at the wheel of the aforesaid house a child wrapped in a white cloth, and with no mark whatever on his body.\n\nAnd We, Registrar of the Civil Status, in compliance with article fifty-two of the civil laws, having transcribed the aforesaid report, have initialled it and entered it in the volume of documents at folio two hundred and fifty-four, and it shall finally be deposited within the term fixed by law in the Chancery of the Civil Court.\n\nThe chaplain declared that he had administered Holy Baptism, and that it was conferred that same day.\n\nThe same further declared that he gave the child the name MICHELE SALERNO DI RENDE.\n\n[The section for witnesses is left BLANK. The right-hand column, reserved for notification of the baptism by the parish, is also left BLANK.]", "notas": ["«Senza alcun segno al di lui corpo» — sin ninguna señal en el cuerpo. No es un detalle de trámite: lo habitual era dejar al expósito con una prenda partida en dos, media moneda o una cinta, guardando la otra mitad para poder reclamarlo. La ausencia de señal significa que nadie pensaba volver.", "«Salerno» no lo adoptó de mayor: se lo impusieron el mismo día de su hallazgo. A los expósitos se les inventaba apellido, y con frecuencia se echaba mano de un topónimo.", "Quién le puso el nombre: no el cura ni el alcalde, sino el declarante. El formulario dice «Lo stesso ha inoltre dichiarato di dare al bambino il nome di…» — «el mismo», es decir Emiddio Carli, el sirviente del hospicio que lo llevó al ayuntamiento. El capellán Gaetano Barra lo había bautizado esa misma mañana; el alcalde sólo lo escribió.", "El acta dice Cosenza. El apéndice «di Rende» del nombre acabó leyéndose como lugar de nacimiento: en 1858 el alcalde de Castelfranco lo certifica como «esposito nativo di Rende». Michele no podía saber dónde había nacido."], "imgs": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20Michele%20Salerno%20di%20Rende%20-%20Cosenza%20acta%20254.jpg", "t": "Michele Salerno di Rende - Cosenza acta 254"}], "zooms": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20nombre%20impuesto.jpg", "t": "Nombre impuesto"}, {"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1825-05-03%20N%20zoom%20-%20relato%20del%20hallazgo%20en%20el%20torno.jpg", "t": "Relato del hallazgo en el torno"}]}, {"titulo": "Certificate from the mayor of Castelfranco", "tipo": "C", "tipoNombre": "Certificate", "fecha": "agosto de 1858", "lugar": "Castelfranco (hoy Castrolibero)", "ref": "documento del expediente matrimonial", "fuente": [["Hallado en", "Rende, Reg. 50 «Matrimoni, processetti» 1858"], ["Registro", "an_ua35977232 · hash LyxMQVl"]], "literal": "…esposito nativo di Rende…", "traduccion": "Certificate issued by the mayor of Castelfranco for the marriage dossier, in which Michele is described as a «foundling native of Rende».", "notas": ["Contradice al acta de 1825, que lo sitúa en el torno del hospicio de Cosenza. Es la prueba de cómo el «di Rende» de su nombre se convirtió en un lugar de nacimiento."], "imgs": [{"u": "../actas/1825%20-%20Michele%20Salerno%20di%20Rende/1858-08%20C%20Certificado%20del%20alcalde%20de%20Castelfranco%20-%20esposito%20nativo%20di%20Rende.jpg", "t": "Certificado del alcalde de Castelfranco - esposito nativo di Rende"}], "zooms": []}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "22 de agosto de 1858, 14 h", "lugar": "Rende", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Rende > Registro 50"], ["Registro", "an_ua35977235"], ["Página", "20 de 51"]], "literal": "acta 19 | Michele Esposito Salerno | N/A\nacta 19 | Maria Antonia Palermo    | Palermo, Francesco Giacomo  Volpintesta, Carmina", "traduccion": "Marriage celebrated before Luigi Perugini, mayor of Rende. The groom appears as «Michele Esposito Salerno», aged 33, with the parents' box left blank on account of his being a foundling. The bride, Maria Antonia Palermo, aged 19, daughter of Francesco Giacomo Palermo and of Carmina Volpintesta. The dossier preserves the birth records of both and the certificate from the mayor of Castelfranco.", "notas": ["Ese mismo año se casaron en Rende DOS hombres llamados Michele Salerno. El otro es el acta 3: Michele Salerno, hijo de Gaetano Salerno e Isabella Iorio, con Rosa Cundari. Cualquier buscador que cruce «Michele Salerno + Rende + 1858» devuelve al que no es.", "Aceptar al homónimo le pondría padres a un hombre que documentalmente no los tiene, y desviaría la rama entera."], "imgs": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20Michele%20y%20Maria%20Antonia%20-%20Rende%20acta%2019%20-%20doble%20pagina.png", "t": "Michele y Maria Antonia - Rende acta 19 - doble pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20processetti%20-%20transcripcion%20del%20acta%2019.jpg", "t": "Processetti - transcripcion del acta 19"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20registro%20de%20matrimonios%20-%20pagina.jpg", "t": "Registro de matrimonios - pagina"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20visor%20completo.png", "t": "Visor completo"}], "zooms": [{"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20datos%20de%20los%20novios.png", "t": "Datos de los novios"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20b.png", "t": "Documentos presentados b"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados%20c.png", "t": "Documentos presentados c"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20documentos%20presentados.png", "t": "Documentos presentados"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20pie%20y%20celebracion%20canonica.png", "t": "Pie y celebracion canonica"}, {"u": "../actas/1858%20-%20Matrimonio%20Michele%20y%20Maria%20Antonia/1858-08-22%20M%20zoom%20-%20testigos.png", "t": "Testigos"}]}], "nActas": 2, "nImgs": 4, "titulo": "The child at the wheel", "parrafos": ["On 3 May 1825, at one in the afternoon, a child appeared at the foundling wheel of the Cosenza hospice, wrapped in a white cloth and «senza alcun segno al di lui corpo» — with no mark on his body. Two hours later, at three, Emiddio Carli, a servant of the hospice, forty-one years old, resident in the contrada del Ospedale, carried him before the mayor Francesco Barone Ferreri and presented him. The chaplain don Gaetano Barra had already baptised him that same morning.", "The business of the mark is not a piece of boilerplate. The usual thing was to leave a foundling with a garment torn in two, half a coin or a ribbon, and to keep the other half in order to be able to claim him one day. That he carried nothing means nobody intended to come back for him. On the record, the section for witnesses was left blank, and so was the column reserved for the parish to notify the baptism.", "The name was given by the servant, not by the priest or the mayor: the form says «lo stesso ha inoltre dichiarato di dare al bambino il nome di Michele Salerno di Rende», and «the same» is Emiddio Carli. Foundlings had surnames invented for them and a place name was often pressed into service. That «di Rende» stuck to the name ended up being read as a birthplace: in 1858, in order to marry, the mayor of Castelfranco certified him as «esposito nativo di Rende». Michele could not possibly have known where he was born.", "He had three documentary identities and no surname of his own: Salerno, imposed on him that day; Esposito, which was his condition and stayed with him always; and De Rango at Castrolibero, presumably from the household that raised him — his three children are registered there as De Rango. He was a day labourer and illiterate, and he never knew his age: he declared forty-two in 1868, forty-eight in 1870 and forty in 1873. He married at thirty-three to Maria Antonia Palermo, and he was still alive on 5 November 1910, aged eighty-five: the record of his son Domenico's second marriage names him without the «fu» with which that same clerk marks, on the same page, the bride's dead parents. His death has not been located, and since the digitised Rende collections stop precisely in 1910, it will probably have to be sought at the town hall."], "claves": [["How he enters the records", "found at the wheel of the Cosenza hospice, 3 May 1825, 1 p.m."], ["Marks on him", "none"], ["Surnames he used", "Salerno, Esposito and De Rango"], ["Trade", "bracciale, a landless day labourer"], ["Still alive in", "November 1910, aged 85"]]}, "maria_antonia": {"id": "maria_antonia", "nombre": "Maria Antonia Palermo", "legal": "", "rol": "directa", "rolNombre": "Direct line", "gen": 6, "ramas": ["salerno"], "resumen": "Born at Marano Marchesato in March 1839. She married at nineteen a man fourteen years her senior. A countrywoman, and by 1873 a spinner.", "datos": [["Birth", "marzo de 1839, Marano Marchesato — acta 18"], ["Parents", "Francesco Giacomo Palermo y Carmina Volpintesta"], ["Siblings", "Antonio (1841), Annunciata (1845) y Teresa (1852), los tres de Marano Marchesato"], ["Marriage", "22 de agosto de 1858, Rende — acta 19, con 19 años"], ["Spouse", "Michele Salerno"], ["Trade", "contadina; filatrice (hilandera) en 1873"], ["Still alive in", "5 de noviembre de 1910 — figura sin «fu» y residente en Rende en la boda de su hijo Domenico, con 71 años"], ["Death", "sin localizar — posterior a noviembre de 1910"]], "mapa": null, "sinacta": "", "padre": "francesco_giacomo", "madre": "carmina_volpintesta", "conyuge": "michele", "hijos": ["domenico", "arcangela", "francesco", "giovanni"], "hermanos": ["antonio_palermo", "annunciata_palermo", "teresa_palermo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "marzo de 1839, 16 h", "lugar": "Marano Marchesato", "ref": "acta 18", "fuente": [["Hallada en", "Rende, Reg. 50 «Matrimoni, processetti» 1858, pág. 210 de 569"], ["Registro", "an_ua35977232 · hash LyxMQVl"], ["Registrar", "Giuseppe Filippelli, sindaco"]], "literal": "…il nome di Maria Antonia.", "traduccion": "Before Giuseppe Filippelli, mayor and Registrar of the Civil Status, there appeared Giacomo Palermo, aged twenty-seven, who declared that of Carmina Volpentesta, his lawful wife, a girl had been born, upon whom he bestowed the name MARIA ANTONIA.", "notas": ["El índice del blog transcribe esta misma acta 18 de 1839 como «Maria Francesca Palermo». El acta original dice Maria Antonia. Por ese error su nacimiento pareció no existir durante años.", "Como efecto secundario desaparece una hermana que nunca existió: la «Maria Francesca de 1839» y Maria Antonia son la misma persona."], "imgs": [{"u": "../actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20Maria%20Antonia%20Palermo%20-%20acta%2018.jpg", "t": "Maria Antonia Palermo - acta 18"}], "zooms": [{"u": "../actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20zoom%20-%20cabecera%20del%20acta.jpg", "t": "Cabecera del acta"}, {"u": "../actas/1839%20-%20Maria%20Antonia%20Palermo/1839-03%20N%20zoom%20-%20nombre%20impuesto.jpg", "t": "Nombre impuesto"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "22 de agosto de 1858, 14 h", "lugar": "Rende", "ref": "acta 19", "fuente": [["Fondo", "Stato civile della Restaurazione > Rende > Registro 5
