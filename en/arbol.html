zo; that is discussed on his own page, because there is a clash of dates and of village that cannot be papered over.", "CAUTION: IN RENDE THERE WERE AT LEAST FOUR MICHELE VOLPINTESTA AT THE SAME TIME. One the son of Tommaso and Isabella Pellegrino, married in 1758 to Orsola Pellegrino and widowed the following year, who married again in 1759 to Arcangela Pranno and had children in 1761, 1763, 1765, 1768, 1771 and 1774. Another married to Saveria Santanna in 1764. The name on its own is worth nothing: what identifies ours is ALWAYS the wife's name, Teresa Tenuta.", "HIS MARRIAGE IS NOT IN RENDE, AND THAT IS ALREADY A RESULT. The indexes of parish marriages of Rende were read for THIRTY-NINE consecutive years —1733 to 1750 and 1752 to 1772— and in none of them does a Michele Volpintesta marry a Tenuta. ONE SINGLE GAP remains, 1751, which is the only year the blog does not have. The other explanation, simpler, is that they married IN HER PARISH, which is the usual thing, and then the record is in another village nearby."], "imgs": [{"u": "../actas/1793%20-%20Michele%20Volpentesta/1793-08-20%20D%20Muerte%20de%20Michele%20Volpentesta%20-%20Rende%2C%20Santa%20Maria%20Maggiore.jpg", "t": "Muerte de Michele Volpentesta - Rende, Santa Maria Maggiore"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "antonio_luchetta": {"id": "antonio_luchetta", "nombre": "Gio: Antonio Luchetta", "legal": "«il fu Gio: Antonio» in the 1851 record — short for Giovanni Antonio", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "A bracciale from Marano Marchesato, father of Teresa Luchetta. Born around 1750-1760. He was already dead by June 1851.", "datos": [["Birth", "c. 1750-1760, presumably MARANO MARCHESATO — his daughter Teresa is recorded as «nata in Marano suddetto»"], ["Trade", "BRACCIALE (day labourer)"], ["Name", "the record writes «Gio: Antonio», the usual abbreviation for GIOVANNI ANTONIO. The blog index gave him only as «Antonio»"], ["Spouse", "MARIANNA CONFORTI, also deceased by 1851"], ["Documented children", "TERESA LUCHETTA (c. 1779 – 6 June 1851), married to Vincenzo Volpentesta; and an ANTONIO LUCHETTA married to Caterina Cosentino, dead in 1834 (record 17 of the Marano index)"], ["Death", "not located — before June 1851"], ["Where it comes from", "the death record of his daughter Teresa: Marano Marchesato, Morti 1851, record 44"]], "vida": "b.c.1750", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and doubly so. The death record of his daughter Teresa —Marano Marchesato, 6 June 1851, record 44, downloaded and transcribed in her own file— says «figlia del FU GIO: ANTONIO, di professione BRACCIALE, e della FU MARIANNA CONFORTI». And the death index of Marano for 1834, record 17, carries an Antonio Luchetta «di Antonio e Conforti Marianna», married to Caterina Cosentino: a brother of Teresa, who confirms the marriage by a second, independent route.\n\nHis own record would have to be looked for in the Morti of Marano Marchesato earlier than June 1851. The series is on Antenati from 1822, so if he died after that date it is within reach; the sweep of indexes from 1822 to 1867 already carried out did not find him, which pushes his death back to before 1822 and, with it, into the parish registers.", "padre": null, "madre": null, "conyuge": "marianna_conforti", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "marianna_conforti": {"id": "marianna_conforti", "nombre": "Marianna Conforti", "legal": "«la fu Marianna Conforti» in the 1851 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Mother of Teresa Luchetta. Born around 1750-1760, dead before June 1851. Her name appears in two separate documents, which is rare in this genealogy.", "datos": [["Birth", "c. 1750-1760, presumably Marano Marchesato"], ["Spouse", "Gio: Antonio Luchetta, bracciale, also deceased by 1851"], ["Documented children", "TERESA LUCHETTA (c. 1779 – 1851) and ANTONIO LUCHETTA († 1834)"], ["Death", "not located — before June 1851; the record calls her «fu»"], ["Surname", "CONFORTI is the surname of the mayors of Marano for half a century: Francesco Conforti signs Carmina's birth in 1814, Ferdinando Conforti Teresa's death in 1851 and Gioacchino Conforti that of Carmina Spizzirri in 1864. No kinship with any of them is proven"], ["Where it comes from", "the death record of her daughter Teresa (Marano, Morti 1851, record 44) and, by a second route, the Morti index of Marano for 1834, record 17"]], "vida": "b.c.1750", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026. The death record of her daughter Teresa Luchetta —Marano Marchesato, 6 June 1851, record 44— names her in full: «e della FU MARIANNA CONFORTI». It is exactly what the blog index gave, now backed by the document. And there is a second, independent route: the death of 1834, record 17, of an Antonio Luchetta «di Antonio e Conforti Marianna», Teresa's brother.\n\nThat a Marano record should name the mother is not something that can be taken for granted: the record of Vincenzo Volpentesta of 1823 left that box blank, and that of Carmina Spizzirri of 1864 left both blank. Here the clerk filled them in, and with that Teresa Luchetta went from having no paper at all to having father and mother in a single line.", "padre": null, "madre": null, "conyuge": "antonio_luchetta", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_luchetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_palermo": {"id": "giuseppe_palermo", "nombre": "Giuseppe Palermo", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A shepherd and day labourer from Marano Marchesato, father of Francesco Giacomo Palermo. He was born around 1773 and died in his own house on 6 March 1863, aged NINETY. His death record, read in August 2026, at last names his parents: Lorenzo Palermo and Giulia Chiappetta.", "datos": [["Birth", "c. 1781, and not 1773, MARANO MARCHESATO — «nato in Marano medesimo». The birth record of his daughter Aquila (1821) gives him FORTY years; the ninety of his death record of 1863 would give 1773. Eight years apart, and the 1821 figure is the one he gives himself"], ["Parents", "LORENZO PALERMO and GIULIA CHIAPPETTA, both already deceased in 1863 — CONFIRMED by an original record since August 2026"], ["Trade", "BRACCIALE in June 1821, when declaring Aquila's birth; PASTORE in December 1838, when he married off his daughter Rosalia; BRACCIALE again in his death record of 1863"], ["Address", "Marano Marchesato, CONTRADA MALVITANI — the only known address of this family, and it comes from the 1821 record"], ["Spouse", "CARMINA SPIZZIRRI, contadina († 11 October 1864) — confirmed by two records: Rosalia's of 1838 and his own of 1863"], ["Documented children", "AQUILA, born on 22 June 1821 and CONFIRMED BY RECORD (Marano, record 34), and ROSALIA, married in 1838 and likewise confirmed by record — AND THEY ARE THE SAME WOMAN: her marriage dossier of 1838 presents record 34 of 1821 as the bride's certificate. By index, further: Antonio Benedetto (1812), Francesca (1816), Vincenzo (1818) and Francesca (1823). And Francesco Giacomo, his son beyond doubt"], ["Death", "6 March 1863, 8 a.m., in his own house — Marano Marchesato, record 24"], ["Alive in", "8 December 1838, Marano Marchesato"]], "vida": "c.1781–1863", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "lorenzo_palermo", "madre": "giulia_chiappetta", "conyuge": "carmina_spizzirri", "unionLibre": false, "otrasParejas": [], "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "6 March 1863, 16 h (the record); died at 8 h", "lugar": "Marano Marchesato", "ref": "record 24", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 55 «Morti» 1863"], ["Register", "container hash: wRlVKnp"], ["Page", "14 of 85, LEFT-hand column (on the right, record 25)"], ["Handwritten year", "«mille ottocento sessantatre» — agrees with the catalogue"], ["Registrar", "Costantino Belmonte, sindaco; chancellor Salvadore Spizzirri"], ["How it was located", "two records per image and the order number PRINTED in the heading; the straight line is record = 2 × page − 4, and the first probe, on page 14, fell exactly on records 24 and 25"]], "literal": "…è morto nella propria sua casa GIUSEPPE PALERMO sposo di Carmina Spizzirri, nato in Marano medesimo, figlio di fu Lorenzo di professione ——— domiciliato ———, e di fu Giulia Chiappetta domiciliata ——— di anni novanta di professione Bracciale domiciliato ivi.", "traduccion": "In the year eighteen hundred and sixty-three, on the SIXTH day of the month of MARCH, at sixteen hours, before Us, COSTANTINO BELMONTE, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIOVANNI CALDARAZZO, aged forty-three, by trade a PINTORE, of the kingdom, resident at Marano, and GAETANO ZICCARELLI, aged fifty, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the SIXTH day of the month of MARCH of the current year, at EIGHT hours, there died IN HIS OWN HOUSE GIUSEPPE PALERMO, HUSBAND OF CARMINA SPIZZIRRI, born in the said Marano, SON OF THE LATE LORENZO — by trade (blank), resident (blank) — AND OF THE LATE GIULIA CHIAPPETTA, resident (blank), AGED NINETY, by trade a BRACCIALE, resident in the same place.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained his actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, while the witnesses declared that they COULD NOT WRITE.", "notas": ["IT IS THE RECORD THAT ADDS A GENERATION ON THE PALERMO SIDE. The death of his son Francesco Giacomo (Rende, 1867, record 35) broke off at «figlio del fu Giuseppe» and did not name the mother. Here, by contrast, the Marano form fills in both boxes: LORENZO PALERMO and GIULIA CHIAPPETTA, both already dead in 1863. It confirms point by point what the blog index gave.", "NINETY YEARS OLD. It is the highest age in the whole genealogy and places his birth c. 1773, in the full Bourbon Kingdom of Naples, thirty-six years before civil registration existed. His certificate of baptism, if it survives, is in the parish of S. Maria del Carmine of Marano.", "THE TRADE CHANGES, and it is not an error. In 1838 his daughter Rosalia's marriage record calls him PASTORE; here, twenty-five years later, BRACCIALE. At ninety he would no longer be out with the flock, and «bracciale» is the default category of the Marano clerk. His son Giacomo was a pecoraio (shepherd) all his life, which is the same as pastore.", "WHAT IDENTIFIES THIS MAN AND NO OTHER is «sposo di Carmina Spizzirri». In Marano at least eight distinct Palermo families live side by side; the forename alone is worth nothing.", "The first informant, Giovanni Caldarazzo, is PINTORE — painter. It is an uncommon trade in these registers, where almost everybody is bracciale or contadino."], "imgs": [{"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20Giuseppe%20Palermo%20-%20Marano%20Marchesato%20acta%2024.jpg", "t": "Giuseppe Palermo - Marano Marchesato acta 24"}], "zooms": [{"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20acta%2024%20completa.jpg", "t": "Acta 24 completa"}, {"u": "../actas/1863%20-%20Giuseppe%20Palermo/1863-03-06%20D%20zoom%20-%20hijo%20del%20fu%20Lorenzo%20y%20de%20la%20fu%20Giulia%20Chiappetta%2C%2090%20anos.jpg", "t": "Hijo del fu Lorenzo y de la fu Giulia Chiappetta, 90 anos"}]}], "nActas": 1, "nImgs": 3, "titulo": "From four words to two generations", "parrafos": ["For months everything known about him fitted into four words. On 14 May 1867 two neighbours from Rende with village trades — Pasquale Sacco, a carter, and Costantino Perugini, a tailor — reported the death of his son Giacomo Palermo, a shepherd. The parentage of the deceased was settled like this: «figlio del fu Giuseppe». A name, and nothing else. No mother, no village, no age.", "In August 2026 his own record turned up, and it is one of those that change a whole tree. He died on 6 March 1863 at eight in the morning, in his own house at Marano Marchesato, and record 24 puts him at NINETY YEARS OLD: the greatest age in this entire genealogy. And it names his parents — LORENZO PALERMO and GIULIA CHIAPPETTA, both already dead — so the line climbs at a stroke to people born around 1740-1750, thirty years before civil registration existed in Calabria.", "The trade comes and goes with the years, like his son's: bracciale in June 1821, when he registers his daughter Aquila's birth; pastore in December 1838, when he marries her off; and bracciale again when he dies. The only known address of this family comes from that 1821 record: contrada Malvitani, at Marano.", "One discrepancy remains unresolved, and it is better not to paper over it. The ninety years of 1863 place his birth around 1773; but in 1821, declaring for himself, he said he was forty, which would give 1781. Eight years apart. The 1821 figure comes from his own mouth and the 1863 one from two neighbours, so the first is probably the sound one."], "claves": [["Birth", "c. 1781 by his own declaration in 1821; c. 1773 by his death record"], ["Parents", "Lorenzo Palermo and Giulia Chiappetta — CONFIRMED by record"], ["Trade", "bracciale and pastore, depending on the year"], ["Address", "contrada Malvitani, Marano Marchesato"], ["Death", "6 March 1863, aged ninety — Marano, record 24"]]}, "carmina_spizzirri": {"id": "carmina_spizzirri", "nombre": "Carmina Spizzirri", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman of Marano Marchesato, wife of Giuseppe Palermo. She was born around 1789 and died a widow on 11 October 1864. Her death record was sought precisely to get her parents out of it, and it is the one document in the tree that leaves those two boxes deliberately blank; her age is fixed better by the birth of her daughter Aquila in 1821 than by that record.", "datos": [["Birth", "c. 1789, MARANO MARCHESATO — «nata in Marano medesimo». The 32 years her husband declares in 1821 give 1789; the 70 of the death record of 1864 would give 1794. The first figure is preferred"], ["Parents", "NOT KNOWN. The 1864 record says «figlia del fu ———» and «della fu ———», with both names left blank. All it proves is that by October 1864 both were already dead"], ["Trade", "CONTADINA (countrywoman)"], ["Spouse", "Giuseppe Palermo, pastore and bracciale († 6 March 1863)"], ["Daughters documented by record", "AQUILA PALERMO, born on 22 June 1821 (Marano, record 34), and ROSALIA PALERMO, married in December 1838 (record 19). THEY ARE THE SAME WOMAN, not two: her marriage dossier proves it. The Marano indexes give her other children besides, between 1812 and 1823"], ["Widowed since", "6 March 1863 — eighteen months of widowhood"], ["Death", "11 October 1864, 11 a.m., in her own house — Marano Marchesato, record 74"], ["Checked twice", "on 29 August 2026 the Marano index of the dead for 1864 was also read in the transcriptions of the Calabrian blog: the row for record 74 carries only «Spizzirri» in the parents' column, with no forenames, exactly as the original record does. Nobody is at fault: the gaps are on the paper. The spouse column says «Giuseppe Palermo», which is the only thing that identifies her — because in that same index there is ANOTHER Carmina Spizzirri, married to a Giuseppe Pellegrino"]], "vida": "c.1789–1864", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": null, "madre": null, "conyuge": "giuseppe_palermo", "unionLibre": false, "otrasParejas": [], "hijos": ["francesco_giacomo", "aquila_palermo"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "12 October 1864, 15 h (the record); died on the 11 at 11 h", "lugar": "Marano Marchesato", "ref": "record 74", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 56 «Morti» 1864"], ["Register", "container hash: 0Aq9RaN"], ["Page", "39 of 60, LEFT-hand column (on the right, record 75)"], ["Handwritten year", "«mille ottocento sessantaquattro» — agrees with the catalogue"], ["Registrar", "Gioacchino Conforti, sindaco; chancellor Salvadore Spizzirri"], ["How it was located", "a probe on page 38 = records 72 and 73; the straight line record = 2 × page − 4 puts 74 on page 39"]], "literal": "…è morta nella propria sua casa CARMINA SPIZZIRRI vedova di Giuseppe Palermo, nata in Marano medesimo, figlia del fu ————— di professione ——— domiciliato ———, e della fu ————— domiciliata ——— di anni settanta di professione Contadina domiciliata ivi.", "traduccion": "In the year eighteen hundred and sixty-four, on the TWELFTH day of the month of OCTOBER, at fifteen hours, before Us, GIOACCHINO CONFORTI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared GIULIO DE LUCA, aged forty, by trade an ARMIERE, of the kingdom, resident at Marano, and VINCENZO BELMONTE, aged thirty-three, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the ELEVENTH day of the month of OCTOBER of the current year, at ELEVEN hours, there died IN HER OWN HOUSE CARMINA SPIZZIRRI, WIDOW OF GIUSEPPE PALERMO, born in the said Marano, DAUGHTER OF THE LATE (name blank) — by trade (blank), resident (blank) — AND OF THE LATE (name blank), resident (blank), AGED SEVENTY, by trade a CONTADINA, resident in the same place.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained her actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, while the witnesses declared that they could not write.", "notas": ["THIS RECORD WAS APPROACHED FOR THE PARENTS, AND THEY ARE NOT THERE. It was the only place where they could appear, because the blog index does not give them. The answer is negative, but it is a clean negative and not a gap in the reading: the printed form has both boxes, the clerk wrote both «fu» —«figlia DEL FU...», «e DELLA FU...»— and left both NAMES blank, with the printed rules unfilled. He knew they were dead and did not know what they were called, or the informants did not tell him.", "THE ONLY THING TO BE GOT out of those two lines is that in October 1864 Carmina's father and mother were already dead. For the names there now remain only the parish books of Marano earlier than 1809 or her marriage record with Giuseppe Palermo, which is earlier than 1812 and therefore also parish.", "THIS NOTE WAS RESOLVED ON 26 AUGUST 2026 — READ IT KNOWING HOW IT ENDS. The birth record of her daughter AQUILA (Marano, 22 June 1821, record 34) has her husband declare that the mother is THIRTY-TWO years old. That puts her in 1789, not in 1794, and with 1789 she would have been eighteen when Francesco Giacomo was born, not thirteen. The chronological objection that follows collapses. The age of 1821 is far more reliable than that of 1864: it is given by her husband within days of the birth; the seventy of 1864 were given by a gunsmith and a day labourer standing over a corpse.", "THE AGE OPENS A SERIOUS PROBLEM [text of August 2026, before reading the 1821 record]. Seventy years old in October 1864 makes her born c. 1794. Her husband, ninety when he died in 1863, was born c. 1773: twenty-one years older. And above all, FRANCESCO GIACOMO PALERMO was born c. 1805-1812 according to the ages he himself kept declaring, which would make Carmina between eleven and eighteen. With the other children it fits well —Antonio Benedetto 1812, Francesca 1816, Vincenzo 1818, Aquila 1821, Francesca 1823: from eighteen to twenty-nine— but Francesco Giacomo falls outside or just on the edge.", "CONSEQUENCE: that Carmina Spizzirri is the MOTHER of Francesco Giacomo can no longer be taken as good. What remains proven is that Giuseppe Palermo was his father («figlio del fu Giuseppe», Rende 1867) and that Giuseppe was married to Carmina. But it is perfectly possible that Francesco Giacomo is from an EARLIER marriage of Giuseppe, who by c. 1807 was already in his thirties. It would be settled by the birth of Francesco Giacomo (Marano, c. 1807, parish) or by Giuseppe's marriage to Carmina.", "CLOSING OF THAT CONSEQUENCE: with the thirty-two years of 1821, Giuseppe's earlier marriage ceases to be needed. That Carmina is the mother of Francesco Giacomo is still not proven —there is no document naming them together— but it becomes once more the simplest reading, and it no longer clashes with any arithmetic.", "The first informant, Giulio De Luca, is ARMIERE — gunsmith. Another rare trade in a register where almost all are bracciali."], "imgs": [{"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20Carmina%20Spizzirri%20-%20Marano%20Marchesato%20acta%2074.jpg", "t": "Carmina Spizzirri - Marano Marchesato acta 74"}], "zooms": [{"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20acta%2074%20completa.jpg", "t": "Acta 74 completa"}, {"u": "../actas/1864%20-%20Carmina%20Spizzirri/1864-10-11%20D%20zoom%20-%20filiacion%20en%20blanco%2C%20del%20fu%20y%20della%20fu%20sin%20nombres.jpg", "t": "Filiacion en blanco, del fu y della fu sin nombres"}]}], "nActas": 1, "nImgs": 3, "titulo": "The record that was sought and came back blank", "parrafos": ["Her death record was sought for a precise reason: it was the one place in the world where her parents' names could appear. The Calabrian blog's index did not give them, and above 1809 there is no civil registration in Calabria.", "The record turned up — Marano Marchesato, 12 October 1864, record 74 — and the answer is negative. The printed form says «figlia del fu ———» and «della fu ———», with both names left blank. It is the only document in the whole tree that leaves those two boxes deliberately empty. All it proves is that by October 1864 her father and mother were both dead.", "And it is not a gap in the reading. On 29 August 2026 it was checked by a second route: the Marano death index for 1864, transcribed by someone else, gives in the row for record 74 only «Spizzirri» in the parents column, with no names, exactly as the original does. The gaps are in the paper.", "What the record does give, and it is not nothing, is her identity. The spouse column says «Giuseppe Palermo», and that pins her down beyond error — because in that same index there is ANOTHER Carmina Spizzirri, married to a Giuseppe Pellegrino. She died on 11 October 1864 at eleven in the morning, at home, after eighteen months of widowhood.", "Her age, on the other hand, is better fixed by another document. The 1864 record puts her at seventy, which would give 1794; but in June 1821 her husband declared her thirty-two, which gives 1789. For her parents' names all that is left are the Marano parish books before 1809, or her marriage record."], "claves": [["Birth", "c. 1789 — the 1821 figure, more reliable than her own record's"], ["Parents", "STILL UNKNOWN: the record leaves both boxes blank"], ["What the record does prove", "that by October 1864 both her parents were dead"], ["How she is identified", "by the spouse column: there is another Carmina Spizzirri in the same index"], ["Death", "11 October 1864, aged seventy — Marano, record 74"]]}, "vincenzo_volpintesta": {"id": "vincenzo_volpintesta", "nombre": "Vincenzo Volpintesta", "legal": "VOLPENTESTA in the Marano records; Volpintesta in those of Rende", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer from Marano Marchesato, father of Carmina Volpintesta. He was born around 1773 and died at home on 19 March 1823, aged fifty, when his daughter Carmina was eight. His death record gives his father's name: Michele.", "datos": [["Birth", "c. 1773, MARANO MARCHESATO — «nato in Marano suddetto». His daughter's birth record, of 1814, gives him thirty-eight years, which would point rather to 1776; declared ages are approximate"], ["Parents", "MICHELE VOLPENTESTA, bracciale, already deceased in 1823 — CONFIRMED by record. The MOTHER IS NOT NAMED: that box of the record was left blank"], ["Trade", "BRACCIALE (day labourer) — the same as his father"], ["Spouse", "TERESA LUCHETTA († 6 June 1851) — CONFIRMED by record since August 2026, from both ends: he is «sposo di Teresa Luchetta» in 1823 and she is «vedova di Vincenzo Volpentesta» in 1851"], ["Documented children", "CARMINA (12 May 1814), the one who married Francesco Giacomo Palermo; and EMMANUELE, married to Michelina Cairo, dead in 1864 (record 11 of the Marano index)"], ["Death", "19 March 1823, noon, in his own house — Marano Marchesato, record 8"]], "vida": "c.1773–1823", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "michele_volpintesta", "madre": null, "conyuge": "teresa_luchetta", "unionLibre": false, "otrasParejas": [], "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "19 March 1823, 18 h (the record); died at 12 h", "lugar": "Marano Marchesato", "ref": "record 8", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 15 «Morti» 1823"], ["Register", "container hash: 5Y44mlm"], ["Page", "6 of 33, LEFT-hand column (on the right, record 9)"], ["Handwritten year", "«mille ottocento ventitre» — agrees with the catalogue"], ["Registrar", "Raffaele Ruffolo, sindaco"], ["How it was located", "this register carries no alphabetical index. One probe on page 5 gave records 6 and 7, from which comes the straight line record = 2 × page − 4 and record 8 on the following page"]], "literal": "…è morto nella propria sua casa VINCENZO VOLPENTESTA, nato in Marano suddetto, figlio del fu Michele di professione Bracciale domiciliato ———, e di ————— domiciliata ————— di anni cinquanta di professione Bracciale domiciliato ivi, e sposo di Teresa Luchetta.", "traduccion": "In the year eighteen hundred and twenty-three, on the NINETEENTH day of the month of MARCH, at eighteen hours, before Us, RAFFAELE RUFFOLO, mayor and registrar of the civil status of the Comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared NICOLA ROSSO, aged forty, by trade a BRACCIALE, of the kingdom, resident at Marano, and ANTONIO CAIRO, aged thirty-eight, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the NINETEENTH day of the month of MARCH of the current year, at TWELVE hours, there died IN HIS OWN HOUSE VINCENZO VOLPENTESTA, born in the said Marano, SON OF THE LATE MICHELE, by trade a BRACCIALE, resident (blank), AND OF (name blank), resident (blank), AGED FIFTY, by trade a BRACCIALE, resident in the same place, AND HUSBAND OF TERESA LUCHETTA.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained his actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, and signed with a CROSS by the witnesses, who are unlettered.", "notas": ["«E SPOSO DI TERESA LUCHETTA» IS THE LINE THAT IDENTIFIES HIM. In Marano at least four or five Vincenzo Volpintesta live at the same time —one married to Arcangela Bartelli, another to Rosa Mancino, another the son of Antonio and Francesca Morrone, another the son of Ferdinando and Anna Maria Tenuta—. The name on its own is worth nothing; the spouse is. And it fits with Carmina's birth record of 1814, where he himself is the informant and names Teresa Luchetta.", "THE FATHER, YES: «figlio del FU MICHELE di professione BRACCIALE». It confirms what the index gave and adds the trade, which is inherited: Michele bracciale, Vincenzo bracciale.", "THE MOTHER, NO. The blog index gave Vincenzo as the son of Michele and of TERESA TENUTA. The record has the box —«e di ————— domiciliata —————»— and the clerk left it empty. Teresa Tenuta therefore remains without any documentary support, and that is why no page has been opened for her in this tree. Beware, moreover, that in the same village there is another Vincenzo Volpintesta, son of Ferdinando and of ANNA MARIA TENUTA: that mother's surname is the same, and the family is not.", "FIFTY YEARS OLD at death, that is, born c. 1773. The birth record of his daughter Carmina, of May 1814, gave him thirty-eight, which would give 1776. Three years' difference is the normal thing in these registers; neither figure is a census.", "HE DIED YOUNG AND LEFT CARMINA FATHERLESS AT EIGHT. She was born in May 1814 and he died in March 1823. Teresa Luchetta was left a widow in her thirties and so remained twenty-eight years more, until 1851: in her death record they still call her «vedova di Vincenzo Volpentesta».", "The heading of the record carries the month CROSSED OUT —the clerk had been carrying «Febbrajo» over from the preceding records— and corrected. The body of the record says MARZO twice, beyond doubt.", "29 AUGUST 2026 — A BAPTISM HAS TURNED UP THAT COULD BE HIS, AND WHAT DOES NOT FIT MUST BE TOLD TOO. His father Michele died in RENDE in 1793, so his children had to be baptised there. The baptismal books of the parish of Rende begin in 1731 and are transcribed, year by year, in the Calabrian blog we already had downloaded on disc. They were swept. And in that of 1770 there is this: RENDE, BAPTISMS OF 1770, RECORD 48 — VINCENZO MERCURIO VOLPINTESTA, «Volpintesta, Michele — Tenuta, Teresa».\n\nIt fits on four counts: the name, the father MICHELE —the only thing his death record says of his parents—, the mother TERESA TENUTA —which is precisely the box that record left blank— and the village. And he has two brothers in the same tables: PIETRO GAETANO (baptisms of 1767, record 13) and GREGORIO GIOACCHINO (baptisms of 1773, record 41), both children of the same couple. The family was in Rende in 1767, in 1770 and in 1773. BUT HIS OWN DEATH RECORD SAYS HE WAS BORN IN MARANO: «nato in Marano suddetto». And the ages do not tally: that of 1823 gives him fifty years (born c. 1773) and the record of his daughter Carmina, of 1814, gives him thirty-eight (born c. 1776). The baptism is of 1770. The two honest readings are: either it is he, and the ages come rounded —they were declared by two illiterate day labourers fifty-three years later, and the «born in Marano» could have been a supposition of the clerk—, or it is an elder brother who died as a child and whose name was repeated, which was a common custom. In favour of the first: in the Rende baptisms from 1774 to 1783, swept one by one, there is NO other child of Michele and Teresa Tenuta nor a second Vincenzo; and of Marano there exist no books earlier than 1809 in any consultable place. IT IS NOT TAKEN AS GOOD. It is a transcription made by someone else, not the book. And the book is not in Antenati —the Rende holding begins in 1809 and this is parish material of 1770—: it is on a FamilySearch film. To check it one must request there the BAPTISMS of the parish of RENDE (Cosenza), YEAR 1770, RECORD 48."], "imgs": [{"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20Vincenzo%20Volpintesta%20-%20Marano%20Marchesato%20acta%208.jpg", "t": "Vincenzo Volpintesta - Marano Marchesato acta 8"}], "zooms": [{"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20acta%208%20completa.jpg", "t": "Acta 8 completa"}, {"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20copia%20certificada%20de%201837%2C%20la%20madre%20sigue%20en%20blanco.jpg", "t": "Copia certificada de 1837, la madre sigue en blanco"}, {"u": "../actas/1823%20-%20Vincenzo%20Volpintesta/1823-03-19%20D%20zoom%20-%20hijo%20del%20fu%20Michele%2C%20edad%2050%20y%20esposo%20de%20Teresa%20Luchetta.jpg", "t": "Hijo del fu Michele, edad 50 y esposo de Teresa Luchetta"}]}], "nActas": 1, "nImgs": 4, "titulo": "Fifty years old, and his father's name", "parrafos": ["He entered this tree sideways, in a record that was not his. The death record of his son-in-law Giacomo Palermo (Rende, 14 May 1867) said he was the «marito di Carmina Volpintesta fu Vincenzo»: four words written for something else that proved two, that Carmina's father was called Vincenzo and that he was already dead.", "In August 2026 his own record turned up and the detour is no longer needed. He died on 19 March 1823 at midday, at his house in Marano Marchesato, aged fifty, when his daughter Carmina was eight. Record 8 gives his trade — bracciale, day labourer — and his father's name: «figlio del FU MICHELE di professione BRACCIALE». The trade was inherited: Michele bracciale, Vincenzo bracciale. The mother, though, is not named: that box was left blank, as in so many others across the district.", "There is a detail that makes that record indispensable and no other. At Marano there live at the same time at least four or five Vincenzo Volpintestas — one married to Arcangela Bartelli, another to Rosa Mancino, another the son of Antonio and Francesca — and without a line to tell them apart any of them would do. The one that identifies him is «e sposo di TERESA LUCHETTA».", "She outlived him by twenty-eight years, and her own record, of 1851, calls her «vedova di Vincenzo Volpentesta». The marriage is confirmed from both ends."], "claves": [["Birth", "c. 1773 by his own record; c. 1776 by his daughter's in 1814"], ["Father", "Michele Volpentesta, bracciale, already dead in 1823 — CONFIRMED by record"], ["Mother", "not named: the box was left blank"], ["How he is told apart", "by his wife: there are several Vincenzo Volpintestas at Marano at once"], ["Death", "19 March 1823, aged fifty — Marano, record 8"]]}, "teresa_luchetta": {"id": "teresa_luchetta", "nombre": "Teresa Luchetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman of Marano Marchesato, wife of Vincenzo Volpentesta and mother of Carmina. She was born around 1779 and died on 6 June 1851, aged seventy-two, after twenty-eight years of widowhood. Until August 2026 she was the only person in the tree without a single document; she now has a record of her own and both parents named.", "datos": [["Birth", "c. 1779, MARANO MARCHESATO — «nata in Marano suddetto», from the seventy-two years the death record gives her. Her daughter's record, of 1814, gave her thirty-one years, which would point to 1783"], ["Parents", "GIO: ANTONIO LUCHETTA, bracciale, and MARIANNA CONFORTI, both already deceased in 1851 — CONFIRMED by an original record since August 2026"], ["Trade", "CONTADINA (countrywoman)"], ["Spouse", "VINCENZO VOLPENTESTA, bracciale († 19 March 1823) — CONFIRMED by record"], ["Documented children", "CARMINA (12 May 1814) and EMMANUELE, married to Michelina Cairo, dead in 1864"], ["Widowed since", "March 1823 — twenty-eight years of widowhood"], ["Death", "6 June 1851, 8 a.m., in her own house — Marano Marchesato, record 44"]], "vida": "c.1779–1851", "lug": "MARANO MARCHESATO", "mapa": null, "sinacta": "", "padre": "antonio_luchetta", "madre": "marianna_conforti", "conyuge": "vincenzo_volpintesta", "unionLibre": false, "otrasParejas": [], "hijos": ["carmina_volpintesta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "6 June 1851, 15 h (the record); died at 8 h", "lugar": "Marano Marchesato", "ref": "record 44", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Marano Marchesato > Registro 43 «Morti» 1851"], ["Register", "container hash: 5Y46Aky"], ["Page", "24 of 51, LEFT-hand column (on the right, record 45)"], ["Handwritten year", "«mille ottocento cinquantuno» — agrees with the catalogue"], ["Registrar", "Ferdinando Conforti, sindaco — the same man who registered her granddaughter Teresa Palermo in January 1852"], ["How it was located", "a probe on page 23 = records 42 and 43, with the order number printed in the heading; 44 falls on page 24"]], "literal": "…è morta nella propria sua casa TERESA LUCHETTA, nata in Marano suddetto, figlia del fu Gio: Antonio di professione Bracciale domiciliato ———, e della fu Marianna Conforti domiciliata ——— di anni settantadue di professione Contadina domiciliata ivi, vedova di Vincenzo Volpentesta.", "traduccion": "In the year eighteen hundred and fifty-one, on the SIXTH day of the month of JUNE, at fifteen hours, before Us, FERDINANDO CONFORTI, mayor and registrar of the Civil Status of the comune of MARANO MARCHESATO, district of Cosenza, province of Calabria Citra, there appeared IGNAZIO CONFORTI, aged fifty, by trade a BRACCIALE, of the kingdom, resident there, and GIUSEPPE ZUPPO, aged twenty-eight, by trade a BRACCIALE, of the kingdom, resident in the same place.\n\nWho declared that on the SIXTH day of the month of JUNE of the current year, at EIGHT hours, there died IN HER OWN HOUSE TERESA LUCHETTA, born in the said Marano, DAUGHTER OF THE LATE GIO: ANTONIO, by trade a BRACCIALE, resident (blank), AND OF THE LATE MARIANNA CONFORTI, resident (blank), AGED SEVENTY-TWO, by trade a CONTADINA, resident in the same place, WIDOW OF VINCENZO VOLPENTESTA.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained her actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above. The witnesses declared that they COULD NOT WRITE.", "notas": ["IT IS THE BEST OF THE FIVE RECORDS IN THIS BATCH. It gives the spouse, both parents, the age and the trade, all in the same paragraph, and confirms point by point what until now was a line in a blog index without any support.", "FROM HAVING NOTHING TO HAVING EVERYTHING. In August 2026 it had been written of her that she was «the only one of the four ancestors without papers who remains exactly as she was» and that «of Teresa Luchetta there is today absolutely nothing, only a name inherited from a blog index». This record cancels all of that.", "«FIGLIA DEL FU GIO: ANTONIO». The record writes the common abbreviation of GIOVANNI ANTONIO, not a plain «Antonio» as the index gave. And it gives him a trade: bracciale.", "«E DELLA FU MARIANNA CONFORTI». The mother, with forename and surname. That a Marano record should name the mother is not a sure thing: that of her husband Vincenzo, of 1823, left that box blank, and that of Carmina Spizzirri, of 1864, left both blank.", "IT TALLIES BY A SECOND ROUTE. The index of Marano deaths of 1834, record 17, brings an ANTONIO LUCHETTA «di Antonio e Conforti Marianna», married to Caterina Cosentino: a brother of hers. Two independent documents giving the same marriage of parents.", "SEVENTY-TWO YEARS OLD, that is, born c. 1779. The birth record of her daughter Carmina, of May 1814, gave her thirty-one years, which would give 1783. Four years' difference, within the ordinary. She was widowed at about forty-four and lived as a widow twenty-eight years more.", "She died seven months before the birth of her great-granddaughter Teresa Palermo, who was registered by the same mayor, Ferdinando Conforti, in January 1852."], "imgs": [{"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20Teresa%20Luchetta%20-%20Marano%20Marchesato%20acta%2044.jpg", "t": "Teresa Luchetta - Marano Marchesato acta 44"}], "zooms": [{"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20acta%2044%20completa.jpg", "t": "Acta 44 completa"}, {"u": "../actas/1851%20-%20Teresa%20Luchetta/1851-06-06%20D%20zoom%20-%20hija%20del%20fu%20Gio%20Antonio%20y%20de%20la%20fu%20Marianna%20Conforti.jpg", "t": "Hija del fu Gio Antonio y de la fu Marianna Conforti"}]}], "nActas": 1, "nImgs": 3, "titulo": "From having nothing to having everything", "parrafos": ["Her name came from a single place, and that place turned out not to exist. She was credited to a marriage banns record at Marano Marchesato in 1837, for the wedding of her daughter Carmina to Francesco Giacomo Palermo. It was searched for and it is not there: the 1837 register carries an alphabetical index at the end, with its twenty-five weddings one by one, and there is not a single Palermo or Volpintesta; the dossier file for that year, two hundred and thirty-five pages long, corresponds exactly to those twenty-five and leaves no room for a twenty-sixth. The wedding was at Rende, not at Marano.", "For a time she was therefore the only person in the tree without a single document. It was even written of her that she was «the only one of the four undocumented forebears still exactly where she was».", "And then her record appeared, and it turned out to be the best of the whole batch. Marano Marchesato, 6 June 1851, record 44. She died at eight in the morning in her own house, aged seventy-two, after twenty-eight years of widowhood. In a single paragraph the form gives the spouse — «vedova di Vincenzo Volpentesta» — the age, the trade of contadina and BOTH PARENTS: GIO: ANTONIO LUCHETTA, bracciale, and MARIANNA CONFORTI, both already dead. It is rare for these records to name the mother; this one does.", "With that, two more names of the 1740-1760 generation enter the tree, and the woman who had nothing became the one who gives most. Her own birth, around 1779, is now out of reach by the civil route: only the books of the parish of S. Maria del Carmine at Marano would hold it."], "claves": [["Birth", "c. 1779 by her own record; c. 1783 by her daughter's in 1814"], ["Parents", "Gio: Antonio Luchetta and Marianna Conforti — CONFIRMED by record"], ["Trade", "contadina, countrywoman"], ["Widowed since", "March 1823 — twenty-eight years of widowhood"], ["Death", "6 June 1851, aged seventy-two — Marano, record 44"]]}, "raffaele_chiappetta": {"id": "raffaele_chiappetta", "nombre": "Raffaele Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer born in Castrolibero around 1805. Father of Giovanni Chiappetta and therefore great-grandfather of the Argentine Salernos. He died a widower at Rende, contrada Surdo, on 3 December 1880, aged seventy-five, one year less twelve days after his wife.", "datos": [["Birth", "c. 1805, CASTROLIBERO — from the 75 years the death record gives him"], ["Parents", "Pietro Chiappetta, bracciante, who lived and died at Castrolibero; the mother is NOT stated in the record, only that she had already died"], ["Trade", "bracciale / bracciante (day labourer)"], ["Spouse", "Teresa Molinaro († 19 December 1879) — he dies «vedovo di» her"], ["Documented children", "Giovanni (c. 1848); probably also Pasquale, who in 1883 declares 28 years, and Vincenzo and Pietro, witnesses at Rende"], ["Residence", "Rende, contrada Surdo"], ["Death", "3 December 1880, 3 p.m., Rende — record 135, aged 75"]], "vida": "c.1805–1880", "lug": "CASTROLIBERO", "mapa": null, "sinacta": "", "padre": "pietro_chiappetta", "madre": null, "conyuge": "teresa_molinaro", "unionLibre": false, "otrasParejas": [], "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "3 December 1880, 15 h", "lugar": "Rende", "ref": "record 135", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 72 «Morti» 1880"], ["Register", "container hash: LyxaZkV"], ["Page", "35 of 42"], ["Placement", "right-hand column, upper half of the opening"], ["Handwritten year", "«milleottocento ottanta» — agrees with the catalogue"], ["Registrar", "Martino Vincenzo, senior assessor for the mayor"]], "literal": "…è morto Chiappetta Raffaele di anni settantacinque, di bracciante, residente in\nRende, nato in Castrolibero, da fu Pietro, bracciante, domiciliato in detto\nCastrolibero, e da fu ————, domiciliata in ————, vedovo di Molinaro Teresa.", "traduccion": "In the year eighteen hundred and eighty, on the fourth day of December, at ten in the morning, at the town hall.\n\nBefore me, MARTINO VINCENZO, senior assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared BRUNO SALVATORE, aged thirty, bracciante, resident at Rende, and STELLATO ANDREA, aged thirty-seven, bracciante, resident at Rende.\n\nWho declared to me that at three in the afternoon YESTERDAY, in the house situated in CONTRADA SURDO, there died CHIAPPETTA RAFFAELE, AGED SEVENTY-FIVE, by trade a BRACCIANTE (day labourer), resident at Rende, BORN AT CASTROLIBERO, SON OF THE LATE PIETRO, bracciante, resident in the said Castrolibero, AND OF THE LATE ———— (the name is left blank), WIDOWER OF MOLINARO TERESA.\n\nPresent at this act as witnesses were ROSSA LUIGI (uncertain reading), aged sixty-six, MURATORE (stonemason), and ROSSA GIUSEPPE, aged thirty-seven, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, they being illiterate. — Vincenzo Martino.", "notas": ["THE AGE, WHICH IS WHAT WAS BEING SOUGHT. Seventy-five years old on 3 December 1880: he was born c. 1805, most likely in 1805 and not later. He is the earliest-born ancestor reached by this line after Giuseppe Palermo.", "HE WAS BORN IN CASTROLIBERO. It was suspected from the marriage of his son Giovanni, who declared he had been born there; the record confirms it directly for the father. The Chiappetta family is from Castrolibero and only afterwards comes down to Rende.", "THE FATHER: PIETRO CHIAPPETTA, «fu Pietro, bracciante, domiciliato in detto Castrolibero». The index already gave him and the original record confirms it, and it adds besides his trade and that he lived in Castrolibero. The «fu» says he had died before December 1880.", "THE MOTHER IS STILL WITHOUT A NAME. The form has her box —«e da ______ domiciliata in ______»— and the clerk wrote only «fu» and left the name blank. It is not a slip in the reading: on the father's line, in the same breath, he did put name and trade. The datum does not exist in the record. All that can be got out of it is that she too had already died.", "«VEDOVO DI MOLINARO TERESA». He died a widower: his wife had gone ahead of him by eleven and a half months, on 19 December 1879. And the surname is written MOLINARO, not «Mulinaro».", "The two of them lived in CONTRADA SURDO, the same in which Carmina Ricchio will die three years later. The two families joined by their children's marriage were neighbours."], "imgs": [{"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20Raffaele%20Chiappetta%20-%20Rende%20acta%20135.jpg", "t": "Raffaele Chiappetta - Rende acta 135"}], "zooms": [{"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%2075%20anos%2C%20nacido%20en%20Castrolibero%2C%20hijo%20del%20fu%20Pietro.jpg", "t": "75 anos, nacido en Castrolibero, hijo del fu Pietro"}, {"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20acta%20135%20completa.jpg", "t": "Acta 135 completa"}, {"u": "../actas/1880%20-%20Raffaele%20Chiappetta/1880-12-03%20D%20zoom%20-%20declarantes%20Bruno%20Salvatore%20y%20Stellato%20Andrea.jpg", "t": "Declarantes Bruno Salvatore y Stellato Andrea"}]}], "nActas": 1, "nImgs": 4, "titulo": "Eleven months a widower", "parrafos": ["He was born at Castrolibero around 1805 — his death record's seventy-five years say so — and he is the earliest-born ancestor this line reaches by document. A day labourer, like his father Pietro and like almost every man in the tree.", "His wife, Teresa Molinaro, died on 19 December 1879 in the contrada Surdo at Rende. He died in the same contrada on 3 December 1880, at three in the afternoon, eleven and a half months later; the record calls him «vedovo di Molinaro Teresa». Two village day labourers went to report it, Bruno Salvatore, thirty, and Stellato Andrea, thirty-seven. The witnesses were a stonemason of sixty-six and a day labourer of thirty-seven. Nobody signed but the registrar, Vincenzo Martino.", "The record names his father — «da fu Pietro, bracciante, domiciliato in detto Castrolibero» — and leaves the mother's box blank. Of his children, the documented one is Giovanni, born around 1848; probably also a Pasquale who in 1883 declares himself twenty-eight, and the Vincenzo and Pietro Chiappetta who appear as witnesses on family records. That last is inference from ages and surname, not proof."], "claves": [["Trade", "bracciante, day labourer"], ["Born", "c. 1805 at Castrolibero"], ["Contrada", "Surdo, at Rende"], ["Could sign", "no"], ["Death", "3 December 1880, aged 75"]]}, "teresa_molinaro": {"id": "teresa_molinaro", "nombre": "Teresa Molinaro", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman born in Marano Principato around 1819, mother of Giovanni Chiappetta. She died at Rende, contrada Surdo, on 19 December 1879, aged sixty. Her death was reported by her son's father-in-law, Domenico Massei.", "datos": [["Birth", "c. 1819, MARANO PRINCIPATO — from the 60 years the death record gives her"], ["Parents", "NEITHER OF THE TWO is named in the record; it says only that both had already died"], ["Trade", "contadina (countrywoman)"], ["Spouse", "Raffaele Chiappetta († 3 December 1880), who survived her by eleven months"], ["Son", "Giovanni Chiappetta (c. 1848)"], ["Residence", "Rende, contrada Surdo"], ["Death", "19 December 1879, 1 p.m., Rende — record 94, aged 60"]], "vida": "c.1819–1879", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "carmine_molinaro", "madre": "carmina_covello", "conyuge": "raffaele_chiappetta", "unionLibre": false, "otrasParejas": [], "hijos": ["giovanni_chiappetta"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "19 December 1879, 13 h", "lugar": "Rende", "ref": "record 94", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 71 «Morti» 1879"], ["Register", "container hash: 5x2ENZg"], ["Page", "24 of 29"], ["Placement", "left-hand column, lower half of the opening"], ["Handwritten year", "«milleottocentosettantanove» — agrees with the catalogue"], ["Registrar", "Martino Vincenzo, senior assessor for the mayor"]], "literal": "…è morta Molinaro Teresa di anni sessanta, contadina, residente in Rende, nata in\nMarano Principato, da fu ————, domiciliato in ————, e dalla fu ————,\ndomiciliata in ————, moglie di Chiappetta Raffaele.", "traduccion": "In the year eighteen hundred and seventy-nine, on the twentieth day of December, at ten in the morning, at the town hall.\n\nBefore me, MARTINO VINCENZO, senior assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared MASSEI DOMENICO, aged some fifty-odd years (the figure is written in very faint ink), BRACCIALE, resident at Rende, and DE RANGO GASPARE (probable reading), aged sixty-eight, bracciale, resident at Rende.\n\nWho declared to me that at one in the afternoon YESTERDAY, in the house situated in CONTRADA SURDO, there died MOLINARO TERESA, AGED SIXTY, CONTADINA (countrywoman), resident at Rende, BORN AT MARANO PRINCIPATO, daughter of the LATE ———— and of the LATE ———— (both names are left blank), WIFE OF CHIAPPETTA RAFFAELE.\n\nPresent at this act as witnesses were CHIANELLO GAETANO, aged fifty, bracciale, and BENA SERAFINO (uncertain reading), aged thirty, bracciale, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, they being illiterate. — Vincenzo Martino.", "notas": ["SIXTY YEARS OLD IN DECEMBER 1879: born c. 1819. She had Giovanni at about twenty-nine.", "SHE WAS BORN IN MARANO PRINCIPATO, not in Castrolibero. It is a new village in this tree, and it should not be confused with Marano Marchesato, where the Palermo came from: they are two distinct neighbouring municipalities. Curiously Carmina Ricchio, the other grandmother, was also born in Marano Principato.", "THE RECORD NAMES NEITHER OF HER PARENTS. The index gave Carmine Mulinaro and Carmina Covello; the original confirms neither the one nor the other. In both boxes the clerk wrote «fu» and left the name blank. So those two names still rest on the index alone.", "WHAT IT DOES CONTRIBUTE: that double «fu» says that in December 1879 both her parents were already dead. If she was born c. 1819, her parents would be of c. 1790-1795.", "THE SURNAME IS MOLINARO. So it is written by the body of the record, by the marginal heading («Molinaro Teresa») and by the annual index of the register itself. The «Mulinaro» of the modern index is a distortion. It agrees with the reading of her son's marriage in 1873.", "THE FIRST INFORMANT IS THE DAUGHTER'S FATHER-IN-LAW ON THE OTHER SIDE. The man who goes to the town hall to report the death is MASSEI DOMENICO — the father of Angela Massei, whose daughter had married the deceased woman's son six years earlier. It is the proof that the two families lived side by side and that the kinship given by the index is real. He himself will die in 1891 and his record is also here.", "The second informant reads DE RANGO GASPARE. De Rango is precisely the foundling surname under which the Salerno were registered in Castrolibero. It may be coincidence —it is an extremely common surname in the area— but it is noted."], "imgs": [{"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20Teresa%20Molinaro%20-%20Rende%20acta%2094.jpg", "t": "Teresa Molinaro - Rende acta 94"}], "zooms": [{"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%2060%20anos%2C%20nacida%20en%20Marano%20Principato%2C%20padres%20sin%20nombre.jpg", "t": "60 anos, nacida en Marano Principato, padres sin nombre"}, {"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20acta%2094%20completa.jpg", "t": "Acta 94 completa"}, {"u": "../actas/1879%20-%20Teresa%20Molinaro/1879-12-19%20D%20zoom%20-%20declarantes%20Massei%20Domenico%20y%20De%20Rango%20Gaspare.jpg", "t": "Declarantes Massei Domenico y De Rango Gaspare"}]}], "nActas": 1, "nImgs": 4, "titulo": "Reported by her son's father-in-law", "parrafos": ["She died on 19 December 1879, at one in the afternoon, in the contrada Surdo at Rende, aged sixty. She had been born around 1819 at Marano Principato, a village that did not figure in this tree until that reading.", "The man who went to the town hall to report it, at ten the following morning, was neither a son nor an ordinary neighbour: it was Massei Domenico, a day labourer, the father of Angela Massei — that is, the father-in-law of her son Giovanni. His age is written in ink so faint that all one can read is «fifty-something». With him was a sixty-eight-year-old day labourer whose surname probably reads De Rango: the same foundling surname Michele Salerno used at Castrolibero, though nothing proves any kinship.", "The record spells MOLINARO, with an o, as do the marginal heading and the register's annual index. And it leaves both parents' boxes blank, so the names the indexes give — Carmine Molinaro and Carmina Covello — remain unsupported. Her husband outlived her by eleven and a half months and died in the same contrada."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1819 at Marano Principato"], ["Contrada", "Surdo, at Rende"], ["Death", "19 December 1879, aged 60"], ["Who reported it", "her son's father-in-law, Domenico Massei"]]}, "domenico_massei": {"id": "domenico_massei", "nombre": "Domenico Massei", "legal": "Mazzei Domenico in his last two records", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A day labourer BORN IN RENDE around 1821, father of Angela Massei. He was widowed in 1883 and died a widower on 8 November 1891, in contrada Saporito, aged seventy. One of the two witnesses on his record is his son-in-law, Giovanni Chiappetta.", "datos": [["Birth", "c. 1821, RENDE — from the 70 years the death record gives him"], ["Parents", "Filippo Mazzei, bracciante, domiciled at Rende († before 1891); the mother is NOT named, only that she had died and that she had lived at Rende"], ["Trade", "bracciale / bracciante (day labourer)"], ["Spouse", "Carmina Ricchio († 11 December 1883) — he dies «vedovo di» her"], ["Daughter", "Angela Massei (c. 1858, Castrolibero)"], ["Contradas", "Surdo in 1883 (with his wife); Saporito when he died in 1891"], ["Death", "8 November 1891, 2 p.m., Rende — record 112, aged 70"], ["Spelling", "MASSEI in 1873 and 1879; MAZZEI in 1883 and 1891 — it changes with the clerk"]], "vida": "c.1821–1891", "lug": "RENDE", "mapa": null, "sinacta": "", "padre": "filippo_massei", "madre": null, "conyuge": "carmina_ricchio", "unionLibre": false, "otrasParejas": [], "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "8 November 1891, 14 h", "lugar": "Rende", "ref": "record 112", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 83 «Morti» 1891"], ["Register", "container hash: wQ9a7O8"], ["Page", "29 of 42"], ["Placement", "right-hand column, lower half of the opening"], ["Handwritten year", "«milleottocento novantuno» — agrees with the catalogue"], ["Registrar", "Mercavallo Gabriele (uncertain reading), secretary delegated by an act of the mayor of 19 September 1884"]], "literal": "…è morto Mazzei Domenico di anni settanta, bracciante, residente in Rende, nato in\nRende, dal fu Filippo, bracciante, domiciliato in Rende, e dalla fu ————,\ndomiciliata in Rende — Vedovo di Ricchio Carmina.", "traduccion": "In the year eighteen hundred and ninety-one, on the ninth day of November, at eleven in the morning, at the town hall.\n\nBefore me, MERCAVALLO GABRIELE (uncertain reading), Secretary delegated by act of the Mayor of the nineteenth of September eighteen hundred and eighty-four, Registrar of the Civil Status of the comune of Rende, there appeared RICCHIO ANTONIO, aged fifty-six, bracciante, resident at Rende, and TURCO PIETRO, aged twenty-six, bracciante, resident at Rende.\n\nWho declared to me that at two in the afternoon YESTERDAY, in the house situated in CONTRADA SAPORITO, there died MAZZEI DOMENICO, AGED SEVENTY, BRACCIANTE, resident at Rende, BORN AT RENDE, SON OF THE LATE FILIPPO, bracciante, resident at Rende, and of the LATE ———— (the name is left blank), who had been resident at Rende. WIDOWER OF RICCHIO CARMINA.\n\nPresent at this act as witnesses were TURCO PASQUALE, aged thirty-seven, bracciante, and GIOVANNI CHIAPPETTA, aged forty-three, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the others being illiterate. — Gabriele Mercavallo.", "notas": ["SEVENTY YEARS OLD IN NOVEMBER 1891: born c. 1821.", "HE WAS BORN IN RENDE, and this corrects what had been supposed. He was taken for a man of Castrolibero because his daughter Angela was born there; but he is from Rende. The family moved: he is born in Rende, his daughter is born in Castrolibero c. 1858, and in 1873 they are all in Rende again.", "THE FATHER: FILIPPO, bracciante, resident in Rende. The index gave him and the record confirms it, adding trade and village. The «fu» says he had already died by 1891.", "THE MOTHER, ONCE AGAIN WITHOUT A NAME — but with a detail the other three records do not give: the clerk left the name blank AND YET filled in the following box, «domiciliata in Rende». He knew where she had lived and did not know what she was called. She too had already died.", "THE WITNESS IS HIS SON-IN-LAW. «Giovanni Chiappetta, di anni quarantatre, bracciante»: he is the husband of his daughter Angela and the father of Filomena. Forty-three years old in November 1891 places him in 1848, exactly where his marriage of 1873 (25 years) and Filomena's birth in 1877 (29 years) put him. Three independent records, the same date.", "THE FIRST INFORMANT IS A RICCHIO: Ricchio Antonio, aged fifty-six. Almost certainly family of his late wife.", "THE SURNAME IS WRITTEN HERE MAZZEI, with a well-marked double z, just as in his wife's record of 1883. By contrast in his daughter's marriage of 1873 and in Teresa Molinaro's record of 1879 —both in the hand of Vincenzo Martino— it reads MASSEI. There is no «correct» spelling: it depends on the clerk. MASSEI is kept in the tree because it is the form used by the records of the branch that stays alive (1873, 1877, 1894).", "HE DIED IN CONTRADA SAPORITO, not in Surdo, where he lived in 1883. It is the same contrada in which his great-grandson Giuseppe will be born in 1895 and his great-grandson Umberto in 1897."], "imgs": [{"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20Domenico%20Antonio%20Massei%20-%20Rende%20acta%20112.jpg", "t": "Domenico Antonio Massei - Rende acta 112"}], "zooms": [{"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%2070%20anos%2C%20nacido%20en%20Rende%2C%20hijo%20del%20fu%20Filippo.jpg", "t": "70 anos, nacido en Rende, hijo del fu Filippo"}, {"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20acta%20112%20completa.jpg", "t": "Acta 112 completa"}, {"u": "../actas/1891%20-%20Domenico%20Antonio%20Massei/1891-11-08%20D%20zoom%20-%20testigo%20Giovanni%20Chiappetta%2C%20su%20yerno.jpg", "t": "Testigo Giovanni Chiappetta, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "The witness was his son-in-law", "parrafos": ["He was born at Rende around 1821 and died there on 8 November 1891, at two in the afternoon, in the contrada Saporito, aged seventy. He had been widowed eight years earlier of Carmina Ricchio, and his record calls him «vedovo di».", "The two fathers-in-law buried one another, and the records set it down. In December 1879 it was Domenico who reported the death of Teresa Molinaro, his son-in-law's mother. In December 1883 it was the son-in-law, Giovanni Chiappetta, who reported that of Carmina Ricchio, his own mother-in-law. And in November 1891, on Domenico's own record, one of the two witnesses is «Giovanni Chiappetta, di anni quarantatre, bracciante»: the same man again.", "Of the father, the record gives name and trade: «dal fu Filippo, bracciante, domiciliato in Rende». Of the mother, only the gap — but with a detail the other three records of that generation lack: the clerk left the name blank and still filled in «domiciliata in Rende».", "The surname changes from clerk to clerk and not from man to man: MASSEI in 1873 and 1879, MAZZEI in 1883 and 1891. The tree keeps Massei, which is the form used in the records of the branch that lives on."], "claves": [["Trade", "bracciante, day labourer"], ["Born", "c. 1821 at Rende, not Castrolibero as had been assumed"], ["Contradas", "Surdo in 1883; Saporito when he died"], ["Death", "8 November 1891, aged 70"]]}, "carmina_ricchio": {"id": "carmina_ricchio", "nombre": "Carmina Ricchio", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["salerno"], "resumen": "A countrywoman born in Marano Principato around 1828, mother of Angela Massei. She died at Rende, contrada Surdo, on 11 December 1883, aged fifty-five. The man who went to report her death was her son-in-law, Giovanni Chiappetta.", "datos": [["Birth", "c. 1828, MARANO PRINCIPATO — from the 55 years the death record gives her"], ["Parents", "Giuseppe Ricchio, bracciante; and MARIA BOSCO, whom this record does not name but does give as dead. The mother's name came later, from her own death record (Castrolibero, 1865, record 11)"], ["Trade", "contadina (countrywoman)"], ["Spouse", "Domenico Massei († 8 November 1891), who survived her by eight years"], ["Daughter", "Angela Massei (c. 1858, Castrolibero)"], ["Residence", "Rende, contrada Surdo"], ["Death", "11 December 1883, noon, Rende — record 163, aged 55"]], "vida": "c.1828–1883", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "giuseppe_ricchio", "madre": "maria_bosco", "conyuge": "domenico_massei", "unionLibre": false, "otrasParejas": [], "hijos": ["angela_massei"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "11 December 1883, 12 h", "lugar": "Rende", "ref": "record 163", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 75 «Morti» 1883"], ["Register", "container hash: LpnQEoq"], ["Page", "42 of 50"], ["Placement", "right-hand column, upper half of the opening"], ["Handwritten year", "«milleottocento ottantatre» — agrees with the catalogue"], ["Registrar", "Bruno Vincenzo, acting assessor for the mayor"]], "literal": "…è morta Ricchio Carmina di anni cinquantacinque, contadina, residente in Rende,\nnata in Marano Principato, da fu Giuseppe, bracciante, domiciliato in vita in\nMarano Principato, e dalla fu ————, domiciliata in ————, moglie di Mazzei Domenico.", "traduccion": "In the year eighteen hundred and eighty-three, on the twelfth day of December, at eleven in the morning, at the town hall.\n\nBefore me, BRUNO VINCENZO, acting assessor for the mayor, Registrar of the Civil Status of the comune of Rende, there appeared CHIAPPETTA GIOVANNI, aged thirty-three, bracciante, resident at Rende, and CHIAPPETTA PASQUALE, aged twenty-eight, bracciante, resident at Rende.\n\nWho declared to me that at noon YESTERDAY, in the house situated in CONTRADA SURDO, there died RICCHIO CARMINA, AGED FIFTY-FIVE, CONTADINA (countrywoman), resident at Rende, BORN AT MARANO PRINCIPATO, DAUGHTER OF THE LATE GIUSEPPE, bracciante, who was resident in life at Marano Principato, and of the LATE ———— (the name is left blank), WIFE OF MAZZEI DOMENICO.\n\nPresent at this act as witnesses were CHIAPPETTA VINCENZO, aged twenty-five, bracciante, and CHIAPPETTA PIETRO, aged fifty, bracciante, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the others being illiterate. — Vincenzo Bruno.", "notas": ["FIFTY-FIVE YEARS OLD IN DECEMBER 1883: born c. 1828. She is the youngest of the four grandparents and the one who died earliest in age. She had Angela at about thirty.", "SHE WAS BORN IN MARANO PRINCIPATO, just like Teresa Molinaro. Two of Filomena's four great-grandparents come out of the same village, which until now did not appear in this tree.", "THE FATHER: GIUSEPPE RICCHIO, bracciante, «domiciliato in vita in Marano Principato». The index gave him and no more; the record gives him a trade and a village, and with the «fu» and the «in vita» makes clear that he had died and that he never moved from Marano.", "THE MOTHER, WITHOUT A NAME. Third time out of four: the clerk writes «e dalla fu» and leaves the rest blank. There is no name to rescue. — RESOLVED ON 26 AUGUST 2026, and not here but in another file: the mother was MARIA BOSCO, and her own death record (Castrolibero, 11 August 1865, record 11) names her and identifies her as «vedova del fu Giuseppe Ricchio». That «dalla fu» of 1883 was true: she had been dead eighteen years.", "THE RECORD IS A GATHERING OF CHIAPPETTAS. Both informants and both witnesses bear that surname. The first informant is CHIAPPETTA GIOVANNI, her son-in-law, the husband of Angela and father of Filomena. The second, CHIAPPETTA PASQUALE, aged twenty-eight, is almost certainly a brother of Giovanni: he fits as one more son of Raffaele and Teresa, born c. 1855. And among the witnesses, Chiappetta Vincenzo (25) and Chiappetta Pietro (50). The son-in-law's family buried the mother-in-law.", "HERE THE HUSBAND'S SURNAME IS WRITTEN MAZZEI, with the unmistakable double z, whereas the marriage of 1873 wrote MASSEI. It is the same man.", "Her husband survived her by eight years: he died on 8 November 1891, «vedovo di Ricchio Carmina», and his record is also in this archive."], "imgs": [{"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20Carmina%20Ricchio%20-%20Rende%20acta%20163.jpg", "t": "Carmina Ricchio - Rende acta 163"}], "zooms": [{"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%2055%20anos%2C%20hija%20del%20fu%20Giuseppe%20Ricchio%20de%20Marano%20Principato.jpg", "t": "55 anos, hija del fu Giuseppe Ricchio de Marano Principato"}, {"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20acta%20163%20completa.jpg", "t": "Acta 163 completa"}, {"u": "../actas/1883%20-%20Carmina%20Ricchio/1883-12-11%20D%20zoom%20-%20declarante%20Chiappetta%20Giovanni%2C%20su%20yerno.jpg", "t": "Declarante Chiappetta Giovanni, su yerno"}]}], "nActas": 1, "nImgs": 4, "titulo": "Four Chiappettas on her record", "parrafos": ["She died on 11 December 1883, at noon, in the contrada Surdo at Rende, aged fifty-five. Of Filomena's four grandparents she is the one who died youngest. She had been born around 1828 at Marano Principato.", "Her record is a gathering of Chiappettas: it is reported by Giovanni Chiappetta, thirty-three — her son-in-law — and Pasquale Chiappetta, twenty-eight; and the witnesses are Vincenzo Chiappetta, twenty-five, and Pietro Chiappetta, fifty. That Pasquale fits as a brother of Giovanni, another son of Raffaele and Teresa born around 1855. It is a lead to follow, not a proof.", "Of her father the record says «da fu Giuseppe, bracciante, domiciliato in vita in Marano Principato»; of her mother, nothing. None of those present signed: only the registrar, Vincenzo Bruno, who also spells the husband's surname with a double z, Mazzei.", "Three of Filomena's four grandparents died in the same contrada Surdo and in three Decembers: Teresa Molinaro on 19 December 1879, Raffaele Chiappetta on 3 December 1880 and she on 11 December 1883."], "claves": [["Trade", "contadina, countrywoman"], ["Born", "c. 1828 at Marano Principato"], ["Contrada", "Surdo, at Rende"], ["Death", "11 December 1883, aged 55"], ["Who reported it", "her son-in-law, Giovanni Chiappetta"]]}, "domenico_pizzi": {"id": "domenico_pizzi", "nombre": "Domenico Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["faienza"], "resumen": "A stonemason from Atessa, born around 1824, father of Angiolina Pizzi. He could sign his name, which was rare among his people. He died on 28 September 1891 at the house on Via di Mezzo, aged sixty-seven, still married to Teresa Flocco.", "datos": [["Birth", "c. 1824, ATESSA — from the 67 years the death record gives him"], ["Parents", "Giuseppe Pizzi, artigiano († before 1869), and Antonia di Iorio, filatrice († before 1891); both lived and died at Atessa"], ["Trade", "muratore (stonemason), in 1869 and in 1891"], ["Spouse", "Teresa Flocco, daughter of the fu Pasquale — she survived him"], ["Daughter", "Angiolina (Angela) Pizzi, born on 12 February 1869"], ["Residences", "rione del CASTELLO in 1869; VIA DI MEZZO when he died in 1891"], ["Could write", "YES. He signed his daughter's birth record in his own hand in 1869, while the two witnesses declared they could not"], ["Death", "28 September 1891, 8:05 p.m., Atessa — record 238, aged 67"], ["A warning about the age", "the 1869 record puts him at 39 (born c. 1830) and that of 1891 puts him at 67 (born c. 1824). Six years apart between two records of his own"]], "vida": "c.1824–1891", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "giuseppe_pizzi", "madre": "antonia_di_iorio", "conyuge": "teresa_flocco", "unionLibre": false, "otrasParejas": [], "hijos": ["angela_pizzi"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "28 September 1891, 20:05 h", "lugar": "Atessa (Chieti)", "ref": "record 238", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile italiano > Atessa > 1891, atti di morte"], ["Register", "container hash: 5v7V2Ay"], ["Page", "121 of 170"], ["Placement", "lower half of the page; above it, record 237"], ["Handwritten year", "«mille ottocento novantuno» — agrees with the catalogue"], ["Registrar", "Francesco Falcucci (uncertain reading: «Falcuni»), municipal assessor delegated by the mayor by an act of 24 November 1889"], ["How it was located", "by the alphabetical index at the end of the register (page 168 of 170), where a single Pizzi appears: «Pizzi Domenico — 238». A probe on page 120 gave records 235-236, dated 28 September: 238 was on the following page"]], "literal": "Numero 238 — Domenico Pizzi\nL'anno mille ottocento novantuno, addì ventinove di Settembre, a ore pomeridiane\nquattro e minuti dieci, nella Casa Comunale. Avanti di me Francesco Falcucci\nassessore Municipale delegato dal Sindaco con atto del ventiquattro Novembre\nmille ottocento ottantanove, debitamente approvato, Ufficiale dello Stato Civile\ndel Comune di Atessa, sono comparsi Donato Tiroli, di anni settanta, contadino,\ndomiciliato in Atessa, e Tommaso D'Amelio, di anni settantatre, contadino,\ndomiciliato in Atessa, i quali mi hanno dichiarato che a ore pomeridiane otto e\nminuti cinque di ieri, nella casa posta in Via di Mezzo al numero ——, è morto\nDOMENICO PIZZI, di anni sessantasette, muratore, residente in Atessa, nato in\nAtessa, da fu GIUSEPPE, artigiano, domiciliato in vita in Atessa, e da fu ANTONIA\nDI IORIO, filatrice, domiciliata in vita in Atessa, marito di TERESA FLOCCO.", "traduccion": "In the year eighteen hundred and ninety-one, on the twenty-ninth day of September, at ten past four in the afternoon, at the town hall.\n\nBefore me, FRANCESCO FALCUCCI, municipal assessor delegated by the Mayor by act of the twenty-fourth of November eighteen hundred and eighty-nine, duly approved, Registrar of the Civil Status of the comune of ATESSA, there appeared DONATO TIROLI, aged seventy, farmhand, resident at Atessa, and TOMMASO D'AMELIO, aged seventy-three, farmhand, resident at Atessa.\n\nWho declared to me that at FIVE PAST EIGHT YESTERDAY EVENING, in the house situated in VIA DI MEZZO, there died DOMENICO PIZZI, AGED SIXTY-SEVEN, STONEMASON, resident at Atessa, BORN AT ATESSA, SON OF THE LATE GIUSEPPE, artisan, who was resident in life at Atessa, and of the LATE ANTONIA DI IORIO, spinner, who was resident in life at Atessa. HUSBAND OF TERESA FLOCCO.\n\nPresent at this act as witnesses were FILIPPO FEDELIBUS, aged fifty-one, farmhand, and GIACOMO PASQUINI (uncertain reading), aged forty-eight, farmhand, both resident in this comune.\n\nThe record having been read to all present, I signed it alone, the informants and the witnesses having declared that they could not write. — Francesco Falcucci.", "notas": ["SIXTY-SEVEN YEARS OLD IN SEPTEMBER 1891: born c. 1824. It is just what was expected of him, and it fits with a daughter born in 1869, when he would be forty-five.", "THE RECORD DOES NAME HIS MOTHER, and that was the question this download brought with it. «E da FU ANTONIA DI IORIO, FILATRICE, domiciliata IN VITA in Atessa». Full name, trade and village. A new maternal branch —DI IORIO— enters the tree along this line.", "THE FATHER: GIUSEPPE, artigiano, resident in his lifetime in Atessa. The «fu» and the «in vita» say that he had died and that he never moved from the village. He is exactly the same Giuseppe whom the 1869 record names when presenting the informant as «Domenico Pizzi FU Giuseppe»: two records twenty-two years apart giving the same father.", "«MARITO DI TERESA FLOCCO», not «vedovo». She survived him. Her death would have to be sought in the Morti of Atessa after 1891.", "HE DIED IN VIA DI MEZZO. In 1869 the family lived in the rione del CASTELLO; twenty-two years later it is in Via di Mezzo, within the same old town.", "THE DISCREPANCY OF AGE. The 1869 record gives him as thirty-nine years old, which would put him in 1830; this one gives him as sixty-seven, which puts him in 1824. They are his only two records and they do not agree. The usual thing in these registers is for the age declared at a death to be the more rounded, so his birth falls in the window 1824-1830 and it must be sought in the Nati of Atessa of those years.", "THE INFORMANT IS A TIROLI, just as in the death of Leone Pizzi in 1841 (Luigi Tiroli, aged thirty). Fifty years later, a Donato Tiroli aged seventy is once again the man who goes to the town hall to report the death of a Pizzi. Neighbours from time immemorial."], "imgs": [{"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20Domenico%20Pizzi%20-%20Atessa%20acta%20238.jpg", "t": "Domenico Pizzi - Atessa acta 238"}], "zooms": [{"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%2067%20anos%2C%20hijo%20del%20fu%20Giuseppe%20y%20de%20la%20fu%20Antonia%20di%20Iorio%2C%20marido%20de%20Teresa%20Flocco.jpg", "t": "67 anos, hijo del fu Giuseppe y de la fu Antonia di Iorio, marido de Teresa Flocco"}, {"u": "../actas/1891%20-%20Domenico%20Pizzi/1891-09-28%20D%20zoom%20-%20acta%20238%20completa.jpg", "t": "Acta 238 completa"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "teresa_flocco": {"id": "teresa_flocco", "nombre": "Teresa Flocco", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["faienza"], "resumen": "A spinner from Atessa, born around 1834, wife of Domenico Pizzi and mother of Angiolina. She was widowed in September 1891.", "datos": [["Birth", "c. 1834 — the 1869 record gives her thirty-five years"], ["Father", "PASQUALE FLOCCO, already deceased in February 1869 («fu Pasquale»)"], ["Mother", "not stated in either of the two records"], ["Trade", "filatrice (spinner)"], ["Spouse", "Domenico Pizzi, muratore († 28 September 1891)"], ["Daughter", "Angiolina (Angela) Pizzi, born on 12 February 1869"], ["Residence", "Atessa, rione del Castello in 1869"], ["Death", "not located — after September 1891, because her husband dies «marito di» her and not «vedovo»"]], "vida": "b.c.1834", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY TWO RECORDS, even though she has no folder of her own. In the birth of her daughter (Atessa, 12 February 1869, record 65) the husband declares her: «da sua moglie TERESA FLOCCO FU PASQUALE, d'anni trentacinque, FILATRICE, seco lui domiciliata». And in his own death (Atessa, 28 September 1891, record 238) she figures as his living wife. Both records are downloaded and transcribed in the files of Angela and of Domenico.\n\nTHE FACT TO BE NOTED is that «fu Pasquale»: her father was called PASQUALE FLOCCO and had already died by February 1869. No file has been opened for him because nothing more is known of him —neither trade nor age nor town, although Flocco is an Atessa surname: in the same register of 1869 there appears a «Signor Filippo Flocco», owner of a farmstead— but it is a new and verified name, of the generation of 1800, and it gives a direction in which to continue: the Morti of Atessa earlier than 1869.", "padre": null, "madre": null, "conyuge": "domenico_pizzi", "unionLibre": false, "otrasParejas": [], "hijos": ["angela_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "francesco_giacomo": {"id": "francesco_giacomo", "nombre": "Francesco Giacomo Palermo", "legal": "Giacomo Palermo", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["salerno"], "resumen": "A shepherd of Marano Marchesato. The records almost always cal
