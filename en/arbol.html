<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F5F2; --card:#FFFFFF; --sunk:#ECECE8; --rail:#FAFAF8;
  --ink:#16171A; --ink2:#43474D; --muted:#787D85; --faint:#A2A7AE;
  --rule:#DEDFDB; --rule2:#EBEBE7;
  --linea:#1F4B73; --linea-bg:#E8EFF6;
  --sello:#8C3A2E; --sello-bg:#F7EBE8;
  --hecho:#2E6A4E; --hecho-bg:#E6F0EA;
  --sombra:0 1px 1px rgba(20,22,26,.04), 0 8px 24px -16px rgba(20,22,26,.22);
  --sombra-alta:0 2px 6px rgba(20,22,26,.08), 0 24px 60px -24px rgba(20,22,26,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,.nom{font-family:"Newsreader",Georgia,serif;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer}

/* ─────────── cabecera ─────────── */
header{
  min-height:62px; display:flex; align-items:center; gap:14px 20px; flex-wrap:wrap;
  padding:9px 24px; background:var(--card); border-bottom:1px solid var(--rule);
  position:relative; z-index:40;
}
/* Que la cabecera quepa en UNA fila en pantallas anchas: el buscador cede
   espacio antes que los botones, que son los que hay que poder pulsar. */
header .buscar input{width:190px;min-width:120px}
@media (min-width:1100px){ header{flex-wrap:nowrap} header .der{flex-wrap:nowrap} }
@media (max-width:1099px){ header .sub{display:none} }

/* la navegación va siempre junta y nunca se corta: se agrupa y, si hace falta,
   baja a una segunda línea entera en vez de salirse por la derecha */
/* El buscador y los botones forman UN bloque: así, cuando la cabecera no cabe,
   bajan juntos y alineados en vez de quedar sueltos a media altura. */
header .der{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
header .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
header .sub{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}

header .rr{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--linea); background:var(--linea-bg);
  border:1px solid #C6D8E8; border-radius:20px; padding:3px 10px; white-space:nowrap;
}
header .rr[hidden]{display:none}
.linaje .rama{color:var(--muted)}
header .sp{flex:1}
header .btn{text-decoration:none}
header a.vol{color:var(--linea);border-color:var(--linea);background:var(--linea-bg)}
header a.vol:hover{background:var(--linea);color:var(--card)}
@media (max-width:820px){ header .sub{display:none} }
@media (max-width:640px){
  header{padding:9px 16px;gap:10px 12px}
  header h1{font-size:17px}
  header .der{margin-left:0;width:100%;justify-content:flex-start}
  header .buscar{flex:1 1 100%}
}
.btn{
  border:1px solid var(--rule); background:var(--card); border-radius:6px;
  padding:7px 13px; font-size:13px; color:var(--ink2);
}
.btn:hover{background:var(--sunk);color:var(--ink)}
.btn.on{background:var(--linea-bg);border-color:#C6D8E8;color:var(--linea)}

.buscar{position:relative}
.buscar input{
  width:210px; padding:7px 11px; font:inherit; font-size:13px; color:var(--ink);
  background:var(--rail); border:1px solid var(--rule); border-radius:6px; outline:none;
}
.buscar input:focus{border-color:var(--linea);background:var(--card);box-shadow:0 0 0 3px var(--linea-bg)}
#sug{
  position:absolute; top:38px; left:0; width:290px; max-height:340px; overflow-y:auto;
  background:var(--card); border:1px solid var(--rule); border-radius:8px;
  box-shadow:var(--sombra-alta); display:none; z-index:70; padding:5px;
}
#sug.on{display:block}
#sug button{
  display:block; width:100%; text-align:left; border:0; background:none;
  padding:7px 10px; border-radius:5px; font-size:13.5px; color:var(--ink2);
}
#sug button:hover,#sug button.sel{background:var(--linea-bg);color:var(--linea)}
#sug button i{font-style:normal;color:var(--faint);font-size:11px;margin-left:7px}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--card);color:var(--ink2)}

/* ─────────── descendientes ─────────── */
#abajo{
  border-top:1px solid var(--rule); margin-top:52px; padding-top:26px;
}
#abajo .tit{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-bottom:18px;
}
.dn{display:flex;flex-direction:column;gap:14px}
.dn > .fila{display:flex;align-items:flex-start;gap:64px}
.dn .kids{display:flex;flex-direction:column;gap:14px}

/* ─────────── lienzo ─────────── */
/* El desplazamiento superior lo fija el JS con la altura REAL de la cabecera.
   Estaba clavado en 62px, y cuando la cabecera envolvía a dos filas escondía
   debajo la franja de generaciones: por eso no se veía ningún rótulo. */
#lienzo{
  position:absolute; inset:var(--hh, 62px) 0 0 0; overflow:auto;
  background:
    radial-gradient(circle at 1px 1px, rgba(22,23,26,.055) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
}
#pista{position:relative;display:inline-block;padding:56px 72px 90px}
#hilos{position:absolute;inset:0;pointer-events:none;overflow:visible}
#hilos path{fill:none;stroke:var(--rule);stroke-width:1.25}
#hilos path.dir{stroke:var(--linea);stroke-width:1.75}
#hilos marker path{fill:var(--rule);stroke:none}
#hilos marker.d path{fill:var(--linea)}

/* grados de parentesco, encima de cada columna */
/* Franja de generaciones: PEGADA ARRIBA. Antes vivía dentro del lienzo y se
   iba de la vista en cuanto se bajaba un poco, con lo que no servía de nada.
   Ahora se queda fija en vertical y acompaña al árbol en horizontal. */
#grados{
  position:sticky; top:0; z-index:6; height:30px; min-width:100%; width:max-content;
  pointer-events:none;
  background:linear-gradient(var(--paper) 62%, transparent);
}
#grados span{
  position:absolute; top:8px; transform:translateX(-50%);
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
  background:var(--paper); padding:1px 8px; border-radius:10px;
  border:1px solid var(--rule2);
}
/* raya vertical tenue que separa cada generación */
#grados span::after{
  content:""; position:absolute; left:50%; top:100%; width:1px; height:60vh;
  background:linear-gradient(var(--rule2), transparent 85%);
}

/* ─────────── nodos ─────────── */
.n{display:flex;align-items:center;gap:64px}
.up{display:flex;flex-direction:column;gap:16px}

.card{
  position:relative; width:228px; flex:none;
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:12px 14px 11px; box-shadow:var(--sombra);
  text-align:left; transition:box-shadow .16s, transform .16s, border-color .16s;
}
.card:hover{box-shadow:var(--sombra-alta);transform:translateY(-1px);border-color:#CFD3D7}
.card::before{
  content:''; position:absolute; left:0; top:12px; bottom:12px; width:2px;
  border-radius:2px; background:var(--rule);
}
.card.dir::before{background:var(--linea)}
.card.foco{border-color:var(--linea);box-shadow:0 0 0 3px var(--linea-bg),var(--sombra-alta)}

.card .nom{font-size:16.5px;font-weight:500;line-height:1.22;letter-spacing:-.01em;display:block}
.card .vida{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted);
  margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.card .lug{font-size:11.5px;color:var(--faint);margin-top:1px;font-style:italic}

.sellos{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.s{
  font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.06em;
  padding:2px 6px; border-radius:3px; background:var(--hecho-bg); color:var(--hecho);
}
.s.falta{background:transparent;color:var(--faint);border:1px dashed var(--rule)}

.subir{
  position:absolute; right:8px; top:8px; width:22px; height:22px; padding:0;
  border:1px solid var(--rule); border-radius:5px; background:var(--card);
  color:var(--faint); font-size:11px; line-height:1; display:none;
}
.card:hover .subir{display:block}
.subir:hover{background:var(--linea-bg);color:var(--linea);border-color:#C6D8E8}

.vacio{
  width:228px; flex:none; border:1px dashed var(--rule); border-radius:9px;
  padding:13px 14px; color:var(--faint); font-size:12.5px; background:transparent;
}

/* ─────────── franja de familia ─────────── */
/* ─────────── lupas de zoom, flotando sobre el lienzo ─────────── */
/* Fuera del lienzo a propósito: dentro se iban con el scroll. Y ABAJO, no
   arriba: la cabecera cambia de altura cuando envuelve y tapaba el botón «+». */
#lupas{
  position:fixed; right:20px; bottom:calc(var(--fh, 62px) + 20px); z-index:30;
  display:flex; flex-direction:column; gap:6px;
}
#lupas button{
  width:38px; height:34px; padding:0; cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:15px; line-height:1;
  color:var(--ink2); background:var(--card);
  border:1px solid var(--rule); border-radius:8px; box-shadow:var(--sombra);
}
#lupas #zPct{font-size:10.5px;letter-spacing:.02em;color:var(--muted)}
#lupas button:hover{background:var(--sunk);color:var(--ink)}
#lupas button:active{transform:translateY(1px)}
@media (max-width:640px){ #lupas{right:10px;top:10px} #lupas button{width:34px;height:31px} }

#pista{transform-origin:0 0}

#familia{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  background:var(--card); border-top:1px solid var(--rule);
  padding:13px 24px 15px; display:flex; gap:26px; align-items:flex-start;
  overflow-x:auto;
}
.grupo{display:flex;gap:9px;align-items:center;flex:none}
.grupo > b{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); font-weight:400;
  align-self:center; margin-right:2px; white-space:nowrap;
}
.chip{
  border:1px solid var(--rule); background:var(--rail); border-radius:20px;
  padding:5px 12px; font-size:13px; color:var(--ink2); white-space:nowrap;
}
.chip:hover{background:var(--sunk);color:var(--ink)}
.chip.dir{border-color:#C6D8E8;background:var(--linea-bg);color:var(--linea);font-weight:500}
.chip i{font-style:normal;color:var(--faint);font-size:11px;margin-left:5px}

/* ─────────── ficha ─────────── */
#velo{
  position:fixed; inset:0; background:rgba(22,23,26,.34); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#velo.on{opacity:1;pointer-events:auto}
#ficha{
  position:fixed; top:0; right:0; bottom:0; width:min(680px,94vw); z-index:60;
  background:var(--paper); border-left:1px solid var(--rule);
  transform:translateX(100%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
  overflow-y:auto; box-shadow:-30px 0 80px -40px rgba(20,22,26,.4);
}
#ficha.on{transform:none}
#ficha .top{
  position:sticky; top:0; background:var(--paper); z-index:2;
  padding:22px 34px 16px; border-bottom:1px solid var(--rule);
}
#ficha .cerrar{
  position:absolute; right:22px; top:20px; width:30px; height:30px; padding:0;
  border:1px solid var(--rule); border-radius:7px; background:var(--card); color:var(--muted);
}
#ficha .cerrar:hover{background:var(--sunk);color:var(--ink)}
.rol{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; padding:3px 8px; border-radius:3px;
  background:var(--sunk); color:var(--muted); margin-bottom:9px;
}
.rol.dir{background:var(--linea-bg);color:var(--linea)}
#ficha h2{font-size:31px;font-weight:600;line-height:1.08;letter-spacing:-.02em}
#ficha .epi{
  font-family:"Newsreader",Georgia,serif; font-style:italic; font-size:17px;
  color:var(--linea); margin-top:5px;
}
#ficha .cuerpo{padding:24px 34px 80px}

.res{font-family:"Newsreader",Georgia,serif;font-size:18.5px;line-height:1.5;color:var(--ink2);max-width:60ch;margin:0 0 22px}
.rel p{font-family:"Newsreader",Georgia,serif;font-size:16.5px;line-height:1.62;color:var(--ink);max-width:62ch;margin:0 0 13px}

.claves{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 24px}
.clave{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:7px 11px;font-size:12.5px}
.clave b{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:400;
}

.linaje{font-size:13.5px;margin:0 0 6px;color:var(--ink2)}
.linaje > span{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin-right:8px;
}
.linaje a{color:var(--linea);text-decoration:none;border-bottom:1px solid #C6D8E8;cursor:pointer}
.linaje a:hover{background:var(--linea-bg)}

figure.mapa{margin:22px 0 6px;padding:0;border:1px solid var(--rule2);border-radius:6px;
  overflow:hidden;background:rgba(0,0,0,.02)}
figure.mapa iframe{display:block;width:100%;height:300px;border:0}
figcaption.mapa-tit{padding:8px 12px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--rule2)}
figcaption.mapa-pie{padding:9px 12px;font-size:13.5px;line-height:1.5;color:var(--muted);
  border-top:1px solid var(--rule2)}
dl.dat{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:0 22px;margin:22px 0 0;font-size:14px}
dl.dat dt{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); padding:9px 0 0; border-top:1px solid var(--rule2);
  max-width:11rem; overflow-wrap:anywhere;
}
dl.dat dd a.ext{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--rule-2);
  font-variant-caps:all-small-caps;letter-spacing:.05em;white-space:nowrap}
dl.dat dd{margin:0;padding:9px 0 0;border-top:1px solid var(--rule2)}

h3.sec{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); margin:34px 0 12px; font-weight:400;
}
.acta{background:var(--card);border:1px solid var(--rule2);border-radius:9px;padding:19px 21px;margin:0 0 13px;box-shadow:var(--sombra)}
.acta .hd{border-bottom:1px solid var(--rule2);padding-bottom:11px;margin-bottom:14px}
.pill{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  letter-spacing:.13em; text-transform:uppercase; padding:3px 8px; border-radius:3px;
  background:var(--hecho-bg); color:var(--hecho); margin-bottom:8px;
}
.acta h4{font-family:"Newsreader",Georgia,serif;font-size:19px;font-weight:600;margin:0}
.acta .ref{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.acta figure{margin:0 0 11px}
.acta figure a{display:block;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;background:var(--sunk)}
.acta figure img{display:block;width:100%;height:auto}
.acta figcaption{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;gap:9px}
.lupa{margin-left:auto;color:var(--linea);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;font-size:9px;letter-spacing:.07em;text-transform:uppercase}
.zz{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-top:11px}
.lit{margin:14px 0 0;padding:14px 16px;background:var(--sunk);border-left:2px solid var(--sello);border-radius:0 6px 6px 0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.62;color:var(--sello);white-space:pre-wrap;word-break:break-word}
.tra p{font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.6;color:var(--ink2);margin:0 0 10px;max-width:64ch}
.notas{border-top:1px solid var(--rule2);margin-top:15px;padding-top:13px}
.notas ul{margin:0;padding-left:18px}
.notas li{font-size:13.5px;color:var(--ink2);margin:0 0 8px;line-height:1.5}
.pend{background:var(--sello-bg);border-left:2px solid var(--sello);border-radius:0 8px 8px 0;padding:16px 19px}
.pend b{display:block;font-family:"Newsreader",Georgia,serif;font-size:16px;color:var(--sello);margin-bottom:5px}
.pend p{margin:0;font-size:14px;color:var(--ink2);max-width:62ch}

#ficha .legal{font-size:14px;color:var(--muted);margin:6px 0 0}
#ficha .rot{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  margin:18px 0 7px; font-weight:500;
}
#ficha .fuente{
  display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0 0;
  font-size:14px;
}
#ficha .fuente dt{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding-top:3px; white-space:nowrap;
}
#ficha .fuente dd{margin:0}
@media (max-width:560px){ #ficha .fuente{grid-template-columns:1fr;gap:1px 0}
  #ficha .fuente dd{margin:0 0 8px} }

@media (max-width:760px){
  .n{gap:34px} .card,.vacio{width:190px}
  #ficha .top,#ficha .cuerpo{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<header>
  <h1 id="tit">Family tree</h1>
  <span class="rr" id="rr" hidden></span>
  <span class="sub">198 people · 90 records · 305 images</span>

  <div class="der">
  <div class="buscar">
    <input id="q" type="search" placeholder="Search for someone…" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
  <div class="nav">
    <button class="btn" id="bAtras" disabled title="Back to the previous person">← Back</button>
    <button class="btn" id="bDir">Direct line only</button>
    <button class="btn" id="bMenos" title="One generation fewer">&minus; gen.</button>
    <button class="btn" id="bMas" title="One more generation">+ gen.</button>
    <a class="btn vol" href="index.html">Home</a>
    <a class="btn vol" href="fichas.html">Profiles</a>
    <a class="btn" href="../arbol.html" hreflang="es" lang="es">Español</a>
  </div>
  </div>
</header>

<div id="lupas">
  <button id="zMas"  title="Zoom in"  aria-label="Zoom in">+</button>
  <button id="zPct"  title="Back to 100%" aria-label="Back to 100%">100%</button>
  <button id="zMenos" title="Zoom out" aria-label="Zoom out">&minus;</button>
</div>

<div id="lienzo">
  <div id="grados"></div>
  <div id="pista">
    <svg id="hilos"></svg>
    <div id="raiz"></div>
    <div id="abajo"></div>
  </div>
</div>

<div id="familia"></div>

<div id="velo"></div>

<script>
const G = {"domenico_pizzi_viejo": {"id": "domenico_pizzi_viejo", "nombre": "Domenico Pizzi", "legal": "«il fu Domenico Pizzi» in the 1841 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 1, "ramas": ["faienza"], "resumen": "A stonemason from Atessa, in Abruzzo. He is the oldest person in the entire tree. His son Leone was born around 1761, which places him in the generation of 1730-1740. He was already dead by October 1841.", "datos": [["Birth", "c. 1730-1740, presumably Atessa (province of Chieti, Abruzzo)"], ["Trade", "muratore (stonemason) — the same trade as his son, his grandson and his great-grandson"], ["Son", "Leone Pizzi (c. 1761 – 26 October 1841)"], ["Spouse", "Santa Menna, also deceased by 1841"], ["Death", "not located — before October 1841"], ["Where it comes from", "the death record of his son Leone: Atessa, Morti 1841, record 293"]], "vida": "b.c.1730", "lug": "Abruzos", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and with this the tree gains a whole generation. The death record of his son Leone (Atessa, 26 October 1841, record 293, downloaded and transcribed in Leone's file) says «figlio del FU DOMENICO PIZZI di professione MURATORE». The «fu» says that he was already dead in 1841; the trade, that masonry runs in the family — Leone is a muratore (mason), his grandson Domenico is a muratore, and the 1869 record repeats it. His own death record is out of reach: the civil status in the Abruzzi begins in 1809 and he, with a son born c. 1761, almost certainly died before that. What would remain are the parish registers of Atessa, in the Archivio Diocesano di Chieti-Vasto.", "padre": null, "madre": null, "conyuge": "santa_menna", "unionLibre": false, "otrasParejas": [], "hijos": ["leone_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "santa_menna": {"id": "santa_menna", "nombre": "Santa Menna", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 1, "ramas": ["faienza"], "resumen": "Mother of Leone Pizzi, from Atessa. Born around 1730-1740. She is the oldest documented woman in the tree, and the first mother any record of this era bothers to name.", "datos": [["Birth", "c. 1730-1740, presumably Atessa"], ["Son", "Leone Pizzi (c. 1761 – 26 October 1841)"], ["Spouse", "Domenico Pizzi, muratore"], ["Death", "not located — before October 1841; the record calls her «quondam»"], ["Surname", "MENNA is one of the commonest surnames at Atessa: record number 1 of the births of 1869 is that of a Maria Arcangela Menna"]], "vida": "b.c.1730", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and it is worth underlining how exceptional this is. In the four death records from Rende read in this same genealogy, ALL FOUR leave the mother's name blank. Here, in Atessa and fifty years earlier, the form of the Kingdom of the Two Sicilies requires both boxes to be filled in and the clerk fills them: «e della QUONDAM SANTA MENNA». «Quondam» is the Latin for «fu»: she had already died by October 1841. She is given neither trade nor domicile —those two dashes are left empty— but the name is there, and with it a new maternal branch beginning in the middle of the eighteenth century.", "padre": null, "madre": null, "conyuge": "domenico_pizzi_viejo", "unionLibre": false, "otrasParejas": [], "hijos": ["leone_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "leone_pizzi": {"id": "leone_pizzi", "nombre": "Leone Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 2, "ramas": ["faienza"], "resumen": "A stonemason from Atessa, of the rione di Santa Croce, born around 1761. He was widowed three times. He died on 26 October 1841, aged eighty, and his record — the oldest in this whole genealogy — names his parents. His son Giuseppe's record, six years later, names Leone: it is the link that joins the two halves of the Atessa tree.", "datos": [["Birth", "c. 1761, ATESSA — from the eighty years the death record gives him"], ["Parents", "Domenico Pizzi, muratore, and Santa Menna; both already dead in 1841"], ["Trade", "muratore (stonemason)"], ["Residence", "Atessa, rione di SANTA CROCE"], ["First marriage", "Anna Iano"], ["Second marriage", "ROSA IACOBITTI — and she is the one who gave him Giuseppe. The 1841 record left the reading of the name in doubt between «Nora» and «Rosa»; Giuseppe's death record, of 1847, writes ROSA without ambiguity"], ["Third marriage", "Erminia Vitulli"], ["Death", "26 October 1841, at 5 p.m., at his house — Atessa, record 293"], ["Issue", "GIUSEPPE PIZZI (c. 1787 – 29 April 1847), muratore of the same rione di Santa Croce. PROVEN BY RECORD: Giuseppe's death record, Atessa 1847, record 106, calls him «figlio del fu LEONE PIZZI di professione muratore»"]], "vida": "c.1761–1841", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "domenico_pizzi_viejo", "madre": "santa_menna", "conyuge": "rosa_iacobitti", "unionLibre": false, "otrasParejas": [], "hijos": ["giuseppe_pizzi"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "26 October 1841, 17 h", "lugar": "Atessa (Abruzzo Citeriore)", "ref": "record 293", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile della restaurazione > Atessa > 1841, atti di morte"], ["Register", "container hash: LPgBWdB"], ["Page", "183 of 213 (the register itself numbers it «Pag. 147»)"], ["Placement", "right-hand column of the opening; on the left, record 292"], ["Handwritten year", "«mille ottocento quarantuno» — agrees with the catalogue"], ["Registrar", "Giuseppe Salvucci, Secondo Eletto, for the mayor being indisposed; chancellor Giovannantonio Bassani"], ["How it was located", "this register has NO alphabetical index (it ends in blank pages, records 352-353 unused). The straight line was fixed with two probes —page 200 = records 326-327 and page 213 = 352-353— and it came out clean: two records per image, record = 2×page − 74. Three pages downloaded and at the third it was there"]], "literal": "Num. d'ordine 293 — Pag. 147\nL'anno mille ottocento quarantuno, il dì ventisette del mese di Ottobre, alle ore\nquindici d'Italia, avanti di noi Giuseppe Salvucci Secondo Eletto pel Sindaco\nimpedito ed uffiziale dello Stato civile del Comune di Atessa, Distretto di Vasto,\nProvincia di Abruzzo Citeriore, sono comparsi Luigi Tiroli di anni trenta, di\nprofessione contadino, regnicolo, domiciliato in questo Comune nel rione del\nCastello, e Giuseppe Ciccarelli di anni quaranta, di professione contadino,\nregnicolo, domiciliato in questo medesimo Comune nel rione di Santa Croce, i quali\nhan dichiarato, che nel giorno ventisei del mese di Ottobre anno corrente, alle ore\ndiciassette è morto nella sua casa LEONE PIZZI di anni ottanta, vedovo in primo\nvoto di Anna Iano, in secondo voto di Nora Iacobitti, ed in terzo voto di Erminia\nVitulli, nato in Atessa, di professione muratore, domiciliato ivi nel rione di\nSanta Croce, figlio del fu DOMENICO PIZZI di professione muratore, domiciliato\n————, e della quondam SANTA MENNA, domiciliata ————.", "traduccion": "In the year eighteen hundred and forty-one, on the TWENTY-SEVENTH day of the month of OCTOBER, at FIFTEEN HOURS ITALIAN STYLE.\n\nBefore us, GIUSEPPE SALVUCCI, Second Elect for the Mayor being indisposed, and registrar of the Civil Status of the comune of ATESSA, District of VASTO, Province of Abruzzo Citeriore, there appeared LUIGI TIROLI, aged thirty, by trade a farmhand, a subject of the kingdom, resident in this comune in the QUARTER OF THE CASTELLO, and GIUSEPPE CICCARELLI, aged forty, by trade a farmhand, a subject of the kingdom, resident in this same comune in the QUARTER OF SANTA CROCE.\n\nWho declared that on the TWENTY-SIXTH day of the month of OCTOBER of the current year, at SEVENTEEN HOURS, there died IN HIS OWN HOUSE LEONE PIZZI, AGED EIGHTY, WIDOWED in first marriage of ANNA IANO, in second marriage of NORA IACOBITTI and in third marriage of ERMINIA VITULLI, BORN AT ATESSA, by trade a STONEMASON, resident in the same place in the quarter of Santa Croce, SON OF THE LATE DOMENICO PIZZI, by trade a STONEMASON, AND OF THE LATE SANTA MENNA.\n\nIn execution of the law we proceeded together with the said witnesses to the deceased person, and we ascertained his actual death. We thereupon drew up the present record, which we entered in both registers, and having read it aloud to the informants, it was signed by us on the day, month and year stated above, the parties having declared that they could not write. — Giuseppe Salvucci; Giovannantonio Bassani, chancellor.", "notas": ["EIGHTY YEARS OLD IN OCTOBER 1841: he was born c. 1761. It is by a wide margin the earliest date of birth in the whole tree; the second earliest, Pietro Chiappetta, is c. 1780.", "THE RECORD NAMES HIS PARENTS, and this is the find of the batch. «Figlio del FU DOMENICO PIZZI di professione MURATORE, e della QUONDAM SANTA MENNA». Two full names, a trade, and both marked as dead («fu» and «quondam»). With Leone born c. 1761, his parents were born c. 1730-1740: THE TREE GAINS AN ENTIRE GENERATION, and for the first time reaches the eighteenth century.", "AND IT NAMES THE MOTHER. Of the four Rende death records read in this same genealogy, all four leave the mother's box blank. The form of the Kingdom of the Two Sicilies, fifty years earlier, fills it in. Santa Menna is the first maternal grandmother in the whole corpus to have a name of her own.", "THREE WIDOWHOODS. «Vedovo in primo voto di Anna Iano, in secondo voto di Nora Iacobitti, ed in terzo voto di Erminia Vitulli». He buried three wives and died alone. Which of the three is the mother of the branch that follows is unresolved: it would take the marriage of Giuseppe Pizzi or his birth record.", "MASONS FROM FATHER TO SON. His father muratore (mason), he himself muratore, and in 1869 his presumed grandson Domenico Pizzi declares himself muratore before the mayor of Atessa. Three consecutive generations in the same trade, in a world of records where everybody is contadino (peasant).", "THE DISTRICT IS SANTA CROCE. One of the two informants, Giuseppe Ciccarelli, lives in the same rione. By 1869 the family has moved to the rione del Castello.", "THE DOUBTFUL READING IS THE SECOND WIFE'S FORENAME: «Nora Iacobitti» could be «Rosa». The surname Iacobitti reads without difficulty. That of the first informant, TIROLI, also appears in 1891 (Donato Tiroli, informant on Domenico Pizzi's record): the same family attesting to the deaths of the Pizzi fifty years apart.", "THE REGISTER HAS NO INDEX. It ends in blank forms (records 352 and 353 unused), so the year 1841 closed with some 351 deaths. Interpolation was necessary."], "imgs": [{"u": "../actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20Leone%20Pizzi%20-%20Atessa%20acta%20293.jpg", "t": "Leone Pizzi - Atessa acta 293"}], "zooms": [{"u": "../actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20zoom%20-%2080%20anos%2C%20viudo%20tres%20veces%2C%20hijo%20del%20fu%20Domenico%20Pizzi%20y%20de%20Santa%20Menna.jpg", "t": "80 anos, viudo tres veces, hijo del fu Domenico Pizzi y de Santa Menna"}, {"u": "../actas/1841%20-%20Leone%20Pizzi/1841-10-26%20D%20zoom%20-%20acta%20293%20completa.jpg", "t": "Acta 293 completa"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "rosa_iacobitti": {"id": "rosa_iacobitti", "nombre": "Rosa Iacobitti", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 2, "ramas": ["faienza"], "resumen": "Second wife of Leone Pizzi and mother of Giuseppe Pizzi. Born around 1765. She is the only one of Leone's three wives in the bloodline, and she is known only from her son's death record.", "datos": [["Birth", "c. 1765, presumably Atessa — her son was born there around 1787"], ["Spouse", "LEONE PIZZI, muratore of the rione di Santa Croce (c. 1761 – 1841). She was his second wife: before her came Anna Iano, after her Erminia Vitulli"], ["Son", "Giuseppe Pizzi (c. 1787 – 29 April 1847), muratore"], ["Death", "not located — before April 1847, and before October 1841 as well, because Leone's record already gives her as dead"], ["Where it comes from", "the death record of her son Giuseppe: Atessa, Morti 1847, record 106"], ["The forename", "ROSA. The 1841 record was read at the time as «Nora Iacobitti», with the doubt noted; that of 1847, in another hand, writes Rosa plainly"]], "vida": "b.c.1765", "lug": "", "mapa": null, "sinacta": "NEW IN AUGUST 2026, and she arrives on the very line that links her son to her husband. The death record of GIUSEPPE PIZZI (Atessa, 29 April 1847, record 106, transcribed in his own file) says «figlio del fu LEONE PIZZI di professione muratore, e della fu ROSA IACOBITTI». That «della fu» does two things at once: it names her and it declares her dead.\n\nWHAT IT SETTLES. Leone Pizzi was widowed three times —of Anna Iano, of Rosa Iacobitti and of Erminia Vitulli— and his own record, that of 1841, names all three without saying which of them bore him children. For a time that left three possible great-great-grandmothers and none of them certain. The 1847 record chooses: it is her. The other two leave the bloodline.\n\nWHAT IS NOT KNOWN: when she was born, whose daughter she was and when she died. Her marriage to Leone would be earlier than 1787 and therefore earlier than the Napoleonic civil status, so one would have to go to the parish registers of Atessa, in the Archivio Diocesano di Chieti-Vasto. The surname IACOBITTI belongs to the area and also appears in Atessa in 1899.", "padre": null, "madre": null, "conyuge": "leone_pizzi", "unionLibre": false, "otrasParejas": [], "hijos": ["giuseppe_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "santo_bosco": {"id": "santo_bosco", "nombre": "Santo Bosco", "legal": "«figli di fu Santo» in the 1865 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 2, "ramas": ["salerno"], "resumen": "Father of Maria Bosco, from Marano Principato. Born around 1760-1775. He is new as of August 2026 and is the oldest name in the whole RICCHIO branch — the one that runs down to Filomena Chiappetta through her great-grandmother Carmina Ricchio.", "datos": [["Birth", "c. 1760-1775, presumably MARANO PRINCIPATO — his daughter was born there around 1797"], ["Daughter", "Maria Bosco (c. 1797 – 11 August 1865), wife of Giuseppe Ricchio"], ["Spouse", "not stated. The record that names him says of the mother that «s'ignora»"], ["Trade", "blank — the printed form asks for it and the clerk did not fill it in"], ["Death", "not located — before August 1865; the record calls him «fu»"], ["Where it comes from", "the death record of his daughter Maria: Castrolibero, Morti 1865, record 11"]], "vida": "b.c.1760", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD on 26 August 2026. The death record of his daughter MARIA BOSCO (Castrolibero, 11 August 1865, record 11, downloaded and transcribed in her own file) says «figli di FU SANTO». The printed form of the Kingdom of the Two Sicilies asks there only for the given name, because the surname is that of the deceased: BOSCO. The «fu» says that he had already died by August 1865.\n\nWHY IT MATTERS: until 25 August 2026 it was not even known that Maria Bosco existed. The death record of her daughter Carmina (Rende, 1883) named only the father and left the mother's box blank. First an index gave Maria Bosco, then the 1865 record confirmed her, and along the way released her father. Two new generations in two days, in the branch about which least was known.\n\nWHAT IS NOT KNOWN: anything else. Neither trade, nor domicile, nor whom he was married to — the 1865 record expressly declares that Maria's mother «s'ignora». His own death record would be from Marano Principato, earlier than 1865; his marriage and his birth are almost certainly parish matters.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["maria_bosco"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "pietro_chiappetta": {"id": "pietro_chiappetta", "nombre": "Pietro Chiappetta", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "A day labourer from Castrolibero, father of Raffaele Chiappetta. Born around 1780. He was already dead by December 1880.", "datos": [["Birth", "c. 1780, presumably Castrolibero — his son was born there around 1805"], ["Trade", "bracciante (day labourer)"], ["Residence", "Castrolibero — the record says «domiciliato in detto Castrolibero»"], ["Son", "Raffaele Chiappetta (c. 1805 – 3 December 1880)"], ["Spouse", "unnamed — his son's record gives her as dead but does not name her"], ["Death", "not located — before December 1880"]], "vida": "b.c.1780", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026. The death of his son Raffaele (Rende, 3 December 1880, record 135, downloaded and transcribed in Raffaele's file) says «da FU PIETRO, bracciante, domiciliato in detto Castrolibero». Three facts in one line: that he was called Pietro, that he was a day labourer and that he lived in Castrolibero; and the «fu», which says that by December 1880 he was already dead. His own record would have to be looked for in Castrolibero, and with a son born c. 1805 the window for his birth falls around 1775-1785 — beyond the reach of the civil status, which in Calabria begins in 1809. His death, on the other hand, could well be there: Castrolibero has registers from 1809.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["raffaele_chiappetta"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Three facts in a single line", "parrafos": ["Everything known about him fits into one line written on 4 December 1880, when two day labourers from Rende went to the town hall to report the death of his son Raffaele. The clerk noted that the deceased was the son «da fu Pietro, bracciante, domiciliato in detto Castrolibero». It is all there: what he was called, what he lived by and where. And the «fu», which on these forms means deceased: by December 1880 Pietro had been dead for some time.", "His son was born around 1805, so he must have been born between 1775 and 1785. That puts him out of reach by the civil route: civil registration in Calabria begins in 1809, and before that date there are only parish books. His death record, on the other hand, could well exist, in the Castrolibero death registers before 1880.", "There is a clue about his wife, whom the 1880 record leaves unnamed. In three marriages of other Chiappettas gathered in the blog corpus — Castrolibero 1832, Marano Principato 1839 and Castrolibero 1849 — the groom's parents are «Chiappetta, Pietro» and «Veltri, Pasqualina». If it is the same Pietro, she was called Pasqualina Veltri. It is not confirmed: no record read so far says so of him directly."], "claves": [["Trade", "bracciante, a landless day labourer"], ["Village", "Castrolibero"], ["Records of his own", "none; his birth predates civil registration"], ["Dead before", "December 1880"], ["His wife", "unnamed in the record; Pasqualina Veltri? unconfirmed"]]}, "carmine_molinaro": {"id": "carmine_molinaro", "nombre": "Carmine Molinaro", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "He is taken to be the father of Teresa Molinaro, but her death record does NOT name him. The name comes from the index alone.", "datos": [["Daughter", "Teresa Molinaro (c. 1819 – 19 December 1879)"], ["Spouse", "Carmina Covello — as unconfirmed as he is"], ["State of the evidence", "UNCONFIRMED by any original record"], ["The one documented fact", "that Teresa's father had died before December 1879"]], "vida": "", "lug": "", "mapa": null, "sinacta": "WARNING, August 2026. The death record of his daughter Teresa (Rende, 19 December 1879, record 94) was downloaded on the expectation that it would name the parents, because the form of these registers has a box for both. IT DOES NOT NAME THEM. The clerk wrote «da fu ______» and «e dalla fu ______» and left both names blank, something he did not do in the other three records of this same batch, where he did put the father's name. So «Carmine Mulinaro» remains what he was: an index entry with no document behind it. The only thing the record really contributes is the «fu»: whoever Teresa's father was, he had died before December 1879. And that the family surname is written MOLINARO, not «Mulinaro».", "padre": null, "madre": null, "conyuge": "carmina_covello", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_molinaro"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Two blank boxes", "parrafos": ["On 20 December 1879 the death record of his daughter Teresa was drawn up at Rende. The form had space for both parents. The clerk wrote «da fu ______» and «e dalla fu ______» and left both names blank — something he did not do on the other three records of that same generation, where he did put the father's name. That record had been obtained precisely on the expectation that it would name him.", "So Carmine Molinaro remains what he was before: an index line with no document behind it. The only thing the record genuinely adds is the «fu»: whoever Teresa's father was, he had died before December 1879. And a correction of spelling, which is no small thing when you are searching indexes: the surname is written MOLINARO, with an o, in the body of the record, in the marginal heading, in the register's own annual index and in his grandson's marriage of 1873. The «Mulinaro» of the modern indexes is a distortion.", "One attractive hypothesis remains, with no record to support it. In the Marano Principato marriages of 1839, Antonio Chiappetta, son of Pietro Chiappetta and Pasqualina Veltri, marries Saveria Maria Mulinaro, daughter of Carmine Mulinaro and Carmina Covello. If our Raffaele — also a son of Pietro — married Teresa — a daughter of Carmine — they would be two brothers married to two sisters. It fits, but the marriage of Raffaele and Teresa was searched for at Marano Principato in 1838 and 1841-1845, page by page, and it is not there: among those forty-six marriages no Chiappetta appears."], "claves": [["State of the evidence", "unconfirmed: only an index says so"], ["The one documented fact", "Teresa's father had died before December 1879"], ["Spelling of the surname", "Molinaro, never Mulinaro"], ["Daughter", "Teresa Molinaro, c. 1819 – 19 December 1879"]]}, "carmina_covello": {"id": "carmina_covello", "nombre": "Carmina Covello", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "She is taken to be the mother of Teresa Molinaro. No record read so far names her.", "datos": [["Daughter", "Teresa Molinaro"], ["Spouse", "Carmine Molinaro"], ["State of the evidence", "UNCONFIRMED by any original record"], ["The one documented fact", "that Teresa's mother had died before December 1879"]], "vida": "", "lug": "", "mapa": null, "sinacta": "The same situation as her husband, and for the same reason. The death record of her daughter Teresa (Rende, 1879, record 94) has the mother's box —«e dalla fu ______ domiciliata in ______»— and it is blank. She is kept in the tree on the strength of the index, marked as unconfirmed. The pattern is worth noting: of the four death records of this generation read in 2026, ALL FOUR are silent on the mother's name. Three of them do give the father's. In these Rende registers maternal filiation is the first fact to be lost.", "padre": null, "madre": null, "conyuge": "carmine_molinaro", "unionLibre": false, "otrasParejas": [], "hijos": ["teresa_molinaro"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "The mother nobody wrote down", "parrafos": ["Her name comes from the same index line as her husband's, and the document that was meant to back it up does not. In her daughter Teresa's death record of December 1879 the box reads «e dalla fu ______ domiciliata in ______» and is empty.", "This is not an isolated slip, it is a pattern. Of the four death records of that generation read in 2026 — Teresa Molinaro in 1879, Raffaele Chiappetta in 1880, Carmina Ricchio in 1883 and Domenico Massei in 1891 — all four omit the mother's name; three of them do give the father's. In these Rende registers maternal descent is the first thing to be lost. The oddest case is that of 1891: the clerk left the name blank and yet filled in «domiciliata in Rende». He knew where that woman had lived and did not know what she was called.", "Of Carmina Covello, therefore, the only documented fact is that Teresa's mother had died before December 1879. She is kept in the tree, marked as unconfirmed."], "claves": [["State of the evidence", "unconfirmed by any record"], ["The one documented fact", "she had died before December 1879"], ["Why she is missing", "all four records of her generation omit the mother's name"]]}, "giuseppe_ricchio": {"id": "giuseppe_ricchio", "nombre": "Giuseppe Ricchio", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "A day labourer from Marano Principato, father of Carmina Ricchio. Born around 1800. He was already dead by December 1883, and he never left his village.", "datos": [["Birth", "c. 1800, presumably Marano Principato"], ["Trade", "bracciante (day labourer)"], ["Residence", "Marano Principato — the record says «domiciliato IN VITA in Marano Principato»"], ["Daughter", "Carmina Ricchio (c. 1828 – 11 December 1883)"], ["Spouse", "MARIA BOSCO († 11 August 1865, Castrolibero) — his daughter's record gave her as dead without naming her; her own death record, read in August 2026, names her and names him: «vedova del fu Giuseppe Ricchio»"], ["Death", "not yet located as an image — the index places it at Castrolibero, Morti 1855, record 28. In August 1865 his wife was already a widow, which fits"]], "vida": "b.c.1800", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and with a clue as to where to look for him. The death of his daughter Carmina (Rende, 11 December 1883, record 163, transcribed in her own file) says «da FU GIUSEPPE, bracciante, domiciliato IN VITA in Marano Principato». That «in vita» is gold: it not only confirms that he had died, it says where he lived until the end. His death record ought therefore to be in the registers of MARANO PRINCIPATO, earlier than 1883 — a comune that until this batch did not appear in the tree and which now turns out to be the town of origin of two of Filomena's four great-grandparents.\n\nCORRECTION OF 26 AUGUST 2026, and it runs the other way. The death record of his wife MARIA BOSCO (Castrolibero, 11 August 1865, record 11) calls her «VEDOVA DEL FU GIUSEPPE RICCHIO» and places her living in CASTROLIBERO, contrada Feudo, although born in Marano Principato. That is: the family had moved to Castrolibero, it was there that their daughter Carmina married in 1849 and there that his wife died. The «domiciliato in vita in Marano Principato» of the 1883 record was said by a son-in-law eighteen years after her death and twenty-eight after his, and it probably confuses the town of origin with the last domicile. The index places his death in CASTROLIBERO, Morti 1855, record 28 — which is where it must be looked for, and not in Marano Principato.", "padre": null, "madre": null, "conyuge": "maria_bosco", "unionLibre": false, "otrasParejas": [], "hijos": ["carmina_ricchio"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "Resident in life at Marano", "parrafos": ["On 12 December 1883, at the town hall of Rende, his son-in-law Giovanni Chiappetta reported the death of Carmina Ricchio, which had occurred the previous day at noon. In identifying the deceased, the record calls her the daughter «da fu Giuseppe, bracciante, domiciliato in vita in Marano Principato».", "That «in vita» — in life — is what turns the phrase into a usable fact. It does not merely say that Giuseppe had died: it says where he lived until the end. His death record is not to be sought at Rende, where his daughter died, but in the Marano Principato registers before 1883.", "Marano Principato did not appear in this tree until that run of readings. It suddenly turned out to be the home village of two of Filomena's four grandparents: Carmina Ricchio and Teresa Molinaro. Giuseppe, a day labourer like almost every man in this line, was presumably born there around 1800, reckoning back from his daughter's birth around 1828."], "claves": [["Trade", "bracciante, day labourer"], ["Village", "Marano Principato, where he lived until he died"], ["Dead before", "December 1883"], ["Daughter", "Carmina Ricchio, c. 1828 – 11 December 1883"]]}, "maria_bosco": {"id": "maria_bosco", "nombre": "Maria Bosco", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "A countrywoman born in Marano Principato around 1797, wife of Giuseppe Ricchio and mother of Carmina Ricchio. She died a widow at Castrolibero, contrada Feudo, on 11 August 1865, aged sixty-eight. Until 25 August 2026 no one knew she existed.", "datos": [["Birth", "c. 1797, MARANO PRINCIPATO — the record says «nato in Marano Principato» and gives her 68 years"], ["Parents", "SANTO BOSCO, already deceased in 1865. The mother is NOT stated: where the printed form asks for her name, the clerk wrote «s'ignora» and left the rule blank"], ["Trade", "contadina (countrywoman)"], ["Spouse", "Giuseppe Ricchio, bracciante († Castrolibero, 1855 according to the index) — the record calls her «vedova del fu Giuseppe Ricchio»"], ["Daughter", "Carmina Ricchio (c. 1828, Marano Principato – 11 December 1883, Rende)"], ["Residence", "Castrolibero, CONTRADA FEUDO — not her native village"], ["Death", "11 August 1865, 4 p.m., in her own house — Castrolibero, record 11"]], "vida": "c.1797–1865", "lug": "MARANO PRINCIPATO", "mapa": null, "sinacta": "", "padre": "santo_bosco", "madre": null, "conyuge": "giuseppe_ricchio", "unionLibre": false, "otrasParejas": [], "hijos": ["carmina_ricchio"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "12 August 1865, 20 h (the record); died on the 11 at 16 h", "lugar": "Castrolibero", "ref": "record 11", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Castrolibero > Registro 57 «Morti» 1865"], ["Register", "container hash: 57oe7Dz (23 pages)"], ["Page", "7 of 23, RIGHT-hand column — folio 6 (on the left, record 10)"], ["Handwritten year", "the year is PRINTED on the form, «L'anno mille ottocento sessantacinque»; only the day is written by hand. It agrees with the catalogue"], ["Registrar", "Pietro Perri, f.f. da Sindaco; countersigned by Pasquale Perri, town clerk"], ["How it was located", "by proportion: record = 2 × page − 3 for the right-hand column. Right at the first attempt, with no probe at all"]], "literal": "…è morta nella casa di sua abitazione MARIA BOSCO vedova del fu GIUSEPPE RICCHIO, nato in Marano Principato, figli di FU SANTO ———— di professione ———— domiciliato ————, e di s'ignora ———— domiciliata ———— di anni SESSANTOTTO di professione CONTADINA domiciliata in Castrolibero, Contrada Feudo.", "traduccion": "In the year eighteen hundred and sixty-five, on the TWELFTH day of the month of AUGUST, at TWENTY hours, before Us, PIETRO PERRI, acting mayor and registrar of the Civil Status of the comune of CASTROLIBERO, district of Cosenza, province of Calabria Citra, there appeared FERDINANDO STILLATO, SON-IN-LAW OF THE DECEASED, aged thirty, by trade a BRACCIALE, of the kingdom, resident at Castrolibero, contrada Feudo; and GIACINTO BOSCO, aged thirty, by trade a bracciale, of the kingdom, resident in this comune.\n\nWho declared that on the ELEVENTH day of the month of AUGUST of the current year, at SIXTEEN hours, there died IN THE HOUSE OF HER DWELLING MARIA BOSCO, WIDOW OF THE LATE GIUSEPPE RICCHIO, born at MARANO PRINCIPATO, DAUGHTER OF THE LATE SANTO — by trade (blank), resident (blank) — AND OF A MOTHER UNKNOWN (blank), AGED SIXTY-EIGHT, by trade a CONTADINA, resident at CASTROLIBERO, CONTRADA FEUDO.\n\nIn compliance with the laws we proceeded together with the said witnesses to the deceased person and ascertained her actual death. We thereafter drew up the present record, which we entered in both registers, and having read it to the informants, it was signed by Us on the day, month and year stated above, the informing witnesses having declared that they could not write.", "notas": ["WHAT IDENTIFIES THIS WOMAN AND NO OTHER is the SPOUSE: «VEDOVA DEL FU GIUSEPPE RICCHIO». In Castrolibero and Marano Principato there are several intertwined Ricchio and Bosco families, and the spouse column was the one that had to decide. It decides. And everything else fits: born in MARANO PRINCIPATO, which is where her daughter Carmina was born and where the 1883 record places Giuseppe Ricchio; and died a WIDOW, consistent with his death in 1855.", "SANTO BOSCO, CONFIRMED. «figli di FU SANTO». The printed form asks only for the forename because the surname is that of the deceased. The «fu» says he had already died. It is an entire new generation on the branch by which Filomena Chiappetta descends from the Ricchio, and the earliest name on that branch.", "MARIA ESPOSITO, NOT CONFIRMED — AND MOREOVER CONTRADICTED. The blog index gave both parents, «Bosco, Santo — Esposito, Maria». The record confirms the first and denies the second: where the printed form asks for the mother's name, the clerk wrote «S'IGNORA» —it is unknown— and left empty the three rules for the name, the trade and the residence. It is not an omission like the one in Carmina Spizzirri's record of 1864, where the boxes were simply left blank: here the clerk takes the trouble to write a word where a name ought to go. READING NOTE, to be honest: the word is perfectly clear letter by letter —S, i, g, n, o, r, a— and admits two readings, «s'ignora» (it is unknown) or the courtesy title «Signora» placed where the name should be. In both cases the result is the same and it is the one that matters: THERE IS NO MOTHER'S NAME IN THE RECORD AT ALL. MARIA ESPOSITO remains index evidence and nothing more, and has not been entered into this tree as a person.", "SIXTY-EIGHT YEARS OLD IN AUGUST 1865: born c. 1797. With Carmina born c. 1828 she had her at about thirty-one, which is normal. With Cherubina, whom the indexes put in 1849, she would be fifty-two, which is no longer so: either Cherubina is not her daughter, or one of the declared ages is rounded. It is noted and unresolved.", "SHE LIVED IN CASTROLIBERO, CONTRADA FEUDO, not in Marano Principato. The family had moved: there her daughter Carmina married in 1849, there her husband died in 1855 and there she dies. This corrects the reading that had been made of the 1883 record, which called Giuseppe Ricchio «domiciliato in vita in Marano Principato» — the son-in-law who reported it almost certainly confused the village of origin with the last residence.", "THE FIRST INFORMANT IS A SON-IN-LAW AND HE IS NOT OURS. «FERDINANDO STILLATO, GENERO DELLA DEFUNTA», aged thirty. Carmina Ricchio was married to Domenico Antonio Mazzei and lived in Rende, so Stillato is the husband of ANOTHER daughter. The candidate is CHERUBINA RICCHIO, whom the indexes give as born in Marano Principato in 1849 and dead in Castrolibero in 1901 (record 18). Unchecked, but it is the thread to pull.", "THE SECOND INFORMANT, GIACINTO BOSCO, aged thirty, bracciale (day labourer), bears the surname of the deceased. Nephew or close relative; nothing in the record makes it precise.", "WHERE THE MOTHER MIGHT TURN UP: in the marriage of Maria Bosco to Giuseppe Ricchio, which from Carmina's age would be c. 1825-1828 in Marano Principato, or in Maria's own birth, c. 1797, which is already parish and earlier than the civil status."], "imgs": [{"u": "../actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20Maria%20Bosco%20-%20Castrolibero%20acta%2011.jpg", "t": "Maria Bosco - Castrolibero acta 11"}], "zooms": [{"u": "../actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20acta%2011%20completa.jpg", "t": "Acta 11 completa"}, {"u": "../actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20declarante%20Ferdinando%20Stillato%2C%20yerno%20de%20la%20difunta.jpg", "t": "Declarante Ferdinando Stillato, yerno de la difunta"}, {"u": "../actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20hija%20del%20difunto%20Santo%2C%20la%20madre%20sin%20nombre%2C%2068%20anos.jpg", "t": "Hija del difunto Santo, la madre sin nombre, 68 anos"}, {"u": "../actas/1865%20-%20Maria%20Bosco/1865-08-11%20D%20zoom%20-%20viuda%20del%20difunto%20Giuseppe%20Ricchio.jpg", "t": "Viuda del difunto Giuseppe Ricchio"}]}], "nActas": 1, "nImgs": 5, "titulo": "", "parrafos": [], "claves": []}, "filippo_massei": {"id": "filippo_massei", "nombre": "Filippo Massei", "legal": "Filippo Mazzei in the 1891 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "A day labourer from Rende, father of Domenico Massei. Born around 1795. He was already dead by November 1891.", "datos": [["Birth", "c. 1795, presumably Rende — his son was born there around 1821"], ["Trade", "bracciante (day labourer)"], ["Residence", "Rende"], ["Son", "Domenico Massei (c. 1821 – 8 November 1891)"], ["Spouse", "unnamed — his son's record says that she had died and that she had lived at Rende"], ["Death", "not located — before November 1891"], ["Spelling", "the record that names him writes MAZZEI"]], "vida": "b.c.1795", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026. The death of his son Domenico (Rende, 8 November 1891, record 112, transcribed in his own file) says «dal FU FILIPPO, bracciante, domiciliato in Rende». With the son born in Rende c. 1821, this branch turns out to have been of Rende all along, and not of Castrolibero as had been supposed. His death record ought to be in the Morti of Rende earlier than 1891 — which are on Antenati and within reach — with no clue beyond the name and the trade. His birth, c. 1795, falls outside: the civil status in Calabria begins in 1809.", "padre": null, "madre": null, "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": ["domenico_massei"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "From Rende, not Castrolibero", "parrafos": ["He appears in a single sentence, in the death record of his son Domenico, drawn up at Rende on 9 November 1891: «dal fu Filippo, bracciante, domiciliato in Rende».", "That sentence corrected an assumption that had stood for some time. The Massei were taken to be people of Castrolibero, because Angela, Domenico's daughter, had been born there around 1858. But the record says that Domenico was born at Rende around 1821 and that his father was resident at Rende. The family had been from Rende all along; it was Domenico who moved, and who came back.", "His death record should be in the Rende death registers before 1891 — collections already known and accessible — with nothing to go on but the name and the trade. His birth, around 1795, is out of reach. And the surname: the 1891 record spells it MAZZEI, with an unmistakable double z, while the records of the branch that lives on (1873, 1877, 1894) spell it MASSEI. Both forms are real and depend on the clerk, not on the bearer."], "claves": [["Trade", "bracciante, day labourer"], ["Village", "Rende"], ["Dead before", "November 1891"], ["Spelling", "Mazzei in the record that names him; Massei everywhere else in the branch"]]}, "giuseppe_pizzi": {"id": "giuseppe_pizzi", "nombre": "Giuseppe Pizzi", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["faienza"], "resumen": "A stonemason from Atessa, of the rione di Santa Croce, born around 1787. He died on 29 April 1847, aged sixty, and his death record is the one that anchors this branch at the top: it states in so many words that he was the son of Leone Pizzi.", "datos": [["Birth", "c. 1787, ATESSA — from the sixty years the death record gives him"], ["Parents", "LEONE PIZZI, muratore, and ROSA IACOBITTI; both already dead by April 1847"], ["Trade", "MURATORE (stonemason) in his own record of 1847. His son's, of 1891, calls him «artigiano»: the same thing said forty-four years later"], ["Residence", "Atessa, rione di SANTA CROCE — the same quarter in which his father died"], ["Spouse", "ANTONIA DI IORIO, filatrice. In 1847 she was living: the record calls him «marito», not «vedovo»"], ["Son", "Domenico Pizzi (c. 1824-1830 – 28 September 1891)"], ["Death", "29 April 1847, at 10 p.m., at his house — Atessa, record 106"]], "vida": "c.1787–1847", "lug": "ATESSA", "mapa": null, "sinacta": "", "padre": "leone_pizzi", "madre": "rosa_iacobitti", "conyuge": "antonia_di_iorio", "unionLibre": false, "otrasParejas": [], "hijos": ["domenico_pizzi"], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "29 April 1847, 22 h", "lugar": "Atessa (Abruzzo Citeriore)", "ref": "record 106", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile della restaurazione > Atessa > 1847, atti di morte"], ["Register", "container hash: wWe3JmB — 191 pages"], ["Page", "86 of 191 (the register itself numbers it «54»)"], ["Placement", "left-hand column of the opening; on the right, record 107"], ["Handwritten year", "«mille ottocento quarantasette» — agrees with the catalogue"], ["Registrar", "Luigi Rossi, Secondo Eletto for the mayor being indisposed; deputy chancellor Ottaviano Cardone"], ["How it was located", "this register carries no alphabetical index either: it ends in blank forms, records 308-309 unused. Two records per image, and on each folio of the register go records 2P−2 and 2P−1; but the image→folio correspondence is NOT constant (folio = image − 36 in December, folio = image − 32 in April), so the formula that served for 1841 fails here by eight records. Eight probes: 191, 188, 185, 87, 80, 83, 85 and 86. The decisive step was seeing that record 108 was already of 17 May: that shut 29 April in between records 102 and 107, six records and three images"]], "literal": "Num. d'ordine 106\nL'anno mille ottocento quarantasette, il dì trenta del mese di Aprile, alle ore\nquattordici d'Italia, avanti di noi Luigi Rossi Secondo Eletto pel Sindaco\nimpedito ed uffiziale dello stato civile del Comune di Atessa, Distretto di Vasto,\nProvincia di Abruzzo Citeriore, sono comparsi Domenico Fidelibus di anni\ncinquantotto, di professione contadino, regnicolo, domiciliato in questo Comune nel\nrione del Mercato, e Nobile Domenico di anni sessanta, di professione contadino,\nregnicolo, domiciliato in questo Comune nel rione del Castello, i quali han\ndichiarato, che nel giorno ventinove del mese di Aprile anno corrente, alle ore\nventidue è morto nella sua casa GIUSEPPE PIZZI di anni sessanta, marito di Antonia\ndi Iorio, nato in Atessa, di professione muratore, domiciliato ivi nel rione di\nSanta Croce, figlio del fu LEONE PIZZI di professione muratore, domiciliato ————,\ne della fu ROSA IACOBITTI, domiciliata ————.", "traduccion": "In the year eighteen hundred and forty-seven, on the THIRTIETH day of the month of APRIL, at FOURTEEN HOURS ITALIAN STYLE.\n\nBefore us, LUIGI ROSSI, Second Elect for the Mayor being indisposed, and registrar of the Civil Status of the comune of ATESSA, District of VASTO, Province of Abruzzo Citeriore, there appeared DOMENICO FIDELIBUS, aged fifty-eight, by trade a farmhand, a subject of the kingdom, resident in this comune in the QUARTER OF THE MERCATO, and DOMENICO NOBILE, aged sixty, by trade a farmhand, a subject of the kingdom, resident in this same comune in the QUARTER OF THE CASTELLO.\n\nWho declared that on the TWENTY-NINTH day of the month of APRIL of the current year, at TWENTY-TWO HOURS, there died in his own house GIUSEPPE PIZZI, aged SIXTY, HUSBAND OF ANTONIA DI IORIO, born at Atessa, by trade a STONEMASON, resident in the same place in the QUARTER OF SANTA CROCE, SON OF THE LATE LEONE PIZZI, by trade a STONEMASON, resident ————, AND OF THE LATE ROSA IACOBITTI, resident ————.\n\nIn execution of the law we proceeded together with the said witnesses before the deceased person and ascertained his actual death. We thereafter drew up the present record, which we entered in both registers and read to the informants; it was signed by us on the day, month and year stated above, the informants having declared that they could not write.", "notas": ["IT IS THE RECORD THAT HOOKS ON THE GENERATION OF 1730. Until today, that Giuseppe Pizzi was the son of Leone was stated only by a family block without a single citation, the same one that had already erred three verified times. Now the document says it: «figlio del fu LEONE PIZZI di professione MURATORE». With that line there enter the tree, now proven, Leone and —through Leone's own record of 1841— his parents Domenico Pizzi and Santa Menna, who belong to the generation of 1730-1740.", "AND IT RESOLVES THE SECOND LOOSE END, THAT OF THE THREE WIVES. Leone was widowed three times and his 1841 record does not say which of them bore him children. This one does: Giuseppe's mother is ROSA IACOBITTI, the second wife. Anna Iano and Erminia Vitulli fall outside the bloodline.", "IN PASSING IT CORRECTS A READING. In the 1841 record the second wife's forename was noted as doubtful, «Nora Iacobitti (it could be Rosa)». Here, another hand and six years earlier, writes ROSA without ambiguity. Two different clerks, the same surname, and the forename now settled.", "THE TRADE PASSES FROM FATHERS TO SONS, AND NOW THERE ARE FOUR IN A ROW. Domenico the elder (c. 1730) muratore, Leone (c. 1761) muratore, Giuseppe (c. 1787) muratore, and Domenico (c. 1824-1830) muratore. A hundred and fifty years of masons in the same village, and two of them in the same district, the rione di Santa Croce.", "IT ALSO CLOSES WITH THE 1891 RECORD. This one gives him as «marito di ANTONIA DI IORIO»; the death of his son Domenico, forty-four years later, names the mother as «fu Antonia di Iorio, filatrice». It is the same woman, and the two records confirm one another without having been consulted together.", "THE AGES TALLY WITHOUT FORCING ANYTHING: Leone was born c. 1761 and Giuseppe c. 1787, twenty-six years between father and son.", "A DETAIL OF THE YEAR: the immediately preceding record, no. 105, is for another death on that same 29 April, a two-month-old girl. April 1847 was running in Atessa at the rate of one death a day; in May the pace falls to less than half."], "imgs": [{"u": "../actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20Giuseppe%20Pizzi%20-%20Atessa%20acta%20106.jpg", "t": "Giuseppe Pizzi - Atessa acta 106"}], "zooms": [{"u": "../actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%2060%20anos%2C%20muratore%2C%20marido%20de%20Antonia%20di%20Iorio%2C%20hijo%20del%20fu%20Leone%20Pizzi%20y%20de%20la%20fu%20Rosa%20Iacobitti.jpg", "t": "60 anos, muratore, marido de Antonia di Iorio, hijo del fu Leone Pizzi y de la fu Rosa Iacobitti"}, {"u": "../actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%20acta%20106%20completa.jpg", "t": "Acta 106 completa"}, {"u": "../actas/1847%20-%20Giuseppe%20Pizzi/1847-04-29%20D%20zoom%20-%20cabecera%2C%20declarantes%20y%20la%20muerte%20el%2029%20de%20abril%20a%20las%2022%20h.jpg", "t": "Cabecera, declarantes y la muerte el 29 de abril a las 22 h"}]}], "nActas": 1, "nImgs": 4, "titulo": "", "parrafos": [], "claves": []}, "antonia_di_iorio": {"id": "antonia_di_iorio", "nombre": "Antonia di Iorio", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["faienza"], "resumen": "A spinner from Atessa, mother of Domenico Pizzi. Born around 1795-1805. Her name is rescued by her son's death record in 1891.", "datos": [["Birth", "c. 1795-1805, presumably Atessa"], ["Trade", "filatrice (spinner)"], ["Residence", "Atessa — «domiciliata IN VITA in Atessa»"], ["Son", "Domenico Pizzi (c. 1824 – 28 September 1891)"], ["Spouse", "Giuseppe Pizzi, artigiano"], ["Death", "not located — before September 1891"]], "vida": "b.c.1795", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and it is a small victory against custom. The death of her son Domenico (Atessa, 28 September 1891, record 238, transcribed in his own file) says «e da FU ANTONIA DI IORIO, FILATRICE, domiciliata IN VITA in Atessa». Full name and surname, trade and town: exactly what the four twin forms from Rende passed over in silence four times running in those same years. In Atessa, the same printed form of the Kingdom of Italy, with the same printed gap, was in fact filled in. Her death ought to be in the Morti of Atessa earlier than 1891.", "padre": null, "madre": null, "conyuge": "giuseppe_pizzi", "unionLibre": false, "otrasParejas": [], "hijos": ["domenico_pizzi"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "lorenzo_palermo": {"id": "lorenzo_palermo", "nombre": "Lorenzo Palermo", "legal": "«il fu Lorenzo» in the 1863 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Father of Giuseppe Palermo, the one from Marano Marchesato. Since his son was born around 1773, he belongs to the generation of 1740-1750. He was already dead by March 1863.", "datos": [["Birth", "c. 1740-1750, presumably MARANO MARCHESATO — his son Giuseppe is recorded as «nato in Marano medesimo»"], ["Son", "GIUSEPPE PALERMO (c. 1773 – 6 March 1863), pastore and bracciale"], ["Spouse", "Giulia Chiappetta, also deceased by 1863"], ["Trade", "NOT STATED — the 1863 record leaves the box for the father's trade blank"], ["Death", "not located — before March 1863"], ["Where it comes from", "the death record of his son Giuseppe: Marano Marchesato, Morti 1863, record 24, «figlio di FU LORENZO»"]], "vida": "b.c.1740", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026. The death record of his son Giuseppe —Marano Marchesato, 6 March 1863, record 24, downloaded and transcribed in Giuseppe's file— says «figlio di FU LORENZO... e di FU GIULIA CHIAPPETTA». The «fu» gives him as already dead in 1863. Until that reading, Lorenzo Palermo was no more than a box in a blog index.\n\nHis own death record is not within reach by the easy route: with a son born c. 1773, he would normally have died between 1800 and 1840. If it was after 1809 it would be in the Morti of Marano Marchesato, which are on Antenati from 1822; if before, only the parish of S. Maria del Carmine remains. Warning: in Marano at least eight Palermo families live side by side at the same time, and the index for 1809-1826 carries another Lorenzo Palermo married to a Francesca Chiappetta who is NOT this one — or at least it is not proven that he is.", "padre": null, "madre": null, "conyuge": "giulia_chiappetta", "unionLibre": false, "otrasParejas": [], "hijos": ["giuseppe_palermo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giulia_chiappetta": {"id": "giulia_chiappetta", "nombre": "Giulia Chiappetta", "legal": "«fu Giulia Chiappetta» in the 1863 record", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Mother of Giuseppe Palermo. Born around 1740-1750, dead before March 1863. She is one of the few mothers the Marano forms bother to name.", "datos": [["Birth", "c. 1740-1750, presumably Marano Marchesato"], ["Son", "GIUSEPPE PALERMO (c. 1773 – 6 March 1863)"], ["Spouse", "Lorenzo Palermo, also deceased by 1863"], ["Death", "not located — before March 1863; the record calls her «fu»"], ["Surname", "CHIAPPETTA is among the commonest in the area, and it is the same as that of the Filomena Chiappetta branch which enters the family eighty years later, by way of Castrolibero. No relationship between the two is proven"], ["Where it comes from", "the death record of her son Giuseppe: Marano Marchesato, Morti 1863, record 24"]], "vida": "b.c.1740", "lug": "", "mapa": null, "sinacta": "CONFIRMED BY RECORD in August 2026, and it is worth underlining how infrequent this is. In the four death records from Rende read in this genealogy, ALL FOUR leave the mother's name blank; and in the record of her own daughter-in-law, Carmina Spizzirri (Marano, 1864), the two boxes for father and mother are likewise left empty. Here, by contrast, the clerk of Marano filled them in: «figlio di fu Lorenzo... e di FU GIULIA CHIAPPETTA». The reading of the surname is firm —Chiappetta, not Chiappella— and it agrees with what the blog index gave. No trade or domicile is noted for her: those dashes were indeed left blank.", "padre": null, "madre": null, "conyuge": "lorenzo_palermo", "unionLibre": false, "otrasParejas": [], "hijos": ["giuseppe_palermo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "michele_volpintesta": {"id": "michele_volpintesta", "nombre": "Michele Volpintesta", "legal": "«il fu Michele» in the 1823 record; VOLPENTESTA in the Marano spelling", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 3, "ramas": ["salerno"], "resumen": "Born around 1723. He died at RENDE on 20 August 1793, aged seventy, and was buried two hours later inside the church of Santa Maria Maggiore itself. He is the oldest dated ancestor in the whole tree.", "datos": [["Birth", "c. 1723 — from the seventy years his death extract of 1793 gives him. It is the earliest date of birth in the whole tree"], ["Trade", "BRACCIALE (day labourer) — the same as his son Vincenzo"], ["Son", "VINCENZO VOLPENTESTA (c. 1773 – 19 March 1823), bracciale, married to Teresa Luchetta"], ["Spouse", "TERESA TENUTA — CONFIRMED BY DOCUMENT since 26 August 2026: the parish extract of his death calls him «MICHAEL VOLPENTESTA VIR THERESIAE TENUTA»"], ["Death", "20 August 1793, RENDE — parish of Santa Maria Maggiore, folio 48 of the book of the dead, aged SEVENTY"], ["Where it comes from", "the death record of his son Vincenzo: Marano Marchesato, Morti 1823, record 8, «figlio del FU MICHELE di professione BRACCIALE»"]], "vida": "c.1723–1793", "lug": "", "mapa": null, "sinacta": "TWO DOCUMENTS SUPPORT HIM. The death record of his son Vincenzo —Marano, 19 March 1823, record 8— says «figlio del FU MICHELE, di professione BRACCIALE», and the «fu» gives him as already dead. And since 26 August 2026 there is something far better: HIS OWN DEATH EXTRACT, kept inside the marriage dossier of his granddaughter Carmina (Rende 1837, processetto 20, page 230).\n\n«ANNO DOMINI 1793 DIE VIGESIMO AUGUSTI RENDIS — MICHAEL VOLPENTESTA VIR THERESIAE TENUTA, AETATIS SUAE ANN. SEPTUAGINTA». With all the sacraments, and his body carried to the parish church and buried there two hours later. It is signed by the parish priest Nicolaus Rovella; the extract was issued by Balthasar Bartucci on 19 October 1837, the month of the wedding.\n\nHE DIED IN RENDE, NOT IN MARANO, and that matters: the Volpentesta family already had a link with Rende in the eighteenth century, two generations before his granddaughter settled there and married —in that same church of Santa Maria Maggiore—. It was not a new move.\n\nHis birth, c. 1723, and his marriage to Teresa Tenuta are still missing. Both would be parish matters: civil registration does not exist until 1809.\n\nA TRAP WORTH KNOWING ABOUT (29 August 2026). In the parish burials of Rende for 1807, record 203, ANOTHER MICHELE VOLPINTESTA dies, son of Giovanni and married to Maria Rosaria Benincasa. HE IS NOT THIS ONE. Ours died in Rende on 20 August 1793, aged seventy, married to Teresa Tenuta. They are two different men fourteen years apart, and anyone searching for «Michele Volpintesta» in Rende will stumble on the other one first. The Volpintesta are an abundant surname there: in the tables of 1796 and 1807 alone, Salvatore, Gaetano, Gennaro, Giovanni and Giuseppe appear as heads of household.", "padre": null, "madre": null, "conyuge": "teresa_tenuta", "unionLibre": false, "otrasParejas": [], "hijos": ["vincenzo_volpintesta"], "hermanos": [], "actas": [{"titulo": "Parish extract of death", "tipo": "D", "tipoNombre": "Death", "fecha": "20 August 1793", "lugar": "Rende", "ref": "folio 48 of the book of the dead", "fuente": [["Archive", "Archivio di Stato di Cosenza"], ["Collection", "Stato civile della Restaurazione > Rende > Registro 29 «Matrimoni, processetti» 1837"], ["Register", "ark an_ua35976841 · container hash: LPAZyGB (269 images)"], ["Page", "230 of 269 — dossier 20, that of the wedding of his granddaughter Carmina"], ["Original", "book of the dead of the parish of SANTA MARIA MAGGIORE of Rende, folio 48. The extract was issued by the parish priest Balthasar Bartucci on 19 October 1837, «ad fidem pro usu Matrimonii»"], ["Parish priest in 1793", "Nicolaus Rovella"], ["How it was located", "it was not sought: it turned up inside the marriage dossier of 1837, among the documents the couple had to produce in order to marry"]], "literal": "Anno Domini 1793 die vigesimo Augusti Rendis — MICHAEL VOLPENTESTA VIR THERESIAE TENUTA, aetatis suae ann. septuaginta, omnibus SS. munitus, in C.S.M.E. animam suam Deo reddidit, ejusque corpus ad Ecclesiam Parochialem delatum, et post horas duas ibidem sepultum fuit. — Nicolaus Rovella, Rector.", "traduccion": "I, the undersigned rector of the parish church of the town of Rende, under the invocation of SANTA MARIA MAGGIORE, having consulted the book of the dead, certify that I have found the following entry on folio 48, namely:\n\n«IN THE YEAR OF OUR LORD 1793, ON THE TWENTIETH DAY OF AUGUST, AT RENDE — MICHELE VOLPENTESTA, HUSBAND OF TERESA TENUTA, aged SEVENTY years, fortified with all the sacraments, rendered his soul to God; and his body was carried to the parish church and there buried two hours later. — Nicolás Rovella, rector.»\n\nAnd I so certify for the purpose of marriage. At Rende, 19 October 1837. Baltasar Bartucci, rector.", "notas": ["THIS DOCUMENT RESCUES TERESA TENUTA. Three words —VIR THERESIAE TENUTA— which turn her from an index name into a documented person. She had gone the whole project without a page of her own because the 1823 record leaves the mother's box blank, and it had been decided not to take her as good.", "IT IS THE OLDEST DOCUMENT IN THE TREE, and it carries the chain back to 1723 — seventy years before 1793. Ahead of Domenico Pizzi and Santa Menna, who were around 1730.", "HE DIED IN RENDE, NOT IN MARANO. The Volpentesta already had a link with Rende in the eighteenth century, two generations before his granddaughter Carmina settled there. And he married in THAT VERY CHURCH, Santa Maria Maggiore, in 1837. The family went back to the place it had left.", "He was buried inside the parish church two hours after dying. In August, in Calabria, the haste explains itself.", "The blog index dated this death to 1793 and got it right. But the same index gave that of his son Vincenzo as 1827 when the record is of 1823. Being right once does not make it reliable: it remains a lead, not proof.", "29 AUGUST 2026 — HE NOW HAS CHILDREN, AND THEY HAVE DATES. Since he died in Rende, his children had to be baptised in Rende, and the baptisms of that parish begin in 1731 and are transcribed in the Calabrian blog that was already on disc. Swept year by year, THREE children of his and of Teresa Tenuta appear, always with the same formula «Volpintesta, Michele — Tenuta, Teresa»: PIETRO GAETANO (1767, record 13), VINCENZO MERCURIO (1770, record 48) and GREGORIO GIOACCHINO (1773, record 41). The middle one could be our Vincen
