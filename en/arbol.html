 en que ella enviudó. Contó lo que DURÓ el matrimonio, no lo transcurrido hasta 1895.\n\nY HAY UN DETALLE ONOMÁSTICO QUE APOYA A LOS ABUELOS: el primer hijo varón se llamó BARTOLOMEO, y el padre de Benedetto sería BARTOLOMEO ALLASIA. La costumbre piamontesa ponía al primer varón el nombre del abuelo paterno. No es prueba, pero es exactamente lo que cabría esperar. Lo mismo con las dos LUCIA, de 1859 y 1866, y la abuela materna LUCIA GAIDO.\n\nLOS DIEZ HIJOS QUE SE LE CONOCEN, sumando el árbol y los dos censos: Lucia (1859-1859), Bartolomeo (1860), Salvatore Fortunato (1861), Domenico Carlo (1863), Domingo (1864), Lucia Margarita (1866-1866), Nicolás (~1872), Juan (1875), Francisco (1878), María Magdalena (1879), MARGARITA (1882) y Madalenia (~1886). Doce de los catorce que ella declaró.\n\nLO QUE SIGUE ES EL RAZONAMIENTO DE ANTES, QUE SE DEJA COMO ESTABA PORQUE ES LA HISTORIA DE CÓMO SE LLEGÓ:\n\nLO ÚNICO QUE DICE UN ACTA es que Margarita Alasia era «hija legítima de Don BENITO ALASIA y de Doña MAGDALENA BERTINI» (Vera, 25-10-1900). Nada más. Ni fechas, ni pueblo de ellos, ni si vivían.\n\nTODO LO DEMÁS —que naciera en 1822, que muriera en 1892, que se casara en Savigliano el 13 de abril de 1857, y con ello los cuatro abuelos— sale de un árbol de FamilySearch, no de un documento. Identificar al «Benito Alasia» del acta argentina con el «Benedetto Alasia» de Savigliano es una INFERENCIA, y estas son sus dos caras:\n\nA FAVOR. Coinciden los DOS apellidos y los DOS nombres de pila a la vez (Benito = Benedetto, Magdalena = Maddalena): eso es mucho más fuerte que un apellido suelto. ALASIA/ALLASIA es piamontés casi en exclusiva —de 101 apariciones en Italia, 89 en Piamonte— y Colonia Emilia, en el departamento San Justo, era zona de colonos piamonteses. Y el árbol ya ha demostrado que trabaja sobre documentos: dijo que Enrichetta Vanni murió en 1923 y el acta de Trassilico lo confirmó.\n\nEN CONTRA. Si la mujer nació en 1839, al nacer Margarita hacia 1881 tendría CUARENTA Y DOS AÑOS y habrían pasado veinticuatro desde la boda: posible, pero justo en el límite. Y BERTINO no es sólo piamontés: de 240 apariciones, 98 son sicilianas y 92 piamontesas. Además, los colonos piamonteses de Santa Fe llegaban en bloque desde los mismos pueblos, así que un mismo par de apellidos puede repetirse en la misma colonia.\n\nVEREDICTO: probable, no probado. Se sostiene mientras no aparezca otro Benito Alasia casado con una Magdalena Bertini en la misma zona.\n\n*** UN PRIMER BARRIDO DEL CENSO DE 1887 PARECIÓ DEBILITARLO, Y ERA UNA FALSA ALARMA MÍA. *** Busqué a la familia con las grafías ALASIA, ALLASIA, ALACIA, BERTINO y BERTINI y no encontré a nadie: ni un Benito de sesenta y cinco años, ni una Magdalena, ni ninguna Margarita. Llegué a anotarlo como tres ausencias preocupantes.\n\n*** ESTABAN TODOS. EL FALLO ERA MÍO: FALTABAN GRAFÍAS. *** En los padrones argentinos el apellido se escribe de oído, y éste tiene SIETE formas distintas en el mismo censo — Alasia, Alazio, Alassia, Alacio, Alasio, Allasia y Olazio. **Benedetto está indexado OLAZIO y sus hijos ALAZIO**, que eran justamente las dos que no había probado. Con ellas apareció la casa entera en Colonia Emilia, con Margarita de cinco años. LA LECCIÓN, y vale para toda búsqueda en padrones: NUNCA DAR UN NEGATIVO SIN HABER PROBADO TODAS LAS VARIANTES FONÉTICAS.\n\nSI SE CASÓ EN SAVIGLIANO EN 1857 Y SU HIJA NACIÓ EN SANTA FE HACIA 1882, LA FAMILIA EMIGRÓ ENTRE ESAS DOS FECHAS. Colonia Emilia y las colonias del departamento San Justo se poblaron sobre todo de piamonteses en los años setenta del siglo XIX: encaja.\n\nDÓNDE ESTÁ CADA COSA, comprobado el 27-8-2026:\n\n1802-1813 · *** AQUÍ ME EQUIVOQUÉ, Y LA CORRECCIÓN IMPORTA. *** Escribí que Savigliano estaba digitalizado en Antenati con Nati, Matrimoni y Morti napoleónicos, y que la misma serie estaba indizada en FamilySearch. **Las dos cosas son falsas.** Venían de un resumen de buscador, no del catálogo. Al leer el catálogo de verdad: el Archivio di Stato di CUNEO tiene 191 municipios y 50.891 registros, y **de Savigliano hay UNO SOLO**. Y la colección 1392991 de FamilySearch cubre los tribunales de Saluzzo y Mondovì, no Savigliano.\n\n*** Y EL 28 DE AGOSTO SE LEYÓ ESE ÚNICO REGISTRO, ENTERO. *** Son los ANEXOS DE MATRIMONIO DE 1808 del distrito de Savigliano: dieciséis páginas, cuatro expedientes de boda, papeles de Lagnasco, Cherasco, Cavallermaggiore, Saluzzo y Casale. **Ni un Alasia ni un Bertino en ninguna.** Negativo firme: Antenati queda cerrado para esta rama.\n\nPERO SACÓ ALGO QUE SÍ SIRVE. Los extractos de 1808 citan libro y página de las parroquias de Savigliano, y nombran dos que no conocíamos: **SAN SALVATORE y SAN PIETRO**, además de la San Giovanni Battista que daba el árbol. Savigliano tenía al menos TRES parroquias, así que las cartas piden ahora que miren las tres.\n\n1814-1865 · EL AGUJERO. En el Reino de Cerdeña no hubo registro civil: entre la caída de Napoleón y la unificación, TODO es parroquial. Y ahí caen justo las tres fechas que importan: el nacimiento de Benedetto (1822), el de su mujer (1839) y la boda de los dos (1857). Hay que pedirlo a la parroquia o al Archivio Diocesano di Torino.\n\n1866 EN ADELANTE · el registro civil del Comune di Savigliano. Pero para entonces la familia ya estaba en Santa Fe.\n\nY HAY UNA CUARTA VÍA, ARGENTINA Y MÁS BARATA: el CENSO NACIONAL DE 1895. Benedetto había muerto (1892), pero su viuda vivía todavía —murió en 1899— y Margarita tenía trece años. El censo de 1895 pregunta AÑO DE LLEGADA al país: una sola hoja de Colonia Emilia daría la fecha de la emigración, la lista entera de los hijos y de qué provincia italiana se declaraban.", "padre": "bartolomeo_allasia", "madre": "lucia_gaido", "conyuge": "maria_maddalena_bertino", "hijos": ["margarita_alasia", "domingo_alasia"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_maddalena_bertino": {"id": "maria_maddalena_bertino", "nombre": "Maria Maddalena Bertino", "legal": "«Doña Magdalena Bertini» en el acta de 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "A Piedmontese woman from Savigliano, mother of Margarita Alasia.", "datos": [["Birth", "1839, según el árbol de FamilySearch"], ["Death", "1899, misma fuente — un año antes de la boda de su hija"], ["Marriage", "13 de abril de 1857, San Giovanni Battista, Savigliano, Cuneo"], ["Spouse", "BENEDETTO ALASIA"], ["Parents", "GIOVANNI DOMENICO BERTINO y CATTERINA BONAVIA, por FamilySearch"], ["*** CATORCE HIJOS ***", "es lo que declara ella misma en el censo nacional de 1895, siendo ya viuda. Del árbol se conocen diez, y sólo ocho aparecen vivos en el censo de 1887: faltan seis"], ["Los tres mayores no llegaron a Argentina", "BARTOLOMEO (1860), SALVATORE FORTUNATO ANTONIO (1861) y DOMENICO CARLO (1863) NO aparecen en el censo de 1887 en ninguna parte de la provincia, bajo ninguna de las siete grafías del apellido. Lo más probable es que murieran de niños en Savigliano, antes de la emigración — pero es una deducción, no un hecho probado"], ["Apellido", "BERTINO en Piamonte, «Bertini» en el acta argentina"]], "mapa": null, "sinacta": "Probada como madre de Margarita por el acta de matrimonio de 1900. Si murió en 1899, su hija se casó de luto reciente, con diecinueve años y sin madre.\n\nSe casó con dieciocho años. Falta comprobarlo todo con actas.\n\n*** 29 DE AGOSTO DE 2026 — SE ESTRECHA EL CERCO SOBRE LAS HIJAS QUE FALTAN. *** De los catorce hijos que ella misma declaró, seis siguen sin nombre, y las hijas casadas son las más difíciles de encontrar porque desaparecen bajo el apellido del marido: el censo no da apellido de soltera. La única pista son los índices de la parroquia de Emilia publicados por Hugo Alloa, que listan nueve apellidos casados con ALLASIA — Baroni, Busatto, Chartier, Dacarro, Giupponi, Palmier, Ronzoni, Rossini y Zanutich.\n\nSe buscaron los nueve en el censo de 1887. Cuatro daban cero, pero ese cero estaba mal hecho: se habían buscado con una sola grafía, cuando el propio apellido de su marido aparece de siete maneras en ese mismo padrón. Repetido con treinta y dos variantes fonéticas, *** dos de los cuatro ceros eran falsos. ***\n\nEl que vale es ZANUTICH, indexado sin la ce hache final: en toda la provincia había *** tres, y los tres solteros *** — ALBERTO de veinte años, JUAN de dieciocho y LUDOVICO de dieciséis, italianos, en San Justo, Colonia Angeloni, entre vecinos friulanos, que es justo de donde es ese apellido. *** Luego la boda Zanutich × Allasia de la parroquia de Emilia es posterior a junio de 1887 y el novio es casi seguro uno de esos tres. *** Eso convierte una pregunta vaga en una petición concreta al Archivo Arquidiocesano, ya añadida a la carta. Si esa Allasia resulta hija suya, es una de las seis que faltan. No está probado: lo probado es que no había ningún otro Zanutich en la provincia y que estos tres estaban solteros.\n\nLos otros tres se cierran: BUSATTO y GIUPPONI no existen en la provincia ni con ocho variantes cada uno, así que esas bodas también son posteriores a 1887 o se celebraron fuera; y la única DACARO es una mujer de treinta años sola en una pensión del casco urbano de Santa Fe, no en la colonia, y se descarta.\n\n*** EL MISMO DÍA, MÁS TARDE — SE PROBÓ UN MÉTODO NUEVO: LOS NOMBRES DE LOS NIETOS. *** En estas familias el orden de los nombres no era libre: el primer hijo varón llevaba el nombre del abuelo paterno y el segundo el del abuelo materno; la primera hija el de la abuela paterna y la segunda el de la abuela materna. Eso significa que una hija suya casada con cualquiera debería tener entre sus hijos un BENITO —por su padre— y una MAGDALENA —por ella—. *** Y esos nombres el censo sí los da, aunque no dé el apellido de soltera. Es la única forma de mirar dentro de una familia sin saber de qué apellido era la madre. ***\n\nSe leyeron los treinta y un niños de los ocho hogares de esos apellidos en Colonia Emilia. *** Ni un solo Benito, Benedetto ni Magdalena. *** El negativo debilita la hipótesis, pero no la mata: la costumbre es fuerte y no es una ley, en el Piamonte se cumple menos que en el sur, y sólo cinco de los ocho hogares tienen dos hijos o más, que es el mínimo para que la prueba signifique algo.\n\n*** LO QUE SÍ ES FIRME ES LA ARITMÉTICA, Y ELIMINA A TRES. *** Ella se casó el 13 de abril de 1857 y su hijo mayor conocido es de 1860, así que ninguna hija suya pudo nacer antes de 1858. Quedan fuera RONZONI PAULA (35 años, o sea nacida hacia 1852, cinco años antes de la boda), BARONI JUANA la de Enrique (32, hacia 1855) y BARONI ANTONIA (30, hacia 1857 — y además sus cuatro hijos nacieron en Italia, o sea que se casó allí hacia 1877, cuando esta familia llevaba años en Argentina). Sobreviven cinco: Inés Chartier, Teresa, Juana, María y Clementina Baroni.\n\n*** Y DE AHÍ SALE UNA PRUEBA QUE SE PUEDE HACER Y QUE PUEDE FALLAR, que es justo lo que faltaba. *** Se reconstruyó el hogar entero de la mejor candidata y son tres personas: Juan Baroni de treinta y dos, Teresa de veinticinco y un solo hijo, JOSÉ, de un año. Por la regla de los nombres ese José lleva el nombre del padre de Juan — y *** el segundo hijo varón debería llevar el del padre de Teresa. *** Si en el censo de 1895 esa pareja tiene un segundo varón llamado BENITO, Teresa Baroni es hija suya y se recupera una de las catorce; si se llama de otra cosa, queda descartada. Es una petición concreta para la sesión de FamilySearch, y hasta ahora esta línea sólo producía candidatas que no se podían ni confirmar ni descartar.\n\n*** Y AL RECUPERAR LOS CAMPOS QUE EL CENSO SÍ PUBLICA, LA LISTA SE ORDENA DE VERDAD. *** Los AÑOS CASADOS dan el año de la boda directamente, que es mucho más decisivo que la edad. Con eso, de las ocho candidatas quedan tres eliminadas sin discusión: RONZONI PAULA se casó en 1872, cuando la hija mayor de Benedetto tenía doce años; BARONI JUANA la de Enrique nació hacia 1855, dos años antes de la boda de Benedetto; y BARONI ANTONIA se casó en 1877 y *** tuvo sus cuatro hijos en Italia ***, cuando esta familia llevaba cinco años en Argentina.\n\nY aparece un patrón que no se veía: *** tres Baroni —Juan, Jesús y Antonio, que por edades y por vivir en libretos seguidos parecen hermanos— se casaron los tres en 1884 ***, y los tres tienen un solo hijo en 1887. Tres hermanos casándose la misma temporada es corriente; con tres hermanas, más todavía. Y a ella le faltan por localizar cuatro de los catorce: cuatro hijas nacidas entre 1864 y 1872 tendrían entre quince y veintitrés años en 1887 y estarían ya casadas y fuera de casa — que es exactamente la franja donde caen Teresa, Juana, María y Clementina. *** Es una coincidencia llamativa y nada más: el censo no da apellidos de soltera y Baroni es apellido corriente. ***\n\n*** Y APLICANDO EL MISMO TEST A TODA LA COLONIA, EN VEZ DE A NUEVE APELLIDOS, SALIÓ ALGO QUE NADIE BUSCABA: SU PROPIA FAMILIA. *** El buscador del censo también encuentra nombres de pila, no sólo apellidos, así que se buscaron BENITO y MAGDALENA en toda la provincia y se filtró Colonia Emilia. El método se validó solo: entre los resultados aparecen «Olazio Benedetto, 65» y «Bertina Madalena, 47», uno al lado del otro — ella y su marido en persona.\n\nY una de las coincidencias era una niña de un año llamada MAGDALENA BERTHA. Al reconstruir su entorno apareció, todo seguido y en el mismo tomo, *** una casa entera de nueve personas con su apellido: *** Juan Bertha de 45 años, Dominga Bertina de 28, CATARINA BERTINA de 57, Gabriel Bertina de 26, Valentín Bertha de 55, y cuatro niños — María de 5, Domingo de 4, Caterina de 3 y Magdalena de 1. El indexador escribe la misma familia «Bertina» y «Bertha» en líneas consecutivas, que es justo por lo que nadie los había visto: nunca se había barrido su apellido con variantes. Hechas las diez, en Colonia Emilia hay exactamente DIEZ: esos nueve y ella.\n\n*** (Corrijo aquí una cifra que di mal el mismo día: escribí que en toda la provincia había 216 Bertino. Son 105. *** El buscador del censo busca en el nombre completo, y BERTA y BERTHA son nombres de pila corrientísimos entre los suizos y alemanes que poblaron Las Colonias: de los 216, ciento once son niñas llamadas Berta, no personas apellidadas así. Los apellidos reales se reparten en Las Colonias 44, Iriondo 23 y La Capital 22.)\n\n*** Hasta hoy su rama era un hueco total en Argentina *** — de ella sólo teníamos el nombre, la boda de 1857 y unos padres sin acta. Y hay tres cosas que encajan: la madre de Magdalena se llamaba CATTERINA y en esa casa hay una Catarina de 57 años; Juan de 45 es de su misma quinta y candidato a hermano; y la niña de un año se llama MAGDALENA, que por la costumbre de los nombres viene de una abuela o de una tía — y ella vivía a unas manzanas.\n\n*** No está probado: el censo no dice en ninguna parte que esa gente sea familia suya, y las colonias se poblaban por cadenas de paisanos del mismo valle, así que dos familias Bertino sin parentesco en el mismo pueblo es perfectamente posible. *** Lo cerraría el matrimonio de Juan Bertino con Dominga, hacia 1880 en la parroquia de Emilia, que nombraría a los padres de él; o el bautismo de la niña Magdalena, hacia 1886, donde es muy probable que los padrinos fueran ella misma o Benedetto. Las dos cosas se han añadido a la carta del Archivo Arquidiocesano.\n\n*** Y EL MISMO DÍA, MÁS TARDE, APARECIÓ LA COINCIDENCIA MÁS CONCRETA DE TODAS. *** Las fichas del censo publican siete campos que hasta hoy se estaban perdiendo por un fallo de mi propio script — parentesco, estado civil, HIJOS TENIDOS, AÑOS CASADOS, dependencia, y si sabían leer y escribir. Recuperados, dicen esto:\n\n      MAGDALENA BERTINO ... 47 años, *** 31 años casada ***, 14 hijos\n      CATARINA BERTINO .... 57 años, *** 31 años casada ***,  3 hijos\n\n*** Dos mujeres del mismo apellido, en el mismo pueblo de cien casas, que declaran exactamente el mismo año de boda: 1856. *** Casar a
