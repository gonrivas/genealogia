ment 2», with ninety-four. It is closed by Domenico Pisani at Rende on 1 January 1908.", "He was twelve in 1919. He stayed in Italy with his parents."], "claves": [["Birth", "21 December 1907, 4:30 a.m., contrada S. Agostino"], ["Registered", "the same day, seven hours later"], ["Witnesses", "a carpenter of 61 and a shoemaker of 77"], ["In 1919", "12 years old; he stayed"]]}, "maria": {"id": "maria", "nombre": "Maria Salerno", "legal": "", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["salerno"], "resumen": "The youngest of the nine documented children. Born in contrada S. Agostino on the night of 23 September 1909; she was 10 in 1919.", "datos": [["Birth", "23 September 1909, 11:35 p.m., Rende — record 206"], ["Place", "contrada S. Agostino"], ["Parents", "Salerno Francesco and Chiappetta Filomena"]], "vida": "b.1909", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "francesco", "madre": "filomena", "conyuge": null, "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": ["giuseppe", "antonio", "umberto", "settimo", "saverio", "angelina", "giovanni_hijo", "arturo"], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "24 September 1909, 10:40 h", "lugar": "Rende", "ref": "record 206", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 101 «Nati» 1909"], ["Register", "an_ua35988732 · hash 5G6v3x6"], ["Page", "77 of 109"], ["Handwritten year", "«millenovecento nove» — agrees with the catalogue"], ["Registrar", "Costabile Federico (signature at the foot; the «Avanti di me» line was left blank)"]], "literal": "è comparso Salerno Francesco, di anni trentotto, contadino, domiciliato in Rende…\n…alle ore ventitre e minuti trentacinque, del dì ventitre del corrente mese, nella\ncasa posta in Contrada S. Agostino, da Chiappetta Filomena, contadina, sua legittima\nmoglie seco lui convivente… il nome di Maria", "traduccion": "In the year nineteen hundred and nine, on the twenty-fourth day of September, at twenty to eleven in the morning, at the town hall. Before [the line for the registrar's name was left BLANK], Registrar of the Civil Status of the comune of Rende, there appeared SALERNO FRANCESCO, aged thirty-eight, farmhand, resident at Rende.\n\nHe declares that at twenty-three thirty-five on the twenty-third of the current month, in the house situated in CONTRADA S. AGOSTINO, of CHIAPPETTA FILOMENA, countrywoman, his LAWFUL wife, living with him, there was born a child of the female sex whom he presents to me, and to whom he gives the name MARIA.\n\nWitnesses: Ruffolo Serafino, aged fifty-three, farmhand; and Rende Tommaso, aged thirty-five, farmhand, both resident in this comune.\n\nThe record having been read to all present, they did not sign it with me, being illiterate. Signed FEDERICO COSTABILE.", "notas": ["The clerk left the line «Avanti di me» UNFILLED: the record does not say who authorised it. The signature at the foot resolves it, Federico Costabile, who in the neighbouring records of the same opening appears as «assessore delegato per gli atti di Stato Civile».", "Here the father's declared age is EXACT for once: thirty-eight years, and he had been born in December 1870. In 1902 and 1904 he had fallen short or long by a year.", "In the SAME opening, record 207 has as a witness a «Salerno Francesco, di anni trentotto, contadino»: same age and same trade. It is him, staying on as a witness for his neighbour after registering his daughter. And that record 207 is declared by a midwife because the husband «è in America»: the village was already emigrating."], "imgs": [{"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20Maria%20Salerno%20-%20Rende%20acta%20206.jpg", "t": "Maria Salerno - Rende acta 206"}], "zooms": [{"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20acta%20206%20completa.jpg", "t": "Acta 206 completa"}, {"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20margen%20sin%20anotaciones.jpg", "t": "Margen sin anotaciones"}, {"u": "../actas/1909%20-%20Maria%20Salerno/1909-09-23%20N%20zoom%20-%20testigos%20y%20firma%20de%20Federico%20Costabile.jpg", "t": "Testigos y firma de Federico Costabile"}]}], "nActas": 1, "nImgs": 4, "titulo": "The clerk forgot his own name", "parrafos": ["She was born on the night of 23 September 1909, at twenty-five to twelve, in the contrada S. Agostino. She is the youngest of the nine documented children. Her father registered her the next morning and this time declared his age correctly: thirty-eight.", "The record has an odd gap. The line «Avanti di me» — before me — was left blank: the clerk never got round to writing his own name. The man signing at the foot is Federico Costabile, who on neighbouring records appears as assessor delegated for civil registration. The witnesses were two farmhands, Ruffolo Serafino, fifty-three, and Rende Tommaso, thirty-five.", "On the same opening of the register, the next record carries as a witness a «Salerno Francesco, di anni trentotto, contadino»: same age, same trade. It is him, staying on as a witness for the neighbour after registering his daughter. That record was reported by a midwife because the husband «è in America». The village was already emigrating.", "She was ten in 1919 and stayed with her parents. The family remembers a «Marietta» who ended up in Canada; Marietta is the ordinary diminutive of Maria, so it could be her or her aunt Maria Chiappetta, born in 1901. No document settles it."], "claves": [["Birth", "23 September 1909, 11:35 p.m., contrada S. Agostino"], ["Oddity of the record", "the registrar's line was left blank"], ["Father's declared age", "38 — exact, for once"], ["In 1919", "10 years old; she stayed"]]}, "salvatore": {"id": "salvatore", "nombre": "Salvatore Salerno", "legal": "", "rol": "sobrino", "rolNombre": "Nephew/niece", "gen": 8, "ramas": ["salerno"], "resumen": "A first cousin, not a brother. Son of Giovanni and Vincenzina. He was thirteen months old when his father died.", "datos": [["Birth", "12 January 1899, 3 a.m., Rende — record 13"], ["Place", "contrada Mari (uncertain reading)"], ["Parents", "Salerno Giovanni and Morelli Vincenzina"], ["Marriage", "October 1921, Rende, no. 67, to Misuraca Caterina Santa"], ["Orphaned", "of his father, at thirteen months"]], "vida": "b.1899", "lug": "Rende", "mapa": null, "sinacta": "", "padre": "giovanni", "madre": "vincenzina", "conyuge": "caterina_misurelli", "unionLibre": false, "otrasParejas": [], "hijos": [], "hermanos": [], "actas": [{"titulo": "Birth record", "tipo": "N", "tipoNombre": "Birth", "fecha": "13 January 1899, 9:20 h", "lugar": "Rende", "ref": "record 13", "fuente": [["Collection", "Stato civile italiano > Rende > Registro 91 «Nati» 1899"], ["Register", "an_ua35983869 · hash LyxaADX"], ["Page", "9 of 115"], ["Registrar", "Pisani Domenico, senior assessor"]], "literal": "è comparso Salerno Giovanni, di anni ventiquattro, contadino, domiciliato in Rende…\n…da Morelli Vincenzina sua moglie contadina seco lui convivente…", "traduccion": "In the year eighteen hundred and ninety-nine, on the thirteenth day of January, at twenty past nine in the morning, at the town hall, before Pisani Domenico, senior assessor for the mayor being indisposed, there appeared SALERNO GIOVANNI, aged twenty-four, farmhand, resident at Rende.\n\nHe declares that of MORELLI VINCENZINA, countrywoman, his wife living with him, there was born on the twelfth of the current month, at three in the morning, in the house situated in contrada Mari, a child of the male sex, upon whom he bestows the name SALVATORE.\n\nWitnesses: Cannata Giovanni, aged fifty-one, farmer; and Cannataro Giuseppe, aged thirty, farmhand.", "notas": ["THIS SALVATORE IS A NEPHEW, NOT A BROTHER. The record was ordered in the belief that he was a son of Francesco and Filomena, and the original is emphatic: the declarant is Salerno GIOVANNI and the mother MORELLI VINCENZINA.", "It fits perfectly: his parents' wedding in October 1897, first child in January 1899. And it yields a hard fact: when Giovanni died on 23 February 1900, he left a son of thirteen months.", "Marginal annotation in a twentieth-century hand: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa».", "If the family was expecting a brother named Salvatore, he must be looked for in another year."], "imgs": [{"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20Salvatore%20Salerno%20-%20Rende%20acta%2013.jpg", "t": "Salvatore Salerno - Rende acta 13"}], "zooms": [{"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20acta%2013%20completa.jpg", "t": "Acta 13 completa"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20anotacion%20marginal%20matrimonio%201921.jpg", "t": "Anotacion marginal matrimonio 1921"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20contrada%20y%20nombre%20de%20la%20madre.jpg", "t": "Contrada y nombre de la madre"}, {"u": "../actas/1899%20-%20Salvatore%20Salerno%20%28hijo%20de%20Giovanni%29/1899-01-12%20N%20zoom%20-%20padre%20Giovanni%20Salerno%20y%20madre%20Morelli%20Vincenzina.jpg", "t": "Padre Giovanni Salerno y madre Morelli Vincenzina"}]}], "nActas": 1, "nImgs": 5, "titulo": "He was taken for a brother", "parrafos": ["He was born on 12 January 1899 at three in the morning, in a contrada written in a hand so fine that it reads «Mari», «Nari» or «Maio» and is none of the ones known to the family. His father registered him the following day at twenty past nine, before Pisani Domenico. The witnesses were a fifty-one-year-old farmer and a thirty-year-old farmhand.", "His record was ordered on the assumption that he was another child of Francesco and Filomena. He is not, and the original is emphatic: the informant is SALERNO GIOVANNI and the mother MORELLI VINCENZINA. Salvatore is the son of Francesco's younger brother — that is, Settimo's first cousin and not his brother. It fits without forcing anything: his parents married in October 1897 and he was born in January 1899.", "The find also produced the hardest fact yet about his father. When Giovanni died, on 23 February 1900, Salvatore was thirteen months old. His mother was left a widow with him. And one more age that does not add up: Giovanni declared twenty-four years when registering him, when he had turned twenty-six.", "In the margin of the record a twentieth-century hand noted: «Addì 18.10.1921 in Rende n° 67 sposò Misuraca Caterina Santa». He married at Rende in October 1921, aged twenty-two."], "claves": [["Birth", "12 January 1899, 3 a.m., Rende, record 13"], ["Relationship", "first cousin of the nine, not a brother"], ["Orphaned of his father", "at thirteen months"], ["Marginal note", "married at Rende in October 1921 to Misuraca Caterina Santa"]]}, "domenico_faienza": {"id": "domenico_faienza", "nombre": "Domenico Faienza", "legal": "Domingo Faienza in Argentina", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 8, "ramas": ["faienza"], "resumen": "Son of Nicola Faienza and Angiolina Pizzi. He emigrated to Argentina, where he died at Santa Fe on 13 December 1985, aged eighty-five. HIS ARGENTINE DEATH CERTIFICATE TURNED UP IN AUGUST 2026 AND CHANGED EVERYTHING: it says he was BORN AT PAGLIETA (Italy) on 1 March 1900, and it confirms his parents. The Italian record has still not been found, but now it is known exactly where and when to look — and why it never surfaced: it had been sought in 1899, and he was born in 1900.", "datos": [["Birth", "1 March 1900 at PAGLIETA (Chieti), according to his Argentine death certificate of 1985. The same date as the cemetery register already gave: two independent Argentine sources agree"], ["Parents", "NICOLA FAIENZA, contadino of Atessa, son of Giuseppe Faienza and Maria Staniscia; and ANGIOLINA (Angela) PIZZI. Married at Atessa on 29 December 1892, record 101"], ["Death", "13 December 1985, aged 85, buried at Santa Fe (La Capital), Argentina"], ["Where he was NOT born (1)", "PAGLIETA in 1899. The complete annual index read: 161 births, not one Faienza under any letter"], ["Where he was NOT born (2)", "ATESSA in 1899. The complete annual index read: 396 births and four Faienza — Antonio, Carmine, Luzio and Rosina —, no Domenico. And all four have been opened: they belong to three other Faienza families of the village, not to ours"], ["Which village the FAIENZA come from", "ATESSA: the marriage record of 1892 declares the father born and resident there, and the paternal grandfather too"], ["Where HE was born", "PAGLIETA — and that is not the same thing. The parents married at Atessa in December 1892 and moved to Paglieta, thirteen kilometres away, where the son was born eight years later"], ["Where it has to be looked for", "PAGLIETA, BIRTHS OF 1900, a male child born on 1 March. But NOT over the internet: Antenati has Paglieta only as far as 1899. It has to be asked of the TOWN COUNCIL OF PAGLIETA, which is the body that keeps the books the Archivio di Stato has not yet received. Letter written and ready, with the contact details checked on the comune's official website"], ["Death", "13 December 1985 at 7:30 p.m., at Santa Fe. Retired, and still of Italian nationality after a whole life in Argentina. He lived at calle JUAN PABLO LÓPEZ 2643"], ["Argentine document", "Cédula de Identidad 177.029"]], "vida": "1900–1985", "lug": "PAGLIETA", "mapa": null, "sinacta": "", "padre": "nicola_faienza", "madre": "angela_pizzi", "conyuge": "brigida_nelli", "unionLibre": false, "otrasParejas": [], "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "13 December 1985", "lugar": "Santa Fe, department of La Capital, Argentina", "ref": "volume 4-C, record 1155", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["How it was obtained", "digital application at santafe.gob.ar/rcdigital, requested by Gonzalo on 25 August 2026"], ["Digital signature", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verification", "application 26-00-278-953 · hash EABE-3072-19D1-FC11-B4CB-603E-7871-EC78-4C2D-5E8C, checkable at santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "At SANTA FE, department of La Capital, province of Santa Fe, Argentine Republic, on 19 December 1985. I, Public Officer of this Registry, record the DEATH of DOMINGO FAIENZA. Male, ITALIAN nationality. Status: married. Occupation: RETIRED. Identity document: Cédula 177,029. Address: J. P. López 2643.\n\nSON OF NICOLÁS FAIENZA AND ÁNGELA PIZZI.\n\nBORN AT PAGLIETA (ITALY) ON 1 MARCH 1900.\n\nOccurring at Santa Fe on 13 December 1985 at 19:30. Cause of death: illness. Medical certificate of Doctor César Carli, 19 December 1985. Informant: SIXTO GÓMEZ, L.E. 5,261,009, address Berutti 5663, acting by virtue of being a person authorised for that purpose. — Arsenia del R. Ibáñez de Quintana, Deputy Head of the Deaths Subsection.", "notas": ["IT PUTS PAGLIETA BACK ON THE MAP, AND CORRECTS SOMETHING I HAD TAKEN AS CLOSED. After reading the Atessa marriage record of 1892 I wrote that the Paglieta lead was «definitively» knocked down. That was wrong. That record proved that NICOLA, the father, had been born and was living in Atessa in 1892 — it said nothing about where his son would be born eight years later. This certificate says it in plain lettering: PAGLIETA. The two things are compatible.", "AND IT EXPLAINS WHY I COULD NOT FIND HIM: I SEARCHED IN THE WRONG YEAR. The birth indexes of Paglieta 1899 and of Atessa 1899 were swept in full without finding any Domenico Faienza. Naturally: he was born on 1 March **1900**, a year that has never been looked at. Those negatives still hold good, but they were for the wrong year.", "IT CONFIRMS HIS PARENTS BY THE ARGENTINE ROUTE. «Son of NICOLÁS FAIENZA and of ÁNGELA PIZZI» is exactly the couple of the Atessa marriage record of 1892. Two archives in two different countries, unconnected with one another, give the same two names.", "HE DIED AN ITALIAN. After more than sixty years in Argentina the record still registers him as of Italian nationality: he never naturalised.", "THE DECLARANT WAS NOT FAMILY. Sixto Gómez «acts by virtue of being a person authorised for that purpose»: he is an agent, almost certainly from the undertaker's. Berutti 5663 is HIS address, not the Faienzas'."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20Partida%20de%20defuncion%20de%20Domingo%20Faienza%20-%20Santa%20Fe%20acta%201155.jpg", "t": "Partida de defuncion de Domingo Faienza - Santa Fe acta 1155"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1985-12-13%20D%20zoom%20-%20nacido%20en%20PAGLIETA%2C%20hijo%20de%20Nicolas%20Faienza%20y%20Angela%20Pizzi.jpg", "t": "Nacido en PAGLIETA, hijo de Nicolas Faienza y Angela Pizzi"}]}, {"titulo": "Negative search in the annual index of births", "tipo": "I", "tipoNombre": "Index · negative search", "fecha": "year 1899 complete", "lugar": "Paglieta (Chieti)", "ref": "index of the whole register", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile italiano > Paglieta > 1899, atti di nascita"], ["Register", "container hash: 5xOMBDz — 120 pages"], ["Index", "title page on page 116; entries on pages 117, 118 and 119; page 120 is blank"], ["Title page", "«ANNO 1899 · Comune di PAGLIETA · Provincia di CHIETI · INDICE ANNUALE del REGISTRO degli Atti di NASCITA»"], ["Scope", "the index covers the whole year, including the records of part II, which are marked «2ª P.». The highest record number appearing is 161"]], "literal": "LA LETRA F ENTERA, tal como está en la página 117:\n  Florio (di) Antonio ............ 1\n  Fazia (fu) Domenico ............ 8\n  Florio (di) Sebastiano ......... 15\n  Falcis (di) Carmela ............ 42\n  Florio (di) Antonio ............ 65\n  Formica Pietro Nicola .......... 68\n  Florio (di) Antonia ............ 109\n  Felice (di) Etterina Maria Nicola  124\n  Fabrizio Verina ................ 160\nY después, directamente, la G. Nueve apellidos con F y ninguno es FAIENZA.", "traduccion": "THERE IS NO RECORD TO TRANSCRIBE: this is a negative result, and it is filed as such.\n\nThe complete alphabetical index of the Paglieta birth register for 1899 was downloaded — the cover and all three pages of entries — and read letter by letter. The F occupies nine lines, all legible, and none of them says Faienza. Nor does the surname appear under any other letter of the index, or spelled any other way (Faenza, Fajenza).\n\nThe index leaves no gap: it is the register's official annual index, it covers records numbered 1 to 161 and also includes those of part II, marked «2ª P.». So at Paglieta, in 1899, no Faienza was born.", "notas": ["FIRM NEGATIVE, AND IT IS HALF THE COMMISSION. In the Paglieta birth index of 1899 THERE IS NO FAIENZA AT ALL. Neither with the correct parents nor with any others: there is none.", "THE VILLAGE WAS NEVER PROVEN. «Paglieta» came from the same family block, without a single citation, that had already been wrong twice over, both times verified. What turns a finding into proof is not the village: it is the parents. And the parents have appeared, but somewhere else.", "WHERE HE MUST NOW BE LOOKED FOR: IN ATESSA. The marginal note on his mother's birth record says that Angiolina Pizzi married Nicola Faienza in 1892, record 101, IN THE REGISTER OF ATESSA. The maternal family has been in Atessa since 1730. The son's birth must be requested from the Nati of Atessa for 1899 and 1900.", "AND THERE IS A REASON TO LOOK AT 1900 BEFORE 1899. The Argentine cemetery register gives Domingo Faienza as born on 1 MARCH 1900 and dead on 13 December 1985 aged 85, and the two figures tally with each other. If that date is good, his record is not in 1899 in any village. Paglieta 1900 does not exist in Antenati — zero records, verified — but ATESSA 1900 ought to exist: the Atessa series is one of the long ones.", "A CURIOUS DETAIL FROM THE PAGLIETA INDEX: there is indeed a «PIZZI Bambino», record 142. A newborn with the surname Pizzi, with no forename in the index. He is not our Domenico — the surname is the mother's, not the father's — but it puts on record that the surname Pizzi also circulates in Paglieta.", "COST OF THIS NEGATIVE: five images. That is what it costs to read a whole year at one go when the register carries an index at the end."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20A-G%20-%20Paglieta.jpg", "t": "Indice alfabetico letras A-G - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20G-P%20-%20Paglieta.jpg", "t": "Indice alfabetico letras G-P - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letras%20P-V%20-%20Paglieta.jpg", "t": "Indice alfabetico letras P-V - Paglieta"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Portada%20del%20indice%20anual%20de%20nacimientos%20-%20Paglieta.jpg", "t": "Portada del indice anual de nacimientos - Paglieta"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20completa%2C%20sin%20ningun%20Faienza.jpg", "t": "La letra F del indice completa, sin ningun Faienza"}]}, {"titulo": "Negative search in the annual index of births", "tipo": "I", "tipoNombre": "Index · negative search", "fecha": "year 1899 complete", "lugar": "Atessa (Chieti)", "ref": "index of the whole register", "fuente": [["Archive", "Archivio di Stato di Chieti"], ["Collection", "Stato civile italiano > Atessa > 1899, atti di nascita"], ["Register", "container hash: LyOB1Ve — 302 pages"], ["Index", "alphabetical, at the end of the volume. The whole letter F is on page 297 of 302; pages 296 (C and D), 299 (M to P) and 302, the last, which carries only the column of numbers, were looked at as well"], ["Scope", "the complete year, including the records of PART II, which are marked «p. II» within the same list. Highest record number indexed: 396"], ["Records opened", "the four of the surname Faienza: 382 and 383 (page 259), 215 (page 145) and 139 (page 95)"], ["How it was worked through", "part I runs as far as page ~270 at the rate of 1.42 records per image; probes on pages 200 (record 297), 240 (record 354) and 279 (already part II) fixed the straight line. Twelve images to close a year of 396 births"]], "literal": "LA LETRA F ENTERA DEL ÍNDICE DE ATESSA 1899, tal como está en la página 297:\n  FAIENZA Antonio .............. 382\n  FAIENZA Carmine .............. 383\n  FAIENZA Luzio ................ 215\n  FAIENZA Rosina ............... 139\n  Falcone · Falcucci · Fanelli · Fantauzzi · Fantini · Fania · Favorito ·\n  Fiori · Fidelibus · Filamarino · Fiorito · Flocco · De Francesco · Fritti\ny a continuación, directamente, la G.\n\nY LO QUE DICEN LAS CUATRO ACTAS:\n  Actas 382 y 383 — gemelos, Antonio y Carmine, nacidos el 18 de diciembre de\n  1899 a las 22:15 y 22:30 en la contrada Piazzano. «È comparso MICHELE FAIENZA\n  FU CARMINE, di anni quarantatré, contadino, domiciliato in Atessa… da CELESTE\n  SERAFINI sua moglie, contadina, seco lui convivente».\n  Acta 215 — Luzio, varón, nacido el 4 de junio de 1899 a la 1:15 en la contrada\n  Carafella. «È comparso ANTONIO FAIENZA DI PASQUALE, di anni quarantaquattro,\n  contadino… da ANTONIA GIAGNORIO sua moglie». Al margen, «morto nel 1899».\n  Acta 139 — Rosina, niña, nacida el 4 de abril de 1899 a las 20:15 en la misma\n  contrada Carafella. «È comparso VINCENZO FAIENZA DI PASQUALE, di anni\n  trentasette, contadino… da BAMBINA ROSSI sua moglie».", "traduccion": "THERE IS NO RECORD TO TRANSCRIBE: this is another negative result, and it is filed as such. But it is a negative of a different kind from Paglieta's, and a good deal stronger.\n\nAt Paglieta the surname Faienza did not appear under any letter of the index and that was enough. At Atessa it appears four times, so it was not enough: all four records had to be opened and the parents checked. None of the four children is the child of Nicola Faienza and Angiolina Pizzi. They belong to three other Faienza families of the same village: that of MICHELE FAIENZA FU CARMINE and Celeste Serafini, in the contrada Piazzano, who had twins in December; and those of ANTONIO and VINCENZO FAIENZA DI PASQUALE — brothers, almost certainly, both of the contrada Carafella — each with one child that year.\n\nOur Nicola is «figlio di GIUSEPPE». Not Michele fu Carmine, nor Antonio di Pasquale, nor Vincenzo di Pasquale.\n\nSo at Atessa, in 1899, no child of Nicola Faienza and Angiolina Pizzi was born, and certainly no Domenico Faienza of anybody.", "notas": ["SECOND FIRM NEGATIVE, AND SOUNDER THAN THE FIRST. In Atessa 1899 there is no Domenico Faienza — between «Carmine» and «Luzio» is where he would go, and he is not there — and, moreover, none of the four Faienzas of that year belongs to our couple. It is not that the surname does not appear: it is that it appears and is ruled out one by one.", "WHAT THIS ROUND HAS SETTLED IS THE VILLAGE. The marriage record of 1892 declares Nicola Faienza «nato in Atessa, residente in Atessa», and his father Giuseppe resident in Atessa. The family is from Atessa and not from Paglieta. What remains to be got right is not the place, it is the year.", "AND THE YEAR THAT REMAINS IS 1900. With 1899 closed in both villages, the date from the Argentine cemetery register — 1 March 1900, consistent with the 85 years he is declared to be at his death in December 1985 — again becomes the good hypothesis. The search for «Atessa 1900» in Antenati returned zero records at the time; it is worth repeating, because the Atessa holding is one of the long ones and catalogue additions are frequent, and if it is still not there, to request the certificate from the Comune di Atessa.", "A USEFUL MEASURE LEFT BY THIS SWEEP: the surname FAIENZA is common in Atessa. Three different families with children in a single year. That means that matching on the surname proves nothing, and that in the next round one must always look at the father's name: «di Giuseppe». It is exactly the same mistake that was made with Paglieta, only the other way round.", "A DETAIL FROM THE SAME REGISTER: record 214, immediately above Faienza Luzio, is that of an Iacobitti Antonio with a marginal annotation from the consulate giving him as deceased in Carapachay (Buenos Aires) on 6 June 1957. The emigration from Atessa to the River Plate is written in the margins of these very books.", "COST OF THIS NEGATIVE: twelve images for a year of 396 births. Four of the index and of the end of the volume, three of sampling and five of records."], "imgs": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Antonio%20y%20Carmine%20gemelos%20-%20Atessa%20actas%20382%20y%20383.jpg", "t": "Faienza Antonio y Carmine gemelos - Atessa actas 382 y 383"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Luzio%20-%20Atessa%20acta%20215.jpg", "t": "Faienza Luzio - Atessa acta 215"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Faienza%20Rosina%20-%20Atessa%20acta%20139.jpg", "t": "Faienza Rosina - Atessa acta 139"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20Indice%20alfabetico%20letra%20F%20-%20Atessa.jpg", "t": "Indice alfabetico letra F - Atessa"}], "zooms": [{"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20139%2C%20Rosina%20es%20hija%20de%20Vincenzo%20Faienza%20di%20Pasquale%20y%20Bambina%20Rossi.jpg", "t": "Acta 139, Rosina es hija de Vincenzo Faienza di Pasquale y Bambina Rossi"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20215%2C%20Luzio%20es%20hijo%20de%20Antonio%20Faienza%20di%20Pasquale%20y%20Antonia%20Giagnorio.jpg", "t": "Acta 215, Luzio es hijo de Antonio Faienza di Pasquale y Antonia Giagnorio"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20acta%20382%2C%20gemelos%20hijos%20de%20Michele%20Faienza%20fu%20Carmine%20y%20Celeste%20Serafini.jpg", "t": "Acta 382, gemelos hijos de Michele Faienza fu Carmine y Celeste Serafini"}, {"u": "../actas/1899%20-%20Domenico%20Faienza/1899%20N%20zoom%20-%20la%20letra%20F%20del%20indice%20de%20Atessa%2C%20cuatro%20Faienza%20y%20ningun%20Domenico.jpg", "t": "La letra F del indice de Atessa, cuatro Faienza y ningun Domenico"}]}], "nActas": 3, "nImgs": 15, "titulo": "", "parrafos": [], "claves": []}, "cristina_rizzo": {"id": "cristina_rizzo", "nombre": "Cristina Rizzo", "legal": "«Cristina Rizzo de Salerno» on her certificate", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["salerno"], "resumen": "Argentine, born in the city of Santa Fe. Until 29 August 2026 she was a loose thread in the whole tree: no parents were known for her. Two civil registry certificates gave them both at once.", "datos": [["Birth", "in the CITY OF SANTA FE. The year cannot be fixed: her marriage record of 1923 gives her 23 years (b. c. 1900) and her death certificate gives her 74 (b. c. 1893). Seven years apart"], ["Parents", "SALVADOR RIZZO and ÁNGELA COSTABILE, both named alike in the marriage record of 1923 and in the death certificate of 1967"], ["Marriage", "26 March 1923, Santa Fe, record 140, to SETTIMO SALERNO, a baker of twenty-three newly arrived from Rende"], ["Trade", "«sus labores»"], ["Identity document", "Libreta Cívica 1.529.760"], ["Death", "24 November 1967, at HALF PAST THREE IN THE MORNING, at Santa Fe. Registered on the 27th"], ["Burial", "27 November 1967, Municipal Cemetery of Santa Fe"]], "vida": "†1967", "lug": "", "mapa": null, "sinacta": "", "padre": "salvador_rizzo", "madre": "angela_costabile", "conyuge": "settimo", "unionLibre": false, "otrasParejas": [], "hijos": ["carlos_salerno", "nilda_salerno"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "24 November 1967, at 3:30 in the morning", "lugar": "Santa Fe, department of La Capital, Argentina", "ref": "record 854", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["How it was obtained", "digital application at santafe.gob.ar/rcdigital, requested by Gonzalo on 25 August 2026"], ["Digital signature", "César Gabriel Garrone, Archivo Central Santa Fe, 28-8-2026"], ["Verification", "application 26-00-284-315 · hash F90C-1521-80AD-0D07-1EEA-7DA4-799E-1CA6-5475-2025"]], "literal": "", "traduccion": "Record number eight hundred and fifty-four. At SANTA FE, department of La Capital, on the twenty-seventh day of November nineteen hundred and sixty-seven, at eight fifteen. Before me, SANTIAGO SATALÉ, head of the Registry of Civil Status, there appeared don ALEJO RIESTRA, merchant, resident at Las Heras 3299,\n\ndeclaring that at THREE THIRTY ON THE TWENTY-FOURTH of the present month, in this Capital, there died doña CRISTINA RIZZO DE SALERNO, of Argentine nationality, BORN IN THIS CITY, aged seventy-four, married, occupation housewife, Civic Registration number 1,529,760, as a consequence of illness, as stated in the medical certificate of Doctor OSCAR BENAZZOLA.\n\nTHAT SHE WAS MARRIED TO SETTINO SALERNO.\n\nTHAT THE DECEASED WAS THE DAUGHTER OF DON SALVADOR RIZZO AND DOÑA ÁNGELA COSTABILE.\n\nThis record having been read, it was signed with me by the informant and by don AURENCIO VILLAFAÑE, resident at Villa Yapeyú, competent witnesses.", "notas": ["IT GIVES HER PARENTS, AND UNTIL TODAY THE RIZZOS WERE A SINGLE LOOSE PERSON IN THE WHOLE TREE. SALVADOR RIZZO and ÁNGELA COSTABILE. And it is not an isolated fact: the marriage record of 1923, forty-four years earlier and with a different declarant, gives exactly the same two names.", "COSTABILE IS A SOUTHERN ITALIAN SURNAME, and it fits with the Salernos having come from RENDE, in Cosenza: the Calabrian colony of Santa Fe married among itself.", "SHE DIED AT HALF PAST THREE IN THE MORNING. The registration was made three days later, and it agrees with the date on the municipal cemetery card.", "HER YEAR OF BIRTH CANNOT BE FIXED WITH WHAT THERE IS. Here she declares 74 years (born about 1893); on her marriage record of 1923 she declared 23 (born about 1900). Seven years' difference. Her birth certificate would be needed, which according to this record is from the city of Santa Fe.", "NEITHER THE DECLARANT NOR THE WITNESS WAS FAMILY — a shopkeeper from Las Heras and a neighbour from Villa Yapeyú. The same pattern as in the Faienza certificates: agents, probably from the undertaker's. Their addresses are NOT the family's."], "imgs": [{"u": "../actas/1967%20-%20Cristina%20Rizzo/1967-11-24%20D%20Partida%20de%20defuncion%20de%20Cristina%20Rizzo%20-%20Santa%20Fe%20acta%20854.jpg", "t": "Partida de defuncion de Cristina Rizzo - Santa Fe acta 854"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "salvador_rizzo": {"id": "salvador_rizzo", "nombre": "Salvador Rizzo", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["salerno"], "resumen": "Father of Cristina Rizzo. He entered the tree on 29 August 2026, through two Argentine certificates forty-four years apart that name him identically.", "datos": [["Who this was", "father of CRISTINA RIZZO, born in the city of Santa Fe between 1893 and 1900"], ["Wife", "ÁNGELA COSTABILE, Italian"], ["Where he was", "at Santa Fe: his daughter was born and married there"], ["Sources", "his daughter's marriage record (1923) and his daughter's death certificate (1967)"]], "vida": "", "lug": "", "mapa": null, "sinacta": "IT IS NOT KNOWN WHETHER HE WAS ITALIAN OR ALREADY ARGENTINE — his daughter's marriage record leaves the nationality gap all but illegible, and the death record does not say. CAN ONE WORK BACK FROM HIM IN THE ITALIAN ARCHIVES? YES, BUT ONE THING IS MISSING. On 29 August 2026 it was verified that RENDE is on the Antenati Portal **from 1809 to 1910, one hundred and one consecutive years**, with births, marriages and deaths. That is: if he and Ángela married in Rende around 1870-1890, the record is online and free to read, and it would name Cristina's four grandparents. THE PROBLEM IS THAT WE DO NOT KNOW WHICH TOWN THEY WERE FROM. Antenati is organised by comune: without a town no search is possible, because there is no global index of names. There are indications in favour of Rende —the surname RIZZO appears there in 1858, and his daughter married a Salerno of Rende— but they are indications, not proof.\n\nWHAT WOULD SETTLE IT AT A STROKE: the birth certificate of his daughter CRISTINA, born in Santa Fe city between 1893 and 1900. An Argentine record of that period names the parents with age, nationality and very often the town. It is on the list of requests to the Civil Registry. 29 AUGUST 2026 — SIXTEEN YEARS OF RENDE MARRIAGES HAVE BEEN READ AND THE RESULT GOES AGAINST HIM. The transcriptions of the Rende marriages from 1850 to 1865 were swept, year by year, looking for RIZZO grooms — because if he was born c. 1859, his parents married precisely within that stretch. In sixteen years there appear only THREE Rizzo grooms: Michele Maria and Pietro, brothers, both married in 1850 and sons of GABRIELE RIZZO and MARIA ESPOSITO FAVA; and Vincenzo, married in 1862, son of Michele Rizzo and Carmina Spina. And yet the surname is everywhere as the name of a MOTHER or of a BRIDE: Angela Maria Rizzo appears as mother at four different weddings, and there are besides Francesca, Eleonora, Arcangela and Beatrice Rizzo. It is exactly the same pattern that came out of the sweep of 1880-1885, where there were five Rizzo brides and not a single groom. That is: in Rende there are Rizzo women everywhere and very few Rizzo men who marry. For a man called Salvador Rizzo born there c. 1859 that leaves very few possible fathers. It does not rule him out, but it makes him considerably less probable than had been supposed.\n\nIf Rende were the town even so, the only candidates for his father are the two brothers of 1850, and the check would be cheap: to look in the Rende births of 1856-1866 for a SALVATORE RIZZO son of Michele Maria or of Pietro. None of this enters the tree: they are another person's transcriptions, and there is not a single fact linking those Rizzo to him. AND THE SAME DAY IT WAS SEEN THAT THE SEARCH DID NOT HAVE TO BE CONFINED TO RENDE. The Calabrian transcriptions we had on disc were believed to stop in 1865, but that holds only for Rende: eight towns of the Cosenza ring run up to 1910 — Carolei, Cerisano, Falconara, Guardia Piemontese, the two Marano, Mendicino and San Vincenzo la Costa. That is to say that the years 1870-1893, which are the ones that matter for his wedding, can be swept in full and free of charge in eight neighbouring towns, and not only in the one that had been assumed.\n\nThe first, SAN VINCENZO LA COSTA, has already been swept for six years —1880, 1881, 1882, 1885, 1886 and 1887—: not a single Rizzo and not a single Costabile, in a town whose repertoire of surnames is quite different from that of Rende.\n\nAnd the second, MARANO MARCHESATO, has been swept in full: nineteen consecutive years, from 1875 to 1893, and there too there is not a single Rizzo groom nor a single Costabile. That town was chosen because it is the one that has already yielded family of ours —the Volpintesta, the Palermo, the Luchetta—, so it was the most sensible setting. And out of the two sweeps something is beginning to emerge that is worth more than the result. Each of those towns has a repertoire of surnames very much its own that repeats year after year, and neither Rizzo nor Costabile figures in either of them. In Rende, by contrast, both are well documented: six Costabile households in a single generation and several Rizzo families. They look like surnames of Rende and of the city of Cosenza, not of the ring of towns. If that is confirmed in the six still to be done, the ring is not going to produce the wedding, and only two ways out remain: that it is in Rende between 1870 and 1893, or that the wedding was Argentine. AND BY SAMPLING THREE YEARS OF EACH OF THE SIX REMAINING TOWNS, ONE HAS TURNED UP. In MENDICINO, in 1885, there marries SALVATORE RIZZO, son of GIUSEPPE RIZZO and of ANTONIA FORTUNATA DODARO. He is the first Rizzo groom to appear outside Rende in the whole ring, and on top of that he is called Salvatore. He is not ours: he marries a MARIA ROSARIA FILIPPELLI, not Ángela Costabile. But he cannot be entirely ruled out — if that woman died young, a most ordinary thing, he could have been widowed, married a second time around 1888-1892, emigrated and had Cristina in Santa Fe. The dates fit without forcing anything. It can be checked free of charge and in the same place: by looking for Maria Rosaria Filippelli in the deaths of Mendicino for 1885-1893, and for a second marriage of his in the marriages of those years. If a Rizzo × Costabile wedding turned up in Mendicino, the search would be over. IT WAS CHECKED THE SAME DAY, AND IT DOES NOT COME OUT. Mendicino is now swept in full: nineteen years of marriages (1875-1893) and nine of deaths (1885-1893). In the marriages there are exactly TWO Rizzo grooms, and they are brothers —Antonio in 1883 and Salvatore in 1885, both sons of Giuseppe Rizzo and Antonia Fortunata Dodaro— and not a single Costabile in the nineteen years. And in the deaths, which carry a column for the spouse, no Maria Rosaria Filippelli married to a Salvatore Rizzo dies: the two who appear under that name are other women, married to a Piscitelli and to a Barone. That is: he was not widowed there, and the hypothesis of a second marriage is left without support. AND WITH THAT THE COSENZA RING IS CLOSED AND IT IS NEGATIVE. Ten stretches swept —Rende 1850-1865 and 1880-1885, Marano Marchesato and Mendicino in full, San Vincenzo la Costa, and samplings of Cerisano, Carolei, Falconara, Guardia Piemontese and Marano Principato— and in none of them is there a Rizzo × Costabile wedding. Putting that together with the fact that Ángela Costabile was not in the province of Santa Fe in June 1887 and that Cristina is born there between 1893 and 1900, the most probable conclusion, and now one with weight behind it, is that they married in Argentina between 1888 and 1900 and their record is in the Civil Registry of Santa Fe, not in Italy. All that remains is to read the years of Rende that are still unopened —1866-1879 and 1886-1893—, blocked for the last sixteen windows.\n\nAnd a warning that came up along the way, in Cerisano: there is there an ANGELA COSTABILE married to a SALVATORE — but a Salvatore MUTO, and of an earlier generation. Those two given names together with that surname are not a unique combination in the district: before claiming victory one must always look at the husband's surname.\n\nIf in the eight of them no Rizzo × Costabile wedding were to appear between 1875 and 1893, that would be a very large negative: it would mean that they did not marry in the surroundings of Cosenza, and it would reinforce almost to the point of certainty that they married in Argentina between 1888 and 1900, which is where the census of 1887 and the scarcity of Rizzo men already point. Related: [[angela_costabile]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "angela_costabile", "unionLibre": false, "otrasParejas": [], "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "angela_costabile": {"id": "angela_costabile", "nombre": "Ángela Costabile", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["salerno"], "resumen": "Mother of Cristina Rizzo, Italian, resident at Santa Fe in 1923.", "datos": [["Who this was", "mother of CRISTINA RIZZO"], ["Husband", "SALVADOR RIZZO"], ["Nationality", "ITALIAN — so her daughter's marriage record says"], ["Where she lived in 1923", "«en esta ciudad», Santa Fe"], ["The surname", "COSTABILE is a southern Italian surname, and above all a Calabrian one. It fits with her daughter marrying a Salerno from RENDE, in the province of Cosenza: the Calabrian colony of Santa Fe married among itself"]], "vida": "", "lug": "", "mapa": null, "sinacta": "SHE IS ITALIAN AND WE DO NOT KNOW FROM WHERE, and that is the only door missing to go up this branch. WHAT HAS BEEN VERIFIED: COSTABILE IS A SURNAME OF RENDE, AND WITH NAMES ATTACHED. FEDERICO COSTABILE was the *assessore delegato* of the civil status of Rende in 1909 and signs the birth record of one of Settimo's sisters. SALVATORE COSTABILE, a tailor of twenty-three, was witness at a family wedding in 1897. And in the marriage index of Rende for 1858 there are the brothers SALVATORE and LUIGI GAETANO COSTABILE, sons of Francesco Saverio Costabile and Arcangela Maria Giraldi.\n\nThat she was from Rende ceases to be a hunch based on the ending of the surname and becomes reasonable. BUT IT REMAINS UNPROVEN: Costabile is a surname spread throughout the province of Cosenza, and she could have come from any of its towns.\n\nWHAT WOULD SETTLE IT is the birth certificate of her daughter Cristina, in Santa Fe. 29 AUGUST 2026 — AND HERE THINGS IMPROVE FOR HER. The marriages of Rende from 1850 to 1865 were read in full, sixteen consecutive years. COSTABILE turns out to be there a large and old male lineage: eight Costabile grooms in that stretch, from SIX different households, all with father and mother documented — Diego Costabile with Carmela Infusino, Pasquale with Maria Rosaria Scaglione, Francesco Saverio with Arcangela Maria Giraldi, Giovanni with Rosaria Bartucci, Saverio Lorenzo with Elena Rosaria Porro, Domenico with Anna Maria Stillo and Natale with Costantina Leone. In 1857 a Costabile even marries a Costabile.\n\nThat is to say: that a woman called Ángela Costabile should have come out of Rende fits well with what the town had. And the contrast with her husband is notable: in those same sixteen years there are eight Costabile grooms and only three Rizzo grooms. Nothing is proven yet —Costabile is a surname of the whole province of Cosenza— but of the two, the one who fits Rende better is her.\n\nA detail worth not forgetting: in the sweep NO Rizzo × Costabile wedding appears between 1850 and 1865. If that couple married in Rende, it was later. And if she reached Santa Fe after 1887 —which is what the census says— the wedding could perfectly well have been Argentine. Related: [[salvador_rizzo]], [[cristina_rizzo]].", "padre": null, "madre": null, "conyuge": "salvador_rizzo", "unionLibre": false, "otrasParejas": [], "hijos": ["cristina_rizzo"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "carlos_salerno": {"id": "carlos_salerno", "nombre": "Carlos Francisco Salerno", "legal": "", "rol": "directa", "rolNombre": "Direct line", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Son of Settimo and Cristina, born in Argentina. A chartered accountant and a public figure in Santa Fe: president of Club Atlético Colón from 1970 to 1974 and an official in the provincial administration. He died on 13 August 2002. He is the only person in the tree with a published newspaper biography.", "datos": [["Parents", "Settimo Salerno and Cristina Rizzo"], ["Death", "13 August 2002, Santa Fe — «esta madrugada», says El Litoral of that same day. This CORRECTS the «2003» this tree gave before, from memory"], ["Spouse", "Adelina Faienza"], ["Occupation", "CERTIFIED PUBLIC ACCOUNTANT — the newspaper calls him «el contador Salerno» from beginning to end"], ["Office", "PRESIDENT OF THE CLUB ATLÉTICO COLÓN of Santa Fe, from the end of 1970 to 1974"], ["Public administration", "he made a career in the provincial administration and «alcanzó notoriedad durante la segunda gobernación de Sylvestre Begnis»"], ["According to the family", "he was also president of the CHAMBER OF COMMERCE of Santa Fe and of EMAÚS. The obituary does not say so: it stands as family testimony, not as a proven fact"], ["Source", "El Litoral (Santa Fe), print edition of 13 August 2002, Deportes section, page DEPO-06: «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html"]], "vida": "†2002", "lug": "", "mapa": null, "sinacta": "No record yet, but a published source, and he is the only one in the tree who has one. On 13 August 2002 EL LITORAL of Santa Fe devoted a whole obituary to him.\n\nWHAT THE NEWSPAPER PROVES. That he was an ACCOUNTANT. That he died «this early morning», that is, that of 13 August 2002 — the tree said 2003 from memory and stands corrected. That in 1970 he was elected vice-president of Colón on the «Nuevo Colón» list headed by José Relañez Passini; that at the end of that same year Relañez was removed and HE HIMSELF TOOK OVER THE PRESIDENCY, until 1974. That under his management the club came out of a difficult financial situation and the SWIMMING POOL, the CLUBHOUSE and the pit of the western sector were built, and the stadium was remodelled. That he obtained the money for the pool from the municipality and himself devised the legal form in which to receive it SO THAT IT COULD NOT BE DIVERTED TO FOOTBALL; the newspaper stresses «the seriousness and clarity with which he handled the finances». That through his hands passed Enzo Trossero, «Cococho» Álvarez, Trullet, Zuccarelli, Di Meola, Aráoz and Costantino, and the coach Urriolabeitia. And that he made a career in the provincial PUBLIC ADMINISTRATION, with some prominence during the second governorship of Sylvestre Begnis.\n\nTHE ANECDOTE THAT PORTRAYS HIM BEST. On 25 January 1981 he stood again and the election was decided by FOUR VOTES. His list had been proclaimed the winner; it was HE HIMSELF who spotted the error that reversed the result, pointed it out and conceded defeat. The newspaper uses the word «hidalgamente». Years later José Néstor Vignatti called him the «spiritual father» of his group and consulted him constantly.\n\nWHAT THE FAMILY CONTRIBUTES AND THE NEWSPAPER DOES NOT SAY. That he was also president of the CHAMBER OF COMMERCE of Santa Fe and of EMAÚS. It fits that profile, but the obituary is from the sports section and looks only at Colón, so these stand here as FAMILY TESTIMONY and not as proven fact. They would be confirmed in the local press or in the archives of those two institutions.\n\nWHAT IS STILL MISSING. His BIRTH CERTIFICATE in the Civil Registry of Santa Fe, which would name Settimo under the name he used in Argentina and would give his declared age: it would be the first Argentine document to tie this branch to the 48 Italian records. And now also his DEATH RECORD which, with the exact date already in hand, is an easy request.\n\nSOURCE: El Litoral (Santa Fe), 13 August 2002, Deportes, DEPO-06, «Falleció Carlos Salerno, mentor de profundos cambios en Colón» — https://www.ellitoral.com/index.php/diarios/2002/08/13/deportes/DEPO-06.html", "padre": "settimo", "madre": "cristina_rizzo", "conyuge": "adelina_faienza", "unionLibre": false, "otrasParejas": [], "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": ["nilda_salerno"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "adelina_faienza": {"id": "adelina_faienza", "nombre": "Adelina Faienza", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 9, "ramas": ["salerno", "faienza"], "resumen": "Daughter of Domenico Faienza and Brigida Nelli. She is where the two branches meet: the Salerno of Calabria and the Faienza and Pizzi of Abruzzo.", "datos": [["Parents", "Domenico Faienza and Brigida Nelli"], ["Spouse", "Carlos Francisco Salerno"], ["Daughters", "Stella Maris, Norma, Beatriz, Susana and Maria Cristina"], ["Source", "family tree — no record"]], "vida": "", "lug": "", "mapa": null, "sinacta": "No record. Her birth would be in the Civil Registry of Santa Fe.", "padre": "domenico_faienza", "madre": "brigida_nelli", "conyuge": "carlos_salerno", "unionLibre": false, "otrasParejas": [], "hijos": ["stella_maris", "susana_salerno", "cristina_salerno", "beatriz_salerno", "norma_salerno"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "brigida_nelli": {"id": "brigida_nelli", "nombre": "Brigida Maria Ana Nelli", "legal": "", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["faienza"], "resumen": "Born at Santa Fe in January 1901 and baptised in the Cathedral. She is the first Argentine of that branch: her parents were already here. Her death certificate, obtained in August 2026, finally gave her parents' full names.", "datos": [["Birth", "January 1901, province of SANTA FE. The certificate of baptism says the 13th; the death certificate says the 12th. The baptismal certificate carries more weight, written within a few days"], ["Baptism", "1901, Cathedral of Todos los Santos, Santa Fe"], ["Parents", "ÁNGEL ALBERTO NELLI and FILOMENA PAGLIARONE"], ["Spouse", "DOMINGO FAIENZA, the Italian from Paglieta. They lived together at calle JUAN PABLO LÓPEZ 2643, Santa Fe city"], ["Trade", "housewife"], ["Argentine document", "Libreta Cívica 6.119.349"], ["Death", "19 August 1984 at 8 p.m., at her house in Santa Fe, aged 83"]], "vida": "1901–1984", "lug": "", "mapa": null, "sinacta": "Her certificate of baptism has been located and read in the image, but not downloaded to this archive. It says: «solemnly baptised Brígida M. Ana, who was born on the thirteenth day of January of the current year, legitimate daughter of D. Ángel A. Nelli and of Doña Filomena Pallarone». It corrected two errors in the family tree: the surname is NELLI with two l's, and her mother was NOT Catterina Volpi.", "padre": "angel_nelli", "madre": "filomena_pagliarone", "conyuge": "domenico_faienza", "unionLibre": false, "otrasParejas": [], "hijos": ["adelina_faienza"], "hermanos": [], "actas": [{"titulo": "Death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "19 August 1984", "lugar": "Santa Fe, department of La Capital, Argentina", "ref": "volume 5-A, record 1257", "fuente": [["Archive", "Registro Civil de la Provincia de Santa Fe — Archivo General"], ["How it was obtained", "digital application at santafe.gob.ar/rcdigital, requested by Gonzalo on 25 August 2026"], ["Digital signature", "César Gabriel Garrone, Archivo Central Santa Fe, 26-8-2026"], ["Verification", "application 26-00-278-984 · hash D9CC-7428-D598-5FBA-6A3E-0BA2-B8F6-3037-ED61-C905, checkable at santafe.gob.ar/rcdigital/valida-firma"]], "literal": "", "traduccion": "At SANTA FE, department of La Capital, province of Santa Fe, on 21 August 1984. I, Public Officer of this Registry, record the DEATH of BRÍGIDA MARÍA ANA NELLI. Female, ARGENTINE nationality. Status: married. Occupation: housewife. Identity document: Civic Registration 6,119,349. Address: J. P. López 2643.\n\nDAUGHTER OF ÁNGEL ALBERTO NELLI AND FILOMENA PAGLIARONE.\n\nBORN IN THE PROVINCE OF SANTA FE ON 12 JANUARY 1901.\n\nOccurring at Santa Fe on 19 August 1984 at 20:00. Cause of death: illness. Medical certificate Miguel Hominal. Informant: VÍCTOR BORREI, L.E. 8,501,792, address Belgrano 6578, acting by virtue of being a person authorised for that purpose. — María M. Pierozzi, Head of the Deaths Subsection of Santa Fe.", "notas": ["WHAT PROVES IT IS HER, AND NOT SOME OTHER NELLI: THE ADDRESS. This record and that of DOMINGO FAIENZA give the same house — J. P. López 2643. She dies there in August 1984; he, in the same house, sixteen months later. They were husband and wife and lived together to the end.", "MIND THE OTHER TWO ADDRESSES THAT APPEAR. Belgrano 6578 and Berutti 5663 are the addresses of the DECLARANTS, not of the family. Both records say that the declarant «acts by virtue of being a person authorised for that purpose»: they are agents, almost certainly from the undertaker's, and in each record it is a different man. Those addresses do not mean that there was another house or another family.", "IT GIVES THE FATHER'S FULL NAME. The certificate of baptism said only «D. Ángel A. Nelli». It is now known that the A. is for ALBERTO. And with this record two people enter the tree who until today did not exist: her parents.", "IT MATCHES THE CERTIFICATE OF BAPTISM IN FOUR THINGS: the full name in the same order (Brígida M. Ana), the month and the year, the father and the mother's name.", "TWO POINTS OF FRICTION, noted without covering them up. (1) THE DAY: the baptismal certificate says 13 January, this record says 12. One day's difference between a paper written within days of the birth and another dictated 83 years later by someone who was not family. (2) THE MOTHER'S SURNAME: on the baptismal certificate I read PALLARONE; here the hand gives something like PAGLIQEOME. Neither reading is secure on its own, but together they point to PAGLIARONE.", "And it confirms that she was Argentine by birth: «born in the province of Santa Fe». The certificate of baptism left that box blank."], "imgs": [{"u": "../actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20Partida%20de%20defuncion%20de%20Brigida%20Nelli%20-%20Santa%20Fe%20acta%201257.jpg", "t": "Partida de defuncion de Brigida Nelli - Santa Fe acta 1257"}], "zooms": [{"u": "../actas/1901%20-%20Brigida%20Nelli/1984-08-19%20D%20zoom%20-%20hija%20de%20Angel%20Alberto%20Nelli%20y%20Filomena%2C%20mismo%20domicilio%20que%20Domingo.jpg", "t": "Hija de Angel Alberto Nelli y Filomena, mismo domicilio que Domingo"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "angel_nelli": {"id": "angel_nelli", "nombre": "Ángel Alberto Nelli", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["faienza"], "resumen": "Brígida's father. He entered the tree on 28 August 2026, through his daughter's death certificate: until that day he was only an initial on a baptismal record.", "datos": [["Who this was", "father of BRÍGIDA MARÍA ANA NELLI, born in the province of Santa Fe in January 1901"], ["Full name", "ÁNGEL ALBERTO. His daughter's certificate of baptism gave only «D. Ángel A. Nelli»; the death certificate of 1984 reveals the second initial"], ["Wife", "FILOMENA PAGLIARONE"], ["Style of address", "in the certificate of baptism of 1901 the priest gives him «DON», which at that time and in that book was not given to just anyone"], ["Where he was in 1901", "at Santa Fe city: his daughter was born and baptised there"]], "vida": "", "lug": "", "mapa": null, "sinacta": "IT IS NOT KNOWN WHETHER HE WAS ITALIAN OR ALREADY ARGENTINE, and that is the question to be settled. The surname NELLI is Italian, and his daughter was born in Santa Fe in 1901, at the height of the immigration. The shortest route would be his own death certificate in the Civil Registry of Santa Fe —which would give age, nationality and town— or the marriage record with Filomena. 29 AUGUST 2026 — WE NOW KNOW SOMETHING ABOUT HIM, AND IT IS BY ABSENCE. The 1887 provincial census of Santa Fe —which is free and indexed name by name— was swept in full looking for NELLI and PAGLIARONE under thirteen different spellings, because the indexer writes Italian surnames by ear (ALASIA appears in seven forms in that same census). PAGLIARONE does not exist in the whole province. Three people come up under NELLI, and all three fall away: two are boys of fourteen and thirteen inside a SWISS household —the Burgi, with the Pfeiffer next door— in HUMBOLDT, a Swiss-German colony in the department of Las Colonias; the third is a Juan of eighteen, also in Las Colonias. Our family always lived in the CAPITAL. THEREFORE ÁNGEL AND FILOMENA WERE NOT IN THE PROVINCE IN JUNE 1887. And since their daughter Brígida is born in Santa Fe in January 1901, they arrived between those two dates. That leaves their wedding within a bracket of fourteen years and in two possible places: Italy before embarking, or SANTA FE between 1888 and 1900. If it was the second, their record is in the Civil Registry of Santa Fe and would name Brígida's four grandparents, who today are four whole gaps.\n\nFOR THAT REASON BRÍGIDA'S BIRTH CERTIFICATE (January 1901) RISES IN PRIORITY: an Argentine record of that period gives the age and the nationality of both parents, and very often the number of years they had been in the country. It would answer once and for all whether he was Italian or already Argentine. Related: [[filomena_pagliarone]].", "padre": null, "madre": null, "conyuge": "filomena_pagliarone", "unionLibre": false, "otrasParejas": [], "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "filomena_pagliarone": {"id": "filomena_pagliarone", "nombre": "Filomena Pagliarone", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["faienza"], "resumen": "Brígida's mother. Her forename is clear in two documents; the surname is the one weak point of this couple, because the two sources spell it differently.", "datos": [["Who this was", "mother of BRÍGIDA MARÍA ANA NELLI"], ["Husband", "ÁNGEL ALBERTO NELLI"], ["The forename", "FILOMENA, beyond dispute: so both the certificate of baptism of 1901 and the death certificate of 1984 write it"], ["The surname", "PROBABLE, NOT PROVEN. In the certificate of baptism I read PALLARONE; in the death certificate the hand gives something like PAGLIQEOME. Neither reading is firm, but together they point to PAGLIARONE"], ["Why it fits", "PAGLIARONE is a real surname, and one from the ABRUZZO. Her son-in-law, Domingo Faienza, was from PAGLIETA, in the province of Chieti — Abruzzo as well. It is a suggestive coincidence, and nothing more than that"]], "vida": "", "lug": "", "mapa": null, "sinacta": "THE SURNAME IS UNSETTLED and it is the first thing to be put right about this couple. It would be resolved by the marriage record of Ángel and Filomena, or by Brígida's birth certificate in the Civil Registry of Santa Fe (1901), which would write it a third time. With three independent readings the surname would be fixed. AND THERE IS NO POINT IN LOOKING FOR HER IN ITALY YET. On 29 August 2026 the 1887 provincial census of Santa Fe was swept under eight spellings of the surname —PAGLIARONE, PALLARONE, PAGLIARON, PAGLIERONE, PALLIARONE, PAGLIARONI, PAJARONE and PAGLIARO— and there is NOT A SINGLE person of that name in the whole province. The only thing resembling it is a «Pagliaro Margarita» of forty-two in Las Colonias, which is a different surname. Together with the same absence of her husband, that proves that they arrived AFTER June 1887.\n\nWhat this means in practice: as long as the surname is not fixed and we do not know the town, looking for her in an Italian archive is throwing time away — Antenati is organised by comune and one cannot search a surname blindly across the whole of Italy. The correct order is the other way round: first the Argentine record that fixes the surname and gives the town, and then Italy. Related: [[angel_nelli]].", "padre": null, "madre": null, "conyuge": "angel_nelli", "unionLibre": false, "otrasParejas": [], "hijos": ["brigida_nelli"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "stella_maris": {"id": "stella_maris", "nombre": "Stella Maris Salerno", "legal": "", "rol": "directa", "rolNombre": "Direct line", "gen": 10, "ramas": ["rivas", "salerno", "celeri", "faienza"], "resumen": "Born at Santa Fe on 23 December 1953. Gonzalo's mother.", "datos": [["Birth", "23 December 1953, Santa Fe, Argentina"], ["Parents", "Carlos Francisco Salerno and Adelina Faienza"], ["Spouse", "Marcos Cesar Rivas"], ["Source", "family tree"]], "vida": "b.1953", "lug": "Santa Fe", "mapa": null, "sinacta": "A living or recent person: her details
