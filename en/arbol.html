acida hacia 1892"], ["En 1895", "vive en VERA, Santa Fe, con su marido y su hija"], ["Muerta entre", "mayo de 1895 y el 25 de octubre de 1900, cuando Tebaldo se casa VIUDO"], ["Where this comes from", "el censo nacional de 1895 (filas 8 a 10) y el acta de defunción de su hija — Villa Ángela, Chaco, 1946, acta 88"]], "mapa": null, "sinacta": "Faltan sus padres, su partida y su defunción — pero ya se sabe dónde buscarlas.\n\nSU NACIMIENTO, hacia 1870, estaría en la provincia de CÓRDOBA: registro civil o parroquia. SU MATRIMONIO con Tebaldo es anterior a 1892 y sería de Santa Fe o de Córdoba; nombraría a sus padres y —lo que durante días fue la pregunta abierta de esta rama— el pueblo italiano de él. SU DEFUNCIÓN cae entre mayo de 1895 y octubre de 1900, en Vera o alrededores: una ventana de cinco años y medio, estrecha y rastreable.\n\nY SI TUVO MÁS HIJOS, hay medios hermanos de Elba sin descubrir. En 1895 sólo consta Enriqueta, de tres años, pero entre esa fecha y su muerte pudo tener más.", "padre": null, "madre": null, "conyuge": "tebaldo_celeri", "hijos": ["enriqueta_celeri"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "enriqueta_celeri": {"id": "enriqueta_celeri", "nombre": "Enriqueta Celeri", "legal": "Enriqueta C. de González", "rol": "hermano", "rolNombre": "Sibling", "gen": 9, "ramas": ["celeri"], "resumen": "Daughter of Tebaldo's first marriage, and Elba's half-sister. She carries the name of her Italian grandmother. She died in Chaco in 1946.", "datos": [["Birth", "hacia 1892, en la provincia de SANTA FE — los tres años que le da el censo de 1895, tomado en vida. Su acta de defunción de 1946 le da cincuenta y dos años, que darían 1894: se prefiere el censo"], ["En 1895", "vive en VERA con sus padres, Tebaldo y Concepción"], ["Name", "ENRIQUETA, por su abuela paterna Enrichetta Vanni"], ["Parents", "TEBALDO CELERI y ENCARNACIÓN FERNÁNDEZ"], ["Spouse", "CASIMIRO GONZÁLEZ, que en 1946 tenía cincuenta y ocho años"], ["Trade", "«Domésticos» según el acta"], ["Death", "15 de agosto de 1946, a las 21 h, en VILLA ÁNGELA, departamento Río Zapallar, Territorio Nacional del Chaco — acta 88"], ["Cause", "hemorragia meníngea, certificada por el doctor José V. Fender"]], "mapa": null, "sinacta": "", "padre": "tebaldo_celeri", "madre": "encarnacion_fernandez", "conyuge": null, "hijos": [], "hermanos": [], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "15 de agosto de 1946, 21 h; inscrita el 16", "lugar": "Villa Ángela, Chaco", "ref": "acta 88", "fuente": [["Archivo", "Registro Civil de los Territorios Nacionales — Chaco"], ["Fondo", "Villa Ángela, Mayor Luis J. Fontana, Chaco — imagen 94 de 225, grupo de imágenes 107171596"], ["Vía", "FamilySearch"]], "literal": "NÚMERO ochenta y ocho. En Villa Ángela, Departamento Río Zapallar, Territorio Nacional del Chaco, República Argentina, a diez y seis de Agosto de mil novecientos cuarenta y seis, Yo, Encargado del Registro del Estado Civil, procedo a inscribir la DEFUNCIÓN de: ENRIQUETA C. DE GONZÁLEZ, de nacionalidad Argentina, de sexo femenino, edad cincuenta y dos años, de profesión Domésticos, de estado casada, domiciliada en Villa Ángela. Ocurrida en Villa Ángela a las veintiuna horas del día quince del mes de Agosto de mil novecientos cuarenta y seis, diagnóstico Hemorragia meníngea. La persona fallecida es hija de: TEBALDO CELERI […] y de ENCARNACIÓN FERNÁNDEZ. Esta inscripción se efectúa según declaración prestada por CASIMIRO GONZÁLEZ, estado casado, edad cincuenta y ocho años, domiciliado en Villa Ángela, quien ha visto el cadáver. Ante el testigo HÉCTOR J. CARRARA, estado soltero, edad veintinueve años.", "traduccion": "The record is in Spanish and is transcribed literally.", "notas": ["*** ES LA QUE DESTAPA EL PRIMER MATRIMONIO DE TEBALDO. *** El acta de 1900 lo daba «viudo» y no decía de quién. Ésta, cuarenta y seis años más tarde y en otra provincia, nombra a la madre: ENCARNACIÓN FERNÁNDEZ. Dos documentos que no se conocen entre sí encajando por una esquina.", "SE LLAMABA ENRIQUETA COMO SU ABUELA ITALIANA, Enrichetta Vanni, que en 1894 seguía viva en Italia y murió en 1923. Tebaldo le puso a su hija el nombre de su madre, a diez mil kilómetros.", "MURIÓ EN EL CHACO, no en Santa Fe. La familia se movió hacia el norte, a la frontera agrícola: Villa Ángela era entonces territorio nacional, no provincia.", "Quedan por buscar sus hermanos: si Tebaldo y Encarnación tuvieron más hijos, son medios hermanos de Elba y hay descendencia argentina sin localizar."], "imgs": [{"u": "../actas/1946%20-%20Enriqueta%20Celeri/1946-08-15%20D%20Muerte%20de%20Enriqueta%20Celeri%20de%20Gonzalez%20-%20Villa%20Angela%2C%20Chaco%20acta%2088.jpg", "t": "Muerte de Enriqueta Celeri de Gonzalez - Villa Angela, Chaco acta 88"}], "zooms": []}], "nActas": 1, "nImgs": 1, "titulo": "", "parrafos": [], "claves": []}, "calisto_celeri": {"id": "calisto_celeri", "nombre": "Callisto Celeri", "legal": "«Calisto» en el acta argentina de 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "TOWN CLERK OF TRASSILICO — the man who wrote the village's records. Born around 1831, son of a Desiderio Celeri already dead by then. Father of Tebaldo, and the proof that this family were not peasants.", "datos": [["Name", "CALLISTO en el acta italiana de 1923; «Calisto» en la argentina de 1900. Del latín Callistus. Es raro, y por eso el más fácil de rastrear de toda la rama"], ["Birth", "entre noviembre de 1830 y julio de 1831 — declara TREINTA Y UN AÑOS en noviembre de 1861 y otra vez en julio de 1862, lo que encierra la fecha"], ["Father", "DESIDERIO CELERI, ya difunto en 1862 — «Celeri Callisto FU Desiderio»"], ["Trade", "*** POSSIDENTE E SEGRETARIO COMUNALE *** del Comune di Trassilico. Las dos cosas: tenía propiedades y llevaba el registro civil y la correspondencia del municipio. Ocho actas de 1861 y 1862 lo describen exactamente así"], ["Cómo lo trataban", "las actas lo llaman SIGNORE: «alla presenza delli SIGNORI Andreini Dottor Pietro… e Celeri Callisto». Él y el médico eran los dos testigos de oficio del pueblo — los dos únicos hombres con letras de un municipio donde casi todos los declarantes firman «per essere illetterato»"], ["Village", "TRASSILICO, entonces circondario de Garfagnana, provincia de MASSA"], ["Spouse", "ENRICHETTA VANNI, de Trassilico (hacia 1835 – 9 de septiembre de 1923). Casados el 30 de enero de 1859 en la iglesia de Trassilico"], ["Hijo conocido", "TEBALDO CELERI, nacido hacia 1862, emigrado a Argentina"], ["Dead before", "septiembre de 1923 — su mujer figura VIUDA en el acta de ese mes"], ["Where this comes from", "el acta de matrimonio de su hijo (Vera, Santa Fe, 1900) y el acta de defunción de su mujer (Trassilico, Lucca, 1923), que la llama «moglie di CELERI CALLISTO» y lo corrige a «vedova»"]], "mapa": null, "sinacta": "Tres actas lo nombran y ninguna es suya. La de su hijo, en Argentina, y la de su mujer, en Trassilico — que lo da ya muerto en septiembre de 1923, al corregir «esposa» por «viuda» en el margen.\n\nFaltan su nacimiento, su matrimonio y su defunción, y los tres estarían en TRASSILICO (Lucca): los registros civiles italianos empiezan en 1866, y antes hay libros parroquiales. Si su mujer nació hacia 1835 y su hijo en 1862, la boda sería de los años cincuenta o comienzos de los sesenta.\n\nCALLISTO es el nombre que más rinde de toda esta rama. En un pueblo de montaña de trescientos vecinos, un Callisto Celeri no se confunde con nadie.", "padre": "desiderio_celeri", "madre": "angela_menghi", "conyuge": "enrichetta_vanni", "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": [], "actas": [{"titulo": "His handwriting", "tipo": "F", "tipoNombre": "Record", "fecha": "1858 a 1866", "lugar": "Trassilico, Garfagnana", "ref": "ocho actas de siete registros distintos del Comune di Trassilico", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico — registros 54.7 (Morti 1858), 53.1 (Matrimoni 1859), 53.3 (Matrimoni 1861), 51.5 (Nati 1862), 51.7 (Nati 1864) y 51.8 (Nati 1865)"]], "literal": "Compilato dal sottoscritto SEGRETARIO COMUNALE il presente Indice questo giorno 30 Gennajo 1859. — CELERI", "traduccion": "Four samples of the same hand, taken from four different registers:\n\n· **1858** — at the foot of the alphabetical index of deaths: «This index compiled by the undersigned TOWN CLERK, today 30 January 1859. — Celeri». **He wrote that whole index**, and signed it SIX DAYS BEFORE HIS WEDDING.\n· **1859** — «Celeri Callisto, dichiarante», at the foot of his own marriage record.\n· **1861** — «Celeri Callisto, testimone», at the wedding of Maria Celeri, Nicolao's daughter.\n· **1862** — «Celeri Callisto, dichiarante», the day he went to register Tebaldo.\n· **1863, January** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», closing the index of marriages for 1862.\n· **1863, April** — «Celeri Callisto, testimone», at the wedding of his sister-in-law LUISA VANNI to Doctor Matteo Vincenti.\n· **1864** — «Celeri Callisto, testimone», on 3 July, standing as witness at the civil registration of a neighbour's child.\n· **1866** — «Compilato il presente indice da me sottoscritto — CELERI, Segretario Comunale», closing the index of births for 1865. **It is the last signature of his that is known.**", "notas": ["*** HASTA DÓNDE LLEGA LA CERTEZA, Y CONVIENE DECIRLO. *** Lo que está probado es que estas firmas dicen «CELERI» y el cargo «SEGRETARIO COMUNALE», y que Callisto era el secretario del ayuntamiento de Trassilico — eso consta en ocho actas entre 1859 y 1862. De ahí a afirmar que escribió de su puño el cuerpo entero de cada índice hay un paso que NO está demostrado: un secretario podía firmar el trabajo de un amanuense. Lo que sí es suyo con seguridad son las FIRMAS: «Celeri Callisto, dichiarante» al pie de su acta de boda y de la de Tebaldo, y «Celeri» cerrando los índices.\n\n*** Y ESTAS FIRMAS FECHAN SU CARRERA, QUE ERA LO QUE SE BUSCABA. *** Se venía intentando averiguar cuándo dejó Callisto la secretaría, porque de eso dependía estrechar la fecha de su muerte. Ahora hay suelo firme: en 1864 firma como testigo en las actas 24, 25, 47, 48, 49, 52 y 53 del registro de nacidos, siempre como «Celeri Callisto fu Desiderio, SEGRETARIO COMUNALE»; y a principios de 1866 todavía es él quien compila y firma el índice de nacidos de 1865. **SEGUÍA EN EL CARGO EN 1866, con treinta y seis años.** Lo que venga después ya es registro civil italiano y no está en Antenati.\n\n*** AUN ASÍ, ES LO ÚNICO FÍSICO QUE QUEDA DE ÉL. *** De ninguna otra persona de este árbol —ciento cuarenta y una, doscientos años— se conserva un rasgo del cuerpo salvo la descripción de Antonio Salerno en su ficha de reclutamiento de 1942. De Callisto queda su letra.", "Firma como secretario los índices anuales de defunciones de 1856, 1857, 1858, 1860 y 1861 — cada año, a finales de enero, cerraba el del año anterior. Los índices que hemos barrido buscando a su padre llevan su firma al pie.", "*** Y ESO ABRE UNA VÍA PARA FECHAR SU MUERTE. *** Si firmaba cada año, el año en que su firma desaparece acota cuándo dejó el cargo. En el índice de 1865 —el último del fondo— YA NO ESTÁ: lo autentica «D.r PIETRO ANDREINI, ufficiale dello stato civile», el mismo médico que fue testigo del nacimiento de Tebaldo. PERO CUIDADO: el formato del registro cambió entre medias, con la unificación de Italia, y la línea del secretario sencillamente ya no aparece. La ausencia NO prueba que hubiera muerto. Lo que lo acotaría de verdad son los índices de 1862, 1863 y 1864.", "LA COINCIDENCIA DEL 30 DE ENERO DE 1859. Ese día firmó el índice de difuntos del año anterior… y ese mismo día se casó con Enrichetta en la iglesia de Trassilico. La boda por la mañana o por la tarde, y el trabajo terminado igual.", "Su firma es corta y decidida —«Celeri», con una rúbrica larga por debajo— frente a la letra escolar y trabajosa de los declarantes que sí sabían escribir, y frente a las decenas de actas del mismo registro que terminan «omessa la firma per essere illetterato»."], "imgs": [{"u": "../actas/1830%20-%20Callisto%20Celeri/1858%20F%20caligrafia%20-%20firma%20Celeri%20al%20pie%20del%20indice%20de%20difuntos%20de%201858.jpg", "t": "1858 F caligrafia - firma Celeri al pie del indice de difuntos de 1858"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1859%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20en%20su%20propia%20acta%20de%20boda.jpg", "t": "1859 F caligrafia - Celeri Callisto Dichiarante en su propia acta de boda"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1861%20F%20caligrafia%20-%20Celeri%20Callisto%20testimone%20en%20la%20boda%20de%20Maria%20Celeri.jpg", "t": "1861 F caligrafia - Celeri Callisto testimone en la boda de Maria Celeri"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1862%20F%20caligrafia%20-%20Celeri%20Callisto%20Dichiarante%20al%20inscribir%20a%20Tebaldo.jpg", "t": "1862 F caligrafia - Celeri Callisto Dichiarante al inscribir a Tebaldo"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20matrimonios%20de%201862%20-%20Trassilico.jpg", "t": "1863-01 F Firma de Callisto cerrando el indice de matrimonios de 1862 - Trassilico"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1864-07-03%20F%20Firma%20de%20Callisto%20Celeri%20como%20testigo%20-%20Trassilico%20acta%2048.jpg", "t": "1864-07-03 F Firma de Callisto Celeri como testigo - Trassilico acta 48"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Firma%20de%20Callisto%20cerrando%20el%20indice%20de%20nacidos%20de%201865%20-%20Trassilico.jpg", "t": "1866-01 F Firma de Callisto cerrando el indice de nacidos de 1865 - Trassilico"}, {"u": "../actas/1830%20-%20Callisto%20Celeri/1866-01%20F%20Indice%20de%20nacidos%20de%201865%2C%20pagina%20de%20cierre%20-%20Trassilico.jpg", "t": "1866-01 F Indice de nacidos de 1865, pagina de cierre - Trassilico"}], "zooms": [{"u": "../actas/1830%20-%20Callisto%20Celeri/1863-01%20F%20Firma%20zoom%20-%20Celeri%20Segretario%20Comunale%20al%20pie%20del%20indice%20de%20matrimonios%20de%201862.jpg", "t": "1863-01 F Firma Celeri Segretario Comunale al pie del indice de matrimonios de 1862"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "30 de enero de 1859 la boda; 4 de febrero el acta civil", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 3", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Registro", "ark an_ua35853344 · hash del contenedor: 03QyK9Z (18 imágenes)"], ["Página", "5 de 18 — el acta 3 ocupa el centro de la hoja"], ["Cómo se localizó", "por el índice alfabético del final (página 18), fila «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». Antes se habían descartado 1861 y 1860 leyendo sus índices completos"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Record 3. The year 1859, the FOURTH OF FEBRUARY. Before me, registrar of the Civil Status of the COMUNE OF TRASSILICO, province of Garfagnana, there appeared CALLISTO CELERI, aged TWENTY-EIGHT, A MAN OF PROPERTY AND TOWN CLERK, born and resident at Trassilico, SON OF THE LATE DESIDERIO.\n\nIn the presence of ERMENEGILDO GALANTI, son of the living Felice, and of GIOVANNI REBECHI, son of the late Paolino, both of full age, men of property and resident at Trassilico, he stated: THAT ON THE THIRTIETH OF JANUARY of the current year his marriage was celebrated with SIGNORA ENRICHETTA VANNI, DAUGHTER OF THE LATE DOCTOR PIETRO, aged TWENTY-FOUR, without profession, born and resident at Trassilico, before signor don Grandi, parish priest.\n\nTHE PARISH PRIEST'S CERTIFICATE: «The undersigned parish priest certifies that signor CALLISTO, son of the late DESIDERIO CELERI, aged twenty-eight, born and resident at Trassilico, A MAN OF PROPERTY and TOWN CLERK, and signora ENRICHETTA VANNI, aged twenty-four, likewise born and resident at Trassilico, A WOMAN OF PROPERTY, celebrated on the thirtieth of January 1859 their marriage according to the rites of the Catholic Church before me, in the presence of PIETRO BONETTI, son of the late Antonio, and PIETRO MENGHI, son of the late Luigi, both witnesses of Trassilico. And in witness whereof, from the parish house of Trassilico, today 4 February 1859. DOMENICO GRANDI, rector.»", "notas": ["*** ES LA BODA QUE SE BUSCABA, Y COSTÓ TRES AÑOS DE ÍNDICES. *** Se descartaron primero 1861 (cuarenta bodas) y 1860, leyendo sus índices alfabéticos completos, antes de dar con ella en 1859. Ese método —una imagen de índice por año en vez de un registro entero— es lo que hizo viable la búsqueda.", "LAS EDADES CUADRAN CON TODO LO DEMÁS. Él, veintiocho en febrero de 1859 → nacido hacia 1830-31, igual que los treinta y uno que declara en 1861 y 1862. Ella, veinticuatro → nacida hacia 1834-35, igual que los veintisiete de 1862 y los ochenta y ocho de su defunción de 1923. Cuatro documentos, sesenta y cuatro años y dos archivos distintos, todos apuntando al mismo par de fechas.", "*** LOS DOS ERAN «POSSIDENTI» — PROPIETARIOS. *** Y ella por derecho propio: la fe del párroco la llama possidente, no «hija de». En un pueblo de montaña donde el acta vecina describe a los novios como «agricoltore» y «agricoltrice», y donde la mayoría firma «per essere illetterato», este matrimonio es el de dos propietarios que saben escribir. Sus dos testigos civiles también son possidenti.", "LO QUE EL ACTA NO DA, Y HAY QUE DECIRLO: NO NOMBRA A LAS MADRES. De él sólo «figlio del fu Desiderio»; de ella sólo «figlia del fu Dr. Pietro». La madre de Callisto sigue sin conocerse. La de Enrichetta —LIVIA RIGHINI— la sabemos por otra vía: su acta de defunción de 1923.", "SE CASARON EN ENERO Y TEBALDO NACIÓ EN JULIO DE 1862 — tres años y medio después. Si no hubo hijos entre medias, y los índices de nacidos de 1861 y 1862 no traen ninguno, quedan por barrer 1859 y 1860.", "DON DOMENICO GRANDI los casó en 1859 y bautizó a Tebaldo en 1862. El mismo cura, en el mismo pueblo, en las dos actas más importantes de esta rama."], "imgs": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "enrichetta_vanni": {"id": "enrichetta_vanni", "nombre": "Enrichetta Vanni", "legal": "«Doña Enriqueta Vanni» en el acta argentina de 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "Gonzalo's paternal great-great-grandmother. She was born and died at TRASSILICO, a mountain village in the Garfagnana, province of Lucca, and lived eighty-eight years without leaving it. Her death record is the one that gave this whole branch a village: until it surfaced, all that was known of Tebaldo was that he was «a native of Italy».", "datos": [["Birth", "hacia 1835, TRASSILICO, provincia de Lucca, Toscana — los ochenta y ocho años que le da su acta de defunción"], ["Parents", "PIETRO VANNI y LIVIA RIGHINI, los dos de Trassilico y los dos ya muertos en 1923"], ["Spouse", "CALLISTO CELERI — el acta la llama «moglie di Celeri Callisto», corregido al margen a «anzi VEDOVA»"], ["Hijo conocido", "TEBALDO CELERI, nacido hacia 1862, que emigró a Argentina"], ["Address", "TRASSILICO, VIA DEL CENTRO, número 17 — la casa donde nació y donde murió ochenta y ocho años después. El enlace lleva al pueblo: no hay numeración cartografiada allí. https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia"], ["Trade", "«atta a casa» — dedicada a su casa"], ["Marriage", "30 de enero de 1859, iglesia de Trassilico, con CALLISTO CELERI — acta civil 3, del 4 de febrero. Ella tenía veinticuatro años"], ["Condición", "POSSIDENTE — propietaria por derecho propio, así la llama la fe del párroco en 1859"], ["Death", "9 de septiembre de 1923, a las 3:30 de la madrugada, en su casa de Trassilico — acta 10, inscrita el día 10 a las 14:25"]], "mapa": {"lat": 44.04202, "lon": 10.40405, "titulo": "Trassilico — Via del Centro, 17", "pie": "Nació aquí hacia 1835 y murió aquí el 9 de septiembre de 1923, a las tres y media de la madrugada, con ochenta y ocho años. En la misma casa, en el mismo pueblo, del que probablemente no salió nunca. Su hijo Tebaldo llevaba entonces más de cuarenta años en Argentina."}, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": "calisto_celeri", "hijos": ["tebaldo_celeri", "ciro_celeri", "dante_celeri", "giuseppe_celeri"], "hermanos": ["luisa_vanni"], "actas": [{"titulo": "Death record", "tipo": "D", "tipoNombre": "Death", "fecha": "9 de septiembre de 1923, 3:30 h; inscrita el 10 a las 14:25", "lugar": "Trassilico, Lucca", "ref": "acta 10", "fuente": [["Archivo", "Tribunale di Lucca"], ["Fondo", "Vagli Sopra / Vagli di Sotto, Lucca, Toscana — imagen 887 de 2093, grupo de imágenes 007977983"], ["Vía", "FamilySearch"], ["Registrar", "Pasquale Biglini, comisario prefecticio y oficial del estado civil del Comune di Trassilico"]], "literal": "Numero 10 — VANNI ENRICHETTA fu PIETRO, VEDOVA CELERI.\nL'anno millenovecento ventitre, addì dieci di Settembre, a ore pomeridiane due e minuti venticinque, nella Casa Comunale. Avanti di me Biglini Pasquale Commissario Prefettizio ed Ufficiale dello stato civile del Comune di TRASSILICO, sono comparsi Bonetti Angelo di Jacopo, di anni quaranta, agricoltore, domiciliato in Trassilico, e Simoni Cirio fu Egisto, di anni trentadue, bracciante, domiciliato in Trassilico, i quali mi hanno dichiarato che a ore antimeridiane tre e minuti trenta di ieri, nella casa posta in Trassilico in VIA DEL CENTRO al numero diciassette, è morta VANNI ENRICHETTA di anni ottantotto, atta a casa, residente in Trassilico, nata in Trassilico, da fu PIETRO, domiciliato in vita a Trassilico, e da fu RIGHINI LIVIA, domiciliata in vita in detto luogo, MOGLIE DI CELERI CALLISTO. [al margen: anzi VEDOVA]\nA quest'atto sono stati presenti quali testimoni Bonetti Jacopo fu Angelo, di anni settantaquattro, agricoltore, e Paoli Amilcare fu Giacomo, di anni trentadue, falegname, ambi residenti in questo Comune.", "traduccion": "Number 10 — VANNI ENRICHETTA, daughter of the late Pietro, WIDOW CELERI.\n\nIn the year nineteen hundred and twenty-three, on the TENTH OF SEPTEMBER, at twenty-five past two in the afternoon, at the Town Hall. Before me, PASQUALE BIGLINI, prefectural commissioner and registrar of the civil status of the COMUNE OF TRASSILICO, there appeared ANGELO BONETTI, son of Jacopo, aged forty, farmer, resident at Trassilico, and CIRIO SIMONI, son of the late Egisto, aged thirty-two, day labourer, resident at Trassilico.\n\nWho declared to me that AT HALF PAST THREE YESTERDAY MORNING, in the house situated at TRASSILICO, IN VIA DEL CENTRO, NUMBER SEVENTEEN, there died ENRICHETTA VANNI, AGED EIGHTY-EIGHT, keeping her own house, resident at Trassilico, BORN AT TRASSILICO, daughter of the late PIETRO, resident in life at Trassilico, and of the late LIVIA RIGHINI, resident in life in the same place, WIFE OF CALLISTO CELERI. — In the margin, correcting: «rather WIDOW».\n\nPresent as witnesses were JACOPO BONETTI, son of the late Angelo, aged seventy-four, farmer, and AMILCARE PAOLI, son of the late Giacomo, aged thirty-two, carpenter, both resident in this comune.", "notas": ["*** ESTA ES EL ACTA QUE LE PONE PUEBLO A LA RAMA ENTERA. *** Los dos documentos argentinos de su hijo Tebaldo —el matrimonio de 1900 y la defunción de su nieta de 1946— dicen sólo «natural de Italia». Ninguno da el pueblo. Éste sí, y por el camino más indirecto: no es el papel de quien se fue, es el de quien se quedó.", "*** Y CONFIRMA LA MEMORIA FAMILIAR AL PIE DE LA LETRA. *** Gonzalo la recordaba como «Trasilico de Galicanto, Lucca». El acta dice COMUNE DI TRASSILICO, provincia de Lucca. En 1923 Trassilico era municipio propio; se fusionó con GALLICANO poco después. La familia conservó los dos nombres, el del pueblo y el del municipio que se lo tragó, durante cien años y a diez mil kilómetros.", "*** LA CASA: TRASSILICO, VÍA DEL CENTRO, NÚMERO 17. *** Es la única dirección concreta que se conoce de esta rama, y el sitio del que salió Tebaldo hacia Argentina. Trassilico es un pueblo de montaña de la Garfagnana, en el valle del Serchio, bajo los Alpes Apuanos, y cabe entero en doscientos cincuenta metros.\n\nOJO: VIA DEL CENTRO YA NO EXISTE. Trassilico tiene hoy once calles con nombre y ninguna se llama así — los nombres cambiaron, con toda probabilidad al fusionarse el municipio con Gallicano hacia 1928, cinco años después de esta acta. La candidata más firme es la VIA ANTONIO VALLISNERI, que es la calle central del pueblo y lleva el nombre de su hijo ilustre. Todo eso está explicado en la ficha de Tebaldo, con las medidas. En el mapa: https://www.google.com/maps/search/?api=1&query=Trassilico%2C+Gallicano%2C+Lucca%2C+Italia", "«MOGLIE DI CELERI CALLISTO», CORREGIDO AL MARGEN A «ANZI VEDOVA». El escribano escribió primero «esposa» y luego alguien lo enmendó a «viuda». Es la prueba de que Callisto ya había muerto en septiembre de 1923, aunque nadie sepa cuándo.", "SUS PADRES, CONFIRMADOS Y LOS DOS MUERTOS: PIETRO VANNI y LIVIA RIGHINI, ambos de Trassilico. El árbol de FamilySearch la daba hija de Pietro Vanni y «Lucia» Righini; el acta dice LIVIA. Se prefiere el acta.", "SIGUE SIN CONOCÉRSELE UN SOLO HERMANO. Se probó con un «Vanni Maria Francesca di Pietro» del índice de 1863, por si aquel Pietro fuera un hijo del doctor; leída el acta, resultó ser un clavetero de Le Fabbriche hijo de un Francesco. Descartado.", "MURIÓ A LOS OCHENTA Y OCHO AÑOS EN LA CASA EN QUE NACIÓ, en un pueblo del que probablemente no salió nunca. Su hijo llevaba entonces más de cuarenta años en Argentina, y su nieta argentina —a la que no conoció— se llamaba Enriqueta por ella."], "imgs": [{"u": "../actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20Muerte%20de%20Enrichetta%20Vanni%20viuda%20de%20Celeri%20-%20Trassilico%2C%20Lucca%20acta%2010.jpg", "t": "Muerte de Enrichetta Vanni viuda de Celeri - Trassilico, Lucca acta 10"}], "zooms": [{"u": "../actas/1923%20-%20Enrichetta%20Vanni/1923-09-09%20D%20zoom%20-%20acta%2010%20completa%2C%20Trassilico.jpg", "t": "Acta 10 completa, Trassilico"}]}, {"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "30 de enero de 1859 la boda; 4 de febrero el acta civil", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "acta 3", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.1 «Matrimoni» 1859"], ["Registro", "ark an_ua35853344 · hash del contenedor: 03QyK9Z (18 imágenes)"], ["Página", "5 de 18 — el acta 3 ocupa el centro de la hoja"], ["Cómo se localizó", "por el índice alfabético del final (página 18), fila «Celeri Callisto e Vanni Enrichetta — 1859 Febbrajo 4 — effettuazione — 3». Antes se habían descartado 1861 y 1860 leyendo sus índices completos"]], "literal": "3. L'anno 1859 milleottocentocinquantanove, il giorno 4 quattro del mese di Febbrajo. Davanti me sottoscritto Ufficiale dello Stato Civile del Comune di TRASSILICO, Provincia di Garfagnana, è comparso CELERI CALLISTO di anni 28 ventotto, POSSIDENTE E SEGRETARIO DELLA COMUNE, nato e domiciliato in Trassilico, FIGLIO DEL FU DESIDERIO, ed alla presenza di GALANTI ERMENEGILDO figlio del vivo Felice, e di REBECHI GIOVANNI del fu Paolino, ambedue maggiori di età, possidenti e domiciliati in Trassilico, testimoni, ha esposto: che nel giorno 30 trenta Gennajo del corrente anno è stato celebrato il matrimonio di esso comparente colla Signora VANNI ENRICHETTA, FIGLIA DEL FU DR. PIETRO, dell'età di anni 24 ventiquattro, senza professione, nata e domiciliata a Trassilico, davanti il Sig. Don Grandi Parroco…\n\nIl sottoscritto Parroco fa fede che il Sig. CALLISTO figlio del fu DESIDERIO CELERI dell'età di anni 28, nato e domiciliato a Trassilico, POSSIDENTE e SEGRETARIO COMUNALE, e la Sig.ra VANNI ENRICHETTA dell'età di anni 24, nata essa pure e domiciliata a Trassilico, POSSIDENTE, hanno nel giorno 30 trenta Gennajo 1859 celebrato il loro matrimonio giusta i riti della Chiesa cattolica davanti me sottoscritto, e alla presenza di PIETRO fu ANTONIO BONETTI, e PIETRO fu LUIGI MENGHI, testimoni ambedue di Trassilico. Ed in fede, dalla Canonica di Trassilico, oggi 4 Febbrajo 1859. DOMENICO GRANDI Rettore.", "traduccion": "Record 3. The year 1859, the FOURTH OF FEBRUARY. Before me, registrar of the Civil Status of the COMUNE OF TRASSILICO, province of Garfagnana, there appeared CALLISTO CELERI, aged TWENTY-EIGHT, A MAN OF PROPERTY AND TOWN CLERK, born and resident at Trassilico, SON OF THE LATE DESIDERIO.\n\nIn the presence of ERMENEGILDO GALANTI, son of the living Felice, and of GIOVANNI REBECHI, son of the late Paolino, both of full age, men of property and resident at Trassilico, he stated: THAT ON THE THIRTIETH OF JANUARY of the current year his marriage was celebrated with SIGNORA ENRICHETTA VANNI, DAUGHTER OF THE LATE DOCTOR PIETRO, aged TWENTY-FOUR, without profession, born and resident at Trassilico, before signor don Grandi, parish priest.\n\nTHE PARISH PRIEST'S CERTIFICATE: «The undersigned parish priest certifies that signor CALLISTO, son of the late DESIDERIO CELERI, aged twenty-eight, born and resident at Trassilico, A MAN OF PROPERTY and TOWN CLERK, and signora ENRICHETTA VANNI, aged twenty-four, likewise born and resident at Trassilico, A WOMAN OF PROPERTY, celebrated on the thirtieth of January 1859 their marriage according to the rites of the Catholic Church before me, in the presence of PIETRO BONETTI, son of the late Antonio, and PIETRO MENGHI, son of the late Luigi, both witnesses of Trassilico. And in witness whereof, from the parish house of Trassilico, today 4 February 1859. DOMENICO GRANDI, rector.»", "notas": ["*** ES LA BODA QUE SE BUSCABA, Y COSTÓ TRES AÑOS DE ÍNDICES. *** Se descartaron primero 1861 (cuarenta bodas) y 1860, leyendo sus índices alfabéticos completos, antes de dar con ella en 1859. Ese método —una imagen de índice por año en vez de un registro entero— es lo que hizo viable la búsqueda.", "LAS EDADES CUADRAN CON TODO LO DEMÁS. Él, veintiocho en febrero de 1859 → nacido hacia 1830-31, igual que los treinta y uno que declara en 1861 y 1862. Ella, veinticuatro → nacida hacia 1834-35, igual que los veintisiete de 1862 y los ochenta y ocho de su defunción de 1923. Cuatro documentos, sesenta y cuatro años y dos archivos distintos, todos apuntando al mismo par de fechas.", "*** LOS DOS ERAN «POSSIDENTI» — PROPIETARIOS. *** Y ella por derecho propio: la fe del párroco la llama possidente, no «hija de». En un pueblo de montaña donde el acta vecina describe a los novios como «agricoltore» y «agricoltrice», y donde la mayoría firma «per essere illetterato», este matrimonio es el de dos propietarios que saben escribir. Sus dos testigos civiles también son possidenti.", "LO QUE EL ACTA NO DA, Y HAY QUE DECIRLO: NO NOMBRA A LAS MADRES. De él sólo «figlio del fu Desiderio»; de ella sólo «figlia del fu Dr. Pietro». La madre de Callisto sigue sin conocerse. La de Enrichetta —LIVIA RIGHINI— la sabemos por otra vía: su acta de defunción de 1923.", "SE CASARON EN ENERO Y TEBALDO NACIÓ EN JULIO DE 1862 — tres años y medio después. Si no hubo hijos entre medias, y los índices de nacidos de 1861 y 1862 no traen ninguno, quedan por barrer 1859 y 1860.", "DON DOMENICO GRANDI los casó en 1859 y bautizó a Tebaldo en 1862. El mismo cura, en el mismo pueblo, en las dos actas más importantes de esta rama."], "imgs": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20Matrimonio%20de%20Callisto%20Celeri%20y%20Enrichetta%20Vanni%20-%20Trassilico%20acta%203.jpg", "t": "Matrimonio de Callisto Celeri y Enrichetta Vanni - Trassilico acta 3"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20indice%20alfabetico%20de%20matrimonios%201859%20-%20fila%20Celeri%20Callisto%20e%20Vanni%20Enrichetta.jpg", "t": "Indice alfabetico de matrimonios 1859 - fila Celeri Callisto e Vanni Enrichetta"}], "zooms": [{"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20allegato%20tipo%2C%20solo%20la%20fe%20del%20parroco%20transcrita.jpg", "t": "1859 I allegato tipo, solo la fe del parroco transcrita"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859%20I%20zoom%20-%20portada%20de%20un%20fascicolo%20de%20allegati%3A%20ALLEGATI%20N.%202.jpg", "t": "1859 I portada de un fascicolo de allegati: ALLEGATI N. 2"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20acta%203%2C%20Callisto%20figlio%20del%20fu%20Desiderio%20y%20Enrichetta%20figlia%20del%20fu%20Dr%20Pietro.jpg", "t": "Acta 3, Callisto figlio del fu Desiderio y Enrichetta figlia del fu Dr Pietro"}, {"u": "../actas/1859%20-%20Matrimonio%20Callisto%20Celeri%20y%20Enrichetta%20Vanni/1859-01-30%20M%20zoom%20-%20fe%20del%20parroco%20Domenico%20Grandi%2C%20los%20dos%20possidenti.jpg", "t": "Fe del parroco Domenico Grandi, los dos possidenti"}]}], "nActas": 1, "nImgs": 2, "titulo": "", "parrafos": [], "claves": []}, "luisa_vanni": {"id": "luisa_vanni", "nombre": "Luisa Vanni", "legal": "«ALOISA» en el cuerpo del acta; ella firma LUISA", "rol": "hermano", "rolNombre": "Sibling", "gen": 7, "ramas": ["celeri"], "resumen": "Enrichetta's elder sister, and the woman in whose house Tebaldo was born. For days she was only a loose name in the 1862 record; on 27 August 2026 she turned out to be his aunt.", "datos": [["Birth", "hacia 1832, TRASSILICO — los treinta y un años que declara al casarse en abril de 1863"], ["Parents", "el difunto DOTTOR PIETRO VANNI, abogado nacido en Lucca, y LIVIA RIGHINI, nacida en Castelnuovo — LOS MISMOS PADRES QUE ENRICHETTA"], ["Condición", "POSSIDENTE — propietaria, igual que su hermana"], ["Marriage", "26 de abril de 1863 la promesa, 29 la efectuación — Trassilico, actas 3 y 6"], ["Husband", "el DOCTOR MATTEO VINCENTI, de treinta y cuatro años, MÉDICO, nacido y domiciliado en COREGLIA ANTELMINELLI, hijo del difunto Antonio Vincenti y de Elisabetta Serafini, los dos «possidenti»"], ["Su huella en el árbol", "el 25 de julio de 1862, TEBALDO NACIÓ EN SU CASA, en el paraje «Alla Maestà». Diez meses antes de casarse ella"], ["Firma", "firmó el acta de su boda de su puño: «LUISA VANNI»"]], "mapa": null, "sinacta": "", "padre": "pietro_vanni", "madre": "lucia_righini", "conyuge": null, "hijos": [], "hermanos": ["enrichetta_vanni"], "actas": [{"titulo": "Marriage record", "tipo": "M", "tipoNombre": "Marriage", "fecha": "26 de abril de 1863 la promesa; 29 la efectuación", "lugar": "Trassilico, Garfagnana, provincia de Massa", "ref": "actas 3 y 6", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Fondo", "Stato civile della Restaurazione > Trassilico > Registro 53.5 «Matrimoni» 1863"], ["Signatura", "ark:/12657/an_ua35853348 — hash 03QyKYJ, 20 imágenes; el acta en la página 5, el índice en la 20"]], "literal": "", "traduccion": "The year 1863, the 26th day of April. Before me, the undersigned BERTOLI BARSOTTI RANIERI, Mayor and Registrar of the Civil Status of the Comune of Trassilico, Province of Massa, Circondario of the Garfagnana, there appeared:\n\nVINCENTI DOCTOR MATTEO, aged thirty-four, born and resident at COREGLIA ANTELMINELLI, by profession a PHYSICIAN, son of the late VINCENTI ANTONIO, aged eighty-three, a man of property, and of SERAFINI ELISABETTA, aged sixty, likewise of property, both born and resident in the said Coreglia;\n\nand VANNI ALOISA, aged thirty-one, born and resident at Trassilico, A WOMAN OF PROPERTY, DAUGHTER OF THE LATE DOCTOR PIETRO VANNI — by profession a LAWYER, BORN AT LUCCA and resident at Trassilico — AND OF RIGHINI LIVIA, aged fifty, without profession, BORN AT CASTELNUOVO and resident at Trassilico;\n\nwho, in the presence of CELERI CALLISTO, son of the late Desiderio, aged thirty-two, TOWN CLERK, and of BONETTI PIETRO, son of the late Antonio, aged thirty-three, farmer, both born and resident at Trassilico, witnesses, declared to me that it was their intention to be joined in marriage.", "notas": ["*** LUISA VANNI ERA LA HERMANA MAYOR DE ENRICHETTA. *** El acta la llama «Aloisa» en el cuerpo, pero ella firma «LUISA VANNI» de su puño, y la declara hija del difunto doctor Pietro Vanni y de Livia Righini: exactamente los mismos padres.", "*** Y ESO EXPLICA EL DATO MÁS RARO DEL ÁRBOL. *** Tebaldo nació el 25 de julio de 1862 «en casa de Luisa Vanni, Alla Maestà». No era la casa de una vecina: era la casa de su TÍA. Enrichetta fue a parir a casa de su hermana. Diez meses después, Luisa se casaba.", "*** EL PADRE NO ERA MÉDICO, ERA ABOGADO, Y NO ERA DE TRASSILICO. *** «Di professione LEGALE, nato in LUCCA». Se le había tenido por el médico del pueblo porque el acta de Tebaldo lo llama «dottor Pietro» — pero en Italia «dottore» es cualquier titulado. Era hombre de leyes, y venía de la ciudad.", "*** LIVIA RIGHINI ESTABA VIVA, TENÍA CINCUENTA AÑOS Y FIRMÓ. *** Y el acta confirma negro sobre blanco que NACIÓ EN CASTELNUOVO, que era la lectura dudosa del acta de 1860. Su firma y la de su hija son las dos primeras firmas de mujer de esta rama.", "UNA DIFICULTAD QUE NO SE TAPA: del difunto Pietro Vanni el acta dice «de edad de treinta y dos años». Este registro sí da la edad de los padres muertos —al del novio le da ochenta y tres—, pero treinta y dos es incompatible con tener una hija en 1832 y otra en 1835, salvo que muriera hacia 1835 con Luisa de tres años y Enrichetta recién nacida, dejando a Livia viuda a los veintidós. Es posible, pero extraordinario. Puede ser también un desliz del escribano. No se resuelve con este documento.", "CALLISTO CELERI, de treinta y dos años y secretario del ayuntamiento, fue testigo de la boda de su cuñada. Es la séptima muestra conocida de su firma."], "imgs": [{"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20Partida%20de%20bautismo%20de%20Luisa%20Vanni%20-%20Trassilico%2C%20libro%20F%20pag%2026%20n%2068.jpg", "t": "Partida de bautismo de Luisa Vanni - Trassilico, libro F pag 26 n 68"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863%20I%20Indice%20de%20matrimonios%20de%20Trassilico%201863.jpg", "t": "1863 I Indice de matrimonios de Trassilico 1863"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Acta%20notarial%20de%20asenso%20de%20Elisabetta%20Serafini%20-%20Borgo%20a%20Mozzano.jpg", "t": "Acta notarial de asenso de Elisabetta Serafini - Borgo a Mozzano"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-06%20D%20Certificado%20del%20prior%20de%20Coreglia%20sobre%20los%20Vincenti%20-%20tres%20generaciones.jpg", "t": "Certificado del prior de Coreglia sobre los Vincenti - tres generaciones"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20F%20Firmas%20de%20Luisa%20Vanni%20y%20de%20Livia%20Righini%20-%20Trassilico%20acta%203.jpg", "t": "1863-04-26 F Firmas de Luisa Vanni y de Livia Righini - Trassilico acta 3"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20Acta%20de%20matrimonio%20-%20Trassilico%20acta%203.jpg", "t": "Acta de matrimonio - Trassilico acta 3"}], "zooms": [{"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1832-08-08%20N%20zoom%20-%20del%20fu%20avvocato%20Giuseppe%20del%20caporal%20Pietro%20Vanni.jpg", "t": "Del fu avvocato Giuseppe del caporal Pietro Vanni"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20el%20padre%2C%20dottor%20Pietro%20Vanni%2C%20nacido%20en%20LUCCA%20y%20de%20profesion%20legal.jpg", "t": "El padre, dottor Pietro Vanni, nacido en LUCCA y de profesion legal"}, {"u": "../actas/1863%20-%20Luisa%20Vanni%20y%20el%20doctor%20Vincenti/1863-04-26%20M%20zoom%20-%20la%20madre%2C%20Livia%20Righini%20de%2050%20anios%2C%20nacida%20en%20Castelnuovo.jpg", "t": "La madre, Livia Righini de 50 anios, nacida en Castelnuovo"}]}], "nActas": 1, "nImgs": 9, "titulo": "", "parrafos": [], "claves": []}, "caporal_pietro_vanni": {"id": "caporal_pietro_vanni", "nombre": "Pietro Vanni, el cabo", "legal": "«del caporal Pietro» en la partida de 1832", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 4, "ramas": ["celeri"], "resumen": "The oldest ancestor of the whole maternal branch, and the only soldier in the tree. He surfaced on 27 August 2026, in four words of a baptismal record of 1832.", "datos": [["Quién era", "padre del ABOGADO GIUSEPPE VANNI y bisabuelo de Enrichetta"], ["Trade", "*** CAPORALE — cabo. *** Es el único militar documentado en todo el árbol"], ["Birth", "sin fecha. Si su bisnieta nació en 1832 y su hijo ya había muerto para entonces, él nacería hacia 1740-1760"], ["Su nombre viajó", "su nieto se llamó PIETRO por él — la costumbre italiana de poner al primer varón el nombre del abuelo paterno"], ["Where this comes from", "partida de bautismo de su bisnieta LUISA VANNI — Trassilico, libro de bautizados «Lettera F», página 26, asiento 68, copiada en 1863"]], "mapa": null, "sinacta": "Existe por cuatro palabras: «del caporal Pietro». Pero con él la rama materna llega al siglo XVIII.\n\nUN CABO, UN ABOGADO, UN ABOGADO Y UNA MAESTRA DE CASA. La secuencia de tres generaciones que sale de esta partida dice mucho de una familia que sube: el padre es militar de tropa, el hijo se hace abogado, el nieto también, y el nieto se casa con la hija de otro propietario y sube a un pueblo de montaña a ejercer.\n\nDÓNDE BUSCARLO. Su nieto Pietro NACIÓ EN LUCCA, así que lo más probable es que esta familia fuera de la ciudad. Todo lo suyo estaría en el Archivio di Stato di Lucca o en el Archivio Storico Diocesano de Lucca — no en Massa.", "padre": null, "madre": null, "conyuge": null, "hijos": ["giuseppe_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "teresa_vanni": {"id": "teresa_vanni", "nombre": "Teresa", "legal": "«comare Teresa madre di detto Dottor Vanni»", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Wife of the lawyer Giuseppe Vanni and mother of Doctor Pietro. In August 1832 she held her granddaughter Luisa at the font.", "datos": [["Quién era", "mujer del ABOGADO GIUSEPPE VANNI, madre del DOCTOR PIETRO VANNI"], ["Viva en", "9 de agosto de 1832, cuando fue MADRINA de su nieta Luisa — y ya viuda, porque a su marido la partida lo llama «il fu»"], ["Apellido", "SE DESCONOCE. La partida sólo la llama «Teresa, madre del dicho doctor Vanni»"], ["Su nombre viajó", "su nieta se llamó ALOISA **TERESA** por ella"], ["Where this comes from", "partida de bautismo de Luisa Vanni, Trassilico, 9 de agosto de 1832"]], "mapa": null, "sinacta": "De ella se sabe el nombre de pila, que estaba viva y viuda en 1832, y que fue madrina de su nieta. Nada más — ni apellido, ni pueblo, ni fechas.\n\nSU APELLIDO ESTARÍA en el acta de matrimonio de su hijo Pietro con Livia Righini, hacia 1830, o en la partida de bautismo del propio Pietro, hacia 1808 y probablemente en LUCCA. Ninguna de las dos está localizada.", "padre": null, "madre": null, "conyuge": "giuseppe_vanni", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "bernardo_righini": {"id": "bernardo_righini", "nombre": "Bernardo Righini", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Livia Righini, of Castelnuovo. He surfaced on 27 August 2026, in his granddaughter Luisa's baptismal record.", "datos": [["Quién era", "padre de LIVIA RIGHINI y abuelo materno de Enrichetta Vanni"], ["Village", "CASTELNUOVO — la partida dice «Livia del fu Bernardo Righini di Castelnuovo». Es la tercera vez que un documento sitúa a esta familia allí"], ["Dead before", "agosto de 1832 — la partida ya lo llama «il fu»"], ["Birth", "hacia 1780 o antes, si su hija nació hacia 1813"], ["Where this comes from", "partida de bautismo de su nieta LUISA VANNI, Trassilico, 9 de agosto de 1832"]], "mapa": null, "sinacta": "Existe por cinco palabras: «del fu Bernardo Righini di Castelnuovo».\n\nY CON ÉL LA BÚSQUEDA SE MUDA DE PUEBLO. Livia era de CASTELNUOVO DI GARFAGNANA, la capital del valle, no de Trassilico. Su nacimiento hacia 1813, su boda con el doctor Pietro Vanni hacia 1830 y todo lo de Bernardo estarían en los registros de Castelnuovo — otro comune, otro fondo.\n\nHAY ADEMÁS OTRO RIGHINI SUELTO: el padrino de Luisa fue GIOVANNI DI CARLO RIGHINI. Hijo de un Carlo, y casi seguro pariente de Livia — un hermano suyo o un primo.", "padre": null, "madre": null, "conyuge": null, "hijos": ["lucia_righini"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "giuseppe_vanni": {"id": "giuseppe_vanni", "nombre": "Giuseppe Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 5, "ramas": ["celeri"], "resumen": "Father of Doctor Pietro Vanni, and the oldest documented ancestor of the whole maternal branch. He surfaced on 27 August 2026, in three words of a parish record of 1841.", "datos": [["Trade", "*** ABOGADO — «AVVOCATO GIUSEPPE». *** Lo dice la partida de bautismo de su nieta Luisa, de 1832. Dos generaciones seguidas de hombres de leyes: él y su hijo Pietro"], ["Father", "*** EL CABO PIETRO VANNI *** — «del caporal Pietro». El único militar del árbol, y el antepasado más antiguo de toda la rama materna"], ["Spouse", "TERESA, viva en 1832, cuando fue madrina de su nieta Luisa. Se le conoce el nombre de pila pero no el apellido"], ["Quién era", "padre del DOCTOR PIETRO VANNI, abogado, nacido en LUCCA hacia 1808-1809"], ["Dead before", "AGOSTO DE 1832 — la partida de su nieta lo llama ya «il fu avvocato Giuseppe»"], ["Birth", "hacia 1780 o antes, si su hijo nació hacia 1808"], ["Dónde vivía", "sin determinar. Su hijo NACIÓ EN LUCCA, la ciudad, así que la familia podría ser de allí y no de la montaña"], ["Where this comes from", "partida de defunción de su hijo — parroquia de los SS. Pietro e Paolo de Trassilico, libro de difuntos «Lettera D», página 32, asiento 182, copiada en 1863 dentro del expediente de boda de su nieta Luisa"]], "mapa": null, "sinacta": "Existe por cuatro palabras: «figlio del fu Giuseppe Vanni». Pero esas cuatro palabras suben una generación entera y llevan la rama materna hasta el siglo XVIII.\n\nDÓNDE BUSCARLO. Su hijo Pietro NACIÓ EN LUCCA —lo dice el acta de matrimonio de Luisa, de 1863—, así que lo más probable es que esta familia no fuera de Trassilico sino de la ciudad, y que Pietro subiera a la montaña ya hecho abogado. Si es así, el bautismo de Pietro, hacia 1808, y todo lo de Giuseppe estarían en LUCCA: en el Archivio di Stato di Lucca o en el Archivio Storico Diocesano de la ciudad, no en Massa.\n\nESO ABRE UN FRENTE NUEVO Y ENTERO. Hasta ahora esta rama estaba encerrada en un pueblo de cien vecinos; con Giuseppe Vanni se muda a una ciudad con archivos que empiezan en la Edad Media.", "padre": "caporal_pietro_vanni", "madre": null, "conyuge": null, "hijos": ["pietro_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "pietro_vanni": {"id": "pietro_vanni", "nombre": "Pietro Vanni", "legal": "", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Of Trassilico, in the Garfagnana. Father of Enrichetta Vanni and great-great-grandfather of Gonzalo's paternal grandfather.", "datos": [["Trade", "*** ABOGADO, NO MÉDICO. *** «Di professione LEGALE», dice el acta de matrimonio de su hija Luisa, de abril de 1863. Durante días se le tuvo por el médico del pueblo porque el acta de su nieto Tebaldo lo llama «dottor Pietro» — pero en Italia «dottore» es cualquier titulado. Era hombre de leyes"], ["Village", "*** NACIÓ EN LUCCA ***, la ciudad, y se domicilió en TRASSILICO. Era el forastero con carrera que sube a un pueblo de montaña"], ["Birth", "hacia 1805, si su hija nació en 1835 — pero ver la nota sobre su edad"], ["*** MUERTE ***", "*** 22 DE MARZO DE 1841, y sepultado el 23 ***. Lo dice su partida parroquial, copiada en 1863: «morì ieri, e oggi previe solenni esequie, è stato sepolto»"], ["Father", "*** GIUSEPPE VANNI ***, ya difunto en 1841 — el ascendiente más antiguo documentado de esta rama"], ["Edad al morir", "TREINTA Y DOS años, según el acta de matrimonio de su hija Luisa → nacido hacia 1808-1809"], ["Spouse", "LIVIA RIGHINI, nacida en CASTELNUOVO hacia 1813"], ["Daughters", "LUISA (hacia 1832) y ENRICHETTA (hacia 1835) — las dos «possidenti»"], ["Dead before", "septiembre de 1923 — el acta de su hija lo llama «fu Pietro»"], ["Where this comes from", "acta de defunción de su hija: Trassilico, 9 de septiembre de 1923, acta 10"], ["*** Y TAMPOCO CON SU PROPIO SUEGRO HOMÓNIMO ***", "su padre se llamaba GIUSEPPE VANNI, y en LE FABBRICHE hay OTRO GIUSEPPE VANNI, clavetero, con hijos documentados en 1858 y 1859. No son el mismo hombre: el nuestro es el padre de un licenciado nacido en Lucca; el otro, un artesano de una aldea de forja"], ["*** UN PIETRO VANNI QUE SE CASA EN 1864 NO ES ÉL ***", "el índice de matrimonios de 1864 trae un VANNI PIETRO casándose con Barsotti Giovanna (acta 10). Durante un día quedó como pregunta abierta, y no lo era: *** él murió el 22 de marzo de 1841 ***, así que ese novio es forzosamente otro — con toda probabilidad el «Pietro Vanni fu Francesco, chiodajuolo di Le Fabbriche» ya descartado en 1863"], ["*** NO CONFUNDIR CON LOS OTROS VANNI ***", "en el mismo municipio hay una familia VANNI entera, numerosa y sin parentesco: los CLAVETEROS DE LE FABBRICHE"]], "mapa": null, "sinacta": "*** EN TRASSILICO HAY DOS FAMILIAS VANNI QUE NO TIENEN NADA QUE VER, Y CONFUNDIRLAS CUESTA DÍAS. *** **LOS NUESTROS** son los VANNI DEL PUEBLO: él, ABOGADO —«di professione LEGALE»— y **NACIDO EN LUCCA**, un forastero con carrera; su mujer LIVIA RIGHINI, de Castelnuovo; y sus hijas ENRICHETTA y LUISA, las dos «POSSIDENTI».\n\n**LOS OTROS** son los VANNI DE LE FABBRICHE: **CHIODAJUOLI, claveteros**, que hacían clavos a mano. Le Fabbriche —«las herrerías»— era un pueblo de forja y allí el oficio pasaba de padre a hijo. Han salido ya cuatro: Pietro fu Francesco (1863), y ANGELO con sus hijos ROSA y PIETRO, casados con cuatro días de diferencia en mayo de 1864. *** UN VANNI DE LE FABBRICHE NO ES DE ESTA FAMILIA. ***\n\nCONFIRMADO POR ACTA, aunque no por la suya: el acta de defunción de su hija, en 1923, lo da por padre, lo sitúa en Trassilico y lo declara muerto («fu Pietro», «domiciliato IN VITA a Trassilico»).\n\nEs, con su mujer, la generación más antigua documentada de la rama Celeri: nacido hacia 1805, en un pueblo de los Alpes Apuanos. Todo lo suyo estaría en los libros parroquiales de Trassilico.\n\n*** LA BÚSQUEDA CIVIL ESTÁ CERRADA, Y CON RESULTADO. *** El acta de matrimonio de su hija, del 4 de febrero de 1859, ya lo llama «fu dottor Pietro». Y a 27 de agosto de 2026 están leídos enteros los índices de difuntos de LOS ONCE AÑOS QUE EXISTEN —1852, 1853, 1854, 1855, 1856, 1857, 1858, 1859, 1860, 1861 y 1865—: en ninguno aparece. Como el registro civil de Trassilico empieza en 1852, MURIÓ ANTES DE 1852 y su acta es PARROQUIAL, no civil — SS. Pietro e Paolo de Trassilico, que desde 1853 depende de la Diócesis de MASSA y no de la de Lucca.\n\nSE EXAMINÓ Y SE DESCARTÓ UN CANDIDATO QUE PARECÍA BUENO: «VANNETTI PIETRO fu Giovanni», muerto el 21 de febrero de 1852 (acta 4). No es él, por dos razones. VANNETTI y VANNI son apellidos distintos en estos mismos índices —en 1859 conviven un Vanni y tres Vannetti—; y sobre todo, estos índices SÍ escriben el título de doctor cuando lo hay: en el de 1855 constan «Barsotti DOTT. Roberto» y «Barsotti DOTT. Michele». El médico del pueblo habría llevado su «Dott.» igual que los Barsotti.\n\n*** Y EL 27 DE AGOSTO POR LA NOCHE SE ABRIÓ UNA PUERTA QUE PARECÍA CERRADA. *** Se había concluido —y sigue siendo cierto— que murió antes de 1852 y que su acta es parroquial, no civil. Pero eso ya no significa que sea inalcanzable. Los ALLEGATI de los matrimonios de Trassilico TRANSCRIBEN LITERALMENTE las partidas de los libros parroquiales, con el número y la página del libro original, y alcanzan años en que no había registro civil. Está comprobado: en el legajo de 1863 hay un extracto del «registro dei Morti della Chiesa di S. Michele Arcangelo di Vallico Sopra, partita n. 358, pagina 88», copiado por el párroco y visado por el alcalde.\n\n*** Y CONSTA QUE LA SUYA SE ADJUNTÓ. *** El acta de matrimonio de su hija LUISA, de abril de 1863, dice que se entregaron «le fedi pure autentiche della morte del Vincenti Antonio, DEL VANNI DOTTOR PIETRO». Su partida de defunción está, por tanto, dentro de ese expediente. Y por el mismo razonamiento debería estar también en los ALLEGATI DEL MATRIMONIO DE CALLISTO Y ENRICHETTA, del 4 de febrero de 1859 — junto con las de DESIDERIO CELERI y ANGELA MENGHI.\n\nESO CONVIERTE LOS ALLEGATI DE MATRIMONI DE 1859 EN EL OBJETIVO PRINCIPAL DE TODO EL PROYECTO.\n\nSu acta de defunción es de las más valiosas que quedan en todo el árbol: nombraría a SUS padres, y siendo médico rural podría además revelar que vino de otro pueblo. Un médico en un sitio de cien vecinos rara vez había nacido allí.\n\nSE PROBÓ UNA PISTA Y SALIÓ MAL, Y CONVIENE DEJARLO ESCRITO. El índice de nacidos de Trassilico de 1863 registra en el acta 2 a una VANNI MARIA FRANCESCA «di PIETRO», y como el doctor ya estaba muerto desde antes de 1859, pareció que podía tratarse de un hijo suyo del mismo nombre, es decir un hermano de Enrichetta. Se leyó el acta entera: NO ES ÉL NI ES PARIENTE. Aquel hombre es «VANNI PIETRO FU FRANCESCO», de cuarenta y un años, CHIODAJUOLO —clavetero—, domiciliado en LE FABBRICHE y casado con una Rosa Vanni hija de Cristoforo Rigali. Padre distinto, oficio distinto, aldea distinta.\n\nLA LECCIÓN VALE PARA TODO EL ÁRBOL: el índice sólo escribe «di Pietro». En un pueblo donde Vanni es apellido corriente, la coincidencia de un nombre de pila no prueba absolutamente nada hasta que se lee el acta.", "padre": "giuseppe_vanni", "madre": null, "conyuge": "lucia_righini", "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [{"titulo": "Parish death certificate", "tipo": "D", "tipoNombre": "Death", "fecha": "22 de marzo de 1841; sepultado el 23", "lugar": "Trassilico — parroquia de los SS. Apóstoles Pedro y Pablo", "ref": "libro de difuntos «Lettera D», página 32, asiento 182", "fuente": [["Archivo", "Archivio di Stato di MASSA (archivio 240)"], ["Dónde apareció", "no en un registro de defunciones, sino DENTRO DEL EXPEDIENTE DE LA BODA DE SU HIJA LUISA: Trassilico, Matrimoni allegati 1863, Registro 64.11, página 103 de 119"], ["Signatura", "ark:/12657/an_ua35853779 — hash Lok9x2p"]], "literal": "", "traduccion": "I, the undersigned Parish Priest, certify that from the BOOK OF THE DEAD of this my Church erected under the title of the HOLY APOSTLES PETER AND PAUL, marked with the LETTER D, at page 32, number 182, the following appears:\n\nON 23 MARCH 1841. DOCTOR PIETRO, SON OF THE LATE GIUSEPPE VANNI, fortified with the sacraments of confession, communion and the commendation of the soul, DIED YESTERDAY, and today, after solemn obsequies, has been buried. I so certify, DOMENICO GRANDI, Rector.\n\nAnd in witness that I have extracted it from an authentic book. Trassilico, 25 April 1863.\n\nOn 26 April 1863. Seen, the signature and standing of signor Dom. Grandi are certified true. The Mayor, R. Bertoli Barsotti.", "notas": ["*** MURIÓ EL 22 DE MARZO DE 1841. *** Hasta hoy sólo se sabía que estaba muerto «antes de 1859». Ahora hay día.", "*** Y APARECE SU PADRE: GIUSEPPE VANNI ***, ya difunto en 1841. Es el ascendiente más antiguo documentado de toda la rama materna.", "*** SE RESUELVE UNA DIFICULTAD QUE SE HABÍA DEJADO ABIERTA. *** El acta de matrimonio de su hija Luisa, de 1863, le daba «edad de treinta y dos años», cifra que parecía imposible con hijas nacidas en 1832 y 1835. No lo es: si murió en marzo de 1841 con treinta y dos, nació hacia 1808-1809, tuvo a Luisa a los veintitrés y a Enrichetta a los veintiséis. El escribano no se equivocaba; faltaba el dato.", "*** Y ENTONCES LIVIA RIGHINI ENVIUDÓ A LOS VEINTIOCHO AÑOS ***, con Luisa de nueve y Enrichetta de seis. No volvió a casarse: en 1863, con cincuenta, sigue firmando «Righini Livia». Veintidós años de viudedad, y le quedaban muchos más.", "*** DÓNDE APARECIÓ, QUE ES LA LECCIÓN. *** No en un registro de defunciones —murió once años antes de que existiera el registro civil de Trassilico— sino DENTRO DEL EXPEDIENTE DE LA BODA DE SU HIJA, en 1863. Los allegati transcriben literalmente las partidas parroquiales, con libro, página y número. Por esa misma vía hay que buscar a DESIDERIO CELERI y a ANGELA MENGHI.", "LA REFERENCIA EXACTA DEL LIBRO ORIGINAL: parroquia de los SS. Pietro e Paolo de Trassilico, libro de difuntos «Lettera D», página 32, asiento 182. Con eso se puede pedir el libro entero al Archivio Diocesano di Massa.", "LO FIRMA DON DOMENICO GRANDI, el mismo cura que casó a Callisto y Enrichetta en 1859, bautizó a Tebaldo en 1862 y casó a Desiderio Celeri en 1863. En 1841 ya era rector: veintidós años después copió de su propio libro una partida que él mismo había escrito de joven."], "imgs": [{"u": "../actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20Partida%20de%20defuncion%20parroquial%20-%20Trassilico%2C%20libro%20D%20pag%2032%20n%20182.jpg", "t": "Partida de defuncion parroquial - Trassilico, libro D pag 32 n 182"}, {"u": "../actas/1841%20-%20Pietro%20Vanni/1863-04%20D%20Consentimiento%20notarial%20de%20Elisabetta%20viuda%20Vincenti%20-%20mismo%20expediente.jpg", "t": "Consentimiento notarial de Elisabetta viuda Vincenti - mismo expediente"}], "zooms": [{"u": "../actas/1841%20-%20Pietro%20Vanni/1841-03-22%20D%20zoom%20-%20hijo%20del%20difunto%20GIUSEPPE%20VANNI.jpg", "t": "Hijo del difunto GIUSEPPE VANNI"}]}], "nActas": 1, "nImgs": 3, "titulo": "", "parrafos": [], "claves": []}, "lucia_righini": {"id": "lucia_righini", "nombre": "Livia Righini", "legal": "«Lucia Righini» en el árbol de FamilySearch; el acta dice LIVIA", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 6, "ramas": ["celeri"], "resumen": "Of Trassilico. Mother of Enrichetta Vanni. Her name was written wrongly until the record turned up.", "datos": [["Name", "LIVIA, según el acta de defunción de su hija. El árbol de FamilySearch la llama «Lucia»: se prefiere el acta"], ["Village", "*** NACIÓ EN CASTELNUOVO ***, no en Trassilico. Lo dice el acta de nacimiento de su nieto Giuseppe, de 1860: de sus consuegros, «il primo nato e domiciliato in Trassilico, e LA SECONDA NATA IN CASTELNUOVO e domiciliata in Trassilico». Vivió y murió en Trassilico"], ["Birth", "hacia 1813 — los CINCUENTA años que declara en la boda de su hija Luisa, en abril de 1863"], ["Viva en", "abril de 1863, cuando FIRMÓ DE SU PUÑO el acta de matrimonio de Luisa; y en 18 de noviembre de 1860 — el acta de su nieto la nombra «la Sig.ra Livia Righini», SIN el «fu» que sí lleva su marido"], ["Father", "*** BERNARDO RIGHINI, de CASTELNUOVO ***, ya difunto en agosto de 1832"], ["Spouse", "PIETRO VANNI"], ["Daughter", "ENRICHETTA VANNI (hacia 1835 – 1923)"], ["Dead before", "septiembre de 1923 — el acta de su hija dice «da FU Righini Livia»"]], "mapa": null, "sinacta": "CONFIRMADA POR ACTA: la de defunción de su hija, Trassilico 1923, que la da por madre, muerta y vecina del mismo pueblo.\n\nRIGHINI es apellido toscano y emiliano, y encaja con la Garfagnana. Junto con VANNI, son los dos apellidos que ya antes de aparecer este documento apuntaban a la Toscana cuando todavía no había nada que lo probara.\n\n*** Y EL 27 DE AGOSTO DE 2026 SALIÓ DEL PUEBLO. *** El acta de nacimiento de su nieto Giuseppe —Trassilico, 18 de noviembre de 1860, acta 76— dice que de los padres de Enrichetta «el primero nació y está domiciliado en Trassilico, y LA SEGUNDA NACIÓ EN CASTELNUOVO y está domiciliada en Trassilico». Es la primera vez que esta rama pisa otro pueblo. Castelnuovo di Garfagnana es la capital del valle, a unos diez kilómetros: la mujer del médico venía del pueblo grande.\n\nLA LECTURA ES MUY PROBABLE, NO SEGURA. La palabra lleva una ligadura «st» que a primera vista parece una doble ese. Se comparó el trazo con el «Trassilico» de la misma línea, donde la doble ese es corta y apretada, mientras que aquí hay dos astas altas — lo que apunta a CA-ST-E-L-NUOVO. Convendría reconfirmarlo en otro acta.\n\nSI SE CONFIRMA, LA BÚSQUEDA SE MUDA: su nacimiento, hacia 1810, y su boda con el doctor Pietro Vanni, hacia 1830, habría que buscarlos en CASTELNUOVO DI GARFAGNANA y no en Trassilico. Y estaba VIVA en noviembre de 1860, así que su defunción cae entre esa fecha y 1923.", "padre": "bernardo_righini", "madre": null, "conyuge": "pietro_vanni", "hijos": ["enrichetta_vanni", "luisa_vanni"], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "domingo_alasia": {"id": "domingo_alasia", "nombre": "Domingo Alasia", "legal": "«Don Domingo Alasia» en el acta de 1900; ALAZIO DOMINGO en el censo", "rol": "hermano", "rolNombre": "Sibling", "gen": 8, "ramas": ["celeri"], "resumen": "Margarita's elder brother. Born in Piedmont, emigrated as a child, and the man who thirteen years later signed as a witness at his little sister's wedding.", "datos": [["Birth", "hacia 1863, en ITALIA — los veinticuatro años que declara en el censo de 1887. Es el mayor de los hijos documentados"], ["Emigration", "de niño, con sus padres, entre 1872 y 1876"], ["En 1887", "vive en COLONIA EMILIA con sus padres, ya casado, con su mujer MARÍA MOLINA y dos hijos"], ["Spouse", "MARÍA MOLINA, italiana, de veintitrés años en 1887"], ["Parents", "BENEDETTO ALASIA y MADALENA BERTINA"], ["Su huella en el árbol", "el 25 de octubre de 1900 fue TESTIGO de la boda de Margarita con Tebaldo Celeri, en Vera. Su mujer firmó con él"]], "mapa": null, "sinacta": "No tiene acta propia todavía, pero está probado por dos documentos que se cruzan: el censo de 1887 lo pone como hijo de Benedetto y Madalena, y el acta de matrimonio de 1900 lo pone como testigo de su hermana.\n\nFUE ÉL QUIEN CERRÓ LA IDENTIFICACIÓN DE TODA ESTA RAMA. Durante días hubo dudas sobre si los Alasia del árbol eran de verdad los padres de Margarita. Lo que lo zanjó no fue una fecha: fue ver que los dos testigos que firman la boda de 1900 —«Don Domingo Alasia y Doña María de Alasia»— estaban trece años antes sentados a la mesa de la misma casa, en el censo, como hijo y nuera.", "padre": "benedetto_alasia", "madre": "maria_maddalena_bertino", "conyuge": "maria_molina", "hijos": [], "hermanos": ["margarita_alasia"], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "maria_molina": {"id": "maria_molina", "nombre": "María Molina", "legal": "«Doña María de Alasia» en el acta de 1900", "rol": "conyuge", "rolNombre": "Spouse", "gen": 8, "ramas": ["celeri"], "resumen": "Wife of Domingo Alasia and Margarita's sister-in-law. She signed as a witness at the 1900 wedding.", "datos": [["Birth", "hacia 1864, en ITALIA — los veintitrés años del censo de 1887"], ["Spouse", "DOMINGO ALASIA"], ["Children", "dos ya en 1887"], ["En el acta de 1900", "«Doña MARÍA DE ALASIA» — la fórmula argentina de la mujer casada"]], "mapa": null, "sinacta": "Aparece en el censo de 1887 como NUERA en casa de Benedetto Alasia, y en el acta de matrimonio de 1900 como testigo. Nada más se sabe de ella todavía: faltan sus padres, su pueblo y la fecha de su boda con Domingo, que sería anterior a 1885.", "padre": null, "madre": null, "conyuge": "domingo_alasia", "hijos": [], "hermanos": [], "actas": [], "nActas": 0, "nImgs": 0, "titulo": "", "parrafos": [], "claves": []}, "benedetto_alasia": {"id": "benedetto_alasia", "nombre": "Benedetto Alasia", "legal": "«Don Benito Alasia» en el acta de 1900", "rol": "ascendiente", "rolNombre": "Ancestor", "gen": 7, "ramas": ["celeri"], "resumen": "A Piedmontese from Savigliano, a settler in Santa Fe. Father of Margarita and great-grandfather of Marcos César Rivas.", "datos": [["Birth", "1822, según el árbol de FamilySearch"], ["Death", "1892, misma fuente"], ["Marriage", "13 de abril de 1857, iglesia de SAN GIOVANNI BATTISTA, SAVIGLIANO, provincia de CUNEO, PIAMONTE"], ["Spouse", "MARIA MADDALENA BERTINO (1839-1899)"], ["Parents", "BARTOLOMEO ALLASIA y LUCIA GAIDO, por el árbol de FamilySearch"], ["Daughter", "MARGARITA ALASIA, nacida hacia 1882 en Colonia Emilia, Santa Fe"], ["Apellido", "ALLASIA en Piamonte, ALASIA en Argentina — se perdió una ele por el camino"]], "mapa": null, "sinacta": "*** CONFIRMADO EL 27 DE AGOSTO DE 2026, Y POR UN DOCUMENTO, NO POR UN PARECIDO. *** El censo provincial de Santa Fe de junio de 1887 tiene, en COLONIA EMILIA, tomo 12, libreto 12, esta casa entera: OLAZIO BENEDETTO, de SESENTA Y CINCO años, italiano, cabeza de familia; BERTINA MADALENA, de CUARENTA Y SIETE, su mujer, QUE DECLARA CATORCE HIJOS; y de ellos ALAZIO DOMINGO, de veinticuatro y casado, con su mujer MOLINA MARÍA al lado, más Nicolás, Juan, Francisco, María, MARGARITA DE CINCO AÑOS NACIDA EN SANTA FE, y Madalenia de uno.\n\n*** Y EL 29 DE AGOSTO, AL RELEER ESA FICHA CON LOS CAMPOS QUE EL CENSO SÍ PUBLICA Y QUE SE ESTABAN PERDIENDO, SALIÓ MÁS. *** Él consta *** PATRÓN *** —colono con tierra, no jornalero— y *** ni él ni su mujer sabían leer ni escribir ***; ella declara los catorce hijos y *** treinta y un años de casada ***, que sitúan la boda en 1856, a un año del 13 de abril de 1857 que dice el acta. Y su hijo Domingo declara *** dos años de casado ***: se casó con María Molina en 1885, no «hacia 1885-86».\n\n*** Y HAY OTRAS DOS CASAS ALASIA EN LA MISMA COLONIA, Y AHORA SE PUEDE DECIR ALGO DE ELLAS. *** Una es la de ALACIO DOMINGO, de sesenta y cuatro años —uno menos que él—, también patrón, casado con una Luigia que declara ocho hijos y *** treinta y dos años de casada, o sea boda en 1855, un año antes que la suya ***. Dos hombres de la misma edad, casados en años consecutivos, patrones los dos, en un pueblo de cien casas: parece de manual que fueran hermanos. La otra es la de ALAZIO JUAN, de cuarenta y cinco, patrón y analfabeto como él, casado en 1872 con Lucia Silvestre, con siete hijos todos nacidos ya en Santa Fe — un hogar que hasta hoy no estaba anotado en ninguna parte.\n\n*** PERO EL TEST DE LOS NOMBRES DICE QUE NO SON HERMANOS SUYOS. *** La costumbre manda que el primer hijo varón lleve el nombre del abuelo paterno, y él la cumple al pie de la letra: su padre se llamaba BARTOLOMEO y su hijo mayor se llama BARTOLOMEO. Si Domingo y Juan fueran hermanos suyos, sus primeros varones deberían llamarse igual — y *** el mayor de Alacio Domingo es TOMASO y el de Alazio Juan es ANGELO. *** Lo más probable es que fueran primos: tres familias Alasia del mismo valle piamontés llegadas a la misma colonia, que es como funcionaban esas cadenas. No es prueba —la costumbre sólo obliga con el primer varón, y un niño muerto pequeño rompe la serie— pero por primera vez la pregunta deja de estar en «no se puede decidir».\n\n\n\nLAS HIJAS QUE FALTAN: UNA VÍA MÁS QUE SE CIERRA (29 de agosto de 2026). Magdalena declaró CATORCE hijos y sólo ocho aparecen vivos en el censo. Las hijas casadas se pierden porque el padrón las apunta con el apellido del marido y no da el de soltera. El blog de Hugo Alloa, hecho sobre las actas de la parroquia de Emilia, nombra nueve apellidos que emparentaron con los Allasia — BARONI, BUSATTO, CHARTIER, DACARRO, GIUPPONI, PALMIER, RONZONI, ROSSINI y ZANUTICH — y se buscó en sus casas a una mujer italiana de la edad justa. Hay 92 personas de esos apellidos en la colonia, 17 mujeres casadas, y NINGUNA pasa: dos son francesas, seis nacieron antes de 1856 (o sea antes de la boda de Benedetto, y no pueden ser hijas suyas), y ocho incumplen la costumbre italiana de los nombres, porque su segundo varón debería llamarse Benito y ninguno se llama así. De hecho NO HAY UN SOLO NIETO LLAMADO BENITO en las 1.385 fichas de la colonia: los cinco Benito o Benedetto que salen son el propio Benedetto (indexado OLAZIO), un hombre de 32 años, un niño francés, un recién nacido y una niña de ocho a la que el padrón apuntó como varón. Queda UNA sin poder juzgar: BARONI TERESA, 25 años, casada en 1884, la única de las diecisiete que declara «Italia, TORINO», que es de donde son los Alasia — pero tiene un solo hijo, y sin segundo varón la costumbre no dice nada. Ni descartada ni confirmada. Y tres de los nueve apellidos —DACARRO, GIUPPONI y ZANUTICH— NO EXISTEN en la colonia en 1887, luego esas bodas son posteriores al censo. ESTO NO PRUEBA que ninguna hija se casara con un Baroni o un Rossini: prueba que el censo no puede identificarla. Lo deciden las actas de la parroquia de Emilia, ya pedidas por carta.*** Y MÁS TARDE EL MISMO DÍA SE BAJÓ EL PADRÓN ENTERO DE LA COLONIA —1.368 personas, con los doce campos— y el test de los nombres dejó de ser un sondeo. *** Filtrando por quién podía ser hija suya —italiana, nacida después de 1858, casada después de 1873— salen *** CINCUENTA Y NUEVE mujeres ***, no las ocho de los nueve apellidos que se venían mirando. Y buscando en las 1.368 fichas todos los Benito, Benedetto, Magdalena y Bartolomeo aparecen diez personas, de las que *** ninguna es nieta suya ***: él y su mujer, su hija menor Madalenia, la niña de la casa Bertino, dos criaturas de casas criolla y suiza, un hombre adulto y dos Maddalena nacidas ya en Italia.\n\n*** No hay un solo nieto llamado Benito en toda Colonia Emilia. *** El negativo es exhaustivo, no una muestra — aunque sólo es concluyente para las catorce mujeres casadas antes de 1880 y con tres hijos o más; en las casadas después el segundo varón aún no había nacido en 1887, y para ésas queda la prueba del censo de 1895.\n\n*** Y eso dice algo sobre los cuatro hijos que le faltan: no son hijas casadas viviendo en la colonia. *** Sumado a que los tres mayores no aparecen en toda la provincia, la explicación más económica —y es deducción, no hecho— es que buena parte de los catorce murió de niño. Que una mujer casada en 1857 declarase catorce partos y sólo diez hijos identificables era lo normal, no la excepción.\n\n*** Y HAY UNA SEGUNDA PUERTA, QUE SE ABRIÓ AL LISTAR LOS TRECE «SOBRINOS» DE LA COLONIA. *** En casa de los Chartier vive una niña de tres años registrada como *** «ALASIA LUISA, sobrina» ***, nacida en Santa Fe. Que el empadronador le pusiera un apellido DISTINTO del cabeza de casa es un acto deliberado: Luisa no es Chartier, es Alasia. Y si es sobrina de esa casa y se apellida así, lo es por parte de INÉS, no del francés Eduardo — o sea que *** Inés era Allasia de soltera ***, tal como decían los índices parroquiales.\n\n*** Y con el padrón entero delante se ve algo que antes no se podía ver: el padre de Luisa no está en la colonia. *** Repasados los tres hogares Alasia y todos sus hijos, no hay ninguna Luisa. Su padre —un varón Alasia con una hija nacida hacia 1884— no vivía allí en junio de 1887; y que la niña se críe con su tía apunta a que había muerto.\n\n*** Eso abre otra explicación para sus hijos mayores, y hay que decirla como hipótesis: *** si Inés es hija suya, el padre de Luisa sería otro hijo suyo — y los candidatos son Bartolomeo, Salvatore Fortunato Antonio y Domenico Carlo, que en 1884 tendrían entre veintiuno y veinticuatro años. En vez de haber muerto de niños en Italia, al menos uno habría llegado a Argentina, se habría casado, habría tenido una hija hacia 1884 y habría muerto joven. Las dos explicaciones siguen en pie; ésta sólo se sostiene si Inés resulta hija suya, y eso lo dice el acta de matrimonio Chartier × Allasia que ya está pedida.\n\n*** Y HAY UN CUARTO ALASIA EN LA COLONIA QUE NADIE HABÍA CONTADO, Y DICE DE DÓNDE ERA. *** Listando los veintiocho Alasia del padrón bajo las siete grafías aparece, solo y en su propia línea, *** «ALASIO ANTONIO, 22 años, soltero, PATRÓN, nacido en ITALIA, CÚNEO» ***. No pertenece a ninguno de los tres hogares conocidos y no consta parentesco con nadie.\n\n*** Es el único Alasia de toda la colonia que declara la provincia italiana. *** Hasta hoy el origen piamontés de esta familia descansaba en el árbol de FamilySearch y en el acta de 1857 de Savigliano; ahora hay un documento argentino, independiente, que ata a un Alasia de esa misma colonia con la provincia de Cuneo — donde está Savigliano desde 1859. Y encaja con el otro dato de provincia que teníamos, el «Italia, Torino» de Teresa Baroni: Savigliano fue de Turín hasta 1859 y de Cuneo después, así que los dos no se contradicen sino que se refuerzan.\n\nY es candidato a uno de sus cuatro hijos sin localizar: nacido hacia 1865 en Italia, habría cruzado de niño, y entre Domenico Carlo (1863) y Nicolás (1872) hay un hueco de nueve años donde caben. Además es *** patrón, como él ***: tiene tierra propia a los veintidós, que es lo que hace un colono cuando establece a un hijo. No está probado — no vive en su casa ni consta parentesco, y podría ser sobrino o primo.\n\n*** Y EL CENSO NACIONAL DE 1895 LO CONFIRMA OTRA VEZ, POR SEPARADO. *** En la misma Colonia Emilia, ocho años después: «BERTINO MAGDALENA, 56 años, VIUDA, italiana, labradora, sabe leer y escribir, POSEE PROPIEDAD RAÍZ, CATORCE HIJOS», y con ella Domingo Juan de 19, Francisco de 17, María de 15 y MARGARITA DE 13. Los cuatro hermanos han envejecido EXACTAMENTE OCHO AÑOS respecto al censo de 1887 —11→19, 9→17, 7→15, 5→13—, que es justo lo que median entre los dos padrones. No es un parecido de nombres: es la misma familia documentada dos veces.\n\nY ese segundo censo añade tres cosas. BENEDETTO HABÍA MUERTO: ella consta VIUDA en 1895 y él estaba vivo y era cabeza de familia en 1887, así que murió entre esas dos fechas — el árbol decía 1892 y cae dentro. Ella tiene 56, o sea NACIDA HACIA 1839, la fecha exacta del árbol. Y no era una jornalera: TENÍA TIERRA PROPIA Y SABÍA LEER, siendo mujer, viuda e inmigrante, en 1895.\n\nSEIS COSAS ENCAJAN A LA VEZ. El padre se llama BENEDETTO, no «Benito» castellanizado. Tiene sesenta y cinco años, o sea que nació hacia 1822 — la fecha exacta del árbol. La madre nació hacia 1840; el árbol decía 1839. Hay una Margarita de cinco años nacida en Santa Fe, y el acta de Vera de 1900 le da diecinueve y la hace «natural de Col. Emilia». Y ahí están, en la misma casa, *** LOS DOS TESTIGOS DE SU BODA ***: «Don DOMINGO ALASIA y Doña MARÍA DE ALASIA» del acta son DOMINGO, su hermano mayor, y MARÍA MOLINA, la mujer de Domingo. Trece años después firmaron la boda de la hermana pequeña.\n\nY CAE LA ÚNICA OBJECIÓN SERIA QUE QUEDABA. Se decía que la cronología era justa: una madre de cuarenta y dos años al nacer Margarita, veinticuatro después de casarse. No era justa: *** TUVO CATORCE HIJOS ***, y Margarita fue la duodécima.\n\nNO ESTABAN SOLOS EN LA COLONIA. El mismo padrón de 1887 tiene OTRAS DOS CASAS del apellido en Colonia Emilia: la de ALACIO DOMINGO, de SESENTA Y CUATRO años, con su mujer Luigia y dos hijos ya casados viviendo bajo su techo —Tomaso y Bernardo, con sus mujeres y sus niños—, y la de ALAZIO JUAN, de cuarenta y cinco, con siete hijos. Domingo tiene sesenta y cuatro años y Benedetto sesenta y cinco: dos hombres del mismo apellido y la misma edad en una colonia de mil trescientas almas. Lo más probable es que fueran HERMANOS, y que la emigración fuera en cadena. NO ESTÁ PROBADO —el censo no da filiaciones— y se comprobaría con las defunciones argentinas de los dos o con los libros de la parroquia Natividad de la Virgen Niña de Emilia.\n\nSE ENCONTRÓ PORQUE SE DEJÓ DE BUSCAR POR APELLIDO. La búsqueda de «Alasia» en Emilia daba una sola persona y llevaba dos días bloqueando esto. Hubo que bajar el PADRÓN ENTERO del distrito —1.383 personas, 348 apellidos— y comparar por semejanza: en la misma colonia convivían CUATRO GRAFÍAS del apellido, ALASIA, ALASIO, ALACIO y ALAZIO, y la familia estaba escrita OLAZIO y ALAZIO. Ningún buscador por nombre lo habría dado.\n\n*** Y EL 27 DE AGOSTO POR LA TARDE SE ATÓ EL ÚLTIMO CABO. *** Quedaba una pega: la casilla «cuántos años de matrimonio» del censo de 1895 se leía VEINTICINCO, lo que daría una boda hacia 1870 y no en 1857. La lista completa de hijos lo resuelve. La primera, LUCIA, nace en 1859 —dos años después de la boda— y detrás vienen BARTOLOMEO en 1860, SALVATORE en 1861, DOMENICO CARLO en 1863, DOMINGO en 1864 y otra LUCIA en 1866. Con seis hijos anteriores a 1870, una boda en 1870 es imposible. La cifra del censo es un TREINTA Y CINCO mal escrito o mal leído: 1857 más 35 son 1892, el año
